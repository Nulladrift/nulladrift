      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CaseDaleel publishes general information about UAE legal procedures (salary, gratuity, tenancy, cheques, family matters, hiring a lawyer). Use search_faq for questions, list_guides/get_guide for longer preparation guides, and about_casedaleel for what the service is. Always cite the source_url returned with each result. Do not invent article numbers, fees or deadlines; tell users to confirm them with the official authority named in the result. General information, not legal advice. CaseDaleel is not a law firm. For advice on specific facts, or representation in court, the user needs an appropriately licensed advocate or legal consultant.",
      "tools": [
        {
          "name": "about_casedaleel",
          "title": "About CaseDaleel",
          "description": "What CaseDaleel is and is not (not a law firm, no referral commission, no outcome promise), who it is for, when a licensed advocate is needed, how to start, and how to contact it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About CaseDaleel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7998ecdeb6c04c109c60d0825de86acf761ce132d0c774eb1c8341bf089d798"
        },
        {
          "name": "get_guide",
          "title": "Get a CaseDaleel guide",
          "description": "Returns the full text (Markdown) of one published CaseDaleel guide or composite case study, by slug from list_guides, with its canonical URL and dates. Cite the URL when using it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Guide slug, e.g. \"uae-gratuity-calculation-basic-salary\".",
                "pattern": "^[a-z0-9-]{1,120}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
