        {
          "name": "search_faq",
          "title": "Search the CaseDaleel UAE legal FAQ",
          "description": "Keyword search over CaseDaleel's published FAQ about UAE salary and gratuity, rent and eviction, cheques and debt, family matters, hiring a lawyer, and how the platform works. Returns matching questions and answers with the canonical page URL and the official authority to verify against. General information, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Answer language: en (English) or ar (Arabic).",
                "enum": ["en", "ar"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of results.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the user wants to know, in plain words, e.g. \"unpaid salary deadline\" or \"Dubai eviction notice\".",
