        {
          "name": "apercu_entreprise",
          "title": "Aperçu gratuit d'une entreprise française (SIREN)",
          "description": "FREE quick check of a French company by SIREN (10 calls per day): official name, active/closed status, head-office city, and the NUMBER of alerts found (insolvency proceedings, closure, closed head office…), without their detail.\n\nUse it first to triage. If alertes > 0, or before paying or onboarding a supplier, call verifier_entreprise ($0.01 via x402) for the verdict, the sourced signals with links to the official notices, the insolvency history (BODACC) and the VAT number checked in VIES.\n\nOptional `verdict: true` adds the verdict, its summary and the signal list (same computation as verifier_entreprise, without the signed attestation and without links to the official notices), up to 3 per day, with its own quota: the simple preview stays available when it is used up.\n\nFor sole traders, only the trade name is returned, never the person's name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "siren": {
                "description": "SIREN (9 digits, Luhn-valid) or 14-digit SIRET. Spaces, dots and dashes are accepted.",
                "type": "string"
              },
              "verdict": {
                "description": "Free trial with verdict (up to 3 per day): adds verdict, resume and signaux to the preview.",
                "type": "boolean"
              }
            },
            "required": ["siren"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
