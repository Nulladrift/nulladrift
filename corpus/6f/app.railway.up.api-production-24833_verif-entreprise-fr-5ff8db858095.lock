          "digest": "sha256:118e037c3ed48e8e3086e813bff4f3045cd916e4b162c01dce805405230c5f26"
        },
        {
          "name": "surveiller_entreprise",
          "title": "Surveiller une entreprise (alertes BODACC, 90 jours)",
          "description": "Start monitoring ONE French company for 90 days. BODACC is checked every 3 hours; each NEW notice (safeguard, receivership, liquidation, plan, closure, deregistration) published after the start creates an alert. Notices already published are not alerted: use verifier_entreprise for the current state. Same price: a second alert type, \"marche_public\", fires when a NEW public contract is awarded to the company (DECP open data, updated nightly; contracts already published at the start are not alerted, at most 20 contract alerts per check, the rest summarized; contract subject withheld for sole traders). Delivery: if `webhook` (public HTTPS URL) is given, each alert is POSTed as JSON with the header X-Verif-Signature = sha256=HMAC-SHA256(body, jeton). In every case, alerts can be polled at the returned `suivi` URL (free). Keep the returned `jeton`: it signs webhooks and gives access to the alerts. Errors (never charged): an invalid SIREN, a non-public webhook or an unknown company returns an error and is not settled. Payment: $0.10 per company via x402 (USDC on Base). No account or API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "siren": {
                "description": "SIREN (9 digits) or SIRET (14 digits) of the company to monitor.",
                "type": "string"
              },
              "webhook": {
                "description": "Optional public HTTPS URL that receives each alert (signed POST JSON).",
                "type": "string"
              }
            },
            "required": ["siren"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
