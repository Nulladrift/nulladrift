        },
        {
          "name": "verifier_entreprise",
          "title": "Vérifier une entreprise française (SIREN)",
          "description": "Verify a French company (KYB / supplier check) when you already have its 9-digit SIREN. Returns legal identity (with the intra-EU VAT number and whether VIES reports it active), active/closed status, age, headcount band, establishments, revenue and net income when the company publishes its accounts (entreprise.finances), the current insolvency-procedure state parsed from BODACC notices (safeguard, receivership, liquidation, plans, closures), RGE/Qualiopi labels, a verdict (favorable | vigilance | defavorable | indetermine) justified by stable signal codes, each with its source and a link to the official notice, and a signed Ed25519 attestation of the whole result (public key at /.well-known/jwks.json). When to use another tool: if you only know the company name, call rechercher_entreprise first to get the SIREN. This tool only says whether the company holds an RGE label; for the detailed RGE certifications of one establishment (domains, certifying body, validity dates), call qualifications_rge with its SIRET (entreprise.siege.siret in this result). Optional `nom`: checks whether a name matches the official one (exacte | partielle | aucune) without ever returning the official name — useful for sole traders, whose names are never disclosed. Errors (never charged): an invalid SIREN (wrong length or Luhn key) is rejected before any payment request; an unknown or non-public company returns an error after the payment is verified but before it is settled; if BODACC is unreachable the verdict is `indetermine` with confidence `partielle`. Payment: $0.01 per call via x402 (USDC on Base). No account or API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "nom": {
                "description": "Optional name to check against the official name (2 to 100 characters).",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "siren": {
                "description": "9-digit SIREN of the company (Luhn-valid); a 14-digit SIRET is also accepted. Spaces, dots and dashes are accepted.",
                "type": "string"
              }
            },
            "required": ["siren"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
