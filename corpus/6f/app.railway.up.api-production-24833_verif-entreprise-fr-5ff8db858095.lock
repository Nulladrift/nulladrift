        },
        {
          "name": "qualifications_rge",
          "title": "Qualifications RGE d'un établissement (SIRET)",
          "description": "List the RGE (Reconnu Garant de l'Environnement) energy-renovation certifications of ONE French establishment, identified by its 14-digit SIRET, from the official ADEME list. Use it to check a contractor before work eligible for French renovation subsidies (MaPrimeRénov', CEE): each qualification comes with its domains, certifying body, start and end dates, and whether it is valid today; `rge.qualifie` is true when at least one is currently valid. When to use another tool: verifier_entreprise works on the whole company (SIREN) and only says whether an RGE label exists. Get the SIRET from rechercher_entreprise (siret) or verifier_entreprise (entreprise.siege.siret). Errors (never charged): an invalid SIRET is rejected before any payment request; an unknown or non-public establishment returns an error and is not settled. An establishment without any RGE certification returns `qualifie: false` and an empty list (this is a valid, charged answer). Payment: $0.01 per call via x402 (USDC on Base). No account or API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "siret": {
                "description": "14-digit SIRET of the establishment. Spaces, dots and dashes are accepted.",
                "type": "string"
              }
            },
            "required": ["siret"],
            "type": "object"
          },
          "annotations": {
