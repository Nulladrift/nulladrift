        {
          "name": "rechercher_entreprise",
          "title": "Trouver le SIREN d'une entreprise par son nom",
          "description": "Find a French company's SIREN when you only know its name (3 to 100 characters). Narrow the results with `code_postal` (5-digit postcode, e.g. 69003) or `commune` (5-character INSEE commune code, e.g. 69383 — not a city name); both can be combined. Returns at most 10 matches with siren, siret of the establishment matching the location filter (otherwise the head office), name, status, NAF code, city, postcode and creation date. `plusDeResultats: true` means more companies match: refine the query. No personal data: sole traders appear under their trade name only. Next step: call verifier_entreprise with the SIREN for a full check, or qualifications_rge with the SIRET for RGE certifications. Errors (never charged): a query shorter than 3 characters or a malformed filter is rejected before any payment request. Payment: $0.002 per call via x402 (USDC on Base). No account or API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "code_postal": {
                "description": "Optional 5-digit French postcode, e.g. 69003.",
                "pattern": "^\\d{5}$",
                "type": "string"
              },
              "commune": {
                "description": "Optional INSEE commune code (5 characters, e.g. 69383 or 2A004), not a city name.",
                "pattern": "^\\d[\\dAB]\\d{3}$",
                "type": "string"
              },
              "q": {
                "description": "Company name or part of it (3 to 100 characters).",
                "maxLength": 100,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Trouver le SIREN d'une entreprise par son nom"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
