{
  "lockfileVersion": 2,
  "subjects": {
    "com.1211holding/merch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://1211holding.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "1211",
        "title": "1211 - your picture on a shirt",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "1211 prints a person's picture on a shirt, hoodie, sweatshirt, polo, quarter-zip, cap, trucker hat, tumbler or tote, one at a time, and ships it free to US addresses. create_design returns the page where the person sees the item, picks sizes and pays; payment happens only on that page. list_items has the colours, sizes and prices; front \"center\" gives a big centered front on shirts and hoodies; report_problem files a problem for a person to read. Printing requires that the person owns the art or has permission to print it, and shipping is to US addresses only.",
      "tools": [
        {
          "name": "check_art",
          "title": "Check a picture and upload it",
          "description": "Fetches a picture from a public link, or takes an attached file, stores it for a design and reports its size in pixels and how big it prints well. PNG, JPG, WEBP, GIF, HEIC, PDF or SVG, up to 25 MB. Pictures that are never ordered are deleted after 30 days.",
          "inputSchema": {
            "properties": {
              "file": {
                "description": "A file the person attached in the conversation, as an object with file_id and/or download_url.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "image_url": {
                "description": "A public http(s) link to the picture.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check a picture and upload it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["file"]
          },
          "digest": "sha256:07b6954d67363ecfc7c964a574d75068972941fc0381c40a762185299476e59e"
        },
        {
          "name": "create_design",
          "title": "Put a picture on an item and get the link to buy it",
          "description": "Puts a picture (a public link, an upload id, an attached file or SVG markup) on an item and colour and returns the page where the person sees it, picks sizes and pays, with a picture of the result, how big each side prints, the price including US shipping, and any problems. With no picture, it returns the page where the person adds their own picture to the item. A shirt's front prints small on the left chest or big and centered; backs print large. No payment passes through this tool: the person pays on the returned page. Printing requires that the person owns the art or has permission to print it. Limit: 30 designs per address per hour.",
          "inputSchema": {
            "properties": {
              "back_image_url": {
                "description": "A different picture for the back.",
                "type": "string"
              },
              "color": {
                "description": "One of the item's colours; left out, its default.",
                "type": "string"
              },
              "dev": {
                "description": "A developer's id, used with markup_usd.",
                "type": "string"
              },
              "file": {
                "description": "A file the person attached in the conversation, as an object with file_id and/or download_url.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "front": {
                "description": "chest: small on the left chest (default). center: big and centered, on T-shirts, sweatshirts and hoodies.",
                "enum": ["chest", "center"],
                "type": "string"
              },
              "image_url": {
                "description": "A public http(s) link to the picture.",
                "type": "string"
              },
              "item": {
                "description": "The item to print on.",
                "enum": ["tee", "hoodie", "crewneck", "tee-classic", "polo", "quarter-zip", "cap", "trucker", "tumbler", "tote"],
                "type": "string"
              },
              "markup_usd": {
                "description": "Dollars a developer adds to each item; the buyer sees the full price.",
                "type": "number"
              },
              "ref": {
                "description": "The name of the assistant or app, such as \"claude\".",
                "type": "string"
              },
              "side": {
                "description": "Where it prints (default front).",
                "enum": ["front", "back", "both"],
                "type": "string"
              },
              "size": {
                "description": "A size to start with on the page, such as \"L\".",
                "type": "string"
              },
              "svg": {
                "description": "SVG markup (lettering or simple shapes) with a viewBox; scripts and linked files are removed. Fonts available: Lato, DejaVu Sans, DejaVu Serif, Liberation Sans, Liberation Serif, Nimbus Sans, URW Gothic, URW Bookman, C059, P052, Z003, Noto Color Emoji.",
                "type": "string"
              },
              "title": {
                "description": "A name for the design (80 characters).",
                "type": "string"
              },
              "upload": {
                "description": "An upload id, instead of image_url.",
                "type": "string"
              }
            },
            "required": ["item"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Put a picture on an item and get the link to buy it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["file"]
          },
          "digest": "sha256:e107182057fb6f25a83892308fd8a2b283055b1d5e747d486373c6ce4131a508"
        },
        {
          "name": "get_design",
          "title": "Read a design again",
          "description": "A saved design: its page link, pictures, print sizes and price.",
          "inputSchema": {
            "properties": {
              "design": {
                "description": "The design id.",
                "type": "string"
              }
            },
            "required": ["design"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a design again"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47f3e3782beb7dd4ec7c4dc424f63408ec34fffe12bd513eefe3366dbefc1ac2"
        },
        {
          "name": "list_items",
          "title": "What 1211 prints on, with prices",
          "description": "Everything 1211 prints on: each item's colours, sizes, print sizes, the pixels a picture needs to print well, and its price including US shipping.",
          "inputSchema": {
            "properties": {
              "item": {
                "description": "Optional: one item (for example \"hoodie\") to get just that one.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What 1211 prints on, with prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b44e47db3d89debb2ef95b802b6a6ba69adcb7a6fe3c206dcd8f9fac25e76055"
        },
        {
          "name": "report_problem",
          "title": "Tell 1211 something is wrong",
          "description": "Stores a report about something wrong with 1211's results (a picture refused that should have printed, a wrong price, a picture of the result that does not match, a link that does not open, a failed checkout, or a missing item) with the design it concerns and a short description. A person reads every report. Limit: 20 per address per hour.",
          "inputSchema": {
            "properties": {
              "design": {
                "description": "The design id, when it is about one design.",
                "type": "string"
              },
              "detail": {
                "description": "What was wrong, in a sentence or two.",
                "type": "string"
              },
              "kind": {
                "enum": ["art_wrongly_refused", "wrong_price", "wrong_mockup", "broken_link", "checkout_failed", "missing_item", "other"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Tell 1211 something is wrong"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9940d30446d9d4e25da0c58099f2b0846b70e0629634aed26757954d97d94533"
        }
      ],
      "digest": "sha256:4f5b5632b30c72c6f35d4418ea151b35c2f117e090e535dcd150b01639b10380"
    }
  }
