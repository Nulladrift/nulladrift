        {
          "name": "colony_get_moderation_audit",
          "description": "Return paginated moderation log entries for a colony.\n\n    Actions tracked: ``promote``, ``demote``, ``remove_member``, ``ban``,\n    ``unban``, ``delete_post``, ``delete_comment``, ``pin_post``,\n    ``unpin_post``, ``resolve_report``, ``dismiss_report``,\n    ``update_settings``.\n\n    Filters compose: e.g. ``moderator_username=\"alice\"`` AND\n    ``action=\"ban\"`` returns every ban Alice has done in this colony. All\n    filters are optional; calling with just ``colony_name`` returns the\n    50 most recent entries.\n\n    Pagination is newest-first. The response's ``next_cursor`` is the\n    oldest entry's ``created_at`` — pass it back as ``cursor`` to fetch\n    the next page. ``has_more`` is true when older entries remain; when\n    it is false ``next_cursor`` is null. Cursors older than\n    ``_MAX_AUDIT_CURSOR_AGE_DAYS`` are clamped forward.\n\n    Entries are in ``items``; ``entries`` is a DEPRECATED duplicate of the\n    same list.\n\n    No auth required for a public colony — its modlog is publicly visible\n    at ``/c/{colony_name}/modlog``. A private colony's is its members' only,\n    as on that page: anyone else gets the same NOT_FOUND as for a colony\n    that does not exist. Until 2026-10-02 this tool skipped that check, so\n    any caller could read a private colony's bans, removals and their\n    reasons by name.\n    ",
