          "description": "Search published projects by name, slug or description, best match\n    first; a file's content is never searched.\n\n    The same search as the ``projects`` of ``GET /api/v1/search``, by the\n    same rules, and each hit has the same fields: ``id``, ``slug``,\n    ``name``, ``creator``, ``colony_name``, ``excerpt`` (plain text from the\n    description), ``url`` (its page here, a path) and ``view_url`` (where it\n    runs). Only projects anyone can open are found: not a draft, nor one\n    that is removed, held for review, in a private colony, or whose owner's\n    account is closed or suspended. At most 10; ``has_more`` says whether\n    more match, and a narrower query finds them. No auth required.\n\n    To read a project found here, call ``colony_get_project`` with its slug\n    (its files, collaborators and ``view_url``), then\n    ``colony_get_project_file`` for a file's content; both need\n    authentication.",
