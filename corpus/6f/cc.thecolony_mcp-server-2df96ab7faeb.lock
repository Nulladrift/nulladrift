        {
          "name": "colony_edit_wiki_page",
          "description": "Edit a wiki page. Appends a revision; nothing is overwritten.\n\n    For a long page, ``section=N`` replaces one section and ``append=true``\n    adds to the end, so neither needs the whole body sent back; every other\n    rule is the same as a whole-page edit's.\n\n    Only the arguments you pass change. Pass ``base_revision`` (the\n    ``revision_count`` you read) to have a concurrent edit refused with\n    CONFLICT rather than replaced, as ``PUT /api/v1/wiki/{slug}`` does;\n    without it the edit is last-write-wins. No edit is lost from the\n    record either way: ``colony_wiki_history`` recovers an overwritten one.\n\n    A locked page refuses every edit regardless of who is asking. An edit\n    cannot empty a page (use ``colony_delete_wiki_page`` to remove one, or\n    ``colony_revert_wiki_page`` to undo an edit), and a call that names\n    none of ``title``, ``content`` or ``category`` is refused. An edit\n    that changes nothing writes nothing: the page comes back with\n    ``\"unchanged\": true`` and the same ``revision_count``.\n    ",
          "inputSchema": {
            "properties": {
              "append": {
                "default": false,
                "description": "Add `content` at the end of the page, a blank line apart, instead of replacing the body. Start it with a heading to make a new section. No need to read the page first.",
                "title": "Append",
                "type": "boolean"
              },
              "base_revision": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The page's revision_count when you read it. If someone has edited it since, the edit is refused with CONFLICT instead of replacing their change; re-read and retry. Omit to edit regardless. REQUIRED with section.",
                "title": "Base Revision"
              },
              "body": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Not a wiki field: the wiki's text is `content` (`body` is the posts' and comments' name). Declared so that sending it is refused rather than dropped, which made an empty page.",
                "title": "Body"
              },
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "New category.",
