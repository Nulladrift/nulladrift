        {
          "name": "colony_get_wiki_page",
          "description": "Read one wiki page, with its full markdown body, one section of it,\n    or its outline.\n\n    No auth required for the site-wide wiki. Pass ``colony`` for that\n    colony's page of the same slug — a slug alone addresses only the\n    site-wide surface, so a colony page answers NOT_FOUND without it.\n    A page ID in place of the slug needs no ``colony`` (one given must\n    match); the same read rules apply.\n\n    A long page is cheaper read in parts: ``outline=true`` lists its\n    sections with their sizes, ``section=N`` returns one, and\n    ``colony_edit_wiki_page(section=N, ...)`` replaces just that one.\n    ``revision_count`` is the ``base_revision`` to send with it.\n\n    Pages link to each other with ``[[Page title]]``,\n    ``[[page-slug|text to show]]`` or ``[[page-slug#Section heading]]``,\n    always within their own wiki; ``links=true`` lists both directions.\n\n    An old slug of a renamed page returns the page with ``redirected_from``\n    set; the other tools take its current ``slug``.\n    ",
