{
  "lockfileVersion": 2,
  "subjects": {
    "ai.mcpjunction/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpjunction.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mcpjunction",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Queryable index of the mcpjunction.ai MCP server directory. Use search_servers to find servers, get_server for one entry, list_categories and list_topics to browse. Categories are a curated single-assignment taxonomy; topics are owner-assigned GitHub tags, many per server. Data refreshes nightly. Attribution: via mcpjunction.ai.",
      "tools": [
        {
          "name": "get_dataset_info",
          "description": "Dataset metadata: entry counts, generation timestamp, source, and licensing terms for bulk or training use.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:487b61adcc63910ff43501e349fe0f38e3a945d921ce94149c8631e6cde06c34"
        },
        {
          "name": "get_server",
          "description": "Get the full directory entry for one MCP server by id ('owner--repo', e.g. 'microsoft--playwright-mcp'). Includes install hint, license, stars, category, and editorial fields. Any install_hint is a best-effort guess from the repository language, not a verified command: relay the install_hint_caveat with it rather than presenting it as ready to run.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Server id in owner--repo form",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b46696ea0cc5a0bdea5d5025f019818099eb34778ac6344c62de393a54205e8"
        },
        {
          "name": "list_categories",
          "description": "List all directory categories with slugs, names, and active-server counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7169b8e83fc5416b4fef27f62d6729645f3d5d0ad143d5e413c93efdf5160f97"
        },
        {
          "name": "list_topics",
          "description": "List the curated GitHub topics that have a directory page, with active-server counts. Topics are assigned by repository owners and imported verbatim, so the full dataset carries thousands of them; this returns only the curated subset. search_servers accepts any topic string, curated or not.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:17e126fddba5b37fb6865078cb29158321f399a8b158c629c8e5250e873fec41"
        },
        {
          "name": "search_servers",
          "description": "Search the MCP server directory by keyword and/or filters. Keyword matches name, description, and GitHub topics. Returns active servers sorted by relevance then stars. Supply at least one of query, category, or topic — with no query, filters alone enumerate a whole category or topic by stars. Data refreshes nightly from the public GitHub API. Any install_hint is a best-effort guess from the repository language, not a verified command: relay the install_hint_caveat with it rather than presenting it as ready to run.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category slug filter, e.g. 'databases' (see list_categories)",
                "type": "string"
              },
              "language": {
                "description": "Optional implementation language filter, e.g. 'Python'",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords, e.g. 'postgres', 'browser automation'. Optional if category or topic is given.",
                "type": "string"
              },
              "topic": {
                "description": "Optional GitHub topic filter, exact match, e.g. 'kubernetes'. Any topic string works, not only the curated ones from list_topics.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6eb0aaf18f7c0c321bb86a68027ac14d0164d4d7af205b2ca30cb038f5338447"
        }
      ],
      "digest": "sha256:5a36a54ca766f84f4b66aba8c097d85c6d0e0c44b7c73e6e1e672b1bdaf907f5"
    }
  }
}
