{
  "lockfileVersion": 2,
  "subjects": {
    "com.airaptr/raptr-agent-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.airaptr.com/finder/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agent-finder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find free, ready-made AI agents for a task in the open agent registry: find_agents, then get_agent_code for the best match, then use_agent_here to run it in this chat on the user's own data. Nothing to install.",
      "tools": [
        {
          "name": "find_agents",
          "title": "Find existing agents",
          "description": "Searches the open agent registry (about 1,700 single-file agents) for agents that already do what the user wants, for example when they ask 'is there an AI tool for...' or want a ready-made automation instead of building one. Use it before building from scratch, or when the user asks whether an agent exists for a task.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many results, default 5",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Plain words describing the task, e.g. 'summarize sales calls'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1d5e290e9157766f1da1f7c7863aef1c3a05cc5b3c4bde16b5276e6403cbb40c"
        },
        {
          "name": "get_agent_code",
          "title": "Get an agent's code",
          "description": "Returns the full source of one agent from the registry, by its name (e.g. @bill/neuron_agent), so it can be read or adapted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Registry name, e.g. @kody/memory_agent",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f9267fe7b5f435a98a7c5b8069595b77f70b58c0b2fbd0bd6dc461d379f9e02"
        },
        {
          "name": "how_to_run_agent",
          "title": "Keep an agent running on your computer",
          "description": "Optional, for later: how to keep an agent running on the user's own computer with the free Brainstem. Only offer this after the user has used the agent in the chat and wants to keep it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "The agent file name, if known",
                "type": "string"
              },
              "os": {
                "description": "The user's operating system",
                "enum": ["mac", "windows", "linux"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fde8ee112fde5c58bed4c10609489352bbc5b8eba7947915060d11f87c787e5e"
        },
        {
          "name": "request_service",
          "title": "Ask us to build something",
          "description": "Use when the person wants something none of these tools can do and says yes to passing the request on. Records only the request text they agree to send (no name or contact). Ask before calling it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "request": {
                "description": "What they want, in a sentence, as they agreed to send it",
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a38ff77e8ec3cc7544d83683bb90d1918c09a320529b8c63330eb558dcd6db15"
        },
        {
          "name": "use_agent_here",
          "title": "Use the agent in this chat",
          "description": "Use this right after an agent passes check_agent, or whenever the user wants to try an agent. Returns a short Python runner so you can run the agent in this chat with your own Python tool on the user's own data (pasted text, an uploaded spreadsheet, a list). Nothing to install. If Python is unavailable, apply the agent's logic yourself by reading its code. Ask the user for their real data, run the agent, and show the result in plain words.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "The agent file name, e.g. invoice_triage_agent.py",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d8720380671f5fd7b3f2c7a3213752782d6a7f8a280f32193acaa459a238c44d"
        }
      ],
      "digest": "sha256:9eac274f6191e5f53537ea41924fd0965bdd7c4d717cbca41d10be548a8ce1c6"
    }
  }
}
