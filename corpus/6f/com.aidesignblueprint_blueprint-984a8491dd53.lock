        {
          "name": "signals.report",
          "title": "Report Value Event",
          "description": "Records a value moment (e.g. review_confidence, runtime_risk_found, workflow_clarity) after a successful validate run on any lens (architect.validate, design.validate, or spec.validate) or a doctrine session. Each event stores event_type, surface_used (mcp or the site section), perceived_value (1-5), and an optional short free-text note, brief_context (up to 500 characters). WHEN TO CALL: after architect.validate, design.validate, or spec.validate returns a clearly useful result AND the user has acknowledged the value (or you ask them \"would you rate this 1-5?\"). Each validator's response carries an explicit next_step instruction telling the agent to OFFER this call; surface that offer to the user. WHEN NOT TO CALL: silently or without the user's awareness; on every validate (only after a clear value moment); to capture intent or speculative value. If the user declines, do not retry within the same session. BEHAVIOR: write-only, single insert into ValueEvent. Auth: sign-in required, with an active Pro, Pro Plus, Teams, Enterprise, beta, or trial plan. Data at rest in the UK. Do NOT include proprietary code, prompt content, or PII in brief_context: it is stored as written, surfaces in admin AI-visibility dashboards, and may appear, pseudonymised, in our weekly lead-intelligence extract to OpenAI (US). Expect a 1-line acknowledgment in the response; the feedback is then aggregated server-side.",
          "inputSchema": {
            "properties": {
              "brief_context": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "1–2 plain-English sentences summarising what was helpful. Example: 'Validation identified a missing approval gate before email send.' No code snippets, no proprietary content, no user PII. Max 500 chars.",
                "title": "Brief Context"
              },
              "event_type": {
                "description": "Pick the type that best matches what just happened: 'review_confidence': a validator lens (architect.validate / design.validate / spec.validate) returned aligned; 'runtime_risk_found': a validate run found violations; 'workflow_clarity': principles/examples clarified a design decision; 'agent_setup_success': user successfully wired up an agent or MCP tool; 'onboarding_helped': user understood how to start using the Blueprint; 'research_time_saved': user found relevant doctrine faster than expected; 'team_alignment': Blueprint helped align a team on agentic design; 'other': use only if none of the above fit.",
                "enum": ["workflow_clarity", "runtime_risk_found", "agent_setup_success", "onboarding_helped", "review_confidence", "research_time_saved", "team_alignment", "other"],
                "title": "Event Type",
                "type": "string"
