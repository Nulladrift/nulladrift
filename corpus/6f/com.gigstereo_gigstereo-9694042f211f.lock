{
  "lockfileVersion": 2,
  "subjects": {
    "com.gigstereo/gigstereo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gigstereo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gigstereo",
        "title": "Gigstereo",
        "version": "1.0.0",
        "websiteUrl": "https://gigstereo.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Gigstereo is a Colombian marketplace for event services (DJs, mariachis, photographers, bands, decorators, catering…). Typical flow: search_providers or get_price_guide to answer \"who can I hire / how much does it cost\" in a Colombian city, then request_quotes to send the user's event to matching providers for free once the user agrees. Content is in Spanish and prices are in Colombian pesos (COP). Link the user to the Gigstereo pages the tools return.",
      "tools": [
        {
          "name": "get_price_guide",
          "title": "Get reference prices",
          "description": "Reference prices Gigstereo publishes for a service in a city, each with its source and the date it was checked, plus the city page (cityPageUrl) that shows them. The only reliable source of price figures here: never invent prices. Cite cityPageUrl when you quote them. Final prices are quoted by each provider.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Service, e.g. mariachi, DJ, fotógrafo, banda en vivo.",
                "type": "string"
              },
              "city": {
                "description": "City in Colombia, e.g. Bogotá.",
                "type": "string"
              }
            },
            "required": ["category", "city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get reference prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc4797251c83a3759edc7d7ac99d665d3d738c1a7c47a8d102f94a348c2979ef"
        },
        {
          "name": "get_provider",
          "title": "Get a provider profile",
          "description": "Public profile of one provider by its slug (the last part of its profileUrl): description, city, service radius, price range and rating when the profile is owner-verified.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Profile slug, e.g. mariachi-los-de-medellin, or the full profileUrl.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a provider profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02dd6f388e943defaa14bdb09f261fc0ffeee1dcb10448549fd26792b15276ce"
        },
        {
          "name": "list_categories",
          "title": "List services and cities",
          "description": "Gigstereo's service categories (Spanish names with their slugs) and the Colombian cities that have a city page. Optional: search_providers and request_quotes also understand plain service names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List services and cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db7edee94f7faff031931c180c291a24dd9e22f7b183f3e2a41f005b7b966856"
        },
        {
          "name": "request_quotes",
          "title": "Request quotes for an event",
          "description": "Send the user's event request to matching providers on Gigstereo, for free: the providers who are interested contact the user directly by WhatsApp or email with their price. It is not a booking and costs nothing. Before calling: (1) collect the details from the user — never invent a name, phone or email; (2) show them a summary and tell them that Gigstereo will share their name and contact details with the matching providers, under the privacy policy https://gigstereo.com/privacy and the terms https://gigstereo.com/terms; (3) call only after they explicitly say yes, with userConsent=true. With targetProviderSlug the request goes to that provider; without it, to the providers of the city.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "The user's budget in their words, e.g. hasta 800.000 COP.",
                "type": "string"
              },
              "category": {
                "description": "Service wanted (e.g. mariachi, DJ, fotógrafo) or a slug from list_categories. Required unless targetProviderSlug is given.",
                "type": "string"
              },
              "city": {
                "description": "City of the event in Colombia.",
                "type": "string"
              },
              "details": {
                "description": "What the user needs, 1-4 sentences (10-1500 characters). Spanish preferred: providers read it.",
                "type": "string"
              },
              "durationOrSongs": {
                "description": "Duration or number of songs, e.g. 1 hora or 10 canciones.",
                "type": "string"
              },
              "email": {
                "description": "The user's email. Phone or email is required.",
                "type": "string"
              },
              "eventDate": {
                "description": "Event date, YYYY-MM-DD. Not in the past.",
                "type": "string"
              },
              "eventTime": {
                "description": "Approximate time, e.g. 8:00 p. m.",
                "type": "string"
              },
              "eventType": {
                "description": "Kind of event: boda (wedding), quinceañera, cumpleaños (birthday), serenata, corporativo…",
                "type": "string"
              },
              "guestCount": {
                "description": "Approximate number of guests.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "The user's name.",
                "type": "string"
              },
              "neighborhood": {
                "description": "Neighborhood or venue.",
                "type": "string"
              },
              "phone": {
                "description": "The user's Colombian mobile/WhatsApp number (10 digits, e.g. 3001234567). Phone or email is required.",
                "type": "string"
              },
              "targetProviderSlug": {
                "description": "Slug of the provider the user chose, if they chose one.",
                "type": "string"
              },
              "userConsent": {
                "description": "true only if the user saw the summary and the data-sharing notice above and explicitly agreed to send it.",
                "type": "boolean"
              }
            },
            "required": ["city", "details", "eventDate", "eventType", "name", "userConsent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request quotes for an event"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b53af27c64a8c396d60d898b2761bcada43555488bb1f9180e5537a8082238f0"
        },
        {
          "name": "search_providers",
          "title": "Search event providers",
          "description": "Search Gigstereo's marketplace of event providers in Colombia (DJs, mariachis, photographers, videographers, bands, decorators, catering…) by city and, optionally, service or name. Owner-verified profiles show a price range and reviews; unclaimed directory listings show neither. Link the user to each profileUrl. Content is in Spanish; prices are in Colombian pesos (COP).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Service wanted, in Spanish or English (e.g. mariachi, DJ, fotógrafo de bodas, wedding photographer) or a category slug from list_categories.",
                "type": "string"
              },
              "city": {
                "description": "City in Colombia, e.g. Medellín, Bogotá, Cali, Barranquilla.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results (1-10, default 6).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional free text matched against provider names and descriptions.",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search event providers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0e18c77f4d2ba65a0fa9626d4f1eae65dc932ee3d8b4c6e3231666e3a9b76b4"
        }
      ],
      "digest": "sha256:c5d814da0843b4c384c56328e82ccb1ba91e2350d5e3eee1d831ddc573ce3b45"
    }
  }
}
