        },
        {
          "name": "get_inverter_datasheet",
          "title": "Get inverter datasheet data",
          "description": "Returns manufacturer datasheet data for an inverter from the Synergrid C10/26 list: maximum DC voltage, MPPT count and range, current limits per MPPT, start voltage, maximum PV power, battery capability, optimizer architecture, links to the datasheet and installation manual, the product photo URL, source URL and page per value, status (verified = stated in the datasheet, secondary = unconfirmed) and the date last verified. These are manufacturer statements and are NOT part of the Synergrid approval; use check_inverter_c10_26 for the approval status. Look up by Synergrid reference (GLV…) or by brand and model.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Brand, e.g. Huawei. Use together with model.",
                "type": "string"
              },
              "locale": {
                "description": "Language of source titles and links (nl, fr, de, en). Defaults to the server setting.",
                "enum": ["nl", "fr", "de", "en"],
                "type": "string"
              },
              "model": {
                "description": "Model designation, e.g. SUN2000-5KTL-M1. Use together with brand.",
                "type": "string"
              },
              "reference": {
                "description": "Synergrid reference, e.g. GLV073-06-0020. Alternative to brand and model.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "datasheet": {
                "additionalProperties": {},
                "properties": {},
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["title", "url"],
                "type": "object"
              }
            },
            "required": ["datasheet", "note", "source"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
