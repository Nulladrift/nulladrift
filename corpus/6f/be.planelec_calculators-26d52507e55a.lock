        {
          "name": "size_cable_arei",
          "title": "Size a cable per AREI/RGIE",
          "description": "Calculates the required copper or aluminium cable cross-section for a residential circuit under the Belgian AREI/RGIE: design current, voltage drop per cross-section, protection check against the breaker rating and the recommended cross-section. Provide the load (A, W, kW or kVA), one-way cable length in metres, the network (1x230V, 3x230V, 3x400V) and the breaker rating; other fields use the defaults for a typical socket circuit. The response includes a shareable link that opens the same calculation on planelec.be.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "breakerAmps": {
                "description": "Circuit-breaker rating in A. Default: 16.",
                "exclusiveMinimum": 0,
                "type": "number"
