            "taskSupport": "forbidden"
          },
          "digest": "sha256:381ae703d94addaada3de35cc642d14ba6010aec56fda6fc11193742a4ba9fa2"
        },
        {
          "name": "get_regelwerk_article",
          "title": "Read an AREI/RGIE article",
          "description": "Returns the text of one article of Book 1 of the Belgian AREI/RGIE by its number (for example 4.2.4.3 or \"AREI 7.1.4.3\"), in the language of the text (Dutch, French or German; English uses the German text), with the edition, change notices of amending decrees, the titles of its sub-articles and a link to the article in the PlanElec reader. Cite the article number and edition when you pass the content on. Use search_regelwerk to find the number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "article": {
                "description": "Article number such as 4.2.4.3; a prefix such as \"AREI\" or \"RGIE\" is accepted.",
                "type": "string"
              },
              "locale": {
                "description": "Language of source titles and links (nl, fr, de, en). Defaults to the server setting.",
                "enum": ["nl", "fr", "de", "en"],
                "type": "string"
              },
              "version": {
                "description": "Optional edition, e.g. v06 or v07. Default: the edition in force today (v06 until 31/10/2026, v07 from 01/11/2026).",
                "pattern": "^v\\d{2}$",
                "type": "string"
              }
            },
            "required": ["article"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "article": {
                "type": "string"
              },
              "changes": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "provision": {
                      "type": "string"
                    },
                    "scope": {
                      "type": "string"
                    },
                    "version": {
                      "type": "string"
                    }
                  },
                  "required": ["provision", "scope", "version"],
                  "type": "object"
                },
                "type": "array"
              },
              "edition": {
                "additionalProperties": {},
                "properties": {
                  "applicableFrom": {
                    "type": "string"
                  },
                  "applicableUntil": {
                    "type": "string"
                  },
                  "language": {
                    "enum": ["nl", "fr", "de"],
                    "type": "string"
                  },
                  "officialTranslationPending": {
                    "type": "boolean"
                  },
                  "phase": {
                    "type": "string"
                  },
                  "sourceVersion": {
                    "type": "string"
                  },
                  "version": {
                    "type": "string"
                  }
                },
                "required": ["applicableFrom", "language", "officialTranslationPending", "phase", "sourceVersion", "version"],
                "type": "object"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["title", "url"],
                "type": "object"
              },
              "subArticles": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "article": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["article", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
