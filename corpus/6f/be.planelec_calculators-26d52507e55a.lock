        {
          "name": "search_regelwerk",
          "title": "Search the Belgian AREI/RGIE regulations",
          "description": "Searches Book 1 of the Belgian AREI/RGIE (Royal Decree on electrical installations) in the language of the text: Dutch, French or German; English uses the German text. Returns up to ten articles with number, title, an excerpt, the edition in force today and a link to the article in the PlanElec reader; the full article text is not returned, use get_regelwerk_article for it. Search by keywords or by article number such as 4.2.4.3. Results are planning aids, not an official inspection.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Maximum number of articles, 1–10. Default: 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of source titles and links (nl, fr, de, en). Defaults to the server setting.",
                "enum": ["nl", "fr", "de", "en"],
                "type": "string"
              },
              "query": {
                "description": "Keywords or an article number such as 5.2.2.1 or 4.2.4.3, 2–120 characters.",
                "type": "string"
              },
              "version": {
                "description": "Optional edition, e.g. v06 or v07. Default: the edition in force today (v06 until 31/10/2026, v07 from 01/11/2026).",
                "pattern": "^v\\d{2}$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
