      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "planelec",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "PlanElec is a web application for planning residential electrical installations under the Belgian AREI/RGIE. This public endpoint offers the free calculators, help and the AREI/RGIE regulations (search_regelwerk, get_regelwerk_article) without an account. Saved projects and planning changes need PlanElec Pro on https://planelec.be/mcp. Cite the \"source\" of a result when you pass its content on. Results are planning aids, not an official inspection (keuring).",
      "tools": [
        {
          "name": "calculate_led_strip",
          "title": "Calculate an LED strip: current, power supply, feed points",
          "description": "Calculates power, current (total and per channel), required feed points, power-supply size and the extra-low-voltage feed cable for an analogue LED strip (5/12/24/48 V DC; single colour, CCT, RGB, RGBW, RGB+CCT). Provide the strip length in metres and either a preset or the datasheet values (voltage, colour channels, watts per metre at full load). Optional: cut unit, maximum length per feed, number of feeds, power-supply reserve, feed-cable length, material and cross-section, and voltage-drop limit. Planning values from datasheet data, not a manufacturer guarantee; current-carrying capacity, heat and AREI/RGIE rules for SELV, bathrooms and outdoor areas are not checked. The response includes a shareable link that opens the calculation on planelec.be.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "colorMode": {
                "description": "Colour channels: mono, cct, rgb, rgbw or rgbcct. Default: mono.",
                "enum": ["mono", "cct", "rgb", "rgbw", "rgbcct"],
                "type": "string"
              },
              "cutUnitMm": {
                "description": "Cut unit in mm; the length is rounded down to it.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "feedCrossSectionMm2": {
                "description": "Planned feed-cable cross-section in mm²; omit for a recommendation only.",
                "enum": [0.5, 0.75, 1, 1.5, 2.5, 4, 6, 10],
                "type": "number"
              },
              "feedLengthM": {
                "description": "One-way feed-cable length from power supply to strip in m. Default: 5.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "feedMaterial": {
                "description": "Feed-cable conductor material. Default: CU.",
                "enum": ["CU", "AL"],
                "type": "string"
              },
              "feeds": {
                "description": "Planned number of feed points; defaults to the minimum.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lengthM": {
                "description": "Strip length in metres.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "locale": {
                "description": "Language of source titles and links (nl, fr, de, en). Defaults to the server setting.",
                "enum": ["nl", "fr", "de", "en"],
                "type": "string"
              },
              "maxFeedDropPercent": {
                "description": "Feed-cable voltage-drop limit in percent (planning assumption). Default: 3.",
                "exclusiveMinimum": 0,
                "maximum": 20,
                "type": "number"
              },
              "maxRunM": {
                "description": "Manufacturer's maximum strip length per feed in m. Default: 5.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "powerPerMeterW": {
                "description": "Power per metre in W with all channels at full brightness. Default: 14.4.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "preset": {
                "description": "Typical strip class as starting values; explicit fields override it.",
                "enum": ["12v_mono_4_8", "24v_mono_9_6", "24v_mono_14_4", "24v_cob_10", "24v_cct_19_2", "24v_rgb_14_4", "24v_rgbw_19_2", "48v_mono_10"],
                "type": "string"
              },
              "psuReservePercent": {
                "description": "Power-supply reserve in percent. Default: 20.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "voltage": {
                "description": "Strip nominal voltage in V DC. Default: 24.",
                "enum": [5, 12, 24, 48],
                "type": "number"
              }
            },
            "required": ["lengthM"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "channels": {
                "type": "number"
              },
              "currentA": {
                "type": "number"
              },
              "feedComparison": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "crossSectionMm2": {
                      "type": "number"
                    }
                  },
                  "required": ["crossSectionMm2"],
                  "type": "object"
                },
                "type": "array"
              },
              "feeds": {
                "type": "number"
              },
              "input": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "nextSteps": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "overallStatus": {
                "enum": ["pass", "warn", "fail"],
                "type": "string"
              },
              "powerW": {
                "type": "number"
              },
              "psuRequiredW": {
                "type": "number"
              },
              "requiredFeeds": {
                "type": "number"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["title", "url"],
                "type": "object"
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["channels", "currentA", "feedComparison", "feeds", "input", "nextSteps", "overallStatus", "powerW", "psuRequiredW", "requiredFeeds", "source", "warnings"],
            "type": "object"
          },
