        {
          "name": "check_inverter_c10_26",
          "title": "Check an inverter against Synergrid C10/26",
          "description": "Checks whether a PV inverter, battery inverter or other power-generating unit (PGU) is on the Synergrid C10/26 list of devices homologated for connection to the Belgian grid. Returns the outcome (found, found_with_limitations, expired, not_found, brand), matching devices with homologation dates, limitations and firmware versions, and homologated alternatives when nothing matches. Where available, each match also carries a separate \"datasheet\" object with manufacturer datasheet values (DC voltage, MPPT data, links, source URLs, status, last verified date); these are NOT checked by Synergrid and are not part of the approval. Search by brand and model, for example \"Huawei SUN2000-10KTL\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "description": "Language of source titles and links (nl, fr, de, en). Defaults to the server setting.",
                "enum": ["nl", "fr", "de", "en"],
                "type": "string"
              },
              "phases": {
                "description": "Optional: 1 or 3 phases, improves alternative suggestions.",
                "enum": [1, 3],
                "type": "number"
              },
              "query": {
                "description": "Brand and/or model, 2–80 characters.",
                "type": "string"
              },
              "smaxVa": {
                "description": "Optional: apparent power in VA, improves alternative suggestions.",
                "type": "number"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "alternatives": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "dataDate": {
                "type": ["string", "null"]
              },
              "matches": {
                "items": {
                  "additionalProperties": {},
                  "properties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "nextSteps": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "officialSource": {
                "additionalProperties": false,
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["title", "url"],
                "type": "object"
              },
              "outcome": {
                "enum": ["found", "found_with_limitations", "expired", "not_found", "brand"],
                "type": "string"
              },
              "source": {
                "additionalProperties": false,
                "properties": {
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["title", "url"],
                "type": "object"
              }
            },
            "required": ["alternatives", "dataDate", "matches", "nextSteps", "officialSource", "outcome", "source"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
