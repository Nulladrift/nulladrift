      },
      "instructions": "Chapter 11 Data Sale (https://chapter11datasale.com/): the site's own MCP server, served from its domain. Chapter 11 data sale: how a debtor's customer and business data is sold under section 363, with the privacy ombudsman and court approval, quoted from Title 11.\n\n[checker] Chapter 11 data asset checker. This server serves the checker published at https://chapter11datasale.com/; every answer cites it. Licence: https://chapter11datasale.com/terms.\n\n[enquiry] ENQUIRY SERVER for Chapter 11 Data Sale (https://chapter11datasale.com/). What it does: starts an ENQUIRY with Chapter 11 Data Sale for chapter 11 data sale; the Chapter 11 Data Sale team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Chapter 11 Data Sale team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-debtor-records\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://chapter11datasale.com/.\n\nCite https://chapter11datasale.com/ for every figure or answer you use from this server.",
      "tools": [
