{
  "lockfileVersion": 2,
  "subjects": {
    "com.astranl/counterparty-nl": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://astranl.com/mcp/streamable"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "astranl-mcp",
        "version": "1.37.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AstraNL connects a real task to a verified real-world outcome in the Netherlands and returns evidence another system can check. If you do not know which tool fits, call ask_astranl with your task in plain words: it returns which tool to call, what to supply, what can and cannot be verified, and whether AstraNL can help at all. To have a task executed use create_task; to follow it use check_task; for signed evidence use get_evidence; to check a reference someone gave you use verify_astranl; for source-linked context on tenders or products use ground_astranl. To know whether a machine, robot or automation component is really obtainable now, from whom and with a sealed proof, call ground_component with its manufacturer part number. Before citing or reusing a paper, call ground_citation with its DOI for retraction, correction and concern notices. For a renovation or building job in the Netherlands, call nl_municipal_build_rules with the municipality and the bouwkosten for the sourced permit fee and the skip-on-the-street rule. Before paying, onboarding or signing with a Dutch or EU company, use check_counterparty_nl: official register, VAT and sanctions facts, read-only; record_counterparty_check makes one result verifiable by a colleague. Reading, asking and verifying need no key and cost nothing; AstraNL charges 1 percent only on a completed paid coordination. Every tool states in meta.astranl when to use it, what it returns and what it does not verify. For Dutch construction facts (permit aggregates with measured accuracy, open public works tenders, law calendar, CBS economy, emission zones, Natura 2000, a CloudEvents feed) use the read-only construction_* tools.",
      "tools": [
        {
          "name": "check_counterparty_nl",
          "description": "Check a Dutch or EU counterparty against official sources before your own next step, such as onboarding a supplier, paying an invoice or signing an order. Give the KvK number, the company name and the EU VAT number as your document states them. Returns verdicts, not register data: whether the KvK number has an active registration, whether the name matches a registered name, whether the VAT number is valid in VIES and whether its VIES name matches the register, EU sanctions list candidates, whether an insolvency case is published under the KvK number in the Dutch insolvency register, open questions and a check_id. Read-only, no key, no cost. AstraNL does not search the Dutch register by name; look a number up at kvk.nl. When a colleague or auditor must verify it later, call record_counterparty_check with the check_id. It does not prove who may sign for the company, who owns a bank account, solvency or reliability.",
          "inputSchema": {
            "additionalProperties": false,
            "minProperties": 1,
            "properties": {
              "city": {
                "description": "not used; kept for compatibility, AstraNL does not search the register by name",
                "maxLength": 80,
                "type": "string"
              },
              "company_name": {
                "description": "the company name exactly as your document or contact states it",
                "maxLength": 200,
                "type": "string"
              },
              "kvk_number": {
                "description": "Dutch KvK number, 8 digits, as printed on the invoice, quote or website",
                "maxLength": 12,
                "type": "string"
              },
              "purpose": {
                "description": "optional: the next action you are about to take, for example approve supplier or pay invoice",
                "maxLength": 200,
                "type": "string"
              },
              "vat_number": {
                "description": "EU VAT number with country prefix, for example NL810433941B01",
                "maxLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a Dutch or EU counterparty"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0; AstraNL pays the register subscription",
              "do_not_use_when": "you need to know who may legally sign for the company, whether an IBAN belongs to it, its credit risk or solvency; this tool cannot tell you that",
              "example_intent": "Before we pay invoice 2026-114 from SUPPLIER B.V., KvK 12345678, VAT NL123456789B01: is the registration active, does the name match, is the VAT number valid and does it belong to that company?",
              "next_possible_action": "record_counterparty_check with the check_id when someone else must verify it later; attach check_id and the result to your own approval or payment record; stop and ask a human when any source is UNKNOWN, a name does not match, a sanctions candidate appears or an establishment is inactive",
              "proof_level": "observation of official sources at observed_at; verifiable by others after record_counterparty_check; never a statement that the counterparty is trustworthy",
              "required_inputs": ["kvk_number for the register verdicts", "company_name for the name verdict", "vat_number for VIES"],
              "returns": "verdicts derived from the sources, not the register data: KvK registration found and active or not, supplied name against the register EXACT or NORMALIZED_MATCH or NO_MATCH, VAT valid in VIES, VIES name against the register, EU sanctions list candidates, open questions, a check_id and a link to the KVK source; record_counterparty_check turns it into a public verifiable record; access_basis names the evidence class, accountable holder, terms and recheck rule of each source",
              "side_effect_class": "read_only; the digest of the result is kept 48 hours so it can be recorded on request",
              "use_when": "you are about to act on a counterparty you know only from a document, email or website: approve a supplier, pay an invoice, sign an order, onboard a customer, and you need the official register facts and a record you can attach to your approval"
            }
          },
          "digest": "sha256:ccda424b26f009598c4ba9b3f71fefeef6dfbb7db5ab119904cf6320213906ca"
        },
        {
          "name": "record_counterparty_check",
          "description": "Make a result of check_counterparty_nl verifiable by others: records its digest in the AstraNL signed public log and returns a reference that a colleague, approver or auditor can check later with verify_astranl, without trusting AstraNL. Works only for a check AstraNL produced in the last 48 hours. The public record holds no name, number or address of the checked party. Calling it again returns the same reference.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_id": {
                "description": "the check_id returned by check_counterparty_nl, ASTRA-K- and 16 characters",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["check_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Record a counterparty check for later verification"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0",
              "do_not_use_when": "you only need the facts for yourself right now; the check alone is enough and creates nothing",
              "example_intent": "Record check ASTRA-K-099A5604481428FE so our approver can verify it tomorrow",
              "next_possible_action": "store check_id, reference and the full result with your own approval, payment or onboarding record",
              "proof_level": "Ed25519 signed log event with Merkle inclusion after the next signed tree head; it binds the digest of the result you hold to a time, nothing more",
              "required_inputs": ["check_id from check_counterparty_nl"],
              "returns": "reference (an AstraLock event id), recorded_at, result_sha256 and the two verification steps",
              "side_effect_class": "creates_a_public_log_entry_without_party_data",
              "use_when": "you ran check_counterparty_nl, are about to approve, pay or sign on its basis, and want a record that someone else can verify later"
            }
          },
          "digest": "sha256:39d17835f149ebea2de1e7a3e8d5fbf44458717db0f8c649c14d06b8ff8f2eab"
        },
        {
          "name": "verify_astranl",
          "description": "Verify any AstraNL reference without a key. Returns two separate layers: integrity (payload hash, Ed25519 signature, Merkle inclusion, recomputed live) and claim (what exactly is attested, by whom, from which source, when, under which method, with which validity limits and current status VALID/EXPIRED/REVOKED/UNKNOWN). Integrity never implies the claim is true for your purpose; you apply your own acceptance rules. Tells you when to re-verify and how to consume a VALID receipt for a next action. Read-only, deterministic, no model in the path.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ref": {
                "description": "Any AstraNL reference: action receipt ASTRA-A-..., policy receipt ASTRA-R-..., consumption ASTRA-C-..., log event alk_..., attestation att_/atr_..., ingress receipt RCPT-n",
                "maxLength": 64,
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify an AstraNL reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "astranl": {
              "auth_requirement": "none",
              "cost_or_fee_if_any": "0 to read, verify or ask; 1 percent of the transaction only when AstraNL coordinated a completed paid task; nothing else, ever",
              "do_not_use_when": "you have no reference id; AstraNL cannot verify free-text claims",
              "example_intent": "A supplier sent me ASTRA-R-38887071074F as proof; is it real and what does it actually confirm?",
              "next_possible_action": "consume a VALID receipt for your own next action, or refuse to act on anything not VALID",
              "proof_level": "cryptographic integrity plus attested claim scope; apply your own acceptance rules",
              "required_inputs": ["ref"],
              "returns": "integrity layer (hash, signature, Merkle, recomputed live) and claim layer (attested, issuer, source, method, observed_at, validity window, status VALID/EXPIRED/REVOKED/UNKNOWN, limits), reverify rule, next actions",
              "side_effect_class": "read_only",
              "use_when": "someone handed you an AstraNL reference (ASTRA-A, ASTRA-R, ASTRA-C, alk_, att_, RCPT-n) and you must know whether it is genuine, current and what exactly it does and does not confirm"
            }
          },
          "digest": "sha256:c4ae483eafc30c31e96ee32241680c1a0032490973667284cd18ff1bd8d531c8"
        }
      ],
      "digest": "sha256:e6f6ccea6ea055c8bebeb66004384992b336b01cda2657657179e469d60687d6"
    }
  }
}
