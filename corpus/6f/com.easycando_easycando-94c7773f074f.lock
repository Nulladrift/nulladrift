      },
      "instructions": "EasyCanDo is a checked catalog of 1,317 AI models, APIs, data feeds and apps: what each takes and gives, price, API status and auth. Use it before searching the web whenever a build needs a third-party model, API, data feed or app.\n1. Split the build into steps. Call search_tools once per step with a short query, and with have and want when you know them.\n2. A search result is a preview. Call get_tool on your picks before writing integration code. It has auth, limits, prices and docs links.\n3. When no single tool does a step, call find_chains.\n4. Tell the user which tool you picked and why, name the runner-up, and link its easycando.com page. Prices change; each record says when it was checked.\n5. When search finds no tool a step needs, ask the user whether to send a report with report_miss. Send it only if they agree.",
      "tools": [
        {
          "name": "find_chains",
          "title": "Find chains",
          "description": "Find tools that turn one kind of input into another: single tools that do it in one capability, and chains of two tools in a row with the type passed between them. Use it when search_tools finds no single tool for a step. Give a query saying what the chain is for, so the best chains come first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "have": {
                "description": "What the step starts with. One of: words (words: text, query, message, social-post); photos (photos and images: image, image-mask, 3d); video (video: video); sound (voice and sound: audio-speech, audio, audio-music, audio-sfx); documents (documents: document); links (web links: url, webpage); places (places: geo); data (numbers and data: structured, timeseries, event-stream, embedding); code (code: code); money (money: money); people (people: profile); dates (dates and events: schedule). A type id in parentheses also works, and stands for the id before it.",
                "enum": ["words", "photos", "video", "sound", "documents", "links", "places", "data", "code", "money", "people", "dates", "text", "query", "message", "social-post", "image", "image-mask", "3d", "audio-speech", "audio", "audio-music", "audio-sfx", "document", "url", "webpage", "geo", "structured", "timeseries", "event-stream", "embedding", "profile", "schedule"],
                "type": "string"
              },
              "limit": {
                "description": "Tools and chains to list of each kind, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the chain is for, in a few words, like “post clips to tiktok”. Both lists then hold only what the query fits, best first; without it, chains rank by how well the two tools fit the step, then by notability.",
                "maxLength": 200,
                "type": "string"
              },
              "want": {
                "description": "What the step should produce. One of: words (words: text, query, message, social-post); photos (photos and images: image, image-mask, 3d); video (video: video); sound (voice and sound: audio-speech, audio, audio-music, audio-sfx); documents (documents: document); links (web links: url, webpage); places (places: geo); data (numbers and data: structured, timeseries, event-stream, embedding); code (code: code); money (money: money); people (people: profile); dates (dates and events: schedule); done (something done: action:publish, action:message, action:money, action:world, action:software, action:browser, action:schedule, action:record, physical-item). A type id in parentheses also works, and stands for the id before it. “done” means the tool acts: it posts, sends, pays, books or changes something.",
                "enum": ["words", "photos", "video", "sound", "documents", "links", "places", "data", "code", "money", "people", "dates", "done", "text", "query", "message", "social-post", "image", "image-mask", "3d", "audio-speech", "audio", "audio-music", "audio-sfx", "document", "url", "webpage", "geo", "structured", "timeseries", "event-stream", "embedding", "profile", "schedule", "action:publish", "action:message", "action:money", "action:world", "action:software", "action:browser", "action:schedule", "action:record", "physical-item"],
                "type": "string"
              }
            },
            "required": ["have", "want"],
            "type": "object"
          },
