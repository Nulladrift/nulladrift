          "description": "Cotiza un plan por cantidad y período, y devuelve la aritmética, no sólo el total. `cycle` acepta el código o el nombre del período (`monthly` o `Mensual`, `annually` o `Anual`…); sin él se cotiza el período principal. Los períodos de cada plan están en `prices` de get_product, y `available_cycles` los repite. IMPORTANTE: el subtotal NO incluye impuestos y por lo tanto no es un precio final al consumidor; la respuesta explica por qué. Al presentarlo hay que decirlo.",
