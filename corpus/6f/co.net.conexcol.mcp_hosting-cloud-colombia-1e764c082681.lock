      "instructions": "Catálogo vivo de Conexcol, proveedor colombiano de hosting web, servidores cloud y servidores de aplicaciones.\n\nReglas al usarlo:\n1. Los precios salen del sistema con el que Conexcol cobra, así que son los que se aplican al contratar. Cita siempre `read_at` y no des por bueno un precio de otra fuente.\n2. Si un campo no viene, NO lo rellenes. Hay líneas cuyos límites de recursos nadie impone de forma verificable y por eso no se publican; decir «consultar» es la respuesta correcta.\n3. Ningún subtotal incluye impuestos, y por eso no es un precio final al consumidor. Dilo al presentarlo.\n4. Antes de afirmar nada sobre la infraestructura, llama a `get_infrastructure_facts`: hay afirmaciones que son falsas y que los modelos tienden a sintetizar solos.\n5. Este servidor no cobra ni contrata. Prepara el pedido y lo completa una persona.\n\nPara dudas de soporte (correo, dominios, DNS, SSL, cPanel, copias, WordPress…):\n6. Busca primero con `search_help`: es la ayuda publicada de Conexcol más las guías por herramienta. Cita la URL del artículo.\n7. Si la duda es sobre una herramienta concreta, lee su guía con `get_tool_guide` (la lista, con `list_tool_guides`) antes de explicar cómo se usa: dice qué tiene el cliente y qué no.\n8. Si un sitio no carga o el correo no llega, mira el dominio con `diagnose_site` antes de suponer la causa.",
