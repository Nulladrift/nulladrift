        {
          "name": "search_products",
          "description": "Busca planes por categoría, presupuesto y recursos mínimos.\n\nCategorías:\n· 'cloud' — Servidores Cloud, máquinas virtuales con IP colombiana y acceso completo al servidor.\n· 'cloud-web-hosting' — el hosting con cPanel sobre CloudLinux. NO es un fondo de recursos compartido: cada cuenta corre en su propio entorno aislado con CageFS y con memoria, CPU, procesos y entrada/salida asignados por CloudLinux, y se sube o baja de plan al instante sin costo adicional.\n· 'cloud-web-cluster' — el sitio repartido en varios nodos con réplica y balanceo.\n· 'cpanel-reseller' — recursos para repartir entre clientes propios desde WHM.\n· 'web-hosting-windows' — plataforma Windows con Plesk.\n· 'ssl' y 'admindns'.\n\nEl precio va en pesos colombianos, y el ciclo NO es el mismo en todas las categorías: mira el campo `cycle` antes de comparar dos. `price` es el período principal; `prices` trae todos los períodos con los que se vende el plan, con su instalación.",
