        {
          "name": "get_product",
          "description": "Ficha completa de un plan por su nombre exacto: precio de cada período en que se vende (`prices`), recursos, de qué fuente salió cada dato y cuándo se leyó. Si el plan no está en el catálogo devuelve null: eso significa que no se puede comprar, aunque alguna página lo anuncie.\n\nLos recursos se leen dos veces dentro del sistema de facturación: lo que el módulo entrega y lo que la ficha anuncia. Cuando coinciden se publica el valor; cuando no, el recurso NO va en `resources` sino en `resources_under_review` con lo que dice cada fuente, y eso hay que consultarlo, no afirmarlo. `resources_note` explica los casos en que no hay recursos que dar: un certificado SSL no es alojamiento. Los límites del hosting Windows salen del plan de Plesk, con la fecha de su lectura.",
          "inputSchema": {
