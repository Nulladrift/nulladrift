        {
          "name": "account_save_team",
          "title": "Create or change a team",
          "description": "A department, location or project group of the account, like Support, Finance or the Hamburg shop. Its keys (POST /v1/keys with \"team\") can only work in its areas, only read when read_only is on, and spend against its budget (monthly_budget_usd per budget_period: a month, a fiscal quarter or year, or a project total): a hard budget refuses the call that would pass it, a soft one only warns. At alert_percent you get the event account.budget_alert and the owner an email, once a period. erp_code is the team's cost center in the company's ERP, for statements. drafts_only makes every write of its keys wait for one of its managers (or the owner), for a new bot that should only draft. mailboxes are the Microsoft 365 or Google mailboxes its keys may act as. You may make a team and narrow one; widening its areas, letting it write, ending drafts only, switching a hard budget to soft, and raising or removing a budget are the owner's, on their account page, when the account has an owner email. The company-wide team holds every key no other team does and is never limited to areas. $0.001. Costs $0.001 per call; nothing if it fails.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alert_percent": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "areas": {
                "description": "The areas its keys may work in (account tools always); null for every area.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": ["array", "null"]
              },
              "budget": {
                "description": "hard refuses calls past the budget; soft only warns.",
                "enum": ["hard", "soft"],
                "type": "string"
              },
              "budget_ends_on": {
                "description": "The last day of a project budget, like 2026-12-31.",
                "format": "date",
                "type": ["string", "null"]
              },
              "budget_period": {
                "description": "What the budget is for: a month, a quarter or a year of the account's fiscal calendar, or a project total until budget_ends_on.",
                "enum": ["month", "quarter", "year", "project"],
                "type": "string"
              },
              "drafts_only": {
                "description": "Every write of its keys waits for a person, and they get links that act for whoever opens them as \"[redacted]\".",
                "type": "boolean"
              },
              "erp_code": {
                "maxLength": 40,
                "type": ["string", "null"]
              },
              "mailboxes": {
                "description": "The Microsoft 365 or Google mailboxes its keys may act as; null for every mailbox the connection lists.",
                "items": {
                  "maxLength": 254,
                  "type": "string"
                },
                "maxItems": 20,
                "type": ["array", "null"]
              },
              "monthly_budget_usd": {
                "description": "null counts the spend without a cap.",
                "maximum": 1000000,
                "minimum": 0,
                "type": ["number", "null"]
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "new_name": {
                "description": "Renames the team; its keys, spend and budget stay with it.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "read_only": {
                "description": "Its keys only read, and get links that act for whoever opens them as \"[redacted]\".",
                "type": "boolean"
              },
              "sees_sensitive": {
                "description": "false hides suppliers' bank details and HR notes and contracts from its keys; only the owner turns it on.",
                "type": "boolean"
              }
            },
            "required": ["name"],
            "type": "object"
          },
