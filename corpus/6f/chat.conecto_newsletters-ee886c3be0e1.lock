        {
          "name": "newsletters_connect_service",
          "title": "Connect the business's email service",
          "description": "Newsletters go out through the business's own email service, from an address on its own domain: any service that takes mail over SMTP, such as Brevo, Amazon SES, Mailgun, Postmark, SendGrid, Mailchimp Transactional or the web host. Give its SMTP server, login and the from address. Called without password, it answers with a link for the owner, who types the SMTP password or key on a Conecto page, so it never passes through the chat (from_a_terminal does the same from a terminal); account.credential_added says when it is connected. Conecto logs in to check them and keeps the password encrypted, never shown again. Calling it again replaces them, and issues waiting for the service go out on the next round. With test_to, a short email also goes out, which shows the service takes mail from that address. Free. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_email": {
                "description": "The address issues come from, on a domain the service lets the business send from, e.g. news@halversoncycle.com.",
                "maxLength": 254,
                "type": "string"
              },
              "host": {
                "description": "The SMTP server, e.g. smtp-relay.brevo.com or email-smtp.eu-west-1.amazonaws.com.",
                "maxLength": 255,
                "minLength": 3,
                "type": "string"
              },
              "password": {
                "description": "The SMTP password or key (for Brevo an SMTP key, not the account password). Leave it out to get the link instead.",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string",
                "writeOnly": true
              },
              "per_day": {
                "description": "The service's own daily limit, if it has one (Brevo's free plan: 300). Issues then go out over several days.",
                "maximum": 10000000,
                "minimum": 1,
                "type": "integer"
              },
              "port": {
                "default": 587,
                "description": "587 (STARTTLS) or 465 (SSL/TLS). Port 25 is blocked on Conecto's servers.",
                "maximum": 65535,
                "minimum": 1,
                "type": "integer"
              },
              "security": {
                "description": "starttls or ssl. Left out: ssl on port 465, starttls otherwise.",
                "enum": ["starttls", "ssl"],
                "type": "string"
              },
              "test_to": {
                "description": "Also send a short test email to this address.",
                "maxLength": 254,
                "type": "string"
              },
              "username": {
                "description": "The SMTP login (for Brevo the SMTP login, for SendGrid \"apikey\").",
                "maxLength": 254,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["from_email", "host", "username"],
            "type": "object"
          },
          "annotations": {
