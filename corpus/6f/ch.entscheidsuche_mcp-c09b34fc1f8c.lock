      "instructions": "MCP-Server für entscheidsuche.ch — eine Suchmaschine für Schweizer Gerichtsentscheide, Gerichtsurteile, Rechtsprechung und Swiss case law. Die Tools helfen bei Entscheiden des Bundesgerichts (BGer, BGE) sowie kantonalen Gerichten, Obergerichten, Verwaltungsgerichten und weiteren Schweizer Gerichten. Unterstützt Volltextsuche, Geschäftsnummern- bzw. Urteilsnummern-Suche, Volltext-Abruf einzelner Entscheide, Hierarchien für Kantone und Gerichte sowie Facetten für Filter und Recherche.",
      "tools": [
        {
          "name": "fetch_document",
          "title": "Fetch decision",
          "description": "Fetch a single Swiss court decision, judgment or Federal Supreme Court decision by its document ID (`_id`). Returns the indexed full text of the decision together with metadata, title, abstract and links. Use this when the full decision should be read or processed after a search. Note: for very long decisions the indexed text is capped at 100,000 characters; if `text_truncated` is true, the complete document is available at `document_url`.",
          "inputSchema": {
            "$defs": {
              "Language": {
                "description": "Verfügbare Sprachen der Entscheide.",
                "enum": ["de", "fr", "it"],
                "title": "Language",
                "type": "string"
              }
            },
            "properties": {
              "id": {
                "description": "Document ID (e.g. 'CH_BGer_001_5A_123_2024_2024-06-15').",
                "title": "Id",
                "type": "string"
              },
              "language": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/Language"
                  },
                  {
                    "type": "null"
