          "name": "semantic_search",
          "title": "AI search by meaning (semantic search)",
          "description": "AI search by meaning (semantic / embedding search) across Swiss court decisions on entscheidsuche.ch. Best for legal questions, descriptions of facts and concepts: write one or more full sentences instead of keywords, e.g. 'Can a landlord terminate the lease because his daughter wants to move in?'. Works across languages: a German query also finds French and Italian decisions.\n\nHow it works: the query is compared with the passages of all decisions; the 100 best-matching passages are determined and grouped by decision. Results are ranked by similarity (`score`); `text` contains the best matching passage of each decision. There is no pagination, no other sort order and no Boolean syntax — use `keyword_search` for exact terms, `search_by_case_number` for case numbers.\n\nFilters are combined with AND. Hierarchy IDs (canton / court / chamber, e.g. 'CH_BGer', 'ZH_OG') are case-sensitive; take them from `list_hierarchy` or `list_facets`.",
