        {
          "name": "search",
          "title": "Search decisions",
          "description": "Full-text search across Swiss court judgments, court decisions and case law from entscheidsuche.ch. Covers decisions of the Federal Supreme Court (BGer, BGE) and cantonal courts such as Kantonsgericht, Obergericht or Verwaltungsgericht.\n\nTypical use cases:\n  - Search Federal Supreme Court judgments, BGE or rulings by topic\n  - Find Swiss case law on tenancy law, ZGB, OR, StGB or BV\n  - Verify case numbers, judgment numbers or citations\n  - Related tools: fetch_document, search_by_case_number, list_hierarchy, list_facets\n\nSearch syntax (Lucene query string):\n  - Phrase / case-number search: \"BGE 142 III 1\" (in quotes)\n  - Boolean operators: AND, OR, NOT (or +, -)\n  - Wildcards: * and ?\n  - The default operator between terms is AND.\n\nFilters are combined with AND. Use hierarchy IDs from `list_hierarchy` or `list_facets`.\n\nPagination: after the first call, pass the `next_cursor` value from the response as `search_after` in the next call.",
          "inputSchema": {
            "$defs": {
              "Language": {
                "description": "Verfügbare Sprachen der Entscheide.",
                "enum": ["de", "fr", "it"],
                "title": "Language",
                "type": "string"
              }
            },
            "properties": {
              "decision_date_from": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Lower bound for the decision date (YYYY-MM-DD, inclusive).",
                "title": "Decision Date From"
              },
              "decision_date_to": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Upper bound for the decision date (YYYY-MM-DD, inclusive).",
                "title": "Decision Date To"
              },
              "hierarchy": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "List of hierarchy IDs (canton/court/chamber). Multiple IDs are combined with OR; with other filters, AND.",
                "title": "Hierarchy"
              },
              "include_aggregations": {
                "default": false,
                "description": "Include aggregations (distributions over the results).",
                "title": "Include Aggregations",
                "type": "boolean"
              },
              "language": {
