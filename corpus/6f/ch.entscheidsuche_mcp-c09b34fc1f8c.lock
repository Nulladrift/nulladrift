      "instructions": "MCP server for entscheidsuche.ch — the open search engine for Swiss court decisions and case law (Schweizer Gerichtsentscheide, Rechtsprechung, jurisprudence suisse): Federal Supreme Court (BGer, BGE) and cantonal courts, in German, French and Italian.\nTools: `search` is the default — describe the legal question in natural language (AI search by meaning). `semantic_search` is the same AI search without automatic switching. `keyword_search` finds exact words, phrases and Boolean expressions and supports sorting and pagination. `search_by_case_number` looks up case numbers and BGE citations. `fetch` / `fetch_document` return the full text of a decision. `list_hierarchy` and `list_facets` list cantons, courts and chambers for the `hierarchy` filter.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch decision (alias of fetch_document)",
          "description": "Fetch one Swiss court decision by its document ID and return its full text together with title, court, date and links. Use the `id` of a hit returned by one of the search tools. For very long decisions the text is capped at 100,000 characters; if `text_truncated` is true, the complete document is available at `document_url`. Identical to `fetch_document`.",
