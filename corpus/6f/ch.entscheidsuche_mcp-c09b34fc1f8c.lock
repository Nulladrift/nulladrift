                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latest date the decision was added to the index (YYYY-MM-DD).",
                "title": "Scrape Date To"
              },
              "search_after": {
                "anyOf": [
                  {
                    "items": {},
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cursor from `next_cursor` of the previous response.",
                "title": "Search After"
              },
              "size": {
                "default": 20,
                "description": "Results per page (1–100).",
                "maximum": 100,
                "minimum": 1,
                "title": "Size",
                "type": "integer"
              },
              "sort": {
                "default": "relevance",
                "description": "Sort order: 'relevance' (default) | 'date' (decision date, newest first) | 'scrapedate' (date added to the index, newest first).",
                "enum": ["relevance", "date", "scrapedate"],
                "title": "Sort",
                "type": "string"
              }
            },
