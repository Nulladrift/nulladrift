        {
          "name": "keyword_search",
          "title": "Keyword search (exact terms)",
          "description": "Exact keyword (full-text) search across Swiss court decisions on entscheidsuche.ch. Finds decisions that contain the given words. Use it for specific terms, statute articles, names, quoted phrases, complete result lists, sorting by date and pagination. For legal questions in natural language prefer `semantic_search`.\n\nSearch syntax (Lucene query string):\n  - All terms must occur (default operator AND).\n  - Phrase: \"dringender Eigenbedarf\" (double quotes).\n  - Boolean operators in capitals between terms: AND, OR, NOT.\n  - Wildcards: * and ?  —  '*' alone matches every decision.\n  - Statute citations work as written: Art. 271 OR, Art. 8 ZGB.\n  - Put case numbers in quotes (\"5A_396/2015\") or use `search_by_case_number`.\nIf a query is not valid syntax it is searched as plain terms and the response says so in `note`.\n\n`text` contains a snippet with the matched terms in <em>…</em>. Filters are combined with AND. Hierarchy IDs (canton / court / chamber, e.g. 'CH_BGer', 'ZH_OG') are case-sensitive; take them from `list_hierarchy` or `list_facets`.\n\nPagination: pass `next_cursor` of the response as `search_after` in the next call (same query, same sort).",
          "inputSchema": {
            "$defs": {
              "Language": {
                "description": "Verfügbare Sprachen der Entscheide.",
                "enum": ["de", "fr", "it"],
                "title": "Language",
                "type": "string"
              }
            },
            "properties": {
              "decision_date_from": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Earliest decision date (YYYY-MM-DD, inclusive).",
                "title": "Decision Date From"
              },
              "decision_date_to": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latest decision date (YYYY-MM-DD, inclusive).",
                "title": "Decision Date To"
              },
              "hierarchy": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Restrict to cantons, courts or chambers by hierarchy ID, e.g. ['CH_BGer'] or ['ZH_OG', 'BE']. Several IDs are combined with OR.",
                "title": "Hierarchy"
              },
              "include_aggregations": {
                "default": false,
                "description": "Also return distributions of the results by court, language and date.",
                "title": "Include Aggregations",
                "type": "boolean"
              },
              "language": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/Language"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Preferred language (de, fr, it) for the displayed title and abstract. Does NOT filter — use `language_filter` for that."
              },
              "language_filter": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/Language"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only decisions written in these languages, e.g. ['fr'].",
                "title": "Language Filter"
              },
              "query": {
                "default": "*",
                "description": "Search terms. \"...\" for phrases, AND/OR/NOT for Boolean operators, * and ? for wildcards. \"*\" matches everything.",
                "title": "Query",
                "type": "string"
              },
              "scrape_date_from": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Earliest date the decision was added to the index (YYYY-MM-DD).",
                "title": "Scrape Date From"
              },
              "scrape_date_to": {
                "anyOf": [
