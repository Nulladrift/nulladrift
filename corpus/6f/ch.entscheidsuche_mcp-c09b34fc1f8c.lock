                "default": null,
                "description": "Filter by document language(s).",
                "title": "Language Filter"
              },
              "query": {
                "default": "*",
                "description": "Full-text query. \"...\" for phrases, AND/OR/NOT for Boolean operators, * and ? for wildcards. \"*\" matches everything.",
                "title": "Query",
                "type": "string"
              },
              "scrape_date_from": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
