{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kaiv/dependency-trust": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kaiv.ai/api/bridge/mcp/dependency-trust-f1aaf06d"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "dependency-trust",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "\"dependency-trust\" is a governed MCP server hosted by Kaiva Bridge. Tools carry a JSON Schema for both input and, where the source documents one, output. Read inputSchema before calling rather than guessing argument names. Every tool here is read-only unless its annotations say otherwise — check readOnlyHint and destructiveHint before calling. A failed call returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "get_advisory",
          "title": "Get Advisory",
          "description": "Get a security advisory (vulnerability) by its key.\n\nReturns a security advisory by key, for example a GHSA id taken from a version's advisoryKeys, including the title, CVE aliases, CVSS v3 score and vector, and a link to the full record on osv.dev. Use this only when you already have an advisory ID from get_package_version's advisoryKeys. There is no search here. To find out whether a version has vulnerabilities at all, call get_package_version first; this tool explains one advisory in depth.",
          "inputSchema": {
            "properties": {
              "advisoryKey": {
                "description": "Advisory id, e.g. 'GHSA-29mw-wpgm-hmr9' (taken from a version's advisoryKeys).",
                "type": "string",
                "x-in": "path"
              }
            },
            "required": ["advisoryKey"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Advisory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a430a082d5d465220ad09567682d3fc92d9f25d7e2355d99014a008484b0e591"
        },
        {
          "name": "get_dependencies",
          "title": "Get Dependencies",
          "description": "Get the resolved dependency graph for one package version.\n\nReturns the full resolved dependency graph (direct and indirect) for a version. Each node has the dependency's exact version and its relation (SELF / DIRECT / INDIRECT). Use it to reason about transitive dependencies and supply chain.",
          "inputSchema": {
            "properties": {
              "package": {
                "description": "Package name, raw and unencoded (the gateway URL-encodes it). Use scoped or namespaced names as-is, e.g. npm '@angular/core', Maven 'group:artifact'.",
                "type": "string",
                "x-in": "path"
              },
              "system": {
                "description": "Package ecosystem.",
                "enum": ["npm", "pypi", "go", "maven", "cargo", "nuget", "rubygems"],
                "type": "string",
                "x-in": "path"
              },
              "version": {
                "description": "Exact version string, e.g. '18.2.0'.",
                "type": "string",
                "x-in": "path"
              }
            },
            "required": ["package", "system", "version"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Dependencies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:41093caa872ed28f61387937273cc132755f8c1498b9c529832fc82d63a10bda"
        },
        {
          "name": "get_package",
          "title": "Get Package",
          "description": "List every version of a package and whether each is deprecated.\n\nReturns all published versions of a package with publish date, the default-version flag, and deprecation status. Use it to find the latest version or check if a package is deprecated. Coding agents should call this before recommending a package or version.",
          "inputSchema": {
            "properties": {
              "package": {
                "description": "Package name, raw and unencoded (the gateway URL-encodes it). Use scoped or namespaced names as-is, e.g. npm '@angular/core', Maven 'group:artifact'.",
                "type": "string",
                "x-in": "path"
              },
              "system": {
                "description": "Package ecosystem.",
                "enum": ["npm", "pypi", "go", "maven", "cargo", "nuget", "rubygems"],
                "type": "string",
                "x-in": "path"
              }
            },
            "required": ["package", "system"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Package"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:42e5b190fc907d456c4b0b8921e538192adb176b06a6a1090d746b035fc17abc"
        },
        {
          "name": "get_package_version",
          "title": "Get Package Version",
          "description": "Get license, security advisories, and source links for one package version.\n\nReturns detailed metadata for a single version: SPDX licenses, security advisoryKeys (known vulnerabilities), homepage/issue-tracker/source-repo links, registries, publish date, and deprecation status. Pass any advisoryKey returned here to get_advisory for the vulnerability details.",
          "inputSchema": {
            "properties": {
              "package": {
                "description": "Package name, raw and unencoded (the gateway URL-encodes it). Use scoped or namespaced names as-is, e.g. npm '@angular/core', Maven 'group:artifact'.",
                "type": "string",
                "x-in": "path"
              },
              "system": {
                "description": "Package ecosystem.",
                "enum": ["npm", "pypi", "go", "maven", "cargo", "nuget", "rubygems"],
                "type": "string",
                "x-in": "path"
              },
              "version": {
                "description": "Exact version string, e.g. '18.2.0'.",
                "type": "string",
                "x-in": "path"
              }
            },
            "required": ["package", "system", "version"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Package Version"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4b84e8b760829d4144ac065441e91fc08bf28f6ca70f71272a72f66c282bc7ab"
        },
        {
          "name": "get_project_health",
          "title": "Get Project Health",
          "description": "Get a project's OpenSSF Scorecard security posture and maintenance signals.\n\nTHE trust check. Returns supply-chain trust signals for a package's source repository: the OpenSSF Scorecard overall score (0-10) and per-check results (Maintained, Code-Review, Signed-Releases, Branch-Protection, Pinned-Dependencies, Dangerous-Workflow, Token-Permissions, Security-Policy, Vulnerabilities, ...), plus stars, forks, open-issue count, and license. Use it to judge whether a dependency is actively maintained and securely operated, not just whether it has a known CVE. Get the projectKey from a version's SOURCE_REPO link (call get_package_version first), e.g. 'github.com/facebook/react'.",
          "inputSchema": {
            "properties": {
              "projectKey": {
                "description": "Source repository, raw and unencoded (the gateway URL-encodes it). Pass it as-is, e.g. 'github.com/facebook/react'. Supported hosts: github.com, gitlab.com, bitbucket.org. Take it from a version's SOURCE_REPO link (get_package_version).",
                "type": "string",
                "x-in": "path"
              }
            },
            "required": ["projectKey"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Project Health"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:727aa573909d8ed8306cb90c6a47c6c23023c016ff6ad4b45b8698cfa8244d5a"
        }
      ],
      "digest": "sha256:7a73657157972812c1066aa7b00c5ceed44a2b4a210907121b5199ab8f6547b3"
    }
  }
}
