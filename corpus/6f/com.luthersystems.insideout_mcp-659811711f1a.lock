                },
                "type": ["null", "object"]
              },
              "hints": {
                "description": "Guidance for the calling agent: what to do next and which tools relate to this result.",
                "properties": {
                  "next_actions": {
                    "description": "Suggested next steps, in order, often as ready-to-run tool calls.",
                    "items": {
                      "description": "One suggested next step.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "related_tools": {
                    "description": "Names of tools that are useful after this result.",
                    "items": {
                      "description": "A tool name.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  }
                },
                "type": ["null", "object"]
              },
              "instruction": {
                "description": "Plain-language instruction for the agent when the reply is not ready yet.",
                "type": "string"
              },
              "message_id": {
                "description": "ID of Riley's reply message.",
                "type": "string"
              },
              "next_action": {
                "description": "Tool to call next when the reply is not ready yet (for example 'convoawait').",
