        {
          "name": "gcpinspect",
          "title": "Inspect GCP Infrastructure",
          "description": "INSPECTION: Inspect GCP infrastructure for a deployed project\n⚠️ **PREREQUISITE**: This tool requires a prior deployment ATTEMPT (successful or failed).\nCheck convostatus for hasDeployAttempt=true before calling. Works even after failed deploys to inspect orphaned resources.\n\nInspect deployed GCP resources after a deployment attempt.\nUse this tool when the user asks about the status or details of their deployed GCP infrastructure.\nIt fetches temporary read-only credentials securely and queries the GCP API directly.\n\nRESPONSE TIERS (default is summary for token efficiency):\n- Summary (default): Key fields only (~500 tokens). Set detail=false, raw=false or omit both.\n- Detail: Full metadata for a specific resource. Set detail=true + resource filter.\n- Raw: Complete unprocessed API response. Set raw=true.\n\nREQUIRES: session_id from convoopen response (format: sess_v2_...).\nSupported services: apigateway, bastion, billing, certificatemanager, cloudarmor, cloudbuild, cloudcdn, clouddeploy, clouddns, cloudfunctions, cloudkms, cloudlogging, cloudmonitoring, cloudrun, cloudsql, compute, firestore, gcs, gke, iam, identityplatform, loadbalancer, memorystore, pubsub, secretmanager, vertexai, vpc\nFor a specific service's actions, call with action=\"list-actions\".\n\nMETRICS: Use list-metrics to see available Cloud Monitoring metrics for any service (no credentials needed — progressive disclosure). Use get-metrics to retrieve time-series data. Optional filters JSON: {\"hours\":6,\"period\":300}.\nLabel breakdowns: Cloud Functions (by status), Load Balancer/API Gateway (by response_code_class), Cloud CDN (by cache_result).\nSecret Manager get-metrics returns operational health (version count, replication, create time) — no time-series.\nBastion is an alias for Compute Engine metrics (SSH connection count not available as a GCP metric).\nBILLING: Use service=billing to inspect GCP billing. Actions: get-billing-info (check if billing enabled, which billing account), get-budgets (list budget alerts for the project — auto-fetches billing account). Requires roles/billing.viewer IAM role.\nRequired IAM roles: Monitoring Viewer (roles/monitoring.viewer) for metrics, Secret Manager Viewer (roles/secretmanager.viewer) for secret health, Billing Viewer (roles/billing.viewer) for billing.\n\nEXAMPLES:\n- gcpinspect(session_id=..., service=\"compute\", action=\"list-instances\")\n- gcpinspect(session_id=..., service=\"gke\", action=\"list-clusters\")\n- gcpinspect(session_id=..., service=\"cloudsql\", action=\"get-metrics\", filters=\"{\\\"hours\\\":6}\")\n- gcpinspect(session_id=..., service=\"billing\", action=\"get-billing-info\")",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Operation on the service. Examples: 'list-instances' (compute), 'list-buckets' (storage), 'list-clusters' (gke), 'list-actions' (discovery), 'list-metrics' / 'get-metrics' (Cloud Monitoring).",
                "type": "string"
              },
              "detail": {
                "description": "When true, returns full metadata for a single resource. When false (default), returns a summary.",
                "type": "boolean"
              },
              "filters": {
                "description": "Optional JSON-encoded filter object passed through to the underlying GCP API. Examples: '{\"hours\":6}' for metric windows, '{\"zone\":\"us-central1-a\"}' for zone-scoped queries.",
                "type": "string"
              },
              "raw": {
                "description": "When true, returns the unprocessed GCP API response. Escape hatch for fields the summarized response doesn't surface.",
                "type": "boolean"
              },
              "service": {
                "description": "GCP service to query. Examples: 'compute', 'storage', 'cloudsql', 'gke', 'cloudrun', 'pubsub', 'firestore'. Use action='list-actions' to discover supported actions for a service.",
                "enum": ["apigateway", "bastion", "billing", "certificatemanager", "cloudarmor", "cloudbuild", "cloudcdn", "clouddeploy", "clouddns", "cloudfunctions", "cloudkms", "cloudlogging", "cloudmonitoring", "cloudrun", "cloudsql", "compute", "firestore", "gcs", "gke", "iam", "identityplatform", "loadbalancer", "memorystore", "pubsub", "secretmanager", "vertexai", "vpc"],
                "type": "string"
              },
              "session_id": {
                "description": "Session ID from convoopen — pass back EXACTLY as returned, including the ?token=... suffix (format: sess_v2_*?token=*). The suffix is part of the session credential; never strip it when summarizing. The session must have a GCP deploy attempt before inspect probes will succeed.",
                "pattern": "^sess_v2_[0-9A-Za-z]+\\?token=[0-9a-f]+$",
                "type": "string"
              }
            },
            "required": ["action", "detail", "filters", "raw", "service", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hints": {
                "description": "Guidance for the calling agent: what to do next and which tools relate to this result.",
                "properties": {
                  "next_actions": {
                    "description": "Suggested next steps, in order, often as ready-to-run tool calls.",
                    "items": {
                      "description": "One suggested next step.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "related_tools": {
                    "description": "Names of tools that are useful after this result.",
                    "items": {
                      "description": "A tool name.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  }
                },
                "type": ["null", "object"]
              },
              "result": {
                "description": "The GCP inspect result. A list action returns a summary object (count plus the listed items) when summarized is true; detail and raw actions return the backend result unchanged."
              },
              "summarized": {
                "description": "True when result is a compact summary instead of the full backend response.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
