                    "index": {
                      "description": "Position of the sub-request in the request.",
                      "type": "integer"
                    },
                    "ok": {
                      "description": "True when the sub-request succeeded.",
                      "type": "boolean"
                    },
                    "result": {
                      "description": "The sub-request result, with the same rules as the single inspect tool."
                    },
                    "service": {
                      "description": "Service the sub-request inspected.",
                      "type": "string"
                    },
                    "summarized": {
                      "description": "True when result is a compact summary.",
                      "type": "boolean"
                    },
                    "truncated": {
                      "description": "True when result was dropped to keep the response under the size cap.",
                      "type": "boolean"
                    }
                  },
                  "type": ["null", "object"]
                },
                "type": ["null", "array"]
              },
              "truncated_at": {
                "description": "Index of the first sub-request whose result was dropped for size.",
                "type": "integer"
              },
              "truncated_cap_bytes": {
                "description": "Response size cap, in bytes, that caused the truncation.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c4dee3beeec3549fc4749c131e563f192ee15507abf8f00307fb3f13d878b06"
        },
        {
          "name": "convoawait",
          "title": "Await Pending Response",
          "description": "Wait for a pending response from Riley after a convoreply timeout.\n\n🎯 USE THIS TOOL WHEN: convoreply returned a timeout error.\nThis allows you to continue waiting for the response without resending the message.\n\nREQUIRES:\n- session_id: from convoopen response\n\nOPTIONAL:\n- message_id: if known (from convoreply timeout error)\n- timeout (integer): seconds to wait. For Cursor, use 50 (default). Max 55.\n\nReturns the same format as convoreply when successful.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message_id": {
                "description": "Optional message ID from a convoreply timeout error. Not required for normal turn-based flow.",
                "type": "string"
              },
              "session_id": {
                "description": "Session ID from convoopen — pass back EXACTLY as returned, including the ?token=... suffix (format: sess_v2_*?token=*). The suffix is part of the session credential; never strip it when summarizing.",
                "pattern": "^sess_v2_[0-9A-Za-z]+\\?token=[0-9a-f]+$",
                "type": "string"
              },
              "timeout": {
                "description": "Max seconds to wait. Default 50, max 55.",
                "maximum": 55,
                "minimum": 1,
                "type": ["null", "integer"]
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assistant_message": {
                "description": "Riley's reply, cleaned of internal markers. Show it to the user.",
                "properties": {
                  "text": {
                    "description": "The message text.",
                    "type": "string"
