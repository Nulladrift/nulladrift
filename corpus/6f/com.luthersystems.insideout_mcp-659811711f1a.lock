        {
          "name": "awsinspect_batch",
          "title": "Batch-Inspect AWS Infrastructure",
          "description": "BATCH INSPECTION: run up to 32 AWS inspect probes in one call.\n⚠️ **PREREQUISITE**: Same as awsinspect — deploy attempt required.\nCheck convostatus for hasDeployAttempt=true before calling.\n\nUse this when you need to check more than ~3 resources. The backend fetches\nOracle credentials ONCE per batch and fans out probes against a single AWS\nconfig — for a 12-resource health check this is ~5–8× faster and 12× fewer\nOracle round-trips than calling awsinspect 12 times.\n\nBUDGETS:\n- Up to 32 sub-probes per call (subs array length).\n- 30s per-sub timeout; 60s total batch wall-clock.\n- Concurrency cap 8 — sub-probes run in parallel but never saturate AWS.\n- 512 KB response cap: subs past the cap keep their envelope\n  (index/service/action/ok) but have result replaced with truncated=true.\n\nPARTIAL FAILURE IS EXPECTED. The response is an ordered results array;\neach entry has {index, service, action, ok, result, error}. Inspect each\nresult — do NOT abort on the first error. A credential fetch failure\nleaves cred-less probes (list-actions, list-metrics) succeeding anyway.\n\nREQUIRES: session_id from convoopen response (format: sess_v2_...).\nSupported services: account, acm, alb, apigateway, apprunner, backup, bedrock, cloudfront, cloudwatchlogs, cognito, cost-explorer, dynamodb, ebs, ec2, ecs, eks, elasticache, kms, lambda, msk, opensearch, rds, route53, s3, sagemaker, secretsmanager, sqs, vpc, waf\nFor a specific service's actions, use awsinspect (singular) with\naction=\"list-actions\" — batch is not the place for discovery.\nBatch responses are always summarized (no detail/raw per-sub); use\nsingular awsinspect when you need full metadata or raw API output for one\nresource.\n\nEXAMPLES:\n- awsinspect_batch(session_id=..., subs=[\n    {\"service\":\"ec2\",\"action\":\"describe-instances\"},\n    {\"service\":\"rds\",\"action\":\"describe-db-instances\"},\n    {\"service\":\"vpc\",\"action\":\"describe-vpcs\"},\n    {\"service\":\"s3\",\"action\":\"list-buckets\"}])\n- awsinspect_batch(session_id=..., subs=[\n    {\"service\":\"ec2\",\"action\":\"get-metrics\",\"filters\":\"{\\\"hours\\\":6}\"},\n    {\"service\":\"rds\",\"action\":\"get-metrics\",\"filters\":\"{\\\"hours\\\":6}\"}])",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session ID from convoopen — pass back EXACTLY as returned, including the ?token=... suffix (format: sess_v2_*?token=*). The suffix is part of the session credential; never strip it when summarizing. The session must have an AWS deploy attempt before inspect probes will succeed.",
                "pattern": "^sess_v2_[0-9A-Za-z]+\\?token=[0-9a-f]+$",
                "type": "string"
              },
              "subs": {
                "description": "Up to 32 sub-probes, each with {service, action, filters?, detail?, raw?}. The backend fetches credentials once per batch and fans out probes in parallel (concurrency 8, 30s per-sub timeout, 60s total wall clock). Partial failure is expected — inspect each result.ok independently.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action": {
                      "description": "Operation on the service (e.g. 'describe-instances', 'list-buckets', 'list-actions' for discovery, 'list-metrics' / 'get-metrics' for time-series).",
                      "type": "string"
                    },
                    "filters": {
                      "description": "Optional JSON-encoded filter object passed through to the underlying API. Examples: '{\"hours\":6}' for metric windows, '{\"days\":7}' for cost queries.",
                      "type": "string"
                    },
                    "service": {
                      "description": "Cloud service to query (e.g. 'ec2', 'rds', 's3' for AWS; 'compute', 'storage', 'cloudsql' for GCP). Use the singular awsinspect/gcpinspect tool with action='list-actions' to discover supported services.",
                      "enum": ["account", "acm", "alb", "apigateway", "apprunner", "backup", "bedrock", "cloudfront", "cloudwatchlogs", "cognito", "cost-explorer", "dynamodb", "ebs", "ec2", "ecs", "eks", "elasticache", "kms", "lambda", "msk", "opensearch", "rds", "route53", "s3", "sagemaker", "secretsmanager", "sqs", "vpc", "waf"],
                      "type": "string"
                    }
                  },
                  "required": ["action", "service"],
                  "type": "object"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": ["null", "array"]
              }
            },
            "required": ["session_id", "subs"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hints": {
                "description": "Guidance for the calling agent: what to do next and which tools relate to this result.",
                "properties": {
                  "next_actions": {
                    "description": "Suggested next steps, in order, often as ready-to-run tool calls.",
                    "items": {
                      "description": "One suggested next step.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "related_tools": {
                    "description": "Names of tools that are useful after this result.",
                    "items": {
                      "description": "A tool name.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  }
                },
                "type": ["null", "object"]
              },
              "results": {
                "description": "One entry per sub-request, in request order.",
                "items": {
                  "description": "Result of one AWS sub-request.",
                  "properties": {
                    "action": {
                      "description": "Action the sub-request ran.",
                      "type": "string"
                    },
                    "duration_ms": {
                      "description": "Time the sub-request took, in milliseconds.",
                      "type": "integer"
                    },
                    "error": {
                      "description": "Error message when ok is false.",
