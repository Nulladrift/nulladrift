        {
          "name": "awsinspect",
          "title": "Inspect AWS Infrastructure",
          "description": "INSPECTION: Inspect AWS infrastructure for a deployed project\n⚠️ **PREREQUISITE**: This tool requires a prior deployment ATTEMPT (successful or failed).\nCheck convostatus for hasDeployAttempt=true before calling. Works even after failed deploys to inspect orphaned resources.\n\nInspect deployed AWS resources after a deployment attempt.\nUse this tool when the user asks about the status or details of their deployed infrastructure.\nIt fetches temporary read-only credentials securely and queries the AWS API directly.\n\nRESPONSE TIERS (default is summary for token efficiency):\n- Summary (default): Key fields only (~500 tokens). Set detail=false, raw=false or omit both.\n- Detail: Full metadata for a specific resource. Set detail=true + resource filter.\n- Raw: Complete unprocessed API response. Set raw=true.\n\nREQUIRES: session_id from convoopen response (format: sess_v2_...).\nSupported services: account, acm, alb, apigateway, apprunner, backup, bedrock, cloudfront, cloudwatchlogs, cognito, cost-explorer, dynamodb, ebs, ec2, ecs, eks, elasticache, kms, lambda, msk, opensearch, rds, route53, s3, sagemaker, secretsmanager, sqs, vpc, waf\nFor a specific service's actions, call with action=\"list-actions\".\nMETRICS: Use list-metrics to discover available metrics for a service (no credentials needed). Then use get-metrics to retrieve data (auto-discovers resources). Most services return CloudWatch time-series. KMS returns key health (rotation, state). SecretsManager returns secret health (rotation, last accessed/rotated). Optional filters JSON: {\"hours\":6,\"period\":300}.\nBILLING: Use service=cost-explorer to inspect AWS costs. Actions: get-cost-summary (last 30 days by service, filters: {\"days\":7,\"granularity\":\"DAILY\"}), get-cost-forecast (projected spend through end of month), get-cost-by-tag (costs grouped by tag, filters: {\"tag_key\":\"Environment\",\"days\":30}). Requires ce:GetCostAndUsage and ce:GetCostForecast IAM permissions.\n\nEXAMPLES:\n- awsinspect(session_id=..., service=\"ec2\", action=\"describe-instances\")\n- awsinspect(session_id=..., service=\"cost-explorer\", action=\"get-cost-summary\")\n- awsinspect(session_id=..., service=\"ec2\", action=\"get-metrics\", filters=\"{\\\"hours\\\":6}\")\n- awsinspect(session_id=..., service=\"rds\", action=\"describe-db-instances\", detail=true)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Operation on the service. Examples: 'describe-instances' (ec2), 'list-buckets' (s3), 'list-keys' (kms), 'get-cost-summary' (cost-explorer), 'list-actions' (discovery), 'list-metrics' / 'get-metrics' (CloudWatch).",
                "type": "string"
              },
              "detail": {
                "description": "When true, returns full metadata for a single resource (requires a resource ID in filters). When false (default), returns a summary.",
                "type": "boolean"
              },
              "filters": {
                "description": "Optional JSON-encoded filter object passed through to the underlying AWS API. Examples: '{\"hours\":6}' for metric windows, '{\"days\":7,\"granularity\":\"DAILY\"}' for cost queries.",
                "type": "string"
              },
              "raw": {
                "description": "When true, returns the unprocessed AWS API response. Escape hatch for fields the summarized response doesn't surface.",
                "type": "boolean"
              },
              "service": {
                "description": "AWS service to query. Examples: 'ec2', 'rds', 'vpc', 's3', 'lambda', 'eks', 'ecs', 'cost-explorer'. Use action='list-actions' to discover the supported actions for a service.",
                "enum": ["account", "acm", "alb", "apigateway", "apprunner", "backup", "bedrock", "cloudfront", "cloudwatchlogs", "cognito", "cost-explorer", "dynamodb", "ebs", "ec2", "ecs", "eks", "elasticache", "kms", "lambda", "msk", "opensearch", "rds", "route53", "s3", "sagemaker", "secretsmanager", "sqs", "vpc", "waf"],
                "type": "string"
              },
              "session_id": {
                "description": "Session ID from convoopen — pass back EXACTLY as returned, including the ?token=... suffix (format: sess_v2_*?token=*). The suffix is part of the session credential; never strip it when summarizing. The session must have an AWS deploy attempt before inspect probes will succeed.",
                "pattern": "^sess_v2_[0-9A-Za-z]+\\?token=[0-9a-f]+$",
                "type": "string"
              }
            },
            "required": ["action", "detail", "filters", "raw", "service", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hints": {
                "description": "Guidance for the calling agent: what to do next and which tools relate to this result.",
                "properties": {
                  "next_actions": {
                    "description": "Suggested next steps, in order, often as ready-to-run tool calls.",
                    "items": {
                      "description": "One suggested next step.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "related_tools": {
                    "description": "Names of tools that are useful after this result.",
                    "items": {
                      "description": "A tool name.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  }
                },
                "type": ["null", "object"]
              },
              "result": {
                "description": "The AWS inspect result. A list action returns a summary object (count plus the listed items) when summarized is true; detail and raw actions return the backend result unchanged."
              },
              "summarized": {
                "description": "True when result is a compact summary instead of the full backend response.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
