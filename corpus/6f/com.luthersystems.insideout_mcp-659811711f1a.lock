        },
        {
          "name": "convoopen",
          "title": "Start Design Session",
          "description": "WORKFLOW: Step 1 of 4 - Start infrastructure design conversation\nOpen an InsideOut V2 session and receive the assistant's intro message.\nThe response contains a clean message from Riley (the infrastructure advisor) - display it to the user.\n⚠️ Riley will ask questions - forward these to the user, DO NOT answer on their behalf.\nCRITICAL: This tool returns a session_id in the response metadata. You MUST use this session_id for ALL subsequent tool calls (convoreply, tfgenerate, tfdeploy, etc.).\n⚠️ The session_id includes a ?token=... suffix (format: sess_v2_xxx?token=yyy) which is part of the session credential — without it, downstream tools fall back to a tokenless connect URL that 401s. Always pass session_id verbatim to subsequent tools and to the user; do NOT shorten, paraphrase, or strip the ?token= portion when summarizing the session in chat or in your own scratch notes.\nUse when the user mentions keywords like: 'setup my cloud infra', 'provision infrastructure', 'deploy infra', 'start insideout', 'use insideout', or similar intent to begin infra setup.\n\nOPTIONAL: project_context (string) - General tech stack summary so Riley can skip discovery questions and jump to recommendations. The agent should confirm this with the user before sending. Include whichever apply: language/framework, databases/services, container usage, existing IaC, CI/CD platform, cloud provider, Kubernetes usage, what the project does. Example: 'Next.js 14 + TypeScript, PostgreSQL, Redis, Docker Compose, deployed to AWS ECS, GitHub Actions CI/CD, ~50k MAU'. NEVER include credentials, secrets, API keys, PII, source code, or internal URLs/IPs -- only general metadata summaries useful to a cloud architect agent.\nIMPORTANT: source (string) - You MUST set this to identify which IDE/tool you are. Auto-detect from your environment: 'claude-code', 'codex', 'antigravity', 'kiro', 'vscode', 'web', 'mcp'. If unsure, use the name of your IDE/tool in lowercase. Do NOT omit this — it controls the 'Open {IDE}' button on the credential connect screen.\nOPTIONAL: github_username (string) - GitHub username for deploy commit attribution. Pre-populates the GitHub username field on the connect page.\n💡 TIP: Examine workflow.usage prompt for more context on how to properly use these tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "github_username": {
                "description": "GitHub username used for deploy commit attribution; pre-fills the GitHub username field on the connect screen.",
                "type": "string"
              },
              "project_context": {
                "description": "Optional tech-stack summary so Riley can skip discovery questions (e.g. 'Next.js 14 + Postgres on AWS, ~50k MAU'). No PII, secrets, file paths, or source code — only general metadata useful to a cloud architect.",
                "type": "string"
              },
              "source": {
                "description": "IDE/tool identifier so the connect screen can show the right 'Open {IDE}' button. Use lowercase: 'claude-code', 'codex', 'antigravity', 'kiro', 'cursor', 'vscode', 'windsurf', 'zed', 'aider', 'copilot', 'web', 'mcp'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assistant_message": {
                "description": "Riley's reply, cleaned of internal markers. Show it to the user.",
                "properties": {
                  "text": {
                    "description": "The message text.",
                    "type": "string"
                  }
                },
                "type": ["null", "object"]
              },
              "hints": {
                "description": "Guidance for the calling agent: what to do next and which tools relate to this result.",
                "properties": {
                  "next_actions": {
                    "description": "Suggested next steps, in order, often as ready-to-run tool calls.",
                    "items": {
                      "description": "One suggested next step.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "related_tools": {
                    "description": "Names of tools that are useful after this result.",
                    "items": {
                      "description": "A tool name.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  }
                },
                "type": ["null", "object"]
              },
              "session_id": {
                "description": "Session ID this result belongs to (format sess_v2_*?token=*). Pass it back verbatim to later tools.",
                "type": "string"
              }
            },
