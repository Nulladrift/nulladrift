        {
          "name": "convoreply",
          "title": "Send Message",
          "description": "WORKFLOW: Step 2 of 4 - Continue infrastructure design conversation\nSend a user message to the active InsideOut session and receive the assistant reply.\nThe response contains a clean message from Riley - display it to the user.\n\n⚠️ CRITICAL: DO NOT answer Riley's questions yourself! Forward questions to the user and wait for their response. NEVER fabricate or assume the user's answer, even if you think you know what they would say.\nExamples of questions Riley asks that YOU MUST forward to the user:\n- 'Any questions or tweaks to these details?'\n- 'Ready for the cost estimate?'\n- 'Do you want to change the stack/config?'\n- 'Ready to proceed to Terraform?'\nWhen Riley asks ANY question, STOP and wait for the user's answer!\n\n📋 WORKFLOW PHASES: The typical flow is conversation → tfgenerate → tfdeploy\nWhen terraform_ready=true appears in THIS tool's response, THEN you can call tfgenerate.\n⚠️ DO NOT call tfgenerate until this tool returns! Wait for the response first.\n\n🎯 KEY SIGNALS IN RESPONSE:\n- `[TERRAFORM_READY: true]` → NOW you can call tfgenerate\n- `[[BUTTON_TF_APPLY: ...]]` → Deployment is ready! Ask user if they want to deploy, then use tfdeploy\n- `[[BUTTON_TF_DESTROY: ...]]` → User confirmed destroy intent! Ask user to confirm, then use tfdestroy\n- `[[BUTTON_TF_PLAN: ...]]` → User wants to preview changes! Use tfplan to run a plan, then tfdeploy with plan_id to apply\n\nREQUIRES: session_id from convoopen response (format: sess_v2_...).\nOPTIONAL: timeout (integer) - seconds to wait for response. For Cursor, use 50 (default). Max 55.\nOPTIONAL: project_context (string) - Only pass genuinely NEW project details the user shares after convoopen. Do NOT resend context already provided in convoopen — Riley remembers it. Do NOT scan files or directories to gather this — only use what the user explicitly tells you. Example: user reveals a new constraint like 'we also need HIPAA compliance' mid-conversation.\n💡 TIP: Use convostatus to check progress anytime. Examine workflow.usage prompt for more guidance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "project_context": {
                "description": "Only NEW project details revealed after convoopen (e.g. user mentions a new constraint mid-conversation). Don't re-send context already provided in convoopen. No PII or secrets.",
                "type": "string"
              },
              "retry": {
                "description": "When true, re-send the most recent user turn instead of submitting a new one.",
                "type": ["null", "boolean"]
              },
              "session_id": {
                "description": "Session ID from convoopen — pass back EXACTLY as returned, including the ?token=... suffix (format: sess_v2_*?token=*). The suffix is part of the session credential; never strip it when summarizing.",
                "pattern": "^sess_v2_[0-9A-Za-z]+\\?token=[0-9a-f]+$",
                "type": "string"
              },
              "text": {
                "description": "User message to send to Riley. Forward verbatim what the user said — do not summarize or rewrite.",
                "maxLength": 20000,
                "minLength": 1,
                "type": "string"
              },
              "timeout": {
                "description": "Max seconds to wait for Riley's response. Default 50, max 55.",
                "maximum": 55,
                "minimum": 1,
                "type": ["null", "integer"]
              }
            },
            "required": ["session_id", "text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "assistant_message": {
                "description": "Riley's reply, cleaned of internal markers. Show it to the user.",
