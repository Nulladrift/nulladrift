        {
          "name": "convoinspect",
          "title": "Inspect Session Transcript",
          "description": "INSPECTION: View a session's conversation transcript and metadata\nReturns the full message history (user / assistant / tool turns) plus the session's meta — workflow step, cloud, deployment status, drift state.\n\nThis is the transcript-reader companion to the other read tools — combine it with:\n  • `convostatus` for the live stack / config / pricing\n  • `tfruns` for deployment history (apply / destroy / plan / drift)\n  • `stackversions` for the stack-version ladder\n\nUse it when a user asks 'what did I say earlier?' or you need to retrace why the session ended up where it did. Read-only; never mutates session state.\n\nREQUIRES: session_id (format: sess_v2_...).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "session_id": {
                "description": "Session ID from convoopen — pass back EXACTLY as returned, including the ?token=... suffix (format: sess_v2_*?token=*). The suffix is part of the session credential; never strip it when summarizing.",
                "pattern": "^sess_v2_[0-9A-Za-z]+\\?token=[0-9a-f]+$",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "createdAt": {
                "description": "Session creation time as a Unix timestamp in milliseconds."
              },
              "hints": {
                "description": "Guidance for the calling agent: what to do next and which tools relate to this result.",
                "properties": {
                  "next_actions": {
                    "description": "Suggested next steps, in order, often as ready-to-run tool calls.",
                    "items": {
                      "description": "One suggested next step.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "related_tools": {
                    "description": "Names of tools that are useful after this result.",
                    "items": {
                      "description": "A tool name.",
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  }
                },
                "type": ["null", "object"]
              },
              "id": {
                "description": "Session ID (without the token suffix).",
                "type": "string"
              },
