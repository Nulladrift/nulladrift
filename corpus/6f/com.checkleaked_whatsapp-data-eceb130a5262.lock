        {
          "name": "whatsapp_number_lookup",
          "title": "WhatsApp Number Lookup",
          "description": "Look up detailed WhatsApp information for a phone number. Returns profile data, about text, business profile, picture history, and optional enrichments like Telegram, Google results, data leak checks, LinkedIn profiles matched by phone, carrier info, AI face analysis, and reverse image search. x402 price: $0.02 USDC per lookup; enrichments add includeTelegram +$0.005, includeCarrier +$0.005, includeGoogle +$0.01, includeFaceAnalysis +$0.03, includeReverseImageSearch +$0.03, includeLeakCheckPro +$0.03, includeFullAiReport +$0.05.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "includeCarrier": {
                "default": false,
                "description": "Include phone carrier/operator information",
                "type": "boolean"
              },
              "includeFaceAnalysis": {
                "default": false,
                "description": "Run AI face analysis on the profile picture",
                "type": "boolean"
              },
              "includeFullAiReport": {
                "default": false,
                "description": "Generate a comprehensive AI report combining all data sources",
                "type": "boolean"
              },
              "includeGoogle": {
                "default": false,
                "description": "Include Google search results for the number",
                "type": "boolean"
              },
              "includeLeakCheckPro": {
                "default": false,
                "description": "Include data leak check results from LeakCheck Pro",
                "type": "boolean"
              },
              "includeReverseImageSearch": {
                "default": false,
                "description": "Run reverse image search on the profile picture",
                "type": "boolean"
              },
              "includeTelegram": {
                "default": false,
                "description": "Include Telegram account information",
                "type": "boolean"
              },
              "linkedin": {
                "default": false,
                "description": "Adds up to 3 LinkedIn profiles matched by phone",
                "type": "boolean"
              },
              "phoneNumber": {
                "description": "Phone number in international format (e.g. \"59898297150\" or \"+598 98 297 150\"). Country code is required.",
                "type": "string"
              }
            },
            "required": ["phoneNumber"],
