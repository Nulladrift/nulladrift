        {
          "name": "whatsapp_phone_search",
          "title": "Advanced WhatsApp Search",
          "description": "Advanced search across the WhatsApp phone numbers database. Supports text search, country filtering, business status, profile picture presence, date range filtering, and AI face analysis attributes (gender, age, ethnicity, glasses, beard, tags). x402 price: $0.01 USDC per call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Filter business numbers by address substring (case-insensitive), e.g. \"Montevideo\".",
                "type": "string"
              },
              "categories": {
                "description": "Comma-separated WhatsApp business category ids (max 25), e.g. \"1015,1020\". Ids come from GET /business-categories/autocomplete.",
                "type": "string"
              },
              "categoriesMode": {
                "description": "How to combine the category ids: \"any\" (default, at least one) or \"all\" (every one)",
                "enum": ["any", "all"],
                "type": "string"
              },
              "countryCode": {
                "description": "Filter by ISO country code (e.g. \"US\"). Comma-separated for multiple.",
                "type": "string"
              },
              "dateFrom": {
                "description": "Start date filter (ISO 8601, e.g. \"2025-01-01\")",
                "type": "string"
              },
              "dateTo": {
                "description": "End date filter (ISO 8601)",
                "type": "string"
              },
              "domain": {
                "description": "Filter business numbers by website host (e.g. \"shoppex.io\"). Exact, normalized match on the denormalized businessDomain field.",
                "type": "string"
              },
              "email": {
                "description": "Filter business numbers by email substring (case-insensitive), e.g. \"@shoppex.io\".",
                "type": "string"
              },
              "faceEthnicity": {
                "description": "Filter by detected ethnicity",
                "type": "string"
              },
              "faceGender": {
                "description": "Filter by detected gender in profile picture",
                "enum": ["male", "female"],
                "type": "string"
              },
              "faceHasBeard": {
                "description": "Filter by beard detection",
                "enum": ["true", "false"],
                "type": "string"
              },
              "faceHasGlasses": {
                "description": "Filter by glasses detection",
                "enum": ["true", "false"],
                "type": "string"
              },
              "faceMaxAge": {
                "description": "Maximum detected age",
                "maximum": 120,
                "type": "integer"
              },
              "faceMinAge": {
                "description": "Minimum detected age",
                "minimum": 0,
                "type": "integer"
              },
              "faceTags": {
                "description": "Comma-separated face tags to filter by",
                "type": "string"
              },
              "hasAddress": {
                "description": "Only businesses that have (or lack) an address",
                "enum": ["true", "false"],
                "type": "string"
              },
              "hasEmail": {
                "description": "Only businesses that have (or lack) an email",
                "enum": ["true", "false"],
                "type": "string"
              },
              "hasFaceAnalysis": {
                "description": "Filter entries that have/lack face analysis data",
                "enum": ["true", "false"],
                "type": "string"
              },
              "hasProfilePic": {
                "description": "Filter by profile picture presence",
                "enum": ["true", "false"],
                "type": "string"
              },
              "hasUsername": {
                "description": "Only numbers that have (or lack) a WhatsApp username",
                "enum": ["true", "false"],
                "type": "string"
              },
              "hasWebsite": {
                "description": "Only businesses that have (or lack) a website",
                "enum": ["true", "false"],
                "type": "string"
              },
              "isBusiness": {
                "description": "Filter by WhatsApp Business accounts",
                "enum": ["true", "false"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page (max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "number": {
                "description": "Filter by specific phone number or prefix",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number",
                "minimum": 1,
                "type": "integer"
