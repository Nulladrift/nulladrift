        {
          "name": "whatsapp_phone_pagination",
          "title": "Browse WhatsApp Numbers",
          "description": "Browse the WhatsApp phone numbers database with pagination. Returns paginated results sorted by date (newest first) or by number. Supports basic text search, country code filtering, and date-range filtering (dateFrom / dateTo accept ISO 8601 dates, e.g. \"2024-01-01\"). x402 price: $0.01 USDC per call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Filter by ISO 3166-1 alpha-2 country code (e.g. \"US\", \"GB\", \"BR\")",
                "type": "string"
              },
              "dateFrom": {
                "description": "Return only entries checked on or after this date. ISO 8601 format, e.g. \"2024-01-01\" or \"2024-01-01T00:00:00Z\".",
                "type": "string"
              },
              "dateTo": {
                "description": "Return only entries checked on or before this date. ISO 8601 format, e.g. \"2024-12-31\" or \"2024-12-31T23:59:59Z\".",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page (max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page number (starts at 1)",
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Text search query (searches across phone numbers and profile data)",
                "type": "string"
              },
              "sortBy": {
                "default": "date",
                "description": "Field to sort by",
                "enum": ["date", "number"],
                "type": "string"
              },
              "sortOrder": {
                "default": "desc",
                "description": "Sort direction",
                "enum": ["asc", "desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
