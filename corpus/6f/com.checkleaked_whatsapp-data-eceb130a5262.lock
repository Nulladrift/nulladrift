                "default": false,
                "description": "Return full DB record for each found number (default: basic info only)",
                "type": "boolean"
              },
              "numbers": {
                "description": "Array of phone numbers to check (with country code). Max 1000.",
                "items": {
                  "type": "string"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["numbers"],
            "type": "object"
