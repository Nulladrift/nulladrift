{
  "lockfileVersion": 2,
  "subjects": {
    "com.kidseventsthisweek/kids-events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kidseventsthisweek.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "KidsEventsThisWeek",
        "title": "KidsEventsThisWeek.com",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KidsEventsThisWeek.com lists local kids and family events across US cities, plus \"Best Around\" guides to parks, playgrounds and other places to take children. It is written for parents planning outings. The server offers three read-only tools: a search of events in a city, the details of one event, and a list of place guides for a city. Results are short listings, and each includes a link to kidseventsthisweek.com, which has the full details.",
      "tools": [
        {
          "name": "find_kids_events",
          "title": "Find kids events",
          "description": "Search upcoming family and kids events near a US city on KidsEventsThisWeek.com: library story times, museum days, camps, festivals, church kids programs and more. Useful for finding what to do with children this week, this weekend or on a given day. Takes a city and state, or a 5-digit US ZIP code (if both are given the ZIP is used; a ZIP is matched to the nearest city we cover). Returns at most 10 events, closest to the city first (0-5 miles, then 5-15, then farther) and soonest first within each distance, spread across the requested days, each with the date, start time, venue, price (free or paid), age range when known, a one-line summary and a link to the event page. Dates default to the next 7 days and the window never exceeds 31 days. Only events that start inside the window are returned.",
          "inputSchema": {
            "properties": {
              "age_years": {
                "description": "Age of the child in years. Keeps events that fit that age and events with no stated age range.",
                "maximum": 17,
                "minimum": 0,
                "type": "integer"
              },
              "category": {
                "description": "Optional topic filter: storytime (library story times), toddlers (ages 0-4), camps, church (church kids programs), or a holiday (halloween, christmas, easter, fourth-of-july).",
                "enum": ["toddlers", "camps", "church", "halloween", "christmas", "easter", "fourth-of-july", "storytime"],
                "type": "string"
              },
              "city": {
                "description": "City name, for example \"Plano\" or \"San Antonio\". Give city and state, or a zip.",
                "maxLength": 80,
                "type": "string"
              },
              "end_date": {
                "description": "Last day to search, YYYY-MM-DD. Default 6 days after the start date. The window is capped at 31 days.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "free_only": {
                "default": false,
                "description": "Set true to return only free events.",
                "type": "boolean"
              },
              "radius_miles": {
                "default": 25,
                "description": "How far from the city center to look, in miles. Default 25, maximum 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "start_date": {
                "description": "First day to search, YYYY-MM-DD, in the city's local time. Default today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "state": {
                "description": "US state as a two-letter code or full name, for example \"TX\" or \"Texas\".",
                "maxLength": 40,
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code, for example \"75034\". An alternative to city and state.",
                "pattern": "^\\d{5}$",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find kids events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:afdf1766f9f0d8d0ddcce50e9bf0fa402fd2bc0d2afe54f7227d3c0f66d7f8f1"
        },
        {
          "name": "get_kids_event",
          "title": "Get one kids event",
          "description": "Get the details of one event from KidsEventsThisWeek.com by its id, which is the last part of the event link (the text after /event/). Returns the date and time, venue, full address, organizer, price, age range, a short summary and the link to the event page, which has the full description and registration details.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The event id or slug (the text after /event/ in the event link), or the full event page link.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one kids event"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a8a1a35c2daef0e40faec7728033097e307cc6e512cadea32586fcc7d2ed892"
        },
        {
          "name": "list_best_around_guides",
          "title": "List best-around guides",
          "description": "List the \"Best Around\" guides for a US city on KidsEventsThisWeek.com: hand-picked guides to local parks, playgrounds, splash pads, museums, free Christmas lights and similar places for families. Useful for finding places to go in general rather than events on a given week. Returns the guide title and link for each, up to 12.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name, for example \"Frisco\".",
                "maxLength": 80,
                "type": "string"
              },
              "state": {
                "description": "US state as a two-letter code or full name.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["city", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List best-around guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8afcfe20832a7d897ca77ba17d9638e3d1aad559659216be9bc43ab75397720"
        }
      ],
      "digest": "sha256:00235e6f6dabd07c5061d673cabcbca8d8d953c052ab8361c803b834e5f12a98"
    }
  }
}
