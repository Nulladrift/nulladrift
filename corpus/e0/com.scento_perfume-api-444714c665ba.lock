        {
          "name": "occasion-edit",
          "title": "Pick perfumes for an occasion",
          "description": "Use this when the user asks which perfume, fragrance or cologne to wear for one occasion, season or climate: wedding, office, date night, night out, weekend, everyday, gym or sport (workout), summer days, cold weather, first impressions, long-lasting or under-the-radar. Returns a short edit of perfumes with a line on why each fits and a scento.com link for each, in the user's language. The occasion is a fixed list, so pick the nearest value; omit gender_lean unless the user states one. For several occasions call it once per occasion. Don't use for a collection built around perfumes the user already loves (wardrobe-composer) or for similar scents (scent-neighbours).",
          "inputSchema": {
            "properties": {
              "gender_lean": {
                "description": "Omit unless the user states one (\"cologne\" or \"perfume\" alone is not a request). Lean read from the materials by convention: \"feminine\", \"masculine\" or \"shared\". Example: \"masculine\" when the user asks for a men's fragrance. It reorders the edit and never excludes a perfume.",
                "enum": ["feminine", "masculine", "shared"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the scento.com links and labels; answers stay in English. Use the language the user writes in, for example \"de\" (German), \"fr\" (French), \"es\" (Spanish) or \"it\" (Italian). Default \"en\".",
                "enum": ["en", "de", "fr", "es", "it", "ro", "el", "hu", "cs", "pl"],
                "type": "string"
              },
              "occasion": {
                "description": "The occasion, season or climate. Examples: \"wedding\" for a wedding guest, \"office\" for work, \"weekend\" for relaxed days, \"gym\" for sport, \"date-night\" for an evening out for two, \"summer-days\" for heat, \"cold-weather\" for winter. A summer wedding is \"wedding\".",
                "enum": ["office", "date-night", "night-out", "everyday", "summer-days", "cold-weather", "workout", "wedding", "weekend", "first-impressions", "long-lasting", "under-the-radar", "gym", "sport"],
                "type": "string"
              }
            },
            "required": ["occasion"],
            "type": "object"
