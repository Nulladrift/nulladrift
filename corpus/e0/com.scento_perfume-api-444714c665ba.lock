        {
          "name": "material-match",
          "title": "Find perfumes by note",
          "description": "Use this when the user wants perfumes, fragrances or colognes that contain specific notes or raw materials, optionally in the top, heart or base (synonyms: with notes of, built on, smells of, containing; for example vanilla and tobacco in the base). Returns the perfumes that have every material given, with house, where each sits in the pyramid and scento.com links in the user's language. Don't use to explain one material (note-portrait), to find perfumes like a named perfume (scent-neighbours) or for a mood or occasion (occasion-edit).",
          "inputSchema": {
            "properties": {
              "continuation": {
                "description": "The \"continuation\" value from a previous answer, passed back unchanged to get the next part of the list.",
                "type": "string"
              },
              "family": {
                "description": "Optional Scento family to stay within, for example “Wood & Root”.",
                "maxLength": 60,
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of the scento.com links and labels; answers stay in English. Use the language the user writes in, for example \"de\" (German), \"fr\" (French), \"es\" (Spanish) or \"it\" (Italian). Default \"en\".",
                "enum": ["en", "de", "fr", "es", "it", "ro", "el", "hu", "cs", "pl"],
                "type": "string"
              },
              "materials": {
                "description": "One to four notes or raw materials that must all be present. Examples: [\"vanilla\", \"tobacco\"] or [\"oud\"].",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
