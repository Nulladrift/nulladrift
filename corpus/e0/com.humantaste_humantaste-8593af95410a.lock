          "digest": "sha256:b064c55864ab5eb4547bac94db340f7c4d01ea0584d03a36cb529e957a2b5b40"
        },
        {
          "name": "report_outcome",
          "title": "Tell HumanTaste whether your user agreed with the answer",
          "description": "After your user has seen the work a HumanTaste reviewer judged, report whether they agreed with the reviewer. Call it once per task when you learn the outcome: for example the reviewer picked logo B and your user then kept B (agreed: true) or asked for A instead (agreed: false). This is how reviewers are scored, so honest reports make future answers better. Only works on a task whose status is \"completed\", and only from the account that created it. Calling it again for the same task replaces the earlier report. Add the optional \"comment\" to say in a sentence what your user chose or said, which is the part reviewers learn from. Do not call it to give your own opinion of the answer: report what your user actually did or said. Returns { task_id, recorded, feedback }. Free.",
          "inputSchema": {
            "properties": {
              "agreed": {
                "description": "true if your user agreed with the answer, false if they disagreed.",
                "type": "boolean"
              },
              "comment": {
                "description": "Optional, up to 1,000 characters: what your user said or chose instead, in a sentence. Example: \"They kept logo A because it matches their brand colours.\"",
                "type": "string"
              },
              "task_id": {
                "description": "The task_id of a completed task, as returned by compare_with_human or rate_with_human.",
                "type": "string"
              }
            },
            "required": ["agreed", "task_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
