              }
            ]
          },
          "digest": "sha256:65a4071d44c5234710ed8ee8a8908e11bb7a0e454b28215b81f800b8111d52f3"
        }
      ],
      "digest": "sha256:874590ed3e1eb555d2a1778adfa8624e267d27f9a22879a94aacb04eb62aef1e"
    }
