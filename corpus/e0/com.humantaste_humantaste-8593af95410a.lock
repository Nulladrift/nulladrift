      "serverInfo": {
        "name": "humantaste",
        "title": "HumanTaste",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HumanTaste gives you a verified human reviewer to ask, so you do not have to guess or interrupt your user. Whenever you must choose between two candidates you produced (headlines, names, copy, images, logos, layouts, audio, video), or need to know whether an output reads or looks right to a person, and the answer is a matter of taste or perception rather than fact, call compare_with_human or rate_with_human before you deliver. Do not use it for facts, for code correctness, or for choices that depend on the personal preference of your own user. A human answers in minutes to hours. If a call returns status \"pending\", deliver your best choice, tell the user a human review is in progress and give its task_id, then check get_human_feedback later. When your user later reacts to work a reviewer judged, call report_outcome to say whether they agreed. Each task costs a few cents of prepaid credit; get_account shows the balance. Calling a tool needs authorization: sign in with OAuth when your client offers it, or send an API key as \"Authorization: Bearer <key>\" (POST /v1/signup returns one).",
      "tools": [
        {
          "name": "compare_with_human",
          "title": "Ask a human which of two options is better",
          "description": "Shows two options (texts, images, videos, audio clips or web pages) side by side to a verified human and returns which one they prefer (\"A\", \"B\" or \"tie\") with a short reason. Use it when a choice depends on taste, clarity or feel and you want a real person to decide: two logo drafts, two headlines, two voice-overs, two page designs. A is the first option, B the second; the human sees them in random order. If you have a single item to assess, use rate_with_human instead. Put what the person should judge in \"question\", the two candidates in \"a\" and \"b\" (same kinds of content as rate_with_human; change only what you want judged between them), and the audience or goal in \"context\". Returns { task_id, status, result: { choice, winner_index, comment } }. A person answers in minutes to hours: when status is \"pending\", do not wait; keep working with your own best choice and check get_human_feedback once before you deliver. Costs a few cents of prepaid credit (see get_account). A task nobody answers within a day expires and is refunded in full. Every call creates a new paid task, so do not repeat a call to check on an answer (use get_human_feedback); send the same pair again only when you want a second person's opinion. You can have several tasks open at once, up to your credit balance.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "Option A. Give \"text\" for writing, a public https \"url\" for media or web pages, or \"data_base64\" with \"mime_type\" for a local file.",
                "properties": {
                  "data_base64": {
                    "description": "Base64 file contents, as an alternative to \"url\" for image, video or audio.",
                    "type": "string"
                  },
                  "label": {
                    "description": "Optional short caption shown to the human.",
                    "type": "string"
                  },
                  "mime_type": {
                    "description": "Required with data_base64, for example \"image/png\" or \"image/svg+xml\".",
                    "type": "string"
                  },
                  "text": {
                    "description": "The text itself, when type is \"text\". Up to 20,000 characters.",
                    "type": "string"
                  },
                  "type": {
                    "description": "What kind of thing the human will look at.",
                    "enum": ["text", "image", "video", "audio", "link"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Public https URL of the image, video, audio file or web page.",
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "b": {
                "description": "Option B. Give \"text\" for writing, a public https \"url\" for media or web pages, or \"data_base64\" with \"mime_type\" for a local file.",
                "properties": {
                  "data_base64": {
                    "description": "Base64 file contents, as an alternative to \"url\" for image, video or audio.",
                    "type": "string"
                  },
                  "label": {
                    "description": "Optional short caption shown to the human.",
                    "type": "string"
                  },
                  "mime_type": {
                    "description": "Required with data_base64, for example \"image/png\" or \"image/svg+xml\".",
                    "type": "string"
                  },
                  "text": {
                    "description": "The text itself, when type is \"text\". Up to 20,000 characters.",
                    "type": "string"
                  },
                  "type": {
                    "description": "What kind of thing the human will look at.",
                    "enum": ["text", "image", "video", "audio", "link"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Public https URL of the image, video, audio file or web page.",
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "context": {
                "description": "Optional background the human needs: audience, goal, constraints.",
                "type": "string"
              },
              "question": {
                "description": "What the human should judge, in plain words. Example: \"Which logo looks more trustworthy for a bank?\"",
                "type": "string"
              },
              "wait_seconds": {
                "description": "Seconds to wait for the human before returning (0-55, default 10). The default catches an answer that comes almost at once without holding you up. If the answer is not in yet, the result has status \"pending\" and a task_id to check later with get_human_feedback.",
                "type": "number"
              }
            },
            "required": ["a", "b", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tasks"],
                "type": "oauth2"
              }
