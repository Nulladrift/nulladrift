          },
          "digest": "sha256:67cb8565081bf7fa3db028e50326d6325e34e9bf6b6adfe84c2b7ddcab97e410"
        },
        {
          "name": "get_account",
          "title": "Check credit balance and prices",
          "description": "Returns the prepaid credit balance of the HumanTaste account behind the current API key, and the current price of each task type. Call it before sending tasks to check you can afford them, or after a tool returned \"insufficient_credits\" to tell your user how much is left. Takes no arguments. Returns { id, email, anonymous, balance_cents, balance, pricing: { rate_cents, compare_cents, min_top_up_cents, refund_policy } }; amounts are in US cents. Read-only and free: it never creates a task or spends credit.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tasks"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:b18655eabb83b8cfef2285302a5c70cf3a947a8cc11d9a33cc5d59be503e0f57"
        },
        {
          "name": "get_human_feedback",
          "title": "Check a task you already sent",
          "description": "Returns the current state of a task you created earlier with compare_with_human or rate_with_human, and its result once a human has answered. Call it when a task came back \"pending\" and you are ready to use the answer. Status is one of: \"pending\" (waiting in the queue), \"in_review\" (a person is looking at it), \"completed\" (read \"result\"), \"expired\" or \"canceled\" (nobody answered; the task was refunded). Pass \"task_id\" exactly as the creating tool returned it. It returns the current state at once; set \"wait_seconds\" only when you have nothing else to do and want to hold on for an answer. Read-only and free: it never creates a task or spends credit.",
          "inputSchema": {
            "properties": {
              "task_id": {
                "description": "The task_id returned when the task was created, for example \"task_1165d868f6f34310cb87\".",
                "type": "string"
              },
              "wait_seconds": {
                "description": "Seconds to hold the request open for an answer (0-55, default 0: return the current state at once). Raise it only when you have nothing else to do and are about to deliver.",
                "type": "number"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["tasks"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8c6f7f4745edd40093beb6acb83b7cd24e3ce44c29938e28f9d9710dc1a9cb57"
        },
        {
          "name": "rate_with_human",
          "title": "Ask a human to rate one piece of work",
          "description": "Shows one piece of work (text, image, video, audio or web page) to a verified human and returns a score from 1 (poor) to 5 (excellent) with written feedback on what works and what to fix. Use it to check whether something you produced is actually good before you deliver it: an email that must sound natural, a landing page, a generated image or clip. If you have two candidates and need to choose, use compare_with_human instead. Put what the person should judge in \"question\" (one specific thing works best), the work itself in \"item\" (text inline; an image, video or audio clip as a public https URL or as base64 with its MIME type), and the audience or goal in \"context\". \"wait_seconds\" sets how long this call waits for a quick answer before returning \"pending\" (10 by default). Returns { task_id, status, result: { score, max_score, comment } }. A person answers in minutes to hours: when status is \"pending\", do not wait; keep working with your own best choice and check get_human_feedback once before you deliver. Costs a few cents of prepaid credit (see get_account); an unanswered task is refunded.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Optional background the human needs: audience, goal, constraints.",
                "type": "string"
              },
              "item": {
                "description": "The work to rate. Give \"text\" for writing, a public https \"url\" for media or web pages, or \"data_base64\" with \"mime_type\" for a local file.",
                "properties": {
                  "data_base64": {
                    "description": "Base64 file contents, as an alternative to \"url\" for image, video or audio.",
                    "type": "string"
                  },
                  "label": {
                    "description": "Optional short caption shown to the human.",
                    "type": "string"
                  },
                  "mime_type": {
                    "description": "Required with data_base64, for example \"image/png\" or \"image/svg+xml\".",
                    "type": "string"
                  },
                  "text": {
                    "description": "The text itself, when type is \"text\". Up to 20,000 characters.",
                    "type": "string"
                  },
                  "type": {
                    "description": "What kind of thing the human will look at.",
                    "enum": ["text", "image", "video", "audio", "link"],
                    "type": "string"
                  },
                  "url": {
                    "description": "Public https URL of the image, video, audio file or web page.",
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "question": {
                "description": "What the human should judge. Example: \"Is this product description clear and convincing?\"",
                "type": "string"
              },
              "wait_seconds": {
                "description": "Seconds to wait for the human before returning (0-55, default 10). The default catches an answer that comes almost at once without holding you up. If the answer is not in yet, the result has status \"pending\" and a task_id to check later with get_human_feedback.",
                "type": "number"
              }
            },
            "required": ["item", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
