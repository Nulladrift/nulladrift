        {
          "name": "phoenix_relink_check",
          "description": "Detect a phoenix / rebrand relink that exact-match screeners miss. Given a principal or entity name (e.g. a debarred contractor, an excluded provider, or an OFAC-listed party), this fuzzy-relinks it to NEWLY-FORMED Secretary-of-State business entities that share the name AND a second independent signal (principal address or named registered agent), while filtering out shared commercial registered-agent addresses. Returns NON-CONCLUSORY review flags with the full evidence chain and primary-source links — a research lead for human diligence, never a determination of wrongdoing. Use during M&A diligence, vendor/counterparty onboarding, or compliance screening.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Principal or entity name to check for phoenix relinks (e.g. a debarred/excluded/sanctioned party).",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
