      "tools": [
        {
          "name": "get_offense_estimates",
          "description": "Get NIBRS offense-level estimates (person or property crimes).\n\n    Returns offense-level data (as opposed to incident-level). An incident\n    may involve multiple offenses, so offense counts are typically higher\n    than incident counts.\n\n    Args:\n        crime_category: 'person' for violent crimes or 'property' for\n            property crimes. Default: 'person'.\n        indicator: Filter by offense type.\n        domain: Filter by analysis domain.\n        limit: Maximum results to return (default 50, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "crime_category": {
                "default": "person",
                "title": "Crime Category",
                "type": "string"
              },
              "domain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Domain"
              },
              "indicator": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Indicator"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              }
            },
            "title": "get_offense_estimatesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_offense_estimatesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d0435cf077cf17b58fb24aa43523eaa23488a648f7258665c9ece2d61b0df8b1"
        },
        {
          "name": "get_property_incident_estimates",
          "description": "Get national estimates of property crime incidents from NIBRS.\n\n    Returns weighted national estimates of crimes against property\n    including burglary, larceny-theft, motor vehicle theft, arson,\n    and fraud. Data includes breakdowns by location type, time of day,\n    and clearance status.\n\n    Args:\n        indicator: Filter by offense type (e.g. 'Burglary/Breaking & Entering',\n            'Larceny/Theft Offenses', 'Motor Vehicle Theft',\n            'NIBRS crimes against property (Total)').\n        domain: Filter by analysis domain (e.g. 'Incident count',\n            'Location type', 'Clearance', 'Time of day- Incident time').\n        limit: Maximum results to return (default 50, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "domain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Domain"
              },
              "indicator": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Indicator"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              }
            },
            "title": "get_property_incident_estimatesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_property_incident_estimatesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e6f71cb6211e1549a56243205c83e3917ae683a962062d0e187b5ed59f0c51b"
        },
        {
          "name": "get_victimization_data",
          "description": "Get NIBRS victimization counts and percentages.\n\n    Returns victim-level data from NIBRS including demographics of\n    victims, victim-offender relationships, and injury types. Useful\n    for understanding who is affected by crime and in what ways.\n\n    Args:\n        indicator: Filter by offense type (e.g. 'Aggravated Assault',\n            'NIBRS crimes against persons (Total)').\n        domain: Filter by analysis domain (e.g. 'Victim-offender relationship',\n            'Injury', 'Age', 'Sex', 'Race').\n        limit: Maximum results to return (default 50, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "domain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Domain"
              },
              "indicator": {
