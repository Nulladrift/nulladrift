        "type": "http",
        "url": "https://mcp.flashift.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Flashift",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Flashift MCP Server provides cryptocurrency exchange aggregation services. Use get_providers to see available partners, get_currencies to list and filter supported coins and networks, get_estimated_amount to quote swap rates across exchanges, create_transaction to execute a swap, and get_transaction_info to monitor swap status in real time.",
      "tools": [
        {
          "name": "create_transaction",
          "title": "Create Transaction",
          "description": "Create a new cryptocurrency exchange/swap transaction on Flashift.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount of source currency to exchange (greater than 0).",
                "type": "number"
              },
              "fixed": {
                "description": "Whether the rate is fixed (true) or floating (false).",
                "type": "boolean"
              },
              "network_from": {
                "description": "Source network (e.g. btc, eth).",
                "type": "string"
              },
              "network_to": {
                "description": "Target network (e.g. trc20, eth).",
                "type": "string"
              },
              "provider_name": {
                "description": "Name of the exchange provider chosen from get_estimated_amount (e.g. changenow).",
                "type": "string"
              },
              "symbol_from": {
                "description": "Source currency symbol (e.g. btc, eth).",
                "type": "string"
              },
              "symbol_to": {
                "description": "Target currency symbol (e.g. usdt, btc).",
                "type": "string"
              },
              "to_address": {
                "description": "Destination wallet address where swapped funds will be received.",
                "type": "string"
              },
              "to_extra_id": {
                "description": "Memo, destination tag, or extra ID if required by the target currency/network (e.g. XRP, TON, XLM).",
                "type": "string"
              },
              "user_id": {
                "description": "Optional affiliate or user ID for tracking the transaction.",
                "type": "string"
              }
            },
            "required": ["amount", "fixed", "network_from", "network_to", "provider_name", "symbol_from", "symbol_to", "to_address"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f99989ce361b4457c6f948aabf8d91a7f30f96ba0a004fe0b19fbc6cf6065a5"
        },
        {
          "name": "get_currencies",
          "title": "Get Currencies",
          "description": "Get supported cryptocurrencies and networks on Flashift. Optionally filter by symbol, network, or search keyword.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "description": "Maximum number of items to return (default 50).",
                "type": "integer"
              },
              "network": {
                "description": "Filter by network (e.g. eth, bsc, trx, btc).",
                "type": "string"
              },
              "search": {
                "description": "Search query matching symbol, fullname, or network.",
                "type": "string"
              },
              "symbol": {
                "description": "Filter by currency symbol (e.g. btc, eth, usdt).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0d775b5e0d9f4acd6e00e59da6b1982b4485122bd93a9e9d5ee77c16dba77e7"
        },
        {
          "name": "get_estimated_amount",
          "title": "Get Estimated Amount",
          "description": "Get estimated exchange amounts, best rates, min/max limits, and available providers for swapping from one cryptocurrency to another.\n\n# AI Tags\n\n## Introduction\n\nFlashift's AI Tags play a crucial role in enhancing the user experience by providing intelligent insights and recommendations within the API. These tags leverage advanced AI algorithms to analyze various parameters such as KYC levels, transaction rates, and user feedback, enabling users to make informed decisions when selecting exchange services. By integrating AI Tags into the API, Flashift ensures that users can access the most competitive rates and trustworthy services, ultimately leading to a more efficient and reliable transaction process. This not only simplifies the decision-making process for users but also enhances the overall functionality and appeal of the Flashift platform.\n\n\n| AI Tag        | Description                                                                 |\n|---------------|-----------------------------------------------------------------------------|\n| AI Best Rate  | Flashift’s AI system analyzes user feedback and exchange features to identify the most accurate and reliable rates, helping users choose the provider with the best rate and highest trustworthiness for a more predictable exchange experience.     |\n| Recommended   | Flashift's AI system recommends the exchange service by analyzing various features such as exchange rates, KYC levels, and transaction speed.      |\n| Best Rate     | Flashift finds an exchange service that currently offers the most competitive transaction rate.     |\n| Best in KYC   | Flashift's cutting-edge AI system identifies an exchange service with the lowest KYC level compared to the others on the list.    |",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Amount of source currency to exchange (greater than 0).",
                "type": "number"
              },
              "exchange_list": {
                "description": "Optional comma-separated list of preferred provider names (e.g. \"changenow\").",
                "type": "string"
              },
              "network_from": {
                "description": "Source network (e.g. btc, eth, trx).",
                "type": "string"
              },
              "network_to": {
                "description": "Target network (e.g. trc20, eth, sol).",
                "type": "string"
              },
              "symbol_from": {
                "description": "Source currency symbol (e.g. btc, eth, usdt).",
                "type": "string"
              },
              "symbol_to": {
                "description": "Target currency symbol (e.g. usdt, btc, sol).",
                "type": "string"
              },
              "type": {
                "description": "Rate type: \"float\" (floating rate) or \"fixed\" (fixed rate). Default evaluates both.",
                "enum": ["float", "fixed"],
                "type": "string"
              }
            },
            "required": ["amount", "network_from", "network_to", "symbol_from", "symbol_to"],
            "type": "object"
          },
          "annotations": {},
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:984b5e74cc203f405e0ceba563a31d9fe670a395a064eafaeec36d3ab445907d"
        },
