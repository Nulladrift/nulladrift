        {
          "name": "get_invoice",
          "description": "Request a payment invoice for any SqueezeOS endpoint. Returns destination address, amount, and payment_options for XRPL (RLUSD or USDC), Xahau (native XAH), Base (USDC), or Solana (USDC-SPL). Pass currency='USDC' and chain='solana' for Solana; pass asset='XAH' (or chain='xahau') for the Xahau rail. Xahau invoices for third-party endpoints also return fee_required/fee_amount/fee_pay_to/fee_memo_hex: a flat 0.01 XAH facilitator fee paid as a second Xahau Payment (SML endpoints are fee-exempt; XRPL invoices for third-party endpoints likewise bind a flat 0.01 facilitator fee in the invoice's asset, from the first settlement). Free.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "RLUSD (default, XRPL), USDC (XRPL/Base/Solana per chain), or XAH (Xahau)",
                "type": "string"
              },
              "chain": {
                "description": "solana — use Solana USDC-SPL rail; base — use Base USDC rail; xrpl — use USDC on XRPL; xahau — use Xahau native-XAH rail",
                "type": "string"
              },
              "currency": {
                "description": "USDC for Base/Solana rail; omit for RLUSD on XRPL",
                "type": "string"
              },
              "endpoint_id": {
                "description": "UUID of endpoint to pay for",
                "type": "string"
              }
            },
            "required": ["endpoint_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c04b180645904793100b57b0dcc13bf96ebc539176574d36978607f6c99977a9"
        },
