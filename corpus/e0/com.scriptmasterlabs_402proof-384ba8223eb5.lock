        {
          "name": "verify_payment",
          "description": "Submit tx_hash after paying an invoice. Supports XRPL, Xahau, Base (0x… hash), and Solana. Returns a signed JWT access_token (1-hour TTL). For a Xahau invoice with fee_required=true, also submit fee_tx_hash (the 0.01 XAH facilitator-fee payment) — settlement requires both payments. Free.",
          "inputSchema": {
            "properties": {
              "agent_domain": {
                "type": "string"
              },
              "agent_wallet": {
                "type": "string"
              },
              "fee_tx_hash": {
                "description": "Xahau only, when the invoice has fee_required=true: tx hash of the 0.01 XAH facilitator-fee payment to fee_pay_to carrying fee_memo_hex",
                "type": "string"
              },
              "invoice_id": {
                "type": "string"
              },
              "recovery_secret": {
                "description": "Private high-entropy secret returned only with the original invoice; required to recover a previously settled token after lost response/restart",
                "type": "string"
              },
              "tx_hash": {
                "description": "XRPL/Xahau: 64-char hex; Base: 0x-prefixed hex; Solana: base58 signature",
                "type": "string"
              }
            },
