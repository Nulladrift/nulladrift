      "instructions": "Humanome is a 3D atlas of the human body for anatomy and physiology students. Use its tools to quiz a student with pictures (a structure lit on the 3D body, or a real microscope slide), to look a structure up, and to list what a lab practical asks. When a quiz card is shown, let the student answer in it: do not list the answers in your reply unless they ask for them.",
      "tools": [
        {
          "name": "list_lab_practical_structures",
          "title": "List what a lab practical asks",
          "description": "List the structures an anatomy and physiology lab practical asks, section by section (for example the bones, the muscles, the brain, the heart, blood vessels, the nervous system, A&P 1 or A&P 2), with links to practise each. Use it when a student asks what to study for a lab practical or wants a checklist of structures.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "practical": {
                "description": "The practical or course unit, e.g. 'muscles', 'appendicular skeleton', 'A&P 2'.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["practical"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "other_practicals": {
                "items": {
                  "properties": {
