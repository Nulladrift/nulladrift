        {
          "name": "look_up_anatomy_structure",
          "title": "Look up an anatomy structure",
          "description": "Look up one structure of the human body by name (spellings and abbreviations from a lab sheet work too): what it is in one or two sentences, its body system, a picture of it lit on a 3D body, its reference page and the quizzes that ask it. Use it when a student asks what or where a structure is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The structure's name, e.g. 'deltoid', 'foramen magnum', 'm. sartorius'.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
