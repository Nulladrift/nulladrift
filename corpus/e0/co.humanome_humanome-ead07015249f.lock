        {
          "name": "quiz_histology_slides",
          "title": "Histology slide quiz",
          "description": "Quiz a student on identifying tissues on real microscope slides (epithelial, connective, muscle and nervous tissue): each question shows a slide with its magnification and four tissue names, the wrong ones being tissues that look alike. Use it when a student wants to practise tissue identification or a histology practical.",
