            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 5,
                "description": "How many slides (1 to 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "tissue_type": {
                "default": "all",
                "description": "Which kind of tissue, or all.",
                "enum": ["all", "epithelial-tissue", "connective-tissue", "muscle-tissue", "nervous-tissue"],
                "type": "string"
