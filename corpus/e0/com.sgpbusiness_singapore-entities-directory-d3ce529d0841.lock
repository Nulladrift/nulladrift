{
  "lockfileVersion": 2,
  "subjects": {
    "com.sgpbusiness/singapore-entities-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.sgpbusiness.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "singapore-entities-directory",
        "title": "Singapore Entities Directory (sgpbusiness.com)",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Look up Singapore registered entities (companies, businesses, LLPs, societies, MCSTs and other UEN holders) from the official ACRA and UEN open datasets, as published on sgpbusiness.com. Use search_companies to find a UEN by name, then get_company for the entity record. Data is ACRA open data under the Singapore Open Data Licence v1.0; include the attribution from the result when you present it. Not affiliated with ACRA.",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a Singapore entity by UEN",
          "description": "Get the public registry record of one Singapore entity by its UEN: name, entity type, status and status date, incorporation date, SSIC activities, registered address (when shown publicly), conversion successor, SGPID and its sgpbusiness.com profile link, plus the open-data attribution to include when presenting it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "uen": {
                "description": "Unique Entity Number, e.g. \"201108760R\".",
                "pattern": "^[0-9A-Za-z]{8,10}$",
                "type": "string"
              }
            },
            "required": ["uen"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "type": "object"
              },
              "disclaimer": {
                "type": "string"
              },
              "generated_at": {
                "type": "string"
              },
              "profile_url": {
                "type": ["string", "null"]
              },
              "schema_version": {
                "type": "integer"
              },
              "source": {
                "type": "object"
              },
              "tier": {
                "type": "string"
              }
            },
            "required": ["data", "schema_version", "source", "tier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a Singapore entity by UEN"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46dd773777634fd2b285f7ac0cb2c486d7e55b9718c2a3d76879bdc60f822b76"
        },
        {
          "name": "search_companies",
          "title": "Search Singapore entities",
          "description": "Find Singapore registered entities by name or UEN. Matches an exact UEN, an exact name, or names that START WITH the query (case-insensitive). Live entities and shorter names rank first. Returns up to 10 compact results; call get_company with a UEN for the full record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum results (1-10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Entity name (or its beginning) or a UEN, e.g. \"Singapore Airlines\" or \"197200078R\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "entity_type": {
                      "type": ["string", "null"]
                    },
                    "incorporation_date": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "profile_url": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "type": ["string", "null"]
                    },
                    "uen": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "uen"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["query", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Singapore entities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:873b5897dfdc95989ca2cf385ea244ee642ebd726d45502a14b76f455bf36bf9"
        }
      ],
      "digest": "sha256:87c2b45400b76335c7ce0287cdf06fd5bdd3acbd70d56cc8788f0454c8483fa2"
    }
  }
}
