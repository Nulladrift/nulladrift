        {
          "name": "aex402_rh_pool",
          "description": "Get the live state of the aeX402 AMM on Robinhood Chain (EVM 4663) — the diamond-contract port of the Solana AMM. The AMM is the set of GRADUATED launchpad coins whose pools are seeded in-diamond on the canonical launchpad (0xED2F); this enumerates them live by scanning VPoolGraduated events + reading each pool's reserves, so it tracks reality as coins graduate. Returns graduatedPools[] (poolId, token, reserves, TVL), graduatedPoolCount, and status (\"live\" | \"no-graduated-pools\" | \"unknown\"), plus the legacy standalone 0xA1F6 USDG/WETH pool (legacy-drained). Distinct from the chain's Uniswap-fork DEX. No inputs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c97c578d7d3aa285ec7aa099127d958c82fef3b1b118697118e53f01d1e8a18"
        },
        {
          "name": "agent_delegate",
          "description": "Delegate a task to an independent specialist AI agent session. The delegate runs with full tool access and returns its response. Useful for breaking complex tasks into subtasks. Max depth: 3.",
          "inputSchema": {
            "properties": {
              "message": {
                "description": "Task or question for the delegate agent",
                "type": "string"
              },
              "model": {
                "description": "Model ID or alias (default: gpt-4o-mini)",
                "type": "string"
              },
              "role": {
                "description": "Role for new agent (e.g. \"Solana pool analyst\", \"route optimizer\"). Ignored if resuming session.",
                "type": "string"
              },
              "session": {
                "description": "Existing session ID to resume, or omit to create new session",
                "type": "string"
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "outputSchema": {
            "description": "delegate agent response (session, reply text, usage)",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81ab71f80a158c4b432876e70e7f52ab453cfd65d4cf069ddcdce62ef331e9bf"
        },
        {
