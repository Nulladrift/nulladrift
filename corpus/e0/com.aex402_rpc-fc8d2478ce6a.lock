        {
          "name": "reconstruct_abi",
          "description": "Reconstruct a PARTIAL function/event interface for an EVM contract on a supported EVM chain from its BYTECODE — no source or verification needed. Extracts PUSH4 function selectors + recent event topic0 hashes and resolves the ones public signature DBs (openchain/4byte) know to human signatures. Works on UNVERIFIED contracts because bytecode is ground truth, but it is NOT a full ABI: novel/proprietary selectors DBs have never seen stay unresolved (decompile for those). Use it to understand what an unknown contract does before trusting behavior-based guesses.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "EVM contract address (0x…). For a proxy, pass the implementation for the real logic.",
                "type": "string"
              },
              "chain": {
                "description": "robinhood | hyperevm | ethereum | base | stable | plasma | tempo | codex",
                "type": "string"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "chain": {
                "type": "string"
              },
              "codeSize": {
                "type": "integer"
              },
              "events": {
                "description": "resolved event signatures",
                "items": {
                  "description": "{topic0, sig}",
                  "type": "object"
                },
                "type": "array"
              },
              "functionCount": {
                "description": "total PUSH4 selectors found",
                "type": "integer"
              },
              "functions": {
                "description": "resolved function signatures",
                "items": {
                  "description": "{selector, sig}",
                  "type": "object"
                },
                "type": "array"
              },
              "isContract": {
                "type": "boolean"
              },
              "note": {
                "description": "what the reconstruction could and could not resolve",
                "type": "string"
              },
              "unresolvedSelectors": {
                "description": "novel/proprietary selectors no DB knows",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["address", "chain", "isContract"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:27d6689465d2a51a91125089ea404e469f1bf28338a15d6056a161e2fc0c1760"
        },
