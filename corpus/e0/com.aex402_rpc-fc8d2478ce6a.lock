              "sourceErrors": {
                "description": "per-chain list of what each live source ACTUALLY answered when it failed, e.g. \"robinhood/ERC-20: blockscout /api/v2/tokens → 403\". Says WHY a census is thin where seedsOnlyScans only says THAT it is. Capped at 4 entries per chain; when more were recorded the list carries a final \"… +N more (T total)\" string, so the count survives the truncation rather than the list silently reading as complete. Omitted when every source succeeded",
