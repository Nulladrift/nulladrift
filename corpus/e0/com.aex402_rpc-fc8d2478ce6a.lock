              "seedsOnlyScans": {
                "description": "chains whose last scan returned ONLY hardcoded canonical seeds — every live source returned nothing while the fallback held, so the count is non-zero and emptyScans does NOT list them. Sets status=degraded. Omitted when none",
                "items": {
                  "type": "string"
                },
                "type": "array"
