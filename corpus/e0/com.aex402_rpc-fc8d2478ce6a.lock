        {
          "name": "describe_program",
          "description": "Introspect ANY specific program/contract address on a chain. Solana/Slonana: returns executable, owner, data size, and whether it is a known program. EVM: RPC-verified facts (is-contract, code size, ERC-20 name/symbol/decimals, EIP-1967 proxy → implementation) PLUS Blockscout explorer enrichment when available.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Program id (base58, Solana/Slonana) or contract address (0x…, EVM)",
                "type": "string"
              },
              "chain": {
                "description": "solana | slonana | robinhood | hyperevm | ethereum | base | stable | plasma | tempo | codex",
                "type": "string"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "chain": {
                "type": "string"
              },
              "codeSize": {
                "description": "EVM bytecode length in bytes. EVM only — omitted when the chain is Solana/Slonana (dataLen is the Solana equivalent)",
                "type": "integer"
              },
              "dataLen": {
                "description": "account data length in bytes. Solana/Slonana only — omitted when the chain is EVM (codeSize is the EVM equivalent)",
                "type": "integer"
              },
              "erc20": {
                "description": "ERC-20 name/symbol/decimals. EVM only — omitted when the address is not an ERC-20, or the chain is Solana/Slonana",
                "type": "object"
              },
              "executable": {
                "description": "Solana/Slonana only — omitted when the chain is EVM",
                "type": "boolean"
              },
              "exists": {
                "description": "Solana/Slonana only — omitted when the chain is EVM (isContract is the EVM equivalent)",
                "type": "boolean"
              },
              "isContract": {
                "description": "EVM only — omitted when the chain is Solana/Slonana, where executable/isProgram carry this instead",
                "type": "boolean"
              },
              "isProgram": {
                "description": "Solana/Slonana only — omitted when the chain is EVM",
                "type": "boolean"
              },
              "known": {
                "description": "curated registry entry {id,name,type,note} when the address is recognised",
                "type": ["object", "null"]
              },
              "lamports": {
                "description": "Solana/Slonana only — omitted when the chain is EVM",
                "type": "integer"
              },
              "owner": {
                "description": "owning program. Solana/Slonana only — omitted when the chain is EVM",
                "type": "string"
              },
              "proxy": {
                "description": "EIP-1967 proxy standard + implementation. EVM only — omitted when the address is not a proxy, or the chain is Solana/Slonana",
                "type": "object"
              }
            },
            "required": ["address", "chain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:662467e8fcfd188e1cd056671479a183c90ef32b075543685ba1ea8f13099876"
        },
        {
          "name": "discover_programs",
          "description": "Discover on-chain programs/contracts across every chain this RPC supports (Solana, Slonana SVM, Robinhood, HyperEVM, Ethereum, Base, Stable, Plasma, Tempo, Codex). Returns a curated seed MERGED with programs/contracts AUTO-DISCOVERED from recent block activity (refreshed hourly) — each carries an `activity` count of recent invocations/calls; entries with type \"discovered\" were seen live on-chain but not yet named. Use this to learn what is actually active on-chain right now, then describe_program to introspect any specific address.",
          "inputSchema": {
            "properties": {
              "chain": {
                "default": "all",
                "description": "Filter to one chain: solana | slonana | robinhood | hyperevm | ethereum | base | stable | plasma | tempo | codex. Omit or \"all\" for every chain.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "chain": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "coverage": {
                "description": "what this scan enumerated: a string on the single-chain response, the full per-chain map on the all-chains response",
                "type": ["string", "object"]
              },
              "discovered": {
                "description": "auto-discovered (not curated) entries",
                "type": "integer"
              },
              "note": {
                "description": "caveats about what this scan did and did not see",
                "type": "string"
              },
              "programs": {
                "description": "array on the single-chain response; a per-chain {chain: program[]} map on the all-chains response",
                "items": {
                  "properties": {
                    "activity": {
                      "description": "recent invocations/calls",
                      "type": "integer"
                    },
                    "id": {
                      "description": "program/contract address",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "type": {
                      "description": "'core' | 'curated' | 'discovered'",
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": ["array", "object"]
              },
              "tokens": {
                "description": "token contracts seen alongside programs",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69a3430da1e87f8108e5909595ab8b67c1aeab4304149e184afc2116b810cadf"
        },
        {
          "name": "discovery_health",
          "description": "Report the freshness and health of the cross-chain program/token discovery pipeline: when the hourly cron last ran, how many programs/tokens each chain scan produced, and which scans failed. Use this to check whether discover_programs / search_tokens data is current before relying on it.",
          "inputSchema": {
            "properties": {},
