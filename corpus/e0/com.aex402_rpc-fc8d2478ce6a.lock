        {
          "name": "bridge_quote",
          "description": "Bridge/swap ANY asset across ANY chain via LI.FI (the engine behind Jumper) — e.g. Arbitrum USDC → Robinhood Chain (4663) USDG, or bridge into ETH for gas. Returns the best route (estimated output, fees, bridge used, duration) PLUS an unsigned transactionRequest (to/data/value/gasLimit) that the CALLER signs and submits on the fromChain — no keys are held here. Chains by id or key (1 Ethereum, 42161 Arbitrum, 8453 Base, 10 Optimism, 137 Polygon, 999 HyperEVM, 4663 Robinhood Chain). Tokens by symbol or 0x address.",
          "inputSchema": {
            "properties": {
              "fromAddress": {
                "description": "Sender 0x address on the source chain",
                "type": "string"
              },
              "fromAmount": {
                "description": "Amount in the source token's smallest unit (e.g. 1000000 = 1 USDC at 6 decimals)",
                "type": "string"
              },
              "fromChain": {
                "description": "Source chain id or key, e.g. 42161 or ARB",
                "type": "string"
              },
              "fromToken": {
                "description": "Source token symbol or 0x address, e.g. USDC",
                "type": "string"
              },
              "toAddress": {
                "description": "Recipient on the destination chain (defaults to fromAddress)",
                "type": "string"
              },
              "toChain": {
                "description": "Destination chain id or key, e.g. 4663 (Robinhood Chain)",
                "type": "string"
              },
              "toToken": {
                "description": "Destination token symbol or 0x address, e.g. USDG or ETH",
                "type": "string"
              }
            },
            "required": ["fromAddress", "fromAmount", "fromChain", "fromToken", "toChain", "toToken"],
            "type": "object"
          },
          "outputSchema": {
