      "instructions": "Solana RPC + AeX402 AMM tools. Full API docs: https://rpc.aex402.com/llms.txt — Auth: include X-Session header (from /topup) or Authorization: Bearer sk-aex-v1-... (API key). Raw X-Wallet is read-only.",
      "tools": [
        {
          "name": "aex402_buildSwap",
          "description": "Build an AeX402 AMM swap action. Fetches live pool state, computes output with slippage protection, returns all instruction parameters and account addresses for client signing.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "Input amount in atomic units",
                "type": "number"
              },
              "inputMint": {
                "description": "Input token mint address",
                "type": "string"
              },
              "pool": {
                "description": "Pool account address (base58)",
                "type": "string"
              },
              "slippageBps": {
                "description": "Max slippage in basis points (default 50 = 0.5%)",
                "type": "number"
              },
              "userWallet": {
                "description": "User wallet address (for account derivation)",
                "type": "string"
              }
            },
            "required": ["amount", "inputMint", "pool", "userWallet"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "action": {
                "description": "'aex402_swap'",
                "type": "string"
              },
              "instruction": {
                "description": "programId, keys, data (base64) — sign & submit client-side",
                "type": "object"
              },
              "quote": {
                "description": "estimatedOutput, minOutput, priceImpact",
                "type": "object"
              }
            },
            "required": ["action", "instruction"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
