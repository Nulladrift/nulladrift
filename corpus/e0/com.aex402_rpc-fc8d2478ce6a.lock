              "result": {
                "description": "The pipeline/linq output value — the entire point of the call when args.pipeline or args.linq was passed, returned alone rather than wrapped; omitted when neither was passed"
              },
              "results": {
                "description": "omitted when reduce/pipeline/linq was requested — see failures instead for what went wrong",
                "items": {
                  "description": "per-call result: id, tool, ok, picked/output or error",
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
