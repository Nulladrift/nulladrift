                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "created": {
                "description": "unix seconds",
                "type": "integer"
              },
              "id": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "object": {
                "description": "always 'chat.completion'",
                "type": "string"
              },
              "usage": {
                "description": "prompt/completion/total tokens",
                "type": "object"
              }
