              "limit": {
                "description": "Groups to return, 1 to 50 (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "options": {
                "additionalProperties": {
                  "anyOf": [
                    {
                      "maxLength": 200,
                      "type": "string"
