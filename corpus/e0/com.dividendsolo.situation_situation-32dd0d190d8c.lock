{
  "lockfileVersion": 2,
  "subjects": {
    "com.dividendsolo.situation/situation": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://situation.dividendsolo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "situation",
        "title": "Situation",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Situation is a live desk of the world's situations: a wire of headlines, a map of the events they name, the stories behind them and the numbers that go with them. Tools answer in plain text. With a live key (a paid plan or the free week) the lines are live; with no key or a plan that ended they are one hour behind, and each answer says so.",
      "tools": [
        {
          "name": "get_data",
          "title": "Read a data series",
          "description": "One of the /data series as text: wire-volume, hormuz-air-traffic or roster-members.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "the series: wire-volume, hormuz-air-traffic or roster-members",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d00d556db0fd7a5ff3e9f8797b3baaade990e3073a8fe2660cf6d5d0d1ba3c7"
        },
        {
          "name": "get_live",
          "title": "Live access and its price",
          "description": "Without confirmPaymentSpend this only answers the price: nothing is charged and nothing is opened. With confirmPaymentSpend: true it answers the Polar checkout link for that plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmPaymentSpend": {
                "description": "true opens the Polar checkout for the plan and answers its link",
                "type": "boolean"
              },
              "plan": {
                "description": "which plan, monthly when left out",
                "enum": ["monthly", "yearly", "lifetime"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:97d10066659a7a3a83cf5db1507a7d0d8bc821e7334313f4b601c7d3dcb5231c"
        },
        {
          "name": "get_map_events",
          "title": "Read the map's events",
          "description": "The events the map draws for a situation: the place, what kind of place it is, and the time of the line that named it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "since": {
                "description": "an ISO time, for example 2026-11-09T12:00:00Z; the last 24 hours when left out",
                "type": "string"
              },
              "situation": {
                "description": "a situation key from list_situations; every situation when left out",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e35ae33f1c6eb790ae3e3a601d549dd4220d66847b5bfcecd5f248e54c6027b2"
        },
        {
          "name": "get_stories",
          "title": "Read the stories",
          "description": "The stories of the last 24 hours: what broke first, who broke it, how many lines it has and whether one source has it alone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "situation": {
                "description": "a situation key from list_situations; every situation when left out",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3d0cf8e9f250f9033ec290483a61573ef5222422dc93161fc77dd4f75e9adf5"
        },
        {
          "name": "get_wire",
          "title": "Read the wire",
          "description": "The newest lines on a situation's wire, newest first, each with its source and its source time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "how many lines per situation, 20 by default",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "situation": {
                "description": "a situation key from list_situations; every situation when left out",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:84b9063ec063f336f14bb500a56dfdb36b03d0e4878ea969cb65856c8036d2a5"
        },
        {
          "name": "list_situations",
          "title": "List the situations",
          "description": "The situation keys and names Situation follows: Iran and the Strait of Hormuz, Ukraine and Russia, US Debt and Currency, the Plague Tracker, Weather, and AI and Hacking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:879f67fe0a0246b5c8abb12fdeb011345bf8421674bb794b93bc93f67300eb06"
        },
        {
          "name": "subscribe_daily",
          "title": "Subscribe to Situation Daily",
          "description": "Send the confirm email for Situation Daily to an address new to Situation. The subscription starts only when the reader clicks the link in it. A reader who already has an account turns Daily on in the account menu.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "the reader's email address",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2fa9733a00d8a30664670509a8006b5be911b3d17e7c9731469150e3608e7738"
        }
      ],
      "digest": "sha256:59b1a2d95d45b0ed1ef1e14bbe14e8c53593247ae199c5739bcefac69dd4f106"
    }
  }
}
