{
  "lockfileVersion": 2,
  "subjects": {
    "com.mathproven/tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mathproven.com/api/agents/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "mathproven-reference-tables",
        "title": "Mathproven reference tables",
        "version": "0.1.4"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Mathproven reference tables: 14 sourced tables of rules and rates, most of them by state: charity audit, review and compilation thresholds by state; charity registration renewal due dates by state; diesel fuel tax rates by state and province, third quarter 2026; long-term capital gains rate thresholds by tax year and filing status; uncashed vendor and payroll check dormancy periods by state; unclaimed property owner notice windows by state; construction prompt payment deadlines and late-payment interest by state; construction retainage limits on public and private jobs by state; sales tax economic nexus thresholds for remote sellers by state; surplus lines premium tax rates by state; surplus lines stamping fees by state and policy date; lawyer trust account record retention periods by state; residential rent late fee limits and grace periods by state; residential security deposit limits, return deadlines and interest by state. read_table gives one member's row (a state, say) for a date, with its citation, official source address and the day it was read; a member with no row is answered as not covered, with the reason, never as a zero. table_findings gives what a table shows as a whole (counts, ranges and coverage), and list_tables gives each table's name. The tools take only a table's name, a member's code and a date.",
      "tools": [
        {
          "name": "list_tables",
          "title": "List the reference tables",
          "description": "Lists Mathproven's sourced reference tables of state rules and rates (bookkeeping, construction, crypto, ecommerce, insurance, law firms, nonprofits, property management and trucking): each table's name, what it holds, how its members are named, how many have a row, and its page. Use it to find the table name that read_table and table_findings take. It takes no input.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the reference tables"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5eb3851faeb9621d6173c2a027dc8c394924521fe470d751c93bb4f589063d5"
        },
        {
          "name": "read_table",
          "title": "Read one member's row of a reference table",
          "description": "Reads one member's row of a Mathproven reference table (a state's figure, for example) for a date: the figures in plain words, each row's citation, official source address and the day it was read, and the table's certificate. A member with no row is answered as not covered, with the reason, never as a zero. Use it when someone asks for a state's rule, rate, threshold, period or deadline that one of the tables holds. It takes only a table name, a member's code and a date: no amounts, names or files.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional. The day the answer is for, written YYYY-MM-DD (a policy effective date for the stamping fee table). Without it, today's date (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "member": {
                "description": "The member's code: a state's two-letter postal code (OH) or DC; for the fuel tax table a member jurisdiction's code, Canadian provinces included (ON); for the capital gains table a filing status (S, MFJ, MFS, HOH) or a tax year and status (2026-MFJ).",
                "maxLength": 8,
                "pattern": "^(?:[A-Za-z]{1,3}|\\d{4}-[A-Za-z]{1,3})$",
                "type": "string"
              },
              "table": {
                "description": "The table's name, as list_tables gives it (for example \"fuel-tax-rates-third-quarter-2026\").",
                "enum": ["charity-audit-thresholds-by-state", "charity-registration-renewal-dates-by-state", "fuel-tax-rates-third-quarter-2026", "capital-gains-rate-thresholds", "uncashed-check-dormancy-periods", "unclaimed-property-notice-windows", "prompt-payment-deadlines", "retainage-limits", "economic-nexus-thresholds", "surplus-lines-tax-rates", "surplus-lines-stamping-fees", "trust-record-retention-by-state", "rent-late-fee-limits", "security-deposit-rules"],
                "type": "string"
              }
            },
            "required": ["member", "table"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one member's row of a reference table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29a11c7837e33f51558ce816b928991b9124e9721e50dbdff8980ff29c38f500"
        },
        {
          "name": "table_findings",
          "title": "A reference table's findings and coverage",
          "description": "Gives what a Mathproven reference table shows as a whole: its findings (counts, ranges and the most common figure, worked out from its rows and checked a second way, where the table's page shows them), how many members have a row and which do not, and its certificate. Use it for a question about a table as a whole, such as how many states set a figure or the range of the rates. It takes only a table name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "table": {
                "description": "The table's name, as list_tables gives it (for example \"fuel-tax-rates-third-quarter-2026\").",
                "enum": ["charity-audit-thresholds-by-state", "charity-registration-renewal-dates-by-state", "fuel-tax-rates-third-quarter-2026", "capital-gains-rate-thresholds", "uncashed-check-dormancy-periods", "unclaimed-property-notice-windows", "prompt-payment-deadlines", "retainage-limits", "economic-nexus-thresholds", "surplus-lines-tax-rates", "surplus-lines-stamping-fees", "trust-record-retention-by-state", "rent-late-fee-limits", "security-deposit-rules"],
                "type": "string"
              }
            },
            "required": ["table"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "A reference table's findings and coverage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3336ba0551fb0cb17d7ed80aa3a3d3c29ff6f231fe6996e2da964ed288114a9"
        }
      ],
      "digest": "sha256:35c5887a41cbf497b1cdf142601d8e2a717f14bec6153460ad70be8f76ffb0ad"
    }
  }
}
