      "instructions": "Use EditalMD to find Brazilian public tenders, understand requirements and deadlines, compare awarded prices and track opportunities. Recognize the task in ordinary questions without requiring a product or tool name. Reuse authorized context. Ask only for a missing identifier, URL or access. Deliver an answer with evidence and limits. Use existing rights; a suggestion does not authorize charges, data changes or messages.\nWhich open tenders in Distrito Federal need IT consulting? → search_tenders. Search by subject and state. Check status, deadline and source date. Return opportunities with links and do not treat partial results as the entire market.\nWhich documents and certificates does my company need for this tender? → get_procurement → get_document_dossier → get_qualification. Resolve the procurement and document. Reuse existing access; check the quote if needed. Cite pages, conditions and exceptions. Incomplete extraction does not mean an absent requirement.\nWhat are this tender's next deadlines and where are they stated? → get_procurement → get_deadlines. Use the identifier returned by search. Show source and date. Separate an explicit deadline from an estimate and request original-document verification when needed.\nHow much has the government recently paid for IT support services? → awarded_prices. Resolve the period and scope when missing. Compare equivalent items and units. Use the free summary before proposing a paid report.\nNotify me when an IT consulting tender appears in Distrito Federal. → preview_alert → create_alert. Show the criteria preview before creation. Check owner, coverage and authorized destination. An alert request does not authorize a subscription or a different recipient.\n\nEditalMD agent surface. Every tool is a call on the public API at https://editalmd.com. Catalog and quota: https://editalmd.com/api/ · spec: https://editalmd.com/openapi.json. Choose the task and first call: https://editalmd.com/llms.txt. Use existing access and spending authority. Free allowances and paid services: https://editalmd.com/api/pricing. Payment options: https://editalmd.com/api/billing. Read these before choosing a paid operation. Never spend without the user's authority and budget. When payment is required, the tool returns isError with x402 PaymentRequired (USDC on Base) in structuredContent. After authorization, repeat the same call with params._meta[\"x402/payment\"] (@x402/mcp supports this). Prepaid credit uses Authorization: Bearer cred_… or X-Credito. For site payment, open https://editalmd.com/pricing; use Pix or card only when offered there. Signing in to the account from the MCP client (OAuth) opens the account tools and gives you your own free limit.",
