        {
          "name": "get_tender_markdown",
          "title": "Tender Markdown",
          "description": "Reads the Markdown with the acesso_codigo of the document, or with avaliacao_codigo and agent_pass of the sponsored premium. The examples are free.",
          "inputSchema": {
