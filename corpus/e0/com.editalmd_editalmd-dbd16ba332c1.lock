        {
          "name": "create_alert",
          "title": "Create an alert",
          "description": "An alert for new procurements by object terms and state (UF). Use the account session or guest token. Channels: pull, signed webhook or email. On webhook and email, it also delivers new tenders outside PNCP that have not opened yet (TCE-RS LicitaCon and TCE-PE open data). Name, organization and email recipients are optional. Two modes. By `termos`: a space requires all groups; `|` accepts alternatives within a group. By `cnpj`: known activity families produce alerts, up to `max_familias`. Unmapped activities remain in the response without an alert. The cron checks every 30 minutes. Email requires an account session and `EMAIL_ALERTAS=1`. It uses explicit recipients or the verified account email.",
          "inputSchema": {
            "properties": {
              "canal": {
                "default": "pull",
                "description": "pull, webhook or email (default pull).",
                "enum": ["pull", "webhook", "email"],
                "type": "string"
              },
              "destinatarios": {
                "additionalProperties": false,
                "description": "Email recipients: `para`, `cc` and `bcc` arrays. Up to 10 distinct addresses in total. An empty `para` list uses the account email. PATCH replaces all three lists. BCC is hidden from other recipients.",
                "properties": {
                  "bcc": {
                    "description": "Hidden copy addresses. Only the alert owner can read this list.",
                    "items": {
                      "format": "email",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "cc": {
                    "description": "Visible copy addresses.",
                    "items": {
                      "format": "email",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "para": {
                    "description": "To addresses. An empty list uses the verified account email.",
                    "items": {
                      "format": "email",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "destino": {
                "description": "HTTPS webhook URL. Ignored for pull and email.",
                "type": "string"
              },
              "filtros": {
                "additionalProperties": false,
                "description": "Extra filter: modalities, municipalities, exclusions, values, open proposals and CNAEs. PATCH replaces the whole filter; {} clears it.",
                "properties": {
                  "abertas": {
                    "description": "Require the proposal deadline to be open at collection time.",
                    "type": "boolean"
                  },
                  "cnaes": {
                    "description": "Up to 8 CNAE subclasses, such as 4644301 or 4644-3/01. Matches one of the purchase's three most likely CNAEs.",
                    "items": {
                      "pattern": "^\\d{4}-?\\d/?\\d{2}$",
                      "type": "string"
                    },
                    "maxItems": 8,
                    "type": "array"
                  },
                  "disputa": {
                    "description": "Only purchases with competitive bidding. Excludes PNCP's not-applicable bidding mode.",
                    "type": "boolean"
                  },
                  "esferas": {
                    "description": "Government spheres: F federal, E state, D district and M municipal. Records without a sphere are excluded.",
                    "items": {
                      "enum": ["F", "E", "D", "M"],
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "excluir": {
                    "description": "Up to 10 literal phrases, each 3–80 characters, to exclude from the purchase subject.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "modalidades": {
                    "description": "Up to 10 PNCP procedure codes, from 1 to 19.",
                    "items": {
                      "maximum": 19,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "municipios": {
                    "description": "Up to 10 exact municipality names or IBGE codes. Use UF to distinguish names.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "srp": {
                    "description": "Only purchases marked as price registration (srp) by PNCP.",
