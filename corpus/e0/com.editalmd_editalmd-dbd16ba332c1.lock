        {
          "name": "search_tenders",
          "title": "Search tenders",
          "description": "Searches public procurements by term. Free. Returns the object, the agency, the state (UF), the modality and the procurement id. The procurements that receive proposals now come first, then the most recently published ones. With ordem 'prazo', the one that closes first comes first.",
          "inputSchema": {
            "properties": {
              "abertas": {
                "description": "'1' for only procurements with an open proposal period, without the ones PNCP shows as revoked or annulled.",
                "enum": ["1"],
                "type": "string"
              },
              "filtros": {
                "description": "JSON up to 2048 characters: excluir and municipios (up to 10 expressions of 3 to 80 characters; municipalities by exact name or IBGE code), orgao_cnpj (14 digits), modalidades (up to 10 codes from 1 to 19), disputa (true: only purchases with bidding; with modality 8, direct purchases with bidding), srp (true: only procurements under the Price Registration System), esferas (F, E, D, M: federal, state, Federal District, municipal), valor_min and valor_max (reais from 0 to 1e15), encerramento_de and encerramento_ate (YYYY-MM-DD day of the proposal deadline), publicacao_de and publicacao_ate (YYYY-MM-DD day of the publication on PNCP). Example: {\"excluir\":[\"usado\"],\"modalidades\":[6]}.",
                "type": "string"
              },
              "limite": {
                "description": "1 to 50 (default 20).",
                "type": "number"
              },
              "ordem": {
                "description": "'prazo' to put first the procurement that closes first; only with abertas '1'.",
                "enum": ["prazo"],
                "type": "string"
              },
              "q": {
                "description": "Search term, at least 3 letters. When no procurement has all the words, it returns the ones with some of them (todas_as_palavras: false).",
                "type": "string"
              },
              "uf": {
                "description": "State (UF) abbreviation (optional).",
                "type": "string"
              }
