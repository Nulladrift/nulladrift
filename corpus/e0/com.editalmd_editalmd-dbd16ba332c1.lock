                  },
                  "valor_max": {
                    "description": "Maximum estimated value in Brazilian reais.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "valor_min": {
                    "description": "Minimum estimated value in Brazilian reais.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "nome": {
                "description": "Alert name, up to 100 characters.",
                "maxLength": 100,
                "type": "string"
              },
              "organizacao_id": {
                "description": "Organization from `GET /api/me/empresas`. Membership and MFA are checked. Null removes the label. This does not share alert ownership.",
                "type": ["string", "null"]
              },
              "resultados": {
                "description": "Also deliver the result of each matching purchase when PNCP publishes it, on the same channel: the purchase comes back once with `resultado` (awarded value, items, date and the three largest winners). It starts when turned on, without past results. `abertas` does not apply to results.",
                "type": "boolean"
              },
