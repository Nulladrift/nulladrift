        {
          "name": "update_alert",
          "title": "Edit an alert",
          "description": "Edits the interest, or pauses or turns on again an alert of the owner. The filters replace the whole filter.",
          "inputSchema": {
            "properties": {
              "ativo": {
                "description": "`false` pauses without deleting; `true` turns it on again.",
                "type": "boolean"
              },
              "canal": {
                "description": "New channel: `pull`, `webhook` or `email`. Email requires a session and uses explicit recipients or the account email.",
                "enum": ["pull", "webhook", "email"],
                "type": "string"
              },
              "destinatarios": {
                "additionalProperties": false,
                "description": "Email recipients: `para`, `cc` and `bcc` arrays. Up to 10 distinct addresses in total. An empty `para` list uses the account email. PATCH replaces all three lists. BCC is hidden from other recipients.",
                "properties": {
                  "bcc": {
                    "description": "Hidden copy addresses. Only the alert owner can read this list.",
                    "items": {
                      "format": "email",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "cc": {
                    "description": "Visible copy addresses.",
                    "items": {
                      "format": "email",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "para": {
                    "description": "To addresses. An empty list uses the verified account email.",
                    "items": {
                      "format": "email",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "destino": {
                "description": "New https URL on port 443 (webhook). Ignored for pull and email.",
                "type": "string"
              },
              "filtros": {
                "additionalProperties": false,
                "description": "Extra filter: modalities, municipalities, exclusions, values, open proposals and CNAEs. PATCH replaces the whole filter; {} clears it.",
                "properties": {
                  "abertas": {
                    "description": "Require the proposal deadline to be open at collection time.",
                    "type": "boolean"
                  },
                  "cnaes": {
                    "description": "Up to 8 CNAE subclasses, such as 4644301 or 4644-3/01. Matches one of the purchase's three most likely CNAEs.",
                    "items": {
                      "pattern": "^\\d{4}-?\\d/?\\d{2}$",
                      "type": "string"
                    },
                    "maxItems": 8,
                    "type": "array"
                  },
                  "disputa": {
                    "description": "Only purchases with competitive bidding. Excludes PNCP's not-applicable bidding mode.",
                    "type": "boolean"
                  },
                  "esferas": {
                    "description": "Government spheres: F federal, E state, D district and M municipal. Records without a sphere are excluded.",
                    "items": {
                      "enum": ["F", "E", "D", "M"],
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "excluir": {
                    "description": "Up to 10 literal phrases, each 3–80 characters, to exclude from the purchase subject.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "modalidades": {
                    "description": "Up to 10 PNCP procedure codes, from 1 to 19.",
                    "items": {
                      "maximum": 19,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "municipios": {
                    "description": "Up to 10 exact municipality names or IBGE codes. Use UF to distinguish names.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "srp": {
                    "description": "Only purchases marked as price registration (srp) by PNCP.",
                    "type": "boolean"
                  },
                  "valor_max": {
                    "description": "Maximum estimated value in Brazilian reais.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "valor_min": {
                    "description": "Minimum estimated value in Brazilian reais.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "id": {
                "description": "Alert identifier.",
                "type": "string"
              },
              "nome": {
                "description": "Alert name, up to 100 characters.",
                "maxLength": 100,
                "type": "string"
              },
              "organizacao_id": {
                "description": "Organization from `GET /api/me/empresas`. Membership and MFA are checked. Null removes the label. This does not share alert ownership.",
                "type": ["string", "null"]
              },
              "resultados": {
                "description": "Also deliver the result of each matching purchase when PNCP publishes it, on the same channel: the purchase comes back once with `resultado` (awarded value, items, date and the three largest winners). It starts when turned on, without past results. `abertas` does not apply to results.",
                "type": "boolean"
              },
              "termos": {
                "description": "Object terms; a space requires all words, | accepts alternatives.",
                "type": "string"
              },
              "uf": {
                "description": "State (UF) abbreviation; empty means all.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Edit an alert"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4f0ae64fe59d3a851223b12af9ebf3fcc04519e9822f6c7377b5934e7270c891"
        },
