        {
          "name": "buy_plan",
          "title": "Buy plan",
          "description": "Buys a plan for the account or paying wallet.\nPix and USDC pay 30 days with no automatic renewal; the card subscribes monthly and renews until you cancel. Without payment, the answer is 402 with the price. Pay with prepaid credit (`X-Credito`) or x402 (`PAYMENT-SIGNATURE` v2 or `X-PAYMENT` v1). Without an account, the verified paying wallet owns the purchase. Use wallet agent authentication to read its plan, or claim it after account sign-in. The `compra` mark prevents repeat credit debits. An x402 nonce can settle only once; keep the receipt after a delivery error. Original PDFs are free. An active plan includes usage.total, usage.used and usage.remaining. One page uses 1 unit, a price report 25, an alert 5 and a tender watch 3. Allowance is consumed before prepaid credit.",
          "inputSchema": {
            "properties": {
              "plan": {
                "description": "`pro-paginas` (1000 shared allowance units), `profissional-paginas` (10000 shared allowance units), `empresarial-paginas` (100000 shared allowance units)",
                "enum": ["pro-paginas", "profissional-paginas", "empresarial-paginas"],
                "type": "string"
              }
            },
            "required": ["plan"],
            "type": "object"
          },
          "annotations": {
