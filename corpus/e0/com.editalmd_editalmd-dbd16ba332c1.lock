        {
          "name": "awarded_prices",
          "title": "Awarded prices",
          "description": "The price that wins for a similar item, as a free summary: how many prices, the median and the range (p25/p75) of the same catalog product in the same unit, without the extremes; the volume bought; the price for your quantity; and the other groups that the search found (ask for the product and the unit of one of them to switch). It searches awarded results by item description: PNCP results and the items that Ceará cities report to TCE-CE (`fonte` on each item). It also accepts POST, PUT or PATCH with the same parameters in JSON or a form; `query`, `termo`, `busca` and `search` count as `q`, `estado` as `uf`, and `limit` as `limite`. Every 400 has `exemplo` and `doc`.",
          "inputSchema": {
            "properties": {
              "catmat": {
                "description": "Item code in the government catalog (optional).",
                "type": "string"
              },
              "limite": {
                "default": 50,
                "description": "1 to 100 (default 50).",
                "type": "number"
              },
              "meses": {
                "default": 12,
                "description": "Award window in months, 1 to 36 (default 12).",
