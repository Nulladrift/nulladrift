                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "para": {
                    "description": "To addresses. An empty list uses the verified account email.",
                    "items": {
                      "format": "email",
                      "maxLength": 254,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "destino": {
                "description": "HTTPS webhook URL. Ignored for pull and email.",
                "type": "string"
              },
              "filtros": {
                "additionalProperties": false,
                "description": "Extra filter: modalities, municipalities, exclusions, values, open proposals and CNAEs. PATCH replaces the whole filter; {} clears it.",
                "properties": {
                  "abertas": {
                    "description": "Require the proposal deadline to be open at collection time.",
                    "type": "boolean"
                  },
                  "cnaes": {
                    "description": "Up to 8 CNAE subclasses, such as 4644301 or 4644-3/01. Matches one of the purchase's three most likely CNAEs.",
                    "items": {
