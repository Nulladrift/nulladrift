                "description": "Catalog product, as in `grupos` (optional).",
                "type": "string"
              },
              "q": {
                "description": "Item description, at least 3 letters.",
                "type": "string"
              },
              "quantidade": {
                "description": "How much you will sell: the value for the range of that quantity (optional).",
                "type": "number"
              },
              "uf": {
                "description": "State (UF) of the agency (optional).",
                "type": "string"
              },
              "unidade": {
                "description": "Unit, as in `grupos`: 500 FL, 1 UN (optional).",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
