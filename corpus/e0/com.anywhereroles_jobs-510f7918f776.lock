        {
          "name": "search_jobs",
          "title": "Search remote jobs",
          "description": "Search open remote job listings aggregated from many job boards and company career pages, deduplicated. Use eligibleFrom to keep only jobs open to applicants in a given country, and overlapWith to rank by working-hours overlap with the applicant's time zone. Reposts by other job aggregators are hidden by default. Returns title, company, location, salary, eligibility and the URL of the original posting (apply there).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categoryId": {
                "description": "Category ID from list_categories",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "eligibleFrom": {
                "description": "ISO 3166-1 alpha-2 country the applicant can legally work from, e.g. 'ES', 'BR', 'DE'",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "employerOfRecord": {
                "description": "Only jobs hiring through an employer of record (hire from many countries)",
                "type": "boolean"
              },
              "fourDayWeek": {
                "description": "Only jobs offering a four-day week",
                "type": "boolean"
              },
              "includeAggregatorReposts": {
                "description": "Include reposts by other job aggregators (hidden by default)",
                "type": "boolean"
              },
              "minOverlapHours": {
                "description": "With overlapWith: minimum overlapping working hours",
                "maximum": 12,
                "minimum": 0,
                "type": "number"
              },
              "overlapWith": {
                "description": "Applicant time zone, IANA name ('Europe/Madrid') or UTC offset ('+02:00'); adds working-hours overlap",
                "type": "string"
              },
              "page": {
                "description": "Page number, 0-indexed",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "publishedAfter": {
                "description": "ISO date (YYYY-MM-DD); only jobs published on or after it",
                "type": "string"
              },
              "query": {
                "description": "Keywords, e.g. 'react', 'customer support', 'data engineer'",
                "type": "string"
              },
              "salaryMax": {
                "description": "Maximum annual salary in USD",
                "type": "number"
              },
              "salaryMin": {
                "description": "Minimum annual salary in USD",
                "type": "number"
              },
              "size": {
                "description": "Results per page, 1-50 (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "source": {
                "description": "Only jobs from this source board name",
                "type": "string"
              },
              "visaSponsorship": {
                "description": "Only jobs that say they sponsor visas",
                "type": "boolean"
              }
            },
            "type": "object"
          },
