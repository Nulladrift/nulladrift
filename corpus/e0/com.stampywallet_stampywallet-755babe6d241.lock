                "type": "boolean"
              },
              "cadeau_anniversaire": {
                "description": "Le cadeau d’anniversaire, valable 30 jours à partir du jour J : message (le texte seul), pourcent (une réduction sur chaque achat), un_offert (« 1 acheté, 1 offert », une fois), choix (le client choisit au comptoir entre la réduction et « 1 acheté, 1 offert »). Les cadeaux déjà ouverts ne changent pas.",
                "enum": ["message", "pourcent", "un_offert", "choix"],
                "type": "string"
              },
              "canal_anniversaire": {
                "description": "Canal de « anniversaire » : auto (recommandé : un message important part d’abord par SMS sauf aux clients qui répondent aux notifications, un petit en notification et par SMS seulement aux clients qui répondent mieux aux SMS), notif, secours (SMS si la notification ne porte pas), sms (SMS d’abord), email (e-mail si la notification ne porte pas).",
                "enum": ["auto", "notif", "secours", "sms", "email"],
                "type": "string"
              },
              "canal_avis": {
                "description": "Canal de « demande d’avis » : auto (recommandé : un message important part d’abord par SMS sauf aux clients qui répondent aux notifications, un petit en notification et par SMS seulement aux clients qui répondent mieux aux SMS), notif, secours (SMS si la notification ne porte pas), sms (SMS d’abord), email (e-mail si la notification ne porte pas).",
                "enum": ["auto", "notif", "secours", "sms", "email"],
