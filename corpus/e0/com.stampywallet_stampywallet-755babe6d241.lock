        {
          "name": "tableau_de_bord",
          "title": "Tableau de bord du commerce",
          "description": "Les chiffres de fidélité du commerce sur une période au choix : passages en caisse, clients venus, nouveaux clients, taux de retour, récompenses gagnées et offertes, chiffre estimé, avec une courbe par jour, semaine ou mois et, au besoin, la comparaison avec la période précédente de même durée. À utiliser pour « comment ça marche ce mois-ci ? », « combien de clients en août ? », « est-ce que ça monte ? ». Pour la liste des clients, utiliser chercher_clients ; pour savoir si la carte rapporte, rentabilite.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "au": {
                "description": "Dernier jour inclus (AAAA-MM-JJ). Défaut : aujourd’hui.",
                "format": "date",
                "type": "string"
              },
              "comparer": {
                "default": true,
                "description": "Ajoute la variation par rapport à la période de même durée juste avant (ex. 30 jours avant les 30 derniers jours).",
                "type": "boolean"
              },
              "courbe": {
                "default": "passages",
                "description": "Ce que trace la courbe. Défaut passages.",
                "enum": ["passages", "clients_venus", "nouveaux_clients", "recompenses_gagnees", "recompenses_offertes", "aucune"],
                "type": "string"
              },
              "du": {
                "description": "Premier jour inclus (AAAA-MM-JJ). Le donner suffit : la période devient « personnalisee ».",
                "format": "date",
                "type": "string"
              },
              "granularite": {
                "default": "auto",
                "description": "Pas de la courbe. auto (défaut) : jour jusqu’à 2 mois, semaine jusqu’à ~9 mois, mois au-delà.",
                "enum": ["auto", "jour", "semaine", "mois"],
                "type": "string"
              },
              "indicateurs": {
                "description": "Indicateurs à rendre, dans cet ordre. Défaut : tous. taux_retour = part des clients venus sur la période qui étaient déjà venus avant ; chiffre_estime = passages × panier moyen déclaré (une estimation, pas une caisse).",
                "items": {
                  "enum": ["passages", "clients_venus", "nouveaux_clients", "taux_retour", "passages_par_client", "recompenses_gagnees", "recompenses_offertes", "chiffre_estime", "total_clients"],
                  "type": "string"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              },
              "periode": {
                "default": "derniers_30_jours",
                "description": "Période étudiée, en jours du fuseau du commerce, aujourd’hui inclus pour les périodes en cours (ce_mois = du 1er à aujourd’hui). « personnalisee » utilise du/au. Défaut derniers_30_jours.",
                "enum": ["aujourdhui", "hier", "derniers_7_jours", "derniers_30_jours", "derniers_90_jours", "derniers_12_mois", "cette_semaine", "semaine_derniere", "ce_mois", "mois_dernier", "cette_annee", "annee_derniere", "depuis_le_debut", "personnalisee"],
                "type": "string"
              }
            },
            "type": "object"
          },
