              },
              "rang": {
                "description": "Pour frequence=mois : « premier » lundi, …, « dernier » vendredi du mois (avec jour_rang).",
                "enum": ["premier", "deuxieme", "troisieme", "quatrieme", "dernier"],
                "type": "string"
              },
              "si_ferme": {
                "description": "Un jour de fermeture ou de congés : sauter (défaut) ou décaler au jour ouvert suivant.",
