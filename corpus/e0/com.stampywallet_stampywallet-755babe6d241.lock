        {
          "name": "modifier_message_recurrent",
          "title": "Modifier un message récurrent",
          "description": "Change le texte ou le rythme d’un message récurrent (id donné par lister_messages_recurrents). Seuls les champs donnés changent ; sans_fin=true retire la fin. Règles : un message par jour (un jour où un autre message part déjà, l’occurrence est sautée), jours de fermeture et congés sautés (ou décalés au jour ouvert suivant avec si_ferme=decaler), heures calmes respectées, premier envoi dans les 60 jours. confirmer=false (défaut) rend un aperçu ; confirmer=true l’exécute, après l’accord explicite de la personne.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmer": {
                "default": false,
                "description": "false (défaut) : rend seulement un aperçu de ce qui serait fait, sans rien changer. true : exécute. Toujours montrer l’aperçu à la personne et attendre son accord avant de repasser avec true.",
                "type": "boolean"
              },
              "debut": {
                "description": "Premier jour possible (AAAA-MM-JJ). Par défaut aujourd’hui.",
                "format": "date",
                "type": "string"
              },
              "fin": {
                "description": "Dernier jour possible, inclus (AAAA-MM-JJ). Facultatif.",
                "format": "date",
                "type": "string"
              },
              "frequence": {
                "description": "semaine : avec jours. mois : avec jour_mois, ou rang et jour_rang.",
                "enum": ["semaine", "mois"],
                "type": "string"
              },
              "heure": {
                "description": "L’heure du commerce, HH:MM, entre 07:00 et 21:45.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "id": {
                "description": "La règle visée, donnée par lister_messages_recurrents.",
                "minimum": 1,
                "type": "integer"
              },
              "jour_mois": {
                "description": "Pour frequence=mois : le jour du mois (1 à 31 ; un 31 tombe le dernier jour d’un mois plus court).",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "jour_rang": {
                "description": "Le jour de la semaine qui va avec rang.",
