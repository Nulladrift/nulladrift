        {
          "name": "avis_google",
          "title": "Avis Google",
          "description": "Les avis Google du commerce. Chaque client reçoit la même demande d’avis (notification Wallet, SMS ou e-mail selon le canal réglé dans regler_automatismes, canal_avis), avec le lien direct vers la fiche Google : pas de note intermédiaire, pas de tri, aucune récompense contre un avis (règles de Google). Montre les chiffres sur 30 jours (demandes envoyées, clients allés sur Google) ; et règle la demande : lien de la fiche Google, demande active ou non, moment (première récompense ou après N passages), délai, texte. Sans changement : lecture seule. Avec changements : confirmer=false rend un aperçu avant → après, confirmer=true enregistre. Seuls les champs fournis changent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmer": {
                "default": false,
                "description": "false (défaut) : rend seulement un aperçu de ce qui serait fait, sans rien changer. true : exécute. Toujours montrer l’aperçu à la personne et attendre son accord avant de repasser avec true.",
                "type": "boolean"
              },
              "delai_minutes": {
                "description": "Délai entre le passage et la demande, en minutes : 0, 30, 60, 180, 1440 (1440 = le lendemain).",
                "type": "integer"
              },
              "demande_active": {
                "description": "Envoyer ou non la demande d’avis aux clients.",
                "type": "boolean"
              },
              "effacer": {
                "description": "Champs texte à vider. texte_demande revient au texte par défaut.",
                "items": {
                  "enum": ["texte_demande"],
                  "type": "string"
                },
                "type": "array"
              },
              "lien": {
                "description": "Lien « écrire un avis » de la fiche Google (g.page/r/…/review, search.google.com/local/writereview?placeid=…). Sans lui, aucune demande ne part.",
                "maxLength": 2000,
                "type": "string"
              },
              "moment": {
                "description": "Quand demander : recompense = à la première récompense ; passages = après N passages (voir passages).",
                "enum": ["recompense", "passages"],
                "type": "string"
              },
              "passages": {
                "description": "Nombre de passages avant la demande, si moment=passages.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "retirer_lien": {
                "description": "true : retire le lien de la fiche (coupe de fait toutes les demandes).",
                "type": "boolean"
              },
              "texte_demande": {
