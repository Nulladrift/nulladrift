        {
          "name": "meilleurs_moments",
          "title": "Meilleurs jours et heures",
          "description": "Montre quand les clients viennent : moyenne de passages par jour de la semaine, répartition par heure, ou les créneaux (jour + heure) les plus chargés, sur une période au choix et à l’heure locale du commerce. Peut aussi compter les inscriptions de nouveaux clients. À utiliser pour « quel est mon meilleur jour ? », « à quelle heure ai-je le plus de monde ? », « quand lancer une offre pour remplir un creux ? ».",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "au": {
                "description": "Dernier jour inclus (AAAA-MM-JJ). Défaut : aujourd’hui.",
                "format": "date",
                "type": "string"
              },
              "du": {
                "description": "Premier jour inclus (AAAA-MM-JJ). Le donner suffit : la période devient « personnalisee ».",
                "format": "date",
                "type": "string"
              },
              "jours": {
                "description": "Pour par=heure ou creneau : ne garder que ces jours de la semaine (ex. [\"samedi\"]).",
                "items": {
                  "enum": ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "limite": {
                "default": 10,
                "description": "Pour par=creneau : nombre de créneaux rendus (défaut 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "mesure": {
                "default": "passages",
                "description": "passages (défaut) ou nouveaux_clients (inscriptions à la carte).",
                "enum": ["passages", "nouveaux_clients"],
                "type": "string"
              },
              "par": {
                "default": "jour_semaine",
                "description": "jour_semaine (défaut) : moyenne par lundi, mardi… ; heure : total par heure de la journée ; creneau : les couples jour + heure les plus chargés.",
                "enum": ["jour_semaine", "heure", "creneau"],
                "type": "string"
              },
              "periode": {
                "default": "derniers_90_jours",
                "description": "Période étudiée, en jours du fuseau du commerce, aujourd’hui inclus pour les périodes en cours (ce_mois = du 1er à aujourd’hui). « personnalisee » utilise du/au. Défaut derniers_90_jours.",
                "enum": ["aujourdhui", "hier", "derniers_7_jours", "derniers_30_jours", "derniers_90_jours", "derniers_12_mois", "cette_semaine", "semaine_derniere", "ce_mois", "mois_dernier", "cette_annee", "annee_derniere", "depuis_le_debut", "personnalisee"],
                "type": "string"
              }
            },
            "type": "object"
