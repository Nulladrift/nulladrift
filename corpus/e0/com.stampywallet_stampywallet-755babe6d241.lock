        {
          "name": "chercher_clients",
          "title": "Chercher des clients",
          "description": "Liste les clients du commerce selon un segment (habitués, perdus de vue, à un tampon de la récompense, récompense à offrir, nouveaux, inactifs, jamais revenus) croisé avec des filtres : prénom, tampons sur la carte, nombre de visites, date d’inscription, date de dernière visite, type de wallet ; triés et paginés. Rend pour chacun un identifiant, le prénom et l’initiale du nom, les visites, la dernière visite et l’état de la carte, jamais d’e-mail ni de téléphone. À utiliser pour « qui sont mes meilleurs clients ? », « qui n’est pas revenu ? », « qui est proche de sa récompense ? », ou pour retrouver l’identifiant d’un client avant fiche_client.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actif_depuis_jours": {
                "description": "Au moins un passage dans les N derniers jours.",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "decalage": {
                "default": 0,
                "description": "Nombre de résultats à sauter (pagination).",
                "minimum": 0,
                "type": "integer"
              },
              "derniere_visite_avant": {
                "description": "Dernier passage ce jour-là ou avant (AAAA-MM-JJ). Exclut ceux jamais venus.",
                "format": "date",
                "type": "string"
              },
              "derniere_visite_depuis": {
                "description": "Dernier passage ce jour-là ou après (AAAA-MM-JJ).",
                "format": "date",
                "type": "string"
              },
              "inactif_depuis_jours": {
                "description": "Aucun passage depuis au moins N jours calendaires (un client jamais venu compte depuis son inscription).",
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "inscrit_avant": {
                "description": "Inscrit ce jour-là ou avant (AAAA-MM-JJ).",
                "format": "date",
                "type": "string"
              },
              "inscrit_depuis": {
                "description": "Inscrit ce jour-là ou après (AAAA-MM-JJ).",
                "format": "date",
                "type": "string"
              },
              "limite": {
                "default": 25,
                "description": "Nombre maximum de résultats.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "ordre": {
                "default": "auto",
                "description": "auto (défaut) : décroissant, sauf prenom (A→Z).",
                "enum": ["auto", "asc", "desc"],
                "type": "string"
              },
              "recherche": {
                "description": "Morceau du prénom ou du nom (accents et casse ignorés).",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "segment": {
                "default": "tous",
                "description": "Groupe de départ, défini comme dans l’application. tous (défaut) ; habitues = au moins 4 passages sur les 60 derniers jours ; perdus = venus au moins 4 fois, et absents depuis plus d’une fois et demie leur rythme habituel (médiane des écarts entre leurs passages), ou, sans assez d’historique, depuis plus de le délai du commerce ; congés et jours de fermeture non comptés ; presque = il ne leur manque qu’un tampon pour la récompense ; recompense_prete = une récompense gagnée, pas encore offerte, pas expirée ; nouveaux = inscrits dans les 30 derniers jours ; inactifs = aucun passage depuis plus de le délai du commerce, en jours calendaires, quel que soit leur nombre de visites ; un_seul_passage = un passage au plus : inscrits mais jamais revenus.",
                "enum": ["tous", "habitues", "perdus", "presque", "recompense_prete", "nouveaux", "inactifs", "un_seul_passage"],
                "type": "string"
              },
              "tampons_max": {
                "description": "Tampons au plus sur la carte en cours.",
                "minimum": 0,
                "type": "integer"
              },
              "tampons_min": {
                "description": "Tampons au moins sur la carte en cours.",
                "minimum": 0,
                "type": "integer"
              },
              "tri": {
                "default": "derniere_visite",
                "description": "Ordre des résultats. Défaut derniere_visite (les plus récents d’abord).",
