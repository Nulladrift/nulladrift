        {
          "name": "envoyer_message",
          "title": "Envoyer un message aux clients",
          "description": "Envoie une notification sur l’écran verrouillé des clients (via leur carte Apple Wallet ou Google Wallet). À utiliser pour annoncer une nouveauté, une offre, un événement, ou faire revenir des clients. L’audience est paramétrable (tous, habitués, perdus de vue, presque à la récompense, nouveaux, récompense à retirer, inactifs) et se combine avec des filtres (jours sans passage, tampons sur la carte, passages, date d’inscription). Texte de 180 caractères au plus, envoyé tel quel. Un seul message par jour et par commerce. AVEC client_id (rendu par chercher_clients) : un message à CE client seul, par exemple « votre commande est prête » (pressing, cordonnerie, traiteur, fleuriste) : un modèle prêt (modele = pret, retrait, recu, attente), ou texte + modele=libre ; en option aussi_sms et aussi_email. Il ne compte pas dans le message du jour à tous ; deux par client et par jour au plus. Appeler d’abord avec confirmer=false : l’aperçu donne le texte exact, le nombre de destinataires et combien peuvent vraiment le recevoir, sans rien envoyer. N’appeler avec confirmer=true qu’après l’accord explicite de la personne : un message parti ne se reprend pas. Pour les messages automatiques (relance, anniversaire, rappels), utiliser regler_automatismes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "actif_depuis_jours": {
                "description": "Filtre : au moins un passage dans les N derniers jours d’ouverture.",
                "maximum": 730,
                "minimum": 1,
                "type": "integer"
              },
              "audience": {
                "default": "tous",
                "description": "Qui reçoit le message. tous = tous les clients ; habitues = 4 passages ou plus sur 60 jours ; perdus = habitués dont l’absence dépasse une fois et demie leur rythme habituel, ou le délai du commerce sans assez d’historique (la définition de l’écran Clients) ; presque = il ne manque qu’un tampon avant la récompense ; nouveaux = inscrits depuis 30 jours (ou depuis inscrit_depuis) ; recompense_prete = une récompense gagnée, pas encore retirée ; inactifs = tout client sans passage depuis inactif_depuis_jours jours d’ouverture (par défaut le délai du commerce), habitué ou non. Toute audience autre que tous, ou tout filtre, demande la fonction « notifications ciblées ».",
                "enum": ["tous", "habitues", "perdus", "presque", "nouveaux", "recompense_prete", "inactifs"],
                "type": "string"
              },
              "aussi_email": {
                "default": false,
                "description": "Avec client_id : aussi par e-mail, si le client en a laissé un. Défaut false.",
                "type": "boolean"
              },
              "aussi_sms": {
                "default": false,
                "description": "Avec client_id : aussi par SMS (formule Croissance, budget du mois, entre 8 h et 20 h, sinon à l’ouverture). Défaut false.",
                "type": "boolean"
              },
              "client_id": {
                "description": "Identifiant (UUID) d’UN client, rendu par chercher_clients ou fiche_client : le message part à lui seul. Exclut audience et filtres.",
                "type": "string"
              },
              "confirmer": {
                "default": false,
                "description": "false (défaut) : rend seulement un aperçu de ce qui serait fait, sans rien changer. true : exécute. Toujours montrer l’aperçu à la personne et attendre son accord avant de repasser avec true.",
                "type": "boolean"
              },
              "inactif_depuis_jours": {
                "description": "Filtre : pas de passage depuis au moins N jours d’OUVERTURE (les jours fermés et les congés ne comptent pas).",
                "maximum": 730,
                "minimum": 1,
                "type": "integer"
              },
              "inscrit_avant": {
                "description": "Filtre : inscrits avant ce jour-là (AAAA-MM-JJ, exclu).",
                "format": "date",
                "type": "string"
              },
              "inscrit_depuis": {
                "description": "Filtre : inscrits ce jour-là ou après (AAAA-MM-JJ).",
                "format": "date",
                "type": "string"
              },
              "langue": {
                "description": "Avec client_id et un modèle : la langue du texte prêt. Par défaut, celle du commerce.",
                "enum": ["fr", "en", "es"],
                "type": "string"
              },
              "modele": {
                "description": "Avec client_id : pret = « Votre commande est prête… », retrait = « Votre article est prêt à être retiré… », recu = « Nous avons bien reçu votre commande… », attente = « Votre commande vous attend toujours… », libre = le texte donné. Par défaut : libre si texte est donné.",
                "enum": ["pret", "retrait", "recu", "attente", "libre"],
                "type": "string"
              },
              "passages_min": {
                "description": "Filtre : au moins N passages au total depuis l’inscription.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "tampons_max": {
                "description": "Filtre : au plus N tampons sur la carte en cours.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "tampons_min": {
                "description": "Filtre : au moins N tampons sur la carte en cours.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "texte": {
                "description": "Le texte exact de la notification, 180 caractères au plus. Il est précédé du nom du commerce sur le téléphone : inutile de le répéter. Obligatoire sans client_id ; avec client_id, seulement pour modele=libre.",
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
