                "type": "integer"
              },
              "wallet": {
                "default": "tous",
                "description": "Où le client garde sa carte. aucun = page web, sans wallet.",
                "enum": ["tous", "apple", "google", "aucun"],
                "type": "string"
              }
            },
            "type": "object"
