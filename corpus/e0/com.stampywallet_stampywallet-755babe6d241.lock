                "enum": ["rond", "etincelle", "eclat", "goutte", "main", "pinceau", "oeil", "ciseaux", "sechoir", "fleur", "lotus", "coeur", "etoile", "diamant", "couronne", "soleil", "lune", "talon", "robe", "sac", "serviette", "cafe", "grain", "the", "cookie", "gateau", "pain", "part", "burger", "glace", "bol", "plat", "verre", "biere", "bulles", "cocktail", "cerises", "orange", "avocat", "piment", "oeuf", "poisson", "fromage", "popcorn", "couteau", "carotte", "bocal", "esquimau", "feuille", "flamme", "eclair", "sourire", "patte", "chien", "chat", "cadeau", "haltere", "velo", "livre", "note", "appareil", "palette", "dent", "parapluie", "ballon", "tshirt", "basket", "tulipe", "plante", "os", "cintre", "lavelinge", "voiture", "cle", "botte", "montagne", "trophee", "des", "camion", "croissant"],
