              },
              "canal_messages": {
                "description": "Canal de « messages du commerçant » : auto (recommandé : un message important part d’abord par SMS sauf aux clients qui répondent aux notifications, un petit en notification et par SMS seulement aux clients qui répondent mieux aux SMS), notif, secours (SMS si la notification ne porte pas), sms (SMS d’abord).",
                "enum": ["auto", "notif", "secours", "sms"],
                "type": "string"
              },
              "canal_rappels": {
                "description": "Canal de « rappels » : auto (recommandé : un message important part d’abord par SMS sauf aux clients qui répondent aux notifications, un petit en notification et par SMS seulement aux clients qui répondent mieux aux SMS), notif, secours (SMS si la notification ne porte pas), sms (SMS d’abord).",
                "enum": ["auto", "notif", "secours", "sms"],
                "type": "string"
              },
              "canal_relance": {
                "description": "Canal de « relance » : auto (recommandé : un message important part d’abord par SMS sauf aux clients qui répondent aux notifications, un petit en notification et par SMS seulement aux clients qui répondent mieux aux SMS), notif, secours (SMS si la notification ne porte pas), sms (SMS d’abord).",
                "enum": ["auto", "notif", "secours", "sms"],
                "type": "string"
              },
              "confirmer": {
                "default": false,
                "description": "false (défaut) : rend seulement un aperçu de ce qui serait fait, sans rien changer. true : exécute. Toujours montrer l’aperçu à la personne et attendre son accord avant de repasser avec true.",
                "type": "boolean"
