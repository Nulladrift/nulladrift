        {
          "name": "programmer_message_recurrent",
          "title": "Programmer un message récurrent",
          "description": "Programme un message qui se répète tout seul sur l’écran verrouillé des clients : chaque semaine (un ou plusieurs jours), ou chaque mois (tel jour du mois, ou « le premier lundi », « le dernier vendredi »), à une heure du commerce entre 7 h et 21 h 45. Exemples : « chaque mardi 11 h, l’emplacement du food truck », « le 1er de chaque mois, aux anniversaires du mois ». Le groupe visé se recalcule à chaque envoi. Fin facultative : une date, ou un nombre d’envois. Règles : un message par jour (un jour où un autre message part déjà, l’occurrence est sautée), jours de fermeture et congés sautés (ou décalés au jour ouvert suivant avec si_ferme=decaler), heures calmes respectées, premier envoi dans les 60 jours. confirmer=false (défaut) rend un aperçu ; confirmer=true l’exécute, après l’accord explicite de la personne. Pour un envoi unique et immédiat, utiliser envoyer_message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmer": {
                "default": false,
                "description": "false (défaut) : rend seulement un aperçu de ce qui serait fait, sans rien changer. true : exécute. Toujours montrer l’aperçu à la personne et attendre son accord avant de repasser avec true.",
                "type": "boolean"
              },
              "debut": {
                "description": "Premier jour possible (AAAA-MM-JJ). Par défaut aujourd’hui.",
                "format": "date",
                "type": "string"
              },
              "fin": {
                "description": "Dernier jour possible, inclus (AAAA-MM-JJ). Facultatif.",
                "format": "date",
                "type": "string"
              },
              "frequence": {
                "description": "semaine : avec jours. mois : avec jour_mois, ou rang et jour_rang.",
                "enum": ["semaine", "mois"],
                "type": "string"
              },
              "groupe": {
                "description": "Qui le reçoit, recalculé à chaque envoi : tous, inactifs_30/60/90 (pas venus depuis N jours), proches (à 1 ou 2 tampons de la récompense), anniversaires (nés ce mois-ci), meilleurs, nouveaux. Un groupe autre que tous demande les notifications ciblées. Pour programmer seulement (défaut tous).",
                "enum": ["tous", "inactifs_30", "inactifs_60", "inactifs_90", "proches", "anniversaires", "meilleurs", "nouveaux"],
                "type": "string"
              },
              "heure": {
                "description": "L’heure du commerce, HH:MM, entre 07:00 et 21:45.",
                "pattern": "^\\d{1,2}:\\d{2}$",
                "type": "string"
              },
              "jour_mois": {
                "description": "Pour frequence=mois : le jour du mois (1 à 31 ; un 31 tombe le dernier jour d’un mois plus court).",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "jour_rang": {
                "description": "Le jour de la semaine qui va avec rang.",
                "enum": ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"],
                "type": "string"
