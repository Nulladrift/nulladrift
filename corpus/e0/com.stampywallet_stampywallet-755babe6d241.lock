        {
          "name": "modifier_carte",
          "title": "Modifier ma carte de fidélité",
          "description": "Change un ou plusieurs réglages de la carte de fidélité du commerce, en un seul appel : nom imprimé, style (collection, palette ou couleur libre), tampon, règle de récompense (mode tampons/paliers/points, seuils, récompenses), tampons offerts à l’inscription, expiration des récompenses, en mode paliers la forme de la carte (forme_paliers : tampons ou l’une des cinq formes), et en mode points le nom des points, la forme de la carte (forme_points), la valeur par défaut d’un passage, les raccourcis et les points par euro. Seuls les réglages donnés changent ; lire d’abord la carte avec voir_carte. Appeler avec confirmer=false (défaut) pour montrer l’avant/après, puis avec confirmer=true après accord explicite. Un changement de règle s’applique aussi aux cartes déjà chez les clients. Les images (logo, fond, tampon en image) se changent dans l’application, page Carte.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Style de la carte : original (sobre), cafe (cadre fin), botanique (italique, feuillages), trattoria (festonné), atelier (moderne), pass (comme un pass Apple Wallet : logo en grand, tampons en objets ombrés, fond franc).",
                "enum": ["original", "cafe", "botanique", "trattoria", "atelier", "pass"],
                "type": "string"
              },
              "confirmer": {
                "default": false,
                "description": "false (défaut) : rend seulement un aperçu de ce qui serait fait, sans rien changer. true : exécute. Toujours montrer l’aperçu à la personne et attendre son accord avant de repasser avec true.",
                "type": "boolean"
              },
              "couleur": {
                "description": "Couleur de fond libre, en hexadécimal. L’encre (texte) est choisie automatiquement pour rester lisible.",
                "examples": ["#2b4431"],
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "expiration_recompense_jours": {
                "description": "Jours pendant lesquels une récompense gagnée reste valable : 0, 30, 60, 90, 180, 365 (0 = n’expire pas).",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              },
              "forme_paliers": {
                "description": "Mode paliers : le dessin de la carte. tampons (défaut) : les tampons en grille, chaque récompense à la place du tampon de son seuil. Ou l’une des cinq formes des points, qui compte alors des tampons : medailles (une jauge et une médaille par récompense), vitrine (les récompenses côte à côte, chacune sa jauge), remplissage (la prochaine récompense en grand, qui se colore), chemin (une route en S où chaque tampon fait avancer le curseur), anneau (une jauge ronde autour de la prochaine récompense). Les photos des récompenses se déposent dans l’application, page Carte.",
                "enum": ["tampons", "medailles", "vitrine", "remplissage", "chemin", "anneau"],
                "type": "string"
              },
              "forme_points": {
                "description": "Mode points : le dessin de la carte. medailles (défaut) : une jauge épaisse et une grande médaille par récompense. vitrine : les récompenses côte à côte, chacune sa petite jauge. remplissage : la prochaine récompense en grand, qui se colore à mesure. chemin : une route en S, les récompenses en étapes. anneau : une jauge ronde autour de la prochaine récompense, la liste à côté. Les photos des récompenses se déposent dans l’application, page Carte.",
                "enum": ["medailles", "vitrine", "remplissage", "chemin", "anneau"],
                "type": "string"
              },
              "mode": {
                "description": "tampons : une récompense à un seuil (le plus simple). paliers : plusieurs récompenses sur la même carte (ex. 5 et 10). points : le commerçant saisit un nombre de points à chaque passage (paniers variables).",
                "enum": ["tampons", "paliers", "points"],
                "type": "string"
              },
              "nom": {
                "description": "Nom du commerce, imprimé en haut de la carte.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "nom_des_points": {
                "description": "Mode points : comment s’appellent les points (« points », « graines », « étoiles »…).",
                "maxLength": 20,
                "type": "string"
              },
              "palette": {
                "description": "Palette de la collection : 0, 1 ou 2 (chaque collection en propose trois ; pass en propose une quatrième, 3). Ignorée si « couleur » est donnée.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "paliers": {
                "description": "Les récompenses et leurs seuils (modes paliers et points). Du plus petit au plus grand.",
                "items": {
                  "additionalProperties": false,
