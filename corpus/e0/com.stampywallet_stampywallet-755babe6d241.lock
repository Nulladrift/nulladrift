        {
          "name": "ajouter_conges",
          "title": "Ajouter des congés",
          "description": "Ajoute une période de fermeture (congés, jour férié), du premier au dernier jour inclus. Les jours fermés ne comptent pas dans l’absence d’un client : des congés bien déclarés évitent que des habitués passent pour « perdus de vue » et reçoivent une relance au retour. En option, prevenir_clients=true avec un texte prépare aussi une notification à tous les clients (mêmes règles qu’envoyer_message : un message par jour). confirmer=false (défaut) rend un aperçu ; confirmer=true enregistre (et envoie le message s’il est demandé), après accord explicite de la personne.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "au": {
                "description": "Dernier jour fermé, inclus (AAAA-MM-JJ). Par défaut, le même jour que du.",
                "format": "date",
                "type": "string"
              },
              "confirmer": {
                "default": false,
                "description": "false (défaut) : rend seulement un aperçu de ce qui serait fait, sans rien changer. true : exécute. Toujours montrer l’aperçu à la personne et attendre son accord avant de repasser avec true.",
                "type": "boolean"
              },
              "du": {
                "description": "Premier jour fermé (AAAA-MM-JJ).",
                "format": "date",
                "type": "string"
              },
              "libelle": {
                "description": "Nom de la période, pour s’y retrouver (« Congés d’été »).",
                "maxLength": 80,
                "type": "string"
              },
              "prevenir_clients": {
                "default": false,
                "description": "true : envoie aussi une notification à tous les clients avec texte. Compte comme le message du jour.",
                "type": "boolean"
              },
              "texte": {
                "description": "Texte de la notification aux clients (180 caractères au plus), si prevenir_clients=true.",
                "maxLength": 180,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["du"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
