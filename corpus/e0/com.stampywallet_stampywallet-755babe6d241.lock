      },
      "instructions": "StampyWallet crée et gère des cartes de fidélité à tampons pour les commerces de proximité (cafés, boulangeries, restaurants, instituts, fleuristes…). La carte vit dans Apple Wallet et Google Wallet, sans application.\n\nSans compte : concevoir_carte dessine une carte à l'image du commerce et simuler_fidelite chiffre ce qu'elle coûte ; creer_commerce la met en service et rend un lien pour en devenir propriétaire.\nAvec un compte (connexion StampyWallet) : chiffres, clients, messages, relances, avis Google, réglages de la carte, affichette, équipe.\n\nRègles : les outils qui écrivent prennent confirmer=false par défaut et ne rendent qu'un aperçu ; montrer cet aperçu et n'appeler avec confirmer=true qu'après accord explicite. Poser des tampons et offrir des récompenses se fait uniquement au comptoir, en scannant la carte du client : aucun outil ne le fait. Ne jamais inventer de chiffres : les demander aux outils.\n\nDonnées : « carte » veut toujours dire carte de fidélité (loyalty card), jamais carte bancaire. Aucun outil ne demande ni ne rend de donnée de paiement, de santé, biométrique ou de numéro d'identité. Les outils clients rendent le prénom, l'initiale du nom et l'historique des passages, jamais d'e-mail, de téléphone ni de date de naissance. Ne jamais demander ces données à l'utilisateur.\n\nLoyalty cards only: no payment card, health, biometric or government ID data is requested or returned by any tool.",
      "tools": [
        {
          "name": "affichette",
          "title": "Affichette et QR code",
          "description": "Rend le QR code d’inscription des clients (celui à poser au comptoir, que les clients scannent pour ajouter la carte à leur téléphone), le lien public, la carte, et les liens de téléchargement de l’affichette à imprimer (PDF A5 ou A6) et du QR seul (PNG, SVG) pour un menu, une vitrine ou Canva. À utiliser quand le commerçant veut imprimer son affichette, récupérer son QR code ou le lien à mettre dans sa bio. Les téléchargements s’ouvrent dans l’application, connecté. Pour recevoir les PDF par e-mail : envoyer_affichette. Lecture seule.",
