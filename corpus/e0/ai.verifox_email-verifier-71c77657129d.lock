{
  "lockfileVersion": 2,
  "subjects": {
    "ai.verifox/email-verifier": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.verifox.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "verifox",
        "version": "1.2.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "find_email",
          "description": "Find ONE person's business email from their name and company domain. Generates ~50 permutations and SMTP-verifies each, waits for the result, and returns the best match (or not_found). Charges 10 Fox Credits per find.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Company domain, e.g. stripe.com",
                "type": "string"
              },
              "first_name": {
                "description": "Person's first name",
                "type": "string"
              },
              "last_name": {
                "description": "Person's last name",
                "type": "string"
              },
              "middle_name": {
                "description": "Optional middle name for more permutations",
                "type": "string"
              }
            },
            "required": ["domain", "first_name", "last_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9cd263bf02e0923d02a5680e81d68ba234e3713a36677fdd569d5c099162fd20"
        },
        {
          "name": "find_emails",
          "description": "Bulk-find business emails for a LIST of contacts (name + company domain each). Submits the list, waits for completion, and returns the found email per contact. Up to 1000 contacts. Charges 10 Fox Credits per contact. Large lists that don't finish quickly return a jobId to poll with get_job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "contacts": {
                "description": "Contacts to find emails for",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "domain": {
                      "description": "Company domain",
                      "type": "string"
                    },
                    "first_name": {
                      "type": "string"
                    },
                    "last_name": {
                      "type": "string"
                    },
                    "middle_name": {
                      "type": "string"
                    },
                    "name": {
                      "description": "Full name (alternative to first_name/last_name)",
                      "type": "string"
                    }
                  },
                  "required": ["domain"],
                  "type": "object"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              },
              "wait": {
                "description": "Wait for results in this call (default true)",
                "type": "boolean"
              }
            },
            "required": ["contacts"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:823956c8ed3392e8c34b6f0f8e3b759254223147feea578cbecb88cfd014dc58"
        },
        {
          "name": "get_credits",
          "description": "Get the current Fox Credit balance for the Verifox account tied to the API key. Free — no credits charged. Use it to check remaining balance before a big verify/find run (verify = 1 credit/email, find = 10 credits/contact).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2f33b8a733e92486d4a663932b929e8f5a4a0b24e9efcddbf6d74b7a537ecb7"
        },
        {
          "name": "get_job",
          "description": "Check an async job started by verify_emails, find_email, or find_emails. Returns results if finished, otherwise the current status. Use the type shown in the submitting tool's response.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "Job ID from verify_emails / find_email / find_emails",
                "type": "string"
              },
              "type": {
                "description": "Job type: verify_bulk, find_single, or find_bulk",
                "enum": ["verify_bulk", "find_single", "find_bulk"],
                "type": "string"
              }
            },
            "required": ["job_id", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62d1a16745940afd6fc1127459d5dd975141cc2234fa1987732206e0d7e0d6ea"
        },
        {
          "name": "verify_email",
          "description": "Verify whether ONE email address is deliverable. Checks syntax, MX, SMTP, catch-all, disposable, free-provider and role detection, and returns a 0-100 quality score. Charges 1 Fox Credit per check, including a repeat answered from the 24-hour result cache.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email address to verify",
                "format": "email",
                "type": "string"
              },
              "proxy": {
                "description": "Use a SOCKS5 proxy for the SMTP check",
                "type": "boolean"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:afcf38c2cd6aae6dabc733c90aa683079b69bf13f691a95cac68d3c05a01f9da"
        },
        {
          "name": "verify_emails",
          "description": "Bulk-verify a LIST of email addresses. Submits the whole list, waits for completion, and returns one result per email (same fields as verify_email). Best for cleaning lead lists. Charges 1 Fox Credit per email. Large lists that don't finish quickly return a jobId to poll with get_job.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "emails": {
                "description": "Email addresses to verify",
                "items": {
                  "format": "email",
                  "type": "string"
                },
                "maxItems": 100000,
                "minItems": 1,
                "type": "array"
              },
              "wait": {
                "description": "Wait for results in this call (default true). Set false to just get a jobId.",
                "type": "boolean"
              }
            },
            "required": ["emails"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:755081e529b897632c509f17b0ac1a9bb5afa502bf3fb95b0aa8ed79e7f93c0f"
        }
      ],
      "digest": "sha256:0250073732a4465af35429cb6c6e1f4bdf245b55f3039736c36ff02faf3c274a"
    }
  }
}
