        "name": "free100leads",
        "title": "free100leads.com",
        "version": "1.0.0",
        "websiteUrl": "https://free100leads.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free100Leads is a B2B contact database searchable by country, industry, company size and job title, with a daily allowance for any visitor. list_coverage returns the countries, industries, company-size bands and US states available. check_coverage says whether a combination of those is covered and returns a link to claim contacts for it on the site. how_it_works describes the daily allowance and what a record contains. This server returns coverage only, never contacts or record counts.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check a filter combination",
          "description": "Whether a combination of country, industry, company size and US state is covered, with the canonical names and a link to that search on the site. Use it for \"do you have fintech contacts in Germany\" or \"small companies in Texas\". Limitation: says covered or not; the number of matching records and the records themselves are shown on the site, not here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company_size": {
                "description": "Employee band such as \"11-50\", or a headcount such as \"200\"",
                "type": "string"
              },
              "country": {
                "description": "Country name or ISO code, e.g. Germany or DE",
                "type": "string"
              },
              "industry": {
                "description": "Industry name, e.g. fintech, software, healthcare",
                "type": "string"
              },
              "us_state": {
                "description": "US state name or code; only with country US",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a filter combination"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b086aa842b5a8e469016bdefb5590637b1ca62b90ca4ffb4bb71d55b63bcc8f"
        },
        {
          "name": "how_it_works",
          "title": "How Free100Leads works",
          "description": "What Free100Leads is, what a record contains, how the daily allowance works, and the links to the site, the API docs and the removal form. Use it when the user asks how to get contacts from Free100Leads. Returns text and links only.",
