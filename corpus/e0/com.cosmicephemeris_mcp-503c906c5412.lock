      "instructions": "Use cosmicephemeris_calculate or cosmicephemeris_symbolic only with explicit user-provided inputs and consent to metered calls. Results are calculations, not medical, legal, financial, or predictive advice. Never expose the Cosmic Ephemeris key in browser code or model-visible arguments.",
