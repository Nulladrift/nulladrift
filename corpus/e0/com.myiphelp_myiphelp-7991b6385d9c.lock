      "serverInfo": {
        "name": "My IP Help",
        "title": "My IP Help",
        "version": "1.0.0",
        "description": "IP lookups for AI assistants: location, network (ASN, ISP) and a 0-100 risk score.",
        "websiteUrl": "https://www.myiphelp.com/mcp",
        "icons": [
          {
            "src": "https://www.myiphelp.com/app/brand/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "IP address intelligence from My IP Help (myiphelp.com): geolocation, network (ASN, ISP), a 0-100 risk score\nand, by plan, its reasons and the VPN, proxy, Tor and datacenter flags.\n\n- One address: lookup_ip (everything) or check_ip_risk (the risk verdict) or lookup_asn (the network).\n- Two or more addresses: ONE bulk_lookup call with all of them, never repeated single lookups.\n- get_my_usage shows the plan and the lookups left; it costs no lookup.\n\nEach address that returns data counts one lookup against the account's monthly quota. Private and reserved\naddresses (10.0.0.0/8, 192.168.0.0/16, documentation ranges and the like) cannot be looked up.\nWhen you show the data to someone, include the attribution text that comes with each result.",
      "tools": [
        {
          "name": "bulk_lookup",
          "title": "Look up several IP addresses",
          "description": "Geolocation, network and risk data (the score with its main reason on every plan; the full breakdown and security flags from Pro) for SEVERAL IP addresses in one call. Sends them in batches of the plan's bulk size (Free: 20 per request). Each address that returns data counts one lookup against the monthly quota; private, reserved, unknown and duplicate addresses are not counted.",
          "inputSchema": {
            "properties": {
              "ips": {
                "description": "The IPv4 or IPv6 addresses to look up (at most 1000).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up several IP addresses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c1ea8e40356967bf7317e2fc2b62c7d9c0c21613fddfd4ee274b75d92898f7da"
        },
        {
          "name": "check_ip_risk",
          "title": "Check an IP address's risk",
          "description": "Risk verdict for ONE public IP address: a 0-100 risk score, its band and label and the main reason behind it (risk_reason, every plan), and (Pro plan and up) the full breakdown: every signal with its points and source, plus VPN, proxy, Tor, datacenter, hijacked-network and verified-bot flags. Counts one lookup against the monthly quota.",
          "inputSchema": {
            "properties": {
              "ip": {
                "description": "A public IPv4 or IPv6 address.",
                "type": "string"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check an IP address's risk"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:eae329424cd3c4ca7c061a49c8783bd2cfa760f96b3ca5c03516910f23cba861"
        },
        {
          "name": "get_my_usage",
          "title": "Show my API usage",
          "description": "The API key's plan, the lookups used and left this lookup month (single lookups plus bulk IPs), when the month resets, and the rate limit. Does not count as a lookup.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show my API usage"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8648f7a07d967b542e80eb2806eb0a54acbd389d91413a70a19b577362419876"
        },
        {
          "name": "lookup_asn",
          "title": "Look up a network (ASN) by IP or AS number",
          "description": "The autonomous system (ASN) behind ONE public IP address, or ONE network by its AS number (\"AS13335\" or \"13335\"). For an IP: the ASN, its name, the ISP and organization, and (by plan) its registry, allocation date, cloud provider, datacenter flag. For an AS number: its name, how many IPv4 and IPv6 ranges it announces, its IPv4 address count and largest prefixes, and (by plan) the datacenter flag. Both link to the network's page on myiphelp.com and count one lookup against the monthly quota.",
          "inputSchema": {
            "properties": {
              "asn": {
                "description": "An AS number, e.g. AS13335 or 13335, instead of an IP.",
                "type": "string"
              },
              "ip": {
                "description": "A public IPv4 or IPv6 address whose network you want (or an AS number, as in \"asn\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
