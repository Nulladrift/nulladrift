            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:596df4ea2347e548da5b0bd0e479533a23bf6475e6569d86a953a88c112dd28d"
        },
        {
          "name": "lookup_ip",
          "title": "Look up an IP address",
          "description": "Geolocation, network (ISP, ASN), risk score with its main reason (risk_reason) and, from Pro, the full breakdown of the score (risk_signals) and the security flags for ONE public IPv4 or IPv6 address. Counts one lookup against the key's monthly quota.",
