                "type": "string"
              },
              "blend": {
                "description": "A second world mixed in, or \"none\".",
                "enum": ["calm", "bold", "playful", "luxury", "technical", "editorial", "warm", "sakura", "brutalist", "retro", "noir", "organic", "corporate", "cyber", "none"],
                "type": "string"
              },
              "brand": {
                "description": "Brand or product name.",
                "type": "string"
              },
              "colors": {
                "description": "Brand colours as hex or names, most important first. Kept exact. Leave out to let the designer choose.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cta": {
                "description": "The call to action label.",
                "type": "string"
              },
              "headline": {
                "description": "The main headline.",
                "type": "string"
              },
              "knobs": {
                "additionalProperties": false,
                "description": "Explicit settings that override the world. Every one can also be said in plain words through \"tweak\".",
                "properties": {
                  "accent": {
                    "description": "Main accent, hex or colour name. Kept exact.",
                    "type": "string"
                  },
                  "accent2": {
                    "description": "Second accent, hex or colour name.",
                    "type": "string"
                  },
                  "accent3": {
                    "description": "Third accent, hex or colour name.",
                    "type": "string"
                  },
                  "align": {
                    "enum": ["left", "center"],
                    "type": "string"
                  },
                  "border": {
                    "description": "Border weight in px.",
                    "enum": [0, 1, 2],
                    "type": "number"
                  },
                  "caps": {
                    "description": "Headings in capitals.",
                    "type": "boolean"
                  },
                  "contrast": {
                    "enum": ["soft", "normal", "high"],
                    "type": "string"
                  },
                  "corner": {
                    "enum": ["square", "round", "pill"],
                    "type": "string"
                  },
                  "density": {
                    "enum": ["airy", "regular", "compact"],
                    "type": "string"
                  },
                  "depth": {
                    "description": "Steps darker (positive) or lighter backgrounds within the theme.",
                    "maximum": 3,
                    "minimum": -3,
                    "type": "number"
                  },
                  "displayFont": {
                    "description": "Heading face: a kind (serif, sans, mono, rounded, slab, condensed, geometric, grotesk, humanist, didone, mincho) or a face name such as \"Didot\" or \"Futura\". Fallbacks are added.",
                    "type": "string"
                  },
                  "displayWeight": {
                    "maximum": 900,
                    "minimum": 200,
                    "type": "number"
                  },
                  "followSystem": {
                    "description": "Follow the visitor's system light or dark setting instead of the default theme.",
                    "type": "boolean"
                  },
                  "glow": {
                    "type": "boolean"
                  },
                  "hero": {
                    "enum": ["backdrop", "split", "kinetic"],
                    "type": "string"
                  },
                  "japanese": {
                    "description": "Japanese text allowed, with Japanese faces in the stacks.",
                    "type": "boolean"
                  },
                  "motionIntensity": {
                    "description": "0 is nearly still, 1 is the most movement.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "motionSpeed": {
                    "description": "Multiplier on the world's pace: 0.75 is slower, 1.3 faster.",
                    "maximum": 3,
                    "minimum": 0.25,
                    "type": "number"
                  },
                  "radius": {
                    "description": "Corner radius in px.",
                    "maximum": 48,
                    "minimum": 0,
                    "type": "number"
                  },
                  "saturation": {
                    "description": "Steps more vivid or more muted, for colours the designer picks.",
                    "maximum": 3,
                    "minimum": -3,
                    "type": "number"
                  },
                  "scale": {
                    "description": "How far the type scale climbs.",
                    "enum": ["modest", "regular", "dramatic"],
                    "type": "string"
                  },
                  "surface": {
                    "enum": ["flat", "glass", "shadow", "outline"],
                    "type": "string"
                  },
                  "textFont": {
                    "description": "Body face, same choices as displayFont.",
                    "type": "string"
                  },
                  "texture": {
                    "enum": ["none", "grain", "dots", "grid", "paper"],
                    "type": "string"
                  },
                  "textureStrength": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "theme": {
                    "description": "The default theme. Both themes are always in the tokens.",
                    "enum": ["light", "dark"],
                    "type": "string"
                  },
                  "tracking": {
                    "description": "Heading letter spacing in em.",
                    "maximum": 0.24,
                    "minimum": -0.08,
                    "type": "number"
                  },
                  "warmth": {
                    "description": "Steps warmer (positive) or cooler (negative).",
                    "maximum": 3,
                    "minimum": -3,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "mood": {
                "description": "How it should feel, in the user's words. Naming worlds works too: \"luxury + sakura\", \"brutalist\", \"Y2K\".",
                "type": "string"
              },
              "option": {
                "description": "Which of the three design_options for this same brief.",
                "enum": [1, 2, 3],
                "type": "number"
              },
              "subline": {
                "description": "One supporting sentence.",
                "type": "string"
              },
              "theme": {
                "description": "The default theme. Leave out to let the world decide; both themes are always made.",
                "enum": ["dark", "light"],
                "type": "string"
              },
              "tweak": {
                "description": "Changes in plain words to apply before saving, as in adjust_direction.",
                "type": "string"
              },
              "world": {
                "description": "Force a world instead of letting the brief choose.",
                "enum": ["calm", "bold", "playful", "luxury", "technical", "editorial", "warm", "sakura", "brutalist", "retro", "noir", "organic", "corporate", "cyber"],
                "type": "string"
              }
            },
            "required": ["app"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
