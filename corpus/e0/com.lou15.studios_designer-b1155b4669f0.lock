        {
          "name": "review_page",
          "title": "Review a page",
          "description": "Checks a page you composed before the user sees it. Pass the direction_id and the files you wrote, each with its content (page file, block files, CSS). Returns findings, each with severity, file and line, the problem and the exact fix: contrast below WCAG AA, colours outside the direction, more than one statement piece on a screen, images without alt, missing landmarks or skipped headings, motion without a reduced-motion fallback, widths that overflow a 375px phone, placeholder copy, missing licence headers. When this server can render, also screenshots at 1440 and 375px and what it measured there (sideways scroll, clipped or overlapping text, small tap targets, real contrast). Free; fix every high finding, then review again.",
          "inputSchema": {
            "properties": {
              "direction_id": {
                "description": "The direction the page was composed for.",
                "type": "string"
              },
              "entry": {
                "description": "Optional: the path of the file that renders the page, when it is not page.tsx, App.tsx or index.tsx.",
                "type": "string"
              },
              "files": {
                "description": "The page file, its block files and any CSS it imports. Installed component files are optional (without them each shows as a labelled box in the screenshot).",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
