                "description": "The direction_id from set_direction (or create_direction).",
                "type": "string"
              },
              "slug": {
                "description": "The component slug, for example \"glow-button\".",
                "type": "string"
              }
            },
            "required": ["direction_id", "slug"],
            "type": "object"
