        {
          "name": "set_direction",
          "title": "Save the direction",
          "description": "Call this once the user has picked one of the design_options (pass the same brief plus option 1, 2 or 3), or straight away when the user already knows the look (pass world, blend and knobs, or a tweak in plain words). Saves the direction and returns its direction_id, a description to tell the user, and the theme CSS for both light and dark: save it as styles/louis-studios-theme.css and import it once in the root layout. Every other designer tool takes this direction_id.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "What the site or app is and does, in a sentence or two.",
                "type": "string"
              },
              "audience": {
                "description": "Who it is for.",
                "type": "string"
              },
              "avoid": {
