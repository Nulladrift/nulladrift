        {
          "name": "get_dots",
          "title": "Get dots drawn for the site",
          "description": "Dot Room dots in the product's palette. As \"accent\": each dot as its own React file (live and animated) with the brand colours, theme, numeral font and ring weight baked in. As \"texture\": a quiet repeating background made of the chosen dots in one brand tone, as CSS (a class to put on any section) and the SVG tile. Costs like the Dot Room: 1 coin a dot, 10 for the whole archive, free on Max; open 30 days. preview: true shows the plan and price without spending.",
          "inputSchema": {
            "properties": {
              "dir": {
                "description": "Project-relative folder for files (default \"components\").",
                "type": "string"
              },
              "direction_id": {
                "description": "The direction_id (from set_direction or create_direction). Items are drawn in its stroke weight, sizes and colours.",
                "type": "string"
              },
              "dots": {
                "description": "Dot kinds from browse_rooms (room \"dot-room\"), for example [\"heart-rate\", \"aqi\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 24,
                "minItems": 1,
                "type": "array"
              },
              "format": {
                "description": "accent: \"react\" (default) or \"svg\" (a still of each). texture: always CSS plus the SVG tile.",
                "enum": ["react", "svg", "css"],
                "type": "string"
              },
              "preview": {
                "description": "Only show the plan and the price. Spends nothing.",
                "type": "boolean"
              },
              "size": {
                "description": "Dot diameter in px (default: the type scale step nearest 64).",
                "maximum": 240,
                "minimum": 24,
                "type": "number"
              },
              "strength": {
                "description": "texture: how strong it is, 0.03 to 0.6 (default from the direction, about 0.12).",
                "maximum": 0.6,
                "minimum": 0.03,
                "type": "number"
              },
              "tone": {
                "description": "texture: which token tone it is drawn in (default accent).",
                "enum": ["accent", "ink", "muted"],
                "type": "string"
              },
              "use": {
                "description": "\"accent\" (default): the dots themselves. \"texture\": a background made from them.",
                "enum": ["accent", "texture"],
                "type": "string"
              }
            },
            "required": ["dots"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
