        {
          "name": "create_direction",
          "title": "Design a direction",
          "description": "Start here. Turns what the user wants into a design direction for the app: a palette built from their colours or mood, type, radius, motion and layout. Returns a direction_id for the other tools and a theme CSS file of tokens to save in the project.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "What the app is and does, in a sentence or two.",
                "type": "string"
              },
              "audience": {
                "description": "Who it is for.",
                "type": "string"
              },
              "avoid": {
                "description": "Things the user does not want, for example \"playful\".",
                "type": "string"
              },
              "brand": {
                "description": "Brand or product name.",
                "type": "string"
              },
              "colors": {
                "description": "Brand colours as hex (\"#ff5a1f\") or names (\"teal\"), most important first. Leave out to let the designer choose.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cta": {
                "description": "The call to action label.",
                "type": "string"
              },
              "headline": {
                "description": "The main headline.",
                "type": "string"
              },
              "mood": {
                "description": "How it should feel, in the user's words: \"calm and premium\", \"loud and sporty\", \"playful\", \"editorial\"...",
                "type": "string"
              },
              "subline": {
                "description": "One supporting sentence.",
                "type": "string"
              },
              "theme": {
                "description": "Force a dark or light theme. Leave out to let the mood decide.",
                "enum": ["dark", "light"],
                "type": "string"
              }
            },
            "required": ["app"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f6917aef971fc7cabeee09b2487e753806538430fe0f50a1631b0e85599f1b90"
        },
        {
          "name": "design_options",
          "title": "Show three directions",
          "description": "Call this first, before any page or component work on a new site, once you know what the site is (ask for the brand, what it does, who it is for, the mood and any brand colours if you cannot read them from the project). Returns three clearly different design directions for the brief (different world, palette, type and shape), each with its palette in light and dark and its type. Saves nothing. Show the user the three in a few lines each and ask which one, then call set_direction with the same brief and the chosen option number.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "What the site or app is and does, in a sentence or two.",
                "type": "string"
              },
              "audience": {
                "description": "Who it is for.",
                "type": "string"
              },
              "avoid": {
                "description": "What the user does not want, for example \"playful\" or \"glow\".",
                "type": "string"
              },
              "blend": {
                "description": "A second world mixed in, or \"none\".",
                "enum": ["calm", "bold", "playful", "luxury", "technical", "editorial", "warm", "sakura", "brutalist", "retro", "noir", "organic", "corporate", "cyber", "none"],
                "type": "string"
              },
              "brand": {
                "description": "Brand or product name.",
                "type": "string"
              },
              "colors": {
                "description": "Brand colours as hex or names, most important first. Kept exact. Leave out to let the designer choose.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cta": {
                "description": "The call to action label.",
                "type": "string"
              },
              "headline": {
                "description": "The main headline.",
                "type": "string"
              },
              "knobs": {
                "additionalProperties": false,
                "description": "Explicit settings that override the world. Every one can also be said in plain words through \"tweak\".",
                "properties": {
                  "accent": {
                    "description": "Main accent, hex or colour name. Kept exact.",
                    "type": "string"
                  },
                  "accent2": {
                    "description": "Second accent, hex or colour name.",
                    "type": "string"
                  },
                  "accent3": {
                    "description": "Third accent, hex or colour name.",
                    "type": "string"
                  },
                  "align": {
                    "enum": ["left", "center"],
                    "type": "string"
                  },
                  "border": {
                    "description": "Border weight in px.",
                    "enum": [0, 1, 2],
                    "type": "number"
                  },
                  "caps": {
                    "description": "Headings in capitals.",
                    "type": "boolean"
                  },
                  "contrast": {
                    "enum": ["soft", "normal", "high"],
                    "type": "string"
                  },
                  "corner": {
                    "enum": ["square", "round", "pill"],
                    "type": "string"
                  },
                  "density": {
                    "enum": ["airy", "regular", "compact"],
                    "type": "string"
                  },
                  "depth": {
                    "description": "Steps darker (positive) or lighter backgrounds within the theme.",
                    "maximum": 3,
                    "minimum": -3,
                    "type": "number"
                  },
                  "displayFont": {
                    "description": "Heading face: a kind (serif, sans, mono, rounded, slab, condensed, geometric, grotesk, humanist, didone, mincho) or a face name such as \"Didot\" or \"Futura\". Fallbacks are added.",
                    "type": "string"
                  },
                  "displayWeight": {
                    "maximum": 900,
                    "minimum": 200,
                    "type": "number"
                  },
                  "followSystem": {
                    "description": "Follow the visitor's system light or dark setting instead of the default theme.",
                    "type": "boolean"
                  },
                  "glow": {
                    "type": "boolean"
                  },
                  "hero": {
                    "enum": ["backdrop", "split", "kinetic"],
                    "type": "string"
                  },
                  "japanese": {
                    "description": "Japanese text allowed, with Japanese faces in the stacks.",
                    "type": "boolean"
                  },
                  "motionIntensity": {
                    "description": "0 is nearly still, 1 is the most movement.",
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "motionSpeed": {
                    "description": "Multiplier on the world's pace: 0.75 is slower, 1.3 faster.",
                    "maximum": 3,
                    "minimum": 0.25,
                    "type": "number"
                  },
                  "radius": {
                    "description": "Corner radius in px.",
                    "maximum": 48,
                    "minimum": 0,
                    "type": "number"
                  },
                  "saturation": {
                    "description": "Steps more vivid or more muted, for colours the designer picks.",
                    "maximum": 3,
                    "minimum": -3,
                    "type": "number"
                  },
                  "scale": {
                    "description": "How far the type scale climbs.",
                    "enum": ["modest", "regular", "dramatic"],
                    "type": "string"
                  },
                  "surface": {
                    "enum": ["flat", "glass", "shadow", "outline"],
                    "type": "string"
                  },
                  "textFont": {
                    "description": "Body face, same choices as displayFont.",
                    "type": "string"
                  },
                  "texture": {
                    "enum": ["none", "grain", "dots", "grid", "paper"],
                    "type": "string"
                  },
                  "textureStrength": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "theme": {
                    "description": "The default theme. Both themes are always in the tokens.",
                    "enum": ["light", "dark"],
                    "type": "string"
                  },
                  "tracking": {
                    "description": "Heading letter spacing in em.",
                    "maximum": 0.24,
                    "minimum": -0.08,
                    "type": "number"
                  },
                  "warmth": {
                    "description": "Steps warmer (positive) or cooler (negative).",
                    "maximum": 3,
                    "minimum": -3,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "mood": {
                "description": "How it should feel, in the user's words. Naming worlds works too: \"luxury + sakura\", \"brutalist\", \"Y2K\".",
                "type": "string"
              },
              "subline": {
                "description": "One supporting sentence.",
                "type": "string"
              },
              "theme": {
                "description": "The default theme. Leave out to let the world decide; both themes are always made.",
                "enum": ["dark", "light"],
                "type": "string"
              },
              "world": {
                "description": "Force a world instead of letting the brief choose.",
                "enum": ["calm", "bold", "playful", "luxury", "technical", "editorial", "warm", "sakura", "brutalist", "retro", "noir", "organic", "corporate", "cyber"],
                "type": "string"
              }
            },
            "required": ["app"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56f7834defd3347591dd5818ec4bb4415a390a9c2c3096e97a685061a48ea48a"
        },
        {
          "name": "fit_component",
          "title": "Install a component, fitted to the site",
          "description": "Installs a component licensed to the account, fully fitted to the direction: its colours and type become the product's, and its motion speed and intensity, corners, stroke and border weight, density, light or dark build and sample copy change to suit the site. Costs exactly what install_component costs (its price in coins on Pro 30, free on Max, free again for 30 days). By default a one-line shell command; pass as \"source\" to get the file itself when you cannot run commands. Call fit_preview first to see what will change.",
          "inputSchema": {
            "properties": {
              "as": {
                "description": "\"command\" (default): a curl command, valid for 15 minutes. \"source\": the licensed, fitted file.",
