      "instructions": "You are connected to the Louis Studios designer (studios.lou15.com). Louis Studios makes hand-made animated React components, each a single self-contained TSX file with no dependencies beyond React 18. This server does not just hand them out: it designs with them, tailoring palette, type, shape, motion, copy and layout to what the user wants, so every app it touches looks exclusive, professional and unlike any other.\n\nWhenever you build or restyle a web UI (React, Next.js, Vite, Remix or similar):\n1. Learn what the user wants: the brand name, who it is for, the mood, any brand colours, the headline and call to action. Ask briefly if you do not know and cannot read it from the project.\n2. Call design_options with that brief and show the user the three directions it returns. When they pick one, call set_direction with the same brief and that option (or go straight to set_direction when the user already knows the look). Save the theme CSS it returns as styles/louis-studios-theme.css and import it once in the root layout. Keep the direction_id.\n3. For a whole site, call plan_site with the site type and the user's real content, then compose_page for each page in the plan. For a single part, call compose_block. Write every file they return.\n4. Install each component they list with fit_component and the direction_id, so every file arrives made for this site. Take icons, dot accents and a brand mark from the rooms (get_icons, get_dots, make_mark) so the whole site is drawn in one hand.\n5. Call review_page on every page before you show it, and fix every finding marked high.\n6. If the user wants it different (\"warmer\", \"square corners\", \"slower\", \"more air\", other colours), call adjust_direction with their words and compose again. Never fall back to generic styling.\n\nThe first designer tools (create_direction, update_direction, compose_section, install_component, recommend_components, tailor_component) still work and their direction ids are interchangeable with the newer ones. Prefer the steps above for new work.\n\nTaste: one statement piece per screen with quiet surroundings; use the direction's tokens for every surface, border, radius and font so the components and the rest of the app read as one design. Tailor components through their props; do not rewrite their internals.\n\nThe designer is open to every Louis Studios account. Planning, directions, previews and page layouts cost nothing. Each component you install costs its price in the account's coins: 1 for most, 2 to 5 for a Studio exclusive; a free account has 2 coins a month, Pro plans 15 to 30 a week, and on Max installs are unlimited. Anything installed stays unlocked for 30 days, so installing the same one again within 30 days is free. Install only what the app will use, and check account_status and a component's price when unsure; when the coins run out, say so and point the user to https://studios.lou15.com/pro instead of working around it. Everything you install is licensed to the account owner (for personal use when paid with a free account's coins, for commercial use on any paid plan or with bought coins): keep the license header at the top of each file and never share or republish component source.\n\nDesigner v2: for a new site, call design_options with the brief and let the user pick one of the three directions, then set_direction with the same brief and that option; save the theme CSS it returns (light and dark) as styles/louis-studios-theme.css. Whenever the user asks for the look to change, call adjust_direction with their words before composing again. Every direction_id from set_direction works with the other designer tools, and every one from create_direction works with adjust_direction.\n\nFit engine: to put a component on the site, call fit_preview to see what will change, then fit_component with the direction_id. It installs at the same price as install_component, and the file arrives made for this site: colours and type, and also its motion speed and intensity, corners, stroke weight, density, light or dark build and sample copy. Prefer fit_component over install_component whenever there is a direction. Things that stay as made are named with the reason, so you can choose another piece if one must change.\n\nRooms: browse_rooms lists every room (library, Island Room, Sakura Collection, Icon Room, Dot Room, Logo Room) and searches inside one. Use the rooms to finish a site in one hand: get_icons for every icon the site needs, drawn in its stroke, size and colours (one React file, import the named exports; never mix in another icon set), get_dots for live watch-style accents or a quiet dot texture in the palette, and make_mark for a brand mark when the user has none. Looking is free; delivery costs coins like the site (1 an item, 10 a whole archive, free on Max), so take only what the site will use, all icons in one call. Keep the license header in every file.\n\nWhole sites (v2): after set_direction, call plan_site with the site type and the user's real content (features, plans, menu, quotes, contact...), then compose_page for each page in the plan. Write every file it returns, install the listed components with fit_component and the same direction_id, import the theme and site CSS once in the root layout, and pass the files you wrote to review_page before showing the user. Never invent facts the user did not give: blocks that need numbers, prices, names or quotes are left out of the plan until the content has them, and stand-in copy comes back under \"copy to confirm\". compose_block makes or remakes one block in another variant.\n\nLook before you show: after compose_page, or whenever you write or change a page, call review_page with the direction_id and every file you wrote for it (page, blocks, CSS). It returns findings with the exact fix for each and, when this server can render, screenshots at 1440 and 375px. Fix every finding marked high, review again until none are left, and only then show the page to the user. Fix medium findings unless you have a clear reason not to; low ones are suggestions.",
