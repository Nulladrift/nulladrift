                  "type": "string"
                },
                "type": "array"
              },
              "cta": {
                "description": "The call to action label.",
                "type": "string"
              },
              "direction_id": {
                "description": "The direction_id from set_direction or create_direction.",
                "type": "string"
              },
              "headline": {
                "description": "The main headline.",
                "type": "string"
              },
              "knobs": {
                "additionalProperties": false,
