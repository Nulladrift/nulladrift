        {
          "name": "adjust_direction",
          "title": "Adjust the direction",
          "description": "Call this whenever the user wants the look changed after a direction exists, before composing or fitting anything again. Say the change in plain words in \"tweak\" (\"square corners\", \"slower\", \"serif headings\", \"no glow\", \"more air\", \"compact\", \"glass\", \"grain off\", \"darker\", \"warmer\", \"accent teal\", \"luxury + sakura\", \"less playful\") or set explicit knobs. Works on any direction_id, including ones made by create_direction. Returns what changed, anything it did not understand, the new description and the new theme CSS to replace the saved file; compose and fit again afterwards so everything follows.",
