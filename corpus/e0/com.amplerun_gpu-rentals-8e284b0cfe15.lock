{
  "lockfileVersion": 2,
  "subjects": {
    "com.amplerun/gpu-rentals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://amplerun.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "amplerun",
        "title": "AmpleRun GPU rentals",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AmpleRun rents GPUs from independent hosts, paid from a prepaid USDC or USDT balance. Money values are integer strings in micro-units: \"1000000\" is 1 USDC. Offer prices are per hour for the whole machine, fee included. Renting goes list_templates, search_offers, get_quote (optional), create_rental, get_rental; stop_rental ends a rental. No account yet? get_agent_account_challenge then register_agent_account opens one for this agent with a wallet signature, no email. host_this_machine mints an enrollment token and returns the install command. list_my_machines, set_price, list_machine and get_earnings manage a host fleet. Pass owner_account_id when an owner has delegated that fleet. top_up and pay_for_rental return the x402 payment requirements for USDC; this server has no wallet to pay them. pay_for_rental offers mainnet only when the operator set X402_MAINNET_ENABLED. top_up keeps the networks already offered. This server is read-only: create_rental, stop_rental and withdraw are refused. Refused: this AmpleRun MCP server is read-only. Restart it with AMPLERUN_MCP_ALLOW_SPEND=1 in its environment to allow creating and stopping rentals.",
      "tools": [
        {
          "name": "get_agent_account_challenge",
          "title": "Start registering this agent's own AmpleRun account",
          "description": "Step 1 of 2. Returns an EIP-4361 (Sign-In with Ethereum) message for a wallet address this agent controls, valid five minutes, single use. Signing it accepts the AmpleRun Terms version it names. Sign the message exactly as returned with personal_sign (EIP-191), then call register_agent_account with message and signature. Never send a private key to any tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "The agent's wallet address (0x...). Defaults to this server's wallet when it has one.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bfcb66a177eebba5d6cf4cd403c983ac1c2661bed9b4b9a5b22b40cdbcf4e349"
        },
        {
          "name": "register_agent_account",
          "title": "Register this agent's own AmpleRun account",
          "description": "Step 2 of 2. Opens an AmpleRun account for this AI agent, tagged as agent-created, with its wallet as the verified payout wallet, and returns an API key (shown once; keep it secret). The same wallet again returns the same account and a new key. There is no free credit: renting needs a deposit first. Pass message and signature from get_agent_account_challenge. scopes defaults to [\"renter\",\"host\"].",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent": {
                "properties": {
                  "homepage": {
                    "format": "uri",
                    "maxLength": 2048,
                    "type": "string"
                  },
                  "model": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "name": {
                    "description": "This agent's name.",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "operator_contact": {
                    "description": "How to reach the person or business running this agent.",
                    "maxLength": 254,
                    "minLength": 1,
                    "type": "string"
                  },
                  "vendor": {
                    "description": "Who made the agent or its model, e.g. \"grok\".",
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["name", "vendor"],
                "type": "object"
              },
              "message": {
                "description": "The challenge message, exactly as returned.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "scopes": {
                "items": {
                  "enum": ["renter", "host"],
                  "type": "string"
                },
                "maxItems": 2,
                "minItems": 1,
                "type": "array"
              },
              "signature": {
                "description": "0x-prefixed EIP-191 signature of message.",
                "maxLength": 1024,
                "pattern": "^0x[0-9a-fA-F]+$",
                "type": "string"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f97ad46f92d1c977dab496d7830541b7ac917a5b92d80347b76ef3dafb89ac66"
        }
      ],
      "digest": "sha256:6cbfd0bc30179e10d735a106d603d884dbbe67495effd7a5df331b23bac83382"
    }
  }
}
