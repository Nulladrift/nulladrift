                "type": "number"
              },
              "vref": {
                "default": 0.6,
                "description": "參考電壓 VREF（V）",
                "maximum": 5,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5168e1f1acfbdde7620e14a87b8f7ee2d48a72530a8748319267dac0ff16bb77"
        },
        {
          "name": "xtal_load_cap",
          "title": "晶振負載電容與增益餘裕",
          "description": "外掛電容 C1、C2 與雜散電容算出實際負載電容 CL、頻率偏移 ppm、振盪增益餘裕、驅動功率，並給出剛好對上規格 CL 的電容值。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "c0": {
                "default": 3,
                "description": "並聯電容 C0（pF）",
                "maximum": 20,
                "minimum": 0.1,
                "type": "number"
              },
              "c1": {
                "default": 26,
                "description": "外掛電容 C1。2026-10-12 起預設 26 pF（原 30 pF），配合 cs 預設 5 pF 讓 CL＝18 pF（pF）",
                "maximum": 200,
                "minimum": 0.5,
                "type": "number"
              },
              "c2": {
                "default": 26,
                "description": "外掛電容 C2。2026-10-12 起預設 26 pF（原 30 pF），配合 cs 預設 5 pF 讓 CL＝18 pF（pF）",
                "maximum": 200,
                "minimum": 0.5,
                "type": "number"
              },
              "cls": {
                "default": 18,
                "description": "晶振規格的負載電容 CL（pF）",
                "maximum": 40,
                "minimum": 1,
                "type": "number"
              },
              "cm": {
                "default": 5,
                "description": "動態電容 Cm（fF）",
                "maximum": 50,
                "minimum": 0.5,
                "type": "number"
              },
              "cs": {
                "default": 5,
                "description": "雜散電容（腳位＋走線）。2026-10-12 起預設 5 pF（原 3 pF），出處 ST AN2867／TI SLLA122（pF）",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "esr": {
                "default": 50,
                "description": "等效串聯電阻 ESR（最大值）（Ω）",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              },
              "f": {
                "default": 25,
                "description": "晶振頻率（MHz）",
                "maximum": 100,
                "minimum": 0.03,
                "type": "number"
              },
              "gm": {
                "default": 25,
                "description": "晶片振盪器跨導 gm（mA/V）",
                "maximum": 500,
                "minimum": 0.1,
                "type": "number"
              },
              "vpp": {
                "default": 0.6,
                "description": "C1 那端的峰對峰電壓（算驅動功率用）（V）",
                "maximum": 5,
                "minimum": 0.05,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
