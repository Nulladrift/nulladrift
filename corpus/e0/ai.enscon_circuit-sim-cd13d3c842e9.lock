{
  "lockfileVersion": 2,
  "subjects": {
    "ai.enscon/circuit-sim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://circuit-sim.enscon.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "circuit-sim",
        "title": "電路模擬實驗室",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "數字參數的電路計算器（阻抗、串音、skew、晶振負載電容、輸出電壓公差、湧入電流）。每個結果都附適用範圍原文，引用結果時請一併說明適用範圍。",
      "tools": [
        {
          "name": "crosstalk",
          "title": "串音（解析式：近端／遠端係數）",
          "description": "兩條耦合線的串音：偶／奇模阻抗用 2D 電場數值解，再算近端串音係數 kb、飽和比例、遠端串音係數。只回傳解析式的部分（不含工具頁的 ngspice 時域波形）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "er": {
                "default": 4.2,
                "description": "板材介電常數 εr（帶狀線上下用同一個）",
                "maximum": 12,
                "minimum": 2,
                "type": "number"
              },
              "h": {
                "default": 0.1,
                "description": "微帶線：線到參考層的介質厚度（kind=ms）（mm）",
                "maximum": 2,
                "minimum": 0.02,
                "type": "number"
              },
              "ha": {
                "default": 0.13,
                "description": "帶狀線：線頂到上參考層（kind=sl）（mm）",
                "maximum": 2,
                "minimum": 0.02,
                "type": "number"
              },
              "hb": {
                "default": 0.13,
                "description": "帶狀線：線底到下參考層（kind=sl）（mm）",
                "maximum": 2,
                "minimum": 0.02,
                "type": "number"
              },
              "kind": {
                "default": "ms",
                "description": "ms＝微帶線（外層）、sl＝帶狀線（內層，上下都有參考層）",
                "enum": ["ms", "sl"],
                "type": "string"
              },
              "len": {
                "default": 50,
                "description": "並行長度（mm）",
                "maximum": 2000,
                "minimum": 1,
                "type": "number"
              },
              "s": {
                "default": 0.15,
                "description": "差動對的線間距（單線 single 模式不用）（mm）",
                "maximum": 6,
                "minimum": 0.01,
                "type": "number"
              },
              "t": {
                "default": 0.035,
                "description": "銅厚（35 µm＝1 oz）（mm）",
                "maximum": 0.1,
                "minimum": 0,
                "type": "number"
              },
              "tr": {
                "default": 50,
                "description": "攻擊線的上升時間（10–90%）（ps）",
                "maximum": 5000,
                "minimum": 10,
                "type": "number"
              },
              "w": {
                "default": 0.15,
                "description": "線寬（mm）",
                "maximum": 6,
                "minimum": 0.01,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:165e6a3b23e09e63dd808845f9367b7dc24e71d82f79a827c8cde797e5c6fa1f"
        },
        {
          "name": "diff_skew",
          "title": "差動對對內 skew",
          "description": "兩條線的長度差換成時間差（ps），對照介面的上限：USB3／PCIe 用業界經驗值 5 mil（非規範原文，出處見適用範圍）；DisplayPort／HDMI 沒有預設，請用 lim 填晶片廠或規範給的值。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ee": {
                "default": 3.3,
                "description": "有效介電常數 εeff",
                "maximum": 12,
                "minimum": 1,
                "type": "number"
              },
              "iface": {
                "default": "none",
                "description": "介面：none／usb3／pcie／dp／hdmi",
                "enum": ["none", "usb3", "pcie", "dp", "hdmi"],
                "type": "string"
              },
              "lim": {
                "default": 0,
                "description": "對內長度差上限（ps）。0 或不帶＝用介面預設（USB3／PCIe 業界經驗值 5 mil）；DP／HDMI 沒有預設，請填晶片廠或規範給的值，沒帶時 limit_ps 回 null（ps）",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "ln": {
                "default": 49,
                "description": "N 線長度（mm）",
                "maximum": 5000,
                "minimum": 0.01,
                "type": "number"
              },
              "lp": {
                "default": 50,
                "description": "P 線長度（mm）",
                "maximum": 5000,
                "minimum": 0.01,
                "type": "number"
              },
              "rate": {
                "default": 5,
                "description": "資料速率（UI＝1000÷速率 ps）（Gbps）",
                "maximum": 128,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f004d4f5845fce0cedc4434df2dd8f7ee2ed79777eb3e3b00f1f45cd51df8a3"
        },
        {
          "name": "impedance",
          "title": "差動／單端阻抗（微帶線、帶狀線）",
          "description": "用 2D 電場數值解算微帶線或帶狀線的差動阻抗（Zdiff、Zcomm、奇／偶模）或單端阻抗（Z0），含銅厚。回傳附適用範圍。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "er": {
                "default": 4.2,
                "description": "板材介電常數 εr（帶狀線上下用同一個）",
                "maximum": 12,
                "minimum": 2,
                "type": "number"
              },
              "h": {
                "default": 0.1,
                "description": "微帶線：線到參考層的介質厚度（kind=ms）（mm）",
                "maximum": 2,
                "minimum": 0.02,
                "type": "number"
              },
              "ha": {
                "default": 0.13,
                "description": "帶狀線：線頂到上參考層（kind=sl）（mm）",
                "maximum": 2,
                "minimum": 0.02,
                "type": "number"
              },
              "hb": {
                "default": 0.13,
                "description": "帶狀線：線底到下參考層（kind=sl）（mm）",
                "maximum": 2,
                "minimum": 0.02,
                "type": "number"
              },
              "kind": {
                "default": "ms",
                "description": "ms＝微帶線（外層）、sl＝帶狀線（內層，上下都有參考層）",
                "enum": ["ms", "sl"],
                "type": "string"
              },
              "mode": {
                "default": "diff",
                "description": "diff＝差動對、single＝單線",
                "enum": ["diff", "single"],
                "type": "string"
              },
              "s": {
                "default": 0.15,
                "description": "差動對的線間距（單線 single 模式不用）（mm）",
                "maximum": 6,
                "minimum": 0.01,
                "type": "number"
              },
              "t": {
                "default": 0.035,
                "description": "銅厚（35 µm＝1 oz）（mm）",
                "maximum": 0.1,
                "minimum": 0,
                "type": "number"
              },
              "w": {
                "default": 0.15,
                "description": "線寬（mm）",
                "maximum": 6,
                "minimum": 0.01,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:004a9d68f0a2cfbd5a903ae46f46f7243d45174457d8e53d3a5249a5f581bc42"
        },
        {
          "name": "inrush_current",
          "title": "湧入電流（負載開關控速／直接接電容）",
          "description": "負載開關控速上升時的充電電流、峰值電流、能量與脈衝 I²t（mode=slew），或電容直接接電源時的串聯 R-L-C 步階電流（mode=direct）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cout": {
                "default": 22,
                "description": "輸出電容（µF）",
                "maximum": 100000,
                "minimum": 0.1,
                "type": "number"
              },
              "ct": {
                "default": 220,
                "description": "CT 腳電容（ctsel≠none 時用）（pF）",
                "maximum": 100000,
                "minimum": 1,
                "type": "number"
              },
              "ctsel": {
                "default": "none",
                "description": "用 CT 腳電容決定上升時間：none／t918／t965",
                "enum": ["none", "t918", "t965"],
                "type": "string"
              },
              "esr": {
                "default": 20,
                "description": "電容 ESR（direct）（mΩ）",
                "maximum": 10000,
                "minimum": 0.1,
                "type": "number"
              },
              "lh": {
                "default": 50,
                "description": "線路電感（direct）（nH）",
                "maximum": 100000,
                "minimum": 0.001,
                "type": "number"
              },
              "mode": {
                "default": "slew",
                "description": "slew＝負載開關控速、direct＝直接接電容",
                "enum": ["slew", "direct"],
                "type": "string"
              },
              "rl": {
                "default": 10,
                "description": "負載電阻（0＝不接）（Ω）",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "rs": {
                "default": 20,
                "description": "線路＋電源內阻（direct）（mΩ）",
                "maximum": 10000,
                "minimum": 0.1,
                "type": "number"
              },
              "tr": {
                "default": 650,
                "description": "輸出上升時間（10–90%，ctsel=none 時用）（µs）",
                "maximum": 1000000,
                "minimum": 1,
                "type": "number"
              },
              "vin": {
                "default": 5,
                "description": "輸入電壓（V）",
                "maximum": 60,
                "minimum": 0.5,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4a94a6b46710777f3b8602646c86fa382e89ff89370079f30369a804d1b89b9"
        },
        {
          "name": "output_voltage_tolerance",
          "title": "輸出電壓公差（回授分壓）",
          "description": "回授電阻分壓的輸出電壓：最壞情況（每項取上下限的所有組合）、RSS 統計；可選蒙地卡羅超規比例。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dist": {
                "default": "normal",
                "description": "蒙地卡羅的誤差分布",
                "enum": ["normal", "uniform"],
                "type": "string"
              },
              "dt": {
                "default": 60,
                "description": "溫差（°C）",
                "maximum": 200,
                "minimum": 0,
                "type": "number"
              },
              "ifb": {
                "default": 0,
                "description": "回授腳偏壓電流（典型）（nA）",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "monte_carlo": {
                "default": false,
                "description": "true＝多跑蒙地卡羅（固定亂數種子，可重現）",
                "type": "boolean"
              },
              "n": {
                "default": 20000,
                "description": "蒙地卡羅次數",
                "maximum": 20000,
                "minimum": 100,
                "type": "integer"
              },
              "r1": {
                "default": 100,
                "description": "上電阻 R1（kΩ）",
                "maximum": 10000,
                "minimum": 0.01,
                "type": "number"
              },
              "r2": {
                "default": 22.1,
                "description": "下電阻 R2（kΩ）",
                "maximum": 10000,
                "minimum": 0.01,
                "type": "number"
              },
              "tc": {
                "default": 100,
                "description": "電阻溫漂（ppm/°C）",
                "maximum": 5000,
                "minimum": 0,
                "type": "number"
              },
              "tifb": {
                "default": 0,
                "description": "回授腳偏壓電流（最大偏離）（nA）",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "tr": {
                "default": 1,
                "description": "電阻公差 ±（%）",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "track": {
                "default": 0,
                "description": "1＝兩顆電阻溫漂同向（互相抵消）",
                "maximum": 1,
                "minimum": 0,
                "type": "integer"
              },
              "tref": {
                "default": 1,
                "description": "VREF 精度 ±（%）",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "vmax": {
                "default": 3.35,
                "description": "允許的輸出上限（V）",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "vmin": {
                "default": 3.25,
                "description": "允許的輸出下限（V）",
                "maximum": 100,
