              "tags": []
            }
          },
          "digest": "sha256:628f54bb7d9302d2909d9dafc36c14625bf0f525ff5b95d3d7d789551caae1ef"
        },
        {
          "name": "render_career_dashboard",
          "title": "Show interactive AIGradJobs career dashboard",
          "description": "Display an interactive UI after an AIGradJobs data tool. Pass its exact structured result, not invented listings, raw resume text, secrets, or private identifiers. Choose jobs for search_ai_jobs, resume for check_resume_fit, interview for get_interview_prep, salary for get_market_salary_benchmark, offers for compare_real_purchasing_power, portfolio for audit_github_for_role, compare for get_job_details. Render once after deciding what to show. The data tools work without UI.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "result": {
                "additionalProperties": true,
                "type": "object"
              },
              "view": {
                "enum": ["jobs", "resume", "interview", "salary", "offers", "portfolio", "compare"],
                "type": "string"
              }
            },
            "required": ["result", "view"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/outputTemplate": "ui://aigradjobs/career-v2.html",
            "openai/toolInvocation/invoked": "Career dashboard ready",
            "openai/toolInvocation/invoking": "Preparing career dashboard…",
            "ui": {
              "resourceUri": "ui://aigradjobs/career-v2.html"
            }
          },
          "digest": "sha256:de8b8ea4b42517973690534e7a43abb2b999455d47c8b9e55c3c2a6c13c1300c"
        },
        {
          "name": "search_ai_jobs",
          "title": "Find early-career AI jobs",
          "description": "Use when a user wants to find or apply for AI jobs, machine learning jobs, data and software jobs, new-grad roles or internships. Find active direct-employer roles and verified application links. Do not use to submit an application. Supports multi-keyword search, city, employer, skill, remote, verified annual USD salary floor, pagination and sorting. Use experience_level='internship' for internships. Salary filters exclude undisclosed pay; remote does not mean worldwide. For a browsable list, pass the exact result to render_career_dashboard(view='jobs').",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "col_tier": {
                "default": "",
                "type": "string"
              },
              "company": {
                "default": "",
                "type": "string"
              },
              "experience_level": {
                "default": "",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "type": "integer"
              },
              "location": {
                "default": "",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "type": "integer"
              },
              "query": {
                "default": "",
                "type": "string"
              },
              "remote_only": {
                "default": false,
                "type": "boolean"
              },
              "salary_min_usd": {
                "default": 0,
                "type": "integer"
              },
              "skill": {
                "default": "",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "enum": ["relevance", "newest", "salary"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
