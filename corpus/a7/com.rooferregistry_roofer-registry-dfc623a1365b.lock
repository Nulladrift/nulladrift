{
  "lockfileVersion": 2,
  "subjects": {
    "com.rooferregistry/roofer-registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://rooferregistry.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Roofer Registry",
        "version": "0.2.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "changes_since",
          "description": "License changes (new, lapsed, status change) since a given date, optionally filtered by state and change type. Changes are tracked starting from the first roster refresh after deploy — no backfill is available. Use when monitoring for new licenses, lapses, or status changes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "type": "string"
              },
              "limit": {
                "default": 100,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "ISO date, max 90 days back, e.g. 2026-09-01",
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "type": {
                "enum": ["new", "lapsed", "status", "expires"],
                "type": "string"
              }
            },
            "required": ["since"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f2fb8dca7dd67a031a62c1e100c929b1339817f673d4fba3c7dccb5969847f6d"
        },
        {
          "name": "check_license",
          "description": "Look up one roofing contractor license or registration by state and number. Returns status as published by the state regulator, a machine-readable verdict, licensee name, city, expiration, and provenance (regulator source URL + fetch date). Verdicts: licensed-active | licensed-not-active (trade license states like FL), registered-active | registered-not-active (registration states like NJ/PA — business registration, not a trade license), not-in-roster, not-found. The verdict is derived from the regulator-published status, not a recommendation. Use this when a user asks \"is this roofing contractor licensed\" or has a license number from a truck, yard sign, ad, or contract.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "license_number": {
                "description": "License number as printed, e.g. CCC1325838 or CGC061405; hyphens/spaces are ignored",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code or state name, e.g. FL, tx, Florida",
                "type": "string"
              }
            },
            "required": ["license_number", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:041b052fc1a8888cd126b680aa22118e55c9cd7c10a2c0f71de7e2e6e59feac5"
        },
        {
          "name": "compare_rules",
          "description": "Compare a specific rule field across 2–10 states. Only states with verified: true carry a rule. Treat null as \"not verified\", not \"no rule\". Input formats: states as two-letter codes (FL, GA, TX); field is one of licensing, licenseTypes, deductibleWaiver, depositRule, permit, insurance, unlicensedPenalty, rightToCancel, aob.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "field": {
                "enum": ["licensing", "licenseTypes", "deductibleWaiver", "depositRule", "permit", "insurance", "unlicensedPenalty", "rightToCancel", "aob"],
                "type": "string"
              },
              "states": {
                "description": "Two-letter state codes, e.g. [\"FL\", \"GA\"]",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["field", "states"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:291a45c40f491c4f81187911c8a219406d94a43bc45421d71bcee9e629487c1f"
        },
        {
          "name": "enforcement_actions",
          "description": "Board discipline and unlicensed-activity citations for a state, license number, name, or county. Merges licensed-activity discipline rows and unlicensed-activity citations, newest first. Republished as filed; a citation is an allegation the board acted on, a Final Order is the board's decision.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "all_trades": {
                "default": false,
                "type": "boolean"
              },
              "county": {
                "description": "e.g. Miami-Dade",
                "type": "string"
              },
              "license_number": {
                "description": "e.g. CCC1325838",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Respondent or DBA name fragment",
                "type": "string"
              },
              "since": {
                "description": "ISO date, e.g. 2025-01-01",
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:864240a3964072f694d3cec09b8a08620e2648a133739f26d5a44e231a1052a3"
        },
        {
          "name": "request_contact",
          "description": "Send a contact request to ONE specific licensee the user has chosen, by license number. This creates the same consent-recorded request a person submits on the profile page; it is not lead routing and we never pick the licensee for the user. Only call after the user has seen the record and explicitly chosen this licensee. Required consent text must be shown to the user verbatim before calling.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "consent_confirmed": {
                "const": true,
                "description": "User saw the consent text and agreed",
                "type": "boolean"
              },
              "email": {
                "format": "email",
                "type": "string"
              },
              "first_name": {
                "minLength": 1,
                "type": "string"
              },
              "insurance_job": {
                "description": "is this an insurance claim: yes, no, not-sure",
                "type": "string"
              },
              "license_number": {
                "type": "string"
              },
              "phone": {
                "minLength": 7,
                "type": "string"
              },
              "project_type": {
                "description": "project type: replacement, repair-leak, storm, inspection, gutters, new-construction, commercial",
                "type": "string"
              },
              "state": {
                "type": "string"
              },
              "timeline": {
                "description": "when needed: emergency, within-month, 1-3-months, just-quotes",
                "type": "string"
              },
              "zip": {
                "maxLength": 10,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["consent_confirmed", "email", "first_name", "insurance_job", "license_number", "phone", "project_type", "state", "timeline", "zip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:debb6c0bd6347f806fbe4675e6c875adb779354b4a8de265cb35838781ff03bb"
        },
        {
          "name": "search_licensees",
          "description": "Search roofing contractors by name, firm, or partial license number, optionally within a state and city. Returns up to 50 regulator-sourced records with a true total count. Use this when the user has a name but no license number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name, firm, or license fragment",
                "minLength": 2,
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1ab99375343e19617024ebf414cf06a97c3f005a73808e5684f307f34939a6b7"
        },
        {
          "name": "state_rules",
          "description": "Return what Roofer Registry has verified about a state's rules for roofing contractors: licensing, licenseTypes, deductibleWaiver, depositRule, permit, insurance, unlicensedPenalty, rightToCancel, aob — each { value, quote, citation, url } or null. Plus regulator, lookup URL, active-licensee count. If the state is not yet verified, the response says so — do not state a rule for that state from this source.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "state": {
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f8556ae0289218185b13b3a044d2c4a4521e35703e4f4614e71f360c6666b043"
        },
        {
          "name": "unlicensed_activity",
          "description": "List people and companies the state board cited for unlicensed contracting, filtered by county and/or name. Use when the user has a name or company from a truck or flyer but no license number, or asks who was caught working unlicensed after a storm. Republished as filed; a citation is not a judgment. Defaults to roofing-typed citations; set all_trades=true for all construction trades.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "all_trades": {
                "default": false,
                "description": "false (default) = roofing-typed citations only; true = all trades",
                "type": "boolean"
              },
              "county": {
                "description": "e.g. Lee, Miami-Dade, Dade — normalized automatically",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Respondent or DBA name fragment",
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b728f926d38cec5860d1374653c66e3499b1b1848b9402c68210c07ae8a414e9"
        },
        {
          "name": "verify_live",
          "description": "Fetch the current license status directly from the state regulator (FL only) and compare it with our roster copy. Uses a 24-hour cache; the second call within 24h returns cached: true. Other states return { supported: false, lookupUrl }. Hard cap: 100 live fetches per UTC day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "license_number": {
                "description": "e.g. CCC1325838",
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "required": ["license_number", "state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:49d1fe9d3f1a40b2ddb1deb21c4b0eee94d08507aba1c12a478ff4398343abae"
        }
      ],
      "resources": [
        {
          "uri": "https://rooferregistry.com/llms.txt",
          "name": "about",
