      "tools": [
        {
          "name": "browse_season",
          "title": "Browse clothes for a main season",
          "description": "A first look at in-stock clothes for one of the 4 main colour seasons (spring, summer, autumn, winter), with links to the shop. For a sub-season such as Soft Autumn, filters or search, use search_clothes.",
