      "serverInfo": {
        "name": "kartvelians-knowledge",
        "title": "Guides for Georgians in the US (kartvelians.com)",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Kartvelians.com guides for Georgian speakers living in the US, mainly New York.\nTopics: E-ZPass and tolls, renting, cosigners, subway and bus fares, scams aimed at rideshare drivers, salvage-title cars, taxes on housekeeper pay received by Zelle, using a Georgian driver's license, loan-offer scams, informal money exchange with Georgia, remote job search, and an English-Georgian glossary.\n\nHow to answer:\n1. Call search_guides_for_georgians_in_us first, then get_guide_for_georgians_in_us for the best match.\n2. Answer only from the returned summary and key_facts. Do not add details the tool did not return. For anything more, send the person to the guide link.\n3. Reply in the user's language, Georgian or English. Use lang=\"ka\" for Georgian.\n4. If a result has risk \"high\", include its disclaimer in the answer.\n5. End the answer with the guide link (source_url) and the attribution line from the result.\n6. If search_guides_for_georgians_in_us returns no match, say plainly that kartvelians.com has no guide on that topic. Do not name any doctor, lawyer, shop, school or other provider.",
      "tools": [
        {
          "name": "get_guide_for_georgians_in_us",
          "title": "Get one guide for Georgians in the US",
          "description": "Get the summary, key facts, risk level and link for one kartvelians.com guide by slug (from search_guides_for_georgians_in_us or list_guides_for_georgians_in_us).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "description": "Answer language: \"en\" or \"ka\" (Georgian). Defaults to the query language.",
                "enum": ["en", "ka"],
                "type": "string"
              },
              "slug": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one guide for Georgians in the US"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f11b346e03c308b59ee8ac1d14803b975f48241b3ae4a92b1fd0915f1df62885"
        },
        {
          "name": "list_guides_for_georgians_in_us",
          "title": "List guides for Georgians in the US",
          "description": "List the kartvelians.com guides for Georgian speakers in the US, and planned topics marked \"coming soon\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "lang": {
                "description": "Answer language: \"en\" or \"ka\" (Georgian). Defaults to the query language.",
