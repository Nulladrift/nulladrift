        {
          "name": "get_transcript",
          "title": "Get a video transcript",
          "description": "Read the transcript of a video, one page at a time. Use it only when you need the words themselves (quote, translate, copy, review). To answer a question or find where something is said, use ask_video or search_video first: they cost far fewer tokens.\nReturns \"[mm:ss] text\" lines, at most max_chars characters (default 60000, about 15k tokens), and a nextCursor: call again with the same arguments plus that cursor to continue. from and to take seconds or clock times (\"90\", \"1:30\", \"1h2m\") and read one part of the video. format: txt (default), md, srt, vtt or json. language is a BCP-47 hint. speakers is ignored without an API key (no speaker labels). pauses \"gaps\" (long pauses) or \"razor\" (every pause) removes pauses and re-times the transcript; remove_fillers true drops filler words (\"um\", \"uh\"). Both need word-level timing.\nThe first read of a video can take time: if it is still running after the wait you get status \"processing\" and a job_id (see get_job). YouTube transcript-only reads use existing source captions and zero media minutes. Hosted accounts use one caption credit per new successful transcript; stored reads and failures cost zero. Missing captions never enter a media fallback. Listen and richer context are separate actions. Cached transcripts return at once and are free. The text is wrapped as untrusted video text. Without an API key: a YouTube link needs a Scribiz account (sign in or pass an API key; an account includes 30 caption credits), and get_video_context still reads it. Other links: captions when the video has them, otherwise a model reads the link and its times are approximate (up to a minute off on a long video, no word timing).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cursor": {
                "description": "nextCursor from the previous page; keep every other argument the same.",
                "maxLength": 200,
                "type": "string"
              },
              "format": {
                "default": "txt",
                "description": "txt (default) has [m:ss] markers; srt and vtt are subtitle files.",
                "enum": ["txt", "md", "srt", "vtt", "json"],
                "type": "string"
              },
              "from": {
                "description": "A time: seconds (\"90\"), clock (\"1:30\", \"1:02:03\") or units (\"1h2m3s\").",
                "maxLength": 40,
                "type": "string"
              },
              "language": {
                "description": "BCP-47 language hint, for example \"en\" or \"pt-BR\".",
                "maxLength": 35,
                "type": "string"
              },
              "max_chars": {
                "description": "Page size in characters (default 60000).",
                "maximum": 150000,
                "minimum": 1000,
                "type": "integer"
              },
              "pauses": {
                "description": "Remove pauses and re-time the transcript to the edited timeline: \"gaps\" (long pauses) or \"razor\" (every pause). Requires word-level timing.",
                "enum": ["gaps", "razor"],
                "type": "string"
              },
              "remove_fillers": {
                "description": "Remove filler words (\"um\", \"uh\") and re-time the transcript. Requires word-level timing.",
                "type": "boolean"
              },
              "speakers": {
                "description": "Ignored without an API key: this tier has no speaker labels.",
                "type": "boolean"
              },
              "to": {
                "description": "A time: seconds (\"90\"), clock (\"1:30\", \"1:02:03\") or units (\"1h2m3s\").",
                "maxLength": 40,
                "type": "string"
              },
              "url": {
                "description": "The video link (https://...). YouTube, direct media links and podcasts work best; TikTok, Instagram, X and Vimeo are best effort.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "captionCreditsCharged": {
                "description": "Caption credits this call used, when the answer came from YouTube captions (then minutesUsed is 0).",
                "type": "number"
