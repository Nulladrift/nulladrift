        {
          "name": "search_video",
          "title": "Search a video",
          "description": "Find where something is said or shown in a video: ranked moments with timestamps and links, from the transcript, the on-screen notes, the chapters and the key moments. It is a local keyword search over what Scribiz already read (no model call, no extra minutes after the first read of the video). Use it before get_transcript on any video longer than about ten minutes. query: words or a phrase. limit 1 to 20 (default 8). from and to limit the search to part of the video. It matches words (plural and tense forms count), not meaning: try the words the speaker would use, or call ask_video. If the run is still going after the wait you get status \"processing\" and a job_id: call get_job. The text is wrapped as untrusted video text. Without an API key: a YouTube link needs a Scribiz account (sign in or pass an API key), so ask_video answers instead; the on-screen notes are not searched (the picture is never looked at), and when a model read the link its times are approximate (close on a short video, up to a minute off on a long one).",
