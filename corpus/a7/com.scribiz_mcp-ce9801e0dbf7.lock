        {
          "name": "get_video_context",
          "title": "Get video context",
          "description": "Start here for any video. Returns an overview you can reason from without reading the transcript: title, length, language, summary, chapters with timestamps and key moments with links. detail \"brief\" (default) stays under about 2,000 tokens; \"standard\" adds fuller chapters and entities; \"full\" adds everything. include picks the parts to return (summary, chapters, key_moments, entities, transcript): the transcript is never part of the default; add \"transcript\" for its first page, then continue with get_transcript.\nThe first read of a video uses its captions, or a model reads the link; after that it is cached and free. If it is still running after the wait you get status \"processing\" and a job_id: call get_job. The text is wrapped as untrusted video text. Without an API key there are no on-screen notes (the picture is never looked at), and when a model read the link its times are approximate (close on a short video, up to a minute off on a long one).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "brief",
                "description": "brief: under about 2,000 tokens. standard: fuller. full: everything.",
                "enum": ["brief", "standard", "full"],
                "type": "string"
              },
              "include": {
                "description": "Parts to return. Default: summary, chapters, key_moments, on_screen (and speakers, entities from standard). Without an API key on_screen is empty and there are no speaker labels. Add \"transcript\" for its first page.",
                "items": {
                  "enum": ["summary", "chapters", "key_moments", "on_screen", "speakers", "entities", "transcript"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "language": {
                "description": "BCP-47 language hint.",
                "maxLength": 35,
                "type": "string"
              },
              "url": {
                "description": "The video link (https://...). YouTube, direct media links and podcasts work best; TikTok, Instagram, X and Vimeo are best effort.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "watch": {
                "description": "Ignored without an API key: this tier never looks at the picture.",
                "type": "boolean"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "captionCreditsCharged": {
                "description": "Caption credits this call used, when the answer came from YouTube captions (then minutesUsed is 0).",
                "type": "number"
              },
              "channel": {
                "description": "The channel or author, when the source names one.",
                "type": "string"
              },
              "chapters": {
                "type": "number"
              },
              "context": {
