        {
          "name": "verify_diamond_crucible_and_ast",
          "description": "Audit Python source code and verify the 8-vertex Reed-Muller RM(1,3) cryptographic crucible in under 4 ms. Use this tool when auditing Python code snippets (`code_markdown`) or obtaining an ES256-signed crucible attestation, or use `verify_sovereign_shield_merkle` for RFC 6962 Merkle tree notarization and PII purification, and `simulate_diamond_spiral_budget` for multi-agent call and cost estimation. Zero-auth, stateless, and free (0.00 EUR), running four checks on every call: RM(1,3) antipodal geometry across 256 states in Q^3, non-coercion laws L1..L7 (`c_levels == 1`), 22/22 killed policy mutants, and Python AST static verification (syntax, import-hoist guard, and zero placeholders) whenever `code_markdown` is provided. Setting `diag_active` (`1..4`) selects which body diagonal pair receives double weight in the rational barycenter calculation, `lang` localizes diagnostic summaries, and any Python syntax error or AST rule violation sets `status` to `'violation_detected'` with line-level diagnostics while still returning a valid RFC 8785 (JCS) + RFC 7515 (JWS ES256) signature.",
          "inputSchema": {
            "properties": {
              "code_markdown": {
                "description": "Optional Python source code or Markdown containing ```python blocks to audit with the AST Kintsugi Verifier (Syntax, Rule 4 Import Hoist Guard, and Rule 7 Zero Placeholders). When omitted, only the 256-state RM(1,3) crucible and 22/22 mutant checks run.",
                "type": "string"
              },
              "diag_active": {
                "default": 2,
                "description": "Active body diagonal of the 8-vertex Stella Octangula (`1` Fire, `2` Earth, `3` Air, or `4` Water; default `2`), assigning weight 2 to the active antipodal pair in the rational barycenter.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "lang": {
                "default": "en",
                "description": "Output language for localized verification summaries ('en' English, 'es' Spanish, or 'ca' Catalan).",
                "enum": ["en", "es", "ca"],
                "type": "string"
              }
            },
            "type": "object"
          },
