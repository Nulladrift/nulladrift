      "instructions": "HU-DIAMOND-CRUCIBLE v1.1 & HU-SOVEREIGN-SHIELD v1.0 Zero-Auth Cryptographic Notary (< 4 ms, 0.00 EUR). Use `verify_diamond_crucible_and_ast` to verify Reed-Muller RM(1,3) [8,4,4]_2, Laws L1..L7, 22/22 Mutants and Python AST Kintsugi with ES256 JWS signature; `verify_sovereign_shield_merkle` for RFC 6962 Merkle proofs and Rule 14 Zero-Knowledge dignity receipts; `simulate_diamond_spiral_budget` for the 8-Vertex Stella Octangula Deep Think call simulator; and `weigh_agent_on_scales_of_maat_w3c_vc` for 5-Ring Ma'at AI Auditing (42/42 Negative Confessions), W3C Verifiable Credentials 2.0, and the Feather of Ma'at empathy mirror.",
      "tools": [
        {
          "name": "simulate_diamond_spiral_budget",
          "description": "Compute deterministic LLM call counts, token budgets, and EUR/Seed costs for 1 to 4 spiral turns of the 8-vertex Diamond Wheel multi-agent orchestrator. Use this tool only to estimate call volume and cost before launching a multi-agent run, or use `verify_diamond_crucible_and_ast` to audit Python code and RM(1,3) proofs, and `verify_sovereign_shield_merkle` to notarize text in an RFC 6962 Merkle tree. Zero-auth, stateless, and free (0.00 EUR), executing pure arithmetic without invoking any LLM. Each spiral turn (`rounds` `1..4`) adds 9 LLM calls (4 creators, 4 antipodal auditors, and 1 barycenter synthesizer, totaling `9, 18, 27, or 36` calls, plus 10 final inquisition calls when `rounds=4`), while `tier='supreme'` prices calls for `gemini-4-argon` (`10,000` to `64,000` Seeds / `10.00` to `64.00 EUR`) and `tier='flash'` prices calls for `gemini-3.8-flash` at reduced cost, and `lang` localizes vertex role descriptions.",
