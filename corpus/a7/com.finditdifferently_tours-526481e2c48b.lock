{
  "lockfileVersion": 2,
  "subjects": {
    "com.finditdifferently/tours": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://finditdifferently.com/mcp.php"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "find-it-differently",
        "title": "Find It Differently — private tours in Copenhagen",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Private tours in Copenhagen and Denmark, always a private group of at most 6 guests. Prices are \"from\" prices per group in EUR, VAT included, not per person. Use list_tours to browse, get_tour for details, check_availability before recommending a date. Bookings and payment happen only at the booking_url; this server never takes bookings or personal data.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check group fit and where to see live availability",
          "description": "Checks whether a group size fits a tour and the date is valid, and returns the link where live availability and the final price are shown. This server does not hold the live calendar: availability is confirmed only at booking_url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Requested date, YYYY-MM-DD.",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests in the private group (1-6).",
                "type": "integer"
              },
              "tour": {
                "description": "Tour id, slug or exact name.",
                "type": "string"
              }
            },
            "required": ["date", "guests", "tour"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75398db498f55626f310192ad8cc80ba3e7a1114ce6e87f6db57b26d6eda70d3"
        },
        {
          "name": "get_tour",
          "title": "Get tour details",
          "description": "Full details of one tour: description, price per group, duration, group size, tour page and booking link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tour": {
                "description": "Tour id, slug or exact name from list_tours.",
                "type": "string"
              }
            },
            "required": ["tour"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69053390fce4c87c9bd36db3690a8f54b0a17569b36f62c1792660e54d98fda9"
        },
        {
          "name": "list_tours",
          "title": "List private tours",
          "description": "List Find It Differently private tours in Copenhagen and Denmark. Every tour is private, max 6 guests. Optional filters: free-text query, category, maximum price per group in EUR, maximum duration in minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category name, e.g. \"Food & Drink\", \"History & Heritage\".",
                "type": "string"
              },
              "max_duration_minutes": {
                "description": "Maximum duration in minutes.",
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum \"from\" price per group in EUR.",
                "type": "number"
              },
              "query": {
                "description": "Words to match in name, description or category, e.g. \"food\", \"castle\", \"e-bike\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f2d451e875e7d8f17874f4f44776d73f9f1fb1ca8c3072bcea8219d8f6d7d78"
        }
      ],
      "digest": "sha256:5e9e13eb81672d1e596f39ff6bd1dc5e7359d164b68ec917afe46912f2a74269"
    }
  }
