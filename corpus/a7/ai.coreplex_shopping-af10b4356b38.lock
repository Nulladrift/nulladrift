{
  "lockfileVersion": 2,
  "subjects": {
    "ai.coreplex/shopping": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coreplex.ai/api/apps/6a9567482e969b1ab43e0c49/functions/coreplexMcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "coreplex",
        "title": "Coreplex",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Coreplex compares products from brands that sell on Shopify. Prices and stock are live at call time; checkout happens on the seller's own store and Coreplex adds no fees. Always name the seller, say whether it is the brand's official store, and share coreplex_url. Call a seller cheaper only for a confirmed same item priced for the same option (compare_prices sellers with price_basis \"matched_variant\", or \"same item\" in get_passport with price_basis \"official_variant_price\"); likely-same, unresolved-variant and similar listings are not price matches. Searches are bounded, never exhaustive. Say when coverage is incomplete or Coreplex could not confirm something. Health claims are seller-stated. Cite product pages as https://coreplex.ai/p/<store>/<handle>.html.",
      "tools": [
        {
          "name": "compare_prices",
          "title": "Compare prices across sellers",
          "description": "Who else sells this exact item, each priced for the same option — matched on Shopify catalog id or barcode, so a cheaper seller is a real match rather than a lookalike. Resellers are labelled and similar listings are kept apart from price matches. Pass variant_id (from get_product) for a multi-option product. Examples: \"who else sells this exact Owala bottle\", \"is the official store actually cheaper\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product_url": {
                "description": "A product_url from search_products",
                "type": "string"
              },
              "variant_id": {
                "description": "Option to price (variant_id from get_product)",
                "type": "string"
              }
            },
            "required": ["product_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "candidate_limit": {
                "type": "integer"
              },
              "coverage": {
                "enum": ["bounded_catalog_search", "incomplete_search_failed"],
                "type": "string"
              },
              "exhaustive": {
                "type": "boolean"
              },
              "lowest": {
                "type": ["object", "null"]
              },
              "same_item_sellers": {
                "items": {
                  "properties": {
                    "match": {
                      "type": "string"
                    },
                    "price": {
                      "type": ["object", "null"]
                    },
                    "price_basis": {
                      "enum": ["matched_variant", "unresolved_variant"],
                      "type": "string"
                    },
                    "seller": {
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "search_succeeded": {
                "type": "boolean"
              },
              "similar_listings": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "variant": {
                "type": ["object", "null"]
              }
            },
            "required": ["coverage", "exhaustive", "same_item_sellers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76929951594f89391918f1316c4d06be4d735358bb0542365b5a88b799e2a48d"
        },
        {
          "name": "find_health_products",
          "title": "Find health products by claim",
          "description": "Products whose seller states a third-party testing or eligibility claim — HSA/FSA eligible, USP Verified, NSF, Informed Sport, GMP facility, ConsumerLab — matched against the seller's own text and returned with the claim marked seller-stated. Examples: \"HSA/FSA eligible vitamin D\", \"NSF certified protein powder\", \"USP verified magnesium\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filter": {
                "description": "Claim to match",
                "enum": ["hsa_fsa", "usp", "nsf", "informed_sport", "gmp", "consumerlab"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Max results",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional product type",
                "type": "string"
              }
            },
            "required": ["filter"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "products": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8837bc1c06c608e09ac5b7fde1820b19202fda70722ec9e9de7d27664fdf41c2"
        },
        {
          "name": "get_passport",
          "title": "Get product passport",
          "description": "A product passport: the brand's own listing, then every other store found carrying it, each marked same item, likely same, other version, bundle or accessory, with the evidence for that call. This is the only place a reseller is identified rather than guessed. Examples: \"is this seller an authorized reseller\", \"which stores carry the exact same jacket\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product_url": {
                "description": "A product_url from search_products",
                "type": "string"
              }
            },
            "required": ["product_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "passport_id": {
                "type": ["string", "null"]
              },
              "product": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92a7cc875639153f5dfb5a373be3b0e1a5c7160343f806b59ad91e3a26113fb4"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "One listing in full: the price of every option, stock, the seller, whether that seller is the brand's own official store, and the seller's policy links. Use product_id from search_products. Don't construct URLs. Examples: \"what every size of the FreeSip costs\", \"is this sold by the brand itself\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product_id": {
                "description": "product_id from search_products. Don't construct URLs.",
                "type": "string"
              },
              "product_url": {
                "description": "A product_url from search_products",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "options": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "policies": {
                "type": "object"
              },
              "product_id": {
                "type": ["string", "null"]
              },
              "product_url": {
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:95f50fa32830904e1cd97083384831b45224448d5d5474c8a3a4849d7045f158"
        },
        {
          "name": "get_return_policy",
          "title": "Get return policy terms",
          "description": "The seller's own return terms — window, condition, opened items, who pays return shipping — quoted as the exact sentences of the policy that applies to this listing, not a generic template. Examples: \"can I return opened supplements\", \"return window for a stroller\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "product_url": {
                "description": "A product_url from search_products",
                "type": "string"
              }
            },
            "required": ["product_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "policy_url": {
                "type": ["string", "null"]
              },
              "summary": {
                "type": "string"
              },
              "terms": {
                "type": ["object", "null"]
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86af16b9e6ad0ce6ed6802571fe0d32ee8bb18679226ede35d750948f4e17f86"
        },
        {
          "name": "list_brands",
          "title": "List brands with official stores",
          "description": "Brands with a confirmed official Shopify store. Supplement brands are listed first, then every other category, each with its own store domain. Paged: returns total, next_cursor and a line stating catalog coverage. Examples: \"which supplement brands do you carry\", \"beauty brands with official stores\", \"everything you cover\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category; supplements is listed first",
                "enum": ["supplements", "baby", "home", "drinkware", "travel", "health", "beauty", "drinks", "tech", "pets", "fitness", "toys"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous response",
                "type": "string"
              },
              "limit": {
                "default": 24,
                "description": "Max brands per page (max 24)",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brands": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "coverage": {
                "type": "string"
              },
              "next_cursor": {
                "type": ["string", "null"]
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["brands"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25f8bb387e66113faeafde3f3ad48586197a54709a8cd615bfa4cf4cb1b74450"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Find a product across brands that sell on Shopify, with the seller named and the brand's own official store flagged — what a plain product search cannot tell you. Every result carries product_id, product_url, price per option and stock. Examples: \"magnesium powders with third-party testing\", \"official store for Owala\", \"wearable breast pump\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "Max results",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              },
              "official_only": {
                "default": false,
                "description": "Brand stores only",
                "type": "boolean"
              },
              "query": {
                "description": "What to find",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "products": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["products"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:280ff3b6dde8b93910f48d8f926dc029cbcf860f97e566134344459e31c76bb6"
        }
      ],
      "digest": "sha256:4ae31e245095e0f241e4c9d9b87a1bcb3a890a4568086c7cb576e060680a8390"
    }
  }
