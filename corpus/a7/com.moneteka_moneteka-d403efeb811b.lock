      "instructions": "MONETEKA is a catalogue of Ukrainian coins and banknotes of the National Bank of Ukraine. Use search_coins to find an item, then pass its coin_id to the other tools. A null value means the fact is unknown — never fill it in. Prices are in UAH. To change the user's collection, wishlist or public link, or to write to support, call prepare_moneteka_action, show its preview to the user, and only after the user agrees call the commit tool it names with the intent_id. Never commit a change the user has not seen and approved. Whenever you show coins or an account panel to the user, call render_moneteka_view right after the MONETEKA tool, with that tool's name and the same arguments: it shows MONETEKA's own photos, prices and links. Never add coin images from web or image search — they often show a different coin.",
