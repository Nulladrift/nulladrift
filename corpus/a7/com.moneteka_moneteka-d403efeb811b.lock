        {
          "name": "prepare_moneteka_action",
          "title": "Preview a change",
          "description": "Validate and preview one action on the signed-in person's account: a new purchase, a correction or removal of one purchase, wanting coins, no longer wanting a coin, a wanted coin that was bought, a message to MONETEKA support, or a change of a public link. Nothing changes and nothing is sent here. The result holds the preview for the user, an intent_id and commit_tool — the tool that applies this action once the user approves it.",
          "inputSchema": {
            "$defs": {
              "AcquireWish": {
                "additionalProperties": false,
                "properties": {
                  "coin_id": {
                    "description": "coin_id of the wanted coin that was bought.",
                    "maximum": 1000000000,
                    "minimum": 1,
                    "title": "Coin Id",
                    "type": "integer"
                  },
                  "expected_revision": {
                    "description": "revision of that wish exactly as get_my_wishlist returned it.",
                    "maxLength": 32,
                    "minLength": 1,
                    "title": "Expected Revision",
                    "type": "string"
                  },
                  "purchase_date": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Purchase date, YYYY-MM-DD, not in the future. Omit it when the user did not say it.",
                    "title": "Purchase Date"
                  },
                  "purchase_price": {
                    "anyOf": [
                      {
                        "maximum": 100000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Price paid for ONE coin, in UAH. Omit it when the user did not say it — never guess.",
                    "title": "Purchase Price"
                  },
                  "quantity": {
                    "default": 1,
                    "description": "How many coins were bought.",
                    "maximum": 100,
                    "minimum": 1,
                    "title": "Quantity",
                    "type": "integer"
                  },
                  "type": {
                    "const": "wishlist.acquire",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["coin_id", "expected_revision", "type"],
                "title": "AcquireWish",
                "type": "object"
              },
              "AddLot": {
                "additionalProperties": false,
                "properties": {
                  "coin_id": {
                    "description": "coin_id from search_coins.",
                    "maximum": 1000000000,
                    "minimum": 1,
                    "title": "Coin Id",
                    "type": "integer"
                  },
                  "purchase_date": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Purchase date, YYYY-MM-DD, not in the future. Omit it when the user did not say it.",
                    "title": "Purchase Date"
                  },
                  "purchase_price": {
                    "anyOf": [
                      {
                        "maximum": 100000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Price paid for ONE coin, in UAH. Omit it when the user did not say it — never guess.",
                    "title": "Purchase Price"
                  },
                  "quantity": {
                    "description": "How many coins were bought in this purchase. More than 100 at once is entered in the MONETEKA app.",
                    "maximum": 100,
                    "minimum": 1,
                    "title": "Quantity",
                    "type": "integer"
                  },
                  "type": {
                    "const": "collection.add",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["coin_id", "quantity", "type"],
                "title": "AddLot",
                "type": "object"
              },
              "AddWishes": {
                "additionalProperties": false,
                "properties": {
                  "coin_ids": {
                    "description": "Different coin_id values from search_coins. Coins already owned or already wanted are skipped and reported.",
                    "items": {
                      "maximum": 1000000000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "title": "Coin Ids",
                    "type": "array"
                  },
                  "note": {
                    "anyOf": [
                      {
                        "maxLength": 300,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The user's own note for the coin; only when exactly one coin is added.",
                    "title": "Note"
                  },
                  "type": {
                    "const": "wishlist.add",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["coin_ids", "type"],
                "title": "AddWishes",
                "type": "object"
              },
              "ChangeShare": {
                "additionalProperties": false,
                "properties": {
                  "expected_revision": {
                    "description": "revision exactly as get_sharing_settings returned it for this kind.",
                    "maxLength": 32,
                    "minLength": 1,
                    "title": "Expected Revision",
                    "type": "string"
                  },
                  "kind": {
                    "description": "collection = the public page of the collection; wishlist = the public page of the wanted coins.",
                    "enum": ["collection", "wishlist"],
                    "title": "Kind",
                    "type": "string"
                  },
                  "operation": {
                    "description": "create = make the public link; update = change what guests see; disable = pause the page and keep the link; enable = resume it; rotate = replace the link with a new one, the old one stops working; delete = remove the link for good.",
                    "enum": ["create", "update", "disable", "enable", "rotate", "delete"],
                    "title": "Operation",
                    "type": "string"
                  },
                  "settings": {
                    "anyOf": [
                      {
                        "$ref": "#/$defs/ShareFields"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "With create or update: only the settings the user named; the others keep their value."
                  },
                  "type": {
                    "const": "share.change",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["expected_revision", "kind", "operation", "type"],
                "title": "ChangeShare",
                "type": "object"
              },
              "LotChanges": {
                "additionalProperties": false,
                "properties": {
                  "purchase_date": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Purchase date, YYYY-MM-DD, not in the future. null clears the stored date.",
                    "title": "Purchase Date"
                  },
                  "purchase_price": {
                    "anyOf": [
                      {
                        "maximum": 100000000,
                        "minimum": 0,
                        "type": "number"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Price paid for ONE coin, in UAH. null clears the stored price.",
                    "title": "Purchase Price"
                  },
                  "quantity": {
                    "anyOf": [
                      {
                        "maximum": 100,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "The new quantity of this purchase.",
                    "title": "Quantity"
                  }
                },
                "title": "LotChanges",
                "type": "object"
              },
              "RemoveLot": {
                "additionalProperties": false,
                "properties": {
                  "expected_revision": {
                    "description": "revision of that purchase exactly as get_my_collection returned it.",
                    "maxLength": 32,
                    "minLength": 1,
                    "title": "Expected Revision",
                    "type": "string"
                  },
                  "lot_id": {
                    "description": "lot_id of the purchase, from get_my_collection with view=lots.",
                    "maxLength": 36,
                    "minLength": 1,
                    "title": "Lot Id",
                    "type": "string"
                  },
                  "type": {
                    "const": "collection.remove",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["expected_revision", "lot_id", "type"],
                "title": "RemoveLot",
                "type": "object"
              },
              "RemoveWish": {
                "additionalProperties": false,
                "properties": {
                  "coin_id": {
                    "description": "coin_id of the wanted coin.",
                    "maximum": 1000000000,
                    "minimum": 1,
                    "title": "Coin Id",
                    "type": "integer"
                  },
                  "expected_revision": {
                    "description": "revision of that wish exactly as get_my_wishlist returned it.",
                    "maxLength": 32,
                    "minLength": 1,
                    "title": "Expected Revision",
                    "type": "string"
                  },
                  "type": {
                    "const": "wishlist.remove",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["coin_id", "expected_revision", "type"],
                "title": "RemoveWish",
                "type": "object"
              },
              "SendSupport": {
                "additionalProperties": false,
                "properties": {
                  "category": {
                    "anyOf": [
                      {
                        "enum": ["account", "coin_data", "exchange", "fraud", "payment", "technical", "other"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "For a new ticket only: account, coin_data (wrong catalogue data), exchange, fraud, payment, technical, other.",
                    "title": "Category"
                  },
                  "subject": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "minLength": 3,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "For a new ticket only: a short subject.",
                    "title": "Subject"
                  },
                  "text": {
                    "description": "The message exactly as the user approved it, in the user's own language. Do not add anything the user did not say.",
                    "maxLength": 4000,
                    "minLength": 3,
                    "title": "Text",
                    "type": "string"
                  },
                  "ticket_id": {
                    "anyOf": [
                      {
                        "maxLength": 36,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "An existing ticket id from get_my_support, to reply in it. Omit it to open a new ticket.",
