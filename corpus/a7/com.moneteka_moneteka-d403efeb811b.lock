        {
          "name": "get_collection_analytics",
          "title": "Collection analytics",
          "description": "Explain the signed-in person's collection: its current value, cost and profit, the standout coins, how complete each coin series is, how the value changed over time, or what it held day by day in a period. A missing price is reported as missing, never estimated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "anyOf": [
                  {
                    "maxLength": 128,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With view=completeness: next_cursor of the previous page, with the same other arguments.",
                "title": "Cursor"
              },
              "end": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With view=history: last day, YYYY-MM-DD, not in the future. Omitted = today.",
                "title": "End"
              },
              "max_points": {
                "default": 60,
                "description": "With view=growth or history: upper bound of points; a longer series is thinned evenly.",
                "maximum": 120,
                "minimum": 2,
                "title": "Max Points",
                "type": "integer"
              },
              "page_size": {
                "default": 10,
                "description": "With view=completeness: series per page.",
                "maximum": 20,
                "minimum": 1,
                "title": "Page Size",
                "type": "integer"
              },
              "series_id": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With view=completeness: list every coin of this one series with its status, instead of the table of series. The id comes from get_catalog_entity.",
                "title": "Series Id"
              },
              "start": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "With view=history: first day, YYYY-MM-DD. Omitted = 89 days before end.",
                "title": "Start"
              },
              "view": {
                "default": "summary",
                "description": "summary = what the collection is worth now, what was paid and the profit; statistics = the most valuable coin, the biggest gain and loss, the first purchase; completeness = how full every coin series is; growth = how the value changed over time, by purchase dates; history = what the collection actually held and was worth on each day of a period, as recorded day by day.",
                "enum": ["summary", "statistics", "completeness", "growth", "history"],
                "title": "View",
