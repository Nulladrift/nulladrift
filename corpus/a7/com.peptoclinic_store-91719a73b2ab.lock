      "serverInfo": {
        "name": "peptoclinic",
        "title": "PeptoClinic store",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PeptoClinic sells peptide vials in the United States (USD). list_products shows ids, vial sizes and prices; create_checkout_link builds the order and returns a link the buyer opens to enter their details and pay. A physician reviews every order before it ships. None of the compounds is approved by the FDA.",
      "tools": [
        {
          "name": "create_checkout_link",
          "title": "Create checkout link",
          "description": "Quote an order (one or more products, 1-10 vials each) and get the checkout link the buyer opens to pay. Nothing is charged or reserved until the buyer pays on that page.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country of the BUYER: US (United States, prices in USD). It is the only market served.",
                "enum": ["US"],
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "product_id": {
                      "description": "id from list_products, e.g. retatrutide",
                      "type": "string"
                    },
                    "size": {
                      "description": "vial size from list_products (sizes[].size), e.g. 20mg. Optional: defaults to the first size. One size per product per link.",
                      "type": "string"
                    },
                    "vials": {
                      "default": 1,
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["product_id"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["country", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:312d982db9dbef1b4c818706f1e616d521e67725db991804578c066b4543b190"
        },
        {
          "name": "list_products",
          "title": "List products",
          "description": "Peptide vials sold in a market, with id, vial size, price per vial and a direct buy link. Products sold in more than one vial size list them all under sizes.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country of the BUYER: US (United States, prices in USD). It is the only market served.",
                "enum": ["US"],
                "type": "string"
              }
            },
