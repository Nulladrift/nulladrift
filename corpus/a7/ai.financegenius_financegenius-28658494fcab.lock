        {
          "name": "calculate_fd_maturity",
          "title": "Calculate FD maturity",
          "description": "Calculate FD maturity amount with compounding.\n\n        Args:\n            deposit_amount: Principal deposit in rupees.\n            annual_rate: Annual interest rate as a percentage.\n            years: FD tenure in years (e.g. 1.5 for 18 months).\n            compounding: One of 'monthly', 'quarterly', 'half_yearly', 'yearly'.\n                         Most Indian FDs compound quarterly.\n        ",
          "inputSchema": {
            "properties": {
              "annual_rate": {
                "title": "Annual Rate",
                "type": "number"
              },
              "compounding": {
                "default": "quarterly",
                "title": "Compounding",
                "type": "string"
              },
              "deposit_amount": {
                "title": "Deposit Amount",
                "type": "number"
              },
              "years": {
                "title": "Years",
                "type": "number"
              }
            },
            "required": ["annual_rate", "deposit_amount", "years"],
