      "instructions": "FinanceGenius.AI is India's AI-powered financial product MCP. Use these tools to search Indian credit cards / loans / FDs / mutual funds, run financial calculators (EMI, SIP, CAGR, tax, FD maturity), look up mutual fund NAVs, and look up details of Indian financial products and terminology (in 11 Indian languages where requested). All results are unbiased — FinanceGenius.AI is not paid by financial institutions to list, rank or recommend products; discovery and comparison are ranked on merit. Personalised credit scoring and insurance gap analysis are not available through this connector yet.",
      "tools": [
        {
          "name": "calculate_cagr",
          "title": "Calculate CAGR",
          "description": "Calculate the Compound Annual Growth Rate (CAGR) of an investment.\n\n        Args:\n            initial_value: Initial investment in rupees.\n            final_value: Final value in rupees.\n            years: Holding period in years.\n        ",
          "inputSchema": {
            "properties": {
              "final_value": {
                "title": "Final Value",
                "type": "number"
              },
              "initial_value": {
                "title": "Initial Value",
                "type": "number"
              },
              "years": {
                "title": "Years",
                "type": "integer"
              }
            },
            "required": ["final_value", "initial_value", "years"],
            "title": "calculate_cagrArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
