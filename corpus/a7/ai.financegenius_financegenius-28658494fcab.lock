        },
        {
          "name": "calculate_emi",
          "title": "Calculate loan EMI",
          "description": "Calculate EMI for a loan with year-by-year amortisation schedule.\n\n        Args:\n            principal: Loan amount in rupees.\n            annual_rate: Annual interest rate as a percentage (e.g. 10.5 for 10.5%).\n            tenure_months: Loan tenure in months.\n\n        Returns:\n            Monthly EMI, total interest, total payment, and amortisation schedule.\n        ",
          "inputSchema": {
            "properties": {
              "annual_rate": {
                "title": "Annual Rate",
                "type": "number"
              },
              "principal": {
                "title": "Principal",
                "type": "number"
              },
              "tenure_months": {
                "title": "Tenure Months",
                "type": "integer"
              }
            },
            "required": ["annual_rate", "principal", "tenure_months"],
            "title": "calculate_emiArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
