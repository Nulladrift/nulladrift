        {
          "name": "calculate_indian_income_tax",
          "title": "Calculate Indian income tax",
          "description": "Compute Indian income tax for FY 2025-26 under old or new regime.\n\n        Args:\n            annual_income: Gross annual income in rupees.\n            regime: 'new' (default) or 'old'.\n            deductions_80c: Section 80C deductions in rupees (max ₹1,50,000, old regime only).\n            deductions_80d: Section 80D health-insurance premium (old regime only).\n            hra_exemption: HRA exemption amount (old regime only).\n\n        Returns:\n            Slab breakdown, total tax, effective rate, regime comparison.\n        ",
          "inputSchema": {
            "properties": {
              "annual_income": {
                "title": "Annual Income",
                "type": "number"
              },
              "deductions_80c": {
                "default": 0,
                "title": "Deductions 80C",
                "type": "number"
              },
              "deductions_80d": {
                "default": 0,
                "title": "Deductions 80D",
                "type": "number"
              },
              "hra_exemption": {
                "default": 0,
                "title": "Hra Exemption",
                "type": "number"
              },
              "regime": {
                "default": "new",
                "title": "Regime",
                "type": "string"
              }
            },
            "required": ["annual_income"],
            "title": "calculate_indian_income_taxArguments",
            "type": "object"
