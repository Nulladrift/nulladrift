          "digest": "sha256:0d8fa0216518243fdf65d19f44c42666dbd9a7a5c72ef4a766f0d4efb8f30e29"
        },
        {
          "name": "find_best_fd",
          "title": "Find the best fixed deposit",
          "description": "Rank Indian Fixed Deposits by net-of-tax yield for a given amount + tenure.\n\n        Args:\n            amount: Investment amount in rupees.\n            years: FD tenure in years (e.g. 1.5 for 18 months).\n            is_senior_citizen: True to use senior-citizen rates (typically +0.5%).\n            tax_slab_pct: Investor's income tax slab as a percentage (5/10/20/30).\n                          FD interest is fully taxable; this is used for net-yield ranking.\n\n        Returns:\n            Top 5 FDs sorted by net-of-tax maturity, each showing gross & net amount.\n        ",
          "inputSchema": {
            "properties": {
              "amount": {
                "title": "Amount",
                "type": "number"
              },
              "is_senior_citizen": {
                "default": false,
                "title": "Is Senior Citizen",
                "type": "boolean"
              },
              "tax_slab_pct": {
                "default": 30,
                "title": "Tax Slab Pct",
                "type": "number"
              },
              "years": {
                "title": "Years",
                "type": "number"
              }
            },
            "required": ["amount", "years"],
            "title": "find_best_fdArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
