        {
          "name": "explain_financial_concept",
          "title": "Explain a financial concept",
          "description": "Look up Indian financial products and terms in FinanceGenius.AI's catalogue.\n\n        Hybrid retrieval (BM25 + semantic + product database, fused with\n        Reciprocal Rank Fusion) over our product records. Good for questions\n        anchored to real products: 'which HDFC cards waive the annual fee?',\n        'what does the Bajaj FD pay for 3 years?', 'ELSS options with a 3-year\n        lock-in'.\n\n        Not a general financial encyclopedia: the curated explainer knowledge\n        base is not loaded in production, so abstract questions ('how does APR\n        work?') fall back to product matches. Say so rather than dressing a\n        product listing up as an explanation.\n\n        Args:\n            query: The financial question or concept to explain.\n            institution: Optional — narrow search to one institution (e.g. 'hdfc-bank').\n        ",
          "inputSchema": {
            "properties": {
              "institution": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Institution"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "explain_financial_conceptArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:23efff6caaf71d1b2ed6934f3a029ef403fafa2c6c87fa7a1e03381677bce20b"
        },
        {
          "name": "find_best_card_for_spend",
          "title": "Find the best credit card",
          "description": "Recommend Indian credit cards based on spending pattern.\n\n        Args:\n            monthly_spend: Total monthly card spend in rupees.\n            primary_category: One of 'grocery', 'fuel', 'dining', 'travel',\n                              'online_shopping', 'utilities', 'general'.\n                              Defaults to 'general' — \"which card for ₹40,000 a\n                              month?\" is a complete question, and making this\n                              required turned it into a validation error.\n            annual_income: Annual income to filter cards by eligibility (optional).\n            prefer_no_annual_fee: True to prioritise lifetime-free cards.\n\n        Returns:\n            Top 5 cards with estimated annual cashback/rewards value.\n        ",
          "inputSchema": {
            "properties": {
              "annual_income": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Annual Income"
              },
              "monthly_spend": {
                "title": "Monthly Spend",
                "type": "number"
              },
              "prefer_no_annual_fee": {
                "default": false,
                "title": "Prefer No Annual Fee",
                "type": "boolean"
              },
              "primary_category": {
                "default": "general",
                "title": "Primary Category",
                "type": "string"
              }
            },
            "required": ["monthly_spend"],
            "title": "find_best_card_for_spendArguments",
            "type": "object"
          },
          "annotations": {
