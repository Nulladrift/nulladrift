        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "pixelpattern",
        "title": "Pixel Pattern craft pattern tools",
        "version": "1.0.0",
        "websiteUrl": "https://pixelpattern.app/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Craft pattern helpers from pixelpattern.app: match a color to Perler, Hama, Artkal beads, DMC floss or Minecraft blocks; pattern size and bead/stitch counts; supported crafts and palettes; prices; how to turn a photo into a pattern. Read-only; nothing is stored. This server can't receive photos: point the user to the linked pattern maker.",
      "tools": [
        {
          "name": "list_options",
          "title": "Supported crafts, palettes and sizes",
          "description": "Every craft the pattern maker supports with its palettes (brand and color count), size presets, default color count, cell size and grid and color limits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:480df432df7b4ed2d835df27f1c009e1d928c3eb778b1be28e142dafb1e15bcb"
        },
        {
          "name": "match_color",
          "title": "Match a color to beads, floss or blocks",
          "description": "Nearest Perler, Hama and Artkal bead and DMC floss color (or Minecraft block, PICO-8, Game Boy) to a hex or RGB color, by CIEDE2000, with codes, names and close alternatives.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "alternatives": {
                "default": 2,
                "description": "How many next-closest colors to add per palette (0–5)",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "color": {
                "description": "Hex like \"#E63946\" or \"e63946\", or RGB like \"230, 57, 70\" or \"rgb(230,57,70)\"",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "palettes": {
                "description": "Palettes to search (default perler, hama, artkal, dmc). Any of: perler, hama, artkal, dmc, minecraft, minecraftWool, pico8, gameboy",
                "items": {
                  "enum": ["perler", "hama", "artkal", "dmc", "minecraft", "minecraftWool", "pico8", "gameboy"],
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              }
            },
            "required": ["color"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b56726aaffc122f6511c576f849d0cb7431c5ef903d472ae73a801f6b2600c2a"
        },
        {
          "name": "pattern_prices",
          "title": "Printable pattern prices",
          "description": "Exact prices of the printable PDF patterns (per photo and the 3-photo pack), what is free, the re-download period and the refund policy.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ccd4a485ce8869e43881f29ba27b1a88aa86f2b5341a12e45df125332612685f"
        },
        {
          "name": "pattern_size",
          "title": "Pattern size, bead and stitch counts",
          "description": "Number of beads, stitches, squares or blocks for a grid size and craft, the finished size in cm and inches, pegboards needed (fuse beads) and stacks (Minecraft).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "craft": {
                "description": "beads (Perler/Hama/Artkal fuse beads), stitch (cross stitch, DMC), c2c (C2C crochet), crochet (tapestry crochet), minecraft (blocks) or pixel (pixel art)",
                "enum": ["beads", "stitch", "c2c", "crochet", "minecraft", "pixel"],
                "type": "string"
              },
              "height": {
                "description": "Cells down. Leave out to use the photo proportions (photo_aspect_ratio) or a square grid",
                "maximum": 200,
                "minimum": 8,
                "type": "integer"
              },
              "photo_aspect_ratio": {
                "description": "Photo width ÷ height (e.g. 1.5 for a 3:2 landscape); the height follows it like in the tool",
                "exclusiveMinimum": 0,
                "maximum": 20,
                "type": "number"
              },
              "width": {
                "description": "Cells across (8–200), e.g. 29 for one Perler pegboard",
                "maximum": 200,
                "minimum": 8,
                "type": "integer"
              }
            },
            "required": ["craft", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
