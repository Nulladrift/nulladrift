        },
        {
          "name": "photo_to_pattern_steps",
          "title": "How to turn a photo into a pattern",
          "description": "Steps to turn a photo into a bead, cross stitch, crochet, Minecraft or pixel art pattern, with a link to the pattern maker. This server can't receive photos; the link opens the browser tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "craft": {
                "description": "beads (Perler/Hama/Artkal fuse beads), stitch (cross stitch, DMC), c2c (C2C crochet), crochet (tapestry crochet), minecraft (blocks) or pixel (pixel art)",
                "enum": ["beads", "stitch", "c2c", "crochet", "minecraft", "pixel"],
                "type": "string"
              }
            },
