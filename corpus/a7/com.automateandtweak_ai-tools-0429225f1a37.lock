      "serverInfo": {
        "name": "automateandtweak",
        "title": "Automate & Tweak AI Tools Directory",
        "version": "1.0.0",
        "description": "Read-only directory of AI tools: search, details, pricing, FAQs, categories and comparisons in 11 languages.",
        "websiteUrl": "https://automateandtweak.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Automate & Tweak (automateandtweak.com) is a public, human-curated directory of AI tools: ~1,000 tools with pricing types, categories, tags, listing types, FAQs, pros and cons, similar tools and side-by-side comparisons, available in 11 languages.\nThis server is READ-ONLY: it never changes anything, needs no login and makes no AI calls. All data is exactly what the public website shows.\nSuggested flow: search_tools (free text, optional category/tag/type/pricing filters) or list_tools (browse) -> get_tool for details -> compare_tools for 2-3 tools. list_categories / list_tags / list_types / list_pricing_types give valid filter values; new_tools shows recent additions.\nEvery tool accepts an optional `locale` (en, nl, de, fr, es, zh, bg, hi, pt, ja, it; default en). Always link users to the returned canonical `url` fields on automateandtweak.com. Pricing and features change; treat results as a starting point and verify on the tool's own website.",
      "tools": [
        {
          "name": "compare_tools",
          "title": "Compare AI tools",
          "description": "Side-by-side data for 2 or 3 tools (pricing, categories, pros and cons, rating, website). Includes the canonical comparison page URL when that pair has a public comparison page on the site; this tool never creates comparisons.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "description": "Language of names, descriptions and URLs (site locale code). Default: en.",
                "enum": ["en", "nl", "de", "fr", "es", "zh", "bg", "hi", "pt", "ja", "it"],
                "type": "string"
              },
              "slugs": {
                "description": "Two or three tool slugs.",
                "items": {
                  "maxLength": 150,
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare AI tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4376af533d621da99ff97ef1b0767bea9c302ed1d20d6d946c860a0474fe12b2"
        },
        {
          "name": "get_tool",
          "title": "Get AI tool details",
          "description": "Full public details of one AI tool by slug: description, pricing types and price, categories, tags, listing types, website link, FAQs, pros and cons, similar tools, rating, verified flag, status and canonical URL. For offline or merged tools it says so and returns the replacement or alternatives.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "default": "en",
                "description": "Language of names, descriptions and URLs (site locale code). Default: en.",
                "enum": ["en", "nl", "de", "fr", "es", "zh", "bg", "hi", "pt", "ja", "it"],
                "type": "string"
              },
              "slug": {
                "description": "Tool slug as in the tool URL, e.g. \"chatgpt\".",
                "maxLength": 150,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
