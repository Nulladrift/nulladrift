        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Free-text search over the AI tools directory (names, aliases, subtitles, descriptions), ranked like the search on automateandtweak.com, with optional category / tag / listing type / pricing filters. Returns compact tool cards with canonical URLs; call get_tool for details.",
