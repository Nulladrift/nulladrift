        {
          "name": "list_tools",
          "title": "Browse AI tools",
          "description": "Browse the directory without a search text, filtered by category, tag, listing type and/or pricing type, sorted like the site listing (newest first by default). Paginated: pass the returned `next_cursor` as `cursor` for the next page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category filter: slug, key or numeric id as returned by list_categories.",
                "maxLength": 100,
                "type": "string"
              },
              "cursor": {
                "description": "Opaque cursor from a previous result (`next_cursor`).",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of results (1-25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of names, descriptions and URLs (site locale code). Default: en.",
                "enum": ["en", "nl", "de", "fr", "es", "zh", "bg", "hi", "pt", "ja", "it"],
                "type": "string"
              },
              "pricing": {
                "description": "Optional pricing filter. Valid keys: free, freemium, one-time, open-source, credits-pay-per-use, subscription, custom-enterprise. Synonyms: \"free\" matches free AND freemium tools (a usable free tier); \"paid\" matches every non-free model; \"open source\" works too. Several values may be comma-separated (e.g. \"free,open-source\"). Full list with counts: list_pricing_types.",
                "maxLength": 100,
                "type": "string"
              },
              "sort": {
                "default": "date-desc",
                "description": "Sort order; date = date listed.",
                "enum": ["date-desc", "date-asc", "name-asc", "name-desc"],
                "type": "string"
              },
              "tag": {
                "description": "Optional tag filter: slug, key or numeric id as returned by list_tags.",
                "maxLength": 100,
                "type": "string"
              },
              "type": {
                "description": "Optional listing type filter: slug, key or numeric id as returned by list_types.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
