        {
          "name": "gas_usage",
          "title": "Gas use over a profile",
          "description": "Returns the gas one open-circuit cylinder spends over a planned profile: per segment the gas used (volume and pressure), what is left, the runtime and a status, plus the reserve, the turn pressure and the first segment that drops below each. Use this when a diver asks whether a cylinder covers a no-stop or multilevel dive, how much gas a dive uses, or their turn pressure. Not for decompression dives (plan_dive charges deco gas) or measuring a breathing rate (rmv_sac).\n\nsac is the surface breathing rate in L/min (ft³/min imperial), default 20; rmv_sac's rmv and plan_dive's gas_consumption.working_sac are the same figure. Cylinder fields as in plan_dive (preset, cylinder_size, rated_pressure, twinset, start_pressure); default one AL80 at 3000 psi (206.84 bar). reserve as in plan_dive (thirds; fixed defaults to 50 bar, 725 psi). water defaults to en13319; altitude (m or ft) defaults to sea level. Real-gas volumes; the cylinder is assumed to hold air (plan_dive takes any mix). No engine call.\n\nExample: {\"preset\":\"al80\",\"segments\":[{\"depth\":18,\"duration_min\":40},{\"depth\":5,\"duration_min\":3}]}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "altitude": {
                "description": "Altitude (m or ft, per units), 0 to 10000 m (32800 ft). Lowers the surface pressure the math adds to gauge readings. Default 0.",
                "maximum": 32800,
                "minimum": 0,
                "type": "number"
              },
              "cylinder_size": {
                "description": "Metric: water volume of ONE cylinder in litres, the number stamped on the neck. Imperial: rated capacity in ft³ at rated_pressure (an AL80 is 77.4). Default: the preset's, else an AL80 (11.1 L).",
                "maximum": 400,
                "minimum": 0.5,
                "type": "number"
              },
              "preset": {
                "description": "A common cylinder instead of cylinder_size, as in plan_dive: al80, al40, al63, hp80, hp100, hp120, lp85, s80, single_10l, single_12l, single_15l, twin_10l, twin_12l, twin_15l, stage_11l, stage_7l, o2_3l, dil_3l. twin_ presets are a manifolded pair.",
                "enum": ["al80", "al40", "al63", "hp80", "hp100", "hp120", "lp85", "s80", "single_10l", "single_12l", "single_15l", "twin_10l", "twin_12l", "twin_15l", "stage_11l", "stage_7l", "o2_3l", "dil_3l"],
                "type": "string"
              },
              "rated_pressure": {
                "description": "Imperial only: the psi the capacity is rated at. Default: the preset's, else 3000. Ignored on metric.",
                "maximum": 7252,
                "minimum": 725,
                "type": "number"
              },
              "reserve": {
                "additionalProperties": false,
                "description": "Reserve the cylinder must keep, as in plan_dive: rule thirds (default), fourths, fifths, sixths or fixed with fixed_pressure.",
                "properties": {
                  "fixed_pressure": {
                    "description": "Reserve for rule fixed (bar or psi, per units). Default 50 bar (725 psi).",
                    "maximum": 7252,
                    "minimum": 0,
                    "type": "number"
                  },
                  "rule": {
                    "description": "thirds, fourths, fifths, sixths or fixed. Default thirds. Below 50 bar (725 psi) is always critical.",
                    "enum": ["thirds", "fourths", "fifths", "sixths", "fixed"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "sac": {
                "description": "Surface breathing rate, L/min (ft³/min imperial): the same figure as rmv_sac rmv and plan_dive gas_consumption.working_sac. Default 20 L/min (0.71 ft³/min).",
                "maximum": 200,
                "minimum": 0.03,
                "type": "number"
              },
              "segments": {
                "description": "The profile in order, one entry per depth. Put descent and ascent time into the nearest segment.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "depth": {
                      "description": "Depth of this segment (m or ft).",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "duration_min": {
                      "description": "Minutes at this depth, 0.1 to 600.",
                      "maximum": 600,
                      "minimum": 0.1,
                      "type": "number"
                    },
                    "sac": {
                      "description": "This segment's breathing rate when it differs (hard work, a calm stop). Default: the top-level sac.",
                      "maximum": 200,
                      "minimum": 0.03,
                      "type": "number"
                    }
                  },
                  "required": ["depth", "duration_min"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "start_pressure": {
                "description": "Fill at the start (bar or psi, per units). Default: the preset's fill, else 206.84 bar (3000 psi).",
                "maximum": 7252,
                "minimum": 0,
                "type": "number"
              },
              "twinset": {
                "description": "true for two cylinders on a manifold, filled or breathed together: doubles the volume. Default: the preset's, else false.",
                "type": "boolean"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "water": {
                "description": "Water type, from its density: en13319 (EN 13319, the dive computer standard) 10.00 m per bar, salt 9.95, fresh 10.20, red_sea 9.92. Default en13319.",
                "enum": ["salt", "fresh", "en13319", "red_sea"],
                "type": "string"
              }
            },
            "required": ["segments"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cylinder": {
                "additionalProperties": false,
                "properties": {
                  "cylinder_size": {
                    "description": "L of water (metric) or rated ft³ (imperial), one cylinder.",
                    "type": "number"
                  },
                  "free_gas_volume": {
                    "description": "Gas the full cylinder delivers down to a gauge of 0, at the surface pressure for the altitude, real gas (L or ft³).",
                    "type": "number"
                  },
                  "preset": {
                    "type": "string"
                  },
                  "rated_pressure": {
                    "type": "number"
                  },
                  "start_pressure": {
                    "type": "number"
                  },
                  "twinset": {
                    "type": "boolean"
                  }
                },
                "required": ["cylinder_size", "free_gas_volume", "start_pressure", "twinset"],
                "type": "object"
              },
              "first_segment_below_reserve": {
                "description": "1-based segment that ends under the reserve.",
                "type": "number"
              },
              "first_segment_below_turn": {
                "description": "1-based segment that ends under the turn pressure.",
                "type": "number"
              },
              "minutes_left_at_last_depth": {
                "description": "More minutes at the last segment's depth and rate before the cylinder is empty (no reserve kept).",
                "type": "number"
              },
              "remaining_pressure": {
                "type": "number"
              },
              "reserve_pressure": {
                "type": "number"
              },
              "sac": {
                "type": "number"
              },
              "safety_notice": {
                "type": "string"
              },
              "segments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cumulative_volume": {
                      "type": "number"
                    },
                    "depth": {
                      "type": "number"
                    },
                    "duration_min": {
                      "type": "number"
                    },
                    "gas_used_pressure": {
                      "type": "number"
                    },
                    "gas_used_volume": {
                      "type": "number"
                    },
                    "remaining_pressure": {
                      "type": "number"
                    },
                    "runtime_min": {
                      "type": "number"
                    },
                    "sac": {
                      "type": "number"
                    },
                    "status": {
                      "enum": ["ok", "below_reserve", "critical", "out_of_gas"],
                      "type": "string"
                    }
                  },
                  "required": ["cumulative_volume", "depth", "duration_min", "gas_used_pressure", "gas_used_volume", "remaining_pressure", "runtime_min", "sac", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "spoken_summary": {
                "description": "A few plain sentences for a voice reply, ending with an offer: digits allowed, no symbols or notation.",
                "type": "string"
              },
              "status": {
                "enum": ["ok", "below_reserve", "critical", "out_of_gas"],
                "type": "string"
              },
              "total_gas_pressure": {
                "type": "number"
              },
              "total_gas_volume": {
                "type": "number"
              },
              "turn_pressure": {
                "description": "There-and-back: turn when the gauge reads this; half the usable gas is then gone.",
                "type": "number"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "used_pct": {
                "type": "number"
              },
              "water": {
                "description": "Water type, from its density: en13319 (EN 13319, the dive computer standard) 10.00 m per bar, salt 9.95, fresh 10.20, red_sea 9.92. Default en13319.",
                "enum": ["salt", "fresh", "en13319", "red_sea"],
                "type": "string"
              }
            },
            "required": ["assumptions", "cylinder", "minutes_left_at_last_depth", "remaining_pressure", "reserve_pressure", "sac", "safety_notice", "segments", "spoken_summary", "status", "total_gas_pressure", "total_gas_volume", "turn_pressure", "units", "used_pct", "water"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
