        {
          "name": "read_share_link",
          "title": "Read a Dive Kit share link",
          "description": "Decodes a Dive Kit share link (https://divekit.app/share/deco-plan/...) into the plan_dive input it carries: profile, gases, CCR rig, settings, custom contingencies, modifiers and repetitive tissue state, in the requested units. Use this when a diver pastes a Dive Kit link and wants the plan recomputed or changed. Not for links from other apps, and not a schedule: it returns inputs.\n\nResults baked into the link are ignored; plan_dive recomputes them. Links do not carry behavior.stay_on_loop or the loop oxygen-break toggle, so those return as defaults and the result says so.",
