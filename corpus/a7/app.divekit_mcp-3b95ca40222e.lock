        {
          "name": "lookup_certifications",
          "title": "Look up diving certifications",
          "description": "Returns diving certifications from Dive Kit's vetted open dataset of agencies and courses: prerequisites, equivalent courses at other agencies, depth and gas limits, notes and links. Use this when a diver asks what a course allows (\"what does PADI Tec 45 let me do\"), what they need before a course (\"what do I need before a trimix course\"), whether two courses are equivalent (\"is SSI X equivalent to PADI Y\"), or what an agency offers. Not for planning a dive.\n\nThis is Dive Kit's own curated data (MIT licence, open.divekit.app), not a web search; agency rules change, so point the diver to the agency for the final word. No engine call.\n\nExample: {\"agency\":\"PADI\",\"query\":\"tec 45\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "agency": {
                "description": "Agency abbreviation or id, any case: PADI, SSI, NAUI, SDI, TDI, CMAS, BSAC, RAID, IANTD, GUE, UTD, ANDI, NSS-CDS, ISE, and others. Alone, it returns the agency and a list of its courses.",
                "maxLength": 40,
                "type": "string"
              },
              "category": {
                "description": "recreational, rescue, specialty, technical, rebreather, professional, cave, freediving or other.",
                "enum": ["recreational", "rescue", "specialty", "technical", "rebreather", "professional", "cave", "freediving", "other"],
                "type": "string"
              },
              "id": {
                "description": "Exact certification id from an earlier result, e.g. cert-padi-tec-45.",
                "maxLength": 80,
                "type": "string"
              },
              "query": {
                "description": "Free text against the course name, abbreviation, former names, notes and limits, e.g. \"tec 45\", \"trimix\", \"advanced nitrox\", \"cave\". Every word must match.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "agency": {
                "additionalProperties": {},
                "description": "The agency record when agency was given.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "attribution": {
                "description": "Credit line (MIT licence); keep it with any figures you quote.",
                "type": "string"
              },
              "certifications": {
                "description": "Matching records, at most 20, each with agency_abbr.",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "dataset_version": {
                "description": "Dataset release tag.",
                "type": "string"
              },
              "total_matches": {
                "description": "Matches before the cap.",
                "type": "number"
              }
            },
            "required": ["attribution", "certifications", "dataset_version", "total_matches"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up diving certifications"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:3da78a2f76a085b676fe6963ec64c4e0d5e55baf19680e5566cd197e51b39174"
