        {
          "name": "check_no_deco",
          "title": "No-stop time at a depth",
          "description": "Use this when the diver asks how long they can stay at a depth without decompression stops (no-deco limit, NDL, no-stop time). Returns the minutes left after the descent at GF high, the PPO₂ of the gas there and its MOD at 1.4 bar, a safety-stop reminder and a Dive Kit share link. Suits beginners and recreational divers. Not for a full dive plan (plan_dive) or a gas-limited bottom time (find_max_bottom_time).\n\nComputed by the Dive Kit app's Bühlmann ZH-L16C engine; agency tables and dive computers differ. Default gas air, GF 50/80. For \"is 25 min at 30 m ok?\" send bottom_time_min: the answer says within or over, and by how much. For a repetitive dive pass the previous result's share link and the surface interval.\n\nExample: {\"depth\":18}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "altitude": {
                "description": "Surface altitude (m or ft, per units), 0 to 10000 m (0 to 32800 ft). Default 0.",
                "maximum": 32800,
                "minimum": 0,
                "type": "number"
              },
              "bottom_time_min": {
                "description": "Planned minutes at the depth after the descent, 1 to 300. When given, the answer says whether it is within the no-stop time and by how much. Example: 25 for \"is 25 min at 30 m ok?\".",
                "maximum": 300,
                "minimum": 1,
                "type": "number"
              },
              "depth": {
                "description": "Depth in m (metric) or ft (imperial), 1 to 200 m (3 to 650 ft). Required.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "gradient_factors": {
                "additionalProperties": false,
                "description": "Gradient factors. The no-stop time is computed at GF high.",
                "properties": {
                  "high": {
                    "description": "GF high, percent, 10 to 100. Sets the no-stop limit. Default 80.",
                    "maximum": 100,
                    "minimum": 10,
                    "type": "number"
                  },
                  "low": {
                    "description": "GF low, percent, 10 to 100. Default 50.",
                    "maximum": 100,
                    "minimum": 10,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "helium_pct": {
                "description": "Helium percentage, 0 to 95. Default 0.",
                "maximum": 95,
                "minimum": 0,
                "type": "number"
              },
              "oxygen_pct": {
                "description": "Oxygen percentage of the gas, 5 to 100. Default 21 (air). Example: 32 for EANx32.",
                "maximum": 100,
                "minimum": 5,
                "type": "number"
              },
              "previous_share_url": {
                "description": "Repetitive dive: the share link of the previous dive's plan_dive or check_no_deco result. Send with surface_interval_min.",
                "maxLength": 8000,
                "type": "string"
              },
              "surface_interval_min": {
                "description": "Repetitive dive: surface interval since the previous dive, 15 to 1440 minutes. Send with previous_share_url.",
                "maximum": 1440,
                "minimum": 15,
                "type": "number"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "water": {
                "description": "Water type, from its density: en13319 (EN 13319, the dive computer standard) 10.00 m per bar, salt 9.95, fresh 10.20, red_sea 9.92. Default en13319.",
                "enum": ["salt", "fresh", "en13319", "red_sea"],
                "type": "string"
              }
            },
            "required": ["depth"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "depth": {
                "description": "Depth, as given.",
                "type": "number"
              },
              "gf": {
                "description": "Gradient factors used, low/high.",
                "type": "string"
              },
              "margin_min": {
                "description": "With bottom_time_min: minutes to spare (within) or over (over). null: no limit within the model.",
                "type": ["number", "null"]
              },
              "mix": {
                "description": "Gas as O₂/He, e.g. 21/0.",
                "type": "string"
              },
              "mod_1_4_bar": {
                "description": "MOD of the gas at 1.4 bar.",
                "type": "number"
              },
              "no_stop_minutes": {
                "description": "Minutes at the depth after the descent before a stop is required, at GF high. 0: a stop is already required on arrival. null: no limit within the model.",
                "type": ["number", "null"]
              },
              "planned_min": {
                "description": "bottom_time_min, as given.",
                "type": "number"
              },
              "ppo2": {
                "description": "PPO₂ of the gas at the depth, bar.",
                "type": "number"
              },
              "safety_notice": {
                "type": "string"
              },
              "share_url": {
                "description": "Dive Kit link to a 1-minute plan at this depth.",
                "type": "string"
              },
              "spoken_summary": {
                "description": "A few plain sentences for a voice reply, ending with an offer: digits allowed, no symbols or notation.",
                "type": "string"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "verdict": {
                "description": "With bottom_time_min: within or over the no-stop time.",
                "enum": ["within", "over"],
                "type": "string"
              },
              "warnings": {
                "description": "Titles of the plan warnings at this depth (hyperoxia, hypoxia, density, END).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["depth", "gf", "mix", "mod_1_4_bar", "no_stop_minutes", "ppo2", "safety_notice", "share_url", "spoken_summary", "units", "warnings"],
            "type": "object"
          },
