        {
          "name": "blend_continuous",
          "title": "Continuous-flow blend",
          "description": "Returns the settings for continuous-flow blending through a compressor intake: each feed gas's share of the intake flow, the analyzer readings to aim for after the first injection and at the end, and the pressure to bleed to first when the cylinder's gas is in the way. Use this when a blender fills with fixed air, oxygen and helium feeds (a nitrox stick or membrane) and asks what ratios or analyzer targets give a mix. Not for partial-pressure fills (plan_blend).\n\ncurrent is the cylinder now, as in plan_blend; target: oxygen_pct, helium_pct, pressure. injection_order he_first (default) or o2_first picks which intermediate analyzer reading the text leads with; both come back. bleed_step rounds the bleed down to a gauge mark, default 5 bar (100 psi). An impossible mix returns feasible false with the reason. No engine call.\n\nExample: {\"current\":{\"oxygen_pct\":21,\"pressure\":0},\"target\":{\"oxygen_pct\":32,\"pressure\":200}}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "altitude": {
                "description": "Altitude (m or ft, per units), 0 to 10000 m (32800 ft). Lowers the surface pressure the math adds to gauge readings. Default 0.",
                "maximum": 32800,
                "minimum": 0,
                "type": "number"
              },
              "bleed_step": {
                "description": "Gauge step the bleed pressure rounds down to (bar or psi). Default 5 bar (100 psi).",
                "maximum": 500,
                "minimum": 1,
                "type": "number"
              },
              "current": {
                "additionalProperties": false,
                "description": "The cylinder now: analysed mix, gauge pressure and size.",
                "properties": {
                  "cylinder_size": {
                    "description": "Metric: water volume of ONE cylinder in litres, the number stamped on the neck. Imperial: rated capacity in ft³ at rated_pressure (an AL80 is 77.4). Default: the preset's, else an AL80 (11.1 L).",
                    "maximum": 400,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  "helium_pct": {
                    "description": "Helium % now, 0 to 100. Default 0.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "oxygen_pct": {
                    "description": "Oxygen % of the gas in the cylinder now, as analysed, 0 to 100. Air is 21; an empty cylinder is 21 at pressure 0.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "preset": {
                    "description": "A common cylinder instead of cylinder_size, as in plan_dive: al80, al40, al63, hp80, hp100, hp120, lp85, s80, single_10l, single_12l, single_15l, twin_10l, twin_12l, twin_15l, stage_11l, stage_7l, o2_3l, dil_3l. twin_ presets are a manifolded pair.",
                    "enum": ["al80", "al40", "al63", "hp80", "hp100", "hp120", "lp85", "s80", "single_10l", "single_12l", "single_15l", "twin_10l", "twin_12l", "twin_15l", "stage_11l", "stage_7l", "o2_3l", "dil_3l"],
                    "type": "string"
                  },
                  "pressure": {
                    "description": "Gauge pressure now (bar or psi, per units), 0 to 500 bar (7252 psi).",
                    "maximum": 7252,
                    "minimum": 0,
                    "type": "number"
                  },
                  "rated_pressure": {
                    "description": "Imperial only: the psi the capacity is rated at. Default: the preset's, else 3000. Ignored on metric.",
                    "maximum": 7252,
                    "minimum": 725,
                    "type": "number"
                  },
                  "twinset": {
                    "description": "true for two cylinders on a manifold, filled or breathed together: doubles the volume. Default: the preset's, else false.",
                    "type": "boolean"
                  }
                },
                "required": ["oxygen_pct", "pressure"],
                "type": "object"
              },
              "injection_order": {
                "description": "Order the feeds join the intake: he_first (helium, then oxygen; the default) or o2_first. Picks which intermediate analyzer reading the text leads with; both are returned.",
                "enum": ["he_first", "o2_first"],
                "type": "string"
              },
              "target": {
                "additionalProperties": false,
                "description": "The mix and settled pressure to reach.",
                "properties": {
                  "helium_pct": {
                    "description": "Target helium %, 0 to 100. Default 0.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "oxygen_pct": {
                    "description": "Target oxygen %, 0 to 100 (EANx32 is 32, trimix 21/35 is 21).",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "pressure": {
                    "description": "Target gauge pressure once the cylinder has cooled (bar or psi, per units).",
                    "maximum": 7252,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["oxygen_pct", "pressure"],
                "type": "object"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["current", "target"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "analyzer_final_pct": {
                "description": "Oxygen % the analyzer reads on the finished stream.",
                "type": "number"
              },
              "analyzer_intermediate_he_first_pct": {
                "description": "He first: oxygen % after helium joins the air, before oxygen.",
                "type": "number"
              },
              "analyzer_intermediate_o2_first_pct": {
                "description": "O₂ first: oxygen % after oxygen joins the air, before helium.",
                "type": "number"
              },
              "bleed_pressure": {
                "description": "Bleed the cylinder to this gauge pressure first; absent when no bleed is needed.",
                "type": "number"
              },
              "blend": {
                "additionalProperties": false,
                "description": "The intake stream the whole fill must be.",
                "properties": {
                  "helium_pct": {
                    "type": "number"
                  },
                  "oxygen_pct": {
                    "type": "number"
                  }
                },
                "required": ["helium_pct", "oxygen_pct"],
                "type": "object"
              },
              "error": {
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "key": {
                    "type": "string"
                  },
                  "reason": {
                    "type": "string"
                  }
                },
                "required": ["code", "key", "reason"],
                "type": "object"
              },
              "feasible": {
                "type": "boolean"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ratios": {
                "description": "Share of the intake flow per feed.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fraction_pct": {
                      "type": "number"
                    },
                    "gas": {
                      "enum": ["air", "oxygen", "helium"],
                      "type": "string"
                    }
                  },
                  "required": ["fraction_pct", "gas"],
                  "type": "object"
                },
                "type": "array"
              },
              "safety_notice": {
                "type": "string"
              },
              "spoken_summary": {
                "description": "A few plain sentences for a voice reply, ending with an offer: digits allowed, no symbols or notation.",
                "type": "string"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["feasible", "notes", "ratios", "safety_notice", "spoken_summary", "units"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Continuous-flow blend"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:7796ea51165c7d4492149426764cc517a94e38182a02ccaa8bdc32043b3ad299"
        },
        {
          "name": "buoyancy_check",
          "title": "Weighting and buoyancy check",
          "description": "Returns a weighting check for one rig: how much lead to add or remove to be neutral at the end of the dive, the net buoyancy at the start (full cylinders at the target depth) and the end (near-empty cylinders at 3 m), what a flooded drysuit, a failed wing or a dropped stage would do and how to recover, and advisories. Use this when a diver asks how much weight they need, whether a rig is balanced, or how a change of suit, cylinder or water moves it. Not for gas planning.\n\ncylinders take a role (single, twinset, sidemount, stage) and cylinder: a lookup_cylinders id (al80, steel12-232) or a plan_dive preset, or cylinder_size and empty_buoyancy (sea water, with valve), plus empty_weight if known, for one not in the data. Weights are kg (lb imperial); gear weight is positive when it sinks. Omitted fields take Dive Kit defaults (salt water, 30 m, a 5 mm full wetsuit, a 16 kg wing, no body offset), listed in assumptions. Body buoyancy comes only from a measured body_offset (diver), never from body measurements; without one it is taken as neutral. An estimate to start from: confirm with an in-water weight check. Compare two setups with two calls. No engine call.\n\nExample: {\"cylinders\":[{\"role\":\"single\",\"cylinder\":\"al80\"}],\"exposure\":{\"type\":\"wetsuit\",\"thickness_mm\":7},\"gear\":[{\"label\":\"belt\",\"weight\":6,\"ditchable\":true}]}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cylinders": {
                "description": "Cylinders on the rig. Default one single AL80.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cylinder": {
                      "description": "A lookup_cylinders id (al80, steel12-232, hp100) or a plan_dive preset (al80, twin_12l, stage_11l). For twinset and sidemount name ONE cylinder of the pair. Default al80.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "cylinder_lead": {
                      "description": "Lead fixed to each cylinder (a tail or V-weight), kg (lb). Default 0.",
                      "maximum": 250,
                      "minimum": -100,
                      "type": "number"
                    },
                    "cylinder_size": {
                      "description": "For a cylinder not in the data: water litres of one cylinder, or ft³ at rated_pressure on imperial. Needs empty_buoyancy.",
                      "maximum": 400,
                      "minimum": 0.5,
                      "type": "number"
                    },
                    "empty_buoyancy": {
                      "description": "For a cylinder not in the data: buoyancy of one empty cylinder in sea water with its valve, kg (lb imperial), negative when it sinks. From the maker's sheet.",
                      "maximum": 250,
                      "minimum": -100,
                      "type": "number"
                    },
                    "empty_weight": {
                      "description": "For a cylinder not in the data: weight of one empty cylinder without its valve, kg (lb imperial). Optional: with it the conversion to other water matches a cylinder in the data. Without it the conversion uses the internal volume, which understates the shift.",
                      "maximum": 250,
                      "minimum": -100,
                      "type": "number"
                    },
                    "helium_pct": {
                      "description": "Helium % of the gas in it. Default 0.",
                      "maximum": 95,
                      "minimum": 0,
                      "type": "number"
                    },
                    "oxygen_pct": {
                      "description": "Oxygen % of the gas in it. Default 21.",
                      "maximum": 100,
                      "minimum": 5,
                      "type": "number"
                    },
                    "rated_pressure": {
                      "description": "Imperial only, with cylinder_size: the psi its ft³ is rated at. Default 3000.",
                      "maximum": 7252,
                      "minimum": 725,
                      "type": "number"
                    },
                    "regulator": {
                      "description": "Regulator on each cylinder: travel, standard, cold_water or none. Default by role: standard (single, sidemount), cold_water (twinset), travel (stage).",
                      "enum": ["travel", "standard", "cold_water", "none"],
                      "type": "string"
                    },
                    "rigging": {
                      "description": "Count bands, manifold or stage hardware. Default true for twinset, sidemount and stage.",
                      "type": "boolean"
                    },
                    "role": {
                      "description": "single, twinset (two on a manifold), sidemount (a pair, one each side) or stage (one slung cylinder; one entry per stage).",
                      "enum": ["single", "twinset", "sidemount", "stage"],
                      "type": "string"
                    },
                    "start_pressure": {
                      "description": "Fill at the start (bar or psi). Default: the preset fill, else the dataset working pressure.",
                      "maximum": 7252,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["role"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "diver": {
                "additionalProperties": false,
                "description": "Optional. A measured body_offset; without one the body is taken as neutral.",
                "properties": {
                  "body_offset": {
                    "description": "The diver's own buoyancy with no suit or gear, from an in-water float test at the end of a breath out, kg (lb): positive floats, negative sinks.",
                    "maximum": 250,
                    "minimum": -100,
                    "type": "number"
                  },
                  "body_offset_water": {
                    "description": "Water type, from its density: en13319 (EN 13319, the dive computer standard) 10.00 m per bar, salt 9.95, fresh 10.20, red_sea 9.92. Default en13319.",
                    "enum": ["salt", "fresh", "en13319", "red_sea"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "exposure": {
                "additionalProperties": false,
                "description": "Exposure suit. Default a 5 mm full wetsuit.",
                "properties": {
                  "booties_mm": {
                    "description": "Bootie thickness in mm; 0 or omitted for none.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "custom_lift": {
                    "description": "Measured suit lift at the surface, kg (lb), instead of the model.",
                    "maximum": 250,
                    "minimum": -100,
                    "type": "number"
                  },
                  "cut": {
                    "description": "Wetsuit cut: full (default), shorty or farmer_john.",
                    "enum": ["full", "shorty", "farmer_john"],
                    "type": "string"
                  },
                  "gloves_mm": {
                    "description": "Glove thickness in mm; 0 or omitted for none.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "hood_mm": {
                    "description": "Hood thickness in mm; 0 or omitted for none.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "neoprene": {
                    "description": "Wetsuit foam: soft (new, compresses most), standard (default) or old (about 20% less lift).",
                    "enum": ["soft", "standard", "old"],
                    "type": "string"
                  },
                  "thickness_mm": {
                    "description": "Wetsuit neoprene thickness in mm (both unit systems), 0 to 10. Default 5.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  },
                  "type": {
                    "description": "none, wetsuit or drysuit.",
                    "enum": ["none", "wetsuit", "drysuit"],
                    "type": "string"
                  },
                  "undersuit": {
                    "description": "Drysuit undersuit: light, medium (default) or heavy.",
                    "enum": ["light", "medium", "heavy"],
                    "type": "string"
                  },
                  "vest_mm": {
                    "description": "Vest or hooded vest thickness in mm; 0 or omitted for none.",
                    "maximum": 10,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "gear": {
