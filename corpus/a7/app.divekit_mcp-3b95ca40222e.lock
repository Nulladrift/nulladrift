        {
          "name": "get_guide",
          "title": "Dive Kit planning guide",
          "description": "Returns one section of the Dive Kit planning guide as markdown. Use this when you need to explain a term, a warning or deco theory, or to check what a planning conversation needs: workflow, tool chains, every input with unit, default and range (inputs_reference), deco theory, gradient factors, gas choice, gas planning, gas consumption, blending, weighting, CCR, bailout and contingencies, every warning, repetitive dives, worked examples, conventions, limits, sources; start_here is the index. Not for numbers: every figure comes from the planning tools.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Guide section to return. Pick glossary for what a word means, deco_theory for how the model works, limits_and_safety for \"is it safe\". start_here: index of the guide and tools. workflow: how a planning conversation runs and what plan_dive needs. tool_chains: how one tool's result feeds the next, six recipes. inputs_reference: every input with unit, default and range. glossary: diver words, abbreviations and plan-table marks mapped to plain meaning and to fields. glossary_equipment: cylinders, rigs and every cylinders[].preset id with its size and fill. deco_theory: Bühlmann ZH-L16C and decompression basics. gradient_factors: what GF low/high do. gas_selection: choosing bottom and deco gases. gas_planning: gas volumes, reserves and turn pressure. gas_consumption: breathing rate (SAC, RMV), rmv_sac and gas_usage. gas_blending: plan_blend, mix_result and fill-station practice. blending_continuous_and_decant: blend_continuous and decant. buoyancy_and_weighting: buoyancy_check, weighting and failure cases. ccr: closed-circuit rebreather planning. bailout_and_contingencies: bailout and lost-gas plans. warnings: every warning and what it means. repetitive_dives: surface intervals and residual loading. worked_examples: complete example plans. why_plans_differ: why planners disagree. conventions: why Dive Kit numbers differ from textbook formulas. limits_and_safety: what this server does not do. sources: references.",
                "enum": ["start_here", "workflow", "tool_chains", "inputs_reference", "glossary", "glossary_equipment", "deco_theory", "gradient_factors", "gas_selection", "gas_planning", "gas_consumption", "gas_blending", "blending_continuous_and_decant", "buoyancy_and_weighting", "ccr", "bailout_and_contingencies", "warnings", "repetitive_dives", "worked_examples", "why_plans_differ", "conventions", "limits_and_safety", "sources"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "markdown": {
                "type": "string"
              },
              "topic": {
                "enum": ["start_here", "workflow", "tool_chains", "inputs_reference", "glossary", "glossary_equipment", "deco_theory", "gradient_factors", "gas_selection", "gas_planning", "gas_consumption", "gas_blending", "blending_continuous_and_decant", "buoyancy_and_weighting", "ccr", "bailout_and_contingencies", "warnings", "repetitive_dives", "worked_examples", "why_plans_differ", "conventions", "limits_and_safety", "sources"],
                "type": "string"
              }
            },
            "required": ["markdown", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Dive Kit planning guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:e07759522db90c7dbd06a6d255c984b10fca0626e6d58856c6ef3e2bcfa6a12c"
