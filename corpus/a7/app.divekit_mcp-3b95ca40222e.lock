        },
        {
          "name": "convert_units",
          "title": "Convert diving units",
          "description": "Converts one diving figure between units: pressure (bar, psi, MPa), volume (L, ft³), depth (m, ft), temperature (°C, °F, K), weight (kg, lb) and breathing rate (L/min, ft³/min, bar/min, psi/min). Use this when a diver gives a figure in the other unit system or asks what it reads in another unit. Returns the converted value and the factor used. Not for depth to pressure (gas_specs) or a cylinder's capacity (lookup_cylinders).\n\nquantity names the kind; from and to take unit tokens: bar, psi, mpa; l, cuft; m, ft; c, f, k; kg, lb; l_min, cuft_min, bar_min, psi_min. Converting between a litres rate and bar_min or psi_min needs cylinder_size (water litres of the cylinder, both cylinders for a twinset), because a pressure drop per minute is litres only on one cylinder. Factors are Dive Kit's exact ones (1 bar = 14.5038 psi, 1 ft = 0.3048 m). No engine call.\n\nExample: {\"quantity\":\"pressure\",\"value\":3000,\"from\":\"psi\",\"to\":\"bar\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cylinder_size": {
                "description": "Water volume in litres of the cylinder a bar_min or psi_min rate is read on (both cylinders of a twinset, e.g. 24). Required to convert between a litres rate (l_min, cuft_min) and bar_min or psi_min; bar_min to psi_min needs none.",
                "maximum": 60,
                "minimum": 0.5,
                "type": "number"
              },
              "from": {
                "description": "Unit of value: bar, psi, mpa (pressure); l, cuft (volume); m, ft (depth); c, f, k (temperature); kg, lb (weight); l_min, cuft_min, bar_min, psi_min (breathing_rate).",
                "enum": ["bar", "psi", "mpa", "l", "cuft", "m", "ft", "c", "f", "k", "kg", "lb", "l_min", "cuft_min", "bar_min", "psi_min"],
                "type": "string"
              },
              "quantity": {
                "description": "Kind of figure: pressure, volume, depth, temperature, weight or breathing_rate.",
                "enum": ["pressure", "volume", "depth", "temperature", "weight", "breathing_rate"],
                "type": "string"
              },
              "to": {
                "description": "Unit to convert to, from the same list as from: bar, psi, mpa, l, cuft, m, ft, c, f, k, kg, lb, l_min, cuft_min, bar_min, psi_min.",
                "enum": ["bar", "psi", "mpa", "l", "cuft", "m", "ft", "c", "f", "k", "kg", "lb", "l_min", "cuft_min", "bar_min", "psi_min"],
                "type": "string"
              },
              "value": {
                "description": "The figure to convert: 0 or more, except a temperature.",
                "maximum": 1000000,
                "minimum": -1000000,
                "type": "number"
              }
            },
            "required": ["from", "quantity", "to", "value"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "factor": {
                "description": "Multiply by this to convert (absent for temperature, which has an offset).",
                "type": "number"
              },
              "from": {
                "enum": ["bar", "psi", "mpa", "l", "cuft", "m", "ft", "c", "f", "k", "kg", "lb", "l_min", "cuft_min", "bar_min", "psi_min"],
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "quantity": {
                "enum": ["pressure", "volume", "depth", "temperature", "weight", "breathing_rate"],
                "type": "string"
              },
              "result": {
                "description": "The converted figure, to 4 decimals.",
                "type": "number"
              },
              "safety_notice": {
                "type": "string"
              },
              "spoken_summary": {
                "description": "A few plain sentences for a voice reply, ending with an offer: digits allowed, no symbols or notation.",
                "type": "string"
              },
              "to": {
                "enum": ["bar", "psi", "mpa", "l", "cuft", "m", "ft", "c", "f", "k", "kg", "lb", "l_min", "cuft_min", "bar_min", "psi_min"],
                "type": "string"
              },
              "value": {
                "type": "number"
              }
            },
            "required": ["from", "quantity", "result", "safety_notice", "spoken_summary", "to", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert diving units"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
