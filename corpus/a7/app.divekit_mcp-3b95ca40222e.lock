        {
          "name": "decant",
          "title": "Decant between cylinders",
          "description": "Returns what happens when two cylinders are joined with a transfill whip: the pressure both settle to, each cylinder's pressure and mix afterwards, and how much gas moved. With a target mix it also returns where to close the valve, the mix the receiver reaches and what the donor keeps, or why the target is out of reach. Use this when a diver tops up one cylinder from another (\"top my 50 bar EANx32 from a full EANx50\") or asks whether a decant reaches a mix. Not for bank fills (plan_blend).\n\nreceiver and donor as plan_blend's current: oxygen_pct, helium_pct, pressure, and preset or cylinder_size (default AL80 size). Gas flows from the higher pressure to the lower. The warm gas and the whip make the first gauge reading high: analyse after it cools. An unreachable target returns feasible false with the reason. No engine call.\n\nExample: {\"receiver\":{\"oxygen_pct\":32,\"pressure\":50,\"cylinder_size\":12},\"donor\":{\"oxygen_pct\":50,\"pressure\":200,\"cylinder_size\":12},\"target\":{\"oxygen_pct\":40}}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "altitude": {
                "description": "Altitude (m or ft, per units), 0 to 10000 m (32800 ft). Lowers the surface pressure the math adds to gauge readings. Default 0.",
                "maximum": 32800,
                "minimum": 0,
                "type": "number"
              },
              "donor": {
                "additionalProperties": false,
                "description": "The cylinder the gas comes from: analysed mix, gauge pressure, size.",
                "properties": {
                  "cylinder_size": {
                    "description": "Metric: water volume of ONE cylinder in litres, the number stamped on the neck. Imperial: rated capacity in ft³ at rated_pressure (an AL80 is 77.4). Default: the preset's, else an AL80 (11.1 L).",
                    "maximum": 400,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  "helium_pct": {
                    "description": "Helium % now, 0 to 100. Default 0.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "oxygen_pct": {
                    "description": "Oxygen % of the gas in the cylinder now, as analysed, 0 to 100. Air is 21; an empty cylinder is 21 at pressure 0.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "preset": {
                    "description": "A common cylinder instead of cylinder_size, as in plan_dive: al80, al40, al63, hp80, hp100, hp120, lp85, s80, single_10l, single_12l, single_15l, twin_10l, twin_12l, twin_15l, stage_11l, stage_7l, o2_3l, dil_3l. twin_ presets are a manifolded pair.",
                    "enum": ["al80", "al40", "al63", "hp80", "hp100", "hp120", "lp85", "s80", "single_10l", "single_12l", "single_15l", "twin_10l", "twin_12l", "twin_15l", "stage_11l", "stage_7l", "o2_3l", "dil_3l"],
                    "type": "string"
                  },
                  "pressure": {
                    "description": "Gauge pressure now (bar or psi, per units), 0 to 500 bar (7252 psi).",
                    "maximum": 7252,
                    "minimum": 0,
                    "type": "number"
                  },
                  "rated_pressure": {
                    "description": "Imperial only: the psi the capacity is rated at. Default: the preset's, else 3000. Ignored on metric.",
