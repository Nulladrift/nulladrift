        {
          "name": "plan_blend",
          "title": "Plan a gas blend",
          "description": "Returns a partial-pressure blending plan from what a cylinder holds to a target mix and pressure: bleed, helium, oxygen and top-up steps with the gauge pressure to stop at, the mix after each step, the cooling step, the mix achieved, the gas drawn from each bank and alternative plans. Use this when a diver or blender asks how to fill nitrox or trimix (\"fill my twin 12s to 21/35 from 60 bar of 18/45\") or whether their banks can reach a mix. Not for a fill already done (mix_result), continuous-flow blending (blend_continuous) or decanting (decant).\n\ncurrent is the cylinder as analysed now: oxygen_pct, helium_pct, pressure, and preset or cylinder_size as in plan_dive (default AL80 size). target: oxygen_pct, helium_pct, pressure. banks default to unlimited air, oxygen and helium; a finite bank needs pressure and cylinder_size together. A target the banks cannot reach returns feasible false with the reason and the partial plan, not an error. To verify, send mix_result_current and mix_result_additions to mix_result; then gas_specs, and plan_dive with the analysed mix. Oxygen above 40% needs oxygen-clean equipment and blender training. No engine call.\n\nExample: {\"current\":{\"oxygen_pct\":21,\"pressure\":50,\"preset\":\"twin_12l\"},\"target\":{\"oxygen_pct\":21,\"helium_pct\":35,\"pressure\":220}}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
