                    "time_change_min": {
                      "description": "Minutes added to that level, -60 to 60. Default 0.",
                      "maximum": 60,
                      "minimum": -60,
                      "type": "number"
                    },
                    "working_sac": {
                      "description": "Working SAC for this contingency only (L/min or ft³/min, per units). Default gas_consumption.working_sac.",
                      "maximum": 200,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 6,
                "type": "array"
              },
              "cylinders": {
                "description": "Every open-circuit cylinder carried: back gas, stages, deco gases; on ccr, bailout gases. 1 to 10. Give preset or cylinder_size and start_pressure when known; omitted ones default (an AL80, 11.1 L at 3000 psi) and the result marks them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cylinder_size": {
                      "description": "12 = one 12 L cylinder (metric). 77.4 = an AL80 in ft³ (imperial, with rated_pressure 3000). Metric: water volume of ONE cylinder in litres, the number stamped on the neck, 1 to 25.5. Imperial: rated capacity in ft³ from the spec sheet (an AL80 holds less than its name), 1 to 400. Or pass preset. Default with neither: an AL80 (11.1 L, 77.4 ft³ at 3000 psi).",
                      "maximum": 400,
                      "minimum": 0,
                      "type": "number"
