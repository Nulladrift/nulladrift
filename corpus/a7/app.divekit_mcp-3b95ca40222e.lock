      "serverInfo": {
        "name": "divekit-mcp",
        "title": "Dive Kit",
        "version": "0.5.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Experimental. Dive Kit: a Bühlmann ZH-L16C deco planner with gradient factors, gas blending, breathing-rate, gas-usage and weighting calculators, vetted references, cylinders and certifications. Numbers come from tool results. Cite lookup_references for theory and practice answers. With every plan, state the parameters (depth, time, gases, cylinders and fills, gradient factors, reserve) and any assumption. Relay each result's safety_notice with every plan, mix or fill; never call a result safe, verified or guaranteed. For trained divers only: say so if the user does not seem trained for the dive or gas work. You can misreport numbers: tell the user to check the plan in the Dive Kit app or a second source. Not a dive computer or medical advice. get_guide('start_here') opens the guide.",
      "tools": [
        {
          "name": "best_mix",
          "title": "Best mix and deco gases for a depth",
          "description": "Use this when the diver asks what gas to breathe at a depth or which deco gases to carry: returns the richest bottom mix within a PPO₂ limit (default 1.4 bar) and an END limit (default 30 m, 98 ft), the nearest standard fill inside the same limits, and the standard deco gas ladder for that depth with switch depths. Not for checking one named gas (gas_specs) or planning the dive (plan_dive).\n\nThe ladder is the common choice, not a prescription: none to 30 m, EANx50 to 45 m, EANx50 and oxygen to 60 m, and a travel gas deeper. A bottom mix under 18% O₂ needs descent_gas in plan_dive. No engine call.\n\nExample: {\"depth\":50}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "altitude": {
                "description": "Surface altitude (m or ft, per units), 0 to 10000 m (32800 ft). Default 0.",
                "maximum": 32800,
                "minimum": 0,
                "type": "number"
              },
              "depth": {
                "description": "Target (maximum) depth in m (metric) or ft (imperial). Required.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "ppo2_max": {
                "description": "PPO₂ limit in bar at the target depth, 1.0 to 1.6. Default 1.4, a working bottom-gas limit.",
                "maximum": 1.6,
                "minimum": 1,
                "type": "number"
              },
              "style": {
                "description": "auto (default): nitrox when it meets target_end, else trimix. nitrox: no helium, END reported but not enforced. trimix: the standard fill comes from the trimix list.",
                "enum": ["auto", "nitrox", "trimix"],
                "type": "string"
              },
              "target_end": {
                "description": "Deepest equivalent narcotic depth (END) allowed at depth, in m or ft. Helium is added to meet it. Default 30 m (98 ft).",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "temperature": {
                "description": "Water temperature for gas density, in °C (metric, -2 to 40) or °F (imperial, 28 to 104). Default 15 °C.",
                "maximum": 104,
                "minimum": -2,
                "type": "number"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "water": {
                "description": "Water type, from its density: en13319 (EN 13319, the dive computer standard) 10.00 m per bar, salt 9.95, fresh 10.20, red_sea 9.92. Default en13319.",
                "enum": ["salt", "fresh", "en13319", "red_sea"],
                "type": "string"
              }
            },
            "required": ["depth"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "best_mix": {
                "additionalProperties": false,
                "description": "Richest mix: O₂ floored to a whole percent, He rounded up to 0.1 (0 for nitrox).",
                "properties": {
                  "density_g_l": {
                    "description": "Gas density at the target depth, g/L to 0.1, at temperature (default 15 °C).",
                    "type": "number"
                  },
                  "end": {
                    "description": "END at the target depth.",
                    "type": "number"
                  },
                  "helium_pct": {
                    "description": "He %.",
                    "type": "number"
                  },
                  "helium_pct_for_density_limit": {
                    "description": "Only when density is over 5.2 g/L: the total helium % (O₂ unchanged) that brings it to 5.2 g/L at the target depth. null when under 5.2, or when no helium fraction can.",
                    "type": ["number", "null"]
                  },
                  "mod": {
                    "description": "MOD at cap_used_bar, whole m or ft, floored.",
                    "type": "number"
                  },
                  "oxygen_pct": {
                    "description": "O₂ %.",
                    "type": "number"
                  }
                },
                "required": ["density_g_l", "end", "helium_pct", "helium_pct_for_density_limit", "mod", "oxygen_pct"],
                "type": "object"
              },
              "cap_used_bar": {
                "description": "PPO₂ limit used.",
                "type": "number"
              },
              "deco_ladder": {
                "description": "Standard travel and deco gases for this depth; empty to 30 m (100 ft).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "helium_pct": {
                      "type": "number"
                    },
                    "oxygen_pct": {
                      "type": "number"
                    },
                    "role": {
                      "enum": ["travel", "deco", "oxygen"],
                      "type": "string"
                    },
                    "switch_depth": {
                      "description": "travel: where to switch to the bottom mix on the descent. deco and oxygen: where to switch on the ascent.",
                      "type": "number"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "required": ["helium_pct", "oxygen_pct", "role", "switch_depth", "why"],
                  "type": "object"
                },
                "type": "array"
              },
              "depth": {
                "description": "Target depth, as given.",
                "type": "number"
              },
              "safety_notice": {
                "type": "string"
              },
              "spoken_summary": {
                "description": "A few plain sentences for a voice reply, ending with an offer: digits allowed, no symbols or notation.",
                "type": "string"
              },
              "standard_mix": {
                "additionalProperties": false,
                "description": "Nearest standard fill (air, EANx28 to EANx50, 25/25 to 10/70) within the same PPO₂ and END limits at this depth.",
                "properties": {
                  "density_g_l": {
                    "description": "Gas density at the target depth, g/L to 0.1, at temperature (default 15 °C).",
                    "type": "number"
                  },
                  "end": {
                    "description": "END at the target depth.",
                    "type": "number"
                  },
                  "helium_pct": {
                    "description": "He %.",
                    "type": "number"
                  },
                  "helium_pct_for_density_limit": {
                    "description": "Only when density is over 5.2 g/L: the total helium % (O₂ unchanged) that brings it to 5.2 g/L at the target depth. null when under 5.2, or when no helium fraction can.",
                    "type": ["number", "null"]
                  },
                  "mod": {
                    "description": "MOD at cap_used_bar, whole m or ft, floored.",
                    "type": "number"
                  },
                  "oxygen_pct": {
                    "description": "O₂ %.",
                    "type": "number"
                  }
                },
                "required": ["density_g_l", "end", "helium_pct", "helium_pct_for_density_limit", "mod", "oxygen_pct"],
                "type": "object"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["best_mix", "cap_used_bar", "deco_ladder", "depth", "safety_notice", "spoken_summary", "units"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best mix and deco gases for a depth"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:47d49ce3a7192d51a669d644e1fa7951e408c93e963b8a5ac7acd2f7744ec2a3"
