                "description": "The link carries a repetitive dive's starting tissue loading.",
                "type": "boolean"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "plan_input": {
                "additionalProperties": false,
                "description": "The plan_dive input the link carries, in the requested units.",
