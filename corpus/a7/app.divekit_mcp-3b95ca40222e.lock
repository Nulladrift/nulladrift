        {
          "name": "plan_dive",
          "title": "Plan a decompression dive",
          "description": "Computes the decompression plan for one dive, open circuit (OC) or closed-circuit rebreather (CCR): stop table, runtime, time to surface (TTS), gas used per cylinder, ascent pressure, CNS/OTU, gas density, warnings, contingencies, CCR bailout and a Dive Kit share link. Defaults unless given: GF 50/80, reserve thirds, SAC 20/15 L/min, last stop 6 m (20 ft), EN 13319 water, sea level. Use this when a diver wants a deco schedule, the gas a planned dive needs, or a what-if comparison (deeper, longer, a lost gas, other gradient factors) on air, nitrox or trimix. Not for: MOD, END or other gas facts at one depth (gas_specs), a best mix (best_mix), the longest bottom time the gas allows (find_max_bottom_time), no-stop time (check_no_deco), or dive logging.\n\nComputed by Dive Kit's Bühlmann ZH-L16C engine. Results are an experimental planning aid: relay the safety_notice.\n\nplan_name labels it (\"45m 20min 21/35+EANx50\"); audience (beginner, recreational, technical) tunes wording. A cylinder takes a preset (al80, twin_12l, stage_11l …; lookup_cylinders finds others) or cylinder_size and start_pressure; missing ones default to an AL80 (11.1 L at 3000 psi, 206.84 bar). descent_gas names a travel gas for a hypoxic bottom mix. scenarios compares what-ifs in one call: deeper_3m, longer_3min, lost:<id>, gf:40/85, last_stop:3.\n\n`units` sets every depth, pressure, volume, rate and temperature: metric (m, bar, L) or imperial (ft, psi, ft³). PPO₂ is always bar, mixes %, times minutes.\n\nOmit any other field for its Dive Kit default; the result lists each default it applied. get_guide('inputs_reference') lists every field, get_guide('workflow') the planning conversation. Stateless: send the whole plan every call.\n\nExample: {\"plan_name\":\"45m 20min 21/35+EANx50\",\"levels\":[{\"depth\":45,\"bottom_time_min\":20}],\"cylinders\":[{\"id\":\"back\",\"oxygen_pct\":21,\"helium_pct\":35,\"preset\":\"twin_12l\",\"start_pressure\":220},{\"id\":\"deco\",\"oxygen_pct\":50,\"preset\":\"stage_11l\"}],\"scenarios\":[\"base\",\"gf:40/85\"]}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "Optional: who the answer is for, from the conversation. beginner: new to deco, plain words. recreational (default): some training. technical: trained deco or CCR diver, terms and tables. Shapes the wording only, never a number.",
                "enum": ["beginner", "recreational", "technical"],
                "type": "string"
              },
              "bailout": {
                "additionalProperties": false,
                "description": "ccr only: the bailout view.",
                "properties": {
                  "depth": {
                    "description": "For on_ascent: depth (m or ft) the diver leaves the loop on the final ascent.",
                    "maximum": 660,
                    "minimum": 0,
                    "type": "number"
                  },
                  "level_number": {
                    "description": "For after_level: the level (1-based) the diver bails at the end of.",
                    "maximum": 20,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "run_time_min": {
                    "description": "For at_run_time: minutes on the Run clock.",
                    "maximum": 1000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "view": {
                    "description": "ccr: which ascent the table shows. loop (default), end_of_profile, after_level, at_run_time, on_ascent. The worst-case bailout check runs on every view.",
                    "enum": ["loop", "end_of_profile", "after_level", "at_run_time", "on_ascent"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "behavior": {
                "additionalProperties": false,
                "description": "Profile and model switches.",
                "properties": {
                  "include_travel_in_level_time": {
                    "description": "true: level time includes the descent to it (dive-computer runtime style). Default false.",
                    "type": "boolean"
                  },
                  "o2_narcotic": {
                    "description": "Count oxygen in END. END and warnings only. Default false.",
                    "type": "boolean"
                  },
                  "stay_on_loop": {
                    "description": "ccr: true (default) keeps the whole ascent on the loop; false lets an OC deco gas take over where its PPO₂ is higher. Not carried in share links.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "ccr": {
                "additionalProperties": false,
                "description": "The rebreather (mode ccr only).",
                "properties": {
                  "descent_switch_depth": {
                    "description": "Depth (m or ft) where the descent setpoint hands over to bottom, first descent only. Default 18 m (60 ft).",
                    "maximum": 660,
                    "minimum": 0,
                    "type": "number"
                  },
                  "diluent_breathable_oc": {
                    "description": "true if the BOV or a regulator can breathe the onboard diluent open circuit. It then joins the bailout pool last. Default false.",
                    "type": "boolean"
                  },
                  "diluent_helium_pct": {
                    "description": "Onboard diluent helium percent. Default 0.",
                    "maximum": 95,
                    "minimum": 0,
                    "type": "number"
                  },
                  "diluent_oxygen_pct": {
                    "description": "Onboard diluent oxygen percent. Default 21.",
                    "maximum": 100,
                    "minimum": 5,
                    "type": "number"
                  },
                  "diluent_size": {
                    "description": "Diluent cylinder: litres (metric) or ft³ rated at 3000 psi (imperial). Default 3 L.",
                    "maximum": 400,
                    "minimum": 0,
                    "type": "number"
                  },
                  "diluent_start_pressure": {
                    "description": "Diluent cylinder fill (bar or psi). Default 232 bar (3365 psi).",
                    "maximum": 7252,
                    "minimum": 0,
                    "type": "number"
                  },
                  "loop_volume": {
                    "description": "Loop volume, litres in both unit systems, 2 to 15. Default 6.",
                    "maximum": 15,
                    "minimum": 2,
                    "type": "number"
                  },
                  "o2_size": {
                    "description": "Oxygen cylinder: litres (metric) or ft³ rated at 3000 psi (imperial). Default 3 L.",
                    "maximum": 400,
                    "minimum": 0,
                    "type": "number"
                  },
                  "o2_start_pressure": {
                    "description": "Oxygen cylinder fill (bar or psi). Default 232 bar (3365 psi).",
                    "maximum": 7252,
                    "minimum": 0,
                    "type": "number"
                  },
                  "setpoints": {
                    "additionalProperties": false,
                    "description": "Loop setpoints in bar.",
                    "properties": {
                      "bottom": {
                        "description": "Bottom setpoint in bar, the level default. Default 1.0.",
                        "maximum": 1.6,
                        "minimum": 0.4,
                        "type": "number"
                      },
                      "deco": {
                        "description": "Deco setpoint in bar, used where ccr_deco_schedule has no step. Default 1.4.",
                        "maximum": 1.6,
                        "minimum": 0.4,
                        "type": "number"
                      },
                      "descent": {
                        "description": "Descent setpoint in bar. Default 0.7.",
                        "maximum": 1.6,
                        "minimum": 0.4,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "ccr_deco_schedule": {
                "description": "ccr deco setpoint steps, up to 10. Default [40 m: 1.5, 23 m: 1.6]. Send [] for the single ccr.setpoints.deco.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "depth": {
                      "description": "Depth (m or ft): the step applies at this depth and shallower.",
                      "maximum": 660,
                      "minimum": 0,
                      "type": "number"
                    },
                    "setpoint": {
                      "description": "Setpoint in bar.",
                      "maximum": 1.6,
                      "minimum": 0.4,
                      "type": "number"
                    }
                  },
                  "required": ["depth", "setpoint"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "ccr_dilout_switches": {
                "description": "ccr: at each depth and shallower, the loop breathes that cylinder as diluent (a dilout). Up to 6. Default none.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cylinder": {
                      "description": "Cylinder id breathed as diluent, or \"onboard\" to switch back.",
                      "maxLength": 12,
                      "type": "string"
                    },
                    "depth": {
                      "description": "Depth (m or ft): the switch applies at this depth and shallower.",
                      "maximum": 660,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["cylinder", "depth"],
                  "type": "object"
                },
                "maxItems": 6,
                "type": "array"
              },
              "contingencies": {
                "description": "Custom contingencies, up to 6, each requested with scenarios \"custom:<name>\" (or \"all\").",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "deco_sac": {
                      "description": "Deco SAC for this contingency only (L/min or ft³/min, per units). Default gas_consumption.deco_sac.",
                      "maximum": 200,
                      "minimum": 0,
                      "type": "number"
                    },
                    "delay_min": {
                      "description": "A hold at depth before the ascent starts, 0 to 60 minutes. Moves the schedule. Default 0.",
                      "maximum": 60,
                      "minimum": 0,
                      "type": "number"
                    },
                    "depth_change": {
                      "description": "Depth added to that level (m or ft, per units), -30 to 30 m (-100 to 100 ft). Default 0.",
                      "maximum": 100,
                      "minimum": -100,
                      "type": "number"
                    },
                    "fails_after_level": {
                      "description": "Level number (1-based) after which the lost cylinders are gone. Omit: they are never carried.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "level_number": {
                      "description": "Level number (1-based) the depth and time changes apply to. Default the deepest (last on a tie).",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "lost_cylinders": {
                      "description": "Cylinder ids lost in this contingency, comma-separated, e.g. \"s50,o2\". Default none.",
                      "maxLength": 130,
                      "type": "string"
                    },
                    "name": {
                      "description": "Name of this contingency, 1 to 24 characters. Request it with scenarios \"custom:<name>\". Unique.",
                      "maxLength": 24,
                      "minLength": 1,
                      "type": "string"
                    },
                    "stress_minutes": {
                      "description": "Minutes the stress_sac burst lasts, 1 to 60.",
                      "maximum": 60,
                      "minimum": 1,
                      "type": "number"
                    },
                    "stress_sac": {
                      "description": "Hard-breathing surface rate, SAC (L/min or ft³/min, per units), from the end of the bottom (on bailout: from leaving the loop), gas only. Needs stress_minutes, stress_until_gas_switch or stress_whole_ascent.",
                      "maximum": 200,
                      "minimum": 0,
                      "type": "number"
                    },
                    "stress_until_gas_switch": {
                      "description": "true: the stress_sac burst lasts until the next gas switch (the surface if none). Wins over stress_minutes and stress_whole_ascent.",
                      "type": "boolean"
                    },
                    "stress_whole_ascent": {
                      "description": "true: the stress_sac burst lasts to the surface. Default false.",
                      "type": "boolean"
