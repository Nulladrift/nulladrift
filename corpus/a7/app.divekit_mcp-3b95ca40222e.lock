                      "minimum": 0,
                      "type": "number"
                    },
                    "id": {
                      "description": "Short name used by levels and contingencies, 1 to 12 letters, digits, _ or -, e.g. back, s50, o2. Unique.",
                      "maxLength": 12,
                      "minLength": 1,
                      "type": "string"
                    },
                    "oxygen_pct": {
                      "description": "Oxygen percent, 5 to 100. Air is 21, EANx50 is 50, trimix 18/45 is 18.",
                      "maximum": 100,
                      "minimum": 5,
                      "type": "number"
                    },
                    "preset": {
                      "description": "A common cylinder instead of cylinder_size, rated_pressure, twinset and the fill (explicit fields win). al80/s80: aluminium 80, 11.1 L, 3000 psi. al40, al63: aluminium 40/63, 3000 psi. hp80, hp100, hp120: US high-pressure steel, 3442 psi. lp85: US low-pressure steel, 2640 psi. single_10l, single_12l, single_15l: one EU steel cylinder at 232 bar. twin_10l, twin_12l, twin_15l: back-mounted doubles, 232 bar each. stage_11l: aluminium stage (AL80 size), 200 bar. stage_7l: 7 L stage, 200 bar. o2_3l, dil_3l: 3 L rebreather cylinder, 232 bar.",
                      "enum": ["al80", "al40", "al63", "hp80", "hp100", "hp120", "lp85", "s80", "single_10l", "single_12l", "single_15l", "twin_10l", "twin_12l", "twin_15l", "stage_11l", "stage_7l", "o2_3l", "dil_3l"],
                      "type": "string"
                    },
                    "rated_pressure": {
                      "description": "Imperial only: the working pressure the capacity is rated at, psi, 725 to 7252 (3000 for an AL80). Default: the preset's, else 3000. Ignored on metric.",
                      "maximum": 7252,
                      "minimum": 0,
                      "type": "number"
                    },
                    "reserve_pressure": {
