                    "description": "Optional: who the answer is for, from the conversation. beginner: new to deco, plain words. recreational (default): some training. technical: trained deco or CCR diver, terms and tables. Shapes the wording only, never a number.",
                    "enum": ["beginner", "recreational", "technical"],
                    "type": "string"
                  },
                  "bailout": {
                    "additionalProperties": false,
                    "description": "ccr only: the bailout view.",
                    "properties": {
                      "depth": {
                        "description": "For on_ascent: depth (m or ft) the diver leaves the loop on the final ascent.",
