        {
          "name": "gas_specs",
          "title": "Gas specs at depth",
          "description": "Returns the facts for one breathing gas: maximum operating depth (MOD) at its Dive Kit PPO₂ band cap and at 1.4 bar, minimum depth for hypoxic mixes and, at a depth, PPO₂, equivalent narcotic depth (END), equivalent air depth (EAD) and gas density. Use this when the diver asks whether a gas is OK at a depth, its MOD, END, EAD or density. Not for planning a dive (plan_dive) or picking a gas (best_mix).\n\nMixes are O₂ % and He %; depth follows units. The band cap is 1.4 bar under 28% O₂, 1.5 to under 45%, 1.6 at 45% and over, unless ppo2_max is given. No engine call.\n\nExample: {\"oxygen_pct\":32,\"depth\":35}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "altitude": {
                "description": "Surface altitude (m or ft, per units), 0 to 10000 m (32800 ft). Lowers the surface pressure depths are measured from. Default 0.",
                "maximum": 32800,
                "minimum": 0,
                "type": "number"
              },
              "depth": {
                "description": "Depth in m (metric) or ft (imperial) where to report PPO₂, END, EAD and gas density. Omit for MOD and minimum depth only.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "helium_pct": {
                "description": "Helium percentage of the mix, 0 to 95. Default 0 (nitrox or air).",
                "maximum": 95,
                "minimum": 0,
                "type": "number"
              },
              "o2_narcotic": {
                "description": "Count oxygen as narcotic in the END. Default false (Dive Kit default).",
                "type": "boolean"
              },
              "oxygen_pct": {
                "description": "Oxygen percentage of the mix, 5 to 100. Example: 32 for EANx32, 18 for 18/45. Required.",
                "maximum": 100,
                "minimum": 5,
                "type": "number"
              },
              "ppo2_max": {
                "description": "PPO₂ limit in bar for the MOD, 1.0 to 1.6. Default: the Dive Kit band cap for the mix (1.4 under 28% O₂, 1.5 to under 45%, 1.6 at 45% and over). The MOD at 1.4 bar is always shown too.",
                "maximum": 1.6,
                "minimum": 1,
                "type": "number"
              },
              "temperature": {
                "description": "Water temperature for gas density, in °C (metric, -2 to 40) or °F (imperial, 28 to 104). Default 15 °C.",
                "maximum": 104,
                "minimum": -2,
                "type": "number"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "water": {
                "description": "Water type, from its density: en13319 (EN 13319, the dive computer standard) 10.00 m per bar, salt 9.95, fresh 10.20, red_sea 9.92. Default en13319.",
                "enum": ["salt", "fresh", "en13319", "red_sea"],
                "type": "string"
              }
            },
            "required": ["oxygen_pct"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "at_depth": {
                "additionalProperties": false,
                "properties": {
                  "density_g_l": {
                    "description": "Gas density in g/L.",
                    "type": "number"
                  },
                  "ead": {
                    "description": "Equivalent air depth (nitrox only).",
                    "type": "number"
                  },
                  "end": {
                    "description": "Equivalent narcotic depth.",
                    "type": "number"
                  },
                  "ppo2": {
                    "description": "PPO₂ in bar.",
                    "type": "number"
                  }
                },
                "required": ["density_g_l", "end", "ppo2"],
                "type": "object"
              },
              "cap_used_bar": {
                "description": "PPO₂ limit the MOD uses.",
                "type": "number"
              },
              "caution": {
                "description": "The most important caution at depth, if any.",
                "type": "string"
              },
              "min_depth": {
                "description": "Shallowest depth where PPO₂ reaches 0.16 bar; 0 for normoxic mixes.",
                "type": "number"
              },
              "mod": {
                "description": "Maximum operating depth at cap_used_bar, floored to 0.1.",
                "type": "number"
              },
              "mod_1_4_bar": {
                "description": "MOD at 1.4 bar, the common working limit, when cap_used_bar is not 1.4.",
                "type": "number"
              },
              "nearest_standard_mix": {
                "description": "Nearest standard trimix by composition (closest O₂ and He), for helium mixes. Not checked against any depth limit.",
                "type": "string"
              },
              "notation": {
                "description": "Mix as O₂/He, e.g. 18/45.",
                "type": "string"
              },
              "safety_notice": {
                "type": "string"
              },
              "spoken_summary": {
                "description": "A few plain sentences for a voice reply, ending with an offer: digits allowed, no symbols or notation.",
                "type": "string"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["cap_used_bar", "min_depth", "mod", "notation", "safety_notice", "spoken_summary", "units"],
            "type": "object"
          },
