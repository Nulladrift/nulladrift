                      "maximum": 4351,
                      "minimum": 0,
                      "type": "number"
                    },
                    "start_pressure": {
                      "description": "Pressure in the cylinder at the start of the dive (bar or psi, per units), 0 to 500 bar (0 to 7252 psi). Default: the preset's fill, else 206.84 bar (3000 psi).",
                      "maximum": 7252,
                      "minimum": 0,
                      "type": "number"
                    },
                    "twinset": {
                      "description": "true for back-mounted doubles or a sidemount pair breathed as one supply: doubles the gas at the same pressure. Default: the preset's, else false.",
                      "type": "boolean"
