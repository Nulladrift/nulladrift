        {
          "name": "rmv_sac",
          "title": "Gas consumption rate from a dive",
          "description": "Returns the gas consumption rate computed from a logged dive's cylinder pressures: RMV (surface litres a minute, what plan_dive and gas_usage take) and SAC (pressure drop a minute on that cylinder), overall and per segment. Use this when a diver gives start and end pressures and asks their SAC, RMV or breathing rate. Give the cylinder's mix for trimix; air is assumed. Not for planning gas (gas_usage, plan_dive).\n\nEach segment is one stretch on one cylinder: depth, duration_min, start_pressure, end_pressure, the cylinder (preset, cylinder_size, rated_pressure, twinset; default AL80) and its mix (oxygen_pct, helium_pct; default air). RMV uses the same real-gas model as the planners: any RMV plans the same dive back to the measured end pressure in plan_dive, and an air RMV does in gas_usage, which assumes air (a trimix RMV reads about 1 to 2 bar optimistic there). SAC is the gauge drop over time and depth. Segments must not overlap in time; the tool cannot check that. sac is null when the segments used different cylinders, and sac_per_cylinder lists each, with the weighted average depth. plan_dive_gas_consumption.working_sac is ready to paste into plan_dive. water defaults to en13319. No engine call.\n\nExample: {\"segments\":[{\"depth\":20,\"duration_min\":20,\"start_pressure\":200,\"end_pressure\":140,\"preset\":\"single_12l\"}]}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "segments": {
                "description": "Stretches of the logged dive, each on one cylinder, not overlapping in time.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cylinder_size": {
                      "description": "Metric: water volume of ONE cylinder in litres, the number stamped on the neck. Imperial: rated capacity in ft³ at rated_pressure (an AL80 is 77.4). Default: the preset's, else an AL80 (11.1 L).",
                      "maximum": 400,
                      "minimum": 0.5,
                      "type": "number"
                    },
                    "depth": {
                      "description": "Average depth of this stretch (m or ft).",
                      "maximum": 1000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "duration_min": {
                      "description": "Minutes of this stretch, 0.1 to 600.",
                      "maximum": 600,
                      "minimum": 0.1,
                      "type": "number"
                    },
                    "end_pressure": {
                      "description": "Gauge reading at the end (bar or psi); lower than start_pressure.",
                      "maximum": 7252,
                      "minimum": 0,
                      "type": "number"
                    },
                    "helium_pct": {
                      "description": "Helium % of the gas in the cylinder. Default 0.",
                      "maximum": 95,
                      "minimum": 0,
                      "type": "number"
                    },
                    "oxygen_pct": {
                      "description": "Oxygen % of the gas in the cylinder. Default 21 (air). Give it with helium_pct for trimix.",
                      "maximum": 100,
                      "minimum": 5,
                      "type": "number"
                    },
                    "preset": {
                      "description": "A common cylinder instead of cylinder_size, as in plan_dive: al80, al40, al63, hp80, hp100, hp120, lp85, s80, single_10l, single_12l, single_15l, twin_10l, twin_12l, twin_15l, stage_11l, stage_7l, o2_3l, dil_3l. twin_ presets are a manifolded pair.",
                      "enum": ["al80", "al40", "al63", "hp80", "hp100", "hp120", "lp85", "s80", "single_10l", "single_12l", "single_15l", "twin_10l", "twin_12l", "twin_15l", "stage_11l", "stage_7l", "o2_3l", "dil_3l"],
                      "type": "string"
                    },
                    "rated_pressure": {
                      "description": "Imperial only: the psi the capacity is rated at. Default: the preset's, else 3000. Ignored on metric.",
                      "maximum": 7252,
                      "minimum": 725,
                      "type": "number"
                    },
                    "start_pressure": {
                      "description": "Gauge reading at the start of the stretch (bar or psi, per units).",
                      "maximum": 7252,
                      "minimum": 1,
                      "type": "number"
                    },
                    "twinset": {
                      "description": "true for two cylinders on a manifold, filled or breathed together: doubles the volume. Default: the preset's, else false.",
                      "type": "boolean"
                    }
                  },
                  "required": ["depth", "duration_min", "end_pressure", "start_pressure"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "water": {
                "description": "Water type, from its density: en13319 (EN 13319, the dive computer standard) 10.00 m per bar, salt 9.95, fresh 10.20, red_sea 9.92. Default en13319.",
                "enum": ["salt", "fresh", "en13319", "red_sea"],
                "type": "string"
              }
            },
            "required": ["segments"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "plan_dive_gas_consumption": {
                "additionalProperties": false,
                "description": "Ready for plan_dive gas_consumption.",
                "properties": {
                  "working_sac": {
                    "type": "number"
                  }
                },
                "required": ["working_sac"],
                "type": "object"
              },
              "rmv": {
                "description": "Surface litres a minute (ft³/min imperial), load-weighted: the figure gas_usage sac and plan_dive working_sac take.",
                "type": "number"
              },
              "sac": {
                "description": "Pressure drop a minute (bar/min or psi/min) on the one cylinder every segment used; null when they used different cylinders.",
                "type": ["number", "null"]
              },
              "sac_per_cylinder": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cylinder": {
                      "type": "string"
                    },
                    "rmv": {
                      "type": "number"
                    },
                    "sac": {
                      "type": "number"
                    }
                  },
                  "required": ["cylinder", "rmv", "sac"],
                  "type": "object"
                },
                "type": "array"
              },
              "safety_notice": {
                "type": "string"
              },
              "segments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ambient_ata": {
                      "type": "number"
                    },
                    "depth": {
                      "type": "number"
                    },
                    "duration_min": {
                      "type": "number"
                    },
                    "gas_used_volume": {
                      "type": "number"
                    },
                    "rmv": {
                      "type": "number"
                    },
                    "sac": {
                      "type": "number"
                    }
                  },
                  "required": ["ambient_ata", "depth", "duration_min", "gas_used_volume", "rmv", "sac"],
                  "type": "object"
                },
                "type": "array"
              },
              "spoken_summary": {
                "description": "A few plain sentences for a voice reply, ending with an offer: digits allowed, no symbols or notation.",
                "type": "string"
              },
              "total_gas_volume": {
                "type": "number"
              },
              "total_time_min": {
                "type": "number"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "weighted_avg_ata": {
                "type": "number"
              },
              "weighted_avg_depth": {
                "type": "number"
              }
            },
            "required": ["assumptions", "plan_dive_gas_consumption", "rmv", "sac", "sac_per_cylinder", "safety_notice", "segments", "spoken_summary", "total_gas_volume", "total_time_min", "units", "weighted_avg_ata", "weighted_avg_depth"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gas consumption rate from a dive"
          },
