                  "deco_sac": {
                    "description": "Deco SAC override for the whole plan (L/min or ft³/min). Default gas_consumption.deco_sac.",
                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  },
                  "delay_min": {
                    "description": "A hold at depth before the ascent starts, 0 to 60 minutes. Moves the schedule. Default 0.",
                    "maximum": 60,
                    "minimum": 0,
                    "type": "number"
