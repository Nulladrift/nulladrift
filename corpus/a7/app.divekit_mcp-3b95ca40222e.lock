        {
          "name": "lookup_references",
          "title": "Look up references",
          "description": "Returns vetted references from Dive Kit's open references dataset, with links. Use this when a diver asks for a source. Call it before answering any question about deco theory, physiology, gas limits, blending practice, standards or training, so the answer names its source. Not for calculations. If nothing matches, the result lists where to search next; say that source is not Dive Kit-vetted.\n\nEach reference gives title, authors, year, type, publisher, link or DOI, access, and what it is authoritative for (gradient factors, oxygen toxicity, gas density, blending and oxygen cleaning, real gas, buoyancy, gas management, training). Not for cylinders (lookup_cylinders) or courses (lookup_certifications).\n\ntopic narrows by subject and type by kind of source; the enums are in the input schema. query matches every word against the title, authors, publisher, notes and what the source is authoritative for. This is Dive Kit's own curated data (MIT licence, open.divekit.app), not a web search. No engine call.\n\nExample: {\"topic\":\"gradient_factors\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most references to return, 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text; every word must match the title, authors, publisher, notes or what the source is authoritative for, e.g. \"baker m-values\", \"oxygen cleaning\", \"neoprene\". Accents are ignored.",
                "maxLength": 100,
                "type": "string"
              },
              "topic": {
                "description": "Subject: deco_theory, gradient_factors, oxygen_toxicity, gas_density, icd, hpns, ccr, gas_selection, gas_planning, gas_blending, oxygen_handling, real_gas, cylinders, buoyancy, breathing_rate, conventions, training, emergencies, cross_checks, community.",
                "enum": ["deco_theory", "gradient_factors", "oxygen_toxicity", "gas_density", "icd", "hpns", "ccr", "gas_selection", "gas_planning", "gas_blending", "oxygen_handling", "real_gas", "cylinders", "buoyancy", "breathing_rate", "conventions", "training", "emergencies", "cross_checks", "community"],
                "type": "string"
              },
              "type": {
                "description": "Kind of source: paper, book, standard, manual, article, blog, thread, dataset, website, talk, software, video, podcast, course_material, report.",
                "enum": ["paper", "book", "standard", "manual", "article", "blog", "thread", "dataset", "website", "talk", "software", "video", "podcast", "course_material", "report"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "description": "Credit line (MIT licence); keep it with any figures you quote.",
                "type": "string"
              },
              "dataset_version": {
                "description": "Dataset release tag.",
                "type": "string"
              },
              "references": {
                "description": "Matching records (id, title, authors, year, type, publisher, url, doi, access, topics, authoritative_for, notes, checked_at).",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "search_next": {
                "description": "Only when nothing matched: where to search next, in order. Anything found there is not Dive Kit-vetted; say so.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "how_to_search": {
                      "description": "How to search it, e.g. \"site:dan.org <question>\".",
