        {
          "name": "mix_result",
          "title": "Mix after a fill",
          "description": "Returns the mix and pressure a cylinder ends with after gases are added in order: each addition's pressure and mix before and after, the cooling step, and the final O₂ %, He % and pressure. Use this when a diver or blender asks what a fill produced (\"50 bar of air, 40 bar of oxygen, then air to 200\"), or to check a plan_blend plan: send its mix_result_current as current and its mix_result_additions as additions. Not for planning toward a target (plan_blend) or joining two cylinders with a whip (decant).\n\nPressures are gauge (bar or psi, per units); mixes are O₂ % and He %. environment sets altitude and the ambient and fill temperatures (defaults sea level, 20 °C, fill equal to ambient); a hot fill settles lower. Real-gas mixing. Analyse the cylinder once it has cooled: the analysed mix, not this one, goes into plan_dive. No engine call.\n\nExample: {\"current\":{\"oxygen_pct\":21,\"pressure\":50},\"additions\":[{\"oxygen_pct\":100,\"pressure_added\":35},{\"oxygen_pct\":21,\"pressure_added\":115}]}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "additions": {
                "description": "Gases added, in order. plan_blend gives them as mix_result_additions.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "helium_pct": {
                      "description": "Helium % of the gas added: 100 for helium. Default 0.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "oxygen_pct": {
                      "description": "Oxygen % of the gas added: 100 oxygen, 21 air, 0 helium, 32 a nitrox bank.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "pressure_added": {
                      "description": "Gauge pressure this gas adds (bar or psi, per units): the cylinder gauge after minus before.",
                      "maximum": 7252,
                      "minimum": 0.1,
                      "type": "number"
                    }
                  },
                  "required": ["oxygen_pct", "pressure_added"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "current": {
                "additionalProperties": false,
                "description": "The cylinder before gas goes in. plan_blend gives it as mix_result_current.",
                "properties": {
                  "helium_pct": {
                    "description": "Helium % before the first addition. Default 0.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "oxygen_pct": {
                    "description": "Oxygen % in the cylinder before the first addition, as analysed. Air is 21.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "pressure": {
                    "description": "Gauge pressure before the first addition (bar or psi, per units); 0 for empty.",
                    "maximum": 7252,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["oxygen_pct", "pressure"],
                "type": "object"
              },
              "environment": {
                "additionalProperties": false,
                "description": "Altitude and temperatures. Default sea level, 20 °C, fill at ambient.",
                "properties": {
                  "altitude": {
                    "description": "Altitude (m or ft, per units), 0 to 10000 m (32800 ft). Lowers the surface pressure the math adds to gauge readings. Default 0.",
                    "maximum": 32800,
                    "minimum": 0,
                    "type": "number"
                  },
                  "ambient_temperature": {
                    "description": "Temperature the cylinder cools to (°C or °F, per units), -50 to 100 °C. Default 20 °C (68 °F).",
                    "maximum": 212,
                    "minimum": -58,
                    "type": "number"
                  },
                  "fill_temperature": {
                    "description": "Gas temperature right after filling (°C or °F). Above ambient, the plan fills to a hot pressure that settles to the target. Default: ambient.",
                    "maximum": 212,
                    "minimum": -58,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["additions", "current"],
            "type": "object"
          },
