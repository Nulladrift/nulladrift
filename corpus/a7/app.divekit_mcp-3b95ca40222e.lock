        {
          "name": "find_max_bottom_time",
          "title": "Find the longest bottom time",
          "description": "Finds the longest whole-minute bottom time on one level of an open-circuit plan: the longest that keeps every cylinder at or above its reserve (limit reserve), whose time to surface fits a budget (limit tts), or that needs no stop (limit no_deco). Use this when a diver asks how long they can stay at a depth before gas runs short, how long fits a TTS budget, or how long a level of a multi-level plan can last without stops. Not for CCR plans. For the no-stop time at one depth, check_no_deco is simpler.\n\nTakes the same fields as plan_dive, at the top level, plus the level to extend (default the deepest, last on a tie; the same level longer_3min lengthens). Cylinders as in plan_dive. On a level shallower than an earlier one the answer can be a window (\"from 7 min\"). The empty-cylinder setting is ignored: every cylinder is judged on its own reserve. The answer is a gas ceiling with no allowance for gas sharing, cold, current or work. Returns the answer, the plan table at that time and its Dive Kit share link.\n\nUnits and defaults as in plan_dive.\n\nExample: {\"plan_name\":\"45m on 21/35\",\"units\":\"metric\",\"levels\":[{\"depth\":45,\"bottom_time_min\":20}],\"cylinders\":[{\"id\":\"back\",\"oxygen_pct\":21,\"helium_pct\":35,\"preset\":\"twin_12l\",\"start_pressure\":220},{\"id\":\"deco\",\"oxygen_pct\":50,\"preset\":\"stage_11l\"}],\"limit\":\"reserve\",\"level_number\":1}",
