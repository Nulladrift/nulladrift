              },
              "cylinders": {
                "description": "Matching dataset records (id, commonName, waterVolumeL, workingPressureBar, material, typicalUse, emptyWeightKg, buoyancyKg, brands, notes, ratedCapacityCuft), each with plan_dive: the plan_dive cylinder fields for it.",
                "items": {
                  "additionalProperties": {},
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "dataset_version": {
                "description": "Dataset release tag.",
                "type": "string"
              }
            },
            "required": ["attribution", "cylinders", "dataset_version"],
