                    "maximum": 200,
                    "minimum": 0,
                    "type": "number"
                  },
                  "stress_until_gas_switch": {
                    "description": "true: the stress_sac burst lasts until the next gas switch (the surface if none). Wins over stress_minutes and stress_whole_ascent.",
