        {
          "name": "lookup_cylinders",
          "title": "Look up scuba cylinders",
          "description": "Returns scuba cylinders from Dive Kit's vetted open cylinder dataset: water volume, rated capacity, working pressure, material, typical use and, for five or fewer matches, weight, buoyancy and brands. Each row gives the plan_dive cylinder fields (a preset or cylinder_size) that describe it. Use this when a diver asks which cylinder something is, what it holds (\"what's an HP100 in litres\", \"what does an AL80 hold\"), or names a cylinder you need to size for plan_dive. Not for gas mixes (gas_specs) or gas used on a dive (plan_dive).\n\nThis is Dive Kit's own curated data (MIT licence, open.divekit.app), not a web search. No engine call.\n\nExample: {\"query\":\"hp100\",\"units\":\"imperial\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "material": {
                "description": "aluminum or steel. Omit for both.",
                "enum": ["aluminum", "steel"],
                "type": "string"
              },
              "query": {
                "description": "Free text: a name, brand or use, e.g. \"hp100\", \"al80\", \"luxfer\", \"sidemount\". A number matches the water volume in L, the rated ft³, the working pressure in bar or the number in the name: \"12\" finds 12 L cylinders, \"80\" finds the AL80 and HP80. Every word must match. Omit for every cylinder.",
                "maxLength": 100,
                "type": "string"
              },
              "units": {
                "description": "metric (m, bar, L, °C) or imperial (ft, psi, ft³, °F): the unit system for every value in and out. Default metric.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
