{
  "lockfileVersion": 2,
  "subjects": {
    "app.robohub/robohub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://robohub.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "robohub",
        "title": "RoboHub Robot Catalog",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RoboHub (robohub.app) is a vendor-neutral global robot catalog and B2B sourcing service.\nUse search_robots / get_robot / compare_robots to explore commercial robots (humanoids, quadrupeds, industrial arms, drones, agricultural, medical, home, educational) with specs, verified manufacturer list prices (MSRP) where published, with their date and source; other robots are quote-only or have no public price (see price_provenance) and manufacturer info.\nWhen a user wants to actually buy or deploy robots for their business, call request_vendor_intros to record a sourcing request for RoboHub's team to review by hand. RoboHub is vendor-neutral and free for buyers.\nRequests recorded through this MCP server are unverified: RoboHub sends the buyer no confirmation email and promises no reply window, so only call the tool with the user's real details and tell them to confirm from their own mailbox.",
      "tools": [
        {
          "name": "compare_robots",
          "title": "Compare two robots",
          "description": "Side-by-side spec comparison of two robots by slug, plus RoboHub's editorial verdict when available.",
          "inputSchema": {
            "properties": {
              "slug_a": {
                "description": "First robot slug.",
                "type": "string"
              },
              "slug_b": {
                "description": "Second robot slug.",
                "type": "string"
              }
            },
            "required": ["slug_a", "slug_b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:15d934ec7e4f4e26f252bb210bc162309ad7e1d6a788467c77dfdcac0fb1aaa9"
        },
        {
          "name": "get_robot",
          "title": "Get robot details",
          "description": "Full catalog record for one robot by slug: description, specs, SDKs, use cases, verified manufacturer list prices (MSRP) where published, with their date and source; other robots are quote-only or have no public price (see price_provenance) and links.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Robot slug as returned by search_robots (e.g. 'unitree-g1').",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ea7ed7e1ed3cf45f225427c3b32c6a0fb45d958c7fe2e2e017073d5d18da5fb"
        },
        {
          "name": "list_categories",
          "title": "List robot categories",
          "description": "All robot categories with counts and a few example robots each. Good first call to understand catalog coverage.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe6808decd0a51e93c69b5ec23d76635585cfcf7e5cc88e5207c8fffafb4cd6d"
        },
        {
          "name": "request_vendor_intros",
          "title": "Request vendor introductions",
          "description": "Record a B2B sourcing request with RoboHub on behalf of the user, for manual review by RoboHub's team. Vendor-neutral and free for buyers. Requests from this server are unverified, so RoboHub sends the buyer no confirmation email and guarantees no reply window. Only call this with the user's explicit consent and their real contact details; submissions are rate limited per client and fabricated requests are discarded.",
          "inputSchema": {
            "properties": {
              "budget_range": {
                "description": "Approximate budget bracket in USD.",
                "enum": ["under-25k", "25-100k", "100-500k", "500k-2m", "above-2m", "exploring"],
                "type": "string"
              },
              "company": {
                "description": "Company name.",
                "type": "string"
              },
              "contact_name": {
                "description": "Full name of the contact person.",
                "type": "string"
              },
              "country": {
                "description": "Country of deployment (optional).",
                "type": "string"
              },
              "email": {
                "description": "Work email address where the shortlist should be sent.",
                "type": "string"
              },
              "industry": {
                "description": "Closest industry bucket for the deployment.",
                "enum": ["manufacturing", "warehouse", "healthcare", "agriculture", "security", "hospitality", "construction", "energy", "research", "other"],
                "type": "string"
              },
              "notes": {
                "description": "Anything else relevant (optional).",
                "type": "string"
              },
              "robot_slug": {
                "description": "Slug of a specific robot the user is interested in (optional).",
                "type": "string"
              },
              "timeline": {
                "description": "Deployment timeline.",
                "enum": ["immediate", "3-months", "6-months", "12-months", "exploring"],
                "type": "string"
              },
              "use_case": {
                "description": "What the robots should do, with as much operational detail as possible (environment, scale, constraints).",
                "type": "string"
              }
            },
            "required": ["budget_range", "company", "contact_name", "email", "industry", "timeline", "use_case"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb37a119abe196331e7f0e629fa7e2472c74cb4b502da2846cf76c98cbbaf3e9"
        },
        {
          "name": "search_robots",
          "title": "Search robots",
          "description": "Search RoboHub's catalog of commercial robots by free-text query and optional filters. Returns compact summaries with catalog URLs. When max_price_usd is set: Only robots with a verified manufacturer list price (MSRP) at or below this USD amount; estimates and quote-only robots are excluded.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Restrict to one category.",
                "enum": ["humanoid", "quadruped", "industrial", "drone", "home", "educational", "agricultural", "medical"],
                "type": "string"
              },
              "limit": {
                "description": "Max results to return (default 10, max 25).",
                "type": "number"
              },
              "max_price_usd": {
                "description": "Only robots with a verified manufacturer list price (MSRP) at or below this USD amount; estimates and quote-only robots are excluded",
                "type": "number"
              },
              "query": {
                "description": "Free-text search over name, manufacturer, category, use cases and description (e.g. 'warehouse pallet AMR', 'quadruped inspection').",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eab8a70c2744692ae981ca5c2e7fdf92c5d012572ea4ad909412e82fc4718da5"
        }
      ],
      "digest": "sha256:180201b817783f4b421934f30a51ce082567476b7ce451e75a4cded936f2aa17"
    }
  }
}
