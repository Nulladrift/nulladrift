      "serverInfo": {
        "name": "acorn-harness",
        "title": "Acorn Harness",
        "version": "1.1.0",
        "description": "Configure, price and order custom XT30, XT30(2+2) and XT30 + JST GH wire harnesses.",
        "websiteUrl": "https://acornharness.com/developers",
        "icons": [
          {
            "src": "https://acornharness.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://acornharness.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Acorn Harness (https://acornharness.com) builds custom XT30, XT30(2+2) and XT30 + JST GH wire harnesses to order. They are Assembled in the USA, 100% tested, and ship within 5 business days (US and 55 more countries).\n\nWorkflow:\n1. Collect every choice the acornharness.com configurator makes, for each design: connector, wire length, power wire gauge, end A (straight, right angle up or right angle down), end B (the same, or unterminated tinned leads), and quantity, plus the country it ships to (it sets the shipping price, and checkout only accepts an address there). Treat end A and end B as separate questions. Ask for everything the user hasn't said in one message, listing the options; don't fill gaps with defaults or guesses. If they ask you to choose, choose and say what you chose. A configurator link or design code from the user already has every choice. Call list_options if unsure of the allowed values.\n2. Call quote_harness with the design(s) and ship_to (the country code; omit only for the US) to get the exact price and shipping options, a picture of each design, and a configurator_url the user can open to review or tweak it. Show the picture. Tell the user about every entry in defaults_applied (wire colors, twisted or crossed signal pair, JST GH end B) so nothing is assumed silently.\n3. Confirm the design, quantity and price with the user, then call create_order. Give the user the returned checkout_url: they pay and enter the shipping address on acornharness.com. Nothing is charged or built until they pay there.\n4. Use get_order_status with the order id to check payment.\n\nNever ask for, accept or relay card numbers or other payment details; payment only happens on the checkout page. Prices exclude shipping (priced by weight and destination, chosen at checkout) and sales tax. Prices and shipping exclude import duties, taxes (VAT/GST) and carrier brokerage fees: for orders shipped outside the US, the buyer pays these to the carrier or customs on delivery. Made to order, so no returns; damaged or defective wire harnesses are repaired or replaced if reported to support@almond.bot within 14 days of delivery. Privacy policy: https://acornharness.com/privacy. Terms of service: https://acornharness.com/terms.",
      "tools": [
        {
          "name": "create_order",
          "title": "Create a wire harness order",
          "description": "Create an unpaid order for one or more wire harness designs and get a checkout_url on acornharness.com for the buyer. The buyer opens it to pay (card, Link or wallet, via Stripe) and enter the shipping address (in the ship_to country) and, in the US, the shipping speed (other countries have one service, International Tracked); nothing is charged or built until they pay there, and the link expires after 24 hours. Quote first with quote_harness and confirm the design, quantity and price with the user before calling this. Never ask for or accept card numbers or other payment details in the conversation. Items take the same fields as quote_harness and must be just as complete: pass back each quoted item's config (or design) once the user has confirmed it, and the same ship_to.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "Buyer's email, only if they gave it: prefills checkout; the receipt, invoice and tracking go there.",
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Any unique string. Retrying with the same key and the same items returns the same order instead of a second one.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "items": {
                "description": "1–40 wire harness designs. Volume discounts count every harness across all items.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "colors": {
                      "additionalProperties": false,
                      "description": "Optional; defaults red (+), black (−), green (signal 1), yellow (signal 2). Power wires are red or black; signal wires green or yellow. The result's defaults_applied lists any color left out: tell the user.",
                      "properties": {
                        "power_neg": {
                          "description": "Power − wire, red or black. Default black.",
                          "enum": ["red", "black"],
                          "type": "string"
                        },
                        "power_pos": {
                          "description": "Power + wire, red or black. Default red.",
                          "enum": ["red", "black"],
                          "type": "string"
                        },
                        "signal_1": {
                          "description": "Signal 1 (pin 1), green or yellow. Default green. Signal-pair connectors only.",
                          "enum": ["green", "yellow"],
                          "type": "string"
                        },
                        "signal_2": {
                          "description": "Signal 2 (pin 2), green or yellow. Default yellow. Signal-pair connectors only.",
                          "enum": ["green", "yellow"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "connector": {
                      "description": "Required: ask the user if they haven't said; never guess it. Connector family: \"xt30\" = XT30 (power only, 2 pins); \"xt30-22\" = XT30(2+2) (power + 2 signal pins); \"xt30-gh\" = XT30 + JST GH (power + signal on gh). The same on both ends, except that end B can be unterminated (end_b) or, on \"xt30-22\", move its signal pair to a JST GH plug (end_b_gh). Every plug is the female, cable-side part (XT30U-F / XT30(2+2)-F with gold contacts; JST GH GHR-02V-S housings), which mates with the male headers on batteries, ESCs, boards and actuators. There is no gender option.",
                      "enum": ["xt30", "xt30-22", "xt30-gh"],
                      "type": "string"
                    },
                    "design": {
                      "description": "A complete design code or configurator URL (e.g. \"https://acornharness.com/?k=22&l=350&g=16&a=st&b=ra-d&c=red.black.green.yellow&t=1&q=1\"), from a previous quote or pasted by the user. With it, no other field is required; any field given overrides it.",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "end_a": {
                      "description": "Required: ask the user if they haven't said; never guess it. How the wires leave end A's plug: \"straight\" = wires exit inline with the plug; \"ra-up\" = power wires bend 90° up, as drawn in the rear (wire side) view; \"ra-down\" = power wires bend 90° down, as drawn in the rear (wire side) view. In that rear view the power pins are on the left, the signal pins on the right. End A always has a plug. Ask about end A and end B separately: \"right angle on one end\" still leaves which way, and what the other end is.",
                      "enum": ["straight", "ra-up", "ra-down"],
                      "type": "string"
                    },
                    "end_b": {
                      "description": "Required: ask the user if they haven't said; never guess it. How the wires leave end B's plug: \"straight\" = wires exit inline with the plug; \"ra-up\" = power wires bend 90° up, as drawn in the rear (wire side) view; \"ra-down\" = power wires bend 90° down, as drawn in the rear (wire side) view; \"unterminated\" = no plug: wires stripped 6 mm and tinned, for screw terminals or soldering. In that rear view the power pins are on the left, the signal pins on the right. \"unterminated\" makes a pigtail. Ask about end A and end B separately: \"right angle on one end\" still leaves which way, and what the other end is.",
                      "enum": ["straight", "ra-up", "ra-down", "unterminated"],
                      "type": "string"
                    },
                    "end_b_gh": {
                      "description": "Optional, \"xt30-22\" only: end B's signal pair goes to its own JST GH 1.25 mm 2-pin plug, and end B's power to a 2-pin XT30 (or tinned leads if end_b is \"unterminated\"). End A keeps the XT30(2+2). Default false (end B is an XT30(2+2) like end A); ask if the user mentions JST GH.",
                      "type": "boolean"
                    },
                    "length_mm": {
                      "description": "Required: ask the user if they haven't said; never guess it. Wire length in mm, 30–3000, rounded to the nearest 5 mm. Wire only, measured between the rear faces of the plugs (to the wire tips on a pigtail). 1 in = 25.4 mm.",
                      "maximum": 3000,
                      "minimum": 30,
                      "type": "number"
                    },
                    "power_gauge": {
                      "description": "Required: ask the user if they haven't said; never guess it. Power wire gauge in AWG: 14 (up to ~30 A), 16 (up to ~22 A), 18 (up to ~16 A). Signal wire gauge is signal_gauge.",
                      "enum": [14, 16, 18],
                      "type": "number"
                    },
                    "quantity": {
                      "description": "Required: ask the user if they haven't said; never guess it. How many of this design, 1–5000. Volume discounts count every harness in the order.",
                      "maximum": 5000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "signal_gauge": {
                      "description": "Optional, \"xt30-22\" without end_b_gh only: signal wire gauge in AWG, 24 or 30. Default 24; 30 is thinner and more flexible. Any JST GH plug (\"xt30-gh\", or end_b_gh) is always 30 AWG, to fit the GH contacts. Ask if the user mentions signal wire size; tell the user if you rely on the default.",
                      "enum": [24, 30],
                      "type": "number"
                    },
                    "swap_signals": {
                      "description": "Optional, \"xt30-22\" and \"xt30-gh\" only: cross the signal pair, end A pin 1 to end B pin 2 and 2 to 1 (e.g. to swap CAN H/L). Needs signal pins on end B (a plug, or end_b_gh). Default false (straight through); tell the user if you rely on it.",
                      "type": "boolean"
                    },
                    "twisted": {
                      "description": "Optional, \"xt30-22\" and \"xt30-gh\" only: twist the signal pair (recommended for CAN). Default true; tell the user if you rely on it.",
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "reference": {
                "description": "Buyer's PO number or note, echoed back on the order.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "ship_to": {
                "description": "Two-letter ISO country code the order ships to, e.g. \"US\", \"CA\", \"GB\", \"DE\", \"JP\", \"AU\". Omitted = US. Ships to the US and 55 more countries; list_options has every country. Shipping is priced for it, and checkout only accepts an address there.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkout_url": {
                "description": "Where the buyer pays, on acornharness.com",
