        {
          "name": "quote_harness",
          "title": "Quote wire harnesses",
          "description": "Price one or more custom wire harness designs exactly as acornharness.com checkout will. Returns, for each design, a picture (side view plus both ends' rear views, as the configurator draws it: show it to the user), a configurator_url that opens the design on the site, and defaults_applied. Every item needs connector, length_mm, power_gauge, end_a, end_b, quantity, or a complete design code / configurator URL in design. Items missing any of them are refused with the questions to ask: ask the user, don't guess, and ask about end A and end B separately. Colors, twisting, crossing and end_b_gh have defaults, listed in defaults_applied for you to tell the user. Volume discounts count every harness across all items. Also returns the shipping options and prices to ship_to (the US if omitted; ask the user where it ships). Prices exclude shipping (chosen at checkout from those options) and sales tax; outside the US the buyer pays import duties and taxes on delivery. Nothing is ordered or saved.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "description": "1–40 wire harness designs. Volume discounts count every harness across all items.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "colors": {
                      "additionalProperties": false,
                      "description": "Optional; defaults red (+), black (−), green (signal 1), yellow (signal 2). Power wires are red or black; signal wires green or yellow. The result's defaults_applied lists any color left out: tell the user.",
                      "properties": {
                        "power_neg": {
                          "description": "Power − wire, red or black. Default black.",
                          "enum": ["red", "black"],
                          "type": "string"
                        },
                        "power_pos": {
                          "description": "Power + wire, red or black. Default red.",
                          "enum": ["red", "black"],
                          "type": "string"
                        },
                        "signal_1": {
                          "description": "Signal 1 (pin 1), green or yellow. Default green. Signal-pair connectors only.",
                          "enum": ["green", "yellow"],
                          "type": "string"
                        },
                        "signal_2": {
                          "description": "Signal 2 (pin 2), green or yellow. Default yellow. Signal-pair connectors only.",
                          "enum": ["green", "yellow"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "connector": {
                      "description": "Required: ask the user if they haven't said; never guess it. Connector family: \"xt30\" = XT30 (power only, 2 pins); \"xt30-22\" = XT30(2+2) (power + 2 signal pins); \"xt30-gh\" = XT30 + JST GH (power + signal on gh). The same on both ends, except that end B can be unterminated (end_b) or, on \"xt30-22\", move its signal pair to a JST GH plug (end_b_gh). Every plug is the female, cable-side part (XT30U-F / XT30(2+2)-F with gold contacts; JST GH GHR-02V-S housings), which mates with the male headers on batteries, ESCs, boards and actuators. There is no gender option.",
                      "enum": ["xt30", "xt30-22", "xt30-gh"],
                      "type": "string"
                    },
                    "design": {
                      "description": "A complete design code or configurator URL (e.g. \"https://acornharness.com/?k=22&l=350&g=16&a=st&b=ra-d&c=red.black.green.yellow&t=1&q=1\"), from a previous quote or pasted by the user. With it, no other field is required; any field given overrides it.",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "end_a": {
                      "description": "Required: ask the user if they haven't said; never guess it. How the wires leave end A's plug: \"straight\" = wires exit inline with the plug; \"ra-up\" = power wires bend 90° up, as drawn in the rear (wire side) view; \"ra-down\" = power wires bend 90° down, as drawn in the rear (wire side) view. In that rear view the power pins are on the left, the signal pins on the right. End A always has a plug. Ask about end A and end B separately: \"right angle on one end\" still leaves which way, and what the other end is.",
                      "enum": ["straight", "ra-up", "ra-down"],
                      "type": "string"
                    },
                    "end_b": {
                      "description": "Required: ask the user if they haven't said; never guess it. How the wires leave end B's plug: \"straight\" = wires exit inline with the plug; \"ra-up\" = power wires bend 90° up, as drawn in the rear (wire side) view; \"ra-down\" = power wires bend 90° down, as drawn in the rear (wire side) view; \"unterminated\" = no plug: wires stripped 6 mm and tinned, for screw terminals or soldering. In that rear view the power pins are on the left, the signal pins on the right. \"unterminated\" makes a pigtail. Ask about end A and end B separately: \"right angle on one end\" still leaves which way, and what the other end is.",
                      "enum": ["straight", "ra-up", "ra-down", "unterminated"],
                      "type": "string"
                    },
                    "end_b_gh": {
                      "description": "Optional, \"xt30-22\" only: end B's signal pair goes to its own JST GH 1.25 mm 2-pin plug, and end B's power to a 2-pin XT30 (or tinned leads if end_b is \"unterminated\"). End A keeps the XT30(2+2). Default false (end B is an XT30(2+2) like end A); ask if the user mentions JST GH.",
                      "type": "boolean"
                    },
                    "length_mm": {
                      "description": "Required: ask the user if they haven't said; never guess it. Wire length in mm, 30–3000, rounded to the nearest 5 mm. Wire only, measured between the rear faces of the plugs (to the wire tips on a pigtail). 1 in = 25.4 mm.",
                      "maximum": 3000,
                      "minimum": 30,
                      "type": "number"
                    },
                    "power_gauge": {
                      "description": "Required: ask the user if they haven't said; never guess it. Power wire gauge in AWG: 14 (up to ~30 A), 16 (up to ~22 A), 18 (up to ~16 A). Signal wire gauge is signal_gauge.",
                      "enum": [14, 16, 18],
                      "type": "number"
                    },
                    "quantity": {
                      "description": "Required: ask the user if they haven't said; never guess it. How many of this design, 1–5000. Volume discounts count every harness in the order.",
                      "maximum": 5000,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "signal_gauge": {
                      "description": "Optional, \"xt30-22\" without end_b_gh only: signal wire gauge in AWG, 24 or 30. Default 24; 30 is thinner and more flexible. Any JST GH plug (\"xt30-gh\", or end_b_gh) is always 30 AWG, to fit the GH contacts. Ask if the user mentions signal wire size; tell the user if you rely on the default.",
                      "enum": [24, 30],
                      "type": "number"
                    },
                    "swap_signals": {
                      "description": "Optional, \"xt30-22\" and \"xt30-gh\" only: cross the signal pair, end A pin 1 to end B pin 2 and 2 to 1 (e.g. to swap CAN H/L). Needs signal pins on end B (a plug, or end_b_gh). Default false (straight through); tell the user if you rely on it.",
                      "type": "boolean"
                    },
                    "twisted": {
                      "description": "Optional, \"xt30-22\" and \"xt30-gh\" only: twist the signal pair (recommended for CAN). Default true; tell the user if you rely on it.",
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
