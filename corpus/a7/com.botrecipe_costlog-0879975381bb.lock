{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/costlog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://costlog.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-cost-log",
        "title": "Agent Cost Log",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cost log for AI agents. One call, or your OpenTelemetry export, turns into cost per run, per tool, per model and per day, with 30-day history. No evals, no prompts, no proxy. Free watch-only mode logs and flags runs over your cap; Pro at $9 a month posts the alert and keeps 30 days. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "cost_report",
          "description": "Cost per run, per tool, per model and per day. Without an API key pass run_id (one run). With a key: everything on that key. Free shows 7 days, Pro 30.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "1-30 (free max 7).",
                "type": "integer"
              },
              "run_id": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:73d465207e0733c9237428d228b4f9deeaf331469d7a465bfc027f206d573c04"
        },
        {
          "name": "log_costs",
          "description": "Log what your agent's model and tool calls cost, then get the running total for the run and for today. Pass events (one per call, up to 500) or an OpenTelemetry OTLP/JSON trace export as otel (gen_ai.usage.input_tokens / output_tokens / gen_ai.request.model are read; trace id becomes run_id). Give cost_usd per call, or tokens plus your own per-million prices; nothing is guessed. Optional caps: run_cap_usd and daily_cap_usd. Free watch-only returns would_alert when a cap is crossed; Pro posts one alert per day to alert_webhook. Never blocks or changes your agent.",
          "inputSchema": {
            "properties": {
              "alert_webhook": {
                "description": "https URL Pro posts the cap alert to.",
                "type": "string"
              },
              "daily_cap_usd": {
                "type": "number"
              },
              "events": {
                "items": {
                  "properties": {
                    "agent": {
                      "type": "string"
                    },
                    "at": {
                      "description": "ISO time of the call (default now; at most 30 days back).",
                      "type": "string"
                    },
                    "cost_usd": {
                      "description": "What the call cost, if your provider returns it. Otherwise pass tokens plus price_in_per_m / price_out_per_m.",
                      "type": "number"
                    },
                    "input_tokens": {
                      "type": "integer"
                    },
                    "model": {
                      "description": "Model name as your provider bills it.",
                      "type": "string"
                    },
                    "output_tokens": {
                      "type": "integer"
                    },
                    "price_in_per_m": {
                      "description": "Your input price in USD per 1M tokens (from your provider's price page).",
                      "type": "number"
                    },
                    "price_out_per_m": {
                      "description": "Your output price in USD per 1M tokens.",
                      "type": "number"
                    },
                    "run_id": {
                      "type": "string"
                    },
                    "tool": {
                      "description": "Tool or step name, e.g. \"web_search\".",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "otel": {
                "description": "OTLP/JSON export: { resourceSpans: [...] }.",
                "type": "object"
              },
              "price_in_per_m": {
                "description": "Default input USD per 1M tokens for events without cost_usd.",
                "type": "number"
              },
              "price_out_per_m": {
                "description": "Default output USD per 1M tokens.",
                "type": "number"
              },
              "run_cap_usd": {
                "type": "number"
              },
              "run_id": {
                "description": "Stable id for this run (default \"default\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2838a8531322bbab6f08b32e66a917affa4f866c064f7835bd503c0ffdcf380"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $9/month upgrade link. Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9976e3342e295e0be5a023bb57d60324ebd7c104df1c76e8d7effcdadec38b20"
        },
        {
          "name": "weekly_report",
          "description": "Plain-English summary of the last 7 days of spend: total, top runs, top tools, top models, busiest day. Read-only; sends nothing. Needs a free API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b404dd02eec6096ce95bb7b0e85c93018747d032de59c5e5b2b5fd139be73fa9"
        }
      ],
      "digest": "sha256:83f784fd0483c067a61ac8022fe92a1009d64baac38e29d671f06d3af6949ae3"
    }
  }
}
