        {
          "name": "trending_repos",
          "title": "Trending GitHub repos",
          "description": "What's rising on GitHub right now: the repos that gained the most stars today, this week or this month, with star farms filtered out. Optionally only one topic (agents, models, infra, creative, desktop, web) or one kind (app, mcp_server, library…). Use it when the user asks what's new, hot, trending or taking off in open source.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "description": "Optional: what the repo is. app (end-user application), mcp_server, agent_skill, agent, template, library, cli, model, resource (lists, docs, courses), other.",
                "enum": ["app", "mcp_server", "agent_skill", "agent", "template", "library", "cli", "model", "resource", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many repos to return, 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language of the summaries: 'en' (default) or 'es' for Spanish. Use 'es' when the user writes in Spanish.",
                "enum": ["en", "es"],
                "type": "string"
              },
