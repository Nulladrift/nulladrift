        {
          "name": "search_repos",
          "title": "Search GitHub repos",
          "description": "Find real, actively growing open-source GitHub repositories for a need described in plain words (\"a calendar MCP server\", \"free Photoshop alternative for Mac\", \"self-hosted analytics\"). Semantic search over the RepoAlerts directory, which leaves out repos with fake (bought or farmed) stars. Use it instead of recalling package or repo names from memory, whenever the user asks for a tool, library, app, framework or MCP server. Returns for each repo: what it is, who it's for, stars and stars gained in 24 hours and 7 days, licence, last push, its RepoAlerts page and GitHub URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
