              "kind": {
                "description": "Optional: what the repo is. app (end-user application), mcp_server, agent_skill, agent, template, library, cli, model, resource (lists, docs, courses), other.",
                "enum": ["app", "mcp_server", "agent_skill", "agent", "template", "library", "cli", "model", "resource", "other"],
                "type": "string"
              },
              "language": {
                "description": "Optional main programming language as GitHub names it, e.g. 'TypeScript', 'Python', 'Rust', 'C++'.",
                "pattern": "^[\\w.+#\\- ]{1,40}$",
                "type": "string"
              },
              "license": {
                "description": "Optional SPDX licence id, e.g. 'MIT', 'Apache-2.0', 'GPL-3.0', 'AGPL-3.0'.",
                "pattern": "^[\\w.+#\\- ]{1,40}$",
                "type": "string"
              },
              "limit": {
