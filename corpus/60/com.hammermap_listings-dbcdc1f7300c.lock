      },
      "transport": {
        "type": "http",
        "url": "https://hammermap.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "com.hammermap/listings",
        "title": "HammerMap – Spanish court, State and Social Security auctions",
        "version": "1.0.2",
        "description": "Free, read-only search of current Spanish public auctions: court auctions and State sales from the BOE (Agencia Estatal Boletín Oficial del Estado) and Social Security auctions from the TGSS (Tesorería General de la Seguridad Social). Spain only; updated once per working day.",
        "websiteUrl": "https://hammermap.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HammerMap lists current Spanish court auctions (BOE section IV), State sales (BOE section V-B) and Social Security (TGSS) auctions in plain language. Sources: the BOE (Agencia Estatal Boletín Oficial del Estado) for court auctions (section IV) and State sales (section V-B), and the TGSS (Tesorería General de la Seguridad Social) for Social Security auctions. Coverage: Spain only (country ES); no other country has data yet. The data are rebuilt once per working day (Monday to Friday, about 08:00 Europe/Madrid) from the BOE daily summary and the TGSS auction portal. Only active listings are returned: a listing whose bid deadline (Europe/Madrid date) has passed is left out, checked on every request. Every tool result carries attribution.data_updated (last rebuild) and attribution.latest_boe_publication (newest BOE issue included), so tell the user how fresh the data are. Use search_listings to find listings (filter by province, type, asset type, price, dates), get_listing for one listing with lots, deposit, deadlines, risk analysis and official links, get_facets for provinces and counts. Court auction notices in BOE open data carry no price, description or closing date: send users to the official portal link (urls.official) for those. Bids happen only on the official channel; HammerMap takes no bids and no money. The risk light is a general automatic assessment, not legal advice. When you show the data, keep the attribution: \"Basado en datos de la Agencia Estatal Boletín Oficial del Estado\" (https://www.boe.es) for BOE listings, and \"Fuente: Tesorería General de la Seguridad Social\" (https://w6.seg-social.es/subastas/) with the date of the last update for TGSS-… listings; link the listing or the official notice.",
      "tools": [
        {
          "name": "get_facets",
          "title": "Filter values, counts and data freshness",
          "description": "Counts of active listings (bid deadline not passed) by type, procedure, asset type and province, the starting-price range, covered countries, and data freshness (data_updated, latest_boe_publication, update_frequency). Use it to discover valid filter values for search_listings or to answer \"how many / how fresh\" questions. No arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "additionalProperties": true,
                "type": "object"
              },
              "facets": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["attribution", "facets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Filter values, counts and data freshness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5a01e7df63a8c4c82f0c743cccfd471ef92d4435f3f19454a24de9fc6ff11d6"
        },
        {
          "name": "get_listing",
          "title": "Get one listing",
          "description": "Full record for one listing by id from search_listings (SUB-… for court auctions, BOE-B-… for State sales from the BOE, TGSS-… for Social Security (TGSS) auctions): lots with starting price and deposit, bid deadline, auction session date, bidding mode, approximate place, HammerMap's general risk analysis with legal basis (not legal advice), corrections, official BOE and portal links, and data freshness (attribution.data_updated). Returns an error if the id is not listed any more. Bids and payments happen only on the official channel in urls / bidding.where.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Listing id exactly as returned by search_listings, e.g. SUB-JA-2026-267510 or BOE-B-2026-35250",
                "pattern": "^(?:SUB-[A-Z0-9-]{4,40}|BOE-B-\\d{4}-\\d{1,7}|TGSS-[A-Z0-9-]{4,40})$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "additionalProperties": true,
                "type": "object"
              },
              "licence": {
                "type": "string"
              },
              "listing": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["attribution", "listing"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f87fa08884b5f4feee459d7c561943cfad07860bb4700bc8038b7a3f490b56eb"
        },
        {
          "name": "search_listings",
          "title": "Search Spanish auction listings",
          "description": "Search active Spanish court auctions (BOE section IV), State/public-body sales (BOE section V-B) and Social Security auctions (TGSS). Sources: the BOE (Agencia Estatal Boletín Oficial del Estado) for court auctions (section IV) and State sales (section V-B), and the TGSS (Tesorería General de la Seguridad Social) for Social Security auctions. Only active listings are returned: a listing whose bid deadline (Europe/Madrid date) has passed is left out, checked on every request. Use it first to find listings by province, town, type, asset type, starting price or dates; then call get_listing with an id for the full record. Returns total count, paging (limit/offset) and short records: id, title in 5 languages, approximate place, seller, starting price in EUR when the notice gives one, publication date, deadline, HammerMap risk light and links (HammerMap page, official channel, BOE notice when there is one). Coverage: Spain only. Data are updated once per working day; attribution.data_updated and attribution.latest_boe_publication show how fresh they are. Court auction notices in BOE open data have no price, description or closing date (those are on the official portal). All filters are optional and combine with AND.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset_type": {
                "description": "vivienda = home, local = commercial premises, garaje = parking, solar = building plot, rustica = rural land, inmueble = other real estate, vehiculo = vehicle, otros = other goods, unknown = not stated in the notice",
                "enum": ["vivienda", "local", "garaje", "solar", "rustica", "inmueble", "vehiculo", "otros", "unknown"],
                "type": "string"
              },
              "country": {
                "default": "ES",
                "description": "ISO 3166-1 alpha-2 country code. Only ES (Spain) has data; any other value returns 0 results.",
                "type": "string"
              },
              "deadline_from": {
                "description": "Bid deadline from; only listings with a known deadline match (YYYY-MM-DD)",
                "format": "date",
                "type": "string"
              },
              "deadline_to": {
                "description": "Bid deadline to; only listings with a known deadline match (YYYY-MM-DD)",
                "format": "date",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Results per page, 1-100",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum starting price in EUR. Only listings with a known price match.",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Minimum starting price in EUR. Only listings with a known price match.",
                "minimum": 0,
                "type": "number"
              },
              "municipality": {
                "description": "Town, exact name: the court's town for court auctions, the asset's town for State sales",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of results to skip, for paging",
                "minimum": 0,
                "type": "integer"
              },
              "procedure": {
                "description": "apremio = enforcement for debt, voluntaria = voluntary court sale, concursal = insolvency, estado = State sale, tgss = Social Security (TGSS) auction",
                "enum": ["apremio", "voluntaria", "concursal", "estado", "tgss"],
                "type": "string"
              },
              "province": {
                "description": "Spanish province, exact name, accent-insensitive, e.g. Madrid, Valencia, Illes Balears. Call get_facets for the list.",
                "type": "string"
              },
              "published_from": {
                "description": "Publication date from (BOE issue; for TGSS the portal's last update) (YYYY-MM-DD)",
                "format": "date",
                "type": "string"
              },
              "published_to": {
                "description": "Publication date to (YYYY-MM-DD)",
                "format": "date",
                "type": "string"
              },
              "q": {
                "description": "Free text, accent-insensitive, matched in title, seller, town, province and lot description, e.g. \"vivienda\" or \"Puerto de Valencia\"",
                "type": "string"
              },
              "sort": {
                "default": "published_desc",
                "description": "published_desc = newest first (default), deadline_asc / deadline_desc = closing soonest / latest (no deadline last), price_asc / price_desc = by starting price (no price last), risk_asc / risk_desc = by HammerMap risk light green < yellow < red",
                "enum": ["published_desc", "deadline_asc", "deadline_desc", "price_asc", "price_desc", "risk_asc", "risk_desc"],
                "type": "string"
              },
              "type": {
                "description": "court_auction = judicial auction (BOE IV); state_sale = sale by the State or a public body (BOE V-B) or a Social Security auction (TGSS)",
                "enum": ["court_auction", "state_sale"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "additionalProperties": true,
                "type": "object"
              },
              "items": {
                "description": "Short listing records",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "licence": {
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "offset": {
                "type": "integer"
              },
              "total": {
                "description": "Number of matching listings",
                "type": "integer"
              }
            },
            "required": ["attribution", "items", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Spanish auction listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b90d81eebcb93e2f03949b4cfcc3266c8a2ba1e529b0904de1978de9a196194"
        }
      ],
      "digest": "sha256:630307e1d45e0e03aa18f539f760d36bbf52cc20ee27be930a8447dec733df29"
    }
  }
}
