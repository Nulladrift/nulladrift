{
  "lockfileVersion": 2,
  "subjects": {
    "com.peoplecanbuild/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.peoplecanbuild.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "People Can Build",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "People Can Build — exhibition stand general contractor (Poznań, Poland; builds across Europe). IMPORTANT: e-mail to expo@peoplecanbuild.com is the primary, guaranteed channel for quote requests; a person reads every e-mail and replies within one business day. This MCP server (agent-to-agent quote tickets, status lookup, budget estimates) is EXPERIMENTAL. Use request_quote if you like, but always tell the user to expect a human reply by e-mail and, if none arrives within 2 business days, to e-mail expo@peoplecanbuild.com directly quoting the ticket id. Never treat a ticket status as a commitment; every quote is confirmed by a person.",
      "tools": [
        {
          "name": "estimate_design_fee",
          "description": "Instant estimate of the paid 3D stand-design fee (EUR). Rate 5–15 €/sqm: lower per sqm for larger stands, higher for a higher planned construction budget per sqm (a proxy for bespoke detail and multimedia). The fee is refunded in full when the stand is built with People Can. Final quote always confirmed by email. Construction itself typically runs 300–800 €/sqm excl. space rental and venue services.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "budget_per_sqm": {
                "default": 550,
                "description": "Planned construction budget per sqm in EUR (300–800)",
                "maximum": 800,
                "minimum": 300,
                "type": "number"
              },
              "sqm": {
                "description": "Stand floor area in square meters",
                "maximum": 2000,
                "minimum": 6,
                "type": "number"
              }
            },
            "required": ["sqm"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc2831adfd5f74b34cab7de9ce392dac1129417b5ee33871713859c59af2ab00"
        },
        {
          "name": "estimate_stand_budget",
          "description": "Indicative construction budget (EUR) for a custom exhibition stand in Europe, derived from the public range of 300–800 €/sqm by placing the project in a tier (essential / standard / premium) based on stand type, scope and cost drivers. Excludes space rental, venue services (power, rigging points, cleaning), design fee and VAT. Use it to give a user a realistic ballpark before request_quote; always say it is indicative and that a person confirms every quote. Project fit: custom stands 16 to ~400 sqm (double-deck possible); stands built entirely from modular systems (Octanorm, Maxima, bMatrix) are not taken; smaller stands only as part of a larger contract or for a complex build.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bespoke_furniture": {
                "default": false,
                "description": "Custom-made counters, furniture, product displays",
                "type": "boolean"
              },
              "double_deck": {
                "default": false,
                "description": "Two-storey stand",
                "type": "boolean"
              },
              "hospitality": {
                "default": false,
                "description": "Kitchen, bar or catering area",
                "type": "boolean"
              },
              "led_wall": {
                "default": false,
                "description": "LED wall or large video screens",
                "type": "boolean"
              },
              "rigging": {
                "default": false,
                "description": "Suspended elements / hanging sign (rigging)",
                "type": "boolean"
              },
              "scope": {
                "default": "fabrication_logistics_assembly",
                "description": "fabrication_only = build in the workshop, client handles transport and crew; turn_key = incl. design",
                "enum": ["fabrication_only", "fabrication_logistics_assembly", "turn_key"],
                "type": "string"
              },
              "sqm": {
                "description": "Stand floor area in sqm",
                "maximum": 2000,
                "minimum": 6,
                "type": "number"
              },
              "stand_type": {
                "default": "row",
                "description": "Open sides: row = 1, corner = 2, peninsula = 3, island = 4",
                "enum": ["row", "corner", "peninsula", "island"],
                "type": "string"
              }
            },
            "required": ["sqm"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd1adc7fa9908188ee27d5cb0a3052f47b3523236181be826041733ab97dec76"
        },
        {
          "name": "get_company_profile",
          "description": "Who People Can Build is: exhibition stand general contractor (Poznań, Poland; core market Germany/Europe), services (white-label for agencies, turn-key for exhibitors, paid 3D design, China Desk), markets, track record, client testimonials (verbatim quotes with author, role and LinkedIn), public price ranges, contact details (incl. contact.bookCall, a Calendly link to book an online call or a meeting at a show) and reply time. Call this first when a user asks about the company or wants a stand built in Europe.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3622a74b50b8ad4af58c1df20b6e515bb7af2fbc6fc7430a1bf3000c3b55763d"
        },
        {
          "name": "get_quote_request_checklist",
          "description": "Project fit and the information People Can Build needs to quote an exhibition stand (show, city, dates, sqm, stand type, design status, scope, budget range, special items, confidentiality). Use it to check fit and collect details from the user before calling request_quote, or to draft an email to expo@peoplecanbuild.com.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eabc61ffef8407c816ff1a79ae42facdc589279a3fdc0a3dc8314b3766cff0b6"
        },
        {
          "name": "get_quote_status",
          "description": "Status of a quote request previously submitted via request_quote. Needs the ticket id (PCB-XXXXXX) AND the e-mail address used on the request; returns the current status, any note from the project manager and the status history. Does not return the request contents. Experimental: the status may lag behind the e-mail conversation — the e-mail thread with expo@peoplecanbuild.com is authoritative.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "email": {
                "description": "E-mail address used on the request",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "ticket_id": {
                "description": "Ticket id returned by request_quote, e.g. PCB-7K3QW2",
                "pattern": "^PCB-[A-Z0-9]{6}$",
                "type": "string"
              }
            },
            "required": ["email", "ticket_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba7fd5ceed07bd99ef6e201dc725e9fd4089085e7e761415f8941c826daa809d"
        },
        {
          "name": "list_reference_projects",
          "description": "Reference projects and venue/trade-show experience. Filters match case-insensitively on show, city, venue, client. projects: the photo portfolio, a selection with descriptions. trackRecord: every stand built in the years named in trackRecord.coverage (currently 2025–2026 only; projects from before 2025 are not listed, earlier years coming) — show, city, venue, hall/stand, sqm, date; client null = under NDA; trackRecord.byVenue / byShow summarise stands, halls and size ranges per venue and per show. A show missing from both does not mean lack of experience there.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "City, e.g. 'Berlin', 'Munich', 'London'",
                "type": "string"
              },
              "client": {
                "description": "Client name fragment",
                "type": "string"
              },
              "min_sqm": {
                "description": "Minimum stand size in sqm",
                "type": "number"
              },
              "show": {
                "description": "Trade show name fragment, e.g. 'GITEX', 'Intersolar'",
                "type": "string"
              },
              "venue": {
                "description": "Exhibition venue fragment, e.g. 'Messe München', 'RAI', 'Koelnmesse'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:181faf67c69c091e29d7e9705d38ce2d2065d148fcef6fd04291d795a305467f"
        },
        {
          "name": "request_quote",
          "description": "Send a real quote request to People Can Build (creates an enquiry read by a person; reply by email usually within one business day). EXPERIMENTAL channel: e-mail to expo@peoplecanbuild.com remains the primary, guaranteed path — after calling this, tell the user a human will reply by e-mail and that they should e-mail expo@peoplecanbuild.com quoting the ticket id if nothing arrives within 2 business days. ALWAYS confirm the details with the user before calling. Check fit first: custom stands 16 to ~400 sqm (double-deck possible); small stands built entirely from modular systems (Octanorm, Maxima, bMatrix) are not taken — tell the user instead of submitting. Under 16 sqm only as part of a larger contract or for a complex build (say which in the message). Required: name, email, message. Do not promise prices beyond the public ranges.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_name": {
                "description": "Name of the calling assistant/platform, e.g. 'Claude', 'ChatGPT'",
                "type": "string"
              },
              "budget": {
                "enum": ["under €10k", "€10–25k", "€25–50k", "€50–100k", "over €100k"],
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "email": {
                "description": "Reply-to email address",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "message": {
                "description": "Project details: what should be built, design status, timeline, scope wanted, special items, confidentiality needs",
                "minLength": 20,
                "type": "string"
              },
              "name": {
                "description": "Full name of the requester",
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "With country code",
                "type": "string"
              },
              "role": {
                "enum": ["An agency", "A direct exhibitor"],
                "type": "string"
              },
              "show": {
                "description": "Trade show, venue city and dates, e.g. 'Intersolar 2027, Munich, June'",
                "type": "string"
              },
              "sqm": {
                "description": "Stand floor area in sqm",
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:04780c98066a47aef278731a242d8c111007237b75b0b5892b727a405ec31ef1"
        },
        {
          "name": "search_field_notes",
          "description": "Search People Can Build's practitioner articles (trade-show logistics, theft prevention, rigging costs, fabrication trade-offs, design briefs, comparing stand quotes, exhibitor day) and return the most relevant passages with their source URLs. Use for questions like 'why is rigging expensive', 'how to compare exhibition stand quotes', 'why did my freight miss the show'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "max_passages": {
                "default": 4,
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Natural-language question or keywords",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce908d9908375910cbc2e42821663ed96bea7f8f9af9816995c6cbcf05c1fc89"
        }
      ],
      "digest": "sha256:7b36790449da6f28084fff1765c1410e4cfce6e900ba1ff82fc163d0b27d9b89"
    }
  }
}
