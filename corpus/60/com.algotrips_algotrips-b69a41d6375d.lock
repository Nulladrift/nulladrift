              "status": {
                "enum": ["ok", "no_flights", "needs_changes", "refused"],
                "type": "string"
              },
              "suggestions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "for": {
                      "type": "string"
                    },
                    "names": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["for", "names"],
                  "type": "object"
                },
                "type": "array"
              },
              "to": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  }
                },
                "required": ["city", "code", "country"],
                "type": "object"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
