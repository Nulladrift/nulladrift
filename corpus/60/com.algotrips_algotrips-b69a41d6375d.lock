        {
          "name": "plan_trip",
          "title": "Plan a trip",
          "description": "Builds a full day-by-day trip with live prices in the signed-in AlgoTrips account: flights from the home city (unless gettingAround is none), hotels, activities and transfers for each city, for the cities, start date, travellers and home city given. The kind of hotel (hotelStars) and what the travellers enjoy (interests) shape the hotels and activities picked. A field name the tool does not take is refused: nothing is built, and the answer names the right field. Returns a build id at once. The trip takes about 3 to 6 minutes, and AlgoTrips emails the person when it is ready (the price and the link), or if it could not build it, when it has their email (the answer says so). With choicesConfirmed not true and any of the budget, the kind of hotel, pace, activities, getting around or (2 or more cities) the city order left out, nothing is built: the answer lists those choices with their questions and defaults. Booking and payment happen on algotrips.com. Needs the person to be signed in to AlgoTrips.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "activityStyle": {
                "description": "mix (some tours, some on your own), self_guided (mostly on your own) or all_inclusive (guided tours).",
                "enum": ["mix", "self_guided", "all_inclusive"],
                "type": "string"
              },
              "adults": {
                "description": "Adults travelling (1 to 9).",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "budgetInr": {
                "description": "The whole trip budget in Indian rupees, a whole number (₹4.5 lakh = 450000). Left out: a typical amount for this trip is used.",
                "maximum": 100000000,
                "minimum": 1000,
                "type": "integer"
              },
              "childrenAges": {
                "description": "Each child's age (0 to 17), at most 6 children.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "maxItems": 6,
                "type": "array"
              },
              "choicesConfirmed": {
                "description": "true: any of budgetInr, the kind of hotel (hotelStars or hotelStandard), pace, activityStyle, gettingAround and (2 or more cities) keepCityOrder left out gets its default. false or left out: with any of them left out nothing is built, and the answer (status needs_choices) lists them with a question, the allowed values and the default for each.",
                "type": "boolean"
              },
              "cities": {
                "description": "The cities to stay in, in order (1 to 6).",
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "name": {
                      "description": "A city to stay in, for example \"Kyoto\", or \"Kyoto, Japan\" when the name is shared.",
                      "maxLength": 80,
                      "minLength": 2,
                      "type": "string"
                    },
                    "nights": {
                      "description": "Nights in this city (1 to 14).",
                      "maximum": 14,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "gettingAround": {
                "description": "How the travellers get there and between cities, the choices on the website: auto (AlgoTrips picks a flight or road / rail for each hop), all (a flight on every hop that has one), edge (flights to the first city and home from the last, road or rail in between), none (no flights: hotels, activities and transfers only). Left out: auto.",
                "enum": ["auto", "all", "edge", "none"],
                "type": "string"
              },
              "homeCity": {
                "description": "The city the travellers fly from and come back to.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "hotelStandard": {
                "description": "Hotel standard: budget, comfort or luxury.",
                "enum": ["budget", "comfort", "luxury"],
                "type": "string"
              },
              "hotelStars": {
                "description": "The kinds of hotel the person wants, the choices on the website: 1 = hostels, 2 = value for money, 3 = 3-star (mid-range), 4 = 4-star (comfortable), 5 = 5-star (luxury). The best rated hotel of these kinds is picked. When given, it is used instead of hotelStandard. Left out: no preference for a kind of hotel.",
                "items": {
                  "maximum": 5,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "interests": {
                "description": "What the travellers enjoy, the choices on the website: Culture, Food & Dining, Art & Museums, Beach, Nightlife, Shopping, History, Nature. Left out: a bit of everything.",
                "items": {
                  "enum": ["Culture", "Food & Dining", "Art & Museums", "Beach", "Nightlife", "Shopping", "History", "Nature"],
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "keepCityOrder": {
                "description": "true keeps the cities in the order given. false or left out lets AlgoTrips pick the best order for flights and getting around.",
                "type": "boolean"
              },
              "month": {
                "description": "The month of travel (1 to 12), when the person has no exact day yet. With month + year and no startDate nothing is built: the answer suggests a start date (suggestedStartDate).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "pace": {
                "description": "How full each day is: relaxed, balanced or fast.",
                "enum": ["relaxed", "balanced", "fast"],
                "type": "string"
              },
              "startDate": {
                "description": "The exact day the trip starts, YYYY-MM-DD. Needed to build: without it nothing is built.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "totalNights": {
                "description": "Nights for the whole trip, when some cities have no nights of their own (split between them).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "year": {
                "description": "The year of travel, with month.",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              }
            },
            "required": ["adults", "cities", "homeCity"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buildId": {
                "type": "string"
              },
              "choices": {
                "description": "The choices left out (status needs_choices): for each, the input field, a question, the allowed values and the default used when it stays out.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "default": {
                      "type": ["string", "number", "boolean", "null"]
                    },
                    "defaultLabel": {
                      "type": "string"
                    },
                    "field": {
                      "type": "string"
                    },
                    "options": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "label": {
                            "type": "string"
                          },
                          "value": {
                            "type": ["string", "number", "boolean"]
                          }
                        },
                        "required": ["label", "value"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "question": {
                      "type": "string"
                    }
                  },
                  "required": ["default", "defaultLabel", "field", "options", "question"],
                  "type": "object"
                },
                "type": "array"
              },
              "cities": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "type": "string"
                    },
                    "nights": {
                      "type": "number"
                    }
                  },
                  "required": ["city", "nights"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "startDate": {
                "type": "string"
              },
              "status": {
                "enum": ["building", "refused", "needs_changes", "needs_date", "needs_choices"],
                "type": "string"
              },
              "suggestedStartDate": {
                "type": "string"
              },
              "suggestions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "for": {
                      "type": "string"
                    },
                    "names": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["for", "names"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["trips:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fa955be057aacff36f24fb0c0a1f4893a8b3e9e394856e9fc34d6d80f58c8629"
        },
        {
          "name": "search_flights",
          "title": "Search flights",
          "description": "Searches one-way flights on AlgoTrips for one day between two cities or airports, with current prices. Returns up to 5 options (airline, flight numbers, times, duration, stops, baggage, refund, fare and price for all passengers), each with a link to book it on AlgoTrips, and a link to see every flight. Nothing is booked or paid here. The prices are the signed-in AlgoTrips account's own; needs the person to be signed in to AlgoTrips. A city that is not found or is shared by several cities returns close matches instead (status needs_changes).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "description": "Adults (12 and over) travelling, 1 to 9. Left out: 1.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "cabin": {
                "description": "Cabin: economy, premium_economy, business or first. Left out: every cabin.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "childrenAges": {
                "description": "Each child's age, 2 to 11. Adults and children together are at most 9.",
                "items": {
                  "maximum": 11,
                  "minimum": 2,
                  "type": "integer"
                },
                "maxItems": 8,
                "type": "array"
              },
              "date": {
                "description": "The day of the flight, YYYY-MM-DD, from today up to 330 days ahead.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "departAfter": {
                "description": "The earliest departure time, HH:MM (24-hour clock, local time at the departure airport).",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "departBefore": {
                "description": "The latest departure time, HH:MM (24-hour clock, local time at the departure airport).",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "directOnly": {
                "description": "true: nonstop flights only.",
                "type": "boolean"
              },
              "from": {
                "description": "Where the flight leaves from: a city (\"Mumbai\", or \"Hyderabad, India\" when the name is shared) or a 3-letter airport code (\"BOM\").",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "infants": {
                "description": "Infants under 2 (on a lap), 0 to 4, no more than the adults.",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "preferredTime": {
                "description": "A preferred departure time, HH:MM. Without departAfter or departBefore, only flights leaving within 2 hours of it are returned. The flight nearest to it is always among the options.",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "to": {
                "description": "Where the flight goes: a city or a 3-letter airport code, as for from.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["date", "from", "to"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "allFlightsLink": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "from": {
                "additionalProperties": false,
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "code": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  }
                },
                "required": ["city", "code", "country"],
                "type": "object"
              },
              "message": {
                "type": "string"
              },
              "options": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "airline": {
                      "type": "string"
                    },
                    "arrives": {
                      "description": "Local time at the arrival airport, YYYY-MM-DDTHH:MM.",
                      "type": ["string", "null"]
                    },
                    "baggage": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "cabin": {
                              "type": ["string", "null"]
                            },
                            "checkIn": {
                              "type": ["string", "null"]
                            }
                          },
                          "required": ["cabin", "checkIn"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "currency": {
                      "type": ["string", "null"]
                    },
                    "departs": {
                      "description": "Local time at the departure airport, YYYY-MM-DDTHH:MM.",
                      "type": "string"
                    },
                    "durationMinutes": {
                      "type": ["number", "null"]
                    },
                    "fareType": {
                      "type": ["string", "null"]
                    },
                    "flightNumbers": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "from": {
                      "additionalProperties": false,
                      "properties": {
                        "airport": {
                          "type": ["string", "null"]
                        },
                        "city": {
                          "type": ["string", "null"]
                        },
                        "code": {
                          "type": "string"
                        }
                      },
                      "required": ["airport", "city", "code"],
                      "type": "object"
                    },
                    "link": {
                      "type": "string"
                    },
                    "price": {
                      "description": "Every passenger together, rounded up; null when no price can be given.",
                      "type": ["number", "null"]
                    },
                    "refundable": {
                      "type": ["boolean", "null"]
                    },
                    "stops": {
                      "type": "number"
                    },
                    "to": {
                      "additionalProperties": false,
                      "properties": {
                        "airport": {
                          "type": ["string", "null"]
                        },
                        "city": {
                          "type": ["string", "null"]
                        },
                        "code": {
                          "type": "string"
                        }
                      },
                      "required": ["airport", "city", "code"],
                      "type": "object"
                    }
                  },
                  "required": ["airline", "arrives", "baggage", "currency", "departs", "durationMinutes", "fareType", "flightNumbers", "from", "link", "price", "refundable", "stops", "to"],
                  "type": "object"
                },
                "type": "array"
              },
              "party": {
