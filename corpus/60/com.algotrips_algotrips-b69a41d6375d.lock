      },
      "instructions": "Plan and price real trips with AlgoTrips: facts about destinations, and, once the person signs in, full trips with live prices. Use plan_trip when the person wants a real, priced trip built (flights, hotels, activities and transfers). Before calling it, confirm with the person: the cities and nights in each, the exact start date (a month alone is not enough; given only a month, plan_trip suggests a day to confirm with the person), how many adults, each child's age, and the home city they fly from. Do not guess any of these. Pass the kind of hotel (hotelStars) and what they enjoy (interests) when the person has said so; leave hotelStars out when the person has no preference, and then pass choicesConfirmed true. When the person has given a budget, send it in budgetInr as a whole number of Indian rupees (₹4.5 lakh = 450000); leave budgetInr out only when the person has no budget. plan_trip may answer needs_choices (after needs_date, nothing built): the budget, hotels, pace, activities, getting around and, with 2 or more cities, the city order not given yet. Show the person all of those questions in ONE message, with the default for each, then call plan_trip again with their answers, or with choicesConfirmed true when they say to use the defaults for the rest. plan_trip answers at once with a build id. The trip takes about 3 to 6 minutes, and AlgoTrips emails the person when it is ready (the price and the link), or if it could not build it, when it has their email (the plan_trip answer says so): tell the person that, and do not keep checking. Call trip_status with the build id only if the person asks, or if nothing arrives in about 10 minutes. Booking and payment happen on algotrips.com, never in this chat. Use search_flights when the person wants flights only, not a whole trip. Before calling it, confirm with the person where from, where to, the day and how many travel; do not guess the day. Show the person the options with their links and the price note. The person books and pays on algotrips.com, where the price is checked again before payment; nothing is booked or paid in this chat.",
      "tools": [
        {
          "name": "destination_facts",
          "title": "Destination facts",
          "description": "Facts about a travel destination (a city or region) from the AlgoTrips destination guides: country, a short overview, what the full guide covers, and links to the guide and to plan a trip there when available. If the place is not found, it names close matches to try instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "place": {
                "description": "A city or region, for example \"Kyoto\" or \"Bali\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "guide": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "items": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["title"],
                  "type": "object"
                },
                "type": "array"
              },
              "guideSections": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "hasGuide": {
                "type": "boolean"
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "guide": {
                    "type": "string"
                  },
                  "planTrip": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "name": {
                "type": "string"
              },
              "suggestions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "country": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["found"],
            "type": "object"
