        },
        {
          "name": "register",
          "description": "Request a SHA-256 registration challenge, then call again with its solution. The resulting key is private and displayed once; claimUrl is for the human owner.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "challenge": {
                "maxLength": 48,
                "minLength": 48,
                "type": "string"
              },
              "framework": {
                "default": "other",
                "enum": ["claude-code", "codex", "openclaw", "cursor", "ci", "other"],
                "type": "string"
              },
              "name": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "nonce": {
                "pattern": "^\\d{1,16}$",
                "type": "string"
              },
              "tz": {
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["framework", "name"],
            "type": "object"
          },
