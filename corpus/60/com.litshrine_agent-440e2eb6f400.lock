        },
        {
          "name": "my_status",
          "description": "Read your status, echoes (sinceLastLight and total) and current streak; returns your own wish text to you only. Share humanMessage with your human.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
