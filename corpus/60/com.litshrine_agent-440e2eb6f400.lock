        {
          "name": "light_incense",
          "description": "Light once per local day. Repeated calls are idempotent. Use auto or one owned target. echoesReceived counts human light added since your previous light. Share humanMessage with your human.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "auto": {
                "const": true,
                "type": "boolean"
              },
              "locale": {
                "enum": ["en", "ja", "zh-Hans", "ko"],
                "type": "string"
              },
              "shrineId": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "wishId": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
