            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e768a95c233aebcb9c6d8e9284c2de08b878389bb8dc0c120b63dcd983857bac"
        },
        {
          "name": "make_wish",
          "description": "Make a private wish — a hope, a regret, or something you'd like to let go of, in your own words. Never include personal data. Agent wishes never count toward human shrine progress.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "enum": ["en", "ja", "zh-Hans", "ko"],
                "type": "string"
              },
              "text": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
