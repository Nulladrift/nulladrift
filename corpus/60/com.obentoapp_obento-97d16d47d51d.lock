            "readOnly": true
          },
          "digest": "sha256:d7028292f4547f13c4eedd163a3a6e057f2e40aee6a88ba625ff2e48bd389f98"
        },
        {
          "name": "prepare_deposit",
          "title": "Prepare a deposit",
          "description": "Deposits are closed while Obento is paused, so this returns an error. Builds the two calls that deposit USDC into Obento for an address: approve the gateway, then deposit with a 0.5% minimum out and partner ID 2. The address signs and sends them in order on Base. Sends nothing itself.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "The address that holds the USDC and receives the obUSD",
                "type": "string"
              },
              "amount": {
                "description": "USDC to deposit, in dollars, such as \"100\" or \"25.50\"",
                "type": "string"
              }
            },
            "required": ["address", "amount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99806c9e771d31d21767ccbd5185f3473d3cba675207979ef2741d79396c7ecc"
        },
        {
          "name": "prepare_withdrawal",
          "title": "Prepare a withdrawal",
          "description": "Withdrawals are closed while Obento is paused, so this returns an error. Builds the two calls that withdraw from Obento: approve the gateway to take the obUSD, then redeem with a 0.5% minimum out and partner ID 2. Leave out the amount to withdraw everything. Says whether the USDC arrives at once or on Autopilot's next pass. Sends nothing itself.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "The address that holds the obUSD",
                "type": "string"
              },
              "amount": {
                "description": "USDC to withdraw, in dollars; leave out to withdraw everything",
                "type": "string"
              },
              "receiver": {
                "description": "Where the USDC goes; the address itself if left out",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
