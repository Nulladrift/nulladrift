      "serverInfo": {
        "name": "obento",
        "title": "Obento",
        "version": "1.0.0",
        "websiteUrl": "https://obentoapp.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Obento is paused. prepare_deposit and prepare_withdrawal refuse until it reopens; the read tools still work.\nObento puts USDC to work on Base (chain ID 8453). Autopilot lends deposits across vetted lending markets and moves them when rates change; one fee, 10% of new lending profit; withdraw any time.\nCall vault_status before preparing a transaction, and only prepare one while it reports open. prepare_deposit and prepare_withdrawal return calls in order for the user's own wallet to sign and send on Base; Obento never holds keys or sends anything. They tag the gateway calls with partner ID 2 for agents.\nMoney in Obento is not a bank deposit, has no deposit protection and can lose value: read_docs(\"risks\") before depositing for someone.",
      "tools": [
        {
          "name": "autopilot_journal",
          "title": "Autopilot journal",
          "description": "Every move Autopilot made in the last 30 days: money lent to or taken from each place, queued withdrawals it paid, and any pause, newest first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a350f4a9b4505f775c5c46878c1a1547d4960eb874c01cb9835da0c134530d97"
        },
        {
          "name": "position",
          "title": "Position",
          "description": "What an address put into Obento, took out, holds now and earned, Autopilot's fee in dollars, and its latest deposits and withdrawals with their status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "A Base address, 0x followed by 40 hex characters",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
