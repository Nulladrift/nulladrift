{
  "lockfileVersion": 2,
  "subjects": {
    "ch.zzd/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.zzd.ch/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "zzd",
        "title": "zzd: Swiss everyday data",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only tools from zzd (https://zzd.ch), a small Swiss studio that runs free sites for everyday questions in Switzerland: grocery prices across Migros, Coop, Lidl, Aldi, Denner, Volg and Aligro's promotions (Schnäppchen Jäger), places for a civil wedding (Trauungslokale Schweiz), usual rents by canton from the federal statistics (Mietcheck), what electric cars cost per km (EV cost comparison), and map posters (MappaMuse). Each result names its source and date, links the page on the zzd site and carries its caveats (a price has a date; a published wedding date is not always a free one; rents are cantonal averages; EV offers are a dated snapshot).",
      "tools": [
        {
          "name": "compare_grocery_prices",
          "title": "Is this grocery product cheaper elsewhere? (Schnäppchen Jäger)",
          "description": "For one product id from a Schnäppchen Jäger search, returns its price, the identical article in the other Swiss shops (matched by barcode) and the cheapest similar product per shop for the same amount, each with the date it was read and a link. Similar products are not the same article. By zzd (schnaeppchenjaeger.zzd.ch). Not counted against the search allowance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of names and links. Default de.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              },
              "productId": {
                "description": "The product id from a grocery search result.",
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Is this grocery product cheaper elsewhere? (Schnäppchen Jäger)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e63963ee4c51980e1b47e6461024069c19ff1458e27979d4a6e3aec3220be891"
        },
        {
          "name": "ev_cost_per_km",
          "title": "What electric cars cost per km in Switzerland (EV cost comparison)",
          "description": "Electric cars offered in Switzerland ranked by total cost in CHF per km (depreciation, capital, tax, insurance, tyres and service, energy, wallbox, import fees, monthly fees), across buying new or used, importing from Germany, leasing and subscriptions, from the EV cost comparison (ev.zzd.ch, free, by zzd). Optional driving profile. The offers are a dated, hand-collected snapshot, not live prices; the model is calibrated for canton Aargau. The result links the comparison page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acquisitionType": {
                "description": "How the car is obtained. Without it, all ways are ranked.",
                "enum": ["purchase_new", "purchase_used", "import_de", "lease", "subscription"],
                "type": "string"
              },
              "annualKm": {
                "description": "Default 15000.",
                "maximum": 100000,
                "minimum": 1000,
                "type": "integer"
              },
              "holdingYears": {
                "description": "Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "homeChargingShare": {
                "description": "Share charged at home, 0-1.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "homeElectricityChfPerKwh": {
                "description": "Home electricity price in CHF per kWh.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "limit": {
                "description": "Default 5.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "make": {
                "description": "Only this make, e.g. 'Renault'.",
                "maxLength": 40,
                "type": "string"
              },
              "publicChargingChfPerKwh": {
                "description": "Public charging price in CHF per kWh.",
                "maximum": 3,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What electric cars cost per km in Switzerland (EV cost comparison)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:84615041e01b12259e71a21b4addd2bc1332ade6955640123850d4178e2d934f"
        },
        {
          "name": "find_map_posters",
          "title": "Map poster of a place (MappaMuse)",
          "description": "Find the ready poster page for a town or place on MappaMuse (mappamuse.zzd.ch, personalised map posters printed to order, by zzd), with the sizes and prices that page lists, in CHF. Any other place can be designed on the custom-poster page. The result links the page; the page and checkout are binding.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of names and links. Default de.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              },
              "place": {
                "description": "A town or place, e.g. 'Aarau', 'Lugano'.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Map poster of a place (MappaMuse)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a7ffd4984f060cf3a2b98771b489994e385a1d4b93fe04119491858036abf927"
        },
        {
          "name": "find_wedding_venues",
          "title": "Find civil wedding venues in Switzerland (Trauungslokale Schweiz)",
          "description": "Find places for a civil wedding in Switzerland as cantons and municipalities publish them (registry offices and outside venues such as castles), from Trauungslokale Schweiz (traulokale.zzd.ch, a free finder by zzd). Filter by canton (code, slug or name), town, text, guests, or a published ceremony date or date range. Important: most offices publish no dates; and where datesShowAvailability is false a published date is NOT known to be free. The date is always booked with the registry office. Each venue links its page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "canton": {
                "description": "Canton code (AG), slug (aargau) or name (Argovie).",
                "maxLength": 40,
                "type": "string"
              },
              "date": {
                "description": "Only venues with a published ceremony date on this day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from": {
                "description": "First day of a date range for published ceremony dates, YYYY-MM-DD. Use with to.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Language of names and links. Default de.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "minGuests": {
                "description": "Only venues that hold at least this many guests.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Text in the venue name, town or address, e.g. 'Schloss'.",
                "maxLength": 80,
                "type": "string"
              },
              "to": {
                "description": "Last day of a date range for published ceremony dates, YYYY-MM-DD. Use with from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "town": {
                "description": "Town or municipality, e.g. 'Aarau'.",
                "maxLength": 60,
                "type": "string"
              },
              "type": {
                "description": "office = registry office, external = outside venue.",
                "enum": ["office", "external"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find civil wedding venues in Switzerland (Trauungslokale Schweiz)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3a744d8d21045a580fd8085444fb19e67622b0cb8db83bddb2ea8d72d3897e1"
        },
        {
          "name": "get_wedding_venue",
          "title": "One wedding venue with its registry office (Trauungslokale Schweiz)",
          "description": "Details for one venue id from a venue search: address, guests, costs as published, all published dates, the responsible registry office with phone, e-mail and official page, and the source the data was read from. By zzd (traulokale.zzd.ch).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The venue id from a venue search result.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "lang": {
                "description": "Language of names and links. Default de.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "One wedding venue with its registry office (Trauungslokale Schweiz)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a2bc0706a3ca4cc28a558a8c5a22268fc60be2a1fbf6c82d4300712215a1f580"
        },
        {
          "name": "rent_reference",
          "title": "Usual rent in a Swiss canton (Mietcheck)",
          "description": "The usual net monthly rent by flat size in a Swiss canton, from the Federal Statistical Office (BFS), via Mietcheck (mietcheck.zzd.ch, free, by zzd). Give a canton or a place (postal code or municipality); with rooms and the net rent it also says whether that rent is below, within or above the usual range. A place in several cantons returns the candidates to choose from. Cantonal averages only: not street level, not legal advice. The result links the matching Mietcheck page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "canton": {
                "description": "Canton code (ZH), slug or name. Use this or place.",
                "maxLength": 40,
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer and links. Default de.",
                "enum": ["de", "fr", "en"],
                "type": "string"
              },
              "netRent": {
                "description": "Monthly NET rent in CHF (without service charges and heating). Needs rooms.",
                "maximum": 30000,
                "minimum": 100,
                "type": "number"
              },
              "place": {
                "description": "Postal code or municipality, e.g. '8001' or 'Winterthur'.",
                "maxLength": 100,
                "type": "string"
              },
              "rooms": {
                "description": "Number of rooms; 6 means 6 or more.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Usual rent in a Swiss canton (Mietcheck)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a76b3d48f8d9a96d246f3e0d12f4385cf7518e3e779d5dbf8762f1330650f317"
        },
        {
          "name": "search_grocery_prices",
          "title": "Search Swiss grocery prices (Schnäppchen Jäger)",
          "description": "Search the grocery catalogue of Schnäppchen Jäger (schnaeppchenjaeger.zzd.ch, a free Swiss price comparison by zzd) across Migros, Coop, Lidl, Aldi, Denner and Volg, plus Aligro's weekly promotions. Returns products with pack price, price per unit, offer flag, the date each price was read, and a link to each product's comparison page. Prices are the shops' online prices, not branch shelf prices. Counts as one search of the site's free daily allowance (5 a day per connection without an account; calls through Claude's connectors share 300 a day). Each product links its comparison page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of names and links. Default de.",
                "enum": ["de", "fr", "it", "en"],
                "type": "string"
              },
              "limit": {
                "description": "How many products, 1-10. Default 8.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. 'Vollmilch', 'Butter 250g'. German product names match best.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "sort": {
                "description": "Default relevance; unit-price puts the cheapest per kg/litre first.",
                "enum": ["relevance", "unit-price", "price"],
                "type": "string"
              },
              "store": {
                "description": "Only this shop.",
                "enum": ["Migros", "Coop", "Lidl", "Aldi", "Denner", "Volg", "Aligro"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Swiss grocery prices (Schnäppchen Jäger)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9830fea775e6b19979c990220accbe4de36b55e8854a99995fefa0b555c8e7cc"
        }
      ],
      "digest": "sha256:c69428320af70c2d6fff3f0d9c86e4afccec6f644426b2d20edaedab9f760e41"
    }
  }
}
