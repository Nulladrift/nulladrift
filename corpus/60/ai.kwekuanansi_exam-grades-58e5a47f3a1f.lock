        "name": "kweku-anansi-exam-grades",
        "title": "Exam Grades and Entry",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Exam Grades and Entry works out results students already have: a WASSCE or BECE aggregate in Ghana, a KCSE mean grade in Kenya, JAMB minimums and O'level credits in Nigeria, and NSC levels and pass thresholds in South Africa, from the bodies' published rules. Call a tool rather than counting from memory. Always say these are general minimums and that programmes set their own cut-offs. It does not answer exam questions.",
      "tools": [
        {
          "name": "ghana.bece_aggregate",
          "title": "BECE aggregate for senior high school placement",
          "description": "Use this when a pupil or parent in Ghana gives BECE grades and asks for the aggregate used to place them in a senior high school. It adds the four core subjects and the two strongest other subjects, as the school placement guidelines (CSSPS) state. Do not use it to say which school a pupil will get, for WASSCE grades, or to answer exam questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "english": {
                "description": "BECE grade in English Language, 1 (highest) to 9.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "integrated_science": {
                "description": "BECE grade in Integrated Science.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "mathematics": {
                "description": "BECE grade in Mathematics.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "other_subjects": {
                "description": "The grades in the other subjects, for example \"2, 3, 1, 4\". At least two.",
                "maxLength": 200,
                "type": "string"
              },
              "social_studies": {
                "description": "BECE grade in Social Studies.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["english", "integrated_science", "mathematics", "other_subjects", "social_studies"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aggregate": {
                "type": "integer"
              },
              "exam": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "how_counted": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "others_counted": {
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["aggregate", "exam", "how_counted", "note", "others_counted", "read_on", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a0c87b98a9645f5251053bbc16a4bb43bb95767da48c4bcce9f7b446462811e8"
        },
        {
          "name": "ghana.wassce_aggregate",
          "title": "WASSCE aggregate for Ghanaian universities",
          "description": "Use this when a student in Ghana gives their WASSCE grades and asks for their aggregate, or whether the grades meet a university's general entry requirement (for example \"I have English B3, Core Maths C4, Science B2, Social A1 and electives B2, B3, C5: what is my aggregate?\"). It counts the core subjects each route uses and the three strongest electives, and checks the credits and the aggregate of 24 that the University of Ghana and KNUST publish. Do not use it to predict a programme's cut-off, for grades from another examination, or to answer exam questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "core_mathematics": {
                "description": "Grade in Core Mathematics.",
                "enum": ["A1", "B2", "B3", "C4", "C5", "C6", "D7", "E8", "F9"],
                "type": "string"
              },
              "electives": {
                "description": "The grades in elective subjects, with or without the subject names, for example \"Physics B3, Chemistry C4, Biology B2, Elective Maths C6\". At least three.",
                "maxLength": 300,
                "type": "string"
              },
              "english": {
                "description": "Grade in English Language.",
                "enum": ["A1", "B2", "B3", "C4", "C5", "C6", "D7", "E8", "F9"],
                "type": "string"
              },
              "integrated_science": {
                "description": "Grade in Integrated Science. Leave out if not known.",
                "enum": ["A1", "B2", "B3", "C4", "C5", "C6", "D7", "E8", "F9"],
                "type": "string"
              },
              "social_studies": {
                "description": "Grade in Social Studies. Leave out if not known.",
                "enum": ["A1", "B2", "B3", "C4", "C5", "C6", "D7", "E8", "F9"],
                "type": "string"
              }
            },
            "required": ["core_mathematics", "electives", "english"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aggregate_non_science": {
                "type": ["integer", "null"]
              },
              "aggregate_science": {
                "type": ["integer", "null"]
              },
              "electives_counted": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "exam": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "grade_meanings": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "how_counted": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "read_on": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "universities": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["aggregate_non_science", "aggregate_science", "electives_counted", "exam", "how_counted", "note", "read_on", "sources", "universities"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
