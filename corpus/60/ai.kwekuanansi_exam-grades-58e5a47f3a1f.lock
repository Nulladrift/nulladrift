        },
        {
          "name": "nigeria.admission_minimums",
          "title": "JAMB minimum UTME score and O'level credits",
          "description": "Use this when a candidate in Nigeria gives a UTME score, O'level (WAEC or NECO) grades, or both, and asks whether they reach JAMB's national minimum for a university, polytechnic or college, or whether they have the O'level credits needed. Do not use it to give a university's or programme's own cut-off or post-UTME score, for another country's examinations, or to answer exam questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "admission_year": {
                "description": "The year of admission. Leave out for 2026.",
                "enum": [2026, 2025],
                "type": "integer"
              },
              "english": {
                "description": "O'level grade in English Language. Leave out if only a UTME score is being checked.",
                "enum": ["A1", "B2", "B3", "C4", "C5", "C6", "D7", "E8", "F9"],
                "type": "string"
              },
              "institution": {
                "description": "The kind of institution. Leave out for university.",
                "enum": ["university", "college_of_nursing", "polytechnic", "monotechnic", "college_of_agriculture", "college_of_education", "innovation_enterprise_institution"],
                "type": "string"
              },
              "mathematics": {
                "description": "O'level grade in Mathematics.",
                "enum": ["A1", "B2", "B3", "C4", "C5", "C6", "D7", "E8", "F9"],
                "type": "string"
              },
              "other_grades": {
                "description": "O'level grades in the other subjects, with or without names, for example \"Biology B3, Chemistry C5, Physics C6\".",
                "maxLength": 300,
                "type": "string"
              },
              "utme_score": {
                "description": "The UTME score. Leave out if only O'level grades are being checked.",
                "maximum": 400,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "explore_url": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "olevel": {
                "type": "object"
              },
              "read_on": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "utme": {
                "type": "object"
              }
            },
            "required": ["note", "read_on", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
