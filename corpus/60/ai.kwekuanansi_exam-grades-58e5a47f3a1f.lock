            "readOnly": true
          },
          "digest": "sha256:cc552387984ed8abdb5a94107d1b10e8759c10512ce56f08a5ef7e91d685e6f3"
        },
        {
          "name": "kenya.kcse_mean_grade",
          "title": "KCSE mean grade and KUCCPS minimums",
          "description": "Use this when a student in Kenya gives their KCSE subject grades and asks for their mean grade, total points, or whether they reach the minimum for a degree, diploma or certificate through KUCCPS. It counts Mathematics, the better of English and Kiswahili, and the five strongest others, as KNEC's regulations state. Do not use it for a programme's cluster points or cut-off, for grades from another examination, or to answer exam questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "english": {
                "description": "Grade in English.",
                "enum": ["A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "E"],
                "type": "string"
              },
              "kiswahili": {
                "description": "Grade in Kiswahili (or Kenyan Sign Language).",
                "enum": ["A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "E"],
                "type": "string"
              },
              "mathematics": {
                "description": "Grade in Mathematics.",
                "enum": ["A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "E"],
                "type": "string"
              },
              "other_subjects": {
                "description": "The grades in the other subjects, separated by commas, for example \"B+, A-, C+, B, C\". At least four.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["english", "kiswahili", "mathematics", "other_subjects"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "exam": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "how_counted": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mean_grade": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "placement_minimums": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "reaches_minimum_for": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "subjects_counted": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "total_points": {
                "type": "integer"
              }
            },
            "required": ["exam", "how_counted", "mean_grade", "note", "reaches_minimum_for", "read_on", "sources", "subjects_counted", "total_points"],
            "type": "object"
          },
