          "digest": "sha256:f59da32b7dd2344971a6d1f23ce7ff6fdc91a64dd03af91ccba951a3b19ba321"
        },
        {
          "name": "south_africa.nsc_results",
          "title": "NSC (matric) levels and pass type thresholds",
          "description": "Use this when a learner in South Africa gives their matric (NSC) percentages and asks what achievement levels they are, whether the marks meet the thresholds for a Bachelor's, Diploma or Higher Certificate pass, or for an APS. It checks the published mark thresholds; it cannot see the subject choices the full rules also depend on, and says so. Do not use it for IEB or another examination, for a university's own admission score other than the one it names, or to answer exam questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "home_language": {
                "description": "The percentage in the home language.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "language_of_teaching": {
                "description": "The percentage in the language a university teaches in (English or Afrikaans) when that is not the home language. Leave out when it is the home language.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "life_orientation": {
                "description": "The percentage in Life Orientation, shown for its level only. Leave out if not known.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "other_subjects": {
                "description": "The percentages in the other subjects, leaving out the home language and Life Orientation, for example \"55, 62, 48, 71, 50\". Usually five.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["home_language", "other_subjects"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aps_university_of_pretoria": {
                "type": ["integer", "null"]
              },
              "exam": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "levels": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "not_checked": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "pass_types": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "read_on": {
                "type": "string"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["aps_university_of_pretoria", "exam", "levels", "not_checked", "note", "pass_types", "read_on", "sources"],
            "type": "object"
          },
