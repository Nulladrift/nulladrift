        {
          "name": "grades.scale",
          "title": "What a grade means in WASSCE, BECE, KCSE or NSC",
          "description": "Use this when someone asks what a grade or level means, or for the whole grading scale, in WASSCE, Ghana's BECE, Kenya's KCSE or South Africa's NSC (for example \"is C6 a credit?\" or \"what is level 4 in matric?\"). Do not use it to work out an aggregate or mean grade: use the examination's own tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exam": {
                "description": "The examination.",
                "enum": ["wassce", "bece", "kcse", "nsc"],
                "type": "string"
              },
              "grade": {
                "description": "One grade or level to explain, for example \"C6\", \"B-\" or \"4\". Leave out for the whole scale.",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["exam"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asked": {
                "type": "object"
              },
              "exam": {
                "type": "string"
              },
              "explore_url": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "read_on": {
                "type": "string"
              },
              "scale": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "sources": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["exam", "note", "read_on", "scale", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
