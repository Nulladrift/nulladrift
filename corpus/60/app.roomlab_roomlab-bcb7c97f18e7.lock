      "instructions": "RoomLab provides one customer-facing tool for each mode in the RoomLab workspace. Choose the exact mode the user requested; never combine modes or discuss RoomLab’s internal implementation. Do not ask for technical generation settings. Ask only for required creative choices that are missing, and do not ask for optional settings when the request is already clear. Creation tools consume RoomLab credits. Video tools return a generation ID while RoomLab works; the result card checks it automatically, or call get_generation again shortly when no card is available.",
