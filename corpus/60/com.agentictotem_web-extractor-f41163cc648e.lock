{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentictotem/web-extractor": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentictotem.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "AgenticTotem",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "web_extract",
          "description": "Extract structured data from web pages. Send 1-10 URLs and a JSON Schema describing the data shape you want. Returns extracted data for each URL. Costs $0.01 USDC per URL via x402 or MPP.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "schema": {
                "additionalProperties": {},
                "description": "JSON Schema with type \"object\" and properties describing desired output shape",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "urls": {
                "description": "URLs to extract data from (http/https only)",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["schema", "urls"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0ed6932e54f8da56e54ef55aa346871da40806db8c32ec32dc580c9dc2c4ce27"
        }
      ],
      "digest": "sha256:cddaa6bbbaac33822e595b2b247ba97456fe4d3d3308745f196c82dcc32abcf7"
    }
  }
}
