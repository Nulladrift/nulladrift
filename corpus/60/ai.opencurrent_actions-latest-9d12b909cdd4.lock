{
  "lockfileVersion": 2,
  "subjects": {
    "ai.opencurrent/actions-latest": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opencurrent.ai/mcp/actions"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "actions-latest",
        "title": "GitHub Actions Version Check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Before writing a GitHub Actions workflow, check the current major version of each action you use (e.g. actions/checkout, actions/setup-node). Models often write outdated majors like @v3. Data: GitHub releases and tags, cached up to 1 hour.",
      "tools": [
        {
          "name": "check_action",
          "title": "Check a workflow uses: line",
          "description": "Compare a `uses:` value (e.g. actions/checkout@v3) with the action's latest release: majors behind and the tag to use.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "uses": {
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["uses"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "latest": {
                "type": "string"
              }
            },
            "required": ["latest"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97d901208e3f515af2f16edeb154633b8336ffa1db74fb5943878393e69c02f5"
        },
        {
          "name": "latest_action",
          "title": "Latest version of a GitHub Action",
          "description": "Latest release tag and major tag (e.g. v6) of an action like actions/checkout.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "description": "owner/repo, e.g. actions/setup-node",
                "maxLength": 140,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "latest": {
                "type": "string"
              }
            },
            "required": ["latest"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56503ac1e2026c8aaa0a94731ceb5bad254e912ef63c8879f2056856c9da97f1"
        }
      ],
      "digest": "sha256:ed941a82a963d908a0f5e98c0ed55e9bc7e7bd39314f8b8589694581e62cc3a4"
    }
  }
}
