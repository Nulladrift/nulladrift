        },
        {
          "name": "create_job",
          "title": "Create a job (start registration)",
          "description": "Step 1. Register your webhook and schedule (no account, no API key). Returns job_id and a one-time setup_token, and POSTs a url_verification challenge to webhook_url. Your webhook must answer it (echo: reply 2xx {\"challenge\":\"<same>\"}) — then call claim_credentials. Or reply 2xx and call verify_challenge with the value (callback). Nothing triggers before verification. (REST: POST /v1/jobs)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "catchup_policy": {
                "enum": ["skip", "run_once", "run_all"],
                "type": "string"
              },
              "catchup_window_sec": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "max_runs": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Complete after this many dispatched runs; null = unlimited."
              },
              "name": {
                "type": ["string", "null"]
              },
              "outgoing_auth": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "header": {
                        "description": "Authorization (default) or an X-… header name (not X-Cronjob-…).",
                        "type": "string"
                      },
                      "value": {
                        "description": "Header value (1 … 4096 chars, no CR/LF), e.g. \"Bearer <token>\". Secret: stored encrypted, never shown back.",
                        "type": "string"
                      }
                    },
                    "required": ["value"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional header your webhook requires (e.g. a Grok routine webhook that needs Authorization). Sent on the url_verification POST and every trigger; never overrides the X-Cronjob-* headers."
              },
              "payload": {
                "additionalProperties": {},
                "description": "Sent unchanged in every trigger (≤ 8 KB).",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "retry_base_sec": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "retry_max_attempts": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "retry_max_backoff_sec": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "schedule": {
                "additionalProperties": false,
                "description": "Exactly one of {cron, timezone?}, {interval_sec}, {run_at}. Minimum spacing 60 s.",
                "properties": {
                  "cron": {
                    "description": "5-field cron or @hourly/@daily/@weekly/@monthly/@yearly",
                    "type": "string"
                  },
                  "interval_sec": {
                    "description": "60 … 31622400",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "run_at": {
                    "description": "ISO 8601 with Z or an offset, in the future (one-off)",
                    "type": "string"
                  },
                  "timezone": {
                    "description": "IANA zone for cron, default UTC",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "signature_in_body": {
                "description": "Default false. true = every trigger body also carries cronjob_signature {version, timestamp, delivery_id, signatures[], signature} (HMAC over \"v1b:{timestamp}:{delivery_id}:\" + canonical JSON of the body without cronjob_signature). Use it when your webhook platform drops the X-Cronjob-* headers (e.g. Grok Bot routines).",
                "type": "boolean"
              },
              "timeout_ms": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "verification_mode": {
                "description": "Informational; both answers work. Default echo.",
                "enum": ["echo", "callback"],
                "type": "string"
              },
              "webhook_url": {
                "description": "Public https URL of your agent. It receives the challenge now and the signed triggers later.",
                "type": "string"
              }
            },
            "required": ["schedule", "webhook_url"],
            "type": "object"
          },
