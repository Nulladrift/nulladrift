      },
      "instructions": "agent-cronjob triggers YOUR webhook on a schedule (cron / interval / one-off): HMAC-signed, retried with exponential backoff, every run logged. No account or API key.\n\nFlow:\n1. create_job {webhook_url, schedule} → job_id + setup_token (keep it private). We immediately POST {\"type\":\"url_verification\",\"challenge\":\"…\"} to webhook_url.\n2. Prove you control the webhook — either\n   - echo: your webhook replies 2xx {\"challenge\":\"<same value>\"}; or\n   - callback: your webhook replies 2xx, then call verify_challenge {job_id, challenge}.\n   Deadline 1 (verify): 15 minutes after job creation — unverified jobs are deleted; re-sends do not extend it. Not received? retry_challenge.\n3. Credentials, SHOWN ONCE: in the verify_challenge result (callback) or the first claim_credentials {job_id, setup_token} result after echo verification. Store hmac_secret and management_token in your secret store immediately; they cannot be shown again (rotate_secret / rotate_token instead). Deadline 2 (collect credentials): 15 minutes after verification — uncollected jobs are deleted.\n4. Triggers arrive as POSTs with X-Cronjob-Signature: v1=hex(HMAC-SHA256(hmac_secret, \"v1:{X-Cronjob-Timestamp}:{X-Cronjob-Delivery-Id}:{raw body}\")). Verify it, de-duplicate on delivery_id, reply 2xx (others are retried; 410 pauses the job).\n5. Manage with management_token (tool argument, or Authorization: Bearer on the MCP HTTP request): get_job, list_jobs, pause_job, resume_job, delete_job, get_deliveries (run history: scheduled vs actual time, delay, response code), get_run, get_stats.\n\nYour webhook must be a public https URL (private/loopback addresses are refused). Same rate limits as the REST API (https://cronjob.agentasy.ai/v1). Full guide: resource how_it_works (https://cronjob.agentasy.ai/llms.txt). Entry point for plain HTTP agents: https://new-cronjob.agentasy.ai/.",
      "tools": [
        {
          "name": "claim_credentials",
          "title": "Poll verification / collect credentials",
          "description": "Step 3. Poll verification state with the setup_token. The first call after the webhook is verified returns hmac_secret (signs triggers) and management_token (manages the job) — SHOWN ONCE, store them now; later calls say credentials: \"already_issued\". (REST: GET /v1/jobs/{id}/verification)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "job_<ULID> returned by create_job",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "setup_token": {
                "description": "act_st_… setup token from create_job. Optional if the MCP HTTP request carries Authorization: Bearer <setup_token>.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Poll verification / collect credentials"
          },
