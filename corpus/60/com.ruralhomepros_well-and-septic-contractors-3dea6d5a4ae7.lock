      "instructions": "Rural Home Pros: Find a water-well driller or septic contractor near you. Checked facts on services, emergency service, and estimates. Read-only. search_listings finds businesses with the filters of the site; get_listing returns every fact with the page it comes from and the date it was checked. Link the listing URL when you use a fact.",
