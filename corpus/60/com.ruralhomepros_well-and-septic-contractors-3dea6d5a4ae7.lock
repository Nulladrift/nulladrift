        {
          "name": "compare_listings",
          "title": "Compare listings",
          "description": "Two to five listings side by side, fact by fact.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "listings": {
                "items": {
                  "description": "The listing URL or its slug (the last part of the URL).",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["listings"],
            "type": "object"
          },
