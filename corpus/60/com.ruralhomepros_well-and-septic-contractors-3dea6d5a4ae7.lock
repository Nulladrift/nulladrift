        {
          "name": "search_listings",
          "title": "Search listings",
          "description": "Find listings of Rural Home Pros with the filters of the site, 20 per page, most checked facts first. list_categories names the filters and values of each category.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category, default: well-drillers",
                "enum": ["well-drillers", "septic-contractors"],
                "type": "string"
              },
              "filters": {
                "additionalProperties": false,
                "properties": {
                  "emergency_service": {
                    "description": "24/7 emergency service",
                    "type": "boolean"
                  },
                  "family_owned": {
                    "description": "Family owned",
                    "type": "boolean"
                  },
                  "financing": {
                    "description": "Financing offered",
                    "type": "boolean"
                  },
                  "free_estimates": {
                    "description": "Free estimates",
                    "type": "boolean"
                  },
                  "ngwa_member": {
                    "description": "NGWA member or certified",
                    "type": "boolean"
                  },
                  "services": {
                    "description": "Services: any of these values",
                    "items": {
                      "enum": ["well_drilling", "well_pump", "well_inspection", "water_treatment", "geothermal", "well_abandonment", "septic_install", "septic_pumping", "septic_inspection", "septic_repair", "aerobic_systems", "excavation"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text: a name or a word",
                "type": "string"
              },
              "sort": {
                "enum": ["relevance", "name", "checked"],
                "type": "string"
              },
              "where": {
                "description": "A place: town, region, or state (a part of the name is enough)",
                "type": "string"
              }
            },
            "type": "object"
          },
