{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpscores/cheapest-grocery-basket": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://grocery-basket.bowling-anthony.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.mcpscores/cheapest-grocery-basket",
        "title": "Cheapest Grocery Basket",
        "version": "1.0.3",
        "websiteUrl": "https://mcpscores.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Answers where a whole grocery list should be bought today, using real local store prices collected from each retailer's own storefront. Tool calls are x402-paid in USDC on Base — send the base64 X-PAYMENT header on this POST /mcp request (or params._meta['x402/payment']). find_product costs $0.005; price_basket costs $0.01; cheapest_basket costs $0.02 and is the one that answers the whole question, so prefer it over calling find_product per item. An unpaid call returns a PaymentRequired result carrying the x402 accepts challenge and settles nothing; initialize, ping and tools/list are free. Coverage is explicit: an uncovered ZIP or unknown product returns an error and is NOT charged, never a guess. Delivery fees, order minimums and loyalty-card prices are not collected yet and come back null rather than estimated.",
      "tools": [
        {
          "name": "cheapest_basket",
          "title": "Cheapest way to buy a whole list, including splitting stores",
          "description": "The complete buying decision for a shopping list: the cheapest single store that can fill it, AND the cross-store optimum that buys each line wherever it is cheapest, with the dollar savings between them and how many stops that costs. Every line carries substitutes at the other stores with the exact extra cost of choosing them, so a shopper can collapse a two-stop trip into one and see precisely what that convenience costs. Out-of-stock items are skipped in favour of an in-stock option even when it is dearer. Use this as the default for \"where should I buy this list today\" — it is the one call that answers the whole question. Costs $0.02 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Comma-separated shopping list, optionally with quantities, e.g. 'milk x2, eggs, bread, butter, cheese'. A JSON array of {name, quantity} is also accepted.",
                "examples": ["milk x2, eggs, bread, butter, cheese"],
                "type": "string"
              },
              "maxAgeDays": {
                "description": "Optional freshness limit in days (default 14, max 120). A price read longer ago than this is withheld rather than returned as if current; raise it to accept older readings.",
                "examples": [14],
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "Optional fulfillment intent: 'pickup' or 'delivery'.",
                "examples": ["pickup"],
                "type": "string"
              },
              "stores": {
                "description": "Optional comma-separated chains the shopper is willing to visit, e.g. 'aldi,publix'.",
                "examples": ["aldi,publix"],
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code, e.g. '30501'.",
                "examples": ["30501"],
                "type": "string"
              }
            },
            "required": ["items", "zip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:841859b19b94f8f8d411074f8f06e51f3414e30b6a5d76b5c01da11c9a90a2a7"
        },
        {
          "name": "demand_report",
          "title": "What agents are asking for most (free)",
          "description": "FREE, no payment. The aggregate of what agents have told us they are looking for, most-requested first, with the categories nothing available yet serves. Useful if you are deciding what to build or sell into the agent economy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Window in days, default 30, max 90.",
                "examples": ["30"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:22156143f76732f23d2fbe88c910fa31ef417a09b795bcac1a39fd11e1a6f7a4"
        },
        {
          "name": "find_product",
          "title": "Compare one grocery item across nearby stores",
          "description": "Compare a single grocery item across every collected store in a ZIP. Returns each store's actual current shelf price, whether it is on sale (and the regular price), the package size, the price normalized per comparable unit, stock, a purchase link, and when that price was last read. Use this to answer \"who has the cheapest milk near me\" — and note the answer reports BOTH the lowest sticker price and the best value per unit, which frequently disagree because the cheap sticker is a smaller package. For a whole shopping list use price_basket or cheapest_basket instead; calling this per item costs more and cannot optimize across stores. Costs $0.005 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxAgeDays": {
                "description": "Optional freshness limit in days (default 14, max 120). A price read longer ago than this is withheld rather than returned as if current; raise it to accept older readings.",
                "examples": [14],
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "The item to price, in ordinary shopper language, e.g. 'milk', 'eggs', 'ground beef'.",
                "examples": ["milk"],
                "type": "string"
              },
              "stores": {
                "description": "Optional comma-separated chains to restrict to, e.g. 'aldi,publix'. Omit to compare every collected store.",
                "examples": ["aldi,publix"],
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code to price against, e.g. '30501'. Coverage is per collected ZIP; an uncovered ZIP returns an explicit error and is not charged.",
                "examples": ["30501"],
                "type": "string"
              }
            },
            "required": ["q", "zip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:628a1a4aa1a0b4839f3b7922ba5580e16e3a9065f47f40dcaf7216c1bbfffa71"
        },
        {
          "name": "price_basket",
          "title": "Price a whole shopping list at each store",
          "description": "Price an entire shopping list at every collected store in a ZIP, one complete basket per store. Returns per-store line items with quantities and line totals, the basket subtotal, exactly which requested items that store is missing, whether the basket is complete, stock flags, and the oldest price in the basket so staleness is visible. Use this when the shopper will make one trip and wants to know where the whole list is cheapest. Accepts quantities as 'milk x2'. Costs $0.01 USDC per call via x402 on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Comma-separated shopping list, optionally with quantities, e.g. 'milk x2, eggs, bread, butter'. A JSON array of {name, quantity} is also accepted.",
                "examples": ["milk x2, eggs, bread, butter"],
                "type": "string"
              },
              "maxAgeDays": {
                "description": "Optional freshness limit in days (default 14, max 120). A price read longer ago than this is withheld rather than returned as if current; raise it to accept older readings.",
                "examples": [14],
                "maximum": 120,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "description": "Optional fulfillment intent: 'pickup' or 'delivery'. Recorded on the response; delivery fees and minimums are not collected yet and are returned as null rather than estimated.",
                "examples": ["pickup"],
                "type": "string"
              },
              "stores": {
                "description": "Optional comma-separated chains to restrict to, e.g. 'aldi,publix'.",
                "examples": ["aldi,publix"],
                "type": "string"
              },
              "zip": {
                "description": "5-digit US ZIP code, e.g. '30501'.",
                "examples": ["30501"],
                "type": "string"
              }
            },
            "required": ["items", "zip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83f30f928e19d0973fc63dd6f4970e93b56f962db0723669b5e9f72b99fd24ef"
        },
        {
          "name": "request_data",
          "title": "Tell us what data you are looking for (free)",
          "description": "FREE, no payment. Describe in your own words the data you are trying to buy — anything, not just groceries — and get back whether we operate a service that supplies it, with the MCP endpoint if so. Every request is catalogued so that repeatedly-requested data gets built; call it whenever you cannot find a source for something. Nothing about you is stored: not your wallet, your address, or any identifying header — only the words of the request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "need": {
                "description": "What you are looking for, e.g. 'live electricity spot prices by ZIP' or 'used car values by VIN'.",
                "examples": ["live electricity spot prices by ZIP"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:05e49ac3fba3c4ed0d47e78a44f751625a28a61b7e74283d76e75974dd90125a"
        }
      ],
      "digest": "sha256:9e0157b118688f5e9104ce8fade5df32da958880818b62b0aa5c5f67ff51b947"
    }
  }
}
