      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Pure, bounded analysis of an explicit bill-of-materials graph: validates structure, finds missing references, duplicate IDs, duplicate edges, and cycles (whole graph, even parts unreachable from the root), and - when the graph is completely clean - exactly explodes root quantity through every assembly level with exact-decimal arithmetic, aggregating shared components reached via different branches. No network access and no manufacturing/supplier certification: this checks the data you supply, not the real world. Tool calls cost 0.05 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Supplied-data only: no network calls, no supplier/manufacturing certification, no real-world verification of parts. Input capped at 128 KiB, JSON depth <=12, JSON nodes <=20000. IDs (part and component) <=128 chars and nonblank; unit <=64 chars. Quantities must be positive exact decimals: <=12 integer digits, <=6 fraction digits. At most 500 parts, 100 components per part, 2000 total component edges. Reachable depth from root capped at 20 levels; exceeding it is reported, not silently truncated into the result. Cycles are detected across the whole submitted graph, including parts unreachable from root, and are reported (bounded to one representative cycle per strongly connected component). Reported issues and cycles are each capped at 200 with explicit truncation metadata if the cap is hit. Explosion (the exploded quantity table) is returned only when the whole graph has zero reported issues; any issue anywhere - even in an unreachable part - conservatively nulls the explosion. Exact arithmetic uses reduced BigInt fractions; a result requiring more than 300 combined numerator/denominator digits is refused as a reported issue instead of silently rounded. Duplicate component references within the same assembly are reported and are not double-counted. Results at most 96 KiB; retry identical input and authorization within 24 hours to recover a purchase.",
      "tools": [
        {
          "name": "bill_of_materials_integrity",
          "description": "Pure, bounded analysis of an explicit bill-of-materials graph: validates structure, finds missing references, duplicate IDs, duplicate edges, and cycles (whole graph, even parts unreachable from the root), and - when the graph is completely clean - exactly explodes root quantity through every assembly level with exact-decimal arithmetic, aggregating shared components reached via different branches. No network access and no manufacturing/supplier certification: this checks the data you supply, not the real world. Price: 0.05 USDC per completed bounded job on Base.",
