                            "minLength": 1,
                            "type": "string"
                          },
                          "quantity": {
                            "pattern": "^(?!0+(?:\\.0{1,6})?$)\\d{1,12}(\\.\\d{1,6})?$",
                            "type": "string"
                          }
                        },
                        "required": ["part_id", "quantity"],
                        "type": "object"
                      },
                      "maxItems": 100,
                      "type": "array"
                    },
                    "id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "unit": {
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["id", "unit"],
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              },
              "quantity": {
                "description": "Positive exact decimal, <=12 integer digits, <=6 fraction digits.",
                "pattern": "^(?!0+(?:\\.0{1,6})?$)\\d{1,12}(\\.\\d{1,6})?$",
                "type": "string"
              },
              "root": {
                "description": "ID of the part to explode from. Must match one of parts[].id.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["parts", "quantity", "root"],
            "type": "object"
          },
