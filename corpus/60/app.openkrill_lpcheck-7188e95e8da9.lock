            "additionalProperties": false,
            "description": "Send pool_id alone, or chain plus token_a and token_b, for example {\"chain\": \"ethereum\", \"token_a\": \"WETH\", \"token_b\": \"USDC\"}. pool_address alone always returns needs_tokens.",
