        {
          "name": "estimate_lp",
          "title": "Estimate fees versus impermanent loss",
          "description": "Estimate fees versus impermanent loss. Use this when the user gives numbers for a what-if and wants to know whether swap fees cover impermanent loss, gas, and exit cost. It needs no pool and reads no live data. Pass price_now, holding_days, and fee_apr_percent, for example price_now 2500, holding_days 14, fee_apr_percent 40. Add price_lower and price_upper for a concentrated range, or omit both for the full-range formula. Optionally pass price_later, capital_usd, gas_usd, and exit_cost_usd. Returns the formula, the fee fraction, the impermanent loss fraction, whether fees cover it and the costs you passed, a plain break-even price line, and break-even prices from a sample. It does not look up gas or recommend a position. To read a real pool's volume and fee APR, use check_pool.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "fee_apr_percent": 20,
                "holding_days": 30,
                "price_later": 110,
                "price_lower": 80,
                "price_now": 100,
                "price_upper": 120
              }
            ],
            "properties": {
              "capital_usd": {
                "description": "Position size, so gas and exit cost can be turned into a fraction of the position",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "exit_cost_usd": {
                "description": "Other exit cost. Not looked up",
                "minimum": 0,
                "type": "number"
              },
              "fee_apr_percent": {
                "description": "Annualized fee APR in percent, not a fraction: 40 means 40%. For example the 1-day fee APR from check_pool",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "gas_usd": {
                "description": "Gas you expect to pay. Not looked up",
                "minimum": 0,
                "type": "number"
              },
              "holding_days": {
                "description": "How many days the fee APR is applied, a whole number from 1 to 365, such as 14",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "price_later": {
                "description": "A later price to score. Omit to get break-even prices and the range edges only",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "price_lower": {
                "description": "Lower bound of a concentrated range. Omit, with price_upper, for the full-range formula",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "price_now": {
                "description": "Current price, quote token per base token, such as 2500 for ETH in USDC",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "price_upper": {
                "description": "Upper bound of a concentrated range",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["fee_apr_percent", "holding_days", "price_now"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Bad input, such as a price of 0 or price_lower above price_upper, is refused with invalid_input and a message instead of this shape",
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "break_even_line": {
                "type": "string"
              },
              "break_even_prices": {
                "description": "Later prices where the net result crosses zero, from a sample",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "cost_fraction": {
