        {
          "name": "find_active_pools",
          "title": "Find pools with volume and fees",
          "description": "Use this when the user wants pools across chains or DEXes with recent volume and a fee rate, such as \"high fee pools on Base with real volume\". All arguments are optional: chains, min_volume_usd_1d (default 50000), min_fee_percent (default 0.05), and limit (default 5, at most 8). Returns each pool's id, volume, TVL, fee rate, 1-day and 7-day fee APR, and an APR flag with its reason, highest 1-day fee APR first. A small pool with a one-day volume spike can rank first, so check tvl_usd and apr_flag before you lead with it, or raise min_volume_usd_1d. It does not read token contracts or the current tick. Call check_pool with a returned pool_id for token flags and the risk checklist.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "chains": ["base"],
                "min_fee_percent": 0.3,
                "min_volume_usd_1d": 100000
              }
            ],
            "properties": {
              "chains": {
                "description": "Optional chain names, such as [\"base\"] or [\"ethereum\", \"arbitrum\"]. Supported: ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, solana, zksync, linea, gnosis, scroll, mantle, celo, sonic, or sui. Omit to scan every chain in the index",
                "items": {
                  "maxLength": 40,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "limit": {
                "description": "How many pools to return, at most 8. Default 5",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "min_fee_percent": {
                "description": "Minimum swap fee in percent, not a fraction: 0.3 means 0.3%. Read from pool metadata. Default 0.05",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "min_volume_usd_1d": {
                "description": "Minimum 1-day volume in USD. Default 50000. Raise it, for example to 1000000, to skip small pools with a one-day spike",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "fee_apr_formula": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "pools": {
                "description": "Pools ranked by 1-day fee APR, highest first. Check tvl_usd and apr_flag before leading with one",
                "items": {
                  "properties": {
                    "apr_flag": {
                      "description": "real: steady trading. spike: a short burst, not a steady rate. unconfirmed: no 7-day comparison, do not call it real",
                      "enum": ["real", "spike", "unconfirmed"],
                      "type": "string"
                    },
                    "apr_flag_reason": {
                      "type": "string"
                    },
                    "chain": {
                      "type": "string"
                    },
                    "exposure": {
                      "type": ["string", "null"]
                    },
                    "fee_rate": {
                      "description": "Swap fee as a fraction, not a percent: 0.003 means 0.3%. Read from pool_meta",
                      "minimum": 0,
                      "type": ["number", "null"]
                    },
                    "il_risk": {
                      "type": ["string", "null"]
                    },
                    "pool_id": {
                      "type": "string"
                    },
                    "pool_meta": {
                      "description": "DefiLlama pool label, often the fee tier such as \"0.3%\"",
                      "type": ["string", "null"]
                    },
                    "project": {
                      "type": "string"
                    },
                    "published_apy": {
                      "properties": {
                        "apy": {
                          "type": ["number", "null"]
                        },
                        "apy_base": {
                          "type": ["number", "null"]
                        },
                        "apy_base_7d": {
                          "type": ["number", "null"]
                        },
                        "apy_reward": {
                          "type": ["number", "null"]
                        },
                        "outlier": {
                          "type": "boolean"
                        }
                      },
                      "required": ["apy", "apy_base", "apy_base_7d", "apy_reward", "outlier"],
                      "type": "object"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "tokens": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "tvl_usd": {
                      "description": "Total value locked in the pool, in USD",
                      "type": ["number", "null"]
                    },
                    "windows": {
                      "properties": {
                        "fee_apr_percent_1d": {
                          "description": "Fee APR in percent from 1-day volume: volume x fee_rate x 365 / TVL x 100",
                          "type": ["number", "null"]
                        },
                        "fee_apr_percent_7d": {
                          "description": "Fee APR in percent from 7-day volume, annualized the same way",
                          "type": ["number", "null"]
                        },
                        "volume_usd_1d": {
                          "description": "Trading volume over the last day, in USD",
                          "type": ["number", "null"]
                        },
                        "volume_usd_7d": {
                          "description": "Trading volume over the last 7 days, in USD",
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["fee_apr_percent_1d", "fee_apr_percent_7d", "volume_usd_1d", "volume_usd_7d"],
                      "type": "object"
                    }
                  },
                  "required": ["apr_flag", "apr_flag_reason", "chain", "fee_rate", "pool_id", "project", "published_apy", "symbol", "tokens", "tvl_usd", "windows"],
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "sources": {
                "items": {
                  "properties": {
                    "as_of": {
                      "description": "ISO 8601 UTC time of the yields index read, or null when nothing was read",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["as_of", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "unavailable: the yields index could not be read; try again later",
                "enum": ["ok", "unavailable"],
                "type": "string"
              }
            },
            "required": ["as_of", "count", "notice", "pools", "source", "sources", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
