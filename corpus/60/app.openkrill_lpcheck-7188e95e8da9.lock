                "description": "Chain name or short alias, used with token_a and token_b: ethereum, base, arbitrum, optimism, polygon, bsc, avalanche, solana, zksync, linea, gnosis, scroll, mantle, celo, sonic, or sui. Aliases such as eth, arb, op, bnb, matic, avax, and sol also work",
