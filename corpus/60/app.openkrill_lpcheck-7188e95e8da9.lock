      "instructions": "LP Pool Check: Pool fees and impermanent loss. Use these tools to read public liquidity-pool figures. Call check_pool for one real pool: a DefiLlama pool id, or chain plus token_a and token_b (symbols or token addresses). Call find_active_pools to scan chains for pools with recent volume and a fee rate. Call estimate_lp for a pure what-if with no pool: a price range or later price, a holding period, and a fee APR. Always show the APR flag and its reason, the risk checklist warnings, the as_of time, and the not-financial-advice notice. Every answer has a message that says what to pass next when the call did not find one pool. Follow it. status needs_tokens: a pool contract address is not in the open index, so ask for the two token addresses or a pool id, and do not invent a match. status ambiguous: the symbols match different tokens, listed in other_tiers. Show them, or call check_pool again with one pool_id from other_tiers. status not_found: the pair, id, or chain is not in the index. Say so and ask for another chain or the token addresses. status unavailable: a source did not answer. Say so, do not fill in numbers, and try again later. apr_flag unconfirmed means the 7-day comparison is missing: do not call it real trading. find_active_pools ranks by 1-day fee APR, so a small pool with a one-day spike can come first. Check tvl_usd and apr_flag before you lead with a pool. position_type and risk warnings are labels and readings, not advice to enter or leave a position. Not financial advice: do not recommend buying, selling, or providing liquidity, and do not claim fees will be earned. Credit DefiLlama and, when token flags are present, GoPlus. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "check_pool",
          "title": "Check one liquidity pool",
          "description": "Use this when the user asks about one real liquidity pool, such as \"volume and fee APR for WETH and USDC on Ethereum\" or \"is this pool APR a spike?\". Pass pool_id (a DefiLlama UUID), or chain plus token_a and token_b, for example chain \"ethereum\", token_a \"WETH\", token_b \"USDC\". Do not try pool_address first: the open index has no pool contract addresses, so it always returns needs_tokens. Returns 1-day and 7-day volume and fee APR, TVL, an APR flag with a reason, a risk checklist with warnings, price trend, token risk flags when a public source covers them, and an informational position-type label. Symbols for one token pair with several fee tiers or exchanges return the highest-TVL pool, with the others in other_tiers. Symbols that match different tokens return status ambiguous. The optional range fields (price_lower, price_upper, price_now, holding_days, capital_usd, gas_usd, exit_cost_usd) add the same fee-versus-impermanent-loss estimate as estimate_lp, at this pool's fee APR. For a pure what-if with no pool, use estimate_lp.",
