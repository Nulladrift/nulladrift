      },
      "instructions": "No sign-in required; works with any MCP client. lansary_search_companies, lansary_coverage and lansary_company_availability are free. The first 3 company-record calls (synthesis, claims, raw evidence, relationships) per UTC day per client IP are free; the result carries a free_allowance object. After that each call costs $0.01 USDC on Base (eip155:8453) via x402 v2: called without payment it returns isError with the x402 PaymentRequired object in structuredContent; retry the same call with params._meta[\"x402/payment\"] set to the PaymentPayload, or with the payment_signature argument (base64 PAYMENT-SIGNATURE value). Unknown companies return not-found and are never charged. Optional OAuth sign-in (any client, S256 PKCE) gives five free company briefs per month on the signed-in tools. The same records are sold over REST at https://mcp.lansary.com/agent/v1.",
      "tools": [
        {
          "name": "lansary_company_availability",
          "title": "Check what is held (free)",
          "description": "Free preflight: which sections and evidence Lansary holds for a company before paying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "entity_ref": {
                "description": "entity_ref returned by lansary_search_companies; used if reference_token is absent.",
                "maxLength": 180,
                "minLength": 3,
                "type": "string"
              },
              "reference_token": {
                "description": "reference_token returned by lansary_search_companies.",
                "pattern": "^[A-Za-z0-9_-]{2,400}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
