{
  "lockfileVersion": 2,
  "subjects": {
    "com.klengnest/catalogue": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://klengnest.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "klengnest",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "klengnest_get_decision",
          "title": "Get one decision with its options",
          "description": "What to look for, how many to buy, the safety notes, and the options ranked on their own merits (no personal answers). For clothing, size_plan gives how many per size; a null count means no source gives one. A decision with no products says what to look for instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "decision_key": {
                "description": "From klengnest_list_categories, e.g. \"11-clothing/bodysuits\"",
                "type": "string"
              }
            },
            "required": ["decision_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ae9ac3fd75777de6287fe92b9618969d5e282307b408c521c143bb3a0a82565"
        },
        {
          "name": "klengnest_get_product",
          "title": "Get a product in full",
          "description": "Everything recorded about one product: prices with where they came from, availability by market, reviews and tests, and evidence_gaps, the things nobody has checked yet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product_id": {
                "description": "From search or a decision, e.g. \"cybex-cloud-t\"",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21a7fd700ce5724b35d6e135acedcf0b37096cf46ea73e9fadaf97bfa3d19fca"
        },
        {
          "name": "klengnest_list_categories",
          "title": "List categories and decisions",
          "description": "Every category of baby gear and the decisions inside it (e.g. \"01-stroller/stroller\"). Start here to find a decision_key for the other tools. kind is product_choice (ranked options), commodity (brand does not matter), fit_dependent or clinician_led.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ee8e3fde9f1bdcadfa5a597fee3205f007a176a49af418a1c77c913420d8086"
        },
        {
          "name": "klengnest_search_products",
          "title": "Search products",
          "description": "Find products by name or brand, optionally within a category or under a price. Products with no known price are included unless max_price_eur is set.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category_id": {
                "description": "e.g. \"02-car-travel\"",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_eur": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to match in the name or brand, e.g. \"cybex\" or \"sleeping bag\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6a625f9a166c8baa70fd2bdd7b835e498b4da8f2936fdb6f4d5c0f9b0c96405"
        }
      ],
      "digest": "sha256:cf2630dcb5788cf44a33c27054a6c84b2ee1cc20693c968d3ccb0c2cf296342b"
    }
  }
}
