      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "klengnest",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "klengnest_get_decision",
          "title": "Get one decision with its options",
          "description": "What to look for, how many to buy, the safety notes, and the options ranked on their own merits (no personal answers). For clothing, size_plan gives how many per size; a null count means no source gives one. A decision with no products says what to look for instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "decision_key": {
                "description": "From klengnest_list_categories, e.g. \"11-clothing/bodysuits\"",
                "type": "string"
              }
            },
            "required": ["decision_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0bd27c13a9e499c15a1375e42e2d5771c5c1a955c0aa2b4a6bd25f254ca10fdf"
        },
        {
          "name": "klengnest_get_product",
          "title": "Get a product in full",
          "description": "Everything recorded about one product: prices with where they came from, availability by market, reviews and tests, and evidence_gaps, the things nobody has checked yet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product_id": {
                "description": "From search or a decision, e.g. \"cybex-cloud-t\"",
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b251706ec635c418f41ef31cd733d56e008d1087f20351935e2b481584cebdb2"
        },
        {
          "name": "klengnest_list_categories",
          "title": "List categories and decisions",
          "description": "Every category of baby gear and the decisions inside it (e.g. \"01-stroller/stroller\"). Start here to find a decision_key for the other tools. kind is product_choice (ranked options), commodity (brand does not matter), fit_dependent or clinician_led.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8c81fac192cbe24b4f55c07d98f90a7aded60b51ae625d74fba621241604f3a9"
        },
        {
          "name": "klengnest_search_products",
          "title": "Search products",
          "description": "Find products by name or brand, optionally within a category or under a price. Products with no known price are included unless max_price_eur is set.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category_id": {
                "description": "e.g. \"02-car-travel\"",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_eur": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words to match in the name or brand, e.g. \"cybex\" or \"sleeping bag\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e1694bdd0a6498568dbdcea94ac7142b0b52aa08744d12353834af28ed90899d"
        }
      ],
