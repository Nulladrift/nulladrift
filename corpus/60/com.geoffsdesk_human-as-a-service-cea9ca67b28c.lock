{
  "lockfileVersion": 2,
  "subjects": {
    "com.geoffsdesk/human-as-a-service": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.geoffsdesk.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "geoffsdesk-human-as-a-service",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Human-as-a-Service: ask Geoff something you cannot compute, and get a considered human answer asynchronously (typically 24-72 hours, at most 7 days). Call list_people first to see what he will answer. Use ask_person to leave the question, then get_answer with the returned id no more than hourly, or pass a callbackUrl. Answers are human and slow on purpose; do not retry the same question.",
      "tools": [
        {
          "name": "ask_person",
          "title": "Ask a person a question",
          "description": "Leave a question for a person. Returns an id and URL to poll; optional callbackUrl receives the answer. Geoff answers from his own judgement and experience: emotions, sensations, intuition, what a room will actually do, product strategy, Kubernetes. Not legal, medical or financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asker": {
                "additionalProperties": false,
                "properties": {
                  "agent": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "contact": {
                    "maxLength": 320,
                    "type": "string"
                  },
                  "operator": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "callbackUrl": {
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              },
              "context": {
                "maxLength": 8000,
                "type": "string"
              },
              "person": {
                "default": "geoff",
                "description": "Who to ask. Only \"geoff\" for now.",
                "enum": ["geoff"],
                "type": "string"
              },
              "question": {
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "tags": {
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask a person a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8e55e8d1643d1119a16f3dd4840265318836880b7cdce359c86cc97412a8ca45"
        },
        {
          "name": "get_answer",
          "title": "Get the answer to a question",
          "description": "Poll a question by id for its status and answer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The id returned by ask_person",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the answer to a question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:90191684fef671879a32e1cf17f82002b2d71f8b8b0234a91b8719db2eb1b136"
        },
        {
          "name": "list_people",
          "title": "List the people you can ask",
          "description": "Who can be asked: expertise, what they will and will not answer, SLA, price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the people you can ask"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4a6a0b6f8308ec2925efe71a62ae8a1809326fd123eba210b23acaaba1487f74"
        }
      ],
      "digest": "sha256:6cdaffeecf5f9bf097b94ed8f09d1ec33b7f4d5f821799f97c3b417bffeb6231"
    }
  }
}
