          "digest": "sha256:7d66d2e70e2509e8ef7eb119ca5647c130734d6148915a3baac0556116ec1dba"
        },
        {
          "name": "check_website_status",
          "title": "Website Status Checker",
          "description": "Check whether a website is up right now. Makes one live GET request to the URL from Superflow's servers, following redirects, and reports a verdict: up when the server answers with any HTTP status below 500, down on a 5xx, a timeout after 10 seconds, a refused connection, or an unresolvable domain. Returns the HTTP status, the response time, the final URL after redirects, and the time of the check. Never cached, so every call is a fresh request. Use this to answer 'is it down or is it just me'; use check_favicon or check_social_preview to inspect what a page contains.\n\nReturns { verdict: 'up' | 'down', reason?, httpStatus?, responseTimeMs, requestedUrl, finalUrl, redirectCount, checkedAt, submittedUrl }. Limit: 60 runs per hour per IP. Allow up to 30s for a response. Free, no account, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The page to run against. A bare domain like example.com is fine; https is assumed. Must be a public URL: anything behind a login, on a private network, or on localhost is refused.",
                "type": "string"
              }
