      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Superflow's free website and scheduling tools, published with no account and no API key.\n\nWebsite checks take a URL and answer about that page or site: whether AI assistants can read it, how it renders when shared, what it is built with, what its structured data says, what its images should say. find_meeting_times takes cities or countries and a date to find shared working hours and convert meeting times. build_utm_url builds campaign links; hash_md5 hashes text.\n\nWebsite checks are rate limited to 10 runs per hour per IP (60 for detect_tech_stack) and results are cached for 24 hours, so re-asking about a URL you already checked is free. find_meeting_times, build_utm_url, and hash_md5 run locally on the server with bounded inputs, no application rate limit, and no result storage. Each tool describes its own limits.\n\nThe engines fetch, render, and crawl real pages, so a run can take a couple of minutes. A tool that is still running answers with `{ status: \"pending\", runId }` rather than a result: that is a healthy run, not an error. Call the same tool again with just that `runId` to collect it, as many times as it takes. Collecting costs no rate-limit slot; starting over does.",
      "tools": [
        {
          "name": "build_utm_url",
          "title": "UTM Builder",
          "description": "Build a campaign URL with utm parameters, normalised to one tagging convention, and report which GA4 default channel group the link will land in. Warns about the mistakes that silently break reporting: an unrecognised medium that drops traffic into Unassigned, casing that splits one source into several report rows, PII in a campaign name. Pure string work: nothing is fetched and nothing is stored.\n\nReturns { url, normalized, channel, issues[] with level, field and message }. Limit: None. The work is local and costs nothing.. Allow up to 10s for a response. Free, no account, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign": {
                "description": "utm_campaign. The campaign name, e.g. spring_launch.",
                "type": "string"
              },
              "caseRule": {
                "default": "lower",
                "description": "How values are cased before they go in the URL. Default lower, which is what keeps one source from becoming three report rows.",
                "enum": ["lower", "preserve"],
                "type": "string"
              },
              "content": {
                "description": "utm_content. Optional variant, e.g. header_link.",
                "type": "string"
              },
              "id": {
                "description": "utm_id. Optional campaign ID.",
                "type": "string"
              },
              "medium": {
                "description": "utm_medium. How it gets there, e.g. email, cpc, social. This is the field GA4 reads to pick a channel.",
                "type": "string"
              },
              "source": {
                "description": "utm_source. Where the traffic comes from, e.g. newsletter.",
                "type": "string"
              },
              "spaceRule": {
                "default": "underscore",
                "description": "What happens to spaces inside a value.",
                "enum": ["underscore", "hyphen", "preserve"],
                "type": "string"
              },
              "stripPunctuation": {
                "default": true,
                "description": "Drop accents and punctuation that make report rows hard to match.",
                "type": "boolean"
              },
              "term": {
                "description": "utm_term. Optional paid keyword.",
                "type": "string"
              },
              "url": {
                "description": "The destination page. Existing utm parameters on it are rewritten; any other query parameter is left alone.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:00e02b10deeee3463b1e6eb5b9ab00b3ec1ad0ce178c65c5d36c547cf9efa9d8"
        },
        {
          "name": "capture_full_page_screenshot",
          "title": "Full Page Screenshot",
          "description": "Capture a full-height PNG of a page in a real headless browser, scrolling first so lazy-loaded content renders. Returns a signed link to the image that expires in about 24 hours; download the bytes if you need to keep them. No watermark and no height cap. Cannot capture anything behind a login.\n\nReturns { imageUrl, expiresAt, bytes, width, height, deviceType }. Limit: 10 runs per hour per IP. Allow up to 90s for a response. Free, no account, no API key.\n\nPass `url` to start a run. A slow run answers with `{ status: \"pending\", runId }` instead of a result: call this same tool again with just that `runId` to collect it, as many times as it takes. Collecting costs no rate-limit slot.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "refresh": {
                "default": false,
                "description": "Skip the 24 hour cache and run again. Costs a rate-limit slot even when a cached result exists, so leave it off unless the page has changed.",
                "type": "boolean"
              },
              "runId": {
                "description": "Collect a run that answered with `{ status: \"pending\", runId }` instead of a result. Send the runId back on its own, with no url, and the same tool returns the finished result once the run is done. Costs no rate-limit slot.",
                "type": "string"
              },
              "url": {
                "description": "The page to run against. A bare domain like example.com is fine; https is assumed. Must be a public URL: anything behind a login, on a private network, or on localhost is refused.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:739a8a2d586e93e23e013b7b201d9f7132bc0ce9520ec9a0875f1c8371c62d04"
        },
        {
          "name": "check_ai_visibility",
          "title": "AI Visibility Checker",
          "description": "Check whether AI assistants (ChatGPT, Claude, Perplexity, Google AI) can reach, read, and cite a web page. Runs the full suite: robots.txt rules per AI crawler, a live firewall test that requests the page as GPTBot, JavaScript dependency, llms.txt, headings, structured data, and author identity. Returns a score out of 100 with a grade, a score per category, and a finding per check with why it matters and how to fix it. Use this for a whole-page verdict; use check_robots_txt_for_ai when the question is only about crawler access.\n\nReturns { ok, report: { score, grade, scoredOutOf, categories[], findings[] with why and fix, detection }, cached, ageSeconds }. Limit: 10 runs per hour per IP. Allow up to 75s for a response. Free, no account, no API key.\n\nPass `url` to start a run. A slow run answers with `{ status: \"pending\", runId }` instead of a result: call this same tool again with just that `runId` to collect it, as many times as it takes. Collecting costs no rate-limit slot.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "refresh": {
                "default": false,
                "description": "Skip the 24 hour cache and run again. Costs a rate-limit slot even when a cached result exists, so leave it off unless the page has changed.",
                "type": "boolean"
              },
              "runId": {
                "description": "Collect a run that answered with `{ status: \"pending\", runId }` instead of a result. Send the runId back on its own, with no url, and the same tool returns the finished result once the run is done. Costs no rate-limit slot.",
                "type": "string"
              },
              "url": {
                "description": "The page to run against. A bare domain like example.com is fine; https is assumed. Must be a public URL: anything behind a login, on a private network, or on localhost is refused.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0200c91cc3032596a4c1b8d665e7ee49143a706a4c9fa1bf8f16de80a9db509"
        },
        {
          "name": "check_favicon",
          "title": "Favicon Checker",
          "description": "Check whether a site's favicon actually works. Reads every icon declaration in the page head, then fetches each one, the web app manifest, and the implicit /favicon.ico, and identifies the real format and pixel dimensions from each file's header bytes. Catches the failures a status-code check misses: a catch-all route answering an icon path with HTML at HTTP 200, a sizes attribute that disagrees with the file, an icon served over http on an https page. Use this when a favicon is missing or blurry; use check_social_preview for the image that appears when a link is shared.\n\nReturns { hasWorkingFavicon, tabIcon, icons[] with format, dimensions, bytes and problem, manifest, themeColor, checks[] with id, status and fix, counts }. Limit: 60 runs per hour per IP. Allow up to 30s for a response. Free, no account, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "refresh": {
                "default": false,
                "description": "Skip the 24 hour cache and run again. Costs a rate-limit slot even when a cached result exists, so leave it off unless the page has changed.",
                "type": "boolean"
              },
              "url": {
                "description": "The page to run against. A bare domain like example.com is fine; https is assumed. Must be a public URL: anything behind a login, on a private network, or on localhost is refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b138f11e570d558542e412f16a5f6a62bb2f91fe8b2ff4d6ae65b770581c5d6"
        },
        {
          "name": "check_og_video",
          "title": "Open Graph Video Checker",
          "description": "Check whether a page's og:video plays when its link is shared. Reads every og:video declaration and its structured properties (secure_url, type, width, height) the way ogp.me defines them, then fetches the first 512 KB of the video and identifies the real format from the file header, along with byte-range support, MP4 fast start, pixel size and length. Also fetches og:image as the poster and reports the tags the other readers use instead: the X player card (twitter:card player, twitter:player) and a Google VideoObject in JSON-LD. Pass the page URL, not the video file. Use check_social_preview for how the title, description and image render per platform.\n\nReturns { hasPlayableVideo, primary, videos[] with declared tags and probe (format, kind, dimensions, durationSeconds, rangeSupported, fastStart, problem), image, ogType, videoMeta, twitter, videoObject, checks[] with id, status and fix, counts }. Limit: 60 runs per hour per IP. Allow up to 30s for a response. Free, no account, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "refresh": {
                "default": false,
                "description": "Skip the 24 hour cache and run again. Costs a rate-limit slot even when a cached result exists, so leave it off unless the page has changed.",
                "type": "boolean"
              },
              "url": {
                "description": "The page to run against. A bare domain like example.com is fine; https is assumed. Must be a public URL: anything behind a login, on a private network, or on localhost is refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:800e07f2d9203256dffce659428cdcdcc4557de7e9eec67cf88e401578e459ca"
        },
        {
          "name": "check_robots_txt_for_ai",
          "title": "robots.txt AI Checker",
          "description": "Test a site's robots.txt against every AI crawler that matters (GPTBot, ClaudeBot, PerplexityBot, Google-Extended, CCBot, Googlebot, Bingbot and the rest) and report which are allowed, which are blocked, and which rule decided it. Also runs a firewall test, because CDN-level blocks stop crawlers before robots.txt is ever read. This is the access-scoped view of check_ai_visibility.\n\nReturns { ok, report: { accessScore, crawlers[] with the rule that decided each verdict, firewall, findings[] }, cached, ageSeconds }. Limit: 10 runs per hour per IP. Allow up to 75s for a response. Free, no account, no API key.\n\nPass `url` to start a run. A slow run answers with `{ status: \"pending\", runId }` instead of a result: call this same tool again with just that `runId` to collect it, as many times as it takes. Collecting costs no rate-limit slot.",
