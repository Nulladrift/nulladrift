          "digest": "sha256:b8718fd30bb257c92f7c36ed5368393f5a2ce1f7d09e822c650ec73faf70d097"
        },
        {
          "name": "find_meeting_times",
          "title": "Time Zone Converter & Meeting Planner",
          "description": "Find overlapping working hours and meeting times across cities or countries. Resolves locations to IANA time zones and applies daylight saving for the requested date. Returns resolved locations, overlap windows, the earliest matching meeting starts with UTC and local times, readable copy text, and a link to open the plan. Ambiguous names or countries with multiple zones return choices: retry with a returned location ID or a more specific city/region/country. The same working schedule is applied in each location's local time; the browser plan supports individual schedules. Does not access calendars, account for holidays, send invitations, or book meetings.\n\nReturns { ok, date, dateZone, durationMinutes, locations[], overlapMinutes, overlapWindows[], slots[] with UTC/local times and copyText, totalAvailableStarts, hasMore, planUrl, availability }. Limit: No application rate limit. Up to 8 locations, 20 returned starts, and a 16 KB request body; no result storage.. Allow up to 10s for a response. Free, no account, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Meeting date as YYYY-MM-DD (2000–2099), in the first location's time zone. Required: use the actual meeting date so daylight saving is correct.",
                "type": "string"
              },
              "durationMinutes": {
                "default": 30,
                "description": "Length of the whole meeting, 15–1440 minutes in 15-minute increments.",
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Maximum suggested meeting starts to return, 1–20. Earliest first, at 15-minute intervals; totalAvailableStarts reports the full count.",
                "type": "number"
              },
              "locations": {
                "description": "Cities, single-zone countries, or location IDs returned in choices. Include a region/country to distinguish namesakes, e.g. San Francisco California or London United Kingdom. The first location determines the date being searched.",
                "items": {
                  "maxLength": 150,
                  "type": "string"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "workDays": {
                "default": "1,2,3,4,5",
                "description": "Comma-separated working days: 0=Sunday through 6=Saturday. For overnight shifts, the day the shift starts. Applied to all locations.",
                "type": "string"
              },
              "workEnd": {
                "default": "18:00",
                "description": "End of working hours, as local 24-hour HH:mm, in 15-minute increments. An earlier end means an overnight shift. Must differ from workStart.",
                "type": "string"
              },
              "workStart": {
                "default": "09:00",
                "description": "Start of working hours, as local 24-hour HH:mm, in 15-minute increments. Applied to all locations.",
                "type": "string"
              }
            },
            "required": ["date", "locations"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a38be826b3e62811bfce058b79ec8521586a8cd3d8b5505206ab66359744ab5f"
        },
        {
          "name": "generate_alt_text",
          "title": "Alt Text Generator",
          "description": "Find every image on a page and draft alt text for the ones that need it, using a vision model that actually looks at the image. Lists every image with the alt it has today, the suggested alt, whether it looks decorative, and why any image was skipped. Up to 10 images per run go to the model. The suggestions are drafts for a human to review.\n\nReturns { images[] with src, hadAlt, currentAlt, suggestedAlt, isDecorative, skippedReason; counts; model }. Limit: 10 runs per hour per IP. Allow up to 90s for a response. Free, no account, no API key.\n\nPass `url` to start a run. A slow run answers with `{ status: \"pending\", runId }` instead of a result: call this same tool again with just that `runId` to collect it, as many times as it takes. Collecting costs no rate-limit slot.",
