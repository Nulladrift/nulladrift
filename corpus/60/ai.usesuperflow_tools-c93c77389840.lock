            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6e02759c7fb6795b769596afe5fcf9dc03f276339164ac890360cc5509db423"
        },
        {
          "name": "detect_tech_stack",
          "title": "Tech Stack Detector",
          "description": "Identify the platform, framework, CMS, ecommerce apps, analytics, CDN, and hosting behind a site by fingerprinting one page's HTML and response headers. One fetch, no rendering and no crawl, so it answers in about a second. A site behind bot protection is reported as blocked rather than as empty.\n\nReturns { platformName, theme, apps[], fonts[], analytics[], hosting[], renderMode, url, status, fetchedAt }. Limit: 60 runs per hour per IP. Allow up to 30s for a response. Free, no account, no API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
