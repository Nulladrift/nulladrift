        {
          "name": "generate_json_ld",
          "title": "JSON-LD Generator",
          "description": "Read a page and write a schema.org JSON-LD block for it, then validate that block against the same checks a validator would run. The markup is model-written from the page's own content and should be reviewed before it is published. Returns the block ready to paste into a <script type=\"application/ld+json\"> tag.\n\nReturns { ok, report: { detectedType, jsonLd, jsonLdString, validation: { findings[], passed }, model } }. Limit: 10 runs per hour per IP. Allow up to 75s for a response. Free, no account, no API key.\n\nPass `url` to start a run. A slow run answers with `{ status: \"pending\", runId }` instead of a result: call this same tool again with just that `runId` to collect it, as many times as it takes. Collecting costs no rate-limit slot.",
