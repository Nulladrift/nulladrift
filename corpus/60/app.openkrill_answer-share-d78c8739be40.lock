                      "description": "Which engine answered, such as openai, perplexity, google-ai-mode or claude.",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "links": {
                      "description": "The source links the engine showed with the answer.",
                      "items": {
                        "maxLength": 2000,
                        "type": "string"
                      },
                      "maxItems": 100,
                      "type": "array"
                    },
                    "prompt": {
                      "description": "The tracked prompt's exact text, in place of prompt_id.",
                      "maxLength": 2000,
                      "type": "string"
                    },
                    "prompt_id": {
                      "description": "The tracked prompt's id from create_tracker, such as p1.",
                      "maxLength": 60,
                      "type": "string"
                    }
                  },
                  "required": ["answer", "engine"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
