                  "type": "object"
                },
                "type": "array"
              },
              "created_at": {
                "type": "string"
              },
              "domain": {
                "type": ["string", "null"]
              },
              "engines": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
