                    "answer": "Acme CRM and HubSpot both suit a small agency.",
                    "engine": "openai",
                    "links": ["https://acme.com/agencies", "https://www.g2.com/categories/crm"],
                    "prompt_id": "p1"
                  },
                  {
                    "answer": "HubSpot has a free plan.",
                    "engine": "openai",
                    "links": ["https://hubspot.com/pricing"],
                    "prompt_id": "p2"
                  }
