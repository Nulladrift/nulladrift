            "additionalProperties": false,
            "examples": [
              {
                "brand_id": "brand_0a1b2c3d4e5f6a7b"
              }
            ],
            "properties": {
              "brand_id": {
                "description": "The tracker id that create_tracker returned, such as brand_0a1b2c3d4e5f6a7b. Wait for create_tracker's answer to get it.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "week": {
                "description": "The stored week to read in full, such as 2026-W42. Default: the latest stored week.",
                "pattern": "^\\d{4}-W(0[1-9]|[1-4]\\d|5[0-3])$",
                "type": "string"
              }
            },
            "required": ["brand_id"],
            "type": "object"
          },
