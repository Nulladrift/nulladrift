      "instructions": "Namequota: brand share in AI answers. Namequota scores AI answers for one brand. When a user pastes AI answers and asks whether they named or linked a brand, call score_answer_share instead of reading the answers yourself: it applies the same fixed rules every time. Send brand, domain and the answer text plus its source links; send several answers in answers, each with prompt and engine, to get a share such as 0 of 8. Always send the prompt when you have it: buyer share counts only prompts that do not name the brand, and the prompt's words are removed from the answer before matching. The tool does not query any engine and does not fetch URLs; if the user has no answer text, ask them to paste it. If the answers name rival products and you sent no competitors, call again with those names in competitors. Report mention share and citation share as \"N of M\", name the rivals that lead, pass on the recommendations, and keep the summary's sample-size note and next_step. To track a brand week by week, call create_tracker once, then add_round with one answer per prompt id and engine each week, and get_tracker to read the weeks. The tracker tools need the caller's API key (x-api-key) or an OAuth connection; on subscription_required, say the key has no tracker access and stop. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "add_round",
          "title": "Add a week of AI answers to a tracker",
          "description": "Call this to record one week of AI answers on a tracker, after create_tracker has returned its brand_id (never in the same step). Pass brand_id and answers: one item per tracked prompt and engine, each with prompt_id (such as p1), engine (such as openai, perplexity, google-ai-mode, claude), the answer text and its source links. week defaults to this ISO week; sending a week again replaces that week. Returns the scored round: mention share and citation share, split by engine and buyer prompt, with rivals, cited sites and a fix list. It scores pasted answers and never asks an engine. Errors: api_key_required, subscription_required (no tracker access), owner_only for a seat's key, brand_not_found, and invalid_input naming the prompt ids to use.",
