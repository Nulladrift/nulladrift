          "title": "Read a tracker and its weekly rounds",
          "description": "Call this to read a tracker from create_tracker: its brand, rivals and prompts with their ids, every stored week with its mention and citation share, and one week in full (the latest unless week is sent) with its report, fix list, pages to get onto and the change from the previous stored week. Pass brand_id. Read-only. Errors: api_key_required, subscription_required (no tracker access), brand_not_found, round_not_found naming the stored weeks.",
