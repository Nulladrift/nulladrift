        {
          "name": "create_tracker",
          "title": "Create a weekly answer-share tracker",
          "description": "Call this when a user wants their brand's AI answer share tracked week by week, not scored once. Pass brand, domain, rivals in competitors and the questions to ask each week in prompts (1 to 25 plain strings). Returns brand_id and each prompt's id (p1, p2, ...) for add_round. The tracker belongs to the caller's API key: send it in the x-api-key header, or connect over OAuth at https://connect.openkrill.app/plugins/answer-share/mcp. Errors: api_key_required means no key came with the call; subscription_required means the key has no tracker access, so stop instead of retrying; brand_limit means the key already tracks 5 brands.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "brand": "Acme CRM",
                "competitors": [
                  {
                    "domain": "hubspot.com",
                    "name": "HubSpot"
                  }
                ],
                "domain": "acme.com",
                "prompts": ["What is the best CRM for a small agency?", "Which CRM has the cheapest plan?"]
              }
            ],
            "properties": {
              "aliases": {
                "description": "Other names that count as the brand, such as AcmeCRM.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "brand": {
                "description": "The brand or product name to look for, such as Acme CRM.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "competitors": {
                "description": "Rivals to count in the same answers, each {name, domain}.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "domain": {
                      "maxLength": 253,
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "domain": {
                "description": "The brand's website, such as acme.com. A link to it counts as a citation.",
                "maxLength": 253,
                "type": "string"
              },
              "engines": {
                "description": "The engines the weekly runner asks, from openai and perplexity. Default: both. Answers from other engines can still be added by hand.",
                "items": {
                  "enum": ["openai", "perplexity"],
                  "type": "string"
                },
                "maxItems": 2,
                "type": "array"
              },
              "prompts": {
                "description": "The questions to ask every week, 1 to 25, such as \"best CRM for a small agency\". Each gets an id (p1, p2, ...) that add_round uses.",
                "items": {
                  "maxLength": 2000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["brand", "prompts"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "aliases": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "brand": {
                "type": "string"
              },
              "brand_id": {
                "type": "string"
              },
              "competitors": {
