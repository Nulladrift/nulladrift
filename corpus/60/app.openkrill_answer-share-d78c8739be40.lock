        {
          "name": "score_answer_share",
          "title": "Score brand share in AI answers",
          "description": "It never queries an AI engine: if the answers are not pasted, ask for them and their source links first. Call this when a user pastes answers from ChatGPT, Perplexity, Google AI Mode, Claude or another AI assistant and asks whether they named or linked their brand, what share they got, which rivals or sites were chosen instead, or what to do about it. Pass the brand, its domain, rival names and every answer in answers (each with its prompt, engine and source links). Returns mention share and citation share (such as 0 of 3) by engine and for buyer prompts (prompts that do not name the brand), how often each rival is named, the sites cited instead and a short fix list. A repeated prompt is not a mention, and a link counts only if it goes to the brand domain.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "answer": "For a small team, Acme CRM is simple. HubSpot is a common pick too.",
                "brand": "Acme CRM",
                "domain": "acme.com",
                "links": ["https://acme.com/pricing", "https://www.g2.com/categories/crm"],
                "prompt": "best CRM for a small sales team"
              }
            ],
            "properties": {
              "aliases": {
                "description": "Other names that count as the brand, such as Acme or AcmeCRM.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "answer": {
                "description": "One answer to score. Use answers instead for several prompts.",
                "maxLength": 40000,
                "minLength": 1,
                "type": "string"
              },
              "answers": {
                "description": "Several answers to score together (at most 50), for a share across prompts and engines.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answer": {
                      "description": "The answer text, pasted in full. At most 40000 characters.",
                      "maxLength": 40000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "engine": {
                      "description": "Which engine gave the answer, such as chatgpt, openai-web-search, perplexity, google-ai-mode, claude. Used to split the share by engine.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "id": {
                      "description": "Your label for the prompt, such as Q1.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "links": {
                      "description": "The source links the engine showed with the answer. URLs written in the answer text are read too.",
                      "items": {
                        "maxLength": 2000,
                        "type": "string"
                      },
                      "maxItems": 100,
                      "type": "array"
                    },
                    "prompt": {
