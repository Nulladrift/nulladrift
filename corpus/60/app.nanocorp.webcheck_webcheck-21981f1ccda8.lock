      "serverInfo": {
        "name": "webcheck",
        "title": "webcheck",
        "version": "1.0.0",
        "description": "Website checker for AI agents: one verdict on whether the site does what it was asked.",
        "websiteUrl": "https://webcheck.nanocorp.app"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_site",
          "description": "Check a website: does it work, and does it do what it was asked to do? Opens up to 20 pages, tests links, forms and images, compares the brief with the pages, and checks speed and security. Returns a verdict (the literal lowercase word \"pass\" or \"fix\"), a score out of 100, sub-scores, the fix list, and the public report URL. One free check per site without a key.",
          "inputSchema": {
            "properties": {
              "brief": {
                "description": "What the site was supposed to do (the original instruction). Optional.",
                "type": "string"
              },
              "url": {
                "description": "The address of the site to check",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
