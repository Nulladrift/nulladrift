      "instructions": "Indonesian news, plus reference data: FX rates for any published pair (USD/IDR by default), BTC/ETH/USDT prices in rupiah with the Indodax-vs-global premium, BMKG earthquakes and public holidays. Free tools give 3 headlines, a new-since cursor sample, a keyword search sample, today's top entities with a sentiment split, one live data sample, the endpoint catalog and coverage quotes. Paid calls start at $0.05 and top out at $2.50 for the all-topics digest; a 30 days licence starts at $19 and counts no calls at all. Paid tools in this same server return the full data and are paid with x402 (exact scheme, USDC) inside tools/call: indonesia_headlines ($0.05), indonesia_feed ($0.05), indonesia_search ($0.10), indonesia_sentiment ($0.05), indonesia_briefing ($0.50), indonesia_digest ($2.50), indonesia_fx ($0.05), indonesia_series ($0.25), indonesia_crypto_idr ($0.05), indonesia_crypto_premium ($0.05), indonesia_earthquake ($0.05), indonesia_workdays ($0.05), asia_market_snapshot ($0.05), indonesia_holiday_check ($0.05), convert_currency ($0.05), indonesia_next_working_day ($0.05), indonesia_holidays ($0.05), indonesia_snapshot ($0.05), web_read ($0.05), indonesia_license_newsroom ($19), indonesia_license_pilot ($99), indonesia_license_growth ($399), indonesia_license_enterprise ($700). Call a paid tool without payment and it answers with the x402 PaymentRequired payload (accepts[] with network, amount, asset, payTo); pay and repeat the same call with the payment in params._meta[\"x402/payment\"]. A licence (Newsroom $19 for 30 days, Pilot $99 for 30 days, Growth $399 for 30 days, Enterprise $700 for 90 days) also unlocks every paid data tool except web_read, unmetered for the term — the tiers differ by depth as well as duration: Pilot 365 prints of /series history per request, Growth 1,825 prints of /series history per request, Enterprise 3,650 prints of /series history per request, while Newsroom pays $0.25 per call for up to 365 prints — same coverage as the HTTP licence, one source of truth: send the token as an Authorization: Bearer header on the MCP request. web_read stays per-call, exactly like GET /read: an unmetered page reader would be an outbound proxy, not a data endpoint. Same data is also sold over HTTP at https://indo-news-api.vercel.app (call indonesia_news_endpoints for URLs; brand coverage monitor at https://indo-news-api.vercel.app/monitor). Written $49 coverage report: https://indo-news-api.vercel.app/order (self-serve after USDC payment). Example report: https://indo-news-api.vercel.app/demo-report.",
