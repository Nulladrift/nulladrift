      },
      "transport": {
        "type": "http",
        "url": "https://inshihub.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "inshihub",
        "title": "院試hub 過去問データ",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "日本の大学院入試（院試）の過去問について、科目・出題テーマ・公式過去問の配布先・併願先候補を検索できます。結果のURLは院試hubの公開ページです。問題本文と有料の解答は返しません。",
      "tools": [
        {
          "name": "find_similar_graduate_exams",
          "description": "指定した科目と出題テーマの構成が近い他大学・他研究科の科目を、重なりの大きい順に返す。併願先を探すときに使う。key は search_graduate_exam_subjects が返す key。",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "university/department/subject 形式のキー",
                "type": "string"
              },
              "limit": {
                "description": "返す件数（既定10、最大30）",
                "type": "number"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee97abb4b343d2dbdcb8fb8f2852ac253ae78546fd949d20a1b423dc6a980c8b"
        },
        {
          "name": "official_past_exam_sources",
          "description": "大学名から、大学公式の院試過去問の配布ページ、公開年度、公式解答の有無を返す。院試hubが1件ずつ確認した記録。",
          "inputSchema": {
            "properties": {
              "university": {
                "description": "大学名（例: 東京大学、阪大）",
                "type": "string"
              }
            },
            "required": ["university"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30e2bd4e07456cb31603690a402c53f3ca94caaa21d9a2c95e12e5203a130685"
        },
        {
          "name": "search_exam_themes",
          "description": "出題テーマ（例: ジョルダン標準形、留数定理、調和振動子）を探し、出題した大学・年度とテーマページのURLを返す。",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "テーマ名の一部",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81f9abe6ca7c3ab948af3f140d5fa5d32d6bba9edb945ed6a86b2ff6e4a8ece6"
        },
        {
          "name": "search_graduate_exam_subjects",
          "description": "大学名・研究科名・科目名（例: 東大 情報理工、京大 数学、電磁気）で院試の科目を探す。収録年度、出題テーマ、年度別解説と解答PDFのURL、公式過去問の配布先、確認済みの入試日程を返す。",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "大学・研究科・科目・テーマの語。空白区切りで絞り込む",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3cb68dd0001849619a48757c5aaf65ff82e805bbd6abb5c3230b07fcbbac51cb"
        }
      ],
      "digest": "sha256:7c3e7b663f5abed4788dfa266bc8cce3e8682c2f377a5eeff022f05f6fbef2c0"
    }
  }
}
