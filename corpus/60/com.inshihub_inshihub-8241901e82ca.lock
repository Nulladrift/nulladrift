{
  "lockfileVersion": 2,
  "subjects": {
    "com.inshihub/inshihub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://inshihub.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "inshihub",
        "title": "院試hub 過去問データ",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "日本の大学院入試（院試）の過去問について、科目・出題テーマ・公式過去問の配布先・併願先候補を検索できます。結果のURLは院試hubの公開ページです。問題本文と有料の解答は返しません。",
      "tools": [
        {
          "name": "find_similar_graduate_exams",
          "description": "指定した科目と出題テーマの構成が近い他大学・他研究科の科目を、重なりの大きい順に返す。併願先を探すときに使う。key は search_graduate_exam_subjects が返す key。",
          "inputSchema": {
            "properties": {
              "key": {
                "description": "university/department/subject 形式のキー",
                "type": "string"
              },
              "limit": {
                "description": "返す件数（既定10、最大30）",
                "type": "number"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4d6d5e5896b072489434a6398bd428716e838d8c87390c05d06773292552d0c"
        },
        {
          "name": "official_past_exam_sources",
          "description": "大学名から、大学公式の院試過去問の配布ページ、公開年度、公式解答の有無を返す。院試hubが1件ずつ確認した記録。",
          "inputSchema": {
            "properties": {
              "university": {
                "description": "大学名（例: 東京大学、阪大）",
                "type": "string"
              }
            },
            "required": ["university"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e1fffe5f2f78baf95213a126f595032909c97cf1e20f0ff54dca7bf7001b2af9"
        },
        {
          "name": "search_exam_themes",
          "description": "出題テーマ（例: ジョルダン標準形、留数定理、調和振動子）を探し、出題した大学・年度とテーマページのURLを返す。",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "テーマ名の一部",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fb76ad6cfc1a83a9ffd5954648d6041cb920d6524b9cc74fa129d9b4ec19c87"
        },
        {
          "name": "search_graduate_exam_subjects",
          "description": "大学名・研究科名・科目名（例: 東大 情報理工、京大 数学、電磁気）で院試の科目を探す。収録年度、出題テーマ、年度別解説と解答PDFのURL、公式過去問の配布先、確認済みの入試日程を返す。",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "大学・研究科・科目・テーマの語。空白区切りで絞り込む",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:86fd8c4b31c6bf3eeacce86a3e6dd9da48850bb25ce5c8c98d75cc50c1f81ed9"
        }
      ],
      "digest": "sha256:189536a043cc80a0ec5974057901007978895211b4cdb8bc0dd0c65b4999375e"
    }
  }
}
