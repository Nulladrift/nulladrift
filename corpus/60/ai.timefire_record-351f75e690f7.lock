          "digest": "sha256:0c8dd9349f261b41810b45d4ffd60b58bae6b4b4c378c4106f9277b37ed1f286"
        },
        {
          "name": "list_resolved_batches",
          "title": "Book history",
          "description": "List graded books, newest first, one summary row each: date, returns, alpha against SPY and RSP, and verdict.\n    A book (or batch) is one trading day's full S&P 500 slate. Use this to find a trading_date, then get_resolved_batch\n    for every forecast in that book or verify_batch for its proof. Dates with no graded book return an empty list.",
          "inputSchema": {
            "properties": {
              "from_date": {
