                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Earliest date to include, as YYYY-MM-DD. Omit for no lower bound.",
                "title": "From Date"
              },
              "limit": {
                "default": 60,
                "description": "Most books to return, 1 to 500. Default 60.",
                "title": "Limit",
                "type": "integer"
              },
              "to_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latest date to include, as YYYY-MM-DD. Omit for no upper bound.",
                "title": "To Date"
              }
            },
            "title": "list_resolved_batchesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
