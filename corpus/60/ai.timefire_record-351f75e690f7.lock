        {
          "name": "search_docs",
          "title": "Search the docs",
          "description": "Find the developer guides and site pages that match a few words. Each\n    hit carries the page title, its canonical URL and a short excerpt. Use this\n    for how Timefire works and what its terms mean, not for record data. No\n    match returns an empty list, so try other words.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Most pages to return, 1 to 20. Default 5.",
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "description": "A few words to search for, at most 8 words and 200 characters.",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_docsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "search_docsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the docs"
          },
          "behavior": {
            "destructive": false,
