          },
          "digest": "sha256:8549970665d7999ae996e496a61a775f939b6150cfaf23274d46cc3586b2ff7e"
        },
        {
          "name": "verify_batch",
          "title": "Verification record",
          "description": "Get the public proof for one graded book: signed payload, hash, signature, content address and timestamp\n    material, with the steps to check them. The verified field is the server's own check; the evidence lets you repeat\n    it yourself. Use this to check a book's signature and timestamp, and get_resolved_batch to read its forecasts and\n    outcomes. An ungraded or unknown date is an error.",
          "inputSchema": {
            "properties": {
              "trading_date": {
                "description": "The book's trading date, as YYYY-MM-DD. list_resolved_batches gives the graded dates.",
                "title": "Trading Date",
                "type": "string"
              }
            },
            "required": ["trading_date"],
            "title": "verify_batchArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "verify_batchDictOutput",
            "type": "object"
          },
