{
  "lockfileVersion": 2,
  "subjects": {
    "ai.timefire/record": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.timefire.ai/mcp/"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Timefire Record",
        "version": "",
        "description": "Public verification tools over resolved Timefire ledger books.",
        "websiteUrl": "https://timefire.ai/developers/mcp"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use these tools to inspect Timefire's resolved record. A book (the tools also say batch) is one trading day's full S&P 500 slate, normally graded ten trading days later. Resolved means graded. No tool returns a batch, ticker observation, or proof until that book is fully resolved. No API key is required.",
      "tools": [
        {
          "name": "explain_resolved_prediction",
          "title": "Explain a prediction",
          "description": "Get the stored evidence behind one stock's forecast in a graded book: its rank, side, market regime, 5- and\n    20-day lookback returns, news items and notes. Use this to see the context a stock was ranked in, and\n    get_stock_resolved_history to find which books hold it. An ungraded date, or a ticker not in that book, is an\n    error.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "Stock ticker, for example AAPL. Upper or lower case both work.",
                "title": "Ticker",
                "type": "string"
              },
              "trading_date": {
                "description": "The book's trading date, as YYYY-MM-DD. list_resolved_batches gives the graded dates.",
                "title": "Trading Date",
                "type": "string"
              }
            },
            "required": ["ticker", "trading_date"],
            "title": "explain_resolved_predictionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "explain_resolved_predictionDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a prediction"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49ba684b041b1c9860ddcd1ec7571a768da64dd41b9cd41c23554703628973d7"
        },
        {
          "name": "get_book_portfolio",
          "title": "Book portfolio",
          "description": "Get a resolved book's portfolio: market-cap-weighted vs SPY (\"cap\", the default, the portfolio the ledger's\n    verdict grades) or equal-weighted vs RSP (\"equal\"), with each long pick's weight and graded return, the book\n    return, the benchmark return and its evidence, alpha and verdict. Equal weights always pair with RSP and cap weights\n    with SPY. Per prediction, books serve the two as equal_weight and market_cap_weight; never read a pick's cap_weight\n    as either without checking inference_metadata.weighting. Use this for one book's result, and get_simulation_nav for\n    the running portfolio across books. An ungraded or unknown date is an error.",
          "inputSchema": {
            "properties": {
              "trading_date": {
                "description": "The book's trading date, as YYYY-MM-DD. list_resolved_batches gives the graded dates.",
                "title": "Trading Date",
                "type": "string"
              },
              "weighting": {
                "default": "cap",
                "description": "\"cap\" for market-cap weights against SPY (the default), or \"equal\" for equal weights against RSP.",
                "title": "Weighting",
                "type": "string"
              }
            },
            "required": ["trading_date"],
            "title": "get_book_portfolioArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_book_portfolioDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Book portfolio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a22ed3850d41ce5ff38b694095d2cd47e746529213554b3107cf44f1f3884d1b"
        },
        {
          "name": "get_calibration",
          "title": "Calibration",
          "description": "Check whether forecasts matched outcomes: mean predicted against mean realized return by decile across every\n    graded book, and hit rates by rank bucket and by side (long or short) across books graded under the published rule.\n    Use this to judge how well the ranking held up, and get_track_record_stats for headline returns and the verdict\n    tally.",
          "inputSchema": {
            "properties": {},
            "title": "get_calibrationArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_calibrationDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calibration"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6e5bed72c84a43125d0241a63186b8c40b5ceb78b92c34e1639d0ce1517c430"
        },
        {
          "name": "get_resolved_batch",
          "title": "One book",
          "description": "Get one graded book with every forecast and its outcome. A book (or batch) is one trading day's full S&P 500\n    slate, served once its long picks are fully graded, so other rows can still have null outcomes. Use\n    list_resolved_batches to find the date, verify_batch for the book's proof and get_book_portfolio for its portfolio.\n    An ungraded or unknown date is an error.",
          "inputSchema": {
            "properties": {
              "trading_date": {
                "description": "The book's trading date, as YYYY-MM-DD. list_resolved_batches gives the graded dates.",
                "title": "Trading Date",
                "type": "string"
              }
            },
            "required": ["trading_date"],
            "title": "get_resolved_batchArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_resolved_batchDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One book"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69bc1d7c3cbfe74bee2f8da34b76f4885431309a25fdd6063c53331dbfed25af"
        },
        {
          "name": "get_simulation_nav",
          "title": "Portfolio value",
          "description": "Get the paper portfolio's daily value (NAV), market-cap-weighted vs SPY (\"cap\", the default) or equal-weighted\n    vs RSP (\"equal\"), with both benchmarks on every row. There is one row per resolved trading day. The series stops at\n    the newest date by which every book is revealed, because a later value holds positions from books still sealed.\n    Use this for portfolio value over time, and get_simulation_trades for the trades behind it.",
          "inputSchema": {
            "properties": {
              "from_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Earliest date to include, as YYYY-MM-DD. Omit for no lower bound.",
                "title": "From Date"
              },
              "to_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latest date to include, as YYYY-MM-DD. Omit for no upper bound.",
                "title": "To Date"
              },
              "weighting": {
                "default": "cap",
                "description": "\"cap\" for market-cap weights against SPY (the default), or \"equal\" for equal weights against RSP.",
                "title": "Weighting",
                "type": "string"
              }
            },
            "title": "get_simulation_navArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "get_simulation_navOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Portfolio value"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c2c68cab3bbe91822ae3b2efe97fc60f1f01159c767345884431a57fe8f7f67"
        },
        {
          "name": "get_simulation_trades",
          "title": "Portfolio trades",
          "description": "Get the paper portfolio's closed trades from resolved books, newest first, market-cap-weighted (\"cap\", the\n    default) or equal-weighted (\"equal\"): the two trade at the same prices and differ in weight, and so in size and\n    P&L. Open positions never appear. Date bounds apply to the day a trade opened; narrow them to see past the limit.\n    Use this for individual trades, and get_simulation_nav for portfolio value.",
          "inputSchema": {
            "properties": {
              "from_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Earliest date to include, as YYYY-MM-DD. Omit for no lower bound.",
                "title": "From Date"
              },
              "limit": {
                "default": 500,
                "description": "Most trades to return, 1 to 500. Default 500. Older trades are cut off; there is no paging.",
                "title": "Limit",
                "type": "integer"
              },
              "to_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latest date to include, as YYYY-MM-DD. Omit for no upper bound.",
                "title": "To Date"
              },
              "weighting": {
                "default": "cap",
                "description": "\"cap\" for market-cap weights against SPY (the default), or \"equal\" for equal weights against RSP.",
                "title": "Weighting",
                "type": "string"
              }
            },
            "title": "get_simulation_tradesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "get_simulation_tradesOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Portfolio trades"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e3836e921f4ffe702297fb085180b4ab0e5f656c481d756114c46d794603323"
        },
        {
          "name": "get_stock_resolved_history",
          "title": "One stock's history",
          "description": "Get one stock's rows from graded books only, newest first: its forecast, rank, pick side and outcome in each\n    book. Use this to follow one ticker across books, explain_resolved_prediction for the evidence behind one row, and\n    get_resolved_batch for a whole book. An unknown ticker returns an empty list.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 120,
                "description": "Most rows to return, 1 to 500. Default 120.",
                "title": "Limit",
                "type": "integer"
              },
              "ticker": {
                "description": "Stock ticker, for example AAPL. Upper or lower case both work.",
                "title": "Ticker",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "title": "get_stock_resolved_historyArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "get_stock_resolved_historyOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One stock's history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6e73ec57d0c49836ca83974a7987cc282c210438967ae11e5b08d45125cfec09"
        },
        {
          "name": "get_track_record_stats",
          "title": "Headline stats",
          "description": "Get aggregates computed only from fully resolved books: forecast counts, returns and hit rates, and how many\n    books beat, matched (flat) or trailed SPY, each book's verdict graded on its cap-weighted long picks. The hit\n    rates count the books graded under the published rule, from published_rule_from on; the 69 backtest books before\n    it follow a rule of their own and are reported apart in the backtest_ fields, verdicts included. Use this for\n    overall performance, get_calibration to test the ranking itself, and get_book_portfolio for a single book.",
          "inputSchema": {
            "properties": {},
            "title": "get_track_record_statsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_track_record_statsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Headline stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ba7c01fbaf722921add49ddf0ce00cba31f8b33cdff8bbc35f12e1ddd761c0e"
        },
        {
          "name": "get_universe_and_scoring_spec",
          "title": "Record spec",
          "description": "Get the versioned scoring rules, the metric definitions and the latest graded book's universe of stocks.\n    Use this before interpreting a stat or a verdict, to learn how books are graded and which stocks are covered.",
