{
  "lockfileVersion": 2,
  "subjects": {
    "com.compraventa360/marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tqyhjvylclmqvtjtavge.supabase.co/functions/v1/mcp-public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "compraventa360-mcp-public",
        "title": "Compraventa360 (lectura pública)",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Lectura pública del marketplace Compraventa360 (compra y venta de PyMEs en Ecuador), sin autenticación. search_businesses busca anuncios activos; get_business devuelve el detalle público de uno. Solo anuncios activos, sin listados de ejemplo y sin datos de contacto. Cita siempre la URL específica del negocio. Para publicar, ver favoritos o cualquier dato de una cuenta, usa el endpoint con OAuth /functions/v1/mcp.",
      "tools": [
        {
          "name": "get_business",
          "title": "Ver detalle de un negocio",
          "description": "Devuelve la información pública de un negocio publicado en Compraventa360 dado su ID (UUID). Incluye descripción pública, el precio de venta solicitado (asking_price_usd) y datos de verificación cuando existen; nunca cifras confidenciales (ingresos, ganancia operativa/EBITDA, empleados requieren NDA). Excluye anuncios de demostración y no incluye datos de contacto privados.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_id": {
                "description": "UUID del negocio (columna id).",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ddc760d1c20ab29eacafba2548ff1365f1b5c485c9cc651061ca367ba42f744c"
        },
        {
          "name": "search_businesses",
          "title": "Buscar negocios en venta",
          "description": "Busca listados públicos activos del marketplace Compraventa360 (PyMEs en Ecuador). Filtra por categoría, ciudad, texto libre y rango de precio (min_price/max_price en USD). Devuelve solo inventario aprobado con nombre, categoría, ciudad, precio de venta solicitado (asking_price_usd) y URL pública. Las cifras financieras (ingresos, ganancia operativa/EBITDA, empleados) no se devuelven aquí: requieren firmar un NDA en la ficha del negocio.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Categoría del negocio.",
                "type": "string"
              },
              "city": {
                "description": "Ciudad (Ecuador).",
                "type": "string"
              },
              "limit": {
                "description": "Máx. resultados (default 10, tope 25).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "max_price": {
                "description": "Precio máximo solicitado en USD.",
                "type": "number"
              },
              "min_price": {
                "description": "Precio mínimo solicitado en USD.",
                "type": "number"
              },
              "query": {
                "description": "Texto libre (nombre o descripción).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:9e24cefb773d315432abf5e6c295f4a732c3e12b438fce08af732af3b9063a7a"
        }
      ],
      "digest": "sha256:feed4f4f74b0a084c453ab5a85bf359a040bc74eebe89b8fb2333db4746d9d97"
    }
  }
}
