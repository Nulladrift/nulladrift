                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Legal Entity Identifier (20 characters).",
                "title": "Lei"
              },
              "max_candidates": {
                "default": 5,
