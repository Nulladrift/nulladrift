          "digest": "sha256:44a502f84452f1aea6c51e87a2f0bc5a930c3fbbb3c06a6ee4aea57d4f82d15e"
        },
        {
          "name": "jp_company_resolve",
          "title": "Resolve Japanese entity from English name or identifier",
          "description": "Find the Japanese legal entity from an English or brand name (e.g. au -> KDDI), English address, website or e-mail domain, T-number, corporate number, LEI or securities code; results in English. Brand matches are candidates, never a confirmation. Use when: You hold an English, brand or romanized Japanese company name, an English address or postal code, a website or e-mail domain, a T-number, corporate number, LEI or securities code and need the Japanese legal entity, in English. Returns: Decision (matched / likely_match / candidates), legally binding Japanese name, kana, English name with source, contract party name, status and qualified-invoice registration. Brand names (au, MOS Burger) find the owner as candidates; listing, Wikidata prominence and gBizINFO employee counts only order candidates. Price: $0.25 USDC per successful call, paid with x402 on Base. / 英語名・ブランド名（例: au→KDDI）・英語住所・ドメイン・T番号・法人番号・LEI・証券コードから日本の法人を特定します。ブランド名の一致は候補であり、確定ではありません。 用途: 英語名・ブランド名・ローマ字・英語住所・郵便番号・Webサイト／メールのドメイン・T番号・法人番号・LEI・証券コードから日本の法人を特定したい場合。 返却: 判定、正式な日本語商号、読み、出典付き英語名、契約当事者名、状態、適格請求書登録を返します。ブランド名（au、MOS Burger）からは所有企業を候補として返し、上場・Wikidataの知名度・Gビズインフォの従業員数は候補の並び順だけに使います。 料金: 成功した呼び出し1回あたり $0.25 USDC（Base上のx402決済）。",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Resolve a Japanese legal entity from what foreign teams hold. / 英語名や識別番号から日本の法人を特定します。",
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Address in English or Japanese, e.g. 1-10-1 Higashikotari, Nagaokakyo-shi, Kyoto. Postal code, prefecture, municipality and town are compared with each candidate's registered address. / 住所（英語・日本語）。郵便番号・都道府県・市区町村・町名を登記住所と比較します。",
                "title": "Address"
              },
              "corporate_number": {
                "anyOf": [
                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "13-digit corporate number (法人番号); the check digit is verified.",
                "title": "Corporate Number"
              },
              "duns": {
                "anyOf": [
                  {
                    "maxLength": 16,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "D-U-N-S number; echoed only and never verified.",
                "title": "Duns"
              },
              "email": {
                "anyOf": [
                  {
                    "maxLength": 320,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A contact e-mail at the company; only its domain is used, and free webmail domains are ignored. The address itself is not stored. / 企業のメールアドレス（ドメインのみ使用）。",
                "title": "Email"
              },
              "lei": {
                "anyOf": [
                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Legal Entity Identifier (20 characters).",
                "title": "Lei"
              },
              "max_candidates": {
                "default": 5,
                "description": "Maximum candidates returned for a name search.",
                "maximum": 10,
                "minimum": 1,
                "title": "Max Candidates",
                "type": "integer"
              },
              "name": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "English, romanized or Japanese company name. / 会社名（英語・ローマ字・日本語）。",
                "title": "Name"
              },
              "postal_code": {
                "anyOf": [
                  {
                    "maxLength": 16,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Japanese postal code, e.g. 100-0005. / 郵便番号。",
                "title": "Postal Code"
              },
              "prefecture": {
                "anyOf": [
                  {
                    "maxLength": 40,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Prefecture in English or Japanese, e.g. Tokyo, Osaka-fu, 京都府. / 都道府県。",
                "title": "Prefecture"
              },
              "securities_code": {
                "anyOf": [
                  {
                    "maxLength": 8,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Japanese securities code, e.g. 6981. / 証券コード。",
                "title": "Securities Code"
              },
              "t_number": {
                "anyOf": [
                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Qualified invoice registration number, T + 13 digits (登録番号); the check digit is verified.",
                "title": "T Number"
              },
              "website": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Company website, e.g. https://www.example.co.jp; its domain is compared with the official websites we know (Wikidata). / 企業のWebサイト。",
                "title": "Website"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Resolve Japanese entity from English name or identifier"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:627e0b114194369e6a774ebc7a6704f1bacaa1027f9d78f289873e2112659de0"
        },
        {
          "name": "jp_company_verify",
          "title": "Verify Japanese company",
          "description": "Verify a Japanese company by its registered (Japanese) name or 13-digit corporate number (法人番号) against the NTA registry; an address is comparison evidence only. Returns the Japanese legal name plus a sourced English name and address. For an English name, use jp_company_resolve first. Use when: You need a Japanese company or corporate-number lookup. Returns: Corporate number, registered Japanese legal name (legal_name_ja) and address, English name (NTA official, EDINET, or romanized reading) and English address (official or Japan Post romanization) with their sources, active or closed status, and match evidence. Price: $0.01 USDC per successful call, paid with x402 on Base. / 登記上の会社名（日本語）または法人番号を国税庁の法人番号公表データと照合します。住所は比較用の根拠です。 用途: 日本企業または法人番号を検索・照合したい場合。 返却: 法人番号、登記上の法人名（legal_name_ja）・住所、英語名（国税庁公式・EDINET・読みのローマ字）と英語住所（公式または日本郵便ローマ字）とその出典、活動状態、一致根拠を返します。 料金: 成功した呼び出し1回あたり $0.01 USDC（Base上のx402決済）。",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["name"]
              },
              {
                "required": ["corporate_number"]
              }
            ],
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional address in Japan, compared with the registered address; it cannot identify a company on its own. / 任意の所在地（日本）。登記住所と比較します。住所だけでは法人を特定しません。",
                "title": "Address"
              },
              "corporate_number": {
                "anyOf": [
                  {
                    "pattern": "^[0-9]{13}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "13-digit Japanese corporate number (法人番号), digits only. / 13桁の法人番号（数字のみ）。",
                "title": "Corporate Number"
              },
              "name": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Registered (Japanese) company name, e.g. 任天堂株式会社; name or corporate_number is required. Only registered names are searched: an English or romanized name that is not found returns risk flag english_name_not_in_registry_index and a next_step. / 登記上の会社名（日本語）。name または corporate_number が必要です。登記名のみを検索します。",
                "title": "Name"
              },
              "response_language": {
                "default": "both",
                "description": "Response presentation language: ja, en, or both. / レスポンス表示言語: ja（日本語）、en（英語）、both（両方）。",
                "enum": ["ja", "en", "both"],
                "title": "Response Language",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Verify Japanese company"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7967ecdcbc51aa431c341842d1c151fd76bb2ce1854facb622d688bce5139b5b"
        },
        {
          "name": "jp_invoice_issuer_check",
          "title": "Check invoice issuer",
          "description": "Check a T-number against the issuer name on the invoice, the address (optional), the invoice date (optional: registered on that date, not cancelled or expired) and your supplier master number (optional: expected_registration_number or expected_corporate_number), using Japan's NTA registries. JPVerify does not read invoice files. Use when: You have a T-number and the issuer name from an invoice (address and invoice date optional) and need to know whether they belong together and the issuer was registered on the invoice date. Returns: Registry fields, issuer name and address comparison, registration on the invoice date, supplier master comparison, and one status per check in check_results. Price: $0.05 USDC per successful call, paid with x402 on Base. / T番号を請求書の発行者名・住所（任意）・日付（任意。その日に登録済みで取消・失効前か）・仕入先マスターの番号（任意）と国税庁データで照合します。ファイルの読み取りは行いません。 用途: 請求書のT番号と発行者名（住所・日付は任意）が一致するか、請求書の日付時点で登録済みかを確認したい場合。 返却: 国税庁の登録情報、発行者名・住所の比較結果、請求書日付時点の登録状況、確認項目ごとの結果を返します。 料金: 成功した呼び出し1回あたり $0.05 USDC（Base上のx402決済）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional issuer address as printed on the invoice, compared with the registry address. / 請求書に記載された発行者住所（任意）。登記住所と比較します。",
                "title": "Address"
              },
              "expected_corporate_number": {
                "anyOf": [
                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional 13-digit corporate number of this supplier from your own supplier master data; compared with the corporate number registered for the T-number. / 仕入先マスターに登録済みの法人番号（任意）。T番号の登録上の法人番号と比較します。",
                "title": "Expected Corporate Number"
              },
              "expected_registration_number": {
                "anyOf": [
                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional T-number of this supplier from your own supplier master data (not from the invoice). A different invoice T-number means the invoice may come from another company. / 仕入先マスターに登録済みのT番号（任意。請求書の値ではありません）。",
                "title": "Expected Registration Number"
              },
              "invoice_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional invoice (transaction) date, YYYY-MM-DD: checks that the issuer was registered on that date and not yet cancelled or expired. / 請求書の取引年月日（任意）。その日に登録済みで、取消・失効前かを確認します。",
                "title": "Invoice Date"
              },
              "registration_number": {
                "description": "Qualified-invoice registration number: T followed by 13 digits, e.g. T1013301046627. / 適格請求書発行事業者登録番号（T＋13桁）。",
                "maxLength": 32,
                "minLength": 1,
                "title": "Registration Number",
                "type": "string"
              },
              "response_language": {
                "default": "both",
                "description": "Response presentation language: ja, en, or both. / レスポンス表示言語: ja（日本語）、en（英語）、both（両方）。",
                "enum": ["ja", "en", "both"],
                "title": "Response Language",
                "type": "string"
              },
              "supplier_name": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Issuer name as printed on the invoice, compared with the registered name of the T-number. / 請求書に記載された発行者名。T番号の登録名と比較します。",
                "title": "Supplier Name"
              }
            },
            "required": ["registration_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check invoice issuer"
          },
          "behavior": {
