      "serverInfo": {
        "name": "jpverify",
        "title": "JPVerify — Japan business identity verification",
        "version": "0.5.0",
        "description": "Japan company, T-number, invoice-field and address verification for AI agents, paid per call with x402. / AIエージェント向けの日本企業・インボイス・請求書項目・住所の検証（x402従量課金）。",
        "websiteUrl": "https://www.jpverify.com",
        "icons": [
          {
            "src": "https://www.jpverify.com/logo-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "JPVerify: Japan company, qualified-invoice (T-number), invoice-field and address verification tools. JPVerify does not read files: send the fields you read. Call jpverify_guide (free) to pick a tool. Paid tools use x402 (USDC on Base): an unpaid call returns an x402 PaymentRequired result; retry with the signed payload in _meta['x402/payment']. Invalid input is rejected before any payment, and payment is settled only after a successful result. Alternatively connect with an account API key (HTTP header Authorization: Bearer jpv_live_...) to pay from prepaid USD credits at the same prices (free tool jpverify_balance shows the remaining credits); sign up at https://www.jpverify.com/signup.",
      "tools": [
        {
          "name": "jp_address_normalize",
          "title": "Normalize Japanese address",
          "description": "Normalize a Japanese address into a canonical hierarchy (prefecture to room) with the confirmed match level and an English rendering from Japan Post romanized data. Accepts business-specific postal codes (e.g. 100-8310) and parcel (番地) addresses. Use when: You need Japanese address normalization or standardization, whether or not the input contains a postal code. Returns: Normalized prefecture/city/town/chome/block/lot/house components, an English address from Japan Post romanization, parser confidence, match hierarchy, geocoder evidence, and postal-code evidence when a postal code is supplied. It does not infer a missing postal code. Price: $0.005 USDC per successful call, paid with x402 on Base. / 日本の住所を正規化し、都道府県から部屋番号までの階層・照合レベルと、日本郵便のローマ字データによる英語表記を返します。事業所の個別郵便番号（例: 100-8310）と地番（番地）住所にも対応します。 用途: 入力に郵便番号があってもなくても、日本住所を正規化・標準化したい場合。 返却: 都道府県・市区町村・町名・丁目・番地・号などの正規化項目、解析信頼度、照合階層、地理コード根拠を返します。郵便番号を入力した場合のみ郵便番号根拠を返し、未入力の郵便番号は推定しません。 料金: 成功した呼び出し1回あたり $0.005 USDC（Base上のx402決済）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Japanese address to normalize, with or without a postal code. / 正規化する日本の住所（郵便番号の有無は問いません）。",
                "maxLength": 500,
                "minLength": 1,
                "title": "Address",
                "type": "string"
              },
              "response_language": {
                "default": "both",
                "description": "Response presentation language: ja, en, or both. / レスポンス表示言語: ja（日本語）、en（英語）、both（両方）。",
                "enum": ["ja", "en", "both"],
                "title": "Response Language",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Normalize Japanese address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0f17b07a83f8b6ca318f8c82705b566eff7aa621410eefad8b674484556d67c9"
        },
        {
          "name": "jp_address_validate",
          "title": "Validate Japanese address",
          "description": "Validate a Japanese address with parser, postal and geocoder evidence and return exact/partial/ambiguous/conflict/unverified. Use when: You need one evidence-based Japanese address quality decision combining parsed address, postal evidence, and geocoder evidence. Returns: Exact, partial, ambiguous, conflict, or unverified status with accepted hierarchy, confidence signals, validation scope, and reasons. Price: $0.005 USDC per successful call, paid with x402 on Base. / 住所解析・郵便番号・ジオコーディング根拠で日本住所を検証します。 用途: 解析住所、郵便番号根拠、ジオコーダー根拠を統一ルールで判定したい場合。 返却: 完全一致、部分一致、候補不一意、矛盾、未検証の状態に加え、採用階層、信頼度、判定範囲、理由を返します。 料金: 成功した呼び出し1回あたり $0.005 USDC（Base上のx402決済）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Original Japanese address; provide exactly one of address or parsed. / 元の日本住所。addressとparsedのどちらか一方を指定します。",
                "title": "Address"
              },
              "geocode_evidence": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional prior output from /v1/jp/addresses/geocode; candidates and statuses are advisory and recomputed locally. / 任意のgeocode出力。候補とstatusは補助情報で、ローカルで再計算されます。",
                "title": "Geocode Evidence"
              },
              "parsed": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Output from /v1/jp/addresses/parse or normalize containing at least one non-empty address component. / parseまたはnormalizeの出力。空でない住所構成要素を1つ以上含めます。",
                "title": "Parsed"
              },
              "postal_evidence": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional prior output from /v1/jp/postal-codes/lookup; status/confidence are recomputed and not trusted. / 任意のpostal-lookup出力。statusとconfidenceは再計算され、無条件には信頼されません。",
                "title": "Postal Evidence"
              },
              "required_level": {
                "anyOf": [
                  {
                    "maximum": 8,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Required hierarchy level; Jageocoder 5/6=oaza/aza, 7=block, 8=building/house node. / 必須階層。Jageocoderの5/6=大字・字、7=街区、8=建物・号ノード。",
                "title": "Required Level"
              },
              "strict": {
                "default": false,
                "description": "Require all supplied evidence to agree. / 入力された根拠の完全一致を要求。",
                "title": "Strict",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Validate Japanese address"
          },
          "behavior": {
            "destructive": false,
