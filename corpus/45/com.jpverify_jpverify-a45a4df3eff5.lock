      "serverInfo": {
        "name": "jpverify",
        "title": "JPVerify — Japan business identity verification",
        "version": "0.5.0",
        "description": "Japan company, T-number, invoice-field and address verification for AI agents, paid per call with x402. / AIエージェント向けの日本企業・インボイス・請求書項目・住所の検証（x402従量課金）。",
        "websiteUrl": "https://www.jpverify.com",
        "icons": [
          {
            "src": "https://www.jpverify.com/logo-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "JPVerify: Japan company, qualified-invoice (T-number), invoice-field and address verification tools. JPVerify does not read files: send the fields you read. Call jpverify_guide (free) to pick a tool. Paid tools use x402 (USDC on Base): an unpaid call returns an x402 PaymentRequired result; retry with the signed payload in _meta['x402/payment']. Invalid input is rejected before any payment, and payment is settled only after a successful result. Alternatively connect with an account API key (HTTP header Authorization: Bearer jpv_live_...) to pay from prepaid USD credits at the same prices (free tool jpverify_balance shows the remaining credits); sign up at https://www.jpverify.com/signup. POST /v1/batch-jobs is x402 only and is available over HTTP.",
      "tools": [
        {
          "name": "jp_address_normalize",
          "title": "Normalize Japanese address",
          "description": "Standard form of a Japanese or romanized address: hierarchy, town completion, postal consistency and Japan Post English. An unverified match_status means no registry match was established. Use jp_address_validate for the final address decision. With no supplied postal code, candidate_count is 0. Accepts business-specific postal codes (e.g. 100-8310) and parcel (番地) addresses. Use when: You need Japanese address normalization or standardization, whether or not the input contains a postal code. Returns: Standard written form: normalized components, a unique truncated town completed, an English address from Japan Post romanization, and postal-master consistency and candidates. It does not infer a missing postal code, return coordinates (geocode) or give a final decision (validate). Price: $0.005 USDC per successful call, paid with x402 on Base. / 日本語・ローマ字の日本住所を標準表記にします。住所の階層、町名補完、郵便データとの整合、日本郵便ローマ字の英語表記を返します。match_status が unverified の場合、台帳との一致は確認されていません。最終判定は jp_address_validate を使用してください。郵便番号の入力がない場合、candidate_count は0です。事業所の個別郵便番号（例: 100-8310）と地番（番地）住所にも対応します。 用途: 入力に郵便番号があってもなくても、日本住所を正規化・標準化したい場合。 返却: 標準表記：正規化した構成要素、一意な町名の補完、日本郵便ローマ字の英語住所、郵便データとの整合と候補。未入力の郵便番号は推定せず、座標（geocode）と最終判定（validate）は返しません。 料金: 成功した呼び出し1回あたり $0.005 USDC（Base上のx402決済）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Postal address in Japan, in Japanese or romanized (1-9-1 Marunouchi, Chiyoda-ku, Tokyo). Not a blockchain wallet address. Postal code optional. / 日本国内の住所（日本語・ローマ字）。ウォレット不可。郵便番号は任意。",
                "maxLength": 500,
                "minLength": 1,
                "title": "Address",
                "type": "string"
              },
              "response_language": {
                "default": "both",
                "description": "Response presentation language: ja, en, or both. / レスポンス表示言語: ja（日本語）、en（英語）、both（両方）。",
                "enum": ["ja", "en", "both"],
                "title": "Response Language",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Normalize Japanese address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:863cf6019f46fc50dd358eea0cbb5a8820e4b60573a1b8a8382086ec7f3fcc64"
        },
        {
          "name": "jp_address_validate",
          "title": "Validate Japanese address",
          "description": "Decide whether a Japanese address (Japanese or romanized) holds at the level you need, from parser, postal and geocoder evidence: exact/partial/ambiguous/conflict/unverified with reasons. Use when: You need one evidence-based Japanese address quality decision combining parsed address, postal evidence, and geocoder evidence. Returns: Exact, partial, ambiguous, conflict, or unverified status with accepted hierarchy, confidence signals, validation scope, and reasons. Price: $0.005 USDC per successful call, paid with x402 on Base. / 日本住所（日本語・ローマ字）が必要な階層で成立するかを、解析・郵便番号・ジオコーディングの根拠から判定します。 用途: 解析住所、郵便番号根拠、ジオコーダー根拠を統一ルールで判定したい場合。 返却: 完全一致、部分一致、候補不一意、矛盾、未検証の状態に加え、採用階層、信頼度、判定範囲、理由を返します。 料金: 成功した呼び出し1回あたり $0.005 USDC（Base上のx402決済）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Postal address in Japan, in Japanese or romanized (1-9-1 Marunouchi, Chiyoda-ku, Tokyo). Not a blockchain wallet address. Give address or parsed. / 日本国内の住所（日本語・ローマ字）。ウォレット不可。addressかparsedの一方。",
                "title": "Address"
              },
              "geocode_evidence": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional prior output from /v1/jp/addresses/geocode; candidates and statuses are advisory and recomputed locally. / 任意のgeocode出力。候補とstatusは補助情報で、ローカルで再計算されます。",
                "title": "Geocode Evidence"
              },
              "parsed": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Output from /v1/jp/addresses/parse or normalize containing at least one non-empty address component. / parseまたはnormalizeの出力。空でない住所構成要素を1つ以上含めます。",
                "title": "Parsed"
              },
              "postal_evidence": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional prior output from /v1/jp/postal-codes/lookup; status/confidence are recomputed and not trusted. / 任意のpostal-lookup出力。statusとconfidenceは再計算され、無条件には信頼されません。",
                "title": "Postal Evidence"
              },
              "required_level": {
                "anyOf": [
                  {
                    "maximum": 8,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Required hierarchy level; Jageocoder 5/6=oaza/aza, 7=block, 8=building/house node. / 必須階層。Jageocoderの5/6=大字・字、7=街区、8=建物・号ノード。",
                "title": "Required Level"
              },
              "strict": {
                "default": false,
                "description": "Require all supplied evidence to agree. / 入力された根拠の完全一致を要求。",
                "title": "Strict",
                "type": "boolean"
              }
            },
            "type": "object"
          },
