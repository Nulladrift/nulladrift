        {
          "name": "jp_company_verify",
          "title": "Verify Japanese company",
          "description": "Verify a Japanese company by its registered name — Japanese, registered English (NTA, EDINET, GLEIF) or romanized — or 13-digit corporate number (法人番号) against the NTA registry; an address (Japanese or romanized) is comparison evidence only. Returns the Japanese legal name plus a sourced English name and address. For a brand, trade or short name, use jp_company_resolve. Use when: You need a Japanese company or corporate-number lookup. Returns: Corporate number, registered Japanese legal name (legal_name_ja) and address, English name (NTA official, EDINET, or romanized reading) and English address (official or Japan Post romanization) with their sources, active or closed status, and match evidence. Price: $0.01 USDC per successful call, paid with x402 on Base. / 登記名（日本語・登録英文名・ローマ字）または法人番号を国税庁の法人番号公表データと照合します。住所（日本語・ローマ字）は比較用の根拠です。ブランド名・通称は jp_company_resolve を使用してください。 用途: 日本企業または法人番号を検索・照合したい場合。 返却: 法人番号、登記上の法人名（legal_name_ja）・住所、英語名（国税庁公式・EDINET・読みのローマ字）と英語住所（公式または日本郵便ローマ字）とその出典、活動状態、一致根拠を返します。 料金: 成功した呼び出し1回あたり $0.01 USDC（Base上のx402決済）。",
