                "default": null,
                "description": "13-digit corporate number (法人番号). Any 13 digits are accepted; an invalid check digit is reported in match.signals as invalid_check_digit.",
                "title": "Corporate Number"
              },
              "duns": {
                "anyOf": [
                  {
                    "maxLength": 16,
                    "type": "string"
                  },
                  {
                    "type": "null"
