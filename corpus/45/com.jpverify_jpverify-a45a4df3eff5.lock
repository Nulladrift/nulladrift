        {
          "name": "jp_invoice_issuer_check",
          "title": "Check invoice issuer",
          "description": "Check a T-number against the issuer name on the invoice (Japanese or English), the address (optional), the invoice date (optional: registered on that date, not cancelled or expired) and your supplier master number (optional: expected_registration_number or expected_corporate_number), using Japan's NTA registries. JPVerify does not read invoice files. Use when: You have a T-number and the issuer name from an invoice (address and invoice date optional) and need to know whether they belong together and the issuer was registered on the invoice date. Returns: Registry fields, issuer name and address comparison, registration on the invoice date, supplier master comparison, and one status per check in check_results. Price: $0.05 USDC per successful call, paid with x402 on Base. / T番号を請求書の発行者名（日本語・英語）・住所（任意）・日付（任意。その日に登録済みで取消・失効前か）・仕入先マスターの番号（任意）と国税庁データで照合します。ファイルの読み取りは行いません。 用途: 請求書のT番号と発行者名（住所・日付は任意）が一致するか、請求書の日付時点で登録済みかを確認したい場合。 返却: 国税庁の登録情報、発行者名・住所の比較結果、請求書日付時点の登録状況、確認項目ごとの結果を返します。 料金: 成功した呼び出し1回あたり $0.05 USDC（Base上のx402決済）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional issuer address as printed on the invoice, compared with the registry address. / 請求書に記載された発行者住所（任意）。登記住所と比較します。",
                "title": "Address"
              },
              "expected_corporate_number": {
                "anyOf": [
                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional 13-digit corporate number of this supplier from your own supplier master data; compared with the corporate number registered for the T-number. / 仕入先マスターに登録済みの法人番号（任意）。T番号の登録上の法人番号と比較します。",
                "title": "Expected Corporate Number"
              },
              "expected_registration_number": {
                "anyOf": [
                  {
                    "maxLength": 32,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional T-number of this supplier from your own supplier master data (not from the invoice). A different invoice T-number means the invoice may come from another company. / 仕入先マスターに登録済みのT番号（任意。請求書の値ではありません）。",
                "title": "Expected Registration Number"
              },
              "invoice_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional invoice (transaction) date, YYYY-MM-DD: checks that the issuer was registered on that date and not yet cancelled or expired. / 請求書の取引年月日（任意）。その日に登録済みで、取消・失効前かを確認します。",
                "title": "Invoice Date"
              },
              "registration_number": {
                "description": "Qualified-invoice registration number: T followed by 13 digits, e.g. T1013301046627. / 適格請求書発行事業者登録番号（T＋13桁）。",
                "maxLength": 32,
                "minLength": 1,
                "title": "Registration Number",
                "type": "string"
              },
              "response_language": {
