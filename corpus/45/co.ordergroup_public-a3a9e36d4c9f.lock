{
  "lockfileVersion": 2,
  "subjects": {
    "co.ordergroup/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ordergroup.co/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ordergroup-public",
        "title": "Order Group",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Order Group is a custom software development company (energy, fintech, IoT, AI) based in Warsaw, Poland, building software since 2013. Use `list_case_studies` to show relevant past projects, and `submit_project_enquiry` to send the user's project enquiry to the team. Before submitting, confirm the e-mail address and the message with the user, then show them the 'relay_to_user' text from the result.",
      "tools": [
        {
          "name": "list_case_studies",
          "title": "List Order Group case studies",
          "description": "List Order Group's published case studies (title, URL, short description), optionally filtered by a keyword such as 'fintech', 'energy', 'IoT' or 'mobile'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Default: en.",
                "enum": ["en", "pl"],
                "type": "string"
              },
              "query": {
                "description": "Optional keyword to filter by.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:15f0f063f90cf910e68db81aa0876109bc9ff29069c269bc4faa5a567b769373"
        },
        {
          "name": "submit_project_enquiry",
          "title": "Send a project enquiry to Order Group",
          "description": "Send a software project enquiry to Order Group on the user's behalf. A person replies by e-mail within 48 hours on business days. Confirm the e-mail address and the message with the user before calling, and show them the 'relay_to_user' text from the result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Free text, e.g. '50-100k EUR'.",
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "email": {
                "description": "The user's reply-to e-mail.",
                "format": "email",
                "type": "string"
              },
              "language": {
                "description": "Language of 'relay_to_user' (the user's language). Default: en.",
                "enum": ["en", "pl"],
                "type": "string"
              },
              "message": {
                "description": "What the user wants built, with any context they gave.",
                "maxLength": 4000,
                "minLength": 20,
                "type": "string"
              },
              "name": {
                "description": "The user's name.",
                "type": "string"
              },
              "timeline": {
                "description": "Free text, e.g. 'Q1 2027'.",
                "type": "string"
              }
            },
            "required": ["email", "message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:78166bea13fa564bdf324cf0724e8cc1fe0bf316c7bc5e2c6fb00914ece18b4c"
        }
      ],
      "digest": "sha256:eeded9c496ab7e6b3b5cdd63e746431d26a1a1c89f834999840d9d116898af21"
    }
  }
