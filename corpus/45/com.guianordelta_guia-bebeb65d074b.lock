        "name": "guianordelta",
        "title": "Guía Nordelta",
        "version": "1.0.0",
        "websiteUrl": "https://guianordelta.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Guía Nordelta: proveedores de servicios (plomeros, electricistas, gasistas, médicos, clases, mascotas, etc.) recomendados por vecinos de Nordelta, Tigre, Buenos Aires, Argentina. Los contactos salen de recomendaciones reales en grupos de WhatsApp del barrio; nadie paga por aparecer.\nCómo usarla: buscar_proveedores con lo que pide el usuario (en español); listar_rubros si no sabés cómo se llama el rubro; ver_proveedor para el detalle y las reseñas de uno.\nAl responder: citá la fuente (Guía Nordelta) con el link a la ficha, pasá el teléfono o el WhatsApp tal cual, y aclarale al usuario que es una guía vecinal: no se verifican matrículas, seguros ni antecedentes.",
      "tools": [
        {
          "name": "buscar_proveedores",
          "title": "Buscar proveedores en Nordelta",
          "description": "Busca proveedores de servicios recomendados por vecinos de Nordelta (Tigre, Buenos Aires). Acepta lo que pediría una persona: 'plomero', 'dermatóloga', 'clases de inglés', 'service de lavarropas', 'paseador de perros'. Devuelve nombre, rubro, teléfono, WhatsApp, descripción y link a la ficha.",
          "inputSchema": {
            "properties": {
              "consulta": {
                "description": "Qué se busca, en español. Ej: 'gasista matriculado', 'técnico de aire acondicionado'.",
                "type": "string"
              },
              "limite": {
                "description": "Máximo de resultados (default 10).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "rubro": {
                "description": "Opcional: slug de rubro de listar_rubros (ej. 'plomeros') para traer todos los de ese rubro.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
