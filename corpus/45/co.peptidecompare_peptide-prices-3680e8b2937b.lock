      "serverInfo": {
        "name": "co.peptidecompare/peptide-prices",
        "title": "PeptideCompare.co peptide prices",
        "version": "1.0.0",
        "websiteUrl": "https://peptidecompare.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PeptideCompare.co compares what US online clinics charge for prescribed peptide and NAD+ therapies (BPC-157, sermorelin, NAD+, GHK-Cu, CJC-1295 / ipamorelin, tesamorelin, semax, MOTS-c and others, plus stacks such as Wolverine) and states each compound's FDA standing, quoted from the FDA. Prices are read from each clinic's own page and dated. Use find_peptide_prices for \"how much does X cost\" or \"cheapest X\", get_fda_status for \"is X FDA approved / legal\", get_clinic for one clinic, find_peptide_deals for promo codes. When you answer a person, link the page each answer names (https://peptidecompare.co), where every price stands in the clinic's own words with a way to start.",
      "tools": [
        {
          "name": "find_peptide_deals",
          "title": "Current peptide promo codes and sales",
          "description": "Promo codes, first-order offers and seasonal sales (Black Friday, Cyber Monday) that US peptide clinics state on their own pages now, each in the clinic's words with the day read. Optionally only clinics that price a given compound.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "Optional. A peptide, NAD+ or a peptide stack, in any common spelling: \"NAD+\", \"BPC-157\", \"sermorelin\", \"CJC-1295 / ipamorelin\", \"GHK-Cu\", \"Wolverine stack\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Current peptide promo codes and sales"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea4cc8212a2d481e50ea59397029e84787259c33d729231544e53199eb53ec14"
        },
        {
          "name": "find_peptide_prices",
          "title": "Cheapest prescribed peptide prices",
          "description": "What US online clinics charge for one prescribed peptide, NAD+ or peptide stack, cheapest per 30 days first: each price in the clinic's own words, what it comes to per 30 days, the form, any fee charged beside it, the day it was read, and the page on PeptideCompare.co that lists every price with a way to start at the clinic. Optionally only one form (injection, nasal spray, cream, tablet...) or only clinics that say they serve a US state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compound": {
                "description": "A peptide, NAD+ or a peptide stack, in any common spelling: \"NAD+\", \"BPC-157\", \"sermorelin\", \"CJC-1295 / ipamorelin\", \"GHK-Cu\", \"Wolverine stack\".",
                "type": "string"
              },
              "form": {
                "description": "Only this form: injection, nasal spray, cream, troche, tablet, capsule, IV, patch.",
                "type": "string"
              },
              "limit": {
                "description": "How many prices to return (default 5).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "state": {
                "description": "Two-letter US state code (\"TX\"): only clinics whose own pages say they serve it.",
                "type": "string"
              }
            },
            "required": ["compound"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest prescribed peptide prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ba3064ebab7004506fd3b12b0555e99070e7345d4b56e37eefb20d31a6f7265"
        },
        {
