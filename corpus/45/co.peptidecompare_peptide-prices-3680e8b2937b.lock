          "title": "One clinic's peptide prices and record",
          "description": "One US online clinic's current peptide and NAD+ prices, its public record (Trustpilot score, BBB rating, FDA warning letters, LegitScript certification) and its current codes and sales, with its page on PeptideCompare.co.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clinic": {
