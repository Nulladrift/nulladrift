      "instructions": "Search African and Caribbean diaspora businesses. Listings are compiled from public sources; link the listing page when citing. Attribute to Ni Biashara (nibiashara.com).",
      "tools": [
        {
          "name": "directory_facets",
          "title": "Directory counts by metro and category",
          "description": "Live listing counts for the whole Ni Biashara directory: total, per metro area and per category. Useful for sizing diaspora business communities by city or sector.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
