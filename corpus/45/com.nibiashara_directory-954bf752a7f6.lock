        },
        {
          "name": "get_business",
          "title": "Get one diaspora business",
          "description": "One Ni Biashara listing by its id (from search_directory results or a nibiashara.com/b/<id>/ link): name, category, city, metro, phone, website, social links, status and the listing and claim links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Listing id, e.g. '224-cafe-atlanta'",
                "maxLength": 200,
                "pattern": "^[a-z0-9][a-z0-9-]*$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one diaspora business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f955f3115c68c09afa01f5d4cd5ca0ff3df81610556bb038759851c61355757c"
        },
        {
          "name": "search_directory",
          "title": "Search diaspora businesses",
          "description": "Keyword search of the Ni Biashara directory of African and Caribbean diaspora businesses in the US, Canada and beyond, optionally filtered by city, metro and category. Listings are compiled from public sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category, e.g. 'Catering & Events'",
                "maxLength": 100,
                "type": "string"
              },
              "city": {
                "description": "City, e.g. 'Houston'",
                "maxLength": 100,
                "type": "string"
              },
              "limit": {
                "description": "Maximum results (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "metro": {
                "description": "Metro, e.g. 'DFW'",
                "maxLength": 100,
                "type": "string"
              },
              "q": {
                "description": "Business name, service or keywords, e.g. 'catering' or 'ethiopian restaurant'",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
