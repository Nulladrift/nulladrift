        {
          "name": "quote_patch",
          "title": "Price a custom patch",
          "description": "Price a custom patch from the live PatchDesign.AI production price table: type, size and quantity in, the per-patch and total price in USD out, with the next quantity breaks and what the price already includes (artwork, a pre-production sample, worldwide shipping). The price returned is the customer's price, not a starting figure. No quote is needed unless they choose a backing or border with no set price; then that price is confirmed within 2 business hours. There is no minimum: quantity 1 returns the sample prices, and by default quote the price breaks. Use it when the user asks about a price or a minimum.",
          "inputSchema": {
            "properties": {
              "heightIn": {
                "description": "Height in inches, 1 to 12.5. Default 3.",
                "maximum": 12.5,
                "minimum": 1,
                "type": "number"
              },
              "patchType": {
                "description": "Patch type: embroidered (default), woven, chenille, printed, pvc-2d or pvc-3d. Iron-on, velcro and sew-on are backings on an embroidered patch, so use embroidered for those.",
                "enum": ["embroidered", "woven", "chenille", "printed", "leather", "pvc-2d", "pvc-3d"],
                "type": "string"
              },
              "quantity": {
                "description": "How many patches. Default 100. Use 1 for a single patch.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "widthIn": {
                "description": "Width in inches, 1 to 12.5. Default 3.",
                "maximum": 12.5,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
