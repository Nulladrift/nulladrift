    "app.ahook/ahook": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ahook.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
