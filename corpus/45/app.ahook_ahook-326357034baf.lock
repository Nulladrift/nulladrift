      "serverInfo": {
        "name": "ahook",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Webhooks, email, and support tickets designed for agents. Create an inbox, hand its URL to a webhook sender or send mail to <slug>@ahook.app, then wait for events, list them, and extract fields. File and manage support tickets via the API.",
      "tools": [
        {
          "name": "create_inbox",
          "description": "Create a webhook inbox. Returns its ingest URL and a read token (shown once). The same slug is the inbox email address <slug>@ahook.app. Optional slug: a branded username for the inbox (3-63 lowercase letters, digits, and hyphens) — any account may pick one, including anonymous-free via MCP; the inbox never expires, so the slug is permanent. Reserved names are rejected (invalid_slug) and a taken name returns slug_taken.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Optional username slug for the inbox (e.g. vintagefinds). Any account may pick one, including anonymous-free via MCP; the inbox never expires, so the slug is permanent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ed1ab9f83acfcccfbc74073b669082a809507fdf82342073b4befaa5ec1b33ab"
        },
        {
          "name": "delete_inbox",
          "description": "Delete an inbox and its events. Auth: Authorization Bearer read token header.",
          "inputSchema": {
            "properties": {
              "inbox_id": {
                "description": "The inbox id returned when the inbox was created (private; the slug in the ingest URL is the public part).",
                "type": "string"
              }
            },
            "required": ["inbox_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ef78e0a7c74370dc4f5e2dbf7a3b37aeffac3818523789b2f4a1552daf0ee6df"
        },
        {
          "name": "extract_field",
          "description": "Pull a JSON path out of an event body. Auth: Authorization Bearer read token header.",
          "inputSchema": {
            "properties": {
              "event_id": {
                "description": "The numeric id of the event.",
                "type": "integer"
              },
              "inbox_id": {
                "description": "The inbox id returned when the inbox was created (private; the slug in the ingest URL is the public part).",
                "type": "string"
              },
              "json_path": {
                "description": "Dot-separated path into the event JSON body, e.g. user.email.",
                "type": "string"
              }
            },
            "required": ["event_id", "inbox_id", "json_path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38bbc0d508c8880b199cbade3fbcb3b0a0834a8828f9848af953a09c8333c1f3"
        },
        {
          "name": "get_event",
          "description": "Get one event by id. Auth: Authorization Bearer read token header.",
          "inputSchema": {
            "properties": {
              "event_id": {
                "description": "The numeric id of the event.",
                "type": "integer"
              },
              "inbox_id": {
                "description": "The inbox id returned when the inbox was created (private; the slug in the ingest URL is the public part).",
                "type": "string"
              }
            },
            "required": ["event_id", "inbox_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc94216b55803a091f80b4402506655531ef402924682db2ccd22a3626cc87f8"
        },
        {
          "name": "list_events",
          "description": "List events in an inbox. Auth: Authorization Bearer read token header.",
          "inputSchema": {
            "properties": {
              "after": {
                "description": "Only list events with an id greater than this cursor.",
                "type": "integer"
              },
              "inbox_id": {
                "description": "The inbox id returned when the inbox was created (private; the slug in the ingest URL is the public part).",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of events to return.",
                "type": "integer"
              }
            },
            "required": ["inbox_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:151a78db57b954f6f036abc7313e38d03ea6a55ca1dad05a18a171bb66295bb2"
        },
        {
          "name": "search",
          "description": "Search the public API index (AHOOK Search, 14,000+ callable APIs and MCP servers). Ranks for whether an agent can actually use a result: BM25 text relevance plus readiness (machine interface, declared auth, liveness, llms.txt, ownership, example call), freshness, authority, and completeness. Every result carries its score_breakdown. Auth: Authorization Bearer ahk_ account key header (create one with POST /api/v1/accounts). One search = 1 metered read (meter search_queries, included in the $1 base, no per-search charge in v1). Rate limit: free 10/min, paid 60/min.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Exact category match, e.g. tts, coding, ai-models, payments.",
                "type": "string"
              },
              "free_commercial": {
                "description": "Only results whose free tier states commercial use.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results, 1..50, default 10.",
                "type": "number"
              },
              "max_token_cost": {
                "description": "Only results whose token_cost.input_per_1m fits.",
                "type": "number"
              },
              "max_unit_cost": {
                "description": "Only results whose unit_cost.amount_min fits.",
                "type": "number"
              },
              "query": {
                "description": "Search terms. Empty = browse mode: highest score first.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca218218a21d860ce2974d73c59ed19ec97a0200690d87d1f040a4aabbb89e81"
        },
        {
          "name": "wait_for_event",
          "description": "Wait for the next event in an inbox after a cursor, up to 30s. Auth: Authorization Bearer read token header.",
          "inputSchema": {
            "properties": {
              "after": {
                "description": "Only return the first event with an id greater than this cursor (0 for the first event).",
                "type": "integer"
              },
              "body_contains": {
                "description": "Only return an event whose body contains this text.",
                "type": "string"
              },
              "inbox_id": {
                "description": "The inbox id returned when the inbox was created (private; the slug in the ingest URL is the public part).",
                "type": "string"
              },
              "timeout_ms": {
                "description": "How long to wait in milliseconds (max 30000).",
                "type": "integer"
              }
            },
            "required": ["inbox_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
