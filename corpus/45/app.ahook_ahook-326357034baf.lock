            "readOnly": false
          },
          "digest": "sha256:ed1ab9f83acfcccfbc74073b669082a809507fdf82342073b4befaa5ec1b33ab"
        },
        {
          "name": "delete_event",
          "description": "Delete one event from an inbox (per-event purge). Auth: Authorization Bearer read token header. Archived (cold-storage) events cannot be purged this way.",
          "inputSchema": {
            "properties": {
              "event_id": {
                "description": "The event id to delete.",
                "type": "integer"
              },
              "inbox_id": {
                "description": "The inbox id.",
                "type": "string"
              }
            },
            "required": ["event_id", "inbox_id"],
            "type": "object"
          },
          "annotations": {
