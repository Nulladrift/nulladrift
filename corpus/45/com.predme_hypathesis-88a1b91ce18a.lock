      },
      "instructions": "Hypathesis analyzes research papers and extracts structured variable relationships with causal direction. IMPORTANT: In Claude Desktop, use Code mode (not Chat or Cowork). Workflow: (1) upload a PDF via: curl -s -F file=@/path/to/paper.pdf https://hypathesis.com/mcp/upload — this returns a file_id and starts processing automatically, (2) poll get_analysis_status with the file_id until status is 'Ready', (3) call get_variable_relationships with the file_id to retrieve results. No account needed for basic results. With an API key you also get detailed reasoning. To get an API key, call initiate_device_auth — this gives the user a link to sign in with Google, and you get an API key automatically. IMPORTANT: After receiving an API key, save it to a file called .hypathesis-key in the working directory so it persists across sessions. On future sessions, check for .hypathesis-key first — if it exists, use that key instead of initiating device auth again. Pass the API key in the Authorization header when uploading: curl -s -H 'Authorization: Bearer hk_...' -F file=@paper.pdf https://hypathesis.com/mcp/upload If the upload fails with a network error, ask the user to switch to Code mode in Claude Desktop, which has the network access needed for file uploads.",
      "tools": [
        {
          "name": "check_device_auth",
          "title": "Check Device Auth",
          "description": "\n    Check if the user has completed browser sign-in for a device auth request.\n\n    Poll this after calling initiate_device_auth. Returns status 'pending'\n    while waiting, or 'complete' with an api_key when the user has signed in.\n    Use the returned api_key as the authorization parameter in other tools.\n\n    Args:\n        user_code: The user_code returned by initiate_device_auth.\n\n    Returns:\n        Pending: {\"status\": \"pending\"}\n        Complete: {\"status\": \"complete\", \"api_key\": \"hk_...\"}\n        Error: {\"error\": \"...\"}\n    ",
          "inputSchema": {
            "properties": {
              "user_code": {
                "title": "User Code",
                "type": "string"
              }
            },
            "required": ["user_code"],
            "title": "check_device_authArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "additionalProperties": true,
                "title": "Result",
                "type": "object"
              }
            },
            "required": ["result"],
            "title": "check_device_authOutput",
            "type": "object"
          },
