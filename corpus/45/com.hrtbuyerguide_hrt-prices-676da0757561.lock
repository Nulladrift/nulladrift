      },
      "instructions": "HRT Buyer Guide compares menopause hormone therapy programs on recorded price, fees, commitment, cancellation terms and transparency. Rankings are score-based, built from the published criteria. Every figure carries the provider page it was read from and the day it was checked. HRT Buyer Guide is operated by Open Water Rx LLC. Sponsored entries are labeled and scored on the same criteria. This data is price and terms information, not medical advice.",
      "tools": [
        {
          "name": "find_hrt_prices",
          "title": "Find HRT Prices",
          "description": "Current US self-pay prices of menopause hormone therapy (HRT) programs from HRT Buyer Guide's dated records, returned in the guide's ranked order (score-based). An optional form filter (topical, patch or oral) limits results to programs whose recorded price covers that form. Each result names its source page and check date.",
          "inputSchema": {
            "properties": {
              "form": {
                "enum": ["topical", "patch", "oral"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find HRT Prices"
          },
          "behavior": {
            "destructive": false,
