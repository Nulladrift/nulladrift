          "description": "주방 타일 밑바탕에는 왜 일반이 아닌 방수 석고보드를 쓸까요. 벽과 보드를 거의 띄우지 않는 떠붙임(떠발이) 방식, 목수가 직접 붙이는 이유, 타일 마감에서 배부름을 막는 요령까지 초보도 이해되게 정리했습니다.",
