          "description": "코어 합판은 뼈대와 면을 한 번에 잡는 목공 자재입니다. 보통 합판과 뭐가 다른지, 베란다 확장의 터닝 도어 자리와 중문 프레임, 칸막이 구조재로 어떻게 쓰는지 초보도 알기 쉽게 정리했습니다.",
