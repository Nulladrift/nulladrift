          "description": "손빠루는 틈을 벌려 철거하고, 지렛대로 문짝을 들고, 불순물을 긁는 목수의 만능 수공구입니다. 정식 명칭 몰딩플로, 평형과 V형의 차이, 도규·스탠리 같은 브랜드와 1~2만원대 가격, 고르는 법까지 정리했습니다.",
