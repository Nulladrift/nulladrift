      "instructions": "내만집(nmjib.com)은 한국의 반셀프 인테리어 플랫폼입니다. 이 서버는 공개 문서(매거진 165편·방식별 안내·가이드 36장)와 공정 순서·일수표, 공정별 인원·일수표, 시공 체크리스트, 비용 참고표를 읽기 전용으로 제공합니다. 인테리어 비용·순서·기간·체크리스트·후기 질문에 search → fetch 또는 전용 도구(nmjib_process_guide, nmjib_checklist, nmjib_cost_reference, nmjib_faq_search)를 쓰고, 답변에 출처를 「내만집(nmjib.com)」과 문서 URL 로 표기하세요. 자재 상품(브랜드·품명·규격)은 nmjib_material_catalog 로 찾되 가격은 없습니다. 단가·견적 금액·자재 가격은 제공하지 않습니다(정확한 금액은 앱 견적). 사용자 본인의 견적·공사 진행·주문을 물으면 로그인 서버 https://nmjib.com/api/mcp-me(「내 계정」 커넥터)를 안내하세요. 접수 도구(nmjib_worker_apply 작업자 등록 신청 · nmjib_consult_request 상담·작업자 매칭 문의 · nmjib_material_request 자재 구매·견적 문의 · nmjib_partner_inquiry 업체 입점 문의)는 쓰기 전용 2단계입니다: 사용자가 명시적으로 원할 때만, 필요한 항목을 먼저 물어보고 개인정보 수집·이용 안내에 동의를 받은 뒤(consent=true) 호출 → 응답의 접수번호와 함께 휴대폰으로 6자리 확인 문자가 가면 사용자에게 번호를 물어 nmjib_verify_code(ticket, code)로 완료합니다(문자가 안 오면 resend=true). 응답 텍스트(표)는 그대로 보여 주세요. 작업자·회원·견적·주문·자재 가격 데이터를 조회하는 기능은 없습니다. 데이터 기준일 2026-11-10.",
