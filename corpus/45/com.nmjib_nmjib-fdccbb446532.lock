          "description": "2Ply(투피)는 석고보드를 두 겹 붙이는 시공입니다. 단열·방음·내구성 같은 기능뿐 아니라, 얇은 마감재를 튼튼하게 고정하는 목공 기법으로도 쓰입니다. 선반 시공 사례로 그 원리를 풀어 봅니다.",
