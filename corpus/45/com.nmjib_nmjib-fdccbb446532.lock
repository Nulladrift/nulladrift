          "description": "수직·수평·직각이 어긋난 시골집을 반듯하게 바꾸는 목공. 한치각재로 벽 뼈대 세우기, 50mm 스티로폼 단열, 낮은 천장 다루기까지 — 전남 해남 구옥 17일 목공 기록으로 셀프 인테리어 목공의 핵심을 정리했습니다.",
