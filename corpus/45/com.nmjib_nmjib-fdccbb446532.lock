          "description": "인테리어 목공 현장에서 망치는 못을 박지 않습니다. 못질은 타카가 가져갔고, 지금 망치는 철거와 미세 조정을 맡죠. 나무·티타늄 소재 차이, 도규·마르티네즈 브랜드와 가격, 손가락 안전까지 목공 망치의 진짜 역할을 정리했습니다.",
