          "description": "내만집 시공 체크리스트. phase=pre(공사 전 36항목: 행위허가·주민동의·공사신고·계약·자재·도면), during(공정별: 22공정 시공 확인 항목, process 로 한 공정만), post(공사 후 검수 22항목). \"공사 전에 뭘 준비해야 해\", \"목공 때 확인할 것\", \"입주 전 검수\" 질문에 쓴다.",
