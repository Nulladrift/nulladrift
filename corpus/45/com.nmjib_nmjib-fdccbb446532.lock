        {
          "name": "nmjib_consult_request",
          "title": "집주인 상담·작업자 매칭 문의(접수 1단계)",
          "description": "집주인이 내만집 담당자와 상담(반셀프 견적·공정별 작업자 매칭·공정 계획)을 원할 때 문의를 접수한다. 저장만 하고 되읽지 않는다. 호출하면 휴대폰으로 6자리 확인 문자가 가고 접수번호가 온다 → 문자의 번호를 받아 nmjib_verify_code 로 완료한다. 사용자가 명시적으로 \"상담 받고 싶다/작업자 연결해 달라/연락 달라\"고 할 때만 쓴다(이름·연락처·지역·평수·공사 범위를 물어보고 동의를 받은 뒤 consent=true). 작업자가 필요한 공정이 정해져 있으면 trades 에 넣는다(예: [\"타일\",\"도배\"]). 금액 산출 도구가 아니다 — 비용 질문은 nmjib_cost_reference(후기 집계 범위)를 쓰고, 정확한 우리집 금액은 앱 견적을 안내한다. 작업자 명단·연락처를 돌려주는 기능은 없다.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "complex": {
                "description": "아파트·단지명",
                "maxLength": 80,
                "type": "string"
