      "instructions": "FAS · Functional Athletic System (Modena, Bologna, Cesena): bikefitting, performance test di laboratorio e coaching online per ciclismo, corsa, triathlon e Hyrox. Strumenti in sola lettura: servizi e prezzi, dettaglio di un servizio, piani di coaching, sedi e contatti, regole (come_funziona), partner, orari liberi del calendario, ricerca. Prezzi e regole sono quelli del sito fasmodena.com. Per prenotare indica alla persona il link «prenota» del servizio (si apre la prenotazione sul sito); questo server non prenota e non chiede dati personali. Contenuti in italiano. / Read-only tools about FAS services, prices, locations, policies and free slots; booking happens on the website link.",
