{
  "lockfileVersion": 2,
  "subjects": {
    "com.perpfinder/perpfinder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://perpfinder.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "perpfinder",
        "title": "PerpFinder public data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only tools over PerpFinder public data. Every result has asOf, source and a page link. Missing values are null, not zero. Cite results as \"Data: PerpFinder\" with the page link.",
      "tools": [
        {
          "name": "get_cheapest_venue",
          "title": "Cheapest perp venue for a market order",
          "description": "Venues ranked by measured all-in cost (taker fee + half-spread + price impact) of a perp market buy at the base fee tier, from the newest stored 6-hour order-book sweep. Rows that cannot fill or have unconfirmed depth are listed apart, with the reason.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Base asset.",
                "enum": ["BTC", "ETH", "SOL", "XRP", "BNB", "DOGE", "HYPE"],
                "type": "string"
              },
              "size": {
                "description": "Order size in USD. Default 10000.",
                "enum": [10000, 100000, 1000000],
                "type": "integer"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cheapest perp venue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b8ecaa5e315dcf1910e2bc47286ad7c01657646a644879f376c77b996f76f7f4"
        },
        {
          "name": "get_funding",
          "title": "Current funding rates for one asset",
          "description": "Current perpetual funding rate of one asset on each venue that lists it, normalized to a 1-hour rate, with the venue interval, open interest and price. Rates are fractions: 0.0001 is 0.01%.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "asset": {
                "description": "Asset symbol, for example BTC.",
                "pattern": "^[A-Za-z0-9]{1,15}$",
                "type": "string"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Funding rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30b388f740b94ce8cc55a3f07c97cbbe1a3a97bd16590cd036c57eb80a00b086"
        },
        {
          "name": "get_venue_access",
          "title": "Perp venue access by country",
          "description": "For one jurisdiction, what each venue and the local regulator publish about perp access: yes, restricted, unclear or no, with the basis and the sources a person opened. Not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Jurisdiction code (us, uk, eu, ca, au, sg, no) or name, for example Norway or United Kingdom.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Venue access"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f908cfcc9fe99d03c4de6940f993846e4ee78775aa781219db6bd9dc4494877"
        },
        {
          "name": "get_venue_fees",
          "title": "Fee schedule of one venue",
          "description": "Base maker and taker rates, the volume fee ladder, leverage and funding terms of one perp venue, each with its source and check date, plus the measured all-in cost of BTC and ETH market buys.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "venue": {
                "description": "Venue slug, for example hyperliquid or binance.",
                "enum": ["hyperliquid", "lighter", "aster", "bybit", "binance", "okx", "bitget", "mexc", "gate-io", "kucoin", "dydx", "gmx", "edgex", "paradex", "extended", "grvt", "kraken", "coinbase", "htx", "bingx"],
                "type": "string"
              }
            },
            "required": ["venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Venue fees"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f91d398252fb1e5f3dd80dca0f783b2ff3a1769735ce951b97cedc51197ce6ba"
        },
        {
          "name": "get_volume_ranking",
          "title": "Perp volume ranking",
          "description": "CEX and DEX perpetual venues ranked by reported volume and by adjusted volume. Adjusted is the reported figure with held-out venues removed; each hold-out has a dated reason. Measurements, not accusations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of venues. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "window": {
                "description": "Default 24h.",
                "enum": ["24h", "7d"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Volume ranking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57f506747a8dea8005cddb5779923774d43697a460dd984b91211857698767e9"
        }
      ],
      "digest": "sha256:e75657269b7b2f99f69058874776cf5ecd6b8ab2d856ee58598c745ae949037e"
    }
  }
}
