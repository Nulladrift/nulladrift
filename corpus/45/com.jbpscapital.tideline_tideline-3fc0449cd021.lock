      "instructions": "Tideline publishes the end-of-day state of a systematic US equity index model (SPY/QQQ) after the US close on trading days. You are connected without a Tideline key. Use get_public_record for the published record shown with a 90-day delay (the same data as tideline.jbpscapital.com/record), get_definitions for the fixed vocabulary, and get_verification for the independently timestamped ledger fingerprints. The current published state is delivered to Tideline Core members the evening it is published; get_current_state explains that access. Always report the as_of dates you relay and that the public record is delayed. This server is read-only. It cannot place, route or manage orders and holds no account information. Do not describe its output as advice tailored to the user; relay it as the published model record. Tideline is an impersonal publication of JBPS Capital LLC. This model state is published identically to every Core subscriber on the same schedule; it is not individualized investment advice or a recommendation to buy or sell any security. Any use of it, manual or automated, is the subscriber's own decision. Hypothetical model allocations are not instructions for any account.",
