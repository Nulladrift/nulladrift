        {
          "name": "get_case",
          "title": "판례·해석례 본문",
          "description": "판례/해석례 본문 조회 — 판시사항·판결요지·참조조문(판례) 또는 질의요지·회답·이유(해석례).\n\n    응답의 `source_url`은 국가법령정보센터 원문 주소다 — 판례·해석례를 인용할 때는\n    **이 링크를 함께 제시하라**(감사·보고서에서 근거를 되짚을 수 있어야 한다).\n\n    **`error:\"case_body_unavailable\"`이면 `source_url`은 null이고 `existence_verified`는\n    false다**(2026-09-04). 이건 \"본문만 없다\"가 아니다 — 우리는 ①본문 미제공(하급심·\n    국세청 등 타기관 제공)과 ②그런 일련번호가 없음을 **구분하지 못한다**(본문 API 응답이\n    같다). 그러니 **링크를 만들어 채우지 마라**: law.go.kr 뷰어는 없는 번호에도 200과 빈\n    페이지를 주므로 열린다는 것이 존재의 증거가 아니다. 이 case_id가 search_cases 결과에서\n    온 것이면 그 결과의 사건명·사건번호·source_url만 인용하고, 아니면 아무것도 인용하지\n    말고 search_cases로 다시 찾아라.\n\n    **`headnote_available:false`이면** law.go.kr이 판시사항·판결요지 중 하나 이상을 비워서 준 판결\n    (하급심 등 — 대법원 판결도 판결요지만 빈 경우가 있다. 그때 `headnote_partial:true`이고 온 쪽은\n    원천 그대로다)이다 — 어느 필드가 원천에서 비었는지는 `headnote_note`가 말한다(참조조문은\n    따로 올 수 있으니 `referenced_laws`가 있으면 그대로 써라). 쟁점은\n    `body_excerpt`(판결 전문 앞부분)에서 직접 읽고, 요지를 지어내지 마라.\n    `error:\"case_id_invalid\"`는 case_id가 숫자 일련번호가 아니라는 뜻이다(사건번호를\n    넣었으면 search_cases의 질의로 넣어라).\n\n    Args:\n        kind: \"prec\" | \"expc\" (search_cases 결과의 kind)\n        case_id: search_cases 결과의 case_id(숫자 일련번호)\n    ",
          "inputSchema": {
