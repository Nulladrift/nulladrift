        {
          "name": "get_law_article",
          "title": "법령 조문 원문",
          "description": "법령 조문 원문 조회 — 6,000자를 넘으면 잘라서 주고 `truncated`로 공시한다.\n\n    **긴 조문은 잘린다(2026-10-15).** 원문이 6,000자를 넘으면 `truncated: true`와\n    `content_total_chars`(원문 총 글자수)·`content_shown_chars`·`paragraphs_shown`·\n    `paragraphs_omitted`·`paragraph_cut`·`truncation_note`가 온다. 그때 content는 조문\n    전체가 아니다 — 생략된 항을 \"없다\"고 말하지 말고, ref에 항을 붙여(예: \"소득세법 시행령\n    제155조제20항\") 다시 부르면 그 항부터 창을 열어 준다(`requested_paragraph`).\n    ref에 호를 붙이면(예: \"…제26조제1항제5호\") `requested_item_found`가 그 호의 실재를 말한다 —\n    false면 그 호는 본문에 없다(조문 전체를 줬을 뿐이다), null이면 판정 못 함(`requested_item_note`).\n    목까지 붙이면(예: \"…제25조제1항제5호바목\") `requested_mok_found`가 그 목의 실재를 같은 뜻으로 말한다.\n\n    **코퍼스가 둘이다(2026-08-29)** — 공공계약(국가·지방계약법 계열)과 세법(소득세법·\n    법인세법·부가가치세법·조세특례제한법·지방세법 등). 축은 법령명으로 자동으로 정해지니\n    부르는 쪽은 신경 쓸 것이 없다(\"소득세법 제55조\"도 \"국가계약법 시행령 제26조\"와 똑같이\n    넣으면 된다). 다만 **답할 때는 어느 법의 조문인지 밝혀라** — 세법 조문을 공공계약\n    근거로 인용하는 것은 우리가 막을 수 없다.\n\n    응답의 `notes`가 비어 있지 않으면 **법률 자체의 미정비 상호인용**이 탐지된\n    것이다(예: 제5항이 '제2항 각 호'를 인용하나 제2항에 각 호가 없음). 원문은\n    law.go.kr 현행 그대로이며 우리가 고치지 않는다 — 그 조문을 근거로 답할 때는\n    notes의 내용을 사용자에게 함께 알리고 단정을 피하라. notes에 `type: \"deleted_stub\"`이\n    있으면 **삭제된 조문·별표**다 — 현행 법령에 규정이 없으니 판단 근거로 인용하지 마라.\n\n    응답에 `assumption`이 있으면 **법령명을 우리가 추정해 채운 것**이다(예: \"시행령\n    제26조\" → 국가계약법 시행령). 지방계약 질문이었다면 틀린 법을 보고 있는 것이니\n    assumption.hint대로 법령명을 붙여 다시 부르고, 어느 법령 기준인지 사용자에게 밝혀라.\n    실무 약칭도 같은 자리에 공시된다 — 국계법·지계법, 법령명 뒤의 '영'(=시행령)·'규칙'(=시행규칙)·\n    '법'(=법률): \"국계법 영 50조\"는 국가계약법 시행령 제50조로 읽는다(get_law_article_asof·search_law 공통).\n\n    **`implementing_note`(및 `implementing_articles`)가 있으면 이 조문의 위임을 받은\n    하위 조문이 이 서버 안에 있다.** 조문 본문에 사유·요건·수치가 안 보이면 없어서가\n    아니라 아래로 넘겼기 때문이다 — 거기 적힌 ref를 그대로 get_law_article에 넣어 읽고\n    답하라(추가 검색 불필요). 본문이 값을 직접 정하고 있으면 본문이 근거다. 하위 조문의\n    `cites`는 그 조문이 이 조문의 어느 자리를 받았는지 스스로 밝힌 인용이다.\n\n    **`delegation_note`가 있으면 이 조문의 일부 값이 하위 규범에 넘겨졌다**(넘긴 자리는\n    `delegations[].where`). 그 자리의 배점·요율·금액 같은 수치가 조문에 안 보이는 것은\n    없어서가 아니라 하위 규범(시행령·시행규칙·예규·고시)에 넘겨졌기 때문이다(본문에\n    직접 적힌 값은 본문이 근거다). 그 자리가 쟁점이면 `delegations[]`의 `how`가 시키는\n    대로 그 규범을 먼저 읽고 답하라. `in_corpus`가 false면 이 서버 범위 밖이니 **\"규정이 없다\"고 말하지 말고**\n    law.go.kr로 안내하라. 조문만 읽고 수치를 단정하는 것이 이 필드가 막으려는 실패다.\n\n    **별표(표)도 같은 도구로 읽는다**(2026-08-23). search_law가 별표 히트로 준 law_ref\n    (\"건설기술 진흥법 시행령 [별표 8]\")를 그대로 넣으면 표 전문이 온다 — 이때 응답의\n    `kind`가 \"table\"이고, `related_article`이 있으면 그 표의 근거 조문이다(표만 인용하고\n    근거 조문을 빼면 읽는 쪽이 법적 근거를 되짚을 수 없다).\n\n    **계약예규·세부기준의 조문도 같은 도구로 읽는다**(2026-09-04). search_references가\n    준 `source`+`section`을 이어 붙여 넣으면 된다(\"(계약예규) 용역계약일반조건 제18조\").\n    이때 응답의 `kind`는 \"admin_rule\"이다 — **법률·시행령이 아니라 행정규칙(예규)**이니\n    인용할 때 그 신분을 밝혀라. 법령명·정식명 어느 쪽으로 불러도 같은 조문이 온다\n    (\"국가를 당사자로 하는 계약에 관한 법률 시행령 제26조\" = \"국가계약법 시행령 제26조\").\n    조 번호가 없는 행정규칙 단위도 연다(1.74.0): 세부기준 별표(\"조달청 시설공사 적격심사세부기준\n    [별표 10]\")와 장·절(\"지방자치단체 입찰시 낙찰자 결정기준 제4장 제6절\", 조각은 끝에 \"(2/24)\").\n    이때 `notes`가 표 경계·조각 나눔을 밝히니 함께 읽어라.\n\n    404(`article_not_found`)에서 `law_in_corpus`가 true면 **그 규범은 우리가 갖고 있고\n    그 조문번호만 없다**는 뜻이다 — 규범 자체가 없다고 말하지 마라. false면 범위 밖이며,\n    `corpus_laws`(법령)와 `corpus_admin_rules`(예규·세부기준)가 우리 범위 전부다.\n\n    **`law_currency`는 이 규범의 현행 여부를 언제 마지막으로 확인했는지다(2026-09-23).**\n    `status`가 \"verified\"가 아니면 `note_currency`가 함께 온다 — \"unverified\"(대조 실패·\n    오래됨: 모른다 / 현행판과 개정 이력이 갈림: `current_version_effective_date` 시행 개정분이\n    우리 판에 빠졌을 수 있음을 안다 — `unmerged_amendment`)·\"stale\"(현행보다 낡은 구판임을\n    안다 — `law_status`가 \"EXPIRED\"면 유효기간이 끝난 실효 고시다)·\"unmonitored\"(감시 대상 밖).\n    그때 이 조문을 현행으로 단정해 인용하지 말고 그 사실과 `last_verified_at`을 밝혀라.\n\n    Args:\n        ref: 정확한 조문 참조 (예: \"국가계약법 시행령 제26조\") 또는 별표 참조\n            (예: \"국가계약법 시행규칙 [별표 2]\") 또는 예규 조문 참조\n            (예: \"(계약예규) 용역계약일반조건 제18조\")\n    ",
          "inputSchema": {
