        {
          "name": "report_issue",
          "title": "오류·개선 제보",
          "description": "사용자가 **오류 제보·개선 요청·문의를 운영자에게 전해 달라고 했을 때만** 쓴다.\n\n    쓰는 때: 사용자가 \"이 조문 인용이 틀렸으니 신고해 줘\", \"운영자에게 알려 줘\", \"이런 질문도\n    답하게 해 달라고 전해 줘\"처럼 제보·요청을 부탁했을 때. 보내기 전에 무엇이 전달되는지\n    사용자에게 알린다. 사용자가 오류·불만·개선 희망·기관 도입 같은 이용 문의·후원 의사를\n    말했지만 전달을 부탁하지는 않았다면, 부르지 말고 \"운영자에게 전해 드릴까요?\"를 한 줄로\n    물어 동의할 때만 부른다(거절·무반응이면 다시 묻지 않는다). 응답의 접수번호(ref)와\n    회신 방법(reply_path)을 사용자에게 알린다.\n\n    쓰지 않는 때: 사용자가 요청하지 않았는데 질문을 남기려고 부르지 않는다. 답하기 전에\n    먼저 부르지도 않는다 — 이 도구는 답변·정정을 대신하지 않는다.\n\n    전달 내용(인자)과 같은 사용자의 직전 도구 호출 요약(서버 기록)이 운영자 검토용으로\n    저장된다(개인정보처리방침 https://contract.sallim.app/privacy). 개인 식별 정보(기관명·\n    사건번호·금액 조합 등)는 일반형으로 바꿔 적는다. 연락처(contact)는 사용자가 회신을 원해\n    직접 준 경우에만 담고, 그 건의 회신에만 쓴다.\n\n    Args:\n        category: \"wrong_citation\"(오인용) | \"outdated_law\"(개정 미반영) |\n            \"wrong_ruling\"(룰엔진 오판정) | \"tool_error\"(도구 오류) |\n            \"feature_request\"(기능 요청) | \"question_log\"(사용자가 전해 달라고 한, 답하지\n            못한 질문) | \"other\" | \"usage_inquiry\"(이용문의 — 기관 도입·대량 이용 등 이용\n            방식을 운영자와 상의하고 싶다며 전해 달라고 한 경우) | \"sponsor_inquiry\"(후원문의 —\n            후원 의사를 전해 달라고 한 경우)\n        message: 사용자가 전해 달라고 한 내용 — 무엇이 어떻게 잘못됐는지, 어떤 질문에\n            답하지 못했는지, 또는 문의 내용\n        related_tool: 문제가 난 도구명 (예: \"search_references\")\n        related_query: 문제를 재현하는 질의·입력\n        expected: 올바르다고 생각하는 값·조문 (알고 있다면)\n        contact: 회신받을 연락처(이메일 등, 200자 이내) — **사용자가 회신을 원한다며 직접\n            알려 준 값만** 넣는다. 넣기 전에 '운영자가 회신에만 쓰고 개인정보처리방침에 따라\n            보관한다'고 알리고 동의를 받는다. 대화에서 짐작하거나 다른 데서 가져와 채우지 않는다\n    ",
          "inputSchema": {
