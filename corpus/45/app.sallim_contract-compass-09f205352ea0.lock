      "instructions": "한국 공공계약(국가계약법·지방계약법) 계약방법 결정 도우미. decide_contract_method로 결정론 룰엔진 판정을, search_law·get_law_article로 법령 조문을, search_references로 예규·적격심사 세부기준·실무가이드까지 전 코퍼스를 조회한다. 분쟁·처분·해석 다툼 질문은 search_cases/get_case로 판례·법령해석례(law.go.kr 실시간)를 찾아 근거를 보강하라. 모든 도구는 LLM을 쓰지 않는다. 지연은 도구마다 다르다(2026-10-20 실측) — 조문 조회·판정·search_law는 대개 1~3초, search_references는 재정렬 때문에 처음 묻는 질의에 5~20초, search_cases는 law.go.kr 실시간 왕복이라 3~10초다. 답변 합성은 네(클라이언트)가 도구 근거로 직접 하라. 판례·해석례가 필요한 질문인지는 네가 판단하되, 인용했다면 판례의 참조조문을 get_law_article로 교차확인하라. 2~3개 병렬 호출은 무방하나 다발(4개 이상 동시) 호출은 피하라(단일 워커 백엔드라 대기 누적으로 타임아웃). 도구가 {'error': ...}를 반환하면 그 hint를 따르고, 도구 근거 없이 자체 지식으로 법령 수치를 단정하지 마라. report_issue는 사용자가 오류·개선 제보나 문의를 전해 달라고 했을 때만 쓴다. 사용자가 오류·불만·개선 희망·이용 문의·후원 의사를 말하면 임의로 보내지 말고 \"운영자에게 전해 드릴까요?\"를 한 줄로 한 번만 물어 동의할 때만 부르고, 접수번호(ref)와 회신 방법을 전하라. 거절·무반응이면 다시 묻지 않는다. 답변은 정보 제공용이며 법적 자문이 아니다.",
      "tools": [
        {
          "name": "check_price_adjustment",
          "title": "물가변동 조정 판정",
          "description": "물가변동 계약금액 조정(에스컬레이션) 요건 판정 + 산식 적용 — 이행단계 Phase 3.\n\n    \"자재값이 올랐는데 계약금액을 올려받을 수 있나\", \"90일 지났나\", \"단품 조정 되나\"에 쓰라.\n\n    **이 도구는 조정률을 산정하지 못한다.** 품목조정률·지수조정률은 산출내역서와 지수·단가\n    원천(한국은행 생산자물가지수 등)으로 계산하는 값인데 이 서버는 그 데이터를 갖고 있지\n    않다 — 그러니 `adjustment_rate_pct`는 **사용자·발주기관이 산정한 값**을 받아 쓰고,\n    안 주면 요건 ②를 `met: null`로 두고 판정을 보류한다. 없는 값을 지어내지 마라.\n\n    판정하는 것(결정론): ①기간 요건(계약체결일 또는 직전 조정기준일부터 90일 이상)\n    ②등락률 3% 문턱 ③**단품 조정 문턱 — 국가·공기업 15%, 지방 10%(2025-07-08 개정 지방계약법 시행령으로 갈렸다)**\n    ④조정 방식 결정 규칙(계약서에 지수조정률 명시가 없으면 품목조정률 — 지방은 현행 영 제73조②가\n    그렇게 정한다. 국가는 영 제64조②가 미명시 사안을 정하지 않아 `method.default_unverified`로\n    밝히고, 미명시 사안의 법제처 해석례 12-0630은 `method.interpretation_note`에 출처와 함께 온다.\n    **default_unverified면 `method.applied`는 null이다** — 안내용 기본값은 `method.guidance_default`\n    이고 확정된 적용 방법이 아니다. 2013-11-20 개정 전 체결 지방계약도 같다(`pre_amendment_contract`))\n    ⑤조정금액 = 물가변동적용대가 × 조정률, 선금 공제 = 위 값 × 선금급률.\n    ⑥**verdict가 single_item_only면 computed는 단품 산식이다**(computed.track=\"single_item\"):\n    조정금액 = **해당 자재의** 물가변동적용대가 × 그 자재 등락률(영 제64조⑥ + 집행기준\n    제70조의3① 품목조정률 준용). `single_item_base_amount`가 없으면 adjustment_amount는\n    **null**이고 why_null이 사유다 — 계약 전체에 조정률을 곱한 값은 내지 않는다(받을 수\n    있는 금액이 아니다). 등락폭 특칙·일반관리비·이윤은 반영하지 않았다(computed.not_applied).\n\n    응답의 verdict: requirements_met / **single_item_only**(총액 조정은 미충족이나 단품\n    조정은 충족 — **그 자재에 한하여** 조정된다. 계약금액 전체가 아니다) /\n    requirements_not_met / exception_path(천재지변·원자재 급등 예외 검토 대상 — 인정\n    주체는 발주기관) / undetermined(조정률 미제공).\n\n    **두 트랙은 독립이다**(2026-08-29 수리). 단품 조정은 영 제64조⑥ \"제1항 각 호에도\n    불구하고\"라 3% 문턱과 무관하게 성립하므로, 등락률이 3% 미만이어도 verdict가\n    single_item_only일 수 있다 — 그때 \"조정 불가\"라고 답하면 오답이다. 반대로 제5항\n    예외가 푸는 것은 **조정제한기간(90일)뿐**이고 3% 문턱은 그대로다 — 국가 기준(계약예규\n    「정부 입찰·계약 집행기준」 제70조의4①)은 원자재 급등 예외에 조정률 5%(물품구매 10%)\n    이상, 또는 3%(물품구매 6%) 이상+이행 곤란의 객관적 사유를 요구한다.\n\n    Args:\n        org_type: \"national\"|\"local\"|\"public_corp\" — **추측 금지**(단품 문턱이 다르다)\n        contract_date: 계약체결일 \"YYYY-MM-DD\". 장기계속계약은 **제1차계약 체결일**\n        check_date: 조정 검토·청구 시점 \"YYYY-MM-DD\"\n        last_adjustment_date: 직전 조정기준일(있으면 기간 기산점이 이쪽으로 바뀐다).\n            contract_date 이상·check_date 이하여야 한다 — 직전 조정이 없으면 생략\n        adjustment_rate_pct: 산정된 품목·지수 조정률(%). 감액도 그대로(음수) 넣어라\n        method_specified_in_contract: 계약서에 지수조정률이 명시됐으면 \"index\", 품목이면\n            \"item\". 모르면 생략 — 기본값(품목조정률)으로 안내하되 그 사실을 응답에 밝힌다\n        urgent_exception: 천재지변·원자재 급등으로 90일 이내 조정을 검토하는가\n        single_item_rate_pct: 단품 조정 검토 시 해당 자재 가격증감률(%)\n        single_item_share_over_5permille: 그 자재가 재료비·노무비·경비 합계액의 1천분의 5를\n            초과하는가(산출내역서로 확인 — 우리가 계산하지 못한다)\n        is_construction: 공사계약인가(단품 조정은 공사 전용 제도)\n        adjustment_base_amount: 물가변동적용대가(원) — 조정기준일 **이후** 이행분의 대가\n        advance_payment_ratio: 선금급률(비율, 30%면 0.3). 0·생략은 선금 없음으로 본다. 음수나\n            1 초과(퍼센트 착오 등)는 기준금액 유무와 무관하게 invalid_advance_ratio로 거절한다. 금액 입력의 짝(adjustment_base_amount·\n            adjustment_rate_pct)이 없어 계산을 못 하면 `computed_skipped`에 받은 값과 빠진 입력을\n            적는다 — 그때 선금 공제는 반영되지 않았다\n        single_item_base_amount: 단품 조정 대상 **그 자재의** 물가변동적용대가(원) — 조정기준일\n            이후 이행분의 그 자재 계약단가 × 잔여수량(산출내역서). 계약 전체 대가가 아니다\n    ",
