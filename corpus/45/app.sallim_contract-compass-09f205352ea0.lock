        {
          "name": "search_law",
          "title": "법령 조문 검색",
          "description": "법령 조문 검색 — 키워드 또는 조문번호로 조문 스니펫 반환(상위 top_k건).\n\n    **법령(법률·시행령·시행규칙·별표)만 본다 — 계약예규는 여기 없다.** 공사계약일반조건·정부 입찰·계약\n    집행기준·예정가격작성기준·용역계약일반조건 같은 예규는 search_references에 있다. 설계변경·물가변동·\n    기성·준공·지체·계약보증처럼 **계약 집행 실무 질문은 정답의 과반이 예규다**(실측 2026-11-01: 조달청\n    실무자 질의 306건 중 52%가 예규만 인용) — 그런 질문은 search_references를 먼저(또는 함께) 불러라.\n\n    **코퍼스가 둘이고 한 응답은 한 쪽에서만 온다(2026-08-29).** 공공계약(국가·지방계약법\n    계열 38개 법령)과 **세법**(소득세법·법인세법·부가가치세법·조세특례제한법·지방세법 등\n    64개 법령)이다. 축은 자동으로 정해진다 — 질의가 세법 법령을 이름으로 부르면 세법\n    코퍼스로 간다. 법령명이 없어도 세법 고유 개념이면 세법 축에서 찾고, 공공계약\n    고유 업무를 명시하면 계약 축을 유지한다. 그 밖에는 공공계약 결과가 없거나 의미검색·\n    주제 밖 낱말 매치뿐일 때 두 축 거리를 비교한다. 이름으로 부른 시행령/시행규칙은\n    그 하위법령으로 검색을 제한한다(모법 이름만 부르면 기존 검색 유지). `corpus=\"tax\"`/`\"contract\"`로 강제할 수도 있다.\n    응답의 `corpus`가 **어느 코퍼스를 봤는지**다 — 세법 결과를 공공계약 근거로,\n    공공계약 결과를 세법 근거로 인용하지 마라. `note_corpus`가 있으면 왜 그 축이었는지다.\n\n    전문이 필요하면 get_law_article(ref)로 이어서 조회.\n    hit에 note가 있으면 삭제·폐지된 조문이다 — 판단 근거로 인용하지 마라.\n    **hit의 `implementing_articles`가 있으면 다음 호출이 이미 정해진 것이다.** 그 조문은\n    \"대통령령으로 정하는 바에 따라\"라고만 하고 구체적 사유·요건·수치는 거기 적힌 하위\n    조문에 있다(예: 국가계약법 제7조 → 시행령 제26조 수의계약에 의할 수 있는 경우).\n    **다른 도구로 다시 검색하지 말고** 그 참조를 그대로 get_law_article에 넣어라.\n    hit의 `delegated`가 true인데 `implementing_articles`가 없으면 하위 조문이 조문 단위로\n    특정되지 않은 것이다 — get_law_article로 전문을 열어 `delegations`를 보고 가라.\n    hit의 `article`이 \"[별표 N]\"이면 **표**다(2026-08-20 색인). 표 전문은 그 히트의\n    `law_ref`를 그대로 get_law_article에 넣어 읽는다(조문과 같은 경로다). `related_article`이\n    있으면 그 표의 근거 조문이니 함께 밝혀라 — 제재 기간·요율 같은 값의 실제 출처가\n    여기다(근거 조문이 둘 이상이면 `related_articles`에 전부 온다). 별표 제목에\n    \"(제N조 관련)\" 표기가 없는 표는 이 필드가 **없다** — 그때는 표 자체를 근거로 인용하라.\n    질의에 별표 번호를 쓰면('국가계약법 시행규칙 별표2'·'별표 2'·'[별표 2]' 모두 같다) 그 별표가 정확 매치로\n    맨 앞에 온다. 질의가 별표를 불렀는데 `table_hits: 0`·`table_note`가 오면 이 응답에 별표 히트가 없다는\n    뜻이다 — hits의 일반 조문을 별표로 인용하지 말고, 우리 색인에 없을 뿐 법령에 없다는 뜻이 아님을 밝혀라.\n    error가 \"no_corpus_match\"면 질의한 법령이 이 코퍼스 밖이다 — **그런 규정이 없다는\n    뜻이 아니므로** 그렇게 답하지 말고 corpus_laws로 범위를 밝힌 뒤 law.go.kr을 안내하라.\n    error가 \"named_law_in_other_axis\"면 지정한 corpus가 틀렸다 — 부른 법령은 `law_corpus`\n    축에 있다. 그 축으로(또는 corpus 생략으로) 다시 불러라.\n\n    **범위 공시를 먼저 읽어라(2026-08-29).** `total_found`는 코퍼스에서 맞은 **총수**이고\n    `count`는 네가 지금 받은 건수다. 둘이 다르면 `note`/`note_coverage`가 왜 잘렸는지\n    말해 준다 — 그때 \"관련 조문은 N건뿐\"이라고 답하면 거짓이다. `truncated:true`면 백엔드\n    반환 상한(`backend_cap`)에 걸린 것이다. `complete:false`는 맞은 조문을 이 응답에 **전부\n    싣지 못했다**는 뜻일 뿐이다(top_k·백엔드 상한·스캔 상한 중 무엇이든) — 그것만으로\n    total_found가 하한이 되지는 않는다. **total_found가 하한인지는 오직\n    `total_found_is_lower_bound`가 말한다**: 그 필드가 없으면 total_found는 정확한 총수다.\n    `total_found_is_lower_bound:true`면 `total_found`는 **\"최소 N건 이상\"**이라는 뜻이다 —\n    우리가 스캔 상한(`scan_limit`)에서 세기를 멈췄으므로 그 숫자를 정확한 총수로 인용하지\n    마라. 더 필요하면 top_k를 올리거나(최대 20) 법령명·조문번호로 질의를 좁혀 다시 불러라.\n    `search_scope`/`searched`는 어느 가지로 찾았는지다(article·keyword·token·semantic·\n    amount=질의의 금액과 같은 값이 본문에 있는 조문 · heading=질의의 용어사전 용어가\n    조문 제목에 있는 조문, 2026-10-20).\n    `degraded:\"semantic_unavailable\"`이면 의미(임베딩) 검색이 장애로 못 돌아 **키워드\n    매치만**으로 답한 것이다 — 이때의 0건은 부재의 근거가 아니다. 사용자에게 그 사실을\n    밝히고 핵심어를 바꿔 재검색하라. 같은 때 `retrieval_degraded:\"dense_unavailable\"`이\n    함께 온다(search_references와 같은 이름의 도구 공통 판독값).\n\n    **`note_currency`가 있으면 조문의 현행 여부를 우리가 지금 확인하지 못한 상태다\n    (2026-09-23).** 코퍼스는 오프라인 스냅샷이고 law.go.kr 현행과의 대조가 실패하고\n    있거나 오래됐다 — `law_currency.last_verified_at`·`days_unverified`가 마지막 성공\n    대조와 경과일이다. 낡았다는 뜻이 아니라 **모른다**는 뜻이니, 조문을 인용할 때 그\n    사실을 밝히고 law.go.kr 현행 확인을 권하라. 단 note가 \"현행판과 개정 이력이 갈림\"이면\n    모르는 게 아니라 현행판의 후행 시행 개정분이 우리 판에 **빠졌을 수 있음을 아는** 것이다.\n\n    Args:\n        query: \"수의계약\", \"시행령 제26조\", \"제21조\", \"소득세법 제55조\" 등\n        top_k: 반환 건수 (기본 8, **허용 1~20**). 범위 밖 값은 오류가 아니라 가장\n            가까운 허용값으로 **보정**되며(0·음수→1, 20 초과→20) 보정 사실은 응답의\n            `top_k_applied`에 요청값·적용값·이유로 공시된다\n        corpus: 코퍼스 강제 지정 — \"contract\"(공공계약) | \"tax\"(세법). 생략하면 자동.\n    ",
