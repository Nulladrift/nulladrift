      },
      "transport": {
        "type": "http",
        "url": "https://mcp.arugulanet.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "arugula",
        "title": "Arugula",
        "version": "develop-e04f964"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Arugula finds offers that fit what a user wants. Call find_offers with the user's request and any context they gave (where, dates, budget, party size, preferences). Show each offer with its tracked link (tracked_url), the merchant and its site (merchant, merchant_domain) as plain text, and its how_to_buy line; never invent links, and never link the merchant's site. Most results are listings (kind: listing): the user opens tracked_url to book or buy with the merchant, with no Arugula sign-in. Only a seller's offer (kind: offer) is confirmed and paid through Arugula, which needs a sign-in and a passkey. get_offers reads the ranking again later; explain_match says why a match fits. Pass brief: true for short answers. Offers are ranked by fit only; show this line with them: Ranked by fit only. Arugula may earn a commission if you buy through these links, at no extra cost to you. By using Arugula you agree to arugulanet.com/terms. Privacy: arugulanet.com/privacy.",
      "tools": [
        {
          "name": "explain_match",
          "title": "Explain a match",
          "description": "One match with its explanation: why the offer fits the request, its fit and verification, and the draft terms (getMatch). brief: true leaves the explanation out. By using Arugula you agree to arugulanet.com/terms. Privacy: arugulanet.com/privacy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "true for a short answer: each offer's title, price, fit, how to buy and tracked link, without the explanations.",
                "type": "boolean"
              },
              "match_id": {
                "description": "The match's ID (mat_...).",
                "type": "string"
              }
            },
            "required": ["match_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Explain a match"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:24a7e640c386a0a5099de2ebd971f8f4ea9fbb77a2b2e7fe46f3b8708faed3a7"
        },
        {
          "name": "find_offers",
          "title": "Find offers for what a user wants",
          "description": "Turns the user's request, with any context they stated (location, dates, budget, party size, preferences), into an intent and returns the offers that fit, best first, each with a tracked link to show the user (tracked_url). Matching runs in the background; when no offers are back yet, call get_offers with the intent_id in a few seconds. It never buys anything. By using Arugula you agree to arugulanet.com/terms. Privacy: arugulanet.com/privacy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "true for a short answer: each offer's title, price, fit, how to buy and tracked link, without the explanations.",
                "type": "boolean"
              },
              "budget": {
                "description": "The user's budget.",
                "properties": {
                  "amount": {
                    "description": "A decimal amount, for example 25.00.",
                    "type": "string"
                  },
                  "currency": {
                    "description": "ISO 4217, for example SGD.",
                    "type": "string"
                  }
                },
                "required": ["amount", "currency"],
                "type": "object"
              },
              "country": {
                "description": "The user's country as ISO 3166-1 alpha-2, for example SG, only if the user said it or you know it from them; never your server's. Offers there are preferred; a place in the text still decides.",
                "type": "string"
              },
              "dates": {
                "description": "When: dates or times the user gave, for example 'before 9am tomorrow'.",
                "type": "string"
              },
              "locale": {
                "description": "BCP 47 language tag of the text, for example en-SG.",
                "type": "string"
              },
              "party_size": {
                "description": "How many people.",
                "minimum": 1,
                "type": "integer"
              },
              "preferences": {
                "description": "Anything else the user prefers, in their words.",
                "type": "string"
              },
              "text": {
                "description": "What the user wants, in their own words, including where if it matters.",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Find offers for what a user wants"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3937351e8d9c1f38ec8e39e5ed0ecae1ab5338599ee3e846e5b5ee5f5cd01f3f"
        },
        {
          "name": "get_offers",
          "title": "Get the offers found for an intent",
          "description": "The offers ranked for an intent from find_offers, best first, only those that fit, each with its tracked link (tracked_url) and how_to_buy. offer_id is the offer's public ID: lst_ for a merchant listing (open tracked_url to book with the merchant, no sign-in), off_ for a seller's offer on Arugula. By using Arugula you agree to arugulanet.com/terms. Privacy: arugulanet.com/privacy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "true for a short answer: each offer's title, price, fit, how to buy and tracked link, without the explanations.",
                "type": "boolean"
              },
              "intent_id": {
                "description": "The intent_id find_offers returned (int_...).",
                "type": "string"
              }
            },
            "required": ["intent_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the offers found for an intent"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3966d0c8ad915ac6e9387cd3913d57a9962ae6631f89b47c37012f6291976d2"
        }
      ],
      "digest": "sha256:66e193023cf99fd232d7cc851abf60d19bbc482421f670faad2dabfb637c0f32"
    }
  }
