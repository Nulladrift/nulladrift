          },
          "digest": "sha256:df70a9e4e971d6e8ae0de8e4f311328b44936d5266494f7dfb11928e31de9cd9"
        },
        {
          "name": "search_products",
          "title": "Buscar productos",
          "description": "Busca artículos públicos en Klack. Usa texto o slug de categoría. Devuelve precios orientativos, disponibilidad y enlaces. No inventes descuentos ni fechas de entrega.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "type": "string"
              },
              "limit": {
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
