        {
          "name": "create_checkout_link",
          "title": "Preparar enlace de checkout",
          "description": "PREPARA, pero NO cobra ni confirma un pedido. Primero presenta el carrito al comprador y obtén su aprobación. Devuelve URL de Klack para que el comprador continúe y pague usando Stripe, Bizum u otros métodos habilitados. Jamás solicites datos de tarjeta en el chat.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cart_token": {
                "description": "Token opaco recibido de create_cart. No es un token de pago.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["cart_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
