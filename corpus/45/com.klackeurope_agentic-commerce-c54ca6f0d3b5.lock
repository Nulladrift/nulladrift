        },
        {
          "name": "get_order_status",
          "title": "Consultar estado de pedido verificado",
          "description": "Consulta únicamente el estado básico del pedido del propio cliente. Requiere ID interno de pedido, clave secreta del pedido y email coincidente; no devuelve datos personales.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "type": "string"
              },
              "order_id": {
                "minimum": 1,
                "type": "integer"
              },
              "order_key": {
                "type": "string"
              }
            },
            "required": ["email", "order_id", "order_key"],
            "type": "object"
          },
          "annotations": {
