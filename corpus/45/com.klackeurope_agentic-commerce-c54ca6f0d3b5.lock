      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Servidor de compras de Klack Europe. Prepara carritos; el pago siempre se termina con autorización del comprador en el checkout de Klack.",
      "tools": [
        {
          "name": "add_to_cart",
          "title": "Añadir o establecer cantidad",
          "description": "Añade un artículo al carrito temporal o SUSTITUYE su cantidad total si ya existe (repetir la misma petición no duplica unidades). El cambio es reversible con set_cart_quantity; no genera pedidos ni realiza cobros. Una variación requiere su ID concreto. Máximo 99 unidades y 30 líneas.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cart_token": {
                "description": "Token opaco recibido de create_cart. No es un token de pago.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "product_id": {
                "description": "ID de producto simple o ID de variación seleccionada.",
                "minimum": 1,
                "type": "integer"
              },
              "quantity": {
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cart_token", "product_id", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Añadir o establecer cantidad"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc985e81b6ca28bb5839f41a97a35681506f1cc0d5735dc4ea9aeef76fce4b83"
        },
        {
          "name": "create_cart",
          "title": "Crear carrito temporal",
          "description": "Crea un carrito efímero sin iniciar pago, sin reservar inventario y sin generar un pedido.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
