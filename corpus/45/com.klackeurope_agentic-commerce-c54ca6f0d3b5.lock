        },
        {
          "name": "quote_shipping",
          "title": "Consultar opciones de envío",
          "description": "Cotiza tarifas reales de WooCommerce para un carrito y destino; puede requerir provincia o ciudad. En España se deduce la provincia del código postal si falta. No equivale a promesa de entrega ni a precio final.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cart_token": {
                "description": "Token opaco recibido de create_cart. No es un token de pago.",
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "postcode": {
                "type": "string"
              },
              "state": {
                "description": "Provincia/estado; en España admite código WooCommerce (M para Madrid) o nombre.",
                "type": "string"
              }
            },
            "required": ["cart_token", "country", "postcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Consultar opciones de envío"
          },
          "behavior": {
            "destructive": false,
