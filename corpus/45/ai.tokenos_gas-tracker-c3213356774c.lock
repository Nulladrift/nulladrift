      "instructions": "Use when the user asks about gas fees, gas price, network fees, how much a transaction or deployment costs, whether the network is congested, or which chain is cheapest right now. Default to all five chains and standard speed. Quote both native and USD amounts and mention that L2 costs exclude the small L1 data fee.",
      "tools": [
        {
          "name": "cheapest_chain_to_deploy",
          "title": "Cheapest chain to deploy",
          "description": "Rank Ethereum, Base, Arbitrum, Robinhood Chain and Solana by the cost of deploying a contract or program of a given bytecode size.",
          "inputSchema": {
            "properties": {
              "bytecode_kb": {
                "description": "Compiled bytecode size in KB (default 24)",
                "type": "number"
              },
              "speed": {
                "enum": ["slow", "standard", "fast"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Cheapest chain to deploy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Ranking ready",
            "openai/toolInvocation/invoking": "Comparing deployment costs",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:2b0e6a294fbe55678561dc37f1778d180387f1b38eb2739e736b2da19d4852b5"
        },
        {
          "name": "estimate_tx_cost",
