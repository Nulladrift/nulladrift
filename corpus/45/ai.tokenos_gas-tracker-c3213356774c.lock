          "inputSchema": {
            "properties": {
              "chain": {
                "enum": ["ethereum", "base", "arbitrum", "robinhood", "solana"],
                "type": "string"
              },
              "gas_units": {
                "description": "Override: gas units (EVM) or compute units (Solana)",
                "type": "integer"
              },
              "speed": {
                "enum": ["slow", "standard", "fast"],
                "type": "string"
              },
              "tx_type": {
                "enum": ["transfer", "erc20_transfer", "swap", "nft_mint", "deploy"],
                "type": "string"
              }
            },
            "required": ["chain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Estimate a transaction cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Estimate ready",
            "openai/toolInvocation/invoking": "Estimating cost",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:57e696ef765e3cefb343859a852812633a9f8a148e7e89ceed490f86bdcaeb60"
        },
        {
          "name": "gas_now",
          "title": "Live gas fees",
          "description": "Current fees on Ethereum, Base, Arbitrum, Robinhood Chain and Solana: base fee, slow/standard/fast tiers, USD cost per transaction type, trend and the cheapest chain.",
          "inputSchema": {
            "properties": {
              "chains": {
                "description": "Subset of chains (default all)",
                "items": {
                  "enum": ["ethereum", "base", "arbitrum", "robinhood", "solana"],
                  "type": "string"
                },
                "type": "array"
              },
              "speed": {
                "description": "Tier used for the USD cost columns (default standard)",
                "enum": ["slow", "standard", "fast"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
