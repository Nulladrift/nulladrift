{
  "lockfileVersion": 2,
  "subjects": {
    "com.lootcodes/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.lootcodes.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "lootcodes-catalog",
        "title": "LootCodes catalogue",
        "version": "1.0.0",
        "websiteUrl": "https://www.lootcodes.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "LootCodes (lootcodes.com) sells digital game keys, gift cards, in-game top-ups and subscriptions. Every tool here is read-only: search the catalogue, read live options and prices, check advisory activation-country evidence, find the official redemption page, read store policies, and create a cart link. A cart link opens lootcodes.com with the chosen items for the buyer to review; nothing is added, reserved or charged until the buyer confirms and pays on the site. Prices and stock change; the site re-checks them at checkout.",
      "tools": [
        {
          "name": "check_activation_country",
          "title": "Check activation country",
          "description": "Check live advisory activation evidence for one exact variant and an explicit country. An incompatible variant remains purchasable under the storefront policy; unknown is never compatible.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countryCode": {
                "description": "Explicit ISO 3166-1 alpha-2 activation country; do not infer it from language.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "ISO 4217 code such as USD, EUR, BRL or AUD. Prices come back in it, converted from the stored USD price at the verified storefront display rate (usdAmountMinor keeps the USD base); if no rate exists the price stays in USD and moneyCurrency says so. An unsupported code is refused with the list of supported codes.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "language": {
                "description": "Language for product names and links (default en).",
                "enum": ["en", "pt", "es", "de", "fr", "it", "pl", "ru", "id", "th", "vi", "ja"],
                "type": "string"
              },
              "productSlug": {
                "description": "Product or variant slug from a catalogue result.",
                "pattern": "^[a-z0-9][a-z0-9+_-]{0,199}$",
                "type": "string"
              },
              "variantId": {
                "description": "Exact variant UUID; platform, edition and region are never silently substituted.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["countryCode", "currency", "productSlug", "variantId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check activation country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c0a7a83c7ee0c6c7229b8c05c64f92e13761ebe3854ec56e5d1f31d9e492251"
        },
        {
          "name": "create_cart_link",
          "title": "Create a cart link for the buyer",
          "description": "Create a lootcodes.com link that opens the buyer's cart review with exact variants and quantities (1 to 5 each, up to 10 items) chosen from get_product_options. The buyer sees each item, confirms, then pays on the site; this tool adds nothing to any cart, reserves no stock and creates no order. Items that are unavailable or need the product page (top-ups, custom amounts, several platforms) are returned in rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 code for the unit prices shown in the answer (default USD).",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "productSlug": {
                      "description": "Product slug from a catalogue result.",
                      "pattern": "^[a-z0-9][a-z0-9+_-]{0,199}$",
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 5,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "variantId": {
                      "description": "Exact variant UUID.",
                      "format": "uuid",
                      "type": "string"
                    }
                  },
                  "required": ["productSlug", "quantity", "variantId"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Language for names and links (default en).",
                "enum": ["en", "pt", "es", "de", "fr", "it", "pl", "ru", "id", "th", "vi", "ja"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create a cart link for the buyer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c46496533f362c0edd620d1e9333782ea7658766a00e93fc96abbd602367ed2f"
        },
        {
