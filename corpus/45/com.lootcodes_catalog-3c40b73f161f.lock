          "title": "Search the LootCodes catalogue",
          "description": "Find bounded public catalogue variants. Indexed stock and prices are snapshots (converted from USD like the storefront shows them); call get_product_options for fresh prices and stock before create_cart_link. This never confirms activation eligibility.",
