{
  "lockfileVersion": 2,
  "subjects": {
    "ch.soljo/solar": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cwghnqlpeeocjsjfhgyk.supabase.co/functions/v1/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "soljo-mcp",
        "title": "Soljo Solar",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Soljo is an independent solar calculator for Switzerland; first estimates also work for German addresses (it sells no systems and earns no installer commissions). Use `building_energy_profile` for a specific Swiss address when the user wants real numbers for their building (roof, shading, cost, subsidy, savings, payback). Use `solar_first_estimate` for German addresses or when someone asks whether solar is worth it at an address, how much a system yields or costs, or which subsidy applies. Always cite the returned sources. The first estimate has no savings, self-consumption, payback or measured shading: use `building_energy_profile` for those (Swiss addresses), or link fullReport.url. `list_cities` lists Swiss city pages with local electricity prices and subsidies; `geocode_address` resolves an address. Background articles with sources: https://soljo.ch/llms.txt",
      "tools": [
        {
          "name": "building_energy_profile",
          "title": "Building energy profile (Switzerland)",
          "description": "Soljo Data: full solar profile for one Swiss building from official data. Returns the roof faces (Sonnendach, BFE), building facts from the federal register (construction period, floors, heating energy source), measured shading from the swisstopo LiDAR surface model, system size and annual yield, and the economics: turnkey cost, subsidies, local electricity price (ElCom), feed-in tariff, self-consumption, savings, payback and 25-year net result. Same calculation as the Soljo report. Every value block lists sourceIds that resolve to `sources`; cite them. Without api_key a small shared free allowance applies; a free key with 100 profiles per month: https://soljo.ch/developers. Takes about 2 to 5 seconds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Swiss street address with house number and postcode, e.g. 'Bundesplatz 3, 3011 Bern'.",
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              },
              "annual_consumption_kwh": {
                "description": "Known annual electricity consumption in kWh; overrides household_size.",
                "maximum": 100000,
                "minimum": 500,
                "type": "number"
              },
              "api_key": {
                "description": "Soljo Data API key (sjd_…). Optional.",
                "pattern": "^sjd_[A-Za-z0-9]{20,64}$",
                "type": "string"
              },
              "battery": {
                "description": "Include a battery recommendation and its payback.",
                "type": "boolean"
              },
              "ev": {
                "description": "Household has or plans an electric car.",
                "type": "boolean"
              },
              "heat_pump": {
                "description": "Household has or plans a heat pump.",
                "type": "boolean"
              },
              "household_size": {
                "description": "People in the household (default 3); drives consumption and self-consumption.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:64daed7ed0ce442ff8e8106db1960363dd902122aa00a876a17afda660f90a2a"
        },
        {
          "name": "geocode_address",
          "title": "Geocode address",
          "description": "Resolve a Swiss or German street address to latitude, longitude, postcode and country (swisstopo address register, OpenStreetMap fallback).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Full postal address, e.g. 'Bahnhofstrasse 1, 8001 Zürich'.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2c0407d37abe1e4396c71dffa8c0399624e546f83927d76e80332a3c3117a37"
        },
        {
          "name": "list_cities",
          "title": "List Soljo city pages",
          "description": "List Swiss cities and municipalities (about 200, German-speaking) with a Soljo page showing local electricity price (ElCom), solar yield (PVGIS), feed-in tariff, subsidy programmes and an example calculation, each with sources. Filter by canton or name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "canton": {
                "description": "Canton abbreviation, e.g. 'ZH', 'BE', 'AG'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "name": {
                "description": "Part of the municipality name, e.g. 'Uster'.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d99a3fa2163d5878c5691960343141d4679dceae7431e3bc8ace3febd8d3670"
        },
        {
          "name": "solar_first_estimate",
          "title": "Solar first estimate (Switzerland, Germany)",
          "description": "First estimate for a rooftop solar system at a Swiss or German address: annual yield (PVGIS), and for Switzerland the median turnkey cost (federal price study 2025, incl. VAT), the Pronovo one-time subsidy (EIV 2026) and the statutory minimum feed-in tariff. Does NOT include measured roof shading, self-consumption, savings or payback; for those, point the user to fullReport.url (the Soljo report). Always cite the returned sources and say it is a rough estimate.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address in Switzerland or Germany, e.g. 'Bahnhofstrasse 1, 8001 Zürich'. Preferred over coordinates.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "azimuth": {
                "default": 0,
                "description": "Orientation: 0 = south, -90 = east, 90 = west, 180 = north.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "country": {
                "description": "Country when only coordinates are given.",
                "enum": ["CH", "DE"],
                "type": "string"
              },
              "kwp": {
                "default": 10,
                "description": "System size in kWp. A typical single-family home has 8 to 15 kWp.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "lat": {
                "description": "Latitude, only if no address is given.",
                "maximum": 56,
                "minimum": 45,
                "type": "number"
              },
              "lon": {
                "description": "Longitude, only if no address is given.",
                "maximum": 16,
                "minimum": 5,
                "type": "number"
              },
              "tilt": {
                "default": 30,
                "description": "Roof/panel tilt in degrees. Flat roofs: use 15.",
                "maximum": 90,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:473055b9a6d647f479aa44ccc80accb8be7d18aee3af451d269b3a5cfb282d86"
        }
      ],
      "digest": "sha256:8fead358e10b999f885487e2dfbd4c544be4f797ac781523cb7d7ec57fdbef11"
    }
  }
