        {
          "name": "run_showcase",
          "title": "Run a DRS demo live (your parameters)",
          "description": "LIVE EXPERIMENT — run a DRS demo against the real engine with parameters you choose, and get its verbatim run envelope (metadata, execution stats, metrics, details). This is the only tool that COMPUTES fresh output: pick a demo_id and dial its knobs (e.g. `stop_time` run length, or the MTBF/MTTR/goal knobs on the plant demos) to see the real numbers for that exact configuration. IMPORTANT: a run_showcase result is NOT a verified reference number — unlike the run_* tools (run_fast_slow_drain / run_hamburger_duo / run_valdez_tanker / run_vegetable_plant / run_chocolate_processing), which return curated, canonical reference values. Present run_showcase output as a live experiment result for the parameters passed; don't blend it with the curated reference numbers. Quote any figures verbatim; do not round, average, or derive.",
          "inputSchema": {
            "properties": {
              "demo_id": {
                "description": "Which DRS demo to run live against the real engine.",
                "enum": ["fast_slow_drain", "hamburger_duo", "valdez_tanker", "vegetable_full", "chocolate_processing"],
                "type": "string"
              },
              "knobs": {
                "description": "Optional parameters as a map of name:number. fast_slow_drain / hamburger_duo accept `stop_time` (run length in minutes, 1–100000). valdez_tanker accepts `duration_days` (run length in days, 1–365; it drives the circulating-ship items loop). vegetable_full accepts `making_goal` (units, 0–100000), `making_mtbf` / `making_mttr` / `packing_mtbf` / `packing_mttr` (hours, 0–1000). chocolate_processing accepts `bp_goal` (units, 0–100000), `breaker_mtbf` / `breaker_mttr` (hours, 0–1000), `changeover_delay` (hours, 0–48). Unknown names are rejected; out-of-range values are clamped by the engine.",
                "type": "object"
              }
            },
            "required": ["demo_id"],
            "type": "object"
          },
