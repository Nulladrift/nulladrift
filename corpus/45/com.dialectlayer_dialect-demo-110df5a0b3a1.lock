        },
        {
          "name": "dialect_read_endpoint",
          "title": "Read a public endpoint",
          "description": "Use to read a public endpoint now: each field's question, value, whether it was read sure, why not, and since when (Unix seconds) it has held, plus the last 24 hours summed and its latest changes. A value read unsure is what it leaned to. Side effects: none.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The public endpoint's name, like chamber-a, from dialect_endpoints",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f5929a3d9fc7b1567b6d72c9d6ce71a0f2031d6e1214339f4f99c546bb9500a"
        },
        {
          "name": "dialect_summary",
          "title": "Sum a public endpoint's history",
          "description": "Use for how long or how often over a time: each value's sure seconds, share of the window and how many times it was entered, over the last last_s seconds (default a day). Side effects: none.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "last_s": {
                "default": 86400,
                "maximum": 2678400,
                "minimum": 60,
                "type": "integer"
              },
              "name": {
