          "description": "Generate copy-pasteable, fail-closed Page Edits (title, meta, H1/H2, section, FAQ schema, internal links) for a saved brief cluster_label. Requires Essential ($29/mo) or Pro ($99/mo); uses 0 credits on <24h cache hit or dry_run=true, and 1 Page Edit credit when generating fresh.",
