      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SEOcluster.ai MCP server (v0.5): 1) Call seocluster_whoami and seocluster_site_ownership before creating or rewriting pages so existing ranking URLs are strengthened instead of cannibalized. When reviewing cannibalization conflicts on a multi-month snapshot (>45 days), ask the user if a recent site migration or 301 redirect happened (or if they prefer a 28-day window), and re-call seocluster_site_ownership with window_days=28 (or post-migration start_date) and check_live_redirects=true so historical redirected URLs are not misreported as active conflicts. 2) Inspect saved technical & AI-readiness crawl runs via seocluster_list_audits + seocluster_get_audit (filter by url_filter or severity); treat audit findings as diagnostic evidence and require human confirmation for any issue where implementation_authority == 'review_required' (redirects, canonicals, robots/noindex, or soft confidence). 3) Reuse saved briefs via seocluster_list_briefs + seocluster_get_brief, or create a grounded brief from GSC evidence via seocluster_generate_brief. 4) Apply ONLY Page Edits with readiness='ready'; surface review_required or withheld items and their readiness_reason to the user. 5) Run seocluster_prose_and_geo_gate on candidate prose before committing, and track post-deploy GSC lift with seocluster_record_implemented + seocluster_check_outcome.",
      "tools": [
        {
          "name": "seocluster_check_outcome",
          "title": "Check 28-Day Post-Deploy GSC Outcome",
          "description": "Check post-implementation settle readiness for an implemented SEO Action, and optionally run live after-window Google Search Console lift evaluation (clicks, impressions, and position deltas vs frozen baseline).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_id": {
                "description": "Implemented Action ID.",
                "type": "string"
              },
              "evaluate": {
                "default": false,
                "description": "Set true to pull fresh after-window GSC metrics and persist the post-deploy outcome comparison when ready.",
                "type": "boolean"
              },
              "site_url": {
                "description": "Optional GSC site_url for the action.",
                "type": "string"
              }
            },
            "required": ["action_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Check 28-Day Post-Deploy GSC Outcome"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b83d7e44f195e45f73581cb131337b864888b068e2131052230a9745797d54e"
        },
        {
          "name": "seocluster_generate_brief",
          "title": "Generate Grounded SEO Brief from GSC Queries",
          "description": "Generate and save a grounded SEO content brief from a workspace Target Page's real Google Search Console queries (or an explicit keyword list). Consumes 1 monthly Brief credit (Free: 2/mo, Essential: 50/mo, Pro: 120/mo) unless dry_run=true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cluster_label": {
                "description": "Primary topic label for the brief (inferred automatically from the workspace page when omitted).",
                "type": "string"
              },
              "dry_run": {
                "default": false,
                "description": "Set true to preview credit cost, remaining brief quota, and resolved GSC query count without generating or charging.",
                "type": "boolean"
              },
              "keywords": {
                "description": "Optional explicit keyword list [{keyword, impressions, clicks, position}] if not pulling from project_id + target_url.",
                "items": {
                  "properties": {
                    "clicks": {
                      "description": "Optional Google Search Console clicks for this query.",
                      "type": "integer"
                    },
                    "impressions": {
                      "description": "Optional Google Search Console impressions for this query.",
                      "type": "integer"
                    },
                    "keyword": {
                      "description": "Search query string to include in the brief.",
                      "type": "string"
                    },
                    "position": {
                      "description": "Optional average Google Search Console ranking position.",
                      "type": "number"
                    }
                  },
                  "required": ["keyword"],
                  "type": "object"
                },
                "type": "array"
              },
              "project_id": {
                "description": "Optional site project ID (sp_...) to automatically pull saved GSC query evidence and sibling internal-link pages.",
                "type": "string"
              },
              "target_url": {
                "description": "Existing page URL to revamp (e.g. https://example.com/service) or 'new_page' when planning a net-new URL.",
                "type": "string"
              }
            },
            "type": "object"
          },
