        {
          "name": "seocluster_site_ownership",
          "title": "Inspect GSC Page Ownership & Cannibalization",
          "description": "Fetch the Google Search Console Target Pages ownership map for a site project before creating or editing pages (Cannibalisation Gate). Supports sorting by conflicts, impressions, or clicks, pagination via offset, optional live GSC timeframe filtering (window_days or post-migration start_date), and live 301/404 redirect checks (check_live_redirects=true) so post-migration historical URLs are not mistaken for active cannibalization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_live_redirects": {
                "default": false,
                "description": "Set true when reviewing cannibalization or post-migration URLs to check whether competing URLs already 301/308 redirect or return 404/410 live (default false).",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "description": "Max pages to return (1-50, default 25).",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Zero-based pagination offset (default 0).",
                "type": "integer"
              },
              "project_id": {
                "description": "Site project ID returned by seocluster_whoami (e.g. sp_...).",
                "type": "string"
              },
              "sort_by": {
                "default": "conflicts",
                "description": "Sort order: 'conflicts' (wrong_owner & split_ownership first, default), 'impressions', or 'clicks'.",
                "enum": ["conflicts", "impressions", "clicks"],
                "type": "string"
              },
              "start_date": {
                "description": "Optional ISO start date YYYY-MM-DD (e.g. '2026-11-01' right after a site migration or URL change) to check live GSC visibility strictly after that date.",
                "type": "string"
              },
              "window_days": {
                "description": "Optional live Google Search Console lookback window in days (7-180, e.g. 28 for current rankings, 7 for recent momentum, or 14 after a recent migration). Overlays live clicks, impressions, position, and top_queries without altering saved workspace data.",
                "type": "integer"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Inspect GSC Page Ownership & Cannibalization"
