        {
          "name": "seocluster_get_audit",
          "title": "Get Saved Site Audit Issues & AI Readiness",
          "description": "Fetch structured technical crawl issues, AI-Readiness bot/snippet checklist, sitemap diff, and GSC orphan pages from a saved Site Audit run at zero credit cost. Supports filtering by severity, category, or url_filter, and stamps each issue with fail-closed implementation_authority ('inspect_and_verify' or 'review_required').",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional case-insensitive category substring filter (e.g. 'redirect', 'schema', 'headings').",
                "type": "string"
              },
              "include_markdown_reports": {
                "default": false,
                "description": "Set true only when full narrative Markdown reports (audit_report_md, ai_readiness_md) are needed (default false).",
                "type": "boolean"
              },
              "max_urls_per_issue": {
                "default": 10,
                "description": "Max affected_urls sample rows returned per issue to keep context compact (1-50, default 10).",
                "type": "integer"
              },
              "run_id": {
                "description": "Exact run_id returned by seocluster_list_audits.",
                "type": "string"
              },
              "severity": {
                "description": "Optional severity filter ('critical', 'warning', or 'info').",
                "enum": ["critical", "warning", "info"],
                "type": "string"
              },
              "url_filter": {
                "description": "Optional page URL or path substring (e.g. '/pricing') to return only issues and orphan rows affecting that URL.",
                "type": "string"
