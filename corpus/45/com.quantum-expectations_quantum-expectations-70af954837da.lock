        {
          "name": "compute_quantum_volume_rate",
          "title": "Compute Quantum Volume Rate",
          "description": "Compute the Quantum Volume Rate (QVR, in Quantum Volume (QV) per second): QVR = V_Q / (log2(V_Q) * t_2Q + t_meas). First-order estimate of how fast a device prepares one QV-sized square circuit (one native 2Q gate per QV layer + one end-of-circuit measurement). OVERSTATES achievable rate: real compilation inflates the 2Q-gate count per layer; omits reset, state preparation and measurement (SPAM), mid-circuit measurement, and classical-control latency. It is not a production throughput metric such as IBM's CLOPS (circuit layer operations per second, arXiv:2110.14108).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "quantumVolume": {
                "description": "Quantum volume V_Q (integer ≥ 2, e.g. 64 for a depth-log2=6 square circuit).",
                "maximum": 9007199254740991,
                "minimum": 2,
                "type": "integer"
              },
              "t2QSeconds": {
                "description": "Native 2-qubit gate time in seconds (e.g. 60e-9 for a 60 ns CZ).",
                "minimum": 1e-18,
                "type": "number"
              },
              "tMeasurementSeconds": {
                "description": "End-of-circuit measurement/readout time in seconds (e.g. 5e-3 for 5 ms).",
                "minimum": 1e-18,
                "type": "number"
              }
            },
            "required": ["quantumVolume", "t2QSeconds", "tMeasurementSeconds"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "caveats": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "formula": {
                "type": "string"
              },
              "inputs": {
                "additionalProperties": {},
                "properties": {
                  "quantumVolume": {
                    "type": "number"
                  },
                  "t2QSeconds": {
                    "type": "number"
                  },
                  "tMeasurementSeconds": {
                    "type": "number"
                  }
                },
                "required": ["quantumVolume", "t2QSeconds", "tMeasurementSeconds"],
                "type": "object"
              },
              "qvrPerSecond": {
                "type": "number"
              },
              "unit": {
                "const": "QV/s",
                "type": "string"
              }
            },
            "required": ["assumptions", "caveats", "formula", "inputs", "qvrPerSecond", "unit"],
            "type": "object"
          },
          "annotations": {
