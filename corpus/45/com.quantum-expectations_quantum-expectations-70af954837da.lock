        {
          "name": "compute_expectation",
          "title": "Compute Quantum Expectation",
          "description": "Given a quantum circuit (2-qubit error rate p, qubit count n, depth d, optional connectivity class), compute the effective error rate, success probability, and optional surface-code or qLDPC (quantum low-density parity-check) overhead. Without error correction a 2d-lattice connectivity is charged as a routing multiplier on depth (result.routingOverheadFactor); hardwareId supplies the device's class automatically. The response is self-describing (formulas, assumptions, caveats, glossary, state-of-the-art hardware, historic series with source URLs), so one call carries the context to reason from. Answers \"how likely is this circuit to succeed on this device or error rate?\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compDepth": {
                "maximum": 10000000000000,
                "minimum": 1,
                "type": "integer"
              },
              "connectivity": {
                "description": "Two-qubit connectivity of the device: \"all-to-all\" (ion transport), \"reconfigurable\" (atom shuttling, treated as all-to-all) or \"2d-lattice\" (fixed nearest-neighbour couplers, charged as a routing multiplier on depth when no error correction is applied). Defaults to the hardware entry's class when hardwareId is supplied, else to all-to-all.",
                "enum": ["all-to-all", "reconfigurable", "2d-lattice"],
                "type": "string"
              },
              "distanceSurfaceCode": {
                "description": "Surface code distance: odd integer in [3, 31]. Required when useErrorCorrection=true and the surface code is selected; ignored when a qLDPC code is selected.",
                "type": "number"
              },
              "errorCorrectionCode": {
                "description": "Either \"surface\" (default when useErrorCorrection=true) or a qLDPC code id from list_qldpc_codes. \"surface-code\" is accepted as an alias for \"surface\".",
                "type": "string"
              },
              "hardwareId": {
                "description": "Platform alternative to qubitErrorRate, one of trapped-ion, superconducting, neutral-atom: resolves to the 2-qubit error rate and connectivity class of that platform's entry in the current quantum computers table (list_current_quantum_computers). Supply exactly one of qubitErrorRate or hardwareId.",
                "enum": ["trapped-ion", "superconducting", "neutral-atom"],
                "type": "string"
              },
              "numQubits": {
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "qubitErrorRate": {
                "description": "Per-gate 2-qubit error rate p, in (0, 0.1]. Supply exactly one of qubitErrorRate or hardwareId.",
                "exclusiveMinimum": 0,
                "maximum": 0.1,
                "type": "number"
              },
              "useErrorCorrection": {
                "default": false,
                "type": "boolean"
              },
              "verbose": {
                "default": true,
                "description": "When false, omits hardwareContext, formulas, assumptions, caveats, glossary, examples, and exampleProblems from the response — leaving only modelVersion, scenario, and result. Suited to parameter sweeps, where that context would repeat unchanged.",
                "type": "boolean"
              }
            },
            "required": ["compDepth", "numQubits"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
