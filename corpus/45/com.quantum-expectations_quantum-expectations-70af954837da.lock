                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        }
                      },
                      "required": ["connectivity", "errorRate", "errorRateDisplay", "hardwareType", "id", "physicalQubits"],
                      "type": "object"
                    },
                    "qubitErrorRateUsed": {
                      "type": "number"
                    },
                    "result": {
                      "additionalProperties": {},
                      "properties": {
                        "effectiveErrorRate": {
                          "description": "Probability that at least one gate fails over the (routed) circuit.",
                          "type": "number"
                        },
                        "logicalErrorRatePerCycle": {
                          "description": "Per-syndrome-cycle logical error rate as the calibration source reports it; null without error correction.",
                          "type": ["number", "null"]
                        },
                        "logicalErrorRatePerGate": {
                          "description": "Per-logical-qubit, per-logical-operation error rate; null without error correction.",
                          "type": ["number", "null"]
                        },
                        "minimumClockRuntimeSeconds": {
                          "description": "Lower bound on wall-clock runtime; present only when hardwareId was supplied.",
                          "type": "number"
                        },
                        "physicalQubitsPerLogicalQubit": {
                          "type": ["number", "null"]
                        },
                        "qldpcInstructionComparison": {
                          "additionalProperties": {},
                          "description": "qLDPC codes with published architecture data only, at the scenario p: memoryDerivedOp is one block's memory-fit error over one logical operation (roundsPerLogicalOp x per-cycle rate; logicalErrorRatePerGate is this x blocks / numQubits); inModuleMeasurement and interModuleMeasurement are the architecture's published rates for one in-module measurement and one measurement joining two neighbouring blocks (per block pair). Published rates are fitted, extrapolated or assumed per point (list_qldpc_codes, architecture.errorPoints[].basis; assumedRates). The fields are reported side by side; no direction between them is implied.",
