                    "description": "qLDPC codes with published architecture data only, at the scenario p: memoryDerivedOp is one block's memory-fit error over one logical operation (roundsPerLogicalOp x per-cycle rate; logicalErrorRatePerGate is this x blocks / numQubits); inModuleMeasurement and interModuleMeasurement are the architecture's published rates for one in-module measurement and one measurement joining two neighbouring blocks (per block pair). Published rates are fitted, extrapolated or assumed per point (list_qldpc_codes, architecture.errorPoints[].basis; assumedRates). The fields are reported side by side; no direction between them is implied.",
                    "properties": {
