                          "type": "string"
                        },
                        "type": "array"
                      },
                      "caveats": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "codeId": {
                        "type": "string"
                      },
                      "dataModuleQubits": {
                        "type": "number"
                      },
                      "dataQubitsPerModule": {
                        "type": "number"
                      },
                      "errorPerTGate": {
                        "additionalProperties": {},
                        "properties": {
                          "inModule": {
                            "type": "number"
                          },
                          "injection": {
                            "type": "number"
                          },
                          "interModuleChain": {
                            "type": "number"
                          }
                        },
                        "required": ["inModule", "injection", "interModuleChain"],
                        "type": "object"
                      },
                      "fittedRates": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "instructionErrorRates": {
                        "additionalProperties": {},
                        "properties": {
                          "idle": {
                            "type": "number"
                          },
                          "inModule": {
                            "type": "number"
                          },
                          "interModule": {
                            "type": "number"
