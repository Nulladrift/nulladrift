      "instructions": "Quantum Expectations estimates what current and near-term quantum hardware can run. Every tool is a deterministic, read-only computation over primary-sourced data and returns primitives, never a verdict: the conclusion is yours to draw and to caveat.\n\nStart with compute_expectation (one circuit on a platform passed as hardwareId, or at an error rate), compute_required_error_rate (what hardware a circuit needs) or compare_hardware_scenarios (every platform at once). compute_fault_tolerant_resources sizes a full surface-code or qLDPC footprint from logical qubits and T count. fit_historic_series extrapolates record trends. list_current_quantum_computers, list_quops_scores, list_hardware_timings, list_qldpc_codes and list_example_algorithms are the data tables behind the compute tools.\n\nCarry the caveats and source URLs a result returns into your answer. Where a result reports two fits (conservative and optimistic), state both. Present modelled numbers as model output, never as measurements: list_quops_scores holds the measured yardstick, and where it disagrees with the model, the measurement wins. Figures marked attested-estimate rest on the authors' word, not a published circuit; say so when you quote them.\n\nWhen a question names a platform (superconducting, trapped-ion, neutral-atom) without stating its error rate, pass that platform as hardwareId rather than a generic qubitErrorRate. list_hardware_timings holds best-case testbed timings, so a runtime built on them is an optimistic lower bound; say so. Check a qLDPC code's caveats before quoting its logical error rate as firm. Comparing a result against classical alternatives, and deciding whether a problem should run on a quantum computer, is your conclusion to draw.",
      "tools": [
        {
          "name": "compare_hardware_scenarios",
          "title": "Compare Hardware Scenarios",
          "description": "Run the same circuit against several current state-of-the-art hardware entries in one call and return one result block per entry, computed at that entry's error rate and connectivity class (the result blocks carry no minimum runtime and take no connectivity override). Defaults to every entry in list_current_quantum_computers when hardwareIds is omitted. Answers \"which platform runs this circuit best?\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compDepth": {
                "maximum": 10000000000000,
                "minimum": 1,
                "type": "integer"
              },
              "distanceSurfaceCode": {
                "description": "Surface code distance: odd integer in [3, 31]. Required when useErrorCorrection=true and the surface code is selected; ignored when a qLDPC code is selected.",
                "type": "number"
              },
              "errorCorrectionCode": {
                "description": "Either \"surface\" (default when useErrorCorrection=true) or a qLDPC code id. \"surface-code\" is accepted as an alias for \"surface\".",
                "enum": ["surface", "bb-144-12-12", "bb-288-12-18", "surface-code"],
                "type": "string"
              },
              "hardwareIds": {
                "description": "Subset of the ids in list_current_quantum_computers to compare, at most 50; a repeated id is compared once. Omit to compare every entry.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "numQubits": {
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "useErrorCorrection": {
                "default": false,
                "type": "boolean"
              }
            },
            "required": ["compDepth", "numQubits"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": {},
                  "properties": {
                    "hardware": {
                      "additionalProperties": {},
                      "properties": {
                        "connectivity": {
                          "enum": ["all-to-all", "reconfigurable", "2d-lattice"],
                          "type": "string"
                        },
                        "errorRate": {
