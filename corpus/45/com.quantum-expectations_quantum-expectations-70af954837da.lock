        {
          "name": "fit_historic_series",
          "title": "Fit Historic Series (log-linear)",
          "description": "Fit a log-linear trend (ln(value) = slope * year + intercept) to one historic series — fidelity or qubit-count — for one hardware type. An atomic primitive for \"when might hardware reach X?\" questions; with targetValue it returns the year the fit reaches that value. residualStdDev is the BIASED (maximum-likelihood) root-mean-square (RMS) — divides by n, not (n - 2); on small series (n ≈ 3–5) the unbiased value is larger by √(n / (n - 2)).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hardwareType": {
                "description": "Hardware platform as used by get_historic_series.",
                "enum": ["Neutral Atom", "Superconducting", "Trapped-Ion"],
                "type": "string"
              },
              "seriesType": {
                "description": "Which historic series to fit: \"fidelity\" (2-qubit gate error rate) or \"qubit-count\" (physical qubits).",
                "enum": ["fidelity", "qubit-count"],
                "type": "string"
              },
              "targetValue": {
                "description": "Optional. When supplied, the response includes yearAtTargetValue — the extrapolated year the fit crosses this value (error rate for fidelity series, qubit count for qubit-count series). Null if slope is flat.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["hardwareType", "seriesType"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "doublingPeriodYears": {
                "description": "Non-null iff slope > 0.",
                "type": ["number", "null"]
              },
              "formula": {
                "const": "ln(value) = slope * year + intercept",
                "type": "string"
              },
              "halvingPeriodYears": {
                "description": "Non-null iff slope < 0.",
                "type": ["number", "null"]
              },
              "hardwareType": {
                "type": "string"
              },
              "intercept": {
                "type": "number"
              },
              "model": {
                "const": "log-linear",
                "type": "string"
              },
              "nPoints": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "residualStdDev": {
                "description": "Biased (divide-by-n) RMS of the ln residuals.",
                "type": "number"
              },
              "seriesType": {
                "enum": ["fidelity", "qubit-count"],
                "type": "string"
              },
              "slope": {
                "type": "number"
              },
              "yearAtTargetValue": {
                "description": "Present only when targetValue was supplied.",
                "type": ["number", "null"]
              },
              "yearRange": {
                "items": false,
                "maxItems": 2,
                "minItems": 2,
                "prefixItems": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "number"
                  }
                ],
                "type": "array"
              }
            },
            "required": ["doublingPeriodYears", "formula", "halvingPeriodYears", "hardwareType", "intercept", "model", "nPoints", "residualStdDev", "seriesType", "slope", "yearRange"],
            "type": "object"
          },
