        {
          "name": "compute_fault_tolerant_resources",
          "title": "Compute Fault-Tolerant Resources",
          "description": "Given an algorithm stated as (numLogicalQubits, tCount) and a physical error rate (or hardwareId), derive the full surface-code + magic-state-distillation footprint from the general laws of the Litinski lattice-surgery cost model (no per-scenario constants): distillation factory choice, tile layout, required code distance, total physical qubits, and wall-clock time. With errorCorrectionCode set to a qLDPC code that has architecture data (bb-144-12-12, bb-288-12-18; see the architecture field of list_qldpc_codes), the data is held in that code's modules instead (modules, per-instruction error rates and timesteps per T gate) and only the factory is a surface-code block. Results are reported under TWO published logical-error fits (conservative + optimistic) because they disagree by 13-268x (d=7 to d=25); both are returned. Returns an explicit `infeasible` block when no cataloged factory or code distance can satisfy the error budget. Computes resource numbers only: it does not compare against classical alternatives or judge whether a problem should run on a quantum computer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cycleTimeSeconds": {
                "default": 0.000001,
                "description": "Syndrome-cycle time in seconds (surface-code cycle, or one syndrome cycle of the selected qLDPC code). Default 1 µs (Litinski convention; Google 2024 measured 1.1 µs on superconducting hardware). Trapped-ion/neutral-atom cycles are orders of magnitude slower.",
                "exclusiveMinimum": 0,
                "maximum": 1,
                "type": "number"
              },
              "dataBlock": {
                "default": "compact",
                "description": "Data-block layout (Litinski §2): compact = fewest qubits, fast = shortest time per T gate.",
                "enum": ["compact", "intermediate", "fast"],
                "type": "string"
              },
              "errorCorrectionCode": {
                "default": "surface",
                "description": "Code that stores and processes the logical data: \"surface\" (default; alias \"surface-code\") for the Litinski lattice-surgery footprint, or a qLDPC id with published instruction-level architecture data (bb-144-12-12, bb-288-12-18) for the Tour de gross bicycle-architecture footprint. The magic-state factory is a surface-code module in both cases.",
                "type": "string"
              },
              "hardwareId": {
                "description": "Platform alternative to qubitErrorRate, one of trapped-ion, superconducting, neutral-atom: resolves to the 2-qubit error rate of that platform's entry in the current quantum computers table (list_current_quantum_computers). It sets the error rate only; cycleTimeSeconds keeps its 1 µs (superconducting) default unless given. Supply exactly one of qubitErrorRate or hardwareId.",
                "enum": ["trapped-ion", "superconducting", "neutral-atom"],
                "type": "string"
              },
              "numLogicalQubits": {
                "description": "Number of logical data qubits the algorithm needs.",
                "maximum": 1000000,
                "minimum": 1,
                "type": "integer"
              },
              "qubitErrorRate": {
                "description": "Physical 2-qubit error rate p in (0, 0.1]. Supply exactly one of qubitErrorRate or hardwareId.",
                "exclusiveMinimum": 0,
                "maximum": 0.1,
                "type": "number"
              },
              "tCount": {
                "description": "Total number of T gates (magic states consumed). The count is in T gates, not Toffolis (1 Toffoli ≈ 4–7 T depending on decomposition).",
                "maximum": 10000000000000,
                "minimum": 1,
                "type": "integer"
              },
              "targetSuccessProbability": {
                "default": 0.98,
                "description": "Target end-to-end success probability. The failure budget (1 − target) is split evenly between T-state error and logical (memory/surgery) error, matching Litinski §4.",
                "exclusiveMaximum": 1,
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["numLogicalQubits", "tCount"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "assumptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "caveats": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "effectiveStepsPerTGate": {
                "type": ["number", "null"]
              },
              "factory": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "id": {
                        "type": "string"
                      },
                      "outputErrorRate": {
                        "type": "number"
                      },
                      "stepsPerOutputState": {
                        "type": "number"
                      },
                      "successProbability": {
                        "type": "number"
                      },
                      "tiles": {
                        "type": "number"
                      }
                    },
                    "required": ["id", "outputErrorRate", "stepsPerOutputState", "successProbability", "tiles"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "formulas": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "infeasible": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "reason": {
                        "type": "string"
                      }
                    },
                    "required": ["reason"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Non-null when the scenario is infeasible as modeled: no cataloged factory meets the T-error budget (factory and layout are then null) or no distance up to the cap meets it under either fit (per-fit distance, qubits and wall clock are then null)."
              },
              "layout": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "properties": {
                      "dataBlockTiles": {
                        "type": "number"
                      },
                      "factoryTiles": {
