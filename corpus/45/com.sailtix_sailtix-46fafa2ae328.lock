      "serverInfo": {
        "name": "sailtix",
        "title": "Sailtix",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sailtix sells sea transport in Indonesia: scheduled ferries and fast boats between harbors, private boat and yacht charters, and fishing charters. This server is read-only and exposes the public catalogue. It cannot create, modify, price or pay for a booking. Route identifiers come from locations_list; sailing_search also accepts a place name and resolves it.",
      "tools": [
        {
          "name": "charter_search",
          "title": "Search private boat charters",
          "description": "Searches private boat and yacht charter packages by departure area, date, guest count, vessel type and trip length, returning price, duration, capacity, inclusions and the operator.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "charter_style": {
                "description": "Trip style filter, e.g. reef or trolling.",
                "type": "string"
              },
              "date": {
                "description": "Requested charter date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "duration_type": {
                "description": "Trip length, e.g. half_day, full_day, overnight.",
                "type": "string"
              },
              "guests": {
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Departure area, e.g. a city or harbor name.",
                "type": "string"
              },
              "vessel_type": {
                "description": "Vessel category filter, e.g. speedboat or yacht.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "description": "Parameters the search actually ran with, after resolution.",
                "type": "object"
              },
              "results": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "type": "integer"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["query", "results", "returned"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:10a1819301ac3dfa389d7ba51bb5fd226f581c5841858c3ab8d5feca1baa8d8b"
        },
        {
          "name": "fishing_search",
          "title": "Search fishing charters",
          "description": "Searches fishing charter trips by departure area, date, angler count and technique, returning price, duration, capacity, target species and the operator. Fishing trips are a category of the charter catalogue, so charter filters apply here too.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "anglers": {
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "charter_style": {
                "description": "Fishing style filter, e.g. reef or trolling.",
                "type": "string"
              },
              "date": {
                "description": "Requested trip date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "duration_type": {
                "description": "Trip length, e.g. half_day, full_day, overnight.",
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Departure area, e.g. a city or harbor name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "description": "Parameters the search actually ran with, after resolution.",
                "type": "object"
              },
              "results": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "type": "integer"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["query", "results", "returned"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:926c8c91885f0dc9027ea9b2e2914dfbe7d04d4f08d605d7c5ef939f4a8dbe6a"
        },
        {
          "name": "locations_list",
          "title": "List harbors and destination regions",
          "description": "Lists the harbors and destination regions Sailtix sells sea transport between, each with the identifier the search tools accept. Optional free-text filter narrows the list by name or slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum entries to return. Defaults to 60.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional free-text filter matched against name and slug.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "locations": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "type": "integer"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["locations", "returned", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:910eea7ee73097d8a0dc9b05b1f4219b0a95b95514221129f324f6545b15e168"
        },
        {
          "name": "sailing_search",
          "title": "Search scheduled sea transport",
          "description": "Searches scheduled ferry and fast-boat departures between two places on a given date, returning departure and arrival times, operator, vessel, journey duration, remaining seats and fares. Fares are the total the guest pays Sailtix: no booking fee or card fee is added at checkout. Harbor and island levies aren't Sailtix fees. Where one applies, the operator either includes it in the fare or collects it at the harbor. Origin and destination accept a harbor name, a destination-region name, a slug, or an identifier from locations_list; at least one side must be given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adult": {
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              },
              "child": {
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              },
              "destination": {
                "description": "Arrival harbor or region — name, slug, or identifier.",
                "type": "string"
              },
              "infant": {
                "maximum": 99,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "nationality": {
                "description": "Accepted and ignored: this tool quotes the international fare.",
                "enum": ["indo", "non_indo"],
                "type": "string"
              },
              "origin": {
                "description": "Departure harbor or region — name, slug, or identifier.",
                "type": "string"
              },
              "return_date": {
                "description": "Optional return date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "travel_date": {
                "description": "Departure date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "description": "Parameters the search actually ran with, after resolution.",
                "type": "object"
              },
              "results": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "type": "integer"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["query", "results", "returned"],
            "type": "object"
          },
