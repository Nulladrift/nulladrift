        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://samedoc.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "samedoc",
        "title": "Samedoc: Translate PDF & PDF to Word",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Samedoc gives back the same document: a PDF or a scan / photo of one (payslips, official letters, bank statements, certificates, contracts, forms) comes back in another language with its layout, tables, logos and every number kept (translate_document), or as an editable Word file that looks like the original (convert_to_word). Use them whenever the user wants a document translated as a file, or a PDF or scan turned into Word / docx. If the user attached the file, pass it as `file`. If you can't pass an attached file to a tool (Claude), use `file_url` when the user has an https link to it; otherwise call get_upload_link and give them that link. Ask at most one question, only for the target language when it isn't clear (default English). Give the download link from the result; never retype the document in chat.",
      "tools": [
        {
          "name": "convert_to_word",
          "title": "Convert a PDF or scan to an editable Word file",
          "description": "Turns a PDF or a scanned document / photo of one into an editable Word file (.docx) that looks like the original page: every line of text is editable in place, over the original design (tables, lines, logos, stamps and signatures kept exactly). Same language, no translation. Reads scans and broken PDF text, and keeps Hebrew and Arabic right-to-left. Use when the user says 'convert this PDF to Word / docx', 'make this PDF editable', 'I need to edit this form / scan', or when a Word file made in chat lost the logo, tables or layout. Give the document as `file` (a file the user attached) or `file_url` (an https link). Up to 3 pages per document. Takes 20-90 seconds; if it takes longer, returns an id for get_translation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file": {
                "description": "The document the user attached (ChatGPT file).",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "file_url": {
                "description": "https link to the PDF or image, when no file is attached.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Convert to Word"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["file"],
            "openai/outputTemplate": "ui://widget/samedoc-result-v2.html",
            "openai/toolInvocation/invoked": "Word file ready",
            "openai/toolInvocation/invoking": "Building your Word file...",
            "ui": {
              "resourceUri": "ui://widget/samedoc-result-app-v2.html"
            }
          },
          "digest": "sha256:85d7bd04cd815d4e54e7f3308203ff0250846f705b52328798e29123d412c448"
        },
        {
          "name": "get_translation",
          "title": "Get a translation or Word file",
          "description": "Returns the status and download link of a job started with translate_document or convert_to_word (use its id).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The translation id.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a translation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/samedoc-result-v2.html",
            "ui": {
              "resourceUri": "ui://widget/samedoc-result-app-v2.html"
            }
          },
          "digest": "sha256:6f90bd61a33464a0fa3b05d7ea3cf47957b6cf916bf13d12d79e6db4d5761b81"
        },
        {
          "name": "get_upload_link",
          "title": "Get a link to upload a document",
          "description": "For users whose document can't be handed to translate_document here (no attachment support, no https link): a page where they upload it and get the translated document or Word file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an upload link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca28865e806fc8832d063a3f99ef0cb1b4d4b867c49d24de126a8548172fb584"
        },
        {
          "name": "translate_document",
          "title": "Translate a document and keep its layout",
          "description": "Translates a PDF or a scanned document / photo of one into another language and returns the same document as a PDF: layout, tables, logos and every number kept and checked. For payslips, bank statements, official and government letters, birth and marriage certificates, diplomas, school reports, contracts, leases and forms, e.g. for a visa, immigration, a bank or a school. Strong on right-to-left sources (Hebrew, Arabic), which it can also mirror into a left-to-right layout. Use when the user says 'translate this PDF / document / scan', 'keep the formatting / layout', 'give me back the PDF', or when a translation in chat lost the tables or layout. Give the document as `file` (a file the user attached) or `file_url` (an https link). Up to 3 pages per document. Takes 30-90 seconds; if it takes longer, returns an id for get_translation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file": {
                "description": "The document the user attached (ChatGPT file).",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "file_url": {
                "description": "https link to the PDF or image, when no file is attached.",
                "type": "string"
              },
              "from": {
                "description": "Source language. Leave out to detect it.",
                "type": "string"
              },
              "keep_logos": {
                "description": "true = don't translate logos and wordmarks.",
                "type": "boolean"
              },
              "layout": {
                "description": "keep = same layout as the original (default); ltr = mirror a right-to-left page (Hebrew, Arabic) into a left-to-right layout.",
                "enum": ["keep", "ltr"],
                "type": "string"
              },
              "to": {
                "description": "Target language, e.g. English, Spanish, German. Defaults to English.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Translate a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/fileParams": ["file"],
            "openai/outputTemplate": "ui://widget/samedoc-result-v2.html",
            "openai/toolInvocation/invoked": "Translation ready",
            "openai/toolInvocation/invoking": "Translating your document...",
            "ui": {
