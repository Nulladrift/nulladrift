{
  "lockfileVersion": 2,
  "subjects": {
    "com.bvicrewed/concierge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bvicrewed.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "islands-and-sails",
        "title": "Islands & Sails Charter Concierge",
        "version": "1.0.0",
        "websiteUrl": "https://bvicrewed.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Islands & Sails' founder owns one of the yachts we feature; it's marked on its listing. When we introduce you to a charter broker, we may receive a small referral fee from the broker — it never changes the price you pay. Weekly USD starting rates are not booking quotes. Read each yacht's pricing note for guest-count pricing, exclusions and holiday caveats. Dream On's authoritative source is dreamonsail.com. Fleet status labels are not live availability confirmations. Confirm dates and rates with the owner before booking. These tools cannot book, place holds, capture contact information or send emails.",
      "tools": [
        {
          "name": "check_dream_on_availability",
          "description": "Read Dream On's official unavailable-date calendar with 48-hour turnaround buffers. This does not book or hold dates; refer guests to dreamonsail.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "nights": {
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "start": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["nights", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Dream On availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8b2648ec69e59c7d0c409677273af2bae86e52cde67b6dc4dcfa0975bd72169"
        },
        {
          "name": "get_yacht",
          "description": "Read a yacht's published details and pricing caveats by catalog ID. This does not confirm availability.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Catalog ID, e.g. dream-on",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get yacht details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0abc45101a928178e5a998e8f829aaa15f66102c9daaea6692be38278b9f6601"
        },
        {
          "name": "list_yachts",
          "description": "Search the published crewed-yacht catalog by starting budget, capacity, activity or travel style. Read the returned pricing and availability caveats.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "activity": {
                "description": "Activity tag, e.g. snorkeling, e-foiling or sea-scooters",
                "maxLength": 80,
                "type": "string"
              },
              "bestFor": {
                "description": "Travel-style tag, e.g. families, couples or food",
                "maxLength": 80,
                "type": "string"
              },
              "guests": {
                "description": "Required guest capacity",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "maxRate": {
                "description": "Maximum starting weekly rate in USD; not a guest-specific quote",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "minCabins": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search crewed yachts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c1f0d0f152c3ef07b3c1c808814888c26ec8a4da37f1af434e86e1da644cdcb"
        }
      ],
      "resources": [
        {
          "uri": "islands-and-sails://fleet",
          "name": "fleet",
          "title": "Published yacht catalog",
          "description": "The same yacht catalog used by the public REST API, with pricing and ownership disclosures.",
          "mimeType": "application/json",
          "digest": "sha256:43711adee855ed70a263156a8881ffb211c6260e8b651e8e9c1ae64113274c9c"
        }
      ],
      "digest": "sha256:929c78862a0940906012701a28b67bfd48d483b854bef252a1b6711f5e23f4c5"
    }
  }
}
