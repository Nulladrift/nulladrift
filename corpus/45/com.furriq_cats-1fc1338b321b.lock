{
  "lockfileVersion": 2,
  "subjects": {
    "com.furriq/cats": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.furriq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "furriq-cats",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for cat breed identification and research, served by furriq.com. Use find_cat_breed for deterministic description matching (free), get_breed / compare_breeds / list_breeds for the 61-breed database, analyze_cat_photo for AI photo analysis (rate-limited to 10/day).",
      "tools": [
        {
          "name": "analyze_cat_photo",
          "description": "Analyze a cat photo with AI vision and estimate the most likely breeds, with honest uncertainty. Provide a public image URL (or a data: URL). Limited to 10 analyses per day; a lighter deterministic alternative is find_cat_breed with a text description. For a full report, https://www.furriq.com/identify-cat-by-photo",
          "inputSchema": {
            "properties": {
              "image_url": {
                "description": "Publicly fetchable http(s) or data: URL of a cat photo (JPEG/PNG/WebP).",
                "type": "string"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:214e6cd944ab596be9a94640a656fdaa0ec442bdce26201969c194fb4a9347a2"
        },
        {
          "name": "compare_breeds",
          "description": "Compare two cat breeds side by side (identification markers, temperament, care) and, when the breeds are commonly confused, return furriq.com's \"how to tell them apart\" guidance.",
          "inputSchema": {
            "properties": {
              "breedA": {
                "description": "First breed slug or name.",
                "type": "string"
              },
              "breedB": {
                "description": "Second breed slug or name.",
                "type": "string"
              }
            },
            "required": ["breedA", "breedB"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14583dd12399254f0e59690026d2848256d12c8edbad69793f037910e4be26dd"
        },
        {
          "name": "find_cat_breed",
          "description": "Match a cat description to likely breeds from furriq.com's curated database of 61 breeds. Describe what the cat looks like or how it behaves (coat pattern, body shape, ears, temperament) and get the top candidates with the specific markers that matched. Deterministic — no AI guessing.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Description of the cat, e.g. \"large fluffy cat with a bushy tail and lynx-like ear tufts\" or \"small hairless wrinkly cat\".",
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:01c6a507dbadcfc5d9fac9391b08707f2c9d518dfb9b8c3787e589a1c318e01f"
        },
        {
          "name": "get_breed",
          "description": "Get the full profile of one cat breed from furriq.com: physical identification markers, temperament traits, size/weight/lifespan/origin, health notes, and links to similar breeds.",
          "inputSchema": {
            "properties": {
              "breed": {
                "description": "Breed slug or name, e.g. \"norwegian-forest\" or \"Norwegian Forest Cat\".",
                "type": "string"
              }
            },
            "required": ["breed"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5a6766eaaa62fb1702d6b7f84ef71077d3b5bbf1d18240f2013aac3540d743e"
        },
        {
          "name": "list_breeds",
          "description": "List all 61 cat breeds in the furriq.com database with size, origin, and category.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f452e9d199ea3b4389bafad51cda742e5bf5faf0140f573d0dfbb3acbb8226b6"
        }
      ],
      "digest": "sha256:3782396cc4d07ea37d8bb505ca33d7084efe4024bdc4e8b7a90d3042ef3e7ba3"
    }
  }
}
