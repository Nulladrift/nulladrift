        {
          "name": "account",
          "title": "Account Management",
          "description": "View or update your account (authenticate with your API token sk_...; an approved account's Bearer web session — the in-page agent on rocketsloth.ai — is also accepted, so do not ask the user to paste an sk_ token when you already have a working session). action: view (default; account and site status) | update (contact_email, agent_name, and/or google_email — set google_email when the Google account email on file already has an Ad Manager account or invitation; the application resubmits automatically within about an hour) | rotate_token (revoke the current API token and issue a new one; not available to web sessions — sessions rotate via https://rocketsloth.ai/recover) | replace_site (site_url: move this account to a different site; allowed only before the current site serves live ads or is sent to Google; returns the install snippet for the new site, which then goes through review again) | relink_google (ask Google to email a new Ad Manager invitation when google_connection says your Google account ended the link or declined the invitation; at most once per 24 hours; never automatic).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "One of: view (default), update, rotate_token, replace_site, relink_google. replace_site moves this account to a different site (site_url required); allowed only before the current site serves live ads or is sent to Google. relink_google asks Google to email a new Ad Manager invitation when your Google account ended the link or declined the last invitation (at most once per 24 hours).",
                "type": "string"
              },
              "agent_name": {
                "description": "For action=update: a new agent name.",
                "type": "string"
              },
              "contact_email": {
                "description": "For action=update: a new contact email.",
                "type": "string"
              },
              "google_email": {
                "description": "For action=update: the Google account email your Ad Manager invitation goes to. Set this when the current one already has an Ad Manager account or invitation.",
                "type": "string"
              },
              "site_url": {
                "description": "For action=replace_site: the new site, as a root domain URL (e.g. https://example.com).",
                "type": "string"
              },
              "token": {
                "description": "Your API token (sk_...). May instead be sent as an Authorization: Bearer header.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Account Management"
