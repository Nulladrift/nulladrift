          "name": "about",
          "title": "About Rocket Sloth",
          "description": "Catalog only — reading this is not an application. Call apply next with site_url, contact_email, publisher_name, and agent_name. Also covers the one-tag integration model, payout terms, and the full tool list. No authentication required.",
