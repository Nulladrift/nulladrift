        {
          "name": "ad_settings",
          "title": "Ad Settings",
          "description": "View and adjust ad settings for your site (authenticate with your API token sk_...; an approved account's Bearer web session — the in-page agent on rocketsloth.ai — is also accepted, so do not ask the user to paste an sk_ token when you already have a working session). Pass resource and action; call with no action to see what's available. Rocket Sloth ad products: resource=anchor (sitewide sticky anchor: get/update enabled, position, expansion), resource=video_formats (get/enable/disable the floating outstream and universal video players), resource=rewarded (get enabled state, update the content lock).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "The action to perform on the resource. Omit to list what's available.",
                "type": "string"
              },
              "params": {
                "additionalProperties": true,
                "description": "Optional additional parameters for the action.",
                "type": "object"
              },
              "resource": {
                "description": "The resource to act on. Call with no action to discover available resources and actions.",
                "type": "string"
              },
              "token": {
                "description": "Your API token (sk_...). May instead be sent as an Authorization: Bearer header.",
                "type": "string"
