        {
          "name": "application_status",
          "title": "Check Application Status",
          "description": "Check an application's status using its application token (at_...). While pending, your placed units serve Rocket Sloth house creatives; on approval the first call returns your API token (sk_...) exactly once and your units upgrade to full demand automatically — your page never changes. The automated review checks a pending site every hour but pauses 30 days after signup or the last check-again — pass action=request_review (pending applications only) to restart another 30 days of checks. If Google disapproved an approved account's site, fix the site and pass action=resubmit_site to send it back to Google for a new review; each resubmit doubles the wait before the next one is allowed. A Bearer web session (the in-page agent on rocketsloth.ai) also authenticates this tool: the session is enough, no API token is issued on that path, and you must not ask the user to paste an at_ or sk_ token.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Optional. Omit for a normal status poll. Pass request_review to restart the 30-day automated review check when it has paused (pending applications only). Pass resubmit_site to send a site Google disapproved back to Google for a new review (approved accounts only; each resubmit doubles the wait before the next).",
                "type": "string"
              },
              "token": {
                "description": "Your application token (at_...). May instead be sent as an Authorization: Bearer header.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Check Application Status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cf576098b5d9d3b366ff8be403af04ff3618b9edea9478aef6d9e30f43251958"
        },
        {
          "name": "apply",
          "title": "Apply as a Publisher",
          "description": "Call this first after connecting. Connecting the MCP server is not an application. Requires site_url (http/https; need not be live yet), contact_email, publisher_name (the site owner's name — not your agent name), and agent_name; description is optional. Humans can sign up at https://rocketsloth.ai/signup. Returns an application token (at_...). Call integration immediately with it. Rocket Sloth never asks for payment card, bank account, government ID, or health information in chat. No authentication required; rate limited per IP.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Your name (the agent/operator applying on the publisher's behalf), e.g. 'claude-code'.",
                "type": "string"
              },
              "contact_email": {
                "description": "A contact email for the account. Used as the account login.",
                "type": "string"
              },
              "description": {
                "description": "Optional short description of the site or its content.",
                "type": "string"
              },
              "google_email": {
                "description": "Optional. The email address that will receive Google's Ad Manager invitation later in the process; it must belong to a Google account the site owner can sign in to. Defaults to contact_email when omitted.",
                "type": "string"
              },
              "publisher_name": {
                "description": "The site owner's name for the publisher account (e.g. 'Jane Doe'), provided with the owner's consent — used only to create the account and its Google Ad Manager invitation. Not your agent name.",
                "type": "string"
              },
              "site_url": {
                "description": "The publisher site to monetize, as an http or https URL (e.g. https://example.com). Need not be live yet — apply now, integrate while you build; full demand starts once the site is live with the tag.",
                "type": "string"
              }
            },
            "required": ["agent_name", "contact_email", "publisher_name", "site_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply as a Publisher"
