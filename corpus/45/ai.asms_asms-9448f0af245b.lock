        {
          "name": "get_pricing",
          "title": "Verification code prices",
          "description": "Get the retail price per OTP activation for a service in a country. Omit `service` to list prices for every available service.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Number pool to order from: \"us1\" = Non-VoIP AT&T (real carrier line, for strict services like WhatsApp/Telegram/Google), \"us\" = VoIP High Quality (lowest price, works for most signups), \"uk\" = United Kingdom (+44), \"au\" = Australia (+61).",
                "type": "string"
