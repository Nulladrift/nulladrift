      "serverInfo": {
        "name": "asms",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ASMS gives you phone numbers to receive SMS on. For one verification code: get_pricing → create_otp_order → poll_sms until the code arrives. For a number you keep (1 day to 12 months) that receives every SMS sent to it: get_rental_offers → rent_number → read_rental_sms. Orders and rentals are paid from the account wallet; confirm the price with the user before buying.",
      "tools": [
        {
          "name": "cancel_order",
          "title": "Cancel a verification order",
          "description": "Rarely needed. To retry a verification do NOT cancel: just call create_otp_order again, because every unfilled order auto-refunds within 10 minutes on its own, and cancel is blocked for the first 10 minutes anyway. Only use this to release an order you are certain you no longer need once its 10-minute hold has passed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "orderId": {
                "description": "The orderId from create_otp_order.",
                "type": "string"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c45d5db8638c87b282cc0aeb7f1712a90733acd627224fd9b2d3263061c96b40"
        },
        {
          "name": "cancel_rental",
          "title": "Cancel a rental for a refund",
          "description": "Cancel a rented number and refund it. Only possible between 5 and 120 minutes after renting, and only if the number has received no SMS; after that the rental runs to its end date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "number": {
                "description": "The rented number, as rent_number or list_rentals gave it (\"+\", spaces and dashes are ignored).",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3005993303ee41b7ea47419f1bc60c8d7472011f2d74040f9b84267240f321df"
        },
        {
          "name": "create_otp_order",
          "title": "Order a verification number",
          "description": "Buy a number to receive an OTP: allocates a number, debits the wallet, and returns an orderId + phoneNumber. Then poll with poll_sms. If no code arrives, do NOT cancel to retry: simply call create_otp_order again for a fresh number and keep polling that one. Unfilled orders auto-refund within 10 minutes, so you only pay for codes that actually land and there is no penalty for ordering repeatedly. When a service keeps rejecting codes, order on the \"us1\" (Non-VoIP AT&T) pool, which has the highest delivery rate. WARNING: this spends real wallet balance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Number pool to order from: \"us1\" = Non-VoIP AT&T (real carrier line, for strict services like WhatsApp/Telegram/Google), \"us\" = VoIP High Quality (lowest price, works for most signups), \"uk\" = United Kingdom (+44), \"au\" = Australia (+61).",
                "type": "string"
              },
              "service": {
                "description": "Service slug to receive the OTP for (e.g. \"google\", \"telegram\", \"whatsapp\").",
                "type": "string"
              }
            },
            "required": ["country", "service"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f823f8f378c16781d2f8270ae1139c38ebaa9d39b28bc6de2b5c1da42300432"
        },
