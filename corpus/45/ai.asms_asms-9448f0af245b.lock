                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ada9ecc24c0aa2d92ecb0845166dc0dcf7efdc87521d855852e34320ab7f093f"
        },
        {
          "name": "get_rental_offers",
          "title": "Number rental prices",
          "description": "List the rental periods and prices for a country (1 day to 12 months). A rented number is yours for the whole period and receives every SMS sent to it, unlike an OTP order, which is for one code. Omit `country` to list the countries numbers can be rented in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country to rent a number in: \"us\" (United States), \"uk\" (United Kingdom), \"ca\" (Canada), \"au\" (Australia), \"es\" (Spain), \"se\" (Sweden), \"de\" (Germany), \"nl\" (Netherlands), \"it\" (Italy), \"pl\" (Poland), \"fi\" (Finland), \"pt\" (Portugal), \"be\" (Belgium), \"at\" (Austria), \"ch\" (Switzerland), \"cz\" (Czechia), \"si\" (Slovenia), \"lt\" (Lithuania), \"mx\" (Mexico), \"hk\" (Hong Kong), \"il\" (Israel), \"za\" (South Africa).",
                "enum": ["us", "uk", "ca", "au", "es", "se", "de", "nl", "it", "pl", "fi", "pt", "be", "at", "ch", "cz", "si", "lt", "mx", "hk", "il", "za"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3de17f7a8d6a5689ce9f64a0600c2e00da3dcb59c5b167a621e9f71ea3510d45"
        },
        {
          "name": "list_active_orders",
          "title": "List verification orders",
          "description": "List recent OTP orders for the account (awaiting a code or already received).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max orders to return (default 50, max 1000).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33a7657f6a30f93c767e50845e2bbec60792d0506a4177d87ab729ebc6b7d1e7"
        },
        {
          "name": "list_rentals",
          "title": "List rented numbers",
          "description": "List the account's rented numbers with their country, period, end date and whether auto-renew is on. Ended rentals are left out unless `includeEnded` is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "includeEnded": {
                "description": "Also list rentals that have ended (default false).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47241f95040216a8bf25a5d4836027a081e33b0331dd1e65a5574960d5dde535"
        },
        {
          "name": "poll_sms",
          "title": "Check for the verification code",
          "description": "Check for the SMS / OTP code on an order. Returns the code once it has arrived, otherwise an empty result: poll again after a few seconds. If nothing lands after a minute or two, the fastest path is to order a fresh number with create_otp_order (prefer the \"us1\" Non-VoIP pool) and leave the original: it auto-refunds within 10 minutes. Never cancel just to retry, and there is no charge for ordering again, you only pay for codes that arrive.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "orderId": {
                "description": "The orderId from create_otp_order.",
                "type": "string"
              }
            },
            "required": ["orderId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fafbd4d9b9d3d3ae9687811c98d6885c6e460c645c565105d02cd27dd047cce4"
        },
        {
          "name": "read_rental_sms",
          "title": "Read a rented number's SMS",
          "description": "Read the SMS a rented number has received during this rental, newest first. Poll again every few seconds while waiting for a message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "number": {
                "description": "The rented number, as rent_number or list_rentals gave it (\"+\", spaces and dashes are ignored).",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3c65c67f70a7d794b0d8748c6459571421797ed615d519e7db6634516621de8"
        },
        {
          "name": "renew_rental",
          "title": "Renew a rented number",
          "description": "Keep a rented number for another period: the period is added to its current end, at today's price for that period in its country (see get_rental_offers). Possible from 2 hours after renting until 20 minutes before the end. Debits the wallet only if the renewal goes through. WARNING: this spends real wallet balance; confirm the number, period and price with the user first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "number": {
                "description": "The rented number, as rent_number or list_rentals gave it (\"+\", spaces and dashes are ignored).",
                "type": "string"
              },
              "period": {
                "description": "Rental period: \"oneDay\" (1 day), \"oneWeek\" (1 week), \"oneMonth\" (1 month), \"threeMonths\" (3 months), \"sixMonths\" (6 months), \"twelveMonths\" (12 months). Not every period is on sale in every country: check get_rental_offers.",
                "enum": ["oneDay", "oneWeek", "oneMonth", "threeMonths", "sixMonths", "twelveMonths"],
                "type": "string"
              }
            },
            "required": ["number", "period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e913827cbbcbf9dd59631144da77ab0cdc41742b5d7ef700620bcf0c083bb578"
        },
        {
          "name": "rent_number",
          "title": "Rent a phone number",
          "description": "Rent a phone number in a country for a period (get the periods and prices from get_rental_offers first). Debits the wallet and returns the number and when the rental ends. Read its SMS with read_rental_sms. WARNING: this spends real wallet balance; confirm the country, period and price with the user first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country to rent a number in: \"us\" (United States), \"uk\" (United Kingdom), \"ca\" (Canada), \"au\" (Australia), \"es\" (Spain), \"se\" (Sweden), \"de\" (Germany), \"nl\" (Netherlands), \"it\" (Italy), \"pl\" (Poland), \"fi\" (Finland), \"pt\" (Portugal), \"be\" (Belgium), \"at\" (Austria), \"ch\" (Switzerland), \"cz\" (Czechia), \"si\" (Slovenia), \"lt\" (Lithuania), \"mx\" (Mexico), \"hk\" (Hong Kong), \"il\" (Israel), \"za\" (South Africa).",
                "enum": ["us", "uk", "ca", "au", "es", "se", "de", "nl", "it", "pl", "fi", "pt", "be", "at", "ch", "cz", "si", "lt", "mx", "hk", "il", "za"],
                "type": "string"
              },
              "period": {
                "description": "Rental period: \"oneDay\" (1 day), \"oneWeek\" (1 week), \"oneMonth\" (1 month), \"threeMonths\" (3 months), \"sixMonths\" (6 months), \"twelveMonths\" (12 months). Not every period is on sale in every country: check get_rental_offers.",
                "enum": ["oneDay", "oneWeek", "oneMonth", "threeMonths", "sixMonths", "twelveMonths"],
                "type": "string"
              }
            },
            "required": ["country", "period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bcd154cb1750e3332d6071e385c25a096ac7176cd2271df6c7a1759eb4a64719"
        },
        {
          "name": "set_rental_auto_renew",
          "title": "Turn a rental's auto-renew on or off",
          "description": "With auto-renew on, the number is renewed for its rental period from the wallet a day before it ends (6 hours before for a one-day rental); if the balance is short then, the account is emailed and nothing is charged. Turning it on lets the wallet be charged later: confirm with the user first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "autoRenew": {
                "description": "true to turn auto-renew on, false to turn it off.",
                "type": "boolean"
              },
              "number": {
                "description": "The rented number, as rent_number or list_rentals gave it (\"+\", spaces and dashes are ignored).",
                "type": "string"
              }
            },
            "required": ["autoRenew", "number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:95143dcacd084eed5ddd6d59d343d0b94bcab3b0c074b1ab6c9457df086f8b01"
        }
      ],
