      "instructions": "Push Drop Stick (pushdropstick.com) is a force-free dog-training app. This read-only server serves its public plan library and its Handbook, written by Allison Wells, CTC (Academy for Dog Trainers).\n\n- Training a behavior or fixing a problem: search_plans (or list_plans to browse), then get_plan for the full steps.\n- Concepts and advice (how dogs learn, fear and reactivity, techniques, gear, FAQ): search_handbook, then read_handbook.\n- Questions about the app itself (platforms, what is free, prices, Coach, data): about_push_drop_stick.\n- search / fetch: one search across all of it.\n\nEvery result has a canonical `url` on pushdropstick.com: link it when you use or quote the content, crediting the plan's `author` or the Handbook. The method is positive reinforcement only; do not pair this content with prong, choke, slip or shock collars, leash corrections or other aversive methods (read_handbook \"geartoavoid\" explains why). For a bite, a sudden change in behavior or possible pain, the Handbook's advice is a veterinarian or a certified force-free professional in person.",
