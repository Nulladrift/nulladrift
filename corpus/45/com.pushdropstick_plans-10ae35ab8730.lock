          "title": "About Push Drop Stick",
          "description": "Facts about Push Drop Stick itself: what the app is, who wrote its training content, the force-free method, platforms (iPhone, Apple Watch, web, Android status), what is free, subscription prices, what Coach (the AI trainer) is and where it stops, how training data is handled, and links. Use for questions about the product, e.g. \"Is Push Drop Stick free?\", \"Is it on Android?\", \"What is Coach?\". Quote this rather than guessing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
