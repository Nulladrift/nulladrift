            "readOnly": true
          },
          "digest": "sha256:945b01cc84325f32faedaf6c759e16cf1eb66b9a4b42fba88b96c1cdb47a7a69"
        },
        {
          "name": "search_plans",
          "title": "Search training plans",
          "description": "Find step-by-step, force-free training plans for a behavior, problem or command, e.g. \"pulling on leash\", \"crate training\", \"come when called\", \"nail trims\", \"jumping on guests\". BM25 ranked. Returns each plan's `plan` ref, summary, step count, author and canonical `url` to recommend. Next: get_plan for the full steps. For concepts or advice (\"what is threshold\", \"are prong collars ok\") use search_handbook instead.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Optional filter: only plans written in this language (ISO 639-1 code, e.g. \"en\", \"it\"). Most plans are \"en\".",
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "Max results (1-25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to train, or the problem to solve, in plain words.",
                "type": "string"
              },
              "species": {
                "description": "Optional filter: only plans written for this species, lowercase singular (\"dog\", \"cat\", ...). Most plans are \"dog\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
