        {
          "name": "search_handbook",
          "title": "Search the Handbook",
          "description": "Search the Push Drop Stick Handbook: 140+ short articles by a certified force-free trainer (Allison Wells, CTC). Covers how dogs learn (positive reinforcement, punishment, extinction, classical conditioning), fear and reactivity (threshold, trigger stacking, desensitization and counter-conditioning, dogs who wore shock or prong collars), teaching techniques (markers, lures, shaping, duration/distance/distraction), gear (harnesses, head halters, muzzles, why not prong or shock collars), a FAQ (treats, where and how often to train), and how the app and Coach work. Use for \"what is\", \"why\" and \"should I\" questions. Returns entry ids, the most relevant paragraph and canonical urls; read_handbook returns a whole entry.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 6,
                "description": "Max results (1-25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "A question or topic, in plain words.",
                "type": "string"
              },
              "section": {
                "description": "Optional: search only this section.",
                "enum": ["purpose", "faq", "learning-science", "fear-emotion", "how-the-app-works", "using-the-player", "teaching-techniques", "gear", "coach", "your-devices", "training-with-coach", "writing-plans"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Handbook"
          },
          "behavior": {
            "destructive": false,
