          "description": "One search across the whole site: training plans, Handbook articles, and (for questions about the product) the facts page. Returns `results` [{id, title, url, text}]; pass an `id` to fetch for the full document. When you already know you want plans or Handbook articles, search_plans or search_handbook give richer results.",
