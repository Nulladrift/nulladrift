        {
          "name": "scrape",
          "title": "Read a web page",
          "description": "Read one public web page and return its content: the main text (as Markdown with response_format=\"markdown\"), links, metadata and a quality score, plus the raw HTML if you ask (return_html). Set render=true for pages that build their content with JavaScript, or mode=\"auto\" to render only when a plain fetch comes back empty. extract pulls named fields out with CSS selectors. Costs 1 credit for a plain fetch and 5 credits when the page is rendered; with return_html a plain fetch costs 1 credit for each started 400 KB of HTML returned, at most 5. A failed call costs nothing. Pages that disallow automated access or need a login cannot be read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code for the language headers of the request, for example ae or gb. It does not route the request through that country.",
                "pattern": "^[a-zA-Z]{2}$",
                "type": "string"
              },
              "extract": {
                "additionalProperties": {
                  "additionalProperties": false,
                  "properties": {
                    "attribute": {
                      "pattern": "^[A-Za-z][A-Za-z0-9_-]{0,63}$",
                      "type": "string"
                    },
                    "multiple": {
                      "default": false,
                      "type": "boolean"
                    },
                    "selector": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["selector"],
                  "type": "object"
                },
                "description": "Named fields to pull out with a CSS selector, for example {\"heading\":{\"selector\":\"h1\"},\"links\":{\"selector\":\"a\",\"attribute\":\"href\", \"multiple\":true}}. One tag, class, ID or attribute selector each. Static pages only.",
                "maxProperties": 10,
                "type": "object"
              },
              "idempotency_key": {
                "description": "Optional. Send the same key (16 to 128 letters, digits, _ . : -) to retry this exact call safely: a retry within 24 hours returns the first result and is not charged again.",
                "maxLength": 128,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "max_cost": {
                "description": "With mode=auto, the most to spend: 1 never renders, 5 may render.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "min_quality_score": {
                "description": "Refuse the page, at no charge, when its quality score is below this.",
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "default": "manual",
                "description": "\"manual\" (the default) does what render says. \"auto\" fetches the page plainly and renders it only when it looks empty; it holds up to max_cost credits and charges what it used.",
                "enum": ["manual", "auto"],
                "type": "string"
              },
              "render": {
                "default": false,
                "description": "Run the page's JavaScript in a browser first, for pages that build their content in the browser. Costs more.",
                "type": "boolean"
              },
              "response_format": {
                "default": "all",
                "description": "Use \"markdown\" to get the page's main content as Markdown in data.markdown, the best form for reading or summarising. \"all\" (the default) and \"text\" return the standard fields: text, links, metadata and a quality score.",
                "enum": ["text", "markdown", "all"],
                "type": "string"
              },
              "return_html": {
                "default": false,
                "description": "Also return the page's raw HTML in data.html (up to 2 MB). Costs 1 credit for each started 400 KB of HTML returned, at most 5. Not with extract.",
                "type": "boolean"
              },
              "url": {
                "description": "The full public http(s) address of the page.",
                "maxLength": 2048,
                "minLength": 8,
                "type": "string"
              },
              "wait_for": {
                "description": "A CSS selector to wait for before reading. Needs render=true.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "wait_ms": {
                "default": 500,
                "description": "Milliseconds to wait after the page loads. Needs render=true.",
                "maximum": 3000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["url"],
            "type": "object"
          },
