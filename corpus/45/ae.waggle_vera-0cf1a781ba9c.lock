      "serverInfo": {
        "name": "vera",
        "title": "Vera by Waggle",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Vera reads public web pages and searches the web: scrape, search, contacts, products, YouTube transcripts, company profiles, sitemaps and SEO audits. It also returns Google results with the page's features, forum threads, local and shopping listings, keyword ideas, a company's search footprint, a GEO citation radar and AI answers about a brand. initialize and tools/list are open; tools/call needs a Vera API key sent as 'Authorization: Bearer <key>', and each call is charged in credits exactly as it is over the REST API; a call that fails is not charged. New accounts get 3,000 free credits at https://vera.waggle.ae/signup.",
      "tools": [
        {
          "name": "ai_answers",
          "title": "AI Answers and Brand Visibility",
          "description": "Put a buyer's question to an AI assistant that searches the live web, and see whether a brand and its competitors are named in the answer, in what rank, with the citations and cited domains behind it. The assistant is ChatGPT unless `engine` names claude, perplexity or gemini; an assistant the server has no key for answers not_configured and costs nothing. `samples` (1 to 5, default 1) asks the same question more than once, for a mention rate. Returns metrics per assistant, not the raw answers. Charged per call to the assistant at the price list in credits (see llms.txt), the same as POST /v1/ai/answers: the worst case is held first, only the calls made are charged, and a call where the assistant failed is charged nothing. Gemini, when it searches Google, is a base price plus a price for each distinct search query it runs (the model decides how many; up to 10 a call are held for, and a call is only made when that worst case fits in what is held): you are charged for the queries that ran. The most the call can cost is held first and you are charged for what it returns; a call that fails costs nothing.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Brand name to look for in the answer",
                "title": "Brand",
                "type": "string"
              },
              "brand_domain": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The brand's domain, for example roasters.ae",
                "title": "Brand Domain"
              },
              "competitors": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Competitor names or domains to track",
                "title": "Competitors"
              },
              "country": {
                "default": "ae",
                "description": "Two-letter ISO country code of the market",
                "title": "Country",
                "type": "string"
              },
              "engine": {
                "default": "chatgpt",
                "description": "The assistant to ask",
                "enum": ["chatgpt", "claude", "perplexity", "gemini"],
                "title": "Engine",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Send the same key (16 to 128 letters, digits, _ . : -) to retry this exact call safely: a retry within 24 hours returns the first result and is not charged again.",
                "maxLength": 128,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language tag of the market, for example en or ar",
                "title": "Language",
                "type": "string"
              },
              "prompt": {
                "description": "The question to put to the assistant, as a buyer would ask it",
                "title": "Prompt",
                "type": "string"
              },
              "samples": {
                "default": 1,
                "description": "Times the question is asked of the assistant",
                "maximum": 5,
                "minimum": 1,
                "title": "Samples",
                "type": "integer"
              }
            },
            "required": ["brand", "prompt"],
            "title": "ai_answersArguments",
            "type": "object"
          },
