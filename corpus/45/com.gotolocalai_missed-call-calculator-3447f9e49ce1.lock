      },
      "serverInfo": {
        "name": "gotolocal",
        "title": "Go-To Local",
        "version": "1.0.0",
        "description": "Free, read-only tools from Go-To Local: a missed-call cost estimate that uses the same formula as the site's calculator, and a plain explainer of the AI employees Go-To Local builds for local service businesses.",
        "websiteUrl": "https://gotolocalai.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "These tools return a rough missed-call cost estimate worked from the three numbers the caller supplies, and a fixed explainer of the AI employees Go-To Local offers, taken from gotolocalai.com. The estimate is plain arithmetic on the caller's own numbers and is not a forecast; the explainer reflects the site as of its last deploy. Free to use: please cite Go-To Local (gotolocalai.com) and link the source_url in each result.",
      "tools": [
        {
          "name": "missed_call_cost",
          "title": "Missed-call cost estimate",
          "description": "Estimates what missed calls may be costing a local service business each month, using the same formula as the free calculator at https://gotolocalai.com/missed-call-calculator: missed calls a week x 4.33 weeks a month x (share of answered calls that become jobs / 100) x average job value. It is plain arithmetic on the three numbers you give it, so there is no data to go stale, and the result is a rough estimate, not a forecast. Inputs: missed_calls_per_week, avg_job_value (US dollars) and close_rate (a percent: 40 means 40%). Source: Go-To Local, https://gotolocalai.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "avg_job_value": {
                "description": "What a typical job pays the business, in US dollars. A number from 0 to 10000000.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "close_rate": {
                "description": "Percent of answered calls that become jobs, written as a percent: 40 means 40%. A number from 0 to 100.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "missed_calls_per_week": {
                "description": "Calls the business misses in a typical week, voicemails and unanswered rings included. A number from 0 to 10000.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["avg_job_value", "close_rate", "missed_calls_per_week"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:10890755c9292995010ad4ad819f6ae5e164297b2e989f2e006286fdf4ac1acf"
        },
        {
          "name": "what_is_an_ai_employee",
          "title": "What is an AI employee?",
          "description": "Explains what an AI employee is at Go-To Local, a Denver company that builds and runs AI employees for local service businesses in Colorado, North Carolina and South Carolina: the five employees, the two jobs they fall under (answer every customer, and reach out to new customers) and where each stands today, the founding pilot price, what the company says it will not do, and that an AI employee tells callers at the start that it is an AI assistant. The text is taken from the Go-To Local website (https://gotolocalai.com/employees) and reflects the site as of its last deploy. No input.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
