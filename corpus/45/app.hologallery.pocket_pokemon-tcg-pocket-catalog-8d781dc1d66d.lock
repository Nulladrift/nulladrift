      "instructions": "Look up Pokémon TCG Pocket cards, sets, packs, and decks. Card identifiers come in two forms: a printing id like 'A1-001' (a specific card in a specific set) and a gameplay card id like 'PK_000010' (the card's rules text, shared across reprints). Deck tools take gameplay card ids. Search first when you only have a name; use list_printings when you have one printing or gameplay id and want every reprint. Trainer cards carry their rules text and subtype (item, supporter, tool, fossil, stadium). Matchup and trial simulations use deterministic heuristic AI; describe their results as simulations, never as human or competitive win probabilities.",
      "tools": [
        {
          "name": "catalog_info",
          "title": "Catalog info",
          "description": "Catalog metadata: game version, schema version, card/printing/set/pack counts, and supported locales. Quote the game version alongside any simulation result so the evidence stays pinned to the data it was computed from.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Catalog info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3455f4a275517286edb34e1473798673a4c7a3b9d5661e039e4f1d736e79c9a3"
        },
        {
          "name": "evaluate_deck",
          "title": "Evaluate deck",
          "description": "Check a 20-card Pokémon TCG Pocket deck against the game's rules (exactly 20 cards, at most 2 copies of a card, at least one Basic Pokémon) and return build advice: missing evolution lines, energy-type spread, Pokémon/Trainer balance, missing staple Trainers, and known card synergies. Takes gameplay card ids, not printing ids.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cards": {
                "description": "The deck list, one entry per distinct card.",
                "items": {
                  "properties": {
                    "count": {
                      "description": "Copies in the deck.",
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "gameplayCardId": {
                      "description": "Gameplay card id, e.g. 'PK_000360'.",
                      "type": "string"
                    }
                  },
                  "required": ["count", "gameplayCardId"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "locale": {
                "description": "Locale for card names in messages.",
                "type": "string"
              }
            },
            "required": ["cards"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Evaluate deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1a2f266865be9ee0f784379ebe407c612598a2875809b69a2e9353adbabf88a9"
        },
        {
          "name": "get_card",
          "title": "Get card",
          "description": "Get one Pokémon TCG Pocket card's available catalog data: HP, attacks with energy costs and damage, abilities, weakness, retreat cost, evolution, artist, rarity, and artwork. Trainer cards return their rules text and subtype instead of attacks. Accepts either a printing id like 'A1-001' or a gameplay card id like 'PK_000010'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Printing id ('A1-001') or gameplay card id ('PK_000010').",
                "type": "string"
              },
              "locale": {
                "description": "Locale for names and text. Defaults to 'en'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
