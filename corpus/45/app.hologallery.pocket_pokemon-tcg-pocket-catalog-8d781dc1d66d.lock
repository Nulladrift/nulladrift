        {
          "name": "search_cards",
          "title": "Search cards",
          "description": "Search the Pokémon TCG Pocket card catalog by name, attack, ability, artist, or id, with optional filters for set, energy type, stage, card kind, rarity, Trainer subtype, HP range, weakness, and retreat cost. Returns up to 20 summarized cards plus the total number of matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "energy": {
                "description": "Energy type of the Pokémon.",
                "enum": ["grass", "fire", "water", "lightning", "psychic", "fighting", "darkness", "metal", "dragon", "colorless"],
                "type": "string"
              },
              "hpMax": {
                "description": "Maximum HP (Pokémon only).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "hpMin": {
                "description": "Minimum HP (Pokémon only).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "kind": {
                "enum": ["pokemon", "trainer"],
                "type": "string"
              },
              "locale": {
                "description": "Locale for card names, e.g. 'en', 'ja_JP', 'fr_FR'. Defaults to 'en'.",
                "type": "string"
              },
              "page": {
                "description": "1-based page number. Defaults to 1.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text: card name, attack or ability text, artist, or card id.",
                "type": "string"
              },
              "rarity": {
                "description": "Rarity code, e.g. 'diamond-1', 'star-2', 'crown'.",
                "type": "string"
              },
              "retreatMax": {
                "description": "Maximum retreat cost (Pokémon only).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "set": {
                "description": "Set id, e.g. 'A1', 'A2b', 'PROMO-A'.",
                "type": "string"
              },
              "stage": {
                "enum": ["basic", "stage-1", "stage-2"],
                "type": "string"
              },
              "trainerType": {
                "description": "Trainer subtype: item, supporter, tool, fossil, or stadium.",
                "enum": ["item", "supporter", "tool", "fossil", "stadium"],
                "type": "string"
              },
              "weakness": {
                "description": "Weakness energy type of the Pokémon.",
                "enum": ["grass", "fire", "water", "lightning", "psychic", "fighting", "darkness", "metal", "dragon", "colorless"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search cards"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:82815922a0704f7ce0f9fac69caccf8ce835ede5bb70dc0337061d2eb7c2d15d"
        },
        {
          "name": "simulate_matchup",
          "title": "Simulate matchup",
          "description": "Run two legal 20-card Pokémon TCG Pocket decks through the Battle Lab rules engine using deterministic heuristic AI. Returns wins, draws, failures, average turns/actions, and a short sample game log. This measures the built-in AI policy, not human skill or competitive win probability.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deckA": {
                "description": "First deck to compare.",
                "properties": {
                  "cards": {
                    "description": "Exactly 20 total cards, with no more than two copies of one gameplay card.",
                    "items": {
                      "properties": {
                        "count": {
                          "description": "Copies in the deck.",
                          "maximum": 20,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "gameplayCardId": {
                          "description": "Gameplay card id, e.g. 'PK_000360'.",
                          "type": "string"
                        }
                      },
                      "required": ["count", "gameplayCardId"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "energyTypes": {
                    "description": "Energy Zone types configured for this deck.",
                    "items": {
                      "enum": ["grass", "fire", "water", "lightning", "psychic", "fighting", "darkness", "metal", "dragon", "colorless"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "minItems": 1,
                    "type": "array"
                  },
                  "name": {
                    "description": "A short label used in the result.",
                    "maxLength": 80,
                    "type": "string"
                  }
                },
                "required": ["cards", "energyTypes"],
                "type": "object"
              },
              "deckB": {
                "description": "Second deck to compare.",
                "properties": {
                  "cards": {
                    "description": "Exactly 20 total cards, with no more than two copies of one gameplay card.",
                    "items": {
                      "properties": {
                        "count": {
                          "description": "Copies in the deck.",
                          "maximum": 20,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "gameplayCardId": {
                          "description": "Gameplay card id, e.g. 'PK_000360'.",
                          "type": "string"
                        }
                      },
                      "required": ["count", "gameplayCardId"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "energyTypes": {
                    "description": "Energy Zone types configured for this deck.",
                    "items": {
                      "enum": ["grass", "fire", "water", "lightning", "psychic", "fighting", "darkness", "metal", "dragon", "colorless"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "minItems": 1,
                    "type": "array"
                  },
                  "name": {
                    "description": "A short label used in the result.",
                    "maxLength": 80,
                    "type": "string"
                  }
                },
                "required": ["cards", "energyTypes"],
                "type": "object"
              },
              "games": {
                "description": "Number of simulated games. Defaults to 20; maximum 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Locale for card names in the sample log. Defaults to 'en'.",
                "type": "string"
              },
              "seed": {
                "description": "Base random seed. Reusing the same inputs and seed reproduces the result.",
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["deckA", "deckB"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Simulate matchup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
