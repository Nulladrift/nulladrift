            "readOnly": true
          },
          "digest": "sha256:bf4c9e91d417be3d16a4f3a02343881f91c95bf9b9660514b092f7686017adb8"
        },
        {
          "name": "suggest_deck",
          "title": "Suggest deck",
          "description": "Build a complete, legal 20-card Pokémon TCG Pocket deck around a chosen card. Returns a named archetype, why it works, limitations, and the full card list with copy counts. Trainer targets produce a legal baseline with an explicit effect-data limitation. Give either a card name to search for or a gameplay card id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cardId": {
                "description": "Gameplay card id, e.g. 'PK_000960'.",
                "type": "string"
              },
              "locale": {
                "description": "Locale for card names. Defaults to 'en'.",
                "type": "string"
              },
              "query": {
                "description": "Card name to build around, e.g. 'Charizard ex'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Suggest deck"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f179d52075123576ceecb69c7a1bd108f3894c006ad9e04e8fd654a0f0ffed85"
        },
        {
          "name": "trial_deck",
          "title": "Trial deck",
          "description": "Solo-trial one legal 20-card Pokémon TCG Pocket deck: opening-hand consistency (Basics per opener, Trainer density, how often each card shows up across sampled hands) plus mirror self-play with the deck on both seats (closing speed and first-player bias). Use this to tune a single deck; use simulate_matchup to compare two decks. Takes gameplay card ids, not printing ids.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "deck": {
                "description": "The deck to trial.",
                "properties": {
                  "cards": {
                    "description": "Exactly 20 total cards, with no more than two copies of one gameplay card.",
                    "items": {
                      "properties": {
                        "count": {
                          "description": "Copies in the deck.",
                          "maximum": 20,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "gameplayCardId": {
                          "description": "Gameplay card id, e.g. 'PK_000360'.",
                          "type": "string"
                        }
                      },
                      "required": ["count", "gameplayCardId"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "energyTypes": {
                    "description": "Energy Zone types configured for this deck.",
                    "items": {
                      "enum": ["grass", "fire", "water", "lightning", "psychic", "fighting", "darkness", "metal", "dragon", "colorless"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "minItems": 1,
                    "type": "array"
                  },
                  "name": {
                    "description": "A short label used in the result.",
                    "maxLength": 80,
                    "type": "string"
                  }
                },
                "required": ["cards", "energyTypes"],
                "type": "object"
              },
              "games": {
                "description": "Mirror self-play games. Defaults to 10; maximum 50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "hands": {
                "description": "Opening hands to sample. Defaults to 50; maximum 200.",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Locale for card names. Defaults to 'en'.",
                "type": "string"
              },
              "seed": {
                "description": "Base random seed. Reusing the same inputs and seed reproduces the result.",
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["deck"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
