          "title": "Hablar con el agente de VITALINK con tu cuenta",
          "description": "Lo mismo que talk_to_vitalink, con la cuenta de VITALINK del paciente conectada: el agente usa su conversación, sus solicitudes y sus cotizaciones, y puede preparar una acción (pedir cotizaciones, una cita o aceptar una cotización). Preparar no ejecuta nada: el agente le manda al paciente la confirmación exacta por WhatsApp y solo se hace si contesta que sí ahí. Al conectar, la conversación de conversation pasa a su cuenta.",
