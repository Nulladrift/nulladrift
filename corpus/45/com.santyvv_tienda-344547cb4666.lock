        },
        {
          "name": "mercado",
          "title": "Market overview",
          "description": "The big picture: total market cap, Bitcoin dominance, 24 h change, the coins by market cap and the top movers. This is the context question, not the one about a single asset. Cuesta $0.03 por llamada, en USDC sobre Base (protocolo x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limite": {
                "description": "How many coins to return in the market-cap list. (por defecto: 20)",
                "maximum": 250,
                "minimum": 1,
                "type": "integer"
              },
              "vs": {
                "description": "Quote currency. (por defecto: usd)",
                "maxLength": 8,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
