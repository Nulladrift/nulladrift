          "name": "ficha_token",
          "title": "Token profile and price",
          "description": "What a token is and what it is worth: name, symbol, decimals, supply, contract address and price per token. Use it to confirm that an address is a real contract and what it represents. Cuesta $0.03 por llamada, en USDC sobre Base (protocolo x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chain": {
                "description": "Network the token lives on. (por defecto: base)",
                "enum": ["base", "ethereum", "arbitrum", "optimism", "polygon"],
                "type": "string"
              },
              "tokens": {
                "description": "Comma-separated contract addresses, up to 10. Example: 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",
