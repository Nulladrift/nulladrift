          },
          "digest": "sha256:fced33d036dec4c76f53ea58b15fb21697d584718b5446aa50ce2d3ec1f53a49"
        },
        {
          "name": "velas",
          "title": "OHLC candles",
          "description": "Recent candles for a trading pair at the interval you ask for (1m to 1d). What you need to compute trend or volatility, or to draw a chart without an exchange API key. Cuesta $0.01 por llamada, en USDC sobre Base (protocolo x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "interval": {
                "description": "Size of each candle. (por defecto: 1h)",
                "enum": ["1m", "5m", "15m", "30m", "1h", "4h", "1d", "1w", "1M"],
                "type": "string"
              },
              "limite": {
                "description": "How many candles to return. (por defecto: 100)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "symbol": {
                "description": "Pair to query. Example: BTCUSDT",
                "maxLength": 20,
                "type": "string"
