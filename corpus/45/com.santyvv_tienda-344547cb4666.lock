        },
        {
          "name": "precio",
          "title": "Market price",
          "description": "What an asset is worth right now, in USD, as a MEDIAN across several venues with its spread - not a single exchange's last trade. Use it to quote, to compare venues or to spot a dislocated market. Cuesta $0.02 por llamada, en USDC sobre Base (protocolo x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbols": {
                "description": "Comma-separated symbols, up to 20. Example: BTC,ETH,SOL (por defecto: BTC)",
                "maxLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b260455dcd9fe8faf3d21813bad699fe31689a34e588c3f59d282857f99eca5b"
        },
        {
          "name": "saldo",
          "title": "Wallet balance",
          "description": "What an address holds: the native balance of the network and, if you pass a token, that ERC-20 balance with its decimals. Use it to verify a payment or a holding without opening a block explorer. Cuesta $0.03 por llamada, en USDC sobre Base (protocolo x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "20-byte address (0x followed by 40 hex characters).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "chain": {
                "description": "Network to query. (por defecto: base)",
                "enum": ["base", "ethereum", "arbitrum", "optimism", "polygon"],
                "type": "string"
              },
              "token": {
                "description": "Optional: ERC-20 token contract (USDC on Base: 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913).",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["address", "token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
