        "type": "http",
        "url": "https://larabench.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "larabench-public",
        "title": "LaraBench Public MCP",
        "version": "2026-08-03"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search recent Laravel jobs, Laravel news, and Laravel package releases from LaraBench. Results are read-only. Each result carries a larabench.com detail page and the original source URL. Jobs cover the last 30 days; news and package releases cover the last 7 days.",
      "tools": [
        {
          "name": "search_laravel_jobs",
          "title": "Search Laravel jobs",
          "description": "Search recent Laravel jobs indexed by LaraBench, including full description, salary, seniority, and employment type. Results are limited to the last 30 days. Each job carries a LaraBench detail page and, when the source published one, the original apply URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Country or remote-region filters.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "employmentTypes": {
                "description": "Employment type filters.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "limit": {
                "description": "Maximum number of jobs to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "locations": {
                "description": "Location text filters.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "query": {
                "description": "Free-text search across job title, company, and description.",
                "maxLength": 200,
                "type": "string"
              },
              "salaryCurrency": {
                "description": "Three-letter currency code (e.g. USD, EUR, GBP) to pair with salaryMinimum.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "salaryMinimum": {
                "description": "Minimum disclosed salary, in the currency given by salaryCurrency.",
                "minimum": 0,
                "type": "number"
              },
              "seniority": {
                "description": "Seniority filters.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "technologies": {
                "description": "Technology filters such as laravel, vue, inertia, livewire, or react.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "workArrangement": {
                "description": "Restrict results to a single work arrangement. Defaults to any.",
                "enum": ["remote", "hybrid", "onsite", "any"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "format": "date-time",
                "type": "string"
              },
              "freshnessWindowDays": {
                "type": "integer"
              },
              "larabenchUrl": {
                "format": "uri",
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "company": {
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": ["string", "null"]
                    },
                    "employmentType": {
                      "type": ["string", "null"]
                    },
                    "firstSeenAt": {
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "lastSeenAt": {
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "location": {
                      "type": ["string", "null"]
                    },
                    "postedAt": {
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "salary": {
                      "type": ["string", "null"]
                    },
                    "seniority": {
                      "type": ["string", "null"]
                    },
                    "sourceUrl": {
                      "description": "Where to apply on the original site, when the source published one.",
                      "format": "uri",
                      "type": ["string", "null"]
                    },
                    "technologies": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The LaraBench job detail page.",
                      "format": "uri",
                      "type": "string"
                    },
                    "workArrangement": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "totalAvailable": {
                "type": "integer"
              }
            },
            "required": ["asOf", "freshnessWindowDays", "larabenchUrl", "results", "totalAvailable"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Laravel jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9678aaf787f285059db9bd8f88be75c08108573ab1e10847c13c6513fe5294f0"
        },
        {
          "name": "search_laravel_news",
          "title": "Search Laravel news and releases",
          "description": "Search recent Laravel ecosystem news and package releases indexed by LaraBench. Results are limited to the last 7 days. Each item carries a LaraBench detail page and the original article or release notes URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "Release channel to include. stable excludes prereleases, preview returns only prereleases, all returns both. Defaults to stable.",
                "enum": ["stable", "preview", "all"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of items to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "packages": {
                "description": "Composer or npm package filters.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "projects": {
                "description": "Project filters such as laravel, inertia, livewire, filament, or pest.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "query": {
                "description": "Free-text search across article and release titles and summaries.",
                "maxLength": 200,
                "type": "string"
              },
              "sources": {
                "description": "News source filters.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "topics": {
                "description": "Topic filters such as laravel, php, vue, jobs, or packages.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "types": {
                "description": "Restrict results to articles, package releases, or both. Defaults to both.",
                "items": {
                  "enum": ["article", "release"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "freshnessWindowDays": {
                "type": "integer"
              },
              "generatedAt": {
                "format": "date-time",
                "type": "string"
              },
              "larabenchUrl": {
                "format": "uri",
                "type": "string"
              },
              "results": {
                "description": "Article and release items are shaped differently; see the type field.",
                "items": {
                  "properties": {
                    "channel": {
                      "description": "Releases only, normalized to the channel filter vocabulary.",
                      "enum": ["stable", "preview", null],
                      "type": ["string", "null"]
                    },
                    "firstSeenAt": {
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "package": {
                      "description": "Releases only.",
                      "type": ["string", "null"]
                    },
                    "project": {
                      "description": "Releases only.",
                      "type": ["string", "null"]
                    },
                    "publishedAt": {
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "releaseChannel": {
                      "description": "Releases only, the source registry's own channel label (e.g. insiders, canary, rc).",
                      "type": ["string", "null"]
                    },
                    "source": {
                      "description": "Articles only.",
                      "type": ["string", "null"]
                    },
                    "sourceUrl": {
                      "description": "The original article for articles, or the release notes or registry page for releases.",
                      "format": "uri",
                      "type": ["string", "null"]
                    },
                    "summary": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "topics": {
                      "description": "Articles only.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "type": {
                      "enum": ["article", "release"],
                      "type": "string"
                    },
                    "url": {
                      "description": "The LaraBench detail page.",
                      "format": "uri",
                      "type": "string"
                    },
                    "version": {
                      "description": "Releases only.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "title", "type", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "totalAvailable": {
                "type": "integer"
              }
            },
            "required": ["freshnessWindowDays", "generatedAt", "larabenchUrl", "results", "totalAvailable"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Laravel news and releases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ae24f72259203d8ae4874a193b43b602d6d7336e55d0ff55bd17b662c4013f49"
        }
      ],
      "digest": "sha256:bbc917d054065c9b3311fa52c316250faa35d78bcd499211c421c72253083b06"
    }
  }
