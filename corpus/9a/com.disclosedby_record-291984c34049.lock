      "serverInfo": {
        "name": "disclosedby",
        "title": "disclosedby, the subprocessor record",
        "version": "2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "A public, dated record of who processes whose data, built only from the subprocessor lists software companies publish under GDPR art. 28. Every row is a quote of a company's own page, with the day it was read. Answers say what the record does not hold as well as what it does: a company with no list read, a name that did not resolve, a date earlier than the first reading held. Take those as stated, never as nothing. \"First seen\" is the first reading this record holds, not the day a subprocessor was added. Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
      "tools": [
        {
          "name": "as_of",
          "title": "What a list said on a date",
          "description": "What one company's list said on a given date, from the reading this record holds nearest before it, with that reading's own date, its web-archive capture where there is one, its source and its digest. Says so when the date is earlier than the first reading held. Needs a key on an account with Follow your vendors running: this is part of the subscription on disclosedby.com. Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "A company with a list on this record: its domain (notion.so) or its name (Notion). One company per call.",
                "type": "string"
              },
              "date": {
                "description": "ISO date, e.g. 2024-01-01.",
                "type": "string"
              }
            },
            "required": ["company", "date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5476d5f592bf87126690df0cc3362978c830c55493af033dd54338cfd6cfcc00"
        },
        {
          "name": "changes",
          "title": "What changed on a company's list",
          "description": "The dated changes to one company's list, each derived from two readings of that list and carrying both. A change is what the page said on one date against what it said on another; it is never a claim about when a company began or ended a relationship. `printed_differently` marks an entry the list printed in other words with the same companies in the same countries (a name, a location's wording, the list's date line). Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "A company with a list on this record: its domain (notion.so) or its name (Notion). One company per call.",
                "type": "string"
              },
              "since": {
                "description": "Optional ISO date; only changes on or after it.",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:402929883760af346188e99daa531a5ea6466a90fe466cbf6be58271fc715dc7"
        },
        {
          "name": "changes_across",
          "title": "Changes across a reader's own list",
          "description": "The dated changes to the lists of several companies at once, each carrying the two readings it came from. The same facts as `changes`, gathered for one reader's own list of companies. Needs a key on an account with Follow your vendors running: this is part of the subscription on disclosedby.com. Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companies": {
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "since": {
                "description": "Optional ISO date; only changes on or after it.",
                "type": "string"
              }
            },
            "required": ["companies"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b1906bfbc9a4acaf64022e3344fa8414d98fb962c848b00ebfc006aa003fab43"
        },
        {
          "name": "check",
          "title": "Check your vendors: the first step",
          "description": "Given the companies a reader buys from, which of their own published lists name one company, or a company headquartered in a country, on their latest version: in the list's own words, with when it was first seen here and the day the list was checked. Past the first step it answers in counts only: how many of the companies lead there through a company they name, and how many steps held here have ended. The same answer as the check on disclosedby.com. Which company is in between, and since when each step held, is `in_chain`. Names that matched nothing come back beside the answer. It says who to ask, never who is harmed. Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "The companies the reader buys from, by domain or name.",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "target": {
                "description": "The company to look for, or a country by name or code.",
                "type": "string"
              }
            },
            "required": ["companies", "target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:498187c214781db7593024454cb11f05468a11ee4a591f46d988d0a512cc4199"
        },
        {
          "name": "in_chain",
          "title": "Walk your vendors to a company or a country",
          "description": "Given the companies a reader buys from, every path from that list to one company, or to a country: named directly, or named on the own list of a company they name (a fourth party, or sub-subprocessor). Each step is a list's own row, with its purpose and location as written, and the versions each run of it started and ended between; on a date, the versions held on or before it. A country is reached through hand-checked headquarters, of the company or of its group. A second step is a different relationship, quoted from a different page. Names that matched nothing, companies with no list read and rows that did not resolve come back beside the paths. It says who to ask, never who is harmed. Needs a key on an account with Follow your vendors running: this is part of the subscription on disclosedby.com. Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companies": {
                "description": "The companies the reader buys from, by domain or name.",
                "items": {
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "on": {
                "description": "Optional ISO date: the walk as the lists held it then.",
                "type": "string"
              },
              "target": {
                "description": "The company to look for, or a country by name or code.",
                "type": "string"
              }
            },
            "required": ["companies", "target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7da49684249f2d0a2767d6f1608d5141efe7c2d7c5c3241ebc007e9222adba75"
        },
        {
          "name": "list",
          "title": "A company's subprocessor list",
          "description": "What one company's published subprocessor list says, as this record holds it: every row quoted as the company wrote it, with the purpose and location it printed, when the row was first and last seen here, the source page and the date it was read. Says so when no list for that company has been read. Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "A company with a list on this record: its domain (notion.so) or its name (Notion). One company per call.",
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dda5f37511f63e0725bf0435ac82300c5385c5321e55c9d8ee0d86dd31f21efc"
        },
        {
          "name": "named_by",
          "title": "Who names a subprocessor",
          "description": "Which companies name one subprocessor on their published lists, with the name each company prints for it, when it was first seen on that list and when the list was read. One subprocessor per call. Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "subprocessor": {
                "description": "A subprocessor named on at least one list: its name, an alias, or its id here.",
                "type": "string"
              }
            },
            "required": ["subprocessor"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ae69b517b7c27ebaf24b1fa4498234778a18f828a2d1f104be8d0dbc89b68c85"
        },
        {
          "name": "resolve",
          "title": "Which company a name refers to",
          "description": "What company a name on a list refers to, through this record's hand-checked identity table. Exact match only, never a guess: an unknown name comes back unresolved, which is an answer. Free to read, cite and link. Every row is a dated quote of a company's own published page: cite the page and the read date. The compilation is protected: extraction or re-use of a substantial part is not permitted, and it may never be compiled into a lead list, a prospecting feed or a sales tool. A key is one reader's own use.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "A name as printed on a list, or an alias.",
                "type": "string"
              }
            },
