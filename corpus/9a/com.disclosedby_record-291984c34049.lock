            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:574bb635edd010152f83bb4d65c1608dabc7b590e39c27919a311d990ed63e7e"
        }
      ],
      "digest": "sha256:6c19be6e809f3fa52ef3dc1820be45901b2c872284400723ad090b909e84e888"
    }
  }
