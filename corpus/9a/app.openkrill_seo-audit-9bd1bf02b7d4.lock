        {
          "name": "find_ai_questions",
          "title": "Questions for AI search",
          "description": "Long-search finder for a pasted Search Console export. Use this when the user pastes Search Console Performance rows or a CSV and asks which questions to answer on their pages, or how to get named in ChatGPT or Google AI answers. Pass the text as csv, or JSON rows as rows, with query and impressions, and page if there is one. Up to 5000 rows. Returns the searches of 7 or more words ranked by impressions, marked when they look like questions. Each has the page Google shows, the question as a heading, and a 2-sentence answer skeleton with a placeholder for one real number or fact that only the owner knows. Also groups by page. It reads only what is pasted: no Google login, no Search Console call, no AI engine. It does not write the answer or invent the number. Not for a user with no export: ask them to paste one.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["csv"]
              },
              {
                "required": ["rows"]
              }
            ],
            "properties": {
              "csv": {
                "description": "Pasted text of a Search Console export: a header row, then one row per search. Needs a query column and an impressions column; a page column, clicks and position are used when present. Comma, semicolon or tab separated. Up to 5000 data rows. Do not pass this together with rows.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Most questions to return, 1 to 50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "rows": {
                "description": "The same data as JSON rows, for example {\"query\": \"how do I ...\", \"page\": \"https://example.com/a\", \"impressions\": 120, \"clicks\": 3, \"position\": 8.2}. Up to 5000 rows. Do not pass this together with csv.",
                "items": {
                  "description": "One search. Search Console column names such as \"Top queries\" are also read.",
                  "properties": {
                    "clicks": {
                      "type": "number"
                    },
                    "impressions": {
                      "type": "number"
                    },
                    "page": {
                      "description": "The page Google showed.",
                      "type": "string"
                    },
                    "position": {
                      "description": "Average position.",
                      "type": "number"
                    },
                    "query": {
                      "description": "The search as typed.",
                      "type": "string"
                    }
                  },
                  "required": ["impressions", "query"],
                  "type": "object"
                },
                "maxItems": 5000,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "pages": {
                "description": "The pages that Google shows for these searches, by total impressions.",
