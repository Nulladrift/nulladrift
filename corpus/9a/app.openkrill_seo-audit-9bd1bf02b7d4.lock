        {
          "name": "audit_site",
          "title": "SEO audit (site)",
          "description": "Use this to audit a whole site or several pages for SEO; it finds the pages itself. Never guess page addresses for requests such as \"audit example.com\", \"which pages are worst?\" or \"my site has a page per city, are they too similar?\". Pass the domain and optionally max_pages. Reads the homepage, sitemap and linked pages of that site, respecting robots.txt. Returns failed rules by priority, each with its pages, fix and docs link, plus a row per page with its status, broken internal links and images without alt text. It also compares pages: near-identical templated pages, pages with little own text, hreflang without return links or x-default, and sitemap pages nothing links to. Leave judge off unless the user asks what pages are for or which compete. It reads a sample, runs no JavaScript and measures no rankings, traffic or backlinks. For one named page use audit_page. Not for private or local addresses or to collect a site's content.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A public website, for example example.com or https://example.com. Only the site's own pages are read, starting from its homepage and sitemap.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              },
              "judge": {
                "description": "Also ask the judgement service what the page is for, how specific it is and whether pages compete for the same searches. Off by default. It is limited per day, and when unavailable the rule results are returned with a note.",
                "type": "boolean"
              },
              "max_pages": {
                "description": "Most pages to read, 1 to 25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "response_format": {
                "description": "concise (default) lists up to 3 pages per finding and 5 broken links per page; detailed lists up to 10 and 25. Counts are always the full totals.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "bing_ai_search": {
                "additionalProperties": false,
                "description": "Bing and Copilot AI-search steps. List the steps with the sources.",
                "properties": {
                  "sources": {
                    "description": "Microsoft and IndexNow pages the steps follow.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
