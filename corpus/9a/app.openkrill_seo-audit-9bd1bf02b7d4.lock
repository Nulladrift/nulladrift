                  "additionalProperties": false,
                  "properties": {
                    "impressions": {
                      "type": "integer"
                    },
                    "page": {
                      "type": "string"
                    },
                    "questions": {
                      "type": "integer"
                    },
                    "topQuery": {
                      "type": "string"
                    }
                  },
                  "required": ["impressions", "page", "questions", "topQuery"],
                  "type": "object"
                },
                "type": "array"
              },
              "questions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "answerSkeleton": {
                      "description": "Two sentences with a placeholder. The second needs a real number or fact from the owner.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "clicks": {
                      "type": "integer"
                    },
                    "heading": {
                      "description": "The question as a page heading: same words, first letter capital.",
                      "type": "string"
                    },
                    "impressions": {
                      "type": "integer"
                    },
                    "isQuestion": {
                      "description": "True when the search ends with ? or starts with a question word.",
                      "type": "boolean"
                    },
                    "otherPages": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "impressions": {
                            "type": "integer"
                          },
                          "page": {
                            "type": "string"
                          }
                        },
                        "required": ["impressions", "page"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "page": {
                      "description": "The page with the most impressions for this search. Absent when the input has no page column.",
                      "type": "string"
                    },
                    "position": {
                      "description": "Average position, weighted by impressions. Only when the input has it.",
                      "type": "number"
                    },
                    "query": {
                      "type": "string"
                    },
                    "rank": {
                      "description": "Position by impressions among all searches of 7 or more words.",
                      "type": "integer"
                    },
                    "words": {
                      "type": "integer"
                    }
                  },
                  "required": ["answerSkeleton", "heading", "impressions", "isQuestion", "query", "rank", "words"],
                  "type": "object"
                },
                "type": "array"
              },
              "reminder": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "hasPages": {
                    "description": "False when the input has no page column.",
                    "type": "boolean"
                  },
                  "longQueries": {
                    "description": "Distinct searches of 7 or more words.",
                    "type": "integer"
                  },
                  "questionLike": {
                    "description": "Of those, how many start like a question.",
                    "type": "integer"
                  },
                  "rowsRead": {
                    "description": "Data rows in the input.",
                    "type": "integer"
                  },
