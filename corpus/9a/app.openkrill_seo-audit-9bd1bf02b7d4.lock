        {
          "name": "score_page_citation",
          "title": "Citation score (page)",
          "description": "Cite-chance score for one page, 0 to 100. Use this when the user asks whether ChatGPT, Perplexity or Google AI Overviews are likely to cite a page, or how to fix that. Pass exactly one of url, html, text, or sample. Returns the score and a fix list ordered by the biggest point gain. The checks cover an answer in the opening, question headings, an FAQ block, structured data, lists and tables, heading order, short sentences, a number with a source, a recent date, and an author line. Pasted html and text are scored as given and are not fetched. A url is one public page, with robots.txt respected. It does not call an AI engine and it does not promise a citation. Use compare_citations when the user has the pages an AI answer cited. Do not use it for private or local addresses, rankings, or traffic.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["url"]
              },
              {
                "required": ["html"]
              },
              {
                "required": ["text"]
              },
              {
                "required": ["sample"]
              }
            ],
            "properties": {
              "html": {
                "description": "Pasted HTML of one page. Scored as given. Nothing is fetched.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
