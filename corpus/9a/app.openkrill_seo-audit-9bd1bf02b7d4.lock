      "instructions": "SEO Audit: SEO audit, AI citation checks. Pass a public address; a bare domain means https. Private, local or internal addresses are not checked: say so and do not work around it. audit_ai_search: lead with score out of 12, then the fixes in order, then any row marked unknown with its evidence; never call an unknown row a pass or a fail. Then the aeo rows that fail or warn, with their fix; they are not part of the score. Never suggest adding reviews or ratings the owner does not have. Lead with the summary or score, then findings or fixes in the order returned, high priority first, with pages, evidence URL and fix. Cite the source links of rules you mention. For audits, say how many pages were read and that counts describe that sample. Say which rules are heuristics. Relay the notes, including a robots.txt refusal. For per-page questions such as broken links or images without alt text, answer from audit_site pages rows, say how many links each page had checked, and do not call audit_page per address. After audit_site findings, list the bing_ai_search steps with their source links. Leave judge off unless asked what pages are for or which compete; if it is skipped, say why. find_ai_questions: the answer skeleton needs one real number or fact from the owner. Never invent it or offer an example; ask the owner. If summary.hasPages is false, relay the note. Tell the owner to pick one question about what they sell and ask it by hand in ChatGPT or Google AI first. compare_citations: ask the user for 2 to 6 cited addresses; never guess them or claim you read the AI answer. Lead with gaps, then name each unread cited page in the words of cited[].note. If readableCited is under 2, say no pattern can be reported and ask for more addresses. A score, a pass or a shared signal is not a promise of a citation, traffic or a change in AI Overviews. Cite reason.post and reason.asOf, or study.source and study.asOf, when you mention the method. Say profile advice was not fetched. Say a generate_ai_instructions draft was not published. If a daily limit refuses a call, say when it resets. Do not use these tools to collect content or contact details, or for rankings, traffic or backlinks. Do not query AI engines or scrape directories. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "audit_ai_search",
          "title": "AI search audit (12 checks)",
          "description": "Grades a site on 12 on-site checks for AI search. Use it when the user asks whether ChatGPT, Claude, Perplexity or Google AI would recommend or cite their site, or wants a GEO audit. Pass the domain. Reads up to 10 public pages without JavaScript (robots.txt respected). Each check is pass, partial, fail or unknown with evidence and a fix: no-JS text, crawler access, llms.txt, what-is sentence, prices page, comparison page, 10 questions, Organization and Product markup, one name, named quotes, dates, an original number. Returns a score out of 12 and the 3 biggest fixes. unknown means the fetch could not prove the row and earns no point. Also 15 AEO/GEO rows from Microsoft's guide, pass, warn or fail. It does not query AI engines or promise a citation. Not for private addresses.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A public website, for example example.com or https://example.com. Only that site's public pages are read.",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
