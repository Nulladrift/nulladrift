      "serverInfo": {
        "name": "python-code-validator",
        "title": "Python Code Validator",
        "version": "1.29.0",
        "websiteUrl": "https://api.statemind.ai",
        "icons": [
          {
            "src": "https://api.statemind.ai/icon.svg",
            "mimeType": "image/svg+xml"
          }
