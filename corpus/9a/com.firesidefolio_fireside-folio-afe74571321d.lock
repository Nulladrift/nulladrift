      },
      "instructions": "Fireside Folio sends free, legally shareable reading to e-readers and e-ink tablets (reMarkable, Kindle, Kobo, PocketBook, Boox): public-domain and Creative Commons books, children's picture books, comics, magazines, puzzle books, printable templates and practice sheets, encyclopedia articles (Wikipedia and the 1911 Britannica), and a Daily reads edition of blogs and news.\nUse search_library to find things, then send_to_my_device with an item's id. For art, use search_museum and send_museum_pieces. Saved links and encyclopedia topics arrive in the reader's next Daily reads edition. The reader's to-do list is there too: list_my_tasks, add_task, update_task, and send_my_day for a page of the day on their chosen planner template. Everything in the catalogue is free; nothing is ever bought.",
      "tools": [
        {
          "name": "add_reading_topics",
          "title": "Queue encyclopedia articles",
          "description": "Add encyclopedia articles (by source and title, as search_encyclopedia returns them) to the reader's Daily reads; a few arrive in each edition.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "articles": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "source": {
                      "enum": ["wikipedia", "simple_wikipedia", "wikivoyage", "britannica1911", "catholic1913", "national_biography1900", "new_international1905"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["source", "title"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["articles"],
            "type": "object"
          },
