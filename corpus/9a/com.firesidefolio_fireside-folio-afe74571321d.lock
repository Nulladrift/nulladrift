        {
          "name": "add_task",
          "title": "Add a task",
          "description": "Add a task to the reader's list. `text` may say things in plain words: a due date (tomorrow, friday, Dec 3), a time (3pm), an estimate (~20m), priority (! to !!!), a project (#home), where it goes (@today, @later, @waiting) or a repeat (every monday). Fields given separately win.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "checklist": {
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "due": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "minutes": {
                "maximum": 1440,
                "minimum": 1,
                "type": "integer"
              },
              "notes": {
                "type": "string"
              },
              "priority": {
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "project": {
                "type": "string"
              },
              "state": {
                "enum": ["inbox", "today", "waiting", "later"],
                "type": "string"
              },
              "text": {
                "description": "The task, e.g. \"Call the dentist tomorrow 3pm ~15m\".",
                "type": "string"
              },
              "time": {
                "description": "HH:MM, 24-hour",
                "type": "string"
              },
              "waitingOn": {
                "description": "Who or what it waits on (with state waiting).",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a task"
