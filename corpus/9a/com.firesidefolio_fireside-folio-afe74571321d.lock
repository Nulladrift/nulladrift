        {
          "name": "search_library",
          "title": "Search the free library",
          "description": "Search Fireside Folio's free catalogue: classic and open-licence books, children's picture books, comics, magazines, puzzle books (sudoku, mazes, crosswords-style puzzles, calcudoku…), printable templates, planners and handwriting or maths practice sheets. Returns an id for each item.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Limit to one kind (default any).",
                "enum": ["any", "book", "childrens_book", "comic", "magazine", "puzzle", "template"],
                "type": "string"
              },
              "language": {
                "description": "A language name such as English or French.",
                "type": "string"
              },
              "limit": {
                "description": "How many results (default 8).",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for: a title, author, subject or kind of thing (\"easy sudoku\", \"dinosaurs picture book\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
