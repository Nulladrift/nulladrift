      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fireside Folio sends free, legally shareable reading to e-readers and e-ink tablets (reMarkable, Kindle, Kobo, PocketBook, Boox): public-domain and Creative Commons books, children's picture books, comics, magazines, puzzle books, printable templates and practice sheets, encyclopedia articles (Wikipedia and the 1911 Britannica), and a Daily reads edition of blogs and news.\nUse search_library to find things, then send_to_my_device with an item's id. For art, use search_museum and send_museum_pieces. Saved links and encyclopedia topics arrive in the reader's next Daily reads edition. Everything in the catalogue is free; nothing is ever bought.",
      "tools": [
        {
          "name": "add_reading_topics",
          "title": "Queue encyclopedia articles",
          "description": "Add encyclopedia articles (Wikipedia or 1911 Britannica, by title) to the reader's Daily reads; a few arrive in each edition.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "articles": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "source": {
                      "enum": ["wikipedia", "britannica1911"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["source", "title"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["articles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Queue encyclopedia articles"
          },
          "behavior": {
            "destructive": false,
