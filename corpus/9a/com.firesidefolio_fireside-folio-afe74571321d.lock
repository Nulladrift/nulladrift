        {
          "name": "search_museum",
          "title": "Search the museum",
          "description": "Search hundreds of thousands of public-domain artworks from The Met, the Art Institute of Chicago, the National Gallery of Art, the Rijksmuseum, the Cleveland Museum of Art and SMK (Denmark): paintings, prints, drawings, photographs, maps, manuscripts, sculpture and more. Use a room for a curated theme. Returns a ref for each work.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "era": {
                "enum": ["ancient", "medieval", "renaissance", "1600s", "1700s", "1800s", "1900s"],
                "type": "string"
              },
              "kind": {
                "enum": ["Paintings", "Drawings", "Prints", "Photographs", "Books and manuscripts", "Maps", "Sculpture", "Ceramics", "Glass", "Metalwork", "Jewellery", "Textiles and costume", "Furniture", "Arms and armour", "Coins and medals", "Musical instruments"],
                "type": "string"
              },
              "museum": {
                "enum": ["met", "aic", "nga", "rijks", "cma", "smk"],
                "type": "string"
              },
              "page": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Artist, title or subject (\"Hokusai\", \"sunflowers\", \"ships in a storm\").",
                "type": "string"
              },
              "room": {
                "description": "A curated room: impressionists, post-impressionists, dutch-golden-age, renaissance, durer-and-prints, ukiyo-e, china, india-persia, egypt, greece-rome, medieval, manuscripts, portraits, landscapes, still-life, botanical, birds, cats-dogs, horses, sea, winter, night, myths, cities, maps, early-photography, posters, danish-golden-age, arms, fashion, africa-americas.",
                "type": "string"
              }
            },
            "type": "object"
          },
