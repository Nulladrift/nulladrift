          },
          "digest": "sha256:6d730417a82604ce05e85d5c9e21ecca4aff0646f4bc2655d8b138f5428224a7"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the BurdenRateLedger dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
