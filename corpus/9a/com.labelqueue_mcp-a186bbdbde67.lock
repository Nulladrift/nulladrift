          },
          "digest": "sha256:06d3eb506027a88bd0ffc4e8634c1940e263dcd3c21fff9a4a4a57b87ba0d9c9"
        },
        {
          "name": "lookup_avery_label_specs",
          "title": "Avery & Standard Sheet Label Geometry Lookup",
          "description": "Look up exact physical sheet and label geometry (width, height, top/left margins, horizontal/vertical pitch in inches and mm, columns, rows) for Avery US Letter & A4 label codes (5160, 5163, 5164, 5167, 22807, L7160).",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Avery or sheet template code (e.g. \"5160\", \"5163\", \"5164\", \"5167\", \"22807\", \"L7160\")",
                "type": "string"
              }
