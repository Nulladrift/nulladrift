          "name": "check_barcode_symbology_requirements",
          "title": "Code-128, UPC-A, EAN-13 & QR Quiet-Zone Spec Checker",
          "description": "Verify character constraints, check-digit math, minimum X-dimension mil width, and mandatory left/right quiet zones for retail and warehouse barcodes.",
          "inputSchema": {
            "properties": {
              "symbology": {
                "description": "Barcode symbology type",
                "enum": ["CODE128", "UPCA", "EAN13", "QR", "ITF14"],
                "type": "string"
              }
            },
            "required": ["symbology"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
