          },
          "digest": "sha256:14082256738bbbde4e1c693520f1ede000e4409527e17f00be07da5e32bb8738"
        },
        {
          "name": "diagnose_browser_label_print_drift",
          "title": "Browser PDF Label Vertical/Horizontal Drift Diagnostic",
          "description": "Diagnose progressive row creep when printing sheet labels from Chrome, Edge, Adobe Acrobat, or macOS Preview caused by Fit-to-Page scaling (~94%–97%).",
          "inputSchema": {
            "properties": {
              "observedDriftMm": {
                "description": "Measured vertical drift by bottom row in millimeters (e.g. 6.5)",
                "type": "number"
              },
              "viewer": {
                "description": "Print dialog environment",
                "enum": ["chrome", "macos-preview", "acrobat", "windows-print"],
                "type": "string"
              }
            },
            "required": ["observedDriftMm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
