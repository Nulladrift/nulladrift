                "minLength": 3,
                "type": "string"
              },
              "country": {
                "description": "Country of the address. Default ES (also returns Basque Country and Navarre).",
                "enum": ["ES", "FR", "IT", "DE", "AT", "NL", "BE", "PL", "CH", "CZ", "DK", "NO", "FI", "EE", "LV", "LT", "SI", "SK", "BG", "GR", "CY", "LU", "LI", "IS", "IE", "UK", "PT"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum candidates (1-10, default 5)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
