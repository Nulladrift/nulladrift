        {
          "name": "resolve_reference",
          "title": "Identify a Reference",
          "description": "Free and without quota: tell what a piece of text is before looking it up. Classifies it as a cadastral reference, a coordinate pair or a place name, for each country it could belong to, with confidence (0-1), the normalised form and whether that country is supported. ambiguous=true means bare digits that fit several countries: pick one and pass it as country to get_parcel. Use it when get_parcel answers CNV_AMBIGUOUS, or to find the country of an unknown reference.",
