      "tools": [
        {
          "name": "compare_parcels",
          "title": "Compare Parcels",
          "description": "Compare 2 or 3 parcels side by side: location, solar potential, agricultural use and investment score (0-100 with rating). Parcels can be in different countries: ES (Spain, common regime), PT, FR, IT and DE. The Basque Country and Navarre are not supported here (use the single-parcel tools). Area, land use and municipality are only filled for Spain. No market prices. A parcel that is not found comes back with an error and the others are still compared. Costs one quota unit per parcel found (0 to 3).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "parcels": {
                "description": "Two or three parcels to compare",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "country": {
                      "description": "Country code: ES, PT, FR, IT or DE",
                      "enum": ["ES", "PT", "FR", "IT", "DE"],
                      "type": "string"
                    },
                    "reference": {
                      "description": "Official cadastral reference",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["country", "reference"],
                  "type": "object"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["parcels"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:802ae4c4f5c87a01d1ecb7cc3f3330ac0f2c62b232d8b0806eb1f7904f298cb8"
        },
        {
          "name": "get_agriculture",
          "title": "Get Agricultural Data",
          "description": "Agricultural context for a rural parcel: land use and main crop from the agricultural parcel registry (SIGPAC in Spain, with slope, altitude and irrigation), vegetation index (NDVI) and a reference crop price when available. Richest in Spain; also Portugal, France, Italy and Germany. Values from official registries (land use, crop) stay in the source language.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country code: ES, PV, NA, PT, FR, IT or DE. Omit to auto-detect.",
                "enum": ["ES", "PV", "NA", "PT", "FR", "IT", "DE"],
                "type": "string"
              },
              "reference": {
                "description": "Official cadastral reference of a rural parcel",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1eb9f110d378536d9f3472d17b35da19c96d47a0c11483e98ef06ddd47c4e4fc"
        },
        {
          "name": "get_boundaries",
          "title": "Get Parcel Boundaries",
          "description": "Get the outline of a cadastral parcel as GeoJSON and/or a [lat, lng] ring, plus its centroid and area, for mapping and GIS work. Accepts references from the same 31 codes as get_parcel except the United Kingdom, which is coordinates only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country code. Omit to auto-detect from the reference format.",
                "enum": ["ES", "PV", "NA", "PT", "FR", "IT", "DE", "AT", "CH", "LI", "BE", "NL", "LU", "PL", "CZ", "SK", "SI", "HR", "BG", "GR", "CY", "DK", "SE", "NO", "FI", "IS", "EE", "LV", "LT", "IE"],
                "type": "string"
              },
              "reference": {
                "description": "Official cadastral reference",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4fe603f27b2053f9a07b30334c553af6c027bffcf2630cab1e6d4a559c8806af"
        },
        {
          "name": "get_crop_catalog",
          "title": "Get Crop Catalog",
          "description": "Free and without quota: every crop or land-use code that can appear as crop_code (Spanish Catastro codes, the foral codes of Alava, Bizkaia, Gipuzkoa and Navarre, and the Austrian, Estonian and Greek catalogues) with its name in the requested language, the original label and its common use_class. Use it to translate or group crop codes; pass code to look one up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "Return only this crop code (e.g. G-, NA:1501, AT:53)",
                "minLength": 1,
                "type": "string"
              },
              "lang": {
                "description": "Language of the names (default English)",
                "enum": ["es", "ca", "en", "pt", "fr", "it", "de", "pl", "nl", "cs"],
                "type": "string"
              },
              "source": {
                "description": "Return only codes of this catalogue: ES, AL, BI, GI, NA, AT, EE or GR",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0cb71f5da618edb44edb9b8ec48105ce63c53cbfc30a56d9289b0a586e20a1a2"
        },
        {
          "name": "get_ground_motion",
          "title": "Get Ground Motion (Subsidence)",
          "description": "Whether the ground under the parcel sinks or rises and how fast, measured by satellite radar (Copernicus European Ground Motion Service, EGMS L3 Ortho, Sentinel-1 InSAR, 100 m grid, 2020-2024): mean vertical velocity in mm/year over the parcel outline (negative = sinking), fastest-sinking cell, east-west velocity, class from stable to severe_subsidence, cells with data and the mean displacement of each year. status no_data with reason no_reflectors means the satellite found nothing stable to measure (fields, forest, water): there is no figure, not a zero. Carries the source, licence and the attribution to show. Every covered country inside EGMS coverage: in ES, PV, NA, PT, FR, IT and DE the reference is enough; elsewhere also pass latitude and longitude (from get_parcel). Costs 1 quota unit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country code. Omit to auto-detect from the reference.",
                "enum": ["ES", "PV", "NA", "PT", "FR", "IT", "DE", "AT", "CH", "LI", "BE", "NL", "LU", "PL", "CZ", "SK", "SI", "BG", "GR", "CY", "DK", "SE", "NO", "FI", "IS", "EE", "LV", "LT", "IE"],
                "type": "string"
              },
              "latitude": {
                "description": "Latitude of the parcel point (WGS84). Required outside ES, PV, NA, PT, FR, IT and DE",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude of the parcel point (WGS84). Required outside ES, PV, NA, PT, FR, IT and DE",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "reference": {
                "description": "Official cadastral reference",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c83bd5520b14b2de9f9198cc6c21fcf04edaa2cf99ebbfdbc51b47987d0206fd"
        },
        {
          "name": "get_investment_score",
          "title": "Get Investment Score",
          "description": "Investment score (0-100) for a parcel with a rating (excellent, good, moderate, low, very_low or no_data) and qualitative factor levels (high/medium/low/not_available), never the formula. Built from the data the API can gather for that country: solar potential (PVGIS) and agricultural use in ES, PV, NA, PT, FR, IT and DE; the market factor only in France, Italy and Germany (North Rhine-Westphalia). Accessibility and risk are not computed yet and come back as not_available, so the score is relative to the factors that were available. Other countries are not supported. One API call.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country code: ES, PV, NA, PT, FR, IT or DE. Omit to auto-detect.",
                "enum": ["ES", "PV", "NA", "PT", "FR", "IT", "DE"],
                "type": "string"
              },
              "reference": {
                "description": "Official cadastral reference",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3a19016c07f9e2824471d815b653620b7c827d7f186b9b9c6264ee8d1d3458bb"
        },
        {
          "name": "get_market_data",
          "title": "Get Market Data",
          "description": "Paid API plans only (Developer, Startup, Growth, Enterprise): with a Free-plan key it answers KEY_PLAN_001 and nothing is charged. Rural land only: prices agricultural parcels in Spain (ES, PV, NA), small agricultural buildings allowed (sheds, farm stores, ponds, greenhouses), with crop_prices (EUR per hectare for each crop group of the parcel, with the number of sales behind it) and zone_prices.rural (the province farmland price per hectare). It is the price of the land; buildings are not valued (price_note). Housing, industrial or any other non-agricultural property is not supported and answers MKT_001 with nothing charged; so does rural land without a price, and any other country. One API call, charged only when a price comes back.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country code. Rural land prices exist for ES, PV and NA; other countries answer MKT_001. Omit to auto-detect.",
                "enum": ["ES", "PV", "NA", "PT", "FR", "IT", "DE"],
                "type": "string"
              },
              "reference": {
                "description": "Official cadastral reference",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6a9618c4e84c179e2b398ee3bad0452ebfbd290e121194f36072d276438552c4"
        },
        {
          "name": "get_neighbors",
          "title": "Get Neighboring Parcels",
          "description": "Parcels that touch or surround a parcel (up to 60), each with its cadastral reference and centre point. Spain from the official cadastre; other countries from our own copy where we hold one. Where neighbours cannot be listed it answers supported=false with an empty list, free. One API call.",
