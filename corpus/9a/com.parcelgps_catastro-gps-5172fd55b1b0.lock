        {
          "name": "get_terrain",
          "title": "Get Terrain, Protected Areas and Climate",
          "description": "Relief of the parcel computed over its outline from Copernicus DEM GLO-30 (30 m): mean/min/max elevation, mean and maximum slope with class and distribution, share steeper than 10 %, dominant orientation. Whether it lies in Natura 2000 (EEA) or a nationally designated protected area (CDDA), with each site's name, code, type (SPA/SCI) and the share of the parcel inside it. Climate normals at the parcel point from ERA5-Land (mean temperature, precipitation, frost and hot days, and the recent change against the baseline). Every block carries its source and licence; status is ok, no_data or unavailable. In ES, PV, NA, PT, FR, IT and DE the reference is enough; in every other covered country also pass latitude and longitude (from get_parcel). Costs 1 quota unit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country code. Omit to auto-detect from the reference.",
