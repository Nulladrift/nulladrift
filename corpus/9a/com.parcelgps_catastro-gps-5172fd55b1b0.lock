                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "reference": {
                "description": "Official cadastral reference",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
