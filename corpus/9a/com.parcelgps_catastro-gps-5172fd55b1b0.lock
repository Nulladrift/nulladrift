          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0f3cac585b9daaa6efe51c142296261c53cb116d9333109bafd7fbbea1a4b73a"
        },
        {
          "name": "get_parcel",
          "title": "Get Parcel",
          "description": "Look up a parcel in the official cadastre of 27 European countries (including the Basque Country and Navarre foral cadastres), by its official cadastral reference or by WGS84 coordinates, plus partial coverage in the United Kingdom (Scotland, coordinates only) and Sweden (agricultural blocks). Returns the reference, location, address, municipality, area, land use and the parcel outline when the official source provides them. The country is detected from the reference format or the point when omitted. Where the parcel has crop or land-use parts it also returns their count and a crop summary (crop and share of the area); the full list with outlines is get_parcel_subparcels. Croatia: cadastral municipality code + parcel number (334553-6250/3) or '6250/3 k.o. Zabok'. Ireland: registered land only. Every result names its official source and licence in the source field. Codes: ES Spain, PV Basque Country, NA Navarre, PT Portugal, FR France, IT Italy, DE Germany, AT Austria, CH Switzerland, LI Liechtenstein, BE Belgium, NL Netherlands, LU Luxembourg, PL Poland, CZ Czechia, SK Slovakia, SI Slovenia, HR Croatia, BG Bulgaria, GR Greece, CY Cyprus, DK Denmark, SE Sweden, NO Norway, FI Finland, IS Iceland, EE Estonia, LV Latvia, LT Lithuania, IE Ireland, UK United Kingdom.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country code. Omit to auto-detect. PV and NA are the Spanish foral cadastres.",
                "enum": ["ES", "PV", "NA", "PT", "FR", "IT", "DE", "AT", "CH", "LI", "BE", "NL", "LU", "PL", "CZ", "SK", "SI", "HR", "BG", "GR", "CY", "DK", "SE", "NO", "FI", "IS", "EE", "LV", "LT", "IE", "UK"],
                "type": "string"
              },
              "lang": {
                "description": "Language of crop names (default English)",
                "enum": ["es", "ca", "en", "pt", "fr", "it", "de", "pl", "nl", "cs"],
                "type": "string"
              },
              "latitude": {
                "description": "Latitude in WGS84 (use with longitude instead of reference)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Longitude in WGS84 (use with latitude instead of reference)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "reference": {
                "description": "Official cadastral reference as written in the country (e.g. 9872023VH5797S0001WX, 750560000AB0001)",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7e0672ec2522e19a64a679862b66ebba455624140270a8318f5c6aa2bf0872d2"
        },
        {
          "name": "get_parcel_sigpac",
          "title": "Get Parcel SIGPAC Enclosures",
          "description": "Every SIGPAC enclosure (recinto) of a Spanish parcel, the CAP land parcel identification system: SIGPAC id, land-use code (TA, OV, VI, FY, PS...) with its name in the requested language, area in hectares, irrigation coefficient, mean slope, altitude, CAP pasture eligibility and region, incidents with their official text and, with include_geometry, the GeoJSON outline. Spain, the Basque Country and Navarre only; other countries answer CNV_COVERAGE. match tells whether the SIGPAC parcel was found by the cadastral reference or under the parcel's point. Source FEGA SIGPAC: cite 'Fuente: FEGA - SIGPAC'. One API call; free when there are no enclosures. If SIGPAC does not answer it returns SIG_001: nothing is charged, retry in a few seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional: ES, PV (Basque Country) or NA (Navarre). Omit to auto-detect.",
                "enum": ["ES", "PV", "NA"],
                "type": "string"
              },
              "include_geometry": {
                "description": "Include the GeoJSON outline of each enclosure (large). Default false.",
                "type": "boolean"
              },
              "lang": {
                "description": "Language of land-use names (default English)",
                "enum": ["es", "ca", "en", "pt", "fr", "it", "de", "pl", "nl", "cs"],
                "type": "string"
              },
              "reference": {
                "description": "Official Spanish cadastral reference of the parcel or unit",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:499998af073a584005b8fbc00e667760ccac1c972001e0dfa8bbffc675593175"
        },
        {
          "name": "get_parcel_subparcels",
          "title": "Get Parcel Subparcels",
          "description": "What is on each part of a parcel: every crop or land-use subparcel with a stable crop_code, the crop name in the requested language, the original label of the source, area in m2, kind (cadastral, declaredCrop, landCover), a common use_class (arable, vineyard, olive, forest...), intensity, land type and class, source and, with include_geometry, its GeoJSON outline. Spain (Catastro, including Bizkaia, Alava, Navarre; Gipuzkoa without outlines), Austria, Germany, Czechia, the Netherlands, France, Portugal, Sweden, Switzerland, Finland, Belgium, Ireland, Slovenia, Estonia and Greece. One API call; free when the parcel has none. If the source does not answer it returns SUB_001: nothing is charged, retry in a few seconds. Translate codes with get_crop_catalog.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country code (ES, PV, NA, AT, EE, GR...). Omit to auto-detect.",
                "enum": ["ES", "PV", "NA", "PT", "FR", "IT", "DE", "AT", "CH", "LI", "BE", "NL", "LU", "PL", "CZ", "SK", "SI", "HR", "BG", "GR", "CY", "DK", "SE", "NO", "FI", "IS", "EE", "LV", "LT", "IE"],
                "type": "string"
              },
              "include_geometry": {
                "description": "Include the GeoJSON outline of each subparcel (large). Default false.",
                "type": "boolean"
              },
              "lang": {
                "description": "Language of crop names (default English)",
                "enum": ["es", "ca", "en", "pt", "fr", "it", "de", "pl", "nl", "cs"],
                "type": "string"
              },
              "reference": {
                "description": "Official cadastral reference of the parcel",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:94c5011b28e612fb33aa821011070e667e577dd9824dbb6f4490758fffc40144"
        },
