        {
          "name": "business_days",
          "title": "Business days and date offsets",
          "description": "Count weekdays between dates or add/subtract days. UTC dates, Monday–Friday; start included and end excluded unless includeEnd. Offset excludes start. Public holidays are not excluded. Free, no authentication required. Rate limited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "endDate": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "includeEnd": {
                    "default": false,
                    "type": "boolean"
                  },
                  "mode": {
                    "const": "between",
                    "type": "string"
                  },
                  "startDate": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["endDate", "mode", "startDate"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "businessOnly": {
                    "default": true,
                    "type": "boolean"
                  },
                  "days": {
                    "maximum": 36525,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "direction": {
                    "default": "add",
                    "enum": ["add", "subtract"],
                    "type": "string"
                  },
                  "mode": {
                    "const": "offset",
                    "type": "string"
                  },
                  "startDate": {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  }
                },
                "required": ["days", "mode", "startDate"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "businessDays": {
                "type": "number"
              },
              "calendarDays": {
                "type": "number"
              },
              "endDate": {
                "type": "string"
              },
              "holidaysExcluded": {
                "const": false,
                "type": "boolean"
              },
              "mode": {
                "enum": ["between", "offset"],
                "type": "string"
              },
              "startDate": {
                "type": "string"
              },
              "weekendDays": {
                "type": "number"
              }
            },
            "required": ["endDate", "holidaysExcluded", "mode", "startDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business days and date offsets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "heffl/page": "https://heffl.com/tools/business-days-calculator"
          },
          "digest": "sha256:6a1be590f14d094987fdd1387cbab17772870da84e90346f6a9c78390370ede6"
        },
