        {
          "name": "agency_pricing",
          "title": "Agency pricing and profitability",
          "description": "Calculate project price from labor, overhead and risk buffer. margin is percentage of selling price; overhead and riskBuffer are percentage additions. Free, no authentication required. Rate limited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "hourlyCost": {
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "hours": {
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "margin": {
                "maximum": 95,
                "minimum": 0,
                "type": "number"
              },
              "overhead": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "riskBuffer": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["hourlyCost", "hours", "margin", "overhead", "riskBuffer"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "actualMargin": {
                "type": "number"
              },
              "basePrice": {
                "type": "number"
              },
              "bufferedHours": {
                "type": "number"
              },
              "directLabor": {
                "type": "number"
