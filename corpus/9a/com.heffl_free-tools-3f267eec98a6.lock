        {
          "name": "email_verify",
          "title": "Verify an email address",
          "description": "Check one email's syntax, mail routing, disposable/free-provider/role flags, and SMTP recipient acceptance. Sends no email. DNS alone does not verify a mailbox. unknown means inconclusive or mailbox not checked; likely_deliverable is evidence, not a delivery guarantee. No login or API key required. Rate limited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "email": {
                "maxLength": 320,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkedAt": {
                "format": "date-time",
                "type": "string"
              },
              "checks": {
                "properties": {
                  "catchAll": {
                    "type": ["boolean", "null"]
                  },
                  "disposable": {
                    "type": ["boolean", "null"]
                  },
                  "freeProvider": {
                    "type": ["boolean", "null"]
                  },
                  "mailRouting": {
                    "enum": ["pass", "fail", "unknown", "not_checked"],
                    "type": "string"
                  },
                  "roleBased": {
                    "type": ["boolean", "null"]
                  },
                  "smtp": {
                    "enum": ["accepted", "rejected", "unknown", "not_checked"],
                    "type": "string"
                  },
                  "syntax": {
                    "enum": ["pass", "fail", "unsupported"],
                    "type": "string"
                  }
                },
                "required": ["catchAll", "disposable", "freeProvider", "mailRouting", "roleBased", "smtp", "syntax"],
                "type": "object"
              },
              "email": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "status": {
                "enum": ["invalid", "unknown", "likely_deliverable", "accept_all"],
                "type": "string"
              },
              "suggestion": {
                "type": ["string", "null"]
              }
            },
            "required": ["checkedAt", "checks", "email", "reason", "status", "suggestion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Verify an email address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:adb8959ce10210e7753e52421f8af176ebb888eb6843da4cceb2d091e8c5678d"
        },
