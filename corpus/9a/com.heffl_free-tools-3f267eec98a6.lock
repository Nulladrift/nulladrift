        {
          "name": "risk_assessment",
          "title": "Project risk assessment",
          "description": "Score user-supplied risks using likelihood × impact (1–5). Low <=6, medium <=14, high >=15. Does not infer likelihood or impact. Free, no authentication required. Rate limited.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
