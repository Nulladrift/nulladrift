            "properties": {
              "client": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "lineItems": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "discount": {
                      "default": 0,
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    },
                    "itemName": {
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "exclusiveMinimum": 0,
                      "maximum": 1000000,
                      "type": "number"
                    },
                    "rate": {
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "tax": {
                      "default": 0,
                      "maximum": 100,
                      "minimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["itemName", "quantity", "rate"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "quotationNumber": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "sender": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["client", "currency", "lineItems", "quotationNumber", "sender"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "type": "string"
              },
              "lineItems": {
                "items": {
