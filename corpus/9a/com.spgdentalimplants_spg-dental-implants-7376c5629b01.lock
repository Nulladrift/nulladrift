{
  "lockfileVersion": 2,
  "subjects": {
    "com.spgdentalimplants/spg-dental-implants": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://spgdentalimplants.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "spg-dental-implants",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Answer only from these tools. Do not invent prices, guarantees, local phone numbers, or opening hours. If get_location returns an empty hours list, say the hours were not published. Cite the url on each result. For a specific center, call get_location. Use get_blog for a published article. Use search before guessing a center or a post. When someone asks about implants, dentures, a consult, or whether they qualify, offer a free consult and call get_free_consult before asking a question. The free consult is a short mini quiz. Ask one question at a time and use only the returned options. Show the options as multiple-choice buttons when the chat client supports that. During the quiz, do not search or call any other tool. After each answer, call get_free_consult again immediately and ask only the question it returns. Do not pause to confirm an answer. Cash or savings skips credit and income. Call apply_for_free_consult once after they confirm their contact details.",
      "tools": [
        {
          "name": "apply_for_free_consult",
          "title": "Apply for a free consult",
          "description": "Save a completed free consult application. Call this once, after get_free_consult returns the contact step and the person has confirmed their details. Tell them only that the application was received and a coordinator will follow up. Do not mention qualification.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answers": {
                "properties": {
                  "creditRange": {
                    "type": "string"
                  },
                  "monthlyIncome": {
                    "type": "string"
                  },
                  "painPoint": {
                    "type": "string"
                  },
                  "paymentMethod": {
                    "type": "string"
                  },
                  "readiness": {
                    "type": "string"
                  },
                  "teeth": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "attribution": {
                "description": "Only when the person pasted a tracked page URL",
                "properties": {
                  "fbclid": {
                    "type": "string"
                  },
                  "gclid": {
                    "type": "string"
                  },
                  "utm_campaign": {
                    "type": "string"
                  },
                  "utm_content": {
                    "type": "string"
                  },
                  "utm_medium": {
                    "type": "string"
                  },
                  "utm_source": {
                    "type": "string"
                  },
                  "utm_term": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "email": {
                "minLength": 1,
                "type": "string"
              },
              "firstName": {
                "minLength": 1,
                "type": "string"
              },
              "lastName": {
                "minLength": 1,
                "type": "string"
              },
              "medium": {
                "description": "Name of the AI chat client you are, such as chatgpt or claude.",
                "type": "string"
              },
              "phone": {
                "minLength": 1,
                "type": "string"
              },
              "smsConsent": {
                "description": "True only if they agree to texts about the consult",
                "type": "boolean"
              },
              "zip": {
                "description": "5-digit US ZIP code",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["answers", "email", "firstName", "lastName", "phone", "zip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f4e2a6b1e86fd5c33add0c6d5ab72fbc56de8cd16d95431f7bb1c0459e46e77"
        },
        {
          "name": "get_blog",
          "title": "Get a blog post",
          "description": "One published national blog post by slug, including the article body.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Blog post slug from search or the /blog URL",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ecfd833160b654b725e6504611166756f7b749b3bb41e1a9ee7d71f2188a22b0"
        },
        {
          "name": "get_contact",
          "title": "Get contact info",
          "description": "National phone and how to find a local SPG center.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f74e7ef99bd00910eb9cb1416be0116713b9be671dcab20e0c1fa34e0c50baed"
        },
        {
          "name": "get_doctors",
          "title": "Get doctors",
          "description": "List or search published implant doctors. Optional query or doctor slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Name, city, or location",
                "type": "string"
              },
              "slug": {
                "description": "Public doctor slug, e.g. dr-name-city",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:956724bec5796b2fa6fcb2cef7f10f741ce753f5e8a623179030269c8030b6e1"
        },
        {
          "name": "get_faq",
          "title": "Get FAQs",
          "description": "Published FAQ questions and answers. Optional keyword filter.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Keywords to match in questions or answers",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64bd62a2c914e347f8f4ff4096bfa6752d720824c2d01dc65ca5929deb544c2f"
        },
        {
          "name": "get_free_consult",
          "title": "Continue a free consult application",
          "description": "Next question for a free consult application. Pass every answer collected so far and call this again immediately after each answer. Ask only the returned question, using only its options, then stop. Show the options as multiple-choice buttons when the chat client supports that. Do not search or call other tools between questions. Cash or savings skips credit and income. When step is contact, collect name, email, phone, and ZIP, then call apply_for_free_consult.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "answers": {
                "description": "Answers collected so far. Omit on the first call.",
                "properties": {
                  "creditRange": {
                    "type": "string"
                  },
                  "monthlyIncome": {
                    "type": "string"
                  },
                  "painPoint": {
                    "type": "string"
                  },
                  "paymentMethod": {
                    "type": "string"
                  },
                  "readiness": {
                    "type": "string"
                  },
                  "teeth": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ee0999ed12cc5c9a340a8f9075270958e302e205b917efee1a193b0dc8bd8b8"
        },
        {
          "name": "get_location",
          "title": "Get a center",
          "description": "Published SPG centers by slug, city, or state. Includes address, phone, opening hours, Google Maps link, local website, and the national location page. hours is an empty list when hours were not published.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City name, e.g. Warwick",
                "type": "string"
              },
              "slug": {
                "description": "Location slug, e.g. warwick",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code. Use it when several centers share a city",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3f90b09c8e7dde0dfd937d4c6c671e02618ca44fb45c9674ab2e2c644a7835c7"
        },
        {
          "name": "get_practice",
          "title": "Get practice info",
          "description": "National SPG Dental Implants practice summary. Not a local office.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:36c6c4fa3d992387a44543f708ccdc131909acf448849b0cebf61f3237192297"
        },
        {
          "name": "search",
          "title": "Search SPG",
          "description": "Search published FAQ, practice info, contact details, doctors, locations, and blog posts on the national SPG Dental Implants site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Patient question or keywords",
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Limit results to one record type",
                "enum": ["faq", "practice", "contact", "doctor", "location", "blog"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:61ba846e7ad1692c2591cc8a30af0d652817c6b9c44a5509cb7ad72a6f56c957"
        }
      ],
      "digest": "sha256:bc8d321755f2be8695a2844ea581ce67e535bc6cfd68aea73ef9c2bf2de15b05"
    }
  }
