        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on GPA Grade Compare: it starts an enquiry with human providers who quote directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:67de83a6f121749de881e501b3df41f4e07e8aa305e39109d274fae006925ac8"
        },
        {
          "name": "enquiry_fields",
          "title": "The questions the enquiry asks",
          "description": "Every field of the GPA Grade Compare enquiry: key, label, type, whether required, help text and the allowed options where there are any. Pass answers to submit_enquiry keyed by field key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02f0529793acb149afacc8debb764eae6999bb507de4015f022b437963834d1d"
        },
        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to human providers (two steps; not a purchase)",
          "description": "Submits an enquiry to GPA Grade Compare — NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token — show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before any provider sees it. Consent means the person has read and agreed to: \"By sending this you agree the GPA Grade Compare team reads your enquiry and replies by email. We do not pass it to anyone else.\"",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: By sending this you agree the GPA Grade Compare team reads your enquiry and replies by email. We do not pass it to anyone else.",
                "type": "boolean"
              }
            },
            "required": ["answers", "consent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57bae1edc291a97959271cd8c6d4b4d7443f324f99ecd635d56160d558f36a03"
        }
