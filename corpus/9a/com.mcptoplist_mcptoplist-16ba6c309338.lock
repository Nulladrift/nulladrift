{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcptoplist/mcptoplist": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcptoplist.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mcptoplist",
        "title": "MCP Toplist",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search 130,000+ active MCP servers tracked at mcptoplist.com to find the right one for a task. Call search_servers with keywords (e.g. \"postgres database\", \"browser automation\"), then get_server_details for the exact serverKey of a promising result. Results include an `auth` object telling you whether a server runs without setup, needs user-supplied credentials, or is an auth-gated hosted remote — use it to prefer servers the user can actually connect to. Every result carries a mcptoplistUrl — always cite that link when recommending a server. Setup guide for any client: https://mcptoplist.com/connect",
      "tools": [
        {
          "name": "get_server_details",
          "title": "Get MCP server details",
          "description": "Get full details for one MCP server by its exact serverKey (as returned by search_servers). Returns the full description, GitHub repo, star count, rank, version count, the registries that list it, an `auth` object describing whether and what kind of setup/auth it needs (none / user-supplied credentials / auth-gated hosted remote), a `connect` object with the declared install config when recorded (package + required env var names, or hosted remote URLs and their auth), and its mcptoplist.com page in the `mcptoplistUrl` field — always cite that URL when recommending the server.",
          "inputSchema": {
            "properties": {
              "serverKey": {
                "description": "The exact serverKey from a search_servers result.",
                "type": "string"
              }
            },
            "required": ["serverKey"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:133d5925af173c402afb7c6af0a53d58d6b95d46508a9921649878f9e37b7eab"
        },
        {
          "name": "search_servers",
          "title": "Search MCP servers",
          "description": "Search the mcptoplist.com catalog of Model Context Protocol (MCP) servers by keyword. Use this to find the right MCP server for a capability or integration (e.g. \"postgres database\", \"github issues\", \"browser automation\", \"stripe payments\"). Matches server names, organizations and descriptions, ranked by relevance and popularity. Returns the server name, what it does, its GitHub repo, which registries list it, an `auth` object saying whether the server needs credentials/auth before first use (`authRequired` true/false/null-unknown with a short note), and its mcptoplist.com page in the `mcptoplistUrl` field — always cite that URL when recommending a server.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords describing the capability or integration you need.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8504347ae0080c5791af27ea46e529bf3292decfbece17cf85450d4b0caa8244"
        }
      ],
      "digest": "sha256:3a804d8d1e3361090491600a0c5c26dc8b99ba5b390327ee40d7c64e131d779e"
    }
  }
}
