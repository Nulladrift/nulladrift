  "lockfileVersion": 2,
  "subjects": {
    "com.inburgeringtest/inburgering-practice": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://inburgeringtest.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.inburgeringtest/inburgering-practice",
        "title": "InburgeringTest — Dutch Inburgeringsexamen Practice & Grader",
        "version": "1.0.0",
        "websiteUrl": "https://inburgeringtest.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use list_inburgering_exam_modules to inspect Dutch Inburgeringsexamen A2/B1 & KNM modules and fetch free sample practice questions without answer keys, then call evaluate_inburgering_answers to deterministically grade learner answers with Dutch/English explanations.",
      "tools": [
        {
          "name": "evaluate_inburgering_answers",
          "title": "Grade Dutch Inburgeringsexamen free-preview MCQ answers",
          "description": "Deterministically grade multiple-choice answers against a free-preview Dutch Inburgeringsexamen set (KNM, Lezen A2, Luisteren A2, or A2 vs B1 Diagnostic). Returns overall and answered accuracy, pass/fail status, A2/B1 track recommendation (for diagnostic), per-theme breakdown, weak themes, and Dutch/English explanations for submitted answers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "enum": ["a", "b", "c", "d"],
                  "type": "string"
                },
                "description": "Map of questionId to selected option letter (\"a\", \"b\", \"c\", or \"d\"), e.g. {\"knm-werk-1\": \"a\"}.",
                "maxProperties": 20,
                "minProperties": 1,
                "type": "object"
              },
              "examSetId": {
                "description": "Free-preview exam set ID to grade (knm-free-1, lezen-a2-free-1, luisteren-a2-free-1, diagnostic-a2-b1).",
                "enum": ["knm-free-1", "lezen-a2-free-1", "luisteren-a2-free-1", "diagnostic-a2-b1"],
                "type": "string"
              }
            },
            "required": ["answers", "examSetId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0f225918fcd230bfa434175b65dc9197a4845e4d1f28bbe737aeeeb82f84cf3"
        },
        {
          "name": "list_inburgering_exam_modules",
          "title": "List Dutch Inburgeringsexamen modules and free practice questions",
          "description": "Return Dutch Inburgeringsexamen (A2, B1 / NT2 Programma I) module specifications, the 8 official KNM syllabus themes, free-preview exam set metadata, and optional free sample practice questions (without answer keys) ready for learner practice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "includeSampleQuestions": {
                "description": "Include free-preview practice questions without answer keys (default: true).",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum number of free-preview sample questions to return (1 to 8, default: 4).",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "section": {
                "description": "Filter by exam module ('all', 'knm', 'lezen', 'luisteren', 'schrijven', 'spreken', or 'diagnostic'). Defaults to 'all'.",
                "enum": ["all", "knm", "lezen", "luisteren", "schrijven", "spreken", "diagnostic"],
                "type": "string"
              },
              "theme": {
                "description": "Optional KNM syllabus theme slug to filter sample KNM questions.",
                "enum": ["werk-en-inkomen", "omgangsvormen-waarden-normen", "wonen", "gezondheid-en-gezondheidszorg", "geschiedenis-en-geografie", "instanties", "staatsinrichting-en-rechtsstaat", "onderwijs-en-opvoeding"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0bc0455a45c2ab534ca7685052a490eb7a3c65388e22849d8ddc3f3bb163377c"
        }
      ],
      "digest": "sha256:ccd8639b37a92268457bf83d4312a19a82600b9f6f853ba7669995c2691b604e"
    }
  }
}
