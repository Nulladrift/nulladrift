{
  "lockfileVersion": 2,
  "subjects": {
    "ai.odei/connect": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.odei.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "odei-connect-gateway",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Pair first with a fresh app.odei.ai/profile pairing code by calling odei_connect_handshake. Without a verified session only handshake is available.",
      "tools": [
        {
          "name": "odei_connect_handshake",
          "description": "Verify an app.odei.ai pairing code and open an ODEI Connect session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Optional local AI operator name.",
                "type": "string"
              },
              "pairing_code": {
                "description": "Fresh ODEI pairing code from app.odei.ai/profile.",
                "type": "string"
              }
            },
            "required": ["pairing_code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7cb7e46cac54ef586a7d4fedfab64362ce377da9a3d572b47a6d3b9b69119922"
        },
        {
          "name": "odei_connect_plan",
          "description": "Return the ordered local ODEI install plan and reporting contract.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "os": {
                "enum": ["macos", "linux", "windows"],
                "type": "string"
              },
              "session_token": {
                "type": "string"
              }
            },
            "required": ["session_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4128b5c8d365af999e8b11a7c258221198c2a0c4357de3399cd069eb1d754920"
        },
        {
          "name": "odei_connect_report_step",
          "description": "Record evidence that a Connect ceremony step has completed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "evidence": {
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "os": {
                "enum": ["macos", "linux", "windows"],
                "type": "string"
              },
              "session_token": {
                "type": "string"
              },
              "step": {
                "enum": ["workspace_created", "mcp_attached", "graph_bootstrap_completed", "first_sync_completed", "verification_completed"],
                "type": "string"
              }
            },
            "required": ["evidence", "session_token", "step"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b801f35dff0bfc86d7df5949bbe7ffb9b88fae522643a3bccbe629cc52a0d1b4"
        },
        {
          "name": "odei_connect_status",
          "description": "Return current ODEI Connect ceremony progress.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "os": {
                "enum": ["macos", "linux", "windows"],
                "type": "string"
              },
              "session_token": {
                "type": "string"
              }
            },
            "required": ["session_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c94499a5e3b0a8297860e2dacbd0a4e1bcff0aa41d3ce74aaa49ad86192c4ebb"
        },
        {
          "name": "odei_connect_talk",
          "description": "Answer from ODEI Connect session state without invoking a model API.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "os": {
                "enum": ["macos", "linux", "windows"],
                "type": "string"
              },
              "session_token": {
                "type": "string"
              }
            },
            "required": ["session_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5b4d9710cf769101396ff6d466ab9a6a3ed43faba71a85c5ce6ba4f0613901e"
        },
        {
          "name": "wm_recall",
          "description": "Read facts back from your ODEI-hosted operator memory. Simple substring + recency match (v1) — no semantic search yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max facts to return (default 10, cap 50).",
                "type": "number"
              },
              "query": {
                "description": "Optional substring filter over fact text and kind.",
                "type": "string"
              },
              "session_token": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b53d6a1326cd1793a90b251874f641e7d45368a0d881abe0830afa8b669fe4a3"
        },
        {
          "name": "wm_remember",
          "description": "Write one fact to your operator memory in ODEI — the World Model grows from it. Server-side (ODEI-hosted) memory for the paired operator; not the local world-model capsule.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fact": {
                "description": "The fact to remember (max 2000 chars).",
                "type": "string"
              },
              "kind": {
                "description": "Optional kind tag, e.g. preference, project, person. Defaults to note.",
                "type": "string"
              },
              "session_token": {
                "type": "string"
              }
            },
            "required": ["fact"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a5717f610e1a68ea950caacc4494d1d0694e288ee0a2ba263b1ddfb60eaf18b3"
        }
      ],
      "digest": "sha256:23cc6ce2f711cb009cd86d0bf719c091156939c8f51058a9f856e87c9a61cd58"
    }
  }
}
