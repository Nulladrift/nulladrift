        {
          "name": "obter_livro",
          "title": "Ficha completa de um livro",
          "description": "Ficha completa de um livro da Blucher por ISBN (impresso, digital ou de qualquer edição) ou id: autores, edição e se é a vigente, preço em reais, disponibilidade, sinopse, sumário, capítulos, acesso aberto e link de compra. Use para confirmar preço, qual é a edição atual ou se um livro ainda é vendido. Se o ISBN for de uma edição antiga, a ficha diz vigente=false e aponta a atual em edicao.substituido_por. `url` é o link da página do livro; na edição antiga, edicao.substituido_por.url é o da atual.\n\nFull record of a Blucher book by ISBN (print, digital or any edition) or id: authors, edition and whether it is current, price in BRL, availability, synopsis, table of contents, chapters, open access and purchase link. If the ISBN belongs to an old edition, edicao.substituido_por points to the current one. `url` is the link to the book's page; for an old edition, edicao.substituido_por.url is the current one's.",
          "inputSchema": {
            "properties": {
              "id": {
                "anyOf": [
                  {
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
