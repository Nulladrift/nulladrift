                    "description": "Relevância combinada (0–1), na ordem da lista. Na busca por tema, título ou autor, 1,0 é o título igual à consulta e os outros ficam abaixo de 1: o melhor sinal entre semântico e lexical, com o lexical que muitos livros dividem (a palavra no texto de todos, o título que a contém, o nome do autor) graduado pelo semântico e o desempate pelo título dentro do score. Quando a consulta é o nome de uma categoria, metade semântica e metade o quanto o livro é dela; ali o 1,0 marca o título igual e também os livros do autor que dá nome à categoria (em \"bion\", os livros de W. R. Bion), sem que a consulta seja o título deles. Sem a busca semântica (com `aviso`), o melhor sinal lexical, e o 1,0 vai para todo casamento lexical inteiro (o título que contém a consulta, o autor). A ordem da lista já é a recomendação (o que se compra vem antes do fora de catálogo num quase-empate); a edição mais recente que entrou no lugar de uma antiga leva o maior entre o próprio score e o valor com que a antiga foi posta ali, nunca abaixo de 0. / Combined relevance, 0–1; in a topic, title or author search 1.0 is the title equal to the query (when the query names a category, also the books by the author the category is named after); the list order is the recommendation.",
