        {
          "name": "recomendar_para_ementa",
          "title": "Bibliografia Blucher para uma ementa",
          "description": "Dada a ementa (programa) de uma disciplina, aponta quais livros e capítulos da Blucher cobrem cada tópico, quais livros formam o núcleo da bibliografia e quais tópicos ficaram sem cobertura. Use quando um professor, coordenador ou aluno colar uma ementa ou lista de tópicos e quiser bibliografia. Aceita texto livre, lista ou tópicos numerados. A ementa não precisa de nome, e-mail ou telefone do professor. Cada livro traz `url`, o link da página dele.\n\nGiven a course syllabus, maps each topic to Blucher books and chapters, lists the core books and the topics with no coverage. Use it when a teacher or student pastes a syllabus or topic list and wants a reading list. No personal data is needed. Each book carries `url`, the link to its page.",
          "inputSchema": {
            "properties": {
              "ementa": {
                "description": "Texto da ementa: livre, em lista ou numerado (20–8.000 caracteres). / Syllabus text.",
