      "instructions": "Catálogo da Editora Blucher (editora brasileira de livros técnicos, científicos e\nacadêmicos: engenharias, psicanálise, ciências, matemática, design, humanas). Dados públicos,\nos mesmos da página de cada livro em www.blucher.com.br, atualizados todo dia.\n\nComo usar:\n- Para descobrir livros por tema, título ou autor: buscar_livros (tolera erro de digitação).\n- Para preço, edição atual, se ainda é vendido, sumário e link de compra: obter_livro com o ISBN.\n- Para montar bibliografia a partir da ementa de uma disciplina: recomendar_para_ementa.\n- Para saber que áreas e coleções existem antes de filtrar: catalogo_facetas.\nPreços em reais (BRL). `disponibilidade` diz se dá para comprar no site hoje; eBooks vendem\nnas lojas digitais (`digital_em_plataformas`), menos os de acesso aberto (`acesso_aberto`):\nesses são gratuitos — não diga que estão à venda; passe o link `acesso_aberto.url`. Qualquer\nlivro com `acesso_aberto.sim` tem o texto integral gratuito nesse link, mesmo o impresso.\nLivro fora de catálogo (`fora_de_catalogo`) não se compra mais no site, mas aparece: diga que\nestá fora de catálogo. Quando `edicao.substituido_por` vier preenchido, há uma edição mais recente\nda obra — avise a pessoa e cite-a pelo ISBN de `edicao.substituido_por` (não pela posição na\nlista), como a página do livro faz (\"Há uma edição mais recente desta obra\"). A ordem da lista já é\na recomendação. Cite cada livro pelo título com o link da página dele (`url`, quando houver); na\nedição antiga, também o link da mais recente (`edicao.substituido_por.url`).\n\nBook catalog of Editora Blucher (Brazilian technical, scientific and academic publisher).\nPublic data, refreshed daily. Use buscar_livros to discover books, obter_livro for price,\ncurrent edition, availability and purchase link, recomendar_para_ementa to map a course\nsyllabus to books and chapters, catalogo_facetas to list areas and series. Prices in BRL.\nOpen-access books (`acesso_aberto`) are free: point to `acesso_aberto.url`, never say they are on sale.\nOut-of-catalog books (`fora_de_catalogo`) are no longer sold; when `edicao.substituido_por` is set,\ntell the user there is a newer edition and cite it. Cite each book by title with its page link (`url`,\nwhen present); for an old edition, also link the newer one (`edicao.substituido_por.url`).\n",
      "tools": [
        {
          "name": "buscar_livros",
          "title": "Buscar livros da Blucher",
          "description": "Busca livros da Editora Blucher por tema, título, autor ou pergunta em linguagem natural; filtra por área, formato, idioma e disponibilidade. Use sempre que a pessoa quiser saber se a Blucher tem livro sobre um assunto, procurar um título ou autor (tolera erro de digitação) ou montar uma lista de leitura. Por padrão devolve a edição vigente do que está à venda e também os livros fora de catálogo, marcados; de uma obra com edição mais recente, vem a mais recente (e a antiga, com edicao.substituido_por, quando a busca casou com o título dela); um ISBN como consulta devolve o livro desse ISBN (mesmo antigo ou fora de catálogo). Cada livro traz `url`, o link da página dele em www.blucher.com.br; a ficha completa (preço detalhado, sumário, edições) vem de obter_livro, pelo ISBN.\n\nSearch the catalog of Editora Blucher (Brazilian technical, scientific and academic publisher) by topic, title, author or natural-language question; filter by area, format, language and availability. Use it whenever the user asks whether Blucher has a book on a subject, looks for a title or author (typos tolerated) or builds a reading list. By default returns the current edition of books on sale plus out-of-catalog books, flagged; for a work with a newer edition you get the newer one (and the old one, with edicao.substituido_por, when the query matched its title); an ISBN as the query returns that book. Each book carries `url`, the link to its page on www.blucher.com.br; the full record comes from obter_livro, by ISBN.",
          "inputSchema": {
            "properties": {
              "apenas_disponiveis": {
                "default": true,
                "description": "true (padrão): o que se compra hoje (impresso à venda ou eBook nas lojas) ou se baixa de graça (eBook de acesso aberto), mais os fora de catálogo enquanto incluir_fora_de_catalogo=true. false inclui também esgotados e pré-lançamentos. / On sale or free (open access), plus out-of-catalog books while incluir_fora_de_catalogo=true.",
                "title": "Apenas Disponiveis",
                "type": "boolean"
              },
              "area": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Nome ou prefixo de área (veja catalogo_facetas), ex.: 'Engenharias'. / Area name or prefix.",
                "title": "Area"
              },
              "consulta": {
                "description": "Tema, título, autor, pergunta ou ISBN, em qualquer idioma. / Topic, title, author, question or ISBN.",
                "maxLength": 500,
                "minLength": 2,
                "title": "Consulta",
                "type": "string"
              },
              "formato": {
                "anyOf": [
                  {
                    "enum": ["impresso", "digital", "audiobook"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "impresso | digital | audiobook. / Format.",
                "title": "Formato"
              },
              "idioma": {
                "anyOf": [
                  {
                    "maxLength": 16,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Sigla do idioma (BCP 47): pt-br, en, es; 'pt' casa qualquer português. / Language tag (BCP 47); 'pt' matches any Portuguese.",
                "title": "Idioma"
              },
              "incluir_edicoes_anteriores": {
                "default": false,
                "description": "false (padrão): a edição vigente de cada obra (a antiga fora de catálogo só aparece quando a busca casou com o título dela, ao lado da mais recente). / Include previous editions.",
                "title": "Incluir Edicoes Anteriores",
                "type": "boolean"
              },
              "incluir_fora_de_catalogo": {
                "default": true,
                "description": "true (padrão): também os livros fora de catálogo (disponibilidade=fora_de_catalogo), com a edição mais recente da obra quando houver, como a página do livro. false: tira os que só entraram por esta opção (com apenas_disponiveis=true, fica só o que se compra hoje). / Also out-of-catalog books, with the newer edition when there is one.",
                "title": "Incluir Fora De Catalogo",
                "type": "boolean"
              },
