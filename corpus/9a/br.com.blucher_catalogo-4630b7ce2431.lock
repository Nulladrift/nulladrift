                "description": "graduacao | pos | profissional (ainda sem efeito: o nível dos livros está sendo cadastrado). / Level (no effect yet).",
                "title": "Nivel"
              }
            },
            "required": ["ementa"],
            "title": "recomendar_para_ementaArguments",
            "type": "object"
          },
