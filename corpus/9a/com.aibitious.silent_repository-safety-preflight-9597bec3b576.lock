{
  "lockfileVersion": 2,
  "subjects": {
    "com.aibitious.silent/repository-safety-preflight": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://silent.aibitious.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2025-03-26", "2025-06-18", "2025-11-25", "2026-07-28"]
      },
      "serverInfo": {
        "name": "silent-door",
        "version": "0.5.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Filename-only handoff planning; never content-security verification.",
      "tools": [
        {
          "name": "diagnose_a2a_request",
          "description": "Diagnose common A2A JSON-RPC SendMessage version and message-shape mistakes. Use when debugging an A2A integration. Send a sanitized request example and selected protocol version, never secrets or headers. Returns fixed field corrections and an authored template. Does not contact an endpoint or certify full conformance.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "protocolVersion": "0.3",
                "request": {
                  "id": 1,
                  "jsonrpc": "2.0",
                  "method": "message/send",
                  "params": {
                    "message": {
                      "messageId": "example-1",
                      "parts": [
                        {
                          "data": {
                            "entries": [
                              {
                                "kind": "file",
                                "path": "src/app.py"
                              }
                            ]
                          },
                          "kind": "data"
                        }
                      ],
                      "role": "user"
                    }
                  }
                }
              },
              {
                "protocolVersion": "1.0",
                "request": {
                  "id": 1,
                  "jsonrpc": "2.0",
                  "method": "SendMessage",
                  "params": {
                    "message": {
                      "messageId": "example-1",
                      "parts": [
                        {
                          "data": {
                            "entries": [
                              {
                                "kind": "file",
                                "path": "src/app.py"
                              }
                            ]
                          }
                        }
                      ],
                      "role": "ROLE_USER"
                    }
                  }
                }
              }
            ],
            "properties": {
              "protocolVersion": {
                "description": "Target A2A version from the server's Agent Card, NOT the MCP transport date.",
                "enum": ["0.3", "1.0"]
              },
              "request": {
                "description": "Sanitized A2A JSON-RPC body to inspect, not a URL, string or HTTP wrapper. Malformed message fields are allowed for diagnosis. Never include secrets, headers or private content. Entire arguments JSON: at most 16384 ASCII-escaped UTF-8 bytes.",
                "type": "object"
              }
            },
            "required": ["protocolVersion", "request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:704fcccf65fa7e5d37e846debcc18c99e255b4349e3334ae2cf35ab07d434b25"
        },
        {
          "name": "prepare_repository_handoff",
          "description": "When preparing a user-authorized repository file handoff to another agent or reviewer, call with arguments such as {\"entries\":[{\"path\":\"src/app.py\",\"kind\":\"file\"}]}. Send permitted relative filenames and kinds only; never file contents, secrets or URLs. Returns exact zero-based include/exclude/skip indexes and reasons for the original entries. This is filename-only planning, not a content security scan or permission to upload.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entries": {
                "description": "Required: actual user-authorized paths collected from the local repository before calling. The remote server cannot enumerate local files. Do not copy example filenames or send an empty object.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "enum": ["file", "directory", "symlink"],
                      "type": "string"
                    },
                    "path": {
                      "maxLength": 512,
                      "type": "string"
                    }
                  },
                  "required": ["kind", "path"],
                  "type": "object"
                },
                "maxItems": 1024,
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contentSecurityVerified": {
                "const": false
              },
              "entriesReceived": {
                "type": "integer"
              },
              "entryDecisions": {
                "items": {
                  "properties": {
                    "decision": {
                      "enum": ["ALLOW", "DENY", "SKIP"]
                    },
                    "index": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "reason": {
                      "type": "string"
                    }
                  },
                  "required": ["decision", "index", "reason"],
                  "type": "object"
                },
                "type": "array"
              },
              "excludeIndexes": {
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "includeIndexes": {
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "manifestDigest": {
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "schema": {
                "type": "string"
              },
              "skipIndexes": {
                "items": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["contentSecurityVerified", "entriesReceived", "entryDecisions", "excludeIndexes", "includeIndexes", "manifestDigest", "schema", "skipIndexes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef72edc2ec422b4521d2c17d6ae57711dffa68507766ad4127b1a7218a1f8a38"
        },
        {
          "name": "repository_safety_preflight",
          "description": "Zero-effect repository path-metadata preflight. Never send contents, archives, URLs, callbacks, or secrets.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entries": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "enum": ["file", "directory", "symlink"],
                      "type": "string"
                    },
                    "path": {
                      "maxLength": 512,
                      "type": "string"
                    }
                  },
                  "required": ["kind", "path"],
                  "type": "object"
                },
                "maxItems": 1024,
                "type": "array"
              }
            },
            "required": ["entries"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:354a253597a8756dbde6647d05a5c4539acaf2d8b2138500721cb8da3088d9ad"
        }
      ],
      "digest": "sha256:44802985df88c19cde57502a13a03a41c58d4508ac41b89cf702f860712af9fb"
    }
  }
}
