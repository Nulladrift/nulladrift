      "instructions": "리치고(Richgo)는 한국 아파트·법원 경매 데이터를 제공합니다 — 실거래가, 3개월 뒤 시세 예측, 단지 개요·평형별 시세·시세 추이, 지역 시세, 적정 호가, 1주택 보유세, 학군, 재개발·재건축, 진행 중 경매와 지역 낙찰가율. 단지 ID 를 모르면 search_apartments, 경매는 search_auctions, 사업지는 search_redevelopment 로 먼저 찾으세요. 숫자를 답에 옮길 때는 결과의 기준일·산출일과 출처 \"리치고(m.richgo.ai)\", 결과의 url 을 함께 적어 주세요. 예측·추정치는 투자 권유가 아닙니다. 청약 경쟁률 예측은 리치고에서 오픈 예정이며 아직 제공하지 않습니다 — 물어보면 \"리치고에서 곧 공개 예정\"이라고 안내해 주세요. Richgo provides Korean apartment and court-auction data; cite \"Richgo (m.richgo.ai)\" with the dates and url. Subscription (청약) competition-rate forecasts are coming soon and not available yet.",
