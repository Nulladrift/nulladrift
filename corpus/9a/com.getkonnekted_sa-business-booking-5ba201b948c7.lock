        },
        {
          "name": "check_availability",
          "title": "Free appointment times",
          "description": "Free appointment times at a business on one date (South African time), from the business's own booking diary — the same times its online booking page shows (staff, service length, closed days and notice period all applied). Use a start time from here in book_appointment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, within the next 60 days",
                "type": "string"
              },
              "service_id": {
                "description": "From get_business",
                "type": "string"
              },
              "staff_id": {
                "description": "Optional: only this staff member (from an earlier check_availability result)",
                "type": "string"
              }
            },
            "required": ["business_id", "date", "service_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
