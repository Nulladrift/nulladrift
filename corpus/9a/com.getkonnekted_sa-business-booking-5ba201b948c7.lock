      },
      "instructions": "GetKonnektED Find & book — find a South African business and book it, for the person you are helping (free, no sign-in).\nOnly businesses that CHOSE to be found through AI assistants are listed (salons and barbers, trades and repairs, property agencies, law firms and others on GetKonnektED) — it is not a full directory of South Africa; if nothing matches, say so and suggest a nearby bigger town or the province.\nFlow: find_businesses (what + town/suburb/province) → get_business (services, prices if shown, hours) → check_availability (free times from the business's own diary) → book_appointment; or request_quote (trades/services), or list_properties → request_viewing (property agencies).\nALWAYS confirm with the person before any booking or request: every write tool is two-step — the first call only returns a preview and a confirm_token; show the preview, ask the person, and only after they agree call again with the confirm_token and consent=true. Never invent details; use only what the person told you, and share their name, phone and email only with the one business they chose.\nThe business confirms every booking and request itself (law firms first check for conflicts of interest — no confidential details). If the business asks for a deposit, give the person the payment link that is returned. Results marked \"GetKonnektED showcase business\" are our own demonstration businesses. Times are South African time (SAST, UTC+2).",
      "tools": [
        {
          "name": "book_appointment",
          "title": "Book an appointment",
          "description": "Book an appointment at a listed business for the person you are helping, exactly as the business's own online booking would: the booking arrives in the business's diary as a pending booking and the business confirms it; if the business asks for a deposit, you get the business's payment link to give the person instead. For law firms this is a consultation REQUEST — the firm checks for conflicts of interest first (give reason and other_parties; no confidential details). Only with the person's consent. TWO STEPS: call first WITHOUT confirm_token — nothing is sent, you get a preview of exactly what goes to whom plus a confirm_token. Show the preview to the person and ask if they agree. Only after they say yes, call again with the same details, confirm_token and consent=true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assistant_name": {
                "description": "Name of the AI assistant making the request (optional)",
                "type": "string"
              },
              "business_id": {
                "type": "string"
              },
              "confirm_token": {
                "description": "Second step only: the confirm_token from the preview (single use, 10 minutes). Leave out on the first call.",
                "type": "string"
              },
              "consent": {
                "description": "Second step only: true ONLY if the person saw the preview and agreed that these details may be sent to this business.",
                "type": "boolean"
              },
              "email": {
                "description": "Email address (optional, but needed for the confirmation email)",
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "type": "string"
              },
              "notes": {
                "description": "Optional short note for the business",
                "type": "string"
              },
              "other_parties": {
                "description": "Law firms only: names of other people or companies involved (for the conflict check)",
                "type": "string"
              },
              "phone": {
                "description": "Mobile number, e.g. 082 123 4567",
                "type": "string"
              },
              "reason": {
                "description": "Law firms only: one or two sentences on what it is about (no confidential details)",
                "type": "string"
              },
              "service_id": {
                "type": "string"
              },
              "staff_id": {
                "description": "The staff_id that goes with that start time (from check_availability)",
                "type": "string"
              },
              "start": {
                "description": "A start time from check_availability (ISO 8601)",
                "type": "string"
              }
            },
            "required": ["business_id", "name", "phone", "service_id", "start"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book an appointment"
          },
