        {
          "name": "request_quote",
          "title": "Ask for a quote",
          "description": "Send a quote request to a listed business (trades, repairs, installations, services) for the person you are helping. It lands in the business's own client inbox (CRM) and the business is emailed; the business replies with a quote or a visit time. Only with the person's consent; a suburb is enough for the location. TWO STEPS: call first WITHOUT confirm_token — nothing is sent, you get a preview of exactly what goes to whom plus a confirm_token. Show the preview to the person and ask if they agree. Only after they say yes, call again with the same details, confirm_token and consent=true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "assistant_name": {
                "description": "Name of the AI assistant making the request (optional)",
                "type": "string"
              },
              "business_id": {
                "type": "string"
              },
              "confirm_token": {
                "description": "Second step only: the confirm_token from the preview (single use, 10 minutes). Leave out on the first call.",
                "type": "string"
              },
              "consent": {
                "description": "Second step only: true ONLY if the person saw the preview and agreed that these details may be sent to this business.",
                "type": "boolean"
              },
              "description": {
                "description": "What needs doing, in the person's words (10–1500 characters)",
                "type": "string"
              },
              "email": {
                "description": "Email address (optional, but needed for the confirmation email)",
                "type": "string"
              },
              "location": {
                "description": "Suburb and town where the work is (no street address needed)",
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "type": "string"
              },
              "phone": {
                "description": "Mobile number, e.g. 082 123 4567",
                "type": "string"
              },
              "preferred_dates": {
                "description": "Optional: when suits the person",
                "type": "string"
              }
            },
            "required": ["business_id", "description", "location", "name", "phone"],
            "type": "object"
          },
