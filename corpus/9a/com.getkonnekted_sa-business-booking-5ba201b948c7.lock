        {
          "name": "find_businesses",
          "title": "Find a South African business",
          "description": "Find South African businesses (salons, barbers, trades, property agencies, law firms and more) that chose to be found and booked through AI assistants on GetKonnektED. Give what the person needs and/or a town, suburb or province. Returns at most 10 businesses with a business_id for the other tools, the town and the distance from the person's town where known. Only opted-in businesses are listed — this is not a full directory of South Africa.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional type of business",
                "enum": ["beauty", "wellness", "trades", "property", "legal", "automotive", "professional", "events", "retail", "other"],
                "type": "string"
              },
              "province": {
                "description": "Province, e.g. \"Gauteng\"",
                "type": "string"
              },
              "town": {
                "description": "Town, city or suburb, e.g. \"Benoni\", \"Sandton\", \"Gqeberha\"",
                "type": "string"
              },
              "what": {
                "description": "What the person needs, e.g. \"fade haircut\", \"plumber for a burst geyser\", \"2-bedroom flat to rent\", \"divorce lawyer\"",
                "type": "string"
              }
            },
            "type": "object"
          },
