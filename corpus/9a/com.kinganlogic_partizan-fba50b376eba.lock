      "serverInfo": {
        "name": "com.kinganlogic/partizan",
        "title": "Partizan",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Look up published prices here. Private owner records require the separate authenticated account endpoint.",
      "tools": [
        {
          "name": "get_machine_price",
          "title": "Look up a machine price",
          "description": "Read the published Base USDC ceiling for one owner operation. Example: position-refresh returns 350000 atomic units. This lookup is free.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "operation": "position-refresh"
              }
            ],
            "properties": {
              "operation": {
                "description": "Published Partizan owner operation to price.",
                "enum": ["specialist-challenge", "position-refresh", "destination-packet", "bulk-reconciliation"],
                "type": "string"
              }
            },
            "required": ["operation"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "asset": "USDC",
                "maximum_atomic": "350000",
                "network": "eip155:8453",
                "operation": "position-refresh",
                "scheme": "upto"
              }
            ],
            "properties": {
              "asset": {
                "const": "USDC"
              },
              "max_objects": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maximum_atomic": {
                "description": "Amount in millionths of a USDC.",
                "pattern": "^[0-9]+$",
                "type": "string"
              },
              "network": {
                "const": "eip155:8453"
              },
              "operation": {
                "description": "Published Partizan owner operation to price.",
                "enum": ["specialist-challenge", "position-refresh", "destination-packet", "bulk-reconciliation"],
                "type": "string"
              },
              "per_object_atomic": {
                "description": "Amount in millionths of a USDC.",
                "pattern": "^[0-9]+$",
                "type": "string"
              },
              "scheme": {
                "const": "upto"
              }
            },
            "required": ["asset", "maximum_atomic", "network", "operation", "scheme"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
