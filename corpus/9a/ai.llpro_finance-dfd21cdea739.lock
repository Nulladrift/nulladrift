        {
          "name": "chemical_trade_credit_payment_days",
          "title": "Build a days-to-pay and dispute-rate table from your own invoices",
          "description": "Build a days-to-pay and dispute-rate table from YOUR OWN trade-credit invoices, by customer type and by freight-surcharge line (made for small chemical makers and distributors; works for any seller). Send up to 400 invoice rows: customer_type and surcharge_line (your own short labels, e.g. 'distributor', 'fuel'), invoice_date, paid_date (leave out if still open), optional terms_days, disputed true/false. Get back, per customer type, per surcharge line and per pair: invoices, paid, open, median and 90th-percentile days to pay, mean, how many paid or are now past their terms, and the dispute rate with a 95% range, plus the sources (your rows, with the label and as-of date you gave), the rule used, and a signed record. Free. Arithmetic only: no model, no outside lookup, nothing stored. Do NOT send customer names, invoice numbers or amounts: those fields are refused, and keep names out of the labels too (labels are your responsibility). There is NO pooled industry benchmark yet (nothing is stored, so nothing is pooled). It does not give credit, legal, tax or collections advice and cannot say why an invoice was paid late or disputed.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Date the rows were taken (YYYY-MM-DD). Open invoices are aged to this date. Default today (UTC).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "invoices": {
                "items": {
                  "properties": {
                    "customer_type": {
                      "description": "Your own label for the kind of customer (distributor, end-user, reseller...). Not a customer name.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "disputed": {
                      "description": "True if the customer disputed the invoice or a line on it. Default false.",
                      "type": "boolean"
                    },
                    "invoice_date": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "paid_date": {
                      "description": "Leave out when the invoice is still open.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "surcharge_line": {
                      "description": "Your own label for the freight-surcharge line on the invoice (none, fuel, hazmat, demurrage...).",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "terms_days": {
                      "description": "Payment terms in days (30 for net 30). Falls back to the top-level terms_days.",
                      "maximum": 365,
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["customer_type", "invoice_date", "surcharge_line"],
                  "type": "object"
                },
                "maxItems": 400,
                "type": "array"
              },
              "label": {
                "description": "Optional name of this set of rows (e.g. 'Q3 invoices'), echoed back as a source.",
                "maxLength": 80,
                "type": "string"
              },
              "terms_days": {
                "description": "Default payment terms for rows that have none.",
                "maximum": 365,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["invoices"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a days-to-pay and dispute-rate table from your own invoices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:404e0b112e1ab15a16c706d4e6fdf5cb9dc705bba6f162bd070be6545c24eb95"
        },
        {
          "name": "invoice_make",
          "title": "Make a PDF invoice from invoice fields, with a signed receipt of its hash",
          "description": "Make a clean PDF invoice from invoice fields, and get back a signed, dated receipt of the PDF's hash, so either side can later show which invoice was made and when. Send: number, issue_date (YYYY-MM-DD), optional due_date, currency (USD, EUR, GBP ... 43 supported), seller {name, address, tax_id, contact}, buyer {name, address, ...}, items [{description, quantity, unit_price}] (up to 40), optional tax_lines [{label, rate_percent OR amount}], notes, payment_terms. Every number, rate and tax line is yours: we only add them up (half-up rounding to the currency's smallest unit); no tax advice, no tax rules, no checking of tax ids. Moves no money and makes no payment link: web addresses and links (dotted names, IP addresses, schemes such as http: or pay:) are refused in every text field. Free, no sign-up, 100 invoices a day per caller. Stores nothing: the signed receipt holds the number, dates, totals and hashes, never names or addresses. Text must use Western European letters (the Windows-1252 set; accented Latin letters, euro, pound, yen). Answer: pdf_base64, totals, signed observation, receipt. Docs: https://llpro.ai/invoice-maker",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "buyer": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "description": "Up to 6 lines, 80 characters each."
                  },
                  "contact": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "tax_id": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "currency": {
                "description": "Three-letter code, for example USD, EUR, GBP, JPY.",
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD, on or after the issue date.",
                "type": "string"
              },
              "issue_date": {
                "description": "YYYY-MM-DD (2000 to 2100).",
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "More than 0 and at most 1,000,000, up to 4 decimal places (a number, or text such as \"2.5\")."
                    },
                    "unit_price": {
                      "description": "At most 1,000,000,000 in size, up to 4 decimal places; a line may not exceed 10,000,000,000 and the total 100,000,000,000; may be negative for a credit line (the invoice total may not be negative)."
                    }
                  },
                  "required": ["description", "quantity", "unit_price"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "notes": {
                "maxLength": 500,
                "type": "string"
              },
              "number": {
                "description": "Invoice number: letters, digits, space and . _ / # - (1 to 40).",
                "maxLength": 40,
                "type": "string"
              },
              "payment_terms": {
                "description": "Plain words, for example 'Net 30. Bank transfer, account details sent separately.' No web addresses.",
                "maxLength": 300,
                "type": "string"
              },
              "seller": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "description": "Up to 6 lines (list of strings, or one string with line breaks), 80 characters each."
                  },
                  "contact": {
                    "description": "An email address or phone number. No web addresses.",
                    "maxLength": 80,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "tax_id": {
                    "description": "Printed as given. Not checked.",
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "tax_lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "A fixed tax amount instead of a rate (0 or more)."
                    },
                    "label": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "rate_percent": {
                      "description": "0 to 100, up to 4 decimal places, applied to the subtotal. Your number, not ours."
                    }
                  },
                  "required": ["label"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["buyer", "currency", "issue_date", "items", "number", "seller"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Make a PDF invoice from invoice fields, with a signed receipt of its hash"
