        {
          "name": "capital_call_collection_chasing",
          "title": "Chase capital calls and check payment instructions for a change",
          "description": "Capital call collection chasing for syndicators and small funds. Send the call's due date, optional grace days and chase schedule, and per investor a label, the amount called and the amount received. Get back who is paid, partly paid, due, in grace or overdue, who is due a chase today, the chase dates, and draft wording per stage (nothing is sent). Optionally send the payment instructions printed on the call notice (routing number or IBAN, last 4 of the account, names; never a full account number): you get the routing-number and IBAN check-digit results and a fingerprint; send it back as previous_instruction_fingerprint on the next call to learn whether the instructions changed (the usual sign of payment-redirect fraud). Set check_sources true to also read two public FBI and FinCEN pages and, with sec_cik, the SEC EDGAR record for Form D filings. Free. No model, nothing stored, signed record. Up to 100 investors. Use your own investor labels, not names, emails or account numbers. Not legal, tax or investment advice; your fund documents decide default and remedies. Docs: https://llpro.ai/capital-call-collection-chasing",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Date to evaluate on (default today, UTC).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "call_date": {
                "description": "YYYY-MM-DD the call notice was issued (optional).",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "chase_offsets_days": {
                "description": "Days from the due date on which to chase (negative = before). Default [-5, 0, 3, 7, 14].",
                "items": {
                  "maximum": 120,
                  "minimum": -60,
                  "type": "integer"
                },
                "maxItems": 8,
                "type": "array"
              },
              "check_sources": {
                "description": "Also read the FBI IC3 and FinCEN pages (and EDGAR if sec_cik is sent) and report what they say today.",
                "type": "boolean"
              },
              "currency": {
                "description": "Three capital letters, e.g. USD (shape only, not checked against the ISO list).",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "due_date": {
                "description": "YYYY-MM-DD payment is due.",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                "type": "string"
              },
              "fingerprint_salt": {
                "description": "A random phrase you make up just for this tool (16+ characters, not a password, API key or any existing credential), the same each time, mixed into the fingerprint so nobody else can reproduce it. Not stored.",
                "maxLength": 64,
                "minLength": 16,
                "type": "string"
              },
              "fund_label": {
                "description": "Your own label for the fund or deal (not a person).",
                "maxLength": 80,
                "type": "string"
              },
              "grace_days": {
                "description": "Days after the due date before an unpaid amount counts as overdue. Your own number from your fund documents (default 0).",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "investors": {
                "items": {
                  "properties": {
                    "amount_called": {
                      "description": "At most 2 decimals. As text (\"1250.50\") if you want it exact.",
                      "type": ["number", "string"]
                    },
                    "amount_received": {
                      "description": "Received so far (default 0).",
                      "type": ["number", "string"]
                    },
                    "investor_id": {
                      "description": "Your own label, e.g. LP-07. Not a name, email or account number.",
                      "pattern": "^[A-Za-z0-9_.-]{1,24}$",
                      "type": "string"
                    },
                    "last_reminder_date": {
                      "description": "When you last chased this investor (optional).",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount_called", "investor_id"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "payment_instructions": {
                "description": "The payment instructions printed on the call notice. Never a full account number.",
                "properties": {
                  "aba_routing": {
                    "pattern": "^[0-9]{9}$",
                    "type": "string"
                  },
                  "account_last4": {
                    "pattern": "^[0-9]{4}$",
                    "type": "string"
                  },
                  "bank_name": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "beneficiary_name": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "iban": {
                    "maxLength": 42,
                    "type": "string"
                  },
                  "reference": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "swift_bic": {
                    "maxLength": 11,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "previous_instruction_fingerprint": {
                "description": "instruction_fingerprint from your last check of these instructions.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "sec_cik": {
                "description": "SEC CIK of the fund or issuer; with check_sources, reports whether a Form D is on file.",
                "pattern": "^[0-9]{1,10}$",
                "type": "string"
              }
            },
            "required": ["due_date", "investors"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Chase capital calls and check payment instructions for a change"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5110559dc91e6b6b7c1a8f65ee485631bd9b46e2f2c35fa5be312f1ba851e8b6"
        },
        {
          "name": "card_dispute_outcome_table_win",
          "title": "Build a card dispute outcome table: win rate and days to close by reason code, with sources and a signed record",
          "description": "Card dispute outcome table. Send one row per card dispute case you handled: network (visa, mastercard, amex, discover, other), reason code, outcome (won, lost, withdrawn, open), days to close, and optionally your own merchant label. Get back win rate (won out of decided cases, with a 95 percent interval) and days to close (median, 90th percentile, mean) by network reason code, by reason-code family across networks and by merchant label, the meaning of each Visa, Mastercard and American Express code, a flag for groups with too few cases, and the federal clocks (Regulation E 1005.11, Regulation Z 1026.13) with the date each rule was last amended. Set check_sources true to ask the eCFR whether either rule was amended since. Free. No model, nothing stored, signed record. Up to 500 rows. This version has no pooled data: the table is built from your rows only. Use merchant labels, never card numbers, names or emails. Not legal, banking or compliance advice. Docs: https://llpro.ai/card-dispute-outcome-table-win",
          "inputSchema": {
            "properties": {
              "check_sources": {
                "description": "Also read the eCFR version history of the two rules and report whether either was amended after the date this tool was written.",
                "type": "boolean"
              },
              "min_cases": {
                "description": "A group with fewer decided cases than this is flagged too_few_to_rely_on. Default 20.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "outcomes": {
                "items": {
                  "properties": {
                    "days_to_close": {
                      "description": "Days from the dispute being opened to the decision or withdrawal. Optional for open cases.",
                      "maximum": 730,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "merchant": {
                      "description": "Your own label for the merchant or merchant account. Not a card number, name or email.",
                      "pattern": "^[A-Za-z0-9_.-]{1,24}$",
                      "type": "string"
                    },
                    "network": {
                      "enum": ["visa", "mastercard", "amex", "discover", "other"],
                      "type": "string"
                    },
                    "outcome": {
                      "description": "won = decided in the merchant's favour; lost = decided against; withdrawn = dropped by either side; open = not yet decided.",
                      "enum": ["won", "lost", "withdrawn", "open"],
                      "type": "string"
                    },
                    "reason_code": {
                      "description": "As the network prints it: 10.4, 13.1, 4837, 4853, F29, C08 ... No card numbers.",
                      "maxLength": 12,
                      "type": "string"
                    }
                  },
                  "required": ["network", "outcome", "reason_code"],
                  "type": "object"
                },
                "maxItems": 500,
                "type": "array"
              }
            },
            "required": ["outcomes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Build a card dispute outcome table: win rate and days to close by reason code, with sources and a signed record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9f5bfd12f7359a33888d5893bd703c52a7084995f743066787092a8683bc25c5"
        },
        {
          "name": "card_skimmer_and_pos_tamper_checks",
          "title": "Check card devices for tamper signs and find the PCI questionnaire",
          "description": "Card-skimmer and POS tamper checks for convenience stores, plus which PCI questionnaire (SAQ) your setup points to. Send devices (your own label, kind, last inspection date, and each check marked pass, fail or not_checked), and optionally a payments object with five plain answers about how cards are taken. Get back which devices need attention, which are overdue or incomplete, the suggested SAQ with the reason, the sources with dates and a signed record. Set check_sources true to also ask the PCI Council's public pages which PCI DSS version they name today. Free. No model, nothing stored. Up to 50 devices. Do NOT send card numbers, names or staff details: your own device labels only. It is a checklist and a lookup, not a security audit, a PCI assessment or legal advice; your acquirer decides which form you file. Docs: https://llpro.ai/card-skimmer-and-pos-tamper-checks",
          "inputSchema": {
            "properties": {
              "check_sources": {
                "description": "Also fetch the PCI Council's public pages and report the PCI DSS version they name today.",
                "type": "boolean"
              },
              "devices": {
                "items": {
                  "properties": {
                    "checks": {
                      "additionalProperties": {
                        "enum": ["pass", "fail", "not_checked", "not_applicable"],
                        "type": "string"
                      },
                      "description": "Any of: tamper_seal_intact, serial_matches_device_list, no_overlay_or_loose_parts, no_extra_cable_or_hole, no_foreign_device_nearby, housing_and_mount_secure, pump_panel_lock_intact. Each is pass, fail, not_checked (or not_applicable for pump_panel_lock_intact on non-pumps).",
                      "type": "object"
                    },
                    "device_id": {
                      "description": "Your own label, e.g. lane1-pinpad. Not a serial or terminal id.",
                      "pattern": "^[A-Za-z0-9_.-]{1,24}$",
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["pin_pad", "counter_terminal", "pump_reader", "self_checkout", "atm", "other"],
                      "type": "string"
                    },
                    "last_inspected": {
                      "description": "YYYY-MM-DD of the last hands-on inspection.",
                      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$",
                      "type": "string"
                    }
                  },
                  "required": ["device_id", "kind"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "inspection_interval_days": {
                "description": "How often you inspect (default 7). This is your own interval, not a PCI number.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "payments": {
                "properties": {
                  "how_cards_are_taken": {
                    "enum": ["imprint_or_dialup_terminal", "standalone_ip_terminal", "p2pe_listed_terminal", "pos_software_with_terminal_integrated", "virtual_terminal_browser", "mobile_phone_reader_spoc", "other_or_unsure"],
                    "type": "string"
                  },
                  "payment_system_connected_to_other_systems": {
                    "enum": ["yes", "no", "unsure"],
                    "type": "string"
                  },
                  "stores_card_data_electronically": {
                    "enum": ["yes", "no", "unsure"],
                    "type": "string"
                  },
                  "takes_online_orders": {
                    "enum": ["yes", "no", "unsure"],
                    "type": "string"
                  },
                  "terminals_are_pci_approved_pts": {
                    "enum": ["yes", "no", "unsure"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "store_label": {
                "description": "Optional name for the answer (not an address, not a person).",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["devices"],
            "type": "object"
