        {
          "name": "prepare_factcheck",
          "description": "Step 1 of a bring-your-own-agent fact-check. Fetches one of the\n        authenticated user's documents (ownership enforced) plus the exact\n        disclosure and method your agent MUST follow. Requires a personal\n        Storskarvia API key as a Bearer token.\n\n        After this, call ground_claim(claim) once per checkable claim you\n        extract from `text`, then submit_findings(...) to store results.\n        ",
          "inputSchema": {
            "properties": {
              "document_id": {
                "title": "Document Id",
                "type": "integer"
              }
            },
            "required": ["document_id"],
            "title": "prepare_factcheckArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "prepare_factcheckDictOutput",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce81b7f2018018e891bc3456ba45e5e47c7bc4dbacdb60cd1ce41585420182c1"
        },
        {
          "name": "submit_findings",
          "description": "Step 3 of a bring-your-own-agent fact-check. Stores your agent's\n        findings as a real Storskarvia Check, visible on the same findings punch\n        list as a staff-run check. Requires a personal Storskarvia API key as a\n        Bearer token, and ownership of `document_id` is enforced.\n\n        `disclosure` must be REQUIRED_DISCLOSURE copied verbatim -- proof the\n        user was shown it before findings were presented -- or this raises a\n        ToolError instead of storing anything. Each item in `findings` must\n        have a non-empty quote/explanation, problem in\n        {\"contradicted\",\"misleading\"}, and a non-empty sources list; findings\n        missing any of those are rejected wholesale (nothing partial is\n        stored).\n        ",
          "inputSchema": {
            "properties": {
              "disclosure": {
                "title": "Disclosure",
                "type": "string"
              },
              "document_id": {
                "title": "Document Id",
                "type": "integer"
              },
              "findings": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "title": "Findings",
                "type": "array"
              }
            },
            "required": ["disclosure", "document_id", "findings"],
            "title": "submit_findingsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "submit_findingsDictOutput",
            "type": "object"
