        },
        {
          "name": "get_skarvia_info",
          "description": "What Storskarvia is and how it's positioned.\n\n    A professional writing studio for novelists, screenwriters, and video\n    scriptwriters, staffed by an AI team that fact-checks, researches, and\n    tracks continuity -- but never writes the user's prose for them.\n    ",
