        {
          "name": "get_pricing",
          "description": "Current Storskarvia pricing tiers, features, and monthly fact-check quotas.\n\n    Built from config.PLANS, the same list /pricing renders from, so this can\n    no longer drift from the page the way it did while it was kept by hand.\n\n    The founder block is read live rather than described in prose. The note\n    here used to say payments \"aren't enabled yet\" unconditionally, which went\n    on being served after they were switched on, and the tiers listed full\n    price while every human-facing surface offered a founding seat at half of\n    it. An agent asked what Storskarvia costs answered with a price nobody was\n    being charged and omitted the one on offer.\n    ",
          "inputSchema": {
            "properties": {},
            "title": "get_pricingArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_pricingDictOutput",
