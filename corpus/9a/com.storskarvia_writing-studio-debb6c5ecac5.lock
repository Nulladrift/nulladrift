        {
          "name": "ground_claim",
          "description": "Step 2 of a bring-your-own-agent fact-check. Runs Storskarvia's own\n        server-side retrieval (Wikipedia + searxng) for one claim and returns\n        the sources -- no verdict, no judgment. Your agent should judge the\n        claim ONLY against these returned sources, never outside knowledge.\n        Requires a personal Storskarvia API key as a Bearer token (this is not an\n        open retrieval API).\n        ",
          "inputSchema": {
