      "instructions": "Storskarvia is a professional writing studio for novelists, screenwriters, and video scriptwriters, staffed by an AI team that fact-checks, researches, and tracks continuity -- it structurally never writes prose for the user; the byline stays theirs. The get_skarvia_info/list_features/get_pricing/list_guides/get_guide tools are public and need no authentication. list_my_projects (projects with the ids and titles of their documents) and get_findings require the user's personal Storskarvia API key sent as an HTTP 'Authorization: Bearer <key>' header on the MCP connection itself (configure it once in the MCP client's connector settings, not as a tool argument) -- if a call to one of those fails with an auth error, tell the user to generate a key from their Storskarvia account settings and add it to the connector.",
      "tools": [
        {
          "name": "get_findings",
          "description": "Findings for one of the authenticated user's fact-check or\n    continuity runs. Ownership is enforced -- a check_id belonging to\n    another user raises an error rather than leaking their data.\n    ",
          "inputSchema": {
            "properties": {
              "check_id": {
                "title": "Check Id",
                "type": "integer"
              }
            },
            "required": ["check_id"],
            "title": "get_findingsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_findingsDictOutput",
