      "serverInfo": {
        "name": "odile",
        "title": "Odile Direct: reach a business by its phone number",
        "version": "0.7.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Odile Direct lets an AI agent reach a business that has no API, by its phone number. find_business_agent looks the business up and is free; send_to_business leaves it a message, checks availability, books or cancels a time; get_replies and reply_to_business carry the conversation when the business answers. For a US or Canadian business without a Direct card, call_business places an informational phone call, get_call_result reads its outcome and answer_call_question answers the business mid-call. get_m2m_network lists the skills, credit prices and limits; get_direct_usage shows your own allowance and balance, and a payment_required reply carries the top-up link; get_direct_payment checks a deposit booking. This endpoint carries only the Direct tools: the answering-line tools are at https://odilelabs.com/mcp/lines, every Odile tool is at https://odilelabs.com/mcp, and Odile Gate, which limits what an agent may call on your own API, is a separate MCP server at https://gate.odilelabs.com/mcp. Lookups, availability and booking cancellation stay free. Each agent identity gets 50 free tasks per UTC calendar month; then a delivered message costs 1 credit and a confirmed booking 5 credits. 1 credit = $0.10. Direct 100: 100 credits for $10; Direct 1,000: 1,000 credits for $90; Direct 10,000: 10,000 credits for $800. Credits never expire; nothing renews. Failed, refused and unconfirmed tasks cost nothing. Existing prepaid dollar balances keep their full cent value; 10 cents of balance equals 1 credit. Price quotes and paying a quoted price are not available. The opt-in voice pilot costs 2.5 credits per answered minute, billed by the second with a 20-second minimum. It reserves a funded 20–600-second cap before dialing; failed and unanswered calls cost zero. It needs account opt-in; free-only connections cannot start voice. A wallet can pay $1.00 in Base USDC per answered call to a business (POST /a2a/v1/x402/call) or per answered test call of its own phone agent, with scores (POST /a2a/v1/x402/test-call); unanswered and failed calls are never charged.",
      "tools": [
        {
          "name": "answer_call_question",
          "title": "Answer a question during your business call",
          "description": "Give the calling assistant your answer to a question the business asked during a call placed with call_business, so the call can continue. Use it only when get_call_result shows state input_required (its pending_question holds the question); reply within 45 seconds or the assistant tells the business the person will follow up and carries on. The assistant uses the answer on the live call and it cannot be taken back, so keep it short and factual (up to 300 characters). It is refused if it contains a number of four to eight digits, a card-length number, or words such as password, PIN or code; never include payment card numbers, passwords or one-time codes. Requires direct:tasks and ownership of the call. Returns the call state; read get_call_result for the outcome. Example: task_id='dv_9a3', answer='A 40-gallon gas heater, installed in 2016.'",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answer": {
                "description": "The answer to the pending question, in plain words, without card numbers, passwords, one-time codes or any number of four to eight digits.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "task_id": {
                "description": "The task_id returned by call_business.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["answer", "task_id"],
            "type": "object"
          },
