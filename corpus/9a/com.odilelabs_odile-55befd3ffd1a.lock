        {
          "name": "get_direct_payment",
          "title": "Check your merchant checkout and booking",
          "description": "Check an existing deposit booking on your signed-in Direct account: reconcile its Stripe Checkout payment and return its receipt and the separate booking state. Use it after send_to_business returned a payment_url for a deposit booking, to see whether the person has paid; it cannot start a payment, which the person makes on Stripe’s hosted page. Pass biz (the business id from its card) and task_id (the task id send_to_business returned for that booking). Requires direct:tasks. Uses only the stored merchant account and amount and creates no new charge or booking identity; a verified paid checkout may finish its already-authorized held booking. Payout status remains unknown: paid does not mean a bank payout. Safe to repeat. Example: biz='harbor-plumbing', task_id='tk_5d0' after send_to_business returned a payment_url for a deposit booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "biz": {
                "description": "The business id (from its card) the deposit booking was made with.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "task_id": {
                "description": "The task id send_to_business returned for that booking.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
