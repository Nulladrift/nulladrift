        },
        {
          "name": "call_business",
          "title": "Call a business without a Direct card",
          "description": "Place an outbound phone call to a business to ask for information on a named person’s behalf. Use it when find_business_agent returned not_found for a US or Canadian number; when a Direct card exists use send_to_business. It dials a real number and a call cannot be recalled once placed. Requires direct:tasks, human opt-in at https://odilelabs.com/developers#voice and the person’s permission for this call (on_behalf_consent true). Informational calls only: no sales, payments or account access. Calls run Monday to Friday, 9:00 to 17:00 in the business’s local time; outside that window the request is refused and the error includes next_window. A number is not called twice within 24 hours, and each account has a daily call cap. number and callback_number must be callable US or Canadian E.164 numbers, callback_number being the person’s own, never the business’s. message_id is required: reuse it unchanged on every retry so only one call is placed. Returns {task_id, state (queued, completed or failed), status}; read get_call_result for progress and answers. Voice credit costs: get_m2m_network. Example: number='+15615550123', business_name='Harbor Plumbing', caller_name='Ana Diaz', callback_number='+15615550199', need='Do you replace water heaters?', on_behalf_consent=true, message_id='call-8f2'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_name": {
                "description": "The business to call.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "callback_number": {
                "description": "That person’s own callback number in E.164, never the business’s.",
                "pattern": "^\\+[1-9]\\d{6,14}$",
                "type": "string"
              },
              "caller_name": {
                "description": "The named person who requested this call.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "max_seconds": {
                "description": "Maximum call duration, from 60 to 600 seconds, subject to available credits.",
                "maximum": 600,
                "minimum": 60,
                "type": "integer"
              },
              "message_id": {
                "description": "A stable request id; reuse it unchanged on every retry.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "need": {
                "description": "The information the person wants from the business.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "number": {
                "description": "The business’s E.164 phone number, e.g. +15615550123.",
                "pattern": "^\\+[1-9]\\d{6,14}$",
                "type": "string"
              },
              "on_behalf_consent": {
                "const": true,
                "description": "True only after that person asked for this call.",
                "type": "boolean"
              },
              "questions": {
                "description": "Up to five questions to ask the business.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "required": ["business_name", "callback_number", "caller_name", "message_id", "need", "number", "on_behalf_consent"],
            "type": "object"
          },
