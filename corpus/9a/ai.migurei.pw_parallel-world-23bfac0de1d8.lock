{
  "lockfileVersion": 2,
  "subjects": {
    "ai.migurei.pw/parallel-world": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pw.migurei.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "ai.migurei.pw/parallel-world",
        "title": "Parallel World",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Three read-only tools. verify_ai_bot {\"ip\":\"<public IP from your log>\",\"user_agent\":\"<its User-Agent>\"}: says whether that IP is inside the IP ranges the named AI bot's operator publishes (verified, ip_not_in_feed, no_feed, unknown_ua), from the bundled registry and feed snapshot with its date; no outside request; the IP and User-Agent are not stored or logged; private and reserved addresses are refused. check_ai_bot_access {\"domain\":\"example.com\"}: reads that site's public robots.txt (one request, nothing else) and says which AI bots of our registry are allowed or disallowed for \"/\", with the deciding rule, plus the counts our own lab site pw.migurei.ai recorded for each bot (observed_on_pw: not about that domain, not a prediction); the domain is not stored. get_site_info {\"topic\":\"all\"} (or one of overview, pricing, scanner, contact, company, all): the same facts as the pages of https://pw.migurei.ai.",
      "tools": [
        {
          "name": "check_ai_bot_access",
          "title": "Check which AI bots a site allows",
          "description": "Reads the public robots.txt of a website (one request to https://<host>/robots.txt, nothing else on the site) and says, for each AI crawler and AI agent of the migurei bot registry (training crawlers such as GPTBot and ClaudeBot, search bots, fetchers that act for a user, and others), whether that bot is allowed or disallowed for the path \"/\", which robots.txt rule decided it, and whether the file exists. Each bot also carries observed_on_pw: the counts our own lab site pw.migurei.ai recorded for that bot (published on https://pw.migurei.ai/ja/research/ai-bot-first-visits; the same for every domain, not about the domain asked, not a prediction). Input is a domain or URL; only public domain names are accepted (no IP addresses, no ports, no private hosts). Read-only; the domain is not stored. robots.txt is a request to bots, not access control, and a User-Agent is only a claim.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "A public domain name or a URL, for example example.com or https://example.com/page. Only its host is used.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bots": {
                "items": {
                  "properties": {
                    "basis": {
                      "enum": ["bot_group", "wildcard_group", "googlebot_group", "no_group", "no_robots_txt", "robots_txt_unavailable"],
                      "type": "string"
                    },
                    "bot": {
                      "type": "string"
                    },
                    "category": {
                      "enum": ["training", "search_index", "user_fetch", "browser_agent", "unknown"],
                      "type": "string"
                    },
                    "observed_on_pw": {
                      "description": "What our lab saw this bot do on its own site pw.migurei.ai (counts published on the source page). Not about the domain asked, not a prediction. The same for every domain asked.",
                      "properties": {
                        "applies_to_queried_domain": {
                          "type": "boolean"
                        },
                        "as_of": {
                          "type": "string"
                        },
                        "code_sha": {
                          "type": "string"
                        },
                        "first_seen": {
                          "type": ["string", "null"]
                        },
                        "last_seen": {
                          "type": ["string", "null"]
                        },
                        "note_en": {
                          "type": "string"
                        },
                        "note_ja": {
                          "type": "string"
                        },
                        "observed": {
                          "type": "boolean"
                        },
                        "pages_fetched": {
                          "type": ["integer", "null"]
                        },
                        "robots_txt_fetches": {
                          "type": ["integer", "null"]
                        },
                        "site": {
                          "type": "string"
                        },
                        "sitemap_urls": {
                          "type": ["integer", "null"]
                        },
                        "source": {
                          "type": "string"
                        },
                        "window": {
                          "properties": {
                            "from": {
                              "type": "string"
                            },
                            "to": {
                              "type": "string"
                            }
                          },
                          "required": ["from", "to"],
                          "type": "object"
                        }
                      },
                      "required": ["applies_to_queried_domain", "as_of", "code_sha", "first_seen", "last_seen", "note_en", "note_ja", "observed", "pages_fetched", "robots_txt_fetches", "site", "sitemap_urls", "source", "window"],
                      "type": "object"
                    },
                    "path_rules": {
                      "type": "boolean"
                    },
                    "rule": {
                      "type": ["string", "null"]
                    },
                    "token": {
                      "type": "string"
                    },
                    "verdict": {
                      "enum": ["allowed", "disallowed", "unknown"],
                      "type": "string"
                    }
                  },
                  "required": ["basis", "bot", "category", "path_rules", "rule", "token", "verdict"],
                  "type": "object"
                },
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "learn_more": {
                "type": "string"
              },
              "method": {
                "type": "string"
              },
              "registry_version": {
                "type": "string"
              },
              "robots_txt": {
                "properties": {
                  "bytes": {
                    "type": "integer"
                  },
                  "error": {
                    "type": ["string", "null"]
                  },
                  "http_status": {
                    "type": ["integer", "null"]
                  },
                  "possible_block": {
                    "type": "boolean"
                  },
                  "redirects": {
                    "type": "integer"
                  },
                  "state": {
                    "enum": ["found", "not_found", "unavailable"],
                    "type": "string"
                  },
                  "truncated": {
                    "type": "boolean"
                  }
                },
                "required": ["bytes", "error", "http_status", "possible_block", "redirects", "state", "truncated"],
                "type": "object"
              },
              "robots_url": {
                "type": "string"
              },
              "summary": {
                "properties": {
                  "allowed": {
                    "type": "integer"
                  },
                  "disallowed": {
                    "type": "integer"
                  },
                  "unknown": {
                    "type": "integer"
                  }
                },
                "required": ["allowed", "disallowed", "unknown"],
                "type": "object"
              }
            },
            "required": ["bots", "domain", "learn_more", "method", "registry_version", "robots_txt", "robots_url", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0ed1a25e74d274e6a69fb0b6c47041c9a10a976683df641373d74886154fd791"
        },
        {
          "name": "get_site_info",
          "title": "Parallel World site information",
          "description": "Returns the facts published on this website, in Japanese: service overview, plans, prices and payment terms, how the scanner behaves, how to contact us, and the operating company. Each fact comes with the URL of the page that shows it. Read-only; it returns nothing that is not on the pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "description": "Which facts to return",
                "enum": ["overview", "pricing", "scanner", "contact", "company", "all"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fae46444436dc9c1222436d629b7175058e2c67506b27e9273c6bdbd0d2b565a"
        },
        {
          "name": "verify_ai_bot",
          "title": "Verify that an IP address is really the AI bot its User-Agent claims",
          "description": "Given the IP address and the User-Agent string of a request (for example from a server log), says whether that IP is inside the IP ranges the bot's operator publishes. The User-Agent is matched against the migurei bot registry (registry/bots); the IP is matched, IPv4 and IPv6, against the operator's published feed snapshot bundled with the registry (the snapshot date and registry version are in the answer). Status: verified (IP is in the operator's published ranges), ip_not_in_feed (the User-Agent names a registered bot but the IP is not in its ranges), no_feed (registered bot, but its operator publishes no IP ranges, so it cannot be checked), unknown_ua (no registered bot matches). Needs no outside request. Only public internet addresses are accepted (private, loopback, link-local, CGNAT, multicast, documentation and reserved addresses are refused). Read-only; the IP address and User-Agent are not stored and not logged. \"verified\" only means the IP is in the operator's ranges; the snapshot goes stale between updates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "One public IPv4 or IPv6 address, for example from the access log.",
                "maxLength": 64,
                "type": "string"
              },
              "user_agent": {
                "description": "The User-Agent header of that request, for example \"Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; GPTBot/1.1; +https://openai.com/gptbot)\".",
                "maxLength": 512,
                "type": "string"
              }
            },
            "required": ["ip", "user_agent"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bot": {
                "properties": {
                  "category": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "operator": {
                    "type": ["string", "null"]
                  },
                  "verify_method": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "feeds": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "ip_in_feed": {
                      "type": "boolean"
                    },
                    "operator": {
                      "type": ["string", "null"]
                    },
                    "prefixes": {
                      "type": "integer"
                    },
                    "url": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "ip_in_feed", "operator", "prefixes", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "ip": {
                "type": "string"
              },
              "ip_version": {
                "enum": [4, 6],
                "type": "integer"
              },
              "limits": {
                "properties": {
                  "en": {
                    "type": "string"
                  },
                  "ja": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "matched_feed": {
                "type": ["string", "null"]
              },
              "meaning": {
                "properties": {
                  "en": {
                    "type": "string"
                  },
                  "ja": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "method": {
                "type": "string"
              },
              "privacy": {
                "properties": {
                  "en": {
                    "type": "string"
                  },
                  "ja": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "registry_version": {
                "type": "string"
              },
              "snapshot_date": {
                "type": "string"
              },
              "status": {
                "enum": ["verified", "ip_not_in_feed", "no_feed", "unknown_ua"],
                "type": "string"
              }
            },
            "required": ["bot", "feeds", "ip", "ip_version", "matched_feed", "registry_version", "snapshot_date", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc57ffffe69368c6fc9915584ec175382380f417428911a395765b485968eada"
        }
      ],
      "digest": "sha256:fd1c992b4db826e867a0df8a0a7d2b82547f1482734cf6827624aa1bfa3819c6"
    }
  }
