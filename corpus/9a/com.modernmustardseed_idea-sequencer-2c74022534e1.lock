        {
          "name": "sequence_build",
          "title": "Sequence the build",
          "description": "Turn a feature list with dependencies into a dated build plan: applies the MVP cut, orders tasks by dependency, schedules them across the given number of builders on working days (weekends skipped), computes the critical path and each task's slack, adds the method's own tasks (record the success metric, take payment, launch kit, Hand Off) where missing, and dates the milestones: first core job end to end, MVP in real users' hands, launch, success metric review, and Hand Off. Every plan carries a success metric and a review date; a default per product type is used and flagged when none is given.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "build_weeks": {
                "description": "Build window in weeks. Default 6.",
                "maximum": 52,
                "minimum": 1,
                "type": "integer"
              },
              "builders": {
                "description": "People building in parallel. Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "charge_at_launch": {
                "description": "True if buyers pay from launch. Default true.",
                "type": "boolean"
              },
              "features": {
                "items": {
                  "properties": {
                    "depends_on": {
                      "description": "Ids of features that must exist first.",
                      "items": {
                        "maxLength": 60,
                        "minLength": 1,
                        "pattern": "^[a-z0-9][a-z0-9_-]*$",
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "effort": {
                      "description": "xs (1 point), s (2), m (3, default), l (5), xl (8).",
                      "enum": ["xs", "s", "m", "l", "xl"],
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 60,
                      "minLength": 1,
                      "pattern": "^[a-z0-9][a-z0-9_-]*$",
                      "type": "string"
                    },
                    "manual_alternative": {
                      "description": "True if a person could do this by hand for the first buyers.",
                      "type": "boolean"
                    },
                    "name": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "points": {
                      "description": "Effort points, overrides effort. A builder clears 5 a week by default.",
                      "maximum": 40,
                      "minimum": 0.5,
                      "type": "number"
                    },
                    "requested_by": {
                      "description": "How many buyers asked for it.",
                      "maximum": 100000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "tags": {
                      "description": "What the feature does: core_job, revenue, compliance, trust_safety, onboarding, measurement, retention, integration, automation, admin, growth, analytics, customization, platform, scale, delight.",
                      "items": {
                        "enum": ["core_job", "revenue", "compliance", "trust_safety", "onboarding", "measurement", "retention", "integration", "automation", "admin", "growth", "analytics", "customization", "platform", "scale", "delight"],
                        "type": "string"
                      },
                      "maxItems": 6,
                      "type": "array"
                    }
                  },
                  "required": ["id", "name", "tags"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "include_method_tasks": {
                "description": "Add the method's own tasks: metric recording, payment, launch kit and Hand Off. Default true.",
                "type": "boolean"
              },
              "points_per_week": {
                "description": "Effort points one builder clears in a week. Default 5.",
                "maximum": 40,
                "minimum": 1,
                "type": "number"
              },
              "product_type": {
                "description": "Used for the default success metric when none is given.",
                "enum": ["b2b_saas", "consumer_app", "marketplace", "productized_service", "ai_agent", "physical_product", "hardware_device", "content_community", "developer_tool", "internal_tool"],
                "type": "string"
              },
              "scope": {
                "description": "\"mvp\": must-haves only. \"launch\" (default): must-haves plus should-haves that fit the window. \"all\": everything.",
                "enum": ["mvp", "launch", "all"],
                "type": "string"
              },
              "start_date": {
                "description": "ISO date the build starts. Default today (UTC). Weekends are skipped.",
                "type": "string"
              },
              "success_metric": {
                "description": "The number that decides success, its target, and how many days after launch to read it.",
                "properties": {
                  "days_after_launch": {
                    "maximum": 365,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "target": {
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "unit": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["days_after_launch", "name", "target", "unit"],
                "type": "object"
              },
              "validate_first_days": {
                "description": "Working days of validation before the build starts. Default 0.",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["features"],
            "type": "object"
          },
