        {
          "name": "kill_or_continue",
          "title": "Kill or continue",
          "description": "Make a push, iterate, park or kill call on 1 to 12 products from their metrics (target, actual, kill line, must-hit), evidence, stage, review date, last activity, and monthly revenue and cost, using 10 named decision rules: a must-hit metric past its kill line on the review date kills; a weighted score under 30 on the review date kills; more than 45 days idle parks; revenue under cost and falling kills or forces a price or cost change; 80 or more with the stage gate evidence pushes. Returns each call with its score, rule, reason, next action, next review date and what would flip it, then portfolio notes. Money and time already spent are recorded and deliberately ignored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "as_of": {
                "description": "Review as of this date. Default today (UTC).",
                "type": "string"
              },
              "builders": {
                "description": "People available to build across the portfolio.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "products": {
                "items": {
                  "properties": {
                    "already_spent_usd": {
                      "description": "Recorded and deliberately ignored: past spend does not decide.",
                      "maximum": 1000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "evidence": {
                      "items": {
                        "properties": {
                          "assumption": {
                            "description": "Limit this evidence to one assumption. Default: every assumption that rung lowers.",
                            "enum": ["problem", "buyer_access", "willingness_to_pay", "solution_fit", "feasibility", "retention", "supply", "regulatory", "unit_economics", "operator_capacity"],
                            "type": "string"
                          },
                          "count": {
                            "description": "How many instances, for example 4 interviews or 12 signups.",
                            "maximum": 100000,
                            "minimum": 0,
                            "type": "integer"
                          },
                          "level": {
                            "description": "Rung on the evidence ladder: opinion, complaint_found, interview_pain, signup, meeting_booked, technical_proof, commitment, payment, repeat_usage.",
                            "enum": ["opinion", "complaint_found", "interview_pain", "signup", "meeting_booked", "technical_proof", "commitment", "payment", "repeat_usage"],
                            "type": "string"
                          },
                          "note": {
                            "maxLength": 200,
                            "type": "string"
                          }
                        },
                        "required": ["count", "level"],
                        "type": "object"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "internal": {
                      "description": "True for an internal tool, which has no outside buyer.",
                      "type": "boolean"
                    },
                    "last_activity": {
                      "type": "string"
                    },
                    "metrics": {
                      "items": {
                        "properties": {
                          "actual": {
                            "maximum": 1000000000,
                            "minimum": 0,
                            "type": "number"
                          },
                          "direction": {
                            "enum": ["higher_better", "lower_better"],
                            "type": "string"
                          },
                          "kill_at": {
                            "description": "The pre-committed kill line. Default 30 percent of target (higher is better) or 170 percent (lower is better).",
                            "maximum": 1000000000,
                            "minimum": 0,
                            "type": "number"
                          },
                          "must_hit": {
                            "description": "True if crossing the kill line on the review date ends the product.",
                            "type": "boolean"
                          },
                          "name": {
                            "maxLength": 120,
                            "minLength": 1,
                            "type": "string"
                          },
                          "target": {
                            "maximum": 1000000000,
                            "minimum": 0,
                            "type": "number"
                          },
                          "weight": {
                            "maximum": 10,
                            "minimum": 0.1,
                            "type": "number"
                          }
                        },
                        "required": ["actual", "name", "target"],
                        "type": "object"
                      },
                      "maxItems": 10,
                      "minItems": 1,
