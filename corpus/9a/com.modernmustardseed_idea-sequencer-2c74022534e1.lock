      "instructions": "The Idea to Product Sequencer applies a fixed, rule-based product method to an idea. classify_idea scores the idea and finds its riskiest assumption; validation_plan picks the cheapest test for an assumption with pass and kill lines; cut_mvp sorts features into must, should and not now; sequence_build dates the build and its milestones; kill_or_continue makes push, iterate, park or kill calls; build_scope_and_sequence writes the whole plan as one document; explain_method returns the reference tables. All tools are read-only, deterministic and make no network calls.",
      "tools": [
        {
          "name": "build_scope_and_sequence",
          "title": "Write a Scope and Sequence",
          "description": "Run the full Idea to Product method on one idea and its feature list and return a Scope and Sequence plan as a Markdown document, followed by a short JSON summary. The document covers the problem and buyer, the riskiest assumption with its risk table, this week's validation test with pass and kill lines, red flags, the MVP cut (must, should, not now, with reasons), the build sequence with builders and dates, milestones through Hand Off, the launch plan and success metric, kill criteria written before the work, build rules for the product type, and a Hand Off checklist. When there is no commitment-level evidence yet, the build is scheduled to start after the test's decision date.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audience_size": {
                "maximum": 100000000,
                "minimum": 1,
                "type": "integer"
              },
              "billing": {
                "description": "one_time, monthly, annual or per_use. Default one_time.",
                "enum": ["one_time", "monthly", "annual", "per_use"],
                "type": "string"
              },
              "build_weeks": {
                "description": "Build window in weeks. Default 6.",
                "maximum": 52,
                "minimum": 1,
                "type": "integer"
              },
              "builders": {
                "description": "People building in parallel. Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "buyer_type": {
                "description": "Override the detected buyer type.",
                "enum": ["consumer", "prosumer", "smb_owner", "mid_market", "enterprise", "public_sector", "nonprofit_ministry", "developer", "own_business"],
                "type": "string"
              },
              "charge_at_launch": {
                "description": "True if buyers pay from launch. Default true.",
                "type": "boolean"
              },
              "current_alternative": {
                "description": "What they use or do about the problem today, for example \"spreadsheets and texts\", \"Jobber\", or \"nothing\".",
                "maxLength": 200,
                "type": "string"
              },
              "days_available": {
                "description": "Days until a decision is needed. Default 7.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "evidence": {
                "description": "What has been learned so far.",
                "items": {
                  "properties": {
                    "assumption": {
                      "description": "Limit this evidence to one assumption. Default: every assumption that rung lowers.",
                      "enum": ["problem", "buyer_access", "willingness_to_pay", "solution_fit", "feasibility", "retention", "supply", "regulatory", "unit_economics", "operator_capacity"],
                      "type": "string"
                    },
                    "count": {
                      "description": "How many instances, for example 4 interviews or 12 signups.",
                      "maximum": 100000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "level": {
                      "description": "Rung on the evidence ladder: opinion, complaint_found, interview_pain, signup, meeting_booked, technical_proof, commitment, payment, repeat_usage.",
                      "enum": ["opinion", "complaint_found", "interview_pain", "signup", "meeting_booked", "technical_proof", "commitment", "payment", "repeat_usage"],
                      "type": "string"
                    },
                    "note": {
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["count", "level"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "features": {
                "items": {
                  "properties": {
                    "depends_on": {
                      "description": "Ids of features that must exist first.",
                      "items": {
                        "maxLength": 60,
                        "minLength": 1,
                        "pattern": "^[a-z0-9][a-z0-9_-]*$",
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "effort": {
                      "description": "xs (1 point), s (2), m (3, default), l (5), xl (8).",
                      "enum": ["xs", "s", "m", "l", "xl"],
                      "type": "string"
                    },
                    "id": {
                      "maxLength": 60,
                      "minLength": 1,
                      "pattern": "^[a-z0-9][a-z0-9_-]*$",
                      "type": "string"
                    },
                    "manual_alternative": {
                      "description": "True if a person could do this by hand for the first buyers.",
                      "type": "boolean"
                    },
                    "name": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "points": {
                      "description": "Effort points, overrides effort. A builder clears 5 a week by default.",
                      "maximum": 40,
                      "minimum": 0.5,
                      "type": "number"
                    },
                    "requested_by": {
                      "description": "How many buyers asked for it.",
                      "maximum": 100000,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "tags": {
                      "description": "What the feature does: core_job, revenue, compliance, trust_safety, onboarding, measurement, retention, integration, automation, admin, growth, analytics, customization, platform, scale, delight.",
                      "items": {
                        "enum": ["core_job", "revenue", "compliance", "trust_safety", "onboarding", "measurement", "retention", "integration", "automation", "admin", "growth", "analytics", "customization", "platform", "scale", "delight"],
                        "type": "string"
                      },
                      "maxItems": 6,
                      "type": "array"
                    }
                  },
                  "required": ["id", "name", "tags"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "has_audience": {
                "description": "True if there is an existing list, following or customer base to test with.",
                "type": "boolean"
              },
              "has_prototype": {
                "description": "True if a working version is already in users' hands.",
                "type": "boolean"
              },
              "idea": {
                "description": "The idea in plain words: what it does and for whom.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "points_per_week": {
                "description": "Effort points one builder clears in a week. Default 5.",
                "maximum": 40,
                "minimum": 1,
                "type": "number"
              },
              "price_usd": {
                "description": "Intended price in US dollars.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "product_type": {
                "description": "Override the detected product type.",
                "enum": ["b2b_saas", "consumer_app", "marketplace", "productized_service", "ai_agent", "physical_product", "hardware_device", "content_community", "developer_tool", "internal_tool"],
                "type": "string"
              },
              "reachable_buyers": {
                "description": "How many named buyers can be contacted this week.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "runs_another_business": {
                "description": "True if the founder is building this alongside a business they already run.",
                "type": "boolean"
              },
              "scope": {
                "enum": ["mvp", "launch", "all"],
                "type": "string"
              },
              "start_date": {
                "description": "ISO date the work starts. Default today (UTC).",
                "type": "string"
              },
              "success_metric": {
                "properties": {
                  "days_after_launch": {
                    "maximum": 365,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "name": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "target": {
                    "maximum": 1000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "unit": {
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["days_after_launch", "name", "target", "unit"],
                "type": "object"
              },
              "technical_builder": {
                "description": "False if nobody on the team can build the hardest part. Default true.",
                "type": "boolean"
              },
              "test_budget_usd": {
                "description": "Cash available for the validation test. Default 0.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "title": {
                "maxLength": 90,
                "type": "string"
              },
              "who_pays": {
                "description": "The person who pays, by role and niche, for example \"owners of 2 to 10 truck plumbing companies\".",
                "maxLength": 200,
                "type": "string"
              },
              "who_uses": {
                "description": "The person who uses it, if different from who pays.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["features", "idea"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Write a Scope and Sequence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:043a2741c188694f0ee71fae4a2ebfcae2322c5c3305ef0745ebd7241ef0ed23"
        },
