              "prefersBorder": true
            }
          },
          "digest": "sha256:4ea07376ca07a5de4859749306d0a62dadffb2cf1ba7701a21df1fa6896fab68"
        }
      ],
      "digest": "sha256:1970d6ff549836f0ca956fc5b9618d64d0e810db14fe149be145e4bca890f458"
    }
  }
}
