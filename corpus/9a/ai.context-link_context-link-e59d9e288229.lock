{
  "lockfileVersion": 2,
  "subjects": {
    "ai.context-link/context-link": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.context-link.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Context Link MCP Server",
        "version": "0.0.7"
      },
      "capabilities": {
        "logging": {},
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "\n                Context Link retrieves source-backed context from the user's connected workspaces, websites, files and email.\n\n                Get Context returns relevant snippets from those sources for a query.\n                Ask Question returns a concise answer with citations drawn from the same sources.\n\n                Save Memory stores a named reference document in the user's Context Link workspace; it does not modify connected sources.\n                If the user names the document (e.g. 'save {name}'), that name is its namespace.\n                Get Memory retrieves a stored document by its namespace.\n                To revise a stored document, retrieve it with Get Memory and save the updated content back under the same namespace.\n            ",
      "tools": [
        {
          "name": "ask_question",
          "title": "Ask Question",
          "description": "Ask a question about the user's connected workspaces and websites and receive a concise answer with citations. The attached widget displays only the list of sources consulted — it does not show the answer, so always relay the answer text in your reply.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "connection_type": {
                "description": "Optional comma-separated list of connection types to restrict retrieval to (e.g. \"site,email\"). Only content from those sources is considered. Valid types: basecamp, custom, email, files, google_doc, memory, monday, notion, one_drive, site, webmention, youtube.",
                "type": "string"
              },
              "mode": {
                "description": "Optional mode to weight results (e.g. 'customer-support')",
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "Concise paragraph answer; empty string when success is false",
                "type": "string"
              },
              "citations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "n": {
                      "type": "integer"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["n", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "reason": {
                "enum": ["ok", "no_context", "llm_error", "empty_input", "auth_required", "signup_required", "pro_required", "allowance_exceeded", "invalid_connection_type"],
                "type": "string"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "chunks_count": {
                      "type": "integer"
                    },
                    "connection_type": {
                      "type": "string"
                    },
                    "id": {
                      "type": "integer"
                    },
                    "kind": {
                      "enum": ["success", "no_content", "signup_required"],
                      "type": "string"
                    },
                    "logo": {
                      "type": "string"
                    },
                    "post_titles": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["kind"],
                  "type": "object"
                },
                "type": "array"
              },
              "success": {
                "type": "boolean"
              }
            },
            "required": ["answer", "citations", "reason", "sources", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ask Question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/context-sources.html",
            "openai/toolInvocation/invoked": "Got answer",
            "openai/toolInvocation/invoking": "Asking Context Link",
            "securitySchemes": [
              {
                "scopes": ["context:read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/context-sources.html"
            }
          },
          "digest": "sha256:9d71c80ec55992b820fed6b0d9e2a3ce85d6c92d01669ba5584a7032d3521df4"
        },
        {
          "name": "get_context",
          "title": "Get Context",
          "description": "Get context from the user's connected workspaces and websites. The attached widget displays only the list of sources consulted — it does not show the retrieved content, so use the returned context to answer the user directly.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "connection_type": {
                "description": "Optional comma-separated list of connection types to restrict retrieval to (e.g. \"site,email\"). Only content from those sources is considered. Valid types: basecamp, custom, email, files, google_doc, memory, monday, notion, one_drive, site, webmention, youtube.",
                "type": "string"
              },
              "mode": {
                "description": "Optional mode to weight results (e.g. 'customer-support')",
                "type": "string"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "context": {
                "type": ["string", "null"]
              },
              "sources": {
                "items": {
                  "properties": {
                    "chunks_count": {
                      "type": "integer"
                    },
                    "connection_type": {
                      "type": "string"
                    },
                    "id": {
                      "type": "integer"
                    },
                    "kind": {
                      "enum": ["success", "no_content", "signup_required"],
                      "type": "string"
                    },
                    "logo": {
                      "type": "string"
                    },
                    "post_titles": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["kind"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["context", "sources"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Context"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/context-sources.html",
            "openai/toolInvocation/invoked": "Got context",
            "openai/toolInvocation/invoking": "Getting context",
            "securitySchemes": [
              {
                "scopes": ["context:read"],
                "type": "oauth2"
              }
            ],
            "ui": {
              "resourceUri": "ui://widget/context-sources.html"
            }
          },
          "digest": "sha256:a979bb73d69cc040b6cbfa471d7b0119f7eab92186b7fe2c53d70faae87d8610"
        },
        {
          "name": "get_memory",
          "title": "Get Memory",
          "description": "Retrieve previously saved memory content by its namespace. Use this when the user wants to recall saved content.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "namespace": {
                "description": "The namespace/name of the saved memory to retrieve",
                "type": "string"
              }
            },
            "required": ["namespace"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "namespace": {
                "type": "string"
              }
            },
            "required": ["content", "found", "namespace"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Memory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Retrieved memory",
            "openai/toolInvocation/invoking": "Retrieving memory",
            "securitySchemes": [
              {
                "scopes": ["context:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7d1c255eb03ba589b90393edd2a0a3a69be53d11f46f18c5a083953eb6c0d873"
        },
        {
          "name": "save_memory",
          "title": "Save Memory",
          "description": "Save content to the user's memory for later retrieval. Use this when the user wants to save information, notes, or conversation content.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "content": {
                "description": "The content to save. Can be plain text, markdown, or structured content.",
                "type": "string"
              },
              "namespace": {
                "description": "A name/label for this memory (use-dashes-for-spaces). If omitted, a timestamped name is generated.",
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "namespace": {
                "type": "string"
              }
            },
            "required": ["message", "namespace"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Save Memory"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/toolInvocation/invoked": "Saved to memory",
            "openai/toolInvocation/invoking": "Saving to memory",
            "securitySchemes": [
              {
                "scopes": ["context:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:537f31daa4f3e241e3ab21670e3d08d88980895ffd5f4ef51c2eda56e61a92f2"
        }
      ],
      "resources": [
