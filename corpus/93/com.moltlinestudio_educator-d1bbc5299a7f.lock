          "digest": "sha256:c3c6bc3cc629d95ec1cb9497a2fecf897b64053b2ba1bfac39f744a5164f9937"
        },
        {
          "name": "grade_curve",
          "title": "Grade Curve",
          "description": "Summarize how an assessment landed: stats, bands, and outliers. FREE.\n\nReports mean, median, std dev, quartiles, distribution by percentage\nband, and flagged low outliers. Typical input {\"scores\": [88, 92, 75,\n61, 84], \"max_score\": 100} returns {\"n\": 5, \"mean\": 80.0, \"median\":\n84.0, \"std_dev\": ..., \"q1\": ..., \"q3\": ..., \"distribution\":\n{\"90-100%\": 1, ...}, \"outliers_low\": [...], \"reading\": \"...\"}.\n\nUse on a list of scores already earned. Not for the readability of the\nassessment itself (readability_report). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"no scores\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_score": {
                "default": 100,
                "description": "Maximum possible score; must be greater than 0. Default 100.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "scores": {
                "description": "Raw scores, one per student; at least 1 value, e.g. [88, 92, 75].",
                "items": {
                  "type": "number"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["scores"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Grade Curve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:9570fa960a65e5c641c9d0ea0ccc61d808eb93e82479d329002d5cd9bcd6de1d"
        },
        {
          "name": "lesson_timer",
          "title": "Lesson Timer",
          "description": "Split a class period into timed segments with sensible weighting. FREE.\n\nThe opener and closer get less time; core activities get more.\nTypical input {\"minutes\": 50, \"segments\": [\"Warm-up\", \"Direct instruction\",\n\"Practice\", \"Exit ticket\"]} returns {\"period_minutes\": 50, \"plan\":\n[{\"segment\": \"Warm-up\", \"start_min\": 0, \"duration_min\": 8}, ...],\n\"note\": \"...\"}.\n\nUse when one fixed class period must be divided into segments. Not for\nmulti-day planning and not for spaced review, which the personal server's\nspaced_repetition_plan builds. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"need segments and at least 5 minutes\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "minutes": {
                "description": "Length of the class period in minutes; at least 5, e.g. 50.",
                "minimum": 5,
                "type": "integer"
              },
              "segments": {
                "description": "Ordered segment names, e.g. [\"Warm-up\", \"Practice\", \"Exit ticket\"]; at least 1 entry.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["minutes", "segments"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Lesson Timer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:63a3de988c5e99c211676e81e302fd6791bd018fad36fe43506505e61cad382a"
        },
        {
          "name": "list_products",
          "title": "List Products",
          "description": "List the 8 educator products with their included skills. FREE.\n\nTakes no arguments. Typical input {} returns a list of 8 product objects, each {\"slug\":\n\"curriculum-architect-hs\", \"name\": ..., \"tagline\": ..., \"skills\": [\"Skill A\",\n...], \"free_skill\": \"Gateway Skill Name\"}. Use the returned slug values\nwith get_free_skill, get_full_product, or get_full_skill.\n\nReturns metadata only - no persona text and no skill instructions. Use\nwhen the caller wants to see what this server covers. Not for keyword\nsearch across the whole 138-product catalog, which the catalog server's\nsearch_catalog does, and not for instructions the caller can act on\n(get_free_skill). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"}. Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["result"],
            "type": "object",
            "x-fastmcp-wrap-result": true
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:0e87c34ce58351551184037524e9838bbe5fe10d872ca33c8f9b921cf1bf6187"
        },
        {
          "name": "readability_report",
          "title": "Readability Report",
          "description": "Analyze teaching text with Flesch-Kincaid readability and leveling advice. FREE.\n\nTypical input {\"text\": \"<passage>\", \"target_grade\": 6} returns\n{\"flesch_kincaid_grade\": 8.2, \"reading_ease\": 62.1, \"sentences\": N,\n\"words\": N, \"avg_words_per_sentence\": N, \"long_sentences_over_25w\": N,\n\"polysyllabic_words_sample\": [...], \"target_grade\": 6, \"gap\": 2.2,\n\"suggestions\": [\"...\"]}.\n\nUse on teaching text where the reading level matters. Not for scores\nstudents earned (grade_curve) and not for general prose style, which the\ncreator server's analyze_writing covers. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"empty text\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "target_grade": {
                "default": 0,
                "description": "Target grade level 1-12; when set, the report adds a gap assessment against it. 0 (default) skips it.",
                "type": "integer"
              },
              "text": {
                "description": "The passage to analyze, at least one full sentence of plain text; must be non-empty.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Readability Report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:d94ffb8e9f5f8b229e01894a8272daedf90befd919450f2b26219e03dfb674f4"
        }
