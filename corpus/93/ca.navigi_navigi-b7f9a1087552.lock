  "subjects": {
    "ca.navigi/navigi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.navigi.ca/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "navigi",
        "title": "Navigi: community services across Canada",
        "version": "1.0",
        "websiteUrl": "https://navigi.ca"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ask for services by need and place. Every row carries the page URL and the date that listing's own website was last checked: cite both. Nothing about the person asking is stored.",
      "tools": [
        {
          "name": "find_services",
          "title": "Find services by need and place",
          "description": "Find community and social services (food banks, shelters, counselling, legal aid, income help and 18 more needs) in a Canadian community on navigi.ca. Every row carries the public page URL and the date the listing's own website was last checked; cite the URL and the date.",
          "inputSchema": {
            "properties": {
              "free": {
                "description": "only services listed as free",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "what the person needs, in plain words: food bank, shelter, counselling, legal aid, income assistance, or a category slug",
                "type": "string"
              },
              "no_referral": {
                "description": "only services that take people without a referral",
                "type": "boolean"
              },
              "place": {
                "description": "community name, for example Truro",
                "type": "string"
              },
              "province": {
                "description": "two-letter province or territory code (ab, bc, on, qc, ns, nb, mb, sk, pe, nl, yt, nt, nu)",
                "type": "string"
              }
            },
            "required": ["need", "place", "province"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find services by need and place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:491baa4034304aca3c84a296cf75a0d2604ad036e36bbd1858930323ba10a6eb"
        },
        {
          "name": "get_community",
          "title": "Community overview",
          "description": "One community's listing counts by category and its page URL on navigi.ca.",
          "inputSchema": {
            "properties": {
              "community": {
                "description": "slug or name",
                "type": "string"
              },
              "province": {
                "type": "string"
              }
            },
            "required": ["community", "province"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Community overview"
          },
          "behavior": {
