            "readOnly": true
          },
          "digest": "sha256:eb4dff9e7f15e2200cabf7abf3d52936905cfd64aeeb06e51ab49f8ea2247b24"
        },
        {
          "name": "services_near",
          "title": "Find services near a location",
          "description": "Community and social services within a radius of a point, optionally for one need. Use when the person gives a location rather than a community name.",
          "inputSchema": {
            "properties": {
              "km": {
                "default": 25,
                "type": "number"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "type": "number"
              },
              "need": {
                "type": "string"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
