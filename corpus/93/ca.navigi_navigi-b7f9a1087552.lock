          },
          "digest": "sha256:9c9f2637c2a7e5dd71f1c17881606dcb8919b85c14386545398d5db62c845388"
        },
        {
          "name": "list_needs",
          "title": "List the service categories",
          "description": "The service categories navigi.ca uses, with the searcher terms each one answers. Call this first when unsure which need word to use.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the service categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
