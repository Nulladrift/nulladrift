      "instructions": "cv.cm is a free website of browser tools (images, PDF, audio, text, calculators, AI that runs on the user's device), personality tests, sourced rankings and datasets, tutorials and reference pages in nine languages. Use search_cv_cm to find a page and give the user its url: tools and tests run in the user's own browser tab, nothing is uploaded to cv.cm for them. Quote rankings and datasets with their source and link the cv.cm page.",
      "tools": [
        {
          "name": "get_cv_cm_dataset",
          "title": "Get a cv.cm dataset",
          "description": "Rows of a public reference table on cv.cm (World Bank indicators by country such as GDP, population and life expectancy; country rankings from published reports such as the Human Development Index and the World Happiness Report; game and console sales from Nintendo and Sony (consoles, Switch, Switch 2, PS5, PS4, best-selling Nintendo games); revenue, operating income and net income by fiscal year of US-listed companies such as NVIDIA, Apple, Microsoft, Alphabet (Google) and Amazon from their 10-K filings (SEC EDGAR, US$ millions in the rows); country, calling and currency codes; time zones; paper sizes; ASCII), with its source, licence, update date, CSV and page URL. ids: human-development-index, world-happiness-report, gender-inequality-index, global-innovation-index, nvidia-revenue, apple-revenue, microsoft-revenue, google-revenue, amazon-revenue, meta-revenue, tesla-revenue, netflix-revenue, walmart-revenue, salesforce-revenue, palantir-revenue, uber-revenue, best-selling-consoles, nintendo-switch-2-sales, nintendo-switch-sales, ps5-sales, ps4-sales, best-selling-nintendo-games, gdp, gdp-ppp, gdp-per-capita, gdp-ppp-per-capita, gni-per-capita, gdp-growth, inflation, unemployment, youth-unemployment, female-labor-force, exports, imports, remittances, foreign-reserves, military-spending, military-spending-gdp, rd-spending, gini-index, poverty-rate, population, population-growth, population-density, urban-population, aged-0-14, aged-65-plus, international-migrants, life-expectancy, life-expectancy-female, life-expectancy-male, fertility-rate, birth-rate, death-rate, infant-mortality, maternal-mortality, physicians, health-spending-per-capita, education-spending, literacy-rate, homicide-rate, suicide-rate, alcohol-consumption, tobacco-use, land-area, forest-area, co2-emissions, co2-per-capita, air-pollution, renewable-energy, electricity-access, electricity-consumption, internet-users, mobile-subscriptions, broadband-subscriptions, country-codes, calling-codes, currency-codes, time-zones, paper-sizes, ascii. world-happiness-report, best-selling-consoles, nintendo-switch-2-sales, nintendo-switch-sales, ps5-sales, ps4-sales, best-selling-nintendo-games return only the page and source links: their licence allows showing the figures, not a copy.",
