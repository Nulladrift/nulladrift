        {
          "name": "loan_programs",
          "title": "Loan programs",
          "description": "The National Loan Provider program set — dscr, dscr_cash_out, short_term_rental, fix_and_flip, ground_up, rental_portfolio, bridge, commercial — each with the parameters its page already publishes, its starting rate from the site's single rate source with the as-of stamp, and the page URL. Where a page states no figure, the tool states no figure.",
