          "name": "investor_lenders_by_state",
          "title": "Investor lenders by state",
          "description": "Top investment-property lenders in one of the 26 covered states, from 2025 HMDA loan-level data: lender name, LEI, loan count, volume, average loan and purchase share, plus state totals and the retrieval date. Read-only; figures are the filing record, not a recommendation.",
