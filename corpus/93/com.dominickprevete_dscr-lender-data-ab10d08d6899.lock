            "readOnly": true
          },
          "digest": "sha256:907b691bf26ff411fb98c9411d00a8bfbb141ea24f126b31bced06a862ffc58f"
        },
        {
          "name": "glossary_lookup",
          "title": "DSCR glossary lookup",
          "description": "Definitions from the DSCR and investor-loan glossary (26 terms). Pass a term to look it up (case-insensitive, partial matches accepted) or no argument to list every term. Definitions describe what a term is; none states a program parameter.",
