          "title": "Investor lenders, cross-state aggregate",
          "description": "Every HMDA filer across the 26 covered states grouped by LEI and ranked by 2025 investor-property loan count, with the number of states each filer reported in, the universe totals and the top-25 concentration share. The same computation https://dominickprevete.com/investor-property-lenders renders. A 26-state aggregate, not a national one.",
