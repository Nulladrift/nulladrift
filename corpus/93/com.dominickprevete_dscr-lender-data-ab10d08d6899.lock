      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only tools over data National Loan Provider already publishes at https://dominickprevete.com. Every response includes a disclosure field stating that figures are indicative and not an offer of credit. National Loan Provider (NLPI LLC) is a mortgage brokerage. It arranges, structures and places business-purpose financing across 100+ third-party lenders; it is not a lender and does not make credit decisions. Every figure in this response is indicative and published for reference only: it is not a quote, a commitment, or an offer of credit, and it is not an assessment of any borrower, property or transaction. Financing is business-purpose investor financing only; National Loan Provider does not arrange financing on owner-occupied residential properties or primary residences. The source and as-of date of the underlying data are stated in the source field.",
      "tools": [
        {
          "name": "about_national_loan_provider",
          "title": "About National Loan Provider",
          "description": "The entity answer: legal name, business model (a mortgage brokerage that arranges and places financing and is not a lender), business-purpose scope and the owner-occupied exclusion, address, phone, the states with published investor-lending data, and the canonical Person @id for the founder.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About National Loan Provider"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
