{
  "lockfileVersion": 2,
  "subjects": {
    "com.myanimetracker/myanimetracker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://myanimetracker.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "myanimetracker",
        "version": "1.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MyAnimeTracker is an anime tracker that keeps whole series in release order. These tools read its reviewed catalog: search titles, get a franchise's watch order, list which episodes are filler, see what is airing this week (its airing calendar), and see what MyAnimeTracker members added most lately. Results are safe-for-work titles, and carry structure only (order, counts, dates, episode numbers), never plot summaries. Pass along the source credits in each result when you repeat its data.",
      "tools": [
        {
          "name": "get_filler_guide",
          "title": "Get filler guide",
          "description": "List filler and recap episodes to skip, mixed episodes to keep, and separate novel adaptations. Novel adaptation: Adapted from an official novel, not the manga. Optional for manga-canon viewers, but not anime-original filler. Covers a small reviewed set of series and says so when a series is not covered. Episode numbers only, no plot details. Give a title or a catalog ID.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mal_id": {
                "description": "The catalog ID from a title search (the same number MyAnimeList uses). Use it instead of a title when you have it.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "integer"
              },
              "title": {
                "description": "The show's name, in English or romaji, for example \"Attack on Titan\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get filler guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://myanimetracker/cards-v1.html",
            "openai/toolInvocation/invoked": "Got the filler guide",
            "openai/toolInvocation/invoking": "Getting the filler guide",
            "ui": {
              "resourceUri": "ui://myanimetracker/cards-v1.html"
            },
            "ui/resourceUri": "ui://myanimetracker/cards-v1.html"
          },
          "digest": "sha256:c98fcbddb3c42bc9fd93f8b25116db3fb31a9c91266d674c58d40b19a7c1b3d1"
        },
        {
          "name": "get_watch_order",
          "title": "Get watch order",
          "description": "Get the release-order watch guide for an anime franchise: every season, film and special in the order they came out, where a new viewer can start, and how much filler each part has when that is known. This is release order, not story chronology. Give a title or a catalog ID.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mal_id": {
                "description": "The catalog ID from a title search (the same number MyAnimeList uses). Use it instead of a title when you have it.",
                "exclusiveMinimum": 0,
                "maximum": 10000000,
                "type": "integer"
              },
              "title": {
                "description": "The show's name, in English or romaji, for example \"Attack on Titan\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get watch order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://myanimetracker/cards-v1.html",
            "openai/toolInvocation/invoked": "Got the watch order",
            "openai/toolInvocation/invoking": "Getting the watch order",
            "ui": {
              "resourceUri": "ui://myanimetracker/cards-v1.html"
            },
            "ui/resourceUri": "ui://myanimetracker/cards-v1.html"
          },
          "digest": "sha256:79b91a54a2cd80f960fe5b75a128be6763495924124525167798a1be6c5e9fd1"
        },
        {
          "name": "popular_anime",
          "title": "Popular on MyAnimeTracker",
          "description": "List the anime that the most MyAnimeTracker members added to their lists over the last week (or month, when a week is quiet), with how many people added each. Counts only, never who. Safe-for-work titles only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many titles to list, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Popular on MyAnimeTracker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c115d8bab71de1ee6319cb7266eee019f3aee8b57bd80ce6e39fe1695f49b1af"
        },
        {
          "name": "search_anime",
          "title": "Search anime",
          "description": "Search the MyAnimeTracker anime catalog by title. Returns matching releases (TV seasons, films, OVAs, specials) with their catalog ID, format, year, episode count and page links. Safe-for-work titles only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "description": "Only this kind of release. Leave out to search all of them.",
                "enum": ["TV", "MOVIE", "OVA", "ONA", "SPECIAL"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many results to return, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a title, in English, romaji or Japanese.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search anime"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://myanimetracker/cards-v1.html",
            "openai/toolInvocation/invoked": "Searched the catalog",
            "openai/toolInvocation/invoking": "Searching the catalog",
            "ui": {
              "resourceUri": "ui://myanimetracker/cards-v1.html"
            },
            "ui/resourceUri": "ui://myanimetracker/cards-v1.html"
          },
          "digest": "sha256:446e302b359e8fcdf4135ff8f77719f096f46c6f2d382bb8c1465b5cbbef1f90"
        },
        {
          "name": "whats_airing",
          "title": "What is airing",
          "description": "List anime episodes airing over the next few days, by Japan broadcast date, from the MyAnimeTracker calendar, with broadcast times. Set mine to true for when the person's own shows air next. Safe-for-work titles only. Episode numbers and dates only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "days": {
                "default": 7,
                "description": "How many days ahead to list, starting today in Japan. 1 to 14.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "mine": {
                "default": false,
                "description": "Only the shows on the signed-in person's list: Watching and Plan to Watch, on any season of the series. Needs sign-in.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What is airing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://myanimetracker/cards-v1.html",
            "openai/toolInvocation/invoked": "Checked what is airing",
            "openai/toolInvocation/invoking": "Checking what is airing",
            "ui": {
              "resourceUri": "ui://myanimetracker/cards-v1.html"
            },
            "ui/resourceUri": "ui://myanimetracker/cards-v1.html"
          },
          "digest": "sha256:c198dad12a93749b9eeda107382b8ee9bc2d3fc50987ff29796d72b1d61ac8be"
        }
      ],
      "resources": [
        {
          "uri": "ui://myanimetracker/cards-v1.html",
          "name": "myanimetracker-cards",
          "title": "MyAnimeTracker cards",
          "description": "Cards for MyAnimeTracker tool results.",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "openai/widgetCSP": {
              "connect_domains": [],
