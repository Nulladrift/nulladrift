            "openai/widgetDomain": "https://myanimetracker.com",
            "openai/widgetPrefersBorder": false,
            "ui": {
              "csp": {
                "connectDomains": [],
                "resourceDomains": ["https://static.tvmaze.com", "https://artworks.thetvdb.com"]
              },
              "prefersBorder": false
            }
          },
          "digest": "sha256:ad4983d7a1b6f03f6c46099433e6ea563ff5d1be31bcd349db3849fc6e0d2ded"
        }
      ],
      "digest": "sha256:0ddfcc392d624425b63df518419f427ea2370a2b8d5baf8523cfdd9300f4ddaa"
    }
  }
}
