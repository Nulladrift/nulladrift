{
  "lockfileVersion": 2,
  "subjects": {
    "com.lexingtonthemes/lexington": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.lexingtonthemes.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Lexington",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_design",
          "description": "The theme's design system: typography recipes, what each colour scale means, spacing rhythm, components, do and don't, plus roles.json (the same as data: action, panel, ink, muted, rule, radius, heading and body recipes, measured from the sections). Read before changing anything visual, reskinning, or aliasing the palette onto a host.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "theme": {
                "type": "string"
              }
            },
            "required": ["theme"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5893ece991fd4a1ad9b71bd7e96e065ec837c129d2b26b70b3766ca565d9479b"
        },
        {
          "name": "get_guidelines",
          "description": "Read this first. How to install, fill and fit Lexington sections into an Astro + Tailwind project, and what not to change.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b81a1b868a4af0a44bdad62f4530ad9a0b6502878c6fff71cf6f85db0beebbda"
        },
        {
          "name": "get_sections",
          "description": "One or more sections with every file they need (fundations, icons, placeholder images), each with the path to write it to. Shared files are sent once. Ask for the whole page in one call. format 'tsx' returns React components (Next, Vite, Remix), format 'html' flat HTML with the Tailwind classes expanded (Vue, Svelte, plain HTML). Both are standalone sections only; parts have no flat export.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "format": {
                "description": "astro (default): .astro components with fundations. tsx: React components, no props, classes expanded. html: flat HTML, classes expanded.",
                "enum": ["astro", "tsx", "html"],
                "type": "string"
              },
              "have": {
                "description": "Install paths already written in this project; they are omitted from the reply.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ids": {
                "description": "Section ids from search_sections, in page order, e.g. ['brightlight/hero-1', 'brightlight/faq-1']",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:82aa7a5a8681a7376312dec0e120777eed6f04dd51ff0458782626dd15477a31"
        },
        {
          "name": "get_skill",
          "description": "The companion skill for a theme, to write into the project so the agent keeps the theme's rules on every later edit without calling this server: the theme's own design skill (typography, colour, spacing, components, do and don't) plus the shared Lexington sections skill (fill, fit, reskin, port). Call once per project after the first get_sections.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "target": {
                "description": "Where skills live in this project. cursor: .cursor/skills/ (default). claude: .claude/skills/. agents: one AGENTS.md block to append, for clients without skills.",
                "enum": ["cursor", "claude", "agents"],
                "type": "string"
              },
              "theme": {
                "type": "string"
              }
            },
            "required": ["theme"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e3a2ce6ef9db7690bd2607906bba7b1e5153a81bac69c5e6afbbba6560586e5"
        },
        {
          "name": "get_theme_setup",
          "description": "Once per project, per theme: tokens.css and Fonts.astro to write, plus the two setup steps. Call before the first get_sections for a theme.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "theme": {
                "type": "string"
              }
            },
            "required": ["theme"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b238ab3e6e41b36b196d2872af8ff98097ced86fff71823ad37cdbb42c63886"
        },
        {
          "name": "list_themes",
          "description": "Every theme available, with who it is for, its visual personality, fonts, light/dark mode and section count. Pick one theme per page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3dfa5b3a4f371d918e4034bc6de4f9befd11922b6d8b80291cc476758f02ae6"
        },
        {
          "name": "search_sections",
          "description": "Find sections by role and description. Returns id, group and a one-line description. Use the ids with get_sections.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "group": {
                "description": "Section group: heros, features, pricing, ctas, faqs, testimonials, landing",
                "type": "string"
              },
              "include_parts": {
                "description": "Also return cards that take props (kind: part). Default false.",
                "type": "boolean"
              },
              "mode": {
                "description": "Only themes with this colour mode",
                "enum": ["light", "dark", "light+dark"],
                "type": "string"
              },
              "query": {
                "description": "Words like 'hero split screenshot', 'pricing two tiers', 'faq'",
                "type": "string"
              },
              "theme": {
                "description": "Theme slug to restrict to",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10046d706f649cdec55ea696f7ce9128c8ac2d7bdfb97c081a90655c04bb3027"
        }
      ],
      "digest": "sha256:7b1eaca28c74e35dbae8f124595729814861710c3397e5732bc4ed5bb8dde519"
    }
  }
}
