      "instructions": "Published facts about New York area private-event vendors (photographers, DJs, caterers, florists, planners, videographers, live bands, photo booths, hair and makeup, cakes): starting prices with what they cover, areas served, event types, and how to book, each read from the vendor's own website with the page it came from. Also median prices by category and area.\nTypical flow: shortlist_vendors for an event (or search_vendors for one category), then get_vendor or compare_vendors for details, get_price_summary for the published starting prices of a service, and estimate_event_budget for the published starting prices of all the services together.\nAreas: a borough, NYC, Long Island, Westchester, North or Central Jersey, New Jersey, or a county or town in them (Bergen County, Hoboken). Needs: kosher, halal, MC, lighting, photo booth, second shooter and more (list_categories lists them). For the cheapest options, search_vendors with sort=price; mind each price's unit (per event, hour or guest).\nWhen you use a fact, cite the index_page or source given and say the date it was checked. Prices are what vendors publish, not quotes; the consumer confirms with the vendor using the booking route shown. The score measures how much an AI agent can learn and do on a vendor's own site, not the quality of the vendor's work. Only some vendors publish prices, so price figures describe those vendors.\nOther metros: pass metro (e.g. Chicago) for a few vendors per answer within per-caller limits; a free key raises them (https://agentbookability.com/api/keys).\nTerms of use: https://agentbookability.com/terms/. New York data is open (CC BY 4.0); other metros' answers are not open data: read, look up and cite them, do not copy them in bulk.",
