        {
          "name": "search",
          "title": "Search the index (ChatGPT-compatible)",
          "description": "For ChatGPT connectors and deep research only; other clients use search_vendors. Free-text search in the id-only shape they require: returns ids,\ntitles and URLs of vendors, price summaries and cost pages, to open with fetch. Words for a service, an area, an\nevent type and a dollar amount narrow the results. Other clients get full results in one call from\nsearch_vendors (structured filters, vendor cards) or get_price_summary (what a service costs).",
          "inputSchema": {
            "properties": {
              "metro": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional metro: \"Chicago\" and the other metros list_categories names. Omit for New York. An area naming a metro works too.",
                "title": "Metro"
              },
              "query": {
                "description": "What to look for in plain words, e.g. \"wedding DJ Brooklyn under 2000\" or \"how much does a florist cost in Queens\".",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "searchArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "SearchHit": {
                "properties": {
                  "id": {
                    "description": "Pass to fetch.",
                    "title": "Id",
                    "type": "string"
                  },
                  "title": {
                    "title": "Title",
                    "type": "string"
                  },
                  "url": {
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["id", "title", "url"],
                "title": "SearchHit",
                "type": "object"
              }
            },
            "properties": {
              "results": {
                "items": {
                  "$ref": "#/$defs/SearchHit"
                },
                "title": "Results",
                "type": "array"
              }
            },
            "required": ["results"],
            "title": "SearchResults",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the index (ChatGPT-compatible)"
          },
          "behavior": {
