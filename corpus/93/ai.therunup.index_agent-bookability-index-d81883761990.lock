        {
          "name": "search_vendors",
          "title": "Search vendors",
          "description": "Find New York area event vendors, in one category or across all, filtered by area, event type, maximum\npublished price, online booking or part of a name. Sorted by bookability score (how much an AI agent can\nlearn and do on the vendor's own site), then price. Each result has the starting price and what it covers,\nhow to book, and the index page to cite. For a ready shortlist across several categories, use\nshortlist_vendors; search is the id-only variant for ChatGPT.",
          "inputSchema": {
            "properties": {
              "area": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional area: NYC (any of the five boroughs), Manhattan, Brooklyn, Queens, Bronx, Staten Island, Long Island, Westchester, North Jersey or Central Jersey, or New Jersey for both; a county or town also works (Bergen County, Hoboken, Monmouth County). Omit for the whole New York area.",
                "title": "Area"
              },
              "books_online": {
                "default": false,
                "description": "Only vendors whose own site shows online booking.",
                "title": "Books Online",
                "type": "boolean"
              },
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Vendor category in plain words (\"DJ\", \"wedding photographer\", \"florist\"; in other metros also \"food truck\", \"officiant\", \"plumber\" and the rest list_categories gives). Omit to search every event category (trades only by name).",
                "title": "Category"
              },
              "event_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional event type in plain words: \"wedding\", \"bar mitzvah\", \"sweet 16\", \"birthday\", \"corporate holiday party\", \"baby shower\".",
                "title": "Event Type"
              },
              "has_price": {
                "default": false,
                "description": "Only vendors that publish a price.",
                "title": "Has Price",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "How many vendors to return, 1 to 25 (larger values are capped).",
                "title": "Limit",
                "type": "integer"
              },
              "max_price_usd": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only vendors whose published starting price is at or under this, in US dollars.",
                "title": "Max Price Usd"
              },
              "metro": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional metro: \"Chicago\" and the other metros list_categories names. Omit for New York. An area naming a metro works too.",
                "title": "Metro"
              },
              "name_contains": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Part of the vendor's name.",
                "title": "Name Contains"
              },
              "needs": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional things the vendor must offer, as its own website states: \"kosher\", \"halal\" (caterers), \"MC\", \"lighting\", \"photo booth\" (DJs, bands), \"second shooter\" (photographers), \"second videographer\", \"comes to you\" (hair and makeup), \"staff\" (caterers), \"delivery and setup\" (florists, cakes).",
                "title": "Needs"
              },
              "offset": {
                "default": 0,
                "description": "How many matches to skip, to page through a long list: pass next_offset from the previous result.",
