        {
          "name": "estimate_event_budget",
          "title": "Budget for an event",
          "description": "Several services together. The published starting prices of a whole event's vendors: for each service, the low, median and high published\nstarting price in the area, worked out for the guests and hours given, and the sum. Use it to answer \"what\nwill a DJ, photographer and caterer cost for a 120-guest bar mitzvah in Brooklyn\". For one service in\ndetail use get_price_summary; for actual vendors use shortlist_vendors.",
          "inputSchema": {
            "properties": {
              "area": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional area: NYC (any of the five boroughs), Manhattan, Brooklyn, Queens, Bronx, Staten Island, Long Island, Westchester, North Jersey or Central Jersey, or New Jersey for both; a county or town also works (Bergen County, Hoboken, Monmouth County). Omit for the whole New York area.",
                "title": "Area"
              },
              "categories": {
                "description": "The services the event needs, in plain words, e.g. [\"DJ\", \"photographer\", \"caterer\", \"cake\"]. Up to 8.",
                "items": {
                  "type": "string"
                },
                "title": "Categories",
                "type": "array"
              },
              "guests": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Number of guests. Catering and cakes, usually priced per guest, are worked out for this many.",
                "title": "Guests"
              },
              "hours": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Length of the event in hours. Where a service has per-hour prices, they are worked out for this long.",
                "title": "Hours"
