                "default": null,
                "description": "Optional budget per service, US dollars. Vendors whose published starting price fits come first.",
                "title": "Budget Usd"
              },
              "categories": {
                "description": "The services needed, in plain words, e.g. [\"DJ\", \"photographer\", \"florist\"]. Up to 6.",
                "items": {
                  "type": "string"
                },
                "title": "Categories",
                "type": "array"
              },
              "event_type": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional event type in plain words: \"wedding\", \"bar mitzvah\", \"sweet 16\", \"birthday\", \"corporate holiday party\", \"baby shower\".",
