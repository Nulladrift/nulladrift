{
  "lockfileVersion": 2,
  "subjects": {
    "com.firmfax/prop-firm-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://firmfax.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "firmfax",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "compare_firms",
          "description": "Two firms side by side. Reports each figure with its evidence state and whether the pair is comparable at all: a field neither firm records is not a tie, and a field only one records is not a win. No per-field winner is declared, because the direction of \"better\" for several of these is a judgement the published scoring model already makes; each firm's grade is returned alongside so the verdict comes from that model rather than from this tool.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "First firm slug.",
                "type": "string"
              },
              "b": {
                "description": "Second firm slug.",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e1576e68da8b8d68539881d44efc8c5af38421234fd75659621ffc193b5bc87"
        },
        {
          "name": "find_firms",
          "description": "Firms matching every criterion given. A firm whose record does not carry a criterion is never counted as a match and never silently dropped: it is returned separately under unknown, with the field that could not be tested. Absence is common here, so read counts before treating the matched list as the answer.",
          "inputSchema": {
            "properties": {
              "assetClass": {
                "description": "Firms recorded as offering this. 21 of 71 records name no asset class and are returned as unknown.",
                "enum": ["forex", "futures", "crypto"],
                "type": "string"
              },
              "dailyLossLimitUnit": {
                "description": "The unit maxDailyLossLimit is in. Daily loss limits are recorded in percent at some firms and in dollars at others, and the two are never compared: a firm recorded in the other unit is returned under unknown with its unit named.",
                "enum": ["percent", "usd"],
                "type": "string"
              },
              "maxActivationFee": {
                "description": "Activation fee at or below this. 42 of 71 record no fee.",
                "type": "number"
              },
              "maxConsistencyPct": {
                "description": "Consistency rule at or below this. 28 of 71 record none.",
                "type": "number"
              },
              "maxDailyLossLimit": {
                "description": "Daily loss limit at or below this, in the unit dailyLossLimitUnit names. 31 of 71 record none.",
                "type": "number"
              },
              "maxMinDaysToPayout": {
                "description": "Minimum days to first payout at or below this, counted as minDaysToPayoutUnit names. 26 of 71 record none.",
                "type": "number"
              },
              "maxMinTradingDays": {
                "description": "Minimum trading days at or below this, counted as minTradingDaysUnit names. 16 of 71 record none.",
                "type": "number"
              },
              "maxResetFee": {
                "description": "Reset fee at or below this. 56 of 71 record no fee.",
                "type": "number"
              },
              "minDaysToPayoutMinProfit": {
                "description": "With winning_days only: the profit a day must reach to count. A firm whose winning days carry a different profit bar is returned under unknown.",
                "type": "number"
              },
              "minDaysToPayoutUnit": {
                "description": "What maxMinDaysToPayout counts: calendar_days, trading_days or winning_days. A wait is compared only with waits counted the same way; a firm counting another way, or stating no unit, is returned under unknown with what it counts named.",
                "enum": ["calendar_days", "trading_days", "winning_days"],
                "type": "string"
              },
              "minTradingDaysMinProfit": {
                "description": "With winning_days only: the profit a day must reach to count. A firm whose winning days carry a different profit bar is returned under unknown.",
                "type": "number"
              },
              "minTradingDaysUnit": {
                "description": "What maxMinTradingDays counts: calendar_days, trading_days or winning_days. A minimum is compared only with minimums counted the same way; a firm counting another way, or stating no unit, is returned under unknown with what it counts named.",
                "enum": ["calendar_days", "trading_days", "winning_days"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0622b0a6b0f2e4320f4ea6c00690ef846fc3a8371753fdcdaa2d5e735acae58a"
        },
        {
          "name": "get_evidence",
          "description": "The stored reading behind a figure: the verbatim quote, the page it came from, and the date we read it. Answers \"we hold none\" explicitly rather than returning an empty list. `outcome` is load-bearing: a `contradicted`, `contradiction` or `absent` row records what we read, not a figure we publish. Use get_firm for the published figure.",
          "inputSchema": {
            "properties": {
              "field": {
                "description": "One field path, e.g. \"rules.dailyLossLimit\". Omit for every field we hold for this firm.",
                "type": "string"
              },
              "slug": {
                "description": "The firm slug, e.g. \"topstep\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:55040a480f91499761844e8a9697590b80b6d522b42479cdbbdfd66dba7fc268"
        },
        {
          "name": "get_firm",
          "description": "One prop trading firm. Every figure states whether we hold evidence for it, and a firm whose score range spans more than one band carries no letter grade at all.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The firm slug, e.g. \"topstep\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fbbdee93ad3ef8a0926e866d326c1fdc123d6097efacf9e83508474c74555e25"
        },
        {
          "name": "get_rule_changes",
          "description": "The dated record of what changed, newest first. Every entry states its KIND, and most of this tape is FirmFax correcting its own data rather than a firm changing its rules. Read counts before describing industry activity: a total taken across kinds overstates it.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "firm = the firm changed a rule. record = FirmFax corrected its own data. withdrawn = we published an entry and then retracted it.",
                "enum": ["firm", "record", "withdrawn"],
                "type": "string"
              },
              "limit": {
                "description": "How many entries to return, newest first. Default 50.",
                "type": "number"
              },
              "since": {
                "description": "ISO date, e.g. \"2026-08-01\". Entries dated on or after it.",
                "type": "string"
              },
              "slug": {
                "description": "Limit to one firm. Omit for every firm.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46e94ebfbb9bbfb3f2ffd30cade472c3498ae4cca2e022cab3550decb175dc79"
        },
        {
          "name": "list_firms",
          "description": "Every firm slug and name. Carries no figures, so nothing here needs evidence.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e7bc3dbeebd4c2e71b27d3bd63ee8ce2df19680a7092205ed1b226f40fff687"
        }
      ],
      "digest": "sha256:f9b775d4d8637008304fca5a28fdc2f13f7a76b33a4d911265a3f27959b6d67e"
    }
  }
}
