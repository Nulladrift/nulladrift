{
  "lockfileVersion": 2,
  "subjects": {
    "com.hutlists/hutlists": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hutlists.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Hutlists",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hutlists is a directory of mountain huts in the Alps: 5,630 huts across Italy, Austria, Switzerland, France, Germany, Slovenia and Liechtenstein, built from OpenStreetMap, the Club Alpino Italiano's hut registry and AI-assisted enrichment.\n\nHow to use it well:\n- Start with list-regions to find valid country and region slugs, then search-huts to find candidates, then get-hut for the full record of a specific hut.\n- Record completeness varies: check each hut's data_quality and last_updated. A null field means the value is UNKNOWN, not \"no\" — never tell a user a hut has no WiFi, no phone or no beds because a field is null.\n- get-hut-availability only has data for a small slice of huts. An answer with coverage \"none\" and a reason is a real, correct answer: pass the reason on and point the user to the hut's booking_url.\n- list-guides returns long-form route and region guides, each with the slugs of the huts it discusses.\n\nLicence: the geographic core is ODbL © OpenStreetMap contributors; descriptions and enrichment are © Hutlists. When you use a hut's data, cite it with the hut's url.",
      "tools": [
        {
          "name": "get-hut",
          "title": "Get Hut Tool",
          "description": "Get the full record for one hut: location, elevation, season, capacity, facilities, booking, contact, access routes, FAQs and photos with credits.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Hut slug from search-huts, e.g. \"franz-senn-hutte\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:29be543b08bb1156e9bba5cfd12d2c33202de6d6ae20c087796c9232caddf029"
        },
        {
          "name": "get-hut-availability",
          "title": "Get Hut Availability Tool",
          "description": "Free beds per night for one hut, where we hold current data. Most huts have none, and data that is too old or cannot be refreshed is withheld: the answer then says coverage \"none\" with a machine-readable reason, a plain-language message and the hut's booking link, which is a correct answer to pass on.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "First night, YYYY-MM-DD (default today).",
                "type": "string"
              },
              "slug": {
                "description": "Hut slug from search-huts.",
                "type": "string"
              },
              "to": {
                "description": "Last night, YYYY-MM-DD (default 30 days after from).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:755b34e3917c02bdc684706bfc56a0318dc1c1d0773a4f00f640a6305864a942"
        },
        {
          "name": "list-guides",
          "title": "List Guides Tool",
          "description": "List published route and region guides (e.g. Alta Via 1, Tour du Mont Blanc, Julian Alps), each with its URL and the slugs of the huts it discusses.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:91fceb519327a674b54e2de127a058943e50f8c6670b4640a76016de724d94b3"
        },
        {
          "name": "list-regions",
          "title": "List Regions Tool",
          "description": "List the countries and regions in the directory with their slugs and hut counts. Call this first to find valid slugs for search-huts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3ca6fe4fffa2d852f2d1ffc24b7508da2f178eeab8d64e5d489c4d377f429992"
        },
        {
          "name": "search-huts",
          "title": "Search Huts Tool",
          "description": "Search Alpine mountain huts by country, region, name, access difficulty, minimum elevation or proximity to a point. Returns a page of hut summaries with slugs for get-hut.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country slug from list-regions, e.g. \"austria\".",
                "type": "string"
              },
              "difficulty": {
                "description": "Access difficulty.",
                "enum": ["easy", "moderate", "demanding", "technical"],
                "type": "string"
              },
              "min_elevation": {
                "description": "Minimum elevation in metres.",
                "type": "integer"
              },
              "near": {
                "description": "\"latitude,longitude\" to search around, e.g. \"46.02,7.75\".",
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1.",
                "type": "integer"
              },
              "per_page": {
                "description": "Results per page (max 100).",
                "type": "integer"
              },
              "q": {
                "description": "Free-text match on the hut name.",
                "type": "string"
              },
              "radius_km": {
                "description": "Radius around `near` in km (default 25, max 200).",
                "type": "number"
              },
              "region": {
                "description": "Region slug from list-regions, e.g. \"tyrol\".",
                "type": "string"
              },
              "sort": {
                "description": "Sort order.",
                "enum": ["score", "elevation", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2284b3aa7053c89770ee6b8aa2909502da4c0ebec6555e12f5700d1ff882c901"
        }
      ],
      "digest": "sha256:d52ea8cae04979bda22daec00ce136cb42984103488118935410b7390800eb7a"
    }
  }
}
