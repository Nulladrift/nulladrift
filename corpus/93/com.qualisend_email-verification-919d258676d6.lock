        {
          "name": "check_typo",
          "title": "Suggest a fix for a mistyped email",
          "description": "Spot a likely typo in an email's domain (like gmial.com) and suggest the correct one, so you don't lose contacts to misspelled addresses. No credit used. Available on the Qualisend Pro plan.",
