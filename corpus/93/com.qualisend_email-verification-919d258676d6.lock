        {
          "name": "generate_dns_record",
          "title": "Create an email-authentication DNS record",
          "description": "Create the exact DNS setting a domain needs so its email is trusted and harder to spoof - SPF, DMARC, BIMI, or MTA-STS. Returns the record to copy into DNS, with where to put it. No credit used. Available on the Qualisend Pro plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "all": {
                "description": "SPF: how strict to be with everyone else (default ~all).",
                "enum": ["~all", "-all", "?all"],
                "type": "string"
              },
              "authorityUrl": {
                "description": "BIMI: https link to the VMC certificate.",
                "type": "string"
              },
              "domain": {
                "description": "The domain the record is for.",
                "type": "string"
              },
              "includes": {
                "description": "SPF: services allowed to send (e.g. _spf.google.com).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ip4": {
                "description": "SPF: allowed IPv4 addresses/ranges.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "ip6": {
                "description": "SPF: allowed IPv6 addresses/ranges.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "logoUrl": {
                "description": "BIMI: https link to the brand's SVG logo.",
                "type": "string"
              },
              "mode": {
                "description": "MTA-STS: policy mode (default testing).",
                "enum": ["enforce", "testing", "none"],
                "type": "string"
              },
              "mxHosts": {
                "description": "MTA-STS: the domain's mail-server hostnames.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pct": {
                "description": "DMARC: percent of mail the policy applies to.",
                "type": "number"
              },
              "policy": {
                "description": "DMARC: what to do with mail that fails checks.",
                "enum": ["none", "quarantine", "reject"],
                "type": "string"
              },
              "rua": {
                "description": "DMARC: email to receive summary reports.",
                "type": "string"
              },
              "ruf": {
                "description": "DMARC: email to receive detailed failure reports.",
                "type": "string"
              },
              "type": {
                "description": "Which record to create.",
                "enum": ["spf", "dmarc", "bimi", "mta-sts"],
                "type": "string"
              }
            },
            "required": ["domain", "type"],
            "type": "object"
          },
