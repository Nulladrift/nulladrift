      "capabilities": {
        "tools": {}
      },
      "instructions": "Verify and clean email addresses with Qualisend. Core tools: verify_email (one address), verify_emails (a batch, up to 50), verify_list (a large list, up to 1000, async - returns a job_id to poll), get_verification (result/progress by job_id), get_credit_balance. The Pro plan adds deliverability tools: check_domain (is a domain set up so its email reaches the inbox), generate_dns_record (create SPF/DMARC/BIMI/MTA-STS records), analyze_email_header (why a message was slow or went to spam), check_disposable, check_typo, and lookup_smtp_code (explain a mail-server error code). check_blacklist (is a domain/IP on email blacklists) needs the Blacklist Monitoring add-on. When a user asks what you can do, explain these in simple, everyday terms - avoid technical jargon.",
      "tools": [
        {
          "name": "analyze_email_header",
          "title": "Analyze an email's headers",
          "description": "Read the hidden technical details of an email (its 'headers') to show the route it took, how long each step took, and whether it passed spam/authentication checks - handy for figuring out why a message was slow or went to spam. Paste the message source / 'Show original'. No credit used. Available on the Qualisend Pro plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "raw": {
                "description": "The raw email headers (paste the message source).",
                "type": "string"
              }
            },
            "required": ["raw"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze an email's headers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc257753bbacf0e650b6937a3dad5e8e857c59087a372077f64e3a20eea0e993"
        },
        {
          "name": "check_blacklist",
          "title": "Check a domain or IP against email blacklists",
          "description": "Check whether a sending domain or IP is currently on any of the major email blacklists that can push your mail to spam - a point-in-time reputation check across lists like Spamhaus, SpamCop, and Barracuda. No credit used. Requires the Qualisend Blacklist Monitoring add-on. Read the result carefully: `listed_on` are confirmed listings, while `undetermined_on` are lists that did not answer (commonly Spamhaus refusing a shared resolver). `clean` is true only when every list answered and none matched, so a non-empty `undetermined_on` means those lists are UNKNOWN - do not report them as clear or as listings.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "target": {
                "description": "A domain (acme.com) or an IPv4 address.",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a domain or IP against email blacklists"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:910424d949c69cd1c48da71e859829e69a0a6dc7e31d19cececbca96b851401a"
        },
