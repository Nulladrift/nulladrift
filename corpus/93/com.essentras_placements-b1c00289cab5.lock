      "instructions": "Essentras sells article placements in 3,800+ vetted media outlets. Most are published as standard editorial articles with no sponsored label; a minority carry a sponsored or discreet disclosure, and every offer states which under link.disclosure. Every outlet has a fixed USD price, a stated turnaround, and a known link policy (dofollow, indexed, sponsored tag). Typical flow: search_outlets with the buyer budget and goal, then quote_placements on the chosen ids. quote_placements returns a checkout_url, which is where the buyer confirms the basket and authorizes payment. Without an API key the server cannot take payment and holds no payment method. The card is charged at checkout, and the order is refunded if the placement is not published or the stated turnaround is missed (turnaround counted in business days, paused while waiting on the buyer, plus a 3 business day grace period; see https://essentras.com/legal/refunds). Account holders can connect with an Essentras API key (Authorization: Bearer ess_live_...). The same tools then return the account's own prices (including reseller price books), and account tools appear: get_account, create_order (pays from the account's prepaid wallet, requires expected_total_usd from quote_placements and an idempotency_key), list_orders, get_order and submit_brief. Full documentation is at https://essentras.com/developers Free case checkers diagnose a case before anyone buys: check_review_removability (a Google review), check_knowledge_panel_readiness, check_wikipedia_notability, find_removal_route (something about a person in Google) and check_instagram_recovery_path. They take facts about the case as fixed choices, never a name, email, handle or link, and give the same answer as the free tools on essentras.com, including what the person can do themselves for free. Google, Wikipedia volunteers or Meta make the final decision, so no checker promises an outcome, and a refund is never a promise of removal. Services beyond placements (Knowledge Panels, review removal, removal from Google, Wikipedia, account recovery, verification, AI visibility) are priced by list_services and quote_service, which return the price, the refund terms, who decides, and the page where the buyer pays (start_url) or books the free assessment.",
      "tools": [
        {
          "name": "check_instagram_recovery_path",
          "title": "Find the official Instagram recovery route",
          "description": "Free and read-only. For the legitimate owner of an Instagram account that was hacked, disabled, locked at a checkpoint, locked by lost 2-factor, or whose email and phone are no longer reachable, returns the official recovery route, the same one as the free checker on essentras.com. Ask only what happened; never the handle, email, phone, password or a code. Returns the route, the owner’s own first step, Instagram’s official help pages with the date they were read, Meta’s position on timing, scam warning signs, and the Essentras recovery service with its current price. Official channels only: no hacking and no account access. Meta decides, and nobody can promise a recovery or a timeline.",
          "inputSchema": {
            "properties": {
              "situation": {
                "description": "What happened to the account? hacked = Hacked (password, email, or phone changed by someone else); noemailphone = Cannot access the old email or phone number; disabled = Disabled by Meta (policy decision); locked = Locked / security checkpoint / new-device prompt; twofa = Lost access with two-factor on (lost phone or authenticator).",
                "enum": ["hacked", "noemailphone", "disabled", "locked", "twofa"],
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the official Instagram recovery route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d7c83616756bad911097ef807de17c202caa6df0867ef3ae4258dd85da33029"
        },
        {
          "name": "check_knowledge_panel_readiness",
          "title": "Score Google Knowledge Panel readiness",
          "description": "Free and read-only. Scores how ready a person or business is for a Google Knowledge Panel, the same score as the free Entity Readiness Check on essentras.com. Ask the person 11 multiple-choice questions about their sources and what Google shows today (never their name or links): the subject, the panel state, and coverage, quality, wikipedia, wikidata, home, profiles, records, demand, unique. With every answer it returns the score out of 100, the band, each gap with points to gain and the next action, the right next step (claim, edit or fix an existing panel for free, build sources, or the Essentras service with its current price for a strong candidate), and Google sources with read dates. With answers missing it returns the questions still to ask. The score is an Essentras rule of thumb, not a Google metric. Google decides whether to show a panel, and paid placements are paid editorial, not independent coverage.",
          "inputSchema": {
            "properties": {
              "coverage": {
                "description": "How many independent articles are mainly about you, on sites you do not control? Count articles where you are the main subject. Leave out your own site, your profiles, press releases and anything you paid for. c0 = None yet; c1 = 1 to 2; c3 = 3 to 5; c6 = 6 or more.",
                "enum": ["c0", "c1", "c3", "c6"],
                "type": "string"
              },
              "demand": {
                "description": "Do people search for your name? Check Search Console for queries that contain your name, or see whether Google suggests your name as you type it. s2 = Yes, regularly; s1 = A little; s0 = No, or I do not know.",
                "enum": ["s2", "s1", "s0"],
                "type": "string"
              },
              "home": {
                "description": "Do you have an official page that is only about you, with Person or Organization structured data? h2 = Yes, with structured data and sameAs links to my profiles; h1 = A page exists, but without structured data; h0 = No dedicated page.",
                "enum": ["h2", "h1", "h0"],
                "type": "string"
              },
              "profiles": {
                "description": "Do your main profiles use the same name, title and description, and link to that page? LinkedIn, X, Instagram, YouTube, Facebook, Crunchbase, author or artist profiles. p2 = Yes, all of them; p1 = Some of them; p0 = No, they differ.",
                "enum": ["p2", "p1", "p0"],
                "type": "string"
              },
              "quality": {
                "description": "What is the strongest coverage you have? q0 = Nothing yet; q1 = Press releases, sponsored or paid articles, or my own posts; q2 = Trade, local or niche outlets with editorial staff; q3 = National or international outlets with editorial staff.",
                "enum": ["q0", "q1", "q2", "q3"],
                "type": "string"
              },
              "records": {
                "description": "Are you listed in the reference databases of your field? Business: company registry, Crunchbase. Author: ISBN or library records. Musician: MusicBrainz, Discogs. Film: IMDb. Researcher: ORCID, Google Scholar. r2 = Yes, in 2 or more; r1 = Yes, in 1; r0 = Not yet.",
                "enum": ["r2", "r1", "r0"],
                "type": "string"
              },
              "state": {
                "description": "What does Google show today when you search your exact name? none = No panel for me; unclaimed = A panel about me that I have not claimed; claimed = A panel I already manage; wrong = A panel with wrong facts, or mixed up with someone else.",
                "enum": ["none", "unclaimed", "claimed", "wrong"],
                "type": "string"
              },
              "subject": {
                "description": "Who is the panel for? person = A person (Founder, executive, author, creator, artist or expert); business = A business or organization (Company, brand, nonprofit or product).",
                "enum": ["person", "business"],
                "type": "string"
              },
              "unique": {
                "description": "When you search your exact name, whose results dominate? u2 = Mostly mine; u1 = Mixed with other people or things; u0 = Mostly someone or something else.",
                "enum": ["u2", "u1", "u0"],
                "type": "string"
              },
              "wikidata": {
                "description": "Is there a Wikidata item about you? d2 = Yes, with references to independent sources; d1 = Yes, but with few or no references; d0 = No, or I do not know.",
                "enum": ["d2", "d1", "d0"],
                "type": "string"
              },
              "wikipedia": {
                "description": "Is there a Wikipedia article about you? w1 = Yes; w0 = No.",
                "enum": ["w1", "w0"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Score Google Knowledge Panel readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc0f4f93614ee9351e395ea736ec950351b6f277db83d34b9fa6062830884cb5"
        },
        {
          "name": "check_review_removability",
          "title": "Check whether a Google review is removable",
          "description": "Free and read-only. Tells a business owner whether a Google review matches one of Google’s named review rules, the same verdict as the free checker on essentras.com. Ask the person for facts only, never the review text, a name or a link: whose review it is, whether the reviewer was a real customer, what the review contains, whether they can show it, and where they are in Google’s process. Returns the verdict (strong match, arguable, or no policy match), Google’s rule with its policy link and the date it was read, where to report, the evidence to attach, Google’s stated timing, the appeal path, report and reply templates, and the Essentras service with its current price only when the page offers it. A genuine negative review gets “No policy match”: Google does not remove a review for being negative, and the tool says so. Google decides every removal.",
          "inputSchema": {
            "properties": {
              "contains": {
                "description": "When ownership is business. What does the review contain? Select all that apply. Not a genuine experience: conflict = Written by a competitor, a current or former employee, a relative, or someone else with a conflict of interest; incentivized = Paid for or incentivized by anyone (money, discount, free product or service); burst = Part of a sudden burst of similar reviews from accounts you cannot match to customers; duplicate = The same or near-identical text posted more than once, from 1 account or several; impersonation = Posted by someone pretending to be another person, a business or an official. Breaks a rule in the text itself: harassment = Threats, doxxing, or sexualized remarks about a person; hate = Slurs, or calls for violence against a protected group; profanity = Profanity or obscenity used to offend; personal-info = A private person’s home address, phone number, photo, or financial, medical or ID details; advertising = An advert, a phone number or a link; wrong-business = About a different business or location; gibberish = Meaningless characters. Judgment calls (decided case by case): staff-name = Names a staff member or another private person by full or last name (not a first name alone); accusation = Accuses you or your staff of a crime or unethical conduct, with nothing to back it up; false-claims = Describes what you sell or do in a way that is false; rant = Political or social commentary, or a rant that is not about a visit. Not a rule violation: genuine = A real customer describing a bad experience; harsh = Harsh, exaggerated or unfair, but based on a real visit; old = Old, and the business has changed since; star-only = A low star rating with no text, from a real customer. Also happening: extortion = Someone demanded money or a favor to remove, or not post, reviews.",
                "items": {
                  "enum": ["conflict", "incentivized", "burst", "duplicate", "impersonation", "harassment", "hate", "profanity", "personal-info", "advertising", "wrong-business", "gibberish", "staff-name", "accusation", "false-claims", "rant", "genuine", "harsh", "old", "star-only", "extortion"],
                  "type": "string"
                },
                "maxItems": 21,
                "type": "array"
              },
              "customer": {
                "description": "When ownership is business. Was the reviewer a real customer? Search bookings, orders, invoices and your CRM by name, email, phone and the dates the review mentions. yes = Yes, I can match them to a visit or order; no-record = No record after searching; unsure = Not sure yet.",
                "enum": ["yes", "no-record", "unsure"],
                "type": "string"
              },
              "evidence": {
                "description": "Can you show it? Only for selected items that need proof: yes = the owner has it now, not-yet = not yet. A missing answer counts as not-yet. Items whose proof is the review text itself need no answer.",
                "properties": {
                  "accusation": {
                    "description": "Proof: Documents showing the allegation has no basis; The exact words, quoted.",
                    "enum": ["yes", "not-yet"],
                    "type": "string"
                  },
                  "burst": {
                    "description": "Proof: Every review link with its date; Your record search for each reviewer name; Matching wording or naming patterns across accounts.",
                    "enum": ["yes", "not-yet"],
                    "type": "string"
                  },
                  "conflict": {
                    "description": "Proof: Employment dates and role (dates only, no HR file); The reviewer’s public profile showing the link to a competitor; Any detail only an insider would know; A dated screenshot of the review.",
                    "enum": ["yes", "not-yet"],
                    "type": "string"
                  },
                  "duplicate": {
                    "description": "Proof: Links to every copy of the text; A dated screenshot of the review.",
                    "enum": ["yes", "not-yet"],
                    "type": "string"
                  },
                  "false-claims": {
                    "description": "Proof: Documents that contradict the specific claim (price lists, invoices, logs); The exact words, quoted.",
                    "enum": ["yes", "not-yet"],
                    "type": "string"
                  },
                  "impersonation": {
                    "description": "Proof: A statement from the person or organization named, saying they did not post it; A dated screenshot of the review.",
                    "enum": ["yes", "not-yet"],
                    "type": "string"
                  },
                  "incentivized": {
                    "description": "Proof: The offer, listing or message that paid for reviews; Screenshots with dates; A dated screenshot of the review.",
                    "enum": ["yes", "not-yet"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "false_facts": {
                "default": "no",
                "description": "Does it state specific facts about your business that are false? no = No, it is opinion or a real experience; docs = Yes, and I have documents that prove it; no-docs = Yes, but no documents yet.",
                "enum": ["no", "docs", "no-docs"],
                "type": "string"
              },
              "ownership": {
                "description": "Whose review is it? mine = I wrote it; business = It is about my business; other = It is about another business.",
                "enum": ["mine", "business", "other"],
                "type": "string"
              },
              "status": {
                "default": "not-reported",
                "description": "Where are you in the process? not-reported = Not reported yet; pending = Decision pending; no-violation = Report reviewed - no policy violation; escalated = Escalated - check your email for updates; appeal-denied = Appeal decided, review still up; removed = Removed.",
                "enum": ["not-reported", "pending", "no-violation", "escalated", "appeal-denied", "removed"],
                "type": "string"
              }
            },
            "required": ["ownership"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether a Google review is removable"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04ba5f48a27b6dd5da683b9538a678574a7534d198d79a1cc4922822c49f659b"
        },
        {
          "name": "check_wikipedia_notability",
          "title": "Check Wikipedia notability, source by source",
          "description": "Free and read-only. Tests a subject’s sources against Wikipedia’s notability guidelines (WP:GNG, WP:NCORP, WP:BASIC, WP:CREATIVE), the same verdicts as the free checker on essentras.com. Ask the person what the article would be about, their connection to it, and for each source its type and 5 yes, no or unsure answers (never the outlet, headline, link or the person’s name). Returns a verdict per source (counts, supports facts only, does not count, unclear, counts once) with the Wikipedia rule, its link and the date it was read, an overall band, disclosure duties for a conflict of interest or paid editing, and the Essentras service with its current price only when the band is \"Reviewer judgment applies\". Press releases, sponsored articles and paid placements, Essentras placements included, never count toward notability. The bands are an Essentras rule of thumb, and volunteer reviewers decide.",
          "inputSchema": {
            "properties": {
              "connection": {
                "default": "none",
                "description": "What is your connection to it? none = No connection; coi = It is me, my employer or someone close to me; paid = I am paid or rewarded to work on it; client = I am hiring someone to do it.",
                "enum": ["none", "coi", "paid", "client"],
                "type": "string"
              },
              "criteria": {
                "description": "People and creative professionals only. Does any of these apply? Alternative routes for people (WP:ANYBIO): nbio:0 = A well-known and significant award or honor, or several nominations for one; nbio:1 = A widely recognized contribution that is part of the enduring historical record in their field; nbio:2 = An entry in a country’s standard national biographical dictionary. Creative professional criteria (WP:CREATIVE): creative:0 = Regarded as an important figure, or widely cited by peers or successors; creative:1 = Known for originating a significant new concept, theory or technique; creative:2 = Created a significant or well-known work that has been the primary subject of multiple independent articles or reviews; creative:3 = Work that became a significant monument, was a substantial part of a significant exhibition, won significant critical attention, or is held in the permanent collections of several notable galleries or museums.",
                "items": {
                  "enum": ["nbio:0", "nbio:1", "nbio:2", "creative:0", "creative:1", "creative:2", "creative:3"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "single_event": {
                "description": "People and creative professionals only. Is almost all of the coverage about a single event?",
                "enum": ["yes", "no", "unsure"],
                "type": "string"
              },
              "sources": {
                "description": "Your sources, up to 25. Start with your strongest. Each source is judged on its own, then the list is judged as a whole. Give each source its type and, for the types that can count, the answers to the 5 questions (yes, no or unsure). Never send the outlet, headline or link: the type and the answers decide the verdict.",
                "items": {
                  "properties": {
                    "duplicate": {
                      "description": "Is it a reprint of another source on your list, or by the same author or series as one? Counts once with the earlier source when the answer is yes.",
                      "enum": ["yes", "no", "unsure"],
                      "type": "string"
                    },
                    "original": {
                      "description": "Is it original reporting or analysis, not a rewrite of an announcement? Churnalism when the answer is no.",
                      "enum": ["yes", "no", "unsure"],
                      "type": "string"
                    },
                    "reach": {
                      "description": "Companies and organizations only. Is the outlet regional, statewide, national or international, not only local?",
                      "enum": ["yes", "no", "unsure"],
                      "type": "string"
                    },
                    "reliable": {
                      "description": "Does the outlet have real editorial oversight, such as staff editors, corrections and fact-checking? Not reliable when the answer is no.",
                      "enum": ["yes", "no", "unsure"],
                      "type": "string"
                    },
                    "significant": {
                      "description": "Is it mainly about the subject, and in depth? Not significant coverage when the answer is no.",
                      "enum": ["yes", "no", "unsure"],
                      "type": "string"
                    },
                    "subject_involved": {
                      "description": "Did the subject, or anyone acting for it, write, pitch, supply, place or pay for it? Not independent when the answer is yes.",
                      "enum": ["yes", "no", "unsure"],
                      "type": "string"
                    },
                    "type": {
                      "description": "Type of source. staff = Staff-written news report, feature or investigation; book = Book, academic paper or peer-reviewed study; review = Independent review or critical study of the subject’s work; local = Local newspaper, TV or radio report; trade = Trade or industry publication; interview = Interview, Q&A, podcast or profile in the subject’s own words; pressrelease = Press release, newswire pickup or a story closely rewritten from one; paid = Sponsored post, advertorial or paid placement; contributor = Contributor post with no real editorial oversight (for example non-staff Forbes, Inc.com or TechCrunch contributors); routine = Funding, launch, hire, results, partnership or other routine announcement; listing = Directory, database, ranking, best-of list or award list; own = Own website, blog, social media, LinkedIn, Crunchbase or IMDb profile; mention = Passing mention or quote in an article about something else.",
                      "enum": ["staff", "book", "review", "local", "trade", "interview", "pressrelease", "paid", "contributor", "routine", "listing", "own", "mention"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "maxItems": 25,
                "type": "array"
              },
              "subject": {
                "description": "What is the article about? person = A person (WP:BASIC); org = A company or organization (WP:NCORP); creative = An author, artist, journalist or other creative professional (WP:CREATIVE); other = Something else (an event, book, film, website or product) (WP:GNG).",
                "enum": ["person", "org", "creative", "other"],
                "type": "string"
              }
            },
            "required": ["subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Wikipedia notability, source by source"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b85392fee3dd0677f7df7c0bc040ac6c3766e8727952dc44491e99db1a7a4c7c"
        },
        {
          "name": "find_removal_route",
          "title": "Find the route to remove something from Google",
          "description": "Free and read-only. For something about a person that shows in Google (contact details, an ID number, intimate images, doxxing, a false article, old news, a mugshot, a court record, a review, a post, a data broker profile, their own old content, an outdated page, copied work), returns the same plan as the free route finder on essentras.com. Ask only what it is and, where it matters, where the person lives (US, EU, EEA or UK, or elsewhere); never their name or the page address. Returns the route (source, Google policy, law or suppression) and who decides, the steps, the official Google links with the date they were read, the evidence to prepare, a timeline marked official or not, a fit label from Google’s own criteria (not a success rate), letters to send, what the route will not do, a link to the same plan on the website, and the matching Essentras service with its current price. Official channels only. Google, the publisher or the platform decides, and a refund is never a promise of removal.",
          "inputSchema": {
            "properties": {
              "region": {
                "description": "Where do you live? This changes which laws and Google features apply to you. us = United States; eu = EU, EEA or UK; other = Somewhere else. Needed only for: contact-info, gov-id, defamatory-article, old-news, mugshot, court-record, data-broker.",
                "enum": ["us", "eu", "other"],
                "type": "string"
              },
              "situation": {
                "description": "What do you want gone from Google? Personal details and safety: contact-info = My phone number, home address or email (On any website: a directory, a forum, an old listing); gov-id = A government ID, bank or card number, or private record (Social Security, passport, license or tax ID numbers, bank or card numbers, medical records); intimate-images = Explicit or intimate images of me shared without consent (Photos or video of you, posted without your consent); doxxing = My details posted with threats or harassment (doxxing) (Your address, workplace or family details next to threats). Articles and records: defamatory-article = An article or post that says false things about me (News, blog or forum content with false statements of fact); old-news = An old news story about me (Accurate at the time; now old, resolved or out of date); mugshot = A mugshot or arrest record on a website (A booking photo or arrest listing); court-record = A court record or government page (Court dockets, judgments, registries or agency pages). Posts, reviews and profiles: review = A review about me or my business (On Google, Yelp or a professional review site); social-post = A social media or forum post about me (Posts, comments or threads by someone else); data-broker = A people-search or data broker profile (Profiles listing your address, relatives and age); own-content = Something I posted myself (An old profile, post, photo or website). Something else: outdated-page = A page that was deleted or changed but still shows in Google (The site already acted; Google has not caught up); copyright = My photos, video or writing copied without permission (Work you created, reused on another site); other = Something else, or I am not sure (We will narrow it down).",
                "enum": ["contact-info", "gov-id", "intimate-images", "doxxing", "defamatory-article", "old-news", "mugshot", "court-record", "review", "social-post", "data-broker", "own-content", "outdated-page", "copyright", "other"],
                "type": "string"
              }
            },
            "required": ["situation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the route to remove something from Google"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5106ee918e68c6a007359fe896489b6cf9a8c36ce7795db6e79067f672e74c2"
        },
