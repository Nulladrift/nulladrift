{
  "lockfileVersion": 2,
  "subjects": {
    "com.integrated-ai/integrated-ai": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.integrated-ai.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "integrated-ai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public read-only tools for insurance agencies. build_governance_policy drafts the published governance template and is not legal advice. check_data_safety applies that template's green, yellow, and red data rules and is not legal advice. assess_ai_readiness returns 5 to 10 starting workflows. find_workflows searches the built-in library and returns steps and a starter prompt. about_integrated_ai returns public facts and prices. Do not send Social Security numbers, diagnoses, account numbers, or passwords.",
      "tools": [
        {
          "name": "about_integrated_ai",
          "title": "About Integrated AI",
          "description": "Return a short public description of Integrated AI, the Foundation price ($12,000 for the first 10 seats, plus $500 per additional seat), the Partner retainer prices ($1,500, $2,000, or $2,500 a month), and links to the Foundation page, the booking page, and brad@integrated-ai.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "topic": {
                "description": "Optional: overview, foundation, retainer, or contact.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About Integrated AI"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4f8b68df14106a3072f9baad533879a35dec7d5f07c15df601f0946301122d0"
        },
        {
          "name": "assess_ai_readiness",
          "title": "Assess starting workflows for an agency",
          "description": "Take short answers about an insurance agency and return 5 to 10 starting workflows from the built-in benefits and P&C library. Asks for line of business, team size, how AI is used today, whether data rules are written, and the main bottleneck.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ai_today": {
                "description": "none, personal_accounts, business_accounts, or written_policy.",
                "type": "string"
              },
              "bottleneck": {
                "description": "The work that takes the most time, such as renewals, census, certificates, quoting, or loss runs.",
                "type": "string"
              },
              "data_rules": {
                "description": "yes or no. Whether the agency has written data rules for AI tools.",
                "type": "string"
              },
              "health_information": {
                "description": "yes, no, or unsure. Whether the work includes health information.",
                "type": "string"
              },
              "line_of_business": {
                "description": "benefits, pc, or both.",
                "type": "string"
              },
              "team_size": {
                "description": "Headcount or a band such as 1-10, 11-25, or 26+.",
                "type": "string"
              }
            },
            "required": ["ai_today", "bottleneck", "data_rules", "line_of_business", "team_size"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Assess starting workflows for an agency"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0edcb88052789bf26c7b03930e4b0c5f520042302e57690c44f12124acca00f9"
        },
        {
          "name": "build_governance_policy",
          "title": "Build an AI governance policy",
          "description": "Draft an AI governance policy for an insurance agency from the public Integrated AI template. Requires agency type (benefits, pc, or both), state, the AI tools in use, and agency size. Fills those fields where the template has a place for them and leaves the agency name in brackets. Not legal advice. Same policy as https://www.integrated-ai.com/resources/ai-governance-policy-template.html.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agency_size": {
                "description": "Headcount or a band such as 1-10, 11-25, or 26+.",
                "type": "string"
              },
              "agency_type": {
                "description": "benefits, pc, or both.",
                "type": "string"
              },
              "ai_tools": {
                "description": "AI tools the agency uses, separated by commas.",
                "type": "string"
              },
              "state": {
                "description": "US state name or two-letter code, such as IL or Illinois.",
                "type": "string"
              }
            },
            "required": ["agency_size", "agency_type", "ai_tools", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build an AI governance policy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0aba68c4105dea6805d6bf83d06107e76804c94403475987f6c3b9f440c7b871"
        },
        {
          "name": "check_data_safety",
          "title": "Check data against green, yellow, and red rules",
          "description": "Classify a task or a description of the data against the template's green, yellow, and red rules for PII and PHI. Returns green (allowed in an approved tool), yellow (mask individual identifiers first), or red (do not enter), with the rule that matched. Rules guidance only, not legal advice. The description is not stored.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "description": {
                "description": "What the task is, or what kind of data is involved. Do not paste Social Security numbers, diagnoses, account numbers, or passwords.",
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check data against green, yellow, and red rules"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a18e0b203519054c64084bc57c1d5f8a9689c0b4584cce361de5b94547bf2d7"
        },
        {
          "name": "find_workflows",
          "title": "Find a benefits or P&C workflow",
          "description": "Search a built-in library of benefits and P&C workflows, including renewal comparison, census cleanup, SBC comparison, loss-run summary, quote comparison, and COI review. Returns matching workflows with steps and a starter prompt.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many matches to return, from 1 to 5. Defaults to 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "line_of_business": {
                "description": "Optional filter: benefits, pc, both, or any.",
                "type": "string"
              },
              "query": {
                "description": "Words to search for, such as census, SBC, loss run, quote, or COI.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a benefits or P&C workflow"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4918f7f060349347103cbe26e7ca72657020d1ac563b9d2436fbd2ac1da93b9d"
        }
      ],
      "digest": "sha256:877d3bd0c7561bdea1cdf3d60cb488558aa24e44fcfc2da77db7f3a55bd5d3e8"
    }
  }
