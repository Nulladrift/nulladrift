        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the HardscapeDesk dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:917e5fbc61c1a92d7ca50618f7f4c2184a6d81b1842de8c52918805eda718f75"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the HardscapeDesk dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
