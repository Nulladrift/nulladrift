{
  "lockfileVersion": 2,
  "subjects": {
    "com.roomexpert/hotels": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.roomexpert.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "roomexpert",
        "title": "RoomExpert",
        "version": "0.2.0",
        "websiteUrl": "https://roomexpert.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RoomExpert scores thousands of hotels on the same eight axes, from reviews,\neditorial coverage, video walkthroughs and podcasts, with every claim cited to its source.\n\nWhat this server is FOR: deciding WHICH hotel, on evidence, and then booking it. The\nevidence is the part nobody else has. Start with search_hotels to find slugs. get_rates\ncloses the decision once it is made - it is metered, so reach for it last, never to browse.\n\nRules, and they matter more than the data:\n- Never present a claim as RoomExpert's own. Every quote carries an outlet and a url;\n  attribute it to the outlet, and link the url.\n- Never estimate a points price. Only a published chart position or a sampled rate is\n  ever returned, and a hotel with neither has none. Do not infer one from the cash price.\n- A cents-per-point figure is meaningless without its program's own norm beside it. A\n  Hilton point is worth roughly a third of a Hyatt point, so 0.5c can be a GOOD Hilton\n  redemption and a poor Hyatt one. Never compare raw cpp across programs.\n- Where an axis has no evidence, say so. Do not infer a score from the others.\n- Every hotel has a page at https://roomexpert.com/hotels/<slug>. Cite it, so a reader can check.\n- Rate quotes and booking links are live and perishable. Surface a link promptly or call\n  again; never present a remembered price as current.\n- A booking link opens a checkout a PERSON completes. Nothing here reserves a room, so\n  never report a stay as booked, held or confirmed - hand over the link and say so.\n- Documentation for humans: https://roomexpert.com/mcp",
      "tools": [
        {
          "name": "find_award_stays",
          "title": "Find award stays",
          "description": "Lists hotels a given points balance can reach for one night, ranked by how good the redemption is against that program's own norm rather than a flat cents-per-point scale. Fits a traveler who says what they hold, e.g. \"I have 300k Hyatt points\". The balance is supplied by the caller and is not stored. Only published chart or sampled award prices count; nothing is estimated. Returns a Markdown table of up to `limit` hotels (name, destination, points, value grade, score), or a sentence saying nothing priced fits the budget.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Optional city slug, e.g. \"tokyo\".",
                "type": "string"
              },
              "limit": {
                "description": "Default 10, max 25.",
                "type": "integer"
              },
              "points": {
                "description": "Points available for one night.",
                "type": "integer"
              },
              "program": {
                "description": "Loyalty program, e.g. \"World of Hyatt\", \"Hilton Honors\", \"Marriott Bonvoy\".",
                "type": "string"
              }
            },
            "required": ["points", "program"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find award stays"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b2aba4c766a5fc95a90849a3c9938d9b4bd133ff7ac7551d27508ca3d808506"
        },
        {
          "name": "get_evidence",
          "title": "Get cited evidence",
          "description": "Returns the cited quotes behind a hotel's scores. Each one carries the outlet that published it, what kind of document it was, and its url. Answers what a hotel is actually like: whether it is quiet, whether the beds are good, whether service holds up. Returns a Markdown list of up to `limit` quotes (default 12, max 40), spread across the axes unless narrowed to one, each with its outlet, document kind and url. Some hosts are returned as \"a guest review\" with no name or link. An unknown slug returns near matches; no evidence on an axis is stated as such.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Narrow to one axis. Omit for a spread across all of them, which is the right default for an open question.",
                "enum": ["room", "sleep", "bathroom", "noise", "service", "food", "location", "value"],
                "type": "string"
              },
              "limit": {
                "description": "Quotes to return. Default 12, max 40.",
                "type": "integer"
              },
              "slug": {
                "description": "The hotel slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get cited evidence"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5384381aae1280497bf43c80feef8d0192572de9bcbf8197bf1b5c88b63924e9"
        },
        {
          "name": "get_hotel",
          "title": "Get hotel verdict",
          "description": "Returns the RoomExpert verdict for one hotel: overall score, the eight axis scores and what each is based on, how deep the coverage is, the loyalty program, and the award price where a real one exists. Answers \"is this hotel any good\" and \"what is it strong at\". Returns Markdown: a score table with one row per axis (\"no evidence\" where an axis has none), the award line, and the hotel page url. An unknown slug returns up to five near matches. The quotes behind the scores come from get_evidence.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The hotel slug, e.g. \"andaz-maui-at-wailea-resort\". Lowercase, hyphenated.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get hotel verdict"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ddb17b78d629804be077ae85ac1375c6a5ddadf3ab3aafb2a16edced90969852"
        },
        {
          "name": "get_rates",
          "title": "Get live rates",
          "description": "Returns live rooms and prices for one hotel and a stay window, with a booking link for each. It queries a metered rate supplier and is limited to 12 calls a minute per client, so it fits a traveler who has chosen a hotel rather than browsing several. Booking links are time-limited and expire within minutes. A link opens a checkout the traveler completes with their own details and card; this tool does not reserve, hold or confirm a room. Returns a Markdown table (room, nightly, total, refundability, link). Hotels the supplier does not carry, sold-out dates and bad dates each return a plain sentence saying which; an over-limit call says how many seconds to wait.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Default 2.",
                "type": "integer"
              },
              "checkin": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "checkout": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "slug": {
                "description": "The hotel slug.",
                "type": "string"
              }
            },
            "required": ["checkin", "checkout", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get live rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8c98bed2d772346e34235cad6e630d718b3a5d236a96b3530beb74743fb3002d"
        },
        {
          "name": "search_hotels",
          "title": "Search hotels",
          "description": "Finds hotels by name, destination or brand and returns each one's RoomExpert score, slug and page url. The other tools take that slug, so this is the lookup when the slug is not already known. Can rank by a single axis: \"quietest rooms in Tokyo\" is destination \"tokyo\", sort_by_axis \"noise\". Returns a Markdown table of up to `limit` hotels (name, destination, score, axis score when sorting, loyalty program). An unknown destination returns suggested names; no match says the hotel is not covered.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "A brand, chain or loyalty program, e.g. \"Hyatt\", \"Autograph Collection\".",
                "type": "string"
              },
              "destination": {
                "description": "A destination name or slug, e.g. \"Kyoto\" or \"new-york\".",
                "type": "string"
              },
              "limit": {
                "description": "Default 10, max 50.",
                "type": "integer"
              },
              "query": {
                "description": "Part of a hotel name, e.g. \"park hyatt\".",
                "type": "string"
              },
              "sort_by_axis": {
                "description": "Rank by this one axis instead of the overall score.",
                "enum": ["room", "sleep", "bathroom", "noise", "service", "food", "location", "value"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search hotels"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17b5d335c5d014596e8e8cef2597a4a82533d6a9ea51fe6bba219397399bf59f"
        }
      ],
      "digest": "sha256:23d14201bf032e428412449d42eaeaefb7e7adba7e4317b77d7085002a195cb3"
    }
  }
