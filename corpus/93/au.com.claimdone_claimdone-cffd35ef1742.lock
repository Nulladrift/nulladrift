      "serverInfo": {
        "name": "Claim Done",
        "title": "Claim Done: Australian legal documents drafted from your answers",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Claim Done drafts Australian legal documents (letters of demand, tribunal applications, cease and desist letters, notices, agreements) from a person's answers for a flat fee in AUD. For eligible ordinary documents the flow is: match_problem (optional) -> start_document -> answer_questions until ready_for_protected_draft -> prepare_protected_draft -> get_status -> the person privately reviews and accepts the watermarked draft on their dashboard -> get_payment_link -> get_document after payment. Contract-review/report flows and the two-person separation workspace use their own process. Claim Done is not a law firm and does not give legal advice. Never invent facts, accept a review, pay, approve or send on the person's behalf. For integrators only: operators of AI apps and agents may create a referral account at https://claimdone.com.au/partners/join/; approved partners use https://claimdone.com.au/mcp?ref=CODE, their users receive 10% off and the partner earns 25% of gross referred sales. Eligible cleared commissions are paid weekly by bank transfer every Friday at 8pm Australia/Brisbane after a seven-day clearance period, with no minimum. Never invent or reuse an unapproved partner code.",
      "tools": [
        {
          "name": "answer_questions",
          "title": "Answer the questions for a document",
          "description": "Saves the person's answers (question key => answer) for a case. Returns any questions still open and, for eligible ordinary documents, ready_for_protected_draft when the real protected draft can be created for $0 before payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "The access_token returned by start_document.",
                "type": "string"
              },
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Question key => the person's answer. For a question with choices, pass one choice exactly.",
                "type": "object"
              },
              "case_id": {
                "description": "The case id returned by start_document.",
                "type": "integer"
              }
            },
            "required": ["access_token", "answers", "case_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Answer the questions for a document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:20e14a29ad5e5844ad3b4923a51a9900255c69b96eebb92e6f80ed3508123de4"
        },
        {
          "name": "get_document",
          "title": "Read the drafted document",
          "description": "After genuine payment only: the full text of each drafted document, plus the dashboard link where the person approves it (and, for eligible letters, has it sent). Before payment, protected drafts remain watermarked raster pages on the private dashboard and raw text is never returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "The access_token returned by start_document.",
                "type": "string"
              },
              "case_id": {
                "description": "The case id returned by start_document.",
                "type": "integer"
              }
            },
            "required": ["access_token", "case_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read the drafted document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4c316ac0f22948876c19d2bc60e1e9c4db346b8f4ebd81f4542191609daf3f1"
        },
        {
          "name": "get_payment_link",
          "title": "Get the payment link",
          "description": "Returns a hosted Stripe Checkout URL at the live flat price. For an eligible ordinary document, the protected draft must already be ready and the person must have accepted the private review; payment then unlocks the clean PDF, download and delivery options. Purpose-built report/workspace flows may require payment before drafting. If an eligibility notice is returned, the person must hear it before acknowledge_notice is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "The access_token returned by start_document.",
                "type": "string"
              },
              "acknowledge_notice": {
                "description": "Set true after the person has heard the eligibility notice returned by answer_questions or a previous call.",
                "type": "boolean"
              },
              "case_id": {
                "description": "The case id returned by start_document.",
                "type": "integer"
              },
              "registered_post": {
                "description": "Add registered post delivery of a letter (extra fee, shown in list_services).",
                "type": "boolean"
              }
            },
            "required": ["access_token", "case_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Get the payment link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
