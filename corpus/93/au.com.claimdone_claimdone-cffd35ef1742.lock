        {
          "name": "match_problem",
          "title": "Match a situation to the right document",
          "description": "Takes a plain-English description of the person's problem (who, what happened, what they want) and returns the Claim Done document that fits, its price in AUD, and what it does.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
