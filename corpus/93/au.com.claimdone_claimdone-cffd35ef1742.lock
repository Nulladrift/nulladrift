          "title": "Check a case",
          "description": "Whether the case is paid, whether a protected draft is processing or ready, whether the person accepted the review, and the private dashboard link. It never returns raw unpaid document text.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "The access_token returned by start_document.",
                "type": "string"
              },
              "case_id": {
                "description": "The case id returned by start_document.",
                "type": "integer"
              }
            },
            "required": ["access_token", "case_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a case"
