        },
        {
          "name": "prepare_protected_draft",
          "title": "Create the protected draft before payment",
          "description": "For an eligible ordinary document whose questions are complete, starts the real draft for $0 and returns the private dashboard link. The person reviews authorised, watermarked raster pages there. Raw unpaid text and original PDF/DOCX files are never returned by the connector. Daily, email and network limits apply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "access_token": {
                "description": "The access_token returned by start_document.",
                "type": "string"
              },
              "case_id": {
                "description": "The case id returned by start_document.",
                "type": "integer"
              }
            },
            "required": ["access_token", "case_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create the protected draft before payment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:cf13ec3568d188c6dcebec3262ee42218d478e35aaf0e1cca28815c875e33880"
        },
        {
          "name": "start_document",
          "title": "Start a document",
          "description": "Creates a Claim Done case for a document and returns the questions the person needs to answer, with a case_id and access_token for the later steps. Nothing is charged at this step.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "service": {
                "description": "Service slug from list_services or match_problem, e.g. \"letter-of-demand\".",
                "type": "string"
              },
              "state": {
                "description": "The person's Australian state or territory.",
                "enum": ["NSW", "VIC", "QLD", "WA", "SA", "TAS", "ACT", "NT"],
                "type": "string"
              },
              "what_happened": {
                "description": "What happened, in the person's words (2 to 6 sentences).",
                "type": "string"
              },
              "your_email": {
                "description": "The person's email address: the draft, the receipt and the dashboard link go there.",
                "type": "string"
              },
              "your_name": {
                "description": "The person's full name or business name, as it should appear on the document.",
                "type": "string"
              }
            },
            "required": ["service", "state", "what_happened", "your_email", "your_name"],
            "type": "object"
          },
