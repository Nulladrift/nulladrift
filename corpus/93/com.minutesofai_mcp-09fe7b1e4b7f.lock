{
  "lockfileVersion": 2,
  "subjects": {
    "com.minutesofai/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://minutesofai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "minutes-of-ai",
        "title": "Minutes of AI",
        "version": "1.3.0",
        "websiteUrl": "https://minutesofai.com/for-agents"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Minutes of AI is an AI news wire. Stories are AI-generated from their sources (records carry aiGenerated: true) and carry a status label (confirmed, official, reported_single, rumor, benchmark_claim) and their sources, primary first. Cite stories with their url and 'Minutes of AI'. Attribution is required; redistribution of the full feed is not allowed. Use what_changed(since) to poll for new, updated, relabelled, corrected or retracted stories. check_model_ids(ids) returns the lifecycle (status, retirement date and precision, replacement, source) of model ids as written in code. list_deadlines returns regulatory, standards, model retirement and price change dates with their precision and official source. A story with format wire_link is an outlet's headline and a link to its report (aiGenerated: false, disclosure: link, lede: null; wireLink names the outlet and URL): cite the outlet.",
      "tools": [
        {
          "name": "check_model_ids",
          "title": "Check model ids",
          "description": "For each model id (as written in code): the Model Tracker row, its lifecycle status, retirement date and precision, replacement, source page and when it was last checked. Match order: exact API id, API id in another case, tracker slug, display name; `match` says which. Ids the tracker does not hold are returned with found: false.",
          "inputSchema": {
            "properties": {
              "ids": {
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "attribution": {
                "type": "string"
              },
              "data": {
                "items": {
                  "properties": {
                    "announcedAt": {
                      "description": "date the lab announced the deprecation",
                      "type": ["string", "null"]
                    },
                    "apiId": {
                      "description": "the lab's model id from its own page",
                      "type": ["string", "null"]
                    },
                    "checkedAt": {
                      "description": "when the tracker last read the lab's pages for this row",
                      "type": ["string", "null"]
                    },
                    "datePrecision": {
                      "description": "as in list_deadlines: exact: the stated day; earliest: the earliest possible day as the lab states it; not_before: not before this day, no retirement date is set and the model is not deprecated",
                      "enum": ["exact", "earliest", "not_before", null],
                      "type": ["string", "null"]
                    },
                    "deprecationDate": {
                      "type": ["string", "null"]
                    },
                    "found": {
                      "type": "boolean"
                    },
                    "id": {
                      "type": "string"
                    },
                    "lab": {
                      "type": "string"
                    },
                    "match": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "replacement": {
                      "description": "the replacement's tracker row when the lab names exactly one tracked model",
                      "type": ["object", "null"]
                    },
                    "replacementStated": {
                      "description": "replacement(s) as the lab names them",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "retirementDate": {
                      "type": ["string", "null"]
                    },
                    "retirementDatePrecision": {
                      "description": "exact: the stated day; earliest: the earliest possible day as the lab states it; tentative: deprecated name of not_before (read datePrecision)",
                      "enum": ["exact", "earliest", "tentative", null],
                      "type": ["string", "null"]
                    },
                    "slug": {
                      "type": "string"
                    },
                    "source": {
                      "type": ["object", "null"]
                    },
                    "sources": {
                      "description": "per value {url, asOf}: the lab's page and the date it was last read",
                      "type": "object"
                    },
                    "status": {
                      "enum": ["active", "preview", "deprecated", "retired"],
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["found", "id", "match"],
                  "type": "object"
                },
                "type": "array"
              },
              "license": {
                "type": "object"
              }
            },
            "required": ["attribution", "data"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26a86d31f890d4bce88541979323d3bd3dca3c0e6d4be0d4f9d89a9742d6ed13"
        },
