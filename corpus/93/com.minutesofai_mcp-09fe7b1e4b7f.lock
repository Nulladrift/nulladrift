                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["isPrimary", "outlet", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "state": {
                      "type": "string"
                    },
                    "updatedAt": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "type": "string"
                    },
                    "wireLink": {
                      "description": "wire_link only: {outlet, url, originalHeadline, publishedAt, supersededBy}",
                      "type": "object"
                    }
                  },
                  "required": ["aiGenerated", "attribution", "format", "headline", "label", "publishedAt", "slug", "sources", "updatedAt", "url"],
                  "type": "object"
