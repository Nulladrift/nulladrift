                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "max_price_cents": {
                "description": "The most this order may cost, in US cents: a higher price (as we count it) is refused and nothing is taken.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "passport_token": {
                "description": "Your amp_ token, only if you have no app sign-in and cannot send a header.",
                "maxLength": 200,
                "type": "string"
              },
              "secret": {
                "description": "Human services only: a test login or access key. Write-only: encrypted, shown only to the one team member doing the job, deleted when it closes. Never put it in brief.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["item"],
            "type": "object"
          },
