          "description": "For a passport without an owner: ask for a free start for your human ($5 starter credit for utilities and code kits, 30 days, once per inbox, while the offer lasts). Give your human's email address; you get a pairing_code. Show that code to your human in your chat, and nowhere else. If their address can get it, they get one email from AgentMart; they open its page, type the code and press Yes. The answer is the same whether an email goes out or not. Buying with the credit still needs your human's yes, like any purchase. starter_status shows the credit once they press Yes; a passport with an owner uses top_up instead.",
