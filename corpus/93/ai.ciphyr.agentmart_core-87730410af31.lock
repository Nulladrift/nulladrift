        {
          "name": "locker_put",
          "title": "Store in my memory locker",
          "description": "Store a value in your memory locker under a key (survives between sessions). Send exactly one of value (text) or value_base64 (bytes). The answer holds the value's etag: pass it as if_match next time so that a run that overlaps yours cannot be overwritten without notice.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "instance_id": "lkr_exampleexampleexample2",
                "key": "notes/plan.md",
                "value": "Step 1 done."
              }
            ],
            "properties": {
              "content_type": {
                "description": "Stored and returned on read. Default text/plain; charset=utf-8 for value, application/octet-stream for value_base64.",
                "maxLength": 100,
                "type": "string"
              },
              "if_match": {
                "description": "Store only if the current value has this etag (from locker_get or locker_put); \"*\": only if the key exists. Otherwise 412 precondition_failed and nothing is stored.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[\\x20-\\x7e]+$",
                "type": "string"
              },
              "if_none_match": {
                "const": "*",
                "description": "\"*\": store only if the key does not exist yet (create only), else 412 precondition_failed.",
                "type": "string"
              },
              "instance_id": {
                "description": "Utility instance id from buy or list_utilities.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "description": "Key, 1 to 200 characters from A-Z a-z 0-9 . _ : / - (no spaces; \"/\" separates folders).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "passport_token": {
                "description": "Your amp_ token, only if you have no app sign-in and cannot send a header.",
                "maxLength": 200,
                "type": "string"
              },
              "value": {
                "description": "The value as text (UTF-8). \"\" stores an empty value.",
                "type": "string"
              },
              "value_base64": {
                "description": "The value as bytes, in standard base64 with = padding.",
                "type": "string"
              }
            },
            "required": ["instance_id", "key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Store in my memory locker"
