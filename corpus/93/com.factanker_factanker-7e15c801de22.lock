      "serverInfo": {
        "name": "factanker",
        "title": "FACTANKER Fact Registry",
        "version": "1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Reported figures and registry facts for US companies, banks, nonprofits and federal spending, taken from the official filings and registers themselves. A result with n=0 means the registry holds no record for the request. list_templates describes the curated templates that query_template runs. Identifiers ('cik:...', 'lei:...', 'ein:...') resolve more exactly than names. Every value carries its evidence and a citable fact_url.",
      "tools": [
        {
          "name": "compare_entities",
          "title": "Compare entities",
          "description": "Concrete figures from company filings, bank reports, tax returns, government awards and official registers; each value carries the filing it came from and a citable URL. One metric for several entities on one shared period. Fits 'X versus Y', 'which of these is higher' and 'rank these' questions in a single call. Entities do not share coverage: Kings County has childcare prices from 2017, Autauga County from 2008 — two separate get_facts calls return 2022 and 2008 without flagging that they are different years. This tool picks the most recent year for which EVERY requested entity has a value, and if no such year exists it returns common_year: null and compares nothing rather than guessing. Entities without a value for the shared year come back with status 'no_observation' rather than a neighbouring year. Each result carries its status; an estimated value against a measured one is not like-for-like.",
          "inputSchema": {
            "properties": {
              "entities": {
                "description": "2-12 names or IDs",
                "items": {
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "predicate": {
                "type": "string"
              },
              "year": {
                "description": "force this year instead of the most recent shared one",
                "type": "integer"
              }
            },
            "required": ["entities", "predicate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare entities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9719516385017d2c025237e18a0f6c0a5e1da0a302262517601287ed1eaa6139"
        },
        {
          "name": "describe_predicate",
          "title": "Describe a metric",
          "description": "What a metric name actually means: its unit, the fields its values carry, which entity types have it, which sources feed it, how its values are distributed across observed / derived / estimated / imputed, and one example with a citable fact_url. Useful for checking a predicate name or the provenance of a number. The description is read from a sample of at most 200 facts and says so in the response — field lists and status shares are indicative, not exhaustive. For the exact coverage of one entity use get_timeseries.",
          "inputSchema": {
            "properties": {
              "predicate": {
                "type": "string"
              }
            },
            "required": ["predicate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe a metric"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02b44b19c86bcc0bc7431d876b0dff88f74d8f2be59cab520237f1761cb3a535"
        },
        {
          "name": "get_facts",
          "title": "Get facts for an entity",
          "description": "Concrete figures from company filings, bank reports, tax returns, government awards and official registers; each value carries the filing it came from and a citable URL. All currently valid, evidence-backed facts for one entity — each with source, filing reference (e.g. SEC accession number), period, retrieval time, license and a citable fact_url. Optionally filtered to one predicate such as 'revenue' or 'total_assets'. Use for 'what do we know about X' and for exact reported values with verifiable provenance. Without predicate/period it returns the LATEST VALUE PER PREDICATE (compact, saves tokens) plus how many older values exist; pass predicate=<name> for the full history of one metric (newest period first), period=2025Q4 for one period, or full=true for every current fact (up to 500). Read each value's period_start before quoting it. Every value also carries value_status (observed | derived | estimated | imputed): a value the publisher modelled or that FACTANKER computed is not a measurement. For a development over time (\"how did X change from 2018 to 2022\") get_timeseries fits better: it marks gap years explicitly, which this tool does not. The values are public records: facts carry no copyright. US federal records are public domain or CC0; other publishers (e.g. DL-DE-BY-2.0, CC BY 4.0) require naming the source - see usage.attribution per fact. Numbers may be quoted verbatim.",
          "inputSchema": {
            "examples": [
              {
                "entity": "cik:320193",
                "predicate": "revenue"
              },
              {
                "entity": "JPMorgan Chase Bank",
                "predicate": "total_assets"
              },
              {
                "entity": "Brooklyn"
              }
            ],
            "properties": {
              "entity": {
                "description": "name or ID. Examples: 'Apple Inc.', 'cik:320193', 'Brooklyn', 'Wake County, North Carolina'",
                "type": "string"
              },
              "full": {
                "description": "optional: true returns every current fact (up to 500). Default without predicate/period: the latest value per predicate, to save tokens.",
                "type": "boolean"
              },
              "period": {
                "description": "optional: only facts of one period - '2025' (year), '2025Q4' (quarter) or '2025-12-31' (date)",
                "type": "string"
              },
              "predicate": {
                "description": "optional filter. Examples: 'revenue', 'total_assets', 'childcare_price_infant_center'",
                "type": "string"
              }
            },
            "required": ["entity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get facts for an entity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:78e7ed0402763a583fb8e77416c428d384f768b8443c7e8feb3bbb7f81e21fd4"
        },
        {
          "name": "get_source",
          "title": "Get source details",
          "description": "Publisher, licence, access method, fact count, covered period and a ready-made citation for one data source — or the list of all of them when called without arguments. Every fact names its source only by id ('dol_ndcp'); this turns that id into something citable. Answers where a number comes from, whether it may be reused and how current it is. Fact counts and fact counts and coverage dates come from a precomputed summary; the retrieval timestamp on an individual fact is the authoritative freshness signal.",
          "inputSchema": {
            "properties": {
              "source_id": {
                "description": "e.g. 'dol_ndcp', 'sec_edgar'. Omit to list every source.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get source details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ff75f6156ff5213f64bc8b4fecddf2587a686d574b3d1e7262a1c4a1abecb5c"
        },
        {
          "name": "get_timeseries",
          "title": "Get a time series",
          "description": "Concrete figures from company filings, bank reports, tax returns, government awards and official registers; each value carries the filing it came from and a citable URL. One metric for one entity ACROSS TIME, with the gaps made explicit. Fits questions about a period, a development or a comparison of years — 'how did X change', 'from 2018 to 2022', 'over the last decade'. Years without a measurement are returned with status 'no_observation' and a null value; they are gaps, not values, and no neighbouring year stands in for them. Every point carries its own fact_url, its source and its status (observed | derived | estimated | imputed | superseded). One call replaces repeated get_facts calls and, unlike get_facts, shows a missing year as a gap instead of simply leaving out the row.",
          "inputSchema": {
            "examples": [
              {
                "entity": "Brooklyn",
                "from_year": 2008,
                "predicate": "childcare_price_infant_center",
                "to_year": 2022
              },
              {
                "entity": "cik:320193",
                "predicate": "revenue"
              }
            ],
            "properties": {
              "entity": {
                "description": "name or ID, e.g. 'cik:320193', 'Kings County, New York'",
                "type": "string"
              },
              "from_year": {
                "type": "integer"
              },
              "predicate": {
                "description": "e.g. 'revenue', 'childcare_price_infant_center'",
                "type": "string"
              },
              "to_year": {
                "type": "integer"
              }
            },
            "required": ["entity", "predicate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a time series"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0dd2e84cf9a07c99acb70380d37a691c504ba466a6a9eddf416e91ee47ea2b3"
        },
        {
          "name": "list_templates",
          "title": "List query templates",
          "description": "Self-description of the curated query path: every template with its parameters, allowed values, limits and the exact envelope it returns. Useful when it is unclear which template fits a question, or after a query_template error about an unknown parameter: the answer names the valid values. The list is stable within a conversation.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List query templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c1050a96bd3a8d628ad6cf5f98be35a358418d521fda110111345f51d21590f2"
        },
        {
          "name": "lookup_entity",
          "title": "Look up an entity",
          "description": "Resolve a US company, bank or nonprofit to its registry entity. Takes a name, ticker context or an identifier and returns the entity plus all known registry anchors (CIK, LEI, EIN, UEI, RSSD). Identifiers resolve more exactly than names: 'cik:0000936468', 'lei:...', 'ein:...', 'uei:...', 'qid:Q7240'. Returns identity only, no figures; the returned entity id works with get_facts and get_timeseries. Note the level: a bank holding company (CIK) and its operating bank (RSSD) are different entities with different balance sheets.",
          "inputSchema": {
            "properties": {
              "name_or_id": {
                "type": "string"
              }
            },
            "required": ["name_or_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up an entity"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5056331920b0aa0d8fe83191509447e47ad838aaa1c0ffd6ba3a6c69d5fbfcc4"
        },
        {
          "name": "mcp_server_history",
          "title": "MCP server history",
          "description": "Claim history of a REMOTE MCP server from FACTANKER's own periodic probes (initialize + tools/list every 6h): availability, tool count and contract changes over time, each with evidence. Use when asked whether an MCP endpoint exists, is stable, or changed its tools.",
          "inputSchema": {
            "properties": {
              "endpoint": {
                "description": "Endpoint URL or registry name",
                "type": "string"
              },
              "since": {
                "description": "ISO date: only changes from this day on",
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "MCP server history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7df7ee25fc2ba40cb4e9ee825b364200f99d9e10a72df5222dd6b9b6877d9139"
        },
        {
          "name": "query_template",
          "title": "Query curated templates",
          "description": "Reported figures and registry facts for US companies, banks, nonprofits and federal spending, taken from the official filings and registers themselves. A result with n=0 means the registry holds no record for the request. Curated query path for questions about revenue, net income, EBITDA, total assets, SEC filing metrics, fiscal-year financials, bank call-report metrics, nonprofit finances (IRS 990), federal contract/grant dependency, peer comparisons or percentiles for US organizations. Pick a template and pass parameters — no SQL. Key templates: org_profile (cik|lei|ein|rssd), search_org (name), company_financials (cik+metric, SEC EDGAR), bank_metrics (rssd|fdic_cert+metric, FFIEC), nonprofit_financials (ein+metric), gov_dependency, mastr_region (German renewables by state/district/municipality: capacity, age, units older than 20 years, decommissioning, pipeline). list_templates and every error name the allowed metric values. Returns an envelope: result + executed_query + n + scope + not_claimed — cite fact_url values in answers.",
          "inputSchema": {
            "properties": {
              "params": {
                "description": "Template parameters, e.g. {\"cik\":\"320193\",\"metric\":\"revenue\",\"year_from\":2023}",
                "type": "object"
              },
              "template": {
                "enum": ["bank_metrics", "bank_percentiles", "bank_ranking", "company_financials", "company_financials_eu", "germany_renewables_weekly", "gov_dependency", "gov_top_recipients", "mastr_region", "metric_for_tickers", "nonprofit_financials", "nonprofit_profile", "org_changes", "org_profile", "peer_companies", "peer_ebitda", "peer_ebitda_margin_percentiles", "peer_growth", "peer_growth_percentiles", "peer_percentiles", "peer_ratio_percentiles", "peer_ratios", "peer_wc_percentiles", "peer_working_capital", "search_org", "sector_summary"],
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Query curated templates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb7701848e39c8b4f195efe11821da65ab871fb839a787e3251db2796264aa59"
        },
        {
          "name": "search_facts",
          "title": "Search facts",
          "description": "Full-text search across entity names and predicates; returns the most recent matching evidence-backed facts incl. provenance. Suited to imprecise input such as a trade name, a misspelling or a partial phrase. For a known organization, lookup_entity plus get_facts is exact; this search is ranked by text similarity, so a hit's entity name may differ from what was asked.",
          "inputSchema": {
            "properties": {
              "limit": {
                "maximum": 100,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2bd717604c7d627114f76be848ac2a7b0311748951634da92a4242eed75f7b2"
        },
        {
          "name": "verify_claim",
          "title": "Verify a number",
          "description": "Concrete figures from company filings, bank reports, tax returns, government awards and official registers; each value carries the filing it came from and a citable URL. Checks a stated number against the official record. Takes the entity, the metric, the value and the period, and returns match, mismatch or insufficient_evidence together with the registry's own value and its evidence URL. Suited to a generate-verify-revise loop for company, bank, nonprofit or government-spending figures. The three verdicts are distinct: 'mismatch' means the registry disagrees and includes the recorded value; 'insufficient_evidence' means nothing was checked, so it is neither confirmation nor refutation. Where a period is given and no record exists for it, nearby years are returned for context; they are not values for the requested period. The values are public records: facts carry no copyright. US federal records are public domain or CC0; other publishers (e.g. DL-DE-BY-2.0, CC BY 4.0) require naming the source - see usage.attribution per fact. Numbers may be quoted verbatim.",
          "inputSchema": {
            "examples": [
              {
                "entity": "cik:320193",
                "period": "2024",
                "predicate": "revenue",
                "value": 391035000000
              },
              {
                "entity": "Brooklyn",
                "period": "2022",
                "predicate": "childcare_price_infant_center",
                "value": 15600
              }
            ],
            "properties": {
              "entity": {
                "description": "name or ID, e.g. 'Apple Inc.', 'cik:320193', 'Brooklyn'",
                "type": "string"
              },
              "period": {
                "description": "year or period, e.g. '2024'",
                "type": "string"
              },
              "predicate": {
                "description": "e.g. 'revenue', 'total_assets'",
                "type": "string"
              },
              "tolerance_percent": {
                "description": "how close counts as a match; default 1",
                "maximum": 25,
                "type": "number"
              },
              "value": {
                "description": "the figure you are about to state",
                "type": "number"
              }
            },
            "required": ["entity", "predicate", "value"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify a number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:305cb6930ec89ea49856ee9d303e6f434905938c1624739e366fd514a8c37636"
        }
      ],
