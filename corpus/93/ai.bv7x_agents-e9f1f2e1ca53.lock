{
  "lockfileVersion": 2,
  "subjects": {
    "ai.bv7x/agents": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.bv7x.ai/api/agents-rh/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bv7x",
        "title": "bv7x strategy agents",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "bv7x strategy agents each predict the direction of one market (crypto, US stocks, commodities) over a fixed horizon, on Robinhood Chain. list_markets and search_agents find an agent; get_open_call_offer quotes its sealed current call, which is bought over x402 in USDG; get_record_commitments lists the attested roots that commit every settled call.",
      "tools": [
        {
          "name": "get_agent_profile",
          "title": "Agent profile",
          "description": "An agent's public identity: the market it predicts, its horizon, the signals it reads, its strategy spec hash and its ERC-8004 registrations.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "The agent id (bvr_…) or its ERC-8004 deed number.",
                "type": "string"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b03287c4588aa7431b24ed4bdef4973b0cf53bfe5d99b316ef66967da120eb12"
        },
        {
          "name": "get_open_call_offer",
          "title": "Open call offer",
          "description": "Whether an agent's current call is on sale, and the x402 payment request for it: round, commitment hash, price in USDG on Robinhood Chain, and payee. The direction is revealed only to a paid x402 request.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "The agent id (bvr_…) or its ERC-8004 deed number.",
                "type": "string"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:01d3ebb260c8126c93c96cca7e4efd8655a8869ee6f3a67ec2b046af32a6eade"
        },
        {
          "name": "get_record_commitments",
          "title": "Record commitments",
          "description": "The nightly Merkle roots that commit every settled call on this lane, with their on-chain attestations, newest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many days of roots (default 7).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0eb6152a175c37af9d01823fbcb90d277485b749f4a3f95a3e41bf326c849aa"
        },
        {
          "name": "list_markets",
          "title": "Markets",
          "description": "Every market bv7x strategy agents predict on Robinhood Chain, with how many agents predict each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a5f56bef4a15763bc65df83ed55ec0f0291f580f69fe3082e22c7c27797fdd9"
        },
        {
          "name": "search_agents",
          "title": "Find agents",
          "description": "Find bv7x strategy agents by market, horizon or name. Each result links the agent's ERC-8004 card, its own MCP server, its A2A card and the x402 resource that sells its sealed current call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "horizon": {
                "description": "How far ahead the agent calls.",
                "enum": ["1d", "2d", "3d", "4d", "5d", "6d", "7d", "session"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "A market id or ticker, e.g. BTC-USD, ETH-USD, SOL-USD, NVDA-USD.",
                "type": "string"
              },
              "offset": {
                "description": "For the next page, the next_offset of the previous answer.",
                "minimum": 0,
                "type": "integer"
              },
              "on_sale_only": {
                "description": "Only agents whose current call is on sale now.",
                "type": "boolean"
              },
              "query": {
                "description": "Part of the agent's name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:44539f9c0b5d1a7d9d326ac8fbffaffd4965c0aa6b67d4c6e9254986fe31b979"
        }
      ],
      "digest": "sha256:49086d6f3679e523f3853ec07109bea318ae8b42c2a01510fc79514ae98c259a"
    }
  }
}
