{
  "lockfileVersion": 2,
  "subjects": {
    "com.airedteamingservices/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://airedteamingservices.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "airedteamingservices-mcp",
        "title": "airedteamingservices.com",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools for airedteamingservices.com, operated by Excession Labs, a security lab. Search and read pages. request_pentest sends a test request to Excession Labs for a person who asked for it; it needs an agent key from POST /agent/auth. Every other tool is read-only.",
      "tools": [
        {
          "name": "get_page",
          "title": "Read a page as Markdown",
          "description": "Return the Markdown text of a page on airedteamingservices.com, given its path (for example /guides/).",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Path starting with /",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fd6d15ef0d89d9e27b7bb0eefd06cc88186e225b13656519cd37d5a1776f4468"
        },
        {
          "name": "how_to_contact",
          "title": "How to contact Excession Labs",
          "description": "Return the form URL and email address a person can use to contact Excession Labs. This tool does not send anything.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a1d4fbdcab38a7986f608334c33c59c1c86b67a7193f3fde630d6193638f6235"
        },
        {
          "name": "request_pentest",
          "title": "Request a security test from Excession Labs",
          "description": "Send a request for a penetration test or an AI application security assessment to Excession Labs on behalf of a person who asked for it. Needs an agent key (POST /agent/auth, then Authorization: Bearer <key>). Excession Labs replies to the person by email to agree scope; testing starts only after a written scope and written authorization from the system owner. Never include passwords, API keys or customer data. Limits: 5 requests a day per key, 3 a day per email address.",
          "inputSchema": {
            "properties": {
              "authorized": {
                "description": "Must be true: the person owns these systems or may arrange a test of them",
                "type": "boolean"
              },
              "company": {
                "description": "The person's company or organization name",
                "type": "string"
              },
              "email": {
                "description": "The person's work email; Excession Labs replies here",
                "type": "string"
              },
              "name": {
                "description": "The person's name",
                "type": "string"
              },
              "notes": {
                "description": "Other context from the person, up to 2,000 characters. No credentials or customer data.",
                "maxLength": 2000,
                "type": "string"
              },
              "person_consent": {
                "description": "Must be true: the person asked for this request and agreed to be contacted by email",
                "type": "boolean"
              },
              "reason": {
                "description": "Why the person needs the test",
                "enum": ["customer_request", "compliance", "launch", "routine", "incident", "other"],
                "type": "string"
              },
              "targets": {
                "description": "Systems to test: URLs, API base URLs or short descriptions. No credentials.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "test_type": {
                "description": "Kind of test: web_app, api, saas_multi_tenant, ai_application (LLM app or agent) or other",
                "enum": ["web_app", "api", "saas_multi_tenant", "ai_application", "other"],
                "type": "string"
              },
              "timeline": {
                "description": "When the person needs the result, in their words",
                "type": "string"
              },
              "website": {
                "description": "Company website",
                "type": "string"
              }
            },
            "required": ["authorized", "email", "name", "person_consent", "targets", "test_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:993ac683969e38f77cc767e35613384ac3214e25d959a4c5cd0316dbf4319abe"
        },
        {
          "name": "search_site",
          "title": "Search airedteamingservices.com",
          "description": "Search the guides, service pages and research on airedteamingservices.com. Returns titles, URLs and one-line summaries.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "description": "Maximum number of results to return (1 to 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ed017ae32dcbefd43c8ae6b5390f36ce54114210699861b28c98916927a3bd4"
        }
      ],
      "digest": "sha256:e885303f34332ee65c39bf34d811c4cd3d00767538998afdb3349d2698f1856f"
    }
  }
}
