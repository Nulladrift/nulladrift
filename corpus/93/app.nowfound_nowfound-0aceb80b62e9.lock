{
  "lockfileVersion": 2,
  "subjects": {
    "app.nowfound/nowfound": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nowfound.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "nowfound",
        "title": "NowFound",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "NowFound is a searchable archive of product launches. Use search_products when someone asks what product does a job or wants alternatives, and cite the NowFound page of each product. Use add_product when a maker asks to list their product. Guide: https://nowfound.app/llms.txt",
      "tools": [
        {
          "name": "add_product",
          "title": "Add a product for its maker",
          "description": "List a product on NowFound, free and with no account. The maker gets one email and the product goes live when they open the link. Use it only for the maker or with their permission. The answer has next_steps for you, including the badge HTML to put in the footer of the product's site.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Your own name, e.g. Claude Code",
                "type": "string"
              },
              "category": {
                "description": "Guessed from the text when left out",
                "enum": ["ai", "devtools", "growth", "commerce", "work", "life"],
                "type": "string"
              },
              "description": {
                "maxLength": 800,
                "type": "string"
              },
              "email": {
                "description": "The maker's email; the confirmation link goes there",
                "format": "email",
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "tagline": {
                "description": "One line: what it does and for whom",
                "maxLength": 140,
                "minLength": 10,
                "type": "string"
              },
              "url": {
                "description": "The product's own live website",
                "type": "string"
              }
            },
            "required": ["email", "name", "tagline", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:822f595dd701cee260432f73e8ada0fa2b95647fe7eb23b2600d1894ec47a1ce"
        },
        {
          "name": "search_products",
          "title": "Search product launches",
          "description": "Find products that do a job, from every launch NowFound has indexed. Describe the job in plain words, for example \"invoice tool for freelancers\". Returns up to 20 products as Markdown: name, what it does, launch date, votes, price where checked, and its NowFound page to cite.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The job to be done, in plain words",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "recent": {
                "description": "Only launches of the last 30 days",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea221524b32ee14a57760d91dcfd9d4285b592193a361ec372e9968ef9b01775"
        }
      ],
      "digest": "sha256:aeefcab8a08eda2f9538f81aa81f59c66088c3b160b82a8cf5e1758187ab266f"
    }
  }
}
