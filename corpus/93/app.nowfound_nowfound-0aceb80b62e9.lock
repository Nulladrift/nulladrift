{
  "lockfileVersion": 2,
  "subjects": {
    "app.nowfound/nowfound": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nowfound.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "nowfound",
        "title": "NowFound",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "NowFound is a searchable archive of product launches. Use search_products when someone asks what product does a job or wants alternatives, and cite the NowFound page of each product. Set mcp_only there when they want an MCP server. Use get_product for the details of one product. Use add_product when a maker asks to list their product, and check_listing later to see whether it went live. Guide: https://nowfound.app/llms.txt",
      "tools": [
        {
          "name": "add_product",
          "title": "Add a product for its maker",
          "description": "List a product on NowFound, free and with no account. The maker gets one email and the product goes live when they open the link. Use it only for the maker or with their permission. The answer lists optional next steps for the maker, such as a badge for their site. Call check_listing later to see whether it went live. Part of the NowFound API, documented at https://nowfound.app/agents and https://nowfound.app/openapi.json.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Your own name, e.g. Claude Code",
                "type": "string"
              },
              "category": {
                "description": "Guessed from the text when left out",
                "enum": ["ai", "devtools", "growth", "commerce", "work", "life"],
                "type": "string"
              },
              "description": {
                "maxLength": 800,
                "type": "string"
              },
              "email": {
                "description": "The maker's email; the confirmation link goes there",
                "format": "email",
                "type": "string"
              },
              "mcp_url": {
                "description": "Only if the product has an MCP server: its public https address, e.g. https://acme.com/mcp. Shown on the product's page; lists it among MCP servers",
                "maxLength": 500,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "tagline": {
                "description": "One line: what it does and for whom",
                "maxLength": 140,
                "minLength": 10,
                "type": "string"
              },
              "url": {
                "description": "The product's own live website",
                "type": "string"
              }
            },
            "required": ["email", "name", "tagline", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a product for its maker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:37afe6bd3b1ed58643682b99d0c22dc454b0f637be230a40c6e45110dd5eaf82"
        },
        {
          "name": "check_listing",
          "title": "Check a product you added",
          "description": "After add_product, see whether the product went live. Pass the product's website and the maker's email used to add it. Answers live with its page, waiting_for_email while the maker has not opened the link (with when it stops working), link_expired, or not_found. A product not yet live is only reported for the email it was added with. Part of the NowFound API, documented at https://nowfound.app/agents and https://nowfound.app/openapi.json.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The maker's email used in add_product",
                "format": "email",
                "type": "string"
              },
              "url": {
                "description": "The product's own website, as sent to add_product",
                "type": "string"
              }
            },
            "required": ["email", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a product you added"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76cb9172b90d2706cdf32d17c14de876dc740c2faa4d3013bc50b7691bdd89ae"
        },
        {
          "name": "get_product",
          "title": "Get one product",
          "description": "Everything NowFound knows about one product, as Markdown: what it does, launch date, votes, website, pricing where checked, products that do a similar job, and its NowFound page to cite. Pass the product's NowFound page, its slug, or its own website. Use search_products instead when you only know the job. Part of the NowFound API, documented at https://nowfound.app/agents and https://nowfound.app/openapi.json.",
          "inputSchema": {
            "properties": {
              "product": {
                "description": "A NowFound page (https://nowfound.app/launch/acme), a slug (acme), or the product's own website (acme.com)",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dc9a63f48713f7a8a83b0f0876178593c613c87fbd46c668b5ef50b2ecdf4ef7"
        },
        {
          "name": "search_products",
          "title": "Search product launches",
          "description": "Find products that do a job, from every launch NowFound has indexed. Describe the job in plain words, for example \"invoice tool for freelancers\". Returns up to 20 products as Markdown: name, what it does, launch date, votes, price where checked, and its NowFound page to cite. Set mcp_only to search only MCP servers and tools built around them, for example \"read and write Figma files\". Part of the NowFound API, documented at https://nowfound.app/agents and https://nowfound.app/openapi.json.",
          "inputSchema": {
            "properties": {
              "mcp_only": {
                "description": "Only MCP servers and tools built around them",
                "type": "boolean"
              },
              "query": {
                "description": "The job to be done, in plain words",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "recent": {
                "description": "Only launches of the last 30 days",
                "type": "boolean"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search product launches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:764c5c82f30692a4a2641d3f0c8b9610f4848a255072fd996d394f5ca2810419"
        }
      ],
      "digest": "sha256:0fc49c5fa049cc300ea6544af99428cab99f0564a6eac9a5549399f95fbdc15f"
    }
  }
}
