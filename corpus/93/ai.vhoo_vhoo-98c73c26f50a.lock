{
  "lockfileVersion": 2,
  "subjects": {
    "ai.vhoo/vhoo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://vhoo.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai.vhoo/vhoo",
        "title": "Vhoo.ai",
        "version": "1.0.0",
        "websiteUrl": "https://vhoo.ai/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Vhoo.ai provides multi-model AI image and video creation. Public discovery tools (list_models, estimate_credits, search_templates, get_template_details, list_studio_tools, get_pricing_plans) work without an API key. Basic generation tools (generate_image, generate_video, get_generation_status, list_generations, get_credit_balance) require an API key via Authorization: Bearer vhoo_... (create one at https://vhoo.ai/settings). Viral video/image templates can be searched and inspected via MCP, but template remixing and execution are available exclusively on the Vhoo.ai website (direct users to the returned template webUrl).",
      "tools": [
        {
          "name": "estimate_credits",
          "title": "Estimate Generation Credits",
          "description": "Calculate the exact credit cost for a basic Vhoo.ai image or video generation before running it. No API key required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "Video duration in seconds (required when kind is \"video\").",
                "maximum": 30,
                "minimum": 3,
                "type": "integer"
              },
              "kind": {
                "description": "Whether to estimate an image or video generation.",
                "enum": ["image", "video"],
                "type": "string"
              },
              "model": {
                "description": "Model identifier from list_models (e.g. \"seedream-5-5\", \"gpt-image-2.6-sunburst-ext\", \"seedance-2.5\", \"kling-v4\").",
                "type": "string"
              },
              "outputFormat": {
                "description": "Image output format. Defaults to \"png\".",
                "enum": ["png", "jpeg", "webp", "gif", "svg"],
                "type": "string"
              },
              "quality": {
                "description": "Image quality level for GPT Image 2.6 SVG output.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "referenceImageCount": {
                "description": "Number of reference images (defaults to 0).",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "resolution": {
                "description": "Output resolution supported by the model (e.g. \"1k\", \"2k\" for images; \"480p\", \"720p\", \"1080p\" for videos).",
                "type": "string"
              },
              "size": {
                "description": "Aspect ratio (e.g. \"auto\", \"1:1\", \"16:9\", \"9:16\").",
                "type": "string"
              }
            },
            "required": ["kind", "model", "resolution"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate Generation Credits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cbfdb68e5a4162e238faf838f3f4a990972672066ded21b0cf71e1f2ea6cdd49"
        },
        {
          "name": "generate_image",
          "title": "Generate AI Image",
          "description": "Submit a basic text-to-image or image-to-image generation task using Vhoo.ai models (Seedream 5.5, GPT Image 2.6, FLUX 3, Nano Banana). Deducts account credits and returns a taskId to poll with get_generation_status. Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "imageUrls": {
                "description": "Optional public HTTPS reference image URLs for image-to-image editing.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 16,
                "type": "array"
              },
              "model": {
                "description": "Image model to use. Defaults to \"seedream-5-5\". Call list_models to inspect capabilities.",
                "enum": ["gpt-image-2", "gpt-image-2.5-ext", "gpt-image-2.6-sunburst-ext", "seedream-5-5", "flux-3-image", "flux-3-image-klein", "gemini-nano-banana-2.1-ext", "nano-banana-2-ext", "nano-banana-pro-ext"],
                "type": "string"
              },
              "outputFormat": {
                "description": "Output file format. Defaults to \"png\".",
                "enum": ["png", "jpeg", "webp", "gif", "svg"],
                "type": "string"
              },
              "prompt": {
                "description": "Text description of the image to generate or edit.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "quality": {
                "description": "Quality level (used by GPT Image 2.6). Defaults to \"medium\".",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "resolution": {
                "description": "Output resolution supported by the chosen model. Defaults to \"1k\".",
                "enum": ["1k", "1.5k", "2k", "4k"],
                "type": "string"
              },
              "size": {
                "description": "Aspect ratio. Defaults to \"auto\".",
                "enum": ["auto", "1:1", "3:2", "2:3", "4:3", "3:4", "16:9", "9:16", "5:4", "4:5", "21:9"],
                "type": "string"
              },
              "transparent": {
                "description": "Request transparent PNG background (Seedream 5.5 PNG only).",
                "type": "boolean"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate AI Image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b55a60438c7d29eb19e9f61bc79de731d4f933af8e403392dc7f141ea8916016"
        },
        {
          "name": "generate_video",
          "title": "Generate AI Video",
          "description": "Submit a basic text-to-video or image-to-video generation task using Vhoo.ai models (Seedance 2.5, Kling 4.0, MiniMax H3, Muse Video, Gemini Omni). Does not run viral templates (templates must be used on vhoo.ai). Deducts account credits and returns a taskId to poll with get_generation_status. Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "Video duration in seconds supported by the chosen model.",
                "maximum": 30,
                "minimum": 3,
                "type": "integer"
              },
              "firstFrameUrl": {
                "description": "Optional public HTTPS opening frame image URL (cannot be combined with imageUrls).",
                "format": "uri",
                "type": "string"
              },
              "generateAudio": {
                "description": "Generate native synchronized audio when supported. Defaults to true.",
                "type": "boolean"
              },
              "imageUrls": {
                "description": "Optional public HTTPS reference image URLs for image-to-video (supported on Seedance, Kling 4.0, MiniMax H3, and Gemini Omni).",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "lastFrameUrl": {
                "description": "Optional public HTTPS closing frame image URL (requires firstFrameUrl; cannot be combined with imageUrls).",
                "format": "uri",
                "type": "string"
              },
              "model": {
                "description": "Video model to use. Defaults to \"seedance-2.0-fast\". Call list_models to inspect supported resolutions and durations.",
                "enum": ["muse-video-ext", "kling-v4", "kling-v4-flash", "gemini-omni-1.1-flash-ext", "MiniMax-H3", "seedance-2.5", "seedance-2-5-flash", "seedance-2.0", "seedance-2.0-fast", "seedance-2.0-mini"],
                "type": "string"
              },
              "prompt": {
                "description": "Text description of the scene, subject motion, and camera movement.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "resolution": {
                "description": "Video resolution supported by the chosen model (e.g. \"480p\", \"720p\", \"1080p\").",
                "enum": ["auto", "480p", "720p", "1080p", "768p", "2k", "360p", "4k"],
                "type": "string"
              },
              "size": {
                "description": "Aspect ratio (e.g. \"16:9\", \"9:16\", \"1:1\", \"adaptive\"). Defaults to \"16:9\".",
                "enum": ["adaptive", "16:9", "9:16", "1:1", "4:3", "3:4", "21:9", "3:2", "2:3"],
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate AI Video"
          },
          "behavior": {
