{
  "lockfileVersion": 2,
  "subjects": {
    "cc.hlist/hlist-ai-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hlist.cc/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hlist-ai-tools",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI tools directory (hlist.cc) with China-accessibility data. search_ai_tools / get_tool accept an optional lang param (en|zh|ja|ko) for localized descriptions. Usage stats: GET https://hlist.cc/api/v1/mcp-stats.json",
      "tools": [
        {
          "name": "get_tool",
          "description": "Get full details for a single AI tool by slug (e.g. \"cursor\", \"stable-diffusion\").",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Optional: return description in this language (default en)",
                "enum": ["en", "zh", "ja", "ko"],
                "type": "string"
              },
              "slug": {
                "description": "Tool slug from the directory",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1710690d72bd849d7aa1fde7f41cb6b71ac355f02c872fc3c6060b43eb7ec20c"
        },
        {
          "name": "list_categories",
          "description": "List all AI tool categories with tool counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d01b571131e0979c6bf6e670499f036bfd5e8fab85da9851cc20e59a0facf439"
        },
        {
          "name": "search_ai_tools",
          "description": "Search the hlist.cc AI tools directory (431 tools, updated daily) by keyword and/or category. Returns top 10 matches with name, description, pricing, China accessibility, and GitHub stats.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter",
                "enum": ["writing", "image", "video", "audio", "code", "productivity", "data", "design", "marketing", "other"],
                "type": "string"
              },
              "lang": {
                "description": "Optional: return descriptions in this language (default en)",
                "enum": ["en", "zh", "ja", "ko"],
                "type": "string"
              },
              "query": {
                "description": "Keyword to search in tool names and descriptions",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51788747fc6f6a6a403f3fdf037d120b4c5177fb5b938dfe692fbad1787c9d2b"
        }
      ],
      "digest": "sha256:4de732bdb2d8832aabcddb9c893eefd0449b043801fbf0bbb8d6fd986a7c3830"
    }
  }
}
