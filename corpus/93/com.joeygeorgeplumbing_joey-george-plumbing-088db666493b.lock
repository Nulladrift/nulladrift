      },
      "instructions": "Homeowner plumbing help from Joey George Plumbing, an owner-operator residential plumber in South Orange County, CA. Use business_info for company facts, check_water_hardness for city water hardness and treatment guidance, water_heater_check for water heater maintenance guidance, and plumbing_question for common homeowner plumbing questions. Website (joeygeorgeplumbing.com) is the contact channel.",
      "tools": [
        {
          "name": "business_info",
          "description": "Get the facts about Joey George Plumbing: an owner-operator residential plumbing business in South Orange County, CA. Returns services, the 13-city service area, hours (24/7), and the website. Website is the only contact channel returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54d764412b6be075fc1ca6b66c7be9f7c12426c7f9e87a9700399fbd5ffc9599"
        },
        {
          "name": "check_water_hardness",
          "description": "Look up tap-water hardness for a South Orange County city (plus Irvine). Returns the hardness in grains per gallon (gpg), what that level means for a home, and whole-house treatment guidance following Joey's rule: HALO 5 is the default pick in hard-water cities where a drain is reachable (it requires a drain line for its weekly backwash plus an outlet); the H2 Zero line is the pick where no drain is reachable; H2 Zero Scale Media is an option in moderate San Clemente. Cities not in the dataset get an honest general area range, never an invented number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name, e.g. 'Laguna Niguel', 'Mission Viejo', 'San Clemente'.",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48cea53005e91edcf2447e4766533aa0f61fd2e3762f3d3d11b0b7288677d9e3"
        },
        {
          "name": "plumbing_question",
          "description": "Ask a common homeowner plumbing question and get a short, plain-language, teach-first answer. Covered topics: running toilet / flapper dye test, finding the main shutoff and the 3 shutoffs, water meter leak check, gurgling drains, high water pressure signs and PRV, sediment / popping water heater, rotten-egg hot water smell, garbage disposal dos and don'ts. Off-topic questions get an honest list of what is covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "The homeowner's question in plain words.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b31c10a9e70b52ecfecd0c5f517795a6096f3544cf7c0c9836494df4da38f7b"
        },
        {
          "name": "water_heater_check",
          "description": "Get maintenance and troubleshooting guidance for a tank water heater based on its age and (optionally) symptoms such as popping/rumbling noises, running out of hot water, leaking, rusty water, or no hot water. General guidance, not a diagnosis or a quote. The $99 everyday flush price is mentioned only when sediment/flush guidance applies.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age_years": {
                "description": "Age of the water heater in years (from the manufacture date on its label).",
                "type": "number"
              },
              "symptoms": {
                "description": "Optional description of symptoms, e.g. 'popping noises and running out of hot water'.",
                "type": "string"
              }
            },
