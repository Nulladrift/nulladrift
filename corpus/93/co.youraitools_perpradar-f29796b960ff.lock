      "instructions": "Call perp_positioning with an asset ticker (BTC, ETH, SOL...) for the cross-venue positioning read from perp funding on Hyperliquid, dYdX, Paradex and Aevo. Rates, OI, history and scans are on the paid x402 routes. Not financial advice.",
      "tools": [
        {
          "name": "perp_positioning",
          "title": "Perp funding positioning (free preview)",
          "description": "Cross-venue perpetual futures positioning read for an asset from funding rates on Hyperliquid, dYdX v4, Paradex and Aevo: crowded long / long bias / neutral / short bias / crowded short, venues that list it, confidence. Free preview tier. The paid x402 routes add the cross-venue median funding rate and cheapest venue (/v1/funding), per-venue funding (8h %, APR) and open interest (/v1/lite), premium, 7-day funding history and carry (/v1/full) and a universe scan for funding extremes and spreads (/v1/scan). Read-only analytics; not financial advice.",
          "inputSchema": {
            "properties": {
              "symbol": {
                "description": "Base asset ticker, e.g. BTC, ETH, SOL, HYPE (BTC-PERP, ETH-USD and SOLUSDT are accepted too)",
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
