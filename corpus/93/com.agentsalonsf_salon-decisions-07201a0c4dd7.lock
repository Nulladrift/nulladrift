        },
        {
          "name": "search_haircuts",
          "title": "Search haircuts by constraints",
          "description": "Base offering lookup by haircut type, length or stylist. Use compare_options for a supported service with budget, extras or date; preserve any unsupported stylist/length/time requirements for merchant confirmation. Find haircut offerings (and optionally stylists and candidate start times) that satisfy ALL given constraints, across profiled salons (hand-normalized menus) and listed salons (type and inclusions inferred from the service name; offering.comparable says whether it can be compared apples-to-apples). Start times are candidate start times from the salon's published staff schedule; existing bookings are not subtracted, so some may already be taken — confirm on the booking page (slotBasis \"schedule_candidates\", bookingsSubtracted false, availability_basis \"schedule_candidates\" = UNCONFIRMED). require_availability=true is satisfied only by provider-confirmed availability (the booking provider’s own open times, existing bookings subtracted). No salon on this site has provider-confirmed availability today: profiled salons have candidate start times from the published staff schedule (existing bookings not subtracted, so they may already be taken) and listed salons have published opening hours only. Offerings with matching candidate start times are listed under `unconfirmed`; confirm on the booking page. Hard constraints are never relaxed silently; when nothing matches, noMatch.reason explains which constraint blocked and nearest suggests the smallest change. Prices are published menu or online-booking prices in USD; this search does not add requested or mandatory extras. Times are salon-local (America/Los_Angeles).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "after": {
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "before": {
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "hair_length": {
                "enum": ["short", "medium", "long", "any"],
                "type": "string"
              },
              "haircut_type": {
                "enum": ["cut", "cut_wash", "cut_wash_style", "buzz", "beard_trim", "blow_dry", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "neighborhood": {
                "maxLength": 80,
                "type": "string"
              },
              "q": {
                "maxLength": 100,
                "type": "string"
              },
              "require_availability": {
                "default": false,
                "type": "boolean"
              },
              "specialty": {
                "maxLength": 60,
                "type": "string"
              },
              "stylist": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a04aa07ca688bf345476aa51be637d378c9d0e5e1c7bc238b29a1250d413a7b"
        },
        {
          "name": "search_merchants",
          "title": "Search salons",
          "description": "Filter collection=public-research for researched menus, add-ons, public stylist information and policies. Call get_merchant for the full public_research object. Discovery and name/address lookup, not an extras-inclusive price decision. For a supported service with budget, extras or date, start with compare_options. Find San Francisco hair salons and barbers by name/street (q), neighborhood (with nearby), service, date/time and online booking. Returns compact task summaries by default: depth (profiled = researched in depth; listed = public records + the business’s own site, see depth_note), booking_cta, hours_for_day (published hours for `date`, not live slots), up to 3 matched_offerings with prices, license_status, freshness, availability_basis (published_hours / schedule_candidates = unconfirmed / none); profiled salons add candidate_start_times. Unknown values are null. For published hours/detail only, call check_availability. Before selecting a budget option, call compare_options; follow next_action to confirm unresolved charges and actual appointment availability with the merchant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "after": {
                "description": "HH:MM earliest start (with date); applied to start times only under require_availability",
                "type": "string"
              },
              "before": {
                "description": "HH:MM latest start (with date); applied to start times only under require_availability",
                "type": "string"
              },
              "collection": {
                "const": "public-research",
                "description": "Only independently researched public-source profiles; missing fields are UNKNOWN; booking stays on salon website",
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD in the city’s timezone (default today): hours_for_day is computed for this date",
                "type": "string"
              },
              "day": {
                "description": "Open on this day per published hours: Mo..Su or e.g. \"saturday\"",
                "type": "string"
              },
              "depth": {
                "description": "Only salons of this depth: profiled (booking-system depth), detailed (priced menu + booking link + hours or durations), listed (the rest)",
                "enum": ["profiled", "detailed", "listed"],
                "type": "string"
              },
              "hair_length": {
                "enum": ["short", "medium", "long", "any"],
                "type": "string"
              },
              "haircut_type": {
                "description": "Only salons with an offering of this normalized haircut type (profiled salons)",
                "enum": ["cut", "cut_wash", "cut_wash_style", "buzz", "beard_trim", "blow_dry", "other"],
                "type": "string"
              },
              "has_booking": {
                "description": "Only salons with (true) / without (false) an online booking link",
                "type": "boolean"
              },
              "include_nearby": {
                "description": "With neighborhood: also include salons within ~400 m (match=\"nearby\", distance_label). Default true.",
                "type": "boolean"
              },
              "limit": {
                "description": "Default 10, max 25",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Base offering price in USD, not the complete service with extras; use compare_options for that. Only offerings whose price is KNOWN to be at most this (fixed or bounded range); starting prices do not count",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "neighborhood": {
                "description": "Neighborhood slug, label or alias (e.g. \"soma\", \"mission\") or an area (e.g. \"union-square\")",
                "type": "string"
              },
              "offset": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "open_after": {
                "description": "Closes after HH:MM (on `day` if given)",
                "type": "string"
              },
              "open_on_date": {
                "description": "Only salons open on `date` per published hours (not live slots)",
                "type": "boolean"
              },
              "q": {
                "description": "Business name or street, fuzzy (e.g. \"cinta\", \"hairshaper\", \"23 grant\")",
                "type": "string"
              },
              "require_availability": {
                "description": "Only offerings with PROVIDER-CONFIRMED start times in the date/after/before window. Schedule-derived candidate start times never satisfy it; salons that have only candidates are returned under `unconfirmed` with unconfirmed_reason. No salon has provider-confirmed availability today.",
                "type": "boolean"
              },
              "service": {
                "description": "Service tag (e.g. \"balayage\"), intent slug (e.g. \"hair-color\", \"open-saturday\", \"mens-haircut\") or free text",
                "type": "string"
              },
              "specialty": {
                "type": "string"
              },
              "stylist": {
                "description": "Stylist display name (profiled salons)",
                "type": "string"
              },
              "time_after": {
                "description": "HH:MM — with date: only intervals open after this time count",
                "type": "string"
              },
              "time_before": {
                "description": "HH:MM — with date: only intervals open before this time count",
                "type": "string"
              },
              "view": {
                "description": "summary = compact task view (default); full = every field",
                "enum": ["summary", "full"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
