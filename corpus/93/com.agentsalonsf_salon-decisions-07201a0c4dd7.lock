      "instructions": "Agent Salon SF: San Francisco haircuts, structured for AI agents. Independent; not affiliated with any salon listed; booking happens on the salon's own system. Dataset snapshot 2026-10-25; per-fact check dates may differ; dataset b-merchants@2026-10-23T11:05:07Z#4f15ef234749;price-kinds@2026-10-24T09:56:47Z+public-research@e360e97d86a8+handoffs@eeeb1675e507. Start with compare_options when choosing a supported service with a budget, selected extras or a date: it returns known subtotals, unresolved charges, conditions and next actions. Read options, uncertain and excluded, and continue with next_offset before concluding no matches. Date-specific choices are conditional. Time-of-day, stylist and hair-length requirements must be retained for merchant confirmation; compare_options does not filter them. search_merchants is for name/address discovery; check_availability supplies one salon's published hours, not live slots or an extras-inclusive quote; search_haircuts matches haircut offerings by type, price, stylist and time window (profiled salons hand-normalized; listed salons inferred from service names, offering.comparable says when apples-to-apples). Every salon has depth: profiled (booking-system depth), detailed (published menu, booking link and business hours or durations), or listed (public listing facts). Unknown facts are null. Quote status tags and dates when relaying facts. Start times are candidate start times from the salon's published staff schedule; existing bookings are not subtracted, so some may already be taken — confirm on the booking page; never present them as confirmed openings (availability_basis \"schedule_candidates\" = unconfirmed; \"published_hours\" = opening hours only). No Google or Yelp content is published.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check hours, prices and how to book for one salon",
          "description": "Published facts for one salon, NOT live availability and NOT an extras-inclusive quote. For a service/budget/extras/date decision use compare_options with salon=ref. For one salon (ref from search_merchants) and a date: published opening hours on that date (open/closed — NOT live appointment slots), offerings matching the service with published prices and durations, the booking link and step-by-step booking instructions. Profiled salons add candidate start times (candidate start times from the salon's published staff schedule; existing bookings are not subtracted, so some may already be taken — confirm on the booking page). Same contract as GET /api/v1/availability?ref=.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD (default today in the city’s timezone)",
                "type": "string"
              },
              "ref": {
                "description": "\"<city>/<vertical>/<slug>\"",
                "type": "string"
              },
              "service": {
                "description": "e.g. \"balayage\", \"mens-haircut\" or free text",
                "type": "string"
              },
              "time_after": {
                "type": "string"
              },
              "time_before": {
                "type": "string"
              }
            },
            "required": ["ref"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebc8f91a0eb3adcc600bda9e5ce6d8fea96c7593667b55c802f45a49ca340aa4"
        },
        {
          "name": "compare_options",
          "title": "Compare a service with budget, extras and date",
          "description": "START HERE for choosing a service under a budget, with extras, or on a date. Use search_merchants for name/address lookup; use this tool for the service decision. Compare a supported service intent, optional budget/date/neighborhood, strict or nearby geography, and selected add-ons (blow_dry, haircut, toner, shampoo, deep_conditioning, iron_finish, extensions). Returns options, uncertain and excluded service decisions plus separately paginated unresolved_salons when no matching service is established. next_action.booking_url is the direct merchant destination, with link scope and check status. Returns service decisions with per-fact sources/dates, known subtotal including requested/mandatory extras, unresolved charges, explicit conditions, hours conflicts and exact next actions. Starting prices and required consultations never become guaranteed final quotes. Deposit is advance payment, not an added charge. There is no provider-confirmed availability; date-specific results are conditional. Time-of-day, stylist and hair-length requirements are unsupported filters here; retain them for merchant confirmation. Ordering is geographic/alphabetic, not a quality rating. No booking or hold is created. Paginated: limit <= 50, offset; use next_offset across all three result groups.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "USD cap for the requested service and selected/mandatory extras. A lower bound is not proof the full price fits.",
                "minimum": 0,
                "type": "number"
              },
              "date": {
                "description": "Valid YYYY-MM-DD in America/Los_Angeles; not a confirmed appointment",
                "type": "string"
              },
              "geography": {
                "default": "strict",
                "description": "strict by default; nearby requires a neighborhood and explicit permission to include nearby salons.",
                "enum": ["strict", "nearby"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Total entries across options/uncertain/excluded; continue with next_offset",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "neighborhood": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "require_availability": {
                "description": "Require provider-confirmed availability. None exists today; opening hours and candidate times cannot satisfy this.",
                "type": "boolean"
              },
              "salon": {
                "description": "Optional salon slug or ref from search results to compare only that salon.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "selected_addons": {
                "description": "Only extras the user requested. Mandatory extras are added automatically; unknown charges are not free.",
                "items": {
                  "enum": ["blow_dry", "haircut", "toner", "shampoo", "deep_conditioning", "iron_finish", "extensions"],
                  "type": "string"
                },
                "maxItems": 7,
                "type": "array"
              },
              "service_intent": {
                "description": "color, balayage, balayage color, creative color, color consultation, highlights, haircut, mens haircut, womens haircut, wash cut style, or blowout; unsupported intents are errors",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["service_intent"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04ff7f495a354a442fd61cf2eee9eb969d8bcd61457158304342938d488987a0"
        },
        {
          "name": "get_availability",
          "title": "Get availability",
          "description": "NOT live availability. Use compare_options for budget/extras/date decisions. Candidate start times for one offering at one salon, optionally one stylist and a date/time window: candidate start times from the salon's published staff schedule; existing bookings are not subtracted, so some may already be taken — confirm on the booking page. Results carry slotBasis \"schedule_candidates\" and bookingsSubtracted false; freshness tells you how old the capture is.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "after": {
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "before": {
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "date": {
                "description": "Salon-local date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offering": {
                "description": "Offering id or slug from get_salon",
                "type": "string"
              },
              "salon": {
                "type": "string"
              },
              "stylist": {
                "type": "string"
              }
            },
            "required": ["offering", "salon"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
