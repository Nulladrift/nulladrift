{
  "lockfileVersion": 2,
  "subjects": {
    "com.jpyc-service/ec-storefront": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ec.jpyc-service.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "jpyc-ec-platform",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "authorize_transfer",
          "title": "AAウォレット送金の事前承認",
          "description": "erc20-transfer 方式だけで、JPYC を送金する前に必ず呼ぶ。quote_checkout の選択した accept にある extra.payerAuthorization.message をウォレットで personal_sign し、その署名と reservation_id を渡す。サーバは EOA / ERC-1271 / ERC-6492 を検証して予約へ固定する。このツール自体は送金も approve も行わない。成功を確認してから accepted.amount ぴったりを transfer すること。eip3009 方式では呼ばない。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "reservation_id": {
                "description": "quote_checkout が返した reservation_id",
                "pattern": "^res_[0-9a-f]{32}$",
                "type": "string"
              },
              "signature": {
                "description": "payerAuthorization.message の personal_sign 署名",
                "maxLength": 65538,
                "minLength": 4,
                "pattern": "^0x(?:[0-9a-fA-F]{2})+$",
                "type": "string"
              }
            },
            "required": ["reservation_id", "signature"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:369031e767aa4fa04a7ebad32f1eb616124d323164cd824f8fe03924d3cf737b"
        },
        {
          "name": "get_order_status",
          "title": "注文状況の確認",
          "description": "購入履歴専用のSIWE署名で本人確認した注文履歴を最大50件返す。署名は一度だけ利用できる。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "customer_address": {
                "pattern": "^0x[a-fA-F0-9]{40}$",
                "type": "string"
              },
              "message": {
                "description": "Purchase-history SIWE message; see the orders API authentication statement",
                "maxLength": 8192,
                "type": "string"
              },
              "offset": {
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "signature": {
                "maxLength": 4096,
                "type": "string"
              }
            },
            "required": ["customer_address", "message", "signature"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:133c160360cacd469e98f9b06b6a89e618ed279ebd7a7a9bd28cfc40451e96aa"
        },
        {
          "name": "get_product",
          "title": "商品詳細",
          "description": "1 つの商品の詳細を product_id で取得する。価格（JPYC 建て）・在庫・SKU・バリエーション・配送要否・対応チェーンを返す。購入の前に必ず呼んで、requires_shipping（配送先が必要か）と has_variants（オプション選択が必要か）を確認すること。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product_id": {
                "description": "商品 ID",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43c3e32b4fd05fa8a5a25457b75c563a5a7eea204da8d4bfef3a77f72af0bb96"
        },
        {
          "name": "get_shop",
          "title": "ショップ詳細",
          "description": "1 つのショップ（生産者・職人）の詳細を slug で取得する。ショップのストーリーや説明、対応ブロックチェーン、x402 決済が有効かどうかを返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "shop_slug": {
                "description": "ショップの slug（URL 識別子）",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["shop_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ec9bc1cfece252bfbc09fa07085eefacc33f39468ddee0a0acc7f6ef20ae7b44"
        },
        {
          "name": "list_products_in_shop",
          "title": "ショップの商品一覧",
          "description": "1 つのショップの公開中の商品をすべて返す。価格（JPYC 建て）・在庫・バリエーション・配送要否・対応チェーンを含む。list_shops でショップを見つけたあと、その品揃えを見るのに使う。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "shop_slug": {
                "description": "ショップの slug",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["shop_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:447d5a3d87aecfc78c2f343109dd098f9323e3cc0e9b33526237799cc3683032"
        },
        {
          "name": "list_shops",
          "title": "ショップ一覧",
          "description": "JPYC EC Platform に出店している公開ショップの一覧を返す。減農薬の農産物・地酒・伝統工芸品など、生産者から直接買えるショップが中心。各ショップの name / slug / 説明 / 対応チェーン / 商品点数を含む。商品を探す起点として最初に呼ぶとよい。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ab538f2937b705684bd6b1e528f8cd38447f21c70e3e416b65690ab473c57c8"
        },
        {
          "name": "quote_checkout",
          "title": "チェックアウト見積もり（x402 1回目）",
          "description": "カートの内容で x402 チェックアウトの 1 回目を実行する。在庫を仮押さえし（有効期限は返り値 expires_at_unix_ms）、小計・割引・送料・合計（JPYC）と reservation_id、および PAYMENT-REQUIRED チャレンジ（base64url、x402 accepts 配列）を返す。accepts の決済方式: 『eip3009』(既定。通常購入の EOA ウォレットはこちらを選び、EIP-712 TransferWithAuthorization に署名する) と『erc20-transfer』(ecrecover 非対応のスマートコントラクトウォレット専用。payer_address を渡した予約にだけ提示される。extra.payerAuthorization.message を personal_sign して authorize_transfer を呼び、その成功後に表示額ぴったりの通常 ERC-20 transfer を実行し、txHash 任意/payerAddress 必須で submit_payment に渡す)。0円デモは demo_signature_version=1 と payer_address を渡すと demo-signature を提示する。送金せず personal_sign だけで完了する。全 item は同一ショップである必要がある。配送が必要な商品があれば shipping を、贈答なら gift_recipient を必ず渡すこと。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "coupon_code": {
                "description": "ショップから受け取ったクーポンコード（任意。NFT割引との併用不可）",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]*$",
                "type": "string"
              },
              "customer_email": {
                "description": "注文確認メールの送信先（必須）",
                "format": "email",
                "type": "string"
              },
              "customer_note": {
                "description": "注文メモ",
                "maxLength": 2000,
                "type": "string"
              },
              "demo_signature_version": {
                "const": "1",
                "description": "0円デモのpersonal_signに対応する場合のみ指定",
                "type": "string"
              },
              "gift_recipient": {
                "additionalProperties": false,
                "description": "贈り先（is_gift が true なら必須）",
                "properties": {
                  "address1": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "address2": {
                    "type": "string"
                  },
                  "name": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "prefecture": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "tel": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "zip": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["address1", "name", "prefecture", "tel", "zip"],
                "type": "object"
              },
              "idempotency_key": {
                "description": "同じ見積もりの再試行で必ず再利用する一意キー。クーポン利用時は必須（UUID推奨）。異なる購入内容に同じキーを使わないこと",
                "maxLength": 64,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "is_gift": {
                "description": "贈答かどうか",
                "type": "boolean"
              },
              "items": {
                "description": "購入する商品",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "product_id": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "quantity": {
                      "minimum": 1,
                      "type": "integer"
                    },
                    "variant_selections": {
                      "additionalProperties": {
                        "type": "string"
                      },
                      "type": "object"
                    }
                  },
                  "required": ["product_id", "quantity"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "payer_address": {
                "description": "支払いに使うウォレットアドレス（任意・推奨）。指定すると settle 時に支払いに使うウォレットと照合され、別ウォレットからの支払いは拒否される。スマートコントラクトウォレットで erc20-transfer 方式を使う場合は必須（指定が無いと accepts に erc20-transfer が提示されない）",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "preferred_chain_id": {
                "description": "希望チェーン（任意。商品の対応チェーンから選ばれる）",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "shipping": {
                "additionalProperties": false,
                "description": "配送先（配送が必要な商品がある場合は必須）",
                "properties": {
                  "address1": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "address2": {
                    "type": "string"
                  },
                  "name": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "prefecture": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "tel": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "zip": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["address1", "name", "prefecture", "tel", "zip"],
                "type": "object"
              },
              "shop_id": {
                "description": "ショップ ID（全 item 共通）",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["customer_email", "items", "shop_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c7c195e9da9c09c08968600f2fee25da20b555b7a4f41e9b6093365407fa5037"
        },
        {
          "name": "search_products",
          "title": "商品検索",
          "description": "JPYC EC Platform 上の公開商品を横断検索する。減農薬米・地酒・伝統工芸品など、生産者から直接 JPYC で購入できる商品が対象。text は自然言語のキーワード（例: 『丹波 米』）で、商品名と説明に部分一致する。category / tag（産地・認証種別など）、価格帯（min_price / max_price、JPYC）、shop_slug で絞り込める。売上順で最大 50 件返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "商品カテゴリーの完全一致",
                "type": "string"
              },
              "limit": {
                "description": "最大件数（1-50、既定 20）",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "最高価格（JPYC）",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "最低価格（JPYC）",
                "minimum": 0,
                "type": "number"
              },
              "shop_slug": {
                "description": "特定ショップに絞り込む",
                "type": "string"
              },
              "tag": {
                "description": "商品タグ（産地・認証種別など）の完全一致",
                "type": "string"
              },
              "text": {
                "description": "自然言語のキーワード（商品名・説明に部分一致）",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:be83aea2b9cc6cf2e6d186147a032ea109c66c31ad9140887e4aebbf174e76f1"
        },
        {
          "name": "submit_payment",
          "title": "決済の確定（x402 2回目）",
          "description": "quote_checkout で得た reservation_id と、エージェントが用意した x402 PaymentPayload（base64url）を渡して決済を確定する。demo-signatureならextra.payerAuthorization.messageをpersonal_signし、{payerAddress,demoSignature}を渡す。送金やauthorize_transferは呼ばない。quote_checkout の accepts から選んだ方式に応じて payload の中身が変わる: 『eip3009』なら { signature, authorization } (EIP-712 TransferWithAuthorization の署名)、『erc20-transfer』なら { payerAddress, txHash? } (ウォレットが実行した通常の ERC-20 transferの送金元アドレス。txHash は分かれば渡す任意ヒント — 無くてもサーバがon-chain のログを検索して照合する)。erc20-transfer は送金前に必ず authorize_transfer を成功させる。eip3009 はサーバが facilitator 経由で on-chain settle し、erc20-transfer はユーザーが既に送金したものをサーバが検証するだけ。いずれも確定した注文（order_number / tx_hash）を返す。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "payment_signature": {
                "description": "署名済み x402 PaymentPayload（base64url JSON）",
                "minLength": 1,
                "type": "string"
              },
              "reservation_id": {
                "description": "quote_checkout が返した reservation_id",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["payment_signature", "reservation_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bcade58c3c5afe57d51a6b64f9f63eb8246fd80c4abd068df68b738278ff6e74"
        }
      ],
      "digest": "sha256:a99e36c80a776b12a4d4528e86e3373706a2c6f902d91a1b12ec5cf9ae397fe1"
    }
  }
}
