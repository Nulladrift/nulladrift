        },
        {
          "name": "create_order",
          "title": "Bestellung aufgeben",
          "description": "Gibt eine verbindliche Bestellung im Namen des Firmenkontos auf (Scope orders:write). Je nach Freigaberegeln des Unternehmens geht sie zuerst in die Freigabe. Vorher Artikel, Mengen, Adressen und Gesamtpreis mit dem Nutzer bestätigen.",
          "inputSchema": {
            "properties": {
              "billing_address_id": {
                "description": "optional, aus list_addresses",
                "type": "string"
              },
              "buyer_order_id": {
                "description": "optional: Bestellnummer/Bedarfsanforderung des Kunden",
                "type": "string"
              },
              "comment": {
                "description": "optional",
                "type": "string"
              },
              "cost_center": {
                "description": "optional: Kostenstelle",
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "quantity": {
                      "description": "Menge in Stück",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "sku": {
                      "description": "Artikelnummer (Hersteller-Teilenummer) oder GTIN/EAN",
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "sku"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "payment_method": {
                "description": "optional: invoice (Kauf auf Rechnung, sobald für die Firma freigeschaltet), prepayment (Vorauskasse per Überweisung, Bankdaten in bank_transfer), stripe oder paypal. Online-Zahlung erledigt der Mensch über payment_url.",
                "enum": ["invoice", "prepayment", "stripe", "paypal"],
                "type": "string"
              },
              "shipping_address_id": {
                "description": "optional, aus list_addresses",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
