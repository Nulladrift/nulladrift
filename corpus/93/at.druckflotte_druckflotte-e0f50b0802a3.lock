          "title": "Passendes Verbrauchsmaterial",
          "description": "Alle Original-Verbrauchsmaterialien und Zubehör, die laut Hersteller in einen Drucker passen (Toner, Tinte, Trommel, Wartungskit, Schriftband, Etiketten …) mit Preis und Verfügbarkeit. Vollständig und verbindlich laut Herstellerangaben: dafür keine Websuche verwenden. printer.documents: Datenblatt/Handbuch des Herstellers (falls vorhanden), als Link an den Nutzer weitergeben statt danach zu suchen.",
          "inputSchema": {
            "properties": {
