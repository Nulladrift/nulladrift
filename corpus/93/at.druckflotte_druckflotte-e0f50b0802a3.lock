        {
          "name": "find_printer",
          "title": "Drucker finden",
          "description": "Sucht Druckermodelle (HP, Canon, Epson, Brother, Kyocera, Zebra, Dymo) nach Modellname/-nummer. Liefert printer_id für get_printer_supplies. Nutze das zuerst, wenn der Nutzer einen Drucker nennt; keine Websuche zur Modellbestimmung nötig. Passen mehrere Modelle, die Treffer dem Nutzer zur Auswahl geben.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "optional: hp, canon, epson, brother, kyocera, zebra, dymo",
                "type": "string"
              },
              "query": {
                "description": "z. B. \"LaserJet Pro 4002dn\", \"HL-L2350DW\", \"P-touch E550W\", \"ECOSYS PA2101cx\", \"ZD421\"",
                "type": "string"
