{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/kayak": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/kayak/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Kayak",
        "title": "Kayak MCP",
        "version": "1.0.0",
        "description": "Builds a Kayak.com flight-search deep link for a route and dates — URL only, no prices.",
        "websiteUrl": "https://mcps.wondel.ai/servers/kayak/"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from KAYAK (https://www.kayak.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "kayak_search_flights",
          "title": "Build a Kayak flight-search deep link",
          "description": "Build a Kayak.com flight-search deep link for a route and dates. Returns the URL only — no prices: Kayak renders fares client-side behind bot protection, so a server-side fetch can't read them. Open deep_link in a browser for live results, or use google_flights_search for parsed fares. Result shape: { source, deep_link, search_url, trip_type, origin, destination, departure_date, return_date, cabin_class, adults, note } — a single object, never a list: there are no fares, flights or offers to read. `deep_link` (identical to `search_url`) is the only useful output; `return_date` is null for a one-way.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "description": "Number of adults. Default 1.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "cabin_class": {
                "description": "Cabin class. Default economy.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "departure_date": {
                "description": "Departure date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "Destination airport IATA code (3-letter, e.g. JFK).",
                "minLength": 3,
                "type": "string"
              },
              "origin": {
                "description": "Origin airport IATA code (3-letter, e.g. WAW).",
                "minLength": 3,
                "type": "string"
              },
              "return_date": {
                "description": "Return date, YYYY-MM-DD. Omit for one-way.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["departure_date", "destination", "origin"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "adults": {
                "type": "number"
              },
              "cabin_class": {
                "enum": ["economy", "premium_economy", "business", "first"],
                "type": "string"
              },
              "deep_link": {
                "type": "string"
              },
              "departure_date": {
                "type": "string"
              },
              "destination": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "origin": {
                "type": "string"
              },
              "return_date": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "search_url": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "trip_type": {
                "enum": ["one_way", "round_trip"],
                "type": "string"
              }
            },
            "required": ["adults", "cabin_class", "deep_link", "departure_date", "destination", "note", "origin", "return_date", "search_url", "source", "trip_type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83a70affc1470e8fa96defda1b62ce315bbb7eab51640e1a83dde84a5594b8cf"
        }
      ],
      "digest": "sha256:ef8e5a4a1ee8ec406530df885ffef8a1cdede9edfec1046b87879b1fe9cc5fcd"
    }
  }
}
