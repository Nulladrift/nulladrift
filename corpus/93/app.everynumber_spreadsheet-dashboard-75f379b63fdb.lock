                    "type": "string"
                  }
                },
                "required": ["name", "rows_left_out", "rows_read", "sha256"],
                "type": "object"
              },
              "how_checked": {
                "type": "string"
              },
              "numbers": {
                "description": "Every number found in the text, in the order written.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "at": {
                      "description": "Where it starts in the text, in characters from 0 (line breaks as one character, outer spaces trimmed).",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "context": {
                      "description": "The words around it, to tell apart numbers written the same way.",
                      "type": "string"
                    },
                    "file_says": {
                      "description": "What the file gives, with how each value was counted. Filled for differs; for counted_differently it is the value on the same basis as the rest of the text.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "how": {
                            "type": "string"
                          },
                          "value": {
                            "type": "string"
                          }
