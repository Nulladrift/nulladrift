                      "type": "string"
                    },
                    "verdict": {
                      "description": "matches: counting the file the way the sentence says gives this number. counted_differently: the number is in the file, but on a different basis from the rest of the text. differs: the file gives another number for this sentence. not_checked: we couldn't tie it to the file; it is neither confirmed nor wrong.",
                      "enum": ["matches", "counted_differently", "differs", "not_checked"],
                      "type": "string"
                    }
                  },
