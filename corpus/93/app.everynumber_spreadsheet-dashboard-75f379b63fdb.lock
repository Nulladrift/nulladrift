      "instructions": "Every Number turns a spreadsheet export into a dashboard where every number has a receipt. Use make_dashboard_from_file when someone wants a dashboard, KPIs or the numbers in an Excel or CSV export. Show the person the dashboard link, and quote numbers exactly as returned, with their definitions. No account is needed. The dashboard is deleted 24 hours after upload unless the person opens the link and saves it. Use verify_numbers when there is text with numbers in it (a report, an email, a summary, or your own answer) and the file those numbers came from: it counts each number again from the file and says whether it matches. Run it before you send or show numbers you took from a file. Tell the person which numbers differ, with the value the file gives, and say plainly that not_checked numbers are unverified.",
      "tools": [
        {
          "name": "make_dashboard_from_file",
          "title": "Make a dashboard from a spreadsheet",
          "description": "Turn a spreadsheet export (Excel or CSV, up to 10 MB) into an Every Number dashboard. Returns a read-only dashboard link and every number on it with its receipt: the definition, the rows it used, and the rows it left out with the reason. Fixed rules lay out the screen and a database counts every number; no AI reads the file. Send the file as file_url (a Google Sheet shared as 'Anyone with the link', a Dropbox link, or a file in a public GitHub repository) or as file_content (CSV text, or base64 for Excel) with file_name. No account needed. Anyone with the link can open the dashboard, and it is deleted 24 hours after upload unless the person saves it. Limits: 5 files per 10 minutes and 20 per day from one place.",
