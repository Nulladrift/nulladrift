        {
          "name": "verify_numbers",
          "title": "Check the numbers in a text against the file",
          "description": "Check every number in a piece of text (a report, an email, a summary, or an answer you wrote) against the spreadsheet it came from. Each number is counted again from the file and comes back as matches, counted_differently, differs (with the value the file gives) or not_checked, each with how it was counted. Use it before you send or show numbers taken from a file. Fixed rules do the reading and counting; no AI reads the text or the file. Send text, and the file as file_url (a Google Sheet shared as 'Anyone with the link', a Dropbox link, or a file in a public GitHub repository) or as file_content (CSV text, or base64 for Excel) with file_name. No account needed. The file is not stored. The text and the result are kept for 24 hours at a link that anyone with the link can open. Limits: text up to 20,000 characters and 200 numbers, file up to 10 MB, 10 checks per 10 minutes and 40 per day from one place.",
          "inputSchema": {
            "properties": {
              "content_encoding": {
                "description": "How file_content is written. Default: base64 for .xlsx, .xlsm and .xls, text for everything else.",
                "enum": ["text", "base64"],
                "type": "string"
              },
              "file": {
                "description": "A file the person attached in ChatGPT. ChatGPT fills this in. Other assistants send file_url or file_content instead.",
                "properties": {
                  "download_url": {
                    "maxLength": 4096,
                    "type": "string"
                  },
                  "file_id": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "file_name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "mime_type": {
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "file_content": {
                "description": "The file itself, up to 10 MB: CSV or TSV text as it is, or an Excel file encoded as base64. Send this or file_url.",
                "maxLength": 13982040,
                "type": "string"
              },
              "file_name": {
                "description": "The file's name with its extension, such as orders-october.csv or pipeline.xlsx. Needed with file_content.",
                "maxLength": 200,
                "type": "string"
              },
              "file_url": {
                "description": "A link to the file the numbers came from: a Google Sheet shared as 'Anyone with the link', a Dropbox link, a file in a public GitHub repository or gist, or an Every Number sample such as https://everynumber.app/samples/tickets/tickets-export-2026-10-18.csv. Send this or file_content.",
                "maxLength": 2048,
                "type": "string"
              },
              "sheet": {
                "description": "For an Excel file with several sheets, the name of the sheet to read. Default: the sheet with the most data.",
                "maxLength": 200,
                "type": "string"
              },
              "text": {
                "description": "The text whose numbers should be checked, as it will be sent or shown: a report, an email, a summary, or an answer you wrote. Up to 20,000 characters and 200 numbers. Keep the sentences around the numbers; they say what each number counts.",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "accuracy": {
                "description": "How well this check did the last time we measured it on reports it had never seen.",
                "type": "string"
              },
              "expires_at": {
                "description": "When the text and the result are deleted (ISO 8601). The file itself is never stored.",
                "type": "string"
              },
              "file": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "rows_left_out": {
                    "description": "Kinds of rows left out of every count unless a sentence asks for them, such as Spam or Test order.",
