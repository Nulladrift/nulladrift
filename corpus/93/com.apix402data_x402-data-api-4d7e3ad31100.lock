        {
          "name": "crypto_news",
          "description": "[$0.001] Get real-time cryptocurrency and DeFi news headlines enriched with per-article sentiment scores and mentioned token tickers in structured JSON.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Alias of ticker (e.g. USDC, BTC, ETH)",
                "maxLength": 10,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max articles (default 10)",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Filter headlines by text (e.g. 'ETF', 'stablecoin')",
                "maxLength": 200,
                "type": "string"
              },
              "sort": {
                "default": "quality",
                "description": "quality (freshness + outlet + coverage, default) or newest",
                "enum": ["quality", "newest"],
                "maxLength": 10,
                "type": "string"
              },
              "ticker": {
                "description": "Only articles mentioning this ticker (BTC, ETH, SOL, USDC...)",
                "enum": ["AAVE", "ADA", "APT", "ARB", "ATOM", "AVAX", "BCH", "BNB", "BTC", "COIN", "DAI", "DOGE", "DOT", "ENA", "ETC", "ETH", "FIL", "HBAR", "HYPE", "INJ", "LINK", "LTC", "MSTR", "NEAR", "ONDO", "OP", "PEPE", "POL", "PYUSD", "SEI", "SHIB", "SOL", "SUI", "TAO", "TON", "TRX", "UNI", "USDC", "USDT", "WLD", "XLM", "XMR", "XRP"],
