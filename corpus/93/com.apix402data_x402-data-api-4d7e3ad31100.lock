        {
          "name": "agent_ephemeral_key",
          "title": "Ephemeral scoped-subkey & EIP-7702 policy provisioner",
          "description": "[$0.01] Trigger When: delegating an untrusted sub-agent task. Workflow Outcome: mints or revokes a time-bounded, contract-allowlisted, spend-capped EIP-7702 policy in SQLite. Do not use for counterparty trust scoring (use trust_wallet_attest) or x402 session tokens (use agent_session_open). action='mint' requires owner, delegate, chain, max_spend_usd, ttl_minutes; 'revoke' requires policy_id. Persists policy in SQLite (non-custodial, no on-chain tx); x402 USDC/MPP (10 free via /api/free/*), 30-60 rpm.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "default": "mint",
                "description": "mint or revoke",
                "type": "string"
              },
              "chain": {
                "default": "base",
                "description": "Chain: base, ethereum, arbitrum, optimism",
                "type": "string"
