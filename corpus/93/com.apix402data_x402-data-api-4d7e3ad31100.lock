        {
          "name": "get_crypto_news",
          "title": "Crypto news sentiment",
          "description": "Fetch curated, deduplicated crypto news articles with extracted tickers, sentiment scores, source tier, and age in minutes. Pass optional `q` keyword or ticker filter, `limit` (1-30, default 10), and `sort` (`fresh` or `quality`). Returns `articles[]` with `title`, `url`, `tickers[]`, `sentiment`, and `age_minutes`. Do not use for general non-crypto web search (use search_web) or single-page extraction (use fetch_web_markdown). 1 free try per IP, then HTTP 402 ($0.002 USDC).",
