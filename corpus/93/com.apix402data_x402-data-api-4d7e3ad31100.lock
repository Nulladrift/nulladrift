          "name": "agent_escrow_arbitration",
          "title": "Autonomous agent escrow arbitration & SLA verdict",
          "description": "[$0.02] Resolve agent-to-agent escrow disputes by cross-referencing task spec hashes, delivery hashes, and state attestations into a persisted SLA verdict. Do not use for creating block anchors (use crypto_state_attestation) or wallet scoring (use agent_reputation_mesh). Pass 64-hex task_spec_hash + delivery_payload_hash (+ optional attestation_id); empty hashes fail SLA checks. Persists immutable verdict in SQLite; timeout_ms returns degraded=true; x402 USDC/MPP (10 free via /api/free/*), 30-60 rpm.",
