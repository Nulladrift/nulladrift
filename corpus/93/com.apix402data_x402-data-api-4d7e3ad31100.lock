        {
          "name": "discover_x402_endpoints",
          "title": "Verified x402 auto-discovery & failover index",
          "description": "Search live, health-probed x402 endpoints across Coinbase CDP Bazaar, PayAI, and seller manifests. Use `q` (natural-language capability), `scope` (`all`, `ecosystem`, `apix402data`), `network` (`all`, `solana`, `base`), `sort` (`best_value`, `highest_quality`, `cheapest`, `fastest`), and `max_price_usd`. Returns `recommended_primary`, `failover_candidates`, `quality_grade` (`A+`-`F`), `purchase_protection` handshake pin, and `network_health` with dead/bad-actor endpoints excluded by default. Do not use when you already know the exact tool to call. 5 free tries per 24h UTC per IP, then HTTP 402 ($0.0015 USDC on Solana or Base).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include_dead": {
                "default": false,
                "description": "Include quarantined/dead endpoints (default false)",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Max ranked live providers to return (1-50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "default": 1,
                "description": "Maximum price per call in USD",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "min_quality_score": {
                "default": 0,
                "description": "Minimum 5-pillar quality score (0-100)",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "network": {
                "default": "all",
                "description": "Filter by settlement network: all, solana, base",
                "type": "string"
              },
              "q": {
                "description": "Capability or intent query (e.g. solana rug, polymarket, rpc, llm, gas, news, sec)",
                "type": "string"
              },
              "quality_verified_only": {
                "default": false,
                "description": "Only return Quality-Verified (70+ score, valid USDC, live 402) endpoints",
                "type": "boolean"
              },
              "scope": {
                "default": "all",
