        {
          "name": "company",
          "description": "[$0.001] Look up public company financials, CIK, recent SEC EDGAR filings (10-K/10-Q/8-K), and recent news sentiment by stock ticker (supports up to 5 batched tickers).",
          "inputSchema": {
            "properties": {
              "fields": {
                "description": "Return only these result keys, e.g. [\"ticker\",\"company_name\",\"recent_filings\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "include_news": {
                "default": true,
                "description": "Include recent news headlines with sentiment for the company",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "Max results to return (default 50, max 500)",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "ticker": {
                "description": "Any SEC-registered stock ticker (e.g., AAPL, COST, WMT, NVDA). Unknown tickers return 404 and are not charged.",
                "maxLength": 10,
                "type": "string"
              },
              "tickers": {
                "description": "Batch: array of up to 5 tickers; priced unit price x count",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
