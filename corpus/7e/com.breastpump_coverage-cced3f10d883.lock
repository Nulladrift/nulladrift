  "subjects": {
    "com.breastpump/coverage": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://breastpump.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "breastpump-coverage",
        "title": "BreastPump.com Coverage Navigator",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "US breast pump insurance coverage rules from BreastPump.com. Read-only, and needs no personal data. Always relay the disclaimer, the verified/draft status and the sources. Medicaid and TRICARE results never contain paid referrals. Keep sponsored_next_steps (if any) visibly separate and disclosed.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check breast pump coverage",
          "description": "Explain whether a US family's insurance covers a breast pump: pump types, when to order, Rx rule, next steps, one coverage CTA (paid only for eligible commercial/Marketplace results, and flagged), sources and verification status. Uninsured results list official coverage paths. Any paid referral appears only in the separate sponsored_next_steps array, which is off by default. Don't send personal data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "carrier": {
                "description": "Optional carrier, for commercial or marketplace: uhc, aetna, cigna, bcbs, kaiser, or a name like 'Anthem'",
                "type": "string"
              },
              "due_date": {
                "description": "Optional YYYY-MM-DD. A past date is treated as the baby's birth date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "insurance_type": {
                "description": "Plan type",
                "enum": ["commercial", "marketplace", "medicaid", "tricare", "uninsured"],
                "type": "string"
              },
              "state": {
                "description": "2-letter US state code or name, e.g. TX. DC is supported.",
                "type": "string"
              }
            },
            "required": ["insurance_type", "state"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d62c5c1760dbc5020846c13a6af8f09b4497af41bdd499d0960c0c70a49d28a5"
        },
        {
          "name": "get_state_rules",
          "title": "Get a state's rules",
          "description": "A summary of coverage for every plan type in one state, with its Medicaid program link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "2-letter code or name",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
