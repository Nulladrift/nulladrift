          },
          "digest": "sha256:a5d0c5a07c22184f61ceb95e1148ef4c3566782c3b3e72a898cbff418724a909"
        },
        {
          "name": "list_carriers",
          "title": "List carriers",
          "description": "Carriers with carrier-specific rules (commercial or marketplace), and whether each is verified.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
