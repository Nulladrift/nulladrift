{
  "lockfileVersion": 2,
  "subjects": {
    "app.openkrill/hiring-signals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hiring.openkrill.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "hiring-signals",
        "title": "Hiring Signals: Who is hiring, what changed",
        "version": "1.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Hiring Signals: Who is hiring, what changed. Use company_hiring_brief when the user asks what a company is hiring for or how fast. Use watch_new_roles to follow companies: the first call returns a watch_key and records the open roles (baseline true, nothing new yet); tell the user to keep the key. Later calls with that watch_key return new and closed roles since the last call. Use watchlist_digest with the key to rank the watched companies by hiring pace. Use segment_hiring_ranking for the fastest-hiring companies in a segment (a function, a city, a company list or hiring systems); it needs an API key with segment access, and on subscription_required say the key has no segment access and stop. Velocity is empty until a board has snapshots that old; say so rather than guessing. Never invent a watch_key. Do not look up or contact people at the companies. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "company_hiring_brief",
          "title": "Company hiring brief",
          "description": "Best for: what one company is hiring for and how fast, such as \"what is Snap hiring for?\" or \"is Airbnb hiring faster this month?\".\nReturns: open roles, shares remote and with a salary, top departments and countries, the 5 newest roles, and roles opened and closed over 7, 30 and 90 days and per week once the board has a day of history. The board token goes into watch_new_roles.\nInput tips: {\"company\": \"https://snapchat.wd1.myworkdayjobs.com/snap\"}, an \"ats:slug\" token or a company name.\nNot for: lists of individual jobs with filters, or people at the company.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "company": "greenhouse:airbnb"
              }
            ],
            "properties": {
              "company": {
                "description": "A careers page URL, an \"ats:slug\" token such as \"greenhouse:airbnb\", or a company name or domain such as \"stripe.com\".",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["company"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "api_version": {
                "const": "2026-10-22",
                "description": "Date of this answer's shape; it changes only when a field is removed or changes meaning.",
                "type": "string"
              },
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "ats": {
                "type": "string"
              },
              "board": {
                "description": "The ats:slug token; pass it to watch_new_roles to follow this board.",
                "type": "string"
              },
              "company": {
                "type": "string"
              },
              "countries": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "roles": {
                      "type": "integer"
                    }
                  },
                  "required": ["name", "roles"],
                  "type": "object"
                },
                "type": "array"
              },
              "departments": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "roles": {
                      "type": "integer"
                    }
                  },
                  "required": ["name", "roles"],
                  "type": "object"
                },
                "type": "array"
              },
              "hiring_velocity": {
                "description": "Not in every answer. New roles per ISO week (Monday dates) for the company's tracked boards, each role once on the day its board says it was posted (Greenhouse, Lever, Ashby) or first seen: the last 7 days, the 4 newest weeks, 13 weeks, a trend and the percentile among tracked companies. Counts only roles still open or seen since the board was first read. Null when the history store does not track the board.",
                "properties": {
                  "as_of": {
                    "type": "string"
                  },
                  "boards": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "history": {
                    "enum": ["backfilled", "since_first_read"],
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "last_4_weeks": {
                    "items": {
                      "properties": {
                        "new": {
                          "type": "integer"
                        },
                        "week": {
                          "type": "string"
                        }
                      },
                      "required": ["new", "week"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "method": {
                    "type": "string"
                  },
                  "new_last_7_days": {
                    "type": "integer"
                  },
                  "percentile": {
                    "description": "0 to 100: the share of tracked companies with fewer new roles in their 4 newest weeks.",
                    "type": ["integer", "null"]
                  },
                  "ranked_companies": {
                    "type": "integer"
                  },
                  "trend": {
                    "enum": ["rising", "steady", "falling", null],
                    "type": ["string", "null"]
                  },
                  "weeks": {
                    "items": {
                      "properties": {
                        "new": {
                          "type": "integer"
                        },
                        "week": {
                          "type": "string"
                        }
                      },
                      "required": ["new", "week"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": ["object", "null"]
              },
              "history_days": {
                "description": "Days of history kept for this board.",
                "type": "integer"
              },
              "newest": {
                "items": {
                  "properties": {
                    "apply_url": {
                      "type": ["string", "null"]
                    },
                    "posted_at": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["title"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              },
              "open_roles": {
                "type": "integer"
              },
              "remote_share": {
                "description": "Share of open roles marked remote, 0 to 1.",
                "type": "number"
              },
              "salary_share": {
                "description": "Share of open roles that publish a salary, 0 to 1.",
                "type": "number"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "untrusted_source": {
                "type": "boolean"
              },
              "velocity": {
                "description": "Roles opened and closed over each window (7, 30 and, from the history store, 90 days), from daily reads of this board; a window starts no earlier than the first read, and the list is empty until the board has a day of history.",
                "items": {
                  "properties": {
                    "closed": {
                      "type": "integer"
                    },
                    "days": {
                      "type": "integer"
                    },
                    "opened": {
                      "type": "integer"
                    },
                    "since": {
                      "type": "string"
                    }
                  },
                  "required": ["closed", "days", "opened", "since"],
                  "type": "object"
                },
                "type": "array"
              },
              "weekly": {
                "description": "Roles opened and closed per week (Monday dates, oldest first, up to 13), for boards the history store reads daily.",
                "items": {
                  "properties": {
                    "closed": {
                      "type": "integer"
                    },
                    "opened": {
                      "type": "integer"
                    },
                    "week": {
                      "type": "string"
                    }
                  },
                  "required": ["closed", "opened", "week"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["api_version", "as_of", "ats", "board", "company", "countries", "departments", "history_days", "newest", "note", "open_roles", "source", "untrusted_source", "velocity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Company hiring brief",
            "openai/toolInvocation/invoking": "Company hiring brief..."
