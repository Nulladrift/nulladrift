        {
          "name": "watch_new_roles",
          "title": "Watch companies for new and closed roles",
          "description": "Best for: following companies over time, such as \"watch Stripe and Ramp and tell me about new roles\".\nReturns: a watch_key, then on later calls the roles opened and closed since the last call (up to 100 of each listed, all counted). The first call is a baseline: it records the open roles and reports none as new.\nInput tips: {\"companies\": [\"greenhouse:airbnb\", \"lever:spotify\"]} to start; {\"watch_key\": \"hs_...\"} to check, plus companies to add (at most 25).\nNot for: a one-off look at one company (use company_hiring_brief).",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "companies": ["greenhouse:airbnb"]
              }
            ],
            "properties": {
              "companies": {
                "description": "Careers page URLs, \"ats:slug\" tokens or company names, such as [\"greenhouse:airbnb\", \"https://jobs.lever.co/spotify\"]. Added to the watch.",
                "items": {
                  "maxLength": 300,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              },
              "watch_key": {
                "description": "The watch_key an earlier call returned. Leave it out to start a new watch.",
                "pattern": "^hs_[0-9a-f]{32}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "api_version": {
                "const": "2026-10-22",
                "description": "Date of this answer's shape; it changes only when a field is removed or changes meaning.",
                "type": "string"
              },
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "baseline": {
                "description": "True on a watch's first read: every open role is recorded and none is reported as new. A company added later is recorded the same way on its first read.",
                "type": "boolean"
              },
              "boards": {
                "type": "integer"
              },
              "closed_count": {
                "type": "integer"
              },
              "closed_roles": {
                "items": {
                  "properties": {
                    "board": {
                      "type": "string"
                    },
                    "company": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
