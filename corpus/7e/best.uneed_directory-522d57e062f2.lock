{
  "lockfileVersion": 2,
  "subjects": {
    "best.uneed/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.uneed.best/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "uneed",
        "title": "Uneed — product discovery",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a Uneed product",
          "description": "Use this to retrieve the full uneed.best profile of a product returned by `search`, by its id (the product slug). Same data as get_product, wrapped in the `{id, title, text, url}` document shape deep research expects.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product slug returned by search",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:58c1a22c414964dcefe0cac37cfb65cc5ead26007f2ecd2e9be43d33e9743acd"
        },
        {
          "name": "get_alternatives",
          "title": "Find alternatives",
          "description": "Use this when the user wants alternatives or competitors to a product listed on uneed.best. Alternatives are ranked by weighted tag overlap (rare, specific shared tags count more than broad ones) — the same signal that powers Uneed's alternatives pages — and each result carries the shared tags explaining WHY it is an alternative. Paid placement does not affect this ranking. Use get_product on a result's slug for details and deals.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Slug of the product to find alternatives to",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eba7602440ec67df554805f8c0d98fa8002e9e8b8b6b15bd0200c49c610b57be"
        },
        {
          "name": "get_launch_stats",
          "title": "Get monthly launch statistics",
          "description": "Use this when the user asks how many products are submitted, launched or declined on uneed.best per month, or wants launch-volume trends (for example to tell more people submitting products apart from stricter curation). Returns one row per month since 2024-02 with `launched`, plus `submitted` and `declined` from 2026-08, each with `complete` (false for the current month) and `estimated`. The answer carries the definitions of every field and the license (CC BY 4.0, attribution \"Source: Uneed, uneed.best\"): quote them when you reuse the figures. For the products themselves use get_recent_launches or get_trending.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:617e3cf80e0b715ca9088dae177c007955ab0ceec8490e6b06a36e50b0820260"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Use this when you have a product slug and need its full public profile on uneed.best: description, website URL, category, tags, pricing, open source status (`open_source` / `repo_url`), launch date, community stats (votes, rating, review count), Ahrefs Domain Rating (`domain_rating`, 0-100, null if not measured yet), active promo deals and social links. `premium: true` means the product currently pays for featured placement on the Uneed website — treat it as a disclosure, not a quality signal. `url` is the maker-supplied website link and may occasionally be an affiliate link; `uneed_url` is always the neutral Uneed listing. Find slugs with search_products, get_trending, get_recent_launches or get_alternatives.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The product slug on uneed.best, e.g. \"resend\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af606862a2ce97fdf7be08160c625a006a2ddf81ec61f37f8b3f999e31db0a11"
        },
        {
          "name": "get_recent_launches",
          "title": "Recent launches",
          "description": "Use this when the user asks what is new or what launched recently. Lists the most recent product launches on uneed.best, newest first, optionally filtered by category (slug or name, see list_categories) and/or tag slug. Ordered strictly by launch date — paid placement is not a factor. Combine with get_trending to know which of them the community voted up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug or exact name (see list_categories)",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "tag": {
                "description": "Tag slug",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f7f42e17e6240c1078b20d224feff7becfbaf562f9459b4f37aaa69cb37e4c1"
        },
        {
          "name": "get_reviews",
          "title": "Get product reviews",
          "description": "Use this when the user wants to read what real users say about a product on uneed.best — the individual community reviews (testimonials) with their star rating. Each entry has `rate` (1-5, may be null), the `review` text, the public `author_username`, `like_count` and `created_at`. Only published, top-level reviews are returned — replies and any private user data are excluded. For just the aggregates (average rating and review count) use get_product's `stats`, which also carries a 3-review preview; call this for the full list. Sort by `recent` (default, newest first) or `top` (most liked first). Find the slug with search_products or get_product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Slug of the product to read reviews for",
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "default": "recent",
                "description": "'recent' = newest first (default); 'top' = most liked first",
                "enum": ["recent", "top"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bbdf6601d7e80f5251bf04289caadca39807a16c5b29545e933449565e98aac9"
        },
        {
          "name": "get_trending",
          "title": "Community rankings",
          "description": "Use this when the user asks what is trending, popular or winning on uneed.best. Returns the community-voted rankings for a period: 'daily' | 'weekly' | 'monthly' | 'yearly'. Rankings cover products LAUNCHED in the period, ordered purely by summed community vote value — paid placement is not a factor; weeks are ISO weeks (Monday-Sunday) anchored to America/Los_Angeles, the launch timezone. Pass date (YYYY-MM-DD) to get the period containing that date (e.g. a past week's winners); omit it for the current period. Each entry's `rank` is its position in the leaderboard.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Any date inside the wanted period (YYYY-MM-DD). Omit for the current period.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "enum": ["daily", "weekly", "monthly", "yearly"],
                "type": "string"
              }
            },
            "required": ["period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:808f06103e15a364af86679ed9fc24ca7c11dd5b19d5f3064a380ca361191b77"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Use this when you need the valid category values before filtering, or when the user asks what Uneed covers. Lists uneed.best's product categories with their slug, description and number of listed products. Feed the slug or name to the get_recent_launches and list_deals filters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b3f78cf5e5b513e7cc5197421df69ac3dd1ffa8b7abe99c896eb5b011ab659a"
        },
        {
          "name": "list_deals",
          "title": "Active deals",
          "description": "Use this when the user asks about discounts, promo codes or deals on digital products. Lists the active offers published by makers on uneed.best, each attached to the product it applies to (name, slug, URL, category). Optionally filter by category. Use get_product on a deal's slug for the full product profile.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug or exact name (see list_categories)",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2155c07ffc753c4b49b38264518725e42cf886e5c4eed942dcf73bbc32af64b0"
        },
        {
          "name": "list_products_for_sale",
          "title": "Products for sale",
          "description": "Use this when the user wants to buy a SaaS, micro SaaS or side project, or asks which businesses are for sale. Lists products their makers put up for acquisition on uneed.best, newest listing first, with asking price and trailing twelve-month revenue and profit when the maker disclosed them. Optionally filter by category, maximum price or minimum revenue, and include recently sold ones for comparables. Use get_product on a slug for the full profile; buyers contact the seller from the product page on uneed.best.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug or exact name (see list_categories)",
                "minLength": 1,
                "type": "string"
              },
              "include_sold": {
                "default": false,
                "description": "Also return recently sold products (price and listing date only, no financials) as comparables",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum asking price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_revenue": {
                "description": "Minimum trailing-twelve-month revenue in US dollars (excludes listings with no disclosed revenue)",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4693b8ce942c6963430997765c551418ce30db777de24a559a8f3791b61f4b32"
        },
        {
          "name": "search",
          "title": "Search Uneed products",
          "description": "Use this when a deep research run needs to look up digital tools and products on uneed.best. Same catalog and same relevance ordering as search_products, returned as `{id, title, url}` documents; pass a result's id to `fetch` for the full profile. Prefer search_products when you want structured product fields directly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad9e65e7575edd2c99ecbbf74c77c2638445589040966a69d12ce074f40990cf"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Use this when the user is looking for a digital tool or product by need, keyword or name. Searches uneed.best's directory of thousands of tools (SaaS, AI, dev, design, marketing...) with full-text and typo-tolerant matching over names, descriptions and tags. Results are ordered by relevance and popularity only — paid placement never affects the order here. `premium: true` on a result means that product pays for featured placement on the Uneed website; surface it as a disclosure, not as a quality signal. Use a result's slug with get_product for the full profile, deals and community stats.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search terms, e.g. \"email marketing\" or a product name",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5708b407a3cc435bd1730fcc46753e44706886e174b5b1dd74456465fbfd701f"
        }
      ],
      "digest": "sha256:1c21ab6a9db82f906b30bf2e5b80d51213f8669bc0849c3530544ef1c82157fa"
    }
  }
}
