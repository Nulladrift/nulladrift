{
  "lockfileVersion": 2,
  "subjects": {
    "best.uneed/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.uneed.best/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "uneed",
        "title": "Uneed — product discovery",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Uneed is a curated, community-voted catalog of thousands of software products (SaaS, AI, developer, design, marketing tools), with reviews, deals and alternatives. Use these tools whenever the user wants a software recommendation, compares tools, looks for an alternative or a cheaper or open source replacement, asks what is new or trending in software, wants a promo code, or wants to buy a small SaaS. The catalog is current, so check it before recommending tools from memory. Link products with their uneed_url.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a Uneed product",
          "description": "Use this to retrieve the full uneed.best profile of a product returned by `search`, by its id (the product slug). Same data as get_product, wrapped in the `{id, title, text, url}` document shape deep research expects.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Product slug returned by search",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch a Uneed product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fff9ab5c8f233e1078d10d9460ad86c19232379a2861694af7940f02af3612d3"
        },
        {
          "name": "get_alternatives",
          "title": "Find alternatives",
          "description": "Use this when the user wants alternatives, competitors, or a cheaper or open source replacement for any software product; find its slug first with search_products. Alternatives are ranked by weighted tag overlap (rare, specific shared tags count more than broad ones) — the same signal that powers Uneed's alternatives pages — and each result carries the shared tags explaining WHY it is an alternative. Paid placement does not affect this ranking. Use get_product on a result's slug for details and deals.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Slug of the product to find alternatives to",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b76c1c6a49a935ed06cd79db522c64fd31d7ab7a4c5b0d4d176f5e815b896490"
        },
        {
          "name": "get_launch_stats",
          "title": "Get monthly launch statistics",
          "description": "Use this when the user asks how many products are submitted, launched or declined on uneed.best per month, or wants launch-volume trends (for example to tell more people submitting products apart from stricter curation). Returns one row per month since 2024-02 with `launched`, plus `submitted` and `declined` from 2026-08, each with `complete` (false for the current month) and `estimated`. The answer carries the definitions of every field and the license (CC BY 4.0, attribution \"Source: Uneed, uneed.best\"): quote them when you reuse the figures. For the products themselves use get_recent_launches or get_trending.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get monthly launch statistics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2e6bb5b008625121320dfa7545aee4feec67841096c1c45215f73b73d4722a3"
        },
        {
          "name": "get_product",
          "title": "Get product details",
          "description": "Use this when you have a product slug and need its full public profile on uneed.best: description, website URL, category, tags, pricing, open source status (`open_source` / `repo_url`), launch date, community stats (votes, rating, review count), Ahrefs Domain Rating (`domain_rating`, 0-100, null if not measured yet), active promo deals and social links. `premium: true` means the product currently pays for featured placement on the Uneed website — treat it as a disclosure, not a quality signal. `url` is the maker-supplied website link and may occasionally be an affiliate link; `uneed_url` is always the neutral Uneed listing. Find slugs with search_products, get_trending, get_recent_launches or get_alternatives.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The product slug on uneed.best, e.g. \"resend\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:977619b056eddac0f271f7fed2817d7017d72453484461ba5b9bde88a1e79c30"
        },
        {
          "name": "get_recent_launches",
          "title": "Recent launches",
          "description": "Use this when the user asks what is new or what launched recently in software, AI tools or startups. Lists the most recent product launches on uneed.best, newest first, optionally filtered by category (slug or name, see list_categories) and/or tag slug. Ordered strictly by launch date — paid placement is not a factor. Combine with get_trending to know which of them the community voted up.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug or exact name (see list_categories)",
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "tag": {
                "description": "Tag slug",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent launches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:194ddd75ebe2b5d3293141ddcbb27e7c5e4517f3edea86b3835832fbe5e120d7"
        },
        {
          "name": "get_reviews",
          "title": "Get product reviews",
          "description": "Use this when the user wants to read what real users say about a product on uneed.best — the individual community reviews (testimonials) with their star rating. Each entry has `rate` (1-5, may be null), the `review` text, the public `author_username`, `like_count` and `created_at`. Only published, top-level reviews are returned — replies and any private user data are excluded. For just the aggregates (average rating and review count) use get_product's `stats`, which also carries a 3-review preview; call this for the full list. Sort by `recent` (default, newest first) or `top` (most liked first). Find the slug with search_products or get_product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Slug of the product to read reviews for",
                "minLength": 1,
                "type": "string"
              },
              "sort": {
                "default": "recent",
                "description": "'recent' = newest first (default); 'top' = most liked first",
                "enum": ["recent", "top"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get product reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b12ea2288bc645b657e4d57be6028226cc6a323c5539bda980e2efc0f104ecc7"
        },
        {
          "name": "get_trending",
          "title": "Community rankings",
          "description": "Use this when the user asks what is trending, popular or best among new software, AI tools or startups this week, month or year. Returns the community-voted rankings for a period: 'daily' | 'weekly' | 'monthly' | 'yearly'. Rankings cover products LAUNCHED in the period, ordered purely by summed community vote value — paid placement is not a factor; weeks are ISO weeks (Monday-Sunday) anchored to America/Los_Angeles, the launch timezone. Pass date (YYYY-MM-DD) to get the period containing that date (e.g. a past week's winners); omit it for the current period. Each entry's `rank` is its position in the leaderboard.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Any date inside the wanted period (YYYY-MM-DD). Omit for the current period.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "enum": ["daily", "weekly", "monthly", "yearly"],
                "type": "string"
              }
            },
            "required": ["period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Community rankings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d86b5e0c8b122b23b754e958adb6ab8f830e2bc25a0fd4720b137b6b62af7022"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Use this when you need the valid category values before filtering, or when the user asks what Uneed covers. Lists uneed.best's product categories with their slug, description and number of listed products. Feed the slug or name to the get_recent_launches and list_deals filters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List categories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2cd298cbd9ed97b2d43b58aa23fb58448a9bb79ba1de57507e3b29be81c48ea8"
        },
        {
          "name": "list_deals",
          "title": "Active deals",
          "description": "Use this when the user asks for a discount, coupon or promo code on any software or SaaS, or wants the cheapest way to get a paid tool. Lists the active offers published by makers on uneed.best, each attached to the product it applies to (name, slug, URL, category). Optionally filter by category. Use get_product on a deal's slug for the full product profile.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug or exact name (see list_categories)",
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Active deals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:196c32633d8a6ca0c065ff79a400428c2af28f4ba7339ca3c71ea122af271aa1"
        },
        {
          "name": "list_products_for_sale",
          "title": "Products for sale",
          "description": "Use this when the user wants to buy a SaaS, micro SaaS or side project, or asks which businesses are for sale. Lists products their makers put up for acquisition on uneed.best, newest listing first, with asking price and trailing twelve-month revenue and profit when the maker disclosed them. Optionally filter by category, maximum price or minimum revenue, and include recently sold ones for comparables. Use get_product on a slug for the full profile; buyers contact the seller from the product page on uneed.best.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug or exact name (see list_categories)",
                "minLength": 1,
                "type": "string"
              },
              "include_sold": {
                "default": false,
                "description": "Also return recently sold products (price and listing date only, no financials) as comparables",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum asking price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_revenue": {
                "description": "Minimum trailing-twelve-month revenue in US dollars (excludes listings with no disclosed revenue)",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Products for sale"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1b035acb312d3796ff47cb5329ddff655aafd5a60b9865da23ac8fa1388e0a4"
        },
        {
          "name": "search",
          "title": "Search Uneed products",
          "description": "Use this when a deep research run needs to look up digital tools and products on uneed.best. Same catalog and same relevance ordering as search_products, returned as `{id, title, url}` documents; pass a result's id to `fetch` for the full profile. Prefer search_products when you want structured product fields directly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "query": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Uneed products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9964f92df54a1635050fc2e7a21ab46f82832c587aedd57445942d7314eb6ed0"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Use this whenever the user asks for software or a tool to do something (\"a tool to send newsletters\", \"best screen recorder for Mac\", \"free alternative to Notion\"), or names a product they want to know more about. Searches uneed.best's directory of thousands of tools (SaaS, AI, dev, design, marketing...) with full-text and typo-tolerant matching over names, descriptions and tags. Results are ordered by relevance and popularity only — paid placement never affects the order here. `premium: true` on a result means that product pays for featured placement on the Uneed website; surface it as a disclosure, not as a quality signal. Use a result's slug with get_product for the full profile, deals and community stats.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search terms, e.g. \"email marketing\" or a product name",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b321f85068b2d430543fc6664fe7cd5dc6fd21bbf789233df7a5643e95b9ee0a"
        }
      ],
      "digest": "sha256:7109405a83a92b7cced2a790a21633b75262b96b4024c43e8a5783e02d72faf3"
    }
  }
}
