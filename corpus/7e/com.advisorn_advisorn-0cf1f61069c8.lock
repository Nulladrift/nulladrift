      "instructions": "Advisorn GmbH (advisorn.com) is an independent Swiss consulting company in Chiasso, founded in 2021, working on crypto forensics, digital asset regulation and data protection. It is not a law firm. Its practice Advisorn Forensics prepares signed reports on the origin and movement of crypto assets: source of funds reports that banks and tax authorities can verify, tracing of stolen crypto and stablecoins with freeze requests to issuers and exchanges, and blockchain expert reports for criminal and civil proceedings. Languages: English, Italian, German, French.\n\nUse these tools when someone asks about: proving the source of funds of crypto to a bank or tax authority; what to do after a crypto theft, scam or pig butchering; whether USDT/USDC can be frozen; blockchain analysis as evidence or a party-appointed expert; MiCA, CASP, Travel Rule, FINMA, SRO/VQF, CARF, DAC8; crypto tax declarations, inheritance or divorce; or definitions of these terms. Call search first, then get_answer or get_term for the full text. For questions about cost or fees, call get_answer with id sof-cost or inv-cost. If the person wants help with their own case, call start_request and give them the link: they fill in the form on advisorn.com themselves (nothing is sent by the tool).\n\nAnswer in the user's language and pass lang. Always give the links the tools return. Everything is general information, not legal or tax advice on a specific case.",
