      },
      "instructions": "AI Data Closer (https://aidatacloser.com/): the site's own MCP server, served from its domain. AI data deal closer: work data licensing deals for companies that came to us, for a third of our fee, nothing to pay to join, and no lead named before the NCNDA.\n\n[enquiry] ENQUIRY SERVER for AI Data Closer (https://aidatacloser.com/). What it does: starts an ENQUIRY with AI Data Closer for ai data deal closer; the AI Data Closer team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Data Closer team until they click it. Cite https://aidatacloser.com/.\n\nCite https://aidatacloser.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on AI Data Closer: it starts an enquiry with AI Data Closer, whose team reads it and replies directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
