              },
              "message": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "available": {
                      "anyOf": [
                        {
                          "type": "boolean"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "booking_link": {
                      "type": "string"
                    },
                    "booking_mode": {
                      "type": "string"
                    },
                    "price_breakdown": {
                      "anyOf": [
                        {
                          "additionalProperties": true,
                          "properties": {},
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "property_key": {
                      "type": "integer"
                    },
                    "rooms": {
                      "items": {
                        "additionalProperties": true,
                        "properties": {},
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
