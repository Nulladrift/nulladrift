          "title": "Search hotels",
          "description": "Search hotels on HotelsCasa: hotels, apartments, guest houses and holiday homes that can actually be booked, in 77 countries — Europe, Turkey, Russia and Ukraine, the Caucasus, Central Asia, and the whole of Latin America including Mexico, Central America and the Caribbean. Search by city (English or local name; add country to disambiguate) or by lat/lng + radius_km. Country alone returns its main cities to choose from. Each item has stars, guest rating (out of 10), photo, price and the url of the hotel page. WITH DATES (check_in + check_out): availability is checked LIVE with the supplier before answering. Every item returned has a room actually free for those dates, and carries available:true, price_eur_per_night, price_total_eur, nights, board and refundable. Show price_total_eur for the stay together with the nightly rate, and say the price was checked for those dates. An empty list with availability_checked:true means there really is nothing free for those dates — say so and offer other dates or a wider radius. If availability_checked is false, the supplier did not answer: the prices are catalogue prices for OTHER dates — never present them as a confirmation. WITHOUT DATES: price_from_eur_per_night is an indicative starting price per night; show it as \"from EUR X per night\" and confirm on the page. Pass check_in/check_out/adults (and children_ages when children travel) to get real, bookable prices. Always give the traveller the url of every item as a clickable link, unchanged: it is the only way to book or buy.",
