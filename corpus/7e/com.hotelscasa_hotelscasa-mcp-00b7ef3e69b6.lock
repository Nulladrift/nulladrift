        {
          "name": "check_availability",
          "title": "Check home availability",
          "description": "Check availability and price for up to 10 properties on given dates. THIS is the tool that answers «is it free on my dates and what does it cost»: search_properties never does. Use the property_key from search_properties results, and call it as soon as the traveller gives dates — never search the web instead. For INSTANT objects returns available (true/false) and, when free, a price_breakdown. For ON_REQUEST objects returns available:null with a price_note and a booking_link to the enquiry form — this is NOT a failure, it is the normal path for most of the catalogue. Results include two kinds of properties. Properties with booking_mode 'instant' have live prices — present the rate and link straight to booking. Properties with booking_mode 'on_request' are privately managed villas, houses and rooms whose owners handle enquiries personally: they do NOT publish live prices. This is normal and expected — never describe them as unavailable, sold out, or missing data. Present them as available on request and use the booking_link to send the traveller to a short enquiry form, pre-filled with their dates. The owner replies personally.\n\nHotels return a rooms[] array with per-room prices and capacities — present the relevant rooms, not just the hotel.\n\nWhen no dates are given, price_from is only an indicative minimum. Seasonal, weekend and holiday rates apply. Always ask the traveller for dates, then call check_availability. Prices are indicative and confirmed on the property page.\n\nPRICE FIELDS: `price` (and price_from) is the nightly accommodation rate; `price_total` is the full stay total, which INCLUDES cleaning_fee and taxes, so it is usually more than price × nights. Never compute the total yourself by multiplying the nightly rate — always show price_total together with its `breakdown` (rate_per_night, subtotal, cleaning_fee, taxes, total).\n\nLOYALTY BONUS: when a result includes loyalty_bonus, mention it. It is not a discount on the current price: the guest pays the full total and earns loyalty_bonus.amount € as credit for a future stay on HotelsCasa (1 € per night). Present it as credit for later, never as a reduction of this total.\n\nGOLDEN LINK RULE: For EVERY property and EVERY room you present, you MUST include its booking_link as a clickable link — it is the traveller's only way to proceed. Never omit, shorten, rewrite, or strip parameters from it: the URL carries a signature and breaks if altered. Return it verbatim.\nLabel the link in the traveller's language: 'Book now' for instant and 'Ask for price and availability' for on_request, translated (for example 'Reservar ahora' / 'Consultar precio y disponibilidad' in Spanish).\n\nTEXT LANGUAGE: descriptions, pitches and reviews written by hosts come in Spanish (text_language: es). Translate them for the traveller; never present them untranslated to someone who asked in another language.\n\nFor on_request properties, tell the traveller that the owner replies personally.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "check_in": {
                      "description": "YYYY-MM-DD.",
                      "type": "string"
                    },
                    "check_out": {
                      "description": "YYYY-MM-DD.",
                      "type": "string"
                    },
                    "guests": {
                      "maximum": 16,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "property_key": {
                      "description": "The property_key from search_properties results.",
                      "type": "integer"
                    }
                  },
                  "required": ["property_key"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "lang": {
                "description": "Language of the answer: es, en, de, fr, it, pt, tr or ru. Default es.",
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
