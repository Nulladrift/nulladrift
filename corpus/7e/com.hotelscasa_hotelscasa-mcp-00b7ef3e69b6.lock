        {
          "name": "check_vehicle_availability",
          "title": "Check car availability",
          "description": "Check availability and total price of up to 10 cars for given pickup/return dates. Returns available (true/false), days, price_day and total_eur. Cars without a published rate return total_eur:null with a price_note — that is normal, not a failure. \n\nCARS ON HOTELSCASA: cars from local rental companies (offered_by:\"rental_company\") and from private owners. Cars marked instant:true are confirmed immediately; the rest are confirmed after booking by the rental company or by the owner, who replies personally. A rental-company car with similar_model:true guarantees the class, not the exact model.\n\nPRICE: price_day is the daily rate and total_eur the rental for the whole period. A car with price_day:null has NOT published a rate — that is normal and common, never call it unavailable or say the data is missing. Present it with its price_note and send the traveller to the booking_link to ask.\n\nGOLDEN LINK RULE: every car you present MUST include its booking_link verbatim, as a clickable link — never omit it, shorten it or strip its parameters. It is the only way the traveller can proceed.\n\nNEVER invent or reveal a phone number, an address or a licence plate: they are not in the data and are only shared through the booking flow. Coordinates are approximate on purpose (~200 m) — use them for \"3 km from the centre\", never as a pickup address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pickup_date": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "return_date": {
                "description": "YYYY-MM-DD.",
                "type": "string"
              },
              "vehicle_ids": {
