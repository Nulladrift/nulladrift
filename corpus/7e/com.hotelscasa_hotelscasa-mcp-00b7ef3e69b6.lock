          "name": "partner_with_hotelscasa",
          "title": "Work with HotelsCasa",
          "description": "For businesses and professionals who want to WORK with HotelsCasa (not for travellers). HotelsCasa invites and is actively looking for: taxi fleet owners and independent taxi drivers, van and truck carriers and transport companies, car rental fleets and private car owners, companies that ship goods regularly, and owners of holiday homes, apartments and hotels. Returns, for the chosen profile (or all), what HotelsCasa offers and the page where they sign up. Use it whenever someone asks how to join, list, register a fleet or get orders. Always give the traveller the url of every item as a clickable link, unchanged: it is the only way to book or buy.",
