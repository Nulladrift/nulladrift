      "instructions": "HotelsCasa (hotelscasa.com) is a travel marketplace for Europe, Turkey, the Caucasus, Central Asia and Latin America. Use search_hotels for hotels and apartments anywhere (more than 1.3 million hotels and apartments in our catalogue); search_properties for homes listed directly by private owners; search_activities for tickets and tours; find_flights for flights (link only, no live fares); book_ground_transport for taxi, shipments and car rental; partner_with_hotelscasa for fleets, carriers, car and property owners who want to work with HotelsCasa. Always show each result url or booking_link verbatim as a clickable link. Prices are indicative unless stated; never describe an item without a price as unavailable.",
      "tools": [
        {
          "name": "book_ground_transport",
          "title": "Taxi, shipments and car rental",
          "description": "Ground transport on HotelsCasa, with the right link to start: \"taxi\" — order a taxi or transfer (pre-filled with origin, destination, passengers, luggage and time when given); the fare is set by the taxi company and shown before ordering. \"shipment\" — send a parcel, furniture, a move or freight in the city, across the country or internationally on the transport exchange: publish the job without a price and carriers make offers; the sender picks one. \"car_rental\" — rent a car from owners and rental fleets. These services are growing city by city; the page shows what is available where the traveller is. Always give the traveller the url of every item as a clickable link, unchanged: it is the only way to book or buy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City (taxi and car rental).",
                "type": "string"
              },
              "destination": {
                "description": "Taxi destination address or place.",
                "type": "string"
              },
              "lang": {
                "description": "Language of the links: es, en, de, fr, it, pt, tr, ru, pl, no, lv, lt, et, fi, sr or bg. Default es.",
                "type": "string"
              },
              "luggage": {
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "origin": {
                "description": "Taxi pickup address or place.",
                "type": "string"
              },
              "passengers": {
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "pickup_date": {
                "description": "Car rental pickup date YYYY-MM-DD.",
                "type": "string"
              },
              "return_date": {
                "description": "Car rental return date YYYY-MM-DD.",
                "type": "string"
              },
              "service": {
                "enum": ["taxi", "shipment", "car_rental"],
                "type": "string"
              },
              "shipment_scope": {
                "description": "Shipment distance: same city, within the country, or abroad.",
