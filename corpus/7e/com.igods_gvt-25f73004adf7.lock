        {
          "name": "gvt_list_schedules",
          "title": "List schedules",
          "description": "Retrieves the paginated roster of the authenticated caller's test monitoring schedules, allowing filtering by domain, frequency, and status. This is the only way to discover existing schedules and their schids, which the pause/resume/cancel/change_frequency modes of gvt_schedule_test require. Completed one-off rows are hidden by default: batch runs create a throwaway once row per queued URL, so include them only with includeCompletedOnce true. The row's tid is deliberately not surfaced (it is often stale); use gvt_list_tests or gvt_get_latest for test result lookups. Read-only: consumes rate limit, never test credits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Filter to schedules matching this domain substring.",
                "type": "string"
              },
              "frequency": {
                "description": "Filter by repetition interval.",
                "enum": ["daily", "weekly", "monthly", "once"],
                "type": "string"
              },
              "includeCompletedOnce": {
                "default": false,
                "description": "Whether to include completed one-off schedules in the results. Hidden by default because batch runs create a throwaway once row per queued URL; include them only when investigating batch history.",
                "type": "boolean"
              },
              "includeSubdomains": {
                "default": true,
                "description": "Whether subdomains should be included in the domain filter match.",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "description": "The maximum number of schedules requested for this page.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "The number of skipped items from the beginning of the result set.",
                "minimum": 0,
                "type": "integer"
              },
              "sortDirection": {
                "default": "desc",
                "description": "Sort order by creation time; desc is newest first.",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "status": {
                "description": "Filter by the derived overall state of the schedule.",
                "enum": ["active", "paused", "completed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Paginated roster of the caller's monitoring schedules with applied filters echoed back.",
            "properties": {
              "allowedFrequencies": {
                "description": "Frequencies the caller may set when creating schedules",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "description": "The applied domain filter, null when unfiltered",
                "type": ["string", "null"]
              },
              "frequency": {
                "description": "The applied frequency filter, null when unfiltered",
                "type": ["string", "null"]
              },
              "hasMore": {
                "description": "True when more results exist beyond this page",
                "type": "boolean"
              },
              "includeCompletedOnce": {
                "description": "Whether completed one-off rows were included in this response",
                "type": "boolean"
              },
              "includeSubdomains": {
                "description": "The applied subdomain-inclusion setting",
                "type": "boolean"
              },
              "limit": {
                "description": "Page size applied to this response",
                "type": "integer"
              },
              "maxActiveSchedules": {
                "description": "The caller's cap on active schedules; add mode enforces this limit",
                "type": "integer"
              },
              "nextOffset": {
                "description": "Offset for the next page, null when hasMore is false",
                "type": ["integer", "null"]
              },
              "offset": {
                "description": "Offset applied to this response",
                "type": "integer"
              },
              "schedules": {
                "description": "One entry per schedule, newest first by creation time",
                "items": {
                  "properties": {
                    "autoPauseReason": {
                      "description": "Reason the schedule was automatically paused, null when not auto-paused",
                      "type": ["string", "null"]
                    },
                    "consecutiveFailureCount": {
                      "description": "Number of consecutive failed runs; a high count precedes auto-pause",
                      "type": "integer"
                    },
                    "createdAt": {
                      "description": "ISO 8601 instant the schedule was created",
                      "type": "string"
                    },
                    "frequency": {
                      "description": "How often the test recurs; once is a one-off scheduled run",
                      "enum": ["daily", "weekly", "monthly", "once"],
                      "type": "string"
                    },
                    "isPaused": {
                      "description": "True when the schedule is paused; a paused schedule retains its schid and its nextRunAt",
                      "type": "boolean"
                    },
                    "lastRunAt": {
                      "description": "ISO 8601 instant of the most recent completed run, null when it has not run yet",
                      "type": ["string", "null"]
                    },
                    "nextRunAt": {
                      "description": "ISO 8601 instant of the next queued run. Retained while paused (it fires on resume); null for completed one-off runs or when nothing is scheduled yet",
                      "type": ["string", "null"]
                    },
                    "schid": {
                      "description": "Opaque 8-character schedule identifier, accepted by the gvt_schedule_test pause/resume/cancel/change_frequency modes",
                      "type": "string"
                    },
                    "status": {
                      "description": "Derived overall state; cancelled schedules are deleted outright and never appear here",
                      "enum": ["active", "paused", "completed"],
                      "type": "string"
                    },
                    "updatedAt": {
                      "description": "ISO 8601 instant of the most recent schedule change, null when never modified",
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "The monitored URL",
                      "type": "string"
                    },
                    "wpPostId": {
                      "description": "WordPress post ID when the schedule was created from the WordPress plugin, null otherwise",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "The applied status filter, null when unfiltered",
                "type": ["string", "null"]
              },
              "total": {
                "description": "Total schedules matching the filters, across all pages",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.igods.gvt/category": "Discovery"
          },
          "digest": "sha256:057d27896b9b353361f3d3ee5a5d582405f968db854c1f8b8f860a495f2a3745"
        },
        {
          "name": "gvt_list_sitemap_urls",
          "title": "List sitemap URLs",
          "description": "Discovers and ranks URLs from a domain's XML sitemaps to find the most significant pages (homepages, product pages, recently updated content) before analyzing them. Supports URL-pattern filtering and automatically flags robots.txt-blocked and already-tested pages. Legal/policy boilerplate (privacy, terms, cookies, disclaimers, refunds) is flagged legalPage:true with a -25 significance penalty; use the legalPages filter to drop it (exclude) or isolate it for a policy-coverage audit (only). Parameters group into three jobs: discovery (url), ranking and paging (limit, sort), and filtering (include and exclude URL patterns, excludeDisallowed, excludeTested, excludeScheduled, legalPages).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "exclude": {
                "description": "Wildcard patterns to reject (e.g., '*archive*').",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "excludeDisallowed": {
                "default": false,
                "description": "If true, silently drops URLs that are blocked by robots.txt.",
                "type": "boolean"
              },
              "excludeScheduled": {
                "default": false,
                "description": "If true, omits URLs currently in the testing queue.",
                "type": "boolean"
              },
              "excludeTested": {
                "default": false,
                "description": "If true, omits URLs the user has already tested.",
                "type": "boolean"
              },
              "include": {
                "description": "Wildcard patterns to require (e.g., '*blog*'). Only '*' wildcards are supported.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "legalPages": {
                "default": "include",
                "description": "Tri-state filter for legal/policy boilerplate pages (privacy, terms, cookies, disclaimers, refund policies, etc). \"include\" keeps them (default), \"exclude\" drops them, and \"only\" returns just the legal/policy pages — useful for auditing a site's policy coverage.",
                "enum": ["include", "exclude", "only"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of URLs to return (default 10).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "significance",
                "description": "How to sort the discovered URLs. 'significance' uses SEO heuristics.",
                "enum": ["significance", "lastmod", "alphabetical", "document"],
                "type": "string"
              },
              "url": {
                "description": "The target website URL or an explicit sitemap .xml URL.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Ranked URL discovery from a domain XML sitemaps",
            "properties": {
              "bulkUrlLimit": {
                "description": "How many of these URLs the caller's tier permits in one batch-analyze call.",
                "type": "integer"
              },
              "errors": {
                "description": "Per-sitemap fetch or parse failures; non-empty means discovery was partial",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "hasMore": {
                "description": "True when the filtered set was cut short by the limit",
                "type": "boolean"
              },
              "legalPages": {
                "description": "The legal-page filter actually applied",
                "enum": ["include", "exclude", "only"],
                "type": "string"
              },
              "legalPagesFound": {
                "description": "How many of the URLs discovered across all sitemaps were detected as legal/policy boilerplate, counted BEFORE any filtering or limiting is applied.",
                "type": "integer"
              },
              "limit": {
                "description": "Effective result cap",
                "type": "integer"
              },
              "matched": {
                "description": "URLs remaining after include/exclude and legalPages filters",
                "type": "integer"
              },
              "requestedUrl": {
                "description": "The URL or sitemap URL that was resolved",
                "type": "string"
              },
              "resolvedSitemaps": {
                "description": "Sitemap URLs actually parsed",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "returned": {
                "description": "URLs actually returned after the limit",
                "type": "integer"
              },
              "robotsTxtFound": {
                "description": "Whether a robots.txt was found and consulted",
                "type": "boolean"
              },
              "sitemapCount": {
                "description": "Number of sitemaps parsed",
                "type": "integer"
              },
              "sort": {
                "description": "The sort actually applied to the results",
                "enum": ["significance", "lastmod", "alphabetical", "document"],
                "type": "string"
              },
              "totalDiscovered": {
                "description": "Raw URL count discovered before filtering",
                "type": "integer"
              },
              "truncated": {
                "description": "True if the underlying sitemap parser hit its 5000-URL cap during fetching.",
                "type": "boolean"
              },
              "urls": {
                "description": "Discovered URLs, ranked per the sort setting",
                "items": {
                  "properties": {
                    "alreadyScheduled": {
                      "description": "True when this URL is already in the testing queue",
                      "type": "boolean"
                    },
                    "alreadyTested": {
                      "description": "True when the caller has an existing test for this URL",
                      "type": "boolean"
                    },
                    "changefreq": {
                      "description": "Sitemap change frequency hint, when present",
                      "type": ["string", "null"]
                    },
                    "disallowedByRobots": {
                      "description": "True when robots.txt disallows crawling this URL",
                      "type": "boolean"
                    },
                    "lastmod": {
                      "description": "Last-modified timestamp from the sitemap, when present",
                      "type": ["string", "null"]
                    },
                    "legalPage": {
                      "description": "True when detected as legal/policy boilerplate",
                      "type": "boolean"
                    },
                    "pathDepth": {
                      "description": "Path depth from the site root (1 = homepage)",
                      "type": "integer"
                    },
                    "priority": {
                      "description": "Sitemap priority hint, when present",
                      "type": ["number", "null"]
                    },
                    "significanceScore": {
                      "description": "SEO significance score used for the default ranking",
                      "type": "number"
                    },
                    "url": {
                      "description": "The discovered URL",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.igods.gvt/category": "Discovery"
          },
          "digest": "sha256:be0ba0bd80579f139e3a900686b5afec2e978f827ab90cc4435c4eb097e40d7e"
        },
        {
          "name": "gvt_list_tests",
          "title": "List tests",
          "description": "List visibility tests for the authenticated user, newest first. Supports filtering by domain (optionally including subdomains), by URL (exact or contains match), by creation date range, by status, and by test type. This is the tid and history discovery surface: use it to find the exact recorded URL string and tids that gvt_get_baseline, gvt_get_latest, and gvt_get_test_results require, and use gvt_get_score_trend instead when you only need baseline-vs-latest deltas — it skips the paging entirely.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "createdFrom": {
                "description": "Inclusive creation-date lower bound. YYYY-MM-DD (UTC midnight) or full ISO 8601 instant.",
                "type": "string"
              },
              "createdTo": {
                "description": "Exclusive creation-date upper bound. YYYY-MM-DD (UTC midnight) or full ISO 8601 instant.",
                "type": "string"
              },
              "domain": {
                "description": "Domain to filter tests by, e.g. example.com. Subdomains are included unless includeSubdomains is false.",
                "type": "string"
              },
              "includeSubdomains": {
                "default": true,
                "description": "If true (the default), includes tests for subdomains of the given domain. Set false to match the exact domain only.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Max results to return (default 10, max 100)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of records to skip before returning results (not a page number). Use offset=0 for the first page, offset=limit for the second page, etc.",
                "minimum": 0,
                "type": "integer"
              },
              "sortDirection": {
                "default": "desc",
                "description": "Sort direction by creation date: desc (newest first, default) or asc (oldest first).",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "status": {
                "description": "Test status to filter by: pending, processing, completed, or failed.",
                "enum": ["pending", "processing", "completed", "failed"],
                "type": "string"
              },
              "testType": {
                "description": "Test type to filter by: url, html, or html_paste.",
                "enum": ["url", "html", "html_paste"],
                "type": "string"
              },
              "url": {
                "description": "URL to filter tests by; matched per urlMode (contains by default).",
                "type": "string"
              },
              "urlMode": {
                "default": "contains",
                "description": "How the url filter matches: \"exact\" for full-URL equality, \"contains\" for substring match.",
                "enum": ["exact", "contains"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Filtered, paginated test history, newest first",
            "properties": {
              "createdFrom": {
                "description": "Effective lower creation-date bound, if any",
                "type": ["string", "null"]
              },
              "createdTo": {
                "description": "Effective upper creation-date bound, if any",
                "type": ["string", "null"]
              },
              "domain": {
                "description": "The domain filter actually applied, if any",
                "type": ["string", "null"]
              },
              "hasMore": {
                "description": "True when more pages exist",
                "type": "boolean"
              },
              "includeSubdomains": {
                "description": "Whether subdomains were included in the domain filter",
                "type": "boolean"
              },
              "limit": {
                "description": "Page size actually applied",
                "type": "integer"
              },
              "nextOffset": {
                "description": "Offset for the next page, null on the last page",
                "type": ["integer", "null"]
              },
              "offset": {
                "description": "Row offset applied to this page",
                "type": "integer"
              },
              "tests": {
                "description": "The matching test sessions on this page",
                "items": {
                  "description": "Test session summaries (tid, url, status, analysisSummary, createdAt)",
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Total matching tests before pagination",
                "type": "integer"
              },
              "ttlMs": {
                "description": "Suggested client cache lifetime in milliseconds",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.igods.gvt/category": "Discovery",
            "com.igods.gvt/ttlMs": 60000
          },
          "digest": "sha256:c279e7bdef4b3af56e158c30e4f2ab2dec5a72bc7e5f3ba43f43b773bbeb7b11"
        },
        {
          "name": "gvt_run_visibility_batch",
          "title": "Run batch tests",
          "description": "Queue up to 500 URLs for batch GEO visibility testing. Returns a batch ID for tracking progress. Optionally add URLs to recurring schedules (daily, weekly, monthly) during the same call. Poll gvt_get_batch_status with the batchId until status is completed or failed; then get the compact per-page score summary with gvt_get_batch_summary, or individual results with gvt_get_test_results. This tool queues paid test runs and consumes credits; for score interpretation, methodology, or reference knowledge, use gvt_get_knowledge instead — it never runs tests. A webhook URL can be provided to receive a completion notification; when set, the response returns webhookSecret, an HMAC key for verifying that the notification genuinely came from GVT. Duplicate URLs in the submitted array are collapsed, so totalUrls may be smaller than the array you sent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "urls": {
                "description": "Array of URL objects to test (max 500)",
                "items": {
                  "properties": {
                    "addToSchedule": {
                      "properties": {
                        "frequency": {
                          "description": "How often to re-run the test",
                          "enum": ["daily", "weekly", "monthly"],
                          "type": "string"
                        }
                      },
                      "required": ["frequency"],
                      "type": "object"
                    },
                    "url": {
                      "description": "The URL to analyze",
                      "type": "string"
                    },
                    "wpPostId": {
                      "description": "Optional WordPress post ID for association",
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "webhookUrl": {
                "description": "Optional HTTPS URL to receive a batch completion webhook",
                "type": "string"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Batch acknowledgement. Poll gvt_get_batch_status with the batchId until status is completed or failed, then retrieve results via gvt_get_test_results.",
            "properties": {
              "batchId": {
                "description": "UUID for tracking the batch",
                "type": "string"
              },
              "status": {
                "description": "Always queued at submission time",
                "enum": ["queued"],
                "type": "string"
              },
              "totalUrls": {
                "description": "URLs accepted into the batch",
                "type": "integer"
              },
              "webhookConfigured": {
                "description": "True when a completion webhook URL was supplied",
                "type": "boolean"
              },
              "webhookSecret": {
                "description": "HMAC secret for verifying the webhook, null when no webhook",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "com.igods.gvt/category": "Processing"
          },
          "digest": "sha256:3ee83c28987580507e33d138f6b9fba225d2539ad2d46c0c590e871ab53b7eb8"
        },
        {
          "name": "gvt_run_visibility_test",
          "title": "Run a visibility test",
          "description": "Run a GEO visibility test on a URL. Analyzes 7 categories: JavaScript dependencies (js), no-JS rendering (nojs), semantic HTML5, heading structure, schema.org markup, social tags, and accessibility. This is an async operation — it returns a tid immediately. Pass that tid to gvt_get_test_results to retrieve scores and issues once the test completes (poll until status is not \"pending\" or \"running\").",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The URL to analyze",
                "type": "string"
              },
              "waitForJs": {
                "default": true,
                "description": "Wait for JavaScript rendering before analysis. Set to false to skip JS rendering (faster, but may miss dynamically injected content).",
                "type": "boolean"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Async acknowledgement. Poll gvt_get_test_results with the returned tid until status is not pending or running.",
            "properties": {
              "message": {
                "description": "Human-readable acknowledgement with polling guidance",
                "type": "string"
              },
              "next": {
                "description": "The suggested next call",
                "properties": {
                  "arguments": {
                    "description": "Arguments for the next call",
                    "properties": {
