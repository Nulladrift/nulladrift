                "type": ["object", "null"]
              },
              "shareableTid": {
                "description": "Public share ID, non-null when shareable",
                "type": ["string", "null"]
              },
              "status": {
                "description": "Snapshot status (completed, failed, etc.)",
                "type": "string"
              },
              "testType": {
                "description": "The type of the test run",
                "enum": ["url", "html_paste"],
                "type": "string"
              },
              "tid": {
                "description": "Test ID of the snapshot",
                "type": "string"
              },
              "updatedAt": {
                "description": "ISO 8601 instant this snapshot was last updated",
                "type": "string"
              },
              "url": {
                "description": "The URL this snapshot analyzed",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
