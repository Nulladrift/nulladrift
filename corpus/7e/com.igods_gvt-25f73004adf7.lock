        {
          "name": "gvt_delete_test",
          "title": "Delete a test",
          "description": "Permanently delete a test session and all its associated results. This action cannot be undone. Use gvt_set_test_visibility instead if you only want to hide a test from public view. Deleting a test does not delete its schedule (if one exists): recurring runs continue until removed via gvt_schedule_test delete mode.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "tid": {
                "description": "The 8-character test ID of the test to delete.",
                "type": "string"
              }
            },
            "required": ["tid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "description": "Human-readable confirmation",
                "type": "string"
              },
              "success": {
                "description": "True when the test was deleted",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "com.igods.gvt/category": "Admin"
          },
          "digest": "sha256:d933191636b790463041b1315eceffaae723a690ce7ecc4ca14131ffbda9da9b"
        },
        {
          "name": "gvt_get_baseline",
          "title": "Get baseline snapshot",
          "description": "Get the oldest baseline test snapshot for a single URL, including expired tests. For pre-computed baseline-vs-latest deltas without fetching full snapshots, use gvt_get_score_trend instead; for baselines across many URLs in one call, use gvt_list_baselines. Use with gvt_get_latest to compare baseline vs current when you need the full snapshot detail on both ends. The url must be passed exactly as the test was run — matching is exact string equality (scheme, host, path, trailing slash), not nearest-match. When unsure of the recorded form, discover it with gvt_list_tests first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "The URL to look up (must match the URL used when the test was run).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Oldest baseline snapshot for one URL, including expired tests. On success the snapshot fields sit at the top level; when no test exists the response is { url, oldest: null, message }.",
            "properties": {
              "analysisSummary": {
                "description": "Aggregate scores for this test",
                "properties": {
                  "categoryIssueCounts": {
                    "description": "Open issue count per analysis category",
                    "properties": {
                      "accessibility": {
                        "description": "Number of open accessibility issues",
                        "type": "integer"
                      },
                      "headings": {
                        "description": "Number of open heading structure issues",
                        "type": "integer"
                      },
                      "javascript": {
                        "description": "Number of open JavaScript dependency issues",
                        "type": "integer"
                      },
                      "nojs": {
                        "description": "Number of open No-JS rendering issues",
                        "type": "integer"
                      },
                      "schema": {
                        "description": "Number of open schema.org markup issues",
                        "type": "integer"
                      },
                      "semantic": {
                        "description": "Number of open semantic HTML5 issues",
                        "type": "integer"
                      },
                      "social": {
                        "description": "Number of open social tag issues",
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "categoryScores": {
                    "description": "Score per analysis category (0-100)",
                    "properties": {
                      "accessibility": {
                        "description": "Accessibility score (0-100)",
                        "type": "number"
                      },
                      "headings": {
                        "description": "Heading structure score (0-100)",
                        "type": "number"
                      },
                      "javascript": {
                        "description": "JavaScript dependency score (0-100)",
                        "type": "number"
                      },
                      "nojs": {
                        "description": "No-JS rendering score (0-100)",
                        "type": "number"
                      },
                      "schema": {
                        "description": "schema.org markup score (0-100)",
                        "type": "number"
                      },
                      "semantic": {
                        "description": "Semantic HTML5 score (0-100)",
                        "type": "number"
                      },
                      "social": {
                        "description": "Social tags score (0-100)",
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "jsDependencySource": {
                    "description": "How the JS dependency score was derived",
                    "enum": ["measured", "estimated", "unavailable"],
                    "type": "string"
                  },
                  "overallScore": {
                    "description": "Overall GEO visibility score (0-100)",
                    "type": "number"
                  },
                  "timestamp": {
                    "description": "ISO 8601 instant of the analysis",
                    "type": "string"
                  },
                  "totalIssues": {
                    "description": "Total open issues across all categories",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "createdAt": {
                "description": "ISO 8601 instant this snapshot was created",
                "type": "string"
              },
              "expiresAt": {
                "description": "ISO 8601 instant this snapshot will expire",
                "type": ["string", "null"]
              },
              "findingSentence": {
                "description": "Pre-generated natural language verdict for this snapshot",
                "type": ["string", "null"]
              },
              "isPublic": {
                "description": "Whether this test is publicly visible",
                "type": "boolean"
              },
              "message": {
                "description": "Present only in the no-test case",
