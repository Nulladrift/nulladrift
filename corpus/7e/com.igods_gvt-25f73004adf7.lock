        {
          "name": "gvt_get_test_results",
          "title": "Get test results",
          "description": "Get results for a visibility test by tid: overall scores, findingSentence, shareableTid, and per-category resultData. The tid is an opaque 8-character HashID — copy it verbatim from gvt_run_visibility_test, gvt_list_tests, or gvt_get_batch_status; partial or reformatted values will not match, and results are scoped to the caller's own tests. If status is \"pending\" or \"running\", wait and retry. findingSentence is a pre-generated natural-language verdict; use it as the primary summary. shareableTid is non-null when the result is public and linkable. detail selects the payload shape: \"summary\" (recommended for reporting workflows) returns analysisSummary plus the top issues per category without the semantic tree, per-element markup, or the nojs_rendered duplicate pass; \"full\" (the default) returns complete per-category resultData for all 7 analysis types (heading, semantic, accessibility, schema, javascript, nojs, social). For compact per-page scores across a whole completed batch, prefer gvt_get_batch_summary instead of one call per tid.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "full",
                "description": "Payload shape. summary: analysisSummary plus the top issues per category (deduplicated by type, capped at 10, sorted by severity then weight) — no semantic tree, per-element markup, or nojs_rendered pass. full: complete resultData for all analysis types (previous behavior, the default).",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "tid": {
                "description": "Opaque 8-character hash ID returned by gvt_run_visibility_test or gvt_list_tests. Not an integer.",
                "type": "string"
              }
            },
            "required": ["tid"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Results for one test. While status is pending or running, results are incomplete — wait and retry. detail=summary returns the compact shape; detail=full (the default) returns complete per-category resultData.",
            "properties": {
              "analysisSummary": {
                "description": "Aggregate scores for one test session",
                "properties": {
                  "categoryIssueCounts": {
                    "description": "Open issue count per analysis category",
                    "properties": {
                      "accessibility": {
                        "description": "Number of open accessibility issues",
                        "type": "integer"
                      },
                      "headings": {
                        "description": "Number of open heading structure issues",
                        "type": "integer"
                      },
                      "javascript": {
                        "description": "Number of open JavaScript dependency issues",
                        "type": "integer"
                      },
                      "nojs": {
                        "description": "Number of open No-JS rendering issues",
                        "type": "integer"
                      },
                      "schema": {
                        "description": "Number of open schema.org markup issues",
                        "type": "integer"
                      },
                      "semantic": {
                        "description": "Number of open semantic HTML5 issues",
                        "type": "integer"
                      },
                      "social": {
                        "description": "Number of open social tag issues",
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "categoryScores": {
                    "description": "Score per analysis category (0-100)",
                    "properties": {
                      "accessibility": {
                        "description": "Accessibility score (0-100)",
                        "type": "number"
                      },
                      "headings": {
                        "description": "Heading structure score (0-100)",
                        "type": "number"
                      },
                      "javascript": {
                        "description": "JavaScript dependency score (0-100)",
                        "type": "number"
                      },
                      "nojs": {
                        "description": "No-JS rendering score (0-100)",
                        "type": "number"
                      },
                      "schema": {
                        "description": "schema.org markup score (0-100)",
                        "type": "number"
                      },
                      "semantic": {
                        "description": "Semantic HTML5 score (0-100)",
                        "type": "number"
                      },
                      "social": {
                        "description": "Social tags score (0-100)",
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "jsDependencySource": {
                    "description": "How the JS dependency score was derived",
                    "enum": ["measured", "estimated", "unavailable"],
                    "type": "string"
                  },
                  "overallScore": {
                    "description": "Overall GEO visibility score (0-100)",
                    "type": "number"
                  },
                  "timestamp": {
                    "description": "ISO 8601 instant of the analysis",
                    "type": "string"
                  },
                  "totalIssues": {
                    "description": "Total open issues across all categories",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "createdAt": {
                "description": "ISO 8601 instant of test creation",
                "type": "string"
              },
              "detail": {
                "description": "Present with value \"summary\" when detail=summary was requested; omitted from full responses so existing callers see no change",
                "enum": ["summary"],
                "type": "string"
              },
              "expiresAt": {
                "description": "ISO 8601 instant when this test session and its results will expire and be deleted",
                "type": ["string", "null"]
              },
              "findingSentence": {
                "description": "Pre-generated natural language verdict; use as the primary summary",
                "type": ["string", "null"]
              },
              "isPublic": {
                "description": "Whether this test result is publicly accessible",
                "type": ["boolean", "null"]
              },
              "results": {
                "description": "Per-category result records. detail=full: each carries analysisType and complete resultData (semantic tree, per-element issues); issues carry fixId for gvt_get_fix. detail=summary: each carries analysisType, score, and the top issues deduplicated by type (capped at 10 per category); the nojs_rendered duplicate pass is omitted — analysisSummary.categoryIssueCounts keeps the true totals.",
                "items": {
                  "properties": {
                    "analysisType": {
                      "description": "Which analysis category this record holds",
                      "enum": ["heading", "semantic", "accessibility", "schema", "javascript", "nojs", "social"],
                      "type": "string"
                    },
                    "issues": {
                      "description": "Issue records; in summary mode each carries type, severity, impact, weight, element, description, and fixId (remediation comes from gvt_get_fix, not the payload)",
                      "type": "array"
                    },
                    "score": {
                      "description": "Category score (0-100), present in summary mode when the category reports one",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "shareableTid": {
                "description": "Non-null when the result is publicly shareable. Public share identifier for this session. Equal to tid when the session is shareable; null when the session is private. Presence of a value is the indicator that share links may be generated.",
                "type": ["string", "null"]
              },
              "status": {
                "description": "Pending and running mean poll again; completed means full results are present",
                "enum": ["pending", "processing", "completed", "failed"],
                "type": "string"
              },
              "testType": {
                "description": "Type of test performed (e.g., URL or direct HTML paste)",
                "enum": ["url", "html_paste"],
                "type": "string"
              },
              "tid": {
                "description": "The test ID that was polled",
                "type": "string"
              },
              "updatedAt": {
                "description": "ISO 8601 instant of the last update to this test session",
                "type": "string"
              },
              "url": {
                "description": "The URL that was analyzed",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
