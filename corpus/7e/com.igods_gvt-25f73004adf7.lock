          "digest": "sha256:c0cf14eedf97c349011e56a9f0f1ca3f0f289b7a9737179f50a869edf33feb61"
        },
        {
          "name": "gvt_get_batch_status",
          "title": "Get batch status",
          "description": "Retrieves the current progress, state, and test IDs (tids) of an ongoing or completed visibility testing batch. Poll this tool with the batchId returned by gvt_run_visibility_batch until status is completed or failed. A tid appears on each URL entry only after its test completes — then call gvt_get_batch_summary for the compact per-page scores and top shared issues, or gvt_get_test_results for a single test. Batch records are retained for the lifetime of the account (no automated pruning); an unknown, pruned, or foreign batchId returns 404. Read-only: consumes rate limit, never test credits. Duplicate URLs in a batch are collapsed, so counts always sum to totalUrls.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "batchId": {
                "description": "The UUID of the batch to check, returned by gvt_run_visibility_batch.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["batchId"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Batch progress and per-URL state. Poll until status is completed or failed.",
            "properties": {
              "batchId": {
                "description": "The batch that was queried",
                "type": "string"
              },
              "completedAt": {
                "description": "ISO 8601 instant when the batch reached a terminal state, null while in flight",
                "type": ["string", "null"]
              },
              "counts": {
                "description": "Per-URL test state counts; the four fields always sum to totalUrls",
                "properties": {
                  "completed": {
                    "description": "Tests that completed successfully",
                    "type": "integer"
                  },
                  "failed": {
                    "description": "Tests that failed or were skipped",
                    "type": "integer"
                  },
                  "queued": {
                    "description": "Tests not yet started",
                    "type": "integer"
                  },
                  "running": {
                    "description": "Tests currently executing",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "status": {
                "description": "Aggregate batch state; completed means every per-URL test reached a terminal state",
                "enum": ["queued", "running", "completed", "failed"],
                "type": "string"
              },
              "submittedAt": {
                "description": "ISO 8601 instant of batch submission",
                "type": "string"
              },
              "totalUrls": {
                "description": "URLs in the batch after duplicate collapsing",
                "type": "integer"
              },
              "urls": {
                "description": "One entry per submitted URL, in submission order",
                "items": {
                  "properties": {
                    "status": {
                      "description": "This URL test state",
                      "enum": ["queued", "running", "completed", "failed"],
                      "type": "string"
                    },
                    "tid": {
                      "description": "Test ID once that test completed, null while queued, running, or failed",
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "The submitted URL",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.igods.gvt/category": "Analysis"
          },
          "digest": "sha256:4ceb2559e688c0390b32f55c46fc91f3607f962d2a09b10156ec380da01af895"
        },
        {
          "name": "gvt_get_batch_summary",
          "title": "Get batch summary",
          "description": "Compact per-page results and pre-computed aggregates for a completed visibility testing batch: per-URL overall and category scores, findingSentence, average overall score, strongest and weakest categories, best and worst scoring pages, and the top shared issue types with their fixIds. One call replaces one gvt_get_test_results call per URL for audit and status-report workflows — a 10-URL batch drops from roughly 1.6 MB to a few KB of context. The batch must be completed (poll gvt_get_batch_status first); an in-flight batch returns its current status without per-page data. Read-only: consumes rate limit, never test credits. For element-level detail on a single page, call gvt_get_test_results with that page's tid.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "batchId": {
                "description": "The UUID of the completed batch to summarize, returned by gvt_run_visibility_batch.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["batchId"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Compact per-page results and pre-computed aggregates for a completed batch. An in-flight or failed batch returns its status and counts without per-page data.",
            "properties": {
              "batchId": {
                "description": "The batch that was summarized",
                "type": "string"
              },
              "counts": {
                "description": "Per-URL test state counts; the four fields always sum to totalUrls",
                "type": "object"
              },
              "message": {
                "description": "Polling guidance, present when the batch is not completed",
                "type": "string"
              },
              "pages": {
                "description": "One compact entry per URL, in batch order. Failed tests appear with status failed and null scores; they are excluded from the aggregates.",
                "items": {
                  "properties": {
                    "categoryScores": {
                      "description": "Score per analysis category (0-100)",
                      "type": ["object", "null"]
                    },
                    "findingSentence": {
                      "description": "Pre-generated natural language verdict",
                      "type": ["string", "null"]
                    },
                    "overallScore": {
                      "description": "Overall GEO visibility score (0-100), null when the test failed",
                      "type": ["number", "null"]
                    },
                    "status": {
                      "description": "This URL test state",
                      "type": "string"
                    },
                    "tid": {
                      "description": "Test ID, for gvt_get_test_results deep dives",
                      "type": "string"
                    },
                    "url": {
                      "description": "The tested URL",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "Aggregate batch state; pages and summary are present only when completed",
                "enum": ["queued", "running", "completed", "failed"],
                "type": "string"
              },
              "summary": {
                "description": "Aggregates computed over the completed pages",
                "properties": {
                  "averageOverallScore": {
                    "description": "Mean overall score across completed pages, rounded to one decimal",
                    "type": ["number", "null"]
                  },
                  "bestPage": {
                    "description": "Highest scoring page: url and overallScore",
                    "type": ["object", "null"]
                  },
                  "categoryAverages": {
                    "description": "Mean score per category across completed pages",
                    "type": "object"
                  },
                  "strongestCategory": {
                    "description": "Category with the highest average score",
                    "type": ["string", "null"]
                  },
                  "topIssueTypes": {
                    "description": "Up to five issue types shared across pages (error and warning severities, counted once per page), each with its fixId for gvt_get_fix",
                    "items": {
                      "properties": {
                        "count": {
                          "description": "Pages carrying this issue type",
                          "type": "integer"
                        },
                        "fixId": {
                          "description": "fixId for gvt_get_fix, when the issue type is mapped",
                          "type": ["string", "null"]
                        },
                        "severity": {
                          "description": "Highest severity observed for this issue type",
                          "type": "string"
                        },
                        "type": {
                          "description": "Issue type identifier",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "weakestCategory": {
                    "description": "Category with the lowest average score",
                    "type": ["string", "null"]
                  },
                  "worstPage": {
                    "description": "Lowest scoring page: url and overallScore",
                    "type": ["object", "null"]
                  }
                },
                "type": "object"
              },
              "totalUrls": {
                "description": "URLs in the batch after duplicate collapsing",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "com.igods.gvt/category": "Analysis"
          },
          "digest": "sha256:2d113b2c1c0c8d0d09e7d1afcd54438b66ef87fe391d2b5562d108cc8ad9d0f2"
        },
        {
          "name": "gvt_get_fix",
          "title": "Read a fix record",
          "description": "Read the canonical fix record for one GVT issue type: severity range, impact, scoring weight, plain-language description, and the recommended remediation. Issue IDs come from the fixId field on issues in gvt_get_test_results output. The same content is served as the gvt://knowledge/fixes/{issue_id} resource template for resource-capable clients. Copy fixId verbatim from the results output — unknown or mistyped IDs return not-found rather than a fuzzy match. Responses are static reference content and cacheable.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "issue_id": {
                "description": "Stable issue identifier, e.g. og_title_missing or color-contrast. Matches the fixId field in gvt_get_test_results output.",
                "type": "string"
              }
            },
            "required": ["issue_id"],
            "type": "object"
          },
          "outputSchema": {
            "description": "Canonical fix record for one issue type",
            "properties": {
              "category": {
                "description": "Analysis category the issue belongs to",
                "type": "string"
              },
              "human_description": {
                "description": "Human-readable description of the issue",
                "type": "string"
              },
              "impact": {
                "description": "Plain-language statement of what the issue costs",
                "type": "string"
              },
              "issue_id": {
                "description": "Stable issue identifier, e.g. og_title_missing",
                "type": "string"
              },
              "recommendation": {
                "description": "The recommended remediation",
                "type": "string"
              },
              "resourceUri": {
                "description": "The gvt:// resource this record was read from",
                "type": "string"
              },
              "severity_range": {
                "description": "Severity levels this issue can take",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "subcategory": {
                "description": "Finer-grained grouping within the category",
                "type": "string"
              },
              "ttlMs": {
                "description": "Suggested client cache lifetime in milliseconds",
                "type": "integer"
              },
              "weight": {
                "description": "Scoring weight",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.igods.gvt/category": "Reference"
          },
          "digest": "sha256:654a9e2562dc6842c23ec51cbeefc15beec4d0b80845f45cf4119800fa8dd9d2"
        },
        {
          "name": "gvt_get_knowledge",
          "title": "Read GVT knowledge",
          "description": "Read GVT reference knowledge: how scoring works, score bands and category weights, what each analysis category checks, or GEO glossary definitions. Use it to interpret test results and scores correctly instead of guessing. The topic is matched exactly and case-sensitively (Methodology will not match methodology); unrecognized values fail fast with the valid list. The same content is served as MCP resources at gvt://knowledge/app/* for resource-capable clients.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "topic": {
                "default": "all",
                "description": "Which knowledge topic to read: methodology (how GVT analyzes pages), scoring (score bands and category weights), categories (what each of the six categories checks), glossary (GEO term definitions), or all (complete knowledge base).",
                "enum": ["all", "methodology", "scoring", "categories", "glossary"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "knowledge": {
                "description": "Reference content for the requested topic",
                "type": "object"
              },
              "topic": {
                "description": "The topic that was served",
                "enum": ["all", "methodology", "scoring", "categories", "glossary"],
                "type": "string"
              },
              "ttlMs": {
                "description": "Suggested client cache lifetime in milliseconds",
                "type": "integer"
              },
              "uri": {
                "description": "The gvt:// resource the content came from",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.igods.gvt/category": "Reference"
          },
          "digest": "sha256:91c3c3f29971a652d1bdc2fec0c53ae84168e477b7708aa01feae612845dc1ec"
        },
