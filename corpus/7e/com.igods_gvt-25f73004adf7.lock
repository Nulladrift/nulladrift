        {
          "name": "gvt_schedule_test",
          "title": "Manage schedules",
          "description": "Manage recurring GVT test schedules: add, delete, reset, pause, resume, cancel, and change_frequency. Discover existing schedules and their schids via gvt_list_schedules; control modes require a schid. For one-off tests use gvt_run_visibility_test; for queued batches without recurrence use gvt_run_visibility_batch. Modes: \"add\" upserts schedules for the provided urls without duplicating; \"delete\" permanently removes schedule entries by schid or url (test results are never deleted by any mode); \"reset\" is destructive — deletes all matching schedules first (domain-scoped when provided, otherwise ALL account-wide), then upserts the provided urls; \"pause\" halts reversibly; \"resume\" restarts a paused schedule and clears auto-pause reasons and failure counts; \"cancel\" permanently ends the schedule (schid unusable); \"change_frequency\" updates the recurrence interval. Management modes (add/delete/reset) require urls; control modes require schid. Subscription-tier enforcement applies.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Domain to scope a reset operation (reset mode only). e.g. \"example.com\". Matches https://, http://, with/without www., with/without trailing path. Omit to reset ALL schedules.",
                "type": "string"
              },
              "frequency": {
                "description": "New frequency for the schedule. Required for change_frequency mode.",
                "enum": ["daily", "weekly", "monthly"],
                "type": "string"
              },
              "mode": {
                "default": "add",
                "description": "Schedule operation mode. add/delete/reset operate on URLs (require urls array). pause/resume/cancel/change_frequency operate on a single schedule (require schid).",
                "enum": ["add", "delete", "reset", "pause", "resume", "cancel", "change_frequency"],
                "type": "string"
              },
              "schid": {
                "description": "Schedule ID. Required for pause, resume, cancel, and change_frequency modes.",
                "type": "string"
              },
              "urls": {
                "description": "Array of URL/schedule objects. Required for add, delete, and reset modes.",
                "items": {
                  "properties": {
                    "addToSchedule": {
                      "properties": {
                        "frequency": {
                          "description": "How often to re-run the test",
                          "enum": ["daily", "weekly", "monthly"],
                          "type": "string"
                        }
                      },
                      "required": ["frequency"],
                      "type": "object"
                    },
                    "schid": {
                      "description": "Schedule ID (required for delete/reset modes)",
                      "type": "string"
                    },
                    "url": {
                      "description": "The URL to schedule (required for add mode; optional in delete mode if schid is provided)",
                      "type": "string"
                    },
                    "wpPostId": {
                      "description": "Optional WordPress post ID for association",
                      "type": "string"
                    }
                  },
                  "required": [],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "description": "Result varies by mode: add/reset return upsertedCount and scheduled; delete returns deletedCount and deletedByUrl",
            "properties": {
              "deletedByUrl": {
                "description": "Per-URL breakdown of deleted schedules (delete mode). Present on delete mode responses, including schid-based deletes; omitted for reset mode.",
                "items": {
                  "properties": {
                    "count": {
                      "description": "Number of schedule entries deleted for this URL",
                      "type": "integer"
                    },
                    "frequencies": {
                      "description": "Frequencies that were removed for this URL",
                      "items": {
                        "enum": ["daily", "weekly", "monthly", "once"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "url": {
                      "description": "The URL whose schedules were deleted",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "deletedCount": {
                "description": "Schedule entries removed (delete/reset modes)",
                "type": "integer"
              },
              "scheduled": {
                "description": "Schedules now in effect (add/reset modes)",
                "items": {
                  "properties": {
                    "schid": {
                      "description": "Schedule ID for later pause/resume/cancel calls",
                      "type": "string"
                    },
                    "url": {
                      "description": "The URL placed on schedule",
                      "type": "string"
                    },
                    "wpPostId": {
                      "description": "Associated WordPress post ID, when provided",
                      "type": ["string", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "success": {
                "description": "True when the requested mode completed",
                "type": "boolean"
              },
              "upsertedCount": {
                "description": "Schedules created or updated (add/reset modes)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "com.igods.gvt/category": "Configuration"
          },
          "digest": "sha256:d139c7348179472c01e329c8c30c1daeafb54b8658f0f4804eec350a1d939e7f"
        },
        {
          "name": "gvt_set_test_visibility",
          "title": "Set test visibility",
          "description": "Toggle the public visibility of a test session. Set is_public to true to make the test shareable and receive its public share URL, or false to make it private. The response confirms the new state and, when making a test public, includes the share_url the recipient can visit without any authentication. is_public is the only lever: true both publishes and yields the link in this same response; false revokes access to any previously issued share_url immediately. This is the only way to control who can view a test result without requiring MCP authentication.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "is_public": {
                "description": "true to make the test publicly shareable, false to make it private.",
                "type": "boolean"
              },
              "tid": {
                "description": "The 8-character test ID returned by gvt_run_visibility_test.",
                "type": "string"
              }
            },
            "required": ["is_public", "tid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "is_public": {
                "description": "The new public visibility state",
                "type": "boolean"
              },
              "share_url": {
                "description": "Public share URL, present when is_public is true; the recipient needs no authentication. Null when sharing failed or the test is private",
                "type": ["string", "null"]
              },
              "success": {
                "description": "True when the visibility change was applied",
                "type": "boolean"
              },
              "tid": {
                "description": "The test that was modified",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "com.igods.gvt/category": "Configuration"
          },
          "digest": "sha256:d841cfb792e4d37bf4cc59e7ad4080d405a6b1ca115236b943c3e385a8324669"
        }
