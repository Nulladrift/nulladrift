        {
          "name": "gvt_get_score_trend",
          "title": "Get score trend",
          "description": "Compare the oldest baseline vs the latest non-expired test for a single URL or an entire domain, with pre-computed per-category deltas (latest minus baseline). Provide exactly one of url or domain. Domain mode matches the exact domain, www.<domain>, and subdomains (alphabetical, capped by limit). Page through the whole domain with offset: offset=0 for the first page, offset=limit for the second, following hasMore/nextOffset. Returns scores and deltas only, not full snapshot detail; for complete snapshots of one URL use gvt_get_baseline and gvt_get_latest. This replaces paging the full test history and computing comparisons client-side, one call per site.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Domain scope — matches the domain, www.<domain>, and subdomains (XOR with url).",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Cap on returned records in domain mode (max 100, default 25).",
                "maximum": 100,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of matched URLs to skip in domain mode (row skip, not a page number). Use offset=0 for the first page, offset=limit for the second. Ignored in single-URL mode.",
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "Single URL scope (XOR with domain).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "description": "Baseline vs latest comparison with pre-computed deltas, scoped to one URL or a whole domain",
            "properties": {
              "compare": {
                "description": "Comparison window settings used",
                "type": ["object", "null"]
              },
              "domain": {
                "description": "The compared domain in domain mode, else null",
                "type": ["string", "null"]
              },
              "hasMore": {
                "description": "True when more pages exist",
                "type": "boolean"
              },
              "includeSubdomains": {
                "description": "Whether subdomains were included in the domain search",
                "type": "boolean"
              },
              "limit": {
                "description": "Max records per page in domain mode",
                "type": "integer"
              },
              "nextOffset": {
                "description": "Offset for the next page, null on the last page",
                "type": ["integer", "null"]
              },
              "offset": {
                "description": "Row offset applied to this page",
                "type": "integer"
              },
              "returned": {
                "description": "Records in this page",
                "type": "integer"
              },
              "scope": {
                "description": "Which mode the comparison ran in",
                "enum": ["url", "domain"],
                "type": "string"
              },
              "trends": {
                "description": "One row per matched URL, baseline vs latest with deltas",
                "items": {
                  "properties": {
                    "baseline": {
                      "description": "One test snapshot: tid, createdAt, overallScore, categoryScores",
                      "properties": {
                        "categoryScores": {
                          "description": "Score per analysis category (0-100)",
                          "properties": {
                            "accessibility": {
                              "description": "Accessibility score (0-100)",
                              "type": "number"
                            },
                            "headings": {
                              "description": "Heading structure score (0-100)",
                              "type": "number"
                            },
                            "javascript": {
                              "description": "JavaScript dependency score (0-100)",
                              "type": "number"
                            },
                            "nojs": {
                              "description": "No-JS rendering score (0-100)",
                              "type": "number"
                            },
                            "schema": {
                              "description": "schema.org markup score (0-100)",
                              "type": "number"
                            },
                            "semantic": {
                              "description": "Semantic HTML5 score (0-100)",
                              "type": "number"
                            },
                            "social": {
                              "description": "Social tags score (0-100)",
                              "type": "number"
                            }
                          },
                          "type": "object"
                        },
                        "createdAt": {
                          "description": "ISO 8601 instant of this snapshot",
                          "type": "string"
                        },
                        "overallScore": {
                          "description": "Overall GEO visibility score (0-100), null when the test failed",
                          "type": ["number", "null"]
                        },
                        "tid": {
                          "description": "Test ID of this snapshot",
                          "type": "string"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "deltas": {
                      "description": "Latest minus baseline",
                      "properties": {
                        "categories": {
                          "description": "Per-category score change, latest minus baseline",
                          "properties": {
                            "accessibility": {
                              "description": "Accessibility score (0-100)",
                              "type": "number"
                            },
                            "headings": {
                              "description": "Heading structure score (0-100)",
                              "type": "number"
                            },
                            "javascript": {
                              "description": "JavaScript dependency score (0-100)",
                              "type": "number"
                            },
                            "nojs": {
                              "description": "No-JS rendering score (0-100)",
                              "type": "number"
                            },
                            "schema": {
                              "description": "schema.org markup score (0-100)",
                              "type": "number"
                            },
                            "semantic": {
                              "description": "Semantic HTML5 score (0-100)",
                              "type": "number"
                            },
                            "social": {
                              "description": "Social tags score (0-100)",
                              "type": "number"
                            }
                          },
                          "type": "object"
                        },
                        "overall": {
                          "description": "Overall score change, latest minus baseline",
                          "type": ["number", "null"]
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "isSameTest": {
                      "description": "True when baseline and latest are the same test (no movement yet)",
                      "type": "boolean"
                    },
                    "latest": {
                      "description": "One test snapshot: tid, createdAt, overallScore, categoryScores",
                      "properties": {
                        "categoryScores": {
                          "description": "Score per analysis category (0-100)",
                          "properties": {
                            "accessibility": {
                              "description": "Accessibility score (0-100)",
                              "type": "number"
                            },
                            "headings": {
                              "description": "Heading structure score (0-100)",
                              "type": "number"
                            },
                            "javascript": {
                              "description": "JavaScript dependency score (0-100)",
                              "type": "number"
                            },
                            "nojs": {
                              "description": "No-JS rendering score (0-100)",
                              "type": "number"
                            },
                            "schema": {
                              "description": "schema.org markup score (0-100)",
                              "type": "number"
                            },
                            "semantic": {
                              "description": "Semantic HTML5 score (0-100)",
                              "type": "number"
                            },
                            "social": {
                              "description": "Social tags score (0-100)",
                              "type": "number"
                            }
                          },
                          "type": "object"
                        },
                        "createdAt": {
                          "description": "ISO 8601 instant of this snapshot",
                          "type": "string"
                        },
                        "overallScore": {
                          "description": "Overall GEO visibility score (0-100), null when the test failed",
                          "type": ["number", "null"]
                        },
                        "tid": {
                          "description": "Test ID of this snapshot",
                          "type": "string"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "testCount": {
                      "description": "Total tests ever run for this URL",
                      "type": "integer"
                    },
                    "url": {
                      "description": "The URL this trend row describes",
                      "type": "string"
