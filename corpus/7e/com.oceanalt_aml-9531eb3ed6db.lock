                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "evidence_qualification": {
                "type": "object"
              },
              "intelligence": {
                "type": "object"
              },
              "intent_check": {
                "type": "object"
              },
              "lang": {
                "enum": ["en", "zh"],
                "type": "string"
              },
              "note": {
