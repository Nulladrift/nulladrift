        {
          "name": "check_calldata_intent",
          "title": "Decode calldata and compare with declared intent (free)",
          "description": "Anti blind-signing. EVM: decodes what a transaction's calldata will actually do (ERC-20 transfer/approve/permit, setApprovalForAll, ownership transfer, native transfer). Solana: decodes a whole base64 transaction (SPL Token / Token-2022 Transfer, TransferChecked, Approve, SetAuthority, CloseAccount, Burn; System Transfer / Assign; ATA creation). Compares it with what you believe you are doing. EVM: pass intent:{action:'pay', to, amount} plus contract (the transaction's to) and data (hex calldata). Solana: pass network:'solana' and transaction (base64) instead of data. decision match = does what you declared; mismatch = different recipient/amount/asset, or an approval / authority change instead of a payment — do not sign; unknown = could not decode (including address-lookup-table accounts), which is not the same as safe.",
          "inputSchema": {
            "properties": {
              "contract": {
                "description": "EVM only: the transaction's `to` field (token contract for ERC-20 payments, or the recipient for native transfers).",
                "type": "string"
              },
              "data": {
                "description": "EVM only: 0x-prefixed hex calldata.",
                "type": "string"
              },
              "intent": {
                "properties": {
                  "action": {
                    "enum": ["pay"],
                    "type": "string"
                  },
                  "amount": {
                    "description": "Base units (e.g. 10 USDC = 10000000).",
                    "type": "string"
                  },
                  "asset": {
                    "description": "EVM: symbol/contract (optional). Solana: mint address (optional, checked against TransferChecked).",
                    "type": "string"
                  },
                  "to": {
                    "description": "EVM: recipient address. Solana: wallet or token account.",
                    "type": "string"
                  }
                },
                "required": ["action", "to"],
                "type": "object"
              },
              "network": {
                "description": "'solana' to decode a Solana transaction; EVM chain name or CAIP-2 id otherwise (optional).",
                "type": "string"
              },
              "transaction": {
                "description": "Solana only: base64-serialized transaction or message.",
                "type": "string"
              },
              "value": {
                "description": "EVM only: native value in wei (optional).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check calldata against intent (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8e28f74d8c130b72b63a49c29f508d11aebef4c5661a5ed70c607f244229620"
        },
        {
          "name": "check_payment_request",
          "title": "Check an email, invoice or message that asks you to pay (free)",
          "description": "Call this before paying because an email, invoice or chat message asked you to. Pass what you received: raw headers if you have them, the From line, subject and body (or body_html), and the payee address if you already extracted one. OceanAlt checks whether the sender is who it claims to be (SPF/DKIM/DMARC results, a display name that names another domain, Reply-To sent elsewhere), whether the sender domain or any link imitates a brand or is a known phishing host, whether the payee address is listed or differs from previous_pay_to, and whether the text pressures the reader, announces changed payment details, or carries instructions aimed at an AI. Returns allow | review | decline with findings. On decline, do not pay from this message; confirm through a channel you already trust. The text is processed in memory and not stored. Free, no API key.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "Plain-text body, invoice text or chat message",
                "type": "string"
              },
              "body_html": {
                "description": "HTML body, if available (lets OceanAlt compare link text with where links really go)",
                "type": "string"
              },
              "expected_sender_domain": {
                "description": "The domain this requester normally sends from, if you know it",
                "type": "string"
              },
              "from": {
                "description": "The From line, e.g. \"Acme Billing\" <billing@acme.com>",
                "type": "string"
              },
              "headers": {
                "description": "Raw email headers, if available (needed to check SPF/DKIM/DMARC)",
                "type": "string"
              },
              "lang": {
                "description": "Language for human-readable fields. Defaults to English.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "network": {
                "description": "Network of pay_to, e.g. base, ethereum, tron, solana",
                "type": "string"
              },
              "pay_to": {
                "description": "The payee address the message asks you to pay, if you already extracted it",
                "type": "string"
              },
              "previous_pay_to": {
                "description": "The address you paid this requester last time, if any",
                "type": "string"
              },
              "reply_to": {
                "description": "The Reply-To line, if any",
                "type": "string"
              },
              "subject": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["decision", "findings", "reason_code", "signal_keys"]
              },
              {
                "properties": {
                  "reason_code": {
                    "const": "invalid_input"
                  }
                },
