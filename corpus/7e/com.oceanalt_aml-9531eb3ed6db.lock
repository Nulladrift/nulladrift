        {
          "name": "recent_flagged",
          "title": "List recently flagged addresses (free)",
          "description": "Return a representative sample of addresses on OceanAlt's reviewed risk list — OFAC-sanctioned, known mixers, and scam/phishing — each with its source category and reason. Takes no arguments. Free, no API key.",
          "inputSchema": {
            "properties": {},
