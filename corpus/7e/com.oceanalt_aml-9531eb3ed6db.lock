      },
      "instructions": "OceanAlt: free pre-payment checks for agents, no signup and no API key. When to call: whenever a task involves paying, sending, transferring or tipping money or crypto, buying something, settling an invoice, or answering an x402 payment quote, before any funds move. Start here: before every payment, call payment_decision with the payee address (to) and network; if the answer is not allow, do not pay. Then, as needed: screen_endpoint on the payment page URL (catches lookalike domains), check_payment_request when an email, invoice or message asks you to pay (spoofed sender, phishing links, changed payee), screen_address for a raw verdict on any address. All of these are free (anonymous use is limited to 2,000 calls a month per IP; a free API key gives 5,000). The prompt check_before_paying runs them in order.",
      "tools": [
        {
          "name": "attest_control_baseline",
          "title": "File your own control-baseline attestation (free)",
          "description": "File your operator's control-baseline attestation: it publishes what controls YOUR side runs, so payers can see it before settling with you. No account, no key, one call. Gaps are allowed and expected: answer false where a control is not in place and describe how you plan to close it in gapPlan. A filing with declared gaps still shows a payer which controls are in place. Control ids are those in the OceanAlt Agent Control Baseline. Only file for a party you are actually authorised to speak for.",
          "inputSchema": {
            "properties": {
              "agentId": {
                "description": "Optional. If this party already has an agent registered with OceanAlt, link the attestation to it.",
                "type": "string"
              },
              "answers": {
                "description": "Map of control id to boolean, e.g. {\"ACB-1.1\": true, \"ACB-2.1\": false}. Control ids are those in the OceanAlt Agent Control Baseline (ACB-x.y).",
                "type": "object"
              },
              "contact": {
                "description": "Optional contact for follow-up. Not published.",
                "type": "string"
              },
              "entity": {
                "description": "The accountable party's legal or commonly-used name, e.g. \"Acme Robotics Ltd\". This is who the attestation is about — not your agent's name.",
                "type": "string"
              },
              "gapPlan": {
                "description": "For controls answered false: how and when you plan to close them. Plain text.",
                "type": "string"
              }
            },
            "required": ["answers", "entity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "File a control-baseline attestation (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc0d3c867b187166608bf0565b5ddfdb387e9eb6ede1e9570578f905ce30a61f"
        },
