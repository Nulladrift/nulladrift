        {
          "name": "payment_decision",
          "title": "Call before every payment: allow, review or decline (free, no API key)",
          "description": "Call before sending funds, buying a service, settling an invoice or answering an x402 payment quote. Pass the payee address (to) and network to get allow | review | decline, evidence and retry semantics. Only an explicit allow passes this risk check; review, decline, missing or unknown decisions and errors are not permission to pay. This tool does not transfer funds or grant payment authorization. A signed receipt or attestation records the decision, including review; a valid signature does not turn review into approval or prove settlement. If a receipt is returned, its Ed25519 signature can be verified with the public key at https://oceanalt.com/.well-known/oceanalt-keys.json. Pass resource_url to check the origin's payment quote against the payee; a different payee or an unavailable check raises the decision to review. A match is not an endorsement of the seller. Free within the monthly allowance; no signup or key is required to start. Anonymous allowance exhaustion is an error, not a risk decision.",
          "inputSchema": {
            "properties": {
              "amountUsdc": {
                "description": "Amount in USDC (optional; recorded, not required for the decision).",
                "type": "number"
              },
              "lang": {
                "description": "Language for human-readable fields (signals, note, advice). Defaults to English.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "maxAmountUsdc": {
                "description": "Optional declared per-payment cap in USDC. amountUsdc above it → decline.",
                "type": "number"
              },
              "network": {
                "description": "EVM chain, only for a 0x address. Leave it out for Tron, Solana, Bitcoin and XRP Ledger addresses: the chain is detected from the address.",
                "enum": ["ethereum", "base", "bsc", "polygon", "arbitrum", "optimism", "avalanche", "arc"],
                "type": "string"
              },
              "purpose": {
                "description": "Short purpose/memo (optional).",
                "type": "string"
              },
              "reasoning": {
                "description": "Optional payment intent: why this payee. Instruction-override phrases here route the payment to review.",
                "type": "string"
              },
              "resource_url": {
                "description": "Optional: the http(s) URL of the paid resource, i.e. the URL that returned the 402 payment quote. OceanAlt asks that origin for its own quote and checks whether it names this payee (origin binding).",
                "type": "string"
              },
              "task": {
                "description": "Optional payment intent: what this payment is for. Sending task, reasoning or maxAmountUsdc opts into a deterministic intent check; an empty intent is itself a finding (requires_information).",
                "type": "string"
              },
              "to": {
                "description": "Payee address the agent is about to pay: 0x (EVM), T… (TRON), Solana, Bitcoin or r… (XRP Ledger); list matching only: Monero (4…/8…), Bitcoin Cash (q…/p…, optional bitcoincash: prefix), Litecoin (ltc1…) or BNB Beacon Chain (bnb1…).",
                "examples": ["0xd90e2f925DA726b50C4Ed8D0Fb90Ad053324F31b"],
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "outputSchema": {
            "anyOf": [
              {
                "required": ["address", "allow", "decision", "reason_code", "retry", "signal_keys", "verdict"]
              },
              {
                "properties": {
                  "reason_code": {
                    "const": "invalid_input"
                  }
                },
                "required": ["code", "reason_code", "retry"]
              }
            ],
            "properties": {
              "accepted_networks": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "address": {
                "type": "string"
              },
              "allow": {
                "description": "if (!allow) do not pay.",
                "type": "boolean"
              },
              "blocked": {
                "type": "boolean"
              },
              "cached": {
                "type": "boolean"
              },
              "code": {
                "description": "Input error code, e.g. unknown_network, network_address_mismatch, unparsable_url.",
                "type": "string"
              },
              "decision": {
                "enum": ["allow", "review", "decline"],
                "type": "string"
              },
              "detail_level": {
                "enum": ["full", "coarse"],
                "type": "string"
              },
              "detail_note": {
                "type": "string"
              },
              "error": {
                "description": "Present only on an input error (isError: true).",
                "type": "string"
              },
              "evaluated_at": {
                "format": "date-time",
                "type": "string"
              },
              "evidence": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "evidence_as_of": {
