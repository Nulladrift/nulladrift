              }
            ],
            "properties": {
              "decision": {
                "enum": ["allow", "review", "decline"],
                "type": "string"
              },
              "findings": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "reason_code": {
                "type": "string"
              },
              "signal_keys": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a payment request (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:615272a5fbde3f3bcdd6d7b21533e5ebf657cc44ce0c894c629e7fb51e702852"
        },
        {
          "name": "counterparty_control_baseline",
          "title": "Check a counterparty's control baseline before paying (free)",
          "description": "Answers a different question from address screening. Screening asks whether an address is risky; this asks how much damage the agent on the other side could do if it were talked into something. Returns that party's self-attestation against the OceanAlt Agent Control Baseline, split into two sets that must NOT be conflated: verified_by_oceanalt (enforced by the gateway on every payment — provable) and self_claimed (what they state about their own side — NOT verified by OceanAlt). Most parties have not attested: found:false means no information, not a bad signal.",
          "inputSchema": {
            "properties": {
              "agentId": {
                "description": "Their agent id, if you have that instead.",
                "type": "string"
              },
              "entity": {
                "description": "The counterparty's entity name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Counterparty control baseline (free)"
          },
          "behavior": {
            "destructive": false,
