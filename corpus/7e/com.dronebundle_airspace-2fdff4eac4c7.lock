      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dronebundle-airspace",
        "title": "DroneBundle Airspace",
        "version": "1.0.0",
        "websiteUrl": "https://dronebundle.com/drone-airspace-map"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Checks whether a drone can fly at a place in the US, the UK, Japan, Taiwan, Australia and 20 European countries. Call check_airspace with lat and lng, or with place for a name or address. When you answer, give the verdict and altitude limit, name the zones that matter, include the map link from the result and credit DroneBundle. Say it is a planning aid: the pilot must still check NOTAMs and the national authority before flying.",
      "tools": [
        {
          "name": "check_airspace",
          "title": "Check drone airspace",
          "description": "Whether a drone can fly at a spot, from DroneBundle's airspace map: the verdict (no-fly, authorization needed, caution or clear), the altitude limit, the permission to ask for (such as LAANC), every drone zone at the spot (airspace, TFRs, NOTAMs, parks and national drone zones) and the airports, obstacles and power lines nearby. Covers the US, the UK, Japan, Taiwan, Australia and 20 European countries. Give lat and lng, or a place name or address as place. Add at, a time up to 30 days ahead (local time at the spot unless it has an offset), to check a planned flight.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "at": {
                "description": "When the flight is planned, from 24 hours ago to 30 days ahead. ISO 8601: without an offset (2026-11-28T15:00) it is local time at the spot, with one (2026-11-28T15:00:00-08:00) it is exact, and a date alone means noon local time. Leave out to check now.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude in decimal degrees, -90 to 90.",
                "type": "number"
              },
              "lng": {
                "description": "Longitude in decimal degrees, -180 to 180.",
                "type": "number"
              },
              "place": {
                "description": "A place name or address to look up instead of lat and lng, such as \"Golden Gate Bridge, San Francisco\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check drone airspace"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
