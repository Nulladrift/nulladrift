{
  "lockfileVersion": 2,
  "subjects": {
    "com.automarketatlas/vehicle-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://automarketatlas.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "AutoMarket Atlas",
        "version": "1.30.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Discover supported used-car markets, find exact vehicle names, read asking-price trends, and estimate values from local comparable listings. Prices use the quoted currency of the underlying listings. Try up to 3 unauthenticated valuation requests per network per UTC day. POST /v1/account over REST for a reusable key and up to 20 signup valuations. Store credentials in your client secret store and pass the key as an Authorization header. Use a stable request_id for retries. Pass max_charge_cents=0 when using signup rewards only.",
      "tools": [
        {
          "name": "account_status",
          "description": "Read remaining signup valuations and USD balance using the client's Bearer key.",
          "inputSchema": {
            "properties": {},
            "title": "account_statusArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cff33c380f18bb9eccaf27f4003b64ad78af0da71526416cc7ab1dfe66020858"
        },
        {
          "name": "estimate_vehicle",
          "description": "Get a comparable-listing valuation. Odometer input is in kilometers.\n\n    Guest requests are limited. An authenticated call uses a signup reward first,\n    then the prepaid USD balance. Supply max_charge_cents=0 for free-only use.\n    Keep request_id stable across retries. Only successful valuations use credit.\n    Follow error.next_action to create an account or get a hosted checkout link.\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "title": "Country",
                "type": "string"
              },
              "fuel": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Fuel"
              },
              "make": {
                "title": "Make",
                "type": "string"
              },
              "max_charge_cents": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Max Charge Cents"
              },
              "mileage_km": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Mileage Km"
              },
              "model": {
                "title": "Model",
                "type": "string"
              },
              "request_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Request Id"
              },
              "transmission": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Transmission"
              },
              "year": {
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["country", "make", "model", "year"],
            "title": "estimate_vehicleArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc96f5ef36b082a1d72f3bb6f09c53d81ca1d99e5b13516a3aa3e1a1b3f5c140"
        },
        {
          "name": "find_vehicles",
          "description": "Find exact supported make, model, and year values before requesting an estimate.",
          "inputSchema": {
            "properties": {
              "country": {
                "title": "Country",
                "type": "string"
              },
              "query": {
                "default": "",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "find_vehiclesArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:309093a72b875bb2cfa7015ff5a1d0c55274d2a4b70ef04c63b2b446ab7b74bd"
        },
        {
          "name": "list_markets",
          "description": "List markets with prepared data, native currencies, sources, and snapshot dates.",
          "inputSchema": {
            "properties": {},
            "title": "list_marketsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:08e5562714ed580e43ec30b2a0aae5155e597891ff1888bf370e41f6e3f99870"
        },
        {
          "name": "market_trends",
          "description": "Return weekly asking-price medians and interquartile ranges in the native market currency.",
          "inputSchema": {
            "properties": {
              "country": {
                "title": "Country",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "market_trendsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f3b8c2c2270e508cc91e610732d584bd007aeee54298ad45e653190b337f096"
        }
      ],
      "digest": "sha256:3fa6fd3669f7d1e8709a89d86f947ef80c7aadfca995fe40401e1f0acb595c03"
    }
  }
}
