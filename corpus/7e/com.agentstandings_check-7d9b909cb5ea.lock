{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentstandings/check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentstandings.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agentstandings-check",
        "title": "Agent Standings check",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Call check_tool before relying on a remote MCP server to see whether it is up and whether its tool schemas changed recently. Automated, factual measurements of public endpoints; not an endorsement.",
      "tools": [
        {
          "name": "check_tool",
          "title": "Check an MCP server",
          "description": "Live status and 30-day reliability of a public remote MCP server, from independent hourly probes. Pass the registry name (e.g. \"com.example/server\"), the endpoint URL or host, or the short server name. Returns status (up, auth required, degraded, down, error, blocked), latency, tool count, schema hash, uptime, incidents and tool-schema drift events.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Registry name, endpoint URL, host, or short name",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f6cbb01f5a4b2b8fcc7737e84776095f3a36d60b1d078256e7978c800e919f2"
        },
        {
          "name": "standings",
          "title": "Daily standings",
          "description": "The latest daily standings of tracked MCP servers, ranked by 7-day uptime then p95 latency.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Rows to return (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:03b2e7ed958d6755c928a226c4aecd77a4166e8ed16bb66f470891afe5407584"
        }
      ],
      "digest": "sha256:8bf53e62e3346dc6ee8a4a00a8a9a6743dd0bc683d51c6d00c565aa6596becc3"
    }
  }
