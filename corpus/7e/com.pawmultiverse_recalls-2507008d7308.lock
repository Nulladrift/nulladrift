{
  "lockfileVersion": 2,
  "subjects": {
    "com.pawmultiverse/recalls": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pawmultiverse.com/mcp-recalls"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "pawmultiverse-recall-record",
        "title": "Paw Multiverse pet food recall record",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "A cross-border record of pet food recalls, built by reading five official government registers on a schedule and keeping each entry after the authority takes it down. Use it to answer whether a specific bag of pet food has been recalled, to read one authority notice with every dated version of it held, to state how current the record is, and to find the same product recalled in more than one country. Two rules matter when answering from it. First, a no-match is never safety: it means no listed authority has published a recall against that barcode in what has been read, and recalls are often announced by lot or best-before date rather than by barcode, so say that rather than reassuring anyone. Second, a country that does not appear in list_recall_registers is not covered, and nothing may be inferred about it. This record holds published recall notices only: no veterinary advice, no doses, no toxicity thresholds and no treatment guidance. If someone describes an animal that is already unwell, tell them to contact a veterinarian.",
      "tools": [
        {
          "name": "ask_recall_record",
          "title": "Ask a question about pet food recalls",
          "description": "Ask in plain language about a brand, product, barcode, lot code, country or reason (\"Has Purina been recalled in the UK?\", \"salmonella recalls in France in 2025\"). Returns a short answer written only from the matching official notices, with numbered sources (URL, date, country, brand, product, reason, lot codes, barcodes, official notice). Coverage is the US, UK, Canada and France. A question with no match is not evidence that a product is safe; say so.",
          "inputSchema": {
            "properties": {
              "question": {
                "description": "The question, in any wording. Up to 300 characters.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:587dacda931a43896d4017997f20385d5ec5c27e65afccf45386b177d8d73696"
        },
        {
          "name": "check_pet_food_bag",
          "title": "Check a bag of pet food by its barcode",
          "description": "Given the barcode printed on a bag, tin or pouch of pet food (EAN, UPC or GTIN), return every recall notice held against that barcode across all of the registers this record covers, in one answer. Also returns how much of each country register is held, so that finding nothing can be reported honestly. IMPORTANT: no match does NOT mean the product is safe. It means no authority whose register is listed here has published a recall carrying that barcode in what has been read so far. Say that, and do not translate it into a reassurance. Many recalls are announced by lot or best-before date rather than by barcode, so a matching bag can still be affected; when a match is returned, check the lot and best-before codes on the notice against the ones on the bag before drawing a conclusion.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The barcode as printed, digits only. EAN-13, UPC-A or GTIN.",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0486f656fd9f0fc11446654865be1efd697bbe177284c7bb1392676a73edce2"
        },
        {
          "name": "cross_border_recalls",
          "title": "List products recalled in more than one country",
          "description": "Return the products that appear in more than one country register, matched on barcode: the same item recalled by two or more authorities. This view exists nowhere else, including at the authorities themselves, each of which publishes only its own country. Use it to answer whether a recall in one country has a counterpart elsewhere. A product appearing in only one country here has not been shown to be safe in the others; it has only not been matched.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38377e095ecdbd412b70018d7e121fc0a4032755cdfa6e479963810454742b81"
        },
        {
          "name": "get_recall_record",
          "title": "Read one recall record with all of its versions",
          "description": "Return one entry from the record in full: what the authority published, the firm, the product, the reason given, the lot and best-before codes where they were published, and every dated version held, so that a change the authority made to its own notice is visible. Also returns whether the entry is still listed on the authority site or has been removed from it, and the date it was last seen. Identify the entry either by its id (the \"source:key\" string returned by the other tools) or by source and key separately.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The record id in the form source:key, for example us-fda-animal-recalls:2026-09-08-db4bc500.",
                "type": "string"
              },
              "key": {
                "description": "The key within that register, if giving source and key separately.",
                "type": "string"
              },
              "on": {
                "description": "Optional date, YYYY-MM-DD. Read the entry as it stood on that date rather than as it stands now.",
                "type": "string"
              },
              "source": {
                "description": "The register slug, if giving source and key separately.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60ce8ff05fdbb28943d34ed7469e5cc117ab09f83a3a38e910806e4a2d1547b3"
        },
        {
          "name": "list_recall_registers",
          "title": "List the registers and how fresh each one is",
          "description": "Return every official register this record reads, with the authority that publishes it, its licence, how many entries are held from it, how often it is read, and the last time it was read without error. Use this before quoting the record to establish how current it is, and to tell someone which countries are covered and which are not. A country that is not listed here is not covered, and nothing should be inferred about it.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:853328d1a62afba27e206a19d7ea64a2e282d292cafcddef051ed13f377030e6"
        },
        {
          "name": "search_recalls",
          "title": "Search recalls by brand, product, country, reason or year",
          "description": "Keyword search over every recall held, without any AI writing. Returns up to 20 matching notices with their permanent URLs and key facts, newest and best matches first. Filter by country (us, gb, ca, fr) and year.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional: us, gb, ca or fr.",
                "type": "string"
              },
              "query": {
                "description": "Brand, company, product words, reason (for example salmonella), lot code or barcode.",
                "type": "string"
              },
              "year": {
                "description": "Optional: four-digit year of the notice.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2cf6a868a847dda9ddd75d8166028a2ebbd313e5661ccf29f7915d761145b963"
        }
      ],
      "digest": "sha256:2d1729e84016324d14c8bd9af048bdde8817ae78a754916a921a67b6adf4c2a6"
    }
  }
}
