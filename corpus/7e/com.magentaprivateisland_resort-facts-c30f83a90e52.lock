{
  "lockfileVersion": 2,
  "subjects": {
    "com.magentaprivateisland/resort-facts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://magentaprivateisland.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "magenta-public-facts",
        "version": "0.3.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Approved, current facts about Magenta Private Island, a luxury all-inclusive private island resort off Placencia, Belize, written in guest-ready wording and maintained by the resort. Rates are per night and before tax and fees. check_availability gives live availability and prices for dates; reservations are made by the traveler on the booking page (get_booking_link); submit_inquiry reaches the reservations team.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Live availability and prices for specific dates from the resort's booking system: which villas, suites or the whole island are open, the average nightly rate and the total before tax and fees, plus a booking link with the dates filled in. Unit counts are not shown.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Adults in the whole party.",
                "maximum": 22,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["check_in", "check_out"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2e439535d43554e01d6d993e0475328c1ab0c0ebd3a5618aca5fddd02791295a"
        },
        {
          "name": "get_booking_link",
          "title": "Get a booking link",
          "description": "Returns the resort's booking page with the dates filled in, where the traveler chooses a villa or suite and pays securely. No reservation is made by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["check_in", "check_out"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:144f19e634265ecd13cfc76d9ad108b6a7d711f5faba7c49564d3592ef91eb3f"
        },
        {
          "name": "get_policy",
          "title": "Get a booking policy",
          "description": "Returns the current booking policy facts on one subject: deposit, balance, cancellation, minimum stay, check-in, children, gratuity, payment, whole-island terms, holiday dates or smoking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "subject": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8eadb2b96b58823e1b964a6b0999b8d2a206323fb7a05b3f9f75cb81503d4cf9"
        },
        {
          "name": "how_to_book",
          "title": "How to book",
          "description": "Returns the booking page for live availability and reservations, and the phone number and email of the reservations team for exact totals, whole-island stays and other questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3303925ac7abca66ed3b57b55d0d282204dbaaddfdc283bf0a3db273f72d70f6"
        },
        {
          "name": "list_topics",
          "title": "List fact topics",
          "description": "Lists the fact topics and how many facts each holds, with the date and fingerprint of the published fact set.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17980e915c7ab307ba654b88b0518f25fd2a8d9c12c40a6745ab93bd863e0495"
        },
        {
          "name": "search_facts",
          "title": "Search resort facts",
          "description": "Searches the approved, current facts about Magenta Private Island, a luxury all-inclusive private island resort off Placencia, Belize: villas and suites, rates, inclusions, dining and drinks, activities, getting there, families, deposits and cancellation. Returns matching facts in guest-ready wording with their date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the guest asked about, e.g. \"deposit\", \"children\", \"spa\", \"transfer\", \"holiday rates\".",
                "maxLength": 200,
                "type": "string"
              },
              "topic": {
                "description": "Optional topic filter; see list_topics.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f2d51865a1b559dd632f1e60de5ddb2632425304e889d7a91023da7881083e51"
        },
        {
          "name": "search_site",
          "title": "Search the website",
          "description": "Searches the text of magentaprivateisland.com pages and articles, including the FAQ, the island guides and the side-by-side comparisons with other Belize private islands (Cayo Espanto, Coco Plum, Gladden, Kanu, Bullock, Royal Belize, Thatch Caye, Turneffe). Returns passages with their page title, section and link. Where a passage and search_facts differ, the fact is current.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"Cayo Espanto\", \"honeymoon\", \"snorkeling\", \"best time to visit\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:115fc9887173ee286a1c877a8b053d607184c949934c8ab163a9636c1fecb7f4"
        },
        {
          "name": "submit_inquiry",
          "title": "Send an inquiry to the resort",
          "description": "Sends the traveler's name, email and question to the Magenta reservations team, who reply by email. For whole-island stays, weddings, groups, special requests or anything else. Requires the traveler's agreement to share these details (traveler_agreed). Never include payment card numbers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "YYYY-MM-DD, if known",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD, if known",
                "type": "string"
              },
              "email": {
                "maxLength": 200,
                "type": "string"
              },
              "guests": {
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "message": {
                "description": "What the traveler wants the team to know, in their words.",
                "maxLength": 2000,
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "occasion": {
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "traveler_agreed": {
                "description": "true only if the traveler agreed to share these details with Magenta.",
                "type": "boolean"
              }
            },
            "required": ["email", "message", "name", "traveler_agreed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bc895c1ab46a06b3f8e2bb1228549bd79b0cfaf9aafdabdc115c39d7c8f350d2"
        }
      ],
      "digest": "sha256:683c5b3ce2c8c5ea23c29e56ab71b28c3e9be9de19ad42f2831216a8a1c61a94"
    }
  }
}
