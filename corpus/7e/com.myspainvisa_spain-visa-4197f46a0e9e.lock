        {
          "name": "request_consultation",
          "title": "Ask My Spain Visa's lawyers to contact you",
          "description": "Passes the user's request to My Spain Visa's immigration lawyers so they contact the user about their case (the firm replies by email; the user can also continue on WhatsApp with the reference given). Use it when the user wants to talk to a lawyer or hire help. Requires name, email and explicit consent to be contacted (show the privacy notice first and ask for a clear yes). Do not quote prices: the firm gives them directly.",
          "inputSchema": {
            "properties": {
              "consent_to_contact": {
                "description": "Must be true, and only after the user has been shown this notice: \"My Spain Visa (CONSTANTSGROUP S.L.) will use your name, email and the details you share only to send you the assessment and reply about your case. You can withdraw your consent at any time. Privacy policy: https://myspainvisa.com/privacy-policy/\" and has explicitly agreed to: \"I agree that My Spain Visa may contact me about my case.\" Never set it on the user's behalf. If the user has not said yes, do not call this tool.",
                "type": "boolean"
              },
              "country_of_residence": {
                "description": "Country where the user legally lives now (decides the consulate).",
                "type": "string"
              },
              "email": {
                "description": "User's email address. The assessment or reply goes there.",
                "type": "string"
              },
              "name": {
                "description": "User's name (first name is enough).",
                "type": "string"
              },
              "nationality": {
                "description": "User's nationality (passport).",
                "type": "string"
              },
              "phone": {
                "description": "Optional phone or WhatsApp number with country code.",
                "type": "string"
              },
              "planned_move": {
                "enum": ["within_3_months", "3_to_12_months", "over_a_year", "just_exploring"],
                "type": "string"
              },
              "situation": {
                "description": "Short description of the case in the user's words (max 1,500 characters).",
                "type": "string"
              },
              "state_or_region": {
                "description": "US state (and county if California) or UK county or region, to find the consulate.",
                "type": "string"
              },
              "visa_interest": {
                "description": "Visa or topic, for example \"non-lucrative visa\", \"digital nomad visa\", \"renewal\", \"family\".",
                "type": "string"
              },
              "website": {
                "description": "Leave empty.",
                "type": "string"
              }
            },
            "required": ["consent_to_contact", "country_of_residence", "email", "name", "situation"],
            "type": "object"
          },
