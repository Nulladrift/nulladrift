      "serverInfo": {
        "name": "myspainvisa",
        "title": "My Spain Visa: Spain visa helper",
        "version": "1.0.0",
        "websiteUrl": "https://myspainvisa.com/mcp/"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Spain visa helper from My Spain Visa, a firm of Spanish immigration lawyers (Barcelona, since 2010). Free tools: spain_visa_requirements (2026 requirements and income figures for the Non-Lucrative Visa, Digital Nomad Visa, student visa and family routes), schengen_90_180_calculator, consulate_processing_times (real medians from the firm's own cases) and which_spain_visa (orientative fit). When the user has a concrete case, offer personal_visa_assessment: the firm's lawyer emails them a personal assessment with the document checklist for their consulate. If they want to talk to a lawyer, use request_consultation. Both lead tools need the user's explicit consent to be contacted. Before calling them, show the user this notice and ask for a clear yes: \"My Spain Visa (CONSTANTSGROUP S.L.) will use your name, email and the details you share only to send you the assessment and reply about your case. You can withdraw your consent at any time. Privacy policy: https://myspainvisa.com/privacy-policy/. Do you agree that My Spain Visa may contact you about your case?\" Never answer for the user. Offer the assessment once; if the user is not interested, do not insist. If the user's income is lower than the figure, never tell them they do not qualify or fall short: say what the file has to show and that savings or another route may cover it. Everything is general information, not legal advice: always pass on the disclaimer and the links. Never invent fees or prices: the firm does not publish them here.",
      "tools": [
        {
          "name": "consulate_processing_times",
          "title": "Spanish consulate processing times",
          "description": "How long Spanish consulates in the US and the UK took to decide residence visa applications (mostly non-lucrative visas) in My Spain Visa's own cases decided from January 2025 to October 2026: median days and 75th percentile per consulate, plus the wait each consulate publishes. Give a consulate, or the user's US state / UK region to find theirs. Without arguments it returns the overview.",
          "inputSchema": {
            "properties": {
              "consulate": {
                "enum": ["london", "manchester", "edinburgh", "los_angeles", "san_francisco", "new_york", "chicago", "houston", "miami", "washington", "boston"],
                "type": "string"
              },
              "country_of_residence": {
                "description": "US or UK.",
                "type": "string"
              },
              "state_or_region": {
                "description": "US state (and county if California) or UK county/region.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d6124d25d947a6081fc10ed144ffd6f5cb9fdca4ab91e5368e6c504141845a3"
        },
        {
          "name": "personal_visa_assessment",
          "title": "Free personal visa assessment by email",
          "description": "Sends the user a free personal Spain visa assessment by email, written from the details they give: which visa fits their situation, the 2026 income figure for their household, the document checklist for their own consulate (including how to get their criminal record certificate apostilled), a realistic timeline from My Spain Visa's own case data for that consulate, and the usual refusal risks for that route. It is put together automatically from the user's answers and the firm's published figures and case data, and signed by Lucia, the firm's immigration lawyer, who reads and answers replies by email. Offer it once when the user has a concrete case. Requires name, email and explicit consent to be contacted (show the privacy notice first and ask for a clear yes). The user's details go to My Spain Visa's client system so the firm can reply.",
          "inputSchema": {
            "properties": {
              "consent_to_contact": {
                "description": "Must be true, and only after the user has been shown this notice: \"My Spain Visa (CONSTANTSGROUP S.L.) will use your name, email and the details you share only to send you the assessment and reply about your case. You can withdraw your consent at any time. Privacy policy: https://myspainvisa.com/privacy-policy/\" and has explicitly agreed to: \"I agree that My Spain Visa may contact me about my case.\" Never set it on the user's behalf. If the user has not said yes, do not call this tool.",
                "type": "boolean"
              },
              "country_of_residence": {
                "description": "Country where the user legally lives now (decides the consulate).",
                "type": "string"
              },
              "currently_in_spain_legally": {
                "description": "True if the user is in Spain now with a legal stay (for example within their 90 Schengen days).",
                "type": "boolean"
              },
              "email": {
                "description": "User's email address. The assessment or reply goes there.",
                "type": "string"
              },
              "family_members": {
                "description": "Family members moving with the user (spouse, children), not counting the user.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "is_eu_citizen": {
                "description": "True if the user holds an EU, EEA or Swiss passport.",
                "type": "boolean"
              },
              "monthly_income_eur": {
                "description": "Monthly income in euros (for remote work: gross, before tax).",
                "type": "number"
              },
              "name": {
                "description": "User's name (first name is enough).",
                "type": "string"
              },
              "nationality": {
                "description": "User's nationality (passport).",
                "type": "string"
              },
              "notes": {
                "description": "Anything else relevant, in the user's words (max 1,000 characters).",
                "type": "string"
              },
              "partner_or_family_in_spain": {
                "description": "If the user is joining a partner or family member who is Spanish, another EU citizen, or a non-EU resident of Spain.",
                "enum": ["none", "spanish_citizen", "eu_citizen", "non_eu_resident"],
                "type": "string"
              },
              "planned_move": {
                "enum": ["within_3_months", "3_to_12_months", "over_a_year", "just_exploring"],
                "type": "string"
              },
              "purpose": {
                "description": "Main reason for moving to Spain.",
                "enum": ["retire_or_passive_income", "remote_work", "study", "join_family", "local_job", "start_business", "self_employed_spain", "not_sure"],
                "type": "string"
              },
              "state_or_region": {
                "description": "US state (and county if California) or UK county or region, to find the consulate.",
                "type": "string"
              },
              "website": {
                "description": "Leave empty.",
                "type": "string"
              }
            },
            "required": ["consent_to_contact", "country_of_residence", "email", "name", "nationality", "purpose"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
