        {
          "name": "schengen_90_180_calculator",
          "title": "Schengen 90/180 day calculator",
          "description": "Counts days used and left under the Schengen 90 days in any 180 days rule (Regulation (EU) 2016/399, article 6.1), the same calculation as the My Spain Visa calculator at /90-day-rule-spain/. Give past and planned trips in the Schengen area; it returns days used, days left, whether any day goes over the limit, and the next date the user can enter and for how long. For staying longer than 90 days, the user needs a long-stay visa or residence permit: offer which_spain_visa or personal_visa_assessment.",
          "inputSchema": {
            "properties": {
              "today": {
                "description": "Optional reference date YYYY-MM-DD (default: today, UTC).",
                "type": "string"
              },
              "trips": {
                "description": "Each stay in the Schengen area. Entry and exit days both count as days of stay.",
                "items": {
                  "properties": {
                    "entry": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    },
                    "exit": {
                      "description": "YYYY-MM-DD",
                      "type": "string"
                    }
                  },
                  "required": ["entry", "exit"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["trips"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52cb402c1988f2df51b5cd3c10dd5820610f189d2a1199db72f61b7703710172"
        },
        {
          "name": "spain_visa_requirements",
          "title": "Spain visa requirements 2026",
          "description": "Requirements, 2026 income figures (with family members), work rights, where to apply, key documents and legal decision deadlines for the main Spanish residence visas: Non-Lucrative Visa (nlv), Digital Nomad Visa (dnv), student visa, and family routes. Figures from the BOE: IPREM 600 euros a month; NLV 2,400 euros a month; DNV about 2,850 euros a month gross (200% of the 2026 minimum wage). If the user has a concrete case, offer personal_visa_assessment afterwards.",
          "inputSchema": {
            "properties": {
              "family_members": {
                "description": "Family members joining, to calculate the income needed.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "visa": {
                "description": "Which visa. nlv = Non-Lucrative (passive income, no work); dnv = Digital Nomad (remote work).",
                "enum": ["nlv", "dnv", "student", "family_of_spanish_citizen", "family_of_eu_citizen", "family_reunification"],
                "type": "string"
              }
            },
            "required": ["visa"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5effd3040e7c1597ad918354744616a7e3696de83bc9b6052f403268d7bb4ba3"
        },
        {
          "name": "which_spain_visa",
          "title": "Which Spain visa fits me?",
          "description": "Orientative first look at which Spanish visa or residence route fits a person, from a few facts: purpose (retire or live on passive income, remote work, study, join family, local job, business), EU citizenship, partner or family in Spain, income and family members. Returns the likely routes with the 2026 income figure and quick checks. It is not legal advice: for a real answer offer personal_visa_assessment (emailed by the firm's lawyer) or request_consultation.",
          "inputSchema": {
            "properties": {
              "currently_in_spain_legally": {
                "description": "True if the user is in Spain now with a legal stay (for example within their 90 Schengen days).",
                "type": "boolean"
              },
              "family_members": {
                "description": "Family members moving with the user (spouse, children), not counting the user.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "is_eu_citizen": {
                "description": "True if the user holds an EU, EEA or Swiss passport.",
                "type": "boolean"
              },
              "monthly_income_eur": {
                "description": "Monthly income in euros (for remote work: gross, before tax).",
                "type": "number"
              },
              "partner_or_family_in_spain": {
                "description": "If the user is joining a partner or family member who is Spanish, another EU citizen, or a non-EU resident of Spain.",
                "enum": ["none", "spanish_citizen", "eu_citizen", "non_eu_resident"],
                "type": "string"
              },
              "purpose": {
                "description": "Main reason for moving to Spain.",
                "enum": ["retire_or_passive_income", "remote_work", "study", "join_family", "local_job", "start_business", "self_employed_spain", "not_sure"],
                "type": "string"
              }
            },
            "type": "object"
          },
