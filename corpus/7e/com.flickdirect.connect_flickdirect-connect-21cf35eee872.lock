                "type": "boolean"
              },
              "url": {
                "description": "Canonical https://flickdirect.com/movies/{id}/{slug}/movie.ashx or tv-show.ashx without query or fragment.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "video_url": {
                "default": null,
                "description": "Optional exact FlickDirect video URL already listed in this movie coverage, to resolve its published YouTube player. One video page only.",
                "maxLength": 2048,
                "minLength": 1,
                "type": ["string", "null"]
              }
            },
