      "serverInfo": {
        "name": "FlickDirect Connect",
        "title": "FlickDirect Connect",
        "version": "1.5.6.0",
        "description": "Find FlickDirect movie and television facts, country-specific release dates and ratings when available, cross-title published trivia discovery, original coverage links, CinemaCon reporting, movie-news show transcript matches, podcasts, apps and public company information. Concise summaries and source-page links, without full editorial text or photographs.",
