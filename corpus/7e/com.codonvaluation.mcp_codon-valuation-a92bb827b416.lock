      "tools": [
        {
          "name": "estimate_409a_value",
          "title": "Estimate 409A common stock value",
          "description": "Gives an indicative range for the fair market value per share of a US private company's common stock, as a planning estimate before a formal 409A valuation (for example, to anticipate an option strike price). Uses an option pricing model backsolve when there is a priced round in the last 12 months; otherwise a rolled-forward round, a sector revenue multiple, or an asset-based approach, depending on the inputs. Applies Finnerty and Chaffe marketability discounts. Inputs are numbers from the cap table and financials; no company or personal names are needed. Limitations: treats all preferred as non-participating and pari passu with 1:1 conversion, and does not model SAFEs or convertible notes. The result is not a 409A valuation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cash": {
                "description": "Cash on hand, in US dollars.",
                "type": "number"
              },
              "common_shares_outstanding": {
                "description": "Number of common shares issued and outstanding (excluding options and preferred).",
                "type": "number"
              },
              "debt": {
                "description": "Interest-bearing debt, in US dollars.",
                "type": "number"
              },
              "gross_margin_pct": {
                "description": "Gross margin, as a percentage.",
                "type": "number"
              },
              "has_participating_preferred": {
                "description": "True if any preferred series is participating.",
                "type": "boolean"
              },
              "has_unconverted_safes_or_notes": {
                "description": "True if the company has SAFEs or convertible notes that have not yet converted.",
                "type": "boolean"
              },
              "options_outstanding": {
                "description": "Number of share options granted and outstanding.",
                "type": "number"
              },
              "options_weighted_average_strike": {
                "description": "Weighted average exercise price of outstanding options, in US dollars.",
                "type": "number"
              },
              "performance_since_last_round": {
                "description": "How the company has performed against plan since its last priced round. Used when that round is more than 12 months old.",
                "enum": ["ahead", "on_plan", "behind"],
                "type": "string"
              },
              "preferred_series": {
                "description": "Each priced preferred share round. Leave empty or omit if the company has never raised a priced round.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "liquidation_preference_multiple": {
                      "description": "Liquidation preference multiple. Defaults to 1.",
                      "type": "number"
                    },
                    "months_since_issue": {
                      "description": "Months since the round closed.",
                      "type": "number"
                    },
                    "name": {
                      "description": "Series name, for example 'Seed' or 'Series A'.",
                      "type": "string"
                    },
                    "original_issue_price": {
                      "description": "Price paid per share, in US dollars.",
                      "type": "number"
                    },
                    "shares": {
                      "description": "Shares issued in this series.",
                      "type": "number"
                    }
                  },
                  "required": ["months_since_issue", "original_issue_price", "shares"],
                  "type": "object"
                },
                "type": "array"
              },
              "revenue_growth_pct": {
                "description": "Year-over-year revenue growth, as a percentage (for example 40 for 40%).",
                "type": "number"
              },
              "revenue_last_12_months": {
                "description": "Revenue for the last 12 months, in US dollars.",
                "type": "number"
              },
              "risk_free_rate_pct": {
                "description": "Optional current government bond yield matching years_to_exit, as a percentage.",
                "type": "number"
              },
              "sector": {
                "description": "Company sector. Sets the default volatility and revenue multiple. Use 'other' if unsure.",
                "enum": ["software_saas", "fintech", "ai_ml", "marketplace_ecommerce", "consumer", "hardware_deeptech", "healthtech_digital_health", "medtech_devices", "biotech_therapeutics", "diagnostics", "climate_energy", "other"],
                "type": "string"
              },
              "total_capital_invested": {
                "description": "Total equity capital invested to date, in US dollars. Used when there is no priced round and no revenue.",
                "type": "number"
              },
              "volatility_pct": {
                "description": "Optional override for equity volatility, as a percentage.",
                "type": "number"
              },
              "years_to_exit": {
                "description": "Expected years until a sale or IPO. Defaults to 3.",
                "type": "number"
              }
            },
            "required": ["common_shares_outstanding"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate 409A common stock value"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05d8d2b3609cadf048ef6f1671a8bfa5f9046672705970950eb7ee7f112d6cd9"
        },
        {
          "name": "estimate_emi_share_value",
          "title": "Estimate UK HMRC ordinary share value",
          "description": "Gives an indicative range for the market value per ordinary share of a UK private company, as a planning estimate before agreeing an EMI valuation with HMRC (for example, to anticipate an EMI option exercise price). Uses the same methods as the 409A estimate, in pounds sterling: an option pricing model backsolve for a priced round in the last 12 months, otherwise a rolled-forward round, a sector revenue multiple, or an asset-based approach. Inputs are numbers from the shareholder register and accounts; no company or personal names are needed. Limitations: treats all preference shares as non-participating and pari passu, and does not model convertible instruments. The result is not an HMRC-agreed valuation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cash": {
                "description": "Cash on hand, in pounds sterling.",
                "type": "number"
              },
              "common_shares_outstanding": {
                "description": "Number of ordinary shares issued and outstanding (excluding options and preferred).",
                "type": "number"
              },
