        {
          "name": "get_formal_valuation_info",
          "title": "Get formal valuation requirements",
          "description": "Lists the documents and typical steps for a formal US 409A valuation or UK HMRC valuation, with contact details for Codon Valuation Advisors, the firm that provides this connector. Use when the user asks what a formal valuation requires or how to obtain one.",
