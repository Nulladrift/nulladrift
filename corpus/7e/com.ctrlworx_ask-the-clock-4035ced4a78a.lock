        "name": "ask-the-clock",
        "title": "Ask the Clock (Ctrl Worx Watch List)",
        "version": "0.2.10",
        "websiteUrl": "https://ctrlworx.com/watch-list/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Ask the Clock reads the live Ctrl Worx Watch List: public companies whose own SEC filings report a material weakness in internal control over financial reporting with no later annual report saying it is fixed, and how long each has been open (the Clock). lookup_company covers one company and clock_headline covers the totals. Every answer carries its as-of date, an SEC EDGAR link and a link to the corrections page. When a name matches more than one company, lookup_company returns candidates rather than a status. Source: Ctrl Worx Watch List, https://ctrlworx.com/watch-list/. Ctrl Worx is independent and has no tie to the SEC or any government body. Terms: https://ctrlworx.com/clock-for-your-site/#terms",
      "tools": [
        {
          "name": "clock_headline",
          "title": "Headline Clock figures",
          "description": "Returns the live headline Clock figures from the Ctrl Worx Watch List with their as-of date: public companies on the Clock, how many have been open more than one and three years, and the full on-record count. Also returns the frozen October 2026 report figures with their own as-of date. Each figure comes with its as-of date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Headline Clock figures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6fceafb390b0b00ff4c9df6d499fd734547188b48624f4c40d8e639fa3c9be3a"
        },
        {
          "name": "lookup_company",
          "title": "Look up a company on the Ctrl Worx Watch List",
          "description": "Looks up one public company by ticker, full company name or SEC CIK number in the live Ctrl Worx Watch List. Returns whether it is on the Watch List, its status, how long the material weakness has been open (years on the Clock and open-since date), the as-of date, its ctrlworx.com page and the SEC filing link. It matches on an exact ticker, CIK or full name. For any other input it returns a list of candidate companies, each with its CIK and status, and no single match.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Ticker (e.g. CORZ), full company name (e.g. Core Scientific), or SEC CIK number.",
