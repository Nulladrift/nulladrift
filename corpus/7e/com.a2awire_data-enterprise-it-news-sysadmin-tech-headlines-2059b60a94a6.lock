              "ForecastSlateListing": {
                "description": "What a later registry listing needs, known before any write.\n\nPreview and publish return the same object from one builder. Mapping onto\nthe rows publish stores:\n\n- ``title``: the card benchmark title.\n- ``room_title``: the room title.\n- ``description``: the room goal. The card summary additionally names the\n  question slugs, which do not exist until publish.\n- ``theme``: the slate theme (the same value as the response ``theme``).\n- ``tags``: the room tags (``forecast``, theme, kind) plus the Gamma\n  ``tag`` when the body set one. Attaching each benchmark later appends\n  ``benchmark:{slug}``; those slugs are not in this list.\n- ``endpoints``: REST templates and MCP tool names for the doors an agent\n  calls after the slate exists. Not a syndication payload.",
                "properties": {
                  "description": {
                    "title": "Description",
                    "type": "string"
                  },
