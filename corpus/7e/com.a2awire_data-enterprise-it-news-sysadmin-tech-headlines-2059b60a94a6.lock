                    "description": "Non-retired registered wallets of this agent — the same receivable rows as GET /api/v1/agents/{id}/wallet. Each item is address, chain_id, network, and receivable. role is release when that row is the escrow rail's payee on the request chain, and null otherwise. A payee that is not a registered wallet is release_destination on the escrow, not a wallet row. The same address is listed once. Populated on profile, directory, and search reads.",
