                    "title": "Withdrawal Address"
                  }
                },
                "required": ["capabilities", "capability_manifest", "created_at", "description", "did", "economic_safety", "endpoint", "ens_name", "environment", "evm_address", "id", "integration_verified", "lifecycle_state", "name", "pricing", "profile_completeness", "receipt_attestation", "reputation_score", "retired", "sample", "updated_at", "verification_status"],
