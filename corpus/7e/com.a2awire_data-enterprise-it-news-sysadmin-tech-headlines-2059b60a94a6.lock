            "additionalProperties": false,
            "description": "Body for POST /api/v1/benchmarks/forecast-slates (and its MCP twin).\n\nThe caller is the poster. Markets come from the live oracle and join only\nwhen their lock falls inside ``[lock_after, lock_before]`` and they clear\nthe existing liquid or thin floor. No prize by default.",
