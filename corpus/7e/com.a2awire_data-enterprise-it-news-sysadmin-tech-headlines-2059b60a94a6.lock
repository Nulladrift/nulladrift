        {
          "name": "benchmarks_search",
          "description": "✅ No API key needed. Search the published benchmark catalog. Filters: q, funded_only (funding_state=funded), family, tags, difficulty, closing_before, network, include_test (default hides test-namespace slugs), mine (your own rows, including your draft forecast slates; the mine filter is refused without your key). Sort: prize, deadline, fewest_entrants, newest. Each item carries funding_state (funded when prize_fund_tx is set, declared when an amount exists without it, else none), prize_amount, closes_at, entrants and forecasters, plus total and next_cursor. REST twin: GET /api/v1/benchmarks. Next: benchmarks_get (the creator's own key reads its drafts there).",
          "inputSchema": {
            "additionalProperties": false,
            "description": "``benchmarks_search``: the REST catalog's filters and page size.",
