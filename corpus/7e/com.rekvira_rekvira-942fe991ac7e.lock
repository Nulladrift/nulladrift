                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "low | normal | high | blocking (blocking: the user cannot do their work)",
                "enum": ["low", "normal", "high", "blocking"],
                "title": "Severity"
              },
              "tool": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The tool the feedback is about, if one (e.g. the tool that answered wrongly); several: comma-separated",
                "title": "Tool"
              },
              "what": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The task and what went wrong or what is needed (3-50000 characters)",
                "title": "What"
              }
            },
