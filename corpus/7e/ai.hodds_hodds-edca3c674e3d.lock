        {
          "name": "get_plan",
          "title": "Read the My ways plan",
          "description": "Returns the plan of the organisation of the token: FREE, PAID, PAST_DUE, ENDING or ENDED; watched solutions billed in the current Stripe period, offer_version, invoice and payment proof. initial_basket, when present, gives the account's selected needs, exact upfront quote and activation status; its destination is for a human, not agent payment. prepaid-v1: €2 excl. VAT at the start of each monthly period covers the first 4 counted watches; initial basket extras: €0.50 each now; later extras: €0.50 excl. VAT at period end, never charged twice. Legacy rights keep the free unit and arrears until voluntary conversion. VORAN invoices through Stripe. Each watch identity counts once per period, even if closed, regardless of agent. Contract 0.7.0. Needs an organisation token (Authorization: Bearer hodds_...); without it the tool returns the error token_required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "invoice": {
                "additionalProperties": false,
                "properties": {
                  "amount_excl_vat": {
                    "pattern": "^[0-9]+\\.[0-9]{2}$",
                    "type": ["string", "null"]
                  },
                  "number": {
                    "maxLength": 60,
                    "type": ["string", "null"]
                  },
                  "pdf_url": {
                    "format": "uri",
                    "pattern": "^https://([a-z0-9-]+\\.)*stripe\\.com/",
                    "type": ["string", "null"]
                  },
                  "period": {
                    "pattern": "^[0-9]{4}-[0-9]{2}$",
                    "type": ["string", "null"]
                  },
                  "provider": {
                    "const": "stripe"
                  },
                  "status": {
                    "enum": ["paid", "open", "void", "uncollectible"]
                  },
                  "total": {
                    "pattern": "^[0-9]+\\.[0-9]{2}$",
                    "type": ["string", "null"]
                  },
                  "vat": {
                    "pattern": "^[0-9]+\\.[0-9]{2}$",
                    "type": ["string", "null"]
                  }
                },
                "required": ["amount_excl_vat", "number", "pdf_url", "period", "provider", "status", "total", "vat"],
                "type": "object"
              },
              "watch": {
                "additionalProperties": false,
                "properties": {
                  "billed": {
                    "description": "Billed in the current Stripe period (€0.50 excl. VAT).",
                    "type": "boolean"
                  },
                  "closed_at": {
                    "description": "Day of closing; null while the watch is active.",
                    "format": "date",
                    "type": ["string", "null"]
                  },
                  "need": {
                    "description": "The need, cut to 120 characters; null for a CATEGORY watch.",
                    "maxLength": 120,
                    "type": ["string", "null"]
                  },
                  "opened_at": {
                    "format": "date",
                    "type": ["string", "null"]
                  },
                  "plan": {
                    "description": "FREE: legacy, never billed. PAID: counted watch. Prepaid has no free slot. Not organisation offer_version.",
                    "enum": ["FREE", "PAID"]
                  },
                  "watch_id": {
                    "pattern": "^w_[a-z2-7]{20}$",
                    "type": "string"
                  }
                },
                "required": ["billed", "closed_at", "need", "opened_at", "plan", "watch_id"],
                "type": "object"
              }
            },
            "additionalProperties": false,
            "description": "get_plan / GET /api/plan. prepaid-v1: €2 excl. VAT at period start covers 4 counted watches; €0.50 excl. VAT per additional watch at period end. Initial basket paid in full; already-paid units deducted, no repeat/credit at renewal. Legacy retained. Contract §10.",
            "properties": {
              "amount_due_estimate": {
                "description": "Excl. VAT at next boundary: prepaid overage_due_estimate + next_period_minimum (no repeated current minimum); legacy max(2.00, watches_billed × 0.50) in arrears. Null outside paid plan; unknown taxes excluded.",
                "pattern": "^[0-9]+\\.[0-9]{2}$",
                "type": ["string", "null"]
              },
              "billing": {
                "additionalProperties": false,
                "description": "Name and country of the Stripe customer, as entered at Stripe.",
                "properties": {
                  "country": {
                    "pattern": "^[A-Z]{2}$",
                    "type": ["string", "null"]
                  },
                  "name": {
                    "maxLength": 200,
                    "type": ["string", "null"]
                  }
                },
                "required": ["country", "name"],
                "type": ["object", "null"]
              },
              "billing_reconciliation": {
                "additionalProperties": false,
                "description": "Present when earlier prepaid usage has no confirmed delivery and can no longer be retried automatically. Unknown does not mean unbilled: reconcile the original identifiers with Stripe before any financial adjustment. This does not change the current subscription rights or duplicate its minimum.",
                "properties": {
                  "periods": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "start": {
                          "format": "date-time",
                          "type": "string"
                        },
                        "unconfirmed_units": {
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "required": ["start", "unconfirmed_units"],
                      "type": "object"
                    },
                    "maxItems": 24,
                    "minItems": 1,
                    "type": "array"
                  },
                  "status": {
                    "const": "required"
                  }
                },
                "required": ["periods", "status"],
                "type": "object"
              },
              "currency": {
                "const": "EUR"
              },
              "ends_on": {
                "description": "Last day of the plan when it is ENDING, or PAST_DUE with its stop asked; null otherwise.",
                "format": "date",
                "type": ["string", "null"]
              },
              "initial_basket": {
                "additionalProperties": false,
                "description": "Current initial basket owned by the token's account, from the same snapshot as the human Plan. Absent without a current selection: expired PREPARED/EXPIRED and fully activated PAID history are excluded. OPEN remains unresolved until Stripe confirms payment or expiry, even after its local deadline. PAID with pending activation remains visible for recovery, never another charge. Selection and purchase consent are human-only actions.",
                "properties": {
                  "activation_error": {
                    "description": "Recovery code when activation is pending; null otherwise. No second initial payment is needed.",
                    "type": ["string", "null"]
                  },
                  "activation_pending": {
                    "description": "True only after confirmed payment when selected identities remain unactivated.",
                    "type": "boolean"
                  },
                  "count": {
                    "maximum": 25,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "destination": {
                    "description": "Same-origin summary for an authenticated human member; not a Checkout or agent payment endpoint.",
                    "pattern": "^/my/plan\\?basket_id=wb_[a-f0-9]{32}$",
                    "type": "string"
                  },
                  "id": {
                    "pattern": "^wb_[a-f0-9]{32}$",
                    "type": "string"
                  },
                  "items": {
                    "description": "Exact selected identities and saved need content, excluding all unselected drafts. watch_id links an activated identity; null does not grant monitoring.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "constraints": {
                          "description": "Saved normalized constraints, including unrecognized constraints; no implied satisfaction.",
                          "items": {
                            "maxLength": 200,
                            "type": "string"
                          },
                          "maxItems": 50,
                          "type": "array"
                        },
                        "current_choice": {
                          "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                          "type": ["string", "null"]
                        },
                        "current_choice_name": {
                          "maxLength": 120,
                          "type": ["string", "null"]
                        },
                        "draft_id": {
                          "pattern": "^wd_[a-f0-9]{32}$",
                          "type": "string"
                        },
                        "level": {
                          "enum": ["NEED", "CATEGORY"]
                        },
                        "need": {
                          "description": "Complete saved need; null for CATEGORY.",
                          "maxLength": 2000,
                          "type": ["string", "null"]
                        },
                        "process": {
                          "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                          "type": "string"
                        },
                        "target": {
                          "additionalProperties": false,
                          "properties": {
                            "capability_ids": {
                              "items": {
                                "maxLength": 160,
                                "type": "string"
                              },
                              "maxItems": 64,
                              "type": "array",
                              "uniqueItems": true
                            },
                            "kind": {
                              "const": "product"
                            },
                            "solution_id": {
                              "maxLength": 100,
                              "type": "string"
                            }
                          },
                          "required": ["capability_ids", "kind", "solution_id"],
                          "type": "object"
                        },
                        "watch_id": {
                          "pattern": "^w_[a-z2-7]{20}$",
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["constraints", "current_choice", "current_choice_name", "draft_id", "level", "need", "process", "watch_id"],
                      "type": "object"
                    },
                    "maxItems": 25,
                    "minItems": 1,
                    "type": "array"
                  },
                  "status": {
                    "description": "PREPARED: editable selection awaiting human consent. OPEN: immutable checkout selection, payment unconfirmed. PAID: full initial payment verified server-side; check activation_pending separately.",
                    "enum": ["PREPARED", "OPEN", "PAID"]
                  },
                  "upfront_amount": {
                    "description": "Original snapshot amount excluding VAT in the Plan currency: max(2.00,count×0.50). Retained after payment as its accepted amount; top-level upfront_amount becomes 0.00. Tax is unknown until Stripe calculates it, not zero.",
                    "pattern": "^(?:[2-9]|[1-9][0-9]+)\\.(?:00|50)$",
                    "type": "string"
                  }
                },
                "required": ["activation_error", "activation_pending", "count", "destination", "id", "items", "status", "upfront_amount"],
                "type": "object"
              },
              "initial_payment_confirmed": {
                "description": "Applicable full initial payment confirmed server-side for accepted amount, offer and identities. Not return/card/active flag/zero invoice. Check version and period.",
                "type": "boolean"
              },
              "invoiced_by": {
                "const": "VORAN"
              },
              "invoices": {
                "items": {
                  "$ref": "#/$defs/invoice"
                },
                "maxItems": 200,
                "type": "array"
              },
              "minimum_covers": {
                "const": 4,
                "description": "Prepaid covers first 4 counted watches. Legacy counts paid watches only, excluding its free watch."
              },
              "monthly_minimum": {
                "const": "2.00",
                "description": "€2 excl. VAT per period, even empty: prepaid at start; legacy in arrears."
              },
              "next_invoice": {
                "additionalProperties": false,
                "description": "Stripe period end and excl. VAT estimate: ended-period overage + next minimum for prepaid; null outside paid plan.",
                "properties": {
                  "amount_excl_vat": {
                    "pattern": "^[0-9]+\\.[0-9]{2}$",
                    "type": "string"
                  },
                  "date": {
                    "format": "date",
                    "type": "string"
                  }
                },
                "required": ["amount_excl_vat", "date"],
                "type": ["object", "null"]
              },
              "next_period_minimum": {
                "description": "Active prepaid: 2.00 excl. VAT for renewal, 0.00 if ending at boundary; null otherwise.",
                "enum": ["0.00", "2.00", null]
              },
              "offer_version": {
                "description": "Server-assigned; legacy rights retained until voluntary conversion. Clients cannot select legacy.",
                "enum": ["legacy", "prepaid-v1"]
              },
              "overage_due_estimate": {
                "description": "Active prepaid, excl. VAT at period end: first period max(0,M-max(4,N))×0.50; later max(0,M-4)×0.50. N=initial paid basket, M=counted identities. Null otherwise.",
                "pattern": "^[0-9]+\\.[0-9]{2}$",
                "type": ["string", "null"]
              },
              "payment": {
                "additionalProperties": false,
                "description": "The payment method lives at Stripe; no digit of it is stored or returned.",
                "properties": {
                  "method": {
                    "const": "card"
                  },
                  "provider": {
                    "const": "stripe"
                  }
                },
                "required": ["method", "provider"],
                "type": ["object", "null"]
              },
              "pending": {
                "additionalProperties": false,
                "description": "Delivery on the next call: alerts that wait for this organisation. Absent when there is nothing to deliver. Only ack_alerts empties it.",
                "properties": {
                  "count": {
                    "description": "Unacknowledged alerts of the organisation.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "summary": {
                    "description": "One sentence in English, or in French when the request was in French.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "watches": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "alert_ids": {
                          "items": {
                            "pattern": "^a_[a-z2-7]{20}$",
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "challenger": {
                          "additionalProperties": false,
                          "properties": {
                            "hodds_status": {
                              "enum": ["approved", "not_yet"]
                            },
                            "option_id": {
                              "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                              "type": "string"
                            }
                          },
                          "required": ["hodds_status", "option_id"],
                          "type": ["object", "null"]
                        },
                        "watch_id": {
                          "pattern": "^w_[a-z2-7]{20}$",
                          "type": "string"
                        }
                      },
                      "required": ["alert_ids", "challenger", "watch_id"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["count", "summary", "watches"],
                "type": "object"
              },
              "plan": {
                "description": "Technical state, not entitlement: check version, first payment and period. FREE right only for legacy. PAST_DUE: renewal retries. ENDING: existing prepaid watches to boundary, no new ones. ENDED: no free slot.",
                "enum": ["FREE", "PAID", "PAST_DUE", "ENDING", "ENDED"]
              },
              "price_per_watch_month": {
                "const": "0.50"
              },
              "since": {
                "description": "First day of the paid plan; null outside PAID, PAST_DUE and ENDING.",
                "format": "date",
                "type": ["string", "null"]
              },
              "summary": {
                "description": "One English/French sentence, per request or organisation language.",
                "minLength": 1,
                "type": "string"
              },
              "unit": {
                "const": "per watched solution per month"
              },
              "upfront_amount": {
                "description": "Excl. VAT, identical on human Plan/API/MCP: current unpaid initial_basket amount max(2.00,N×0.50); otherwise 2.00 before new prepaid with no selection, or 0.00 if already paid or legacy. A paid unresolved basket never requires a second initial payment. No entitlement or authorisation to pay from this quote.",
                "pattern": "^(?:0\\.00|(?:[2-9]|[1-9][0-9]+)\\.(?:00|50))$",
                "type": "string"
              },
              "watches": {
                "items": {
