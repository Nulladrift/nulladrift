        {
          "name": "watch_need",
          "title": "Watch a need",
          "description": "Watches a need; CATEGORY follows a process. Optional target selects one product and capability_ids (empty = whole product), counted once. Targeted alerts report documented changes, conditions and unknowns, not a guarantee of suitability. Initially not_computed; rules produce challenger/switch brief; alerts on following calls. Unknown constraints stay uninterpreted. prepaid-v1: payment_required (402), draft_id, watch_status DRAFT, destination /my/plan. Legacy: free_watch_used (409, Checkout). plan_ending (409) refuses new watches. Errors: _meta[\"ai.hodds/error\"]. Search is free. Price: €2 excl. VAT at the start of each monthly period covers the first 4 counted watches; initial basket extras: €0.50 each now; later extras: €0.50 excl. VAT at period end, never charged twice. A person accepts the summary at destination. Legacy rights stay unchanged. Needs an organisation token (Authorization: Bearer hodds_...); without it the tool returns the error token_required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alert_budget": {
                "default": 5,
                "description": "Alerts per calendar month (1-20, default 5); beyond, one DIGEST per day.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "context": {
                "additionalProperties": false,
                "properties": {
                  "constraints": {
                    "description": "Constraints of the need.",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "type": "array"
                  },
                  "environment": {
                    "description": "Free description of the environment (not stored).",
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "current_choice": {
                "description": "Active catalogue id; any process accepted.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                "type": "string"
              },
              "current_choice_name": {
                "description": "Free name instead of id; exact unique matches resolve, others stay unlinked.",
                "maxLength": 120,
                "type": ["string", "null"]
              },
              "delivery": {
                "additionalProperties": false,
                "properties": {
                  "mode": {
                    "description": "next_call (the only mode).",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "lang": {
                "description": "Language of the summary: \"en\" or \"fr\".",
                "enum": ["en", "fr"],
