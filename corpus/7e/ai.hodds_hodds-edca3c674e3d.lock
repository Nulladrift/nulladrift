        {
          "name": "send_feedback",
          "title": "Report an outcome",
          "description": "Stores a declarative outcome report for an option returned by search_solutions: outcome YES (the option met the need), PARTLY or NO, with the request_id and the option id exactly as returned. It is the only HODDS tool that writes data without a token; the watch tools (watch_need and the others) write only with an organisation token. The report is stored as an unverified caller statement and never changes ranking by itself; the same report sent twice is stored once. When feedback storage is unavailable on the deployment, the tool returns an error and stores nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "option_id": {
                "description": "id of the option being reported.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                "type": "string"
              },
              "outcome": {
                "description": "YES: the option met the need. PARTLY: in part. NO: it did not.",
                "enum": ["YES", "PARTLY", "NO"],
                "type": "string"
              },
              "request_id": {
                "description": "request_id returned by search_solutions (req_...).",
                "maxLength": 68,
                "minLength": 5,
                "pattern": "^req_[A-Za-z0-9_-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["option_id", "outcome", "request_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "status": {
                "const": "RECEIVED"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report an outcome"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:58e57be1c5618efb7dde24a887e537185ba875c56984afbc22c5a5f84836e09e"
        },
        {
          "name": "set_creator_processes",
          "title": "Set the subscribed processes",
          "description": "Replaces the list of subscribed processes. Without an active subscription the result has status 402 and a Stripe Checkout destination for a person to open. With one, an addition through this tool also answers status 402 with the Plan page as destination: nothing is charged here, only the page charges, after a person confirms it. Removals apply at once and the removed processes stay readable until the end of the paid period. An empty list is refused (empty_selection): use cancel_creator_plan. Contract 0.3.1. Needs an organisation token (Authorization: Bearer hodds_...); without it the tool returns the error token_required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "processes": {
                "items": {
                  "description": "Process id of /catalogue/processes.json.",
                  "enum": ["automate-workflows", "build-ai-agents", "use-ai-models", "develop-software", "host-and-deploy", "store-and-query-data", "analyze-data", "secure-access", "monitor-systems", "collect-web-data", "do-accounting", "invoice-and-get-paid", "accept-online-payments", "business-banking", "manage-expenses", "run-payroll", "manage-people", "recruit-talent", "sign-documents", "start-a-company", "run-a-practice", "manage-customer-relationships", "find-leads", "run-email-marketing", "manage-social-media", "build-websites", "sell-online", "support-customers", "design-visuals", "produce-media", "improve-search-visibility", "manage-projects", "write-and-document", "communicate-as-a-team", "schedule-appointments", "store-and-share-files", "process-documents", "transcribe-and-translate", "collect-forms-and-surveys", "improve-ai-discoverability", "agentic-cybersecurity", "agent-harnesses-sandboxes"],
                  "type": "string"
                },
                "maxItems": 60,
                "type": "array"
              }
            },
            "required": ["processes"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "payment_required": {
                "additionalProperties": false,
                "properties": {
                  "added": {
                    "items": {
                      "description": "Process id of /catalogue/processes.json.",
                      "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                      "type": "string"
                    },
                    "type": "array",
                    "uniqueItems": true
                  },
                  "amount_excl_vat_month": {
                    "pattern": "^-?\\d+\\.\\d{2}$",
                    "type": "string"
                  },
                  "destination": {
                    "format": "uri",
                    "pattern": "^https://(?:checkout\\.stripe\\.com/|[a-z0-9.-]+/creator/plan\\?preselect=)",
                    "type": "string"
                  },
                  "pending": {
                    "additionalProperties": false,
                    "description": "Delivery on the next call: alerts that wait for this organisation. Absent when there is nothing to deliver. Only ack_alerts empties it.",
                    "properties": {
                      "count": {
                        "description": "Unacknowledged alerts of the organisation.",
                        "minimum": 1,
                        "type": "integer"
                      },
                      "summary": {
                        "description": "One sentence in English, or in French when the request was in French.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "watches": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "alert_ids": {
                              "items": {
                                "pattern": "^a_[a-z2-7]{20}$",
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "challenger": {
