        {
          "name": "search_solutions",
          "title": "Search software for a need",
          "description": "Searches the HODDS catalogue of software, SaaS, APIs and online services, organised by business process, for records that match a need written in English or French (for example \"transcribe my meetings\" or \"automatiser mes workflows\"). Returns a request_id, a status and up to `limit` options; each option has an id, a label, a short description and source URLs (provenance). Ranking combines lexical matching on record names, keywords and processes with semantic similarity (multilingual embeddings on Cloudflare Workers AI), or lexical matching alone when the semantic part is unavailable; ownership or sponsorship never changes it. Confidence is always UNKNOWN: records are non-attested facts taken from publishers' public pages. Status NO_MATCH with an empty option list means that no record matches the need closely enough, or that the need belongs to a process with no record yet; results are never padded. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of option descriptions: \"en\" (default) or \"fr\".",
                "enum": ["en", "fr"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of options to return (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "need": {
                "description": "The need in natural language, English or French: the task to get done.",
                "maxLength": 500,
                "minLength": 1,
                "pattern": "\\S",
                "type": "string"
              },
              "process": {
                "description": "Optional process id that restricts the search (ids from list_processes, e.g. \"automate-workflows\").",
                "enum": ["automate-workflows", "build-ai-agents", "use-ai-models", "develop-software", "host-and-deploy", "store-and-query-data", "analyze-data", "secure-access", "monitor-systems", "collect-web-data", "do-accounting", "invoice-and-get-paid", "accept-online-payments", "business-banking", "manage-expenses", "run-payroll", "manage-people", "recruit-talent", "sign-documents", "start-a-company", "run-a-practice", "manage-customer-relationships", "find-leads", "run-email-marketing", "manage-social-media", "build-websites", "sell-online", "support-customers", "design-visuals", "produce-media", "improve-search-visibility", "manage-projects", "write-and-document", "communicate-as-a-team", "schedule-appointments", "store-and-share-files", "process-documents", "transcribe-and-translate", "collect-forms-and-surveys", "improve-ai-discoverability", "agentic-cybersecurity", "agent-harnesses-sandboxes"],
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "options": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "confidence": {
                      "additionalProperties": false,
                      "properties": {
                        "evidence": {
                          "items": {
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "status": {
                          "enum": ["KNOWN", "UNKNOWN"]
                        }
                      },
                      "required": ["status"],
                      "type": "object"
                    },
                    "description": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "execution_ref": {
                      "type": "string"
                    },
                    "id": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "label": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "provenance": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["description", "id", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "request_id": {
                "minLength": 1,
                "type": "string"
              },
              "status": {
                "enum": ["OK", "NO_MATCH", "ERROR"]
              }
            },
            "required": ["options", "request_id", "status"],
            "title": "HODDS Result v0",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search software for a need"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
