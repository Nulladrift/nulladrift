        {
          "name": "get_solution",
          "title": "Get a catalogue record",
          "description": "Returns one HODDS catalogue record by id (an option id returned by search_solutions): name, homepage, summary in English and French, processes (the first is primary), keywords, pricing models without amounts (empty means unknown) with the pricing page, interfaces (public API, MCP server, self-hosting: yes, no or unknown), markets, publisher, dated sources and status. Status non_attested means the publisher has not confirmed the record; unknown values are stated as unknown. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Solution id, e.g. \"n8n\".",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "allOf": [
              {
                "else": {
                  "not": {
                    "required": ["withdrawn_on"]
                  }
                },
                "if": {
                  "properties": {
                    "status": {
                      "const": "withdrawn"
                    }
                  },
                  "required": ["status"]
                }
              }
            ],
            "description": "One software or service in the HODDS catalogue. Facts come from the publisher's own public pages, listed in sources. Unknown is a valid value. scripts/catalogue.mjs enforces these rules at build time, plus cross-record rules (unique ids and homepages, file name = id, folder = group of the primary process, real calendar dates).",
            "properties": {
              "added_on": {
                "format": "date",
                "type": "string"
              },
              "data_portability": {
                "additionalProperties": false,
                "description": "Documented export formats (lowercase) and catalogue ids of solutions the publisher documents an import from. Omitted, empty or without source = unknown.",
                "properties": {
                  "export_formats": {
                    "items": {
                      "maxLength": 40,
                      "minLength": 1,
                      "pattern": "^(?=\\S(?:[\\s\\S]*\\S)?$)[^A-Z\\u00C0-\\u00D6\\u00D8-\\u00DE]{1,40}$",
                      "type": "string"
                    },
                    "type": "array",
                    "uniqueItems": true
                  },
                  "import_from": {
                    "items": {
                      "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                      "type": "string"
                    },
                    "type": "array",
                    "uniqueItems": true
                  },
                  "source": {
                    "pattern": "^https://\\S+$",
                    "type": "string"
                  }
