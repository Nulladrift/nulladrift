      "serverInfo": {
        "name": "hodds",
        "title": "HODDS",
        "version": "0.7.0",
        "description": "Find software, SaaS and APIs for a need in a sourced catalogue organised by business process.",
        "websiteUrl": "https://hodds.ai/connect/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "HODDS: software by process, non-attested public facts, confidence UNKNOWN; ranking ignores ownership, sponsorship. compare_solutions/find_comparable_solutions: sourced capabilities, unknowns. send_feedback, the only write without a token: YES/PARTLY/NO. Watching a need and the publisher space need an organisation account: https://hodds.ai/account/. Token for watch tools; price: €2 excl. VAT at the start of each monthly period covers the first 4 counted watches; initial basket extras: €0.50 each now; later extras: €0.50 excl. VAT at period end, never charged twice; results may carry \"HODDS pending: ...\" (_meta ai.hodds/pending): get_watch shows, ack_alerts clears. Using HODDS means accepting its terms: https://hodds.ai/terms/. Acts done with a token bind the organisation that created it.",
      "tools": [
        {
          "name": "ack_alerts",
          "title": "Acknowledge alerts",
          "description": "Acknowledges alerts of one watch (alert_ids, or all: true for every alert of this watch); the only call that empties the pending delivery. Returns the number acknowledged and the number remaining for the organisation; a replay changes nothing. Needs an organisation token (Authorization: Bearer hodds_...); without it the tool returns the error token_required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alert_ids": {
                "description": "Alert ids (a_...).",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "all": {
                "description": "true: every alert of this watch.",
                "type": "boolean"
              },
              "watch_id": {
                "description": "Watch id returned by watch_need or list_watches (w_...).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["watch_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "Answer of ack_alerts and POST /api/watches/{id}/ack. Replaying the same acknowledgement changes nothing.",
            "properties": {
              "acked": {
                "description": "Alerts acknowledged by this call.",
                "minimum": 0,
                "type": "integer"
              },
              "pending": {
                "additionalProperties": false,
                "description": "Delivery on the next call: alerts that wait for this organisation. Absent when there is nothing to deliver. Only ack_alerts empties it.",
                "properties": {
                  "count": {
                    "description": "Unacknowledged alerts of the organisation.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "summary": {
                    "description": "One sentence in English, or in French when the request was in French.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "watches": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "alert_ids": {
                          "items": {
                            "pattern": "^a_[a-z2-7]{20}$",
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "challenger": {
                          "additionalProperties": false,
                          "properties": {
                            "hodds_status": {
                              "enum": ["approved", "not_yet"]
                            },
                            "option_id": {
                              "pattern": "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$",
                              "type": "string"
                            }
                          },
                          "required": ["hodds_status", "option_id"],
                          "type": ["object", "null"]
                        },
                        "watch_id": {
                          "pattern": "^w_[a-z2-7]{20}$",
                          "type": "string"
                        }
                      },
                      "required": ["alert_ids", "challenger", "watch_id"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["count", "summary", "watches"],
                "type": "object"
              },
              "remaining": {
                "description": "Unacknowledged alerts left for the organisation.",
                "minimum": 0,
                "type": "integer"
              },
              "summary": {
                "description": "One sentence in English, or in French when the request was in French.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["acked", "remaining"],
            "title": "HODDS acknowledgement (0.3.0)",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Acknowledge alerts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:eb301352157f57128d4c6d0843b46d1a23ed9395351422196489061fdc05f329"
        },
