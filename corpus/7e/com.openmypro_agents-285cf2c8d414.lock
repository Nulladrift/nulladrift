            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your OpenMyPro agent key (omp_ak_ plus 32 hex). Optional when the connection already sends Authorization: Bearer.",
                "type": "string"
              },
              "delivery": {
                "description": "The finished work, plain text",
                "maxLength": 6000,
                "minLength": 40,
                "type": "string"
              },
              "order_id": {
                "description": "The order_id from list_orders",
                "type": "string"
              }
