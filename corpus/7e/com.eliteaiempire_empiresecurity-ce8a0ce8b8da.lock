{
  "lockfileVersion": 2,
  "subjects": {
    "com.eliteaiempire/empiresecurity": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://security.eliteaiempire.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "empire-security",
        "title": "Empire Security",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Two read-only tools, scan_domain and insurance_pack. They never send attack payloads.",
      "tools": [
        {
          "name": "get_checkout_link",
          "title": "Checkout link",
          "description": "Checkout URL for a plan. With no arguments: the main paid plan. Where the site supports it the URL is a Stripe-hosted Checkout session (created unpaid; a human pays, nothing is charged by this tool). A free plan is only returned when the plan is requested or the company sells nothing else.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept_terms": {
                "description": "ONLY where the site requires the buyer to accept its Terms/refund policy before checkout: set true only after the human buyer has read and accepted the policy links the tool lists. Never set it on your own.",
                "type": "boolean"
              },
              "buyer_email": {
                "description": "only for sites that need the buyer's email or store handle before checkout: the human buyer's own receipt email",
                "type": "string"
              },
              "interval": {
                "enum": ["month", "year", "one_time"],
                "type": "string"
              },
              "plan": {
                "description": "plan name from list_pricing",
                "type": "string"
              },
              "store_handle": {
                "description": "only where the site asks for it (StoreForge): the store handle the buyer chose, 3+ chars a-z 0-9 -",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1df56545d49388991c5f0fd5e46151e89446d8863ce5bac8a3657d9fc5425d21"
        },
        {
          "name": "get_company_info",
          "title": "Company info",
          "description": "What this company sells, who it is for, and every agent/API entry point. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e40a1a2e81804358b8dea4a6f68018d33ced5fcfca8d2ccb31f6ec66188e96a"
        },
        {
          "name": "insurance_pack",
          "description": "Cyber-insurance questionnaire pack for a public domain: answers the questions a passive scan can see (email authentication, DMARC, HTTPS, HSTS) and names the evidence an MSP attaches for the rest.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Public domain such as example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b233c144dbbd7b8c6ed8990dbd33b403b3bedca3d2999bf53d88de324c9f9520"
        },
        {
          "name": "list_pricing",
          "title": "Pricing",
          "description": "Current plans and prices in USD: plan, interval, amount_usd, currency, what_you_get. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a70b1e72c288f49364b1f6dcb818414fae28bcc51a21edf308ca6a7fcf66f02a"
        },
        {
          "name": "scan_domain",
          "description": "Passive, read-only check of a public domain: DNS, TLS certificate and security headers. Refuses names that are not public.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Public domain such as example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72a179bb32e77d009e1a16900c6fefe42383681e78355e17b7d10f16ab5347cb"
        },
        {
          "name": "search_site",
          "title": "Search this site",
          "description": "Find pages on this site by keyword; returns url, title and summary.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "keywords",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ada2036cd178ac425caca9291739cde13a41dbbcc41e83b3e8fbfdf201f59a79"
        }
      ],
