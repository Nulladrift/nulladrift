        {
          "name": "pancakeswap_range_plan",
          "description": "Replay real swaps to compare PRICE RANGE widths for a PancakeSwap V3 position: fees each width would have earned and how long it stayed in range. Use it after the pool is chosen (pancakeswap_fee_tiers picks the tier); for a position you already hold use pancakeswap_position_look. Read-only, free, no key. For a liquidity provider who has picked a PancakeSwap V3 pool and now has to pick a PRICE RANGE - the decision concentrated liquidity actually forces, and the one every interface answers with a preset. This does not model and does not forecast. It replays: the V3 Swap event carries the liquidity that was active when each trade went through, so a position of a stated size is walked through the swaps that really happened in a live window and asked, at each one, whether it was in range and what share of the active liquidity it was. Returns per candidate width the fees it would have collected, how much of the window it stayed in range, and how many times the price walked out. Impermanent loss is not in it, and it is worst exactly where the fees are best. The window is about an hour and travels with the answer.",
