        {
          "name": "search_news",
          "title": "Search news",
          "description": "Search recent news on any topic across a curated index of news outlets worldwide, judged by a relevance model. Returns the matching articles: title, link, source, date, country and language, standfirst, and short excerpts in the modes that read. Use it for current events and for what outlets reported about a company, person, place or topic. Defaults: mode \"fast\" (US$1.40 per 1,000 searches) and the last 7 days; mode \"ultra\" judges headlines only, for US$1.00.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "countries": {
                "description": "Only sources from these countries: ISO 3166-1 alpha-2 codes, such as [\"AR\"] or [\"US\", \"GB\"].",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "days": {
                "description": "Only the last N days, 1 to 365. Defaults to 7 unless published_after or published_before are given.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "exclude_domains": {
                "description": "Never these domains or paths.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "include_domains": {
                "description": "Only these domains or paths, such as example.com or example.com/sports.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "index": {
                "description": "Optional: search your own custom index (its id, idx_…) instead of the news index: your own list of URLs, sitemap or feed, created at https://app.typesearch.ai/indexes or with POST /v1/indexes. Same modes and prices; no date filter unless you pass days or dates.",
                "pattern": "^idx_[a-z0-9]{6,40}$",
                "type": "string"
              },
              "languages": {
                "description": "Only sources that publish in these languages: ISO 639-1 codes, such as [\"es\"] or [\"en\", \"pt\"].",
                "items": {
                  "maxLength": 35,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "max_results": {
                "default": 10,
                "description": "How many results, 1 to 25. Defaults to 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "default": "fast",
                "description": "fast (default): headlines and standfirsts · ultra (cheapest): headlines only · normal: also reads the best matches · deep: reads more, finds the topic in other words too.",
                "enum": ["ultra", "fast", "normal", "deep"],
                "type": "string"
              },
              "published_after": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  }
                ],
                "description": "Published on or after this date: 2026-09-25, or a date-time with offset."
              },
              "published_before": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  }
                ],
                "description": "Published on or before this date; a bare date includes that whole day."
              },
              "query": {
                "description": "What to look for, in any language: a topic, event, person, company or place, such as \"inflation in Argentina\" or \"OpenAI funding\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cached": {
                "const": true,
                "type": "boolean"
              },
              "cost_usd": {
                "type": "number"
