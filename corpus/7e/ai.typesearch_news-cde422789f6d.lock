        {
          "name": "get_contents",
          "title": "Get article contents",
          "description": "Get the title, standfirst, date, source and a short verbatim excerpt (up to 25 words) of up to 10 news article URLs. With a query, the excerpt is the one about it and relevance says how much the article covers it. Never returns the full text. US$0.20 per 1,000 pages read (US$0.40 with a query); pages that fail are free.",
