{
  "lockfileVersion": 2,
  "subjects": {
    "ai.typesearch/news": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.typesearch.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "typesearch",
        "title": "typesearch",
        "version": "1.0.0",
        "websiteUrl": "https://typesearch.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "typesearch is news search for AI agents: a curated index of news outlets worldwide, judged by a calibrated relevance model. Results carry title, link, source, date, country and language, and short excerpts, never full articles: cite the link.\n- search_news: news on a topic. mode \"ultra\" is the cheapest (US$1.00 per 1,000 searches) and judges headlines only; \"fast\" (the default, US$1.40) also judges standfirsts, just as quick; \"normal\" (US$2.20) reads the best matches; \"deep\" (US$5.60) reads more and also searches the topic in other words. Narrow it with days, published_after/before, include/exclude_domains, countries (ISO 3166-1 alpha-2) and languages (ISO 639-1). With index (idx_…), it searches the user's own custom index (their list of URLs) instead of the news index, at the same prices.\n- get_contents: title, standfirst, date and a short excerpt of up to 10 article URLs (US$0.20 per 1,000 pages; with query, the excerpt about it: US$0.40).\n- find_similar: other coverage of the story in an article URL (US$2.20 per 1,000).\n- create_chart: a chart card from a question in plain words (race standings, poll or election results, wins in a season, coverage over time, share of voice, tone, top outlets, a timeline, the figures articles publish, or custom index data). It picks the chart, the key figures and a title that states the finding, and returns an image URL and an embeddable URL. Show the image to the user. It costs its search (the mode, per query) plus US$0.50 per 1,000 charts.\nEvery call is billed to the API key at these list prices, like the REST API; cached results and failed calls are free.",
      "tools": [
        {
          "name": "create_chart",
          "title": "Create a chart",
          "description": "Turn a question into a chart card, without thinking about chart types: the standings of the latest race, poll or election results by candidate, wins in a season, coverage over time, share of voice between names, tone, the outlets that cover a topic most, what an outlet published, a timeline of a story, the figures the articles publish (a price, a rate), or data from a custom index. It works out what the user expects (`understood`, with other readings to pass as `interpretation`), verifies every value against its source, picks the chart, the key figures and a title that states the finding, and returns an image URL (show it to the user) and an embed URL. If the exact data is not published it shows the closest thing and says so (`rung`, warnings). It costs its search (the mode it needs, per query) plus US$0.50 per 1,000 charts; the same request within 10 minutes is free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compare": {
                "description": "What to compare, 2 to 5, if the query does not say it with \"vs\": [\"Milei\", \"Bullrich\"].",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "countries": {
                "description": "Only sources from these countries: ISO 3166-1 alpha-2 codes, such as [\"AR\"] or [\"US\", \"GB\"].",
                "items": {
                  "maxLength": 20,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "days": {
                "description": "Only the last N days, 1 to 365. By default it depends on the chart: 30 for coverage, 7 for figures.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "index": {
                "description": "Optional: chart your own custom index (idx_…) instead of the news: prices, ratings, availability, brands.",
                "pattern": "^idx_[a-z0-9]{6,40}$",
                "type": "string"
              },
              "interpretation": {
                "description": "Optional: one of the `alternatives` of a previous call, to chart that reading of the query instead.",
                "maxLength": 160,
                "type": "string"
              },
              "languages": {
                "description": "Only sources that publish in these languages: ISO 639-1 codes, such as [\"es\"] or [\"en\", \"pt\"].",
                "items": {
                  "maxLength": 35,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "query": {
                "description": "What to chart, in plain words and any language: \"blue dollar this week\", \"Milei vs Bullrich coverage\", \"tone of the IMF coverage\", \"which outlets cover lithium\", or \"prices\" with index.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "theme": {
                "default": "light",
                "description": "light (default), dark, editorial (warm paper) or electric (deep blue).",
                "enum": ["light", "dark", "editorial", "electric"],
                "type": "string"
              },
              "type": {
                "default": "auto",
                "description": "auto (default) picks the chart that tells the data best. Or force one: line, area, bar, bar_horizontal, stacked_bar, pie, donut, scatter, funnel, timeline, kpi, table.",
                "enum": ["auto", "line", "area", "bar", "bar_horizontal", "stacked_bar", "pie", "donut", "scatter", "funnel", "timeline", "kpi", "table"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "alternatives": {
                "description": "Other readings of the query: pass one as `interpretation` to chart it instead.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cached": {
                "const": true,
                "type": "boolean"
              },
              "cost_usd": {
                "type": "number"
              },
              "data": {
                "description": "The values drawn (up to 40 per series).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "points": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "x": {
                            "type": ["string", "number"]
                          },
                          "y": {
                            "type": "number"
                          }
                        },
                        "required": ["x", "y"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["name", "points"],
                  "type": "object"
                },
                "type": "array"
              },
              "embed_url": {
                "description": "An iframe for a web page or app.",
                "type": "string"
              },
              "events": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["date", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "id": {
                "type": "string"
              },
              "image_url": {
                "description": "PNG: show it to the user.",
                "type": "string"
              },
              "improving": {
                "const": true,
                "description": "Still looking for the exact data: the image and embed update themselves if it arrives.",
                "type": "boolean"
              },
              "key_figures": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "change": {
                      "type": "number"
                    },
                    "change_is_percent": {
                      "type": "boolean"
                    },
                    "label": {
                      "type": "string"
                    },
                    "value": {
                      "type": "number"
                    }
                  },
                  "required": ["label", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "request_id": {
                "type": "string"
              },
              "rung": {
                "description": "exact (the data asked for), partial (a verified part), related, coverage or stories (the closest thing found).",
                "type": "string"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "source": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "subtitle": {
                "type": "string"
              },
              "table": {
                "description": "The rows of a table chart (up to 10), keyed by column label.",
                "items": {
                  "additionalProperties": {
                    "type": ["string", "number", "null"]
                  },
                  "propertyNames": {
                    "type": "string"
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "title": {
                "description": "It states the finding.",
                "type": "string"
              },
              "type": {
                "type": "string"
              },
              "understood": {
                "description": "What we understood the user expects to see.",
                "type": "string"
              },
              "warnings": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "message"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["cost_usd", "request_id", "title", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a chart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c83e07e8fb352e29d5c28bc06d9ba6b2a43f1e3269c2348c5a1f809df9c577d5"
