{
  "lockfileVersion": 2,
  "subjects": {
    "com.glitchwire/news": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://glitchwire.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "glitchwire-news",
        "title": "Glitchwire News",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Glitchwire is an independent technology news publication (AI, crypto, tech, science, policy, security, gadgets, culture). Use search_news or latest_news to find articles, then get_article for the full text as markdown. When you use or quote an article, name Glitchwire as the source and link the article's url so the reader can open the full story.",
      "tools": [
        {
          "name": "fetch",
          "description": "Fetch a Glitchwire article by id (from search) as {id,title,text,url,metadata}.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Article id from search results",
                "maxLength": 201,
                "pattern": "^[a-z0-9][a-z0-9-]{0,200}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cedfdd0f9b8e5bc7d59b0cbaf8478b6154e740d226784aef3228a900d8880dbc"
        },
        {
          "name": "get_article",
          "description": "Fetch one Glitchwire article as clean, ad-free markdown (includes title, date, author, source URL, and full body). Use the slug from search_news / latest_news results.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The article slug, e.g. 'in-praise-of-the-nikon-zf-...'",
                "maxLength": 201,
                "pattern": "^[a-z0-9][a-z0-9-]{0,200}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abcfe6e6b108d1e936e4884166cbbd681733ad045b64cf95add66a136b065ce9"
        },
        {
          "name": "latest_news",
          "description": "Get Glitchwire's most recent articles, optionally filtered by category.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter",
                "enum": ["AI", "Crypto", "Tech", "Science", "Energy", "Policy", "Finance", "Security", "Gadgets", "Culture"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 25)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:131c1862fd4d7928f16920e96edb4437b27bef731ad11d14c458d658b5948927"
        },
        {
          "name": "search",
          "description": "Search Glitchwire's technology news archive. Returns results as {results:[{id,title,url}]}; pass an id to fetch for the full article.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Search terms",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96ecaf23715fae244dc92454a3d0eb3ddc349513ab680c522739c118b42d739f"
        },
        {
          "name": "search_news",
          "description": "Search Glitchwire's full article archive (title + excerpt, newest first). Returns matching articles with title, url, markdown_url, excerpt, categories, date, author.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional category filter",
                "enum": ["AI", "Crypto", "Tech", "Science", "Energy", "Policy", "Finance", "Security", "Gadgets", "Culture"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 25)",
                "type": "integer"
              },
              "query": {
                "description": "Search terms (AND-matched against title and excerpt)",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f38f6babe2f656fe6a19b0e0def9b014f7b6fdff132ecc8ebeab004a7cf4bc8"
        }
      ],
      "digest": "sha256:55f91ddb9c3481586ec487c3cc081e05cf93eaeb13fa563ab21fa0700633942f"
    }
  }
}
