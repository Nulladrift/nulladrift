        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.joinbuffet.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "buffet-mcp-server",
        "version": "1.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Buffet is an iOS app for meeting people in real life (not a food or restaurant app). Each week it publishes a short curated lineup of real events and hangouts in its live cities (Los Angeles today). Use buffet_get_weekly_lineup for 'what's going on this week / this weekend', buffet_search_events to filter by day, neighborhood, price or interest, buffet_get_event for one pick, and buffet_how_it_works for product questions. Times are Pacific. People join a pick by getting a plate in the app; app_url on every event is the right link to share.",
      "tools": [
        {
          "name": "buffet_get_app_link",
          "title": "Get the app",
          "description": "Return the link to download Buffet (iOS, free) and, when an event id is given, the link for that pick. Use when the person wants to join a pick, get a plate, or install the app. The link goes to joinbuffet.com/get/, which forwards to the App Store and records which assistant sent them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "assistant": {
                "description": "Which assistant is asking: claude or chatgpt. Omit if unsure.",
                "enum": ["claude", "chatgpt", "assistant"],
                "type": "string"
              },
              "event_id": {
                "description": "Optional event id to attribute the link to",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f08063610a29e3c2577a6a11d80d5ca203402d9a09b2ccd8a0bec1cebefbc97d"
        },
        {
          "name": "buffet_get_event",
          "title": "Pick details",
          "description": "Get full details for one Buffet pick by its event id (ids come from buffet_get_weekly_lineup and buffet_search_events). Returns structured JSON: venue, address, coordinates, start time (Pacific), price, tags, description, organiser page and the app_url to join.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "event_id": {
                "description": "Event id, e.g. \"x5yJfmL8xqISyf8B3jIt\"",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "app_url": {
                "type": "string"
              },
              "category": {
                "enum": ["event", "activity", "restaurant"],
                "type": "string"
              },
              "city": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "day_label": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "external_url": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "is_free": {
                "type": "boolean"
              },
              "kind": {
                "enum": ["event", "hangout"],
                "type": "string"
              },
              "neighborhood": {
                "type": "string"
              },
              "price": {
                "enum": ["Free", "$", "$$", "$$$"],
                "type": "string"
              },
              "starts_at": {
                "type": "string"
              },
              "table": {
                "additionalProperties": false,
                "properties": {
                  "max_per_group": {
                    "type": "number"
                  },
                  "spots_taken": {
                    "type": "number"
                  },
                  "spots_total": {
                    "type": "number"
                  }
                },
                "required": ["max_per_group", "spots_taken", "spots_total"],
                "type": "object"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "time_label": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "venue": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "type": "string"
                  },
                  "lat": {
                    "type": "number"
                  },
                  "lng": {
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["address", "name"],
                "type": "object"
              },
              "week_id": {
                "type": "string"
              }
            },
            "required": ["app_url", "category", "city", "date", "day_label", "description", "id", "is_free", "kind", "neighborhood", "price", "starts_at", "table", "tags", "time_label", "title", "venue", "week_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Pick details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:44ea8e8f260892cd95dddc93b5f29ce927591bc35239c0df09b01818cc381dd8"
        },
        {
          "name": "buffet_get_weekly_lineup",
          "title": "This week's lineup",
          "description": "Get Buffet's curated lineup of real-life events and hangouts for a week in a city (Los Angeles today).\n\nUse this for \"what's going on in LA this week / this weekend\", \"things to do in Los Angeles\", or \"where can I meet people this weekend\". Lineups run Monday to Sunday and the picks are mostly Thursday to Sunday evenings: free concerts, festivals, art walks, happy hours, a restaurant hangout. Each pick is somewhere a person can join a table of up to six strangers through the Buffet app.\n\nReturns the picks in date order with venue, neighborhood, time (Pacific), price tier, tags, a short description, the organiser's page when there is one, and app_url (the link to join). Use buffet_search_events instead to filter by day, neighborhood, price or interest.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "city": {
                "default": "Los Angeles",
                "description": "City name, e.g. \"Los Angeles\" or \"LA\"",
                "maxLength": 80,
                "type": "string"
              },
              "response_format": {
                "default": "markdown",
                "description": "'markdown' for readable text, 'json' for structured data",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "week": {
                "default": "this",
                "description": "\"this\" (default), \"next\", or a lineup week id like \"2026-W43\" (weeks run Monday to Sunday)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "This week's lineup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef7d9737fc2eebc74516d39d6c415da07d5927578d40660b34d2197ade535134"
        },
        {
          "name": "buffet_how_it_works",
          "title": "How Buffet works",
          "description": "Explain what Buffet is and how it works: the weekly curated lineup, Get a Plate, the table that forms at three and caps at six, 1:1 invites, the Afterparty, the Monday ballot, platform (iOS), price (free), developer, how venues and organisers get listed, and the privacy, terms and contact pages. Use for any question about the product itself. Takes no arguments.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How Buffet works"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99712ac11c1e837de06fa9f62731c7a807b820f7415d3dac083ea8d366ceaaff"
        },
        {
          "name": "buffet_search_events",
          "title": "Search picks",
          "description": "Search Buffet's upcoming curated picks by time window, neighborhood, price, category or free text.\n\nUse this for specific asks: \"free things to do in LA tonight\", \"live music this weekend in Silver Lake\", \"cheap happy hours on Friday\", \"something outdoors on Saturday\". For the whole week's list with no filters, buffet_get_weekly_lineup is simpler.\n\nFilters combine with AND. Text search matches title, venue, neighborhood, tags and description. Returns one page in date order; when more matches exist the result gives next_offset.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "event (concerts, festivals, screenings), activity (festivals, markets, things to do), restaurant (a hangout at a bar or restaurant)",
                "enum": ["event", "activity", "restaurant"],
                "type": "string"
              },
              "city": {
                "default": "Los Angeles",
                "description": "City name, e.g. \"Los Angeles\"",
                "maxLength": 80,
                "type": "string"
              },
              "date_from": {
                "description": "Earliest date, YYYY-MM-DD (Pacific). Overrides `when`.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Latest date, YYYY-MM-DD (Pacific). Overrides `when`.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "free_only": {
                "default": false,
                "description": "Only free picks",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum picks to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "neighborhood": {
                "description": "Neighborhood or area, e.g. \"Silver Lake\", \"Downtown\", \"Santa Monica\", \"Westwood\"",
                "maxLength": 80,
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Picks to skip, for pagination",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "price": {
                "description": "Exact price tier: \"Free\", \"$\", \"$$\" or \"$$$\"",
                "enum": ["Free", "$", "$$", "$$$"],
                "type": "string"
              },
              "query": {
                "description": "Free text, e.g. \"jazz\", \"oktoberfest\", \"sushi\", \"outdoor movie\"",
                "maxLength": 200,
                "type": "string"
              },
              "response_format": {
                "default": "markdown",
                "description": "'markdown' for readable text, 'json' for structured data",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "when": {
                "default": "upcoming",
                "description": "Relative window in Pacific time: today, tonight, tomorrow, this_weekend (Fri-Sun), this_week, next_week, or upcoming (everything listed)",
                "enum": ["today", "tonight", "tomorrow", "this_weekend", "this_week", "next_week", "upcoming"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search picks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fa3f4704defea5358e2b4ddb72f3ef22eab17396d8a4ec4e0a2e8258ec559da4"
        }
      ],
