      "serverInfo": {
        "name": "ai.preclick/preclick-mcp",
        "title": "PreClick — An MCP-native URL preflight scanning service for autonomous agents.",
        "version": "0.3.6",
        "description": "PreClick scans links for threats and confirms intent match with high accuracy before agents click.",
        "websiteUrl": "https://preclick.ai"
      },
      "capabilities": {
        "tasks": {
          "cancel": {},
          "list": {},
          "requests": {
            "tools": {
              "call": {}
            }
          }
        },
        "tools": {}
      },
      "instructions": "Use url_scanner_scan or url_scanner_scan_with_intent to analyze URLs for security threats. The scan runs asynchronously - use task parameter and poll tasks/get or tasks/result for results. Typical full scan duration: around 70-80 seconds. If your client does not support the MCP Tasks protocol, use the async compatibility tools instead: url_scanner_async_scan (or url_scanner_async_scan_with_intent) to submit, then url_scanner_async_task_status or url_scanner_async_task_result to poll.",
      "tools": [
        {
          "name": "url_scanner_async_scan",
          "description": "Submit a URL for asynchronous security analysis. Returns immediately with a task_id. Poll with url_scanner_async_task_status to check progress, then url_scanner_async_task_result to get the scan result. Async counterpart of url_scanner_scan for clients without native MCP Tasks support.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Request parameters for url_scanner_async_scan tool.",
            "properties": {
              "url": {
                "description": "The URL to analyze. Must be HTTP or HTTPS. If no scheme provided, https:// is assumed.",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "AsyncScanRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6f62ead31e47ddb972fd2ab4421bacd23c9244df5e8891dc784e0246c8b81f9c"
        },
        {
          "name": "url_scanner_async_scan_with_intent",
          "description": "Submit a URL with optional user intent for asynchronous security analysis. Returns immediately with a task_id. Poll with url_scanner_async_task_status to check progress, then url_scanner_async_task_result to get the scan result. Async counterpart of url_scanner_scan_with_intent for clients without native MCP Tasks support.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Request parameters for url_scanner_async_scan_with_intent tool.",
            "properties": {
              "intent": {
                "description": "Optional user intent for visiting the URL. Recommended for additional context.",
                "type": ["string", "null"]
              },
              "url": {
                "description": "The URL to analyze. Must be HTTP or HTTPS. If no scheme provided, https:// is assumed.",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "AsyncScanWithIntentRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b5f721455d32996e79c9f3ab5b65b86cdfc80b718da201d65c2d5b5118213b61"
        },
        {
          "name": "url_scanner_async_task_result",
          "description": "Retrieve the result of an asynchronous scan task. If completed, returns the full scan result (risk_score, confidence, agent_access_directive, etc.). If still running, returns status with retry_after_ms — call again after that interval. Non-blocking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Request parameters for url_scanner_async_task_result tool.",
            "properties": {
              "task_id": {
                "description": "The task ID to retrieve the result for.",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "title": "AsyncTaskResultRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:525b8f1d1d958bdd8824ba51b7640f1c05937bc44b8b213ab54630989669e095"
        },
        {
          "name": "url_scanner_async_task_status",
          "description": "Check the status of an asynchronous scan task. Returns the current task status using native MCP task semantics (working, completed, failed, cancelled) without blocking. Use url_scanner_async_task_result to retrieve the result once completed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Request parameters for url_scanner_async_task_status tool.",
            "properties": {
              "task_id": {
                "description": "The task ID to check status for.",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "title": "AsyncTaskStatusRequest",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5955eb57ffe19e7ca50f070359d2f34b79d286dfd81bf1ee71783605c87e76f5"
        },
        {
          "name": "url_scanner_scan",
          "description": "Analyze a URL for security threats (synchronous, blocks until complete or timeout). Returns risk score, confidence, agent access guidance, and intent_alignment (always not_provided for this tool; use url_scanner_scan_with_intent for intent context). For long-running scans, prefer url_scanner_async_scan which returns immediately with a task_id for polling via url_scanner_async_task_result.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "description": "Request parameters for url_scanner_scan tool.\n\nThe URL parameter accepts both encoded and unencoded URLs.\nIf no scheme is provided, https:// is assumed.",
            "properties": {
              "url": {
                "description": "The URL to analyze. Must be HTTP or HTTPS. If no scheme provided, https:// is assumed.",
                "type": "string"
              }
            },
