        {
          "name": "list_posts",
          "description": "List your scheduled and published social posts (YouTube, Instagram, TikTok) with status, public URL and publish time. Filter by status, platform, request, clip or time window; use date=published with since to find posts that went live after a given moment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Which timestamp since/until filter and sort by. Use \"published\" with since to poll for newly live posts.",
                "enum": ["scheduled", "published"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Items per page (1-100)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "Page number",
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Filter by platform",
                "enum": ["youtube", "instagram", "tiktok"],
                "type": "string"
              },
              "requestId": {
                "description": "Only posts made from this request (24-char hex request ID)",
                "pattern": "^[0-9a-fA-F]{24}$",
                "type": "string"
              },
              "shortId": {
                "description": "Only posts made from this clip (short ID)",
                "format": "uuid",
                "type": "string"
              },
              "since": {
                "description": "ISO 8601 lower bound. Applies to scheduledAt, or to publishedAt when date=published",
                "format": "date-time",
                "type": "string"
              },
              "source": {
                "description": "manual = scheduled by hand from the shorts list; automation = posted by channel automation",
                "enum": ["manual", "automation"],
                "type": "string"
              },
              "status": {
                "description": "Filter by post status: scheduled (queued), processing (uploading or waiting for the platform), published (live, has url), failed (has error), canceled",
                "enum": ["scheduled", "processing", "published", "failed", "canceled"],
                "type": "string"
              },
              "until": {
                "description": "ISO 8601 upper bound (same field as since)",
                "format": "date-time",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31cc91421b93bd4c7c477323849e81e39d3e0217f4d2ad55cbc8e384bf279888"
        },
