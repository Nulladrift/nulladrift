{
  "lockfileVersion": 2,
  "subjects": {
    "com.ssemble/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.ssemble.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ssemble-ai-clipping",
        "version": "1.1.11"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_short",
          "description": "Create AI-generated short-form video clips from a YouTube video or uploaded file. Returns a request ID instantly. Processing takes 5-30 minutes. Costs 1 credit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "backgroundColor": {
                "description": "Solid background color as hex, e.g. \"#000000\". Only with blurBackground=false. Omit to use the account's saved background color, else the template color.",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "blurBackground": {
                "description": "Background behind the clip when the source does not fill the 9:16 canvas (mainly layout=fit): true = blurred copy of the video, false = solid color (backgroundColor, else the account's saved color, else the template color). Omit to use the account's saved editor preference (default: blurred).",
                "type": "boolean"
              },
              "captionLanguage": {
                "description": "Caption language if different from spoken",
                "enum": ["en", "es", "fr", "de", "it", "pt", "ru", "ja", "ko", "zh", "ar", "hi", "tr", "pl", "nl", "sv", "no", "da", "fi", "cs", "vi", "id", "fa", "uk", "af", "ca", "et", "fo", "gl", "is", "ms", "sq", "sw", "tl", "ro", "sk", "hr", "sl", "hu", "lv", "lt", "bs", "az", "bg", "mk", "sr", "mt", "el", "ne", "mr", "ka", "hy", "ur", "he"],
                "type": "string"
              },
              "captionsEnabled": {
                "default": true,
                "description": "Burn captions into the clips (default true). Set false for sources that already have captions.",
                "type": "boolean"
              },
              "ctaEnabled": {
                "default": false,
                "description": "Show call-to-action text overlay",
                "type": "boolean"
              },
              "ctaText": {
                "description": "CTA text (max 200 chars, required when ctaEnabled=true)",
                "maxLength": 200,
                "type": "string"
              },
              "customSourceLink": {
                "description": "Own link for the Source line, e.g. \"mysite.com/videos\" (https:// added if missing, max 300 chars). Requires includeSourceLink=true.",
                "maxLength": 300,
                "type": "string"
              },
              "end": {
                "description": "End time in seconds (> start, max 1200s window)",
                "minimum": 1,
                "type": "number"
              },
              "fileUrl": {
                "description": "Public video file URL (alternative to url)",
                "format": "uri",
                "type": "string"
              },
              "gameVideo": {
                "default": false,
                "description": "Add split-screen gameplay overlay",
                "type": "boolean"
              },
              "gameVideoName": {
                "description": "Exact game video name from list_game_videos (case-sensitive)",
                "type": "string"
              },
              "hookTitle": {
                "default": false,
                "description": "Add animated hook title at start",
                "type": "boolean"
              },
              "hookTitlePresetId": {
                "description": "Hook title style (requires hookTitle=true). classic-pill (default) = black text on white pills; dark-pill = white on dark pills; bold-outline = white text with black outline; classic = one white box; native = Regular style: plain white left-aligned text like an Instagram caption; editorial = serif with a lime keyword; statement = condensed setup + big payoff; custom = your own design, set in hookTitleStyle. editorial and statement animate in and leave after ~4s; the others stay for the whole clip. See ssemble://hook-title-presets.",
                "enum": ["classic-pill", "dark-pill", "bold-outline", "editorial", "statement", "classic", "native", "custom"],
                "type": "string"
              },
              "hookTitleStyle": {
                "additionalProperties": false,
                "description": "Your own hook title design. Required when hookTitlePresetId is 'custom', not allowed otherwise. Titles in Korean, Japanese, Chinese, Arabic, Hebrew, Hindi or Thai use a font made for that script.",
                "properties": {
                  "backgroundColor": {
                    "description": "Box colour as hex (pill and box only). Pill also accepts 'none' for text without a box",
                    "type": "string"
                  },
                  "cornerRadius": {
                    "description": "Corner roundness: pill 0-60 (default 40), box 0-40 (default 10)",
                    "type": "number"
                  },
                  "fontId": {
                    "description": "Font id from ssemble://hook-title-fonts (default montserrat-black)",
                    "type": "string"
                  },
                  "fontSize": {
                    "description": "Text size: pill 30-90 (default 56), box 24-64 (default 40), plain 36-90 (default 58)",
                    "type": "number"
                  },
                  "outlineColor": {
                    "description": "Outline hex colour, pill only",
                    "type": "string"
                  },
                  "outlineWidth": {
                    "description": "Text outline 0-12, pill only (0 = none)",
                    "maximum": 12,
                    "minimum": 0,
                    "type": "number"
                  },
                  "shape": {
                    "description": "pill = a rounded box behind each line; box = one box around the whole title; plain = text only",
                    "enum": ["pill", "box", "plain"],
                    "type": "string"
                  },
                  "textCase": {
                    "description": "upper = UPPERCASE (default); asis = keep the title as written",
                    "enum": ["upper", "asis"],
                    "type": "string"
                  },
                  "textColor": {
                    "description": "Hex colour like #FFFFFF",
                    "type": "string"
                  }
                },
                "required": ["shape"],
                "type": "object"
              },
              "includeSourceLink": {
                "description": "When these clips are later scheduled from the Ssemble web app (Share / Calendar), end each caption with \"Source: <link>\": customSourceLink if set, else the original YouTube video. Omit to use the account's last scheduler choice. Does not change the clips.",
                "type": "boolean"
              },
              "language": {
                "default": "en",
                "description": "Spoken language (ISO 639-1)",
                "enum": ["en", "es", "fr", "de", "it", "pt", "ru", "ja", "ko", "zh", "ar", "hi", "tr", "pl", "nl", "sv", "no", "da", "fi", "cs", "vi", "id", "fa", "uk", "af", "ca", "et", "fo", "gl", "is", "ms", "sq", "sw", "tl", "ro", "sk", "hr", "sl", "hu", "lv", "lt", "bs", "az", "bg", "mk", "sr", "mt", "el", "ne", "mr", "ka", "hy", "ur", "he"],
                "type": "string"
              },
              "layout": {
                "default": "auto",
                "description": "Video framing layout",
                "enum": ["auto", "fill", "fit", "square"],
                "type": "string"
              },
              "maxShorts": {
                "description": "Maximum number of shorts to create (1-12). Keeps the highest-scoring clips and never pads, so short videos may return fewer. Omit to get up to 12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "memeHook": {
                "default": false,
                "description": "Prepend a meme hook clip (2-5s attention grabber)",
                "type": "boolean"
              },
              "memeHookName": {
                "description": "Exact meme hook name from list_meme_hooks (case-sensitive)",
                "type": "string"
              },
              "music": {
                "default": false,
                "description": "Add background music",
                "type": "boolean"
              },
              "musicName": {
                "description": "Exact track name from list_music (case-sensitive)",
                "type": "string"
              },
              "musicNames": {
                "description": "Several exact track names from list_music (case-sensitive); each short uses one of them at random. Use instead of musicName. Requires music=true.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "musicVolume": {
                "default": 10,
                "description": "Music volume 0-100",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "noClipping": {
                "default": false,
                "description": "Skip AI clipping, process entire range as one clip",
                "type": "boolean"
              },
              "outroEnabled": {
                "default": false,
                "description": "Append an end-screen outro card (bell animation + \"Please subscribe\" text) after each clip. Default false.",
                "type": "boolean"
              },
              "outroHandle": {
                "description": "Channel handle shown on the outro card, e.g. \"@mychannel\" (max 40 chars). Requires outroEnabled=true.",
                "maxLength": 40,
                "type": "string"
              },
              "outroImageUrl": {
                "description": "Public image URL for a custom outro card instead of the stock bell card. Requires outroEnabled=true.",
                "format": "uri",
                "type": "string"
              },
              "outroSeconds": {
                "default": 2,
                "description": "Outro duration in seconds (1-3, default 2). Requires outroEnabled=true.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "outroSting": {
                "default": true,
                "description": "Play the short bell sound on the outro (default true). Requires outroEnabled=true.",
                "type": "boolean"
              },
              "outroText": {
                "description": "Custom outro text (max 80 chars). Omit for the localized default (\"Please subscribe\"). Requires outroEnabled=true.",
                "maxLength": 80,
                "type": "string"
              },
              "preferredLength": {
                "default": "under60sec",
                "description": "Target clip duration",
                "enum": ["under30sec", "under60sec", "under90sec", "under3min", "under5min", "under10min"],
                "type": "string"
              },
              "start": {
                "description": "Start time in seconds (>= 0)",
                "minimum": 0,
                "type": "number"
              },
              "templateId": {
                "description": "Caption template ID from list_templates (24-char hex)",
                "pattern": "^[0-9a-fA-F]{24}$",
                "type": "string"
              },
              "url": {
                "description": "YouTube video URL",
                "type": "string"
              },
              "webhookUrl": {
                "description": "Optional webhook URL for completion/failure notifications. Receives a POST with results when processing finishes.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["end", "start"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
