            "properties": {
              "requestId": {
                "description": "The request ID to delete (24-char hex). This action is irreversible and credits are NOT refunded.",
                "pattern": "^[0-9a-fA-F]{24}$",
                "type": "string"
              }
            },
            "required": ["requestId"],
            "type": "object"
          },
