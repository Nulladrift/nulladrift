{
  "lockfileVersion": 2,
  "subjects": {
    "cn.infimeta/public-source-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://infimeta.cn/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "infimeta-public-search",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public-source retrieval with source limitations. Queries and optional purpose are privately retained 90 days. Do not send secrets or full conversations. Purpose is optional. User-agent identity is unverified.",
      "tools": [
        {
          "name": "report_search_gap",
          "description": "Optionally report whether a previous search helped and which information is missing. Stored privately for research.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "missing": {
                "maxLength": 300,
                "type": "string"
              },
              "outcome": {
                "enum": ["useful", "incomplete", "irrelevant"],
                "type": "string"
              },
              "query_id": {
                "type": "string"
              }
            },
            "required": ["outcome", "query_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1662cf69f89075e616336631c8465bfacd5fe867e1de635ac8ad3472ed969a99"
        },
        {
          "name": "search_public_sources",
          "description": "Search encyclopedias, scholarly metadata and communities. Not whole-web search. Optional purpose does not affect results. Submitted queries are recorded for research.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "follow_up_of": {
                "format": "uuid",
                "type": "string"
              },
              "purpose": {
                "description": "可选的简短任务目的；不填不会减少结果",
                "maxLength": 300,
                "type": "string"
              },
              "q": {
                "description": "搜索词；不包含隐私或完整聊天",
                "maxLength": 240,
                "type": "string"
              },
              "sources": {
                "items": {
                  "enum": ["wikipedia_en", "wikipedia_zh", "crossref", "hackernews", "stackexchange"],
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b205ab44e8dca95b1832160d7c79ceca2844e1976975e6a9a9b8099df3ee4534"
        }
      ],
      "digest": "sha256:4c4e3a12adf2facc2c7bc1f8777b107317319b5ea4910bd6017106fae46f8ff5"
    }
  }
}
