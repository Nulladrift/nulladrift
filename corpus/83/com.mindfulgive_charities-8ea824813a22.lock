      "serverInfo": {
        "name": "mindful-give",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Find charities that take gifts on Mindful Give and hand the donor that charity's giving page. Use find_charities to search by name, then get_charity for one charity's details. These tools are link-only: they never take a payment. The donor completes the gift themselves on the giving page, and the charity issues the official tax receipt.",
      "tools": [
        {
          "name": "find_charities",
          "title": "Find charities",
          "description": "Search the charities that take gifts on Mindful Give by name. Returns each match with its giving page URL to hand to the donor. This tool only looks charities up and returns a link: it never takes a payment. The donor completes the gift themselves on the charity's giving page, and the charity issues the official tax receipt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many charities to return (1-10, default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of the charity's name, e.g. \"Sacred Heart\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5d6a839f53202503855c6353d4a2345b6419de74a1a9ffa526e54d593ca7a36"
        },
        {
          "name": "get_charity",
          "title": "Get a charity",
          "description": "Get one charity's public details (name, legal name, location, short description, whether it issues tax receipts) and its giving page URL, by its slug (from find_charities). This tool only looks charities up and returns a link: it never takes a payment. The donor completes the gift themselves on the charity's giving page, and the charity issues the official tax receipt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The charity's slug, as returned by find_charities.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
