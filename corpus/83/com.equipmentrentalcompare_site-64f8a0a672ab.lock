      "instructions": "Equipment Rental Compare (https://equipmentrentalcompare.com/): the site's own MCP server, served from its domain. Equipment Rental Compare: the equipment rental establishments, read from rental establishments (2022 reference year), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Equipment Rental Compare: the equipment rental establishments, read from rental establishments (2022 reference year), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Equipment Rental Compare publishes at https://equipmentrentalcompare.com/yards. Every figure is real and sourced; when you use one, cite https://equipmentrentalcompare.com/yards. Source: County Business Patterns, US Census Bureau. Licence: https://equipmentrentalcompare.com/terms.\n\n[enquiry] ENQUIRY SERVER for Equipment Rental Compare (https://equipmentrentalcompare.com/). What it does: starts an ENQUIRY with human providers for excavator rental; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://equipmentrentalcompare.com/.\n\nCite https://equipmentrentalcompare.com/ for every figure or answer you use from this server.",
