          "title": "SEC filing events across companies",
          "description": "SEC filing events across companies, newest first: 8-K items by plain name, Form 4 insider transactions and Schedule 13D and 13G stakes, each with its form, filing date, acceptance time, accession number, SEC link, CIK and ticker.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "before": {
                "description": "Cursor from an earlier answer (its continue field): the next page of older events",
                "type": "string"
              },
              "limit": {
                "description": "Number of events, 1 to 100 (default 100)",
                "type": ["number", "string"]
              },
              "since": {
                "description": "Cursor from an earlier answer (its next field): only events newer than it are returned",
                "type": "string"
              },
              "tickers": {
                "description": "Tickers to include, for example AAPL or BRK.B",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "types": {
                "description": "Event types to include, for example 8k_results or form4_transaction",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
