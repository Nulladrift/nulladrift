        {
          "name": "gilbert_events",
          "title": "Things to do in Gilbert: events",
          "description": "Use for \"things to do in Gilbert this weekend\", \"events in Gilbert today\", \"free events in Gilbert\", or events on given dates. Returns events in Gilbert, AZ from the Town of Gilbert calendar and Eventbrite with date, time, venue, free flag and a link. Without dates it returns the next 7 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "free_only": {
                "type": "boolean"
              },
              "from": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "limit": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Word to match, e.g. \"halloween\", \"market\", \"kids\".",
                "type": "string"
              },
              "to": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "when": {
                "enum": ["today", "this_weekend", "next_7_days"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "from": {
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "address": {
                      "type": ["string", "null"]
                    },
                    "end": {
                      "type": "string"
                    },
                    "free": {
                      "type": ["boolean", "null"]
                    },
                    "link": {
                      "type": "string"
                    },
                    "source": {
                      "type": ["string", "null"]
                    },
                    "start": {
                      "type": "string"
                    },
                    "time": {
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "venue": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["link", "start", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["from", "items", "link", "to", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
