        {
          "name": "gilbert_openings",
          "title": "New restaurants and shops coming to Gilbert",
          "description": "Use for \"what is opening in Gilbert\", \"new restaurants in Gilbert AZ\", \"is <name> coming to Gilbert\", \"what is opening near SanTan Village / Agritopia / Downtown\". Returns places from the Town of Gilbert liquor-license list and county permits with what the record says (filed, confirmed or already open), area, address, council vote date and the source link. Never states an opening date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name, area or kind, e.g. \"sushi\", \"SanTan Village\", \"brewery\".",
                "type": "string"
              },
              "status": {
                "description": "Default coming_soon (filed or confirmed, not open yet).",
                "enum": ["coming_soon", "confirmed", "already_open", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "address": {
                      "type": ["string", "null"]
                    },
                    "area": {
                      "type": ["string", "null"]
                    },
                    "council_vote": {
                      "type": ["string", "null"]
                    },
