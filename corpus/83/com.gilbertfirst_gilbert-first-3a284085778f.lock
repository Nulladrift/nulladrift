        {
          "name": "gilbert_council_watch",
          "title": "Gilbert Town Council: upcoming items",
          "description": "Use for \"what is on the Gilbert council agenda\", \"when does the council vote on <name>'s liquor license\", rezonings and development items. Returns upcoming Town Council meetings, the liquor, zoning and development items on published agendas, and liquor licenses waiting for a vote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How far ahead (default 30).",
