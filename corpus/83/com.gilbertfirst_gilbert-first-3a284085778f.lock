          },
          "digest": "sha256:63b0e99de22814ce4c5b5ac42ab2996ab266995d1980504d0dc8702f1271907f"
        },
        {
          "name": "gilbert_business_lookup",
          "title": "Look up a Gilbert business",
          "description": "Use for one named business in Gilbert, AZ: address, phone, website, Google rating with review count and as-of date, its directory page, and whether it is on the openings tracker. Returns not_found when the business is not in the directory.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional, e.g. \"coffee\", \"dentist\".",
                "type": "string"
              },
              "name": {
