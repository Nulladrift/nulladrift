                    },
                    "link": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "phone": {
                      "type": ["string", "null"]
                    },
                    "rank": {
                      "type": "integer"
                    },
                    "rating_as_of": {
                      "type": ["string", "null"]
                    },
                    "website": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["link", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "link": {
                "type": "string"
              },
              "min_reviews": {
                "type": "integer"
              },
              "not_found": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "ratings_as_of": {
                "type": ["string", "null"]
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["items", "link"],
            "type": "object"
          },
          "annotations": {
