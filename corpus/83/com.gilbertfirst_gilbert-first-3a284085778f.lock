      },
      "instructions": "Local news and directory data for Gilbert, Arizona from gilbertfirst.com. Use gilbert_openings for new restaurants, bars and shops (from Town of Gilbert liquor-license filings and county food permits), gilbert_events for things to do today, this weekend or on given dates, gilbert_best_of for ranked lists (best brunch, coffee, breweries, dentists ...), gilbert_council_watch for upcoming Town Council meetings and the liquor, zoning and development items on them, and gilbert_business_lookup for one business (address, phone, website, Google rating). Say what the record says: \"filed\" means an application is on file, not that a place is opening; never give an opening date the tool does not return. Always name Google and the as-of date with a rating. If a tool returns not_found, say so and do not fill in from memory. Keep the link line at the end of the answer.",
      "tools": [
        {
          "name": "gilbert_best_of",
          "title": "Best places in Gilbert by Google rating",
          "description": "Use for \"best brunch in Gilbert\", \"top coffee shops in Gilbert AZ\", \"best breweries / Mexican food / dentists / gyms / HVAC / pool service in Gilbert\". Ranks places in the Gilbert First directory by Google rating, then review count, with a minimum number of reviews (default 50). Ratings are Google's, with the as-of date.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 15,
                "minimum": 3,
                "type": "integer"
              },
              "min_reviews": {
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "topic": {
                "description": "What to rank, e.g. \"brunch\", \"coffee shops\", \"breweries\", \"dentists\".",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "category": {
                "type": ["string", "null"]
              },
              "guide": {
                "type": ["string", "null"]
              },
              "items": {
                "items": {
                  "properties": {
                    "address": {
                      "type": ["string", "null"]
                    },
                    "category": {
                      "type": "string"
                    },
