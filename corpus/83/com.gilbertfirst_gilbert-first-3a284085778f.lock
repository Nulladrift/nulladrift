                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["agenda_published", "date"],
                  "type": "object"
                },
                "type": "array"
              },
              "note": {
                "type": "string"
              }
            },
            "required": ["link", "meetings"],
            "type": "object"
