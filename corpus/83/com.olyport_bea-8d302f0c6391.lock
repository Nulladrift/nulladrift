          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Year"
