        {
          "name": "get_county_employment",
          "description": "Get total full-time and part-time employment by county from BEA (CAEMP25N table).\n\n    Returns employment counts for a county or state total. When year is omitted,\n    returns the last 5 available years.\n\n    GeoFips format: 5-digit county FIPS (e.g. '53067') or state total (e.g. '53000').\n\n    Args:\n        county_fips: 5-digit county FIPS code (e.g. '53067') or state total (e.g. '53000').\n        year: Specific year to retrieve. Omit for last 5 years.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "year": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Year"
              }
            },
            "required": ["county_fips"],
            "title": "get_county_employmentArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_county_employmentOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e69f8972ed5360188e598c09ec311c010d7a9ca4da8bc9d3eac861b341cf9602"
        },
