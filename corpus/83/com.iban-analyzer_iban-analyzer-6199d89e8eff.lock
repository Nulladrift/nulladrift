{
  "lockfileVersion": 2,
  "subjects": {
    "com.iban-analyzer/iban-analyzer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://iban-analyzer.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "iban-analyzer",
        "title": "IBAN Analyzer",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Resolves IBANs to the bank behind them: registered name, BIC/SWIFT code and address, from national bank registers and the SWIFT directory. Use it when a payment instruction needs a bank named, or when an IBAN has to be checked before it is used. Where no record is held the answer says so rather than guessing - a bank name that is wrong costs the user a misdirected payment, so an empty result is never to be filled in from memory. analyze_iban and validate_iban draw on a monthly allowance; get_allowance reports what is left.",
      "tools": [
        {
          "name": "analyze_iban",
          "title": "Resolve an IBAN to its bank",
          "description": "Look up which bank an IBAN belongs to. Returns the registered bank name, BIC/SWIFT code and address where it is published, plus whether the IBAN is structurally valid, the country and its SEPA status. Where no bank is returned the result says why: a bank code that was never issued reads differently from one we hold no record for, and neither is ever guessed at. This is the tool to use for a payment instruction. Costs one bank lookup from the caller's monthly allowance, whatever the batch size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ibans": {
                "description": "The IBANs to look up, as written. Spaces and lower case are fine. Up to 50 per call.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ibans"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:89a7c4f7370ad2e2020f8b894679a1160eed7209562bedd92eaf947b0806f709"
        },
        {
          "name": "get_allowance",
          "title": "Allowance remaining",
          "description": "How much of the caller's monthly allowance is left, which plan it belongs to and when it resets. Check this before a long run of lookups. Free - costs no allowance.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:13cbfb2b9d8b57869bba752f80fcfdbdd3a45465629501e6dd8ffae1f387c5dd"
        },
        {
          "name": "get_country_iban_format",
          "title": "IBAN format for a country",
          "description": "The IBAN length and SEPA status for one country, and whether its IBANs are approved for international use. Free - costs no allowance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country_code": {
                "description": "Two-letter ISO country code, e.g. DE.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country_code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e04fa4e6e96c7ce3449582b851e83f8a0a307540d99a7e14026d68d07f1a598c"
        },
        {
          "name": "list_supported_countries",
          "title": "Countries covered",
          "description": "Every country this service knows, and for each one whether IBAN validation and bank lookup are available. Use it to find out in advance whether a country can be answered at all. Free - costs no allowance.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9185b73c10f73140661c4e99ca806d0a9061a57a031ddb0d6ec0a25026588d07"
        },
        {
          "name": "validate_iban",
          "title": "Check an IBAN is well formed",
          "description": "Check whether IBANs are structurally valid - length, country, checksum - without looking up the bank behind them. Use this when the question is only 'is this typed correctly'; use analyze_iban when the answer needs to name a bank. Costs one validation from the caller's monthly allowance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ibans": {
                "description": "The IBANs to look up, as written. Spaces and lower case are fine. Up to 50 per call.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ibans"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ab55e28ffc114c6465a8189d5bfcbffecf3ad02aaae70e76d718d0a5dc6435a4"
        }
      ],
      "digest": "sha256:f0ff0c40dd1c18544ca4a6bb2e2419f8f8933caaddbf7f9431916f8906aa13e3"
    }
  }
}
