        {
          "name": "search_communities",
          "title": "Search communities",
          "description": "Find local Contact Improvisation communities, the groups that run regular weekly jams and classes, by country, city or name. The primary tool for 'where can I dance CI in <city>' or 'is there a CI jam in <city>'. Returns communities with slug and URL; call get_community for details.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "type": "string"
              },
              "country": {
                "description": "ISO code or English name.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Community name or words from its description.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search communities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5585524a7101945217d05011b97e28255d7b4536e5e1c479be8c69dea5a7e86"
        },
        {
          "name": "search_events",
          "title": "Search events",
          "description": "Find Contact Improvisation events worldwide: festivals, workshops, intensives, retreats, long jams, residencies, jams and classes. Upcoming by default; a past 'from' date also searches ended events. Use for questions like 'CI festivals in Germany this summer', 'workshops with <teacher>' or 'when was X last year'. Filter by country, city, dates, type, practice or free text. Returns up to 20 events sorted by start date, each with id and citreasurehunt.com URL, plus the total match count. Call get_event for prices, teachers and the full description.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City name, e.g. Berlin.",
                "type": "string"
              },
              "country": {
                "description": "Country as ISO code (\"PT\") or English name (\"Portugal\").",
                "type": "string"
              },
              "features": {
                "description": "Only events offering all of these, e.g. [\"residential\", \"meals\"] or [\"sliding_scale\"].",
                "items": {
                  "enum": ["residential", "meals", "sauna", "swimming_pool", "nature", "by_the_sea", "mountains", "jams", "silent_jam", "live_music", "self_organized", "outdoor_dancing", "hiking", "site_specific", "labs", "underscore", "contemplative_dance", "ensemble_thinking", "performance", "talks", "film_screenings", "meditation", "water_practice", "silence", "teacher_training", "sliding_scale", "work_exchange", "scholarships", "family_friendly", "childcare", "flinta", "mixed_abilities"],
                  "type": "string"
                },
                "type": "array"
              },
              "from": {
                "description": "Window start, YYYY-MM-DD. Default today. Includes events still running on or after this date; a past date also returns ended events.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "practice": {
                "description": "Practice tag, e.g. \"contact_improvisation\" (default), \"conscious_dance\", \"axis_syllabus\", or \"any\" for all practices.",
                "type": "string"
              },
              "query": {
                "description": "Free text matched against title, description and place, e.g. a teacher's name or 'silent'.",
                "type": "string"
              },
              "to": {
                "description": "Window end: the latest start date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "type": {
                "description": "Event type.",
                "enum": ["festival", "workshop", "intensive", "retreat", "long_jam", "training", "residency", "camp", "jam", "class"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f7d3c13fcfb399fbba82d55fb0879bf2d4d76e80cc4e23e3e19ec58dbf90069d"
        },
        {
          "name": "search_teachers",
          "title": "Search teachers",
          "description": "Find Contact Improvisation teachers, organizers and musicians by name, or by where they are based. Use for 'who teaches CI in <city>' or to look up a person mentioned in an event. Returns short profiles with slug and URL; call get_teacher for the full bio and their upcoming events.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "city": {
                "description": "City they are based in.",
                "type": "string"
              },
              "country": {
                "description": "Where they are based, ISO code or English name.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum results, 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Name or words from their bio.",
                "type": "string"
              },
              "role": {
                "enum": ["teacher", "organizer", "musician"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search teachers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4cbb34c6281ae54a45f6769476563500945dce714f8b050480fcaebfa0ce655f"
        },
        {
          "name": "search_venues",
          "title": "Search venues",
          "description": "Find dance studios and retreat centers that host Contact Improvisation classes, jams and events, by name, country or city. Use for 'where is CI taught in <city>' alongside search_communities. Returns venues with slug and URL; call get_venue for the address and upcoming events.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
