          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search venues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7baf6b09d6fa1f9f986c76a81d084d66acdcc94d12452f10a311bd27a59e1c9a"
        }
      ],
