{
  "lockfileVersion": 2,
  "subjects": {
    "com.buyerawareapp/buyeraware": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.buyerawareapp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "buyeraware",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "BuyerAware gives mechanic-grade verdicts on used-car listings. Free tools: tank_alternatives, tank_lookup. analyze_listing costs 1 credit and is async (poll get_verdict). If the user has no key, call create_trial_key.",
      "tools": [
        {
          "name": "analyze_listing",
          "title": "Analyze used-car listing",
          "description": "Start a BuyerAware pre-purchase verdict on ONE used vehicle. Runs a mechanic-grade read: ranked failure points with $ exposure, recalls, seller-claim fact-check, fair price range, adjusted true cost, risk score 1-10, BUY / BUY_WITH_CONDITIONS / WALK_AWAY, a word-for-word negotiation script, and lower-risk 'Tank' alternatives. Supply whichever of listing_url, listing_text or vin you have — at least one is required, and more context sharpens the verdict. Takes ~1-2 minutes: returns a job_id, then poll get_verdict. Costs 1 credit. For 'what should I buy instead' use tank_alternatives, which is free.",
          "inputSchema": {
            "properties": {
              "buyer_context": {
                "description": "what the buyer needs it for, budget, and any specific concerns",
                "type": "string"
              },
              "listing_text": {
                "description": "the listing copy pasted as-is, when there is no shareable URL",
                "type": "string"
              },
              "listing_url": {
                "description": "link to the listing — Marketplace, Craigslist, AutoTrader, a dealer page",
                "type": "string"
              },
              "location": {
                "description": "buyer city/state, for pricing and inspection context",
                "type": "string"
              },
              "vin": {
                "description": "17-character VIN, if the listing shows one",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:84398c73d121eb19838098f812b500460855704589fd28dc21f71e3f0b40dc60"
        },
        {
          "name": "create_trial_key",
          "title": "Create trial API key",
          "description": "Create a BuyerAware API key so this user can run verdicts (3 free). Call this once when no key is configured, then show the user the key and tell them to save it. Do not call it again for someone who already has a key — one trial per email address.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "the user's email address; the key is issued against it, one trial key per address",
                "type": "string"
              },
              "name": {
                "description": "optional display name for the key record",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:040635f0b558192073aa101c882e65d8493119692f304c7010d7b32f34b8a95e"
        },
        {
          "name": "get_verdict",
          "title": "Get verdict result",
          "description": "Fetch the result of an analyze_listing job. If status is 'queued' or 'running', wait ~15 seconds and call again. Free — polling never costs a credit.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "the job_id returned by analyze_listing",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25661a466453ec2c4fddd4741cf8047b3304a0f95c1d72a0bdbed24d0034d58f"
        },
        {
          "name": "tank_alternatives",
          "title": "Find lower-risk alternatives",
          "description": "FREE, no API key needed, answers instantly. Recommend 2-3 lower-risk used vehicles ('Tanks') from BuyerAware's curated 47-platform database that land near a budget. Use when a buyer asks what to buy instead, or what is reliable for $X. Use analyze_listing instead when they have a specific car in mind.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "target purchase price in USD",
                "type": "number"
              },
              "category": {
                "description": "sedan, hatchback, small suv, medium suv, large suv, midsize truck, full-size truck, diesel truck, minivan, wagon, hybrid, phev, ev, luxury",
                "type": "string"
              },
              "limit": {
                "description": "how many to return; default 3",
                "type": "number"
              },
              "max_risk": {
                "description": "risk ceiling 1-10; default 5",
                "type": "number"
              },
              "mileage": {
                "description": "mileage to price at; default 100000",
                "type": "number"
              }
            },
            "required": ["budget"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2410567a2baf5445d71e3a0efe7d26a708596b2e75dc007a27448fbbe21c3da9"
        },
        {
          "name": "tank_lookup",
          "title": "Look up Tank vehicle",
          "description": "FREE, no API key needed, answers instantly. Look up one platform in BuyerAware's curated database: risk score, verdict, the one known trap, private-party value at a mileage, 5-year operating cost. Covers 47 US-market platforms; anything outside it returns no match, which is itself a signal — follow up with analyze_listing.",
          "inputSchema": {
            "properties": {
              "mileage": {
                "description": "mileage to value at; default 100000",
                "type": "number"
              },
              "query": {
                "description": "platform name, e.g. '4Runner', 'Camry V6', 'CR-V', 'Tundra 5.7'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:76d93391d9299738cebe0fce12f558331698fb891b968ad5d380a445d59f9679"
        }
      ],
      "digest": "sha256:3729c678a9fd191534cf986bb5c001bb6b56d501edf40ee8a1b6d7f34adea6c0"
    }
  }
