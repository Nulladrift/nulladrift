        {
          "name": "get_contact_form_link",
          "title": "Contact form link",
          "description": "A link that opens the site's contact form with the reason (topic), the machine number and the message already filled in, in English or Spanish. It only builds the link and sends nothing. There are no separate name, email or phone inputs. Recognizable email addresses and phone numbers in machine or message text are rejected. Message text is included in the URL. The person checks the form, adds their own name and email, and presses Send message.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "machine": "12",
                "message": "Washer 12 took my money and did not start",
                "topic": "machine"
              }
            ],
            "properties": {
              "language": {
                "description": "Which language of the site to quote: \"en\" (default) or \"es\" (the Spanish pages, under /es/).",
                "enum": ["en", "es"],
                "type": "string"
              },
              "machine": {
                "description": "The machine number, if it applies.",
                "maxLength": 20,
                "type": "string"
              },
              "message": {
                "description": "The message, in the person's own words.",
                "maxLength": 1500,
                "type": "string"
              },
              "topic": {
                "description": "The reason, one of the form's own values: general (a question), machine (a broken machine), payment (a payment or refund problem), bulk (commercial or bulk pricing), other.",
                "enum": ["general", "machine", "payment", "bulk", "other"],
                "type": "string"
              }
            },
            "type": "object"
