      "serverInfo": {
        "name": "com.jeromehandywash/site",
        "title": "Jerome Handy Wash",
        "version": "2.3.0",
        "description": "Read-only facts from jeromehandywash.com: machines, prices, payment, hours, amenities, FAQ.",
        "websiteUrl": "https://jeromehandywash.com/connect/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only information published on jeromehandywash.com by Jerome Handywash LLC: Jerome Handy Wash, a self-service laundromat at 921 N Lincoln Ave Suite A, Jerome, ID 83338, open 24 hours, every day, including holidays. The store is unattended. Tool answers contain the site's published text and source page links. The language input selects English or Spanish. Take A Load Off is a separate wash-and-fold partner; answers link to https://takealoadoff.jeromehandywash.com/ without stating its prices, turnaround or phone. Prices, refund information and timeframes are published facts, not custom calculations or promises. No tool knows which machines are free right now. Nothing here reserves a machine, takes a payment or files a report: the machines take payment at the machine. For a machine or payment problem, how_to_report_machine_issue returns the published way to report it: (208) 420-6328, help@jeromehandywash.com, or https://jeromehandywash.com/contact/#machine-issue. get_contact_form_link returns a link that opens the contact form with the reason, machine number and message filled in. The link does not send a message. Sending requires the person to review the form, add their own name and contact details, and press Send. No tool on this site sends a message.",
