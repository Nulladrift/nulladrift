        {
          "name": "send_pages",
          "title": "Send pages",
          "description": "Email several pages to the same people in one invitation email. Each recipient gets one email listing every page, with their own personal link to each; who opened each page shows on that page. Use send_page for a single page. Sends email immediately; sent email cannot be recalled.",
          "inputSchema": {
            "properties": {
              "bundleName": {
                "description": "Title of the email and of this set of pages, e.g. \"Q4 proposal pack\" (up to 120 characters). Defaults to the page names.",
                "type": "string"
              },
              "expiresInDays": {
                "description": "Days the links work (default 7). 0 means they never expire.",
                "type": "integer"
              },
              "message": {
                "description": "Optional note shown above the list of pages.",
                "type": "string"
              },
              "pages": {
                "description": "Published pages to send, in the order the email lists them (1 to 10). Each is {siteId, note}; plain page id strings also work.",
                "items": {
                  "properties": {
                    "note": {
                      "description": "Optional note shown under this page, up to 500 characters.",
                      "type": "string"
                    },
                    "siteId": {
                      "description": "Page id (siteId) returned by a publish tool or list_pages.",
                      "format": "uuid",
                      "type": "string"
                    }
                  },
                  "required": ["siteId"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "recipients": {
                "description": "Email addresses; each person gets their own personal link to every page.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["pages", "recipients"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "bundleId": {
                "description": "Id of this send.",
                "type": "string"
              },
              "expiresAt": {
                "description": "When the links stop working (ms since epoch; year 9999 means never).",
                "type": "number"
              },
              "shares": {
                "description": "One send per page, in the order sent, each with shareId and siteId.",
                "type": "array"
              }
            },
            "type": "object"
          },
