          },
          "digest": "sha256:44a38c196951f2e677854a164e79f63423c55020d83ea228b4cd5d9d81b2fae1"
        },
        {
          "name": "notify_recipients",
          "title": "Notify recipients",
          "description": "Email existing active recipients that a page has been updated, with an optional note. Each recipient receives a fresh personal link. Sends email immediately; sent email cannot be recalled.",
          "inputSchema": {
            "properties": {
              "note": {
                "description": "Optional note about what changed, up to 1,000 characters.",
                "type": "string"
              },
              "siteId": {
                "description": "Page id (siteId) returned by a publish tool or list_pages.",
                "type": "string"
              }
            },
            "required": ["siteId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "notified": {
                "description": "How many people were emailed.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Notify recipients"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["full"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:540480cc56358e96c04c4675b44f637365a8b4cc7781a034c4a6b1e7557733a6"
        },
        {
          "name": "publish_anonymous_page",
          "title": "Publish anonymous page",
          "description": "Publish a public web page without an account or API key. It is deleted 48 hours after publishing unless the user opens the returned claimUrl and signs in. Returns the page URL, the claimUrl and tellUser: always relay tellUser and the claimUrl, and tell the user to keep the page before sending it to anyone. If the user gives an email address, pass it as reminderEmail: the claim link is emailed now and again before deletion.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "Files of the page. The complete resulting page includes index.html at the top level.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "File contents: text, or base64 when encoding is base64.",
                      "type": "string"
                    },
                    "encoding": {
                      "description": "utf8 (default) for text files, base64 for images and other binary files.",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Path inside the page, e.g. index.html or assets/logo.png.",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "reminderEmail": {
                "description": "Optional. The user's email address, only if they give it: we email them the claim link now and before the page is deleted.",
                "type": "string"
              },
              "siteName": {
                "description": "Name shown to the user and recipients, e.g. \"Q3 report\".",
                "type": "string"
              },
              "slug": {
                "description": "Optional address label, 3-40 lowercase letters, digits or hyphens. Random when omitted.",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "claimUrl": {
                "description": "Show to the user: opening it while signed in keeps the page.",
                "type": "string"
              },
              "deletesAt": {
                "description": "When the page is deleted, for people to read (UTC).",
                "type": "string"
              },
              "expiresAt": {
                "description": "When the page is deleted (ms since epoch).",
                "type": "number"
              },
              "fileCount": {
                "description": "Files published.",
                "type": "number"
              },
              "reminderEmailSent": {
                "description": "Present when reminderEmail was given.",
                "type": "boolean"
              },
              "siteId": {
                "description": "Page id.",
                "type": "string"
              },
              "tellUser": {
                "description": "Tell the user this, with the claimUrl: when the page is deleted and how to keep it.",
                "type": "string"
              },
              "url": {
                "description": "Public page address (works for 48 hours).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish anonymous page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:fe6fad59e00cf259c858150ed37f72abd81f60de135510140039400f0ae62d58"
        },
        {
          "name": "publish_document",
          "title": "Publish document",
          "description": "Publish a PDF, Word (.docx), PowerPoint (.pptx), Excel (.xlsx/.xls), or CSV file as a browser-viewable page, private by default. Accepts filename and base64 content, up to 4 MB decoded. Documents become readable PDFs, slides have presentation controls, and spreadsheets have searchable sheet tabs. Preserves the original for download. A siteId replaces the page at the same address. Does not send invitations.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "Base64 file bytes, not a local path or URL.",
                "type": "string"
              },
              "filename": {
                "description": "Original file name with extension, e.g. proposal.docx.",
                "type": "string"
              },
              "siteId": {
                "description": "Replace this existing page at the same address.",
                "type": "string"
              },
              "siteName": {
                "description": "Name shown to the user and recipients, e.g. \"Q3 report\".",
                "type": "string"
              },
              "slug": {
                "description": "Optional address label, 3-40 lowercase letters, digits or hyphens. Random when omitted.",
                "type": "string"
              },
              "visibility": {
                "description": "private (invitation-only, default) or public (anyone with the link).",
                "enum": ["private", "public"],
                "type": "string"
              }
            },
            "required": ["content", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "siteId": {
                "description": "Page id.",
                "type": "string"
              },
              "url": {
                "description": "Page address.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish document"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["full"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:15be83f24ac3b03b567d064fc9a494b7c6ebd0b4acfa7f2b5966e1ede36a3524"
        },
        {
          "name": "publish_page",
          "title": "Publish page",
          "description": "Publish a web page as the connected user. A siteId replaces an existing page at the same address. preserveFiles retains omitted assets and requires the baseDeploymentId of that version; stale edits are refused. Visibility is private (invitation-only, default) or public. Requires an authenticated AttachPage connection.",
          "inputSchema": {
            "properties": {
              "baseDeploymentId": {
                "description": "Expected current version. A changed page is refused rather than overwritten.",
                "type": "string"
              },
              "files": {
                "description": "Files of the page. The complete resulting page includes index.html at the top level.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "File contents: text, or base64 when encoding is base64.",
                      "type": "string"
                    },
                    "encoding": {
                      "description": "utf8 (default) for text files, base64 for images and other binary files.",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Path inside the page, e.g. index.html or assets/logo.png.",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "preserveFiles": {
                "description": "Retain files not included in this edit. Requires siteId and baseDeploymentId.",
                "type": "boolean"
              },
              "siteId": {
                "description": "Replace this existing page at the same address.",
                "type": "string"
              },
              "siteName": {
                "description": "Name shown to the user and recipients, e.g. \"Q3 report\".",
                "type": "string"
              },
              "slug": {
                "description": "Optional address label, 3-40 lowercase letters, digits or hyphens. Random when omitted.",
                "type": "string"
              },
              "visibility": {
                "description": "private (invitation-only, default) or public (anyone with the link).",
                "enum": ["private", "public"],
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "deploymentId": {
                "description": "Id of this version.",
                "type": "string"
              },
              "fileCount": {
                "description": "Files published.",
                "type": "number"
              },
              "siteId": {
                "description": "Page id; pass it to replace the page later.",
                "type": "string"
              },
              "slug": {
                "description": "Address label.",
                "type": "string"
              },
              "url": {
                "description": "Page address.",
                "type": "string"
              },
              "visibility": {
                "description": "private or public.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish page"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["full"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0d1b9dcbd2a22b36b440629dfe4384d0320e8ecf1b950cbf6c8e81e177790104"
        },
        {
          "name": "resolve_feedback",
          "title": "Resolve feedback",
          "description": "Mark recipient feedback as resolved, or reopen it with resolved: false. The recipient sees the updated resolution status.",
          "inputSchema": {
            "properties": {
              "feedbackId": {
                "description": "Feedback id from get_feedback.",
                "type": "string"
              },
              "resolved": {
                "description": "true (default) marks it resolved; false reopens it.",
                "type": "boolean"
              }
            },
            "required": ["feedbackId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ok": {
                "description": "true when saved.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
