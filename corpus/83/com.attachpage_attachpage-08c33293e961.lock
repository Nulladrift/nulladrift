        {
          "name": "send_page",
          "title": "Send page",
          "description": "Email personal invitations for a page to the specified recipient addresses, with an optional message and access expiry. Sends email immediately; sent email cannot be recalled.",
          "inputSchema": {
            "properties": {
              "expiresInDays": {
                "description": "Days the links work (default 7). 0 means they never expire.",
                "type": "integer"
              },
              "message": {
                "description": "Optional note included in the invitation email.",
                "type": "string"
              },
              "recipients": {
                "description": "Email addresses; each person gets their own personal link.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "siteId": {
                "description": "Page id (siteId) returned by a publish tool or list_pages.",
                "type": "string"
              }
            },
            "required": ["recipients", "siteId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "expiresAt": {
                "description": "When the links stop working (ms since epoch; year 9999 means never).",
                "type": "number"
              },
              "shareId": {
                "description": "Id of this send.",
                "type": "string"
              },
              "siteId": {
                "description": "Page id.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send page"
