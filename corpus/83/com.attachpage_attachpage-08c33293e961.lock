        {
          "name": "publish_anonymous_page",
          "title": "Publish anonymous page",
          "description": "Publish a public web page without an account or API key. It is deleted 48 hours after publishing unless the user opens the returned claimUrl and signs in. Returns the page URL, the claimUrl and tellUser: always relay tellUser and the claimUrl, and tell the user to keep the page before sending it to anyone. If the user gives an email address, pass it as reminderEmail: the claim link is emailed now and again before deletion.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "Files of the page. The complete resulting page includes index.html at the top level.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "File contents: text, or base64 when encoding is base64.",
                      "type": "string"
                    },
                    "encoding": {
                      "description": "utf8 (default) for text files, base64 for images and other binary files.",
                      "enum": ["utf8", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Path inside the page, e.g. index.html or assets/logo.png.",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "type": "array"
              },
              "reminderEmail": {
                "description": "Optional. The user's email address, only if they give it: we email them the claim link now and before the page is deleted.",
                "type": "string"
              },
              "siteName": {
                "description": "Name shown to the user and recipients, e.g. \"Q3 report\".",
                "type": "string"
              },
              "slug": {
                "description": "Optional address label, 3-40 lowercase letters, digits or hyphens. Random when omitted.",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "claimUrl": {
                "description": "Show to the user: opening it while signed in keeps the page.",
                "type": "string"
              },
              "deletesAt": {
                "description": "When the page is deleted, for people to read (UTC).",
                "type": "string"
              },
              "expiresAt": {
                "description": "When the page is deleted (ms since epoch).",
                "type": "number"
              },
              "fileCount": {
                "description": "Files published.",
                "type": "number"
              },
              "reminderEmailSent": {
                "description": "Present when reminderEmail was given.",
                "type": "boolean"
              },
              "siteId": {
                "description": "Page id.",
                "type": "string"
              },
              "tellUser": {
                "description": "Tell the user this, with the claimUrl: when the page is deleted and how to keep it.",
                "type": "string"
              },
              "url": {
                "description": "Public page address (works for 48 hours).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish anonymous page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:fe6fad59e00cf259c858150ed37f72abd81f60de135510140039400f0ae62d58"
        },
        {
          "name": "publish_document",
          "title": "Publish document",
          "description": "Publish a PDF, Word (.docx), PowerPoint (.pptx), Excel (.xlsx/.xls), or CSV file as a browser-viewable page, private by default. Accepts filename and base64 content, up to 4 MB decoded. Documents become readable PDFs, slides have presentation controls, and spreadsheets have searchable sheet tabs. Preserves the original for download. A siteId replaces the page at the same address. Does not send invitations.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "Base64 file bytes, not a local path or URL.",
                "type": "string"
              },
              "description": {
                "description": "Optional one-line description shown in the user's pages list. An empty string clears it.",
                "maxLength": 500,
                "type": "string"
              },
              "filename": {
                "description": "Original file name with extension, e.g. proposal.docx.",
                "type": "string"
              },
              "project": {
                "description": "Optional project to file the page under, by name or id from list_projects, e.g. \"Q4 proposal\". A new name starts that project. An empty string takes the page out of its project.",
                "maxLength": 80,
                "type": "string"
              },
              "siteId": {
                "description": "Replace this existing page at the same address.",
                "type": "string"
              },
              "siteName": {
                "description": "Name shown to the user and recipients, e.g. \"Q3 report\".",
                "type": "string"
              },
              "slug": {
                "description": "Optional address label, 3-40 lowercase letters, digits or hyphens. Random when omitted.",
                "type": "string"
              },
              "visibility": {
                "description": "private (invitation-only, default) or public (anyone with the link).",
                "enum": ["private", "public"],
                "type": "string"
              }
            },
            "required": ["content", "filename"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "siteId": {
                "description": "Page id.",
                "type": "string"
              },
              "url": {
                "description": "Page address.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish document"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["full"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:cec14a460cf9cd9b930fbe647a97a51d800d820a2d3ed4f984efc103ff04ce4a"
        },
        {
          "name": "publish_from_url",
          "title": "Publish from url",
          "description": "Publish a whole site from a link, as the connected user: AttachPage downloads it, so the files never pass through the conversation. Use this instead of publish_page when the site is already online as a .zip, .tar.gz or .html file, or in a public GitHub repository (github.com/owner/repo, or a /tree/branch/folder link). The download must be public https, up to 50 MB of site, 20 MB per file and 2,000 files; it is checked like an upload. A siteId replaces an existing page at the same address. Visibility is private (invitation-only, default) or public. Does not send invitations.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Optional one-line description shown in the user's pages list. An empty string clears it.",
                "maxLength": 500,
                "type": "string"
              },
              "folder": {
                "description": "Folder inside the download to publish, e.g. dist or site. Default: the top level, or the usual site folder (dist, build, public…) holding index.html.",
                "type": "string"
              },
              "project": {
                "description": "Optional project to file the page under, by name or id from list_projects, e.g. \"Q4 proposal\". A new name starts that project. An empty string takes the page out of its project.",
                "maxLength": 80,
                "type": "string"
              },
              "siteId": {
                "description": "Replace this existing page at the same address.",
                "type": "string"
              },
              "siteName": {
                "description": "Name shown to the user and recipients, e.g. \"Q3 report\".",
                "type": "string"
              },
              "slug": {
                "description": "Optional address label, 3-40 lowercase letters, digits or hyphens. Random when omitted.",
                "type": "string"
              },
              "url": {
                "description": "Public https link to a .zip, .tar.gz or .html file, or a GitHub repository or folder (github.com/owner/repo/tree/main/site).",
                "type": "string"
              },
              "visibility": {
                "description": "private (invitation-only, default) or public (anyone with the link).",
                "enum": ["private", "public"],
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "deploymentId": {
                "description": "Id of this version.",
                "type": "string"
              },
              "fileCount": {
                "description": "Files published.",
                "type": "number"
              },
              "folder": {
                "description": "Folder of the download that was published, when not the top level.",
                "type": "string"
              },
              "importedFrom": {
                "description": "Where the files were downloaded from.",
                "type": "string"
              },
              "siteId": {
                "description": "Page id; pass it to replace the page later.",
                "type": "string"
              },
              "slug": {
                "description": "Address label.",
                "type": "string"
              },
              "url": {
                "description": "Page address.",
                "type": "string"
              },
              "visibility": {
                "description": "private or public.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Publish from url"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["full"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:610daf90df3e9961eb3e5c72304e3b57918ad0dbe1e88dbe2a322c0d2ec03060"
        },
        {
          "name": "publish_page",
          "title": "Publish page",
          "description": "Publish a web page as the connected user. A siteId replaces an existing page at the same address. preserveFiles retains omitted assets and requires the baseDeploymentId of that version; stale edits are refused. Visibility is private (invitation-only, default) or public. Requires an authenticated AttachPage connection.",
