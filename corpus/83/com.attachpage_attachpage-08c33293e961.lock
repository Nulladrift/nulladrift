{
  "lockfileVersion": 2,
  "subjects": {
    "com.attachpage/attachpage": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://attachpage.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "AttachPage",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Publish web pages and documents and send them to people. Use publish_document for PDF, Word, PowerPoint, Excel, or CSV files (base64, up to 4 MB); no invitations are sent by publishing. Connect with the client's OAuth sign-in to AttachPage; each user connects their own account. get_profile identifies that account. Without an account, publish_anonymous_page makes a public page that is deleted after 48 hours unless kept; relay its tellUser text and show its claimUrl verbatim. Use publish_page, send_page, list_pages, get_page and update_page with the connected account. Recipients can comment and approve: get_feedback returns their comments; apply changes, publish_page with the same siteId, resolve_feedback, then notify_recipients. Confirm recipients and message before send_page or notify_recipients.",
      "tools": [
        {
          "name": "get_feedback",
          "title": "Get feedback",
          "description": "Read recipient comments, page paths, pointed-at elements (selector and visible text), and approval or change-request decisions. The status filter selects open, resolved, or all feedback.",
          "inputSchema": {
            "properties": {
              "siteId": {
                "description": "Page id (siteId) returned by a publish tool or list_pages.",
                "type": "string"
              },
              "status": {
                "description": "Which feedback to return (default all).",
                "enum": ["open", "resolved", "all"],
                "type": "string"
              }
            },
            "required": ["siteId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "decisions": {
                "description": "Approvals and change requests.",
                "type": "array"
              },
              "items": {
                "description": "Comments with page path and pointed-at element.",
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get feedback"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["full"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:03c60df74f4e783d891db4c4c03990a6b21bfb43438e2f708bf587efc4ec18b3"
        },
        {
          "name": "get_page",
          "title": "Get page",
          "description": "Details for one page: address, visibility, recipients and who opened it. Optional filePaths reads exact uploaded source files from that version, up to 20 files and 256 KB total, with text or base64 encoding. An empty filePaths array returns a bounded manifest without file contents.",
          "inputSchema": {
            "properties": {
              "filePaths": {
                "description": "Source files to read from the current version; [] returns only the file list.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "siteId": {
                "description": "Page id (siteId) returned by a publish tool or list_pages.",
                "type": "string"
              }
            },
            "required": ["siteId"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "deployments": {
                "description": "Recent versions, newest first.",
                "type": "array"
              },
              "id": {
                "description": "Page id (siteId).",
                "type": "string"
              },
              "name": {
                "description": "Page name.",
                "type": "string"
              },
              "shares": {
                "description": "Sends, each with recipients and when they opened the page.",
                "type": "array"
              },
              "url": {
                "description": "Page address.",
                "type": "string"
              },
              "visibility": {
                "description": "private or public.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["full"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d5d18470550d3b42cb119addbbac66c645df0634234d82421adbe76f29f42a8d"
        },
        {
          "name": "get_profile",
          "title": "Get profile",
          "description": "Identify the AttachPage account connected to this agent.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "name": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/profile": true,
            "securitySchemes": [
              {
                "scopes": ["full"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:4f1be5029d7f02380c95aa36ad1772e19aedccaa9061d7ef5b5c04647f9c5e2e"
        },
        {
          "name": "list_pages",
          "title": "List pages",
          "description": "List the user's pages with recipient and open counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "pages": {
                "description": "The user's pages with recipient and open counts.",
