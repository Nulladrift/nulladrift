      "instructions": "Use when the user asks how to create / launch / make a token, how much a launch costs, what Pump.fun or Robinhood Chain launches involve, or which chain to launch on. Ask for name and ticker if missing; default chain to solana and goal to project unless the user says otherwise. Never promise price outcomes or returns.",
