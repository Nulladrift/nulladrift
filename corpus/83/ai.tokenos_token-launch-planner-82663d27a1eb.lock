          "title": "Plan a token launch",
          "description": "Produce a step-by-step launch plan for a token: costs, preparation, launch steps, checklist, pitfalls and a link to the launch documentation.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "solana = Pump.fun (default); robinhood = Robinhood Chain via pons",
                "enum": ["solana", "robinhood"],
                "type": "string"
              },
              "goal": {
                "description": "What the token is for (default project)",
                "enum": ["project", "utility", "community", "meme"],
                "type": "string"
              },
              "has_logo": {
                "description": "True if a logo already exists",
                "type": "boolean"
              },
              "name": {
                "description": "Token name, e.g. Moon Cat",
                "type": "string"
              },
              "socials": {
                "description": "Existing social links (X, Telegram, Discord, website)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "symbol": {
                "description": "Ticker, 2–10 chars, e.g. MCAT",
                "type": "string"
              }
            },
            "required": ["name", "symbol"],
            "type": "object"
          },
