                  "type": "object"
                },
                "type": "array"
              },
              "dryRun": {
                "description": "True when the run made no changes.",
                "type": "boolean"
              },
              "envPath": {
                "description": "Path of the written ~/.env.workbench template.",
                "type": "string"
              },
              "envVars": {
                "description": "Environment variable names listed in the env template.",
                "items": {
                  "type": "string"
                },
                "type": "array"
