        {
          "name": "apply_clone",
          "title": "Apply a Workbench clone",
          "description": "Apply the Workbench profile to a target: clone the repo and install missing components (OpenCode CLI, Node/pnpm, MCP servers, skills, plugins, optional Docker). It OVERWRITES `<home>/.config/opencode/opencode.json`, copies `AGENTS.md`, resets an existing profile repo to `origin/main`, and runs global installs that need write permission (plus SSH for `mode:ssh`) and can take minutes. Writes a names-only `~/.env.workbench` (mode 600); never secret values. Consent-gated and idempotent: without `confirm:true` it returns the plan and changes nothing. Parameter semantics: `components` defaults to required+core; `workspace` defaults to `~/opencode-workbench`; `skipRepo` skips the clone/update; `profileUrl` overrides the git remote; `dryRun` returns the plan. To preview only, use plan_clone.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "components": {
                "description": "Component ids to include; defaults to required+core.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "confirm": {
                "description": "Set true to actually install. When absent, the call returns a plan and makes no changes.",
                "type": "boolean"
              },
              "dryRun": {
                "description": "Report only; make no changes.",
                "type": "boolean"
              },
              "profileUrl": {
                "description": "Override profile git URL.",
                "type": "string"
              },
              "skipRepo": {
                "description": "Do not clone/update the profile repo on the target.",
                "type": "boolean"
              },
              "target": {
                "description": "The machine to operate on: this host (local) or a remote host over SSH (ssh).",
                "properties": {
                  "cwd": {
                    "description": "Working directory on the target.",
                    "type": "string"
                  },
                  "host": {
                    "description": "SSH host (required when mode=ssh).",
                    "type": "string"
                  },
                  "identityFile": {
                    "description": "SSH private key path.",
                    "type": "string"
                  },
                  "mode": {
                    "description": "Run on this machine (local) or a remote host (ssh).",
                    "enum": ["local", "ssh"],
                    "type": "string"
                  },
                  "port": {
                    "description": "SSH port.",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  "user": {
                    "description": "SSH user (defaults to ssh config / current user).",
                    "type": "string"
                  }
                },
                "required": ["mode"],
                "type": "object"
              },
              "workspace": {
                "description": "Target directory for the profile repo.",
                "type": "string"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "configPath": {
                "description": "Path of the written opencode.json.",
                "type": "string"
              },
              "degraded": {
                "description": "Capabilities disabled because required credentials are absent; fill the named env vars to enable them.",
                "items": {
                  "additionalProperties": false,
