        {
          "name": "list_required_credentials",
          "title": "List required credentials",
          "description": "List the credentials the profile references, which the target already provides, and how to acquire each missing one. Value-blind: it reads only whether each env var is set — no values, no network, no writes — via one read-only probe. Parameter semantics: `target` selects the machine (`local` or SSH) and its `home` sets the returned `template` path and the env file the presence check reads; there are no other parameters. Returns `present`/`missing` var-name arrays plus one guidance record per credential (`var`, `purpose`, `url`, `method`, `command`). Use it after plan_clone to see what would degrade; act on one credential with run_auth_flow.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "target": {
                "description": "The machine to operate on: this host (local) or a remote host over SSH (ssh).",
                "properties": {
                  "cwd": {
                    "description": "Working directory on the target.",
                    "type": "string"
                  },
                  "host": {
                    "description": "SSH host (required when mode=ssh).",
                    "type": "string"
                  },
                  "identityFile": {
                    "description": "SSH private key path.",
                    "type": "string"
                  },
                  "mode": {
                    "description": "Run on this machine (local) or a remote host (ssh).",
                    "enum": ["local", "ssh"],
                    "type": "string"
                  },
                  "port": {
                    "description": "SSH port.",
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  "user": {
                    "description": "SSH user (defaults to ssh config / current user).",
                    "type": "string"
                  }
                },
                "required": ["mode"],
                "type": "object"
              }
            },
            "required": ["target"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "credentials": {
                "description": "Every credential the profile references with its acquisition guidance.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "command": {
                      "description": "Exact non-interactive command, when one exists.",
                      "type": "string"
                    },
                    "label": {
                      "description": "Human-readable name.",
                      "type": "string"
                    },
                    "method": {
                      "description": "Recommended acquisition method.",
                      "enum": ["paste", "oauth", "cli", "instruction"],
                      "type": "string"
                    },
                    "optional": {
                      "description": "True when only a subset of tools degrades without it.",
                      "type": "boolean"
                    },
                    "present": {
                      "description": "Whether the target already provides it (value never read).",
                      "type": "boolean"
                    },
                    "purpose": {
                      "description": "What uses it.",
                      "type": "string"
                    },
