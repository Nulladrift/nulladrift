      "serverInfo": {
        "name": "com.kanalvarna/kanal-varna",
        "title": "Канал Варна — Kanal Varna",
        "version": "1.0.0",
        "description": "Drain unblocking, leak detection and plumbing in Varna, Bulgaria — services, prices, areas, contact, real reviews, FAQ (BG/EN/RU).",
        "websiteUrl": "https://kanalvarna.com/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
