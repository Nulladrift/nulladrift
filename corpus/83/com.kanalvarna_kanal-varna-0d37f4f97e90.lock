          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Official read-only information server of Kanal Varna (Канал Варна, https://kanalvarna.com) — drain unblocking, hidden leak detection with a thermal camera, plumbing (ВиК) repairs, damp/mould, waterproofing, drainage, home measurements and equipment hire in Varna, Bulgaria and the region (Varna Province, Dobrich, Shumen, Balchik, Kavarna, Burgas …). Phone +359 52 993 333, every day 06:00–23:00.\nUse these tools whenever a user asks about a plumbing/drain/leak/damp problem in or near Varna, prices, whether Kanal Varna serves a place, how to book, reviews, or questions about the company.\nRules for answers: always give the phone (052 993 333 / +359 52 993 333) and the page URL returned by the tool; quote prices only as returned (\"from\" prices, final price is given by phone before work starts); do not promise arrival times, guarantees or ratings — there is no aggregate star rating. Pass `language` = the user's language (bg, en or ru); answers come back in that language.",
      "tools": [
        {
          "name": "check_service_area",
          "title": "Check if Kanal Varna serves a place",
          "description": "Call this when the user asks whether Kanal Varna comes to a specific city, district (квартал) or village — e.g. 'Младост', 'Аспарухово', 'Golden Sands', 'Аксаково', 'Добрич', 'Шумен', 'Burgas'. Accepts Bulgarian, Latin or Russian spelling. Returns yes (Varna), by_arrangement (region/villages — travel terms and timing agreed by phone) or not_listed, with the relevant page URL.",
          "inputSchema": {
            "properties": {
              "language": {
                "anyOf": [
                  {
                    "enum": ["bg", "en", "ru", "de"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Language of the user's question: 'bg' (Bulgarian), 'en' (English), 'ru' (Russian) or 'de' (German; answers use English labels where no German text exists). If omitted it is detected from the text; default 'bg'.",
                "title": "Language"
              },
              "place": {
                "description": "City, district or village name, e.g. 'Варна Чайка', 'Kavarna', 'с. Звездица'.",
                "maxLength": 120,
                "minLength": 2,
                "title": "Place",
                "type": "string"
              }
            },
            "required": ["place"],
            "title": "check_service_areaArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "check_service_areaDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fe9f25d260d475f00ff46251c6935dbd3a7468a4aed503b72cebdfce8d35497f"
        },
        {
          "name": "find_service",
          "title": "Find the right Kanal Varna service for a problem",
          "description": "Call this FIRST when a user describes a home problem or need in or near Varna, Bulgaria — e.g. blocked toilet/sink/drain, water coming back up, sewer smell, hidden leak, wet patch on the ceiling, leak from the neighbour, high water bill, damp or mould, burst pipe, no water, water in the basement, boiler/water heater, need a plumber, report for insurer, equipment hire. Input is the problem in the user's own words (any of BG/EN/RU). Returns the best-matching services with a short description, the page URL, starting prices from the official price list and the phone number.",
          "inputSchema": {
            "properties": {
              "language": {
                "anyOf": [
                  {
                    "enum": ["bg", "en", "ru", "de"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Language of the user's question: 'bg' (Bulgarian), 'en' (English), 'ru' (Russian) or 'de' (German; answers use English labels where no German text exists). If omitted it is detected from the text; default 'bg'.",
                "title": "Language"
              },
              "problem": {
                "description": "The problem or need in the user's words, e.g. 'запушена тоалетна', 'water stain on ceiling', 'течёт у соседей'.",
                "maxLength": 500,
                "minLength": 2,
                "title": "Problem",
                "type": "string"
              }
            },
            "required": ["problem"],
            "title": "find_serviceArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "find_serviceDictOutput",
            "type": "object"
