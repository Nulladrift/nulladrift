        {
          "name": "create_book",
          "title": "Make a photo book",
          "description": "Use this when the person wants a photo book (Dutch: fotoboek) made from photos they attached, direct image links, or a public iCloud Shared Album link. Designs a draft book from the photos in the supplied order; nothing is ordered or charged. Photos the person attached in this chat go in attachments, which ChatGPT fills in; never pass local file paths. Otherwise provide direct CDN image URLs or uploadIds from POST /api/connector/photos in photos, or a public iCloud Shared Album link as sharedAlbumUrl (https://www.icloud.com/sharedalbum/#TOKEN). A book needs at least 24 pages to be printed, so a handful of photos gives a book that can be viewed but not yet ordered. Returns a preview and a private link to save the book by email. No account setup. Allow up to 180 seconds for imports.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attachments": {
                "description": "Photos the person attached in this chat. ChatGPT supplies the file objects; never invent them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "download_url": {
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "idempotencyKey": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "language": {
                "description": "Two-letter code of the language the person writes in, such as nl or en.",
                "maxLength": 35,
                "type": "string"
              },
              "photos": {
                "description": "Public https image URLs on a known CDN, or uploadIds. Not for chat attachments or local paths.",
                "items": {
                  "properties": {
                    "filename": {
                      "default": "photo.jpg",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "uploadId": {
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "maxLength": 4096,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "productId": {
                "maxLength": 100,
                "type": "string"
              },
              "sharedAlbumUrl": {
                "description": "Public iCloud Shared Album link, used instead of photos.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "title": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["idempotencyKey", "title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "album": {
                "additionalProperties": {},
                "properties": {
                  "imported": {
                    "type": "number"
                  },
                  "name": {
                    "type": "string"
                  },
                  "photos": {
                    "type": "number"
                  }
                },
                "required": ["imported", "name", "photos"],
                "type": "object"
              },
              "bookId": {
                "type": "string"
              },
              "bookToken": {
                "description": "Private token for get_book. Keep it private.",
                "type": "string"
              },
              "claimUrl": {
                "description": "Private link where the person saves the book with their email, then edits and orders it.",
                "type": "string"
              },
              "editUrl": {
                "type": "string"
              },
              "language": {
                "description": "The chat's language, as passed in.",
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "operationId": {
                "type": "string"
              },
              "orderable": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Whether the book can be printed as it is."
              },
              "photoCount": {
                "type": "number"
              },
              "previewUrl": {
                "type": "string"
              },
              "status": {
                "description": "\"ready\", or \"processing_or_interrupted\" while the same request is still running.",
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "unavailableReason": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Why it cannot be printed yet, such as too few pages."
              }
            },
            "type": "object"
          },
