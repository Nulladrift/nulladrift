        {
          "name": "get_book",
          "title": "Show a photo book and its price",
          "description": "Use this to show a book that was already made, or to get its price for one copy including shipping when country is supplied. Needs the book's private bookToken. Photos, cover, title, layout and materials are changed in the foto foto editor.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bookId": {
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-zA-Z0-9_-]+$",
                "type": "string"
              },
              "bookToken": {
                "pattern": "^[a-f0-9]{64}$",
                "type": "string"
              },
              "country": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "description": "Two-letter code of the language the person writes in, such as nl or en.",
                "maxLength": 35,
                "type": "string"
              }
            },
            "required": ["bookId", "bookToken"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "bookId": {
                "type": "string"
              },
              "claimUrl": {
                "description": "Private link where the person saves the book with their email, then edits and orders it.",
                "type": "string"
              },
              "claimed": {
                "type": "boolean"
              },
              "editUrl": {
                "type": "string"
              },
              "language": {
                "description": "The chat's language, as passed in.",
                "type": "string"
              },
              "materials": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
