      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "add_to_cart",
          "title": "Add a rental to a cart",
          "description": "Add one rental to a real Sky High cart for a party date, delivery ZIP and hours, and get back a cart_id. Call build_quote first if the customer has not seen the price. To add more items to the SAME party, call again with the cart_id from the first call (one cart, one delivery fee). Safe to repeat: an item already in the cart is not added twice. Added is NOT reserved: nothing is held until the customer pays at checkout. Next step: prepare_checkout with the cart_id.",
          "inputSchema": {
            "properties": {
              "cart_id": {
                "description": "The cart_id from an earlier add_to_cart, to add to the same cart. Leave out to start a new cart.",
                "type": "string"
              },
              "date": {
                "description": "Party date, YYYY-MM-DD",
                "type": "string"
              },
              "end_time": {
                "description": "Party end, e.g. 18:00 or 6pm (default 4 hours after the start). The price depends on the length.",
                "type": "string"
              },
              "operating_mode": {
                "description": "For a slide or combo that can run wet or dry: how the customer wants it. Ask them. Some units charge for wet use (a misting hose); the tool reports the charge.",
                "enum": ["wet", "dry"],
                "type": "string"
              },
              "overnight": {
                "description": "true = keep it overnight, picked up after 8 AM the next morning",
                "type": "boolean"
              },
              "product": {
                "description": "Product name, e.g. 'Turtle Beach water slide', when there is no product_id.",
                "type": "string"
              },
              "product_id": {
                "description": "The product_id from build_quote or product_info. Preferred: it books exactly that product.",
                "type": "string"
              },
              "quantity": {
                "description": "How many, default 1. A package whose name already lists its counts is quantity 1.",
                "type": "number"
              },
              "start_time": {
                "description": "Party start, e.g. 14:00 or 2pm (default 12:00)",
                "type": "string"
              },
              "zip": {
                "description": "5-digit delivery ZIP (selects Houston, Austin or Dallas)",
                "type": "string"
              }
            },
            "required": ["date", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a rental to a cart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8978473d0e015d2eb1f013d5ea298dd234ec1703f233d15d0b1ea018d58402eb"
        },
        {
          "name": "build_quote",
          "title": "Quote a rental for a date and ZIP",
          "description": "Build a complete, real quote for one rental on a specific date and delivery zip: exact dated item price, availability, delivery fee, that date's minimum order, the total, and the booking link. Use this the moment you know the product, the date and the zip - it is the fastest way to answer 'how much?' properly. If you are missing the date or zip, ask the customer for it (never guess a zip from their IP or city) and then call this.",
          "inputSchema": {
            "properties": {
              "coupon": {
                "description": "Optional: CHAT10 once you have offered it, or a code the customer typed. Returns with_coupon, the exact discounted total, so you never do discount math yourself.",
                "type": "string"
              },
              "end_time": {
                "description": "When the party ends, in their words (\"1pm\"). For an attended rental, when it should stop running - not the pickup time.",
                "type": "string"
              },
              "event_date": {
                "description": "Event date YYYY-MM-DD",
                "type": "string"
              },
              "items": {
                "description": "Two or more items for the SAME party: pass them all here (product_name = the first one) to get ONE order total with one delivery fee. Never add up separate quotes.",
                "items": {
                  "properties": {
                    "product_name": {
                      "type": "string"
                    },
                    "qty": {
                      "type": "number"
                    }
                  },
                  "required": ["product_name"],
                  "type": "object"
                },
                "type": "array"
              },
              "product_name": {
                "description": "Product name or close description",
                "type": "string"
              },
              "quantity": {
                "description": "How many of this item, default 1",
                "type": "number"
              },
              "start_time": {
                "description": "When the party starts, in their words (\"10am\", \"2:30pm\"). For a rental with an attendant (mechanical bull etc.), when it should start running. Pass start_time AND end_time whenever they have said them: the price depends on party length.",
                "type": "string"
              },
              "zip": {
                "description": "5-digit delivery zip the customer gave you",
                "type": "string"
              }
            },
            "required": ["event_date", "product_name", "zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote a rental for a date and ZIP"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfde5644510e8f7f53a4db51c6e5d4544e4dc71aa99d32477e5b44ff91ce64ec"
        },
        {
          "name": "delivery_fee",
          "title": "Delivery fee and minimum for a ZIP",
          "description": "Look up the delivery fee and minimum order for a Texas delivery zip code. Use when a customer asks what delivery costs or what the minimum order is for their area. ALWAYS pass event_date when the customer has mentioned their party date - minimum orders vary by date and the dated answer is exact. Without a date the answer is the general rule.",
          "inputSchema": {
            "properties": {
              "event_date": {
                "description": "Event date YYYY-MM-DD, when the customer has mentioned it. Always include if known.",
                "type": "string"
              },
              "zip": {
                "description": "5-digit delivery zip code",
                "type": "string"
              }
            },
            "required": ["zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Delivery fee and minimum for a ZIP"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e99ce22814fc0344c241b3fe4f0fbed75a0793d76aa7502d50a2acb1105e8841"
        },
        {
          "name": "prepare_checkout",
          "title": "Prepare checkout link",
          "description": "Get a cart ready for checkout. Re-checks that everything is still available for the date and that the cart meets that date's minimum, then returns the items, the price breakdown (delivery, fees, tax, total, deposit due today), what the customer still has to enter, and handoff_url: a private link that opens this exact cart at checkout on any phone or computer. This tool never pays or places the order: the customer pays on that page, or, once they have authorized it, you complete checkout there for them. Give handoff_url to the customer only.",
          "inputSchema": {
            "properties": {
              "cart_id": {
                "description": "The cart_id from add_to_cart",
                "type": "string"
              }
            },
            "required": ["cart_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Prepare checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f1501a4b624f2881af979d53ff923a9e9d4edfe4b5e759568bc3164ae6d26abc"
        },
        {
          "name": "product_info",
          "title": "Look up a rental",
          "description": "Look up a Sky High rental product by name. Returns the page URL, units in stock, how many times families have booked it, and price. ALWAYS pass event_date (and zip when you know it) - with a date this returns the EXACT price for that date and whether it is available, which you should quote directly. Prices returned here are LIVE - prefer them over any knowledge-file price, and never send the customer to the product page to find a price this tool can give you.",
          "inputSchema": {
            "properties": {
              "event_date": {
                "description": "Event date YYYY-MM-DD. Always pass it when the customer has said their date - it returns the exact price for that day.",
                "type": "string"
              },
              "product_name": {
                "description": "Product name or close description, e.g. 'Niagara water slide'",
                "type": "string"
              },
              "zip": {
                "description": "5-digit delivery zip, when known. Selects the right metro's pricing.",
                "type": "string"
              }
            },
            "required": ["product_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a rental"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8439d2842a6e7d3a776b707aee575a8ca9c63d3a954e029fbb66da2f5a78f8c4"
        }
      ],
      "digest": "sha256:d766c05ccce56aa9511f6a23de5fd59fa9d59f3b6d7995cd100103cc88ca137b"
    }
  }
