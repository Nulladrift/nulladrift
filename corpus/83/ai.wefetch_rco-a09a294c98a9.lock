      "serverInfo": {
        "name": "rco-wefetch",
        "version": "0.1.8"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The receipt door. Every receipt wefetch issues lives here, and anyone can verify one. A receipt is the evidence that a product match was verified: the barcode, the country whose profile applied, the core and profile versions, when, the hashes of the record and the match, the result and its four readings, chained and signed. Verify, list and read statements in public; writing needs the issuer credential. A receipt is never revoked; a later one supersedes it.",
      "tools": [
        {
          "name": "get_statement",
          "title": "Get Statement",
          "description": "The signed statement for a month (YYYY-MM): receipts issued, by result, by country and by key id, the receipts that supersede earlier ones, and the chain tip.",
          "inputSchema": {
            "properties": {
              "month": {
                "default": "",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:f26817ecca8df6ca9bd233e736748d7bb6ebfc5d2466a0c82fb1e18f15c8d193"
        },
        {
          "name": "list_receipts",
          "title": "List Receipts",
          "description": "List receipts, newest first, by barcode (subject), country (market) or date (since, YYYY-MM-DD); up to 500.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "type": "integer"
              },
              "market": {
                "default": "",
                "type": "string"
              },
              "since": {
                "default": "",
                "type": "string"
              },
              "subject": {
                "default": "",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:baa302dee2c622dd36f3996ae732dd98a0fba9caf1bd958464958484cc40bd9d"
        },
        {
          "name": "verify_receipt",
          "title": "Verify Receipt",
          "description": "Verify one receipt by id (pm_…), in public: the receipt, its hash, id, signature and chain link checked, the receipts that supersede it, and the public key it was signed under.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:38e40efd18062b0d131f4db34394c051e19fdc599380f4d666fe063b6435eda9"
        },
        {
          "name": "write_receipt",
          "title": "Write Receipt",
          "description": "Issue one receipt (issuer credential required, as the credential argument or a Bearer header). subject = the barcode; market; core_version; profile_version; answer_hash; match_hash; result = verified · listed · stale · unknown with the four readings (source_authority, disagreement, freshness, authorisation); supersedes = an earlier receipt id, when this one replaces it. Never revokes.",
          "inputSchema": {
            "properties": {
              "answer_hash": {
                "type": "string"
              },
              "authorisation": {
                "type": "string"
              },
              "core_version": {
                "type": "string"
              },
              "credential": {
                "default": "",
                "type": "string"
              },
              "disagreement": {
                "type": "string"
              },
              "freshness": {
                "type": "string"
              },
              "market": {
                "type": "string"
              },
              "match_hash": {
                "type": "string"
              },
              "profile_version": {
                "type": "string"
              },
              "result": {
                "type": "string"
              },
              "source_authority": {
                "type": "string"
              },
              "subject": {
                "type": "string"
              },
              "supersedes": {
                "default": "",
                "type": "string"
              },
              "verified_at": {
                "default": "",
                "type": "string"
              }
            },
            "required": ["answer_hash", "authorisation", "core_version", "disagreement", "freshness", "market", "match_hash", "profile_version", "result", "source_authority", "subject"],
            "type": "object"
          },
