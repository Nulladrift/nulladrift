        {
          "name": "find_accepted_labs",
          "title": "Find CPSC-accepted labs",
          "description": "Shortlist testing labs that CPSC currently accepts for every test a product needs, in one country (default Vietnam and China). Pass ruleIds from find_cert_rules (testedRuleIds), and country if the user names one. For a toy, f963Sections narrows the ASTM F963 sections; metalParts adds the lead in metal test. Returns each lab's name, city, accreditation body and its CPSC detail page. Reads the live CPSC lab list. It does not book a lab or quote prices.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "country": "Viet Nam",
                "limit": 5,
                "ruleIds": ["lead-paint"]
              }
            ],
            "properties": {
              "country": {
                "description": "Country where the goods are made or tested, such as Vietnam or China (default: both)",
                "maxLength": 60,
                "type": "string"
              },
              "f963Sections": {
                "description": "Only these ASTM F963 sections for a toy, such as [\"4.3.5.1(2)\", \"4.3.5.2\", \"4.6\"] (default: all common toy sections)",
                "items": {
                  "maxLength": 12,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "limit": {
                "description": "Most labs per country (default 8)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "metalParts": {
                "description": "True when the product has metal parts, so the lab must also test lead in metal",
                "type": "boolean"
              },
              "ruleIds": {
                "description": "Rule ids from find_cert_rules (testedRuleIds), such as [\"lead-content\", \"lead-paint\", \"small-parts\"]",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["ruleIds"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "countries": {
                "items": {
                  "properties": {
                    "country": {
                      "type": "string"
                    },
                    "labs": {
                      "items": {
                        "properties": {
                          "body": {
                            "type": "string"
                          },
                          "detailUrl": {
                            "type": "string"
                          },
                          "labId": {
                            "type": "string"
                          },
                          "location": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          }
                        },
                        "required": ["body", "detailUrl", "labId", "location", "name"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "matches": {
                      "type": "integer"
                    },
                    "message": {
                      "type": "string"
                    },
                    "moreAvailable": {
                      "type": "boolean"
                    },
                    "status": {
                      "enum": ["ok", "unavailable", "unknown_country"],
                      "type": "string"
                    }
                  },
                  "required": ["country", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "howToConfirm": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "methodsNotListed": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "unavailable", "no_tested_rules"],
                "type": "string"
              },
              "testMethods": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "unknownRuleIds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["as_of", "notice", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Find CPSC-accepted labs",
            "openai/toolInvocation/invoking": "Find CPSC-accepted labs..."
