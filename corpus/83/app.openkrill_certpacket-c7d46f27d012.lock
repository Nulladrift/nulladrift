        {
          "name": "find_cert_rules",
          "title": "Find the safety rules and certificate",
          "description": "Find which US product-safety rules a product must meet and which certificate the importer files: CPC (Children's Product Certificate, for products made for children 12 and under), GCC (General Certificate of Conformity), or status not_covered with the official CPSC guidance link. Pass product as plain words, or describe what a photo shows. Add age and features (paint, small parts, batteries, magnets, metal parts) when known. Returns each rule with its 16 CFR citation, whether a CPSC-accepted lab must test it, and the eFiling citation code. Use testedRuleIds with find_accepted_labs. It does not decide that a product is legal to sell.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "product": "mini crib"
              }
            ],
            "properties": {
              "age": {
                "description": "The age the product is for, such as \"6 to 18 months\", \"3+\" or \"adult\"",
                "maxLength": 40,
                "type": "string"
              },
              "features": {
                "description": "Features that add rules, when the user said or the photo shows them",
                "items": {
                  "enum": ["paint or coating", "small parts", "battery", "button or coin cell", "magnets", "water beads", "plugs into the wall", "metal parts", "vinyl or plastic film"],
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              },
              "product": {
                "description": "What the product is, who it is for and what it is made of, such as \"painted wooden stacking toy for toddlers\" or the visible facts in a product photo",
                "maxLength": 400,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "alternatives": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "category": {
                "type": "object"
              },
              "certificate": {
                "enum": ["CPC", "GCC"],
                "type": "string"
              },
              "certificateMeaning": {
                "type": "string"
              },
              "checkRuleIds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "coveredTypes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "f963Sections": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "guidanceUrl": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "nextStep": {
                "type": "string"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice": {
                "type": "string"
              },
              "product": {
                "type": "string"
              },
              "rules": {
                "items": {
                  "properties": {
                    "citation": {
                      "type": "string"
                    },
                    "efilingCitationCode": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "status": {
                      "enum": ["applies", "check"],
                      "type": "string"
                    },
                    "thirdPartyTest": {
                      "type": "boolean"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "required": ["citation", "id", "status", "thirdPartyTest", "title", "url", "why"],
                  "type": "object"
                },
                "type": "array"
              },
              "rulesAsOf": {
                "type": "string"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "not_covered"],
                "type": "string"
              },
              "testedRuleIds": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["as_of", "notice", "product", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
