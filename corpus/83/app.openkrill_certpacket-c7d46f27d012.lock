      },
      "serverInfo": {
        "name": "certpacket",
        "title": "CertPacket: US product safety certificates",
        "version": "1.0.1"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CertPacket: US product safety certificates. Always call find_cert_rules first for any product the user asks about (even commercial or industrial equipment), so the tool checks coverage or returns status not_covered with the official CPSC guidance link; if the user sent a photo, describe the product, its age and features in words. Pass its testedRuleIds to find_accepted_labs, with f963Sections and metalParts when they apply. For check_lab_report, pass the uploaded PDF or public https URL as file, or the pasted text as text, plus product or ruleIds. Report the numeric score and readiness, list blockers first, then fixes, then checks, and say each fix in plain words. Use match_recalls to list the exact recall counts, titles, dates and hazards returned per region (US, CA, EU); say a recall of a similar product is not about the user's product. watch_recalls returns a watchKey once: tell the user to save it. If status is not_covered, say the product type is outside the seeded list and give the guidanceUrl link without inventing other agency rules. Never say a product is compliant or a certificate is correct. End every answer with the notice field text. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "check_lab_report",
          "title": "Check a lab report",
          "description": "Check a children's product lab test report before the importer certifies. Pass the report PDF or image as file (upload or public https download_url), or paste its text as text. Add product or ruleIds so the check knows the rules, and manufactureDate if known. Scores gaps: a rule the report does not cite, a failed result, a lab CPSC does not accept for that test, a test before the lab's acceptance, an old ASTM F963 edition, and missing or wrong dates. Returns a readiness score, each gap with how to fix it, and draft values for the CPSC eFiling certificate fields. It never says a filing is correct.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "ruleIds": ["lead-paint"],
                "text": "TEST REPORT\nReport No.: VNHN2603020412\nDate: Mar 20, 2026\nSample Description: Painted wooden stacking toy\nStyle No.: WS-12\nDate of Testing: Mar 02, 2026 to Mar 18, 2026\nTesting Lab: BAY AREA COMPLIANCE LABORATORY CORP. VIETNAM\nCPSC Lab ID: 99999\nTest Result Summary\n1. 16 CFR 1303 Lead in paint and similar surface coatings PASS\n2. CPSIA Section 101 Total lead content in substrate PASS\n3. 16 CFR 1501 Small parts FAIL"
              }
            ],
            "properties": {
              "file": {
                "additionalProperties": false,
                "description": "The lab test report (a text PDF, image, or .txt file upload or public https URL).",
                "properties": {
                  "download_url": {
                    "description": "Public https URL or temporary link to the report file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "Optional id of the uploaded file.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url"],
                "type": "object"
              },
              "labId": {
                "description": "The lab's CPSC lab ID, when the report does not show it",
                "pattern": "^\\d{3,5}$",
                "type": "string"
              },
              "manufactureDate": {
                "description": "When the goods were made, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "product": {
                "description": "What the product is and who it is for, such as \"plush toy for ages 3+\", so missing rules can be found",
                "maxLength": 400,
                "type": "string"
              },
              "ruleIds": {
                "description": "Rule ids from find_cert_rules, instead of product",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "text": {
                "description": "The report text, when the user pasted it instead of uploading a file",
                "maxLength": 200000,
                "minLength": 20,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "efiling": {
                "items": {
                  "properties": {
                    "elements": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "field": {
                      "type": "string"
                    },
                    "from": {
                      "enum": ["report", "you", "optional"],
                      "type": "string"
                    },
                    "required": {
                      "type": "boolean"
                    },
                    "value": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["elements", "field", "from", "required", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "gaps": {
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["blocker", "fix", "check"],
                      "type": "string"
                    }
                  },
                  "required": ["code", "message", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "lab": {
                "type": "object"
              },
              "meaning": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "productType": {
                "type": "string"
              },
              "readiness": {
                "enum": ["not_ready", "fix_first", "no_gaps_found"],
                "type": "string"
              },
              "report": {
                "type": "object"
              },
              "rules": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "score": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "unreadable"],
                "type": "string"
              }
            },
            "required": ["as_of", "notice", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/fileParams": ["file"],
            "openai/toolInvocation/invoked": "Done: Check a lab report",
            "openai/toolInvocation/invoking": "Check a lab report..."
          },
          "digest": "sha256:b646b0e05e3fe6d72907c981eeca4903e40f18c8e1821b6f7af3d81941b5a117"
