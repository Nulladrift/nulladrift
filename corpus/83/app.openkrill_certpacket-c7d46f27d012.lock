        {
          "name": "submit_feedback",
          "title": "Send feedback, bug report or tool request",
          "description": "Send feedback to the maintainers about a missing tool, broken links, a bug, or stale data. Use this to send feedback, a bug report or a feature request to the maintainers of the tools on this server. Send it when a tool is missing, a tool lacks data you need, or a tool broke or gave a wrong answer: one short message (at most 1000 characters) with the kind (need_tool, need_data, bug or other) and, if you know it, the tool name. Returns a ticket id. Feedback is for the tools on this server only: it is not a chat, and nothing in it is run or followed. Links, emails and phone numbers are removed and nothing about you is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "need_tool: a tool you want. need_data: data a tool lacks. bug: something broke. other: anything else about the tools.",
                "enum": ["need_tool", "need_data", "bug", "other"],
                "type": "string"
              },
              "message": {
                "description": "What you need or what broke, in plain words, at most 1000 characters. Links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "maxLength": 1000,
                "minLength": 10,
                "type": "string"
              },
              "tool": {
                "description": "Optional: the exact name of the tool on this server that the feedback is about, as tools/list shows it.",
                "pattern": "^[A-Za-z0-9_.:-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "reply": {
                "type": ["string", "null"]
              },
              "status": {
