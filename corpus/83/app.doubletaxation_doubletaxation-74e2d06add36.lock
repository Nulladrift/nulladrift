        {
          "name": "compare_business_forms",
          "title": "Business taxes: compare legal forms and tax systems",
          "description": "Business tax calculator for a resident of one country and one sector (activity): every legal form (sole proprietor, own company) under every available tax system — total tax and contributions, what remains, rate, line items, why a system is unavailable for the sector or amount, conditions, legal norms; requirements for each legal form and the sector's tax features; assumptions and sources. Same calculation and ranking as doubletaxation.app (section \"Business taxes\"); an estimate, not tax advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activity": {
                "description": "Sector: it = IT and consulting for businesses (default); services = other professional services to companies (marketing, design, translation, engineering, bookkeeping); consumer = services to individuals (household services, repairs, beauty, tutoring); trade = trade in goods, retail or wholesale, incl. online shop (no excise goods); production = making and selling own products.",
                "enum": ["it", "services", "consumer", "trade", "production"],
                "type": "string"
              },
              "country": {
                "description": "ISO code of the country of residence.",
                "enum": ["AR", "AT", "BD", "BR", "CA", "CH", "CN", "CZ", "DE", "ES", "FR", "GB", "GE", "HU", "ID", "IN", "IT", "JP", "MX", "MY", "NL", "PK", "PL", "RO", "SE", "SG", "TR", "TW", "UA", "US"],
                "type": "string"
              },
              "currency": {
                "description": "Currency of revenue and expenses: \"EUR\" or the country's own currency code (e.g. \"PLN\"). EUR amounts are converted at the site's rate (fx.per_eur in the result).",
                "type": "string"
              },
              "distribute": {
                "description": "For companies: the whole profit after tax is paid to the owner as dividends (true, default) or stays in the company (false; companies are then not ranked against sole proprietors).",
                "type": "boolean"
              },
              "expenses": {
                "description": "Annual deductible business expenses (not more than revenue), in the same currency.",
                "minimum": 0,
                "type": "number"
              },
              "revenue": {
                "description": "Annual revenue, in the currency given by \"currency\".",
