        {
          "name": "count_days",
          "title": "Count days of stay",
          "description": "Counts days of stay per country from the trips the user provides (country, from, to) under each country's own counting rule (calendar year, tax year, any 12 months, US substantial presence test, continuous stay): days in the counting period, the day threshold for tax residence and its legal source, the date it was reached or how many more days are needed, and Schengen 90/180 days used. The day of arrival and departure counts in both countries. It does not track anyone: it only counts the trips passed in, and they are not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Date to count up to, YYYY-MM-DD. Default: today. Later trips count as planned.",
                "type": "string"
              },
              "trips": {
                "description": "Stays, one item per stay.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "country": {
                      "description": "ISO 3166-1 alpha-2 code, e.g. \"PL\".",
                      "type": "string"
                    },
                    "from": {
                      "description": "Arrival date, YYYY-MM-DD.",
                      "type": "string"
                    },
                    "to": {
                      "description": "Departure date, YYYY-MM-DD. Omit if the person is still there (counted up to as_of).",
                      "type": "string"
                    }
                  },
                  "required": ["country", "from"],
                  "type": "object"
                },
                "type": "array"
              },
              "version": {
                "description": "Language of the texts (version id). Default: en.",
                "enum": ["uk", "en", "pl", "cs", "ro", "hu", "tr", "zh", "in", "ja", "bn", "pk", "de", "at", "fr", "es", "pt", "it", "my", "sg", "tw", "se", "br", "ar", "ge", "mx", "id"],
