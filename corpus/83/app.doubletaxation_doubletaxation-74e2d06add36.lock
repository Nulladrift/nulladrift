        {
          "name": "next_steps",
          "title": "Next steps after the residence conclusion",
          "description": "What to do once the tax residence is known (the same blocks as under the result on doubletaxation.app and in check_residency \"done\"): how to get a certificate of residence, obligations of a resident (returns, deadlines), obligations and options of a non-resident with income from the other state (treaty relief forms, refunds), U.S. citizen obligations, steps when leaving the state, the exit tax, how each state treats the year of the move, and what the conclusion does not cover. Each step has the authority, form, link and legal norm. Texts are in the language of the version.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "citizenship": {
                "description": "Citizenship option value from list_countries.citizenship_options (e.g. \"US\", \"US+OTHER\", \"NONUS\"). Default: the first option. Matters for U.S. citizens (taxed on worldwide income wherever they live).",
                "type": "string"
              },
              "move": {
                "additionalProperties": false,
                "description": "Optional: the person moved this tax year. kind \"depart\" = left the version's home state for the other country; \"arrive\" = moved to the home state from the other country. date YYYY-MM-DD within the tax year.",
                "properties": {
                  "date": {
                    "description": "Date of the move, YYYY-MM-DD.",
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["depart", "arrive"],
                    "type": "string"
                  }
                },
                "required": ["date", "kind"],
                "type": "object"
              },
              "other": {
                "description": "The other country of the pair (ISO code). Optional when residence is a country other than the home state (then it is that country); needed for BOTH, MAP, NONE, UNDETERMINED and for move kind \"arrive\".",
                "enum": ["AR", "AT", "BD", "BR", "CA", "CH", "CN", "CZ", "DE", "ES", "FR", "GB", "GE", "HU", "ID", "IN", "IT", "JP", "MX", "MY", "NL", "PK", "PL", "PT", "RO", "SE", "SG", "TR", "TW", "UA", "US"],
                "type": "string"
              },
              "residence": {
                "description": "State of tax residence: the version's home state or one of its other countries (ISO code), or \"BOTH\", \"MAP\", \"NONE\", \"UNDETERMINED\" (conclusion.residence from check_residency).",
                "type": "string"
              },
              "version": {
                "description": "Version id (home state), see list_versions.",
                "enum": ["uk", "en", "pl", "cs", "ro", "hu", "tr", "zh", "in", "ja", "bn", "pk", "de", "at", "fr", "es", "pt", "it", "my", "sg", "tw", "se", "br", "ar", "ge", "mx", "id"],
                "type": "string"
              },
              "year": {
                "description": "Tax year of the move (current or one of the two previous). Optional; used to check move.date.",
                "type": "integer"
              }
            },
            "required": ["residence", "version"],
            "type": "object"
