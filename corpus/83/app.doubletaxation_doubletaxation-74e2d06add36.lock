        {
          "name": "proc_qualify",
          "title": "Tax disputes: qualify the situation",
          "description": "From structured facts (which ДПС decision, when it was received, whether a complaint was filed) returns the dispute subject, which documents are possible now (complaint and/or lawsuit), the violations to choose from, and the deadlines with their legal basis. Start here for a user's tax dispute.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "act": {
                "description": "property_tax_ppr = tax notice-decision (ППР) on real estate tax (not land); foreign_income_ppr = tax notice-decision (ППР) on personal income tax and military levy for foreign income (CRS data, foreign accounts, transfers); esv_demand = demand (вимога) to pay the single social contribution (ЄСВ) debt — sole proprietor (ФОП), incl. mobilised; residency_certificate_refusal = refusal (or no answer) to issue a certificate of Ukrainian tax residence; overpayment_refund = refusal or failure to refund overpaid (erroneously paid) taxes; land_tax_ppr = tax notice-decision (ППР) on land tax or land lease payment (individual); reporting_penalty_ppr = tax notice-decision (ППР) imposing a fine for not filing (late filing) the annual income declaration or the controlled foreign company (CFC, КІК) report; cash_register_penalty_ppr = tax notice-decision (ППР) with financial sanctions after an on-site (actual) inspection of a sole proprietor (ФОП): cash registers (РРО/ПРРО), receipts; single_tax_annulment = decision cancelling a sole proprietor's (ФОП) registration as a single tax payer (removal from the simplified tax system register); tax_deduction_refusal = refusal of the tax deduction (податкова знижка: tuition, mortgage interest, insurance, etc.) after the desk audit of the annual income declaration, or no refund of personal income tax within 60 days after the declaration; tax_consultation = individual tax consultation (ІПК) issued by the ДПС of Ukraine that contradicts the law, does not answer the question or was not given within 25 days; tax_debt_demand_or_lien = tax demand (податкова вимога), decision to describe property into tax lien (податкова застава), or refusal to release property from the tax lien; tax_debt_lawsuit_defence = lawsuit of the ДПС against the person to collect a tax debt: the person is the defendant and files a statement of defence (відзив); taxpayer_register = refusal (or no action) of the ДПС to register a person or to change their data (tax address, name) in the State Register of individual taxpayers (РНОКПП); other = another decision (not supported yet).",
                "enum": ["property_tax_ppr", "foreign_income_ppr", "esv_demand", "residency_certificate_refusal", "overpayment_refund", "land_tax_ppr", "reporting_penalty_ppr", "cash_register_penalty_ppr", "single_tax_annulment", "tax_deduction_refusal", "tax_consultation", "tax_debt_demand_or_lien", "tax_debt_lawsuit_defence", "taxpayer_register", "other"],
                "type": "string"
              },
              "appeal_decision_received_on": {
                "description": "Date the decision on that complaint was received (YYYY-MM-DD).",
                "type": "string"
              },
              "appealed": {
                "description": "A complaint to the ДПС of Ukraine was already filed.",
                "type": "boolean"
              },
              "as_of": {
                "description": "Date to evaluate deadlines on. Default: today in Kyiv (YYYY-MM-DD).",
                "type": "string"
              },
              "channel": {
                "description": "How it was received: e_cabinet, registered_mail, in_person, returned (letter returned to the ДПС, learned later).",
                "enum": ["e_cabinet", "registered_mail", "in_person", "returned"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "State whose procedure applies. Only \"ua\" (Ukraine) for now.",
                "enum": ["ua"],
                "type": "string"
              },
              "opponent": {
                "description": "Who the dispute is with: dps (State Tax Service) or other (out of scope).",
                "enum": ["dps", "other"],
                "type": "string"
              },
              "received_on": {
                "description": "Date the decision (or the refusal) was received or the person learned of it (YYYY-MM-DD).",
                "type": "string"
              }
            },
            "required": ["act"],
            "type": "object"
          },
