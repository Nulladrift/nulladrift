                "enum": ["AE", "AR", "AT", "BD", "BR", "CA", "CH", "CN", "CZ", "DE", "ES", "FR", "GB", "GE", "HU", "ID", "IN", "IT", "JP", "MX", "MY", "NL", "PK", "PL", "PT", "RO", "SE", "SG", "TR", "TW", "UA", "US"],
