                "enum": ["vinnytsia", "volyn", "dnipropetrovsk", "donetsk", "zhytomyr", "zakarpattia", "zaporizhzhia", "ivano-frankivsk", "kyiv-district", "kirovohrad", "luhansk", "lviv", "mykolaiv", "odesa", "poltava", "rivne", "sumy", "ternopil", "kharkiv", "kherson", "khmelnytskyi", "cherkasy", "chernivtsi", "chernihiv", "kmoas", "soas"],
