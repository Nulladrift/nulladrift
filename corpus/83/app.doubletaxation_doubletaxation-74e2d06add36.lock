      "instructions": "DoubleTaxation (doubletaxation.app) determines an individual's tax residence between two countries and explains where and which taxes apply, with the legal basis: domestic law of both states, the tax treaty tie-breaker (Art. 4), court practice, and the treaty's special rules per type of income. It also shows the tax burden on salaries (OECD Taxing Wages method), special tax regimes for individuals, exit taxes, and compares business forms (sole proprietor vs. own company).\nHow to use:\n1. Pick the version for the user's home state (list_versions). Versions: uk = Ukraine, en = United States, pl = Poland, cs = Czechia, ro = Romania, hu = Hungary, tr = Türkiye, zh = China, in = India, ja = Japan, bn = Bangladesh, pk = Pakistan, de = Germany, at = Austria, fr = France, es = Spain, pt = Portugal, it = Italy, my = Malaysia, sg = Singapore, tw = Taiwan, se = Sweden, br = Brazil, ar = Argentina, ge = Georgia, mx = Mexico, id = Indonesia (only the versions returned by list_versions are available).\n2. Call check_residency with version, the other country, year and citizenship, and no answers. It returns one question at a time. Ask the user that question, never guess an answer, and call again with all answers so far. Repeat until status is \"done\".\n3. Optionally pass \"income\" to get the per-income-type treaty rules, and \"move\" if the person moved this year.\n4. Present the result with its sources, the next steps (certificate of residence, filing obligations, steps when leaving), the disclaimer and result_link (opens the same result on the site).\nTo count days of stay, call count_days with the trips the user gives you (country, from, to): it returns days per country under each country's own counting rule, the day threshold and when it is reached, and Schengen 90/180. Trips are not stored.\nOther read-only tools: next_steps (what to do once the residence is known: certificate, obligations, leaving, year of the move), exit_tax_check (exit tax on individuals by country), regime_search (special tax regimes: newcomers, employees, self-employed, investors, pensioners), compare_business_forms (tax on a business profit per legal form in one country).\nFor general or theoretical questions (what tax residence is, where it comes from, why it exists, how it differs from citizenship, tax sovereignty and jurisdiction, offshore zones, the legal status of a taxpayer, the history and theories of taxing individuals), call explain_residency with \"query\": it searches the monograph by DoubleTaxation's legal expert (Yevhen Marynchak, 2020). Answer in the user's language, quickly and in plain words, and say that the original, full answer is in the monograph (section, page, link).\nThe conclusion is computed by the rules engine, not by you: do not change it. This is general information, not legal advice.",
      "tools": [
        {
          "name": "check_residency",
          "title": "Check tax residence",
          "description": "Determines the person's tax residence between the version's home state and another country, step by step. Without all answers it returns status \"needs_answer\" and the next question (id, text, options); ask the user and call again with all answers collected so far. When complete it returns status \"done\": the conclusion with reliability %, how each law treats the person, the treaty tie-breaker, where and which taxes apply, next steps (certificate of residence, resident / non-resident obligations, steps when leaving), exit tax and the year of the move (with \"move\"), what the result does not cover, the legal basis (norms with links) and court practice, optional per-income-type rules, the disclaimer and a link to the same result on doubletaxation.app. Texts are in the language of the version.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "integer"]
                },
                "description": "Answers so far: { \"<question id>\": value }. Choice questions take an option value (e.g. \"yes\", \"no\", \"unknown\"); number questions take a whole number (days) or \"unknown\" if allowed.",
                "type": "object"
              },
              "citizenship": {
                "description": "Citizenship option value from list_countries.citizenship_options, e.g. \"UA\", \"UA+OTHER\" (dual), \"NONUS\". Default: the first option (citizen of the home state only).",
                "type": "string"
              },
              "country": {
                "description": "ISO code of the other country (where the person lives or stays). Must be one of list_countries for this version.",
                "enum": ["AR", "AT", "BD", "BR", "CA", "CH", "CN", "CZ", "DE", "ES", "FR", "GB", "GE", "HU", "ID", "IN", "IT", "JP", "MX", "MY", "NL", "PK", "PL", "PT", "RO", "SE", "SG", "TR", "TW", "UA", "US"],
                "type": "string"
              },
              "income": {
                "description": "Optional: the person's income, one item per category, to get the treaty's special rules (who may tax it, rate limits, relief method, example calculation if amount is given).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Optional annual gross amount (any currency, used for an illustrative calculation).",
                      "type": "number"
                    },
                    "asset": {
                      "description": "capital_gains: what is sold.",
                      "enum": ["immovable", "property_rich_shares", "other"],
                      "type": "string"
                    },
                    "borne_by_pe": {
                      "description": "employment: is the salary borne by a permanent establishment of the employer in the state of work?",
                      "enum": ["yes", "no", "unknown"],
                      "type": "string"
                    },
                    "category": {
                      "enum": ["employment", "business", "technical_fees", "government", "pension", "immovable", "dividends", "interest", "royalties", "capital_gains", "directors", "artistes", "students", "other"],
                      "type": "string"
                    },
                    "days": {
                      "description": "employment: days in the state of work within the treaty period.",
                      "type": "integer"
                    },
                    "employer_resident_of_source": {
                      "description": "employment: is the employer resident in the state of work?",
                      "enum": ["yes", "no", "unknown"],
                      "type": "string"
                    },
                    "fixed_place": {
                      "description": "business / technical_fees: fixed place of business (permanent establishment) in the state of source?",
                      "enum": ["yes", "no", "unknown"],
                      "type": "string"
                    },
                    "pension_kind": {
                      "description": "pension: state social pension, pension for government service, or private/occupational pension.",
                      "enum": ["social", "government", "private"],
                      "type": "string"
                    },
                    "service_days": {
                      "description": "business / technical_fees: days of providing services in the state of source.",
                      "type": "integer"
                    },
                    "service_state": {
                      "description": "government: state where the government service is performed (ISO code).",
                      "type": "string"
                    },
                    "source": {
                      "description": "ISO code of the state of source: where the work is done, the property is, the payer or company is resident, the performance takes place. Must be the home state or the other country.",
                      "type": "string"
                    },
                    "student": {
                      "description": "students: came to the state of study for education, and the payments come from abroad?",
                      "enum": ["yes", "no", "unknown"],
                      "type": "string"
                    },
                    "study_state": {
                      "description": "students: state where the person studies (ISO code).",
                      "type": "string"
                    }
                  },
                  "required": ["category", "source"],
                  "type": "object"
                },
                "type": "array"
              },
              "move": {
                "additionalProperties": false,
                "description": "Optional: the person moved this tax year. kind \"depart\" = left the version's home state for the other country; \"arrive\" = moved to the home state from the other country. date YYYY-MM-DD within the tax year. Adds how each state treats the year of the move, the steps when leaving and the exit tax of the state left.",
                "properties": {
                  "date": {
                    "description": "Date of the move, YYYY-MM-DD.",
                    "type": "string"
                  },
                  "kind": {
                    "enum": ["depart", "arrive"],
                    "type": "string"
                  }
                },
                "required": ["date", "kind"],
                "type": "object"
              },
              "version": {
                "description": "Version id (home state), see list_versions.",
                "enum": ["uk", "en", "pl", "cs", "ro", "hu", "tr", "zh", "in", "ja", "bn", "pk", "de", "at", "fr", "es", "pt", "it", "my", "sg", "tw", "se", "br", "ar", "ge", "mx", "id"],
                "type": "string"
              },
              "year": {
                "description": "Tax year: the current year or one of the two previous years. Default: current year.",
                "type": "integer"
              }
            },
            "required": ["country", "version"],
            "type": "object"
          },
