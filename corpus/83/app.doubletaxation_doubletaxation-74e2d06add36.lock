        {
          "name": "regime_search",
          "title": "Search special tax regimes",
          "description": "Special and preferential tax regimes for individuals (newcomers / impatriates, employees, self-employed, investors, pensioners) in 31 countries. Filter by country, kind, status and free text. Returns per regime: official name, who it is for, the benefit, duration, how to apply, limits and risks, status (open, closed to new entrants, only for existing participants, starts later), the legal norm with a link and the date checked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "ISO codes; default: all countries.",
                "items": {
                  "enum": ["AE", "AR", "AT", "BD", "BR", "CA", "CH", "CN", "CZ", "DE", "ES", "FR", "GB", "GE", "HU", "ID", "IN", "IT", "JP", "MX", "MY", "NL", "PK", "PL", "RO", "SE", "SG", "TR", "TW", "UA", "US"],
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "kind": {
                "description": "Who the regime is for; default: all.",
                "items": {
                  "enum": ["newcomer", "employee", "self_employed", "investor", "pensioner", "other"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "limit": {
                "description": "Maximum regimes returned. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text; all words must match (name, who, benefit, conditions; in the version's language or English), e.g. \"foreign income flat\".",
                "maxLength": 100,
                "type": "string"
              },
              "status": {
                "description": "open = can be entered now; closed = closed to new entrants; grandfathered = only for existing participants; announced = starts later. Default: all.",
                "items": {
                  "enum": ["open", "closed", "grandfathered", "announced"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "version": {
                "description": "Language of the texts (version id). Default: en.",
                "enum": ["uk", "en", "pl", "cs", "ro", "hu", "tr", "zh", "in", "ja", "bn", "pk", "de", "at", "fr", "es", "pt", "it", "my", "sg", "tw", "se", "br", "ar", "ge", "mx", "id", "gb", "ae"],
