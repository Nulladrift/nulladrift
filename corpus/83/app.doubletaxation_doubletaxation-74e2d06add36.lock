        {
          "name": "explain_residency",
          "title": "Ask the monograph: tax residence, tax jurisdiction, taxpayer status",
          "description": "Answers general questions about tax residence and the theory behind it from the monograph by DoubleTaxation's legal expert, Yevhen Marynchak, \"The Financial-Legal Link Between an Individual and the State\" (2nd edition, 2020): 893 questions and answers covering what resident status is and why it exists; its history (from the citizenship principle to the residence principle, the League of Nations work of the 1920s, the OECD Model Tax Convention); economic theories of taxation (Smith, von Schanz, Wicksell–Lindahl); concepts of the \"income taxpayer\"; tax sovereignty and tax jurisdiction and their kinds (interstate, state, local, offshore zones); the legal status and tax legal personality of an individual taxpayer; criteria of residence and the treaty tie-breaker; source taxation; e-government; problems of the Ukrainian rules; the author's own terms and definitions. Each entry is a plain-English paraphrase with the book's section, page and a link to find the original text. Use \"query\" for a question (translate it into English key words); call without arguments for an overview and the table of contents. Not for a person's own status: use check_residency.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "Return these entries by id (from an earlier result).",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "kind": {
                "description": "Limit to one kind of entry (e.g. definition, history, legal_norm, proposal).",
                "enum": ["argument", "classification", "comparison", "definition", "fact", "history", "legal_norm", "problem", "proposal", "scholar_view", "theory"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum entries returned. Default 6.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The user's question or its key words, in English (translate if needed), e.g. \"why did citizenship stop determining tax duties\" or \"offshore zone definition\".",
                "maxLength": 300,
                "type": "string"
              },
              "section": {
                "description": "Limit to one part of the book (with its subsections); alone, lists that part's entries.",
                "enum": ["Preface", "Introduction", "1", "1.1", "1.1.1", "1.1.2", "1.1.3", "1.2", "1.2.1", "1.2.2", "1.2.3", "Conclusions to chapter 1", "2", "2.1", "2.2", "2.3", "2.3.1", "2.3.2", "2.3.3", "2.3.4", "Conclusions to chapter 2", "3", "3.1", "3.2", "3.3", "Conclusions to chapter 3", "4", "4.1", "4.2", "4.3", "Conclusions to chapter 4", "5", "5.1", "5.2", "5.3", "5.4", "5.5", "Conclusions to chapter 5", "Conclusions"],
                "type": "string"
              },
              "topic": {
                "description": "Short overview of one theme instead of a search: what_is = What tax residence is; origin = Where the concept comes from; why_it_matters = Why tax residence matters; criteria = How tax residence is determined; citizenship = Tax residence and citizenship; tax_jurisdiction = Tax sovereignty and tax jurisdiction; ukraine = Ukraine: problems analysed in the monograph.",
                "enum": ["what_is", "origin", "why_it_matters", "criteria", "citizenship", "tax_jurisdiction", "ukraine"],
                "type": "string"
              }
            },
            "type": "object"
