        {
          "uri": "portfolio://projects/simrig",
          "name": "SimRig",
          "title": "Project",
          "description": "an open-source relay that lets ai agents drive real ios simulators on a mac. a mac host, a cloudflare worker relay and an mcp server: screenshots, the element tree, taps, logs, maestro tests and visual diffs.",
