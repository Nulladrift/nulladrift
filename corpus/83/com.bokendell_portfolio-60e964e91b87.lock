          "digest": "sha256:bca3f36f6564f328b4c7e80e0e2e67756361a56268fbb047372aaf877dbf84c7"
        },
        {
          "uri": "portfolio://projects/swarm",
          "name": "Swarm",
          "title": "Project",
          "description": "my internal developer cli. one command turns a branch into a whole environment: its own ports, a neon database branched from stage, the env, and a public tunnel url. a desktop app renders the same commands as forms.",
          "mimeType": "text/markdown",
          "digest": "sha256:cf644452361bd66807810fae98cc82364ea8e0c651d0f591e6d4076e8a9369c5"
        },
        {
          "uri": "portfolio://writing/agent-guardrails",
          "name": "custom architecture checks as guardrails for coding agents",
          "title": "Post",
          "description": "coding agents copy whatever pattern is nearest. i wrote 67 architecture rules into my cli so the nearest pattern stays correct, and a verification gate that fails when it checked nothing.",
          "mimeType": "text/markdown",
          "digest": "sha256:e2c943870aacf4bf6f5d05dad804cea62f218655c842fdc82829b4aafdee02ac"
        },
        {
          "uri": "portfolio://writing/agent-layers",
          "name": "how the caddy's prompt is layered",
          "title": "Post",
          "description": "bagman's caddy picks a model per role, then builds its prompt in four layers so the parts that don't change during a round are cached for an hour. why the layers split where they do, and the tests that keep the cache from breaking.",
          "mimeType": "text/markdown",
          "digest": "sha256:98ec8f3c4170518cda08ce8ffcf3eb78041a18800cdf806ffa9822aa06698d2b"
        },
        {
          "uri": "portfolio://writing/eval-practices",
          "name": "keeping the caddy's evals honest",
          "title": "Post",
          "description": "the rules around bagman's eval suite: lint before a model call, treat the ci workflow as a contract, keep safety cheap and deterministic, fix the fixture instead of the threshold, and pin every bug the evals find.",
          "mimeType": "text/markdown",
          "digest": "sha256:73023aa703e3c9e4cbdd26fb2f62b081ecef8419f883be0949af143c6bea4c5d"
        },
        {
          "uri": "portfolio://writing/making-the-site-readable-to-agents",
          "name": "making the site readable to agents",
          "title": "Post",
          "description": "scanners like is-agentic and ora now score whether an agent can find, fetch, and use a site. this is the surface bokendell.com actually ships for that, without inventing a rank we have not earned.",
          "mimeType": "text/markdown",
          "digest": "sha256:f78f0ff07db6287b18960c899cfb76194acc4bc5a242e4abb63e04d91ad2b4a4"
        },
        {
          "uri": "portfolio://profile",
