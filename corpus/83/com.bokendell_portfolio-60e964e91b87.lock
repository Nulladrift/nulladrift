        {
          "uri": "portfolio://writing/evals",
          "name": "the evals behind bagman's caddy",
          "title": "Post",
          "description": "how bagman's caddy is tested against real models: one scenario per behaviour, eight scorers, suites that gate and suites that only measure, a weekly model sweep, and the regression check that keeps a context bug from coming back.",
