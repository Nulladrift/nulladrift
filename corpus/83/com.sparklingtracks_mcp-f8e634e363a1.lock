        {
          "name": "check_departure_live",
          "description": "Confirm ONE departure date with the operator right now. check_availability answers from stored data; this asks the operator live and is what should be trusted before a date is promised to a traveller. Returns status (available, on-request, closed or unknown) and the time of the check. seatsAvailable is a number only where the operator publishes a real count of places left. Null means no real count is published for that departure, NOT that no seats remain: do not present null as scarcity or as a sell-out. Some operators require an agent session and cannot be checked from a public request; those return an explanatory error rather than a status that could be mistaken for a refusal. Use before request_to_book.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Departure date, ISO YYYY-MM-DD.",
                "type": "string"
              },
              "title": {
                "description": "Trip title, only when no tripId is available. If it names more than one trip the call is refused and the candidates are returned with their ids. One of trip_id and title must be given.",
                "type": "string"
              },
              "trip_id": {
                "description": "The tripId returned by check_availability. PREFER THIS: titles are not unique, and two different trips can share one on the same date at very different prices. The trip number (1024). The same digits as text, the start of its page address (1024-from-london-to-budapest) and a link to its page are read as well.",
                "type": "number"
              }
            },
            "required": ["date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
