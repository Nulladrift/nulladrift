        {
          "name": "plan_multi_city_trip",
          "description": "Assemble a whole journey through several named cities and return the best options. Unlike list_packages and search_all_tours, which look for a single published trip, this builds one journey out of guided sections that connect in a hub city on real departure dates, plus the days Sparkling Tracks arranges itself around and between them. Give the cities in the order the traveller wants to see them; optionally a month (YYYY-MM) and the number of nights they have. Each journey returns its guided sections with their real departure and end dates, the days that are the traveller's own with the city and the nights, and the total length. THERE IS NO PRICE FOR A JOURNEY AND NO PRICE FOR A SECTION: the only figure returned is whole_tour_from_eur, the starting price of the ENTIRE published trip that a section is taken from, and it must never be added to another, divided by its nights, or presented as the cost of the journey or of the section. A person quotes each section by hand and one figure for the whole journey comes back with the reply to the enquiry, so tell the traveller plainly that a quote will follow. Every journey is returned even when we cannot price it yet; needs_quote says so and it is never a reason to hide an option. A city we cannot sell at all is named in unknown_cities and left out of every journey, so the journeys returned never contain it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cities": {
                "description": "Cities in the order the traveller wants to visit them, English or local spelling (e.g. [\"Paris\", \"Prague\", \"Rome\"]). The first is where the journey starts and the last is where it ends; the ones in between are wanted somewhere along the way. A city no guided section stays in becomes days we arrange ourselves rather than a reason to drop it.",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "currency": {
                "description": "Currency for the price_localized fields. Conversion is approximate, EUR-based; the binding price at booking is always EUR. Default: EUR. A value outside the list is refused.",
                "enum": ["EUR", "USD", "INR", "CNY", "GBP", "CHF"],
                "type": "string"
              },
              "language": {
                "description": "Output language for translatable fields (city names, country names, trip titles, descriptions). Default: en. zh is Simplified Chinese. A value outside the list is refused.",
                "enum": ["en", "de", "nl", "fr", "es", "zh"],
                "type": "string"
              },
              "month": {
                "description": "Month of travel, ISO YYYY-MM (e.g. \"2026-09\"). Only journeys starting in that month are returned. Omit when the traveller has not chosen one. A month that has gone is refused.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "nights": {
                "description": "Total nights the traveller has. Journeys longer than this are not returned at all, and nights left over once the guided sections are counted become days we arrange for them.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["cities"],
            "type": "object"
          },
          "annotations": {
