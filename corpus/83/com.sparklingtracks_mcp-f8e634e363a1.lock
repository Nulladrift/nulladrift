      },
      "instructions": "Sparkling Tracks sells guided group trips, which leave on set dates, and self-paced trips, which can start on any date, or on any date within their season where they have one.\nThe Terms say: \"Sparkling Tracks Tours & Travels, in the Netherlands, sells every trip as a retail agent for the tour operator that organizes it. Your contract for the travel services is with that operator, who is identified in your booking confirmation.\" Never name or guess the tour operator.\n\nWHICH TOOL TO USE\n1. find_trips first, for any question about where, when, how long, how many people or what budget. Put only the place or the trip name in query. Put the dates in date_from and date_to.\n2. get_package_details for one trip: what is included and what is not, the plan for each day, the optional add-ons, and the departures with their prices.\n3. get_trip_price for one trip, one date, one room type and one party.\n4. get_package_details and get_trip_price ask the operator as they answer. When source is \"live\", a date that is listed was open at checked_at. When source is \"snapshot\", the operator was not heard: use check_departure_live before you tell a traveller that a date is open.\n5. request_to_book when the traveller wants a place on a trip, and request_custom_itinerary when they want a trip planned for them. get_contact_info gives the ways to reach a person.\n6. get_terms for cancellation, deposit, payment and every other term. Quote the text. Do not state a charge or a deadline from memory.\n7. get_city for what we hold about one city: its guide text, its history, the weather month by month and its photo. Quote the text, and do not fill a part it does not hold.\n\nHOW TO STATE A PRICE\nPrices are per person and land only. Flights are not included unless the reply says so.\nThe price of a departure is the published price for that date when it was last read, and the reply gives that time in as_of. Say that a person confirms the final price.\nA \"from\" price is a starting price. It is not a quote.\nA price of null means that no figure is published. Do not estimate one. quote_only means that the tier is priced individually.\nThe deposit stated in the Terms is 10%. Do not calculate a deposit amount.\n\nHOW TO STATE AVAILABILITY\n\"available\" means the date was open when it was last read. \"on-request\" means the team must confirm it with the operator. Neither is a promise of a place.\nDo not state a number of seats unless a reply gives one.\nA trip with dates \"flexible\" has no fixed departures. Where it has a season, the reply gives it: do not offer a start date outside it. A trip with dates \"unknown\" has no departure on file: do not call it flexible.\n\nWHAT YOU MUST NOT SAY\nNever say that a trip is booked, reserved, held or confirmed. request_to_book sends a request, and a person confirms it later.\nThe links from get_affiliate_services go to other companies. The traveller buys from them and not from Sparkling Tracks.\n\nThese tools take language (en, de, nl, fr, es, zh) and currency (EUR, USD, INR, CNY, GBP, CHF): find_trips, list_packages, get_package_details, search_destinations, search_all_tours, plan_multi_city_trip, list_destinations, get_affiliate_services, get_contact_info, get_trip_price.\nget_terms takes language (en, de, nl, fr, es) and no currency.\nThe other tools take neither. A tool refuses an input that is not in its own list, so send each tool only the inputs it lists.\nFigures in EUR are the source. Other currencies are conversions for display.",
      "tools": [
        {
          "name": "check_availability",
          "description": "Search departure dates, per-person prices in EUR and the status of each departure across the whole group-trip catalogue. Unlike list_packages and get_package_details, which return \"from\" prices, this returns dated departures with the price of each. It is STORED data, read from the operators at the time given in asOf, and not a live check: a departure listed as available was available at that time. Departures that have already left are never returned, and neither are trips that have no page on the website. Each departure carries a status: \"available\" can be offered; \"on-request\" must be confirmed with the operator before it is promised to a traveller and must be described as \"on request\"; \"closed\" cannot be sold and is hidden unless include_unsellable is set. seatsLeft is always null, because no seat count is published from stored data: do not say how many places remain. Prices are per person in EUR and are the operator price. Use this for any question about when a trip runs or what a specific date costs, then confirm the chosen date with check_departure_live before it is promised.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "Country or city, in English or in any of our languages, matched loosely against countries, cities and trip titles. A name we know is read as its English name, which is repeated under asked. Omit to search everywhere.",
                "type": "string"
              },
              "from": {
                "description": "Earliest departure date, ISO YYYY-MM-DD. A date before today is read as today.",
                "type": "string"
              },
              "include_unsellable": {
                "description": "Include closed departures. Default false. Only set this to explain why a date is unavailable, never to offer one.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum trips to return, 1 to 50. Default 20. A number outside 1 to 50 is brought inside it, and the limit used is repeated under asked.",
                "type": "number"
              },
              "max_days": {
                "description": "Maximum trip length in days.",
                "type": "number"
              },
              "max_price": {
                "description": "Maximum per-person price in EUR.",
                "type": "number"
              },
              "min_days": {
                "description": "Minimum trip length in days.",
                "type": "number"
              },
              "to": {
                "description": "Latest departure date, ISO YYYY-MM-DD.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
