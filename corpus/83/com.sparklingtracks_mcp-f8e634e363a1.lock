        },
        {
          "name": "find_trips",
          "description": "START HERE. One search over every trip on the website: where, when, how long, how many travellers, which room, what budget. Put ONLY the place or the trip name in query: a city, a country, a trip name in any word order and any of our languages, a trip number, or a trip link pasted whole. Put the dates in date_from and date_to and never in query. Returns at most 8 trips a page, lowest price first, with a trip whose name matches the words ahead of the rest; total_matches says how many there are, and next_offset gives the next page. Each trip has its link, its length, its route, whether it has tiers, the lowest price per person among the departures that match (from), and its next 3 matching departures, each with the day it ends, its status and its price per tier in the room asked for. A departure matches when it LEAVES between date_from and date_to; use return_by when the traveller must be home by a date. For a trip with dates \"fixed\" the prices are the published prices of those departures when the operator was last read (as_of): exact for the date, stored and not live. A trip with dates \"flexible\" is one of our own self-paced trips: it can start on any date, or on any date within its season where start_window gives one, and its figure is a starting price. left_out counts the trips that matched the words and were ruled out by the dates or the budget, and nothing_found gives the nearest real departures when nothing matches. Follow with get_package_details for what a trip includes, get_trip_price for one date and one party, and request_to_book to ask for a place. Nothing is held or charged by searching.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency for the price_localized fields. Conversion is approximate, EUR-based; the binding price at booking is always EUR. Default: EUR. A value outside the list is refused.",
                "enum": ["EUR", "USD", "INR", "CNY", "GBP", "CHF"],
                "type": "string"
              },
              "date_from": {
                "description": "Earliest day the trip may LEAVE, ISO YYYY-MM-DD. For \"in November 2026\" give 2026-11-01 here and 2026-11-30 in date_to. A date before today is read as today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Latest day the trip may LEAVE, ISO YYYY-MM-DD. For \"November or December\" give the last day of December.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days_max": {
                "description": "Longest trip, in days.",
                "type": "number"
              },
              "days_min": {
                "description": "Shortest trip, in days.",
                "type": "number"
              },
              "language": {
                "description": "Output language for translatable fields (city names, country names, trip titles, descriptions). Default: en. zh is Simplified Chinese. A value outside the list is refused.",
                "enum": ["en", "de", "nl", "fr", "es", "zh"],
                "type": "string"
              },
              "limit": {
                "description": "How many trips to return, 1 to 8. Default 8. A number outside 1 to 8 is brought inside it, and the limit used is repeated under asked.",
                "type": "number"
              },
              "max_price_eur": {
                "description": "Budget per person in EUR, land only, in the room and tier asked for. Only departures at or under it are returned.",
                "type": "number"
              },
              "offset": {
                "description": "How many trips to pass over, for the next page. Ask the same question again with offset set to next_offset from the last reply. Default 0. next_offset is null on the last page.",
                "type": "number"
              },
              "query": {
                "description": "The place or the trip, and nothing else: \"Italy\", \"Rome\", \"Great Iberian\", \"2767\", or a pasted trip link. A place may be written in any of our languages (\"Wien\" is read as Vienna). Omit it to search every trip. Do not put dates, prices or party size here.",
                "type": "string"
              },
              "return_by": {
                "description": "The trip must have ended on or before this day, ISO YYYY-MM-DD. Use it only when the traveller must be home by a date.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "room": {
                "description": "Room type the prices are per person in. Default: double. shared is a solo traveller sharing with others of the same gender.",
                "enum": ["double", "single", "triple", "shared"],
                "type": "string"
              },
              "tier": {
                "description": "Only this tier. Omit to get every tier a trip is sold in; \"from\" and max_price_eur are then read at Economy. Luxury is priced individually and has no figure.",
                "enum": ["economy", "premium", "luxury"],
                "type": "string"
              },
              "travellers": {
                "description": "Party size, 1 to 40. When given, each price also has the total for the party.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
