        {
          "name": "get_package_details",
          "description": "Fetch the full itinerary, descriptions, included attractions, optional add-ons, pricing notes, and booking pathway for one Sparkling Tracks tour package by id: any trip that find_trips, list_packages or search_all_tours returns. The response includes city_date_windows: for each city on the route, the next upcoming departures with the real calendar dates the traveller is in that city (departure, arrive, leave, season) and the 1-based tour day the stay starts on; self-paced packages are flagged date_flexible instead, and one that runs in one season gives its start dates in departures.start_window. Guided group coach tours also return a family block: the edition descriptor for this package (days, whether the coach is reserved for English speakers rather than shared with other language groups, the city it ends in, and whether it loops back to its start city) plus the sibling editions of the same physical coach route, each with a one-line difference and its own page. departures lists the next departures that can still be requested, each with its price per person by tier and by room. When departures.source is \"live\" the operator was asked as this was answered (departures.checked_at) and a date it has closed is left out; when it is \"snapshot\" the statuses are the stored ones and departures.live_check says why, so do not promise a date. The prices are always the stored ones, read at departures.as_of. Use get_trip_price for one date and one party. whats_included says what is and is not included, once per tier (flights are never included: every price is land-only). itinerary is the day-by-day plan where the package has one, and an empty list where it is described stop by stop under highlights. Each entry of optional_addons carries included_from_tier: at that tier and every tier above it the add-on is part of the package at no charge, and null means it is a paid extra at every tier. payment.deposit is the share of the price that holds a reservation; use get_terms for the payment and cancellation terms. price.tiers lists each tier the package is sold in (Economy, Premium, Luxury) with its starting price per person and what that tier includes; each tier includes everything in the tier before it, and a tier marked quote_only is priced individually and has no figure. price.starting_from_eur is the Economy tier. Do not describe a higher tier as better hotels unless its includes list says so: on a guided coach tour the hotels are the same at every tier. A package sold at one price per room type returns an empty tiers list and says so in price.tiers_note. Every response carries price_basis, which states the exactness of every price field it returns (these are \"from\" prices, never per-date quotes) and the booking path. Accepts language and currency params; city names, country names, and trip titles are translated where available, English fallback otherwise. Booking always goes through WhatsApp, email, or the contact form; this MCP does not expose a booking endpoint.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency for the price_localized fields. Conversion is approximate, EUR-based; the binding price at booking is always EUR. Default: EUR. A value outside the list is refused.",
                "enum": ["EUR", "USD", "INR", "CNY", "GBP", "CHF"],
                "type": "string"
              },
