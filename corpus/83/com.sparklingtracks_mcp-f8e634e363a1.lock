        {
          "name": "get_trip_price",
          "description": "The price of ONE trip for one departure date, one room type and one party. Give trip_id and, for a trip that leaves on set dates, date (YYYY-MM-DD, one of the departures listed by get_package_details). Returns the price per person for each tier the trip is sold in, and the total for the party when travellers is given, with the status of that departure. The figure is the published price for that date, tier and room when the operator was last read (as_of): it is exact for the date, it is stored and not live, and a person confirms the final price. The STATUS of the date is checked with the operator as this is answered: source is \"live\" with checked_at when it answered, and a date it has closed is refused with departure_closed and the nearest open dates. When source is \"snapshot\", live_check says the operator was not heard: do not promise the date. room is double (two sharing, the default), single, triple or shared (a solo traveller sharing with others of the same gender); a room that is not sold on that date is answered in words, with the rooms that are. Luxury is planned and priced individually and has no figure. A trip sold at one price per room type has no tiers. Our own self-paced trips have no fixed departures: they return the figure their page shows for every start date, as a starting price, and one that runs in one season refuses a date outside it with out_of_season, its window and its next start. If the date is not a departure, the nearest real departures are returned in place of a guess. deposit_share is the deposit stated in the Terms; use get_terms for the clause. Nothing is held or charged by asking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency for the price_localized fields. Conversion is approximate, EUR-based; the binding price at booking is always EUR. Default: EUR. A value outside the list is refused.",
                "enum": ["EUR", "USD", "INR", "CNY", "GBP", "CHF"],
                "type": "string"
              },
              "date": {
                "description": "Departure date, ISO YYYY-MM-DD. Required for a trip that leaves on set dates. Omit it to get the list of departures back.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "language": {
                "description": "Output language for translatable fields (city names, country names, trip titles, descriptions). Default: en. zh is Simplified Chinese. A value outside the list is refused.",
                "enum": ["en", "de", "nl", "fr", "es", "zh"],
                "type": "string"
              },
              "room": {
                "description": "Room type the price is per person in. Default: double.",
                "enum": ["double", "single", "triple", "shared"],
                "type": "string"
              },
              "tier": {
                "description": "Only this tier. Omit to get every tier the trip is sold in.",
                "enum": ["economy", "premium", "luxury"],
                "type": "string"
              },
              "travellers": {
                "description": "Party size, 1 to 40. When given, the total for the party is returned as well.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "trip_id": {
                "description": "The trip, as find_trips, list_packages, search_all_tours or check_availability return it. The trip number (1024). The same digits as text, the start of its page address (1024-from-london-to-budapest) and a link to its page are read as well.",
                "type": "number"
              }
            },
            "required": ["trip_id"],
            "type": "object"
          },
