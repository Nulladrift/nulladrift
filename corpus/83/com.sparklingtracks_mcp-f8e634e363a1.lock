        {
          "name": "list_packages",
          "description": "To answer a traveller, use find_trips first: it searches every trip on the site by place, name, number or link and returns dated prices. List Sparkling Tracks tour packages with optional filters. Returns a compact summary (id, title, route, starting per-person price in EUR for the land-only option, the with-flights total when available (price_eur_with_flights), whether flights are optional (flights_optional), an approximate price in the requested currency, duration, badges, URL). The default starting price is land-only (without flights); customers can add round-trip flights. Optional date_from/date_to (ISO YYYY-MM-DD) filter by the real departure calendar: combined with a destination city they keep only packages whose stay in that city overlaps the range (annotated with city_date_windows); dates alone keep only packages that fit entirely inside the range. Accepts optional language and currency params; city names, country names, and trip titles are translated when a supported locale is requested. Tour packages are quote-based: prices are starting per-person prices, final pricing depends on party size, dates, and customisations. Every response carries price_basis, which states the exactness of every price field it returns (these are \"from\" prices, never per-date quotes) and the booking path. A package on a coach route that is also sold in other editions carries an editions count; get_package_details returns those editions in its family block. Where a package is sold in tiers, its summary carries tiers: the starting price of Economy and of Premium, and Luxury marked quote_only because it is priced individually. price_eur is always the Economy figure. A package sold at one price per room type has no tiers key. Use get_package_details for the full itinerary and for what each tier includes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "badge": {
                "description": "Filter to packages carrying a marketing badge. Accepted values include: bestseller, new, most_romantic, young_travelers, couples_choice, selling_fast. Partial substring match. No package carries a badge at present, so this filter returns an empty list and nothing_found says so.",
                "type": "string"
              },
              "currency": {
                "description": "Currency for the price_localized fields. Conversion is approximate, EUR-based; the binding price at booking is always EUR. Default: EUR. A value outside the list is refused.",
                "enum": ["EUR", "USD", "INR", "CNY", "GBP", "CHF"],
                "type": "string"
              },
              "date_from": {
                "description": "Start of the travel date range (ISO YYYY-MM-DD). A date before today is read as today. When the destination/query names a city on a package route, only packages whose stay in that city overlaps [date_from, date_to] are returned, each annotated with city_date_windows (departure, arrive, leave, tour day). Otherwise only packages that fit entirely inside the range are returned. date_from alone with a city means \"in that city on exactly this day\"; alone without a city it means \"departing on or after this date\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "End of the travel date range (ISO YYYY-MM-DD, inclusive). Must be on or after date_from. When omitted: with a city query and date_from it defaults to date_from (a single day); without a city the range is open-ended.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "destination": {
                "description": "A city or country on the route, in English or in any of our languages (e.g. \"italy\", \"amsterdam\", \"Wien\"). Letter case and accents do not matter. A name we know is read as its English name, which is repeated under asked; any other text is matched as part of a city or country name.",
                "type": "string"
              },
              "duration_days": {
                "description": "Filter to packages with exactly this many days (parsed from the duration string, e.g. \"12D/11N\" is 12 days).",
                "type": "integer"
              },
              "language": {
                "description": "Output language for translatable fields (city names, country names, trip titles, descriptions). Default: en. zh is Simplified Chinese. A value outside the list is refused.",
                "enum": ["en", "de", "nl", "fr", "es", "zh"],
                "type": "string"
              },
              "max_price_eur": {
                "description": "Filter to packages with starting price at or below this EUR amount. Custom-quote packages (price not yet set) are always included.",
                "type": "number"
              },
              "traveler_count": {
                "description": "Number of travellers in the party, 1 or more. Does not affect filtering; included in the response note so the AI can mention quote variability.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
