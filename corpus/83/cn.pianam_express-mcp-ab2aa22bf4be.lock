{
  "lockfileVersion": 2,
  "subjects": {
    "cn.pianam/express-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pianam.cn/express-mcp/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "express-mcp",
        "version": "4.1.3"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "detect_carrier",
          "title": "Detect Carrier",
          "description": "按单号规则自动推测快递公司（本地规则库，离线可用）：输入快递单号，返回可能的公司列表（含编码、中文名、匹配规则与置信度高/中/低）。带字母前缀的单号（SF/YT/STO/JD/DPK/UPS 1Z 等）置信度最高。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "number": {
                "default": "",
                "description": "快递单号，如 SF0218947552508、YT7460266600081",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:c77f6c32dd49066d3c122767f38fc4093b38f79f776744c6c6d567c6d478eb81"
        },
        {
          "name": "list_couriers",
          "title": "List Couriers",
          "description": "列出支持的快递公司：返回编码、中文名、英文名、快递鸟编码、客服电话、官网与常用别名。可传 keyword 按名称/编码/别名过滤（如 '顺丰'、'SF'），limit 控制返回数量（默认50）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keyword": {
                "default": "",
                "description": "过滤关键词（中文名/编码/别名/英文名），如 顺丰、SF、jd；空则返回全部",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "返回数量上限，1-100，默认 50",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:25bfe51b9ade68a8f908023569a121df577acb26b7d1e3822812f10fc446e9bb"
        },
        {
          "name": "query_logistics",
          "title": "Query Logistics",
          "description": "查询快递物流轨迹：输入快递单号 number（必填），可传 carrier 指定快递公司（支持编码如 shunfeng/zhongtong/yuantong/shentong/yunda/jd/ems，或中文名如 顺丰/中通/圆通/申通/韵达/京东/EMS；不传则按单号规则自动推测）。顺丰、中通部分单号需补充 phone_tail=收件人手机号后4位。返回物流状态、是否签收、轨迹时间轴（时间+内容）。数据源为快递100公开免费接口。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carrier": {
                "default": "",
                "description": "快递公司编码或中文名（可选，不传自动推测），如 shunfeng/顺丰",
                "type": "string"
              },
              "number": {
                "default": "",
                "description": "快递单号，如 SF0218947552508、YT7460266600081、773170861031705",
                "type": "string"
              },
              "phone_tail": {
                "default": "",
                "description": "收件人手机号后4位（顺丰/中通部分单号必填，可选）",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:bb128ca2cbe52e7a9bbe2c1c1c5ce292178d03889c7d16c65e2fd3a4a8645b96"
        }
      ],
      "digest": "sha256:982d5864464f7f178ab63d85ee00610e4e68a859528c25cc790a33dfbb211d32"
    }
  }
}
