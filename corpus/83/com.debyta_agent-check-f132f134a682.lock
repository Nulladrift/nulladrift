        {
          "name": "guard_payment",
          "title": "DEBYTA Guard: one check for any payment",
          "description": "One call BEFORE any payment or deposit. Pass whatever you have: crypto address (to, optional payee domain), signed payment request (request), an x402 402 response (requirements, maxAmount), a trading/investment platform (platform), or a shop URL / IBAN / payment link / e-mail / phone. DEBYTA runs every relevant check and returns ONE signed allow / warn / block with reasons. Price scales with the amount (0.02 %, capped).",
