        {
          "name": "execute_guarded_payment",
          "title": "DEBYTA HARD STOP: execute only after all gates pass",
          "description": "Calls the configured PSP adapter only when the payment is authorized and no open hold or confirmed-fraud case exists. Returns blocked when a dispute is active.",
          "inputSchema": {
