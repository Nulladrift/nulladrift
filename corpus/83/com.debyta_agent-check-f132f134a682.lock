{
  "lockfileVersion": 2,
  "subjects": {
    "com.debyta/agent-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://debyta.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "debyta-agent-check",
        "title": "DEBYTA Agent Check",
        "version": "1.6.0",
        "websiteUrl": "https://debyta.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "For autonomous workflows, use create_intent_from_language or create_intent to register explicit limits, verify merchant domain control, create_guarded_payment, authorize_guarded_payment, and execute_guarded_payment. Use hold_guarded_payment to open an evidence dispute. The PSP adapter must enforce provider-side holds atomically. IntentGuard checks amount/merchant/payee/payment-method limits, server-side merchant mapping, event history and revocation. For other checks call guard_payment before payments, check_before_payment before purchases or logins, check_crypto_transfer before crypto transfers and check_x402_payment before x402 payments. Authenticate with a DEBYTA key or pay stateful IntentGuard calls with x402. A free anonymous quota is not a durable identity.",
      "tools": [
        {
          "name": "analyze_message",
          "title": "DEBYTA: analyze a message for scam patterns",
          "description": "Analyze an e-mail, SMS or chat message for scam patterns (18 patterns, 10 languages) and check every link, IBAN, crypto address and phone number in it. The text is not stored.",
          "inputSchema": {
            "properties": {
              "cc": {
                "description": "Default country calling code, e.g. 49",
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c51e8f5ae312c445349a33ccd0329155453b4d3f03968fd027d03a303fd0fb42"
        },
        {
          "name": "authorize_guarded_payment",
          "title": "DEBYTA HARD STOP: authorize through IntentGuard and PSP",
          "description": "Rechecks the signed intent and server-side merchant/payee verification before requesting PSP authorization. Fails closed when verification or PSP adapter is missing.",
          "inputSchema": {
            "properties": {
              "paymentId": {
                "type": "string"
              }
            },
            "required": ["paymentId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cec0a3c78557e67ba4d4221d0dca0e9c405b6100dc86a8ef7bf50c1b1b61df84"
        },
        {
          "name": "check_before_payment",
          "title": "DEBYTA: check before paying, buying or logging in",
          "description": "Call this BEFORE an agent pays, buys from a shop, transfers money to an IBAN or crypto address, or enters credentials on a website. Returns decision allow / warn / block with reasons, risk 0-100 and an Ed25519-signed verdict. allow = no known fraud indicators (not a guarantee); warn = ask the human; block = do not execute.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["pay", "purchase", "login", "transfer", "subscribe", "other"],
                "type": "string"
              },
              "amount": {
                "type": "number"
              },
              "context": {
                "description": "Message or page text that asked for the payment (not stored)",
                "type": "string"
              },
              "crypto": {
                "description": "Crypto address (BTC, EVM, TRON, SOL …)",
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "deep": {
                "description": "Open the URL now and inspect it live (costs more)",
                "type": "boolean"
              },
              "domain": {
                "type": "string"
              },
              "email": {
                "description": "Seller / payee e-mail",
                "type": "string"
              },
              "iban": {
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "paylink": {
                "description": "Payment link (PayPal.me, Stripe link …)",
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "social": {
                "description": "Seller profile link (Instagram, TikTok, Telegram …)",
                "type": "string"
              },
              "url": {
                "description": "Shop / checkout / login URL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f8a3a8f52384b79bc14d2e405e9a8289d25c9d0b9ba2656420685eaaea3f7297"
        },
        {
          "name": "check_crypto_platform",
          "title": "DEBYTA: is this crypto trading / investment platform real?",
          "description": "Call this BEFORE depositing on any crypto trading, investment, mining or staking platform the user was referred to (often via chat, dating or social media). DEBYTA opens the site live and checks domain age, guaranteed returns, withdrawal \"taxes\"/fees, VIP tiers, licence claims, messenger-only support, exchange impersonation and the deposit addresses shown. Returns signed allow / warn / block with reasons.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Message that referred the user (not stored)",
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "url": {
                "description": "Address of the platform",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:842fac73132a3b8fbf40d4a7a1f7417aaf0df15d34be66f36213a1f32904d1a6"
        },
        {
          "name": "check_crypto_transfer",
          "title": "DEBYTA: check before sending crypto",
          "description": "Call this BEFORE sending any crypto (BTC, ETH, USDT, USDC, SOL, TRX …). Detects mistyped or corrupted addresses (checksum), burn addresses, swapped addresses (payee verification: pass the recipient domain as \"payee\"), sanctioned addresses (OFAC), addresses linked to scam websites, address poisoning (look-alike of an address the user knows – pass them in \"known\"), wrong network for the asset, and scam patterns in the payment request. Returns signed allow / warn / block. Crypto transfers cannot be reversed: block = do not send.",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "number"
              },
              "asset": {
                "description": "e.g. BTC, ETH, USDT, USDC",
                "type": "string"
              },
              "chain": {
                "description": "Network, e.g. bitcoin, ethereum, base, arbitrum, polygon, bsc, tron, solana",
                "type": "string"
              },
              "context": {
                "description": "Message that asked for the transfer (not stored)",
                "type": "string"
              },
              "known": {
                "description": "Addresses the user already uses (address book, recent recipients) – compared in memory only, not stored",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "type": "string"
              },
              "payee": {
                "description": "Domain of the intended recipient (e.g. the shop). Verifies the address against addresses the domain publishes itself; a swapped address is blocked",
                "type": "string"
              },
              "ref": {
                "description": "Your own transfer id, signed into the verdict",
                "type": "string"
              },
              "source": {
                "description": "Website or link where the address came from",
                "type": "string"
              },
              "to": {
                "description": "Recipient address",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3a0fca933e6217f5a2219eddeb1b29d4a543e66a4494a13e353b4f8abf850ce"
        },
        {
          "name": "check_intent_action",
          "title": "DEBYTA IntentGuard: check an agent action",
          "description": "Call BEFORE executing an action. Checks action, amount, currency, merchant, recipient and payment method against a signed intent. block = do not execute; warn = pause for human approval; allow = constraints match, not a safety guarantee. The caller must enforce the decision. Requires a unique idempotencyKey.",
          "inputSchema": {
            "properties": {
              "action": {
                "properties": {
                  "action": {
                    "enum": ["purchase", "pay", "transfer", "subscribe", "login", "other"],
                    "type": "string"
                  },
                  "agentId": {
                    "type": "string"
                  },
                  "amount": {
                    "type": "number"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "merchant": {
                    "type": "string"
                  },
                  "parentAgentId": {
                    "type": "string"
                  },
                  "payee": {
                    "type": "string"
                  },
                  "paymentMethod": {
                    "type": "string"
                  }
                },
                "required": ["action"],
                "type": "object"
              },
              "idempotencyKey": {
                "type": "string"
              },
              "intentId": {
                "type": "string"
              }
            },
            "required": ["action", "idempotencyKey", "intentId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7334da8f626f5ce9172fcaccfee99f260833863c825afaa0df51ca58d7ffacd"
        },
        {
          "name": "check_x402_payment",
          "title": "DEBYTA: check an x402 payment request before paying",
          "description": "Call this when an HTTP request returns 402 Payment Required (x402) and BEFORE your wallet signs. Pass the 402 response body (or the PAYMENT-REQUIRED header) unchanged. DEBYTA verifies that payTo is published by the seller domain (payee verification), enforces your maxAmount (USD), and checks checksum, sanctions (OFAC) and fraud traces. Returns a signed allow / warn / block for the safest payment option.",
          "inputSchema": {
            "properties": {
              "callback": {
                "description": "HTTPS URL – DEBYTA POSTs a signed notice if this allow decision is revised later (address reported/sanctioned)",
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "maxAmount": {
                "description": "Your spending limit for this payment in USD",
                "type": "number"
              },
              "ref": {
                "type": "string"
              },
              "requirements": {
                "description": "402 response body (object or JSON string) or the base64 PAYMENT-REQUIRED header"
              },
              "resource": {
                "description": "URL you requested (if not inside the 402 body)",
                "type": "string"
              }
            },
            "required": ["requirements"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:287f9d8ce132d4e6586177ea3afa7281632242df65f410425f35c87ed74088a4"
        },
        {
          "name": "create_guarded_payment",
          "title": "DEBYTA HARD STOP: create an intent-bound payment",
          "description": "Create a payment record with a unique idempotency key. This does not move money. Requires a signed intent and a configured PSP adapter for authorization/execution.",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "number"
              },
              "currency": {
                "type": "string"
              },
              "idempotencyKey": {
                "type": "string"
              },
              "intentId": {
                "type": "string"
              },
              "merchant": {
                "type": "string"
              },
              "payee": {
                "type": "string"
              },
              "paymentMethod": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              }
            },
            "required": ["amount", "currency", "idempotencyKey", "intentId", "merchant", "payee", "paymentMethod"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:45129f6709d4ea6fef16e9efbcdb9dbf86e3d3857db3803a4f5f14a0cd29817e"
        },
        {
          "name": "create_intent",
          "title": "DEBYTA IntentGuard: create a signed authorization",
          "description": "Create a time-limited, signed authorization for an agent workflow. Provide explicit structured constraints; this tool does not infer permissions from natural-language instructions. Stateful use requires a DEBYTA key or an x402-paid call.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["purchase", "pay", "transfer", "subscribe", "login", "other"],
                "type": "string"
              },
              "allowedMerchants": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "allowedPayees": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "allowedPaymentMethods": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "currency": {
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "maxAmount": {
                "type": "number"
              },
              "requireMerchantVerification": {
                "type": "boolean"
              },
              "ttlSeconds": {
                "maximum": 2592000,
                "minimum": 60,
                "type": "integer"
              }
            },
            "required": ["action", "description"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d3bd09d860893247cc6d39c667a80f31e9fcfce2019124de827ebebb2b8554d"
        },
        {
          "name": "create_intent_from_language",
          "title": "DEBYTA IntentGuard: translate a natural-language payment instruction",
          "description": "Conservative German/English parser. Creates a signed intent only when amount, currency, merchant, payee, action and payment method are clear; otherwise returns clarification questions and creates nothing.",
          "inputSchema": {
            "properties": {
              "text": {
                "maxLength": 2000,
                "type": "string"
              }
