            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2fca5e902ecd3335b34bbbe13e68e5eb49b4cd645c754f6cda0a6e535252aaa"
        },
        {
          "name": "hold_guarded_payment",
