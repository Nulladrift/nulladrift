        {
          "name": "report_outcome",
          "title": "DEBYTA: report what happened after a decision (free)",
          "description": "Tell DEBYTA whether a checked payment turned out to be fraud or legitimate. Pass the \"id\" from the DEBYTA decision. Free. Two independent reports change the data; a single report never blocks anything.",
