{
  "lockfileVersion": 2,
  "subjects": {
    "com.debyta/agent-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://debyta.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "debyta-agent-check",
        "title": "DEBYTA Agent Check",
        "version": "1.5.0",
        "websiteUrl": "https://debyta.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Simplest: call guard_payment before any payment or deposit with everything you know (address, URL, IBAN, x402 response, platform, amount). Or use the single checks: check_before_payment before any payment, purchase, money transfer or credential entry. Use check_crypto_platform before depositing on any crypto trading or investment platform. Use check_crypto_transfer before sending crypto (or verify_payment_request when you have a signed DEBYTA payment request) and check_x402_payment before paying an HTTP 402 (x402) request. Afterwards report_outcome (free) if it turned out to be fraud or a false alarm. Follow the decision: block = do not execute, warn = ask the human, allow = proceed. Authenticate with \"Authorization: Bearer <DEBYTA API key>\" (free key at https://debyta.com/account/schutzserver).",
      "tools": [
        {
          "name": "analyze_message",
          "title": "DEBYTA: analyze a message for scam patterns",
          "description": "Analyze an e-mail, SMS or chat message for scam patterns (18 patterns, 10 languages) and check every link, IBAN, crypto address and phone number in it. The text is not stored.",
          "inputSchema": {
            "properties": {
              "cc": {
                "description": "Default country calling code, e.g. 49",
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c51e8f5ae312c445349a33ccd0329155453b4d3f03968fd027d03a303fd0fb42"
        },
        {
          "name": "check_before_payment",
          "title": "DEBYTA: check before paying, buying or logging in",
          "description": "Call this BEFORE an agent pays, buys from a shop, transfers money to an IBAN or crypto address, or enters credentials on a website. Returns decision allow / warn / block with reasons, risk 0-100 and an Ed25519-signed verdict. allow = no known fraud indicators (not a guarantee); warn = ask the human; block = do not execute.",
          "inputSchema": {
            "properties": {
              "action": {
                "enum": ["pay", "purchase", "login", "transfer", "subscribe", "other"],
                "type": "string"
              },
              "amount": {
                "type": "number"
              },
              "context": {
                "description": "Message or page text that asked for the payment (not stored)",
                "type": "string"
              },
              "crypto": {
                "description": "Crypto address (BTC, EVM, TRON, SOL …)",
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "deep": {
                "description": "Open the URL now and inspect it live (costs more)",
                "type": "boolean"
              },
              "domain": {
                "type": "string"
              },
              "email": {
                "description": "Seller / payee e-mail",
                "type": "string"
              },
              "iban": {
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "paylink": {
                "description": "Payment link (PayPal.me, Stripe link …)",
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "social": {
                "description": "Seller profile link (Instagram, TikTok, Telegram …)",
                "type": "string"
              },
              "url": {
                "description": "Shop / checkout / login URL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f8a3a8f52384b79bc14d2e405e9a8289d25c9d0b9ba2656420685eaaea3f7297"
        },
        {
          "name": "check_crypto_platform",
          "title": "DEBYTA: is this crypto trading / investment platform real?",
          "description": "Call this BEFORE depositing on any crypto trading, investment, mining or staking platform the user was referred to (often via chat, dating or social media). DEBYTA opens the site live and checks domain age, guaranteed returns, withdrawal \"taxes\"/fees, VIP tiers, licence claims, messenger-only support, exchange impersonation and the deposit addresses shown. Returns signed allow / warn / block with reasons.",
          "inputSchema": {
            "properties": {
              "context": {
                "description": "Message that referred the user (not stored)",
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "url": {
                "description": "Address of the platform",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:842fac73132a3b8fbf40d4a7a1f7417aaf0df15d34be66f36213a1f32904d1a6"
        },
        {
          "name": "check_crypto_transfer",
          "title": "DEBYTA: check before sending crypto",
          "description": "Call this BEFORE sending any crypto (BTC, ETH, USDT, USDC, SOL, TRX …). Detects mistyped or corrupted addresses (checksum), burn addresses, swapped addresses (payee verification: pass the recipient domain as \"payee\"), sanctioned addresses (OFAC), addresses linked to scam websites, address poisoning (look-alike of an address the user knows – pass them in \"known\"), wrong network for the asset, and scam patterns in the payment request. Returns signed allow / warn / block. Crypto transfers cannot be reversed: block = do not send.",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "number"
              },
              "asset": {
                "description": "e.g. BTC, ETH, USDT, USDC",
                "type": "string"
              },
              "chain": {
                "description": "Network, e.g. bitcoin, ethereum, base, arbitrum, polygon, bsc, tron, solana",
                "type": "string"
              },
              "context": {
                "description": "Message that asked for the transfer (not stored)",
                "type": "string"
              },
              "known": {
                "description": "Addresses the user already uses (address book, recent recipients) – compared in memory only, not stored",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "type": "string"
              },
              "payee": {
                "description": "Domain of the intended recipient (e.g. the shop). Verifies the address against addresses the domain publishes itself; a swapped address is blocked",
                "type": "string"
              },
              "ref": {
                "description": "Your own transfer id, signed into the verdict",
                "type": "string"
              },
              "source": {
                "description": "Website or link where the address came from",
                "type": "string"
              },
              "to": {
                "description": "Recipient address",
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a3a0fca933e6217f5a2219eddeb1b29d4a543e66a4494a13e353b4f8abf850ce"
        },
        {
          "name": "check_x402_payment",
          "title": "DEBYTA: check an x402 payment request before paying",
          "description": "Call this when an HTTP request returns 402 Payment Required (x402) and BEFORE your wallet signs. Pass the 402 response body (or the PAYMENT-REQUIRED header) unchanged. DEBYTA verifies that payTo is published by the seller domain (payee verification), enforces your maxAmount (USD), and checks checksum, sanctions (OFAC) and fraud traces. Returns a signed allow / warn / block for the safest payment option.",
          "inputSchema": {
            "properties": {
              "callback": {
                "description": "HTTPS URL – DEBYTA POSTs a signed notice if this allow decision is revised later (address reported/sanctioned)",
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "maxAmount": {
                "description": "Your spending limit for this payment in USD",
                "type": "number"
              },
              "ref": {
                "type": "string"
              },
              "requirements": {
                "description": "402 response body (object or JSON string) or the base64 PAYMENT-REQUIRED header"
              },
              "resource": {
                "description": "URL you requested (if not inside the 402 body)",
                "type": "string"
              }
            },
            "required": ["requirements"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:287f9d8ce132d4e6586177ea3afa7281632242df65f410425f35c87ed74088a4"
        },
        {
          "name": "guard_payment",
          "title": "DEBYTA Guard: one check for any payment",
          "description": "One call BEFORE any payment or deposit. Pass whatever you have: crypto address (to, optional payee domain), signed payment request (request), an x402 402 response (requirements, maxAmount), a trading/investment platform (platform), or a shop URL / IBAN / payment link / e-mail / phone. DEBYTA runs every relevant check and returns ONE signed allow / warn / block with reasons. Price scales with the amount (0.02 %, capped).",
          "inputSchema": {
            "properties": {
              "amount": {
                "type": "number"
              },
              "chain": {
                "type": "string"
              },
              "context": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "iban": {
                "type": "string"
              },
              "known": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "type": "string"
              },
              "maxAmount": {
                "type": "number"
              },
              "payee": {
                "type": "string"
              },
              "paylink": {
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "platform": {
                "type": "string"
              },
              "ref": {
                "type": "string"
              },
              "request": {
                "type": "string"
              },
              "requirements": {},
              "to": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f2fca5e902ecd3335b34bbbe13e68e5eb49b4cd645c754f6cda0a6e535252aaa"
        },
        {
          "name": "report_outcome",
          "title": "DEBYTA: report what happened after a decision (free)",
          "description": "Tell DEBYTA whether a checked payment turned out to be fraud or legitimate. Pass the \"id\" from the DEBYTA decision. Free. Two independent reports change the data; a single report never blocks anything.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "string"
              },
              "outcome": {
                "enum": ["fraud", "legit", "false_alarm"],
                "type": "string"
              }
            },
            "required": ["id", "outcome"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fed7b000df56373ef42ba77ff63cdda719a32e005d2882909cafe62d921dbf94"
        },
        {
          "name": "verify_payment_request",
          "title": "DEBYTA: verify a signed crypto payment request",
          "description": "Call this when you received a DEBYTA payment request (\"dpr1.…\" or \"debyta:pay?r=…\") and BEFORE sending. DEBYTA checks the payee’s signature against the key published on the payee’s own domain – any swapped address, changed amount or expired request is detected – plus sanctions, checksum and fraud traces. Pass the address you are actually about to send to as \"sendTo\".",
          "inputSchema": {
            "properties": {
              "lang": {
                "type": "string"
              },
              "request": {
                "type": "string"
              },
              "sendAmount": {
                "type": "number"
              },
              "sendTo": {
                "description": "Address you are actually about to send to",
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e27db64fbd61947343d813265d83b67fb41cc9dcd405d46f2ec3037856d89eb4"
        }
      ],
      "digest": "sha256:72475e2035123451f4eef85f75c038d22582df534e92c9ef78518d37ec457b32"
    }
  }
}
