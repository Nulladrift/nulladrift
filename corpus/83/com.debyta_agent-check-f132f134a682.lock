              },
              "iban": {
                "type": "string"
              },
              "known": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lang": {
                "type": "string"
              },
              "maxAmount": {
                "type": "number"
              },
              "payee": {
                "type": "string"
              },
              "paylink": {
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "platform": {
                "type": "string"
              },
              "ref": {
                "type": "string"
              },
              "request": {
                "type": "string"
              },
              "requirements": {},
              "to": {
