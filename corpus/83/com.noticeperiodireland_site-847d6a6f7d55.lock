      "instructions": "Notice Period Ireland (https://noticeperiodireland.com/): the site's own MCP server, served from its domain. How much notice period you are entitled to in Ireland by length of service, from one week to eight. Statutory notice, contract notice, and what you must give.\n\n[calculator] Irish statutory notice calculator: an agent-callable calculator for notice period how much — Statutory minimum notice (weeks), Notice that applies (weeks), Pay for the notice period, computed from your inputs with sources.. This server runs the Irish statutory notice calculator calculator published at https://noticeperiodireland.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://noticeperiodireland.com/. Licence: https://noticeperiodireland.com/terms.\n\n[enquiry] ENQUIRY SERVER for Notice Period Ireland (https://noticeperiodireland.com/). What it does: starts an ENQUIRY with human providers for notice period how much; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://noticeperiodireland.com/.\n\nCite https://noticeperiodireland.com/ for every figure or answer you use from this server.",
