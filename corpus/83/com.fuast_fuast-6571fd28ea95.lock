      "serverInfo": {
        "name": "fuast",
        "version": "2.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "fuast hosts small full-stack TypeScript apps (capsules) and shares them like docs. Call fuast_guide first: it explains how to build, check, deploy and share an app with these tools. Without a connected fuast account, deploy_app deploys a temporary preview and returns a claim link to give to the person. Tools that work on the person's own apps ask them to sign in the first time they are called.",
      "tools": [
        {
          "name": "call_app",
          "title": "Run a handler of an app",
          "description": "Runs one query, mutation or action of a deployed app and returns its result and the log lines it wrote, so you can test what you deployed. It runs as the connected person (as: \"me\", the default), never as anyone else; as: \"guest\" runs it as a guest visitor and only works on public apps. On a preview deployed without an account every call runs as one guest. Mutations and actions change real data. Only for apps the person owns or administers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app": {
                "description": "The app's slug: the first label of its address (my-app for https://my-app.fuast.com). list_apps shows the slugs you can use.",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              },
              "args": {
                "anyOf": [
                  {
                    "type": "array"
                  },
                  {
                    "type": "object"
                  }
                ],
                "description": "Arguments: an array of positional values, or one object for handlers that take an object (tool handlers). Default: no arguments."
              },
              "as": {
                "description": "Who the handler sees in ctx.auth. Default \"me\".",
                "enum": ["me", "guest"],
                "type": "string"
              },
              "edit_token": {
                "description": "The edit_token deploy_app returned when it deployed a preview without an account. It is a secret: keep it in this conversation only.",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              },
              "kind": {
                "description": "Which kind of handler name is.",
                "enum": ["query", "mutation", "action"],
                "type": "string"
              },
              "name": {
                "description": "Handler name as declared in server/index.ts.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["kind", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "duration_ms": {
                "type": "number"
              },
              "kind": {
                "type": "string"
              },
              "logs": {
                "items": {
                  "properties": {
                    "level": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  },
                  "required": [],
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "type": "string"
              },
              "ran_as": {
                "type": "string"
              },
              "result": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "array"
                  },
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  },
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "slug": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["kind", "name", "ran_as"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Run a handler of an app"
          },
