        {
          "name": "deploy_app",
          "title": "Deploy an app",
          "description": "Deploys the files and returns the app's URL. With a connected fuast account it creates a new private app in the person's workspace, or updates the app named in app. Without an account it deploys a temporary preview and returns preview_url, claim_url and edit_token: give the person claim_url so they can make the app theirs, and pass edit_token to later calls to keep working on it. Send every file each time; use update_app_files to change a few. A failed build returns diagnostics with file and line and deploys nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "app": {
                "description": "Slug of an existing app in the connected account to update. Leave out to create a new app.",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              },
              "delete_tables": {
                "description": "Only when a deploy was refused because the new schema drops tables that hold rows: repeat each table with the exact row count from that error to confirm deleting it.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "row_count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "table": {
                      "type": "string"
                    }
                  },
                  "required": ["row_count", "table"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "edit_token": {
                "description": "To update a preview that was deployed without an account: the edit_token that deploy returned.",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              },
              "files": {
                "additionalProperties": {
