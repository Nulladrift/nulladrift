                "minProperties": 1,
                "type": "object"
              },
              "name": {
                "description": "Name of a new app. Its address is derived from it. Ignored when updating an app.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
