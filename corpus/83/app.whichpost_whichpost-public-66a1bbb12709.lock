      "instructions": "Public information about WhichPost: what it does, who it is for, how it works, pricing, privacy and security, common questions, a fit check and a simulated sample report. Nothing here reads anyone's data, and nothing needs sign-in. For a team's own campaign results, they connect WhichPost at https://whichpost.app/mcp (sign-in required). Every WhichPost result comes with a likely range: give ranges with numbers. The sample report is simulated: say so whenever you use it.",
