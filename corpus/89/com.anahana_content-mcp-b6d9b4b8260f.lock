{
  "lockfileVersion": 2,
  "subjects": {
    "com.anahana/content-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.anahana.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Anahana Content MCP",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_article",
          "title": "Get an Anahana article as markdown",
          "description": "Fetch a specific Anahana article as markdown, given its full URL, site-relative path (e.g. \"/en/angel-numbers/111-angel-number/\"), or a bare slug from search_content results (e.g. \"111-angel-number\"). Tries two fetch modes against the live site in order: (1) content negotiation — GET the article URL with `Accept: text/markdown`; (2) the path-based markdown mirror at `<article-url>index.md`. Both are live. Page chrome (skip link, table of contents with dead anchors, back-to-top anchor, analytics pixel) is stripped, so what you get back is the article body. If both modes fail, returns a clear error naming the canonical HTML URL instead of silently failing. Works in all 24 languages: a full URL or a site-relative path already names its language, and a bare slug is resolved in the language given by `language` (English by default). Article slugs are identical across languages — only the title and body are translated — so the same slug plus a different `language` gives you the same article in that language.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "Language for a BARE SLUG, e.g. \"ja\". Ignored when url_or_slug is a full URL or a site-relative path, since those already carry their language prefix. Defaults to \"en\".",
                "type": "string"
              },
              "url_or_slug": {
                "description": "Full URL, site-relative path, or bare slug, e.g. \"111-angel-number\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url_or_slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d24d558f7be435f30fb2d874f4c7690d3ef9b672dff494b812301e7e2c9ef023"
        },
        {
          "name": "get_product",
          "title": "Get one Anahana product",
          "description": "Get one Nema by Anahana product by its sku from list_products (e.g. \"complete-guide-en\"): name, type, language, list price, currency, and url — the product's page on anahana.com, the only place to buy it. Paid products carry checkout_note: \"buyers outside the US see a converted price with a 4% conversion fee at checkout\". A sku that is in the catalog but not on sale returns available: false, a definitive answer; do not retry it. Read-only: no checkout, no payment link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "sku": {
                "description": "The product sku from list_products, e.g. \"complete-guide-en\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["sku"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ab6cf13e25863f5468c859c8ec7d5411d9db66263a1b49f9cf4b0ba63c9aec06"
        },
        {
          "name": "list_products",
          "title": "List the Anahana products on sale",
          "description": "List the Nema by Anahana digital products on sale right now (for example angel-number guides and a personalized natal chart report). Each product has its sku, name, type (free_lead_magnet, one_time or bundle), language, list price and currency (e.g. \"11.11\" and \"USD\"), and url: the product's page on anahana.com, the only place to buy it. Paid products also carry checkout_note. Read-only: this server has no checkout or payment tool and never returns a payment link. The list is the site's own catalog, regenerated on every site deploy. Use get_product for one product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "Only products in this language, e.g. \"en\". One code, a comma-separated list, or \"all\". Omit to list every product on sale, in every language.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:92f9909a0338f899d9c4dea9d9677129d586e7411a3365e696be9ba15d16612f"
        },
        {
          "name": "lookup_angel_number",
          "title": "Resolve an angel number to its article URL",
          "description": "Resolve a specific angel number (e.g. \"111\", \"1234\", \"22\") to its Anahana article URL, in any of 24 languages. Slugs are English-stable across every language — most numbers are \"<number>-angel-number\"; the single digits 1-9, the master numbers 11/22/.../99, and the outlier 828 use \"angel-number-<number>\" — so only the title and body differ between languages. COVERAGE, however, is not uniform: en/de/es/ru publish 568 distinct numbers, the other 20 languages publish 519, so a number can exist in English and genuinely not exist in Japanese. Existence is therefore always answered against the language you asked for, from an index the site regenerates on every deploy. A well-formed number with no article in that language is a successful result with `exists: false`, a definitive message, `also_published_in` naming the languages that DO have it, and the nearest numbers published in your language — not an error. Do not retry it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "Language to resolve in, e.g. \"ja\". Defaults to \"en\", which is the pre-1.2.0 behavior. Supported codes are listed in _meta.languages_supported.",
                "type": "string"
              },
              "number": {
                "description": "The angel number as digits, e.g. \"111\" or \"828\".",
                "pattern": "^\\d+$",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c40bfe016db2affed431eefde177e0749b32d8ee08d7f3c3149cebe9a0319352"
        },
        {
          "name": "search_content",
          "title": "Search Anahana content",
          "description": "Search Anahana's wellness content — angel numbers, astrology, zodiac, tarot, crystals, yoga, meditation, breathing exercises, mental and physical health, and more — in any of 24 languages. Returns matching articles with title, url, section, language, and a short summary. Matching is KEYWORD/SUBSTRING over title, description, section and slug; it is NOT semantic search, in any language. For zh, ja and th the query is not word-segmented, so it is matched as one substring. The index is regenerated on every site deploy; exact live per-language document counts are in each response's _meta and at https://www.anahana.com/content-index/manifest.json.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "Language to search. Omit for English (the default and the pre-1.2.0 behavior). One code (\"de\"), a comma-separated list (\"de,fr,ja\"), or \"all\" to search every indexed language. Supported codes are listed in _meta.languages_supported: en, de, it, es, nl, fr, sv, pl, cs, fi, hu, ro, ru, da, no, pt, tr, el, id, uk, ja, ko, zh, th. Unrecognized codes are skipped with a note rather than failing.",
                "type": "string"
              },
              "query": {
                "description": "Search keywords, e.g. '111 angel number' or 'box breathing'.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ae640314238311e7a9be8dd6c7fb0ca5245403e8a5a9045f0ab013c82c05c46d"
        }
      ],
      "digest": "sha256:12c7f125347b27b33ef2ff97b5acd2ef9b19ef7b8e8bca3faa21add5b4d88e3f"
    }
  }
