        {
          "name": "get_article",
          "title": "Get an Anahana article as markdown",
          "description": "Fetch a specific Anahana article as markdown, given its full URL, site-relative path (e.g. \"/en/angel-numbers/111-angel-number/\"), or a bare slug from search_content results (e.g. \"111-angel-number\"). Tries two fetch modes against the live site in order: (1) content negotiation — GET the article URL with `Accept: text/markdown`; (2) the path-based markdown mirror at `<article-url>index.md`. Both are live. Page chrome (skip link, table of contents with dead anchors, back-to-top anchor, analytics pixel) is stripped, so what you get back is the article body. If both modes fail, returns a clear error naming the canonical HTML URL instead of silently failing. Works in all 24 languages: a full URL or a site-relative path already names its language, and a bare slug is resolved in the language given by `language` (English by default). Article slugs are identical across languages — only the title and body are translated — so the same slug plus a different `language` gives you the same article in that language.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "Language for a BARE SLUG, e.g. \"ja\". Ignored when url_or_slug is a full URL or a site-relative path, since those already carry their language prefix. Defaults to \"en\".",
                "type": "string"
              },
              "url_or_slug": {
                "description": "Full URL, site-relative path, or bare slug, e.g. \"111-angel-number\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url_or_slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d24d558f7be435f30fb2d874f4c7690d3ef9b672dff494b812301e7e2c9ef023"
        },
        {
          "name": "get_chinese_zodiac",
          "title": "Find a Chinese zodiac animal and element",
          "description": "Find the Chinese zodiac animal and element for a birth year, as Anahana's free Chinese Zodiac Calculator does (by Gregorian year, from 1924). Returns the animal, element, traits (English), the method and the calculator page in the language asked for. The Chinese year starts at Lunar New Year, so for a birthday in January or early February the response's method explains when the previous year's animal applies. Read-only; the year is not stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "birth_year": {
                "description": "The birth year, e.g. 1990.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "language": {
                "description": "Language for the linked pages, e.g. \"de\". One code; defaults to \"en\".",
                "maxLength": 16,
                "type": "string"
              }
            },
            "required": ["birth_year"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:51763311d0a7334beb8bceda6c255b096a1f8c57e276ddc20aa8417a1324a07d"
        },
        {
          "name": "get_product",
          "title": "Get one Anahana product",
          "description": "Get one Nema by Anahana product by its sku from list_products (e.g. \"complete-guide-en\"): name, type, language, list price, currency, and url — the product's page on anahana.com, the only place to buy it. Paid products carry checkout_note: \"checkout on the product page is priced in the listed currency; if that checkout cannot start, a backup Stripe checkout may show a converted local price with a conversion fee\". A sku that is in the catalog but not on sale returns available: false, a definitive answer; do not retry it. Read-only: no checkout, no payment link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "sku": {
                "description": "The product sku from list_products, e.g. \"complete-guide-en\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["sku"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
