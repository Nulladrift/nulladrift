          "digest": "sha256:91d03458019bdcc77f0dd56bab7999f5d3f952027a0d04bb8c3b5a73dfa32f99"
        },
        {
          "name": "list_products",
          "title": "List the Anahana products on sale",
          "description": "List the Nema by Anahana digital products on sale right now (for example angel-number guides and a personalized natal chart report). Each product has its sku, name, type (free_lead_magnet, one_time or bundle), language, list price and currency (e.g. \"4.44\" and \"EUR\"), and url: the product's page on anahana.com, the only place to buy it. Paid products also carry checkout_note. Read-only: this server has no checkout or payment tool and never returns a payment link. The list is the site's own catalog, regenerated on every site deploy. Use get_product for one product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "Only products in this language, e.g. \"en\". One code, a comma-separated list, or \"all\". Omit to list every product on sale, in every language.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
