      "serverInfo": {
        "name": "semscraper",
        "title": "Semscraper",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Semscraper is a SERP API: it collects real Google Search and Google Maps result pages, rendered in a real browser, and returns them as structured data.\n\nUse google_search to know what Google actually shows for a query: every block (organic results, ads, local pack, People Also Ask, AI Overview with its citations and sources...), with rank in block (rank_type), rank on the page (rank_serp), Google page and pixel position. Use google_maps for Google Maps listings.\nlocation and language form a Google version: fr/fr for google.fr, us/en for google.com, de/de, es/es, it/it, br/pt for google.com.br, jp/ja for google.co.jp. Use list_google_versions when unsure.\ngeolocation narrows the search to a city (\"City, Region, Country\") or a GPS position (\"latitude,longitude\").\n\nSearches are paid from the user's balance when they are created (about EUR 0.0003 per keyword for page 1, EUR 0.0002 per extra page): send one call with all the keywords rather than many calls.\nData takes time: about 30 seconds for one keyword, a minute for 10 pages, several minutes for a large batch, because every page is rendered in a real browser. Each call waits at most 55 seconds, then returns pending_ids: call get_serp_results with them, again and again if needed, until every search is done. Tell the user it may take a few minutes.\nNever run a search again because it is still pending, failed or timed out: it is already paid. If a call errored or its answer was lost, call list_searches first and fetch those IDs with get_serp_results. list_searches is also the way to answer questions like \"list my last 10 searches\".\nThis makes Semscraper a fit for research, monitoring, datasets and evaluation, not for answers needed within a second.\nTo know where one site ranks, pass domain to google_search or get_serp_results: you get only its positions, not whole SERPs. To know which sites Google cites in its AI Overviews over many keywords, run google_search, then ai_overview_sources with the IDs.\nResults carry titles, snippets and URLs, not the full text of the pages: fetch the URLs yourself if you need their content.",
      "tools": [
        {
          "name": "ai_overview_sources",
          "title": "AI Overview sources",
          "description": "Computes, on the server, which domains Google cites in the AI Overviews of searches already created (google_search IDs): for each domain, the number of keywords where it is cited, the number of mentions, the keywords and its best position on the page. Also returns how many searches have an AI Overview. Free. Best tool to answer \"which sites does Google cite in its AI Overviews on these keywords\": one small answer instead of every SERP. Based on source URLs, not on brand names.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ids": {
                "description": "IDs of google_search searches (serp_...).",
                "items": {
                  "pattern": "^serp_[A-Za-z0-9]+$",
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "top": {
                "default": 50,
                "description": "Number of domains returned, most cited first.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "wait_seconds": {
                "default": 45,
                "description": "How long to wait for searches still running, in seconds (default 45, max 55).",
                "maximum": 55,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
