          },
          "digest": "sha256:d49ce3c74db0e37efdffd5cb111d3df7178efff142585018277ca2ff20189ce8"
        },
        {
          "name": "get_serp_results",
          "title": "Get results by ID",
          "description": "Returns searches already created (google_search or google_maps), by their IDs (serp_...), e.g. the pending_ids of a previous call. Free: the searches were paid when created.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "blocks": {
                "description": "Only return these result blocks, e.g. [\"organic\"] or [\"ai_overview*\"] (a trailing * matches a prefix). Block types: organic, paid_top, paid_bottom, local_pack, people_also_ask, featured_snippet, knowledge_graph, top_stories, videos, images, shopping, sitelinks, ai_overview_citation, ai_overview_citation_source, ai_overview_panel, related_searches...",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "description": "Only return the positions of this domain (e.g. \"example.com\", subdomains included) in every block, with its best organic rank and whether it appears in the AI Overview, instead of the whole SERP. Much shorter: use it to answer \"where does this site rank\".",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "ids": {
                "description": "IDs returned by a previous search (serp_...).",
                "items": {
                  "pattern": "^serp_[A-Za-z0-9]+$",
                  "type": "string"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "max_items_per_block": {
                "description": "Maximum number of items returned per block, to keep the answer short.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "wait_seconds": {
                "default": 45,
                "description": "How long this call waits for searches still running, in seconds (default 45, max 55). Call again while pending_ids remain.",
                "maximum": 55,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f1973f2fb9556f13c4c2036b13c4298354e3f19f02b2cbd1b156013fb2b4b132"
        },
        {
          "name": "google_maps",
          "title": "Google Maps results",
          "description": "Collects the listings of a Google Maps search for one or more keywords, in the order Google Maps shows them, from a given place. Each listing comes with its rank, name (title), CID, category (type), address, website, rating, review count, opening status and the snippet shown. Use it for local SEO, local competition and market research. Paid from the account balance, same price as google_search. Returns rating and review count, not the full text of reviews.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "depth": {
                "default": 1,
                "description": "Number of Google result pages to collect, 1 (about 10 results) to 10 (about 100). Each extra page costs more and takes longer.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "domain": {
                "description": "Only return the positions of this domain (e.g. \"example.com\", subdomains included) in every block, with its best organic rank and whether it appears in the AI Overview, instead of the whole SERP. Much shorter: use it to answer \"where does this site rank\".",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "geolocation": {
                "description": "Place the search is made from: \"City, Region, Country\" or \"latitude,longitude\", with an optional zoom suffix (\"43.7102,7.2620,16z\"). Strongly recommended: Maps results depend on the location.",
                "maxLength": 200,
                "type": "string"
              },
              "keywords": {
                "description": "Keywords to search, one search per keyword (max 100). Google operators work (site:, inurl:, intitle:, quotes, -term). No comma inside a keyword.",
                "items": {
                  "maxLength": 500,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Interface language code, e.g. fr, en, de, es, it, pt, ja. Must form a valid pair with location (see list_google_versions).",
                "maxLength": 3,
                "minLength": 2,
                "type": "string"
              },
              "location": {
                "description": "Google version as a country code: fr for google.fr, de for google.de, br for google.com.br, jp for google.co.jp, us for google.com. Must form a valid pair with language (see list_google_versions).",
                "maxLength": 3,
                "minLength": 2,
                "type": "string"
              },
              "max_items_per_block": {
                "description": "Maximum number of items returned per block, to keep the answer short.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "description": "Priority in the account queue, 1 to 10 (10 first). Use a high value for a few urgent searches when a large batch is already running.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "wait_seconds": {
                "default": 45,
                "description": "How long this call waits for the results, in seconds (default 45, max 55). Searches still running are returned in pending_ids: fetch them with get_serp_results. Use 0 to start a large batch and return right away.",
                "maximum": 55,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["keywords"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1e7eba1c5236b3dccdc643dd437882d0e9a28e515ed021e784648444fb7e5bba"
        },
        {
          "name": "google_search",
          "title": "Google Search results",
          "description": "Collects the real Google results page (SERP) for one or more keywords, rendered in a real browser, and returns every block (organic results, ads, local pack, People Also Ask, AI Overview with its citations and sources...) with, for each item, its rank in its block (rank_type), its rank on the page (rank_serp), its Google page and its pixel position. Use it to know what Google actually shows for a query, in a given country, language, city and device. Paid from the account balance: about EUR 0.0003 per keyword for the first page, EUR 0.0002 per extra page. Takes about 30 seconds per keyword (about a minute for 10 pages); the tool waits for the results. Returns titles, snippets and URLs, not the full content of the pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "blocks": {
                "description": "Only return these result blocks, e.g. [\"organic\"] or [\"ai_overview*\"] (a trailing * matches a prefix). Block types: organic, paid_top, paid_bottom, local_pack, people_also_ask, featured_snippet, knowledge_graph, top_stories, videos, images, shopping, sitelinks, ai_overview_citation, ai_overview_citation_source, ai_overview_panel, related_searches...",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "depth": {
                "default": 1,
                "description": "Number of Google result pages to collect, 1 (about 10 results) to 10 (about 100). Each extra page costs more and takes longer.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "device": {
                "default": "desktop",
                "description": "Device to emulate.",
                "enum": ["desktop", "mobile"],
                "type": "string"
              },
              "domain": {
                "description": "Only return the positions of this domain (e.g. \"example.com\", subdomains included) in every block, with its best organic rank and whether it appears in the AI Overview, instead of the whole SERP. Much shorter: use it to answer \"where does this site rank\".",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "geolocation": {
                "description": "Optional city-level geolocation: \"City, Region, Country\" (e.g. \"Lyon, Rhone, France\") or a GPS position \"latitude,longitude\" (e.g. \"43.7102,7.2620\").",
                "maxLength": 200,
                "type": "string"
              },
              "keywords": {
                "description": "Keywords to search, one search per keyword (max 100). Google operators work (site:, inurl:, intitle:, quotes, -term). No comma inside a keyword.",
                "items": {
                  "maxLength": 500,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "description": "Interface language code, e.g. fr, en, de, es, it, pt, ja. Must form a valid pair with location (see list_google_versions).",
                "maxLength": 3,
                "minLength": 2,
                "type": "string"
              },
              "location": {
                "description": "Google version as a country code: fr for google.fr, de for google.de, br for google.com.br, jp for google.co.jp, us for google.com. Must form a valid pair with language (see list_google_versions).",
                "maxLength": 3,
                "minLength": 2,
                "type": "string"
              },
              "max_items_per_block": {
                "description": "Maximum number of items returned per block, to keep the answer short.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "priority": {
                "description": "Priority in the account queue, 1 to 10 (10 first). Use a high value for a few urgent searches when a large batch is already running.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "wait_seconds": {
                "default": 45,
                "description": "How long this call waits for the results, in seconds (default 45, max 55). Searches still running are returned in pending_ids: fetch them with get_serp_results. Use 0 to start a large batch and return right away.",
                "maximum": 55,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["keywords", "language", "location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:28acd4aa6a57c7d0ece00addb7a03dafabc82c8dac92e1674e4ff6a80635a889"
        },
        {
          "name": "list_google_versions",
          "title": "Google versions",
          "description": "Lists the supported Google versions as location / language pairs (186 Google domains, 117 languages), to pick valid location and language values. Free. Filter with a country domain, a code or a language name to keep the answer short.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "filter": {
                "description": "Text to look for in the domain, codes or language name, e.g. \"google.de\", \"br\", \"Deutsch\".",
                "maxLength": 50,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f3768c0cb29f91320c3544a9a7be4d07ea9ea3f380cbd8f605b20b0c721ed1fb"
        },
        {
          "name": "list_searches",
          "title": "Search history",
          "description": "Lists the searches of the account, most recent first (ID, engine, keyword, device, location, language, depth, geolocation, status, whether the results were already fetched, cost, creation date), without their results. Free. Covers every search made with the account, through this server or the API. Use it to find IDs (e.g. \"the last 10 searches\", \"today's searches\"), and whenever a google_search or google_maps call failed, timed out or lost its answer: the searches were probably created and paid already, so fetch them with get_serp_results instead of searching again.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cursor": {
                "description": "next_cursor from a previous call, to get the following page.",
                "maxLength": 100,
                "type": "string"
              },
              "date": {
                "description": "Only the searches created that day, format YYYY-MM-DD (server time, Europe/Paris).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Number of searches returned (default 20).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Only the searches with this status.",
                "enum": ["pending", "processing", "done"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:afd4c71ae3072aeee05021313d7c065c98170051fd0076a5cb719d13b740fb11"
        }
      ],
      "digest": "sha256:d70c690e33cbbde612959d2b76ebe9aa374a20994f88ca0e5f798794205f3a86"
    }
  }
