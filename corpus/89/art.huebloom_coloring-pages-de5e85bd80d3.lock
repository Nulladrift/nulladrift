{
  "lockfileVersion": 2,
  "subjects": {
    "art.huebloom/coloring-pages": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.huebloom.art/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "huebloom-coloring-pages",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Find existing printable coloring pages from Huebloom. Search with short English topic keywords (translate requests when needed), then get a selected page for its PDF link. Preserve original source and licensing links. Do not invent availability, age ratings or commercial permissions.",
      "tools": [
        {
          "name": "get_coloring_page",
          "title": "Get a printable coloring page",
          "description": "Get a public coloring page by its exact slug from search results, including preview, original source, PDF download link and licensing policy. Does not download PDF bytes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "maxLength": 180,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8b7e2ded2e26b5eaec0bc6bb020d48e67e3cf2efecb169e982cb50434891f382"
        },
        {
          "name": "list_collections",
          "title": "Browse coloring page collections",
          "description": "List visible collections, optionally filtered by group. Supply both group and category to browse that collection’s actual active page feed. Counts represent distinct pages in that feed. Use returned identifiers verbatim.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "$ref": "#/properties/group"
              },
              "group": {
                "maxLength": 180,
                "minLength": 1,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:10f386f3ab0c9b8708552f3e07773d275d95afdd7a48e9831e7a544615f734c8"
        },
        {
          "name": "search_coloring_pages",
          "title": "Find printable coloring pages",
          "description": "Search currently published Huebloom coloring pages by English topic keywords. Returns bounded previews and source links. Use get_coloring_page for a selected PDF download. Age and difficulty are not verified filters.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:db277a76ef42caeacbcf8fb1ce647ce8b03de9a90bdb45387616ecbd8f4f0e41"
        }
      ],
      "resources": [
        {
          "uri": "agent-tools://ownership",
          "name": "agent-tools-ownership",
          "title": "Agent Tools ownership verification",
          "mimeType": "application/json",
          "digest": "sha256:0e47e9a67ce9e5e2cf7293cee6e87614599e1fbc5ebf81eb4f7d3880deee1323"
        },
        {
          "uri": "huebloom://usage",
          "name": "usage",
          "title": "Huebloom MCP usage and licensing",
          "mimeType": "text/plain",
          "digest": "sha256:50160317002ee2748a475ca1b91840bec2e54981f4c478baff15aa5960a01c56"
        }
      ],
      "digest": "sha256:7a079bbd484bd710d59fd24c51ad7df02551ad0b2495825e93b0ad36fcd83ab0"
    }
  }
}
