        {
          "name": "create_booking",
          "title": "Request a booking",
          "description": "Request a service at a time. Check availability first. endTime and reservationFor.name may be left out: they follow from the service (its length, its name). A fixed-price service costs the business's price from list_services; a different totalPrice you send is only noted for the business. A priced booking binds your person only once they confirmed it: without terms_sha nothing is sent, and you get the summary to show them (confirm.summary, confirm.terms_sha); call again with that terms_sha on their clear yes. Returns the item and, if you have no account, an access_token.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attachments": {
                "description": "Photos or plans of the job: JPEG, PNG, WebP or PDF, at most six of 10 MB each. Inline up to 4 MB each (8 MB a call), else by https address or upload_id. HEIC photos: send them as JPEG. Images are cleaned of where they were taken; a PDF is kept as sent.",
                "items": {
                  "anyOf": [
                    {
                      "properties": {
                        "upload_id": {
                          "description": "What POST /v1/uploads answered, within its hour.",
                          "pattern": "^upl_[A-Za-z0-9_-]{16,48}$",
                          "type": "string"
                        }
                      },
                      "required": ["upload_id"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "data_base64": {
                          "description": "The file's bytes in base64: JPEG, PNG, WebP or PDF, up to 4 MB (8 MB in one call).",
                          "maxLength": 5592412,
                          "minLength": 4,
                          "type": "string"
                        },
                        "name": {
                          "description": "The file's name, for the business to recognise it.",
                          "maxLength": 200,
                          "type": "string"
                        }
                      },
                      "required": ["data_base64"],
                      "type": "object"
                    },
                    {
                      "properties": {
                        "name": {
                          "maxLength": 200,
                          "type": "string"
                        },
                        "url": {
                          "description": "An https address the file can be fetched from, up to 10 MB.",
                          "format": "uri",
                          "maxLength": 2048,
                          "type": "string"
                        }
                      },
                      "required": ["url"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 6,
                "type": "array"
              },
              "contact": {
                "properties": {
                  "email": {
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "locale": {
                    "maxLength": 12,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "idempotency_key": {
                "description": "Same key + same request = same answer. Required for agents. Make it a fresh random UUID per request: a retry of a create with a random key gets its access token again.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "description": "The person's key (sdkey1_…), if that is all you have: it is exchanged once for a pass, which comes back in identity.passes — keep the pass and send it next time instead. Never stored.",
                "maxLength": 200,
                "type": "string"
              },
              "message": {
                "maxLength": 20000,
                "type": "string"
              },
              "pass": {
                "description": "The person's passes (sdpass1_…), space-separated, at most 8: presented to the network that issued each, so the business recognises the customer. Or send them in the Sdi-Pass header. Never stored.",
                "maxLength": 1608,
                "type": "string"
              },
              "payload": {
                "properties": {
                  "deposit": {
                    "properties": {
                      "amount": {
                        "properties": {
                          "currency": {
                            "maxLength": 3,
                            "minLength": 3,
                            "type": "string"
                          },
