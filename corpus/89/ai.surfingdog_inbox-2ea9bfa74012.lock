              "access_token": {
                "description": "Capability secret returned when the item was created without an account.",
                "maxLength": 200,
                "minLength": 16,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Same key + same request = same answer. Required for agents. Make it a fresh random UUID per request: a retry of a create with a random key gets its access token again.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "item_id": {
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "description": "The person's key (sdkey1_…), if that is all you have: it is exchanged once for a pass, which comes back in identity.passes — keep the pass and send it next time instead. Never stored.",
                "maxLength": 200,
                "type": "string"
              },
              "note": {
                "description": "Anything your person wants the business to know.",
                "maxLength": 2000,
                "type": "string"
              },
              "offer_id": {
                "description": "The offer you answer: offer.id from get_item_status. If the business has replaced it since, nothing is done (409 offer_changed, with the current one).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "pass": {
                "description": "The person's passes (sdpass1_…), space-separated, at most 8: presented to the network that issued each, so the business recognises the customer. Or send them in the Sdi-Pass header. Never stored.",
                "maxLength": 1608,
                "type": "string"
              },
              "reason_code": {
                "description": "Why: price_sensitivity, timing_deferred, quantity, delivery, returns_policy or other.",
                "enum": ["price_sensitivity", "timing_deferred", "quantity", "delivery", "returns_policy", "other"],
                "type": "string"
              },
              "terms": {
                "description": "Only what your person would change.",
                "properties": {
                  "delivery_when": {
                    "description": "Another delivery date, for an order.",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  },
                  "lines": {
                    "description": "For changes the business suggested to an order: other quantities for its lines, by index in offer.terms.lines; 0 drops a line. unit_price, a price of your own for a line, only where the business's profile says price_negotiable.",
                    "items": {
                      "properties": {
                        "index": {
                          "maximum": 199,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "quantity": {
                          "maximum": 1000000,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "unit_price": {
                          "properties": {
                            "currency": {
                              "maxLength": 3,
                              "minLength": 3,
                              "type": "string"
                            },
                            "value": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            }
                          },
                          "required": ["currency", "value"],
                          "type": "object"
                        }
                      },
                      "required": ["index", "quantity"],
                      "type": "object"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "party_size": {
                    "description": "Another number of people.",
                    "maximum": 1000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "quantity": {
                    "description": "How many, for a quote request.",
                    "maximum": 1000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "start_time": {
                    "description": "Another start: for a booking, one of the free times check_availability lists (the end follows the service's length); for a quote request, the time it is for.",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  },
                  "total_price": {
                    "description": "A price of your own for a time the business proposed. Taken as your answer only where the business's profile says price_negotiable; otherwise it goes to a person there as your message, and what it proposed still stands.",
                    "properties": {
                      "currency": {
                        "maxLength": 3,
                        "minLength": 3,
                        "type": "string"
                      },
                      "value": {
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "required": ["currency", "value"],
                    "type": "object"
                  }
                },
                "type": "object"
              }
            },
            "required": ["item_id", "terms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
