                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          }
                        },
                        "required": ["currency", "value"],
                        "type": "object"
                      },
                      "steps": {
                        "description": "Cancelling before `until` costs `fee`; the steps are in order.",
                        "items": {
                          "properties": {
                            "fee": {
                              "properties": {
                                "currency": {
                                  "maxLength": 3,
                                  "minLength": 3,
                                  "type": "string"
                                },
                                "value": {
                                  "description": "Minor units of the currency's own ISO 4217 exponent (minorUnits): 4500 is CA$45.00 or ₹45.00, ¥4,500 in JPY, 4.500 in KWD.",
                                  "maximum": 9007199254740991,
                                  "minimum": -9007199254740991,
                                  "type": "integer"
                                }
                              },
                              "required": ["currency", "value"],
                              "type": "object"
                            },
                            "until": {
                              "format": "date-time",
                              "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                              "type": "string"
