{
  "lockfileVersion": 2,
  "subjects": {
    "ai.surfingdog/inbox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://inbox.surfingdog.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Surfing Dog",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This is a business's typed inbox. Start with get_business_profile, then list_services or list_products. For a booking: check_availability, then create_booking at one of its free times (leave endTime out and it follows the service's length), with an idempotency_key you generate and keep: a fresh random UUID for each new request, never one made from the request itself. Keep the access token in a create result (accessToken): it is the only way to read (get_item_status) or cancel that item later. Every tool takes it as access_token or accessToken, and service_id as serviceId too. If the answer is lost, send the same request with the same random idempotency_key and the token comes back; a guessable key (booking-1) never gets it again. If you carry a pass for the person (sdpass1_…), send it in `pass` on every call, and keep any pass a result hands you (identity.passes). The person is writing to this business and may never have heard of passes: speak to them of the business. The guide: https://surfingdog.ai/for-agents.md. Every refusal names the exact fields to fix; repair the input and retry with the same idempotency_key. When get_item_status shows an offer (another time, a quote, or changes to an order), relay offer.human as the business said it; accept only on your person's clear yes to the summary: accept_offer with its terms_sha and offer_id. Otherwise decline_offer, or make_offer with only what they would change (suggest_time for another time). A price of their own is their answer only where get_business_profile says price_negotiable; otherwise it goes to a person at the business, and what it proposed still stands. When it waits for details, send them with provide_details. A confirmed booking or an accepted order can change: suggest_time (another time) or make_offer (quantities, a delivery date) asks the business, and what was agreed stands until it says yes (requested_change shows it; decline_offer takes it back). When the business asks for a change (offer.kind change), accept_offer takes it and decline_offer keeps what was agreed. get_item_status also carries the conversation (thread): what the business wrote to your person, and what they wrote. Relay the business's replies as they are; a reply marked automated was not written by a person. A booking or an order that carries a price binds your person only once they confirmed it: create_booking and create_order without terms_sha answer with the summary to show them (confirm); call again with its terms_sha on their clear yes. Where the business states a period to withdraw (withdrawal on get_item_status), your person may withdraw from a paid booking or an order within it: withdraw_from_contract shows the statement first; send confirm_withdrawal on their yes. Once the goods reached them, request_return asks to send them back (faulty goods cost them nothing).",
      "tools": [
        {
          "name": "accept_offer",
          "title": "Accept what the business proposed",
          "description": "Accept another time the business proposed for a booking, its quote, its changes to an order, or a change it asks for to a confirmed booking or an accepted order (offer.kind change: the promise moves). This binds your person, so send terms_sha — offer.terms_sha from get_item_status — only after they said yes to offer.human, and offer_id (offer.id) so an answer to an offer since replaced does nothing. Without terms_sha nothing is booked: you get the terms to show them. An accepted quote becomes a confirmed booking or order (linked). A yes to a change that can no longer be made online goes to a person there instead (passed_on), and what was agreed stands.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_token": {
                "description": "Capability secret returned when the item was created without an account.",
                "maxLength": 200,
                "minLength": 16,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Same key + same request = same answer. Required for agents. Make it a fresh random UUID per request: a retry of a create with a random key gets its access token again.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "item_id": {
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "description": "The person's key (sdkey1_…), if that is all you have: it is exchanged once for a pass, which comes back in identity.passes — keep the pass and send it next time instead. Never stored.",
                "maxLength": 200,
                "type": "string"
              },
              "offer_id": {
                "description": "The offer you answer: offer.id from get_item_status. If the business has replaced it since, nothing is done (409 offer_changed, with the current one).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "pass": {
                "description": "The person's passes (sdpass1_…), space-separated, at most 8: presented to the network that issued each, so the business recognises the customer. Or send them in the Sdi-Pass header. Never stored.",
                "maxLength": 1608,
                "type": "string"
              },
              "terms_sha": {
                "description": "The fingerprint of the terms your person said yes to: offer.terms_sha from get_item_status. Leave it out to be told the terms first; nothing is booked without it.",
                "pattern": "^[A-Za-z0-9_-]{43}$",
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f427883cd5bc1d65eb7882a6c51f433a78c4413eb16bb7a00ebaba9f4a508c87"
        },
        {
          "name": "acknowledge_receipt",
          "title": "Acknowledge a receipt",
          "description": "Counter-sign a receipt this item earned, so both sides hold it: a promise, a change both sides agreed to it (kind amended), how it ended, or a refund's. Read the item to find its receipts; then send a compact JWS signed with your own Ed25519 key — header {alg:'EdDSA', typ:'sdi-receipt-ack+jws', jwk:<your public jwk>}, payload {rcp:<receipt id>, sha:<base64url(SHA-256(receipt jws))>, iat:<unix seconds>}. The instance verifies it against the key you carry and keeps it. Acknowledging twice is harmless.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_token": {
                "description": "Capability secret returned when the item was created without an account.",
                "maxLength": 200,
                "minLength": 16,
                "type": "string"
              },
              "counter_signature": {
                "description": "A compact JWS by the customer's agent, EdDSA, header carrying its Ed25519 public `jwk`, payload `{\"rcp\": \"<receipt id>\", \"sha\": \"<base64url(SHA-256(receipt JWS))>\", \"iat\": <unix seconds>}`. Or, for an agent that signs its requests instead (sdi-agent/1) and carries a pass reference, `receipt_id` alone.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "item_id": {
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "description": "The person's key (sdkey1_…), if that is all you have: it is exchanged once for a pass, which comes back in identity.passes — keep the pass and send it next time instead. Never stored.",
                "maxLength": 200,
                "type": "string"
              },
              "pass": {
                "description": "The person's passes (sdpass1_…), space-separated, at most 8: presented to the network that issued each, so the business recognises the customer. Or send them in the Sdi-Pass header. Never stored.",
                "maxLength": 1608,
                "type": "string"
              },
              "receipt": {
                "description": "The receipt JWS being acknowledged, if you want the instance to check it is the one it holds.",
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              },
              "receipt_id": {
                "description": "The receipt to acknowledge, for an agent that signs this request (sdi-agent/1) with a key delegated to the pass reference it sends: the inbox forwards the signature to the network (ADR-017 §3.4). Send this or counter_signature.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2ffb3cc17e3c0575b2b1f7b7a9d140194026df4537a81cbc0785147bc5c7c22b"
        },
        {
          "name": "cancel_item",
          "title": "Cancel",
          "description": "Cancel an item you created. After the business's cancellation window, a confirmed booking is cancelled late where the business records late cancellations (it may count against the customer), and refused where it does not. A confirmed stay answers first with the fee under its policy and what is owed back (confirm): send its fee_sha once your person said yes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access_token": {
                "description": "Capability secret returned when the item was created without an account.",
                "maxLength": 200,
                "minLength": 16,
                "type": "string"
              },
              "fee_sha": {
                "description": "A confirmed stay: the fingerprint of the cancellation fee your person saw (details.fee_sha of the 409 confirm_terms a cancel without it gets).",
                "pattern": "^[A-Za-z0-9_-]{43}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Same key + same request = same answer. Required for agents. Make it a fresh random UUID per request: a retry of a create with a random key gets its access token again.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "item_id": {
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "description": "The person's key (sdkey1_…), if that is all you have: it is exchanged once for a pass, which comes back in identity.passes — keep the pass and send it next time instead. Never stored.",
                "maxLength": 200,
                "type": "string"
              },
              "pass": {
                "description": "The person's passes (sdpass1_…), space-separated, at most 8: presented to the network that issued each, so the business recognises the customer. Or send them in the Sdi-Pass header. Never stored.",
                "maxLength": 1608,
                "type": "string"
              },
              "reason": {
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["item_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e467703c57444198ee0565c4465c146796899aa3760a1cc573bf6d60ac5082f5"
