      },
      "transport": {
        "type": "http",
        "url": "https://api.youraitools.co/transcribe/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "transcribe",
        "title": "Transcribe by YourAITools",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "One paid tool, transcribe_audio: $0.003 per started audio minute (no free tier). Call it without payment to get the exact x402 quote for your file, then pay with params._meta[\"x402/payment\"] or a prepaid credits key.",
      "tools": [
        {
          "name": "transcribe_audio",
          "title": "Transcribe audio (speech-to-text)",
          "description": "Speech-to-text for a public MP3, WAV, M4A or OGG/Opus file (audio_url, up to 30 minutes): transcript, detected language, timestamped segments and optional SRT/VTT subtitles (format=srt|vtt); task=translate returns English. Paid only, no free tier: $0.003 per started audio minute (minimum 1). Call without payment to get the exact quote for your file (x402 payment terms); then retry with params._meta[\"x402/payment\"] or a prepaid credits key (Authorization: Bearer yatc_...). Charged only when a transcript is returned. Not for FLAC or WebM (convert first).",
          "inputSchema": {
            "properties": {
              "audio_url": {
                "description": "Public https URL of an MP3, WAV, M4A or OGG/Opus file (up to 30 minutes / 30 MB).",
                "type": "string"
              },
              "format": {
                "description": "json (default); srt or vtt also returns subtitles in the srt / vtt field",
                "enum": ["json", "srt", "vtt"],
                "type": "string"
              },
              "language": {
                "description": "Optional ISO 639-1 code of the spoken language (e.g. en, es, de); detected when omitted",
                "type": "string"
              },
              "prompt": {
                "description": "Optional context words or spellings (max 500 chars)",
                "type": "string"
              },
              "task": {
                "description": "transcribe (default) or translate (to English)",
                "enum": ["transcribe", "translate"],
                "type": "string"
              },
              "vad": {
                "description": "Skip silence with voice activity detection (default false)",
                "type": "boolean"
              }
            },
            "required": ["audio_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Transcribe audio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b02a00a7932dccdc2357be5f25ae3214ca95988baf110d49e7f456949896c67b"
        }
      ],
