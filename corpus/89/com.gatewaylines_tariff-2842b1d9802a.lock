      "serverInfo": {
        "name": "gateway-tariff-calculator",
        "title": "Gateway Tariff Calculator",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Gateway Lines answers US import duty questions from its own tariff engine. For \"what will this cost to import\", call landed_cost. If you do not have an exact HTS code, pass the product description: the tool will return candidate codes instead of a price, because the classification decides the duty and the tariff schedule classifies by what an article IS rather than what it is made of. Show the candidates to the user, let them confirm, then call landed_cost again with hts_code. Never present a duty figure for a code you guessed. Finding codes (classify_hts, or landed_cost with a product) and reading policy changes are free; only a priced duty uses a guest lookup. Every figure returned is a planning estimate, not a customs ruling, and the disclaimer in each response should be passed on to the user. If a tool returns an error, and in particular if it reports that the guest lookup allowance is used up, that is the answer: report it to the user and stop. Do not compute duty yourself, do not estimate, and do not reuse or adapt figures from an earlier answer in the conversation to stand in for a lookup that did not run. US duty depends on product carve-outs and stacking rules that are not derivable outside this engine, so a number attributed to Gateway that Gateway did not produce is worse than no answer.",
      "tools": [
        {
          "name": "classify_hts",
          "title": "Find HTS classification codes",
          "description": "Find the US Harmonized Tariff Schedule classification for a product. Returns candidate HTS codes with their official descriptions and base duty rates. Use when the user wants the code itself rather than a cost. Not charged: it does not use a duty lookup.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Product description, e.g. \"cotton t-shirts\" or \"lithium ion batteries\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclaimer": {
                "type": "string"
              },
              "gateway": {
                "type": "string"
              },
              "guest_allowance": {
                "type": "string"
              },
              "guest_lookups_remaining": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "results": {
                "description": "Candidates ranked by text match, not a classification ruling.",
                "items": {
                  "properties": {
                    "base_duty_rate": {
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": "string"
                    },
                    "hts_code": {
                      "type": "string"
                    },
                    "priceable": {
                      "description": "False for 4 and 6 digit headings, which carry no rate and cannot be priced.",
                      "type": "boolean"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              },
              "warning": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find HTS classification codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d01a8b939196cd062a579f71c1b678530993559b009145afcb5cb362e2016244"
        },
        {
          "name": "landed_cost",
          "title": "Calculate landed cost and import duty",
          "description": "Calculate US import duty and landed cost estimates. Give hts_code when you know it and this returns the calculated base duty and trade actions (Section 301, Section 232, Section 338, AD/CVD and others), estimated duty, fees and import cost. When estimate_status is partial, part of the duty is undetermined (AD/CVD deposits, or a per-unit duty that needs a quantity) and the amounts are provisional; convey that the estimate is incomplete, and read duty_total_bound for whether the total is a minimum. Give product instead and it returns candidate HTS codes WITHOUT pricing, because the classification decides the duty and guessing it produces confidently wrong numbers: confirm the right code with the user, then call again with hts_code. The candidate step is not charged, and neither is the same lookup repeated within ten minutes.",
          "inputSchema": {
            "properties": {
              "country_code": {
                "description": "ISO 2-letter country of ORIGIN (where the goods were made), e.g. \"CN\", \"CA\", \"VN\".",
                "type": "string"
              },
              "declared_value": {
                "description": "Customs value of the shipment in USD.",
                "type": "number"
              },
              "entry_date": {
                "description": "Optional: the date the goods will be entered, YYYY-MM-DD (US Eastern time), today or later. Default today.",
                "type": "string"
              },
              "hts_code": {
                "description": "Exact HTS rate line, 8 or 10 digits, e.g. \"9403.20.00.50\". Takes precedence over product. 4 and 6 digit headings cannot be priced.",
                "type": "string"
              },
              "product": {
                "description": "Plain description, e.g. \"outdoor metal furniture\". Returns candidate codes to confirm, does not price. Provide this OR hts_code.",
                "type": "string"
              },
              "quantity": {
                "description": "Optional: the quantity, for lines whose duty is charged per unit (per kg, per dozen, per pair and so on). Without it that part of the duty is not priced and the total is a minimum. Send with quantity_unit.",
                "type": "number"
              },
              "quantity_unit": {
                "description": "Optional, with quantity: kg, g, lb, each, dozen, pair, liter, m, m2, m3, cm, gross, head or barrel. Must be the unit the duty is charged in (duty_breakdown.base_duty.unit); convert first if it differs.",
                "type": "string"
              },
              "shipment_mode": {
                "description": "Optional: \"ocean\" (default), \"air\" or \"truck\" (a land border crossing from Canada or Mexico). Affects government fees only: only ocean pays the harbor maintenance fee and files an ISF.",
                "type": "string"
              }
            },
            "required": ["country_code", "declared_value"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "adcvd_supplier": {
                "description": "Supplier deposit evidence when supplied by the calculation: reviewed entry date, matched legal identities, rules, effective windows, official sources, and cases actually included. A matched case does not establish complete all-orders coverage.",
                "type": ["object", "null"]
              },
              "candidates": {
                "description": "Candidate HTS lines to confirm, present only when needs_classification is true.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "country": {
                "description": "Country of origin, as resolved.",
                "type": "object"
              },
              "declared_value": {
                "description": "Customs value used, in USD.",
                "type": "number"
              },
              "description": {
                "description": "Official description of that line.",
                "type": ["string", "null"]
              },
              "disclaimer": {
                "description": "Planning estimate, not a customs ruling. Pass this on to the user.",
                "type": "string"
              },
              "duty_breakdown": {
                "description": "Every trade action considered, keyed by authority (base_duty, section_301, section_232, section_338_canada and the rest). Each carries rate, applies, and often a reason and legal reference. An action with applies false and upcoming true is scheduled but not yet owed.",
                "type": ["object", "null"]
              },
              "duty_total_bound": {
                "description": "exact: every part of the duty is priced (AD/CVD notices may still make it provisional). at_least: a per-unit part is unpriced, so the total is a minimum; give quantity and quantity_unit to price it. unknown: a part is unpriced and the AD/CVD figure may overstate, so the total is neither complete nor a minimum.",
                "enum": ["exact", "at_least", "unknown"],
                "type": "string"
              },
              "duty_total_note": {
                "description": "Present when duty_total_bound is not exact. Pass it to the user.",
                "type": ["string", "null"]
              },
              "estimate_status": {
                "description": "A partial status means part of the duty is undetermined (AD/CVD deposits, or a duty that needs a quantity) and this estimate is incomplete. Pass its message to the user; a zero calculated AD/CVD component does not establish zero liability.",
                "type": ["object", "null"]
              },
              "fta": {
                "description": "A free trade agreement rate the goods may qualify for. Not applied to the total; it requires a claim and proof of origin.",
                "type": ["object", "null"]
              },
              "gateway": {
                "description": "Guest tier only.",
                "type": "string"
              },
              "government_fees": {
                "description": "MPF and HMF, the fees CBP actually collects.",
                "type": ["object", "null"]
              },
              "guest_allowance": {
                "description": "Guest tier only: the allowance in words.",
                "type": "string"
              },
              "guest_lookups_remaining": {
                "description": "Guest tier only: priced duty lookups left in the rolling 7 days.",
                "type": "number"
              },
              "hts_code": {
                "description": "The HTS line the duty was calculated on.",
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "needs_classification": {
                "description": "True when a product description was given instead of a code. Nothing was priced and nothing was charged; show the candidates and ask the user to confirm.",
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "policy_notices": {
                "description": "Source-backed scope and supplier notices affecting use of this estimate.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "quantity": {
                "description": "Quantity used to price a per-unit duty, when one was given.",
                "type": ["number", "null"]
              },
              "quantity_unit": {
                "description": "Unit of that quantity, or the unit the per-unit duty is charged in.",
                "type": ["string", "null"]
              },
              "service_fees": {
                "description": "Filing and handling charges such as ISF. Not government fees; CBP charges nothing to receive an Importer Security Filing.",
                "type": ["object", "null"]
              },
              "source": {
                "type": "string"
              },
              "total_duty_rate_pct": {
                "description": "Calculated duty estimate as a percentage of declared value. Read estimate_status before describing this as a complete estimate.",
                "type": ["number", "null"]
              },
              "total_duty_usd": {
                "description": "Calculated duty estimate in USD. When estimate_status.status is partial, this is provisional and is not the complete payable duty; duty_total_bound says whether it is a minimum.",
                "type": ["number", "null"]
              },
              "total_import_cost_usd": {
                "description": "Calculated duties plus government and service fees, excluding merchandise and freight. Provisional when estimate_status is partial.",
                "type": ["number", "null"]
              },
              "usmca_auto_232_note": {
                "description": "Canada and Mexico vehicles and parts: how a USMCA claim changes the Section 232 auto duty.",
                "type": ["string", "null"]
              },
              "usmca_claim": {
                "description": "Canada and Mexico: the duty with a USMCA claim, which needs the agreement's rules of origin to be met. The main figure is priced WITHOUT a claim; show this beside it, never in place of it.",
                "type": ["object", "null"]
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Calculate landed cost and import duty"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3e6a2f31136bb562801f382d7dbaa3b927cf8426ac6bcac58e55e98dcadce5f4"
        },
        {
          "name": "policy_changes_since",
          "title": "List US trade policy changes",
          "description": "List US trade policy changes Gateway has published since a given date: new tariff actions, rate changes, effective dates and expirations, each with its official source. Also returns, under upcoming, earlier entries for changes announced or proposed but not yet in force. Use to answer \"what changed recently\" or \"what is coming\". Not charged: it does not use a duty lookup.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max entries to return, default 10, max 50.",
                "type": "number"
              },
              "since": {
                "description": "ISO date, e.g. \"2026-07-01\". Filters on when Gateway PUBLISHED the change. Defaults to 30 days ago.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "changes": {
                "items": {
                  "properties": {
                    "affects": {
                      "description": "The products or goods affected.",
                      "type": ["string", "null"]
                    },
                    "countries": {
                      "type": ["string", "array", "null"]
                    },
                    "effective": {
                      "description": "Free text as published, e.g. \"In effect for goods entered on or after...\". Not a date and not parseable as one.",
                      "type": ["string", "null"]
                    },
                    "impact": {
                      "description": "Gateway's risk rating for importers.",
                      "type": ["string", "null"]
                    },
                    "policy_type": {
                      "description": "The trade authority, e.g. Section 232 or Section 301.",
                      "type": ["string", "null"]
                    },
                    "published": {
                      "description": "When Gateway published the entry. This is what `since` filters on.",
                      "type": ["string", "null"]
                    },
                    "source_name": {
                      "description": "The official source, e.g. a Federal Register document or CBP CSMS message.",
                      "type": ["string", "null"]
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "implemented (in force), pending (announced, not yet in force), monitoring (proposed or under review), suspended, removed, reaffirmed or new.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "what_changed": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "number"
              },
              "disclaimer": {
                "type": "string"
              },
              "gateway": {
                "type": "string"
              },
              "guest_allowance": {
                "type": "string"
              },
              "guest_lookups_remaining": {
                "type": "number"
              },
              "since": {
                "description": "The date filtered on, ISO.",
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "upcoming": {
                "description": "Entries published BEFORE `since` that are still pending or monitoring, newest first, so \"what is coming\" is answerable whatever date is asked about.",
                "items": {
                  "properties": {
                    "affects": {
                      "description": "The products or goods affected.",
                      "type": ["string", "null"]
                    },
                    "countries": {
                      "type": ["string", "array", "null"]
                    },
                    "effective": {
                      "description": "Free text as published, e.g. \"In effect for goods entered on or after...\". Not a date and not parseable as one.",
                      "type": ["string", "null"]
                    },
                    "impact": {
                      "description": "Gateway's risk rating for importers.",
                      "type": ["string", "null"]
                    },
                    "policy_type": {
                      "description": "The trade authority, e.g. Section 232 or Section 301.",
                      "type": ["string", "null"]
                    },
                    "published": {
                      "description": "When Gateway published the entry. This is what `since` filters on.",
                      "type": ["string", "null"]
                    },
                    "source_name": {
                      "description": "The official source, e.g. a Federal Register document or CBP CSMS message.",
                      "type": ["string", "null"]
                    },
                    "source_url": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "implemented (in force), pending (announced, not yet in force), monitoring (proposed or under review), suspended, removed, reaffirmed or new.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "type": "string"
                    },
                    "what_changed": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List US trade policy changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
