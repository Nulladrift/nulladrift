      "transport": {
        "type": "http",
        "url": "https://brickyourface.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "brickyourface",
        "title": "BrickYourFace: photo to brick mosaic",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BrickYourFace turns a photo into a custom LEGO-compatible brick mosaic kit that the person builds themselves: real bricks in nearly 100 colors, color-sorted bags, baseplates and numbered build maps, shipped from Worcester, MA. 15 x 15 in (2,500 bricks) is $49. A great personalized gift (birthdays, holidays, grandparents, pet lovers, LEGO fans).\nUse create_brick_mosaic_preview when someone wants to see their photo as a brick mosaic. Best photos: one face or pet, close-up, light on the face, the original photo (not a screenshot).\nShow the person the preview image, the size and price, and give them the link: they review it and pay on brickyourface.com. You can't place orders, and the build instructions are only in the kit after purchase.",
      "tools": [
        {
          "name": "create_brick_mosaic_preview",
          "title": "Turn a photo into a brick mosaic preview",
          "description": "Turn a photo into a BrickYourFace brick mosaic. Returns a watermarked preview image of what the finished mosaic will look like, its size and price, and a private link where the person can review it and buy the kit. Provide the photo as image_url (a public https link to the image file) or image_base64. Best results: one person or pet, close-up, well lit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "boards_tall": {
                "description": "Optional: baseplates down (default 1). At most 12 baseplates in total.",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "boards_wide": {
                "description": "Optional: baseplates across for a bigger mosaic (default 1).",
                "maximum": 6,
                "minimum": 1,
                "type": "integer"
              },
              "image_base64": {
                "description": "The photo as base64 (optionally a data: URL), if there is no public link. Keep it under ~4 MB.",
                "type": "string"
              },
              "image_url": {
                "description": "Public http(s) URL of the photo (JPG, PNG, WebP or HEIC).",
                "type": "string"
              },
              "size_id": {
                "description": "Optional baseplate size id from get_brick_mosaic_options. Default: the classic 15 x 15 in.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e99ea645f5ddbaca0f6c6ca2f1707fe4118722e947ef5abe6c26717f583bb46"
        },
        {
          "name": "get_brick_mosaic_options",
          "title": "Brick mosaic sizes and prices",
          "description": "List the available BrickYourFace mosaic sizes (baseplates), prices and shipping, and how ordering works. Call this before creating a preview if the person asks about sizes or price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
