      "tools": [
        {
          "name": "html_to_pdf",
          "title": "Convert an HTML file to PDF with Chromium",
          "description": "Convert an HTML document up to 4 MB to a PDF with Chromium (Gotenberg).\n\nPass the HTML as base64 in `content_base64`, or as a download link in\n`file`. JavaScript runs, and images, fonts and CSS the HTML links by\npublic https URL are loaded. Returns `{\"download_url\": \"<link>\",\n\"size_bytes\": <PDF size>, \"expires_in_minutes\": 60}`: give the user the\n`download_url`. Requires an API key.\n\nCredits: 1 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The file, base64-encoded. Up to 4 MB before encoding."
              },
              "file": {
                "default": null,
                "description": "The file as a download link, instead of `content_base64`. In ChatGPT, pass the user's uploaded file here. Other clients can set `download_url` to a public https URL.",
                "properties": {
                  "download_url": {
                    "description": "A public https URL of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "An identifier for the file. ChatGPT sets it; other clients may pass any label, such as the file name.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert an HTML file to PDF with Chromium"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            },
            "openai/fileParams": ["file"],
            "securitySchemes": [
              {
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c7cf3811b23e1cd72819aa187b566ef45b42ffb2475474c3f1c26a3f7654acaf"
        },
        {
          "name": "office_to_pdf",
          "title": "Convert office documents to PDF with LibreOffice",
          "description": "Convert an office document up to 4 MB to a PDF with LibreOffice (Gotenberg).\n\nWord, Excel, PowerPoint, OpenDocument and the other formats LibreOffice\nopens. Pass the file as base64 in `content_base64`, or as a download link in\n`file`, and its name in `filename`: the extension tells LibreOffice the\nformat. Returns `{\"download_url\": \"<link>\", \"size_bytes\": <PDF size>,\n\"expires_in_minutes\": 60}`: give the user the `download_url`. Requires\nan API key.\n\nCredits: 1 per call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_base64": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The file, base64-encoded. Up to 4 MB before encoding."
              },
              "file": {
                "default": null,
                "description": "The file as a download link, instead of `content_base64`. In ChatGPT, pass the user's uploaded file here. Other clients can set `download_url` to a public https URL.",
                "properties": {
                  "download_url": {
                    "description": "A public https URL of the file.",
                    "type": "string"
                  },
                  "file_id": {
                    "description": "An identifier for the file. ChatGPT sets it; other clients may pass any label, such as the file name.",
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "filename": {
                "description": "The file name with its extension (.docx, .doc, .odt, .xlsx, .pptx, .rtf, …). LibreOffice reads the file by its extension.",
                "type": "string"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Convert office documents to PDF with LibreOffice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
