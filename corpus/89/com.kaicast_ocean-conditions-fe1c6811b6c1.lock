        {
          "name": "recommend_spot",
          "title": "Recommend spots",
          "description": "Ranked top picks (max 5) for an activity in one area on one day — by region id, or lat+lon with a radius. Each pick has the best daylight window, why (from the published conditions), a confidence score with its factors, caveats, and a KaiCast spot card. Returns status \"not_covered\" / \"conditions_only\" / \"activity_not_modeled\" honestly instead of guessing. Activities: snorkel (native model), dive, freedive, spearfish (proxy model; spots in water closed to spearfishing are excluded), surf (not modeled). Free during early access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "activity": {
                "description": "What the user wants to do.",
                "enum": ["snorkel", "dive", "freedive", "spearfish", "surf"],
                "type": "string"
              },
              "date": {
                "description": "Spot-local day to plan for. Default: today, or tomorrow once today's daylight has passed. Up to 6 days ahead.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lat": {
                "description": "Latitude, decimal degrees. Use with lon.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "How many picks (default 3, max 5).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude, decimal degrees. Use with lat.",
