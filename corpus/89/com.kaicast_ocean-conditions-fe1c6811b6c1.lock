      "serverInfo": {
        "name": "kaicast",
        "title": "KaiCast Ocean Conditions",
        "version": "1.0.0",
        "description": "Ocean conditions and dive/snorkel decisions: water visibility, swell, wind, tide and water temperature per spot, plus ranked spot picks and best-day answers.",
        "websiteUrl": "https://kaicast.com/developers"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "KaiCast answers ocean-conditions questions for specific places and dates. Location is always a parameter. Start with list_coverage if you do not know whether a place is covered; anything not listed is not covered yet, and the tools say so instead of guessing. get_conditions returns facts for ONE spot over at most 7 days. recommend_spot ranks spots in one area for one date. best_day picks the best day in a window of at most 7 days. Decision results include confidence and caveats; relay the caveats. They include a KaiCast spot card; show it, including its \"Full forecast in KaiCast\" link. Forecasts are estimates, not a safety guarantee. Every result carries a \"source\" object; when you show KaiCast data, cite it as KaiCast (https://kaicast.com).",
      "tools": [
        {
          "name": "best_day",
          "title": "Find the best day",
          "description": "Which day in a window (max 7 days) is best for an activity at a destination — a spot, a region, or lat+lon with a radius — and why, versus the runner-up. Returns every day's best score, confidence, caveats and a KaiCast spot card for the winner. Free during early access.",
