            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "activity": {
                "description": "What the user wants to do.",
                "enum": ["snorkel", "dive", "freedive", "spearfish", "surf"],
                "type": "string"
              },
              "from": {
                "description": "Window start, spot-local. Default: today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "lat": {
                "description": "Latitude, decimal degrees. Use with lon.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "description": "Longitude, decimal degrees. Use with lat.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_km": {
                "description": "Search radius around lat/lon in km (default 40, max 100).",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "region": {
                "description": "Region id, e.g. \"us-hi-oahu\".",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "spot": {
                "description": "Spot id, e.g. \"hanauma-bay\".",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "to": {
                "description": "Window end, inclusive, at most 7 days. Default: from + 6.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["activity"],
            "type": "object"
