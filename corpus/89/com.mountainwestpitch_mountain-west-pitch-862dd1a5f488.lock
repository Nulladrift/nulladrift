      "instructions": "Read-only feed of Mountain West Pitch, part of The Pitch Network: the youth soccer club directory for Colorado, Utah, Wyoming, northeast Nevada and south-central Montana plus guides on tryouts, leagues, tournaments and camps. Every answer links back to the site.",
