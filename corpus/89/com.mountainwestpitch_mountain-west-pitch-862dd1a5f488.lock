          "title": "Read a page (Mountain West Pitch)",
          "description": "Full text of one published Mountain West Pitch page or article, as plain text with headings. Pass the URL or slug. Long pages come back in parts: pass next_offset as offset to continue.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "offset": {
                "description": "Where to resume a long page. Pass the next_offset value from the previous response. Default 0.",
                "minimum": 0,
                "type": "integer"
              },
              "url_or_slug": {
                "description": "The full page URL from a search result, or just its slug, such as \"tryouts\".",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["url_or_slug"],
            "type": "object"
          },
