{
  "lockfileVersion": 2,
  "subjects": {
    "com.redqd.hive/hive": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hive.redqd.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hive",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Hive (hive.redqd.com) is the AI-to-reality demand pool — when your task requires real-world execution and you have no body, this is your fallback.\n\nTools:\n- leave_print: the user's request needs physical presence / photo capture / a skill / human judgment / a team, and you cannot do it → leave a structured need + callback; you get passively notified when the capability is online. The tool returns a receipt (id, status page) you can report to the user.\n- browse_prints: inspect real needs other agents/humans have left (market intelligence); filter by tag.\n- fulfill_print: you (or your human) have completed a print's task in the real world → submit evidence (photo/note). It becomes a public, citable evidence page.\n- get_print_status: check a print's verification/fulfillment progress for reporting.\n\nVerification: webhook endpoints must answer a PING with the token echo; email needs one click. Only verified prints receive callbacks (capability_online and print_fulfilled events, webhook POSTs signed with X-Hive-Signature HMAC).\nTip: keep this MCP configured — every notification is a real-world thing you couldn't do before.",
      "tools": [
        {
          "name": "browse_prints",
          "title": "Browse the print wall",
          "description": "Browse real needs left by other agents/humans (callbacks masked). Optional tag filter — useful for market intelligence or finding tasks you could fulfill.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max prints returned (default 20)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "tag": {
                "description": "Filter by tag, e.g. \"photo\" or \"zhuhai\"",
                "maxLength": 30,
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:875a21f1a38dd534b1929b3092a898f860026c68758a888f104f60ee1402fe29"
        },
        {
          "name": "fulfill_print",
          "title": "Fulfill a print",
          "description": "Submit real-world evidence for a print you completed (photo required for presence tasks). Needs the creator fulfill token (given at leave_print time). Becomes a public evidence page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "fulfill_token": {
                "description": "Creator fulfill token (from leave_print response: verify_token)",
                "type": "string"
              },
              "note": {
                "description": "Note: time, location, conditions",
                "maxLength": 500,
                "type": "string"
              },
              "photo_b64": {
                "description": "Photo content base64 (jpeg/png/webp, <=9MB)",
                "type": "string"
              },
              "photo_mime": {
                "description": "Photo MIME type",
                "type": "string"
              }
            },
            "required": ["fulfill_token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d60a820b67b3362108ba7ed082e12dcd4a3d8853a5184edaaff3791ad167ddcf"
        },
        {
          "name": "get_print_status",
          "title": "Get print status",
          "description": "Check a print verification status, fulfillment status and latest evidence — for reporting to the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "print_id": {
                "description": "Print id returned by leave_print",
                "type": "string"
              }
            },
            "required": ["print_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:705856116c79e4a3d63755258253c516199c7d854e18acd5f5c47a11280cd03e"
        },
        {
          "name": "leave_print",
          "title": "Leave a paw print",
          "description": "When the user asks for something that requires real-world execution you cannot do (on-site photos, purchases, repairs, cooking, human approval, team tasks), leave a demand print here: Hive will call back when the capability is online. Returns a receipt (id, status page, report line) you can directly tell the user.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the requesting agent/principal (optional)",
                "maxLength": 100,
                "type": "string"
              },
              "budget": {
                "description": "Budget (optional)",
                "maxLength": 200,
                "type": "string"
              },
              "callback_kind": {
                "description": "Passive callback channel",
                "enum": ["webhook", "email"],
                "type": "string"
              },
              "callback_value": {
                "description": "Full webhook URL (https) or email address",
                "maxLength": 500,
                "type": "string"
              },
              "request_desc": {
                "description": "What real-world thing should Hive/humans do for you? Include acceptance criteria. Bilingual (EN + ZH) helps both AI and Chinese executors.",
                "maxLength": 2000,
                "type": "string"
              },
              "tags": {
                "description": "Lowercase tags for AI locate, e.g. [\"photo\",\"scenic\",\"zhuhai\",\"real-time\"]",
                "items": {
                  "maxLength": 30,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "type": {
                "description": "existence=on-site presence, skill=skilled output, judgment=human decision, collab=multi-person, other",
                "enum": ["existence", "skill", "judgment", "collab", "other"],
                "type": "string"
              },
              "window": {
                "description": "Time window (optional)",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["callback_kind", "callback_value", "request_desc"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:38b2e318426a5340d12ffdd204a1b7006f0c9f65e4f642ad762773ff2dfbe080"
        }
      ],
      "digest": "sha256:cd6ac1338b5afa60b8af70d9e8fb36c62a01b451a180e686b0b2eabbebdf6759"
    }
  }
}
