      "instructions": "Insta-Pola manages shared event photo galleries for the connected Insta-Pola account: guests scan a QR code and post captioned photos, which can be shown live on a projected wall. Gallery texts and replies are in French.\nTools: create_gallery (name, date, public or private access, optional color theme and title font), update_gallery (title, theme or font of an existing gallery; the gallery address does not change), set_gallery_logo (sets an image from the conversation as the gallery logo), list_galleries and get_gallery.\nBefore creating a gallery, ask for the event date if the user has not given it.\nThemes and fonts come from fixed lists in the tool schemas; pick the closest match to the user's wording (for example pink: rose-editorial, modern: montserrat, Christmas: pull-moche) and tell the user which ones were used.\nThemes: most themes are color themes (header and live wall color). The full themes dress the gallery header with a pattern, a matching title font and a matching default logo: pull-moche (ugly Christmas sweater, knitted header, pixel font; Christmas parties), bauhaus (geometric shapes; design or modern events), disco-club (disco party), la-gazette (newspaper style; anniversaries, retrospectives), dolce-vita (Italian summer; summer weddings, garden parties), love-notes (powder pink, hand-lettered hearts; weddings, engagements). Every theme and font can be previewed at https://www.insta-pola.com/styles.\nLogos: create_gallery and get_gallery return logo_guidance (background color, recommended colors, transparent background, text size). Logos made for a gallery should follow it. Show the image to the user and call set_gallery_logo only after the user approves it. If set_gallery_logo reports a legibility issue, tell the user.\nThe welcome text, photo moderation, photo deletion and album downloads are done by the organizer on insta-pola.com: share customize_link or moderation_link for these. moderation_link opens the organizer page « Gérer la galerie ».\nOther features, set up by the organizer on insta-pola.com (customize_link or moderation_link): a monogram maker in the logo panel (initials from the gallery title, 8 templates, transparent PNG), a no-logo option (title only), an event page with the program, venue and practical information (event_page_link), short guest notes on the back of each photo, 13 backgrounds for the live wall, a communication kit (posters, table tents, flyers, QR cards, stories, ready-to-send messages) and handing a gallery over to a client (guest access and organizer password sent in one message, from the organizer's account).\nThe app does not sell anything. When a gallery is not active yet or the user asks about plans, explain it and share only the information page https://www.insta-pola.com/#pricing.\nWhen a gallery is returned, the QR code can be shown as an image from qr_code_url, with the guest link.",
      "tools": [
        {
          "name": "create_gallery",
          "title": "Créer une galerie photo d'évènement",
          "description": "Crée une galerie photo partagée Insta-Pola pour un évènement (mariage, anniversaire, soirée, séminaire…). Les invités scannent un QR code, postent leurs photos avec une légende depuis leur téléphone, sans application, et un mur photo en direct peut être projeté. Renvoie le lien à partager, le QR code, le lien du mur en direct et, si l'accès est privé, le code invité. Demande le nom et la date de l'évènement s'ils manquent. Accepte un thème de couleur et une police. La première galerie d'un compte est mise en ligne tout de suite ; les suivantes sont créées sans être actives, et la réponse l'explique. Le texte d'accueil et la modération se font ensuite sur insta-pola.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Date de l'évènement, AAAA-MM-JJ (aujourd'hui ou dans les 90 prochains jours).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "font": {
                "description": "Police du titre : monoton = Néon, playfair = Élégant, dmserif = Classique, lora = Doux, dancing = Manuscrit, lobster = Rétro, montserrat = Moderne, robotoSemi = Sobre, bitcount = Pixel, staatliches = Bauhaus, limelight = Art déco, shrikhand = Disco, codystar = Facettes, riviera = Riviera. Facultatif (par défaut : playfair).",
                "enum": ["monoton", "playfair", "dmserif", "lora", "dancing", "lobster", "montserrat", "robotoSemi", "bitcount", "staatliches", "limelight", "shrikhand", "codystar", "riviera"],
                "type": "string"
              },
              "name": {
                "description": "Nom de l'évènement, affiché en titre (ex. « Anniversaire de Léa »).",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "private": {
                "default": false,
                "description": "true : les invités ont besoin d'un code pour participer.",
                "type": "boolean"
              },
              "theme": {
                "description": "Thème de couleur (fond de l'en-tête et du mur live). Choisis le plus proche de la demande : rose-editorial = Rose Editorial (#ED719E), corail-pastel = Corail Pastel (#FF8B7B), framboise-sorbet = Framboise Sorbet (#D64F7A), peach-cream = Peach Cream (#F4B998), mint-museum = Mint Museum (#5BB7A4), mint-fresh = Mint Fresh (#4EC280), vert-sauge = Vert Sauge Chic (#A4C59C), vert-profond = Vert Profond (#0C6B4F), bleu-petrole = Bleu Pétrole (#0A6E8C), bleu-nuit = Bleu Nuit Luxe (#0E2A47), bleu-glacier = Bleu Glacier (#8AC6E8), beige-sable = Beige Sable (#E7DBC9), moka-latte = Moka Latte (#C7A98E), sunrise-gold = Sunrise Gold (#F4A259), chaplin-gold = Chaplin Gold (#F4B647), citrus-pop = Citrus Pop (#FFC857), apricot-glow = Apricot Glow (#FFB997), saffron-night = Safran & Nuit (#E0B04E), pull-moche = Pull Moche (Noël) (#B3122A), bauhaus = Bauhaus (#F4EFE3), disco-club = Disco Club (#3A0F4F), la-gazette = La Gazette (#F3EEE3), dolce-vita = Dolce Vita (#FBE7A1), love-notes = Love Notes (#FBE4DE). Facultatif : sans choix, un thème adapté au type d'évènement est proposé.",
                "enum": ["rose-editorial", "corail-pastel", "framboise-sorbet", "peach-cream", "mint-museum", "mint-fresh", "vert-sauge", "vert-profond", "bleu-petrole", "bleu-nuit", "bleu-glacier", "beige-sable", "moka-latte", "sunrise-gold", "chaplin-gold", "citrus-pop", "apricot-glow", "saffron-night", "pull-moche", "bauhaus", "disco-club", "la-gazette", "dolce-vita", "love-notes"],
                "type": "string"
              }
            },
            "required": ["date", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Créer une galerie photo"
