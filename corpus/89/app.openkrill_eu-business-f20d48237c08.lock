        "name": "eu-business",
        "title": "EU Business & VAT Checker: Validate VAT, LEI & registries",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "EU Business & VAT Checker: Validate VAT, LEI & registries. Use company_from_domain when the user has a domain, website or work email and wants the company behind it. Pass the domain, such as stripe.com. Give each fact with its source link and date. Explain confidence: confirmed means a register checked the number or Wikidata link, name_match means only the name matched one register entry, printed_on_site means only the company's own page says it, wikidata_only means only Wikidata says it. Never fill a gap: say a field in unknown is unknown and why. If status is ambiguous, show the candidates and ask; if it is not_a_company_domain, give the reason. Domain age is not company age. A size band can be years old and covers one legal entity, not its group. Use check_vat_number to validate an EU or Northern Ireland VAT number, find_company_lei for a Legal Entity Identifier, and lookup_company_registry for the French or Norwegian register (other countries: use find_company_lei or say the register is not covered). Send the VAT country as a two-letter code or English name (Greece is EL, Northern Ireland is XI; GB cannot be checked); ask for it if the user gave only digits. Say the result is what the official source reports on that date. A valid number does not show the business is trustworthy or is the one the user deals with: suggest comparing the registered name with the invoice. Send requesterCountry and requesterVatNumber only when the user gives their own VAT number for proof of the check, and pass on the consultationNumber. Pass on the register lag notice. Companies only: if a name is withheld, say so and do not guess it. Never identify or search for a private person, owner, director or employee. This server does not answer VAT registration duties or VAT rates. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "check_vat_number",
          "title": "Validate an EU VAT number on VIES",
          "description": "Use this when the user asks to validate a VAT number, check a tax ID or get a VIES consultation number, for example \"is ES A28015865 a valid VAT number?\". Pass country as a two-letter code (Greece is EL) or English name, and vatNumber as printed, with or without its prefix, spaces, dots or dashes, for example {\"country\":\"DE\",\"vatNumber\":\"DE 811 128 135\"}. A prefix that names another country is refused. Send requesterCountry and requesterVatNumber only when the user gives their own business VAT number, for a consultation number. Returns whether the number is registered for VAT on the date of the check and, where published, the company name and address. Covers EU member states and Northern Ireland (XI), not GB. Do not use it for VAT rates or to judge whether a business is trustworthy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country of the VAT number: a two-letter code in any case, such as DE or de (Greece is EL; GR also works), XI for Northern Ireland, or the English name, such as Germany. GB numbers cannot be checked.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "requesterCountry": {
                "description": "Country, as a code or English name, of the business VAT number of the user asking. Send with requesterVatNumber to get a consultation number.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "requesterVatNumber": {
                "description": "The business VAT number of the user asking, for a consultation number. Leave out unless the user gives it.",
                "maxLength": 30,
                "minLength": 2,
                "type": "string"
              },
              "vatNumber": {
                "description": "The business VAT number as printed on an invoice, with or without the country prefix, spaces, dots or dashes, for example DE811128135, 811128135 or DE 811.128.135. A prefix must match country.",
                "maxLength": 30,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "vatNumber"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "checkedAt": {
                "type": "string"
              },
              "consultationNumber": {
                "type": "string"
              },
              "country": {
                "type": "string"
              },
              "detailsWithheld": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              },
              "vatNumber": {
                "type": "string"
              }
            },
            "required": ["checkedAt", "country", "notice", "source", "valid", "vatNumber"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
