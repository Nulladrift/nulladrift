                "type": "string"
              },
              "limit": {
                "description": "Most entities to return. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Company name, or the registration number: SIREN (9 digits) for FR, organisation number (9 digits) for NO.",
