        {
          "name": "generate_image",
          "title": "Generate an image",
          "description": "Generate one image, or edit one, with the selected project key. Unless the user names a model, pick from list_models type=image featured=true, the curated current ones; a model's params.image (detail=full) lists sizes, aspect ratios and qualities. Waits up to about 45 seconds: status completed carries url, a download link valid for 1 hour; status processing carries id for get_media_job. Identical calls return one job: for several versions, set variant 1, 2, 3. The result is deleted 24 hours after the job ends (1 hour on a zero-retention project) unless store is true. Normal costs and policy checks apply; usage.cost is the charge in USD. Requires runtime:call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "Shape such as 16:9, from params.image.aspect_ratios.",
                "type": "string"
              },
              "id": {
                "description": "Inference key ID in this project; its secret is never returned",
                "type": "integer"
              },
              "image": {
                "description": "Image to edit (needs the image_edit capability). An https URL or a file_<id>.",
                "type": "string"
              },
              "model": {
                "description": "Image model id from list_models type=image (featured=true for the curated ones).",
                "type": "string"
              },
              "parameters": {
                "description": "Provider settings, forwarded verbatim. Each model lists the keys it takes in params.image.parameters (list_models detail=full).",
                "type": "object"
              },
              "prompt": {
                "description": "What the image shows.",
                "type": "string"
              },
              "quality": {
                "description": "A tier from params.image.qualities.",
                "type": "string"
              },
              "reference_images": {
                "description": "Images the result draws on: subject, product or style. An https URL or a file_<id>.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resolution": {
                "description": "Output tier such as 1k or 2k, for models that declare one.",
                "type": "string"
              },
              "size": {
                "description": "Pixel size WxH, for models that take one.",
