        {
          "name": "update_dynamic_route_metadata",
          "title": "Update a dynamic route's display name",
          "description": "Updates current route presentation metadata without validating or changing the draft graph, incrementing its revision, or deploying a version. display_name preserves case, spaces and Unicode; boundary whitespace is trimmed. Empty clears the label; omission, null, control characters, unknown fields and labels longer than 128 characters are rejected. The route identifier and invocation_model are unchanged. Restore and rollback preserve the current label. Requires the `dynamic_routes:write` scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "display_name": {
                "description": "Human label; preserves case and spaces. Empty clears the label. Does not change routing; draft revision; or deployed version.",
                "maxLength": 128,
                "type": "string"
              },
              "name": {
                "description": "Route name",
                "type": "string"
              }
            },
            "required": ["display_name", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "active_version": {
