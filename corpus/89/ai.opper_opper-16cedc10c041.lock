        {
          "name": "update_dynamic_route_draft",
          "title": "Replace the draft",
          "description": "Saves draft changes without deploying. Omitted description, graph and layout are preserved; an empty description clears it. Supply the complete graph to replace it. Structural errors reject the save; inspect meta.issues and data.draft.validation for remaining issues before deployment. Use simulate_dynamic_route without version_number to test the saved draft; deploy_dynamic_route performs full deployment validation. Requires the `dynamic_routes:write` scope.\n\nGraph format: an object with an `elements` array. Each element has a unique `id`, a `type`, optional `properties`, and `outputs`, an object mapping output names to `{\"elementId\":\"target-node-id\"}`. Include `id: START, type: start` and `id: END, type: end`; `input` and `output` are not node types. A minimal deployable graph (replace the model with an available catalog ID permitted by your policy):\n```json\n{\"elements\":[{\"id\":\"START\",\"type\":\"start\",\"outputs\":{\"next\":{\"elementId\":\"primary\"}}},{\"id\":\"primary\",\"type\":\"model\",\"properties\":{\"model\":\"cerebras/gpt-oss-120b\"},\"outputs\":{\"success\":{\"elementId\":\"END\"},\"fallback\":{\"elementId\":\"END\"}}},{\"id\":\"END\",\"type\":\"end\",\"outputs\":{}}]}\n```\n\nSupported node types and properties:\n- `start`: the START node; `outputs.next` selects the first node.\n- `end`: the END node; `outputs` is `{}`.\n- `model`: `properties.model` is a catalog model ID. `outputs.success` targets END or an observe node; `outputs.fallback` targets another model, pool, or END.\n- `pool`: `properties.models` contains 2-10 `{model,metrics}` candidates; `properties.expression` is a numeric CEL expression such as `model.cost`, sorted ascending. Uses the same success/fallback outputs as model.\n- `conditional`: `properties.cases` contains `{id,expression}` entries; each expression is a CEL predicate over `metadata`, `auth`, and `input`. Connect an output for each case ID and a `default` output. The first true case wins.\n- `percentage`: `properties.buckets` contains at least two `{id,weight}` entries with positive integer weights totaling 100. Connect an output for each bucket ID.\n- `classifier`: `properties.cases` contains 2-10 `{id,label,instructions}` entries with unique labels, plus optional `context` and `model` properties. Connect an output per case ID; no default output. Classification failures fail the route.\n- `observe`: `properties.criteria` defines an asynchronous evaluation, with optional `score_type` (`score` or `binary`), `model`, `threshold`, and `sample_rate` (both greater than 0 and at most 1). Place after model/pool success or another observe node; `outputs.next` leads to another observe node or END.\n\nGraphs must be acyclic. Every node except END accepts at most one incoming edge; use separate model nodes on separate branches. Deployment requires each path from START to reach a model or pool before END.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "New description. Omit to leave it unchanged.",
                "type": "string"
              },
              "graph": {
                "description": "Routing graph object with elements. Each node has id, type, outputs mapping output names to {elementId: targetID}, and optional properties. Include START/start and END/end. Supported types: start, end, model, pool, conditional, percentage, classifier, observe. Omit graph on create to seed a default; copy its returned draft.graph to customize. See tool description for node properties and topology.",
                "examples": [
                  {
                    "elements": [
                      {
                        "id": "START",
                        "outputs": {
                          "next": {
                            "elementId": "model_default"
                          }
                        },
                        "type": "start"
                      },
                      {
                        "id": "model_default",
                        "outputs": {
                          "fallback": {
                            "elementId": "END"
                          },
                          "success": {
                            "elementId": "END"
                          }
                        },
                        "properties": {
                          "label": "Default model",
                          "model": "cerebras/gpt-oss-120b"
                        },
                        "type": "model"
                      },
                      {
                        "id": "END",
                        "outputs": {},
                        "type": "end"
                      }
                    ]
                  }
                ],
                "properties": {
                  "elements": {
                    "items": {
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "outputs": {
                          "additionalProperties": {
                            "properties": {
                              "elementId": {
                                "type": "string"
                              }
                            },
                            "required": ["elementId"],
                            "type": "object"
                          },
                          "type": "object"
                        },
                        "properties": {
                          "type": "object"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "required": ["id", "outputs", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["elements"],
                "type": "object"
              },
              "layout": {
                "description": "Editor canvas positions keyed by element id. Opaque to the gateway.",
                "type": "object"
              },
              "name": {
                "description": "Route name",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "active_version": {
                    "properties": {
