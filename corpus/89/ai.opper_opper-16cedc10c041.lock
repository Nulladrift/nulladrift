        {
          "name": "create_api_key",
          "title": "Mint an API key",
          "description": "Mints an inference key for the project. The full key is returned only on initial creation when return_secret is not false; the user MCP tool defaults false. Optional `allowed_ips` restricts the key to those addresses. Each entry is an IP address or CIDR range (for example 203.0.113.7 or 198.51.100.0/24). Public addresses only, up to 100 entries, ranges no wider than /8 (IPv4) or /16 (IPv6). An empty list accepts calls from any IP. Calls from any other address get 403 with code `ip_not_allowed`. A change takes up to a minute to apply. Reuse idempotency_key with identical arguments after uncertain results. A replay returns existing metadata without a secret; changed arguments or a deleted key return 409. Requires the `apikeys:write` scope. Runtime secrets are omitted by default; call_model uses the returned key ID. For local application setup use opper keys create --project <uuid> --name <name> --output <env-file> (native OAuth, private file delivery). Supply idempotency_key and reuse it with identical arguments on retries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allowed_ips": {
                "description": "IP addresses or CIDR ranges the key accepts calls from (for example 203.0.113.7 or 198.51.100.0/24). Public addresses only; up to 100 entries; ranges no wider than /8 for IPv4 or /16 for IPv6. Empty accepts any IP. Calls from any other address get 403 ip_not_allowed. A change takes up to a minute to apply.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "idempotency_key": {
                "description": "Generate a unique operation ID (for example UUID) before creation. Reuse it and the exact original arguments after a timeout or uncertain result; never generate a new ID merely to retry. A changed payload or deleted original resource returns 409. Key replays return metadata without the raw secret.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._:-]{1,128}$",
                "type": "string"
              },
              "kind": {
                "description": "personal (the default) or project. A project key needs the project_keys:manage permission.",
                "enum": ["personal", "project"],
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "return_secret": {
                "default": false,
                "description": "Default false: keep the runtime secret on the server and return its ID for the matching model-call tool. For local application setup use opper keys create to install a key privately. Set true only when the user explicitly needs the raw secret and the client can deliver it privately; raw tool results may enter the model conversation.",
                "type": "boolean"
              },
              "uuid": {
                "description": "Project UUID",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["name", "uuid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "allowed_ips": {
                    "description": "The IP addresses and CIDR ranges this key accepts calls from. An empty list accepts any IP.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "created_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "id": {
                    "type": "integer"
                  },
                  "key": {
                    "type": "string"
                  },
                  "kind": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "prefix": {
                    "type": "string"
                  }
                },
                "required": ["allowed_ips", "id", "kind", "name", "prefix"],
                "type": "object"
              },
              "meta": {
                "description": "Empty for a single resource. Endpoint-specific context appears here rather than as a sibling of `data`.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Mint an API key"
