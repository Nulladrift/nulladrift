                        "description": "Open the authorized organization's billing page.",
                        "format": "uri",
                        "type": "string"
                      },
                      "connections": {
                        "description": "Review or disconnect agent connections in the browser.",
                        "format": "uri",
                        "type": "string"
                      },
                      "rules": {
                        "description": "Open the authorized organization's rules page.",
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "next_actions": {
                    "description": "Suggested next steps; payment and consent remain browser actions.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "organization": {
                    "additionalProperties": true,
                    "properties": {
                      "id": {
                        "description": "Organization UUID authorized by this connection.",
                        "format": "uuid",
                        "type": "string"
                      },
                      "is_owner": {
                        "type": "boolean"
                      },
                      "name": {
                        "type": "string"
                      },
                      "plan": {
                        "description": "Current plan identifier; an empty value means it was unavailable.",
                        "type": "string"
                      }
                    },
                    "required": ["id", "is_owner", "name", "plan"],
                    "type": "object"
                  },
                  "project": {
                    "additionalProperties": true,
                    "properties": {
                      "id": {
                        "description": "Selected project UUID, validated within the connected organization.",
                        "format": "uuid",
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": ["id", "name"],
                    "type": "object"
                  },
                  "user": {
                    "additionalProperties": true,
                    "properties": {
                      "id": {
                        "description": "Connected user's UUID.",
                        "format": "uuid",
                        "type": "string"
                      }
                    },
                    "required": ["id"],
                    "type": "object"
                  }
                },
                "required": ["billing", "connection", "links", "next_actions", "organization", "user"],
                "type": "object"
              },
              "meta": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["data", "meta"],
            "type": "object"
          },
