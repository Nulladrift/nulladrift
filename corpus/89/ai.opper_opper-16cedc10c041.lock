        {
          "name": "get_usage",
          "title": "Read usage and inference costs",
          "description": "Read usage in projects you can access in the connected organization, including calls without retained traces. Omit project_uuid to include unassigned organization usage. For limited project access, only metrics with recorded organization scope qualify as unassigned usage. All arguments are optional; start with {} for a seven-day summary. Use group_by=model or project to find the most expensive groups, ranked by total_cost descending (stable group-key tie break), up to limit; grouping requires bucket=none. Project groups use public project UUIDs and names when metadata is available. With no grouping, bucket=day returns up to 32 daily buckets over a maximum 31-day window. Costs are USD: cost covers customer model calls, evals_cost covers evaluations, guards_cost covers guards/routing checks, and total_cost includes all three. Counts/tokens/errors describe customer calls, matching the app's usage analytics. This is recorded inference/controls usage, not an invoice or balance; credits, storage and other billing adjustments are not represented. If meta.has_more, increase limit up to 100 or narrow the project/date filter. Requires runtime:read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bucket": {
                "anyOf": [
                  {
                    "description": "none (default) for a summary or grouped ranking; day for a compact UTC daily series without grouping.",
                    "enum": ["none", "day"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. none (default) for a summary or grouped ranking; day for a compact UTC daily series without grouping."
              },
              "from": {
                "anyOf": [
                  {
                    "description": "Inclusive RFC3339 start time. Defaults to seven days before to. The window must be positive and at most 31 days.",
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Inclusive RFC3339 start time. Defaults to seven days before to. The window must be positive and at most 31 days."
              },
              "group_by": {
                "anyOf": [
                  {
                    "description": "none (default), model, or project. Grouped rankings require bucket=none.",
                    "enum": ["none", "model", "project"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. none (default), model, or project. Grouped rankings require bucket=none."
              },
              "limit": {
                "anyOf": [
                  {
                    "description": "Maximum groups in a ranking, default 20, maximum 100. Does not truncate ungrouped summaries or daily series.",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Maximum groups in a ranking, default 20, maximum 100. Does not truncate ungrouped summaries or daily series."
              },
              "project_uuid": {
                "anyOf": [
                  {
                    "description": "Optional project UUID you can access. Omit to include eligible projects and attributable unassigned organization usage.",
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Optional project UUID you can access. Omit to include eligible projects and attributable unassigned organization usage."
              },
              "to": {
                "anyOf": [
                  {
                    "description": "Exclusive RFC3339 end time. Defaults to now. Reuse the returned from/to values while paging.",
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Exclusive RFC3339 end time. Defaults to now. Reuse the returned from/to values while paging."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bucket": {
                      "format": "date-time",
                      "type": "string"
                    },
                    "cache_creation_tokens": {
                      "type": "integer"
                    },
                    "cache_read_tokens": {
                      "type": "integer"
                    },
                    "cache_savings": {
                      "type": "number"
                    },
                    "completion_tokens": {
                      "type": "integer"
                    },
                    "cost": {
