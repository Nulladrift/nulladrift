                      },
                      "scope": {
                        "const": "organization",
                        "type": "string"
                      },
                      "spend_status": {
                        "enum": ["available", "unknown"],
                        "type": "string"
                      },
                      "spent_cents": {
                        "description": "Organization spend in US cents for the returned billing period; not an invoice.",
                        "type": "integer"
                      },
                      "status": {
                        "description": "Unknown is not evidence of credits or permission to incur costs.",
                        "enum": ["available", "unknown"],
                        "type": "string"
                      }
                    },
                    "required": ["status"],
                    "type": "object"
                  },
                  "connection": {
                    "additionalProperties": true,
                    "properties": {
                      "client_id": {
                        "description": "Opaque OAuth client identifier, not a credential.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "expires_at": {
                        "description": "Access token expiry as Unix seconds.",
                        "minimum": 0,
                        "type": "integer"
                      },
                      "grant_id": {
                        "description": "OAuth grant UUID; runtime API keys have a separate lifecycle.",
                        "format": "uuid",
                        "type": "string"
                      },
