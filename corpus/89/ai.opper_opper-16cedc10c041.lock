          "description": "Validates the row-locked current draft and deploys it as a new immutable version, changing live routing. Optional expected_route_uuid, expected_draft_revision and expected_active_version_number bind the operation to the reviewed identity, draft and live pointer; zero active version means unpublished. A mismatch returns 409. Supply a fresh idempotency_key for each new deployment and reuse identical arguments only to retry that operation. A replay returns the original version in meta.deployed_version and current observational data without reactivating the original version or validating a later draft. meta.idempotency_replayed identifies replays. The receipt can also be recovered by the read-only deployments/{idempotency_key} endpoint. Requires the `dynamic_routes:write` scope.",
