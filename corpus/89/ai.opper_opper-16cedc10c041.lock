      "instructions": "Operate Opper for the connected user; list_models, get_guide and send_feedback work before signup. send_feedback tells the Opper team about gaps, unclear docs, bugs or what worked. It is not support and gets no reply: for a blocking problem send the user to Support at https://platform.opper.ai. Connect with native client OAuth and only the MCP URL; the user does browser login, organization choice and consent, picking permissions in Opper (read-only first). A missing permission needs native OAuth reauthorization and fresh consent, never a pasted token; clients without automatic upgrades (OpenCode 1.18.29) must start it, with no config edit. An explicit client scope setting caps the choices; change it deliberately if it lacks the permission. Stop if the user denies or cancels consent. Start with get_context, then check_model_access for the exact model and project before creating keys or calling it; if it reports policy.requires_authorization, use get_allowed_models to request controls:read. Passing checks do not guarantee provider availability or success. Reuse or create a project, read rule vocabulary and inherited policy, then create a runtime key if needed. Key secrets are omitted by default; call_model needs only the key ID. call_model is real inference, optionally with JSON response_format (get_guide structured_output). Images and video use the HTTP API with a runtime key (get_guide media). get_usage shows results and costs, zero-retention calls included; list_traces and get_trace need retained traces. For a local app, run opper keys create --project <uuid> --name <name> --output <env-file> with the configured --mcp-url: it gets its own consent and writes the key privately; never read that file or print the key. Give each create_api_key and create_rule a stable idempotency_key; on retries reuse it with identical arguments. Deleting runtime keys is separate from disconnecting OAuth grants. After the user disconnects, do not reconnect without a new request.",
      "tools": [
        {
          "name": "call_model",
          "title": "Chat Completions API",
          "description": "Run a non-streaming text or structured-output model call using a selected project UUID and runtime API key ID. Send model and messages; max_tokens, temperature and response_format are optional. For typed output use response_format={type:json_schema,json_schema:{name:answer,strict:true,schema:<JSON Schema>}} and choose a model supporting structured_output. Normal inference costs, plan restrictions and policy checks apply. Use get_trace with the returned meta.trace_uuid when retention is enabled. Advanced tool calling and multimodal inputs use the SDK or HTTP API. Requires runtime:call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Runtime API key ID in this project; its secret is never returned by this operation",
                "type": "integer"
              },
              "max_tokens": {
                "description": "Optional output token limit. Omit to use the model default.",
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "Text conversation to send to the model. A single user message is enough to test a model.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "description": "Exact model ID from list_models, or a deployed dynamic/<route-name>.",
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "anyOf": [
                  {
                    "type": "null"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "type": {
                        "const": "json_object",
                        "type": "string"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "json_schema": {
                        "additionalProperties": false,
                        "properties": {
                          "description": {
                            "type": "string"
                          },
                          "name": {
                            "maxLength": 64,
                            "minLength": 1,
                            "pattern": "^[a-zA-Z0-9_-]+$",
                            "type": "string"
                          },
                          "schema": {
                            "additionalProperties": true,
                            "type": "object"
                          },
                          "strict": {
                            "type": "boolean"
                          }
                        },
                        "required": ["name", "schema"],
                        "type": "object"
                      },
                      "type": {
                        "const": "json_schema",
                        "type": "string"
                      }
                    },
                    "required": ["json_schema", "type"],
                    "type": "object"
                  }
                ],
                "description": "Optional structured output. Omit or use null for ordinary text. json_object requests JSON; json_schema specifies its shape. The returned message content contains the generated JSON text."
              },
              "temperature": {
                "description": "Optional sampling temperature. Omit to use the model default.",
                "type": "number"
              },
              "uuid": {
                "description": "Project UUID in the authorized organization",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["id", "messages", "model", "uuid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Chat Completions API"
          },
          "behavior": {
