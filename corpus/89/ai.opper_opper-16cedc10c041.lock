        {
          "name": "create_rule",
          "title": "Create a control rule",
          "description": "Creates a rule with a client-generated UUID. Setting enabled applies it immediately. Read rules again to inspect effective policy. Requires the `controls:write` scope. Supply idempotency_key and reuse it with identical arguments on retries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "config": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "Spending cap that resets per period (day, week or month) or holds in total. At most one enabled budget per target; a project, role or member cap cannot exceed an organization cap of the same period. The server enforces cross-rule constraints when saving.",
                    "properties": {
                      "alerts_enabled": {
                        "description": "Alert preference stored with the budget rule.",
                        "type": ["boolean", "null"]
                      },
                      "counted_from": {
                        "description": "Where a total cap counts spend from; omitted means the rule's creation. Set it to now to reset a total cap.",
                        "format": "date-time",
                        "type": "string"
                      },
                      "monthly_limit_cents": {
                        "description": "Cap per period in integer USD cents: 100 cents = $1; 1000 = $10; 10000 = $100. Zero is a zero-dollar cap, not unlimited. Named for the monthly period it once always was; it is the cap for whichever period is set.",
                        "minimum": 0,
                        "type": "integer",
                        "x-currency": "USD",
                        "x-unit": "cents"
                      },
                      "period": {
                        "description": "When the cap resets: day (00:00 UTC), week (Monday 00:00 UTC), month (with the billing period), or total (never; counts from counted_from). Omitted means month.",
                        "enum": ["day", "week", "month", "total"],
                        "type": "string"
                      },
                      "soft_limit_pct": {
                        "description": "Warning threshold as a percentage of the cap; 80 means 80%. Zero or omission means unset.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": ["integer", "null"]
                      },
                      "type": {
                        "const": "budget",
                        "type": "string"
                      }
                    },
                    "required": ["monthly_limit_cents", "type"],
                    "title": "comply.budget",
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "description": "Constrain models, provider companies/routes, locations, makers, and upstream data handling. Omitted/empty categories impose no restriction; configured categories combine with AND. Child scopes may only narrow parents; exclusions accumulate and win. Use schema_version=4: models and exclude_models list model keys, endpoints and exclude_endpoints list endpoint ids, and an endpoint is pinned when its model is in models or its id is in endpoints. schema_version=5 adds \"*\" wildcards in exclude_models and exclude_endpoints (exclude_models [\"*deepseek*\"] blocks every DeepSeek model) and except_models / except_endpoints, exceptions that lift the same rule's exclusions only; write 5 only when the rule uses either. Inspect get_allowed_models/inherited policy before applying. Model/provider examples illustrate syntax; use the current catalog to select values.",
                    "properties": {
                      "allowlist": {
                        "additionalProperties": false,
