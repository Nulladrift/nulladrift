                      "type": "string"
                    },
                    "type": "array"
                  },
                  "created_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "id": {
                    "type": "integer"
                  },
                  "key": {
                    "type": "string"
                  },
                  "kind": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "prefix": {
                    "type": "string"
                  }
                },
                "required": ["allowed_ips", "id", "kind", "name", "prefix"],
                "type": "object"
              },
              "meta": {
                "description": "Empty for a single resource. Endpoint-specific context appears here rather than as a sibling of `data`.",
