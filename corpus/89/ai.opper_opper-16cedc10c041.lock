                    "description": "Agent or client name.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "operator_contact": {
                    "description": "Email or URL where the person running you can be reached, only if they want a reply. Stored as given and not verified.",
                    "maxLength": 200,
                    "type": "string"
