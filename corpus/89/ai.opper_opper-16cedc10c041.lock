                      "type": "integer"
                    },
                    "duration_ms_sum": {
                      "type": "integer"
                    },
                    "errors_other": {
                      "type": "integer"
                    },
                    "errors_policy": {
                      "type": "integer"
                    },
                    "errors_provider": {
                      "type": "integer"
                    },
                    "errors_rate_limited": {
                      "type": "integer"
                    },
                    "evals_cost": {
                      "type": "number"
                    },
                    "group": {
                      "description": "Recorded model identifier or project UUID according to meta.group_by. Omitted for ungrouped or unidentified historical groups.",
                      "type": "string"
                    },
                    "guards_cost": {
