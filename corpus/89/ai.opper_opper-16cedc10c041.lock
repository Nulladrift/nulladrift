        {
          "name": "deploy_dynamic_route",
          "title": "Deploy the draft",
          "description": "Validates the row-locked current draft and deploys it as a new immutable version, changing live routing. Optional expected_route_uuid, expected_draft_revision and expected_active_version_number bind the operation to the reviewed identity, draft and live pointer; zero active version means unpublished. A mismatch returns 409. Supply a fresh idempotency_key for each new deployment and reuse identical arguments only to retry that operation. A replay returns the original version in meta.deployed_version and current observational data without reactivating the original version or validating a later draft. meta.idempotency_replayed identifies replays. The receipt can also be recovered by the read-only deployments/{idempotency_key} endpoint. Requires the `dynamic_routes:write` scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expected_active_version_number": {
                "description": "Optional active version precondition; zero means currently unpublished. A changed live pointer returns 409.",
                "minimum": 0,
                "type": "integer"
              },
              "expected_draft_revision": {
                "description": "Optional positive revision of the draft reviewed by the caller; a changed draft returns 409.",
                "minimum": 1,
                "type": "integer"
              },
              "expected_route_uuid": {
                "description": "Optional route identity precondition; a recycled route name does not satisfy it.",
                "format": "uuid",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique operation identifier. Reusing the same request returns its original deployed version without reactivating it. Use a fresh identifier for every new deployment.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._:-]+$",
                "type": "string"
              },
              "name": {
                "description": "Route name",
                "type": "string"
              },
              "note": {
                "description": "Release note recorded on the new version.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "active_version": {
                    "properties": {
                      "created_at": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "note": {
                        "type": "string"
                      },
                      "uuid": {
                        "format": "uuid",
                        "type": "string"
                      },
                      "version_number": {
                        "type": "integer"
                      }
                    },
                    "required": ["created_at", "note", "uuid", "version_number"],
                    "type": "object"
                  },
                  "draft": {
                    "properties": {
                      "graph": {
                        "description": "The draft graph (DynamicRouteGraph).",
                        "type": "object"
                      },
                      "layout": {
                        "description": "Editor canvas positions keyed by element id.",
                        "type": "object"
                      },
                      "revision": {
                        "type": "integer"
                      },
                      "validation": {
                        "description": "Validation issues on the draft (DynamicRouteValidationIssue); empty when it is deployable.",
                        "type": "array"
                      }
                    },
                    "required": ["graph", "layout", "revision", "validation"],
                    "type": "object"
                  },
                  "latest_version_number": {
                    "type": "integer"
                  },
                  "route": {
                    "properties": {
                      "created_at": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "deleted_at": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "description": {
                        "type": "string"
                      },
                      "display_name": {
                        "type": "string"
                      },
                      "draft_graph": {
                        "description": "The draft graph (DynamicRouteGraph).",
                        "type": "object"
                      },
                      "draft_layout": {
                        "description": "Editor canvas positions keyed by element id.",
                        "type": "object"
                      },
                      "draft_revision": {
                        "type": "integer"
                      },
                      "draft_validation": {
                        "description": "Validation issues on the draft (DynamicRouteValidationIssue); empty when it is deployable.",
                        "type": "array"
                      },
                      "invocation_model": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "updated_at": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "uuid": {
                        "format": "uuid",
                        "type": "string"
                      }
                    },
                    "required": ["created_at", "description", "display_name", "draft_revision", "invocation_model", "name", "updated_at", "uuid"],
                    "type": "object"
                  },
                  "version_count": {
                    "type": "integer"
                  }
                },
                "required": ["draft", "route", "version_count"],
                "type": "object"
              },
              "meta": {
                "properties": {
                  "deployed_version": {
                    "properties": {
                      "created_at": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "description": {
                        "type": "string"
                      },
                      "draft_revision": {
                        "type": "integer"
                      },
                      "graph": {
                        "description": "The graph this version serves (DynamicRouteGraph).",
