        {
          "name": "create_organization_personal_key",
          "title": "Create your organization-scoped personal key",
          "description": "Create a personal runtime key with no project in the connected organization. Secrets are omitted by default; its ID supports call_model_with_org_key. Only kind=personal is allowed. Reuse idempotency_key and identical arguments on uncertain results; replay returns metadata without the secret. Requires apikeys:write. Runtime secrets are omitted by default; call_model_with_org_key uses the returned key ID. Project resources require an explicit project_uuid; credentials remain organization scoped. Supply idempotency_key and reuse it with identical arguments on retries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Generate a unique operation ID (for example UUID) before creation. Reuse it and the exact original arguments after a timeout or uncertain result; never generate a new ID merely to retry. A changed payload or deleted original resource returns 409. Key replays return metadata without the raw secret.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._:-]{1,128}$",
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "return_secret": {
                "default": false,
                "description": "Default false: keep the runtime secret on the server and return its ID for the matching model-call tool. For local application setup use opper keys create to install a key privately. Set true only when the user explicitly needs the raw secret and the client can deliver it privately; raw tool results may enter the model conversation.",
                "type": "boolean"
              }
            },
            "required": ["name"],
            "type": "object"
          },
