                  "version": {
                    "description": "Agent or client version.",
                    "maxLength": 200,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "context": {
                "additionalProperties": false,
                "description": "Where it happened. Every field is optional.",
                "properties": {
                  "endpoint": {
                    "description": "API endpoint or MCP tool involved, for example /v3/compat/chat/completions.",
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "error": {
                    "description": "The error message you got.",
                    "maxLength": 2000,
                    "type": "string"
                  },
                  "model": {
                    "description": "Model id involved.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "request_id": {
                    "description": "Any id from the failing call, if you have one.",
                    "maxLength": 200,
                    "type": "string"
