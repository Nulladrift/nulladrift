        {
          "name": "simulate_dynamic_route",
          "title": "Simulate a request through the route",
          "description": "Omit version_number or set it to null to simulate the current draft, including an unpublished route. To simulate history, supply a positive version_number from list_dynamic_route_versions. Zero is invalid and does not mean draft. Minimal draft call: {\"name\":\"support\",\"version_number\":null}. Optional input and metadata supply request context; overrides.model_outcomes maps model/pool node IDs to success or fallback, and overrides.classifier_cases maps classifier node IDs to case IDs. For example {\"name\":\"support\",\"version_number\":null,\"overrides\":{\"model_outcomes\":{\"primary\":\"success\"}}} tests the documented example graph. May call a live classifier when no override is provided; does not deploy or invoke the selected final model. Inspect data.status and data.path for the routing verdict. Fix draft issues with update_dynamic_route_draft before deployment. Requires the `dynamic_routes:write` scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
