        {
          "name": "list_models",
          "title": "List models",
          "description": "Search the public model catalog before or after connecting. All arguments are optional. Start with {\"type\":\"llm\",\"limit\":3} for a few text models, or {\"limit\":3} for any models. Rows are summaries: id, name, type, model, maker, provider, service_tier, capabilities, modalities, context_window, max_output_tokens, pricing, compliance (inference_location, training, logging), release date, access, retired_at and successor. For one model's full record (parameters, every compliance fact, references) pass detail=\"full\" with q or model; it returns at most 3 rows. Pages hold 20 rows by default and at most 30, and end early rather than pass 40,000 characters, so a page can hold fewer rows than asked for. Each page starts with total, has_more and next_offset: while has_more is true, call again with offset set to next_offset. Narrow with type, provider, capability or q rather than paging the whole catalog. Omit unused filters; never send the strings \"undefined\" or \"null\", which are literal filters and can hide all results. If a filtered search is empty, retry with only limit before concluding the catalog is empty. To find models that run in the EU pass inference_location=[\"EU\"], and add storage_location=[\"EU\"] to keep retained content there too. For No training and No logging on the Rules page pass training=[\"no\"] and logging=[\"none\"], and add moderation=[\"none\"] for No provider moderation. These filters match the way Rules do; each parameter says how an unrecorded fact is treated. Optional include supports only maker,benchmarks; use get_allowed_models for effective policy. The callable id selects an endpoint; model names the underlying weights, which several endpoints can share. For comply.allowlist.models, remove only the first provider prefix from id (gemini/gemma-4-26b-moe becomes gemma-4-26b-moe). pricing holds USD rates; no pricing object means a free-priced model under the runtime plan gate. Catalog visibility does not guarantee local provider credentials, account entitlement, or policy access.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capability": {
                "anyOf": [
                  {
                    "description": "Filter by capability (repeatable). Items matching ALL listed capabilities are returned. Optional: omit when unused. Do not use the strings undefined or null as placeholders.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Filter by capability (repeatable). Items matching ALL listed capabilities are returned. Optional: omit when unused. Do not use the strings undefined or null as placeholders."
              },
              "deprecated": {
                "anyOf": [
                  {
                    "description": "Set to `true` to include retired models in results. Optional: omit when unused. Do not use the strings undefined or null as placeholders.",
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Set to `true` to include retired models in results. Optional: omit when unused. Do not use the strings undefined or null as placeholders."
              },
              "detail": {
                "anyOf": [
                  {
                    "default": "summary",
                    "description": "summary (default) or full. Full rows add parameter schemas, every compliance fact, references and descriptions, and a full page holds at most 3 rows: use it with q or model for one model. Optional: omit when unused. Do not use the strings undefined or null as placeholders.",
                    "enum": ["summary", "full"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. summary (default) or full. Full rows add parameter schemas, every compliance fact, references and descriptions, and a full page holds at most 3 rows: use it with q or model for one model. Optional: omit when unused. Do not use the strings undefined or null as placeholders."
              },
              "include": {
                "anyOf": [
                  {
                    "description": "Comma-separated public enrichments: maker,benchmarks (summary rows keep benchmarks). Use get_allowed_models for effective policy. Optional: omit when unused. Do not use the strings undefined or null as placeholders.",
                    "example": "maker,benchmarks",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Comma-separated public enrichments: maker,benchmarks (summary rows keep benchmarks). Use get_allowed_models for effective policy. Optional: omit when unused. Do not use the strings undefined or null as placeholders."
              },
              "inference_location": {
                "anyOf": [
                  {
