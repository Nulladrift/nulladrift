              },
              "expected_route_uuid": {
                "description": "Optional route identity precondition; a recycled route name does not satisfy it.",
                "format": "uuid",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique operation identifier. Reusing the same request returns its original deployed version without reactivating it. Use a fresh identifier for every new deployment.",
