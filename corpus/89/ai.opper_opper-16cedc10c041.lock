                            "type": "array",
                            "uniqueItems": true
                          },
                          "handling": {
                            "additionalProperties": false,
                            "properties": {
                              "cache_scopes": {
                                "items": {
                                  "enum": ["api_key", "organization", "shared"],
                                  "type": "string"
                                },
                                "type": "array",
