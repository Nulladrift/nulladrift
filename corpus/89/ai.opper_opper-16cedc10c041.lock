                          },
                          "except_endpoints": {
                            "items": {
                              "minLength": 1,
                              "pattern": "^\\S(?:.*\\S)?$",
                              "type": "string"
                            },
                            "type": "array",
                            "uniqueItems": true
                          },
                          "except_models": {
                            "items": {
