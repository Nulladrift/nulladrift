                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "next_actions": {
                    "description": "Suggested next steps; payment and consent remain browser actions.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "organization": {
                    "additionalProperties": true,
                    "properties": {
