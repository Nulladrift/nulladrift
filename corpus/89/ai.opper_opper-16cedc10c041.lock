        {
          "name": "create_dynamic_route_deployment",
          "title": "Create a guarded route deployment",
          "description": "Fail-closed deployment contract for infrastructure clients. expected_route_uuid (nonzero), expected_draft_revision, expected_active_version_number and idempotency_key are all required. Validates the row-locked reviewed draft and publishes one immutable version only if the reviewed identity and live pointer still match. Zero active version means unpublished. Missing preconditions are rejected before mutation. The separate path is absent on older backends, so clients must not fall back to /deploy when it is unavailable. Reusing identical arguments and the same key returns the original version without reactivating it; use a fresh key for every new deployment. meta.deployed_version is the original affected version and data is current observational state. Requires the `dynamic_routes:write` scope.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expected_active_version_number": {
                "description": "Required active version precondition; zero means currently unpublished.",
                "minimum": 0,
                "type": "integer"
              },
              "expected_draft_revision": {
                "description": "Required positive revision of the reviewed draft.",
                "minimum": 1,
                "type": "integer"
              },
              "expected_route_uuid": {
                "description": "Required nonzero identity of the route reviewed by the caller.",
                "format": "uuid",
                "type": "string"
