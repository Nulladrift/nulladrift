                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "allowlist": {
                        "additionalProperties": false,
                        "properties": {
                          "custom_models": {
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "fingerprint": {
