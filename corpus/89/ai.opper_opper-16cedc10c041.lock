                            "properties": {
                              "elementId": {
                                "type": "string"
                              }
                            },
                            "required": ["elementId"],
                            "type": "object"
                          },
                          "type": "object"
                        },
                        "properties": {
                          "type": "object"
                        },
                        "type": {
                          "type": "string"
                        }
                      },
                      "required": ["id", "outputs", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  }
