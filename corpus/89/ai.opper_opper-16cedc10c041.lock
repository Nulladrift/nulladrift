        {
          "name": "check_model_access",
          "title": "Check model access for the connected account",
          "description": "Read-only preflight for an exact callable text model ID from list_models and optional project UUID. Checks plan, provider entitlement, effective policy and billing without inference or a paid probe. Requires account:read. Policy is marked requires_authorization when controls:read is missing. Missing billing/provider information stays unknown; no_known_blockers is a snapshot and never guarantees a successful runtime call. Without a project UUID, project policy and spend caps are not assessed. Dynamic routes and BYOK models are outside this public-catalog preflight.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "Exact callable text-model ID returned by list_models.",
                "minLength": 1,
                "type": "string"
              },
              "project_uuid": {
                "anyOf": [
                  {
                    "description": "Optional project UUID within the authorized organization. Omit for organization-only checks.",
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Optional project UUID within the authorized organization. Omit for organization-only checks."
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "data": {
                "additionalProperties": true,
                "allOf": [
                  {
                    "if": {
                      "properties": {
                        "status": {
                          "const": "blocked"
                        }
                      },
                      "required": ["status"]
                    },
                    "then": {
                      "properties": {
                        "blockers": {
                          "minItems": 1
                        }
                      }
                    }
                  },
                  {
                    "if": {
                      "properties": {
                        "status": {
                          "const": "incomplete"
                        }
                      },
                      "required": ["status"]
                    },
                    "then": {
                      "properties": {
                        "blockers": {
                          "maxItems": 0
                        },
                        "unknown_account_checks": {
                          "minItems": 1
                        }
                      }
                    }
                  },
                  {
                    "if": {
                      "properties": {
                        "status": {
                          "const": "no_known_blockers"
                        }
                      },
                      "required": ["status"]
                    },
                    "then": {
                      "properties": {
                        "blockers": {
                          "maxItems": 0
                        },
                        "unknown_account_checks": {
                          "maxItems": 0
                        }
                      }
                    }
                  }
                ],
                "properties": {
                  "blockers": {
                    "description": "Machine-readable reasons for known account blockers.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "checks": {
                    "additionalProperties": true,
                    "properties": {
                      "billing": {
                        "additionalProperties": true,
                        "properties": {
                          "message": {
                            "type": "string"
                          },
                          "reason": {
                            "description": "Optional machine-readable reason; null means no reason was supplied by the underlying check.",
                            "type": ["string", "null"]
                          },
                          "snapshot": {
                            "additionalProperties": true,
                            "allOf": [
                              {
                                "if": {
                                  "properties": {
                                    "status": {
                                      "const": "available"
                                    }
                                  },
                                  "required": ["status"]
                                },
                                "then": {
                                  "required": ["balance_cents", "blocked", "blocked_scope", "currency", "scope", "spend_status"]
                                }
                              },
                              {
                                "if": {
                                  "properties": {
                                    "spend_status": {
                                      "const": "available"
                                    }
                                  },
                                  "required": ["spend_status"]
                                },
                                "then": {
                                  "required": ["spent_cents"]
                                }
                              }
                            ],
                            "properties": {
                              "balance_cents": {
                                "description": "Organization funding balance in US cents; not model-specific runtime eligibility.",
                                "type": "integer"
                              },
                              "block_reason": {
                                "type": "string"
                              },
                              "blocked": {
                                "description": "Funding snapshot verdict within blocked_scope. A free-priced model still needs its own runtime-gate preflight.",
                                "type": "boolean"
                              },
                              "blocked_scope": {
                                "enum": ["organization_only", "organization_and_project"],
                                "type": "string"
                              },
                              "currency": {
                                "const": "USD",
                                "type": "string"
                              },
                              "note": {
                                "type": "string"
                              },
                              "period_end": {
                                "format": "date-time",
                                "type": "string"
                              },
                              "period_start": {
                                "format": "date-time",
                                "type": "string"
                              },
                              "project_spent_cents": {
                                "description": "Selected project's spend in US cents, present only when project-scoped.",
                                "type": "integer"
                              },
                              "reason": {
                                "type": "string"
                              },
                              "scope": {
                                "const": "organization",
                                "type": "string"
                              },
                              "spend_status": {
                                "enum": ["available", "unknown"],
                                "type": "string"
                              },
                              "spent_cents": {
                                "description": "Organization spend in US cents for the returned billing period; not an invoice.",
                                "type": "integer"
                              },
                              "status": {
                                "description": "Unknown is not evidence of credits or permission to incur costs.",
                                "enum": ["available", "unknown"],
                                "type": "string"
                              }
                            },
                            "required": ["status"],
                            "type": "object"
                          },
                          "status": {
                            "enum": ["allowed", "blocked", "unknown"],
                            "type": "string"
                          }
                        },
                        "required": ["status"],
                        "type": "object"
                      },
                      "entitlement": {
                        "additionalProperties": true,
                        "properties": {
                          "message": {
                            "type": "string"
                          },
                          "reason": {
                            "description": "Optional machine-readable reason; null means no reason was supplied by the underlying check.",
                            "type": ["string", "null"]
                          },
                          "status": {
                            "enum": ["allowed", "blocked", "unknown"],
                            "type": "string"
                          }
                        },
                        "required": ["status"],
                        "type": "object"
                      },
                      "plan": {
                        "additionalProperties": true,
                        "properties": {
                          "free_priced": {
                            "description": "Whether the selected catalog model is free-priced.",
                            "type": "boolean"
                          },
                          "message": {
                            "type": "string"
                          },
                          "plan": {
                            "type": "string"
                          },
                          "reason": {
                            "description": "Optional machine-readable reason; null means no reason was supplied by the underlying check.",
                            "type": ["string", "null"]
                          },
                          "status": {
                            "enum": ["allowed", "blocked", "unknown"],
                            "type": "string"
                          }
                        },
                        "required": ["status"],
                        "type": "object"
                      },
                      "policy": {
                        "additionalProperties": true,
                        "properties": {
                          "message": {
                            "type": "string"
                          },
                          "reason": {
                            "description": "Optional machine-readable reason; null means no reason was supplied by the underlying check.",
                            "type": ["string", "null"]
                          },
                          "required_scope": {
                            "const": "controls:read",
                            "type": "string"
                          },
                          "scope": {
                            "enum": ["organization", "organization_and_project"],
                            "type": "string"
                          },
                          "status": {
                            "enum": ["allowed", "blocked", "unknown", "requires_authorization"],
                            "type": "string"
                          }
                        },
                        "required": ["status"],
                        "type": "object"
                      },
                      "provider_availability": {
                        "additionalProperties": true,
                        "properties": {
                          "message": {
                            "type": "string"
                          },
                          "reason": {
                            "description": "Optional machine-readable reason; null means no reason was supplied by the underlying check.",
                            "type": ["string", "null"]
                          },
                          "status": {
                            "enum": ["unknown"],
                            "type": "string"
                          }
                        },
                        "required": ["status"],
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  "inference_performed": {
                    "const": false,
                    "type": "boolean"
                  },
                  "links": {
                    "additionalProperties": true,
                    "properties": {
                      "billing": {
                        "description": "Open the authorized organization's billing page.",
                        "format": "uri",
                        "type": "string"
                      },
                      "connections": {
                        "description": "Review or disconnect agent connections in the browser.",
                        "format": "uri",
                        "type": "string"
                      },
                      "rules": {
                        "description": "Open the authorized organization's rules page.",
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "model": {
                    "description": "Resolved callable public text-model ID.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "next_actions": {
                    "description": "Suggested steps to address blockers or continue with an authorized runtime call.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "project": {
                    "additionalProperties": true,
                    "properties": {
                      "id": {
                        "description": "Selected project UUID, validated within the connected organization.",
                        "format": "uuid",
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": ["id", "name"],
                    "type": "object"
                  },
                  "runtime_success_guaranteed": {
                    "const": false,
                    "type": "boolean"
                  },
                  "status": {
                    "description": "Blocked takes precedence over unknown account checks. no_known_blockers does not verify the provider or authorize a runtime call.",
                    "enum": ["blocked", "incomplete", "no_known_blockers"],
                    "type": "string"
                  },
                  "unknown_account_checks": {
                    "description": "Account checks whose outcome could not be established, including missing authorization.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "unverified_checks": {
                    "description": "Checks not performed by this preflight, including provider availability and runtime API-key validity.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["blockers", "checks", "inference_performed", "links", "model", "next_actions", "runtime_success_guaranteed", "status", "unknown_account_checks", "unverified_checks"],
                "type": "object"
              },
              "meta": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["data", "meta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check model access for the connected account"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:844da7d9f3a35a6c0c37f242c403361ae5e74673829b5aa5a076de6d51dc57a1"
        },
        {
          "name": "create_api_key",
          "title": "Mint an API key",
          "description": "Mints a runtime API key for the project. The full key is returned only on initial creation when return_secret is not false; the user MCP tool defaults false. Reuse idempotency_key with identical arguments after uncertain results. A replay returns existing metadata without a secret; changed arguments or a deleted key return 409. Requires the `apikeys:write` scope. Runtime secrets are omitted by default; call_model uses the returned key ID. For local application setup use opper keys create --project <uuid> --name <name> --output <env-file> (native OAuth, private file delivery). Supply idempotency_key and reuse it with identical arguments on retries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "Generate a unique operation ID (for example UUID) before creation. Reuse it and the exact original arguments after a timeout or uncertain result; never generate a new ID merely to retry. A changed payload or deleted original resource returns 409. Key replays return metadata without the raw secret.",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9._:-]{1,128}$",
                "type": "string"
              },
              "kind": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "return_secret": {
                "default": false,
                "description": "Default false: keep the runtime secret on the server and return its ID for the matching model-call tool. For local application setup use opper keys create to install a key privately. Set true only when the user explicitly needs the raw secret and the client can deliver it privately; raw tool results may enter the model conversation.",
                "type": "boolean"
              },
              "uuid": {
                "description": "Project UUID",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["name", "uuid"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "created_at": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "id": {
                    "type": "integer"
                  },
                  "key": {
                    "type": "string"
                  },
                  "kind": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "prefix": {
                    "type": "string"
                  }
                },
                "required": ["id", "kind", "name", "prefix"],
                "type": "object"
              },
              "meta": {
                "description": "Empty for a single resource. Endpoint-specific context appears here rather than as a sibling of `data`.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Mint an API key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3c4f7fd5e06e33936438ee76fdc1c2fc1bc1abae9e2477d2f03df05ebace3c06"
