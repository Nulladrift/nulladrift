        {
          "name": "list_models",
          "title": "List models",
          "description": "Search the public model catalog before or after connecting. All arguments are optional. Start with {\"type\":\"llm\",\"limit\":3} for a few text models, or {\"limit\":3} for any models. Rows are summaries: id, name, type, model, maker, provider, service_tier, capabilities, modalities, context_window, max_output_tokens, pricing, compliance (inference_location, training, logging), release date, access, retired_at and successor. For one model's full record (parameters, every compliance fact, references) pass detail=\"full\" with q or model; it returns at most 3 rows. Pages hold 20 rows by default and at most 30, and end early rather than pass 40,000 characters, so a page can hold fewer rows than asked for. Each page starts with total, has_more and next_offset: while has_more is true, call again with offset set to next_offset. Narrow with type, provider, capability or q rather than paging everything. Omit unused filters; never send the strings \"undefined\" or \"null\", which are literal filters and can hide all results. If a filtered search is empty, retry with only limit before concluding the catalog is empty. To find models that run in the EU pass inference_location=[\"EU\"], and add storage_location=[\"EU\"] to keep retained content there too. For No training and No logging on the Rules page pass training=[\"no\"] and logging=[\"none\"], and add moderation=[\"none\"] for No provider moderation. These filters match the way Rules do; each parameter says how an unrecorded fact is treated. include takes only maker,benchmarks; get_allowed_models gives effective policy. The callable id selects an endpoint; model names the underlying weights, which several endpoints can share. For comply.allowlist.models, remove only the first provider prefix from id (gemini/gemma-4-26b-moe becomes gemma-4-26b-moe). pricing holds USD rates; no pricing object means a free-priced model under the runtime plan gate. For image, video or tts start with featured=true, the curated current models. Listing does not guarantee credentials, entitlement or policy access.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capability": {
                "description": "Filter by capability (repeatable). Items matching ALL listed capabilities are returned.",
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "deprecated": {
                "description": "Set to `true` to include retired models in results.",
                "type": ["boolean", "null"]
              },
              "detail": {
                "default": "summary",
                "description": "summary (default) or full. Full rows add parameter schemas, every compliance fact, references and descriptions, and a full page holds at most 3 rows: use it with q or model for one model.",
                "enum": ["summary", "full", null],
                "type": ["string", "null"]
              },
              "featured": {
                "description": "true keeps the short, hand-curated list of current models per type that Opper features.",
                "type": ["boolean", "null"]
              },
              "include": {
                "description": "Comma-separated public enrichments: maker,benchmarks (summary rows keep benchmarks). Use get_allowed_models for effective policy.",
                "example": "maker,benchmarks",
                "type": ["string", "null"]
              },
              "inference_location": {
                "description": "Keep models whose inference runs inside any of these locations. Matches like Inference location on the Rules page: `EU` includes a model running in Sweden, and a model with no recorded location only matches `GLOBAL`. Each item reports its location as `compliance.inference_location`. Values come from the catalog's location list: the ISO 3166-1 alpha-2 codes of the countries providers serve from, and the areas `EU`, `EEA` and `GLOBAL`. A country missing from the list has no model recorded in it. Repeatable, or comma-separated.",
                "items": {
                  "description": "Uppercase ISO 3166-1 alpha-2 country code, or EU, EEA or GLOBAL (EU contains its member countries). get_rule_vocabulary lists every code.",
                  "pattern": "^(?:[A-Z]{2}|EEA|GLOBAL)$",
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "input_modalities": {
                "description": "Keep models that take ALL of these inputs, comma-separated: `text`, `image`, `file`, `pdf`, `audio`, `video`. Each item lists what it takes as `input_modalities`; a model without recorded modalities matches no modality filter.",
                "example": "image,audio",
                "type": ["string", "null"]
              },
              "limit": {
                "default": 20,
                "description": "Page size, 1 to 30, default 20 (detail=full: at most 3). A larger value is capped, and 0 or less means the default, never the whole catalog. A page ends early rather than pass 40,000 characters; has_more and next_offset then say where to continue.",
                "maximum": 30,
                "minimum": 1,
                "type": ["integer", "null"]
              },
              "logging": {
                "description": "Keep models whose provider's logging stance is one of `none`, `abuse_monitoring`, `limited_debug`, `other`. Repeatable, or comma-separated. A stance that has not been researched never matches. `logging=none` is No logging on the Rules page. Each item reports its stance as `compliance.logging`.",
                "items": {
                  "enum": ["none", "abuse_monitoring", "limited_debug", "other"],
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "max_input_price": {
                "description": "Keep token-priced models whose base input price (`pricing.input[0]`, USD per million tokens) is at most this. Models not priced per token are left out.",
                "minimum": 0,
                "type": ["number", "null"]
              },
              "max_output_price": {
                "description": "Keep token-priced models whose base output price (`pricing.output[0]`, USD per million tokens) is at most this. Models not priced per token are left out.",
                "minimum": 0,
                "type": ["number", "null"]
              },
              "max_ttft_ms": {
                "description": "Keep endpoints whose measured median time to first token is at most this many milliseconds (see `include=performance`). Unmeasured endpoints are left out.",
                "minimum": 0,
                "type": ["number", "null"]
              },
              "min_context_window": {
                "description": "Keep models whose `context_window` is at least this many tokens, e.g. `200000`.",
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "min_tokens_per_second": {
                "description": "Keep endpoints Opper measured at no fewer than this many output tokens per second on its own traffic (see `include=performance`). Unmeasured endpoints are left out.",
                "minimum": 0,
                "type": ["number", "null"]
              },
              "model": {
                "description": "Keep the endpoints of one model, by the canonical key each item carries as `model` (e.g. `kimi-k3`), exact match.",
                "type": ["string", "null"]
              },
              "moderation": {
                "description": "Keep models whose provider's moderation stance is one of `none`, `optional`, `default_on`, `mandatory`. Repeatable, or comma-separated. A stance that has not been researched never matches. `moderation=none` is No provider moderation on the Rules page. Each item reports its stance as `compliance.moderation`.",
                "items": {
                  "enum": ["none", "optional", "default_on", "mandatory"],
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset.",
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "order": {
                "default": "asc",
                "description": "`asc` (default) or `desc`.",
                "type": ["string", "null"]
              },
              "output_modalities": {
                "description": "Keep models that give back ANY of these outputs, comma-separated: `text`, `image`, `embeddings`, `audio`, `video`, `rerank`, `decisions`, `speech`, `transcription`, or `all` for no filter. Each item lists what it gives back as `output_modalities`.",
                "example": "speech,transcription",
                "type": ["string", "null"]
              },
              "provider": {
                "description": "Filter by provider (company) slug as published in each item's `provider.slug` and on `/v3/providers` (e.g. `openai`, `anthropic`, `google`). Adapter keys like `vertexai` are not companies and match nothing.",
                "type": ["string", "null"]
              },
              "q": {
                "description": "Case-insensitive substring of a model's id, name, description or alias. Dots, dashes, underscores, colons, slashes and spaces are also ignored on both sides from the start of a word, so `gpt-5-1`, `gpt 5.1` and `gpt5.1` all find `gpt-5.1`.",
                "example": "claude-sonnet",
                "type": ["string", "null"]
              },
              "service_tier": {
                "description": "Keep endpoints of these processing tiers, comma-separated: `flex`, `priority` (alias `fast`), `ultrafast`, `economy`, `batch` (served by POST /v3/batches only), or `default` for standard endpoints. Each tier endpoint carries its tier as `service_tier` and its own price; request one with the `service_tier` field or by its id. E.g. `?service_tier=flex` lists every model sold at flex, `?model=kimi-k3&service_tier=priority` the priority endpoints of one model.",
                "type": ["string", "null"]
              },
              "sort": {
                "default": "id",
                "description": "Field to sort by (`id`, `name`, `provider`, `type`, `cost`, `speed`, `quality`, `context_window`, `ttft`, `tokens_per_second`). Default `id`. `speed` and `quality` are editorial tiers; `ttft` and `tokens_per_second` are measured on Opper traffic, and unmeasured endpoints sort last in either order, so `?sort=tokens_per_second&order=desc` lists the fastest first.",
                "type": ["string", "null"]
              },
              "storage_location": {
                "description": "Keep models whose provider stores retained content (logs, content retained for moderation) only inside these locations. Matches like Storage location on the Rules page, by the same containment as `inference_location`. A model whose provider keeps no content (no logs, nothing retained for moderation, no training on it by default) matches any location. Values come from the catalog's location list: the ISO 3166-1 alpha-2 codes of the countries providers serve from, and the areas `EU`, `EEA` and `GLOBAL`. A country missing from the list has no model recorded in it. Repeatable, or comma-separated.",
                "items": {
                  "description": "Uppercase ISO 3166-1 alpha-2 country code, or EU, EEA or GLOBAL (EU contains its member countries). get_rule_vocabulary lists every code.",
                  "pattern": "^(?:[A-Z]{2}|EEA|GLOBAL)$",
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "training": {
                "description": "Keep models whose provider's training stance is one of `no`, `yes`. Repeatable, or comma-separated. A stance that has not been researched never matches. `training=no` is No training on the Rules page. Each item reports its stance as `compliance.training`.",
                "items": {
                  "enum": ["no", "yes"],
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "type": {
                "description": "Filter by model type (`llm`, `image`, `tts`, `stt`, `video`, `realtime`, `embedding`, `rerank`, `ocr`, `evaluation`, `extraction`, `forecast`, `music`, `sound`).",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
