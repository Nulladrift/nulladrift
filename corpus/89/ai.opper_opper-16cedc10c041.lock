            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Inference key ID in this project; its secret is never returned by this operation",
                "type": "integer"
              },
              "max_tokens": {
                "description": "Optional output token limit. Omit to use the model default.",
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "Text conversation to send to the model. A single user message is enough to test a model.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "description": "Exact model ID from list_models, or a deployed dynamic/<route-name>.",
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "anyOf": [
                  {
                    "type": "null"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "type": {
                        "const": "json_object",
                        "type": "string"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  },
