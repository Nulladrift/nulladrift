                "type": "object"
              },
              "request_id": {
                "description": "Seeds the percentage-split draw so a run is reproducible.",
                "type": "string"
              },
              "version_number": {
                "description": "Omit or set null to simulate the current draft; supply a positive existing deployed version to simulate history. Zero is invalid.",
                "minimum": 1,
