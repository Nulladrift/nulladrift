        {
          "name": "get_context",
          "title": "Read the connected account context",
          "description": "Current user, authorized organization, plan, scopes, billing snapshot and next steps. Pass project_uuid to assess that project's spend cap. Missing billing information is explicitly unknown. Requires account:read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "project_uuid": {
                "anyOf": [
                  {
                    "description": "Optional project UUID in the authorized organization.",
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Optional project UUID in the authorized organization."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "data": {
                "additionalProperties": true,
                "properties": {
                  "billing": {
                    "additionalProperties": true,
                    "allOf": [
                      {
                        "if": {
                          "properties": {
                            "status": {
                              "const": "available"
                            }
                          },
                          "required": ["status"]
                        },
                        "then": {
                          "required": ["balance_cents", "blocked", "blocked_scope", "currency", "scope", "spend_status"]
                        }
                      },
                      {
                        "if": {
                          "properties": {
                            "spend_status": {
                              "const": "available"
                            }
                          },
                          "required": ["spend_status"]
                        },
                        "then": {
                          "required": ["spent_cents"]
                        }
                      }
                    ],
                    "properties": {
                      "balance_cents": {
                        "description": "Organization funding balance in US cents; not model-specific runtime eligibility.",
                        "type": "integer"
                      },
                      "block_reason": {
                        "type": "string"
                      },
                      "blocked": {
                        "description": "Funding snapshot verdict within blocked_scope. A free-priced model still needs its own runtime-gate preflight.",
                        "type": "boolean"
                      },
                      "blocked_scope": {
                        "enum": ["organization_only", "organization_and_project"],
                        "type": "string"
                      },
                      "currency": {
                        "const": "USD",
                        "type": "string"
                      },
                      "note": {
                        "type": "string"
                      },
                      "period_end": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "period_start": {
                        "format": "date-time",
                        "type": "string"
