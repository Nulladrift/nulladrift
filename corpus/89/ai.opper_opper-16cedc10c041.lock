                        "description": "Scopes actually authorized on this access token, not every scope the server supports.",
                        "items": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["client_id", "expires_at", "grant_id", "scopes"],
                    "type": "object"
                  },
                  "links": {
                    "additionalProperties": true,
                    "properties": {
                      "billing": {
                        "description": "Open the authorized organization's billing page.",
                        "format": "uri",
                        "type": "string"
                      },
                      "connections": {
                        "description": "Review or disconnect agent connections in the browser.",
                        "format": "uri",
                        "type": "string"
                      },
                      "rules": {
