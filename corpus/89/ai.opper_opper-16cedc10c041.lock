          "description": "Send general feedback to the Opper team: something missing (a model, a feature), unclear or wrong in the docs, a bug you noticed in passing, or something that worked well. A person reads it, but it is not a support channel and gets no reply: for a problem that blocks you or needs an answer, tell the user to open Support in the Opper platform (https://platform.opper.ai, bottom of the left sidebar). Include request_id, model, endpoint and error in context when you have them. Never include API keys, passwords or personal data. Returns an id. Requires no account connection.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "additionalProperties": false,
                "description": "Who is sending. Every field is optional.",
                "properties": {
