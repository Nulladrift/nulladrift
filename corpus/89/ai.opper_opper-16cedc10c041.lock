        {
          "name": "create_rule",
          "title": "Create a control rule",
          "description": "Creates a rule with a client-generated UUID. Setting enabled applies it immediately. Read rules again to inspect effective policy. Requires the `controls:write` scope. Supply idempotency_key and reuse it with identical arguments on retries.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "config": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "alerts_enabled": {
                        "type": ["boolean", "null"]
                      },
                      "counted_from": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "monthly_limit_cents": {
                        "minimum": 0,
                        "type": "integer",
                        "x-currency": "USD",
                        "x-unit": "cents"
                      },
                      "period": {
                        "enum": ["day", "week", "month", "total"],
                        "type": "string"
                      },
                      "soft_limit_pct": {
                        "maximum": 100,
                        "minimum": 0,
                        "type": ["integer", "null"]
                      },
                      "type": {
                        "const": "budget",
                        "type": "string"
                      }
                    },
                    "required": ["monthly_limit_cents", "type"],
                    "title": "comply.budget",
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "allowlist": {
                        "additionalProperties": false,
                        "properties": {
                          "custom_models": {
                            "items": {
                              "additionalProperties": false,
                              "properties": {
                                "fingerprint": {
                                  "type": "string"
                                },
                                "id": {
                                  "format": "uuid",
                                  "type": "string"
                                }
                              },
                              "required": ["id"],
                              "type": "object"
                            },
                            "type": "array",
                            "uniqueItems": true
                          },
                          "endpoints": {
                            "items": {
