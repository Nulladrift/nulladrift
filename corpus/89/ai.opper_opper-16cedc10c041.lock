        {
          "name": "generate_video",
          "title": "Generate a video",
          "description": "Start a video with the selected project key. Unless the user names a model, pick from list_models type=video featured=true, the curated current ones; a model's params.video (detail=full) lists durations, resolutions, aspect ratios and capabilities. A video takes from about 30 seconds to 30 minutes or more: this waits up to about 45 seconds, then returns status processing with id; call get_media_job with it until status is completed or failed. Identical calls return one job: for several versions, set variant 1, 2, 3. The result is deleted 24 hours after the job ends (1 hour on a zero-retention project) unless store is true. Normal costs and policy checks apply; usage.cost is the charge in USD. Requires runtime:call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "Shape such as 16:9 or 9:16, from params.video.aspect_ratios.",
                "type": "string"
              },
              "audio": {
