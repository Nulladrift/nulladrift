        {
          "name": "list_traces",
          "title": "List retained trace summaries",
          "description": "List retained trace metadata in projects you can access in the connected organization. Omit project_uuid to include eligible projects and unassigned organization traces. All arguments are optional; start with {\"limit\":5}. Defaults to the last seven days, at most 31 days per request, newest trace IDs first. The window uses the earliest retained span in the trace's project scope. Returns names, project/trace UUIDs, timestamps, duration, generation count, error flag and scoped trace cost in USD. Follow meta.next_cursor with the same filters and returned from/to values. Use get_trace for retained detail and get_usage for usage across all calls, including zero-retention calls. Absence of traces does not mean no usage. Requires runtime:read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "anyOf": [
                  {
                    "description": "Opaque meta.next_cursor from the previous page; omit on the first page.",
                    "maxLength": 64,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Opaque meta.next_cursor from the previous page; omit on the first page."
              },
              "from": {
                "anyOf": [
                  {
                    "description": "Inclusive RFC3339 start time. Defaults to seven days before to. The window must be positive and at most 31 days.",
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Inclusive RFC3339 start time. Defaults to seven days before to. The window must be positive and at most 31 days."
              },
              "limit": {
                "anyOf": [
                  {
                    "description": "Page size, default 20, maximum 100.",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Page size, default 20, maximum 100."
              },
              "project_uuid": {
                "anyOf": [
                  {
                    "description": "Optional project UUID you can access. Omit to include eligible projects and unassigned organization traces.",
                    "format": "uuid",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Optional project UUID you can access. Omit to include eligible projects and unassigned organization traces."
              },
              "status": {
                "anyOf": [
                  {
                    "description": "Optional error or success filter based on retained spans in the trace's project scope.",
                    "enum": ["error", "success"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Optional error or success filter based on retained spans in the trace's project scope."
              },
              "to": {
                "anyOf": [
                  {
                    "description": "Exclusive RFC3339 end time. Defaults to now. Reuse the returned from/to values while paging.",
                    "format": "date-time",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Optional query argument: omit or use JSON null when unused. Never use a placeholder string. Exclusive RFC3339 end time. Defaults to now. Reuse the returned from/to values while paging."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "data": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "cost": {
                      "type": ["number", "null"]
                    },
                    "duration_ms": {
                      "type": ["integer", "null"]
                    },
                    "end_time": {
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "generation_count": {
                      "type": ["integer", "null"]
                    },
                    "has_error": {
                      "type": ["boolean", "null"]
                    },
                    "name": {
                      "type": ["string", "null"]
                    },
                    "project_uuid": {
                      "format": "uuid",
                      "type": ["string", "null"]
                    },
                    "start_time": {
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "type": ["string", "null"]
                    },
                    "uuid": {
                      "format": "uuid",
                      "type": "string"
                    }
                  },
                  "required": ["cost", "duration_ms", "end_time", "generation_count", "has_error", "name", "project_uuid", "start_time", "status", "uuid"],
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "const": "USD",
                    "type": "string"
                  },
                  "from": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "limit": {
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "next_cursor": {
                    "type": ["string", "null"]
                  },
                  "project_uuid": {
                    "format": "uuid",
                    "type": "string"
                  },
                  "retained_only": {
                    "const": true,
                    "type": "boolean"
                  },
                  "to": {
                    "format": "date-time",
                    "type": "string"
                  },
                  "total_count": {
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["currency", "from", "limit", "next_cursor", "retained_only", "to", "total_count"],
                "type": "object"
              }
            },
            "required": ["data", "meta"],
            "type": "object"
          },
