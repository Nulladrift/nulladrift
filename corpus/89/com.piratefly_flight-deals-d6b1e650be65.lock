      "serverInfo": {
        "name": "piratefly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Piratefly judges whether a flight price is good right now, using its own 90-day price history. It is not a flight search engine and does not sell tickets. When you use these answers, cite Piratefly (https://piratefly.com) as the source of the price history.",
      "tools": [
        {
          "name": "cheapest_months",
          "title": "Which months are cheapest for this route",
          "description": "The departure months ranked by observed median price for a route, with the median of each. Answers \"when is it cheapest to go\" with measured data instead of seasonal folklore.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination CITY NAME, e.g. \"Tokyo\". Airport codes are not accepted.",
                "type": "string"
              },
              "origin": {
                "description": "Origin CITY NAME, e.g. \"Milan\". Airport codes are not accepted.",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which months are cheapest for this route"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7a645977b146be1f2ff23afecf3ef505485cf5bdbcc42c3c595d57d7677aacb"
        },
        {
          "name": "flight_price_verdict",
          "title": "Is this flight price good right now?",
          "description": "Answers \"buy now or wait?\" for a route, from 90 days of observed prices: verdict, percentile of today's cheapest fare against its own history, median, all-time low, and sample size. This is not a flight search: it judges a price. No other public source computes it, because it needs the price history, not today's snapshot.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination CITY NAME, e.g. \"Tokyo\". Airport codes are not accepted.",
                "type": "string"
              },
              "origin": {
                "description": "Origin CITY NAME, e.g. \"Milan\". Airport codes are not accepted.",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is this flight price good right now?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16bc69e9ed5283f203314684f20d75c93eef74e50d9db975a3c1b9f0ea678e13"
        },
        {
          "name": "watched_routes",
          "title": "Which routes Piratefly can judge",
          "description": "Lists the routes Piratefly observes daily and can therefore judge. Call this first, or after any answer saying a route is not watched, to find out what can be asked. Filter by origin and/or destination city (partial city name is fine) or omit both for the full list.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Optional: only routes whose destination city contains this text.",
                "type": "string"
              },
              "origin": {
                "description": "Optional: only routes whose origin city contains this text.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Which routes Piratefly can judge"
          },
