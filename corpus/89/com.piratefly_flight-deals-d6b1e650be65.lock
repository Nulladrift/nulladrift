          "title": "How far ahead to book this route",
          "description": "How many days before departure this route has historically been cheapest, from our own observations. Answers \"am I booking too early or too late?\".",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination CITY NAME, e.g. \"Tokyo\". Airport codes are not accepted.",
