        {
          "name": "llm_chat",
          "title": "LLM 채팅",
          "description": "Send a chat request to a selected LLM model and receive the assistant reply. 선택한 LLM 모델에 대화를 보내고 assistant 응답을 받습니다. 서버는 대화 히스토리를 보관하지 않는 stateless 방식 — 매 호출마다 전체 히스토리를 messages 로 전송하고, 응답의 compacted_messages 를 다음 턴의 messages 로 그대로 재사용합니다. 사용 가능한 모델은 llm_models Tool로 조회합니다. 한 요청 안에서 쓰인 토큰 사용량(긴 대화의 이전 내용을 정리하는 처리 포함)에 비례해 포인트가 차감됩니다. [모델별 토큰 단가 × 사용량(요청당 기본 5P)]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "compact": {
                "additionalProperties": {},
                "description": "히스토리 압축 옵션 { strategy: 'none'(기본) | 'sliding_window' | 'relevance', window_pairs: 유지할 user/assistant 페어 수 (기본 10, 최소 1) }. relevance 는 최근 대화와 함께 최신 질문에 필요한 이전 대화를 골라 남긴다. 긴 대화의 input 토큰 누적 방지",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "content": {
                "description": "단발 입력 — 사용자 메시지 한 건만 보내는 간편 형태. messages 와 둘 중 하나는 필수",
                "type": "string"
              },
              "max_tokens": {
                "description": "응답 최대 토큰. 미지정 시 모델 컨텍스트 기반 안전 상한으로 자동 설정, 명시한 값은 클램프 없이 그대로 적용",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "messages": {
                "description": "OpenAI 형식 [{role, content}] 배열. role 은 'system'|'user'|'assistant'. content 와 둘 중 하나는 필수, 동시 지정 시 messages 우선. 멀티턴 대화는 응답의 compacted_messages 를 다음 턴에 그대로 전송",
                "items": {},
                "type": "array"
              },
              "model": {
                "description": "모델 id (llm_models Tool로 조회 가능, 예: openai/gpt-oss-120b)",
                "type": "string"
              },
              "speed": {
                "description": "응답 속도/추론 깊이 — 'fast'(얕게, 빠름) | 'medium' | 'slow'(깊게, 느림). 한글 '빠름'|'중간'|'느림' 허용. 추론 특화 모델에서 효과가 큽니다",
                "type": "string"
