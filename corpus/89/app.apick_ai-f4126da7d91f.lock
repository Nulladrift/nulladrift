          "description": "이미지 1~50장의 비동기 생성 또는 편집 작업을 접수합니다. 요금은 품질별 장당 고정가(기본 40P·고급 350P·최고급 1,400P)이며 장수만큼 선차감하고 실패한 장은 환급합니다. 같은 요청도 매번 새 작업으로 접수하며, 접수 후에는 취소할 수 없습니다. [장당 기본 40P · 고급 350P · 최고급 1,400P]",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "background": {
                "description": "배경 방식",
                "enum": ["auto", "opaque", "transparent"],
                "type": "string"
              },
              "image_count": {
                "description": "만들 이미지 장수, 1~50",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
