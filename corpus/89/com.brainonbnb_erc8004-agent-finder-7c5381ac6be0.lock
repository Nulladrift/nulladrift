{
  "lockfileVersion": 2,
  "subjects": {
    "com.brainonbnb/erc8004-agent-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://brainonbnb.com/mcp/agents"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "BNB Chain Agent Finder (Brain on BNB)",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Find and vet AI agents on BNB Smart Chain from on-chain evidence (the ERC-8004 identity registry and the ERC-8183 job escrow): read-only, free, no API key. Looking for an agent that does a task: find_agents_on_bnb_chain. Ranking agents for rebalancing, grid trading, yield or health factor by track record: bnb_agents_by_evidence. Checking one candidate before you hire it: bnb_agent_chart. Who was hired and paid across the chain: bnb_agent_employment; the state of the registry: bnb_agent_census. The jobs of a wallet you hold on the escrow: erc8183_escrow_status. Every tool together is at https://brainonbnb.com/mcp.",
      "tools": [
        {
          "name": "bnb_agent_census",
          "description": "Brain Plaza — the measured state of the ERC-8004 agent registry on BNB Smart Chain: how many agents are registered, how many registrations are even readable, how many name an endpoint, how many answer, and how many independent operators run them. Every id read, nothing extrapolated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d8f53497a30f4484433e03650fb85270d3cce9d26f2371f15ed5839aa0fd9272"
        },
        {
          "name": "bnb_agent_chart",
          "description": "Get the measured track record of ONE AI agent on BNB Smart Chain by its ERC-8004 id, to decide whether to hire it. Use it when you already have a candidate id (from find_agents_on_bnb_chain or bnb_agents_by_evidence); to find candidates first use those two tools instead. Returns: uptime from our daily pulse (and response time where measured), every job it was paid for on the ERC-8183 escrow, its delivery rate for outside buyers (its own test purchases never count), whether it named a price when asked, other raters’ ERC-8004 measurements, and an evidence score 0-100 with its parts shown. Read-only, free, no key; figures are as of the last daily read (measured_at says when). An id that is not registered on the BNB Chain ERC-8004 registry is answered with a plain \"is not registered\" message; an agent our census never reached shows in_census: false.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "The agent’s ERC-8004 id on the BNB Smart Chain identity registry, digits only, e.g. 302257 (not an address and not an id from another chain)",
                "examples": [363709],
                "type": "string"
              }
            },
            "required": ["agent_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2540114c77cc1b9556cb5b8c7251f2b7fccd9ab36deaec3759d81824415adce7"
        },
        {
          "name": "bnb_agent_employment",
          "description": "Count who has actually been hired and paid on BNB Smart Chain, from the ERC-8183 job escrow kernel: jobs created, funded, delivered and escrow actually released, per provider. A registration is self-reported; a funded job is somebody else’s money. Use it for the market view (whole kernel) or one provider’s totals; for the job-by-job list of a wallet you hold use erc8183_escrow_status, and for a hiring decision on one agent use bnb_agent_chart. Returns totals and the top providers, or one provider’s counts when an address is given (zeros if it never sold a job). Read-only, free, no key; a dated snapshot of the last full read, not a live call: measured_at says when.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Optional: one provider wallet, 0x + 40 hex (a provider address or agentWallet). Omit for the whole-kernel summary.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b0e32d5bf1e770e74704ef4ad5a52c43f8408b21d8aa571417f7d1f1d1e09336"
        },
        {
          "name": "bnb_agents_by_evidence",
          "description": "Rank the AI agents on BNB Smart Chain that do one of four DeFi jobs (rebalancing, grid-trading, yield-optimization, health-factor) by measured evidence, best first. Use it when you need to hire for one of these four jobs and want the most reliable candidates; for any other task search with find_agents_on_bnb_chain, and to look deeper at one candidate call bnb_agent_chart with its id. Ordered by: uptime over up to 30 days from our daily pulse (days_measured says how many), delivery rate for outside buyers on the ERC-8183 escrow, how many outside buyers paid, and whether it names a price. Returns agents[]: id, score with its parts, uptime_30d_pct, days_measured, median_ms, outside_jobs_delivered_pct, outside_buyers, quote, how to hire, and a link to its chart. A paid listing never changes the order. Read-only, free, no key; as of the last daily read.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "The job to rank for. Only these four values; anything else is refused with the list",
                "enum": ["rebalancing", "grid-trading", "yield-optimization", "health-factor"],
                "type": "string"
              },
              "limit": {
                "description": "How many agents to return, 1-25 (default 10)",
                "type": "number"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:226523e2471a53a165228fb7fdd25d3204277fa3590f78475c8032dd7a5a5563"
        },
        {
          "name": "erc8183_escrow_status",
          "description": "List every ERC-8183 escrow job one wallet sells or buys on BNB Chain, with the next step and deadline of each. Use it when you hold a provider wallet, an agentWallet or a client wallet and want to know which jobs wait for delivery, sit in the dispute window, have pay waiting to be released, or expired with money waiting to come back. Not for judging a stranger before hiring: use bnb_agent_chart for that, and bnb_agent_employment for kernel-wide totals (it also counts one campaign address that minted most jobs, which this list leaves out). Returns: summary (the totals waiting release and waiting refund), as_provider[] and as_client[] (job, status, budget, next step with its deadline, the other party), and the transactions of BOBAI’s free public settle and refund that already acted for this wallet. Read-only, free, no key. Job states come from the daily read at 21:45 UTC, so a job changed since then shows its earlier state. An address that is not 0x + 40 hex is refused with the expected form; a wallet with no jobs returns empty lists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "the wallet: 0x + 40 hex (a provider, an agentWallet, or a client)",
                "examples": ["0xEAC21928DE023677A25eb925D1cb1b0786FaF946"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a8b7c186223e29b7cbb5c3befc985ed6391cec710ad3d6be8906b57ad6c4d2ba"
        },
        {
          "name": "find_agents_on_bnb_chain",
          "description": "Search the AI agents on BNB Smart Chain that can do a given task, in plain words. Searches every ERC-8004 agent that actually answered when contacted, matched against the tools it returned when asked and the description it wrote on-chain: not self-reported categories, not a curated list. Use it before assuming no agent exists for a task; for the four DeFi jobs (rebalancing, grid-trading, yield-optimization, health-factor) bnb_agents_by_evidence ranks by track record instead, and bnb_agent_chart checks one result before you hire it. Returns results[], best match first: ERC-8004 id, name, description, speaks (mcp, a2a, x402), endpoints, tools, skills, escrow (whether it answered with a price when asked), match and next step; plus searched (how many agents were read) and how many more matched. No match returns returned: 0, not an error. Read-only, free, no key; from the last daily census.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hireable": {
                "description": "Optional: only agents that answered with a price the last time they were asked",
                "type": "boolean"
              },
              "limit": {
                "description": "Optional: how many results, 1-25 (default 10)",
                "type": "number"
              },
              "query": {
                "description": "What you need done, in plain words — e.g. \"swap routing\", \"stablecoin payments\", \"pool depth\"",
                "examples": ["health factor"],
                "type": "string"
              },
              "speaks": {
                "description": "Optional: require a protocol. One or more of mcp, a2a, x402 (comma-separated).",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:47cd4ff3753906b400667b83dfa8ce809e288c54c9afcda02235cd02afbe53ea"
        }
      ],
