{
  "lockfileVersion": 2,
  "subjects": {
    "ai.planetrack/flight-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://planetrack.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "planetrack",
        "title": "PlaneTrack flight data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live and historical flight data from PlaneTrack (planetrack.ai), built on its own ADS-B receiver network and FAA schedule data. Use flight_status for a flight in the air now, flight_on_date for 'was my flight late' within the last 7 days, airport_board for departures and arrivals, aircraft_info for a registration or Mode-S hex, aircraft_overhead for what is flying over a place. Those five need no key. The other tools are for developers and use credits on a PlaneTrack API key (free keys: 2,000 credits a month at https://planetrack.ai/pricing.html#api). Always give the user the planetrack.ai link in the answer.",
      "tools": [
        {
          "name": "aircraft_info",
          "title": "Look up an aircraft",
          "description": "An aircraft by registration (e.g. N12345, G-EUPT) or Mode-S hex (e.g. a1b2c3): type, operator, where it is now if flying, and its flights in the last 7 days. Free, no key.",
          "inputSchema": {
            "properties": {
              "ident": {
                "type": "string"
              }
            },
            "required": ["ident"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ce9604770e361a176f06126bbb173b50bd657a2ca71ab09ad7feea32defcecd2"
        },
        {
          "name": "aircraft_overhead",
          "title": "What is flying over me",
          "description": "Aircraft flying right now within radius_km (max 30) of a latitude/longitude, nearest first: callsign, type, altitude, speed. Free, no key.",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "radius_km": {
                "default": 15,
                "maximum": 30,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:14c454c50c717151c30b1306e769b70befc0c86fe56d3894fd061387676f0f7c"
        },
        {
          "name": "aircraft_track",
          "title": "Recent track of one aircraft",
          "description": "Positions of one aircraft (Mode-S hex, e.g. a1b2c3) over the last minutes (5 to 1440). 20 credits.",
          "inputSchema": {
            "properties": {
              "icao24": {
                "type": "string"
              },
              "minutes": {
                "default": 720,
                "maximum": 1440,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["icao24"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a00dac451378b1d8cabfe05d0b6c41b76d8313fdecc35b1c0600ecc7a766f4e2"
        },
        {
          "name": "airport_board",
          "title": "Airport departures and arrivals",
          "description": "Live departures and arrivals board for an airport (ICAO like KJFK or IATA like JFK): flight, other airport, status, time. Free, no key.",
          "inputSchema": {
            "properties": {
              "airport": {
                "type": "string"
              }
            },
            "required": ["airport"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9a77c6978b3868d0084ff2c1829eafde7599bf36bff7dc5460fe03a69d7dc0d"
        },
        {
          "name": "flight_history",
          "title": "Flight history by callsign",
          "description": "Past legs of a flight number/callsign as flown (e.g. UAL1, BAW117): dates, airports, times, aircraft. 20 credits.",
          "inputSchema": {
            "properties": {
              "callsign": {
                "type": "string"
              },
              "days": {
                "default": 30,
                "maximum": 3650,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["callsign"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad7e09325530263765094e7f034a615d4e5caa361d520bd93b2a1abae465c315"
        },
        {
          "name": "flight_on_date",
          "title": "Was my flight late",
          "description": "What happened to a flight on a given day within the last 7 days: departure and arrival airports, scheduled and actual take-off, delay in minutes, status, aircraft. Free, no key. Older dates: point the user to the flight record at the returned link.",
          "inputSchema": {
            "properties": {
              "callsign": {
                "description": "ICAO callsign, e.g. UAL1",
                "type": "string"
              },
              "date": {
                "description": "UTC date, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["callsign", "date"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a4cfdffbd1bd5c79595c243c7f415ba92e4169f5477c01059a0b3a224f850b7"
        },
        {
          "name": "flight_reliability",
          "title": "On-time reliability",
          "description": "On-time performance for a flight number, a route (e.g. KJFK-KLAX or JFK-LAX) or a departure airport over the last 7 to 90 days (US airspace, FAA SWIM). Give exactly one of flight, route, airport. 20 credits.",
          "inputSchema": {
            "properties": {
              "airport": {
                "type": "string"
              },
              "days": {
                "default": 30,
                "maximum": 90,
                "minimum": 7,
                "type": "integer"
              },
              "flight": {
                "type": "string"
              },
              "route": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0e0eebfc2ecb86c7b4c94259bc53ae4fc3ebecfdc4b4e33e5d78ec1e1fb42e97"
        },
        {
          "name": "flight_status",
          "title": "Where is this flight now",
          "description": "Live status of a flight that is in the air now, by callsign or flight number as broadcast (e.g. UAL1, BAW117, DAL2540): route, progress, altitude, speed and estimated arrival. Free, no key.",
          "inputSchema": {
            "properties": {
              "callsign": {
                "description": "ICAO callsign, e.g. UAL1",
                "type": "string"
              }
            },
            "required": ["callsign"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1110938ba422ae1f9b603843b66f28c46a6aa7061bf9c2771789be971cc85fce"
        },
        {
          "name": "live_aircraft_near",
          "title": "Live aircraft near a point",
          "description": "Aircraft currently airborne within radius_km of a latitude/longitude, nearest first, with callsign, altitude, heading, speed and type. 10 credits.",
          "inputSchema": {
            "properties": {
              "lat": {
                "type": "number"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "type": "number"
              },
              "radius_km": {
                "default": 50,
                "maximum": 300,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48adf72a8fc3e613c17350c004a8d24b3d6e6a5bc2bfaf366afd6bb39d67a464"
        },
        {
          "name": "overhead_summary",
          "title": "Aircraft over a place",
          "description": "How many aircraft passed within km of a point over the last 1 to 3 days: passes per day, lowest pass, busiest hour (UTC), night passes, types, operators, rarest visitor. 20 credits.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 1,
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              },
              "km": {
                "default": 3,
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              }
            },
            "required": ["lat", "lon"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f922ddabf1ba886b21c8d5d357e19f489d5e8fbcc1acdc657e9df124337a358"
        }
      ],
      "digest": "sha256:3194bba18dc53b95d6bebfeb2027fe8a05ecb3c65774b2955549c70d6ca0bc6b"
    }
  }
}
