        {
          "name": "run_suite_check",
          "title": "Run a whole letting, sale, client or export shipment check (charged)",
          "description": "Runs a whole job in one call and issues one signed certificate: a letting (tenant, landlord, guarantor), a sale (buyer, seller), a finance client (client, director, counterparty) or an export shipment (buyer, consignee, endUser, intermediateConsignee, forwarder, supplier, with a destination). Everyone named is screened for sanctions, each company with a number gets its owners screened, and a property postcode adds the property risk pack; an export shipment screens each party against the US export lists too and reads the UK and US measures on the destination (a screening record, not a licensing decision). PAID from your Stratum API balance (free on a test key): confirm with the user first. PEP and adverse media are not run from here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "addressLine1": {
                "description": "Letting or sale: the first line of the property address.",
                "type": "string"
              },
              "destination": {
                "description": "Export: the two-letter ISO code of the destination country.",
                "type": "string"
              },
              "goods": {
                "description": "Export: the goods as the firm describes them (never classified).",
                "type": "string"
              },
              "issuerName": {
                "description": "The firm the certificate names as issuer, if not your account firm.",
                "type": "string"
              },
              "matterRef": {
                "description": "Your own reference for the job, printed on the certificate.",
                "type": "string"
              },
              "parties": {
                "description": "The people and companies on the job.",
                "items": {
                  "properties": {
                    "companyNumber": {
                      "description": "For a company: its Companies House number.",
                      "type": "string"
                    },
                    "country": {
                      "description": "Export: the two-letter ISO code of the country the party is in.",
                      "type": "string"
                    },
                    "dob": {
                      "description": "For a person: YYYY-MM-DD.",
                      "type": "string"
                    },
                    "kind": {
                      "enum": ["individual", "corporate"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "nationality": {
                      "description": "Two-letter ISO country code.",
                      "type": "string"
                    },
                    "role": {
                      "description": "letting: tenant, landlord, guarantor. sale: buyer, seller, payer. finance: client, director, counterparty. export: buyer, consignee, endUser, intermediateConsignee, forwarder, supplier.",
                      "type": "string"
                    }
                  },
                  "required": ["kind", "name", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "postcode": {
                "description": "Letting or sale: the property postcode (adds the property risk pack).",
                "type": "string"
              },
              "suite": {
                "enum": ["letting", "sale", "finance", "export"],
                "type": "string"
              }
            },
            "required": ["parties", "suite"],
            "type": "object"
          },
