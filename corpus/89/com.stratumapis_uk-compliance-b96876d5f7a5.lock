        {
          "name": "screen_export_controls",
          "title": "Export controls screen",
          "description": "Screen a buyer, consignee or supplier against six US export-control lists (including the Entity List) and the UK, UN, EU and OFAC sanctions lists. Paid per call from your Stratum API balance, or use a test key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter ISO country code of the party, if known.",
                "type": "string"
              },
              "name": {
                "description": "Full name as you hold it, for a person or an organisation.",
                "type": "string"
              },
              "type": {
                "description": "person, entity (organisation) or any. Default any.",
