      "instructions": "UK compliance checks from Stratum APIs: sanctions and export-control screening on the official lists, Companies House company records and owners, the FCA register, property and postcode data, and whole letting, sale or client checks with a signed certificate. Each tool uses the caller's own Stratum key and is charged like a direct API call. A possible match is never a finding: show it to a person to review. run_suite_check is paid from credit, so confirm with the user before calling it.",
      "tools": [
        {
          "name": "company_owners",
          "title": "Company owners and control",
          "description": "Who owns and controls a UK company: the people with significant control, walked up through any corporate owners, with the ultimate beneficial owners worked out. Paid per call from your Stratum API balance, or use a test key.",
