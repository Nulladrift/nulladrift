        },
        {
          "name": "screen_sanctions",
          "title": "Sanctions screen",
          "description": "Screen a person or organisation against the UK, UN, EU and US OFAC sanctions lists, refreshed daily from the official sources. Returns possible matches with a score and the listing, and names every list screened with its date. Paid per call from your Stratum API balance, or use a test key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dateOfBirth": {
                "description": "YYYY-MM-DD, YYYY-MM or YYYY. Sharpens a person match.",
                "type": "string"
              },
