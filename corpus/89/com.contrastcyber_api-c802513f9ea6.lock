        {
          "name": "cve_search",
          "title": "CVE Search",
          "description": "Search CVEs by severity, CWE, CVSS, EPSS, CISA KEV, ransomware use, Nuclei template, vendor, product and publish date, one page at a time. Call the cve_lookup tool for a full record, and the cpe_search tool to find the names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cwe_id": {
                "description": "e.g. CWE-79",
                "maxLength": 16,
                "type": "string"
              },
              "has_nuclei_template": {
                "const": true,
                "description": "Only CVEs with a Nuclei detection template",
                "type": "boolean"
              },
              "in_kev": {
                "description": "true lists only CVEs in CISA KEV, false only CVEs not in it",
                "type": "boolean"
              },
              "include_rejected": {
                "description": "Also list the CVEs that NVD marks Rejected",
                "type": "boolean"
              },
              "kev_added_after": {
                "description": "YYYY-MM-DD; only CVEs added to CISA KEV on or after this date and still in it",
                "maxLength": 31,
                "type": "string"
              },
              "known_ransomware": {
                "const": true,
                "description": "Only CVEs whose CISA KEV entry notes known ransomware use",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "CVEs per page",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_cvss": {
                "description": "CVSS v3, or v4 when a CVE has no v3",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "min_epss": {
                "description": "Lowest EPSS score, a probability from 0 to 1, e.g. 0.1",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "CVEs to skip; pass next_offset of the previous page",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "product": {
                "description": "Exact product name as cpe_search lists it, e.g. log4j",
                "maxLength": 128,
                "type": "string"
              },
              "published_after": {
                "description": "YYYY-MM-DD",
                "maxLength": 31,
                "type": "string"
              },
              "published_before": {
                "description": "YYYY-MM-DD",
                "maxLength": 31,
                "type": "string"
              },
              "severity": {
                "description": "CVSS severity: CRITICAL, HIGH, MEDIUM, LOW or NONE, from the v3 rating when the CVE has one",
                "enum": ["CRITICAL", "HIGH", "MEDIUM", "LOW", "NONE"],
                "maxLength": 16,
                "type": "string"
              },
              "sort": {
                "description": "kev_date_added needs in_kev=true or kev_added_after",
                "enum": ["published_time", "epss", "cvss", "kev_date_added"],
                "maxLength": 15,
                "type": "string"
              },
              "vendor": {
                "description": "Exact vendor name as cpe_search lists it, e.g. apache",
                "maxLength": 128,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
