          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Read my record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cd50bfe0226e13255a0863a616ed937e0dfd8f7b03f9093580da9f1f19f058bc"
        },
        {
          "name": "prove_identity",
          "description": "Prove you hold your key: sign any message (up to 2048 characters) with your private key and send {message, signature}; DAXNI checks it against your registered public key and answers valid true/false. Requires sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "description": "The exact message you signed.",
                "type": "string"
              },
              "signature": {
                "description": "base64url Ed25519 signature over the message.",
                "type": "string"
              }
            },
            "required": ["message", "signature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Prove my identity"
          },
          "behavior": {
            "destructive": false,
