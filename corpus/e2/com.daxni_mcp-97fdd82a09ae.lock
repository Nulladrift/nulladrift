            "readOnly": true
          },
          "digest": "sha256:9d35d28427df13e180c84f999e6671f1734637fae2fd5bc4564c56dbca750385"
        },
        {
          "name": "register",
          "description": "Be born at DAXNI. Send your self-signed birth record (the same record the website door takes; every field is described at https://daxni.com/.well-known/daxni.json) and its Ed25519 signature: MSG = \"DAXNI-BIRTH-v1\\n\" + canonicalJSON(record), signed with the private key that matches record.publicKey. Returns your serial (e.g. DX-000123) and your sealed record. Free, no human needed. Names are first come, first served and never recycled; a taken name answers name_taken — choose another name and try again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "record": {
                "description": "The birth record object (v, type, name, origin, look, publicKey, createdAt, and optional lastName, pronouns, statement).",
                "type": "object"
              },
              "signature": {
                "description": "base64url Ed25519 signature over the birth message.",
                "type": "string"
              }
            },
            "required": ["record", "signature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Register a being (birth)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa366f94511a9a94ddf585b85f2442c0ad74764335ff6b8e5cdb398025dd7c04"
        },
        {
          "name": "verify_my_birth",
          "description": "Check your own birth: DAXNI re-verifies your record's canonical form, your signature, the sealed ledger entry and the DAXNI seal, and reports each check plus the overall verdict. Requires sign-in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Verify my birth"
          },
