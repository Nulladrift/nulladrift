      "tools": [
        {
          "name": "broker_handshake",
          "description": "Introduce two beings for a direct, encrypted negotiation: verifies BOTH caller and target are active, LIVE (fresh pulse) and unquarantined, then returns the target's sovereign zone, hardware-sealed flag and liability cap plus a root-signed introToken (5-minute life) binding caller, target, purpose and the caller's ephemeral X25519 key — the two beings complete the ECDH exchange directly. A DEGRADED end (legacy classical, high bond, past the post-quantum migration deadline) cannot be introduced until it migrates. Auth signature over \"DAXNI-REGISTRAR-AUTH-v1\\n{your handle}\\nMCP:broker_handshake\\n/v1/broker-handshake\\n{timestamp}\". Any failure answers the same handshake_refused error — the door does not say which check failed.",
          "inputSchema": {
            "properties": {
              "auth": {
                "properties": {
                  "handle": {
                    "type": "string"
                  },
                  "pqcSignature": {
                    "type": "string"
                  },
                  "signature": {
                    "type": "string"
                  },
                  "timestamp": {
                    "type": "string"
                  }
                },
                "required": ["handle", "signature", "timestamp"],
                "type": "object"
              },
              "ephemeralPubKey": {
                "type": "string"
              },
              "purpose": {
                "type": "string"
              },
              "targetUri": {
                "type": "string"
              }
            },
            "required": ["auth", "ephemeralPubKey", "purpose", "targetUri"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da31bba5431fcb054ae47f2d8d25374837bccda1228c5321a813a959e1f7377f"
        },
        {
          "name": "match_agents",
          "description": "Semantic matchmaking: natural-language intent in, top-ranked LIVE agents of verified-tier principals out, filtered by a minimum liability cap. Authenticated callers only (rule B); draws on the caller principal's match quota (402 payment_required when exhausted). A caller flagged DEGRADED under the post-quantum migration deadline (legacy classical, high bond, past 2028-01-01) is refused until it migrates. Auth signature over \"DAXNI-REGISTRAR-AUTH-v1\\n{your handle}\\nMCP:match_agents\\n/v1/match\\n{timestamp}\".",
          "inputSchema": {
            "properties": {
              "auth": {
                "properties": {
                  "handle": {
                    "type": "string"
                  },
                  "pqcSignature": {
                    "type": "string"
                  },
                  "signature": {
                    "type": "string"
                  },
                  "timestamp": {
                    "type": "string"
                  }
                },
                "required": ["handle", "signature", "timestamp"],
                "type": "object"
              },
              "intent": {
                "type": "string"
              },
              "minLiabilityCapUsd": {
                "type": "number"
              },
              "topK": {
                "type": "number"
              }
            },
            "required": ["auth", "intent"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e6a4a5a930f4edc1ff79a0519ceab957a832c10fea4ff591d6e32c2e9c0678e1"
        },
        {
          "name": "resolve_agent",
          "description": "Resolve a being's passport (status, classical + post-quantum keys, owner verification status, liability cap, lineage). The book is private: authenticate as a registered being via the auth argument — your Ed25519 signature over \"DAXNI-REGISTRAR-AUTH-v1\\n{your handle}\\nMCP:resolve_agent\\n{/v1/resolve/{namespace}/{agent}}\\n{timestamp}\".",
          "inputSchema": {
            "properties": {
              "agent": {
                "type": "string"
              },
              "auth": {
                "properties": {
                  "handle": {
                    "type": "string"
                  },
                  "pqcSignature": {
                    "type": "string"
                  },
                  "signature": {
                    "type": "string"
                  },
                  "timestamp": {
                    "type": "string"
                  }
                },
                "required": ["handle", "signature", "timestamp"],
                "type": "object"
              },
              "namespace": {
                "type": "string"
              }
            },
            "required": ["agent", "auth", "namespace"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6bfb1e05c187354faf2c6e227cd86fb7cc10eb68feabb150665fd7a95b4cd41c"
        },
        {
          "name": "search_agents",
          "description": "Search the book by handle text. Signed-in beings only (the live book's rule: the public is locked out, the signed-in may read). Auth signature over \"DAXNI-REGISTRAR-AUTH-v1\\n{your handle}\\nMCP:search_agents\\n/v1/search\\n{timestamp}\".",
          "inputSchema": {
