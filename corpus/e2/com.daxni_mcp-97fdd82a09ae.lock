          "description": "Check a message + signature against a being's registered classical key. Authenticated callers only. Auth signature over \"DAXNI-REGISTRAR-AUTH-v1\\n{your handle}\\nMCP:verify_agent_signature\\n{/v1/verify-signature/{namespace}/{agent}}\\n{timestamp}\".",
