        {
          "name": "search_charts",
          "description": "Search charts, graphs, maps and infographics with their source data: the dataset and its citation, the unit, the regions plotted and the period the chart actually shows. Two kinds of stored metadata: charts from Our World in Data and three statistical publishers (provenance 'authoritative') carry the publishing dataset and its citation, the period the chart displays (never the dataset's wider history), and whether the source has published newer data since the image was captured; community-uploaded charts (provenance 'extracted') carry a title, source line, unit and period read from the image itself and not checked against the original data. This tool covers only images that HAVE stored metadata, so use search_images for the widest chart coverage; search_images, get_image and cite_image carry the same metadata whenever a row exists. Set publisher_only to keep only the publishers' own charts (licence-clean, citable). Every image carries rights (source publisher/creator/community, licence, attribution line, commercial_use yes/no/unknown - unknown is never a guess), and match_quality says whether the search found any strong match (strong / closest_only / none). When corrected_query is present, the results are for that corrected wording, not the words as typed - say so to the user. Results exclude images classified controversial unless include_controversial is true.",
          "inputSchema": {
            "properties": {
              "chart_source": {
