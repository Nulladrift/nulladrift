        {
          "name": "find_meme_for_text",
          "description": "Find a meme or reaction image for an idea, a mood or a sentence, ready to paste with its citation. Use it when writing a post, an article or a reply and you need a meme to make the point. Returns only images tagged as memes (the gallery's Memes filter), so it may come back empty when no meme fits. To search every kind of image, use search_images. When corrected_query is present, the results are for that corrected wording, not the words as typed - say so to the user. Results exclude images classified controversial unless include_controversial is true.",
          "inputSchema": {
            "properties": {
              "include_controversial": {
                "description": "Include images classified controversial (excluded by default).",
                "type": "boolean"
              },
              "limit": {
                "description": "How many memes to return (1-20, default 5)",
                "type": "number"
              },
              "vibe": {
                "description": "The core idea in one to three words, e.g. \"procrastination\", \"burnout\" or \"imposter syndrome\". Every extra word narrows the match: a long descriptive phrase finds only weaker \"closest\" results, so leave out synonyms and words like \"funny\" or \"relatable\".",
                "type": "string"
              }
            },
            "required": ["vibe"],
            "type": "object"
          },
