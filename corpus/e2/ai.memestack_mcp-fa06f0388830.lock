              "publisher_only": {
                "description": "Only charts imported from a licence-clean publisher: Our World in Data (CC BY 4.0), the USDA Economic Research Service (US public domain), Eurostat or the European Environment Agency (both CC BY 4.0). Community uploads, including copies of publisher charts, are left out. Default false.",
                "type": "boolean"
