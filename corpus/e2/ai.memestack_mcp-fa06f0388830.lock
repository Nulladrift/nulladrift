        {
          "name": "reverse_image_search",
          "description": "Find a meme, chart or screenshot on MemeStack from a copy of the image - to name a meme or find where an image came from: give an HTTPS image URL, or a `data:image/...;base64,...` URL for bytes pasted into the conversation, and get the same or visually similar images with their source and citation. Matches by perceptual hash (dHash hamming distance), so it finds copies and edits, not images about the same topic. Heavily rate-limited (10/min/IP) since each call hashes the input. Results exclude images classified controversial unless include_controversial is true.",
          "inputSchema": {
            "properties": {
              "include_controversial": {
                "description": "Include images classified controversial (excluded by default).",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (1-20, default 10)",
                "type": "number"
              },
              "url": {
                "description": "HTTPS image URL, or data:image/(jpeg|png|webp);base64,... URL",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Visually similar gallery images for the input image, plus input metadata.",
            "properties": {
              "citations_combined": {
                "additionalProperties": false,
                "description": "Combined attribution for all images in this response, in three formats.",
                "properties": {
                  "html": {
                    "description": "Numbered attribution list as HTML.",
                    "type": "string"
                  },
                  "markdown": {
                    "description": "Numbered attribution list as Markdown.",
                    "type": "string"
                  },
                  "plain": {
                    "description": "Numbered attribution list as plain text.",
                    "type": "string"
                  }
                },
                "required": ["html", "markdown", "plain"],
                "type": "object"
              },
              "input_meta": {
                "additionalProperties": true,
                "description": "Computed metadata for the input image.",
                "properties": {
                  "mime_type": {
                    "description": "Input MIME type.",
                    "type": "string"
                  },
                  "phash": {
                    "description": "Perceptual hash of the input.",
                    "type": "string"
                  },
                  "size_bytes": {
                    "description": "Input size in bytes.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "note": {
                "description": "Present only when the answer is empty: says no image on MemeStack looks like the input.",
                "type": "string"
              },
              "similar": {
                "description": "Visually similar images.",
                "items": {
                  "additionalProperties": true,
                  "description": "A gallery image (compact fields) with a ranking score and attribution.",
                  "properties": {
                    "canonical_url": {
                      "description": "Full-resolution image URL.",
                      "type": "string"
                    },
                    "caption": {
                      "description": "AI-generated caption.",
                      "type": "string"
                    },
                    "chart": {
                      "additionalProperties": true,
                      "description": "Structured source metadata for a chart, map or infographic, present only when MemeStack holds a record for this image (an image_chart_meta row). Absent or null means no stored metadata - never a signal that the image is not a chart.",
                      "properties": {
                        "citation_long": {
                          "description": "Full academic citation for the upstream dataset. Null for an extracted row.",
                          "type": ["string", "null"]
                        },
                        "citation_short": {
                          "description": "Short attribution line for the upstream dataset, or the source line as printed on the image when provenance is \"extracted\".",
                          "type": ["string", "null"]
                        },
                        "dataset_timespan": {
                          "additionalProperties": true,
                          "description": "The underlying dataset's own history - display-only context, NOT the period this chart shows (see rendered_period). Never usable as a date filter.",
                          "properties": {
                            "end": {
                              "description": "Latest year in the dataset, when known.",
                              "type": ["number", "null"]
                            },
                            "raw": {
                              "description": "The dataset timespan as published upstream, verbatim.",
                              "type": ["string", "null"]
                            },
                            "start": {
                              "description": "Earliest year in the dataset, when known.",
                              "type": ["number", "null"]
                            }
                          },
                          "type": ["object", "null"]
                        },
