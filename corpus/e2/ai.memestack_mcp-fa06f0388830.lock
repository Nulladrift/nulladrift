        {
          "name": "submit_image",
          "description": "Submit an image to the MemeStack review queue. Paid tool - $0.10 per submission, paid in sats over Lightning at the current BTC/USD rate or in USDC on Base via the agent payment rails (x402/L402); no account or API key. IMPORTANT: there is NO refund if moderation rejects the submission (duplicate, nsfw/spam, low quality) - the fee is the anti-spam mechanism. Accepted images await human review before publication. Accepts an HTTPS image URL or a data:image/...;base64 URL (JPEG/PNG/WebP, max 8MB). Optional caption/tags/attribution are hints shown to the AI tagger and moderators - never published verbatim. If the call fails or times out, retry with the SAME payment proof to resume - one payment delivers at most one submission and is never charged twice (up to 10 delivery attempts per payment; a corrected image_url is allowed while no submission has been created yet).",
          "inputSchema": {
            "properties": {
              "attribution": {
                "description": "Optional credit line for the original creator/source (shown to moderators, not published).",
                "maxLength": 200,
                "type": "string"
              },
              "caption": {
                "description": "Optional caption hint for the AI tagger (admin-visible, never published verbatim).",
                "maxLength": 200,
                "type": "string"
              },
              "image_url": {
                "description": "HTTPS image URL, or data:image/(jpeg|png|webp);base64,... URL. Max 8MB.",
                "type": "string"
              },
              "tags": {
                "description": "Optional tag hints (max 10).",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["image_url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Outcome of a paid submit_image call: accepted into the human review queue.",
            "properties": {
              "image_id": {
                "description": "UUID of the submitted image.",
                "type": "string"
              },
              "page_url": {
                "description": "Gallery URL where the image will be published if approved.",
                "type": "string"
              },
              "status": {
                "description": "Always 'pending_review' on success — accepted, awaiting human moderation.",
                "type": "string"
              }
            },
            "required": ["image_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
