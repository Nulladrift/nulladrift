      "instructions": "Find existing images: memes, reaction images, charts, graphs, infographics and screenshots — by what they show, by the words printed in them, or from a similar image. Every result has its source, licence and a ready citation.\n\nUse this server when the user wants an image that already exists: a meme or reaction image to make a point, a chart or graph that backs a claim, a screenshot of what someone said, or the name and source of an image they have. Not for stock photos, personal photos or a whole-web reverse image search.\n\nWhich tool:\n- search_images: any image, by meaning or keywords.\n- find_meme_for_text: a meme or reaction image for an idea, a mood or a sentence.\n- search_text_in_image: the exact words printed in an image (a quote, a caption, a sign, screenshot text).\n- search_charts: charts, graphs and maps with their source data (dataset, unit, regions, the period shown).\n- reverse_image_search: an image URL (https or data:) in; the same or similar images out, with their source.\n- find_similar: images that look like a result.\n- get_image: one image's full record, including the words in it and any chart data.\n- get_receipts: where an image came from, the claims it makes, and the publishers' charts that measure the same thing (no verdict).\n- cite_image: ready citations for up to 50 images.\n\nWrite short queries: the key words, or the exact words on the image. Each result says whether it is a strong match or only the closest one; never present a closest match as the answer. When corrected_query is present, the results are for that corrected wording, not the words as typed. An empty result means MemeStack has nothing that matches: try other words.\n\nRead memestack://attribution-guide once per session, and keep each result's citation when you use the image.",
      "tools": [
        {
          "name": "cite_image",
          "description": "Get ready-to-paste citations for one or more MemeStack images (memes, charts, screenshots): markdown, HTML and plain text naming the source and licence, plus a combined block for citing several images at once. Up to 50 ids per call.",
          "inputSchema": {
            "properties": {
              "image_ids": {
                "description": "Up to 50 image UUIDs",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["image_ids"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Per-image and combined citations for the requested image IDs.",
            "properties": {
              "citations": {
                "description": "One citation per resolved image ID.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "controversial": {
                      "description": "True when MemeStack classifies the image as controversial (likely to offend or divide a general audience). The list tools exclude such images unless include_controversial is true; by-id tools always answer and carry this flag. Absent when the API answer predates the flag.",
                      "type": "boolean"
                    },
                    "html": {
                      "description": "Attribution as HTML.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Image UUID.",
                      "type": "string"
                    },
                    "markdown": {
                      "description": "Attribution as Markdown.",
                      "type": "string"
                    },
                    "original": {
                      "additionalProperties": true,
                      "description": "Who made the ORIGINAL of the recognised meme (e.g. This Is Fine by KC Green), from a hand-checked list with sources. Present only when that list knows the meme; it credits the meme's origin, not this image's uploader, and grants no rights.",
                      "properties": {
                        "credit": {
                          "description": "Who or what the original is, e.g. \"by KC Green, from his webcomic Gunshow (\\\"On Fire\\\")\".",
                          "type": "string"
                        },
                        "source_url": {
                          "description": "The page the credit was checked against.",
                          "type": "string"
                        },
                        "title": {
                          "description": "The meme as usually named.",
                          "type": "string"
                        },
                        "year": {
                          "description": "Year the original was made or first posted; null when the source gives none.",
                          "type": ["number", "null"]
                        }
                      },
                      "required": ["credit", "source_url", "title"],
                      "type": "object"
                    },
                    "plain": {
                      "description": "Attribution as plain text.",
                      "type": "string"
                    },
                    "rights": {
                      "additionalProperties": true,
                      "description": "What you may do with the image, as far as MemeStack knows - 'unknown' wherever it knows nothing, never a guess. The citation says how to credit an image; this says whether it may be reused.",
                      "properties": {
                        "attribution": {
                          "description": "The credit line to show beside the image (the line a publisher licence asks for; otherwise where the image came from, never who owns it).",
                          "type": "string"
                        },
                        "attribution_required": {
                          "description": "True for publisher charts and creator work.",
                          "type": "boolean"
                        },
                        "commercial_use": {
                          "description": "yes only for USDA ERS, Eurostat and EEA charts; no for creator work; unknown for Our World in Data (a chart may plot third-party data under its own terms) and every community image.",
                          "enum": ["yes", "no", "unknown"],
                          "type": "string"
                        },
                        "license": {
                          "description": "Licence id (\"US-PD\" = U.S. federal public domain); null = no licence known.",
                          "enum": ["CC-BY-4.0", "US-PD", "all-rights-reserved", null],
                          "type": ["string", "null"]
                        },
                        "license_name": {
                          "description": "Human licence label, e.g. \"CC BY 4.0\".",
                          "type": ["string", "null"]
                        },
                        "license_url": {
                          "description": "The licence text, or the creator terms.",
                          "type": ["string", "null"]
                        },
                        "note": {
                          "description": "The one condition or caveat that changes what you may do, or null.",
                          "type": ["string", "null"]
                        },
                        "publisher": {
                          "additionalProperties": true,
                          "description": "The publisher of a publisher image; null otherwise.",
                          "properties": {
                            "key": {
                              "description": "Publisher key: \"owid\", \"usda_ers\", \"eurostat\" or \"eea\".",
                              "type": "string"
                            },
                            "name": {
                              "description": "Publisher name.",
                              "type": "string"
                            }
                          },
                          "type": ["object", "null"]
                        },
                        "source": {
                          "description": "publisher = imported from a licence-clean publisher (Our World in Data, USDA ERS, Eurostat, EEA); creator = a Verified Creator's own upload (all rights reserved); community = everything else (uploads, bot saves, imports, AI images) - MemeStack grants no licence to it.",
                          "enum": ["publisher", "creator", "community"],
                          "type": "string"
                        }
                      },
                      "type": "object"
                    }
                  },
                  "required": ["html", "id", "markdown", "plain"],
                  "type": "object"
                },
                "type": "array"
              },
