                    },
                    "historical_guide_url": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    },
                    "relationship": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["author", "historical_guide_url", "note", "relationship", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "result_count": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "results": {
