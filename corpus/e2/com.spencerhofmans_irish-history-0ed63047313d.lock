        {
          "name": "get_sources",
          "title": "Irish History Sources and Further Reading",
          "description": "Return the Sources and Further Reading section from one of Spencer Hofmans' historical companion guides. Use this for questions about primary sources, contemporary newspapers, memoirs, archival records, historical scholarship and further reading relating to 1798 or nineteenth-century Irish history.",
