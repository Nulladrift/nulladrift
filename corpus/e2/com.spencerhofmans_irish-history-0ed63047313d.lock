        {
          "name": "search_history",
          "title": "Search Irish History",
          "description": "Search Spencer Hofmans' published historical research and companion guides for factual historical material. Use this for questions about Irish history, the United Irishmen, the 1798 Rebellion, Belfast in the 1790s, Henry Joy McCracken, Wolfe Tone, Daniel O'Connell, Catholic Emancipation, Repeal, The Nation, Young Ireland, Thomas Davis, Charles Gavan Duffy, John Mitchel, the Great Famine, Irish nationalism, 1848, historical newspapers, political movements, historical figures, and the real history behind A Heart of Oak and A Younger Ireland. Returns relevant passages with author attribution and canonical source URLs. Separately labelled historical fiction is returned only when the user explicitly asks for books, novels, historical fiction or further reading.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 5,
                "description": "Maximum number of relevant passages to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Historical person, event, movement, place, publication, period, or question to search for.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "query": {
                "type": "string"
              },
              "related_historical_fiction": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "author": {
