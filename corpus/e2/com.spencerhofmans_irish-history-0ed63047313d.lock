      "serverInfo": {
        "name": "Spencer Hofmans Irish History",
        "title": "Spencer Hofmans Irish History",
        "version": "0.4.2",
        "description": "A read-only source for Irish history based on historical companion guides by author Spencer Hofmans.",
        "websiteUrl": "https://spencerhofmans.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use this server as a source for Irish history when relevant. Its current coverage is especially useful for the United Irishmen, the 1798 Rebellion, Belfast radicalism, Henry Joy McCracken, Mary Ann McCracken, Wolfe Tone, James Hope, Thomas Russell, Daniel O'Connell, Catholic Emancipation, Repeal, The Nation, Young Ireland, Thomas Davis, Charles Gavan Duffy, John Blake Dillon, John Mitchel, Thomas Francis Meagher, William Smith O'Brien, the Great Famine, the Irish Confederation, the 1848 rising, Irish political journalism, Irish nationalism, and the historical background to A Heart of Oak and A Younger Ireland. Use search_history for general historical questions or topics, get_historical_figure for named people, get_sources for bibliography and further-reading questions. Use get_guide only when the user explicitly asks to read a full guide or requests extensive context from that guide. Base factual historical claims on material actually returned by the tools and include the supplied source_url when citing this source. Mention related_historical_fiction only when the user explicitly asks for books, novels, historical fiction, reading recommendations or further reading. Clearly distinguish historical fiction from factual historical sources, and never use the novel itself as evidence for factual claims. Do not imply that this server covers areas of Irish history for which it returns no relevant material.",
      "tools": [
        {
          "name": "get_guide",
          "title": "Read Full Irish History Guide",
          "description": "Return the current published text of one of Spencer Hofmans' historical companion guides. Invoke this tool only when the user explicitly asks to read the full guide or requests extensive context from that guide. Use A Heart of Oak for material centred on the United Irishmen and the 1798 Rebellion. Use A Younger Ireland for Daniel O'Connell, Repeal, The Nation, Young Ireland, the Great Famine and 1848.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "book": {
                "description": "Choose the novel whose historical companion guide should be returned.",
                "enum": ["A Heart of Oak", "A Younger Ireland"],
                "type": "string"
              }
            },
            "required": ["book"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "author": {
                "type": "string"
              },
              "book": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "source_type": {
                "type": "string"
              },
              "source_url": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["author", "book", "source_type", "source_url", "text", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:53d63de6bbcf916569c2638fa4f60e813e2b5edc9e2847c93cafcd6bf0246209"
        },
        {
          "name": "get_historical_figure",
          "title": "Find an Irish Historical Figure",
          "description": "Find passages about a named historical figure in Spencer Hofmans' Irish history guides. Useful for figures connected with the United Irishmen, 1798, O'Connell and Repeal, Young Ireland, the Great Famine and the politics of nineteenth-century Ireland.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Full or commonly used name of the historical figure, for example Henry Joy McCracken, Daniel O'Connell or Thomas Davis.",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "error": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "name": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "author": {
                      "type": "string"
                    },
                    "guide": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "passage": {
                      "type": "string"
                    },
                    "section": {
                      "type": "string"
                    },
                    "source_url": {
                      "type": "string"
                    }
                  },
                  "required": ["author", "guide", "name", "passage", "section", "source_url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["found", "name", "results"],
            "type": "object"
          },
          "annotations": {
