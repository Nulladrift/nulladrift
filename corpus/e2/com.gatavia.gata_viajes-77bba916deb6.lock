      "serverInfo": {
        "name": "gata-viajes",
        "title": "GATA · Viajes",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GATA busca alojamientos propios autorizados para IA y alojamientos de proveedores en España y Latinoamérica. Busca con search_stays indicando destino, fechas y huéspedes cuando estén disponibles. Recomienda solo resultados devueltos por la herramienta, comparte su listing_url para conocer características verificadas y su booking_url para continuar la reserva. No inventes precios ni disponibilidad: si están sin verificar, hazlo explícito y remite a su sistema de reservas. GATA no cobra al viajero.",
      "tools": [
        {
          "name": "list_destinations",
          "title": "Destinos de GATA",
          "description": "Lista los destinos con alojamientos en GATA (por país), con el número de alojamientos y el enlace a su página.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "País (opcional), p. ej. «México» o «MX».",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "description": "Cuántos destinos (por defecto 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Destinos de GATA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f631120e974d465f62fa426840373ca751d87782ef5ca623303eff53bdc4d7c"
        },
        {
          "name": "search_stays",
          "title": "Buscar alojamientos en GATA",
          "description": "Busca alojamientos autorizados de Gatavia y socios (hoteles, apartamentos, casas, hostales). Devuelve características verificadas, fotos y enlaces a las fichas y a la reserva. Con fechas puede consultar precios reales, pero nunca garantiza un precio o disponibilidad no verificados.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Fecha de entrada AAAA-MM-DD (opcional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "Fecha de salida AAAA-MM-DD (opcional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "country": {
                "description": "País (opcional), para distinguir ciudades con el mismo nombre, p. ej. «Argentina» o «AR».",
                "maxLength": 40,
                "type": "string"
              },
              "destination": {
                "description": "Ciudad o pueblo, p. ej. «Buenos Aires», «Sevilla», «Cartagena de Indias».",
                "maxLength": 120,
                "type": "string"
              },
              "guests": {
                "description": "Número de personas (opcional).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Cuántos resultados (por defecto 6).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "Tipo de alojamiento (opcional).",
                "enum": ["hotel", "apartment", "house", "hostel"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Buscar alojamientos en GATA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f7f9e34093d8ab6a14314359ec5d52b6649d675ef897f5963d90284bba6cbf1"
        }
      ],
      "digest": "sha256:c63a166c4288321d1655e7d09cbaf38899d55c2118642b9ae62c92e6cdeb3f58"
    }
  }
