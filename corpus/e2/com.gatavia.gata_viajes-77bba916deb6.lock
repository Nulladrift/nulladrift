      },
      "transport": {
        "type": "http",
        "url": "https://gata.gatavia.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "gata-viajes",
        "title": "GATA · Viajes",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GATA (de Gatavia) busca alojamientos en España y Latinoamérica hispanohablante y ayuda a organizar viajes en grupo. Usa search_stays con el destino (y fechas y personas si las sabes). Recomienda solo alojamientos devueltos por la herramienta y comparte su booking_url para reservar o su map_url para verlos en el mapa de GATA. Si no hay fechas, no hay precio: no lo inventes. La reserva y el pago se hacen en el sitio del socio (Booking.com en Latinoamérica); GATA no cobra al viajero.",
      "tools": [
        {
          "name": "list_destinations",
          "title": "Destinos de GATA",
          "description": "Lista los destinos con alojamientos en GATA (por país), con el número de alojamientos y el enlace a su página.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "País (opcional), p. ej. «México» o «MX».",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "description": "Cuántos destinos (por defecto 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Destinos de GATA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f631120e974d465f62fa426840373ca751d87782ef5ca623303eff53bdc4d7c"
        },
        {
          "name": "search_stays",
          "title": "Buscar alojamientos en GATA",
          "description": "Busca alojamientos (hoteles, apartamentos, casas, hostales) en una ciudad o pueblo de España o Latinoamérica hispanohablante. Devuelve nombre, tipo, estrellas, valoración, foto, enlace para reservar (booking_url) y enlace al mapa de GATA (map_url). Con fechas de entrada y salida intenta añadir precio y disponibilidad reales; sin fechas no hay precio.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Fecha de entrada AAAA-MM-DD (opcional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "Fecha de salida AAAA-MM-DD (opcional).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "country": {
                "description": "País (opcional), para distinguir ciudades con el mismo nombre, p. ej. «Argentina» o «AR».",
                "maxLength": 40,
                "type": "string"
              },
              "destination": {
                "description": "Ciudad o pueblo, p. ej. «Buenos Aires», «Sevilla», «Cartagena de Indias».",
                "maxLength": 120,
                "type": "string"
              },
              "guests": {
                "description": "Número de personas (opcional).",
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "description": "Cuántos resultados (por defecto 6).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "Tipo de alojamiento (opcional).",
                "enum": ["hotel", "apartment", "house", "hostel"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Buscar alojamientos en GATA"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e9fed64bfef6908e50402a7b9c8248deb1fc3187879561e86d8d956132f54374"
        }
      ],
      "digest": "sha256:dd740fffb5a700f208996b7bad1a85618406626fb9956197c1cb8e8ae6e9f21b"
    }
  }
}
