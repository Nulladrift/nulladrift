        {
          "name": "check_products_compatibility",
          "description": "Check whether two exact products are compatible. Use for requests like “will this fit,” “does this work with,” “compatible with,” or “is an adapter needed?” It checks identifiers and source-backed specifications for accessories, parts, consumables, chargers, cables, mounts, batteries, computer components, and automotive parts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "candidate_product": {
                "description": "The accessory, part, consumable, adapter, or component being checked",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              },
              "primary_product": {
                "description": "The product, device, vehicle, or system the candidate must work with",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              },
              "required_use": {
                "description": "Optional explanation of the intended use",
                "maxLength": 500,
                "type": "string"
              },
              "vehicle_vin": {
                "description": "Optional 17-character VIN for authoritative NHTSA vehicle identification",
                "pattern": "^[A-HJ-NPR-Z0-9]{17}$",
                "type": "string"
              }
            },
            "required": ["candidate_product", "primary_product"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "best_price_usd": {
                "minimum": 0,
                "type": "number"
              },
              "confidence": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "data": {},
              "decision": {
                "type": "string"
              },
              "freshness": {
                "additionalProperties": false,
                "properties": {
                  "cache_hit": {
                    "type": "boolean"
                  },
                  "expires_at": {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$",
                    "type": "string"
                  }
                },
                "required": ["cache_hit", "expires_at"],
                "type": "object"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recommendation": {
                "type": "string"
              },
              "source_names": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sources_checked_count": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "sources_failed": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["confidence", "data", "decision", "freshness", "limitations", "recommendation", "source_names", "sources_checked_count", "sources_failed", "status"],
            "type": "object"
