      "instructions": "Нишка (nishka.app) е български цифров асистент. Това е отвореният ѝ слой: проверени факти за институции и услуги (Основа), досието на всяка улица и квартал в Пловдив (спиране на вода, ремонти, съобщения, решения на съвета, паркиране) и какво се е променило, досието за всяка улица и всеки квартал в София (засега с места наблизо; ще добавим официални съобщения, след като проверим условията на всеки източник), законови срокове и работни дни (Срок) и официални документи от първични източници (Извор), търсене по име: find_place (първо собствените данни на Нишка, после картографската услуга), и работни процеси: prepare_letter (коя е компетентната институция, проверен контакт с нея, законовият срок за отговор и, за сигнали в Пловдив, София, Варна и Бургас с проверен адресат, чернова, която човек изпраща — никога агент самостоятелно), institution_responsiveness (броят отговори — само при поне 5 отчетени случая) и document_deadline (кога изтича валидността на документите и кога са дължими местните данъци, с източници). Досиета на институциите: institution_record (проверените контакти на една институция с датите на проверките, дали страниците ѝ за контакт се отварят, правилата и таксите, за които отговаря, и промените в тях, резултатите от писмата при поне 5 отчетени случая) и institutions_overview (разпределения сред институциите в един град, никога класация). Само четене; ключ не е нужен, с безплатен ключ лимитът е по-висок. Ръководство за агенти: https://nishka.app/agents.md\n\nЦитирайте всеки използван факт: адреса на официалния източник (citations[].url) и датата на проверка или публикуване. Когато няма намерен запис, кажете го и насочете към институцията; не предполагайте контакти, такси или срокове.\n\nNishka (nishka.app) is a Bulgarian civic assistant. This is its open layer: checked facts about public services in Plovdiv, Sofia, Varna and Burgas (Основа, CC BY 4.0), Bulgarian legal deadlines and working days (Срок), an index of official primary sources such as the State Gazette and council decisions (Извор), the record of any Plovdiv street or quarter (plovdiv_place_record) and what changed in those sources (plovdiv_changes), and the record of any Sofia street or quarter (sofia_place_record; places nearby for now — Sofia's official notices follow once their terms are checked). Finding a place by name: find_place (Nishka's own data, then the map service; Latin or Cyrillic). Workflows: prepare_letter (which institution, its checked contact, the legal deadline and, for signals in Plovdiv, Sofia, Varna and Burgas with a checked addressee, a draft — a person sends it, never the agent on its own), institution_responsiveness (counts from 5 outcomes) and document_deadline (document expiry and local tax dates with sources). Institution records: institution_record (an institution's checked contacts with check dates, whether its contact pages answer, the rules and fees it handles and what changed in them, letter outcomes from 5) and institutions_overview (distributions across a city's institutions, never a ranking). Read-only; no key needed, a free key raises the limit. Guide for agents: https://nishka.app/agents.md\n\nEvery result carries citations: cite citations[].url and give checkedOn or publishedOn. Query in Bulgarian. If nothing is found, say so and point to the institution; never guess contacts, fees or deadlines. Answer people in Bulgarian with the polite „Вие“ unless they write in another language.",
