        {
          "name": "institution_record",
          "title": "Досие на институция",
          "description": "One Bulgarian public institution's record from Nishka's checked data: its contacts with the official source and the date each was checked (and when it is due again), whether its contact pages answer (weekly check), the rules and fees it handles and what changed in them since Nishka began keeping history, and letter outcomes people reported (pooled, only from 5). Facts, dates and counts — never a score or a verdict. Give the Основа id or the institution's name.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "plovdiv, sofia, varna or burgas; needed when the name is not an id.",
                "enum": ["plovdiv", "sofia", "varna", "burgas"],
                "type": "string"
              },
              "institution": {
                "description": "Основа id (plovdiv/service/rayon-trakia) or name, e.g. „Район Тракия“, „НАП Пловдив“, „Call Sofia“.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["institution"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "candidates": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "citations": {
                "description": "Every source the result rests on. Cite url; give checkedOn or publishedOn.",
                "items": {
                  "properties": {
                    "checkedOn": {
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "licence": {
                      "enum": ["CC-BY-4.0", "official-record", "ODbL-1.0"],
                      "type": "string"
