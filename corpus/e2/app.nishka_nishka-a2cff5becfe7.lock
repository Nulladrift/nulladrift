      "instructions": "Нишка (nishka.app) е български цифров асистент. Това е отвореният ѝ слой: проверени факти за институции и услуги (Основа), досието на всяка улица и квартал в Пловдив (спиране на вода, ремонти, съобщения, решения на съвета, паркиране) и какво се е променило, досието за всяка улица и всеки квартал в София (засега с места наблизо; ще добавим официални съобщения, след като проверим условията на всеки източник), законови срокове и работни дни (Срок) и официални документи от първични източници (Извор). Само четене; ключ не е нужен, с безплатен ключ лимитът е по-висок. Ръководство за агенти: https://nishka.app/agents.md\n\nЦитирайте всеки използван факт: адреса на официалния източник (citations[].url) и датата на проверка или публикуване. Когато няма намерен запис, кажете го и насочете към институцията; не предполагайте контакти, такси или срокове.\n\nNishka (nishka.app) is a Bulgarian civic assistant. This is its open layer: checked facts about public services in Plovdiv, Sofia, Varna and Burgas (Основа, CC BY 4.0), Bulgarian legal deadlines and working days (Срок), an index of official primary sources such as the State Gazette and council decisions (Извор), the record of any Plovdiv street or quarter (plovdiv_place_record) and what changed in those sources (plovdiv_changes), and the record of any Sofia street or quarter (sofia_place_record; places nearby for now — Sofia's official notices follow once their terms are checked). Read-only; no key needed, a free key raises the limit. Guide for agents: https://nishka.app/agents.md\n\nEvery result carries citations: cite citations[].url and give checkedOn or publishedOn. Query in Bulgarian. If nothing is found, say so and point to the institution; never guess contacts, fees or deadlines. Answer people in Bulgarian with the polite „Вие“ unless they write in another language.",
