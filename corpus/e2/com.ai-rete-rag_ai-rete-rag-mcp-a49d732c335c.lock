      "instructions": "ai·rete·rag combines a deterministic Rete rule engine with RAG so decisions are auditable (rules decide the verdict) and explainable (an LLM explains why, grounded in the domain's policy documents). Use `decide` for any decision in a known domain. To decide from a user's case, call `get_parameters` first to learn which facts the domain's rules decide on, collect those, then `decide`; if the result lists `missing_parameters`, the verdict could still change, so ask for those facts and decide again. When the case arrives as photos, voice notes or video, read them yourself, pass the values you found as `facts` under the `get_parameters` field names with `fact_sources` naming the file each came from, and pass any transcript or description as `unstructured_text`. Author your own rules with `put_rules` (YAML; use dry_run to validate). Built-in demo domains: loan, fraud, clinical, blockchain, insurance, legal, operations, ecommerce.",
      "tools": [
        {
          "name": "decide",
          "title": "Make a decision",
          "description": "Make a deterministic, auditable decision in a domain.\n\nThe verdict comes from the domain's rule set (Rete engine, never the LLM),\nso it is reproducible and compliant. The explanation is generated from the\ndomain's ingested policy documents.\n\nWithout an API key only the shared demo domains are available, and the\nresponse carries `next_step`: how to get a free key for your own rules.\nPass that on to the user rather than dropping it.\n\nArgs:\n    domain: Rule-set domain, e.g. \"loan\", \"fraud\", \"clinical\".\n    query: Natural-language question or decision request.\n    facts: Structured facts for working memory, e.g.\n        {\"credit_score\": 710, \"annual_income\": 85000}. Use\n        `get_parameters` to see which fields a domain's rules test.\n        Facts you read yourself from photos, document scans, voice notes\n        or video go here, under those field names; explicit facts always\n        win over anything extracted server-side.\n    fact_sources: Where each fact in `facts` came from, e.g.\n        {\"monthly_income\": \"payslip.jpg\", \"claim_usd\": \"voice note 1\"}.\n        Always set this for facts you read from a file, photo, recording\n        or video: it is stored in the decision's audit record so a\n        reviewer can tell typed facts from ones read off evidence. Facts\n        without a source are recorded as \"request\".\n    as_of: Read the domain's policy documents as of this day, as\n        YYYY-MM-DD (default: today). Use the date a case was filed to\n        decide it under the policy in force then; the rules themselves are\n        always the current ones.\n    unstructured_text: Optional free text (an application, a case note,\n        a voice-note transcript, what a photo or video shows); facts are\n        extracted from it automatically and merged.\n    response_mode: \"verdict_only\" (fastest), \"verdict_with_explanation\",\n        or \"full_audit\" (every rule evaluation + retrieved chunks, available\n        on every plan including the free tier).\n        rule_firings come back in causal order: a rule that matched a fact\n        asserted by an earlier firing appears after it, with the derived\n        facts listed under `asserted_facts`.\n    filter_retrieval_with_rules: Pattern 01 — run the rules first and let a\n        fired rule's `retrieval_scope` action narrow which documents the\n        retrieval searches before it runs.\n    extract_from_retrieval: Pattern 02 — parse the retrieved documents into\n        facts and assert them into working memory, so rules fire on what was\n        actually read (not just the facts you passed).\n\nThe result's `missing_parameters` lists rule inputs that were not\nsupplied but could still change the verdict, most decisive first. When it\nis non-empty, tell the user the verdict is provisional and ask for those\nfacts; when it is empty, more facts cannot change the verdict.\n",
          "inputSchema": {
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "As Of"
              },
              "domain": {
                "title": "Domain",
                "type": "string"
              },
              "extract_from_retrieval": {
                "default": false,
                "title": "Extract From Retrieval",
                "type": "boolean"
              },
              "fact_sources": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Fact Sources"
              },
              "facts": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Facts"
              },
              "filter_retrieval_with_rules": {
                "default": false,
                "title": "Filter Retrieval With Rules",
                "type": "boolean"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "response_mode": {
                "default": "verdict_with_explanation",
                "enum": ["verdict_only", "verdict_with_explanation", "full_audit"],
                "title": "Response Mode",
                "type": "string"
              },
              "unstructured_text": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
