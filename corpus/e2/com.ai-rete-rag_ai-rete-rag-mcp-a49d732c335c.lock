        {
          "name": "import_policy_rules",
          "title": "Draft rules from a policy",
          "description": "Convert a written policy document into DRAFT decision rules (LLM-assisted).\n\nReturns validated draft rules (when/action, including chained asserts where\nthe policy stages its determinations), derived rule→rule edges, and overlap\nwarnings. Each returned rule carries a `citation` field holding the policy\nsentence it encodes (also summarized in the top-level `citations` map).\nCoverage runs the other way too: `uncovered_sentences` lists policy\nsentences no rule's citation points back to (out of\n`policy_sentence_count`), and `unverified_citations` names rules whose\nquote is missing or not found verbatim in the policy. Show both to the\nuser: an uncovered sentence may need a rule; an unverified one may be a\nparaphrase that misstates the policy. `background_sentences` is the subset\nof uncovered sentences with no obligation language (definitions,\npreamble); lead with the others, but mention these too, since the split\nis a keyword heuristic.\nNOTHING IS SAVED: review the drafts (and show them to the user), then\npersist explicitly with `put_rules` — validate first with dry_run=true,\nand keep each rule's `citation` in the YAML you save so the audit trail\nback to the policy survives.\n\nArgs:\n    domain: Domain the rules are drafted for (an owned domain or a new name).\n    policy_text: The policy document text (max ~50k characters).\n",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              },
              "policy_text": {
                "title": "Policy Text",
                "type": "string"
              }
            },
            "required": ["domain", "policy_text"],
            "title": "import_policy_rulesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "import_policy_rulesOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a10ca2cdaa44b4f2b2659d93a30703485549f131f223711d0bdb7e2ff6956f6c"
        },
        {
          "name": "ingest_text",
          "title": "Ingest policy text",
          "description": "Add policy/reference text to a domain's knowledge base.\n\nThe text is chunked and embedded; explanations for future decisions in this\ndomain will cite it. Creating a new domain claims it for your account\n(plan limits apply). Ingesting into a built-in demo domain gives your\naccount its own copy of that demo (it counts as one of your domains); the\nshared demo others see is unchanged. On team plans, only the domain admin (the member\nwho created the domain, or the subscription owner) can add documents.\n\nDocuments can be dated. A decision only cites documents in force on its\ndate, so a replaced policy is never quoted for a new decision. To publish a\nnew version, ingest it under a new `source` with `supersedes` naming the old\none: the old document stops applying on the new one's `effective_from`\n(today if not given), and the new one starts that day. A document can be\nsuperseded only once; to replace a successor, supersede the successor.\n\nArgs:\n    domain: Domain to ingest into (existing or new).\n    text: The policy or reference text.\n    source: Optional source name shown in the document list.\n    effective_from: First day this document applies, as YYYY-MM-DD\n        (default: always).\n    effective_until: First day it no longer applies, as YYYY-MM-DD\n        (default: no end).\n    supersedes: Source name of the document this one replaces.\n",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              },
              "effective_from": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Effective From"
              },
              "effective_until": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Effective Until"
              },
              "source": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Source"
              },
              "supersedes": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Supersedes"
              },
              "text": {
                "title": "Text",
                "type": "string"
              }
            },
            "required": ["domain", "text"],
            "title": "ingest_textArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
