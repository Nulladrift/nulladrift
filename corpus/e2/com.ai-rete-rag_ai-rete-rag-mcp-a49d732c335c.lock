        {
          "name": "get_parameters",
          "title": "Get decision parameters",
          "description": "List the input parameters a domain's rules decide on — the facts to\ncollect before calling `decide`. Derived from your account's own copy of\nthe rules, so it covers your custom domains too.\n\nEach parameter has its `field` name (the key to use in `facts`), `kind`\n(number / boolean / string), the `tests` rules make on it (e.g. >= 720 —\nmatch these units and scales), the `rules` and `verdicts` it can lead to,\nand `max_salience`. Parameters come most decisive first: those feeding\nthe highest-salience rules, which win when several rules fire. Also\nreturns every verdict the domain can reach.\n",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "get_parametersArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_parametersOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
