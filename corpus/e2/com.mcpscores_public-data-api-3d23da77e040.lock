      "instructions": "You need one public fact to keep going and have no API key for it: where a place is, what time it is there, what a rate was. 31 lookups; tools/list has the set. TOOL CALLS ARE x402-PAID in USDC on Base: send the base64 X-PAYMENT header on this POST /mcp request, or call the equivalent GET endpoint. An unpaid call answers with a valid x402 accepts array and settles nothing, and initialize, ping, tools/list and GET /health are free. MISSING DATA IS NAMED AND NEVER BILLED: a lookup that finds nothing refuses, names the field that came back empty, and settles nothing rather than charging you for an empty shell. A refusal is not a failure and costs you nothing, so it is safe to probe a lookup you are unsure about. Every response names the upstream it was read from, so you can cite it or re-check it yourself. Most upstreams are open public sources (OpenStreetMap/Nominatim, Open-Meteo, ECB, SEC EDGAR, public DNS). v1_stock_quote is the exception: it reads Yahoo Finance, whose terms restrict redistribution, so treat that one tool's output as a delayed courtesy quote for your own use and not as licensed market data. No tool here is an authoritative registry; a result is evidence of what the upstream currently says, not ground truth. Rate limits are keyed on client address and published in GET /health.",
