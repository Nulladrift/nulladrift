{
  "lockfileVersion": 2,
  "subjects": {
    "com.ecuafact.docsapi/documentacion": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docsapi.ecuafact.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ecuafact-docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Documentacion publica de la API de facturacion electronica Ecuafact (SRI, Ecuador). Solo lectura y sin credenciales. Usa buscar_documentacion para ubicar la guia, leer_guia para leerla (con seccion para leer solo una parte), explicar_error para un codEstado (por ejemplo 3002), ejemplo_comprobante para un JSON de ejemplo por tipo y consultar_referencia para el contrato OpenAPI de un endpoint. Este servidor no opera cuentas: para emitir o consultar comprobantes de una cuenta, el usuario conecta el servidor MCP de la cuenta, que se explica en la guia 'mcp'.",
      "tools": [
        {
          "name": "buscar_documentacion",
          "description": "Busca en la documentacion y devuelve las guias relevantes con un fragmento y su URL. Despues, lee la guia con leer_guia.",
          "inputSchema": {
            "properties": {
              "consulta": {
                "description": "Que buscar, por ejemplo 'nota de credito', 'firma de webhooks' o 'Idempotency-Key'."
              },
              "maximo": {
                "default": 8,
                "description": "Maximo de resultados (1 a 20, por defecto 8).",
                "type": "integer"
              }
            },
            "required": ["consulta"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3f64d7cdbd703fe755388def3867bc7f759801aaff4f5c7533c29cd48a5506d"
        },
        {
          "name": "consultar_referencia",
          "description": "Consulta el contrato OpenAPI del API. Sin ruta, lista los endpoints. Con ruta (y metodo), devuelve los parametros, el cuerpo, las respuestas y los esquemas que usa.",
          "inputSchema": {
            "properties": {
              "metodo": {
                "default": null,
                "description": "Metodo HTTP: GET, POST, PUT o DELETE (opcional; por defecto el unico o el primero)."
              },
              "ruta": {
                "default": null,
                "description": "Ruta del endpoint como aparece en el listado. La emision usa una ruta por tipo de comprobante, por ejemplo '/v1/contribuyentes/{identificacion}/facturas' o '/v1/contribuyentes/{identificacion}/notas-credito' (opcional)."
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9f7e0aa9cf3701d4c2183445cfec936b698617614cc825553b639151e561bdc"
        },
        {
          "name": "ejemplo_comprobante",
          "description": "Devuelve un JSON de ejemplo listo para el POST HTTP de emision de un tipo de comprobante (01 factura, 03 liquidacion de compra, 04 nota de credito, 05 nota de debito, 06 guia de remision, 07 retencion), con el enlace a su guia. No incluye infoTributaria.tipoDocumento porque el tipo va en la ruta; para la CLI o el MCP de la cuenta agrega ese campo con el codigo indicado.",
          "inputSchema": {
            "properties": {
              "tipo": {
                "description": "Tipo de comprobante: 01, 03, 04, 05, 06 o 07, o su nombre (factura, nota de credito...)."
              }
            },
            "required": ["tipo"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f366afdb10472ffb231c28f042c41604e5f516b14fe2c8b08ef5832fd2d1384"
        },
        {
          "name": "explicar_error",
          "description": "Explica un codEstado del catalogo de la API: numero de 4 digitos, por ejemplo 3002, 4004 o 5005, o su nombre, como comprobante_invalido. Devuelve el estado, el estado HTTP, el msgError, cuando ocurre, que hacer y si se reintenta. Es el campo codEstado del cuerpo de error, de una operacion, de una fila de emitidos o de un webhook, no el estado HTTP. El primer digito es el estado: 1 recibido, 2 autorizado, 3 rechazado, 4 rechazo_configuracion, 5 error, 6 cancelado.",
          "inputSchema": {
            "properties": {
              "codError": {
                "default": null,
                "description": "Sinonimo de codEstado: el numero o el nombre del codigo, por ejemplo comprobante_invalido."
              },
              "codEstado": {
                "default": null,
                "description": "codEstado, por ejemplo 3002 (comprobante_invalido) o 4004 (cupo_agotado). Tambien acepta el nombre."
              },
              "codigo": {
                "default": null,
                "description": "Sinonimo de codEstado, para clientes que lo envian con este nombre."
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5586c7ae2c7dc7070323833f247c8e30ead2bae6b1ea9ebdfb8d33550f0d1e48"
        },
        {
          "name": "leer_guia",
          "description": "Devuelve una guia en Markdown. Con seccion, devuelve solo la seccion cuyo titulo coincide; las guias largas (por ejemplo las de SDK) conviene leerlas por seccion.",
          "inputSchema": {
            "properties": {
              "seccion": {
                "default": null,
                "description": "Titulo o parte del titulo de una seccion (opcional), por ejemplo 'Firma' o 'Catalogo de codEstado'."
              },
              "slug": {
                "description": "Slug de la guia, por ejemplo 'emision-01' o 'webhooks'. Tambien acepta su URL."
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:38f8cc553bb9dc1f8a927683043dc48eee3d1a70d7f7625ad4c138975c514742"
        },
        {
          "name": "listar_guias",
          "description": "Lista las guias de la documentacion agrupadas por tema, con su slug, una descripcion corta y su URL.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42d3c7ff9a5498d33b70c7cbe1e74ea18df10e929c0c4de49b700d01311d3e84"
        }
      ],
      "digest": "sha256:f467b9d8a73324617ed44420f8524ae6ea8e5c45c8d5c8511133e8bc0b6bd1d8"
    }
  }
}
