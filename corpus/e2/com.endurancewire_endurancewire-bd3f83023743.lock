            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "First product, e.g. 'fenix 8'",
                "type": "string"
              },
              "a_size_mm": {
                "description": "First product's case size in mm, e.g. 47. Must match a recorded case size.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "b": {
                "description": "Second product, e.g. 'fenix 9'",
                "type": "string"
              },
              "b_size_mm": {
                "description": "Second product's case size in mm, e.g. 51. Must match a recorded case size.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "family": {
                "description": "Table id: flagships, running-flagships, bike-computers, hr-straps, recovery-wearables, polar-street, polar-loop, tactix, fenix, forerunner, forerunner-2xx, forerunner-entry, edge, edge-mid, varia, rally, instinct, venu, epix, enduro, vivoactive, descent, imini, quatix, marq, approach, coros-pace, coros-apex, coros-vertix, suunto-9, suunto-race, suunto-vertical, suunto-run, apple-ultra, wahoo-elemnt, wahoo-kickr, wahoo-tickr, wahoo-speedplay, wahoo-kickr-bike, polar-vantage, polar-vantage-m, polar-grit, polar-pacer, polar-ignite, polar-sensor, whoop, oura, hrm, amazfit-trex, amazfit-cheetah, amazfit-gtr, amazfit-gts, amazfit-active, amazfit-pace, amazfit-balance, amazfit-bip, edge-explore, tacx, coros-dura, edge-explore-3, forerunner-570-970, forerunner-70-170",
                "type": "string"
              }
            },
            "required": ["a", "b", "family"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "_via": {
                "description": "Source attribution for Endurance Wire",
                "type": "string"
              },
              "changed_count": {
                "type": "integer"
              },
              "comparison_scope": {
                "enum": ["case_sizes", "mixed", "generation_summary"],
                "type": "string"
              },
              "family": {
                "type": "string"
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "buy_links": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "merchant": {
                            "type": "string"
                          },
                          "region": {
                            "type": "string"
                          },
                          "url": {
                            "format": "uri",
                            "type": "string"
                          }
                        },
                        "required": ["merchant", "region", "url"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "case_sizes_mm": {
                      "description": "Recorded case sizes in mm; an empty list means unknown",
                      "items": {
                        "type": "number"
                      },
                      "type": "array"
                    },
                    "comparison_label": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "selected_case_size_mm": {
                      "type": ["number", "null"]
                    },
                    "size_data_status": {
                      "enum": ["recorded", "unknown"],
                      "type": "string"
                    },
                    "size_scope_note": {
                      "description": "Limits on size-specific claims",
                      "type": "string"
                    },
                    "size_variants": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "case_size_mm": {
                            "type": "number"
