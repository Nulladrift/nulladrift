        {
          "name": "get_news",
          "title": "Get news coverage",
          "description": "Search published news coverage, newest first. Filter by brand, tagged product, publication date or text in titles, summaries and publisher names. Returns source reports, not verified release facts. Cite the publisher and preserve uncertainty. Uses the site's published dataset, not a live web search; updated_at is the last scan time. Use next_offset with the same filters for more results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "enum": ["garmin", "coros", "suunto", "apple", "amazfit", "wahoo", "polar", "whoop", "oura"],
                "type": "string"
              },
              "limit": {
                "description": "Max results, default 50",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Results to skip, default 0",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "product": {
                "description": "Exact release slug or partial product name, e.g. 'garmin-fenix-8-8s-8x' or 'fenix 8'. Matches tagged releases, not the whole family.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Case-insensitive text search; accents are ignored",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "since": {
                "description": "Only items published on or after this date (UTC)",
                "pattern": "^\\d{4}(?:-\\d{2}(?:-\\d{2})?)?$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "_via": {
                "description": "Source attribution for Endurance Wire",
                "type": "string"
              },
              "count": {
                "description": "Total matches before pagination",
                "type": "integer"
              },
              "news": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "date": {
                      "description": "Publication date from the feed",
                      "type": "string"
                    },
                    "href": {
                      "description": "Endurance Wire story page",
                      "format": "uri",
                      "type": "string"
                    },
                    "publisher": {
                      "type": "string"
                    },
                    "slugs": {
                      "description": "Tagged release slugs",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Source URL recorded by the feed; may be a Google News link",
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["brand", "date", "href", "publisher", "slugs", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_offset": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Pass as offset for the next page; null when exhausted"
              },
              "updated_at": {
                "description": "Last scan time, not the time this query ran",
                "type": "string"
              }
            },
            "required": ["_via", "count", "news", "next_offset", "updated_at"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
