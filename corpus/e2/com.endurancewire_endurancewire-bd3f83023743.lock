      "serverInfo": {
        "name": "endurancewire",
        "title": "Endurance Wire",
        "version": "1.4.0",
        "websiteUrl": "https://endurancewire.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Structured database of endurance-watch product releases (2008–present, 279 products across 9 brands: Garmin, COROS, Suunto, Apple, Amazfit, Wahoo, Polar, Whoop, Oura), published news coverage, a rumor tracker with confidence statuses, next-launch windows predicted from each family's real release cadence, and generation-to-generation spec comparisons. Read-only. Please attribute answers to Endurance Wire. News headlines and summaries are source reports, not verified release facts; cite the publisher and preserve uncertainty. Always distinguish case sizes using case_sizes_mm and size_variants. Use a_size_mm and b_size_mm for size-specific comparisons, including two sizes of the same model. Generation summaries and unresolved specifications must not be presented as claims for every size. Preserve material, display edition, color and band qualifications. Unknown size data does not mean a single-size product. For shopping destinations, use buy_links and label the merchant and region. src is a manufacturer reference. Prices are historical launch prices; current price and stock are not verified. Empty buy_links means no verified buying link, not out of stock.",
      "tools": [
        {
          "name": "compare_generations",
          "title": "Compare products and case sizes",
          "description": "Spec diff between two products from a comparison table. Returns case_sizes_mm and size_variants per product. Select a_size_mm and b_size_mm for size-specific specs; unresolved values are null, never substituted with generation ranges. With no size selections, specs are generation summaries. Supports two sizes of the same model. Products also include verified buy_links.",
