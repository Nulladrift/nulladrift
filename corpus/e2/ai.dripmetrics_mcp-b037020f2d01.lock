{
  "lockfileVersion": 2,
  "subjects": {
    "ai.dripmetrics/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.dripmetrics.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dripmetrics",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "compute_portfolio_var",
          "title": "Compute portfolio Value-at-Risk (paid)",
          "description": "Paid via x402 ($0.05 per request). Computes empirical and/or normal parametric VaR for a crypto portfolio. Provide either weights + portfolioValueUsd, or quantities. Invalid portfolios fail before payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assets": {
                "description": "Asset symbols, e.g. [\"BTC\", \"ETH\"].",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "confidence": {
                "description": "Confidence level (default 0.95).",
                "maximum": 0.999,
                "minimum": 0.5,
                "type": "number"
              },
              "horizon": {
                "description": "Risk horizon, e.g. \"1d\" (default).",
                "type": "string"
              },
              "methods": {
                "description": "empirical, normal, or both (default).",
                "enum": ["empirical", "normal", "both"],
                "type": "string"
              },
              "portfolioValueUsd": {
                "description": "Total portfolio value in USD.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "quantities": {
                "description": "Asset quantities (alternative to weights).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "weights": {
                "description": "Portfolio weights (with portfolioValueUsd).",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "window": {
                "description": "Price history window (default 180d).",
                "enum": ["90d", "180d"],
                "type": "string"
              }
            },
            "required": ["assets"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.05
          },
          "digest": "sha256:6f43ae557c6bd8e7eef8725fb0986f541c9b159d570663b84bcfaac99894050e"
        },
        {
          "name": "compute_spread_greeks",
          "title": "Compute BTC option spread greeks (paid)",
          "description": "Paid via x402 ($0.05 per request). Nets Black-76 greeks across up to 6 Deribit BTC option legs and returns a spot×vol scenario P&L grid. Invalid legs or unknown instruments fail before payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "legs": {
                "description": "Spread legs.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "instrument": {
                      "description": "Deribit BTC option instrument, e.g. \"BTC-26SEP26-120000-C\".",
                      "type": "string"
                    },
                    "qty": {
                      "description": "Signed quantity in 1 BTC contracts; negative = short.",
                      "type": "number"
                    }
                  },
                  "required": ["instrument", "qty"],
                  "type": "object"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["legs"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.05
          },
          "digest": "sha256:5413a322ed09d694b082bba3033acedc2e6cd5acaa3625826cf7e2d0cb1c7cf0"
        },
        {
          "name": "describe_metric",
          "title": "Describe a DripMetrics metric",
          "description": "Free. Returns full details for one metric id from list_metrics: parameters, request/response schemas, price, and how to fetch it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Metric id from list_metrics, e.g. \"metrics/vpin\" or \"options/gex\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e09709d267628f4dcda2cc7608b9933834dd4c4f0942a773df35d429bfec26d8"
        },
        {
          "name": "get_metric",
          "title": "Fetch a DripMetrics metric (paid)",
          "description": "Paid via x402 (up to $0.25 per request; exact price per metric in list_metrics). Fetches any GET metric by id with query parameters. Without payment this returns the x402 challenge in _meta[\"x402/error\"]; x402-capable clients (e.g. withX402Client) sign it and retry with _meta[\"x402/payment\"] automatically. Invalid requests fail before payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Metric id from list_metrics, e.g. \"metrics/vpin\".",
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query parameters, e.g. {\"pair\": \"BTC-USD\", \"window\": \"1h\"}. See describe_metric.",
                "type": "object"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.25
          },
          "digest": "sha256:904878c43bbc2a6b38b183b7d20d3d93f590329c30123c3dcdeaa76d36631e05"
        },
        {
          "name": "get_payment_requirements",
          "title": "Get exact x402 payment requirements",
          "description": "Free. Dry-runs a metric request without payment and returns the exact x402 challenge the API issues (accepted networks, asset, amount, payTo). Invalid parameters fail here before any payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "body": {
                "additionalProperties": {},
                "description": "JSON body for POST metrics (portfolio VaR, spread greeks).",
                "type": "object"
              },
              "id": {
                "description": "Metric id from list_metrics.",
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query parameters for GET metrics (see describe_metric).",
                "type": "object"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:79a91406cb4c46f3f24b52a7efc0403205e97e935a74282dbd94a6c70952e0db"
        },
        {
          "name": "list_metrics",
          "title": "List DripMetrics metrics",
          "description": "Free. Lists every DripMetrics metric endpoint with its id, family, HTTP method, USD price, and summary. Use describe_metric for parameter details and get_metric (or the compute_* tools for POST endpoints) to fetch values. Paid fetches use x402 with USDC on Base or USDG on Robinhood Chain; discovery is free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "Optional family filter, e.g. \"Exchange metrics\" or \"BTC options\".",
                "enum": ["Aerodrome", "BTC options", "Exchange metrics", "Hyperliquid", "Hyperliquid book", "Kraken xStocks", "Market summary", "On-chain", "Orderbook", "Polymarket", "Portfolio risk"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5b386bd6502b36c4ce02072efae98ba49a89d013f24ee858a06768bd95687bdd"
        }
      ],
      "digest": "sha256:892c9382e5192cdb2e7d7e986dca3c35896ea3643e1e4fda63c5308adac64702"
    }
  }
}
