        {
          "name": "nigeria.take_home",
          "title": "Take-home pay from a monthly salary in Nigeria",
          "description": "Use this when someone gives a monthly salary in naira and asks what they take home, how much PAYE or pension comes off it, or what rent relief saves them, under the Nigeria Tax Act 2025 bands in force from January 2026. It works the tax out on the year, band by band, then gives the month; do not estimate it first. Do not use it for company tax, for tax before 2026, for VAT, or for pay in another country.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gross_salary": {
                "description": "Gross pay a month in naira, before anything is taken off.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "nhf_contribution": {
                "description": "A month's National Housing Fund contribution taken from the pay, if any (compulsory for public-sector workers, voluntary in the private sector).",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "nhis_contribution": {
                "description": "A month's health insurance (NHIS) contribution taken from the pay, if any.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "pays_pension": {
                "description": "Whether the 8% pension contribution is taken from the pay. Leave out for yes.",
                "type": "boolean"
              },
              "pensionable_pay": {
                "description": "Basic pay plus housing and transport allowances a month, which the 8% pension is worked out on. Leave out to use the whole gross salary, which is said in the answer.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "yearly_life_insurance": {
                "description": "Life insurance or annuity premiums paid in a year, if any.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "yearly_rent": {
                "description": "Rent the person pays for their home in a year, for rent relief, if any.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["gross_salary"],
            "type": "object"
          },
