        {
          "name": "kenya.take_home",
          "title": "Take-home pay from a monthly salary in Kenya",
          "description": "Use this when someone gives a monthly gross salary in Kenya shillings and asks what they take home, how much PAYE, NSSF, SHIF or Housing Levy comes off it, or what the job costs the employer. It applies NSSF, SHIF and the Housing Levy before tax, as the law has required since December 2024, then the tax bands and personal relief; do not estimate it first. Do not use it for a business's tax, for rental or turnover tax, for pay in another country, or for someone not resident in Kenya.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gross_salary": {
                "description": "Gross pay a month in Kenya shillings: basic salary plus cash allowances, before anything is taken off.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "insurance_premiums": {
                "description": "A month's premiums on life, education or health insurance policies that qualify for insurance relief, if any.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "other_pension": {
                "description": "A month's contribution to a registered pension or provident fund on top of NSSF, if any.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "pays_housing_levy": {
                "description": "Whether the Affordable Housing Levy is taken from the pay. Leave out for yes.",
                "type": "boolean"
              },
              "pays_nssf": {
                "description": "Whether NSSF is taken from the pay. Leave out for yes.",
                "type": "boolean"
              },
              "pays_shif": {
                "description": "Whether SHIF is taken from the pay. Leave out for yes.",
                "type": "boolean"
              }
            },
            "required": ["gross_salary"],
            "type": "object"
          },
