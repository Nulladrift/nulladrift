        {
          "name": "south_africa.take_home",
          "title": "Take-home pay from a monthly salary in South Africa",
          "description": "Use this when someone gives a monthly salary in rand and asks what they take home, how much PAYE or UIF comes off it, or how age or medical aid changes it, for the tax year from 1 March 2026. It works out the year's tax on twelve months of the salary, less the rebates and medical scheme credits; do not estimate it first. Do not use it for provisional tax on business income, for a year-end assessment, or for pay in another country.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "The person's age at the end of February 2027, which sets the rebates. Leave out for under 65.",
                "maximum": 120,
                "minimum": 15,
                "type": "integer"
              },
              "gross_salary": {
                "description": "Taxable pay a month in rand, before anything is taken off.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "number"
              },
              "medical_scheme_members": {
                "description": "How many people are on the person's medical scheme, counting the person. Leave out for none.",
                "maximum": 20,
