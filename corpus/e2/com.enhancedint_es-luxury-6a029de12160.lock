        {
          "name": "get_booking",
          "title": "Check a booking",
          "description": "Check a booking made through this door: whether it is requested, confirmed, declined or cancelled, and whether it can still be cancelled here.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "reference": {
                "description": "The booking's `reference`, from book.",
                "type": "string"
              },
              "token": {
                "description": "The booking's `manage.token`, from book.",
                "type": "string"
