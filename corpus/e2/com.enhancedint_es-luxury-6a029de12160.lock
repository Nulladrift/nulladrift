                  "properties": {
                    "label": {
                      "description": "What the service is for: the car (\"2023 Porsche 911\"). Required for a detailing business; leave out for a meeting.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "How many of it. Default 1.",
                      "maximum": 50,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slug": {
                      "description": "The service's slug, from the card's services list.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["slug"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "tint": {
                "additionalProperties": false,
                "description": "What is being booked at a window tint business, in place of `items` (the card says which a business takes): the class of the customer's car, the windows, the film and the shade, each chosen from the card's `tint` section. The business prices and times it; a shade never changes the price. Choosing the front two windows and the rear sides books the full vehicle, at its price.",
                "properties": {
                  "extras": {
                    "description": "Optional: the shop's extras from the card's tint.extras (old tint removal and the like), each once and each its own line, priced by its `per`: car (prices[vehicle_class]), area (byArea for each window service in `areas`), window (prices[vehicle_class] times `quantity`) or hour (quoted: the shop prices the hours).",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "areas": {
                          "description": "An area extra only: the window services it covers, slugs from tint.glass. Left out, the windows being tinted.",
                          "items": {
                            "maxLength": 200,
                            "minLength": 1,
                            "type": "string"
                          },
                          "minItems": 1,
                          "type": "array",
                          "uniqueItems": true
                        },
                        "quantity": {
                          "description": "A window extra: the number of windows, 1 to 20 (required). An hour extra: the hours, in quarter hours up to 12, if the shop has said; otherwise leave it out.",
                          "maximum": 20,
                          "minimum": 0.25,
                          "type": "number"
                        },
                        "slug": {
                          "description": "A slug from the card's tint.extras.",
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["slug"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "film": {
                    "description": "The film: a slug from the card's tint.films.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "glass": {
                    "description": "The windows to tint: slugs from the card's tint.glass, each once.",
                    "items": {
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "type": "array",
                    "uniqueItems": true
                  },
                  "shade": {
                    "description": "The percentage of light the film lets through (lower is darker), for every window: one of the chosen film's shades.",
                    "maximum": 100,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "vehicle_class": {
                    "description": "The class of the customer's car: an id from the card's tint.vehicleClasses, each of which lists example models.",
                    "enum": ["coupe", "sedan", "truck", "suv", "suv_xl"],
