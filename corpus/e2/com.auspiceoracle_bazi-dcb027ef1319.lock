                  "type": "string"
                },
                "maxItems": 40,
                "type": "array"
              },
              "lang": {
                "description": "Language of the result (default en)",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "themes": {
                "description": "One or two themes that fit the situation: decision, change, waiting, loss, conflict, overwork, comparison, fear, beginning",
