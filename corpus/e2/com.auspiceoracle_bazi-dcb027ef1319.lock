      "instructions": "Auspice offers two things: tao_lens, verified passages from the Chinese classics for someone weighing a decision, stuck, or in a transition (no birth data needed); and BaZi chart tools (cast_chart, personality_sketch, compose_sketch) that need an exact birth date, time and place.\n\nDisplay: cast_chart returns a scroll and compose_sketch returns a sheet; these are the display forms, and the structured fields carry the same data for programs. Clients that render the chart or sheet card already show the user everything in it, so a short plain-language note is enough there. Elsewhere the scroll or sheet reads best shown as returned, in a code block, ahead of any commentary.\n\npersonality_sketch returns chart facts and a fill-in template (image / beneath / practice); compose_sketch turns those three filled sections into the finished, framed sheet.\n\ntao_lens passages are checked character by character against Wikisource. The classical text, the literal translation, and Auspice's own reading and question are kept distinct in the result, so a user can tell which words are the classic's.\n\nScope: these tools describe and reflect; none of them predicts. Forecasts of lucky or unlucky years, money, property, relationships, health or decisions are outside what Auspice offers, including from the luck-cycle sequence, which is a charting convention. Crisis, medical, legal and financial questions are outside it too.",
      "tools": [
        {
          "name": "cast_chart",
          "title": "Cast a BaZi chart (true solar time first)",
          "description": "Casts a BaZi (Four Pillars) chart from a birth date, time and place, applying true solar time correction first (daylight saving, longitude and the equation of time). Returns the four pillars with hidden stems and Na Yin, the day master, the season, and the luck-cycle sequence, plus a comparison chart cast from raw clock time that shows what a calculator skipping the correction would get wrong for this birth. The result has a formatted scroll (the display form) and the same data as structured fields. Runs on the production Auspice Oracle engine (conventions at auspiceoracle.com/en/method). Deterministic calendar facts only: no strength verdicts, favorable elements or interpretation. Not for predictions: never use this result to forecast lucky or unlucky years, money, property, relationships, health or decisions. The luck cycles are a charting convention, not a timetable of fortune; Auspice BaZi makes no predictions, and what the chart can describe is temperament and tendency.",
