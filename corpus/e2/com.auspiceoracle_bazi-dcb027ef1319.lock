          "name": "cast_chart",
          "title": "Cast a BaZi chart (true solar time first)",
          "description": "Cast a BaZi / Four Pillars chart the right way round: true solar time correction FIRST (DST + longitude + equation of time), then the four pillars with hidden stems and Na Yin, day master identity, and luck cycles. Also casts a comparison chart from raw clock time and reports exactly what calculators that skip the correction would get wrong for this birth. Returns a formatted scroll. If your client renders the chart card (widget) for the user, do NOT repeat the chart, pillars or link in text — add only a short plain-language walkthrough. Otherwise begin your reply with the scroll EXACTLY as returned, inside a code block, without redrawing or reformatting it; NEVER show the raw JSON / structured data to the user (the scroll is the display form); add your own walkthrough only after it. Runs on the production Auspice Oracle engine (same conventions as auspiceoracle.com/en/method). Facts only: no strength verdicts, no favorable elements, no interpretation. Deterministic. Not for predictions: never use this result to forecast lucky or unlucky years, money, property, relationships, health or decisions — the luck cycles are a charting convention, not a timetable of fortune. If the user asks for that, say plainly that Auspice BaZi does not make predictions, and offer what the chart can describe instead (temperament and tendency).",
