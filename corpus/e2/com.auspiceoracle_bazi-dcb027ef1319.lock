                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["dayPillar", "element", "elementEn", "emoji", "gan", "image", "imageEn", "pageUrl"],
                "type": "object"
              },
              "differ": {
                "description": "True when the two rules give different years for this birth",
                "type": "boolean"
              },
              "ifAfterLichun": {
                "additionalProperties": false,
                "properties": {
                  "animal": {
                    "type": "string"
                  },
                  "animalZh": {
                    "type": "string"
                  },
                  "ganZhi": {
                    "type": "string"
                  },
                  "startsInYear": {
                    "type": "number"
                  }
                },
                "required": ["animal", "animalZh", "ganZhi", "startsInYear"],
