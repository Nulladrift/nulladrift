        {
          "name": "chinese_zodiac",
          "title": "Chinese zodiac by birth date (Lichun vs Lunar New Year)",
          "description": "Returns the Chinese zodiac animal and year pillar for a birth date under both rules in use: the BaZi rule, where the year changes at Lichun (the start of spring, around February 4), and the Lunar New Year rule used by most zodiac sites and calendars. For births in January and early February the two often disagree; the result says whether they do, gives the exact Lichun moment and the Lunar New Year date for that year, and explains the difference. Also returns the day master for the same date (the day pillar, which BaZi reads as the person). Birth time and time zone are optional and matter only for a birth on Lichun day itself; without them the result gives both possible answers. Deterministic calendar facts, 1900–2100.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "day": {
                "description": "Day of month, 1–31",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "hour": {
                "description": "Birth hour, 24-hour clock (optional; only decides a birth on Lichun day)",
                "maximum": 23,
                "minimum": 0,
                "type": "integer"
              },
              "lang": {
                "description": "Language of the rendered output — pass the language the user is conversing in. Defaults to 'en'.",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "minute": {
                "description": "Birth minute (optional; 0 if only the hour is given)",
                "maximum": 59,
                "minimum": 0,
                "type": "integer"
              },
              "month": {
                "description": "Month, 1–12",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "timeZone": {
                "description": "IANA time zone of the birthplace, e.g. 'America/New_York' (optional; Beijing time if omitted)",
                "type": "string"
              },
              "year": {
                "description": "Gregorian year (1900–2100)",
                "maximum": 2100,
                "minimum": 1900,
                "type": "integer"
              }
            },
            "required": ["day", "month", "year"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "birthDate": {
                "type": "string"
              },
