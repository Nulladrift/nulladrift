      "instructions": "Auspice offers three kinds of tools. With no birth details: tao_lens, verified passages from the Chinese classics for someone weighing a decision, stuck, or in a transition. With a date only: chinese_zodiac, the Chinese zodiac sign for a birth date under both the BaZi rule (year changes at Lichun) and the Lunar New Year rule, which differ for many January and February births; and day_pillar, the day pillar of any date (today if none is given), which for a birth date is also the day master. With an exact birth date, time and place: the BaZi chart tools cast_chart, personality_sketch and compose_sketch.\n\nOutput: cast_chart returns a pre-formatted scroll and compose_sketch returns a pre-formatted sheet (monospaced text); both also return the same data as structured fields, and attach a card for clients that support MCP Apps.\n\npersonality_sketch returns chart facts and a fill-in template (image / beneath / practice); compose_sketch turns those three filled sections into the finished, framed sheet.\n\ntao_lens passages are checked character by character against Wikisource. The classical text, the literal translation, and Auspice's own reading and question are kept distinct in the result, so a user can tell which words are the classic's.\n\nScope: these tools describe and reflect; none of them predicts. Forecasts of lucky or unlucky years, money, property, relationships, health or decisions are outside what Auspice offers, including from the luck-cycle sequence, which is a charting convention. Crisis, medical, legal and financial questions are outside it too.",
      "tools": [
        {
          "name": "cast_chart",
          "title": "Cast a BaZi chart (true solar time first)",
          "description": "Casts a BaZi (Four Pillars) chart from a birth date, time and place, applying true solar time correction first (daylight saving, longitude and the equation of time). Returns the four pillars with hidden stems and Na Yin, the day master, the season, and the luck-cycle sequence, plus the same birth cast from raw clock time, showing which pillars (if any) the correction changes for this birth. The result has a formatted scroll (the display form) and the same data as structured fields. Runs on the production Auspice Oracle engine (conventions at auspiceoracle.com/en/method). Deterministic calendar facts only: no strength verdicts, favorable elements or interpretation. The output is calendar data only and is not a forecast; the luck-cycle sequence is a charting convention, not a timetable of fortune, money, property, relationships, health or decisions. What the chart can describe is temperament and tendency.",
