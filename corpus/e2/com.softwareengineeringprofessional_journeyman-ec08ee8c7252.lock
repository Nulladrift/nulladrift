  "subjects": {
    "com.softwareengineeringprofessional/journeyman": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://journeyman.softwareengineeringprofessional.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "journeyman-patterns",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_pattern",
          "title": "Get one corpus pattern by id",
          "description": "Lookup a single Pattern-Assist row by stable id. Returns 404-shaped payload when unknown — never fabricates a nearest match.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Pattern id, e.g. devplane-P02.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "code": {
                "type": "string"
              },
              "contract": {
                "type": "string"
              },
              "error": {
                "type": "string"
              },
              "pattern": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:00f082da5898eda509a2c84e87f190bea6ec3a50a40b363a4a3d9c3fd4d60586"
        },
        {
          "name": "list_patterns",
          "title": "List corpus patterns (paginated)",
          "description": "Paginated inventory of pattern ids and summaries from the vendored corpus.",
          "inputSchema": {
            "properties": {
              "area": {
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "provenance": {
                "enum": ["our-dev", "book", "patent"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contract": {
                "type": "string"
              },
              "patterns": {
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["contract", "patterns", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6ae01f9155b927b2b38da2dd79d1bf057670da513009afcfcc0222d70502bcd"
        },
        {
          "name": "list_public_pages",
          "title": "List Journeyman public pages and machine endpoints",
          "description": "Site map for agents: canonical human pages plus read-only REST/MCP endpoints on this host.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "contract": {
                "type": "string"
              },
              "endpoints": {
                "type": "array"
              },
              "pages": {
                "type": "array"
              },
              "site": {
                "type": "object"
              }
            },
            "required": ["contract", "endpoints", "pages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71901c8e51f301e921a7faf4f3e989a5ba48cf1a2a92516e039f6808522c9b49"
        },
        {
          "name": "recommend_patterns",
          "title": "Recommend grounded patterns with trade-offs and cited siblings",
          "description": "C-03: ranked Pattern-Assist recommendations for a task. Each hit carries a corpus why, a when-not / FTO trade-off, and cited same-area cross-links. Use this when the learner wants alternatives, not just a lexical hit list.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max recommendations (default 5).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Task or problem to recommend against.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_citation": {
                "type": "object"
              },
              "contract": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "recommendations": {
                "type": "array"
              }
            },
            "required": ["contract", "count", "query", "recommendations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47f5e2ee430ab0ad90bc5691141b76645ecb323d11de4701c845d0d55ff7f2ae"
        },
        {
          "name": "search_patterns",
          "title": "Search grounded software-engineering patterns",
          "description": "Search the vendored Pattern-Assist corpus (hybrid lexical + embeddings when available; lexical fallback). Returns ranked patterns with source_ref citations and optional when_not guidance. Use this before asserting an approach.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Optional area substring filter.",
                "type": "string"
              },
              "limit": {
                "description": "Max hits (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "provenance": {
                "description": "Optional provenance filter.",
                "enum": ["our-dev", "book", "patent"],
                "type": "string"
              },
              "query": {
                "description": "Natural-language or keyword query.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "_citation": {
                "type": "object"
              },
              "contract": {
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "patterns": {
                "type": "array"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["contract", "count", "patterns", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:caa73b785b584caf7f54825ead7dd3267ad960ddc62c8b96385141b4d0435d45"
        }
      ],
      "digest": "sha256:49a2cdaef02cc4ce92f8fe1117ce82f14dfc5d47cc2cb6b8107dd9434a134b51"
    }
  }
