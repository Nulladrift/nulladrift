      "tools": [
        {
          "name": "find_practice",
          "title": "Find a practice",
          "description": "Offer the person up to three Mosaya practices they can do right here (meditation, breathwork, mindfulness, loving-kindness, gratitude, a focus timer and more). Use when they want to meditate, calm down, settle a racing mind, sleep, focus, or ask for a practice by name. Shows a card; nothing is stored. If their words sound like crisis, the card shows care and crisis lines instead of practices.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "minutes": {
                "description": "A length the person asked for, if they named one.",
                "maximum": 180,
                "minimum": 1,
                "type": "number"
              },
              "need": {
                "description": "What the person is looking for, in their own words, short: a feeling, a need, or a practice's name (for example \"can't switch off\", \"loving-kindness\", \"focus for an hour\").",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a practice"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://mosaya/practice.html?v=2",
            "openai/toolInvocation/invoked": "Here are some practices",
            "openai/toolInvocation/invoking": "Finding a practice",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://mosaya/practice.html?v=2"
            },
            "ui/resourceUri": "ui://mosaya/practice.html?v=2"
          },
          "digest": "sha256:6dc9fe172899846d9516d5c4e97623c963aa12ed7137b524c72a3fd2c2f37440"
        },
        {
          "name": "get_piece",
          "title": "Read a Wisdom library piece",
          "description": "Read one piece from the Wisdom library at mosaya.ai by its slug: its title, summary, opening answer, topic, byline and link. The whole piece is at the link. Not medical, therapy or crisis help.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The piece's slug, from search_wisdom.",
                "maxLength": 120,
                "pattern": "^[a-z0-9]+(-[a-z0-9]+)*$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Wisdom library piece"
          },
          "behavior": {
