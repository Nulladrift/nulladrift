              }
            ]
          },
          "digest": "sha256:9dd7d993c5e5297bd4b809321e4b604f48842f0331fcb11e1593867d27fe9663"
        },
        {
          "name": "list_topics",
          "title": "List the Wisdom library's topics",
          "description": "The thirteen topics of the Wisdom library at mosaya.ai, each with its short answer and link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
