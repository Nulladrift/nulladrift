              }
            ]
          },
          "digest": "sha256:b67fe4d73d690cfb599073cc4007a51e9e140d7b5d894acedd2ef7404c340f6a"
        },
        {
          "name": "start_practice",
          "title": "Start a practice",
          "description": "Open one Mosaya practice, ready to begin: the person picks a length, taps Begin, and the sit runs full screen with a bell at the start and the end, then a short celebration. Use after find_practice, or when they name a practice. Nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "minutes": {
                "description": "A length the person asked for, if any.",
                "maximum": 180,
                "minimum": 1,
                "type": "number"
              },
              "practice": {
                "description": "The practice to open, by its id from find_practice.",
                "enum": ["silent_meditation", "non_dual_meditation", "self_inquiry", "mindfulness", "breathwork", "visualization", "deep_work", "somatic_release", "journaling", "heart_resonance", "loving_kindness", "gratitude", "compassion_meditation"],
                "type": "string"
              }
            },
            "required": ["practice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
