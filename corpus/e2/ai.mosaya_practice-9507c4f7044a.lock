          "digest": "sha256:a1e1b2bc615317c1df4ca5be944247b71f4c84cdc46ab73c3739639a200228f5"
        },
        {
          "name": "search_wisdom",
          "title": "Search the Wisdom library",
          "description": "Search the Wisdom library at mosaya.ai: short essays on inner life, burnout, grief, relationships, meditation, work and the Way of MOS, by Mos, your sage, and Bodhi Sacha. Returns up to five pieces, each with its short answer and link. Not medical, therapy or crisis help. If the words sound like crisis, it answers with care and crisis lines by country, written in its text, instead of pieces.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 3,
                "description": "How many pieces, 1 to 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The question in plain words, for example: why do I keep burning out. Only the first 200 characters are used to search.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "topic": {
                "description": "Optional: keep to one topic.",
                "enum": ["burnout", "numb-and-lost", "presence-and-meditation", "shadow-work", "meaning-and-direction", "work-and-money", "loneliness-and-friendship", "love-and-forgiveness", "journaling-and-check-ins", "spiritual-practice-and-teachers", "ai-and-the-inner-life", "the-way-of-mos", "grief-loss-and-caring"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Wisdom library"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
