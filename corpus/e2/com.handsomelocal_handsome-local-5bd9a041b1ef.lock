        {
          "name": "list_filters",
          "title": "List trades and tags",
          "description": "The trades and tags that have published entries on Handsome Local, each with a count, so a search can be built from filters that exist. Cheap; call it before search_websites when unsure what to filter on.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "facets": {
                "additionalProperties": {
                  "items": {
                    "additionalProperties": false,
                    "properties": {
                      "count": {
                        "type": "number"
                      },
                      "label": {
                        "type": "string"
                      },
                      "term": {
                        "type": "string"
                      }
                    },
                    "required": ["count", "label", "term"],
                    "type": "object"
                  },
                  "type": "array"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "generated": {
                "type": "string"
              },
              "total": {
                "type": "number"
              },
              "trades": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "type": "number"
                    },
                    "entry_term": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["count", "entry_term", "id", "label"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["facets", "generated", "total", "trades"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List trades and tags"
          },
          "behavior": {
            "destructive": false,
