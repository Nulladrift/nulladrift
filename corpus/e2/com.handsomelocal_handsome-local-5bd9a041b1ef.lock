            "readOnly": true
          },
          "digest": "sha256:538f118309483167d8ebd9f0b37002e9bb4c4488c800239cb9548865527784cd"
        },
        {
          "name": "search_websites",
          "title": "Search trade websites",
          "description": "Search Handsome Local, a hand-picked gallery of real websites for trades and home services businesses (plumbers, electricians, roofers, builders, heating and HVAC firms, landscapers) in the UK and US. Every entry is a live site chosen by an editor because it is well built and wins work; each comes with a screenshot of the top of the page, a one-sentence summary, its tags and a credit for whoever built it. Filter by trade, region, style, colour, platform, conversion features or typeface, or search free text. Returns the newest matches first. Use it for visual references when designing or building a website for a tradesperson. It does not rate or rank sites and it covers the trades listed only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "colour": {
                "description": "Dominant colour tag, e.g. navy, green, orange, black.",
                "enum": ["black", "white", "grey", "beige", "brown", "blue", "navy", "teal", "green", "yellow", "orange", "red", "pink", "purple", "multicolour"],
                "type": "string"
              },
              "features": {
                "description": "Conversion features the site must have, all of them, e.g. click-to-call, phone-in-header, review-count, quote-form, licence-number, van-photo.",
                "items": {
                  "enum": ["click-to-call", "phone-in-header", "sticky-cta", "quote-form", "online-booking", "live-chat", "reviews-widget", "review-count", "accreditation-badges", "licence-number", "before-and-after", "project-gallery", "service-area-map", "team-photos", "van-photo", "prices-shown", "emergency-line"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "limit": {
                "default": 5,
                "description": "How many results to return, 1 to 8.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "What the site is built on, e.g. wordpress, webflow, wix, squarespace, custom.",
                "enum": ["wordpress", "wix", "squarespace", "webflow", "framer", "duda", "godaddy", "shopify", "astro", "custom", "unknown"],
                "type": "string"
              },
              "query": {
                "description": "Free text matched against the business name, town, review and tech tags. Use for a place (\"Manchester\", \"Texas\") or a thing the review mentions (\"Checkatrade\", \"emergency\").",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "region": {
                "description": "uk or us.",
                "enum": ["uk", "us"],
                "type": "string"
              },
              "screenshots": {
                "default": true,
                "description": "Include each result's screenshot as an image block. Set false for text only.",
                "type": "boolean"
              },
              "style": {
                "description": "Visual style tag, e.g. minimal, bold, photographic, dark, traditional.",
                "enum": ["minimal", "bold", "photographic", "illustrated", "corporate", "friendly", "dark", "colourful", "typographic", "traditional"],
                "type": "string"
              },
              "trade": {
                "description": "Primary trade of the business, e.g. plumbers, electricians, roofers, construction, hvac, landscapers.",
                "enum": ["plumbers", "electricians", "roofers", "construction", "hvac", "landscapers", "handyman", "cleaners", "pest-control"],
                "type": "string"
              },
              "typeface": {
                "description": "A typeface name to match, e.g. Inter, Poppins, DM Sans.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "colour": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "credit": {
                      "type": "string"
                    },
                    "features": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "page": {
                      "type": "string"
                    },
                    "platform": {
                      "type": "string"
                    },
                    "published_at": {
                      "type": "string"
                    },
                    "region": {
                      "type": "string"
                    },
                    "screenshot": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "style": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "tech": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "town": {
                      "type": "string"
                    },
                    "trade": {
                      "type": "string"
                    },
                    "typeface": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "website": {
                      "type": "string"
                    }
                  },
                  "required": ["colour", "credit", "features", "name", "page", "platform", "region", "slug", "style", "summary", "tech", "trade", "typeface", "website"],
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "type": "number"
              },
              "total_matches": {
                "type": "number"
              }
            },
