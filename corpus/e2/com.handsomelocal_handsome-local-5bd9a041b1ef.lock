            "properties": {
              "screenshot": {
                "default": true,
                "description": "Include the card screenshot as an image block.",
                "type": "boolean"
              },
              "slug": {
                "description": "Entry slug, lower case with hyphens.",
                "pattern": "^[a-z0-9-]{1,60}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
