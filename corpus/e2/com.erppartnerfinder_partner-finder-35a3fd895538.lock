{
  "lockfileVersion": 2,
  "subjects": {
    "com.erppartnerfinder/partner-finder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://erppartnerfinder.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "erppartnerfinder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "directory_stats",
          "title": "Odoo partner statistics for DACH",
          "description": "Aggregate figures: partners per country and tier, medians per tier, pricing transparency, AI-assisted delivery, cities and app specialisms with the most partners.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4afa0af42f8071f09c66de202404841849216949128bf296e5a7984c6455e71f"
        },
        {
          "name": "get_partner",
          "title": "Get an Odoo partner profile",
          "description": "Full profile of one partner: odoo.com figures (tier, references by industry, certified experts, project sizes, retention) and facts from the partner's own website (services, specialisms, prices, AI-assisted delivery, hosting, languages).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Partner slug from search_partners",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d03525fddaf4ed679c419e83f1245d7f5f59b56e4dddaa10e02750288aaf9b5"
        },
        {
          "name": "match_partners",
          "title": "Match partners to a project",
          "description": "Rule-based shortlist (up to 5) for a buyer's project, with the reasons for each match — the same published matching rules as the questionnaire on erppartnerfinder.com. Read-only: nothing is sent to any partner. To let the buyer contact partners, call prepare_request.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ai_assisted_delivery": {
                "default": "none",
                "enum": ["important", "nice", "none"],
                "type": "string"
              },
              "apps": {
                "default": [],
                "items": {
                  "enum": ["accounting", "invoicing", "sales", "crm", "purchase", "inventory", "manufacturing", "plm", "quality", "maintenance", "project", "timesheets", "field_service", "helpdesk", "planning", "website", "ecommerce", "pos", "marketing", "email_marketing", "events", "appointments", "hr", "payroll", "recruitment", "expenses", "documents", "sign", "rental", "subscriptions", "fleet", "repair", "studio", "knowledge", "spreadsheet_bi"],
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "enum": ["DE", "AT", "CH", "other"],
                "type": "string"
              },
              "employees": {
                "enum": ["1-10", "11-50", "51-200", "201-500", "500+"],
                "type": "string"
              },
              "industry": {
                "enum": ["other", "manufacturing", "wholesale_distribution", "retail_ecommerce", "construction_trades", "professional_services", "it_software", "logistics_transport", "food_beverage", "healthcare_pharma", "energy_utilities", "real_estate", "education", "nonprofit", "public_sector", "finance_insurance", "hospitality_tourism", "automotive", "agriculture", "media_marketing"],
                "type": "string"
              },
              "languages": {
                "default": ["de"],
                "items": {
                  "enum": ["de", "en", "fr", "it"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "situation": {
                "enum": ["new", "switch", "rescue", "upgrade"],
                "type": "string"
              },
              "users": {
                "description": "Planned Odoo users",
                "enum": ["1-5", "6-20", "21-50", "51-200", "200+"],
                "type": "string"
              }
            },
            "required": ["country", "employees", "industry", "situation", "users"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ebf3dbe30d160146ec6137176b270fe340ac81d8cc82079019a7fe12ba5cdbb6"
        },
        {
          "name": "prepare_request",
          "title": "Prepare a partner request for the buyer",
          "description": "Saves the buyer's project answers (no personal data) and returns a link to erppartnerfinder.com where the buyer reviews the answers, adds their own contact details, confirms their email and chooses which partners receive the request. Nothing is sent to partners and no email is sent by this tool. Give the link to the buyer; it is valid for 30 days. Optionally name one partner the buyer asked about (it is then always shown and preselected).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "ai_assisted_delivery": {
                "enum": ["important", "nice", "none"],
                "type": "string"
              },
              "apps": {
                "default": [],
                "items": {
                  "enum": ["accounting", "invoicing", "sales", "crm", "purchase", "inventory", "manufacturing", "plm", "quality", "maintenance", "project", "timesheets", "field_service", "helpdesk", "planning", "website", "ecommerce", "pos", "marketing", "email_marketing", "events", "appointments", "hr", "payroll", "recruitment", "expenses", "documents", "sign", "rental", "subscriptions", "fleet", "repair", "studio", "knowledge", "spreadsheet_bi"],
                  "type": "string"
                },
                "type": "array"
              },
              "country": {
                "enum": ["DE", "AT", "CH", "other"],
                "type": "string"
              },
              "employees": {
                "enum": ["1-10", "11-50", "51-200", "201-500", "500+"],
                "type": "string"
              },
              "industry": {
                "enum": ["other", "manufacturing", "wholesale_distribution", "retail_ecommerce", "construction_trades", "professional_services", "it_software", "logistics_transport", "food_beverage", "healthcare_pharma", "energy_utilities", "real_estate", "education", "nonprofit", "public_sector", "finance_insurance", "hospitality_tourism", "automotive", "agriculture", "media_marketing"],
                "type": "string"
              },
              "language": {
                "default": "en",
                "description": "Language of the page the buyer will see",
                "enum": ["de", "en", "fr", "it"],
                "type": "string"
              },
              "languages": {
                "default": ["de"],
                "items": {
                  "enum": ["de", "en", "fr", "it"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "partner_slug": {
                "description": "A partner the buyer specifically wants to contact (slug from search_partners)",
                "type": "string"
              },
              "situation": {
                "enum": ["new", "switch", "rescue", "upgrade"],
                "type": "string"
              },
              "timeline": {
                "enum": ["asap", "3m", "6m", "later"],
                "type": "string"
              },
              "users": {
                "description": "Planned Odoo users",
                "enum": ["1-5", "6-20", "21-50", "51-200", "200+"],
                "type": "string"
              }
            },
            "required": ["country", "employees", "industry", "situation", "users"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc8124d090a253b32ba08922d98e1a4c9933a4c8576c1f934a2752957444e64a"
        },
        {
          "name": "search_partners",
          "title": "Search Odoo partners",
          "description": "Search the Odoo implementation partners in Germany, Austria and Switzerland, ranked by a published formula (tier, references, certified experts, retention). Filter by country, city, tier, app specialism or industry focus.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "app": {
                "description": "Odoo app the partner highlights as a specialism",
                "enum": ["accounting", "invoicing", "sales", "crm", "purchase", "inventory", "manufacturing", "plm", "quality", "maintenance", "project", "timesheets", "field_service", "helpdesk", "planning", "website", "ecommerce", "pos", "marketing", "email_marketing", "events", "appointments", "hr", "payroll", "recruitment", "expenses", "documents", "sign", "rental", "subscriptions", "fleet", "repair", "studio", "knowledge", "spreadsheet_bi"],
                "type": "string"
              },
              "city": {
                "description": "City name, e.g. München, Munich, Wien, Zürich",
                "type": "string"
              },
              "country": {
                "enum": ["DE", "AT", "CH"],
                "type": "string"
              },
              "industry": {
                "description": "Industry the partner states as a focus",
                "enum": ["manufacturing", "wholesale_distribution", "retail_ecommerce", "construction_trades", "professional_services", "it_software", "logistics_transport", "food_beverage", "healthcare_pharma", "energy_utilities", "real_estate", "education", "nonprofit", "public_sector", "finance_insurance", "hospitality_tourism", "automotive", "agriculture", "media_marketing"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Text in the partner name or summary",
                "type": "string"
              },
              "tier": {
                "enum": ["gold", "silver", "ready"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:337ca93c95be131edaa107c21c93f63b9d5ee8027dfa13c5ad3e04abb7c02e4c"
        }
      ],
      "digest": "sha256:ba8d88953a270665ee79e4e0b11ac5106eceb3c489c0d881e7099803d2d16ac9"
    }
  }
}
