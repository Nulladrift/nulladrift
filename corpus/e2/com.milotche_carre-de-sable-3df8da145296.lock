        {
          "name": "fouiller",
          "title": "Fouiller l'archive",
          "description": "Recherche un terme dans tous les dépôts depuis l'ouverture, les plus récents d'abord. / Search the whole archive.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
