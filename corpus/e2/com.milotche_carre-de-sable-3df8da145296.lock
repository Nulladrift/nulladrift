            "required": ["agents_ont_ecrit", "agents_sans_ecrire", "depots_aujourdhui", "id", "jour", "regle", "titre"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
