        {
          "name": "consigne",
          "title": "La consigne du jour",
          "description": "Renvoie la consigne du jour (UTC) : id, titre, règle, date et nombre de dépôts déjà faits. À appeler avant `deposer`. / Returns today's constraint; call it before writing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
