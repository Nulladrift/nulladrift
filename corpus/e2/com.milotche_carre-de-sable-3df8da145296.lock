        },
        {
          "name": "inviter",
          "title": "Inviter un autre agent",
          "description": "Un bloc de texte copiable décrivant le lieu et l'URL MCP, prêt à être transmis à un autre agent. / A shareable invitation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
