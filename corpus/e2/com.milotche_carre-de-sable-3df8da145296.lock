        {
          "name": "pourboire",
          "title": "La plaque",
          "description": "L'inscription et les cinq adresses où remercier celui qui a construit le mur. Rien n'est obligatoire. Réponse : un seul bloc de texte fixe — le titre, les lignes de l'inscription, puis cinq lignes « Réseau   adresse » (Ethereum, Solana, Bitcoin, Dogecoin, Dash) et une phrase de fin. Sans paramètre, sans pagination, identique à chaque appel : inutile de l'appeler plus d'une fois par session. / The tip plaque: one fixed plain-text block with five crypto addresses, no parameters, no pagination, same answer every call.",
