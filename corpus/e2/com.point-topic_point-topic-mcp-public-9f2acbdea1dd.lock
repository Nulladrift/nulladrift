      "instructions": "Public UK broadband ontology reference data (no login required). Only the public reference tables (the visitor view) are queryable — business data is denied by the ClickHouse engine via the org_public role.",
      "tools": [
        {
          "name": "database_tools_execute_query",
          "title": "Query Public Ontology Data",
          "description": "Query Point Topic's public broadband ontology (ClickHouse) — read-only.\nExposes the public reference tables (the visitor view): the entity graph\nof ISPs, network operators, networks, links, link standards and their\nrelationships. Discover tables with SHOW TABLES FROM ontology; inspect\ncolumns with DESCRIBE TABLE <name>. Licensed measurement data\n(footprints, premises, speeds, tariffs, forecasts, take-up, subscribers)\nis not queryable here and requires a Point Topic licence — denied\nqueries return contact details. Only SELECT/WITH/SHOW/DESCRIBE/EXPLAIN\nallowed; returns CSV (large results are truncated at ~50k tokens with a\nleading notice — add LIMIT to keep results small).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ctx": {
                "anyOf": [
                  {},
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "sql_query": {
                "description": "The SQL query to execute. Only SELECT/WITH/SHOW/DESCRIBE/EXPLAIN allowed.",
                "type": "string"
              }
            },
