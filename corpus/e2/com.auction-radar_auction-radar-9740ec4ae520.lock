          "title": "주택수요 실적 지수",
          "description": "시군구·시도·전국의 주택수요 실적을 연도별(2008~2025, 12월 말)로 돌려준다 — 인구·세대·평균 세대원·30~49세 인구·연령 가중 수요(2015=100 지수 포함)와 전년 대비 증가율, 기간 변화 요약. 지역의 주택수요가 늘었는지 줄었는지, 세대 분화(1~2인 세대 증가) 정도를 물을 때 쓴다. 지난 실적만 주며 앞으로의 전망·등급은 주지 않는다(추정 금지). 읍면동 단위 자료는 없다. Korean regional housing-demand history (population, households, age-weighted demand).",
