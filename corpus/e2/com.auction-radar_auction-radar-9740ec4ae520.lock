          "title": "선박·차량·중장비 정보(제원·보관 장소·낙찰 통계)",
          "description": "법원 경매에 나온 선박·어선, 차량, 중장비(동산)의 정보를 알려 준다. 사건번호를 받아 감정서에서 읽은 제원(선박: 총톤수·마력·선질·진수년 / 차량·중장비: 제조사·모델·연식·배기량·연료·주행거리·톤수), 보관 장소, 선박이면 선박 검사 정보(선종·길이·선적항·최근 검사일·검사증서 유효기간)와 정박 항구(어항 종류·위판장·이용 어선 수), 비슷한 물건의 전국 낙찰 통계(최근 2년 낙찰가율 중앙값·건수)를 돌려준다. '이 배 몇 톤이야?', '어선 검사 받았어?', '배가 어느 항구에 있어?', '이 차 몇 년식이야?', '주행거리 얼마야?', '이런 배는 보통 감정가의 몇 %에 팔려?', '굴삭기 낙찰가율 얼마야?' 같은 질문에 쓴다. 받은 값을 그대로 전하고 없는 제원을 지어내지 말 것. 낙찰 통계는 지난 낙찰가율 중앙값으로만 말하고 이 물건의 낙찰가를 스스로 계산하지 말 것. 어선을 낙찰받아도 어업허가·어업권이 따라온다고 말하지 말 것. 부동산이면 제원 자료가 없다고 답한다. Auction Radar facts for a vessel, fishing boat, vehicle or heavy equipment in a Korean court auction: specifications, storage place, vessel inspection, mooring port and nationwide sale statistics.",
