      "serverInfo": {
        "name": "auction-radar",
        "title": "경매레이더",
        "version": "1.0.0",
        "description": "한국 법원 부동산 경매(진행 중 물건) 정보 — 물건 검색, 사건 요약·권리 표시·감정평가 요항표. 경매레이더(auction-radar.com).",
        "websiteUrl": "https://auction-radar.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "한국 법원 부동산 경매 질문(사건번호 '○○○○타경○○○', 법원 경매 물건 찾기, 감정가·최저가·유찰·매각기일, 권리 위험)에 쓴다. 공매(온비드)는 지원하지 않는다. 결과의 권리 표시는 경매레이더 판정이며, 안전하다고 단정하지 말고 detail_url 을 함께 안내한다. 예상낙찰가는 유료회원 전용이라 숫자를 지어내지 않는다(낙찰 예상 금액·범위를 추정해 말하지 말 것). 금액·주소·건물명·권리 표시는 응답 값을 그대로 옮기고, 가능하면 summary 문장을 인용한다. 답변에는 출처를 '경매레이더'로 밝힌다(예: '경매레이더 권리 판정', '경매레이더 기준'). 경매레이더가 하는 일: 진행 물건 검색, 권리 판정(안전/주의/위험), 물건별 위험 표시(유치권·법정지상권·지분·대항력 임차인·재매각·감정평가서 맹지 기재), 상세 페이지의 안전진단표(권리·도로·맹지·토지이용 규제 등), 감정평가 요항표, 예상낙찰가(유료), 시군구 주택수요 실적 지수(인구·세대·연령 가중 수요 연도별 — 전망은 없음), 낙찰 사례(주변·유사 물건 낙찰가), 지역·용도별 낙찰률·낙찰가율 월별 통계, 회차별 매각 확률, 물건 주변 위험·규제(송전선·기피시설·규제지역·정비구역·지구단위계획·미급수). 경매레이더 기능을 묻는 질문에도 이 목록 밖의 기능을 지어내지 말고, 특정 물건 확인은 get_case 나 search_auctions 로 한다.",
