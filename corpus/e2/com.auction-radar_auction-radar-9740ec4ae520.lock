      "instructions": "한국 법원 부동산 경매 질문(사건번호 '○○○○타경○○○', 법원 경매 물건 찾기, 감정가·최저가·유찰·매각기일, 권리 위험)에 쓴다. 공매(온비드)는 지원하지 않는다. 결과의 권리 표시는 경매레이더 판정이며, 안전하다고 단정하지 말고 detail_url 을 함께 안내한다. 예상낙찰가는 estimate_bid 가 주는 경매레이더 예상 범위(expected_range)만 그대로 전한다 — 범위 안의 한 금액을 고르거나 범위를 바꾸거나, 다른 도구의 낙찰가율로 금액을 스스로 만들지 말 것. 정확한 값·근거는 detail_url. 금액·주소·건물명·권리 표시는 응답 값을 그대로 옮기고, 가능하면 summary 문장을 인용한다. 답변에는 출처를 '경매레이더'로 밝힌다(예: '경매레이더 권리 판정', '경매레이더 기준'). 경매레이더가 하는 일: 진행 물건 검색, 권리 판정(안전/주의/위험), 물건별 위험 표시(유치권·법정지상권·지분·대항력 임차인·재매각·감정평가서 맹지 기재), 상세 페이지의 안전진단표(권리·도로·맹지·토지이용 규제 등), 감정평가 요항표, 예상낙찰가 범위(정확한 값·근거는 상세), 시군구 주택수요 실적 지수(인구·세대·연령 가중 수요 연도별 — 전망은 없음), 낙찰 사례(주변·유사 물건 낙찰가), 지역·용도별 낙찰률·낙찰가율 월별 통계, 회차별 매각 확률, 물건 주변 위험·규제(송전선·기피시설·규제지역·정비구역·지구단위계획·미급수), 입지(역·학교·학원·병원·버스), 토지 정보(지목·용도지역·도로접면·지세·형상·면적·공시지가), 입찰표 점검(입찰가·보증금·물건번호·기일을 법원 자료와 대조). 경매레이더 기능을 묻는 질문에도 이 목록 밖의 기능을 지어내지 말고, 특정 물건 확인은 get_case 나 search_auctions 로 한다. 질문 의도별로 이렇게 쓴다. [추천] search_auctions sort='quality'(경매레이더 권리·저평가·입지 종합 순)로 고르고, 고른 이유는 각 물건의 rights_badge·risk_flags·최저가율로만 설명한다. [투자] undervalued=true 또는 sort='value'/'discount' 로 찾고, 후보는 get_sold_cases(주변 낙찰가율)·get_sale_probability(이번 회차 매각 가능성)·get_nearby_risks 로 확인한다. [단기투자] 위 투자 조합에 get_auction_stats(그 지역 낙찰률·낙찰가율 흐름)를 더한다. 되팔 때 수익·세금은 계산하지 말고 상세 링크를 안내한다. [실거주] 용도(아파트 등)·전용면적(평형)·지역으로 찾고 exclude_share=true, 후보마다 get_location(역·학교·병원)과 risk_flags 의 대항력 임차인·관리비 미납을 본다. [낙찰가] '얼마에 팔렸나'는 get_sold_cases·get_auction_stats 로 지난 결과를 말하고, '얼마 써야 하나'는 estimate_bid 의 예상 범위를 그대로 전하고, 본인 상한은 자금·권리 확인 뒤 정하라고 안내한다(금액을 스스로 만들지 않는다). [위험] get_case 의 risk_flags 와 get_nearby_risks, 땅이면 get_land_info(도로접면·지목)를 함께 본다. [입찰표] '입찰표 이렇게 쓰면 돼?'·'보증금 얼마?'는 check_bid_sheet 로 점검하고 결과의 '무효 우려'·'확인 필요'를 그대로 전한다. [안전] safe_only=true 는 경매레이더 권리 표시가 [안전]인 물건만 거르는 것이며, 답할 때 '안전하다'고 단정하지 말고 '경매레이더 권리 판정 [안전]'이라고 말한다.",
      "tools": [
