          "description": "지역 부동산 시장 지표를 알려 준다. 사건번호를 주면 그 물건이 속한 시군구의 인구 변화, 공시지가 변화, 매매가격지수와 거래량 변화, 경매 낙찰가율·입찰자 수 변화, 전세가율, 미분양, 주택가격 소비심리와 경매레이더 시장 축 점수·판정기별 결과를 돌려준다. 사건번호 없이 region 에 시군구 이름('용인시 처인구', '부산 해운대구')을 주면 그 시군구의 같은 지표를, 시도(전국·수도권·서울·경기·인천·부산·대구·광주·대전·울산·세종)를 주면 그 지역 시황(금리·물가·주택 매매가격지수·거래량·심리·경매 지표의 최근 월별 값)을 돌려준다. '이 동네 시장 분위기 어때?', '집값 오르고 있어?', '거래량 어때?', '전세가율 얼마야?', '미분양 많아?', '요즘 금리 어때?', '지금 경매 해도 될까?' 같은 질문에 쓴다. 지난 실적이며 전망이 아니다 — 오를지 내릴지 예측하지 말 것. 낙찰률·낙찰가율 월별 추이는 get_auction_stats, 인구·세대 연도별 추이는 get_housing_demand. Auction Radar regional market indicators for Korean real estate.",
