        {
          "name": "get_auction_stats",
          "title": "낙찰 통계(낙찰률·낙찰가율)",
          "description": "지역(·용도)의 월별 법원경매 통계 — 진행 건수, 낙찰 건수, 낙찰률, 감정가 대비 낙찰가율, 평균 입찰자 수(월 집계). '화성시 아파트 낙찰가율', '서울 경매 낙찰률 추이' 같은 질문에 쓴다. 지역은 시도부터(예: '경기 화성시', '서울', '전국'). Monthly court-auction sale rate and price-to-appraisal ratio by region.",
