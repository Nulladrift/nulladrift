          "description": "법원 기일입찰표에 적을(적은) 금액이 맞는지 경매레이더가 법원 자료와 대조한다. 사건번호·물건번호·입찰가격·보증금액을 받아 최저매각가격 미달, 법원이 정한 보증 비율 대비 보증금 부족, 입찰가격 칸과 보증금액 칸 뒤바뀜, 숫자 한 자리 과다, 물건번호 누락, 입찰기일 불일치, 진행 상태(변경·연기·취하), 보증 수표 합계, 공동입찰 지분 합계를 점검해 '무효 우려'·'확인 필요'로 돌려준다. '입찰표 이렇게 쓰면 돼?', '보증금 얼마 넣어야 해?' 같은 질문에 쓴다. 이름·주민번호 등 개인정보는 넣지 않는다. 결과를 '무효입니다'로 단정하지 말고, 이용자의 입찰가를 평가하거나 다른 금액을 권하지 말 것. Auction Radar bid-sheet check for Korean court auctions: verifies bid amount, deposit, item number and sale date against court data.",
