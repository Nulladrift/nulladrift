        {
          "name": "get_case",
          "title": "경매 사건 요약",
          "description": "경매 사건번호(예: 2026타경12345)로 물건 요약을 가져온다 — 법원·주소·용도·면적·감정가·최저가·유찰·매각기일·진행 상태·권리 표시와 위험 표시(경매레이더 판정 — 유치권·법정지상권·지분·대항력·재매각·맹지 기재)·법원 감정평가서 요항표(위치·교통·이용상태·도로·토지이용계획 등)·상세 링크. 같은 사건번호가 여러 법원에 있거나 물건이 여럿이면 후보 목록을 돌려주니 court·item_no 로 다시 부른다. '얼마 써야 하나'·예상낙찰가·입찰가 질문이 함께 있으면 estimate_bid 도 불러 예상 범위를 그대로 쓰고, 금액을 스스로 추정하지 않는다.",
