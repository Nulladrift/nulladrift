          "title": "주소로 경매 확인",
          "description": "주소 한 줄(지번 또는 도로명, 건물명·동·호수 포함 가능)로 그 부동산이 지금 법원 경매 진행 중인지 확인한다. 진행 중이면 사건번호·법원·감정가·지금 최저가·매각기일·권리 표시·위험 사유를, 진행 중이 아니면 지난 경매 사건(매각·취하 등 결과와 매각가)을, 같은 주소가 없으면 비슷한 주소(같은 건물 다른 호·같은 번지대·같은 이름 건물)의 물건을 돌려준다. '이 주소 경매 나왔어?', '우리 집(전셋집) 경매 넘어갔어?', '○○아파트 101동 1203호 경매 진행 중이야?' 같은 질문에 쓴다. 사건번호를 모를 때 먼저 부른다. 주소는 이용자가 말한 그대로 한 줄로 넣는다(나누지 않아도 됨). state 가 'similar' 면 같은 물건이 아니고, 'not_found' 는 경매가 없다는 뜻이 아니다. Find Korean court auction cases (ongoing or past) by a street/lot address.",
