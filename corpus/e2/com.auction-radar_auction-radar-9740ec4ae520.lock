        "description": "한국 법원 부동산 경매 정보 — 진행 물건 검색, 주소로 경매 진행 여부 확인, 사건 요약과 권리 판정, 임차인·낙찰자가 떠안는 보증금, 예상낙찰가 범위, 시세·낙찰 사례·통계, 등기·토지·건축물 자료, 입찰 절차와 입찰표 점검, 경매 상식. 경매레이더(auction-radar.com). Korean court real-estate auctions: search, address lookup, case summary and rights judgment, tenant deposits a buyer must assume, expected winning-bid range, market value and past sales, registry/land/building records, bidding guide and bid-sheet check.",
