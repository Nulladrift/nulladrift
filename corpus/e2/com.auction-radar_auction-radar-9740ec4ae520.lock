          "description": "경매 물건의 임차인과 낙찰자가 떠안는 보증금을 경매레이더 권리 판정(RX) 결과로 알려 준다. 사건번호를 받아 임차인(점유자)별 보증금·전입일·확정일자·배당요구일·대항력 판정(있음/없음), 말소기준일, 인수 여부 판정(인수·조건부 인수·부담 해소·주의·불분명), 낙찰자가 떠안는 금액(최저가에 낙찰될 때·감정가에 낙찰될 때), 선순위 전세권 인수 금액을 돌려준다. '임차인 보증금 내가 떠안아야 해?', '대항력 있는 세입자 있어?', '낙찰받으면 인수해야 하는 금액 있어?', '세입자 몇 명이야?' 같은 질문에 쓴다. 예상 배당표(expected_distribution)도 함께 준다 — 입찰희망자는 '대항력 임차인이 전액 배당받는지'(for_bidder), 이해관계인(임차인·채권자)은 '내가 배당받을 예상 금액'(ranking 의 자기 줄)을 본다. '대항력 임차인 전액 배당받아?', '세입자인데 얼마 배당받아?', '근저당권자인데 얼마 배당돼?'에도 쓴다. 예상 배당은 '그 가격에 매각된다고 가정한 값'이라고 기준 가격과 함께 말할 것. 받은 금액과 판정을 그대로 전하고, 다른 낙찰가의 인수 금액을 스스로 계산하거나 '안전하다'고 단정하지 말 것. Auction Radar tenant and assumed-deposit judgment for a Korean court auction case.",
