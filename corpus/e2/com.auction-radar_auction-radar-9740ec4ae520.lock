          "title": "시세·추정 시세",
          "description": "경매 물건의 시세를 경매레이더 가치 판정 결과로 알려 준다. 사건번호를 받아 경매레이더 추정 시세, 지금 최저가가 추정 시세·감정가의 몇 %인지, 같은 단지·주변 실거래 평균과 비교 사례(주소·면적·층·거래월·금액·평당가), 공개 매물 호가 범위, 추정 방법별 값과 추정 범위, 토지값과 건물값(원가 방식), 수익 기준 추정 시세(상가), 필지별 지놈 토지 추정가, 건물 판독, 정비구역 빌라 비교 등 가치 판정기별 결과를 돌려준다. '시세가 얼마야?', '최저가가 싼 거야?', '감정가가 시세보다 높은 거 아냐?', '주변 실거래가랑 비교해줘', '땅값만 얼마야?' 같은 질문에 쓴다. 금액은 받은 값 그대로 전하고 '경매레이더 추정 시세'라고 밝힐 것. 이 값으로 예상낙찰가를 만들지 말 것(예상낙찰가는 estimate_bid 의 범위만). 호가 출처 사이트 이름을 대지 말 것. Auction Radar estimated market value and comparable real trades for a Korean court auction case.",
