          "description": "경매 물건이 재개발·재건축·소규모 정비사업 구역 안에 있을 때, 낙찰받으면 조합원 지위를 이어받을 수 있는지에 대한 경매레이더 판정을 알려 준다. 사건번호를 받아 판정 결과와 문장, 구역·사업장 이름과 사업 단계, 적용 법, 투기과열지구 여부, 양도 제한이 시작되는 단계와 날짜, 매각기일과 대금 납부 예상일, 구역 경계 자료와 토지이용계획이 일치하는지, 신속통합기획·모아타운 대상지 여부, 확인할 사항을 돌려준다. '낙찰받으면 조합원 돼?', '입주권 나와?', '현금청산 되는 거 아냐?', '재개발 구역이야?', '사업 어디까지 진행됐어?' 같은 질문에 쓴다. 판정 문장을 그대로 전하고 자격을 단정하지 말 것. 구역 자료에서 찾지 못한 것을 '정비구역이 아니다'로 말하지 말 것. Auction Radar judgment on redevelopment association membership succession for a Korean court auction case.",
