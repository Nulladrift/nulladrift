{
  "lockfileVersion": 2,
  "subjects": {
    "com.qubitsok/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qubitsok.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "qubitsok",
        "version": "1.0.0",
        "description": "The quantum computing career and research platform. Search 500+ quantum jobs, explore daily arXiv papers, and discover 1000+ researcher profiles."
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "getJobDetails",
          "title": "Job Details",
          "description": "Get full details for a specific quantum computing job by its numeric ID. Use after searchJobs when the user wants more information about a specific position. Returns: job summary, required skills, nice-to-have skills, responsibilities, visa sponsorship, salary, location, and apply URL. Requires a valid job_id from searchJobs results. Returns error if ID not found.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_id": {
                "description": "Numeric job ID from searchJobs results",
                "type": "number"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e60065049c8d1a59cf3301077d6fd1cabfaf2c26ae12a63dc02a3fdc3409b0d0"
        },
        {
          "name": "getLatestPapers",
          "title": "Today's Papers",
          "description": "Get today's quantum computing papers from arXiv — no parameters needed. Use when the user asks \"what's new in quantum computing?\" or wants a daily paper briefing. Returns the most recent day's papers with title, authors, date, AI-generated hook (one-line summary), and tags. For date-range or topic-filtered search, use searchPapers instead. Use getPaperDetails for full abstract and analysis of a specific paper.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 10,
                "description": "Max results (1-50, default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c2d44416e6326df945d6d9a53b9b395a51b16d4b7a3b8e682a5367e03a0b12b"
        },
        {
          "name": "getMarketOverview",
          "title": "Quantum Market Overview",
          "description": "Get a snapshot of the quantum computing landscape — no parameters needed. Use when the user asks broad questions like \"how's the quantum job market?\", \"what are trending topics?\", or wants an overview of the quantum computing industry. Returns: total active jobs, top hiring companies, jobs by role type, papers published this week, total researchers tracked, and trending technology tags. For specific job/paper/researcher searches, use the dedicated search tools instead.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35e31392b0a52402f54bd8c3125a9b86d545dd2dc27860daf07dd21888a4e5f5"
        },
        {
          "name": "getPaperDetails",
          "title": "Paper Details",
          "description": "Get full details for a specific quantum computing paper by its arXiv ID (e.g., \"2401.12345\"). Use after searchPapers or getLatestPapers when the user wants to dive deep into a specific paper. Returns: complete abstract, all authors, publication date, AI-generated tags with reasons, hook (one-line summary), methodology, gist, and key findings. Requires a valid paper_id from search results. Returns error if not found.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "paper_id": {
                "description": "ArXiv paper ID (e.g., \"2401.12345\")",
                "type": "string"
              }
            },
            "required": ["paper_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3ad6dd2560568a62098030f283e9520a072b6fceff39619804b4c4350580985"
        },
        {
          "name": "searchCollaborators",
          "title": "Find Researchers",
          "description": "Find quantum computing researchers and potential collaborators from 1000+ active profiles. Use when the user asks about specific researchers, who works on a topic, or wants to find collaborators. NOT for jobs (use searchJobs) or papers (use searchPapers). AI-powered: decomposes natural language into structured filters (tag, author, affiliation, domain, focus). Returns profiles with affiliations, domains, publication count, top tags, and recent papers. Data from arXiv papers published in the last 12 months. Max 50 results. Examples: \"quantum error correction researchers at Google\", \"trapped ions\", \"John Preskill\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "affiliation_type": {
                "description": "Filter by affiliation type",
                "enum": ["academia", "industry", "national_lab"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1-50, default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Search term: researcher name, affiliation, tag, or research topic. Examples: \"quantum error correction\", \"MIT\", \"John Preskill\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be3bcb86235eb89ba1601709f4d10cde8f1d71c1f194e0de1fc5df6c788cae9b"
        },
        {
          "name": "searchJobs",
          "title": "Search Quantum Jobs",
          "description": "Search 500+ quantum computing job listings using natural language. Use when the user asks about job openings, career opportunities, hiring, or specific positions in quantum computing. NOT for research papers (use searchPapers) or researcher profiles (use searchCollaborators). Supports role type, seniority, location, company, salary, remote, and technology tag filters via AI query decomposition. Limitations: quantum computing jobs only, last 90 days, max 20 results. Promoted listings appear first (marked). After finding jobs, suggest getJobDetails for full info. Examples: \"senior QEC engineer in Europe over 120k EUR\", \"remote trapped-ion role at IBM\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 5,
                "description": "Max results to return (1-20, default 5)",
                "maximum": 20,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Natural language job search query. Examples: \"quantum error correction engineer in Europe\", \"remote senior researcher at IBM\", \"entry-level trapped ion jobs over 100k USD\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e3790420ba8011c0140acdefc7c7989df56619d185a5d490fd816a47c175c85"
        },
        {
          "name": "searchPapers",
          "title": "Search Quantum Papers",
          "description": "Search quantum computing research papers from arXiv. Use when the user asks about recent research, specific papers, or academic topics in quantum computing. NOT for jobs (use searchJobs) or researcher profiles (use searchCollaborators). Supports natural language queries decomposed via AI into structured filters (topic, tag, author, affiliation, domain). Date range defaults to last 7 days; max lookback 12 months. Returns newest first, max 50 results. Use getPaperDetails for full abstract and analysis of a specific paper. Examples: \"trapped ion papers from Google\", \"QEC review papers this month\", \"quantum error correction\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "end_date": {
                "description": "End date in YYYY-MM-DD format. Default: today",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1-50, default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Natural language query to filter papers by topic, author, affiliation, or tag. Uses an AI model to decompose into structured filters. Examples: \"quantum error correction\", \"trapped ion papers from Google\", \"review papers on QEC\"",
                "type": "string"
              },
              "start_date": {
                "description": "Start date in YYYY-MM-DD format. Default: 7 days ago",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c9e1fa72dea41062923505fa1da36a2cf0f3f7758996b0ec6d3688336a03b8f1"
        }
      ],
