                "enum": ["pequena", "mediana", "grande", "corporativa"],
                "type": "string"
              },
              "tema": {
                "description": "Con que=cotizar_capacitacion: Tema principal.",
                "enum": ["general", "prompts", "agentes", "datos", "ventas", "ley"],
                "type": "string"
              },
              "urgente": {
                "description": "Con que=cotizar_capacitacion: true si debe empezar en menos de dos semanas.",
                "type": "boolean"
              }
            },
            "type": "object"
