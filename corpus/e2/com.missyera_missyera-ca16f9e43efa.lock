        {
          "name": "hacer_mi_trabajo",
          "title": "Hacer mi trabajo con el kit de Miss Yera",
          "description": "Para quien vende su trabajo o sus productos y quiere hacerlo aquí mismo, con el método del kit de skills gratuito de Miss Yera. Cinco grupos: conseguir clientes (estudio de mercado, calendario de redes, carrusel, guion de reel, anuncios, catálogo para WhatsApp y web), cerrar y cobrar (cuánto cobrar, cotización o propuesta en PDF con diseño, qué contestarle al cliente, «está caro», testimonios, cobrar), trabajar con datos (tablero, fórmula o archivo de Excel, revisar un archivo sucio, SQL, informe de una página, presentación), dar un taller (plan de la sesión y sílabo, rúbrica, revisar material, certificados) y ordenar el trabajo (arranque de un cliente, minuta de reunión, procesos, qué delegar en IA, estudiar un tema). Pásale lo que dijo la persona en pedido; si ya sabes el trabajo, pásalo también. Sin trabajo y sin un pedido claro devuelve el menú con el enrutador. Con trabajo devuelve las instrucciones completas, con sus looks y plantillas si produce un archivo con diseño. No es para cotizar una capacitación con Miss Yera (cursos_y_servicios con que=cotizar_capacitacion) ni para aprender teoría de datos (aprender_ia con que=academia_datos).",
          "inputSchema": {
            "properties": {
              "pedido": {
                "description": "Lo que dijo la persona, con sus palabras.",
                "type": "string"
              },
              "trabajo": {
                "description": "El trabajo, si ya se sabe. Conseguir clientes: estudio-mercado-expres (Saber si hay mercado para tu idea en tu ciudad, quién compite, a cuánto cobran y el veredicto.), calendario (El mes de publicaciones armado: qué publicar cada semana y qué se graba en una tarde.), carrusel (Un carrusel de Instagram con tu marca, en un archivo con diseño y diez looks.), video (El guion de un reel o TikTok, con el gancho de los tres primeros segundos.), anuncios (Cinco anuncios por ángulos distintos y el plan para probarlos.), mostrar (La publicación que enseña un trabajo que ya entregaste, con el antes y después.), catalogo (Tu catálogo con precios, buscador y pedido que abre WhatsApp con el total sumado.), web (La web de tu negocio en un solo archivo, con servicios y botón de WhatsApp.), receta-clientes (La receta entera, uno detrás de otro: mercado, contenido del mes y vitrina.) Cerrar y cobrar: precio (Cuánto cobrar: tu piso por hora, el precio de un proyecto y hasta cuánto puedes bajar.), cotizacion (La cotización en PDF con diseño, partidas, condiciones, validez y el mensaje para mandarla.), propuesta (La propuesta comercial, con el diagnóstico primero y el precio en la página tres.), vender (Qué contestar cuando te escriben o te preguntan el precio por WhatsApp.), objeciones (Qué responder a «está caro», «lo voy a pensar» o «el otro cobra menos».), que-vuelvan (La segunda venta: que te vuelvan a comprar, te recomienden y te dejen un testimonio.), mensaje-dificil (El mensaje incómodo: cobrar, decir que no, reclamar o dar una mala noticia.), receta-venta (La receta entera: el número, la cotización o la propuesta y los mensajes para cerrar.) Trabajar con datos: tablero (De un Excel o CSV a un tablero de una página con indicadores, gráficos y hallazgos.), bi (Un tablero de varias páginas para que el cliente lo explore, al estilo de una herramienta de BI.), formula (La fórmula de Excel lista para pegar, en español y en inglés, con lo que se puede romper.), archivo (El Excel editable terminado (.xlsx), con fórmulas vivas, que el cliente sigue usando.), revisa-tabla (Revisar un archivo antes de usarlo: qué está sucio, cuánto y cómo se limpia.), consulta-sql (La consulta SQL lista para correr, con lo que cambia entre bases de datos.), informe (El informe de una página con la recomendación arriba y los pasos con responsable.), presentacion (Las diapositivas para exponer, con el guion de qué decir en cada lámina.), receta-cierre-de-mes (La receta del cierre de mes con un cliente: tablero, informe de una página y mensaje.) Dar un taller: sesion (El plan del taller bloque por bloque con el reloj, y el sílabo: el de una página para una empresa o el formal por competencias.), evaluacion (Las preguntas con su clave, la consigna y la rúbrica para calificar.), revisar (Revisar un material, un sílabo, una rúbrica o una consigna que ya tienes o que te observaron: qué falta, qué sobra y qué se corta.), certificados-lote (Un certificado por persona desde una lista de nombres, con código y tarjeta para redes.), receta-taller (La receta entera, de la idea al certificado: plan, precio, contenido, evaluación y diplomas.) Ordenar mi trabajo: arranque (Arrancar con un cliente nuevo: qué pedirle, en qué orden y las fechas del primer mes.), reunion (De una reunión al plan con responsable y fecha, la minuta y el mensaje para el grupo.), proceso (Dejar escrito cómo se hace algo: diagramas, el manual de una página y el organigrama.), delegar-ia (Si una tarea conviene delegarla a una IA y con qué, y qué revisar antes de mandarla.), apuntes-examen (De tu material de estudio a resumen, tarjetas, preguntas y plan de repaso.)",
                "enum": ["estudio-mercado-expres", "calendario", "carrusel", "video", "anuncios", "mostrar", "catalogo", "web", "receta-clientes", "precio", "cotizacion", "propuesta", "vender", "objeciones", "que-vuelvan", "mensaje-dificil", "receta-venta", "tablero", "bi", "formula", "archivo", "revisa-tabla", "consulta-sql", "informe", "presentacion", "receta-cierre-de-mes", "sesion", "evaluacion", "revisar", "certificados-lote", "receta-taller", "arranque", "reunion", "proceso", "delegar-ia", "apuntes-examen"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Hacer mi trabajo con el kit de Miss Yera"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
