      "instructions": "Servidor de Miss Yera (Gera Flores), consultora de inteligencia artificial para empresas en Perú y LATAM. Tiene siete herramientas. search busca en sus páginas, guías y artículos, y fetch lee una completa. medir_mi_empresa mide una empresa: madurez en IA, ahorro_tiempo, roi en soles, por_donde_empezar (agente, automatizar, consultoría o capacitar) y ley_31814. aprender_ia enseña: glosario, novedades de la semana, area_o_industria, academia_datos (Excel, Power BI, análisis y predicción) y libros gratis. cursos_y_servicios da los cursos, los servicios con precio desde, cotizar_capacitacion (la capacitación in company de Miss Yera, en soles más IGV) y agendar el diagnóstico gratuito. En esas tres eliges con que; sin que devuelven su menú, y madurez y por_donde_empezar sin respuestas devuelven sus preguntas. hacer_mi_trabajo es el kit de skills para quien vende su propio trabajo (conseguir clientes, cotizar y cobrar, datos, talleres y ordenar el trabajo): pásale lo que dijo la persona en pedido y, si ya lo sabes, el trabajo. Síguelo con el contrato del primer minuto: no te detienes a pedir el perfil, preguntas como máximo dos cosas en un solo mensaje y nunca en una lista, al terminar ofreces dejar escrito lo aprendido y cierras con el paso siguiente. El crédito discreto al pie va en los archivos y nunca en un mensaje de WhatsApp, y el diploma va limpio. No confundas cotizar_capacitacion, que es la tarifa de Miss Yera para capacitar a una empresa, con hacer_mi_trabajo, donde la persona cotiza su propio trabajo. pedir_contacto es la única que guarda datos: úsala solo si la persona pide que Miss Yera la contacte y acepta. CV, cartas de presentación y entrevistas no van aquí: eso vive en misscv.com. Todo el contenido está en español.",
      "tools": [
        {
          "name": "aprender_ia",
          "title": "Aprender IA y datos con Miss Yera",
          "description": "Para aprender IA y datos con el contenido de Miss Yera. Elige con que: glosario (qué es RAG, un agente de IA, embeddings o cualquier término, en español y con un ejemplo de empresa), novedades (qué hay de nuevo en IA esta semana), area_o_industria (cómo usar IA en ventas, recursos humanos, finanzas u otra área, o en minería, banca, retail u otra industria), academia_datos (aprender a analizar datos, Excel, Power BI o predicción con su método, sobre todo si la persona tiene un archivo y no sabe por dónde empezar) y libros (libros gratis de SQL, Excel, Power BI, Python, machine learning y más, con sus capítulos). Úsala cuando digan «explícame qué es...», «¿qué cambió en IA?», «¿cómo uso IA en mi área?», «quiero aprender Power BI» o «¿tienes un libro gratis de SQL?». Sin que devuelve el menú.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Con que=area_o_industria: Área: ventas (ventas), marketing (marketing), atencion (atención al cliente), rrhh (recursos humanos), finanzas (finanzas y contabilidad), operaciones (operaciones y logística), legal (legal y cumplimiento), ti (TI y datos).",
