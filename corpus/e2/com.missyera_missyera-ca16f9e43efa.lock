        {
          "name": "cursos_y_servicios",
          "title": "Cursos y servicios de Miss Yera",
          "description": "Lo que ofrece Miss Yera y cómo contratarla. Elige con que: cursos (Full Day IA, Ingeniería de ventas con IA y los cursos de datos grabados, con precio, fechas y enlace para inscribirse), servicios (consultoría, agentes de IA, capacitación in company, Ley 31814 y GEO, con el precio desde y las industrias que atiende), cotizar_capacitacion (cuánto cuesta capacitar a un equipo en IA con Miss Yera, con sus tarifas reales en soles más IGV y el detalle del cálculo) y agendar (el enlace al diagnóstico gratuito de 30 minutos). Úsala cuando pregunten «¿qué curso me conviene?», «¿cuánto cuesta?», «¿cuándo empieza?», «¿qué servicios tiene?», «¿cuánto costaría capacitar a 30 personas?» o «quiero hablar con Miss Yera». No es para que la persona cotice su propio trabajo: eso es hacer_mi_trabajo. Sin que devuelve el menú.",
          "inputSchema": {
            "properties": {
              "equipo": {
                "description": "Con que=cotizar_capacitacion: true si quieren a Miss Yera con equipo de apoyo en la práctica.",
                "type": "boolean"
              },
              "horas": {
                "description": "Con que=cotizar_capacitacion: Horas totales del programa (sesiones por horas de cada una).",
                "maximum": 200,
                "minimum": 4,
                "type": "integer"
              },
              "lugar": {
                "description": "Con que=cotizar_capacitacion: empresa (su local en Lima, por defecto), virtual o provincia.",
                "enum": ["empresa", "virtual", "provincia"],
                "type": "string"
              },
              "personas": {
                "description": "Con que=cotizar_capacitacion: Personas a capacitar.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "que": {
                "description": "Qué quieres. cursos: los cursos de Miss Yera con precio, modalidad, próximas fechas y enlace: Full Day IA, Ingeniería de ventas con IA y los cursos de datos grabados; servicios: los servicios de IA para empresas y las industrias que atiende, con el precio desde publicado; cotizar_capacitacion: cuánto cuesta capacitar a un equipo en IA con Miss Yera, en soles más IGV con el detalle del cálculo (tamano, personas y horas); agendar: el enlace para agendar el diagnóstico gratuito de 30 minutos con Miss Yera y su correo (no agenda por sí sola). Sin que devuelve el menú.",
                "enum": ["cursos", "servicios", "cotizar_capacitacion", "agendar"],
                "type": "string"
              },
              "rubro": {
                "description": "Con que=cotizar_capacitacion: Rubro de la empresa. Por defecto otro.",
                "enum": ["banca", "seguros", "salud", "mineria", "publico", "retail", "logistica", "educacion", "tecnologia", "manufactura", "servicios", "otro"],
                "type": "string"
              },
              "tamano": {
