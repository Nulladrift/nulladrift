              "industria": {
                "description": "Con que=area_o_industria: Industria de la empresa.",
                "enum": ["banca", "mineria", "retail", "logistica", "consumo-masivo", "telecomunicaciones", "salud", "energia"],
                "type": "string"
              },
              "libro": {
                "description": "Con que=libros: id del libro para ver sus capítulos.",
                "enum": ["sql-desde-cero", "machine-learning-desde-cero", "excel-desde-cero", "power-bi-desde-cero", "python-desde-cero", "estadistica-desde-cero", "deep-learning-desde-cero", "git-desde-cero", "fundamentos-de-ia", "matematica-para-machine-learning"],
                "type": "string"
              },
              "que": {
                "description": "Qué quieres. glosario: qué es un término de IA (RAG, agente, embeddings, MCP), en español y con un ejemplo de empresa (pasa termino); novedades: qué cambió en IA esta semana y qué significa para una empresa, el Radar de IA (cantidad opcional); area_o_industria: cómo usar IA en un área (ventas, recursos humanos, finanzas...) o una industria (minería, banca, retail...): pasa area, industria o ambas; academia_datos: aprender a trabajar datos: mirar un archivo, Excel, Power BI, por qué bajó un número y predecir (sin tema devuelve los cinco temas); libros: libros gratis para aprender SQL, Excel, Power BI, Python, estadística, machine learning y más (con libro devuelve sus capítulos). Sin que devuelve el menú.",
                "enum": ["glosario", "novedades", "area_o_industria", "academia_datos", "libros"],
                "type": "string"
              },
              "tema": {
                "description": "Con que=academia_datos: Tema: mira-tu-data (Los primeros veinte minutos con un archivo de datos, en el orden correcto); excel-de-analista (Excel como herramienta de datos, con Power Query y el modelo de datos); powerbi-de-cero (Power BI con el modelo estrella, la tabla de calendario y las medidas DAX); por-que-bajo (Por qué subió o bajó un número, separando lo que cambió de lo que lo causó); predecir-con-datos (Aprendizaje supervisado sin humo, con el baseline primero).",
                "enum": ["mira-tu-data", "excel-de-analista", "powerbi-de-cero", "por-que-bajo", "predecir-con-datos"],
                "type": "string"
              },
              "termino": {
                "description": "Con que=glosario: El término a definir, por ejemplo RAG o agente de IA.",
                "type": "string"
              }
            },
            "type": "object"
