        {
          "name": "medir_mi_empresa",
          "title": "Medir mi empresa en IA",
          "description": "Las calculadoras y diagnósticos de missyera.com para una empresa. Elige con que: madurez (qué tan preparada está la empresa para la IA), ahorro_tiempo (cuántas horas ahorraría el equipo con IA), roi (cuántos soles ahorra un área con IA, para justificar la inversión), por_donde_empezar (si le conviene un agente, automatizar, una consultoría o capacitar al equipo) y ley_31814 (qué hacer por la ley peruana de IA y su reglamento; no es asesoría legal). Úsala cuando pregunten «¿mi empresa está lista para la IA?», «¿cuánto tiempo o cuánta plata ahorraríamos con IA?», «¿vale la pena invertir en IA?», «¿necesito un agente o capacitar a mi equipo?» o «¿qué pide la Ley 31814?». madurez y por_donde_empezar sin respuestas devuelven sus preguntas con opciones, para hacérselas a la persona. Sin que devuelve el menú.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "Con que=roi: Área: atencion (Atención al cliente), ventas (Ventas), operaciones (Operaciones y reportes), administracion (Administración).",
                "enum": ["atencion", "ventas", "operaciones", "administracion"],
                "type": "string"
              },
              "buscar": {
                "description": "Con que=ahorro_tiempo: Horas por semana por persona: Buscar y resumir información.",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "costo_hora_soles": {
                "description": "Con que=roi: Costo de una hora de trabajo de esas personas, en soles.",
                "maximum": 2000,
                "minimum": 0,
                "type": "number"
              },
              "cuello_de_botella": {
                "description": "Con que=por_donde_empezar: ¿Dónde está el cuello de botella?",
                "enum": ["En la atención al cliente", "En procesos internos y reportes", "En la estrategia y las prioridades", "En las habilidades del equipo"],
                "type": "string"
              },
              "datos": {
                "anyOf": [
                  {
                    "enum": ["Dispersos en Excel y archivos sueltos", "Centralizados pero poco usados", "Organizados y accesibles", "Los usamos para tomar decisiones"],
                    "type": "string"
                  },
                  {
                    "maximum": 60,
                    "minimum": 0,
                    "type": "number"
                  }
                ],
                "description": "Con que=madurez: ¿Cómo están los datos de tu empresa? Con que=ahorro_tiempo: Horas por semana por persona: Ordenar datos, Excel o reportes."
              },
              "dolor": {
                "description": "Con que=por_donde_empezar: ¿Cuál es tu mayor dolor hoy?",
                "enum": ["Atiendo muchas consultas repetidas", "Tareas manuales entre sistemas me consumen horas", "No sé por dónde empezar con IA", "Mi equipo no sabe usar IA"],
                "type": "string"
              },
              "equipo": {
                "description": "Con que=madurez: ¿Tu equipo sabe usar IA?",
                "enum": ["No, casi nadie", "Hay curiosidad", "Tuvieron capacitación básica", "Capacitados y aplicando"],
                "type": "string"
              },
              "escribir": {
                "description": "Con que=ahorro_tiempo: Horas por semana por persona: Escribir correos, informes o textos.",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "estrategia": {
                "description": "Con que=madurez: ¿Tienes una estrategia de IA?",
                "enum": ["No, ninguna", "Ideas sueltas", "Un plan en marcha", "La IA está en el core del negocio"],
                "type": "string"
              },
              "herramientas": {
                "description": "Con que=madurez: ¿Tu operación usa herramientas de IA?",
                "enum": ["No, todavía no", "Algunos por su cuenta", "Varias áreas las usan", "Integradas al trabajo diario"],
                "type": "string"
              },
              "horas_semana": {
                "description": "Con que=roi: Horas por semana de tareas repetitivas, por persona.",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "liderazgo": {
                "description": "Con que=madurez: ¿La dirección impulsa la IA?",
                "enum": ["No la ven prioridad", "Son escépticos", "Están interesados", "La lideran activamente"],
                "type": "string"
              },
              "objetivo": {
                "description": "Con que=por_donde_empezar: ¿Qué quieres lograr primero?",
                "enum": ["Atender o vender 24/7 sin sumar personal", "Eliminar trabajo manual repetitivo", "Un plan con ROI y prioridades", "Que mi equipo use IA con criterio"],
                "type": "string"
              },
              "perfil": {
                "description": "Con que=por_donde_empezar: ¿Qué te describe mejor?",
                "enum": ["Recibo muchas consultas por WhatsApp", "Copio y pego datos entre sistemas", "Quiero saber qué me conviene", "Quiero que mi equipo aprenda"],
                "type": "string"
              },
              "personas": {
                "description": "Con que=ahorro_tiempo: Personas del equipo que hacen esas tareas. Por defecto 1. Con que=roi: Personas del área que hacen esas tareas.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "preferencia": {
                "description": "Con que=por_donde_empezar: ¿Qué prefieres?",
                "enum": ["Una herramienta que trabaje sola", "Flujos que conecten mis apps", "Acompañamiento experto", "Formación para mi gente"],
                "type": "string"
              },
              "presentar": {
                "description": "Con que=ahorro_tiempo: Horas por semana por persona: Armar presentaciones o material visual.",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "procesos": {
                "description": "Con que=madurez: ¿Cuántos procesos repetitivos automatizas hoy?",
                "enum": ["Ninguno, todo es manual", "Alguno aislado", "Varios", "De forma sistemática"],
                "type": "string"
