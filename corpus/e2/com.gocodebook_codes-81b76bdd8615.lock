{
  "lockfileVersion": 2,
  "subjects": {
    "com.gocodebook/codes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://gocodebook.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "gocodebook-codes",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Verbatim California building, residential, fire, plumbing, mechanical, green and energy code text, plus city and county zoning ordinances, looked up by section number. Results are verbatim excerpts, each with a citation and a Source link to the full section. This server does not decide whether a project complies. lookup_california_code_section and list_california_code_documents are free; search_california_codes finds sections by topic, needs the user's GoCodebook account and uses 1 credit per search — prefer the free lookup whenever the user already has a section number.",
      "tools": [
        {
          "name": "list_california_code_documents",
          "description": "List the California codes and local ordinances available for lookup, and what is not covered. Useful before concluding that a code is unavailable, and for finding the exact document or jurisdiction slug that a lookup takes.",
          "inputSchema": {
            "properties": {
              "jurisdiction": {
                "description": "Optional. A California city or county slug — returns the documents held for that jurisdiction instead of the statewide list.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "applied_question_url": {
                "type": "string"
              },
              "browse_url": {
                "type": "string"
              },
              "editions": {
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "in_force": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "in_force", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "groups": {
                "description": "Documents grouped by collection. Statewide: Title 24 first. Jurisdiction: the place's own documents, then those of the jurisdiction that also governs it.",
                "items": {
                  "properties": {
                    "documents": {
                      "items": {
                        "properties": {
                          "edition": {
                            "type": ["string", "null"]
                          },
                          "slug": {
                            "type": "string"
                          },
                          "title": {
                            "type": "string"
                          },
                          "url": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["slug", "title"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "key": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["documents", "key", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "jurisdiction": {
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["name", "slug"],
                "type": ["object", "null"]
              },
              "message": {
                "type": ["string", "null"]
              },
              "municipal": {
                "description": "Statewide only: how many local ordinances are held.",
                "properties": {
                  "document_count": {
                    "type": "integer"
                  },
                  "jurisdiction_count": {
                    "type": "integer"
                  }
                },
                "required": ["document_count", "jurisdiction_count"],
                "type": ["object", "null"]
              },
              "notes": {
                "description": "Coverage caveats. Read them before telling a user a code is unavailable.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "scope": {
                "enum": ["statewide", "jurisdiction"],
                "type": "string"
              },
              "status": {
                "enum": ["ok", "not_found", "empty", "error"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the California codes available"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27398231fec1cc9d7730592a5cd01c6d071c3c9563d0c33d6acbf61a236c65fd"
        },
        {
          "name": "lookup_california_code_section",
          "description": "Look up the VERBATIM text of a California building, residential, fire, plumbing, mechanical, green (CALGreen), energy or existing-building code section, or a section of a California city or county zoning/municipal ordinance, by its section number. Use this whenever the user cites a section number (\"CRC R602.10.2.3\", \"CBC 1004\", \"§ 17.60.090\") or asks what a specific section says. Returns the official text with its citation, edition and a link to the full section. It returns code text only and does not determine whether a specific project complies.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Optional. The code the user named, so a number that exists in several codes returns the right one. An abbreviation or a name: \"CBC\", \"CRC\", \"CFC\", \"CMC\", \"CPC\", \"CEC\", \"CEBC\", \"CALGreen\", \"CHBC\", \"California Fire Code\". Omit when the user gave no code name.",
                "type": "string"
              },
              "code_edition": {
                "description": "Optional. Which Title 24 cycle to read. California enforces the edition in force when the permit application was submitted, so a project filed in 2024 is enforced under \"2022\". Defaults to \"current\" (the 2025 cycle, in force since 2026-01-01).",
                "enum": ["current", "2022", "2019"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional. A California city or county slug to scope the lookup to its own municipal code — \"los-angeles\", \"san-jose\", \"marin-county\". Omit for statewide Title 24 codes.",
                "type": "string"
              },
              "section": {
                "description": "The section number exactly as cited, without the code name. Examples: \"R602.10.2.3\", \"1004\", \"507.2\", \"17.60.090\", \"11B-206\".",
                "type": "string"
              }
            },
            "required": ["section"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ambiguous": {
                "description": "True when the number exists in more than one code. Pick by the code the user named and say which one you used; never merge them.",
                "type": "boolean"
              },
              "applied_question_url": {
                "description": "Where to send a user whose real question is whether a specific project complies.",
                "type": "string"
              },
              "as_of": {
                "description": "The date the codes were read as of (YYYY-MM-DD), or null for the current edition.",
                "type": ["string", "null"]
              },
              "browse_url": {
                "type": "string"
              },
              "historical": {
                "description": "True when this is NOT the current code. Say so to the user.",
                "type": "boolean"
              },
              "matches": {
                "items": {
                  "properties": {
                    "citation": {
                      "description": "Cite exactly this string.",
                      "type": "string"
                    },
                    "document_slug": {
                      "type": ["string", "null"]
                    },
                    "document_title": {
                      "type": "string"
                    },
                    "edition": {
                      "type": ["string", "null"]
                    },
                    "excerpt": {
                      "type": "string"
                    },
                    "excerpt_truncated": {
                      "description": "True when the excerpt is cut short. It is never the whole section.",
                      "type": "boolean"
                    },
                    "heading": {
                      "type": "string"
                    },
                    "kind": {
                      "description": "text: an excerpt of the section's own words. subsection_list: the section has no text of its own and `excerpt` lists its subsections. empty: no text.",
                      "enum": ["text", "subsection_list", "empty"],
                      "type": "string"
                    },
                    "section_number": {
                      "type": "string"
                    },
                    "source_url": {
                      "description": "Link to the full section. Always show it to the user.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["citation", "document_title", "excerpt", "excerpt_truncated", "heading", "kind", "section_number", "source_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "message": {
                "description": "Guidance when status is not_found or error.",
                "type": ["string", "null"]
              },
              "query": {
                "properties": {
                  "code": {
                    "type": ["string", "null"]
                  },
                  "code_edition": {
                    "enum": ["current", "2022", "2019"],
                    "type": "string"
                  },
                  "jurisdiction": {
                    "type": "string"
                  },
                  "section": {
                    "type": "string"
                  }
                },
                "required": ["code_edition", "jurisdiction", "section"],
                "type": "object"
              },
              "status": {
                "description": "found: at least one section matched. not_found: nothing matched — do NOT paraphrase a section that was not returned. error: the lookup could not run.",
                "enum": ["found", "not_found", "error"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a California code section"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:feded4cdf8b428179a92577e20a995e60cbec93d3955a1a2376b498f3e8a94c2"
        },
        {
          "name": "search_california_codes",
          "description": "Search California building codes (Title 24), state housing law and California city and county zoning/municipal codes by TOPIC, when the user does not already have a section number — e.g. \"minimum attic access opening\", \"ADU setbacks in San Jose\". Requires the user's GoCodebook account and uses 1 credit per search (also when nothing is found). If the user already cites a section number, use lookup_california_code_section instead — it is free. Returns ranked excerpts with citations and links. It does NOT decide whether a project complies.",
          "inputSchema": {
            "properties": {
              "code_edition": {
                "description": "Optional. Which Title 24 cycle to search; a permit filed in 2024 is enforced under \"2022\". Defaults to \"current\".",
                "enum": ["current", "2022", "2019"],
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional. A California city or county slug (\"san-jose\", \"marin-county\") to search that place's own code together with the state codes. Omit for statewide.",
                "type": "string"
              },
              "query": {
                "description": "What to find, in plain words. Up to 300 characters.",
                "type": "string"
              },
              "sources": {
                "description": "Optional. Limit to federal law, state codes, or local ordinances.",
                "items": {
                  "enum": ["federal", "state", "local"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "applied_question_url": {
                "type": "string"
              },
              "as_of": {
                "type": ["string", "null"]
              },
              "credits_charged": {
                "type": "integer"
              },
              "hint": {
                "description": "The search page's own notice about this query (a missing section, a zone code in the wrong city, a code the library does not hold, an address). Tell the user what it says.",
                "type": ["object", "null"]
              },
              "historical": {
                "type": "boolean"
              },
              "message": {
                "type": ["string", "null"]
              },
              "plans_url": {
                "type": ["string", "null"]
              },
              "query": {
                "properties": {
                  "code_edition": {
                    "enum": ["current", "2022", "2019"],
                    "type": "string"
                  },
                  "jurisdiction": {
                    "type": "string"
                  },
                  "query": {
                    "type": "string"
                  },
                  "sources": {
                    "items": {
                      "enum": ["federal", "state", "local"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["code_edition", "jurisdiction", "query"],
                "type": "object"
              },
              "results": {
                "description": "Ranked best-first. Each excerpt is a short passage, never the whole section.",
                "items": {
                  "properties": {
                    "citation": {
                      "description": "Cite exactly this string.",
                      "type": "string"
                    },
                    "document_slug": {
                      "type": ["string", "null"]
                    },
                    "document_title": {
                      "type": "string"
                    },
                    "edition": {
                      "type": ["string", "null"]
                    },
                    "excerpt": {
                      "type": "string"
                    },
                    "excerpt_truncated": {
                      "type": "boolean"
                    },
                    "heading": {
                      "type": "string"
                    },
                    "section_number": {
                      "type": ["string", "null"]
                    },
                    "source_url": {
                      "description": "Link to the full section. Always show it.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["citation", "document_title", "excerpt", "excerpt_truncated", "heading", "source_url"],
                  "type": "object"
                },
                "type": "array"
              },
              "section_ref": {
                "type": ["object", "null"]
              },
              "status": {
                "description": "found / no_results: the search ran and 1 credit was charged (a search with no results still costs a credit). signin_required: the user must connect their GoCodebook account. credits_required: the account has no search credits left; plans_url is an informational page about GoCodebook plans. rate_limited / error: nothing ran and nothing was charged.",
                "enum": ["found", "no_results", "signin_required", "credits_required", "rate_limited", "error"],
                "type": "string"
              }
            },
            "required": ["status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Search California codes (uses 1 credit)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6e1f67fbc83c781ea0a699df4bc0391cd1515aa487de531353c9615f9af4861d"
        }
      ],
      "digest": "sha256:30b9115d75215692ad39a2ad1b8816acc2877cc5048731d5b1a9e46b457da3cd"
    }
  }
}
