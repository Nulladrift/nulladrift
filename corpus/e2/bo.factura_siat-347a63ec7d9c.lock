{
  "lockfileVersion": 2,
  "subjects": {
    "bo.factura/siat": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.factura.bo/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "factura.bo",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Servidor MCP de factura.bo: facturación electrónica para Bolivia integrada con el SIAT de Impuestos Nacionales. Las herramientas de consulta son de solo lectura. Para emitir_factura, SIEMPRE muestra al usuario un resumen (cliente, ítems, total) y pide su confirmación explícita antes de llamarla: una factura emitida es un documento fiscal real. La anulación de facturas no está disponible por MCP; indica al usuario hacerlo desde su sistema. Documentación: https://api.factura.bo/guia",
      "tools": [
        {
          "name": "consultar_creditos",
          "description": "Estado de la cuenta del usuario en factura.bo: créditos de facturación disponibles, modalidad y estado.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f93245ea58266c65d30c969cdde5c11fe67961742ac0df082311357310a5122"
        },
        {
          "name": "consultar_estado_siat",
          "description": "Estado en tiempo real del SIAT de Impuestos Nacionales de Bolivia (¿está caído el SIAT?): OPERATIVO, DEGRADADO o CAIDO, con latencia y uptime de 30 días. No requiere autenticación.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:286d7d709a5b28245b28eebc4672154086ffcee8a42c863d0f0ff59cfc78e728"
        },
        {
          "name": "consultar_factura",
          "description": "Datos completos de una factura por su CUF: estado, montos, enlaces de descarga del PDF y XML.",
          "inputSchema": {
            "properties": {
              "cuf": {
                "description": "Código Único de Factura.",
                "type": "string"
              }
            },
            "required": ["cuf"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5ae5d2fb1b617d258c5a25eaee0ca35d5055e493f80bf8cc86eecae0a0647b00"
        },
        {
          "name": "consultar_tipo_de_cambio",
          "description": "Tipo de cambio oficial del día del Banco Central de Bolivia: dólar (USD/BOB) y UFV. No requiere autenticación.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:82cbbe12b5b5c0b7d76c83ed1ca7d40ac0118f0124dc16634a4ea9269468ae75"
        },
        {
          "name": "emitir_factura",
          "description": "Emite una factura fiscal de Compra y Venta (Sector 1) ante el SIAT de Bolivia. IMPORTANTE: antes de llamar esta herramienta muestra al usuario el resumen completo (cliente, ítems, precios y total) y espera su confirmación explícita — el documento emitido es fiscalmente válido y solo puede revertirse con una anulación formal. Devuelve el CUF, número de factura, monto en literal y los enlaces del PDF.",
          "inputSchema": {
            "properties": {
              "actividad_economica": {
                "description": "Código CAEB de 6 dígitos de la actividad del emisor. Ej: 620000.",
                "type": "string"
              },
              "cliente": {
                "properties": {
                  "correo": {
                    "description": "Si se envía, el cliente recibe la factura por email.",
                    "type": "string"
                  },
                  "numero_documento": {
                    "description": "NIT o CI. '0' para consumidor final.",
                    "type": "string"
                  },
                  "razon_social": {
                    "description": "Obligatorio cuando tipo_documento=5 (NIT).",
                    "type": "string"
                  },
                  "tipo_documento": {
                    "default": 1,
                    "description": "1=CI, 2=CEX, 3=Pasaporte, 4=Otro, 5=NIT.",
                    "type": "integer"
                  }
                },
                "required": ["numero_documento"],
                "type": "object"
              },
              "items": {
                "items": {
                  "properties": {
                    "cantidad": {
                      "type": "number"
                    },
                    "codigo_producto": {
                      "description": "Código interno del producto en el sistema del usuario.",
                      "type": "string"
                    },
                    "codigo_sin": {
                      "description": "Código del producto según catálogo SIAT.",
                      "type": "integer"
                    },
                    "descripcion": {
                      "type": "string"
                    },
                    "descuento": {
                      "default": 0,
                      "description": "Descuento en Bs de este ítem.",
                      "type": "number"
                    },
                    "precio_unitario": {
                      "type": "number"
                    },
                    "unidad_medida": {
                      "default": 1,
                      "description": "Catálogo SIAT: 1=Unidad, 2=Kg, 58=Servicio.",
                      "type": "integer"
                    }
                  },
                  "required": ["cantidad", "codigo_producto", "codigo_sin", "descripcion", "precio_unitario"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "metodo_pago": {
                "default": 1,
                "description": "1=Efectivo, 2=Tarjeta, 7=Transferencia.",
                "type": "integer"
              },
              "punto_venta": {
                "default": 0,
                "type": "integer"
              },
              "sucursal": {
                "default": 0,
                "type": "integer"
              }
            },
            "required": ["actividad_economica", "cliente", "items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4a3713cdbe30acc7a0118b5a64fefa7c988c3d5cdcca8eebcfd140e6b787fd22"
        },
        {
          "name": "listar_facturas",
          "description": "Historial de facturas emitidas por el usuario, de la más reciente a la más antigua. Filtros opcionales por fecha y estado.",
          "inputSchema": {
            "properties": {
              "desde": {
                "description": "Fecha inicial YYYY-MM-DD.",
                "type": "string"
              },
              "estado": {
                "enum": ["EMITIDA", "ANULADA", "OFFLINE"],
                "type": "string"
              },
              "hasta": {
                "description": "Fecha final YYYY-MM-DD.",
                "type": "string"
              },
              "limite": {
                "default": 20,
                "maximum": 100,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6a53caca562f18f786e8b0c7d7df39f53e3f6fe44838823cefda193c670d2fc3"
        },
        {
          "name": "listar_sectores",
          "description": "Lista los 15 tipos de documento fiscal (sectores SIAT) que soporta factura.bo y el endpoint de cada uno.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:862a8d65208831efe4ae83b3adc8c472aee7acba1fae8d8c0f0adf4ab0036ed9"
        },
        {
          "name": "validar_nit",
          "description": "Verifica en tiempo real ante el SIAT si un NIT boliviano está activo para recibir facturas. Úsala antes de emitir una factura con NIT.",
          "inputSchema": {
            "properties": {
              "nit": {
                "description": "NIT a verificar.",
                "type": "integer"
              }
            },
            "required": ["nit"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc61a6c932f00fb2d2dfe0ba988b223723f7291ff94959d5166b0e8d093d7ed6"
        }
      ],
      "digest": "sha256:21e9fb0651e60b48693a5ad5ca9066a6768c72237b135086722a3c4460bd8aae"
    }
  }
}
