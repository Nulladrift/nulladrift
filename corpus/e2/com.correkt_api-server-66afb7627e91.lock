{
  "lockfileVersion": 2,
  "subjects": {
    "com.correkt/api-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.correkt.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "correkt",
        "title": "Correkt Marketplace",
        "version": "1.0.0",
        "websiteUrl": "https://correkt.com",
        "icons": [
          {
            "src": "https://correkt.com/icons/logo.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Correkt is an online marketplace offering 10M+ physical products from verified sellers, with support for crypto, card, and CashApp payments. Enables AI agents to search and discover real products on behalf of users — with agentic purchasing and checkout in active development, making Correkt the marketplace built for the future of autonomous commerce.",
      "tools": [
        {
          "name": "search_products",
          "description": "Search Correkt's catalog of over 10 million products.\n\nUse this tool to find products by name, description, or category.\nAlways use this before adding anything to cart.\n\nTips:\n- Include price filters when the user mentions a budget\n- Use sort=price_asc to find cheapest options\n- Check suggestion field if results seem off — it may correct spelling\n- Page through results if first page doesn't have what you need\n",
          "inputSchema": {
            "properties": {
              "brand_name": {
                "description": "filter by brand name",
                "type": "string"
              },
              "category_id": {
                "description": "filter by category UUID",
                "type": "string"
              },
              "max_price": {
                "description": "maximum price filter",
                "type": "number"
              },
              "min_price": {
                "description": "minimum price filter",
                "type": "number"
              },
              "page": {
                "default": 1,
                "description": "page number",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 10,
                "description": "results per page",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "search query e.g. 'running shoes'",
                "type": "string"
              },
              "sort": {
                "default": "best_match",
                "description": "sort order",
                "enum": ["best_match", "price:asc", "price:desc", "name.keyword:asc", "name.keyword:desc"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_price_available": {
                "type": "number"
              },
              "min_price_available": {
                "type": "number"
              },
              "page": {
                "maximum": 2147483647,
                "minimum": -2147483648,
                "type": "integer"
              },
              "page_size": {
                "type": "integer"
              },
              "products": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "category": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image_url": {
                      "type": "string"
                    },
                    "in_stock": {
                      "type": "boolean"
                    },
                    "link": {
                      "type": "string"
                    },
                    "lowest_price": {
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "category", "id", "image_url", "in_stock", "link", "lowest_price", "name"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "suggestion": {
                "type": "string"
              },
              "total_hits": {
                "type": "integer"
              }
            },
            "required": ["max_price_available", "min_price_available", "page", "page_size", "products", "total_hits"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f75f23e08b4e321a5c9575f440a747fdab1403527047802b504b0ef91a7b8472"
        }
      ],
      "digest": "sha256:a9407d78e219cd293e3b716103253f70e52ae57e339aefe27df12067f3a7a724"
    }
  }
}
