        {
          "name": "calculate_blindbox_chase_odds",
          "title": "Blind Box Secret Chase Odds & Cumulative Pull Probability Calculator",
          "description": "Calculate exact cumulative probability of pulling a Secret Chase figure (1:72, 1:144, or 1:288), expected monetary spend, and sealed whole-case advantage based on number of boxes opened.",
          "inputSchema": {
            "properties": {
              "boxesPurchased": {
                "description": "Number of sealed blind boxes opened (e.g. 1, 6, 12, 36)",
                "type": "integer"
              },
              "secretOddsDenominator": {
                "description": "Official chase pull ratio denominator (e.g. 72 for 1:72, 144 for 1:144)",
                "enum": [72, 144, 288],
                "type": "integer"
              },
              "unitPriceUsd": {
                "default": 16.9,
                "description": "Retail price per individual blind box in USD (e.g. 16.90)",
                "type": "number"
              }
            },
            "required": ["boxesPurchased", "secretOddsDenominator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Blind Box Secret Chase Odds & Cumulative Pull Probability Calculator"
          },
