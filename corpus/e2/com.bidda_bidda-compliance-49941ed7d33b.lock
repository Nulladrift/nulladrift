        {
          "name": "browse_topics",
          "description": "Browse the registry by cross-cutting compliance TOPIC (for example data breach notification, AI transparency, AML and KYC). Returns each topic with how many rules carry it and across how many pillars and jurisdictions. Topics sit on top of the 39 pillars without replacing them. Free, no key required. Pass a topic string to drill into one.",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "Optional topic name to filter or drill into.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Browse rules by topic"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e206cb5cfc9a8326f46c55bcf95237b11eb791cbdc36b70f0273475a8de6fbd6"
        },
        {
          "name": "check_action_compliance",
          "description": "Pre-flight regulatory check. Agent describes an intended action in natural language (\"process EU resident biometric data\", \"transfer health records to a third-party AI vendor\", \"deploy autonomous trading model in Singapore\") and receives a ranked list of regulations that may apply, plus a risk indicator (LOW/MODERATE/HIGH). The primary tool for runtime compliance gating in autonomous agent workflows.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Natural-language description of the intended action.",
                "type": "string"
              },
              "jurisdiction": {
                "description": "Optional jurisdiction filter (eu, us, uk, etc.).",
                "type": "string"
              },
              "limit": {
                "description": "Max matches to return. Default 10. Max 25.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Pre-flight compliance check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fbc020b0e4cb58f4c5c357179bb23cf4b0d3e25dad1806bcceb29848c8922e97"
        },
        {
          "name": "compare_jurisdictions",
          "description": "Compare how different jurisdictions address a compliance topic, side by side, including where their numeric thresholds differ (for example a breach-notification deadline of 72 hours versus 30 days). It surfaces the real rules and numbers and does not rank which jurisdiction is stricter. Requires an active Bidda subscription: pass your key as api_key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional. Your Bidda subscription key. Prefer sending it as the x-bidda-api-key header (or Authorization: Bearer), which is what the auth settings in your MCP client configure; the header takes precedence over this argument. A free trial counts.",
                "type": "string"
              },
              "topic": {
                "description": "Topic to compare, for example \"data breach notification\".",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare jurisdictions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0512d699f9700033c2a8853a8985bbe11d6434c1ccb9930fb283a7978d4164ea"
        },
        {
          "name": "consult_node",
          "description": "The one-call governed turn: fetch the full vault node (this consumes one call on your key, exactly like unlocking a node) AND record a verified node_consulted entry for it on an open run, in a single step. The entry pins the node to its current version + integrity hash, so the run receipt proves what the agent actually consulted. Use this instead of get_node when you are inside a run. Requires an active Bidda subscription: pass api_key.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Optional: an action the agent took or checked.",
                "type": "string"
              },
              "api_key": {
                "description": "Optional. Your Bidda subscription key. Prefer sending it as the x-bidda-api-key header (or Authorization: Bearer), which is what the auth settings in your MCP client configure; the header takes precedence over this argument. A free trial counts.",
                "type": "string"
              },
              "decision": {
                "description": "Optional: what the agent decided using this node.",
                "type": "string"
              },
              "input_hash": {
                "description": "Optional: a sha256:... hash of the user's message instead of the text.",
                "type": "string"
              },
              "model": {
                "description": "Optional: the model id/version making the decision.",
                "type": "string"
              },
              "node_id": {
                "description": "The rule to fetch and record.",
                "type": "string"
              },
              "run_id": {
                "description": "The open run to record into (from open_run).",
                "type": "string"
              },
              "subject_hash": {
                "description": "Optional: a sha256:... hash of an end-user identifier. Hash only.",
                "type": "string"
              },
              "user_input": {
                "description": "Optional: the end user's message as text.",
                "type": "string"
              }
            },
            "required": ["node_id", "run_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Consult a rule and record it"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c5c1525e4d6efb0a1633836380044d451e04a6defc2fc2ec3c1ccfc4709b3b27"
        },
        {
          "name": "create_attestation",
          "description": "Create a signed, time-stamped record of which Bidda rules a person or AI agent relied on for a decision. Returns a record ID and a public verify URL so anyone can later confirm the record has not been changed. Useful for agents that must keep an audit trail of what they checked. Requires an active Bidda subscription: pass api_key.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "Optional: what the agent did.",
                "type": "string"
              },
              "agent": {
                "description": "The system or AI agent that made the decision.",
                "type": "string"
              },
              "api_key": {
                "description": "Optional. Your Bidda subscription key. Prefer sending it as the x-bidda-api-key header (or Authorization: Bearer), which is what the auth settings in your MCP client configure; the header takes precedence over this argument. A free trial counts.",
                "type": "string"
              },
              "nodes": {
                "description": "node_ids that were checked (max 50).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "workflow_steps_followed": {
                "description": "Optional: steps the agent followed.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["agent", "nodes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Sign a decision record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f853b286599ef0f4b964a2d238c5593dd273ba4f6fd5af26d1650f8673cd8d2"
        },
        {
          "name": "create_control_attestation",
          "description": "Sign a tamper-evident record of one of YOUR OWN controls or policies and the Bidda obligation nodes it maps to. Each obligation is pinned to its current version + integrity hash at signing time, so the record shows what the control was mapped against on that date. This is the design-side evidence ('we operate this control, mapped to these obligations'); run receipts are the operating-side evidence. Requires an active Bidda subscription: pass api_key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional. Your Bidda subscription key. Prefer sending it as the x-bidda-api-key header (or Authorization: Bearer), which is what the auth settings in your MCP client configure; the header takes precedence over this argument. A free trial counts.",
                "type": "string"
              },
              "control": {
                "description": "The name of your control or policy.",
                "type": "string"
              },
              "control_owner": {
                "description": "Optional: the role or team that owns the control.",
                "type": "string"
              },
              "control_status": {
                "description": "Optional: implemented | planned | in-progress.",
                "type": "string"
              },
              "effective_date": {
                "description": "Optional: YYYY-MM-DD the control took effect.",
                "type": "string"
              },
              "evidence_ref": {
                "description": "Optional: a reference/URL/hash to your own evidence (kept by you).",
                "type": "string"
              },
              "framework": {
                "description": "Optional: the framework you are mapping to (e.g. \"EU AI Act\").",
                "type": "string"
              },
              "nodes": {
                "description": "Obligation node_ids the control maps to (max 50).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "statement": {
                "description": "What the control does or asserts (plain text).",
                "type": "string"
              }
            },
            "required": ["control", "nodes", "statement"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Sign a control attestation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d18a5bc726fdc6104432b8ac4ca2f079692793ba571ca2291d6c0b5420f28139"
        },
        {
          "name": "drift_check",
          "description": "Check whether the compliance rules an agent has cached in its own memory are still current. Submit the node_id and the integrity hash you stored when you last grounded on each rule; get back, per rule, whether it is fresh, has drifted (content changed), or was withdrawn (instrument repealed) - so the agent re-grounds before acting on stale law. Included with every API tier; the per-call batch size scales with your plan. Pass api_key.",
          "inputSchema": {
            "properties": {
              "anchors": {
                "description": "The cached rules to check.",
                "items": {
                  "properties": {
                    "hash": {
                      "description": "The sha256:... integrity hash you cached for it (omit to just fetch the current fingerprint).",
                      "type": "string"
                    },
                    "node_id": {
                      "description": "The rule (node_id).",
                      "type": "string"
                    }
                  },
                  "required": ["node_id"],
                  "type": "object"
                },
                "type": "array"
              },
              "api_key": {
                "description": "Optional. Your Bidda subscription key. Prefer sending it as the x-bidda-api-key header (or Authorization: Bearer), which is what the auth settings in your MCP client configure; the header takes precedence over this argument. A free trial counts.",
                "type": "string"
              }
            },
            "required": ["anchors"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check cached rules for drift"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9c4c3a7e1c426fd441d3b91da9c5b54a4397c7d6675b719ec5ff14f3e306cdaf"
        },
        {
          "name": "gap_check",
          "description": "Given the compliance rules a team says it covers, return the prerequisite rules Bidda's dependency graph links to them that were NOT listed - the 'you missed the prerequisite obligation' gaps - plus any covered rule the registry marks withdrawn. A coverage aid for a qualified reviewer; it does not rank or determine compliance. Requires an active Bidda subscription: pass api_key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Optional. Your Bidda subscription key. Prefer sending it as the x-bidda-api-key header (or Authorization: Bearer), which is what the auth settings in your MCP client configure; the header takes precedence over this argument. A free trial counts.",
