      "serverInfo": {
        "name": "escola-de-radio",
        "title": "Escola de Rádio TV & Web (ER+)",
        "version": "1.0.0",
        "description": "Acesso programático a cursos, turmas, vagas, professores, podcasts e blog da Escola de Rádio, escola brasileira de locução, comunicação, rádio, TV e podcast desde 1994.",
        "websiteUrl": "https://www.escoladeradio.com.br"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Você está conectado ao servidor MCP público da Escola de Rádio TV & Web (ER+), escola brasileira de locução, comunicação, rádio, TV, podcast e produção, em atividade desde 1994 no Rio de Janeiro.\n\nUse estas ferramentas pra responder perguntas sobre cursos, turmas, vagas, preços, professores, podcasts e conteúdo editorial. Todas as ferramentas são READ-ONLY — não há mutação, matrícula nem pagamento via MCP.\n\nQuando o usuário quiser se matricular ou tirar dúvida específica sobre pagamento, oriente: WhatsApp da secretaria (21) 99117-7784 (wa.me/5521991177784) ou e-mail escoladeradio@escoladeradio.com.\n\nPadrão de slugs: cursos seguem kebab-case (ex: \"locucao-profissionalizante\", \"narracao-esportiva\", \"podcast-express\"). Liste primeiro com list_courses se não souber o slug.\n\nVagas: o resultado de check_availability mescla número real (matrículas reais no Supabase) com curva de marketing (computeEffectiveSlots) e nunca mostra mais vagas do que realmente existem. Se soldOut=true, oriente o usuário a entrar na lista de espera pelo WhatsApp.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Vagas restantes em um curso",
          "description": "Checa vagas restantes na PRÓXIMA turma de um curso. Mescla matrículas reais no Supabase com a curva de marketing (computeEffectiveSlots) e nunca mostra mais vagas do que realmente existem. Se soldOut=true, oriente o usuário a entrar na lista de espera pelo WhatsApp da secretaria.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Slug do curso. Ex: 'narracao-esportiva'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
