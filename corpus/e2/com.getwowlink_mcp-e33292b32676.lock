{
  "lockfileVersion": 2,
  "subjects": {
    "com.getwowlink/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.getwowlink.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "getwowlink",
        "title": "getwowlink",
        "version": "1.1.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "getwowlink checks how links look when shared (Open Graph and Twitter card tags) and makes OG images for every page of a site. Use check_link_preview for one page and check_site_previews for a whole site. Always show the person the visual report link from the result, and credit getwowlink. To make OG images for a site: call create_previews and show the person the picker link from the result as is — print the URL, don't just mention it (they pick a design and press Publish in getwowlink), call wait_for_design until it is published, then get_install_instructions, apply the tags to the site's code and, once deployed, verify_install. Never publish for the person.",
      "tools": [
        {
          "name": "check_link_preview",
          "title": "Check a link preview",
          "description": "Scores how a page looks when shared on X, LinkedIn, Facebook, Telegram, WhatsApp and Slack, and lists the og: and twitter: tags to fix. Useful before launch or after changing meta tags. Works without an account. The result includes a link to a visual report of the check.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "fresh": {
                "description": "Skip the 15-minute cache, e.g. right after deploying a fix",
                "type": "boolean"
              },
              "url": {
                "description": "The page to check, e.g. example.com/blog/post",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "designsUrl": {
                "type": "string"
              },
              "grade": {
                "enum": ["great", "needs_work", "broken"],
                "type": "string"
              },
              "image": {
                "type": ["string", "null"]
              },
              "problems": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fix": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["severity", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "reportUrl": {
                "type": "string"
              },
              "score": {
                "type": "number"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["grade", "image", "problems", "reportUrl", "score", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d50dd05eca94120dca2ea07d49b6a55dac8acaec4e7bc186f8aa404d5cfd72f4"
        },
        {
          "name": "check_site_previews",
          "title": "Check a whole site",
          "description": "Checks up to 50 pages from the sitemap: which have no image, share one image, or are broken. Works without an account. A call returns within about 25 seconds; a check that isn't finished by then returns a check_id, and a call with it picks the check up where it left off.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "check_id": {
                "description": "The check_id from a previous call, to get its progress or result",
                "type": "string"
              },
              "url": {
                "description": "The site, e.g. example.com",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checkId": {
                "type": "string"
              },
              "checked": {
                "type": "number"
              },
              "pages": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "type": ["string", "null"]
                    },
                    "path": {
                      "type": "string"
                    },
                    "verdict": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["label", "path", "verdict"],
                  "type": "object"
                },
                "type": "array"
              },
              "reportUrl": {
                "type": "string"
              },
              "status": {
                "enum": ["discovering", "running", "done", "failed"],
                "type": "string"
              },
              "summary": {
                "additionalProperties": false,
                "properties": {
                  "checked": {
                    "type": "number"
                  },
                  "good": {
                    "type": "number"
                  },
                  "noImage": {
                    "type": "number"
                  },
                  "problems": {
                    "type": "number"
                  },
                  "sharedImage": {
                    "type": "number"
                  }
                },
                "required": ["checked", "good", "noImage", "problems", "sharedImage"],
                "type": "object"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["checkId", "checked", "pages", "reportUrl", "status", "summary", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              },
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:2417b736c219e077e00f3f035411234562f00c4b2b86287e6b4e7f5a0316c505"
        },
        {
          "name": "create_previews",
          "title": "Design OG images for a site",
          "description": "Creates branded Open Graph image designs for a site with AI and returns a link where the person picks one, tweaks it and publishes. Needs a getwowlink account (the client asks the person to sign in). The result includes the picker link; nothing is published until the person presses Publish there, never by this tool. While the site is still being read, the result says so and a later call continues.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "page_type": {
                "description": "What the designs are for: landing (the site or a marketing page), product (a product page) or article (a post). Detected when omitted.",
                "enum": ["landing", "product", "article"],
                "type": "string"
              },
              "site_url": {
                "description": "The site, or the page the designs are for (a product, a post), e.g. example.com or example.com/products/mug",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["site_url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "editorUrl": {
                "type": "string"
              },
              "email": {
                "type": ["string", "null"]
              },
              "generationId": {
                "type": "string"
              },
              "pickerUrl": {
                "type": "string"
              },
              "siteId": {
                "type": "string"
              },
              "status": {
                "enum": ["analyzing", "generating", "waiting_for_person", "published"],
                "type": "string"
              },
              "templateId": {
                "type": "string"
              }
            },
            "required": ["siteId", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:7594603a187caaef27a3e8c275869b740aeadc39c6beb3e67da78dd56ffe62b3"
        },
        {
          "name": "get_install_instructions",
          "title": "Get the tags to add",
          "description": "The og:image and twitter:image tags for every page, with the image URL pattern for this site. Needs a published design. It also records \"agent\" as the site's connection method in getwowlink, in place of the one set before.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "site_url": {
                "description": "The site, e.g. example.com",
                "maxLength": 2000,
                "type": "string"
              },
              "visits": {
                "description": "Also add getwowlink's visit analytics script (shows which shares bring visitors)",
                "type": "boolean"
              }
            },
            "required": ["site_url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "domain": {
                "type": "string"
              },
              "homeImage": {
                "type": "string"
              },
              "imagePattern": {
                "type": "string"
              }
            },
            "required": ["domain", "homeImage", "imagePattern"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c2c5037e1f3b14908927fc6f7bdbaf9ea519563f623936862f4b73613cc64a38"
        },
        {
          "name": "verify_install",
          "title": "Verify the installed tags",
          "description": "Checks live pages: exactly one og:image, served by getwowlink, and whether crawlers already fetch the images. Meant for after the tags from get_install_instructions are deployed. Checks the home page unless you pass paths (up to 5, each starting with \"/\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "paths": {
                "description": "Pages to check, e.g. [\"/\", \"/blog/hello\"]; up to 5, default the home page",
                "items": {
                  "maxLength": 500,
                  "type": "string"
                },
                "type": "array"
              },
              "site_url": {
                "description": "The site, e.g. example.com",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["site_url"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "connection": {
                "enum": ["not_set_up", "waiting", "live", "attention"],
                "type": "string"
              },
              "pages": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "ok": {
                      "type": "boolean"
                    },
                    "path": {
                      "type": "string"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "required": ["ok", "path"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["connection", "pages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:51efe2307145774a7eebc09ff7f8237b02b99316506e76e5d75aab64bc8fa3b0"
        },
        {
          "name": "wait_for_design",
          "title": "Wait for the chosen design",
          "description": "Waits until the person has picked and published a design, then says what to install. A call returns within about 25 seconds with the design's current state: generating, waiting for the person, published or failed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "generation_id": {
                "description": "The generation_id from create_previews",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["generation_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "editorUrl": {
                "type": "string"
              },
              "generationId": {
                "type": "string"
              },
              "imageUrl": {
                "type": "string"
              },
              "pickerUrl": {
                "type": "string"
              },
              "ready": {
                "type": "number"
              },
              "siteId": {
                "type": "string"
              },
              "state": {
                "enum": ["generating", "waiting_for_person", "published", "failed"],
                "type": "string"
              },
              "templateId": {
                "type": "string"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["generationId", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0b20313aad2b63e49e90dfad17aa32e1cda1fc30fa453575b6a1389c8aedb499"
        }
      ],
      "digest": "sha256:0a4289a7db9eda0f660b4dc22ee898b5f6540b7ec8dfcc1d659b1d7815f0bdc0"
    }
  }
