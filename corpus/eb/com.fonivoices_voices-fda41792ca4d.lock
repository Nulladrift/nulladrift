{
  "lockfileVersion": 2,
  "subjects": {
    "com.fonivoices/voices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fonivoices.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Foní Voices",
        "version": "1.1.4"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_checkout",
          "title": "Create a Stripe checkout link",
          "description": "Creates a hosted Stripe Checkout Session (one-time payment) for self-serve items at the published prices on fonivoices.com/#pricing: recording_15m ($100/voice), session_90m ($600/voice), license ($6,000/voice), and expert_review ($12/sample per reviewer). Requires a work email; personal domains such as gmail.com are rejected. Returns a hosted Stripe Checkout URL. For labeled_audio and enterprise_custom, returns contact instructions instead of a checkout URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accents": {
                "description": "Regional accent or accents, for example Rioplatense or Mexican (CDMX)",
                "maxLength": 300,
                "type": "string"
              },
              "email": {
                "description": "Work email. Personal domains such as gmail.com are rejected.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "language": {
                "description": "Target language, for example Spanish",
                "maxLength": 120,
                "type": "string"
              },
              "notes": {
                "description": "Brief or order notes",
                "maxLength": 500,
                "type": "string"
              },
              "product": {
                "description": "Self-serve product: recording_15m ($100), session_90m ($600), license ($6,000), or expert_review ($12). labeled_audio and enterprise_custom are invoice or Slack Connect only.",
                "enum": ["recording_15m", "session_90m", "license", "expert_review", "labeled_audio", "enterprise_custom"],
                "type": "string"
              },
              "quantity": {
                "default": 1,
                "description": "Unit quantity from 1 to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["email", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a Stripe checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf71334b366f95a814b065fd2822cfd367d936c3191bb3c49cfb2a8f5ca45ec8"
        },
        {
          "name": "get_quote",
          "title": "Get published list prices",
          "description": "Returns the published list prices from fonivoices.com/#pricing. Self-serve items are recording_15m ($100/voice), session_90m ($600/voice), license ($6,000/voice), and expert_review ($12/sample per reviewer). Enterprise, volume, and labeled-audio work is priced by invoice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get published list prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5b0ad0b4af1c6685ed47df3f7c8c796302986e5153b44c0711fd8546adfcb5c"
        },
        {
          "name": "get_sample",
          "title": "Get a playable sample",
          "description": "Returns a playable HTTPS URL for a public Foní demo recording (MP3). An optional language, accent, or sample id selects a file. There are seven public demos. If nothing matches, the response lists the available sample ids.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "Sample id, for example spanish-spain-female",
                "maxLength": 80,
                "type": "string"
              },
              "language": {
                "description": "Language or accent to match, for example Spanish, British, or Mandarin",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a playable sample"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a58cca6bbc4f5340715db21349149b8dd73e1b18fe82386382d49f077284150b"
        },
        {
          "name": "list_accents",
          "title": "List regional accents",
          "description": "Returns the 29 regional accents in the Foní Voices catalog. An optional language or accent name filters the list. Only some accents have a public demo file.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "Optional language or accent name to filter, for example Spanish or Rioplatense",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List regional accents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09dc0dea2bcce5f244152080305ce1f48ee536a09f7d92e8f0776f31c88c871a"
        },
        {
          "name": "list_languages",
          "title": "List languages",
          "description": "Returns the Foní Voices language catalog: 25 catalog languages (5 with a published regional-accent inventory, 20 without) plus any languages that have a public demo only. An optional query filters results by name or region.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Optional filter by language or region name, for example Spanish, Arabic, or Europe",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List languages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75a1b1a32ad2db931b30dcb03ffaeee62466d819444d3fc2a3c48fb425312d24"
        },
        {
          "name": "order_status",
          "title": "Check checkout order status",
          "description": "Returns the payment_status and details of a Foní Voices Stripe Checkout Session identified by session_id, a Stripe id that starts with cs_. When payment_status is paid, sends a deduplicated email notification to hello@fonivoices.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "session_id": {
                "description": "Stripe Checkout Session ID starting with cs_, for example cs_live_...",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Check checkout order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dd5522b93f83eda8fb110ba2fb73573e2c774a79002b7325755e519a321e4d27"
        },
        {
          "name": "request_free_samples",
          "title": "Request free samples",
          "description": "Submits a request for free 2-minute voice samples. Requires a work email; personal domains such as gmail.com are rejected. Creates a lead for the Foní team and does not charge a card.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Company name",
                "maxLength": 160,
                "type": "string"
              },
              "email": {
                "description": "Work email. Personal domains such as gmail.com are rejected.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "Contact name",
                "maxLength": 120,
                "type": "string"
              },
              "need": {
                "description": "Languages, accents, gender, number of voices, and intended use",
                "maxLength": 2000,
                "type": "string"
              },
              "prefer_slack": {
                "description": "If true, Foní sends a Slack Connect invite to the work email",
                "type": "boolean"
              },
              "use_case": {
                "description": "One of train_tts, voice_agent, dataset, or other",
                "enum": ["train_tts", "voice_agent", "dataset", "other"],
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request free samples"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:93e1ef38deeeb9fb3746480e6e2e8add348207142ed7b9f6e9108d85a9b9956e"
        },
        {
          "name": "request_slack_channel",
          "title": "Request a Slack channel",
          "description": "Submits a request for a Slack Connect channel with the Foní team for enterprise, custom, labeled-audio, or volume work. Requires a work email; personal domains such as gmail.com are rejected. Creates a lead and does not charge a card.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company": {
                "description": "Company name",
                "maxLength": 160,
                "type": "string"
              },
              "email": {
                "description": "Work email. Personal domains such as gmail.com are rejected.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "name": {
                "description": "Contact name",
                "maxLength": 120,
                "type": "string"
              },
              "need": {
                "description": "Voices, accents, labeled audio hours, or volume needed",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a Slack channel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87e4cfb1f822cd41949d341ebb0e62e10c5376acf82a845cbc0b8cb6b56fce76"
        }
