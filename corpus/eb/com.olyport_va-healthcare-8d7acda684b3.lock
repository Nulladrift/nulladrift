      "tools": [
        {
          "name": "find_va_facilities",
          "description": "Find VA (Department of Veterans Affairs) facilities by location.\n\n    Search for VA medical centers, clinics, benefits offices, cemeteries,\n    and vet centers. At least one location parameter should be provided.\n\n    Args:\n        state: Two-letter state abbreviation (e.g., \"CA\", \"TX\").\n        city: City name to search in.\n        zip_code: 5-digit ZIP code to search near.\n        facility_type: Type of facility — \"health\" (medical centers/clinics),\n            \"benefits\" (regional benefits offices), \"cemetery\" (national\n            cemeteries), or \"vet_center\" (readjustment counseling). Default \"health\".\n        limit: Maximum number of results (default 25, max 200).\n    ",
          "inputSchema": {
            "properties": {
              "city": {
                "default": null,
                "title": "City",
                "type": "string"
              },
              "facility_type": {
                "default": "health",
                "title": "Facility Type",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "zip_code": {
                "default": null,
                "title": "Zip Code",
                "type": "string"
              }
            },
            "title": "find_va_facilitiesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "find_va_facilitiesOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:12f96cc830e1b2b4cba68e9d0fbf004ad3005c824a5f705e581c06e9dccf701c"
        },
        {
          "name": "get_facility_detail",
          "description": "Get detailed information for a specific VA facility.\n\n    Returns comprehensive facility data including address, contact info,\n    operating hours, services offered, patient wait times, and patient\n    satisfaction scores.\n\n    Args:\n        facility_id: The VA facility ID (e.g., \"vha_648\", \"vba_310\",\n            \"nca_907\"). Obtain from find_va_facilities results.\n    ",
          "inputSchema": {
            "properties": {
              "facility_id": {
                "title": "Facility Id",
                "type": "string"
              }
            },
            "required": ["facility_id"],
            "title": "get_facility_detailArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_facility_detailOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:708f33be8c7812111acf3e56059366d19e3e2b580098dd791267a379a52d25d9"
        },
        {
          "name": "get_facility_services",
          "description": "Get the list of services offered at a specific VA facility.\n\n    Returns all healthcare and administrative services available at the\n    facility, including specialty care, mental health, dental, pharmacy,\n    and other clinical services.\n\n    Args:\n        facility_id: The VA facility ID (e.g., \"vha_648\"). Obtain from\n            find_va_facilities results.\n    ",
          "inputSchema": {
            "properties": {
              "facility_id": {
                "title": "Facility Id",
