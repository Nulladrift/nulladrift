      "instructions": "Shreddy: a camera app that auto-clips riders and measures jump height, speed, and lap times.\nA phone propped at a jump at a mountain bike park records every rider who comes through; the numbers\nare real-world measurements from a camera calibrated for that location (a known length marked in\nthe frame), not estimates.\n\nUnits are already human: metres (m) and seconds (s) to 2 decimals, speed in km/h and mph to 1 decimal.\nNever convert them again. Jump height is how high the bike rose above the takeoff lip. Speed is measured\nthrough a speed trap on the feature. A lap time is the seconds between one rider's passes of the same\ntiming line (`lap_time_s`; `timing` on get_clip has each lap, the change against the rider's best\nearlier lap, and splits between lines). Also measured: airtime (seconds in the air).\n\nA lap needs a timing line in the camera setup and a known rider crossing it twice, so most clips have\nnone (`lap_time_s` null): say there is no lap time, never estimate one. Laps cannot be ranked yet:\nsearch_clips returns each clip's lap time but sorts by jump height, airtime or speed.\n\nA clip with no measurements is normal: the camera had no calibration when it was videoed. It still\nplays and still counts; say it was not measured rather than treating it as an error.\n\nOnly public clips are visible. Riders are named only when they linked their Shreddy account and allow\nit; otherwise the rider is unnamed. Every clip says when it was recorded (`date`, `recorded_at`, and\n`recorded_at_local`: the clock time at the venue with its zone, e.g. \"2:14:07 pm PDT\"), and each timing\nline crossing says when the rider crossed (`crossed_at`, `crossed_at_local`). Quote the local time as given.\n\nAlways give the viewer the clip or venue `link` (https://www.shreddy.ai/...), which plays the clip on\nShreddy. Venue, run and feature names are matched loosely (\"bradley\" finds Bradley Bike Park); when a\ntool answers \"ambiguous\" or \"no_match\", pick from its `candidates` or ask the user.\n\nStart with list_venues to see which parks have clips, get_venue for one park (its runs, features and\nrecords), search_clips for latest, biggest, fastest or by feature or rider, and get_clip for one clip.",
