        {
          "name": "search_clips",
          "title": "Search clips",
          "description": "Search public clips. Newest first by default; sort \"biggest\" or \"smallest\" with a `metric` for the biggest jumps, most airtime or fastest runs (ranked results list each rider of a group clip on their own, and leave out rides with no value for that metric). Filter by `venue`, `feature` (a feature or a run at the venue, e.g. \"double black\" or \"jump 2\"), `rider`, and time (`when`, or `since`/`until`). A newest search includes clips with no measurements (normal: no calibration). Every clip has a link to give the viewer and its lap time (`lap_time_s`) when it has one; laps are not a ranking metric yet. Pass `next_cursor` back as `cursor`, with the same other arguments, for the next page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The next_cursor from the previous page of the same search.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "feature": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 2147483647,
                    "type": "integer"
                  }
                ],
                "description": "A feature or a run at the venue, by name (\"jump 2\", \"double black\") or id. Works without a venue too."
              },
              "limit": {
                "description": "How many clips (1 to 25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "description": "What to rank by: jump_height (default when ranked), speed, or airtime. Lap times are returned on each clip but cannot be ranked.",
                "enum": ["jump_height", "speed", "airtime"],
                "type": "string"
              },
              "rider": {
                "description": "A rider's name. Only riders who linked their account and allow it can be found.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "since": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  }
                ],
                "description": "Only clips videoed at or after this ISO date (2026-09-01) or datetime."
              },
              "sort": {
                "description": "newest (default), or biggest / smallest by `metric`. Giving a metric without a sort means biggest.",
                "enum": ["newest", "biggest", "smallest"],
                "type": "string"
              },
              "until": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$",
                    "type": "string"
                  }
                ],
                "description": "Only clips videoed at or before this ISO date (the whole day counts) or datetime."
              },
              "venue": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 2147483647,
                    "type": "integer"
                  }
                ],
                "description": "A bike park name (\"bradley\", \"Snow Summit\") or its id."
              },
              "when": {
                "description": "today = the last 24 hours, week = the last 7 days, month = the last 30 days, all (default). since/until override it.",
                "enum": ["today", "week", "month", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "candidates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "anyOf": [
                        {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "kind": {
                      "enum": ["venue", "run", "feature", "rider"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "venue": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "kind", "name", "venue"],
                  "type": "object"
                },
                "type": "array"
              },
              "clips": {
                "items": {
                  "additionalProperties": false,
