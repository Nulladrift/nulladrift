        {
          "name": "list_venues",
          "title": "List bike parks",
          "description": "List the bike parks (venues) that have public Shreddy clips: name, city, state, how many clips and how many measured rides, the runs and features there, and a link. Filter by `query` (matches name, city or state) or sort nearest first with `near` (coordinates; for a place name like \"San Diego\", pass its approximate latitude and longitude). Distances come in km and miles. Use it for \"what parks do you have\" and to learn valid venue names.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many venues to return (1 to 25, default 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "additionalProperties": false,
                "description": "Sort by distance from this point (decimal degrees). For a city, pass its approximate coordinates.",
                "properties": {
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "long": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  }
                },
                "required": ["lat", "long"],
                "type": "object"
              },
              "query": {
                "description": "Free text matched against venue name, city and state, e.g. \"bradley\" or \"CA\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "venues": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "type": ["string", "null"]
                    },
                    "clip_count": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "distance_km": {
                      "type": ["number", "null"]
                    },
                    "distance_mi": {
                      "type": ["number", "null"]
                    },
                    "features": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "link": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "measured_count": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "name": {
                      "type": "string"
                    },
                    "runs": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "state": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["city", "clip_count", "distance_km", "distance_mi", "features", "id", "link", "measured_count", "name", "runs", "state"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["message", "venues"],
            "type": "object"
          },
