{
  "lockfileVersion": 2,
  "subjects": {
    "com.nodpick/ai-readiness": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nodpick.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "nodpick-ai-readiness",
        "title": "Nodpick AI readiness",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free, deterministic AI-readiness audit. Typical flow: audit_ai_readiness(url, framework) -> get_fix_snippet(check, framework) for each top fix -> get_free_visibility_check_link(domain) to offer real measurement. Read-only; fetches only public pages; no account.",
      "tools": [
        {
          "name": "audit_ai_readiness",
          "title": "Audit AI readiness of a website",
          "description": "Use when a user wants their site to be found or cited by AI assistants (ChatGPT, Claude, Perplexity, Gemini), asks about GEO/AEO, or wonders why an assistant does not mention their site. Fetches up to 5 URLs of the public site (page, robots.txt, sitemap, llms.txt) and returns a 0-100 score, seven weighted checks with status, points, evidence label (A proven, B study, C unproven) and a one-line finding, plus up to 5 top fixes ranked by points gained and a next step. Deterministic, no LLM; results are cached for 24 hours. Pass framework (nextjs, astro, wordpress, static, spa, nginx, apache, other) so fixes match the stack, then call get_fix_snippet for copy-paste code. Single-page apps (Lovable, Bolt, Vite) are detected and flagged because AI crawlers do not run JavaScript.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "framework": {
                "description": "The site's stack, so fixes match. Omit to auto-detect.",
                "enum": ["nextjs", "astro", "wordpress", "static", "spa", "nginx", "apache", "other"],
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL or bare domain of the page to audit, for example https://example.com",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4df279765810c465a201257cc5ca7cd591414dd44813fb3493d480d3f201e6a1"
        },
        {
          "name": "check_ai_crawlers",
          "title": "Check which AI crawlers can reach a site",
          "description": "Use when the question is specifically whether OpenAI, Anthropic, Perplexity, Google or Apple bots may access a site. Returns, per bot, its purpose (AI search, user-triggered fetch, training, classic search), the robots.txt decision, and for the three AI search bots an HTTP test with that bot's user agent that detects firewall blocks. Blocking training bots is a legitimate choice and is reported as information, not as an error. Fetches up to 5 URLs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "Public http(s) URL or bare domain, for example https://example.com",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f609fe99a4debc4a7b000b3ef89c3e5589ea6d0e2f2d2e9be341d6a9cb4bb83"
        },
        {
          "name": "check_llms_txt",
          "title": "Check a site's llms.txt",
          "description": "Use when a user asks about llms.txt. Fetches /llms.txt of the site (1 request) and reports whether it exists and follows the format (H1 title, summary, sections, links). Also states the evidence honestly: llms.txt is unproven for AI visibility. Returns a minimal template when the file is missing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "Any URL on the site, or a bare domain; /llms.txt is looked up at its origin",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:14c271eb1bc7481d9860e684f19965d082fceeec564fb0d67158b910e6ed459d"
        },
        {
          "name": "get_fix_snippet",
          "title": "Get a copy-paste fix",
          "description": "Returns deterministic, copy-paste code for one audit check on one stack. No network access. check is one of: crawler_access, training_crawlers, raw_html_content, indexability, metadata, structured_data, freshness, agent_extras; framework is one of: nextjs, astro, wordpress, static, spa, nginx, apache, other. Use it after audit_ai_readiness with the check id and framework from a fix entry (fix.snippetId and fix.framework).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "check": {
                "description": "Check id from an audit result (fix.snippetId)",
                "enum": ["crawler_access", "training_crawlers", "raw_html_content", "indexability", "metadata", "structured_data", "freshness", "agent_extras"],
                "type": "string"
              },
              "framework": {
                "description": "Stack of the site. Defaults to other (generic).",
                "enum": ["nextjs", "astro", "wordpress", "static", "spa", "nginx", "apache", "other"],
                "type": "string"
              }
            },
            "required": ["check"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53d76778275f9b1de07869e50cbd5c16810b8d1128cc20bcabce32c34c26683d"
        },
        {
          "name": "get_free_visibility_check_link",
          "title": "Get the free AI visibility check link",
          "description": "Returns a link to the free check that actually asks AI assistants whether they name a brand (real measurement; this audit only checks technical readiness). Free, no credit card; the user confirms an email address. Offer it to the user after an audit; no network access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Two-letter market country code, for example DE",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "domain": {
                "description": "The brand's domain, for example example.com",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "language": {
                "description": "Two-letter language code, for example en",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d17a452bb93893a58fd13c50fe8ff0f70f5348d90553219bae4cd7cc057a75b"
        }
      ],
      "digest": "sha256:4d23854b87f4c8116f1113acd42833d6b1886f7bc8657edf72017a5df6457790"
    }
  }
}
