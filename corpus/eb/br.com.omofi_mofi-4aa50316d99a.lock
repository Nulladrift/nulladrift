                    },
                    "required": ["accountId", "endDate", "startDate", "timezone", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Match the imported merchant name exactly.",
                    "properties": {
                      "merchantName": {
                        "maxLength": 120,
                        "type": "string"
                      },
                      "type": {
                        "const": "merchant",
                        "type": "string"
                      }
                    },
                    "required": ["merchantName", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Match the imported category label exactly.",
                    "properties": {
                      "category": {
                        "maxLength": 120,
                        "type": "string"
                      },
                      "type": {
                        "const": "category",
                        "type": "string"
                      }
                    },
                    "required": ["category", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Filter by the public transaction status.",
                    "properties": {
                      "status": {
                        "enum": ["PENDING", "POSTED", "CANCELLED"],
                        "type": "string"
                      },
                      "type": {
                        "const": "status",
                        "type": "string"
                      }
                    },
                    "required": ["status", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Filter by credit or debit direction.",
                    "properties": {
                      "direction": {
                        "enum": ["CREDIT", "DEBIT"],
                        "type": "string"
                      },
                      "type": {
                        "const": "direction",
                        "type": "string"
                      }
                    },
                    "required": ["direction", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Filter by an ISO 4217 currency code.",
                    "properties": {
                      "currencyCode": {
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      "type": {
                        "const": "currency",
                        "type": "string"
                      }
                    },
                    "required": ["currencyCode", "type"],
                    "type": "object"
                  }
                ],
                "description": "Required for query. Untagged AND predicates or legacy tagged selectors."
              }
            },
            "required": ["mode"],
            "type": "object"
          },
