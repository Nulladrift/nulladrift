        {
          "name": "mofi_transactions_get",
          "title": "Get transactions",
          "description": "Find an owned transaction by transactionId, list all, or AND untagged where predicates. Legacy id lookups and tagged selectors remain accepted; continue legacy cursors with the same selector. Search matches description or merchant substrings. Periods require startDate, endDate and timezone. Pages contain 1-1000 rows (default 500); totalCount counts all matches. Money uses { amount, currency }: exact decimal magnitude plus CREDIT/DEBIT direction. operationType is raw; category carries provider and normalized values. Unknown/generic PURCHASE codes add no classification; known category labels can. Conflicting signals have no economic type; mixed vehicle tax/fee labels are not guessed. statementId links are included. Mofi stores POSTED when status is missing. For the same user, connection, and account, reimports with the same provider ID update the existing row; no prior versions are retained. Distinct IDs are not linked or deduplicated as pending-to-posted transitions. Pass page.nextCursor unchanged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Legacy alias for transactionId.",
                "format": "uuid",
                "type": "string"
              },
              "mode": {
                "description": "findOne requires transactionId (legacy id accepted instead); query requires where; findAll accepts page.",
                "enum": ["findOne", "findAll", "query"],
                "type": "string"
              },
              "page": {
                "description": "Keyset page.",
                "properties": {
                  "cursor": {
                    "anyOf": [
                      {
                        "maxLength": 2048,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "page.nextCursor from the previous result, unchanged."
                  },
                  "limit": {
                    "default": 500,
                    "description": "Rows per page, 1 to 1000.",
                    "maximum": 1000,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "transactionId": {
                "description": "findOne UUID; replaces legacy id.",
                "format": "uuid",
                "type": "string"
              },
              "where": {
                "anyOf": [
                  {
                    "properties": {
                      "accountId": {
                        "format": "uuid",
                        "type": "string"
                      },
                      "category": {
                        "description": "Imported provider category label, exact match.",
                        "maxLength": 120,
                        "type": "string"
                      },
                      "connectionId": {
                        "format": "uuid",
                        "type": "string"
                      },
                      "currencyCode": {
                        "pattern": "^[A-Z]{3}$",
                        "type": "string"
                      },
                      "direction": {
                        "enum": ["CREDIT", "DEBIT"],
                        "type": "string"
                      },
                      "endDate": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "merchantName": {
                        "maxLength": 120,
                        "type": "string"
                      },
                      "normalizedCode": {
                        "description": "Normalized category code from mofi_classifications_get. For spending-summary override:<code> keys use normalizedCode; for value:<label> use category.",
                        "enum": ["accommodation", "bank_fee", "card_payment", "card_purchase", "digital_services", "expense", "fine", "food_delivery", "fuel", "groceries", "investment", "refund", "tax", "transfer", "travel", "uncategorized"],
                        "type": "string"
                      },
                      "search": {
                        "description": "Case-insensitive substring of the description or merchant name.",
                        "maxLength": 80,
                        "minLength": 2,
                        "type": "string"
                      },
                      "startDate": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "statementId": {
                        "format": "uuid",
                        "type": "string"
                      },
                      "status": {
                        "enum": ["PENDING", "POSTED", "CANCELLED"],
                        "type": "string"
                      },
                      "timezone": {
                        "description": "IANA timezone used as reporting context for the supplied offset timestamps",
                        "maxLength": 100,
                        "type": "string"
                      },
                      "type": {
                        "const": "filters",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "description": "Filter transactions by accountId.",
                    "properties": {
                      "accountId": {
                        "format": "uuid",
                        "type": "string"
                      },
                      "type": {
                        "const": "account",
                        "type": "string"
                      }
                    },
                    "required": ["accountId", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Filter transactions by connectionId.",
                    "properties": {
                      "connectionId": {
                        "format": "uuid",
                        "type": "string"
                      },
                      "type": {
                        "const": "connection",
                        "type": "string"
                      }
                    },
                    "required": ["connectionId", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Filter transactions linked to statementId.",
                    "properties": {
                      "statementId": {
                        "format": "uuid",
                        "type": "string"
                      },
                      "type": {
                        "const": "statement",
                        "type": "string"
                      }
                    },
                    "required": ["statementId", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Filter by an inclusive timestamp range.",
                    "properties": {
                      "endDate": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "startDate": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "timezone": {
                        "description": "IANA timezone used as reporting context for the supplied offset timestamps",
                        "maxLength": 100,
                        "type": "string"
                      },
                      "type": {
                        "const": "period",
                        "type": "string"
                      }
                    },
                    "required": ["endDate", "startDate", "timezone", "type"],
                    "type": "object"
                  },
                  {
                    "description": "Filter one account by an inclusive range.",
                    "properties": {
                      "accountId": {
                        "format": "uuid",
                        "type": "string"
                      },
                      "endDate": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "startDate": {
                        "format": "date-time",
                        "type": "string"
                      },
                      "timezone": {
