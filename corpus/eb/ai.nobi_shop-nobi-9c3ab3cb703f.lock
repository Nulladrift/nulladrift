        {
          "name": "find_shop_nobi_page",
          "title": "Find a Shop Nobi page",
          "description": "Finds a Shop Nobi web page about a product topic, such as \"leather boots\" or \"linen dresses\", to link to. It does not search products, so it is not the tool for a shopper's request to find or compare products. Each page lists matching products from many stores with a short buying guide. Returns the page's title, description and link only when its topic has the same words, allowing changes in word order, accents and singular or plural forms. Says when no matching page exists. It never substitutes a broader page. exactMatch is true for every returned page. For follow-up calls in this conversation, send the visitorId returned by a previous result unchanged. Omit it on the first call; do not invent one.",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "The product topic, in a few plain words, such as \"leather boots\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "visitorId": {
                "description": "For follow-up calls in this conversation, send the visitorId returned by a previous result unchanged. Omit it on the first call; do not invent one.",
                "format": "uuid",
                "maxLength": 36,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "found": {
                "type": "boolean"
              },
              "page": {
                "properties": {
                  "description": {
                    "type": ["string", "null"]
                  },
                  "exactMatch": {
                    "type": "boolean"
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["description", "exactMatch", "title", "url"],
                "type": ["object", "null"]
              },
              "visitorId": {
                "description": "For follow-up calls in this conversation, send the visitorId returned by a previous result unchanged. Omit it on the first call; do not invent one.",
                "format": "uuid",
                "maxLength": 36,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["found", "page"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a Shop Nobi page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
