        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Shop Nobi searches the product catalogs of about 1,100 online stores: about 2.4 million products in all.\nsearch_products returns catalog products with variant and parent IDs, store, price, currency, stock status, image and store link.\nPeople buy from the store. Links that may earn Shop Nobi a commission are labeled.\nget_product_details reads product descriptions, images, specifications and variant choices by Nobi ID, merchant-scoped source ID or SKU, or exact catalog URL.\nShopify product and variant IDs require the selling merchant: send storeDomain, such as example.com, or a known Nobi merchantId. Source IDs and SKUs are merchant-scoped; id, productId and variantId are Nobi IDs.\ncompare_products, check_price_and_availability and find_alternatives accept the variant IDs returned by search. Catalogs contain no reviews or ratings.\nfind_shop_nobi_page finds a Shop Nobi page about a product topic.",
