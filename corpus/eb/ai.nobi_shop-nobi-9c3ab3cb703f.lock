        {
          "name": "find_alternatives",
          "title": "Find alternatives to a product",
          "description": "Finds products like one found in a product search, from across the stores, leaving out that same product. It takes the product's id from a product search result, and an optional price ceiling. It returns products the same way a product search does, each with its price, whether it is in stock, an image and a link, and it collapses the same product sold by more than one store to one. For follow-up calls in this conversation, send the visitorId returned by a previous result unchanged. Omit it on the first call; do not invent one.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The Nobi variant id from a search result; the same identity is named variantId.",
                "maxLength": 22,
                "minLength": 22,
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many alternatives to return, from 1 to 10. The default is 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "description": "The most an alternative may cost, in the product's currency. Leave it out for no price limit.",
                "minimum": 0,
                "type": "number"
              },
              "visitorId": {
                "description": "For follow-up calls in this conversation, send the visitorId returned by a previous result unchanged. Omit it on the first call; do not invent one.",
                "format": "uuid",
                "maxLength": 36,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "products": {
                "items": {
                  "properties": {
                    "currency": {
                      "type": "string"
                    },
                    "id": {
                      "description": "Legacy alias for the selected Nobi variantId; null for parent details. productId identifies the parent.",
