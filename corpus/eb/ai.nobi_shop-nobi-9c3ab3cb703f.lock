        {
          "name": "compare_products",
          "title": "Compare products side by side",
          "description": "Compares two or more products found in a product search, side by side, taking their ids from the search results. It returns the attributes the products share, such as price, brand, color and material, with each product's value, so a shopper can tell them apart. It lines up only the attributes at least one product gives, so products with few details still compare cleanly. For follow-up calls in this conversation, send the visitorId returned by a previous result unchanged. Omit it on the first call; do not invent one.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Nobi variant ids, each from a product search result.",
                "items": {
                  "description": "Nobi variant ids, each from a product search result.",
                  "maxLength": 22,
                  "minLength": 22,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "visitorId": {
                "description": "For follow-up calls in this conversation, send the visitorId returned by a previous result unchanged. Omit it on the first call; do not invent one.",
                "format": "uuid",
                "maxLength": 36,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "comparison": {
                "properties": {
                  "attributes": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
