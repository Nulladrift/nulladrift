        },
        {
          "name": "extract_design_md",
          "title": "Extract a DESIGN.md file from a public webpage",
          "description": "Writes a starter DESIGN.md file from the CSS of one public webpage. Best for: a user who gives a website address and wants its colors, fonts, spacing, corner radii and component styles as a DESIGN.md file. Returns: markdown (the DESIGN.md text in the open Google format, YAML tokens then the 8 standard sections), the lint verdict of @google/design.md 0.4.0 on that text, the token counts and the number of stylesheets read. Pass url, such as \"https://stripe.com\"; a bare host such as \"stripe.com\" means https. Do not use for: pages behind a login, private or local addresses (localhost, 192.168.x.x), pages that robots.txt disallows, or a DESIGN.md file the user already has (use lint_design_md). Errors: blocked_url, invalid_url, robots_disallowed, fetch_failed and http_error each say what to send next.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "url": "https://linear.app/"
              }
            ],
            "properties": {
              "include_raw_css": {
                "default": false,
                "description": "When true, adds the concatenated CSS that was read to rawCss. The response gets large, so leave it off unless the user asks for the CSS. Default false.",
                "type": "boolean"
              },
              "max_stylesheets": {
                "default": 5,
                "description": "How many linked stylesheets to fetch and parse, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "url": {
                "description": "Address of one public webpage, such as \"https://stripe.com\". A bare host such as \"stripe.com\" means https. Only public http and https pages work: no login pages, localhost or private addresses.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "document": {
                "description": "The extracted tokens, layout regions and rules before they are written as markdown",
                "properties": {
                  "colors": {
                    "description": "Color roles such as primary and surface, each with value (hex) and an optional description",
                    "type": "object"
                  },
                  "components": {
                    "description": "Component styles by name, each with an optional selector and a styles map of CSS property to value",
                    "type": "object"
                  },
                  "elevation": {
                    "description": "Box shadows none, sm, md and lg as CSS values",
                    "type": "object"
                  },
                  "meta": {
                    "description": "name, version, description, sourceUrl and extractedAt (ISO 8601) of the extracted file",
                    "type": "object"
                  },
                  "radius": {
                    "description": "Corner radii none, sm, md, lg and full as CSS lengths; written as the rounded tokens",
                    "type": "object"
                  },
                  "regions": {
                    "description": "Layout regions by id, each with purpose, selector and rule",
                    "type": "object"
                  },
                  "rules": {
                    "description": "Usage rules, each with id, summary and detail",
                    "items": {
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "spacing": {
                    "description": "baseUnit (such as 4px) and scale (spacing steps as CSS lengths)",
                    "type": "object"
                  },
                  "typography": {
                    "description": "families (font family names by role) and scale (type styles with fontFamily, fontSize, lineHeight, fontWeight)",
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "lint": {
                "description": "The official @google/design.md linter's verdict on markdown",
                "properties": {
                  "counts": {
                    "properties": {
                      "errors": {
                        "type": "number"
                      },
                      "infos": {
                        "type": "number"
                      },
                      "warnings": {
                        "type": "number"
                      }
                    },
                    "required": ["errors", "infos", "warnings"],
                    "type": "object"
                  },
                  "findings": {
                    "items": {
                      "properties": {
                        "message": {
                          "type": "string"
                        },
                        "path": {
                          "description": "Token path the finding is about, such as colors.primary",
                          "type": "string"
                        },
                        "rule": {
                          "description": "Rule name of the official linter, such as broken-ref or contrast-ratio",
                          "type": "string"
                        },
                        "severity": {
                          "enum": ["error", "warning", "info"],
                          "type": "string"
                        }
                      },
                      "required": ["message", "severity"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "summary": {
                    "type": "string"
                  },
                  "valid": {
                    "type": "boolean"
                  }
                },
                "required": ["counts", "findings", "summary", "valid"],
                "type": "object"
              },
              "markdown": {
                "description": "DESIGN.md in the open format (YAML tokens, then the 8 sections), ready to save",
                "type": "string"
              },
              "metadata": {
                "properties": {
                  "description": {
                    "type": "string"
                  },
                  "stylesheetsAnalyzed": {
                    "type": "number"
                  },
                  "title": {
                    "type": "string"
                  },
                  "tokenCounts": {
                    "description": "How many tokens of each kind were found on the page",
                    "properties": {
                      "colors": {
                        "type": "number"
                      },
                      "components": {
                        "type": "number"
                      },
                      "fontFamilies": {
                        "type": "number"
                      },
                      "fontSizes": {
                        "type": "number"
                      },
                      "radii": {
                        "type": "number"
                      },
                      "spacingSteps": {
                        "type": "number"
                      }
                    },
                    "type": "object"
                  },
                  "totalBytesParsed": {
                    "type": "number"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["stylesheetsAnalyzed", "title", "tokenCounts", "totalBytesParsed", "url"],
                "type": "object"
              },
              "rawCss": {
                "description": "The concatenated CSS that was read; present only when include_raw_css is true",
                "type": "string"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              }
            },
            "required": ["as_of", "document", "lint", "markdown", "metadata", "source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "DESIGN.md extracted",
            "openai/toolInvocation/invoking": "Reading the page CSS..."
          },
          "digest": "sha256:747f914cc168d384ac0c598703354a1cdd09e2171230578a8f122ed8e1b6139c"
        },
        {
