        {
          "name": "lint_design_md",
          "title": "Lint a DESIGN.md file with the official linter",
          "description": "Lints one DESIGN.md file with the official @google/design.md 0.4.0 linter, the same check as `npx @google/design.md lint DESIGN.md`. Best for: checking a DESIGN.md file the user pasted before it goes to a coding agent. Pass the whole file contents in text, including the YAML front matter between the --- lines; a file path or URL will not work, so ask the user to paste the file. Returns: each finding with its severity, rule and token path (broken token references, low text contrast, missing primary color, unused colors, section order, unknown keys), the error, warning and note counts, the sections found and the token counts. The file is valid when it has no errors. Front matter that is not valid YAML comes back as a finding, not an error. Do not use for: comparing two versions (use diff_design_md) or reading a website (use extract_design_md).",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "text": "---\nname: Probe\ncolors:\n  primary: \"#1a73e8\"\n---\n"
              }
            ],
            "properties": {
              "text": {
                "description": "The whole DESIGN.md file contents, up to 60000 characters: the YAML front matter between --- lines, then the ## sections. Not a file path or URL. Example: \"---\nname: Paper\ncolors:\n  primary: \"#1D1D1B\"\n---\n## Overview\n...\"",
                "maxLength": 60000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "counts": {
                "properties": {
                  "errors": {
                    "type": "number"
                  },
                  "infos": {
                    "type": "number"
                  },
                  "warnings": {
                    "type": "number"
                  }
                },
                "required": ["errors", "infos", "warnings"],
                "type": "object"
              },
              "findings": {
                "items": {
                  "properties": {
                    "message": {
                      "type": "string"
                    },
                    "path": {
                      "description": "Token path the finding is about, such as colors.primary",
                      "type": "string"
                    },
                    "rule": {
                      "description": "Rule name of the official linter, such as broken-ref or contrast-ratio",
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["error", "warning", "info"],
                      "type": "string"
                    }
                  },
                  "required": ["message", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "linter": {
                "properties": {
                  "package": {
                    "type": "string"
                  },
                  "spec": {
                    "type": "string"
                  },
                  "version": {
                    "type": "string"
                  }
                },
                "required": ["package", "spec", "version"],
                "type": "object"
              },
              "sections": {
                "description": "The ## section headings found, in order",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              },
              "tokenCounts": {
                "properties": {
                  "colors": {
                    "type": "number"
                  },
                  "components": {
                    "type": "number"
                  },
                  "rounded": {
                    "type": "number"
                  },
                  "spacing": {
                    "type": "number"
                  },
                  "typography": {
                    "type": "number"
                  }
                },
                "required": ["colors", "components", "rounded", "spacing", "typography"],
                "type": "object"
              },
