                          "type": "string"
                        },
                        "type": "array"
                      },
                      "removed": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["added", "modified", "removed"],
                    "type": "object"
                  },
                  "components": {
