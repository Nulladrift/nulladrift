      "serverInfo": {
        "name": "design-md",
        "title": "DESIGN.md Linter & Extractor: Lint, diff, extract DESIGN.md",
        "version": "1.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
