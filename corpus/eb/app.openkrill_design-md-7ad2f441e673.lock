      "instructions": "DESIGN.md Linter & Extractor: Lint, diff, extract DESIGN.md. Use lint_design_md to check a DESIGN.md file against the official @google/design.md linter; report the errors first, then the warnings, and quote the token path of each. Use diff_design_md to compare an old and a new DESIGN.md file; say whether the change is breaking or a lint regression, then list the token changes. Use extract_design_md to write a starter DESIGN.md from a public webpage; tell the user that the type size ramp is a default and that values marked default were not found on the page. Only public HTTP and HTTPS pages can be extracted: private addresses, local hostnames and localhost are blocked, and pages that robots.txt disallows are not fetched. lint_design_md and diff_design_md need the pasted file text, not a path or URL; if the user has not pasted it, ask for it before you call. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "diff_design_md",
          "title": "Diff two DESIGN.md files for token changes and lint regressions",
          "description": "Compares two versions of a DESIGN.md file the way `npx @google/design.md diff` does. Best for: deciding whether a DESIGN.md change is breaking before it is merged. Pass the whole old file in base_text and the whole new file in target_text, each including the YAML front matter; a file path or URL will not work. Returns: every added, removed and modified token in colors, typography, rounded, spacing and components with its old and new value, breaking (true when a token was removed), regression (true when the new file has more lint errors or warnings), the lint counts before and after, and a markdown summary. Do not use for: checking a single file (use lint_design_md) or comparing two websites (run extract_design_md on each first).",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "base_text": "---\nname: Demo\ncolors:\n  primary: \"#1A1C1E\"\n  surface: \"#FFFFFF\"\n  secondary: \"#5C5C57\"\n---\n",
                "target_text": "---\nname: Demo\ncolors:\n  primary: \"#0B5CAD\"\n  surface: \"#FFFFFF\"\n---\n"
              }
            ],
            "properties": {
              "base_text": {
                "description": "The whole old (current) DESIGN.md file contents, including the YAML front matter between --- lines. Not a file path or URL. Example: \"---\nname: Paper\ncolors:\n  primary: \"#1D1D1B\"\n---\". Both files together must stay under 64 KB.",
                "maxLength": 60000,
                "minLength": 1,
                "type": "string"
              },
              "target_text": {
                "description": "The whole new (proposed) DESIGN.md file contents, including the YAML front matter, to compare against base_text. Not a file path or URL. Example: \"---\nname: Paper\ncolors:\n  primary: \"#0B5CAD\"\n---\".",
                "maxLength": 60000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["base_text", "target_text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "breaking": {
                "description": "True when a token was removed, so references to it stop resolving",
                "type": "boolean"
              },
              "changes": {
                "items": {
                  "properties": {
                    "from": {
                      "description": "Old value; absent for an added token. Colors are lowercase hex, dimensions are CSS lengths, typography is \"family size/lineHeight weight\", and a component is \"property: value\" pairs joined by commas",
                      "type": "string"
                    },
                    "group": {
                      "enum": ["colors", "typography", "rounded", "spacing", "components"],
                      "type": "string"
                    },
                    "to": {
                      "description": "New value in the same format as from; absent for a removed token",
                      "type": "string"
                    },
                    "token": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["added", "removed", "modified"],
                      "type": "string"
                    }
                  },
                  "required": ["group", "token", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "changesCount": {
                "type": "number"
              },
              "findings": {
                "properties": {
                  "after": {
                    "properties": {
                      "errors": {
                        "type": "number"
                      },
                      "infos": {
                        "type": "number"
                      },
                      "warnings": {
                        "type": "number"
                      }
                    },
                    "required": ["errors", "infos", "warnings"],
                    "type": "object"
                  },
                  "before": {
                    "properties": {
                      "errors": {
                        "type": "number"
                      },
                      "infos": {
                        "type": "number"
                      },
                      "warnings": {
                        "type": "number"
                      }
                    },
                    "required": ["errors", "infos", "warnings"],
                    "type": "object"
                  },
                  "delta": {
                    "properties": {
                      "errors": {
                        "type": "number"
                      },
                      "warnings": {
                        "type": "number"
                      }
                    },
                    "required": ["errors", "warnings"],
                    "type": "object"
                  }
                },
                "required": ["after", "before", "delta"],
                "type": "object"
              },
              "markdownSummary": {
                "description": "The changes as a short markdown report",
                "type": "string"
              },
              "regression": {
                "description": "True when the target has more lint errors or warnings than the base",
                "type": "boolean"
              },
              "tokens": {
                "description": "Token names added, removed and modified per group, as `npx @google/design.md diff` reports them",
                "properties": {
                  "colors": {
                    "properties": {
                      "added": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "modified": {
