{
  "lockfileVersion": 2,
  "subjects": {
    "app.x-toolkit/x-toolkit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://x-toolkit.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "x-toolkit",
        "title": "x-toolkit",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Reads public X (Twitter) posts without an X account or API key. Pass post links (x.com/name/status/<id>). Only public posts work. Usage counts are public at https://x-toolkit.app/stats.",
      "tools": [
        {
          "name": "get_x_video_transcript",
          "title": "Get an X video transcript",
          "description": "Returns the transcript of the video in an X (Twitter) post: X's own captions when they exist, or a transcript x-toolkit made earlier. If there is none yet, it says so; call transcribe_x_video to make one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "md (default) has a header and timestamps per paragraph; txt is plain paragraphs; srt and vtt are subtitles.",
                "enum": ["md", "txt", "srt", "vtt"],
                "type": "string"
              },
              "url": {
                "description": "A post link like https://x.com/name/status/123…, or the numeric post ID.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b2251cb82f1d3c850c9ca78aef99f2e677e0670401907b0a45c4d632c1d6247a"
        },
        {
          "name": "read_x_article",
          "title": "Read an X Article",
          "description": "Returns an X (Twitter) Article as Markdown with images in place. X only shows Articles to signed-in readers, so fetching the link directly gets a login page. Pass the link of the post the Article was published in. Optionally translate it with lang.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Translate the Article into this language. Leave out for the original.",
                "enum": ["en", "es", "pt", "fr", "de", "it", "ja", "ko", "zh"],
                "type": "string"
              },
              "url": {
                "description": "A post link like https://x.com/name/status/123…, or the numeric post ID.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:45d14041fc13285bcdac27f0ec031f10c80f3c133c987d47452113e94a22dc90"
        },
        {
          "name": "read_x_post",
          "title": "Read an X post",
          "description": "Returns a single X (Twitter) post as Markdown: author, date, text, the quoted post, image links and counts. For an Article use read_x_article; for a video's words use get_x_video_transcript.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "A post link like https://x.com/name/status/123…, or the numeric post ID.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ca56d6d89a5f5e938e35a665ace386b627d3179d419b5b5f16b0c5c27d2cc7b0"
        },
        {
          "name": "transcribe_x_video",
          "title": "Transcribe an X video",
          "description": "Transcribes the video in an X post that has no captions, one part (about 108 seconds of audio) per call. Start with part 0. Each call says whether to call again with the next part; the last one returns the transcript. The transcript is saved, so get_x_video_transcript works for it afterwards. Videos up to 15 minutes. Only text is stored, never video or audio.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "md (default) has a header and timestamps per paragraph; txt is plain paragraphs; srt and vtt are subtitles.",
                "enum": ["md", "txt", "srt", "vtt"],
                "type": "string"
              },
              "part": {
                "description": "Which part to transcribe. 0 to start.",
                "minimum": 0,
                "type": "integer"
              },
              "url": {
                "description": "A post link like https://x.com/name/status/123…, or the numeric post ID.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:77bc8109ca6ccc6629270950b140acb272dd40db59c7c7d266109cc233c8c0e4"
        }
      ],
      "digest": "sha256:bbc89fb9bf396419e2e7b885cc0cd088374222f6f6fedab2db85703aecab5647"
    }
  }
}
