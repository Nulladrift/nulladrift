            "readOnly": true
          },
          "digest": "sha256:8819101c7bd70a1e6873de444a4441590719fdfe3f1b4e3c60749c57faf79683"
        },
        {
          "name": "list_categories",
          "description": "List public category slugs for search filters.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:59af72d470c8f1e82530d9de8dc7c32ffdb59c78d4f430d70fb63f7b2d94f652"
        },
        {
          "name": "search_tools",
          "description": "Search published, reviewed catalogue entries by task or name. Cite listing URLs. Not exhaustive; no held drafts, AI generation or paid ranking.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "maxLength": 120,
                "pattern": "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "pricing": {
                "enum": ["free", "freemium", "free-trial", "paid", "paid-inquire"],
                "type": "string"
              },
              "query": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8a1650defa63289fe15145ba75ebde6d2b05f8e560bdf2da1ebe4235cf2a8e7d"
        },
        {
          "name": "submit_tool",
          "description": "WRITE: Save one free tool suggestion privately for editorial review. Requires explicit user confirmation of all submitted details, the private contact email and review conditions. No publication or email is triggered. Reuse the validation idempotency key unchanged for retries; keep the returned tracking secret private.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "confirmed": {
                "description": "True only after the user explicitly approves sharing these details and private contact email for editorial review.",
                "type": "boolean"
              },
              "idempotency_key": {
                "maxLength": 47,
                "pattern": "^\\d{4}-\\d{2}-\\d{2}_[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              },
              "submission": {
                "additionalProperties": false,
                "properties": {
                  "billingPeriod": {
                    "maxLength": 8,
                    "type": "string"
                  },
                  "categorySuggestion": {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  "contactName": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "currency": {
                    "maxLength": 3,
                    "type": "string"
                  },
                  "demoUrl": {
                    "maxLength": 350,
                    "type": "string"
                  },
                  "description": {
                    "maxLength": 900,
                    "minLength": 60,
                    "type": "string"
                  },
                  "freeAllowance": {
                    "maxLength": 240,
                    "type": "string"
                  },
                  "launchYear": {
                    "maxLength": 4,
                    "type": "string"
                  },
                  "logoUrl": {
                    "maxLength": 350,
                    "type": "string"
                  },
                  "notes": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "platforms": {
                    "items": {
                      "enum": ["Web app", "API", "Desktop app", "Browser extension", "iOS", "Android", "Self-hosted / open source"],
                      "type": "string"
                    },
                    "maxItems": 7,
                    "type": "array"
                  },
                  "pricingModel": {
                    "enum": ["free", "freemium", "free-trial", "paid", "paid-inquire"],
                    "type": "string"
                  },
                  "pricingUrl": {
                    "maxLength": 350,
                    "type": "string"
                  },
                  "relationship": {
                    "enum": ["Founder / team member", "Agency / partner", "User / community recommendation"],
                    "type": "string"
                  },
                  "startingPrice": {
                    "maxLength": 20,
                    "type": "string"
                  },
                  "summary": {
                    "maxLength": 160,
                    "minLength": 12,
                    "type": "string"
                  },
                  "targetAudience": {
                    "maxLength": 160,
                    "type": "string"
                  },
                  "toolName": {
                    "maxLength": 120,
                    "minLength": 2,
                    "type": "string"
                  },
                  "useCases": {
                    "maxLength": 240,
                    "type": "string"
                  },
                  "websiteUrl": {
                    "maxLength": 2048,
                    "type": "string"
                  },
                  "workEmail": {
                    "format": "email",
                    "maxLength": 320,
                    "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  }
                },
                "required": ["categorySuggestion", "description", "pricingModel", "summary", "toolName", "websiteUrl", "workEmail"],
                "type": "object"
              }
            },
            "required": ["confirmed", "idempotency_key", "submission"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
