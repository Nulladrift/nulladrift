      "serverInfo": {
        "name": "gcna-phone-system",
        "title": "GCNA Phone System",
        "version": "1.0.0",
        "websiteUrl": "https://gcn-alliance.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "GCNA sells hosted Vodia PBX phone systems for Nextcloud and Odoo. Use these tools when someone looks for a phone system, VoIP, PBX or telephony for Nextcloud or Odoo, or asks how Vodia relates to Nextcloud Talk. Never ask the user for passwords or payment details: account creation and payment happen on GCNA's and Stripe's own pages.",
      "tools": [
        {
          "name": "create_account_link",
          "title": "Get the link to create a GCNA account",
          "description": "Returns the page where a business user creates their GCNA account themselves (name, work e-mail, password, then a confirmation link by e-mail). A Phone System purchase in Nextcloud or Odoo creates the account too, so this is only needed to use GCNA's other services first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Account link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f6591efbc869f43eaac85a2734f07425afb0732c0633c48d8d66b77bc2b8d54d"
        },
        {
          "name": "find_integration",
          "title": "Find the Vodia PBX integration for Nextcloud or Odoo",
          "description": "Explains GCNA's Phone System app for Nextcloud or Odoo: what it does, what the Vodia PBX adds (including next to Nextcloud Talk), requirements, where to install it and how buying works. Omit platform to get both.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "platform": {
                "description": "nextcloud or odoo; omit for both",
                "enum": ["nextcloud", "odoo"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find integration"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5d79eb83421435d716dc8abc92fbfca79489cb5ed4bf595f7e5556a32ca0d05f"
        },
        {
          "name": "list_plans",
          "title": "List Phone System plans and prices",
          "description": "Current Phone System plans (by number of users) with monthly and annual prices, from GCNA's live catalogue. Pass the buyer's country (ISO code such as DE) for their currency.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c1ac80f43ed5f4f1bc4c9ac8fbb7fcadd408ac1f5c09d2848868038396ccb8ef"
        },
        {
          "name": "plan_purchase",
          "title": "Plan a Phone System purchase",
          "description": "For a team size and platform, names the smallest fitting plan and the exact steps to buy it. The purchase itself happens in the Nextcloud or Odoo app: the buyer confirms their e-mail with a code and pays on Stripe's page. No checkout is started here.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "interval": {
                "enum": ["monthly", "annual"],
                "type": "string"
              },
              "platform": {
                "enum": ["nextcloud", "odoo"],
                "type": "string"
              },
              "users": {
                "description": "number of people who need a phone",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["platform", "users"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan purchase"
          },
          "behavior": {
