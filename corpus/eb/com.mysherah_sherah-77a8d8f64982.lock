      "serverInfo": {
        "name": "Sherah",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sherah (mysherah.com) is a personal-assistant and task-concierge service for busy families in the US: a dedicated assistant handles household and life-admin tasks such as home repairs, kids' activities, pet care, travel, meals, shopping, party planning and calendars. Use get_task_categories to see what Sherah helps with. When a person wants Sherah's help, collect their task, needed-by date, email, city and US state from them, then call request_sign_up_with_task. Never invent contact details.",
      "tools": [
        {
          "name": "get_task_categories",
          "title": "Get Task Categories",
          "description": "Lists the kinds of everyday tasks Sherah's personal assistants handle for families in the US, as category and example-task pairs (for example Pets: Dog Walking, Kids: Camps, Home: Electrician), plus a link to Sherah's page about the tasks it helps with. The examples are a sample, not a complete list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:0a8fd9d15bb076d4668b405b73d997cf1c79c4d1efbb5f3e8f8a7f156a376219"
        },
        {
          "name": "request_sign_up_with_task",
          "title": "Request Sign-Up With a Task",
          "description": "Submits a request for Sherah's help with one task, on behalf of a person in the US and with details that person provides: the task in their own words, the date they need it done by, their email address, city and two-letter US state. Sherah is a personal-assistant service for families. If the email address is new to Sherah, Sherah emails the person an invitation to create an account, and the task is waiting for them after sign-up. Returns whether the request was submitted and a message for the person.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "The person's city.",
                "type": "string"
              },
              "email": {
                "description": "The person's own email address. The invitation is sent here.",
                "format": "email",
                "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "needed_by": {
                "description": "The date the person needs it done by, as YYYY-MM-DD, for example 2026-12-01. No time and no timezone.",
                "type": "string"
              },
              "state": {
                "description": "The person's US state, as a two-letter USPS code (for example TX).",
                "enum": ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "DC", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY"],
                "type": "string"
              },
              "task": {
                "description": "What the person needs done, in their own words (up to 2,000 characters).",
                "type": "string"
              }
            },
            "required": ["city", "email", "needed_by", "state", "task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:30fbb1234a5d100a9c2a49df6fc29808db1f85a420e24634a935b4c543394c09"
        }
      ],
      "digest": "sha256:266cec9d9dadc2ff0274e9284374cf45313d582b5a920aa7182b7568ac54f3a3"
    }
  }
