{
  "lockfileVersion": 2,
  "subjects": {
    "com.apished/regex-email-url-validator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apished.com/mcp/v1/validate"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "apished-validate",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "email_validate",
          "description": "Checks value is a single, bare RFC 5322 email address — syntax only, not a deliverability check. user@localhost is valid (no TLD required). \"Name <email>\" display syntax is rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "identifier or value to check",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "reason": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28dc557f777c6028ddcabd9207e18599442df93f6770479efaadb6bc50db1c8f"
        },
        {
          "name": "jsonschema_validate",
          "description": "Validates document against schema (JSON Schema draft-07 or 2020-12). Reports one specific violation per call, not an aggregated list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "document": {
                "description": "the JSON value to validate against schema"
              },
              "schema": {
                "description": "a JSON Schema (draft-07 or 2020-12)"
              }
            },
            "required": ["document", "schema"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "reason": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:989888ae155bef5edf3cb0c6c5da5ef609ac8982f97a386c05cbbea0a46337da"
        },
        {
          "name": "regex_match",
          "description": "Tests input against pattern (Go's regexp package: RE2 syntax, not PCRE — no backreferences or lookaround; use inline flags like (?i) for case-insensitive matching). Returns the full match and captured groups.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "type": "string"
              },
              "pattern": {
                "description": "RE2 syntax",
                "type": "string"
              }
            },
            "required": ["input", "pattern"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "groups": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "match": {
                "type": "string"
              },
              "matches": {
                "type": "boolean"
              }
            },
            "required": ["matches"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4cedd082287c005530230c7aa6c5c7f05351065b119bec89157b94182d6479f4"
        },
        {
          "name": "url_validate",
          "description": "Checks value is a well-formed absolute URL (has both a scheme and a host) — syntax only, not a reachability check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "identifier or value to check",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "reason": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6c92b75e79a49074b38aa1184f99cfc8ffdc65577733141ccb641754ec3fa5d8"
        }
      ],
      "digest": "sha256:87f7e798f14cc5666c56c682b3bd3ad931c2035cc81df49942d44771eeacda37"
    }
  }
}
