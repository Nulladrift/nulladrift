{
  "lockfileVersion": 2,
  "subjects": {
    "com.mcpcalc/calculator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcpcalc.com/api/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "mcpcalc-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "calculate",
          "description": "Run a calculation and get results + prefilled URL",
          "inputSchema": {
            "properties": {
              "calculator": {
                "description": "Calculator slug",
                "type": "string"
              },
              "inputs": {
                "description": "Calculator input values",
                "type": "object"
              },
              "strict": {
                "description": "If true, reject invalid or unknown input fields instead of dropping them",
                "type": "boolean"
              }
            },
            "required": ["calculator", "inputs"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1fde68f3b1d0f0e8bc6348f97eadec2993eb3cea4c67f2a03d0f187665d6cbd3"
        },
        {
          "name": "calculate_cas",
          "description": "Evaluate one or more headless CAS expressions server-side (MCP-only numeric mode). Unsupported expressions return a GUI handoff link.",
          "inputSchema": {
            "properties": {
              "expression": {
                "description": "Single CAS expression to evaluate",
                "type": "string"
              },
              "expressions": {
                "description": "Optional ordered list of CAS expressions to evaluate in one isolated context (supports assignments across the batch)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "strict": {
                "description": "If true, reject unknown fields and malformed expressions instead of dropping them",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:26fb5f59dae0e81f4acd21a76d4214a6d377fb68efaab44a804d96928f0c791b"
        },
        {
          "name": "calculate_cas_headless",
          "description": "Alias of calculate_cas. Headless MCP-only CAS evaluator; if unsupported features are requested, returns GUI handoff details.",
          "inputSchema": {
            "properties": {
              "expression": {
                "description": "Single CAS expression to evaluate",
                "type": "string"
              },
              "expressions": {
                "description": "Optional ordered list of CAS expressions to evaluate in one isolated context (supports assignments across the batch)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "strict": {
                "description": "If true, reject unknown fields and malformed expressions instead of dropping them",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff52ec276bb21eb72ee23624cfe6dc35ee7ed146465e4287d065f5e29d1c348e"
        },
        {
          "name": "close_session",
          "description": "Close a session and optionally persist a snapshot of its final state",
          "inputSchema": {
            "properties": {
              "session_id": {
                "description": "Session UUID",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62a000852266b56ea4e65a5505fc5444affb06728345561982041f8908583fc9"
        },
        {
          "name": "create_session",
          "description": "Create a new interactive session for any calculator and return the session URL",
          "inputSchema": {
            "properties": {
              "calculator": {
                "description": "Calculator slug",
                "type": "string"
              },
              "metadata": {
                "description": "Optional session metadata",
                "type": "object"
              }
            },
            "required": ["calculator"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1713588e507510fbc1e1b9ac3f7f74887a13b474e917246e95c03c1ce473491"
        },
        {
          "name": "generate_prefilled_url",
          "description": "Generate a prefilled URL without running calculation",
          "inputSchema": {
            "properties": {
              "calculator": {
                "description": "Calculator slug",
                "type": "string"
              },
              "inputs": {
                "description": "Input values for URL",
                "type": "object"
              },
              "strict": {
                "description": "If true, reject invalid or unknown input fields instead of dropping them",
                "type": "boolean"
              }
            },
            "required": ["calculator", "inputs"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:225f3b2e7060803128aabed4ab49d0ba425240472752f489ce85f1fe49afb7a6"
        },
        {
          "name": "get_calculator_schema",
          "description": "Get the input schema for a specific calculator",
          "inputSchema": {
            "properties": {
              "calculator": {
                "description": "Calculator slug",
                "type": "string"
              }
            },
            "required": ["calculator"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a909b1d7faba809010437fab96df1b8ad115d418e5bc3a2acce21b49fd384467"
        },
        {
          "name": "get_session_state",
          "description": "Retrieve the current field values, computation transcript, and pending message queue for an active session",
          "inputSchema": {
            "properties": {
              "session_id": {
                "description": "Session UUID",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:18ff70eb77a5d191ec41e911315ce9b25246ac6c04863234e2e8f572fde17b4a"
        },
        {
          "name": "list_calculators",
          "description": "List available calculators, optionally filtered by category",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Filter by category (e.g., 'finance', 'math')",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:599460245304fba3478cbea24ea11bebbf0f1b4b311389a5870181159d7f7f81"
        },
        {
          "name": "push_session_action",
          "description": "Push actions into a session's message queue (set fields, submit computation, trigger plot, etc.)",
          "inputSchema": {
            "properties": {
              "actions": {
                "description": "Array of SessionAction objects to push to the browser",
                "items": {
                  "description": "A session action. Supports CAS actions, form field updates, and spreadsheet actions like set_cells/get_cells/load_csv/export_csv/set_column_format.",
                  "properties": {
                    "args": {
                      "description": "Optional command arguments (for rpn_execute_command)",
                      "items": {},
                      "type": "array"
                    },
                    "assumptions": {
                      "description": "Assumptions block for proof_set_document_meta",
                      "type": "string"
                    },
                    "cells": {
                      "description": "Cell raw values keyed by A1 refs (for set_cells on spreadsheet)",
                      "type": "object"
                    },
                    "command": {
                      "description": "RPN command name (for rpn_execute_command)",
                      "type": "string"
                    },
                    "csv": {
                      "description": "CSV/TSV payload for load_csv",
                      "type": "string"
                    },
                    "delimiter": {
                      "description": "Optional delimiter for load_csv (e.g. ',', '\\t')",
                      "type": "string"
                    },
                    "delta": {
                      "description": "Indent delta for proof_indent_line",
                      "type": "number"
                    },
                    "document": {
                      "description": "Full proof document payload for proof_replace_document",
                      "type": "object"
                    },
                    "expression": {
                      "description": "Math expression (for submit_expression and plot actions)",
                      "type": "string"
                    },
                    "fields": {
                      "description": "Key-value pairs of field names to values (for set_fields action on form calculators)",
                      "type": "object"
                    },
                    "formats": {
                      "description": "Column display formats keyed by column letter (for set_column_format)",
                      "type": "object"
                    },
                    "goal": {
                      "description": "Goal statement for proof_set_document_meta",
                      "type": "string"
                    },
                    "id": {
                      "description": "Proof line id for update/delete/move/indent actions",
                      "type": "string"
                    },
                    "index": {
                      "description": "Optional insertion index for proof_insert_line/proof_apply_template",
                      "type": "number"
                    },
                    "key": {
                      "description": "Single RPN key or token (for rpn_keypress)",
                      "type": "string"
                    },
                    "keys": {
                      "description": "Ordered list of RPN keys or commands (for rpn_key_sequence)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "line": {
                      "description": "Optional line payload for proof_insert_line. Include source and optional justification/indent/tags.",
                      "properties": {
                        "indent": {
                          "description": "Indent level for the inserted proof line",
                          "type": "number"
                        },
                        "justification": {
                          "description": "Optional justification for the inserted proof line",
                          "type": "string"
                        },
                        "source": {
                          "description": "Proof line content to insert",
                          "type": "string"
                        },
                        "tags": {
                          "description": "Optional proof line tags",
                          "items": {
                            "enum": ["assumption", "claim", "therefore", "qed"],
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "type": "object"
                    },
                    "markdown": {
                      "description": "Markdown text for a static commentary block (links/code are sanitized)",
                      "type": "string"
                    },
                    "mode": {
                      "description": "Evaluation mode (for set_mode action)",
                      "enum": ["symbolic", "numeric"],
                      "type": "string"
                    },
                    "name": {
                      "description": "Variable name (for assign_variable action)",
                      "type": "string"
                    },
                    "patch": {
                      "description": "Proof line patch payload for proof_update_line. Include fields like source, justification, indent, or tags.",
                      "properties": {
                        "indent": {
                          "description": "Indent level for the proof line",
                          "type": "number"
                        },
                        "justification": {
                          "description": "Optional justification text for the proof line",
                          "type": "string"
                        },
                        "source": {
                          "description": "Proof line content to display in the builder",
                          "type": "string"
                        },
                        "tags": {
                          "description": "Optional proof line tags",
                          "items": {
                            "enum": ["assumption", "claim", "therefore", "qed"],
                            "type": "string"
                          },
                          "type": "array"
                        }
                      },
                      "type": "object"
                    },
                    "preservePrograms": {
                      "description": "Preserve stored RPN programs when resetting",
                      "type": "boolean"
                    },
                    "range": {
                      "anyOf": [
                        {
                          "items": {
                            "type": "number"
                          },
                          "type": "array"
                        },
                        {
                          "type": "string"
                        }
                      ],
                      "description": "Plot range as [min, max] for 'plot', or A1 range string for 'export_csv'"
                    },
                    "ranges": {
                      "description": "A1 ranges or single refs (for get_cells and clear_cells)",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "registers": {
                      "description": "Register map for RPN memory updates",
                      "type": "object"
                    },
                    "source": {
                      "description": "Line-based program source (for rpn_load_program)",
                      "type": "string"
                    },
                    "stack": {
                      "description": "Partial T/Z/Y/X stack payload (for rpn_set_stack)",
                      "type": "object"
                    },
                    "target": {
                      "description": "Target cell for load_csv (defaults to A1)",
                      "type": "string"
                    },
                    "templateId": {
                      "description": "Template id for proof_apply_template",
                      "type": "string"
                    },
                    "theorem": {
                      "description": "Theorem statement for proof_set_document_meta",
                      "type": "string"
                    },
                    "title": {
                      "description": "Proof title for proof_set_document_meta",
                      "type": "string"
                    },
                    "toIndex": {
                      "description": "Target line index for proof_move_line",
                      "type": "number"
                    },
                    "type": {
                      "description": "The action type",
                      "enum": ["submit_expression", "set_fields", "plot", "assign_variable", "insert_markdown", "clear_transcript", "set_mode", "set_cells", "get_cells", "clear_cells", "load_csv", "export_csv", "set_column_format", "rpn_keypress", "rpn_key_sequence", "rpn_execute_command", "rpn_set_stack", "rpn_set_registers", "rpn_load_program", "rpn_run_program", "rpn_reset", "proof_set_document_meta", "proof_insert_line", "proof_update_line", "proof_delete_line", "proof_move_line", "proof_indent_line", "proof_apply_template", "proof_replace_document"],
                      "type": "string"
                    }
                  },
                  "required": ["type"],
                  "type": "object"
                },
                "type": "array"
              },
              "session_id": {
                "description": "Session UUID",
                "type": "string"
              }
            },
            "required": ["actions", "session_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d7cbb02f0287bf2089aabde292521f49415a458d85989e8d3d122ae2e14d9c1"
        }
      ],
      "digest": "sha256:1da92d04355d2d7f75fbc0c06e9fb2e3a90359a5952e99fbcba860d796526693"
    }
  }
}
