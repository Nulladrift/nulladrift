        {
          "name": "image_compression_curve",
          "title": "Image compression size-vs-quality curve",
          "description": "Analysis-only tool (no image bytes returned): re-encodes an image at the same fixed 14 quality levels GO AI's browser compressor samples to draw its size-against-quality curve (5, 10, ..., through 100 -- see the qualities in each returned point), for JPEG, WebP or AVIF, and reports the resulting byte size and percent change at each level. The image is first downscaled to fit within maxDimension (default 1600px on the longer side, never enlarged), exactly as the source's working canvas is, then every quality level is encoded one at a time. Because this repeats the encode 14 times, its maxDimension is capped at 2000px -- lower than image_compress's 4000px -- which costs nothing in practice, since the knee of the curve is a property of the image's content and sits in the same place at either size. Use this to find that 'knee' (where size stops dropping much per quality point) for a specific image, or image_compress to actually get the compressed bytes at one chosen quality. Input is base64-encoded image bytes, not a file path or URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "format": {
                "default": "webp",
                "description": "Format to sample the curve in. Defaults to 'webp', matching the source's own default.",
                "enum": ["jpeg", "webp", "avif"],
                "type": "string"
              },
              "imageBase64": {
                "description": "Base64-encoded source image bytes (not a file path or URL).",
                "type": "string"
              },
              "maxDimension": {
                "default": 1600,
                "description": "Longer-side cap in pixels before encoding, aspect preserved, never enlarged. Defaults to 1600, matching the source. Capped at 2000 here (vs 4000 for image_compress) because this tool runs the encode 14 times.",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["imageBase64"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "Format every point was encoded in.",
                "enum": ["jpeg", "webp", "avif"],
                "type": "string"
              },
              "original": {
                "additionalProperties": false,
                "description": "The image as supplied.",
                "properties": {
                  "bytes": {
                    "description": "Original file size in bytes.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "height": {
                    "description": "Original height in px.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "width": {
                    "description": "Original width in px.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["bytes", "height", "width"],
                "type": "object"
              },
              "points": {
                "description": "The 14 fixed sample points, ascending by quality. The 'knee' -- where size stops dropping much per quality point -- is what this tool exists to locate. No image bytes are returned.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytes": {
                      "description": "Encoded size at that quality, in bytes.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "percentChange": {
                      "description": "Size against the original as a percentage; negative means smaller.",
                      "type": "number"
                    },
                    "quality": {
                      "description": "The quality level sampled.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["bytes", "percentChange", "quality"],
                  "type": "object"
                },
                "type": "array"
              },
              "working": {
                "additionalProperties": false,
                "description": "The downscaled image every quality level was encoded from. The knee sits in the same place at either size, so this does not distort the curve.",
                "properties": {
                  "height": {
                    "description": "Height the curve was measured at, in px.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "maxDimension": {
