        },
        {
          "name": "inspect_mobileprovision",
          "title": "Inspect a provisioning profile",
          "description": "Reads an iOS/macOS provisioning profile (.mobileprovision or .provisionprofile, given as base64) by byte-searching its CMS/PKCS7-signed container for the embedded '<?xml ... </plist>' property list and parsing that XML -- it never validates or decodes the cryptographic signature, and does not report on the embedded certificates beyond how many there are. Reports expiry status and days remaining, profile type (development/ad hoc vs. enterprise vs. App Store distribution, classified only from the registered-device list and the ProvisionsAllDevices flag), team and application identifiers, the full entitlements dictionary, and the count and UDIDs of registered devices. Returns a structured { ok: false, error, message } result (not a thrown error) for an unreadable input, a file with no embedded plist, or a plist that fails to parse.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "base64": {
                "description": "Base64-encoded raw bytes of the .mobileprovision or .provisionprofile file.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["base64"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appIdName": {
                "description": "The App ID name registered with the profile.",
                "type": ["string", "null"]
              },
              "applicationIdentifier": {
                "description": "The application-identifier entitlement, i.e. team ID plus bundle ID -- the field that says what this profile actually signs.",
                "type": ["string", "null"]
              },
              "certificateCount": {
                "description": "How many signing certificates are embedded. The certificates themselves are not decoded -- only counted.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "createdDate": {
                "description": "Creation date as an ISO 8601 string, or null when absent or unparseable.",
                "type": ["string", "null"]
              },
              "deviceCount": {
                "description": "Number of registered device UDIDs; 0 for an App Store or enterprise profile.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "devices": {
                "description": "The registered device UDIDs, normally strings. Empty when the profile registers none.",
                "items": {},
                "type": "array"
              },
              "entitlements": {
                "additionalProperties": {},
                "description": "The full entitlements dictionary verbatim from the profile, keys and values as the plist held them.",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "expirationDate": {
                "description": "Expiry date as an ISO 8601 string, or null when absent or unparseable.",
                "type": ["string", "null"]
              },
              "expiry": {
                "additionalProperties": false,
                "description": "Whether this profile still works, which is the question most callers are actually asking.",
                "properties": {
                  "daysRemaining": {
                    "description": "Days until expiry, negative once expired. Null when status is unknown.",
                    "type": ["number", "null"]
                  },
                  "message": {
                    "description": "That verdict written out with the date. An empty string when status is unknown.",
                    "type": "string"
                  },
                  "status": {
                    "description": "Expiry verdict; 'expiring_soon' means 30 days or fewer remain, 'unknown' means the profile carried no readable expiry date.",
                    "enum": ["valid", "expiring_soon", "expired", "unknown"],
                    "type": "string"
                  }
                },
                "required": ["daysRemaining", "message", "status"],
                "type": "object"
              },
              "name": {
                "description": "The profile's name, or null if the plist omits it.",
                "type": ["string", "null"]
              },
              "ok": {
                "const": true,
                "description": "Always true on a readable profile. An unreadable file, a file with no embedded plist, or a plist that will not parse comes back as an error result instead, with the reason as its text.",
                "type": "boolean"
              },
              "platform": {
                "description": "Platforms the profile covers, normally an array such as ['ios']. Null when absent."
              },
              "profileType": {
                "additionalProperties": false,
                "description": "Development/ad hoc vs. enterprise vs. App Store distribution.",
                "properties": {
                  "description": {
                    "description": "What that kind means for installing the build.",
                    "type": "string"
                  },
                  "kind": {
                    "description": "Profile kind, inferred from the registered-device list and the ProvisionsAllDevices flag -- not from a field that states it, because none does.",
                    "enum": ["development", "enterprise", "app_store"],
                    "type": "string"
                  }
                },
                "required": ["description", "kind"],
                "type": "object"
              },
              "rawPlistXml": {
                "description": "The embedded property list as raw XML, for anything this report does not surface.",
                "type": "string"
              },
              "teamIdentifier": {
                "description": "Team identifiers from the plist, normally an array of one team ID string. Null when absent."
              },
              "teamName": {
                "description": "Developer team name.",
                "type": ["string", "null"]
              },
              "timeToLiveDays": {
                "description": "The profile's TimeToLive in days, or null when absent.",
                "type": ["number", "null"]
              },
              "uuid": {
                "description": "The profile's UUID.",
                "type": ["string", "null"]
              }
            },
            "required": ["appIdName", "applicationIdentifier", "certificateCount", "createdDate", "deviceCount", "devices", "entitlements", "expirationDate", "expiry", "name", "ok", "platform", "profileType", "rawPlistXml", "teamIdentifier", "teamName", "timeToLiveDays", "uuid"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:768c86f8ce492d2e8521676fb879155b3310cd2d784cb60515d9928750527a06"
        },
        {
          "name": "oklch_convert",
          "title": "Convert an OKLCH / hex / RGB / HSL color",
          "description": "Converts a color to and from OKLCH. Accepts either a CSS color string via `color` (hex, rgb()/rgba(), hsl()/hsla(), or oklch()) or explicit OKLCH lightness/chroma/hue via l, c and h — supply one or the other. Returns the canonical oklch() text for the color exactly as requested, plus its sRGB-gamut-mapped hex/rgb()/hsl() equivalents. Gamut mapping follows the CSS Color 4 algorithm (bisecting on chroma at constant lightness and hue, not channel-clipping) and only targets sRGB — there is no P3 or Rec2020 support.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "c": {
                "description": "OKLCH chroma. sRGB's most saturated colour reaches about 0.31; the source page's own slider goes to 0.4 so out-of-gamut requests are possible on purpose. Used (with l and h) only when color is omitted.",
                "type": "number"
              },
              "color": {
                "description": "CSS color to convert from — hex ('#5b8cff' or '#58f'), rgb()/rgba(), hsl()/hsla(), or oklch(). Takes precedence over l/c/h when both are supplied.",
                "maxLength": 128,
                "type": "string"
              },
              "h": {
                "description": "OKLCH hue in degrees, 0-360. Used (with l and c) only when color is omitted.",
                "type": "number"
              },
              "l": {
                "description": "OKLCH lightness, 0 (black) to 1 (white). Used (with c and h) only when color is omitted.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "hex": {
                "description": "The sRGB result as a hex string.",
                "type": "string"
              },
              "hsl": {
                "additionalProperties": false,
                "description": "The same colour in HSL, for code that still expects it.",
                "properties": {
                  "h": {
                    "description": "Hue in degrees.",
                    "type": "number"
                  },
                  "l": {
                    "description": "Lightness as a percentage. Note this is HSL lightness, which is not OKLCH lightness.",
                    "type": "number"
                  },
                  "s": {
                    "description": "Saturation as a percentage.",
                    "type": "number"
                  }
                },
                "required": ["h", "l", "s"],
                "type": "object"
              },
              "hslText": {
                "description": "The colour as a CSS hsl() declaration.",
                "type": "string"
              },
              "inGamut": {
                "description": "Whether the requested colour exists in sRGB.",
                "type": "boolean"
              },
              "mapped": {
                "description": "True when the colour was gamut-mapped to fit sRGB, meaning hex below is a near miss rather than the exact request.",
                "type": "boolean"
              },
              "oklchText": {
                "description": "The colour as a CSS oklch() declaration.",
                "type": "string"
              },
              "requested": {
                "additionalProperties": false,
                "description": "The OKLCH coordinates that were asked for, before any gamut mapping -- keep these to see how far the sRGB answer had to move.",
                "properties": {
                  "c": {
                    "description": "Requested chroma.",
                    "type": "number"
                  },
                  "h": {
                    "description": "Requested hue angle in degrees.",
                    "type": "number"
                  },
                  "l": {
                    "description": "Requested lightness, 0-1.",
                    "type": "number"
                  }
                },
                "required": ["c", "h", "l"],
                "type": "object"
              },
              "rgb": {
                "additionalProperties": false,
                "description": "The same colour as 8-bit sRGB channels.",
                "properties": {
                  "b": {
                    "description": "Blue channel, 0-255.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "g": {
                    "description": "Green channel, 0-255.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "r": {
                    "description": "Red channel, 0-255.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["b", "g", "r"],
                "type": "object"
              },
              "rgbText": {
                "description": "The colour as a CSS rgb() declaration.",
                "type": "string"
              }
            },
            "required": ["hex", "hsl", "hslText", "inGamut", "mapped", "oklchText", "requested", "rgb", "rgbText"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f644b5c9d17b8afabc36883b0b0eb48359defa908da31bcefbbc8a1f34b0870b"
        },
        {
          "name": "oklch_ramp",
          "title": "Build an OKLCH swatch ramp / CSS custom-property block",
          "description": "Builds a perceptually even OKLCH swatch ramp from a base color (same `color` or l/c/h input as oklch_convert) by sweeping one channel — hue, lightness, or chroma — while holding the other two fixed, so every swatch keeps the same visual weight (this is the reason to build a ramp in OKLCH rather than HSL). Each step is gamut-mapped to sRGB with the CSS Color 4 chroma-reduction algorithm and returned with its hex preview, plus a ready-to-paste `:root { --name-1: oklch(...); ... }` CSS block.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "c": {
                "description": "OKLCH chroma. sRGB's most saturated colour reaches about 0.31; the source page's own slider goes to 0.4 so out-of-gamut requests are possible on purpose. Used (with l and h) only when color is omitted.",
                "type": "number"
              },
              "color": {
                "description": "CSS color to convert from — hex ('#5b8cff' or '#58f'), rgb()/rgba(), hsl()/hsla(), or oklch(). Takes precedence over l/c/h when both are supplied.",
                "maxLength": 128,
                "type": "string"
              },
              "h": {
                "description": "OKLCH hue in degrees, 0-360. Used (with l and c) only when color is omitted.",
                "type": "number"
              },
              "l": {
                "description": "OKLCH lightness, 0 (black) to 1 (white). Used (with c and h) only when color is omitted.",
                "type": "number"
              },
              "mode": {
                "default": "hue",
                "description": "Which channel the ramp sweeps while holding the other two fixed: 'hue' rotates hue around the wheel, 'light' sweeps lightness from a near-black floor to a near-white ceiling, 'chroma' sweeps chroma from 0 up to the base colour's own chroma.",
                "enum": ["hue", "light", "chroma"],
                "type": "string"
              },
              "name": {
                "default": "brand",
                "description": "Stem for the generated CSS custom properties (e.g. 'brand' produces --brand-1, --brand-2, ...); sanitized to [a-z0-9-] the same way the source page does.",
                "maxLength": 64,
                "type": "string"
              },
              "steps": {
                "default": 9,
                "description": "Number of swatches in the ramp, 3-24.",
                "maximum": 24,
                "minimum": 3,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "base": {
                "additionalProperties": false,
                "description": "The OKLCH coordinates the ramp was generated from.",
                "properties": {
                  "c": {
                    "description": "Base chroma.",
                    "type": "number"
                  },
                  "h": {
                    "description": "Base hue angle in degrees.",
                    "type": "number"
                  },
                  "l": {
                    "description": "Base lightness, 0-1.",
                    "type": "number"
                  }
                },
                "required": ["c", "h", "l"],
                "type": "object"
              },
              "css": {
                "description": "The whole ramp as CSS custom properties, ready to paste into a stylesheet.",
                "type": "string"
              },
              "mode": {
                "description": "Which coordinate was varied across the steps, echoed from the input.",
                "enum": ["hue", "light", "chroma"],
                "type": "string"
              },
              "steps": {
                "description": "The ramp in order. Because each step is mapped independently, some can be mapped and others not.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "hex": {
                      "description": "This step as an sRGB hex string.",
                      "type": "string"
                    },
                    "index": {
                      "description": "0-based position in the ramp.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "mapped": {
                      "description": "True when this particular step fell outside sRGB and was gamut-mapped.",
                      "type": "boolean"
                    },
                    "oklch": {
                      "additionalProperties": false,
                      "description": "This step's OKLCH coordinates.",
                      "properties": {
                        "c": {
                          "description": "Chroma at this step.",
                          "type": "number"
                        },
                        "h": {
                          "description": "Hue at this step.",
                          "type": "number"
                        },
                        "l": {
                          "description": "Lightness at this step.",
                          "type": "number"
                        }
                      },
                      "required": ["c", "h", "l"],
                      "type": "object"
                    },
                    "oklchText": {
                      "description": "This step as a CSS oklch() declaration.",
                      "type": "string"
                    }
                  },
                  "required": ["hex", "index", "mapped", "oklch", "oklchText"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["base", "css", "mode", "steps"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:497f75fb8a7befa5c222782a7b5b954a56cc2fb73e79b49745579b861acea487"
        },
        {
          "name": "plant_watering_calendar",
          "title": "Plant watering calendar (.ics)",
          "description": "Builds a soil-check interval per houseplant from a fixed drought-tolerance table (32 common houseplants), adjusted by pot size, pot material, light and season, and returns both a schedule breakdown and the full text of a downloadable RFC 5545 .ics calendar file -- one recurring all-day 'check the soil' reminder per plant (deliberately never 'water', since only the plant's own soil can say that). Matches GO AI's browser watering-calendar tool exactly, including its northern-hemisphere-season default when `season` is omitted, its terracotta/glazed/low-light/winter multipliers, and its 75-octet .ics line folding. The starting intervals are heuristic drought-tolerance bands, not a measurement of any specific plant, pot or room -- the tool says so in its own FAQ.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "light": {
                "default": "indirect",
                "description": "Light level: bright direct sun dries soil fastest, low light slowest. Defaults to bright-but-indirect.",
                "enum": ["bright", "indirect", "low"],
                "type": "string"
              },
              "plants": {
                "description": "Houseplant ids to include (each event uses this exact catalog, no free text). Duplicates are ignored. Ids: snake, zz, aloe, jade, echeveria, cactus, hawortia, ponytail, rubber, monstera, pothos, philodendron, fiddle, dracaena, yucca, schefflera, spider, peaceLily, anthurium, orchid, birdOfPara, parlour, kentia, areca, chinese, prayer, calathea, fern, maidenhair, fittonia, begonia, africanViolet.",
                "items": {
                  "enum": ["snake", "zz", "aloe", "jade", "echeveria", "cactus", "hawortia", "ponytail", "rubber", "monstera", "pothos", "philodendron", "fiddle", "dracaena", "yucca", "schefflera", "spider", "peaceLily", "anthurium", "orchid", "birdOfPara", "parlour", "kentia", "areca", "chinese", "prayer", "calathea", "fern", "maidenhair", "fittonia", "begonia", "africanViolet"],
                  "type": "string"
                },
                "maxItems": 32,
                "minItems": 1,
                "type": "array"
              },
              "potMaterial": {
                "default": "plastic",
                "description": "Unglazed terracotta breathes and dries noticeably faster than plastic (default) or glazed ceramic.",
                "enum": ["terracotta", "plastic", "glazed"],
                "type": "string"
              },
              "potSize": {
                "default": "medium",
                "description": "Pot diameter band: small (under 12cm), medium (12-25cm, default), large (over 25cm). A larger pot holds more soil and dries more slowly.",
                "enum": ["small", "medium", "large"],
                "type": "string"
              },
              "season": {
                "description": "Current season, which scales every interval (summer fastest, winter roughly 60% slower). If omitted, defaults from today's calendar month assuming the *northern* hemisphere, exactly like the source page -- pass this explicitly for a southern-hemisphere season or to plan for a season other than the current one.",
                "enum": ["spring", "summer", "autumn", "winter"],
                "type": "string"
              },
              "startDate": {
                "description": "First reminder date, YYYY-MM-DD. Every plant's recurring event starts on this same date, each with its own repeat interval. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["plants"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calendar": {
                "additionalProperties": false,
                "description": "The schedule as a subscribable calendar. Returned inline as text, not as a file download.",
                "properties": {
                  "filename": {
                    "description": "Suggested filename for the calendar file.",
                    "type": "string"
                  },
                  "icsText": {
                    "description": "A complete iCalendar document with a repeating event per plant, ready to write to a file and import.",
                    "type": "string"
                  },
                  "mimeType": {
                    "description": "MIME type of icsText, i.e. text/calendar.",
                    "type": "string"
                  }
                },
                "required": ["filename", "icsText", "mimeType"],
                "type": "object"
              },
              "note": {
                "description": "Standing caution that these intervals are a starting point to adjust against the actual soil.",
                "type": "string"
              },
              "schedule": {
                "description": "One entry per requested plant, in catalogue order.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "baseDays": {
                      "description": "The plant's baseline interval before pot, light and season adjustments.",
                      "type": "number"
                    },
                    "intervalDays": {
                      "description": "Days between waterings after every adjustment -- the number to act on.",
                      "type": "number"
                    },
                    "key": {
                      "description": "Stable identifier for the plant, as given in the input.",
                      "type": "string"
                    },
                    "multiplier": {
                      "description": "The combined adjustment applied to baseDays, so the difference is auditable rather than magic.",
                      "type": "number"
                    },
                    "name": {
                      "description": "The plant's common name.",
                      "type": "string"
                    }
                  },
                  "required": ["baseDays", "intervalDays", "key", "multiplier", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "additionalProperties": false,
                "description": "The set at a glance, for deciding a single watering day.",
                "properties": {
                  "chosenCount": {
                    "description": "How many plants were scheduled.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "maxIntervalDays": {
                    "description": "The longest interval in the set.",
                    "type": "number"
                  },
                  "minIntervalDays": {
                    "description": "The thirstiest plant's interval -- the cadence that actually governs a shared watering round.",
                    "type": "number"
                  },
                  "seasonFactor": {
                    "description": "The season multiplier applied to every plant.",
                    "type": "number"
                  }
                },
                "required": ["chosenCount", "maxIntervalDays", "minIntervalDays", "seasonFactor"],
                "type": "object"
              }
            },
            "required": ["calendar", "note", "schedule", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bb48d141e568180859074273d7f42c15ba3e7b80518a55c290bee3ff8649e6c6"
        },
        {
          "name": "project_weight_goal_date",
          "title": "Weight loss goal-date projector",
          "description": "Projects the calendar date a goal body weight is reached under a fixed daily calorie intake. Unlike a naive straight-line calculator (kg to lose x 7700 / deficit, also returned here for comparison), this recomputes Mifflin-St Jeor maintenance calories at each simulated day as weight falls, so the effective deficit narrows the way it really does -- meaning the projected date is later than, or equal to, the naive one, never earlier. Refuses to project a date when the resulting intake falls below a 1500 kcal (men) / 1200 kcal (women) floor, and reports a 'plateau' outcome instead of a date when the goal sits at or below the weight where maintenance would settle at that intake (an asymptote that a fixed intake alone can never cross). Adult-only inputs (18+); only projects weight loss (goalWeight must be less than currentWeight).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "activityLevel": {
                "description": "Activity multiplier bucket, the site's five options: sedentary x1.2 (desk job, no exercise), light x1.375 (1-3 sessions/week), moderate x1.55 (3-5 sessions/week, the site default), very_active x1.725 (6-7 sessions/week), extra_active x1.9 (physical job or 2x/day training).",
                "enum": ["sedentary", "light", "moderate", "very_active", "extra_active"],
                "type": "string"
              },
              "age": {
                "description": "Age in years, 18-120. The source page is not validated for children; 18+ only.",
                "maximum": 120,
                "minimum": 18,
                "type": "number"
              },
              "currentWeight": {
                "description": "Current body weight, kg if units is metric, lb if imperial.",
                "exclusiveMinimum": 0,
                "maximum": 1500,
                "type": "number"
              },
              "dailyDeficitKcal": {
                "description": "Daily calorie deficit to hold against today's computed maintenance. The site's quick picks are 250/500/750/1000 kcal, but any positive number is accepted.",
                "exclusiveMinimum": 0,
                "maximum": 10000,
                "type": "number"
              },
              "goalWeight": {
                "description": "Goal body weight, same unit as currentWeight. Must be less than currentWeight -- this tool only projects weight loss, matching the source page.",
                "exclusiveMinimum": 0,
                "maximum": 1500,
                "type": "number"
              },
              "heightCm": {
                "description": "Height in centimeters. Required when units is 'metric'.",
                "exclusiveMinimum": 0,
                "maximum": 300,
                "type": "number"
              },
              "heightFt": {
                "description": "Feet part of height. Required when units is 'imperial'.",
                "maximum": 9,
                "minimum": 0,
                "type": "number"
              },
              "heightIn": {
                "description": "Inches part of height (0-11). Required when units is 'imperial'.",
                "maximum": 11,
                "minimum": 0,
                "type": "number"
              },
              "includeChartSeries": {
                "default": true,
                "description": "If true, also return the weekly weight series and the naive straight-line end week -- the same two lines the source page charts. Set false to skip them for a lighter response.",
                "type": "boolean"
              },
              "referenceDate": {
                "description": "ISO date (YYYY-MM-DD) the projection counts forward from. Defaults to today (UTC) when omitted.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "sex": {
                "description": "Biological sex, used by the Mifflin-St Jeor formula.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "units": {
                "default": "metric",
                "description": "metric = cm/kg, imperial = ft+in/lb. Applies to height and both weight fields.",
                "enum": ["metric", "imperial"],
                "type": "string"
              }
            },
            "required": ["activityLevel", "age", "currentWeight", "dailyDeficitKcal", "goalWeight", "sex"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activityMultiplier": {
                "description": "The multiplier the chosen activity level maps to.",
                "type": "number"
              },
              "currentWeightKg": {
                "description": "Starting weight in kg, after any imperial conversion.",
                "type": "number"
              },
              "daysToGoal": {
                "description": "Days to the goal under the adaptive model, or null when the goal is never reached.",
                "type": ["number", "null"]
              },
              "floorKcal": {
                "description": "The intake floor that was enforced, below which the projection is not modelled.",
                "type": "number"
              },
              "gapDays": {
                "description": "How many days longer the honest answer is than the naive one -- the whole point of the tool. Null when the goal is never reached.",
                "type": ["number", "null"]
              },
              "goalWeightKg": {
                "description": "Target weight in kg, after any imperial conversion.",
                "type": "number"
              },
              "horizonDays": {
                "description": "Length of the modelled horizon in days, or null when not modelled.",
                "type": ["number", "null"]
              },
              "intakeKcal": {
                "description": "Daily intake implied by the requested deficit, after the safety floor is applied.",
                "type": "number"
              },
              "maintenanceKcal": {
                "description": "Maintenance calories at the starting weight.",
                "type": "number"
              },
              "naiveDays": {
                "description": "Days predicted by the flat 7,700 kcal-per-kg rule that ignores the falling maintenance -- the figure most calculators stop at.",
                "type": ["number", "null"]
              },
              "naiveLineEndWeek": {
                "description": "Where the naive straight line would end on the same axes, so the two can be drawn together. Null when there is no series.",
                "type": ["number", "null"]
              },
              "naiveWeeks": {
                "description": "The same figure in whole weeks.",
                "type": ["number", "null"]
              },
              "note": {
                "description": "Plain-language reading of the result, including why the two answers differ or why the goal is unreachable.",
                "type": "string"
              },
              "plateau": {
                "description": "True when the settle weight is above the goal, i.e. this deficit alone will never get there. Null when it does not apply.",
                "type": ["boolean", "null"]
              },
              "projectedDate": {
                "description": "Calendar date the goal is reached, ISO YYYY-MM-DD, or null when it is not reached.",
                "type": ["string", "null"]
              },
              "reachedWithinHorizon": {
                "description": "Whether the goal is reached inside the modelled horizon.",
                "type": "boolean"
              },
              "series": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "weekIndex": {
                          "description": "Weeks from the reference date.",
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        "weightKg": {
                          "description": "Projected weight at that week under the adaptive model.",
                          "type": "number"
                        }
                      },
                      "required": ["weekIndex", "weightKg"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Weekly projection points for plotting. Null when includeChartSeries was false."
              },
              "settleWeightKg": {
                "description": "The weight this intake eventually settles at, since maintenance falls as weight does. Null when it does not apply.",
                "type": ["number", "null"]
              },
              "status": {
                "description": "How the projection ended: the goal is reached, or it settles short of the goal, or it is unreachable at this intake. The field to branch on before reading the dates.",
                "type": "string"
              },
              "weeksToGoal": {
                "description": "The same figure in whole weeks.",
                "type": ["number", "null"]
              }
            },
            "required": ["activityMultiplier", "currentWeightKg", "daysToGoal", "floorKcal", "gapDays", "goalWeightKg", "horizonDays", "intakeKcal", "maintenanceKcal", "naiveDays", "naiveLineEndWeek", "naiveWeeks", "note", "plateau", "projectedDate", "reachedWithinHorizon", "series", "settleWeightKg", "status", "weeksToGoal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
