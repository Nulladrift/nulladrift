        {
          "name": "check_strings_files",
          "title": "iOS .strings localization checker",
          "description": "Compares two or more iOS Localizable.strings files (sent as base64-encoded raw file bytes, not text) against a base file and reports keys missing from each other file, keys present in another file but not the base (\"extra\", reported but not counted toward the issue total), values byte-identical to the base (often untranslated, sometimes intentionally so), duplicate values under different keys within the same file (case- and trailing-punctuation-insensitive), and lines that fail to parse with their line number. Sniffs a UTF-8 or UTF-16 LE/BE byte-order mark per file so files exported by Xcode in UTF-16 decode correctly instead of producing a wall of parse errors. Does not support the newer .xcstrings JSON catalogue format, and does not check plural rules or placeholder (%@/%d) consistency between files -- it is a pure key/value diff.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "baseFile": {
                "description": "Exact name of one of files[] to treat as the base (\"compare against\") file. When omitted, auto-selects the first file (after sorting all names alphabetically) whose name starts with \"base.\" / \"base-\" / \"base_\" or \"en.\" / \"en-\" / \"en_\" (case-insensitive), falling back to the alphabetically-first file if none match. A name that does not match any loaded file falls back the same way.",
                "maxLength": 255,
                "type": "string"
              },
              "files": {
                "description": "Two to 40 .strings files to compare against each other.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "Base64-encoded RAW BYTES of the file (not its decoded text) -- send it exactly as read from disk so BOM sniffing and UTF-16 decoding work the same way the browser tool's FileReader does.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "name": {
                      "description": "File name, e.g. \"en.lproj/Localizable.strings\" -- shown in the report and used to auto-select the base file.",
                      "maxLength": 255,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["content", "name"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "badLines": {
                "description": "Lines that are neither a comment, blank, nor a parseable key/value pair -- typically a missing semicolon or an unescaped quote.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "file": {
                      "description": "The file containing the line.",
                      "type": "string"
                    },
                    "line": {
                      "description": "1-based line number.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "text": {
                      "description": "The line as written, so it can be found and fixed.",
                      "type": "string"
                    }
                  },
                  "required": ["file", "line", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "baseFile": {
                "description": "Which file every other file was compared against, whether given or chosen automatically.",
                "type": "string"
              },
              "duplicateValues": {
                "description": "Keys within one file that share a value, which is how a copy-paste translation error looks.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "file": {
                      "description": "The file containing the duplicates.",
                      "type": "string"
                    },
                    "keys": {
                      "description": "The keys sharing it, comma-separated.",
                      "type": "string"
                    },
                    "value": {
                      "description": "The repeated value.",
                      "type": "string"
                    }
                  },
                  "required": ["file", "keys", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "extraKeys": {
                "description": "Keys in a translation that the base file no longer has -- usually left behind by a rename or a deletion.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "file": {
                      "description": "The file carrying it.",
                      "type": "string"
                    },
                    "key": {
                      "description": "The key not present in the base file.",
                      "type": "string"
                    },
                    "value": {
                      "description": "Its value in that file.",
                      "type": "string"
                    }
                  },
                  "required": ["file", "key", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "fileCount": {
                "description": "How many files were compared.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "files": {
                "description": "Per-file summary, including the base file.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "badLineCount": {
                      "description": "Unparseable lines in this file.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "encoding": {
                      "description": "The encoding the file was decoded as -- .strings files are frequently UTF-16, and a wrong guess here explains a zero key count.",
                      "type": "string"
                    },
                    "keyCount": {
                      "description": "Keys parsed from this file.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "name": {
                      "description": "Filename as given.",
                      "type": "string"
                    }
                  },
                  "required": ["badLineCount", "encoding", "keyCount", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "identicalToBase": {
                "description": "Keys whose translation is byte-identical to the base language. Sometimes correct (a proper noun), often a forgotten translation.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "file": {
                      "description": "The translation file.",
                      "type": "string"
                    },
                    "key": {
                      "description": "The key whose value matches the base file.",
                      "type": "string"
                    },
                    "value": {
                      "description": "The shared value.",
                      "type": "string"
                    }
                  },
                  "required": ["file", "key", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "issueCount": {
                "description": "Total findings across every category below. Zero means the files agree.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "keysInBase": {
                "description": "Number of keys in the base file -- the denominator for the translation coverage.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "missingKeys": {
                "description": "Keys present in the base file but absent from another -- untranslated strings that will fall back at runtime.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "baseValue": {
                      "description": "The base file's value for that key, i.e. the string still to be translated.",
                      "type": "string"
                    },
                    "file": {
                      "description": "The file missing it.",
                      "type": "string"
                    },
                    "key": {
                      "description": "The key absent from this file.",
                      "type": "string"
                    }
                  },
                  "required": ["baseValue", "file", "key"],
                  "type": "object"
                },
                "type": "array"
              },
              "missingKeysStrings": {
                "description": "Every missing key formatted as ready-to-paste .strings entries with the base value, so the gap can be filled without retyping. Empty when nothing is missing.",
                "type": "string"
              }
            },
            "required": ["badLines", "baseFile", "duplicateValues", "extraKeys", "fileCount", "files", "identicalToBase", "issueCount", "keysInBase", "missingKeys", "missingKeysStrings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dda3fb6c03de17d867b7f502971a196273a8ae8787c4c427e229dbf5fc22ee66"
        },
        {
          "name": "convert_heic_to_jpg_png",
          "title": "Convert HEIC/HEIF to JPG or PNG",
          "description": "Converts iPhone HEIC/HEIF photos to JPEG or PNG, decoding with a WebAssembly build of libheif (LGPL-3.0) and re-encoding with sharp -- the same pipeline as GO AI's browser-based HEIC converter tool, run server-side. Accepts 1-50 files as {filename, dataBase64} (each up to ~30MB decoded); every file is byte-sniffed by its actual magic bytes, never by filename extension or claimed mime type, so an iPhone photo that iOS already delivered as a JPEG (picked from Photos rather than Files) is detected and reported as already_converted -- passed through unchanged, not re-encoded -- while real HEIC/HEIF input is decoded and re-encoded to the requested format (JPEG with a caller-set quality 50-100, or lossless PNG). Any orientation stored on the HEIC is applied automatically during decode, so output comes out right-side up. Metadata (EXIF: GPS, timestamp, camera) is not carried over, matching the source page. Each converted or passed-through file is returned individually (inline if small, as a download link if large), or bundled as one converted.zip when bundleAsZip is true and more than one file produced output; a file that fails to decode is reported with status failed and an error message rather than aborting the batch. The JSON report lists status, dimensions, and before/after byte sizes for every input file, in input order.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bundleAsZip": {
                "default": false,
                "description": "When true and more than one file produced output bytes (converted or passed-through), bundle them into one converted.zip instead of returning each file as its own separate output.",
                "type": "boolean"
              },
              "files": {
                "description": "1 to 50 files, in the order results are reported. Mix HEIC/HEIF and already-JPEG/PNG files freely -- each is byte-sniffed on its own. The batch is additionally capped at 4000000 bytes of combined decoded input, which is what binds in practice for real photos.",
                "items": {
                  "properties": {
                    "dataBase64": {
                      "description": "The file bytes, base64-encoded. Each decodes to at most 4000000 bytes, and the whole batch to at most 4000000 bytes combined.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "filename": {
                      "description": "Original filename. Used only to derive the output name and to label report rows -- never trusted to identify the format.",
                      "maxLength": 255,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["dataBase64", "filename"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "format": {
                "default": "image/jpeg",
                "description": "Output format for any real HEIC/HEIF input. Ignored for input already sniffed as JPEG or PNG, which is passed through unchanged rather than re-encoded.",
                "enum": ["image/jpeg", "image/png"],
                "type": "string"
              },
              "quality": {
                "default": 90,
                "description": "JPEG quality, 50-100. Ignored when format is image/png (PNG is lossless).",
                "maximum": 100,
                "minimum": 50,
                "type": "integer"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "format": {
                "description": "Output MIME type requested for the batch.",
                "enum": ["image/jpeg", "image/png"],
                "type": "string"
              },
              "results": {
                "description": "One row per input file, in the order supplied. Rows come in three shapes depending on status.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "error": {
                      "description": "Why this file could not be converted. Present only on a failed row -- one bad file does not fail the batch.",
                      "type": "string"
                    },
                    "filename": {
                      "description": "The input filename, echoed back so rows line up with what was sent.",
                      "type": "string"
                    },
                    "height": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Decoded height in px, on the same terms as width."
                    },
                    "inputBytes": {
                      "description": "Size of the supplied file in bytes.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "mimeType": {
                      "description": "MIME type of the produced file, or null when this input failed.",
                      "type": ["string", "null"]
                    },
                    "outputBytes": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Size of the produced file in bytes, or null when this input failed."
                    },
                    "outputFilename": {
                      "description": "Name of the produced file, or null when this input failed.",
                      "type": ["string", "null"]
                    },
                    "status": {
                      "description": "Per-file outcome. 'already_converted' means the input was already a JPEG or PNG and was passed through untouched rather than re-encoded.",
                      "enum": ["converted", "already_converted", "failed"],
                      "type": "string"
                    },
                    "width": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Decoded width in px. Null for a failed file, and also for a passed-through one, which is never decoded."
                    }
                  },
                  "required": ["filename", "height", "inputBytes", "mimeType", "outputBytes", "outputFilename", "status", "width"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["format", "results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d4fdbd3455e5c1d7c9d3022056e13b8f0952fffdd209a6c22c612244d58cd555"
        },
        {
          "name": "convert_video_to_gif",
          "title": "Trim a short video into a GIF, MP4 or WebM",
          "description": "Ports GO AI's browser Live Photo-to-GIF tool server-side: trims a SHORT video clip and converts it to an animated GIF, or (a server-side addition the browser tool cannot do) a real MP4/WebM video. Input is base64 video bytes plus its mimeType (any container/codec this server's ffmpeg build can decode) and a trim range in seconds (startSeconds/endSeconds). \n\nHARD LIMITS -- this runs in a 400 MB container on one shared vCPU behind a proxy that hangs up at 125s, so an over-budget request is REJECTED up front with a message naming the limit rather than accepted and then killed. Read these before calling: (1) the video itself must decode to at most 4 MB -- send a pre-trimmed clip, not a whole recording; (2) the trim range must span at least 0.25s and at most 10s; (3) width x height x frames must not exceed 12 megapixels TOTAL across the whole animation. That third one is the binding limit in practice and it is easy to trip with a portrait clip: at size=480 a 9:16 video is 480x854, so it fits about 29 frames (~2.9s at fps=10) -- while a 16:9 video at the same size is 480x270 and fits the full frame cap. If a call is rejected, the error names the exact frame/size that would fit; do not retry with the same numbers. \n\nsize picks the output width in px (0 keeps the source's own width, clamped to 720; otherwise 720/480/320/240, default 320). Height is derived to preserve aspect ratio and both are forced even (a hard requirement of GIF and most video codecs). fps (10/12/15/20/25, default 10) is the target sampling rate; because GIF frame delays are whole hundredths of a second, the achieved rate (actualFps in the result) is rounded and rarely matches exactly what was requested -- always read actualFps back, do not assume it equals fps. speed (0.5/1/1.5/2) scales playback; speed below 1 samples MORE frames from the same span and so costs more of the pixel budget. motion is loop (plays once per cycle, restarts abruptly), bounce (plays forward then backward so it never visibly cuts -- this roughly DOUBLES the emitted frame count and therefore halves the span that fits the pixel budget), or once (plays through and stops; GIF only, this disables the NETSCAPE2.0 loop extension). \n\nFor format 'gif' (the default): at most 120 frames are sampled from the trim range (bounce mirrors the middle back on top of that afterward, so a bounced GIF can carry up to 238 frames if the pixel budget allows), and colours (256/128/64, default 256) sets the palette size. The palette is a single median-cut palette built across every sampled frame at once, not per frame, exactly like the source -- a clip with wildly different scenes (e.g. a cut between two very different shots) will show banding because the whole clip is sharing one 256-or-fewer-colour palette. dither (default true) enables Floyd-Steinberg dithering, which smooths gradients at the cost of file size and adds visible noise to flat graphics/screen recordings -- turn it off for those. For format 'mp4' (H.264) or 'webm' (VP9): frame sampling and the GIF palette pipeline are skipped entirely and ffmpeg encodes the trimmed/scaled/speed-adjusted clip directly in one pass; audio is always dropped, since the source tool this is ported from is silent-GIF/loop focused and has no audio-preserving path of its own. The same trim-span and pixel limits apply. Frame extraction for GIF approximates the source's exact evenly-spaced-timestamp sampling with ffmpeg's own fps-filter resampling of the decoded stream (documented in code as a deliberate simplification, not a literal port) -- for most clips this is visually indistinguishable, but timing will not be bit-identical to the browser tool's output for the same input. Returns the encoded file (inline if small, otherwise a download link) plus a JSON stats object: frameCount (gif only), width, height, byteSize, requestedFps, actualFps, delayCentiseconds (gif only), format, outputPixels, maxOutputPixels, and more. An oversized request, a trim under 0.25s, an undecodable video, or an unsupported codec is reported as a tool error naming the problem, never a crash.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "colours": {
                "default": 256,
                "description": "GIF palette size: 256 (default), 128 or 64 shared colours across the whole clip. Ignored for mp4/webm.",
                "enum": [256, 128, 64],
                "type": "number"
              },
              "dither": {
                "default": true,
                "description": "Floyd-Steinberg dithering for the GIF palette (default true). Smooths gradients at the cost of file size and adds noise to flat graphics -- turn off for screen recordings or flat artwork. Ignored for mp4/webm.",
                "type": "boolean"
              },
              "endSeconds": {
                "description": "Trim end, in seconds. Must leave at least 0.25s and at most 10s between startSeconds and endSeconds.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "format": {
                "default": "gif",
                "description": "Output container. 'gif' (default) runs the full sampling + shared-palette + LZW pipeline. 'mp4' (H.264) and 'webm' (VP9) skip that pipeline and have ffmpeg encode the trimmed/scaled/speed-adjusted clip directly, with audio always dropped.",
                "enum": ["gif", "mp4", "webm"],
                "type": "string"
              },
              "fps": {
                "default": 10,
                "description": "Target sampling/output frame rate: 10 (default), 12, 15, 20 or 25. Higher fps spends the frame budget faster, so it shortens the trim range that will fit. For GIF, the true achieved rate is reported back as actualFps and will differ slightly due to whole-centisecond frame delays.",
                "enum": [10, 12, 15, 20, 25],
                "type": "number"
              },
              "mimeType": {
                "description": "The source video's mime type, e.g. \"video/quicktime\" or \"video/mp4\". Used only to pick a temp-file extension; the actual format is content-sniffed by ffmpeg.",
                "minLength": 1,
                "type": "string"
              },
              "motion": {
                "default": "loop",
                "description": "'loop' (restarts from the first frame each cycle), 'bounce' (plays forward then backward, never visibly cuts -- roughly doubles the emitted frame count and so halves the span that fits the pixel budget), or 'once' (plays through and stops -- GIF only, disables looping).",
                "enum": ["loop", "bounce", "once"],
                "type": "string"
              },
              "size": {
                "default": 320,
                "description": "Output width in px: 0 keeps the source's own width (clamped to 720); otherwise 720, 480, 320 (default) or 240. Height is derived to preserve aspect ratio; both dimensions are forced even. Bigger sizes buy fewer frames -- width x height x frames is capped at 12 megapixels.",
                "enum": [0, 720, 480, 320, 240],
                "type": "number"
              },
              "speed": {
                "default": 1,
                "description": "Playback speed multiplier: 0.5, 1 (default), 1.5 or 2. Higher speed samples fewer frames per second of source video (and so fits a longer trim); 0.5 samples twice as many.",
                "enum": [0.5, 1, 1.5, 2],
                "type": "number"
              },
              "startSeconds": {
                "default": 0,
                "description": "Trim start, in seconds from the beginning of the video. Clamped to the video's own duration.",
                "minimum": 0,
                "type": "number"
              },
              "videoBase64": {
                "description": "Base64-encoded source video bytes (not a file path or URL). The decoded video must be at most 4 MB; larger payloads are rejected before any decoding happens.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["endSeconds", "mimeType", "videoBase64"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "actualFps": {
                "description": "The frame rate actually achieved, which can differ because frames are sampled by ffmpeg's fps filter rather than seeking to exact times.",
                "type": "number"
              },
              "audio": {
                "description": "What happened to the source audio track. mp4/webm output only.",
                "type": "string"
              },
              "byteSize": {
                "description": "Size of the produced file in bytes.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "delayCentiseconds": {
                "description": "Per-frame delay written into the GIF, in centiseconds. GIF output only.",
                "type": "number"
              },
              "dither": {
                "description": "Whether dithering was applied during quantisation. GIF output only.",
