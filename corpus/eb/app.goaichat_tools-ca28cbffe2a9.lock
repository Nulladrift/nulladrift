        {
          "name": "css_clamp_calculator",
          "title": "CSS clamp() Calculator",
          "description": "Generates a CSS clamp() declaration (in rem) that linearly interpolates a size between a value at a small viewport width and a value at a large one, exactly matching GO AI's clamp() calculator tool (same slope/intercept math, rounded to 4 decimal places). Returns a status: 'sameViewports' when the two viewport widths are equal (no line can be drawn -- css is null), 'flat' when the min and max sizes are equal (a constant, clamp() unneeded), 'inverted' when the max size is smaller than the min (still valid CSS, but the computed size shrinks as the viewport grows), or 'ok' otherwise. Optionally evaluates the computed pixel size at a list of preview viewport widths, and optionally generates a matched fluid type scale by multiplying both endpoints by ratio^step for a given number of steps -- unlike the website's five-option dropdown, any positive ratio is accepted here since the underlying math is not limited to those presets.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "maxSizePx": {
                "description": "Size in px at the large viewport.",
                "type": "number"
              },
              "maxViewportPx": {
                "description": "The large viewport width in px.",
                "type": "number"
              },
              "minSizePx": {
                "description": "Size in px at the small viewport.",
                "type": "number"
              },
              "minViewportPx": {
                "description": "The small viewport width in px.",
                "type": "number"
              },
              "previewViewportsPx": {
                "description": "Optional list of viewport widths (px), up to 64, to evaluate the resulting clamp() at, returned as computed pixel sizes.",
                "items": {
                  "type": "number"
                },
                "maxItems": 64,
                "type": "array"
              },
              "rootFontSizePx": {
                "default": 16,
                "description": "Root font size in px used to convert the px sizes to rem. Defaults to 16; a value of 0 also falls back to 16.",
                "type": "number"
              },
              "typeScale": {
                "description": "Optional: when provided, also returns a fluid type scale of this many steps, each step scaling both endpoints by ratio^step.",
                "properties": {
                  "ratio": {
                    "default": 1.2,
                    "description": "Multiplier applied per step (e.g. 1.25, a minor third).",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "steps": {
                    "default": 5,
                    "description": "Number of scale steps, 1-8.",
                    "maximum": 8,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["maxSizePx", "maxViewportPx", "minSizePx", "minViewportPx"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "css": {
                "description": "The finished CSS clamp() declaration in rem, or null when status is sameViewports.",
                "type": ["string", "null"]
              },
              "math": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "interceptRem": {
                        "description": "The constant rem term of the middle (preferred) expression.",
                        "type": "number"
                      },
                      "maxRem": {
                        "description": "Upper bound of the clamp, in rem.",
                        "type": "number"
                      },
                      "minRem": {
                        "description": "Lower bound of the clamp, in rem.",
                        "type": "number"
                      },
                      "slopeVw": {
                        "description": "The vw coefficient of the middle expression, i.e. rem gained per 1% of viewport width.",
                        "type": "number"
                      }
                    },
                    "required": ["interceptRem", "maxRem", "minRem", "slopeVw"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The four numbers the css string is assembled from, each rounded to 4 decimal places. Null when status is sameViewports."
              },
              "note": {
                "description": "Human-readable explanation of a non-ok status, or an empty string when status is ok.",
                "type": "string"
              },
              "preview": {
                "description": "One entry per requested preview viewport, in the order given. Empty when previewViewportsPx was omitted.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "computedSizePx": {
                      "description": "What the clamp() resolves to at that width, in px, rounded to 2 decimals.",
                      "type": "number"
                    },
                    "viewportPx": {
                      "description": "The viewport width that was evaluated, echoed from previewViewportsPx.",
                      "type": "number"
                    }
                  },
                  "required": ["computedSizePx", "viewportPx"],
                  "type": "object"
                },
                "type": "array"
              },
              "scale": {
                "description": "The fluid type scale, one entry per step. Empty when typeScale was omitted or no step could be built.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "css": {
                      "description": "The clamp() declaration for this step.",
                      "type": "string"
                    },
                    "maxSizePx": {
                      "description": "This step's size at the large viewport, in px.",
                      "type": "number"
                    },
                    "minSizePx": {
                      "description": "This step's size at the small viewport, in px.",
                      "type": "number"
                    },
                    "ratioApplied": {
                      "description": "ratio raised to (step - 1), the multiplier applied to both endpoints.",
                      "type": "number"
                    },
                    "step": {
                      "description": "1-based step index in the scale.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["css", "maxSizePx", "minSizePx", "ratioApplied", "step"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "description": "'ok' for a normal fluid size; 'sameViewports' when the two viewport widths match, so no line can be drawn and css is null; 'flat' when both sizes are equal (a constant, clamp() unneeded); 'inverted' when the max size is below the min, which is valid CSS that shrinks as the viewport grows.",
                "enum": ["ok", "sameViewports", "flat", "inverted"],
                "type": "string"
              }
            },
            "required": ["css", "math", "note", "preview", "scale", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d5f6098ea9bfcc3a206b72aab4fa1a090e0d7a4fe71aa7b2e0b17d00658a05e5"
        },
        {
          "name": "estimate_ai_tokens",
          "title": "Estimate AI token count, context fit & cost",
          "description": "Heuristic estimate (NOT a real per-model BPE tokenizer) of how many tokens a piece of text will become, ported from GO AI's browser-side token counter. Blends a chars/4 and words/0.75 baseline with surcharges for punctuation, digits and non-Latin script; typically within ±10-15% for ordinary English prose and ±15-25% when non-Latin script is detected -- code and heavily punctuated text tend to tokenize denser than this suggests. Also reports whether the text fits a set of context windows (default: 8K/128K/200K/1M/2M tokens, or pass your own) and, if you supply per-million-token prices, an estimated USD cost. Use a provider's own tokenizer for exact billing figures.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calls": {
                "default": 1,
                "description": "Number of times this input/output pair will be sent, to scale total cost. Defaults to 1; values below 1 are treated as 1.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "contextWindows": {
                "description": "Custom context windows to check fit against, e.g. [{\"name\":\"my-model\",\"sizeTokens\":32000}]. Omit to use the site default set (8K, 128K, 200K, 1M, 2M).",
                "items": {
                  "properties": {
                    "name": {
                      "maxLength": 512,
                      "type": "string"
                    },
                    "sizeTokens": {
                      "exclusiveMinimum": 0,
                      "type": "number"
                    }
                  },
                  "required": ["name", "sizeTokens"],
                  "type": "object"
                },
                "maxItems": 64,
                "type": "array"
              },
              "expectedOutputTokens": {
                "default": 500,
                "description": "Assumed reply length in tokens, used only to estimate output cost. Defaults to 500.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "inputPricePerMillionUsd": {
                "description": "USD price per 1,000,000 input tokens, from the provider's current pricing page. Omit to skip input cost -- no default is assumed, since a stale hardcoded price would be worse than none.",
                "minimum": 0,
                "type": "number"
              },
              "outputPricePerMillionUsd": {
                "description": "USD price per 1,000,000 output tokens. Omit to skip output cost.",
                "minimum": 0,
                "type": "number"
              },
              "text": {
                "description": "The text to estimate, up to 1000000 characters (roughly 250K tokens). An empty string is valid and yields 0 tokens.",
                "maxLength": 1000000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accuracyBand": {
                "additionalProperties": false,
                "description": "An honesty bound on the token count: this is a heuristic, not a real tokenizer, and the band says how far off it usually is.",
                "properties": {
                  "approxRange": {
                    "description": "The expected error range, e.g. a percentage spread.",
                    "type": "string"
                  },
                  "level": {
                    "description": "How trustworthy this estimate is for text of this kind.",
                    "type": "string"
                  },
                  "note": {
                    "description": "What about the text put it in this band, and which way it is likely to be wrong.",
                    "type": "string"
                  }
                },
                "required": ["approxRange", "level", "note"],
                "type": "object"
              },
              "characters": {
                "description": "Character count of the input text.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "charsPerToken": {
                "description": "Characters divided by tokens -- the density that drives the accuracy band.",
                "type": "number"
              },
              "contextFit": {
                "description": "The text measured against each context window, so the caller sees which models it fits.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "comfortable": {
                      "description": "Whether it fits with enough headroom left for a useful reply.",
                      "type": "boolean"
                    },
                    "fits": {
                      "description": "Whether the text fits at all.",
                      "type": "boolean"
                    },
                    "name": {
                      "description": "Name of the context window being checked against.",
                      "type": "string"
                    },
                    "overByTokens": {
                      "description": "How many tokens too long the text is, or null when it fits.",
                      "type": ["number", "null"]
                    },
                    "percentUsed": {
                      "description": "What percentage of the window the text would occupy.",
                      "type": "number"
                    },
                    "sizeTokens": {
                      "description": "That window's size in tokens.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "verdict": {
                      "description": "One-word summary, e.g. 'fits' or 'over'.",
                      "type": "string"
                    }
                  },
                  "required": ["comfortable", "fits", "name", "overByTokens", "percentUsed", "sizeTokens", "verdict"],
                  "type": "object"
                },
                "type": "array"
              },
              "cost": {
                "additionalProperties": false,
                "description": "Projected spend. Every field is null unless the matching per-million price was supplied.",
                "properties": {
                  "inputCost": {
                    "description": "USD to send this text, or null when no input price was supplied.",
                    "type": ["number", "null"]
                  },
                  "outputCost": {
                    "description": "USD for the expected output, or null when no output price was supplied.",
                    "type": ["number", "null"]
                  },
                  "totalCost": {
                    "description": "Input plus output, multiplied by calls. Null when either price was omitted.",
                    "type": ["number", "null"]
                  }
                },
                "required": ["inputCost", "outputCost", "totalCost"],
                "type": "object"
              },
              "readingTime": {
                "additionalProperties": false,
                "description": "How long the text takes a person to read, as a sanity check on the size.",
                "properties": {
                  "minutes": {
                    "description": "Whole minutes to read at an average pace, or null when underOneMinute is true.",
                    "type": ["number", "null"]
                  },
                  "underOneMinute": {
                    "description": "True when the text reads in under a minute, in which case minutes is null.",
                    "type": "boolean"
                  }
                },
                "required": ["minutes", "underOneMinute"],
                "type": "object"
              },
              "tokens": {
                "description": "Estimated token count for the text.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "words": {
                "description": "Whitespace-delimited word count.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["accuracyBand", "characters", "charsPerToken", "contextFit", "cost", "readingTime", "tokens", "words"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6703ba06522fce72de895bfb1940f9968b4605fd4455c75286922a274ae91eff"
        },
        {
          "name": "estimate_window_light",
          "title": "Window light estimator for houseplants",
          "description": "Estimates the indoor light level a window gives a plant, in the category words houseplant care guides use (Direct sun / Bright indirect / Medium light / Low light / Too dark), from the window's hemisphere, compass aspect, what obstructs it, and how far back the plant sits from the glass. This is a small heuristic scoring table ported from GO AI's window-light tool page, not a physical light-meter reading or a per-location sun-position model — it correctly flips which compass direction is 'bright' for the southern hemisphere and flags the direct-west-sun scorch risk, and returns the reasoning behind the verdict plus a shortlist of plants suited to that light level.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "aspect": {
                "description": "True compass direction the window faces (before any hemisphere adjustment).",
                "enum": ["N", "NE", "E", "SE", "S", "SW", "W", "NW"],
                "type": "string"
              },
              "blocked": {
                "description": "What stands between the glass and the open sky: 'clear' = nothing, 'sheer' = a net curtain/blind or distant trees, 'near' = a tree or building close by, 'heavy' = mostly blocked.",
                "enum": ["clear", "sheer", "near", "heavy"],
                "type": "string"
              },
              "distance": {
                "description": "How far back from the glass the plant sits: 'sill' = on the sill, 'd1' = within an arm's reach, 'd2' = one to two metres back, 'd3' = two to three metres back, 'd4' = further into the room.",
                "enum": ["sill", "d1", "d2", "d3", "d4"],
                "type": "string"
              },
              "hemisphere": {
                "description": "Hemisphere the window is in. South of the equator the sun tracks the northern sky, so the compass direction that gets the strongest light is reversed from what most (northern-hemisphere-written) plant guides assume.",
                "enum": ["north", "south"],
                "type": "string"
              }
            },
            "required": ["aspect", "blocked", "distance", "hemisphere"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "description": "The compass direction the window faces, echoed from the input.",
                "type": "string"
              },
              "band": {
                "description": "The score bucketed into a named light level, the single field most callers want.",
                "type": "string"
              },
              "plants": {
                "description": "Plant types suited to this light level.",
                "type": "string"
              },
              "reasoning": {
                "description": "Why the score came out where it did, naming the aspect, glazing and distance contributions.",
                "type": "string"
              },
              "score": {
                "description": "The computed light score the band and verdict are derived from -- higher is brighter.",
                "type": "number"
              },
              "solarAspect": {
                "description": "That aspect mapped to its solar equivalent for the given hemisphere -- a south-facing window means the opposite thing north and south of the equator.",
                "type": "string"
              },
              "verdict": {
                "description": "One-line summary of what this window is good for.",
                "type": "string"
              },
              "verdictSub": {
                "description": "A supporting line qualifying the verdict.",
                "type": "string"
              }
            },
            "required": ["aspect", "band", "plants", "reasoning", "score", "solarAspect", "verdict", "verdictSub"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:143fc91cc5e0d31f88b28d98c054e1cba4c060cad794e71e77f459134bcf5d61"
        },
        {
          "name": "find_nearest_passing_color",
          "title": "Nearest WCAG-passing colour (hue-preserving)",
          "description": "Given a foreground/background hex pair, moves only the lightness of one side (hue and saturation held fixed) in the smallest step that clears a target WCAG contrast ratio, so a failing brand colour can be fixed without draining its hue. Defaults to the 4.5:1 normal-text AA threshold, matching the source page's fix buttons; pass a named threshold ('normal-aa', 'normal-aaa', 'large-aa', 'large-aaa', 'ui-aa') or a custom numeric ratio to target something else. Reports found:false when even pure black or white in that hue cannot reach the target -- that pair needs a different hue, not a different lightness.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adjust": {
                "description": "Which colour to move toward passing; the other one stays fixed.",
                "enum": ["foreground", "background"],
                "type": "string"
              },
              "background": {
                "description": "Background colour as a hex string, same format as foreground.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "foreground": {
                "description": "Foreground/text colour as a hex string, e.g. \"#6b7280\" (3- or 6-digit, leading # optional).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "target": {
                "anyOf": [
                  {
                    "enum": ["normal-aa", "normal-aaa", "large-aa", "large-aaa", "ui-aa"],
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                ],
                "default": "normal-aa",
                "description": "WCAG threshold to clear: 'normal-aa' 4.5:1 (default, matches the page's buttons), 'normal-aaa' 7:1, 'large-aa'/'ui-aa' 3:1, 'large-aaa' 4.5:1, or any custom positive ratio."
              }
            },
            "required": ["adjust", "background", "foreground"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adjust": {
                "description": "Which colour was moved, echoed from the input.",
                "enum": ["foreground", "background"],
                "type": "string"
              },
              "alreadyPassing": {
                "description": "True when the input pair already met the target and nothing needed moving.",
                "type": "boolean"
              },
              "currentRatio": {
                "description": "The ratio the original pair had.",
                "type": "number"
              },
              "direction": {
                "description": "Whether the colour was lightened or darkened; null when nothing moved.",
                "type": ["string", "null"]
              },
              "found": {
