        {
          "name": "generate_favicon_set",
          "title": "Generate a favicon and web-app-manifest set",
          "description": "Turns one source image into a complete favicon set: favicon.ico (a real multi-resolution ICO container holding 16, 32 and 48px PNG-encoded entries -- not a single-size file with an .ico extension), favicon-96x96.png, apple-touch-icon.png (180px, flattened onto backgroundColor because iOS paints transparency black there), web-app-manifest-192x192.png and web-app-manifest-512x512.png (optionally padded to Android's maskable safe zone -- the artwork shrunk to a centred 80%-width square on the background colour, reproducing the source tool's square padding rather than clipping to the actual inscribed-circle safe area), site.webmanifest, and the exact 5-line HTML <head> snippet (favicon.ico link, favicon-96x96.png link, apple-touch-icon link, apple-mobile-web-app-title meta, manifest link) ready to paste. A non-square source is centred on a transparent square canvas first, so nothing is stretched. Ported from GO AI's browser-based favicon tool, run server-side with @napi-rs/canvas instead of a DOM <canvas>. Every PNG and the .ico are small (a few KB to worst-case a couple hundred KB), so all six files are returned individually rather than zipped -- each name matters (favicon.ico and site.webmanifest belong at the site root) and there is no batching benefit to a ZIP at this size. The JSON result carries the manifest JSON text, the HTML snippet text, a per-file table of what each output is for, and a warning when the source is smaller than 512px on its longer side (the 512 icon will be upscaled). Fails with a clear message rather than throwing if the input cannot be decoded as an image.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "backgroundColor": {
                "default": "#ffffff",
                "description": "Hex colour (# optional, 3- or 6-digit) used three ways: the manifest's background_color field, the flatten colour behind the apple-touch-icon (iOS does not honour alpha there), and the padding colour around the maskable-cropped manifest icons.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "imageBase64": {
                "description": "Source image, base64-encoded. Any raster/SVG format @napi-rs/canvas can decode (PNG, JPEG, WebP, GIF, SVG). May be non-square and may carry transparency -- it is centred on a square canvas before anything else happens to it. Capped by this server's per-input byte limit.",
                "minLength": 1,
                "type": "string"
              },
              "maskablePadding": {
                "default": true,
                "description": "When true (default), the 192x192 and 512x512 manifest icons are padded: the artwork is shrunk to a centred 80%-width square on the background colour, matching Android's maskable-icon safe zone, and the manifest icons' \"purpose\" is set to \"maskable\". When false, those two icons are the plain resized artwork with \"purpose\": \"any\".",
                "type": "boolean"
              },
              "shortName": {
                "default": "",
                "description": "Short name for a home-screen label (roughly 12 characters fit). Used as the manifest's \"short_name\" and in the apple-mobile-web-app-title meta tag; falls back to siteName when empty.",
                "maxLength": 12,
                "type": "string"
              },
              "siteName": {
                "default": "My site",
                "description": "Full site name, used as the manifest's \"name\" field and as the fallback for short_name / the apple-mobile-web-app-title meta tag when shortName is empty.",
                "maxLength": 45,
                "type": "string"
              },
              "themeColor": {
                "default": "#0a0a0c",
                "description": "Hex colour (# optional, 3- or 6-digit) written to the manifest's theme_color field. Purely metadata -- never painted onto any icon.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["imageBase64"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "backgroundColor": {
                "description": "Background colour written into the manifest.",
                "type": "string"
              },
              "manifest": {
                "description": "A complete web app manifest as JSON text, ready to serve as site.webmanifest.",
                "type": "string"
              },
              "maskablePadding": {
                "description": "Whether the maskable icon was padded to survive Android's safe-zone crop.",
                "type": "boolean"
              },
              "snippet": {
                "description": "The <link> and <meta> tags to paste into the page head, matching the files that were generated.",
                "type": "string"
              },
              "sourceHeight": {
                "description": "Source image height in px.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "sourceWidth": {
                "description": "Source image width in px.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "squaredSide": {
                "description": "Side length of the square canvas the source was fitted onto, in px.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "table": {
                "description": "Every generated file and what it is for, so the set can be checked without unzipping it.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "file": {
                      "description": "Generated filename.",
                      "type": "string"
                    },
                    "sizes": {
                      "description": "Pixel dimensions the file covers.",
                      "type": "string"
                    },
                    "usedFor": {
                      "description": "Which browser, platform or surface asks for this file.",
                      "type": "string"
                    }
                  },
                  "required": ["file", "sizes", "usedFor"],
                  "type": "object"
                },
                "type": "array"
              },
              "themeColor": {
                "description": "Theme colour written into the manifest and meta tags.",
                "type": "string"
              },
              "warning": {
                "description": "A quality caution about the source image, chiefly that it was not square or too small. Null when there is nothing to flag.",
                "type": ["string", "null"]
              }
            },
            "required": ["backgroundColor", "manifest", "maskablePadding", "snippet", "sourceHeight", "sourceWidth", "squaredSide", "table", "themeColor", "warning"],
            "type": "object"
          },
