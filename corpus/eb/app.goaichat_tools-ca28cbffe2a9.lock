        {
          "name": "generate_app_icon_set",
          "title": "App icon set generator (iOS + Android)",
          "description": "Turns one source image into a ZIP containing a complete iOS Xcode AppIcon.appiconset (AppIcon.png at 1024x1024, plus a hand-written Contents.json Xcode accepts, and optionally AppIcon-Dark.png and AppIcon-Tinted.png for the appearance variants modern iOS asks for), a full Android mipmap-mdpi/hdpi/xhdpi/xxhdpi/xxxhdpi set of ic_launcher.png files (48/72/96/144/192px), and a flat sizes/ folder with 24 icon-<px>.png files from 16 to 1024px. Any transparency in the source is flattened onto the given background colour first (Apple rejects icons with alpha). A non-square source is centered and letterboxed onto a square canvas rather than stretched. Every output size is produced by repeatedly halving the source (a box-filter-equivalent downscale) before one final resize to the exact target, which keeps small icons sharp instead of muddy. The dark variant is a mechanical darken (source composited at 82% opacity over black) offered as a starting point, not a real design pass -- review it before shipping. The tinted variant is a Rec.709 greyscale luminance map, which is what iOS actually wants for that slot (it applies the colour itself). The JSON result reports the source dimensions, whether it had transparency, the file count, and two non-fatal warnings when the source was not square or not exactly 1024px on its longest side. Always returns as a resource_link (a 30+ file ZIP is never small enough to inline) -- fetch the link to get the archive.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "backgroundColor": {
                "default": "#ffffff",
                "description": "CSS/hex colour (e.g. \"#ffffff\") used to flatten transparency and to pad a non-square source before it is centered onto a square canvas.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "imageBase64": {
                "description": "Base64-encoded source image bytes (PNG, JPEG, or WebP). 1024x1024 is ideal; anything else is padded to square and/or scaled.",
                "minLength": 1,
                "type": "string"
              },
              "variants": {
                "default": "all",
                "description": "Which iOS appearance variants to include alongside the required light AppIcon.png. 'none': light only. 'dark': light + AppIcon-Dark.png. 'all': light + AppIcon-Dark.png + AppIcon-Tinted.png. Contents.json is written to match whichever set is chosen.",
                "enum": ["none", "dark", "all"],
                "type": "string"
              }
            },
            "required": ["imageBase64"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "backgroundColor": {
                "description": "The colour transparency was flattened onto, and the letterbox colour for a non-square source.",
                "type": "string"
              },
              "files": {
                "description": "Every file in the archive, so the contents can be checked without unzipping it.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "height": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Height in px, or null for a non-image entry such as Contents.json."
                    },
                    "path": {
                      "description": "Path of the file inside the ZIP.",
                      "type": "string"
                    },
                    "where": {
                      "description": "Which part of the set this file belongs to (the Xcode appiconset, an Android mipmap bucket, or the flat sizes folder).",
                      "type": "string"
                    },
                    "width": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Width in px, or null for a non-image entry such as Contents.json."
                    }
                  },
                  "required": ["height", "path", "where", "width"],
                  "type": "object"
                },
                "type": "array"
              },
              "filesOut": {
                "description": "Total number of files inside the ZIP.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "hadAlpha": {
                "description": "True when the source carried transparency, which was flattened onto backgroundColor because Apple rejects icons with alpha.",
                "type": "boolean"
