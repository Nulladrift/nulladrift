              },
              "durationSeconds": {
                "description": "Duration of the produced clip in seconds. mp4/webm output only.",
                "type": "number"
              },
              "format": {
                "description": "Output format. This field decides which of the conditional fields below are present.",
                "enum": ["gif", "mp4", "webm"],
                "type": "string"
              },
              "frameCount": {
                "description": "Number of frames encoded. GIF output only.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "height": {
                "description": "Output height in px.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "maxColors": {
                "description": "Palette size the median-cut quantiser was allowed. GIF output only.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "maxOutputPixels": {
                "description": "The ceiling outputPixels was checked against, so a rejection is explicable from the result.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "motion": {
                "description": "Playback behaviour applied.",
                "enum": ["loop", "bounce", "once"],
                "type": "string"
              },
              "outputPixels": {
                "description": "Width x height x frames -- the bound that actually governs this tool's memory use.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "requestedFps": {
                "description": "The frame rate that was asked for.",
                "type": "number"
              },
              "speed": {
                "description": "Speed multiplier applied to the source.",
                "type": "number"
              },
              "trimEnd": {
                "description": "End of the trimmed span in seconds. GIF output only.",
                "type": "number"
              },
              "trimSpan": {
                "description": "Length of the trimmed span in seconds. GIF output only.",
                "type": "number"
              },
              "trimStart": {
                "description": "Start of the trimmed span in seconds. GIF output only.",
                "type": "number"
              },
              "width": {
                "description": "Output width in px.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["actualFps", "byteSize", "format", "height", "maxOutputPixels", "motion", "outputPixels", "requestedFps", "speed", "width"],
            "type": "object"
