                "minimum": 1,
                "type": "integer"
              },
              "quality": {
                "default": 75,
                "description": "Encoder quality, 5-100 (matches the source's slider range). Defaults to 75. 100 is the least-lossy setting the encoder offers, not truly lossless.",
                "maximum": 100,
                "minimum": 5,
                "type": "integer"
              }
            },
            "required": ["imageBase64"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "compressed": {
                "additionalProperties": false,
                "description": "The returned file. Its bytes come back as a separate content block.",
                "properties": {
                  "bytes": {
                    "description": "Output file size in bytes.",
                    "maximum": 9007199254740991,
