      "tools": [
        {
          "name": "appstore_compare_markets",
          "title": "Compare an App Store listing across markets",
          "description": "Looks up one app (by numeric App Store id, or a pasted apps.apple.com URL) in up to 30 App Store storefronts in a single call, via Apple's public iTunes Lookup API, and reports per-market availability, localized title, price and rating. Capped at 30 storefronts per call by design -- there are 173 total App Store storefronts, and this deliberately never sweeps all of them in one call; call again with a different storefronts list to cover more markets. Lookups run one at a time with a short pause between each (matching the pacing the source browser tool uses for its 30-market quick-compare), so a full 30-market call takes roughly ten seconds, not an instant burst.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "appIdOrUrl": {
                "description": "Numeric App Store id (e.g. \"6742322421\") or a full apps.apple.com URL containing one.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "storefronts": {
                "description": "Up to 30 2-letter storefront codes (e.g. [\"US\",\"GB\",\"JP\"]) after de-duplication. Omit to use the same 30 major markets the source tool defaults to.",
                "items": {
                  "maxLength": 16,
                  "type": "string"
                },
                "maxItems": 120,
                "type": "array"
              }
            },
            "required": ["appIdOrUrl"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "The app ID that was looked up, extracted from the input if a URL was given.",
                "type": "string"
              },
              "checked": {
                "description": "How many storefronts were queried.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "distinctTitles": {
                "description": "Number of different titles seen across the storefronts that resolved -- more than one means the listing is localized.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "failed": {
                "description": "How many lookups errored rather than returning a verdict.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "found": {
                "description": "How many of them have the app listed.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "rows": {
                "description": "One row per requested storefront, in the order given. A row is one of three shapes: listed, not listed, or errored.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available": {
                      "description": "Whether the app is listed on this storefront. When false, the listing fields below are absent.",
                      "type": "boolean"
                    },
                    "country": {
                      "description": "Storefront code.",
                      "type": "string"
                    },
                    "countryName": {
                      "description": "Storefront name.",
                      "type": "string"
                    },
                    "currency": {
                      "description": "ISO currency code; present only when available.",
                      "type": ["string", "null"]
                    },
                    "error": {
                      "description": "Why this storefront could not be checked. Present only on a failed lookup, which also reports available:false.",
                      "type": "string"
                    },
                    "price": {
                      "description": "Formatted local price; present only when available.",
                      "type": ["string", "null"]
                    },
                    "rating": {
                      "description": "Average rating on this storefront; present only when available.",
                      "type": ["number", "null"]
                    },
                    "ratingCount": {
                      "description": "Rating count on this storefront; present only when available.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "storeLink": {
                      "description": "Local listing URL; present only when available.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "description": "App name on this storefront; present only when available.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["available", "country", "countryName"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["appId", "checked", "distinctTitles", "failed", "found", "rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4797ea1b24934d4a8c01d11c1e1c5a2747a72f26922ebd7b3f50cebf22f75fd0"
        },
        {
          "name": "appstore_search",
          "title": "Search an App Store storefront",
          "description": "Searches one Apple App Store country storefront by term, via Apple's public iTunes Search API (the same request the GO AI \"App Store storefront checker\" tool makes from the browser), and returns matching apps with title, seller, price, rating and a direct App Store link. Returns up to 200 results, Apple's own per-request maximum -- a result of exactly 200 likely means more exist. Results are ordered by Apple's internal relevance, which does not match the ranked list shown in the App Store app, so this cannot be used to track keyword rank.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "2-letter App Store storefront code, e.g. \"US\", \"GB\", \"JP\". Defaults to \"US\".",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "entity": {
                "default": "software",
                "description": "App type: \"software\" (iPhone), \"iPadSoftware\" (iPad), or \"macSoftware\" (Mac).",
                "enum": ["software", "iPadSoftware", "macSoftware"],
                "type": "string"
              },
              "term": {
                "description": "Search phrase, up to 200 characters. Sent verbatim to Apple's Search API as the query term.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "apps": {
                "description": "The matching apps. Every field is nullable because Apple omits fields per storefront rather than returning empty values.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "appId": {
                      "description": "Numeric App Store app ID as a string, or null if Apple omitted it.",
                      "type": ["string", "null"]
                    },
                    "artworkUrl": {
                      "description": "100px artwork URL.",
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "description": "ISO currency code for that price.",
                      "type": ["string", "null"]
                    },
                    "price": {
                      "description": "Formatted price as Apple returns it, including the currency symbol.",
                      "type": ["string", "null"]
                    },
                    "rating": {
                      "description": "Average user rating, or null when the app has none on this storefront.",
                      "type": ["number", "null"]
                    },
                    "ratingCount": {
                      "description": "Number of ratings; 0 when Apple reports none.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "seller": {
                      "description": "Publisher name.",
                      "type": ["string", "null"]
                    },
                    "storeLink": {
                      "description": "Canonical apps.apple.com URL for the listing.",
                      "type": ["string", "null"]
                    },
                    "title": {
                      "description": "App name on this storefront.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["appId", "artworkUrl", "currency", "price", "rating", "ratingCount", "seller", "storeLink", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "capped": {
                "description": "True when the result hit the Search API's 200-per-request ceiling, meaning there are likely more matches than were returned.",
                "type": "boolean"
              },
              "country": {
                "description": "The storefront that was searched.",
                "type": "string"
              },
              "entity": {
                "description": "Which catalogue was searched (iPhone, iPad or Mac software).",
                "type": "string"
              },
              "resultCount": {
                "description": "Apple's own reported match count for the query.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "term": {
                "description": "The search term, echoed back.",
                "type": "string"
              }
            },
            "required": ["apps", "capped", "country", "entity", "resultCount", "term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:236c8cbec85a0ec3c180e17055127442257b196e037b0865005199c89ddd105d"
        },
        {
          "name": "bpm_delay_calculator",
          "title": "BPM tap tempo & delay time calculator",
          "description": "Resolves a musical tempo — either a direct BPM, or a set of tap timestamps/intervals run through the same median-filtered outlier rejection and 2-second session-reset logic as GO AI's tap-tempo tool — then returns the full straight/dotted/triplet delay and LFO-rate table (ms and Hz) for a set of note divisions, plus bar-length and bars<->seconds conversion for a time signature. All arithmetic (not a real audio engine) — useful for setting delay/reverb/LFO times to a track's tempo.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bars": {
                "description": "Number of bars to convert to seconds. At most one of bars/seconds is used if both are given (bars takes priority).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "bpm": {
                "description": "Tempo in beats per minute, used directly and unrounded. Provide exactly one of bpm, tapTimesMs, or tapIntervalsMs.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "divisions": {
                "description": "Note divisions (denominator of 1/d) to include in the delay table, up to 64. Defaults to [1,2,4,8,16,32].",
                "items": {
                  "exclusiveMinimum": 0,
                  "maximum": 9007199254740991,
                  "type": "integer"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array"
              },
              "seconds": {
                "description": "Number of seconds to convert to bars. Ignored if bars is also given.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "tapIntervalsMs": {
                "description": "Milliseconds between each tap and the one before it (one fewer entry than the number of taps), up to 4096. Provide exactly one of bpm, tapTimesMs, or tapIntervalsMs.",
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "number"
                },
                "maxItems": 4096,
                "minItems": 1,
                "type": "array"
              },
              "tapTimesMs": {
                "description": "Strictly increasing millisecond timestamps of taps (e.g. from a high-resolution clock), in tap order, up to 4096. Provide exactly one of bpm, tapTimesMs, or tapIntervalsMs.",
                "items": {
                  "type": "number"
                },
                "maxItems": 4096,
                "minItems": 2,
                "type": "array"
              },
              "timeSignature": {
                "anyOf": [
                  {
                    "enum": ["4/4", "3/4", "2/4", "6/8", "5/4", "7/8", "12/8"],
                    "type": "string"
                  },
                  {
                    "properties": {
                      "beats": {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      },
                      "unit": {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      }
                    },
                    "required": ["beats", "unit"],
                    "type": "object"
                  }
                ],
                "description": "One of \"4/4\",\"3/4\",\"2/4\",\"6/8\",\"5/4\",\"7/8\",\"12/8\" (the site's presets), or a custom {beats, unit} pair. Defaults to 4/4. Uses the written beat count — 6/8 is 6 beats of an eighth-note unit, not 2 dotted-quarter beats."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "barDurationSeconds": {
                "description": "Length of one bar in seconds at this tempo and signature.",
                "type": "number"
              },
              "bars": {
                "description": "The bar count that seconds corresponds to. Present only when bars or seconds was supplied.",
                "type": "number"
              },
              "bpm": {
                "description": "The tempo the table was computed at, in beats per minute.",
                "type": "number"
              },
              "bpmSource": {
                "description": "Where that tempo came from: given directly, or averaged from tap times or tap intervals -- worth surfacing, since a tapped tempo carries the tapper's error.",
                "type": "string"
              },
              "delayTable": {
                "description": "One row per requested division, each with straight, dotted and triplet timings.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "division": {
                      "description": "The note division, as its denominator (4 = quarter note, 8 = eighth, and so on).",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "dottedMs": {
                      "description": "Dotted variant: 1.5x the straight time.",
                      "type": "number"
                    },
                    "hz": {
                      "description": "The same interval expressed as a frequency, for setting an LFO rate rather than a delay.",
                      "type": "number"
                    },
                    "label": {
                      "description": "That division written out.",
                      "type": "string"
                    },
                    "straightMs": {
                      "description": "Delay time in milliseconds for the straight note.",
                      "type": "number"
                    },
                    "tripletMs": {
                      "description": "Triplet variant: two thirds of the straight time.",
                      "type": "number"
                    }
                  },
                  "required": ["division", "dottedMs", "hz", "label", "straightMs", "tripletMs"],
                  "type": "object"
                },
                "type": "array"
              },
              "seconds": {
                "description": "Duration in seconds of that many bars at this tempo. Present only when bars or seconds was supplied.",
                "type": "number"
              },
              "timeSignature": {
                "additionalProperties": false,
                "description": "The time signature used to size a bar.",
                "properties": {
                  "beats": {
                    "description": "Beats per bar (the numerator).",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "label": {
                    "description": "The signature written out, e.g. '4/4'.",
                    "type": "string"
                  },
                  "unit": {
                    "description": "Note value that gets the beat (the denominator).",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["beats", "label", "unit"],
                "type": "object"
              }
            },
            "required": ["barDurationSeconds", "bpm", "bpmSource", "delayTable", "timeSignature"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7bfba60135049f67496a06ca9cb26701d9cc57b09d4cf1f3502dd3359f0b6a1e"
        },
        {
          "name": "build_app_privacy_label",
          "title": "Build an App Store privacy label checklist",
          "description": "Given which SDKs and features are present in an iOS app (analytics, crash reporting, ads, attribution, accounts, in-app purchases, location, HealthKit, contacts, search, etc.), returns the App Store Connect privacy data types those items most likely require declaring, grouped the way Apple groups them (Contact info, Identifiers, Usage data, Diagnostics, ...), each with the reason (which chosen item(s) caused it), plus whether App Tracking Transparency/tracking applies and the vendor-documentation date the mapping was checked against. This is a fixed, deterministic lookup table shipped with GO AI's privacy-label-builder page -- not a code scanner and not compliance advice. SDKs change what they collect (sometimes in a minor version) and app configuration changes it further, so treat the result as a starting checklist to verify against each SDK's current documentation, not an answer to submit as-is.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "description": "SDKs/features present in the app binary. One or more of: firebaseAnalytics, crashlytics, sentry, amplitude, admob, metaSdk, attribution, push, accounts, signInApple, iap, revenuecat, support, userPhotos, preciseLocation, healthKit, contactsAccess, search. Repeats are ignored.",
                "items": {
                  "enum": ["firebaseAnalytics", "crashlytics", "sentry", "amplitude", "admob", "metaSdk", "attribution", "push", "accounts", "signInApple", "iap", "revenuecat", "support", "userPhotos", "preciseLocation", "healthKit", "contactsAccess", "search"],
                  "type": "string"
                },
                "maxItems": 18,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "checklistText": {
                "description": "The whole result as pasteable plain text, for dropping into a ticket or a submission checklist.",
                "type": "string"
              },
              "dataTypeCount": {
                "description": "Total number of distinct data types to declare across all groups.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "disclaimer": {
                "description": "Standing note that this is a deterministic lookup, not a code scan and not compliance advice.",
                "type": "string"
              },
              "groups": {
                "description": "Data types to declare, grouped the way App Store Connect groups them.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dataTypes": {
                      "description": "The data types to declare under this group.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "causedBy": {
                            "description": "Which of the chosen items pulled this data type in -- the audit trail for the entry.",
                            "items": {
                              "type": "string"
                            },
                            "type": "array"
                          },
                          "id": {
                            "description": "Stable identifier for the data type.",
                            "type": "string"
                          },
                          "label": {
                            "description": "The data type as Apple names it.",
                            "type": "string"
                          }
                        },
                        "required": ["causedBy", "id", "label"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "id": {
                      "description": "Stable identifier for the App Store Connect group.",
                      "type": "string"
                    },
                    "label": {
                      "description": "The group name as Apple presents it, e.g. 'Identifiers', 'Usage Data'.",
                      "type": "string"
                    }
                  },
                  "required": ["dataTypes", "id", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "sdkCount": {
                "description": "How many distinct SDKs/features were considered, after repeats collapse.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "trackingNote": {
                "description": "Explanation of the tracking verdict and what it obliges.",
                "type": "string"
              },
              "trackingRequired": {
                "description": "True when at least one chosen item implies App Tracking Transparency / the \"Used to Track You\" declaration.",
                "type": "boolean"
              },
              "vendorDocumentationAsOf": {
                "description": "The date this mapping table was last checked against vendor documentation -- SDKs change what they collect, so this bounds how much to trust the answer.",
                "type": "string"
              }
            },
            "required": ["checklistText", "dataTypeCount", "disclaimer", "groups", "sdkCount", "trackingNote", "trackingRequired", "vendorDocumentationAsOf"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f3375953b6e6e636d4b321854d0df181d3d7d3dc11450111923cf4e0f6a4fef7"
        },
        {
          "name": "build_app_store_link",
          "title": "App Store campaign link builder + QR code",
          "description": "Builds a correct apps.apple.com URL for an app ID or a pasted App Store URL, in a chosen two-letter storefront, with optional App Store Connect campaign attribution parameters (pt, ct, and mt=8). Always returns the assembled URL and a params table describing what each part does. When includeQr is true, also renders the URL as a QR code PNG using the same hand-rolled, dependency-free Reed-Solomon byte-mode encoder (error-correction level M, versions 1-10) the source browser page draws to its own <canvas> -- not a generic QR library, so the module layout, masking, and pixel output match that page exactly. The encoder tops out at 213 UTF-8 bytes for the assembled URL (version 10 ceiling); a longer URL fails cleanly naming the byte counts rather than returning a broken code -- shorten pt/ct or call again with includeQr:false to still get the plain URL. The storefront code is not checked against the list of real App Store storefronts -- a well-formed but unused code just will not have the app listed on it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "appIdOrUrl": {
                "description": "Numeric App Store app ID (e.g. \"6478912345\"), or a full pasted App Store URL containing one (e.g. \"https://apps.apple.com/us/app/x/id6478912345\"). The id is extracted from anywhere in a URL; a bare value must be 4+ digits with nothing else, and at most 24 digits either way.",
                "maxLength": 2048,
                "minLength": 1,
                "type": "string"
              },
              "ct": {
                "description": "Campaign token (ct) for App Store Connect campaign attribution, up to 256 characters. Trimmed; omitted from the URL entirely if empty after trimming.",
                "maxLength": 256,
                "type": "string"
              },
              "includeQr": {
                "default": false,
                "description": "Also render the URL as a QR code PNG and return it as image bytes. Defaults to false (URL + params only).",
                "type": "boolean"
              },
              "mt": {
                "default": true,
                "description": "Append mt=8 (media type: software), marking the link as pointing at an app. Defaults to true, matching the source page's checkbox (checked by default).",
                "type": "boolean"
              },
              "pt": {
                "description": "Provider token (pt) for App Store Connect campaign attribution, up to 256 characters. Trimmed; omitted from the URL entirely if empty after trimming.",
                "maxLength": 256,
                "type": "string"
              },
              "store": {
                "description": "2-letter App Store storefront code (e.g. \"us\", \"gb\", \"jp\"). Decides which country's listing, price, and availability the link opens.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["appIdOrUrl", "store"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appId": {
                "description": "The numeric app ID, whether given directly or extracted from a pasted URL.",
                "type": "string"
              },
              "params": {
                "description": "Every query parameter in the URL, explained.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "meaning": {
                      "description": "What that parameter does, since App Store Connect campaign parameters are not self-explanatory.",
                      "type": "string"
                    },
                    "param": {
                      "description": "Query parameter name.",
                      "type": "string"
                    },
