                  }
                },
                "required": ["height", "maxDimension", "width"],
                "type": "object"
              }
            },
            "required": ["format", "original", "points", "working"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
