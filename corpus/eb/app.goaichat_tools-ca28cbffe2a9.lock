        {
          "name": "recipe_convert_ingredient",
          "title": "Cup-to-grams converter (per-ingredient density)",
          "description": "Converts an amount of one ingredient between cup, tablespoon, teaspoon, millilitre, gram and ounce using that specific ingredient's own USDA FoodData Central portion weight, not a single water-based figure applied to everything -- a cup of flour (125 g) and a cup of honey (339 g) do not weigh the same. Supports an ingredient's own measurement-style variants where USDA publishes more than one (packed vs loose brown sugar, sifted vs unsifted powdered sugar, whole vs sliced/slivered/ground nuts, etc.), and for baking powder, baking soda and yeast uses USDA's own published teaspoon weight rather than dividing the cup weight by 48, since a spoon measurement of a fine powder is not proportionate to its cup measurement. Also reports, for information, what a generic water-density converter would have said for the same input and by how much that would have been wrong -- omitted when the requested unit is already grams or ounces.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount": {
                "description": "Amount as a decimal (\"1.5\"), a simple fraction (\"3/4\"), or a mixed number (\"1 1/2\").",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "cupSizeMl": {
                "default": 236.588,
                "description": "Cup size in ml, for the 'cup' unit (and 'tbsp'/'tsp' on ingredients without their own USDA spoon weight). Defaults to the US customary cup (236.588 ml); other common values are 240 (US nutrition-label cup) or 250 (metric cup). Does not affect the reported density, which is always derived from the customary cup regardless of this value, matching the source tool.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "ingredient": {
                "description": "Which ingredient to convert, identified by its GO AI recipe-tool id (e.g. \"flour-ap\", \"sugar-brown\", \"honey\").",
                "enum": ["flour-ap", "flour-bread", "flour-cake", "flour-ww", "cornstarch", "sugar-white", "sugar-brown", "sugar-icing", "cocoa", "butter", "oil-olive", "oil-canola", "milk", "buttermilk", "cream", "sourcream", "creamcheese", "yogurt", "water", "egg", "honey", "maple", "molasses", "peanutbutter", "salt", "bakingpowder", "bakingsoda", "yeast", "oats", "rice", "almonds", "walnuts", "pecans", "raisins", "chocchips", "parmesan"],
                "type": "string"
              },
              "unit": {
                "description": "Unit the amount is given in.",
                "enum": ["cup", "tbsp", "tsp", "ml", "g", "oz"],
                "type": "string"
              },
              "variant": {
                "description": "Measurement style for ingredients that have more than one USDA figure (e.g. sugar-brown: \"packed\"/\"loose\"; sugar-icing: \"unsifted\"/\"sifted\"; almonds: \"whole\"/\"sliced\"/\"slivered\"/\"ground\"). Omit for ingredients with only one style.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["amount", "ingredient", "unit"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "densityGPerMl": {
                "description": "The density used for this ingredient, in grams per millilitre.",
                "type": "number"
              },
              "densityGPerMlRounded": {
                "description": "That density rounded for display.",
                "type": "number"
              },
              "grams": {
                "description": "The converted weight in grams, unrounded.",
                "type": "number"
              },
              "gramsRounded": {
                "description": "The same weight rounded the way a kitchen scale reads it -- the number to actually use.",
                "type": "number"
              },
              "ounces": {
                "description": "The converted weight in ounces, unrounded.",
                "type": "number"
              },
              "ouncesRounded": {
                "description": "The same weight in ounces, rounded for practical use.",
                "type": "number"
              },
              "waterComparison": {
                "description": "How this ingredient compares in weight to the same volume of water -- the intuition that explains why a cup of flour and a cup of honey are nothing alike.",
                "type": "string"
              },
              "workSentence": {
                "description": "The conversion written out as an equation, so the caller can check the cup size and density rather than trusting a bare number.",
                "type": "string"
              }
            },
            "required": ["densityGPerMl", "densityGPerMlRounded", "grams", "gramsRounded", "ounces", "ouncesRounded", "waterComparison", "workSentence"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c66b3aeeb3ebca7b61fafeb304a993d4e2c0cd30aedcb25ecff54fb9a86064a3"
        },
        {
          "name": "recipe_scale",
          "title": "Recipe servings scaler with gram weights",
          "description": "Scales a pasted recipe (one ingredient per array entry, e.g. '2 cups all-purpose flour') from one servings count to another, multiplying each line's leading amount by the ratio and reformatting it as a whole number or simple/mixed fraction rather than a decimal. When a line's unit and ingredient can both be recognised against GO AI's density table, appends the scaled amount's weight in grams in parentheses; lines already given in grams or ounces, lines whose ingredient isn't recognised, and lines that don't start with a parseable amount are returned unchanged (the last completely as-is, typos included).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "cupSizeMl": {
                "default": 236.588,
                "description": "Cup size in ml used when converting a scaled \"cup\"/\"tbsp\"/\"tsp\" amount to grams. Defaults to the US customary cup (236.588 ml); other common values are 240 or 250.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "fromServings": {
                "default": 1,
                "description": "Servings the recipe as written makes. 0 (or an omitted field) falls back to 1, matching the source tool's own guard.",
                "type": "number"
              },
              "lines": {
                "description": "One ingredient per array entry, as free text (e.g. \"2 cups all-purpose flour\", \"1/2 tsp table salt\"), up to 500 lines of 1000 characters each. Lines with no parseable leading amount, or with an amount but no recognisable unit/ingredient after it, are returned unchanged.",
                "items": {
                  "maxLength": 1000,
                  "type": "string"
                },
                "maxItems": 500,
                "type": "array"
              },
              "toServings": {
                "default": 1,
                "description": "Servings wanted. 0 (or an omitted field) falls back to 1, matching the source tool's own guard.",
                "type": "number"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "lines": {
                "description": "The ingredient lines rescaled, one output line per input line and in the same order. A line whose quantity could not be parsed is returned unchanged rather than dropped, so the list stays aligned with the recipe it came from.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:83c206d1bcae4f5c42432854f823ca6c1620d4b3b39b18660c11e135a450e1f9"
        },
        {
          "name": "recommend_ai_model",
          "title": "Recommend which AI model to use for a task",
          "description": "Static editorial recommendation -- NOT a live benchmark or leaderboard -- for which of six AI models (GPT-5, Gemini, Grok 4, Claude, DeepSeek, Kimi) to use for a given kind of task, ported from GO AI's own daily side-by-side-use judgement, current as of August 2026. Pick a task and get the recommended model plus the reasoning and a second-opinion backup. The optional `priority` can bias the pick toward cost (routes to DeepSeek) or freshness (routes to Grok) instead of the default quality pick -- but only for tasks where that tradeoff is actually offered; otherwise the quality default is returned unchanged. This reflects one team's opinion, not measured accuracy or pricing data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "priority": {
                "default": "quality",
                "description": "\"quality\" (default) returns the task's default best-result pick. \"cost\" swaps to DeepSeek when this task supports a cheaper substitute. \"fresh\" swaps to Grok when this task supports a fresher/more current substitute. Has no effect for tasks that don't offer that tradeoff.",
                "enum": ["quality", "cost", "fresh"],
                "type": "string"
              },
              "task": {
                "description": "The kind of task, one of: write (Long or structured writing), copy (Punchy copy, hooks, social), edit (Editing my own draft), longdoc (Summarising long documents), code (Writing code), review (Reviewing code someone else wrote), math (Maths and calculations), news (Current events, what's trending), research (Research and synthesis), translate (Translation), brainstorm (Brainstorming ideas), voice (Talking out loud), prose (Prose you'll publish as-is), longinput (Very long inputs on a budget), image (Generating images), video (Generating video), bulk (Running the same prompt hundreds of times).",
                "enum": ["write", "copy", "edit", "longdoc", "code", "review", "math", "news", "research", "translate", "brainstorm", "voice", "prose", "longinput", "image", "video", "bulk"],
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adjusted": {
                "description": "True when the stated priority (cost or freshness) moved the answer away from the quality-first pick.",
                "type": "boolean"
              },
              "backup": {
                "description": "A second choice worth trying if the first does not suit.",
                "type": "string"
              },
              "disclaimer": {
                "description": "Standing note that this is a fixed editorial table, not a live benchmark.",
                "type": "string"
              },
              "model": {
                "description": "The recommended model's display name.",
                "type": "string"
              },
              "modelKey": {
                "description": "Stable identifier for the recommended model, safe to switch on.",
                "type": "string"
              },
              "note": {
                "description": "What that adjustment was, when adjusted is true; otherwise null.",
                "type": ["string", "null"]
              },
              "tag": {
                "description": "Short label for why this model wins the task, e.g. its standout strength.",
                "type": "string"
              },
              "taskLabel": {
                "description": "Human-readable name of the task that was matched.",
                "type": "string"
              },
              "why": {
                "description": "The reasoning behind the recommendation.",
                "type": "string"
              }
            },
            "required": ["adjusted", "backup", "disclaimer", "model", "modelKey", "note", "tag", "taskLabel", "why"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:57b1a27a9d36f714bb8de4dc15a806ccb8ca9f7197c11ae44b8b68c32c71caa0"
        },
        {
          "name": "render_app_store_screenshot",
          "title": "App Store screenshot generator",
          "description": "Composite one or more app screenshots into a drawn device frame (rounded bezel, Dynamic Island on phone-shaped canvases) with a gradient background and optional headline/caption text, and export as PNG at any/all of the 4 official App Store Connect sizes. A blank page (image omitted) draws no device, for a title card or an outro. A device positioned past the edge of its page is drawn spilling onto the neighbouring page too, so a set can run one screenshot into the next. LIMITS — this runs on a small shared host, so an over-limit call is refused immediately, before any rendering, with a message saying how to split it: at most 10 pages at any one size, 2 at size:\"all\" (which renders every page 4 times over — a longer set needs one call per size); at most 12 rendered PNGs per call (pages x sizes); 6 MP per screenshot and 4 MB of screenshot bytes summed across the whole call (send JPEG, not PNG, for a multi-page set); and at most 40 text layers of 512 characters each.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "backgroundFrom": {
                "default": "#12121a",
                "description": "Gradient start color (top-left), hex.",
                "maxLength": 512,
                "type": "string"
              },
              "backgroundTo": {
                "default": "#2b2140",
                "description": "Gradient end color (bottom-right), hex.",
                "maxLength": 512,
                "type": "string"
              },
              "joinedScene": {
                "default": false,
                "description": "When true and there is more than one page, one gradient stretches across the whole set instead of repeating per page.",
                "type": "boolean"
              },
              "pages": {
                "description": "One entry per exported page/PNG, in order. Use null for a blank page. At most 10 pages at any single size; size:\"all\" renders every page 4 times over and fits 2. Over that, the call is refused before any rendering.",
                "items": {
                  "anyOf": [
                    {
                      "properties": {
                        "device": {
                          "description": "Position/size/rotation of the device frame on this page. Only meaningful when imageBase64 is present.",
                          "properties": {
                            "dx": {
                              "default": 0,
                              "description": "Horizontal offset from the device band centre, as a fraction of the canvas width. Positive = right. Limited to +/-1.",
                              "maximum": 1,
                              "minimum": -1,
                              "type": "number"
                            },
                            "dy": {
                              "default": 0,
                              "description": "Vertical offset from the device band centre, as a fraction of the canvas height. Positive = down. Limited to +/-1.",
                              "maximum": 1,
                              "minimum": -1,
                              "type": "number"
                            },
                            "rotationDeg": {
                              "default": 0,
                              "description": "Device rotation in degrees, +/-90.",
                              "maximum": 90,
                              "minimum": -90,
                              "type": "number"
                            },
                            "scale": {
                              "default": 1,
                              "description": "Device size multiplier; 1 = the default size that fits the band. Limited to 0.05-1.5.",
                              "maximum": 1.5,
                              "minimum": 0.05,
                              "type": "number"
                            }
                          },
                          "type": "object"
                        },
                        "imageBase64": {
                          "description": "Base64 screenshot bytes for this page: at most 6 megapixels (13\" iPad native, 2064x2752, is 5.68 MP), and at most 4 MB of decoded bytes SUMMED over every page in the call (the whole JSON body is capped at 6 MB). For a multi-page set send JPEG, not PNG — quality 80 is typically a quarter the size and indistinguishable once scaled into a device frame. Omit for a blank page (title card / outro / continuation of a device from the previous page).",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    {
                      "type": "null"
                    }
                  ]
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "size": {
                "default": "6.9",
                "description": "Which official App Store Connect size to export: 6.9\"/6.7\"/6.5\" iPhone or 13\" iPad, or \"all\" for every size (returned as a ZIP). \"all\" renders 4 canvases per page, so it is limited to 2 pages per call; for a longer set, make one call per size — a single-size call carries all 10.",
                "enum": ["6.9", "6.7", "6.5", "13ipad", "all"],
                "type": "string"
              },
              "texts": {
                "default": [],
                "description": "Zero or more text layers, at most 40. Order is z-order (later entries draw on top); each is confined to one page.",
                "items": {
                  "properties": {
                    "autoFit": {
                      "default": true,
                      "description": "Shrink-to-fit within its fitGroup so the text never exceeds 3 lines or the wrap width.",
                      "type": "boolean"
                    },
                    "color": {
                      "default": "#f7f7f5",
                      "description": "CSS hex color.",
                      "maxLength": 512,
                      "type": "string"
                    },
                    "dx": {
                      "default": 0,
                      "description": "Horizontal offset from the page centre, as a fraction of canvas width. Limited to +/-1.",
                      "maximum": 1,
                      "minimum": -1,
                      "type": "number"
                    },
                    "dy": {
                      "default": 0,
                      "description": "Vertical offset from the default first-baseline position, as a fraction of canvas height. Limited to +/-1.",
                      "maximum": 1,
                      "minimum": -1,
                      "type": "number"
                    },
                    "fitGroup": {
                      "description": "Texts sharing a fitGroup id are auto-fit together at one common size (e.g. the same headline repeated across every page). Omit for an independently-sized text.",
                      "maxLength": 64,
                      "type": "string"
                    },
                    "fontFamily": {
                      "default": "Urbanist",
                      "enum": ["Urbanist", "Inter", "Poppins", "Montserrat", "Manrope", "Rubik", "Nunito", "Fredoka", "Space Grotesk", "Oswald", "Bebas Neue", "Anton", "Archivo Black", "Playfair Display", "DM Serif Display", "Merriweather", "Lora", "Georgia", "JetBrains Mono", "Courier", "Caveat", "Pacifico"],
                      "type": "string"
                    },
                    "fontSizeScale": {
                      "default": 1,
                      "description": "Multiplier on the auto-fit size; ignored while autoFit is true.",
                      "exclusiveMinimum": 0,
                      "maximum": 4,
                      "type": "number"
                    },
                    "page": {
                      "description": "0-based index into `pages` this text is anchored to.",
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "rotationDeg": {
                      "default": 0,
                      "description": "Rotation in degrees about the centre of the first line's baseline.",
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    },
                    "text": {
                      "description": "The text content, at most 512 characters. \"\\n\" forces a line break; otherwise it wraps to fit `width`.",
                      "maxLength": 512,
                      "type": "string"
                    },
                    "width": {
