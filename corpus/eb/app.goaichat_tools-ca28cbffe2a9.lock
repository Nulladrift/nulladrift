        {
          "name": "resize_images",
          "title": "Batch image resizer with real presets",
          "description": "Resizes a batch of 1+ images to a named real-world preset (App Store screenshots, Open Graph/social cards, Android launcher icon densities, a favicon set) or a custom width/height, using contain (whole picture, padded), cover (fills the frame, crops overflow) or stretch (distorts to fit) fitting. Each resized image is PNG-encoded (EXIF/ICC metadata stripped on re-encode, matching the source page) and every image is auto-rotated per its embedded EXIF orientation before resizing. All outputs are packaged into one uncompressed ZIP (PNG bytes are already compressed, so a second pass would not shrink them), foldered by preset (e.g. \"social/photo-1200x630.png\", or \"android/mipmap-hdpi/icon.png\" for the Android density preset, which names each size's folder after its density instead of suffixing the pixel size). This always returns as a resource_link (a batch ZIP is never small enough, or singular enough, to inline) -- fetch the link to get the archive. Per-file output dimensions and byte sizes are reported in the JSON result. Each input image (base64) is capped by this server's per-input byte limit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "customHeight": {
                "default": 630,
                "description": "Target height in px. Only used when preset is \"custom\".",
                "maximum": 8000,
                "minimum": 1,
                "type": "integer"
              },
              "customWidth": {
                "default": 1200,
                "description": "Target width in px. Only used when preset is \"custom\".",
                "maximum": 8000,
                "minimum": 1,
                "type": "integer"
              },
              "fit": {
                "default": "contain",
                "description": "How each image fills its target box. 'contain' keeps the whole picture and pads the gap with paddingColor. 'cover' fills the box and crops whatever hangs over. 'stretch' distorts the image to the exact box, ignoring aspect ratio.",
                "enum": ["contain", "cover", "stretch"],
                "type": "string"
              },
              "images": {
                "description": "One to 60 images. Each is resized independently to every size in the chosen preset. A call is additionally capped at 48000000 total output pixels across images x sizes, so a preset with large or numerous sizes admits fewer images than one with small ones.",
                "items": {
                  "properties": {
                    "imageBase64": {
                      "description": "Base64-encoded source image bytes (any format sharp can decode: PNG, JPEG, WebP, GIF, AVIF, TIFF, ...).",
                      "minLength": 1,
                      "type": "string"
                    },
                    "name": {
                      "description": "Original filename (extension optional); used to derive each output filename.",
                      "maxLength": 255,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["imageBase64", "name"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "paddingColor": {
                "default": "#ffffff",
                "description": "Hex color (e.g. \"#ffffff\") used to pad the frame when fit is \"contain\". Ignored for \"cover\" and \"stretch\".",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "preset": {
                "default": "og",
                "description": "Which size(s) to produce for every image. appstore69: App Store screenshot, 6.9\" iPhone, 1320x2868. appstore67: App Store screenshot, 6.7\" iPhone, 1290x2796. appstoreIpad: App Store screenshot, 13\" iPad, 2064x2752. androidIcon: Android launcher icon, 5 densities (48/72/96/144/192px, each output foldered as mipmap-mdpi/hdpi/xhdpi/xxhdpi/xxxhdpi). favicon: favicon set, 16/32/48/180/192/512px. og: Open Graph card, 1200x630. xcard: X (Twitter) summary card, 1200x628. linkedin: LinkedIn share image, 1200x627. igSquare: Instagram square post, 1080x1080. igPortrait: Instagram portrait post, 1080x1350. igStory: Instagram story, 1080x1920. youtube: YouTube thumbnail, 1280x720. custom: a single arbitrary size taken from customWidth/customHeight.",
                "enum": ["appstore69", "appstore67", "appstoreIpad", "androidIcon", "favicon", "og", "xcard", "linkedin", "igSquare", "igPortrait", "igStory", "youtube", "custom"],
                "type": "string"
              }
            },
            "required": ["images"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "filesOut": {
                "description": "How many files were produced, i.e. imagesIn x sizes.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "fit": {
                "description": "How each image was fitted to its target box.",
                "enum": ["contain", "cover", "stretch"],
                "type": "string"
              },
              "imagesIn": {
                "description": "How many source images were supplied.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "outputs": {
                "description": "Every produced file, so the archive can be checked without unzipping it.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bytes": {
                      "description": "Output size in bytes.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "file": {
                      "description": "Path of the file inside the ZIP.",
                      "type": "string"
                    },
                    "height": {
                      "description": "Output height in px.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "source": {
                      "description": "Which input image this file came from.",
                      "type": "string"
                    },
                    "width": {
                      "description": "Output width in px.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["bytes", "file", "height", "source", "width"],
                  "type": "object"
                },
                "type": "array"
              },
              "paddingColor": {
                "description": "The letterbox colour, which only applies to fit 'contain'. Null for 'cover' and 'stretch', where nothing is padded.",
                "type": ["string", "null"]
              },
              "preset": {
                "description": "The preset that was applied, echoed from the input.",
                "type": "string"
              },
              "sizes": {
                "description": "How many target sizes the chosen preset expands to.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["filesOut", "fit", "imagesIn", "outputs", "paddingColor", "preset", "sizes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:12edd656b1245d13d9601f41a357ea90dc86a090e56cee019fa31c0b6bdb29da"
        },
        {
          "name": "strip_image_metadata",
          "title": "Strip image metadata (EXIF/GPS/XMP/IPTC/PNG text)",
          "description": "Reads a JPEG or PNG's hidden metadata (JPEG: EXIF — camera make/model, lens, body/lens serial numbers, capture date, GPS coordinates and altitude — plus XMP, IPTC/Photoshop resources and comment segments; PNG: tEXt/iTXt/zTXt/eXIf/tIME chunks) and returns a structured report of exactly what it found, including the size of every metadata segment/chunk that was removed. Optionally (include_cleaned_image, default true) also returns the same image with those segments/chunks stripped at the byte level: no re-encoding and no pixel decode, so the compressed image data, ICC profile, and JFIF/PNG structure are copied unchanged. It runs a byte-for-byte self-check that the retained image data is actually unchanged before handing back a cleaned file — if that check fails, no cleaned file is returned even though the report is still produced. Only JPEG and PNG signatures are recognized (not TIFF or other formats); stripping a photo's EXIF Orientation tag can make it appear rotated, which the report flags.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "filename": {
                "description": "Original filename, used only to name the returned cleaned file (defaults to \"image\"). Format detection is by content signature, not by this name or extension.",
                "maxLength": 255,
                "type": "string"
              },
              "image_base64": {
                "description": "Base64-encoded bytes of the JPEG or PNG file to inspect.",
                "minLength": 1,
                "type": "string"
              },
              "include_cleaned_image": {
                "default": true,
                "description": "When true (default), also return the metadata-stripped image bytes alongside the report. Set to false to get only the report.",
                "type": "boolean"
              }
            },
            "required": ["image_base64"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cleanedImageIncluded": {
                "description": "Whether a cleaned file accompanies this report as a content block. False when include_cleaned_image was off, when there was nothing to strip, or when verification failed.",
                "type": "boolean"
              },
              "cleanedSizeBytes": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Size of the cleaned file, or null when no cleaned image was produced."
              },
              "fields": {
                "description": "Every metadata field read from the file -- this is the disclosure the caller is usually checking for.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "field": {
                      "description": "Human-readable field name, e.g. Camera make, Latitude, XMP block.",
                      "type": "string"
                    },
                    "value": {
                      "description": "The value as found, stringified.",
                      "type": "string"
                    }
                  },
                  "required": ["field", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "fieldsFound": {
                "description": "How many individual metadata fields were read out.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "format": {
                "description": "Which of the two supported formats the file was read as.",
                "enum": ["jpeg", "png"],
                "type": "string"
              },
              "gps": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "altitudeMeters": {
                        "description": "Altitude in metres, when recorded.",
                        "type": ["number", "null"]
                      },
                      "dateStamp": {
                        "description": "GPS date stamp, when recorded.",
                        "type": ["string", "null"]
                      },
                      "latitude": {
                        "description": "Latitude in decimal degrees, to 6 places.",
                        "type": "number"
                      },
                      "longitude": {
                        "description": "Longitude in decimal degrees, to 6 places.",
                        "type": "number"
                      }
                    },
                    "required": ["altitudeMeters", "dateStamp", "latitude", "longitude"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Embedded location, or null when the file carried none. The single most sensitive thing in a photo, so it is surfaced on its own rather than only inside fields."
              },
              "make": {
                "description": "Camera make, when EXIF carried one.",
                "type": ["string", "null"]
              },
              "message": {
                "description": "Plain-language summary, including why no cleaned file was returned when that is the case.",
                "type": "string"
              },
              "metadataFound": {
                "description": "Whether any strippable metadata was present at all.",
                "type": "boolean"
              },
              "model": {
                "description": "Camera model, when EXIF carried one.",
                "type": ["string", "null"]
              },
              "originalSizeBytes": {
                "description": "Size of the supplied file in bytes.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "recognized": {
                "const": true,
                "description": "Always true here. A file that is neither a JPEG nor a PNG comes back as an error result instead, not as recognized:false.",
                "type": "boolean"
              },
              "removedBytes": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Bytes saved by stripping, or null when no cleaned image was produced."
              },
              "removedSegmentCount": {
                "description": "Number of segments/chunks removed.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "removedSegments": {
                "description": "Each metadata segment or chunk that was stripped, with its size.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "label": {
                      "description": "Which segment or chunk was removed, e.g. EXIF, XMP, a PNG tEXt chunk.",
                      "type": "string"
                    },
                    "sizeBytes": {
                      "description": "Its size in bytes.",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["label", "sizeBytes"],
                  "type": "object"
                },
                "type": "array"
              },
              "rotationWarning": {
                "description": "True when an EXIF Orientation tag was removed, which can make the cleaned image appear rotated in viewers that relied on it.",
                "type": "boolean"
              },
              "verified": {
                "description": "Result of the byte-for-byte check that the retained image data is unchanged. Null when no cleaning was attempted; false means the check failed and no cleaned file was returned.",
                "type": ["boolean", "null"]
              },
              "verifiedBytes": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "How many bytes that check compared. Null when no cleaning was attempted."
              }
            },
            "required": ["cleanedImageIncluded", "cleanedSizeBytes", "fields", "fieldsFound", "format", "gps", "make", "message", "metadataFound", "model", "originalSizeBytes", "recognized", "removedBytes", "removedSegmentCount", "removedSegments", "rotationWarning", "verified", "verifiedBytes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b7f47849c48b0822f6d85d387888adbed43dc0d1526c557a8da9aa4b957e4c03"
        }
