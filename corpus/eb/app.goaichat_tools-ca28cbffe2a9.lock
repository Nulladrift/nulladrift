        {
          "name": "calculate_app_store_net_revenue",
          "title": "App Store net revenue calculator",
          "description": "Computes what a developer actually receives from an App Store sale: first removes the storefront's VAT/GST already baked into the customer-facing sticker price, then applies Apple's commission (standard 30%, Small Business Program 15%, or the post-year-one subscription 15%) to that tax-exclusive remainder -- NOT to the sticker price itself, which is the mistake most naive calculators make. Returns a full price breakdown, the effective share of the sticker Apple actually keeps, a side-by-side comparison across all three commission rates (including per-1,000-sales figures), a naive-calculator sanity check showing how far off a 'just take the commission off the top' estimate would be, and warnings when the selected storefront's real tax rate varies by province, state or category (India, Canada, Brazil) rather than being a single fixed number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "commissionScenario": {
                "default": "standard30",
                "description": "Which Apple commission rate applies to the tax-exclusive remainder: 'standard30' (30%, the default for most apps), 'small15' (15%, Apple's Small Business Program for developers under the program's proceeds threshold), or 'yearTwo15' (15%, the reduced rate a subscription bills at after a subscriber has accumulated one year of paid, unlapsed service). All three are always returned side by side in the comparison array regardless of which is selected here.",
                "enum": ["standard30", "small15", "yearTwo15"],
                "type": "string"
              },
              "countryCode": {
                "default": "gb",
                "description": "Two-letter App Store storefront code (e.g. us, gb, de, jp, in). Selects the default tax rate and currency symbol. Defaults to gb, matching the tool page.",
                "enum": ["us", "gb", "de", "fr", "it", "es", "nl", "ie", "at", "be", "pt", "gr", "fi", "se", "dk", "no", "pl", "ch", "tr", "jp", "kr", "au", "nz", "sg", "id", "cn", "in", "ca", "br", "mx", "ae", "sa", "za"],
                "type": "string"
              },
              "price": {
                "description": "The customer-facing sticker price for this storefront (already tax-inclusive everywhere except the US).",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "taxRatePercent": {
                "description": "Override the storefront's default tax rate baked into the price, as a percent (e.g. 20 for 20% VAT). Defaults to the selected countryCode's standard rate (0 for the US). Some storefronts' real rates vary by province, state or category -- see the warnings array.",
                "maximum": 99,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["price"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appleShareOfStickerPercent": {
                "description": "Apple's commission as a percentage of the sticker price, which is lower than the headline rate because tax comes off first.",
                "type": "number"
              },
              "breakdown": {
                "additionalProperties": false,
                "description": "The sticker price decomposed in the order the money is actually removed.",
                "properties": {
                  "appleCommission": {
                    "description": "Apple's cut in currency.",
                    "type": "number"
                  },
                  "commissionBase": {
                    "description": "The tax-exclusive remainder Apple actually takes its cut of -- not the sticker price.",
                    "type": "number"
                  },
                  "customerPays": {
                    "description": "The sticker price the customer is charged.",
                    "type": "number"
                  },
                  "paidToYou": {
                    "description": "What the developer receives per sale.",
                    "type": "number"
                  },
                  "taxInsidePrice": {
                    "description": "VAT/GST already baked into that price, removed before commission.",
                    "type": "number"
                  }
                },
                "required": ["appleCommission", "commissionBase", "customerPays", "paidToYou", "taxInsidePrice"],
                "type": "object"
              },
              "comparison": {
                "description": "All three commission scenarios side by side, regardless of which was requested.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "commissionPercent": {
                      "description": "Headline commission rate for that scenario.",
                      "type": "number"
                    },
                    "label": {
                      "description": "Human-readable name of the commission scenario.",
                      "type": "string"
                    },
                    "per1000Sales": {
                      "description": "Net across 1,000 sales, which is where the difference between scenarios becomes legible.",
                      "type": "number"
                    },
                    "scenario": {
                      "description": "Scenario identifier.",
                      "type": "string"
                    },
                    "youKeep": {
                      "description": "Net per sale under that scenario.",
                      "type": "number"
                    }
                  },
                  "required": ["commissionPercent", "label", "per1000Sales", "scenario", "youKeep"],
                  "type": "object"
                },
                "type": "array"
              },
              "input": {
                "additionalProperties": false,
                "description": "What the calculation actually ran on, including the defaults that were filled in.",
                "properties": {
                  "commissionScenario": {
                    "description": "Which commission rate was applied.",
                    "type": "string"
                  },
                  "countryCode": {
                    "description": "Two-letter storefront code used.",
                    "type": "string"
                  },
                  "countryName": {
                    "description": "That storefront's full name.",
                    "type": "string"
                  },
                  "currencySymbol": {
                    "description": "Currency symbol for the storefront -- every money figure below is in this currency.",
                    "type": "string"
                  },
                  "price": {
                    "description": "The customer-facing sticker price, echoed back.",
                    "type": "number"
                  },
                  "taxRatePercent": {
                    "description": "The tax rate actually applied, whether supplied or taken from the storefront default.",
                    "type": "number"
                  }
                },
                "required": ["commissionScenario", "countryCode", "countryName", "currencySymbol", "price", "taxRatePercent"],
                "type": "object"
              },
              "naiveComparison": {
                "additionalProperties": false,
                "description": "A sanity check against the common mistake of applying commission to the tax-inclusive price.",
                "properties": {
                  "actualNet": {
                    "description": "What the correct tax-then-commission order actually yields.",
                    "type": "number"
                  },
                  "commissionPercent": {
                    "description": "The rate a naive calculation would apply.",
                    "type": "number"
                  },
                  "difference": {
                    "description": "How far off the naive figure is, per sale.",
                    "type": "number"
                  },
                  "naiveNet": {
                    "description": "What \"just take the commission off the sticker price\" would predict.",
                    "type": "number"
                  },
                  "sameAsActual": {
                    "description": "True when the storefront has no tax, so both methods agree.",
                    "type": "boolean"
                  }
                },
                "required": ["actualNet", "commissionPercent", "difference", "naiveNet", "sameAsActual"],
                "type": "object"
              },
              "warnings": {
                "description": "Cautions about the storefront, chiefly that its real tax rate varies by province, state or category. Empty when the rate is a single fixed number.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["appleShareOfStickerPercent", "breakdown", "comparison", "input", "naiveComparison", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b2bea74b47ce561e2c495ee47d13e0ef345e9185fde2f1b8c43fbd15d0ee230c"
        },
        {
          "name": "calculate_bmi_and_body_fat",
          "title": "BMI and Navy body fat calculator",
          "description": "Computes BMI (with its standard weight-category label) and body fat percentage via the US Navy circumference method from height, weight, neck, waist, and (for females) hip measurements, plus the resulting lean body mass. The Navy equations are fitted in inches, so metric inputs are converted internally; the body-fat percentage is clamped to 2-75% and rounded to a whole number, matching GO AI's body-fat tool page exactly, including its 'waist must exceed neck (and hip, for the female formula)' impossible-input warning and its out-of-fitted-range caution for raw results below 4% or above 60%.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "height": {
                "description": "Height, in cm (metric) or inches (imperial).",
                "exclusiveMinimum": 0,
                "maximum": 300,
                "type": "number"
              },
              "hip": {
                "description": "Hip circumference at the widest point, in cm or inches. Required when sex is 'female'; ignored for 'male'.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "neck": {
                "description": "Neck circumference, just below the larynx, in cm or inches.",
                "exclusiveMinimum": 0,
                "maximum": 300,
                "type": "number"
              },
              "sex": {
                "description": "Sex, which selects the Navy formula variant.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "units": {
                "default": "metric",
                "description": "metric = cm/kg, imperial = inches/lb. Applies to every measurement below.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "waist": {
                "description": "Waist circumference (at the navel for men, at the narrowest point for women), in cm or inches.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "weight": {
                "description": "Weight, in kg (metric) or lb (imperial). Used for BMI and lean mass, not for the body-fat percentage itself.",
                "exclusiveMinimum": 0,
                "maximum": 1500,
                "type": "number"
              }
            },
            "required": ["height", "neck", "sex", "waist", "weight"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bmi": {
                "description": "Body mass index to 1 decimal place, or null if it could not be computed.",
                "type": ["number", "null"]
              },
              "bmiCategory": {
                "description": "The WHO band that BMI falls in, e.g. 'Underweight', 'Normal', 'Overweight', 'Obese'. Null when bmi is null.",
                "type": ["string", "null"]
              },
              "bodyFatPercent": {
                "description": "US Navy tape-method body fat as a whole percent, clamped to 2-75. Null when the measurements make the formula undefined (see warnings).",
                "type": ["number", "null"]
              },
              "bodyFatRaw": {
                "description": "The same figure before clamping and rounding, to 2 decimals -- this is the one that reveals an implausible measurement. Null in the same case as bodyFatPercent.",
                "type": ["number", "null"]
              },
              "leanMass": {
                "description": "Lean mass in the same unit system as the input (kg for metric, lb for imperial). Null when body fat could not be computed.",
                "type": ["number", "null"]
              },
              "units": {
                "description": "Which unit system leanMass is expressed in -- otherwise the bare number is ambiguous.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "warnings": {
                "description": "Plain-language cautions: the measurements make the formula undefined, or the result sits outside the range it was fitted on. Empty when neither applies.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["bmi", "bmiCategory", "bodyFatPercent", "bodyFatRaw", "leanMass", "units", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cd8e3d31d8743f9e604c02854318e6eae42a571a3c90a32903a8562e14bad451"
        },
        {
          "name": "calculate_tdee",
          "title": "TDEE & macro calculator",
          "description": "Calculate Basal Metabolic Rate with Mifflin-St Jeor and Harris-Benedict (plus Katch-McArdle when body_fat_percent is given), then Total Daily Energy Expenditure, a goal-adjusted calorie target (cut/maintain/bulk), and a protein/fat/carb macro split, from sex, age, height, weight and activity level. These are population-average formulas, not a measurement of the person's actual metabolism -- real expenditure commonly varies 200-300 kcal from the estimate, and the result includes a warning flag when a deficit target falls below the usual safety floor.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "activity_level": {
                "description": "Multiplier applied to BMR to reach TDEE: sedentary x1.2 (desk job, no exercise), light x1.375 (1-3 sessions/week), moderate x1.55 (3-5), very_active x1.725 (6-7), extra_active x1.9 (physical job or twice a day).",
                "enum": ["sedentary", "light", "moderate", "very_active", "extra_active"],
                "type": "string"
              },
              "age": {
                "description": "Age in years, 14-100. Every BMR formula here subtracts a per-year term, so this moves the result directly.",
                "maximum": 100,
                "minimum": 14,
                "type": "integer"
              },
              "body_fat_percent": {
                "description": "Optional. Unlocks the Katch-McArdle formula, which uses lean mass instead of total weight.",
                "maximum": 60,
                "minimum": 3,
                "type": "number"
              },
              "goal": {
                "description": "Calorie adjustment applied to TDEE to get the target: lose_20 is a 20% deficit, lose_15 a 15% deficit, maintain no change, gain_10 a 10% surplus. A deficit landing under the safety floor sets below_safety_floor in the result.",
                "enum": ["lose_20", "lose_15", "maintain", "gain_10"],
                "type": "string"
              },
              "height_cm": {
                "description": "Height in centimetres. Required when units is 'metric', ignored when units is 'imperial'.",
                "maximum": 272,
                "minimum": 50,
                "type": "number"
              },
              "height_ft": {
                "description": "Height, whole feet, combined with height_in. Required when units is 'imperial', ignored when units is 'metric'.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "height_in": {
                "description": "Height, the inches remainder on top of height_ft (0-11). Used only when units is 'imperial', and treated as 0 when omitted -- so 6 ft flat is height_ft 6 with no height_in.",
                "maximum": 11,
                "minimum": 0,
                "type": "number"
              },
              "sex": {
                "description": "Biological sex. Selects the sex constant in the BMR formulas (Mifflin-St Jeor +5/-161, Harris-Benedict its own pair) and the calorie safety floor the goal target is checked against (1,500 kcal/day for male, 1,200 for female).",
                "enum": ["male", "female"],
                "type": "string"
              },
              "units": {
                "default": "metric",
                "description": "Which height/weight pair is read. 'metric' uses height_cm and weight_kg; 'imperial' uses height_ft (+ height_in) and weight_lb. The pair belonging to the other system is ignored, not merged. Defaults to 'metric'.",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "weight_kg": {
                "description": "Weight in kilograms. Required when units is 'metric', ignored when units is 'imperial'.",
                "maximum": 300,
                "minimum": 20,
                "type": "number"
              },
              "weight_lb": {
                "description": "Weight in pounds, converted internally at 2.20462 lb per kg. Required when units is 'imperial', ignored when units is 'metric'.",
                "maximum": 660,
                "minimum": 44,
                "type": "number"
              }
            },
            "required": ["activity_level", "age", "goal", "sex"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activity_factor": {
                "description": "The multiplier the chosen activity_level maps to (1.2 to 1.9).",
                "type": "number"
              },
              "activity_label": {
                "description": "The full human-readable label for that activity level.",
                "type": "string"
              },
              "below_safety_floor": {
                "description": "True when a deficit target falls below the usual floor for this sex -- the one field worth checking before presenting the target.",
                "type": "boolean"
              },
              "bmr": {
                "additionalProperties": false,
                "description": "Basal metabolic rate by formula, before any activity multiplier.",
                "properties": {
                  "harris_benedict": {
                    "description": "Harris-Benedict BMR in kcal/day; tends to read a little high.",
                    "type": "number"
                  },
                  "katch_mcardle": {
                    "description": "Katch-McArdle BMR in kcal/day, or null when body_fat_percent was not supplied (it needs lean mass).",
                    "type": ["number", "null"]
                  },
                  "mifflin_st_jeor": {
                    "description": "Mifflin-St Jeor BMR in kcal/day -- the modern default.",
                    "type": "number"
                  }
                },
                "required": ["harris_benedict", "katch_mcardle", "mifflin_st_jeor"],
                "type": "object"
              },
              "disclaimer": {
                "description": "Standing note that these are population-average estimates, not a measurement.",
                "type": "string"
              },
              "formula_comparison": {
                "description": "All three formulas side by side, so the spread is visible rather than implied.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "best_for": {
                      "description": "One line on when this formula is the right one to trust.",
                      "type": "string"
                    },
                    "bmr_kcal": {
                      "description": "That formula's BMR, or null if it could not be computed.",
                      "type": ["number", "null"]
                    },
                    "formula": {
                      "description": "Formula name.",
                      "type": "string"
                    },
                    "is_primary": {
                      "description": "True for the row that produced the headline tdee_kcal.",
                      "type": "boolean"
                    },
                    "tdee_kcal": {
                      "description": "That formula's BMR times the activity factor, or null.",
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["best_for", "bmr_kcal", "formula", "is_primary", "tdee_kcal"],
                  "type": "object"
                },
                "type": "array"
              },
              "goal_label": {
                "description": "Wording for that adjustment, e.g. '15% deficit', 'maintenance', '10% surplus'.",
                "type": "string"
              },
              "goal_pct": {
                "description": "The goal adjustment as a signed percentage (-20, -15, 0, or +10).",
                "type": "number"
              },
              "goal_target_kcal": {
                "description": "The goal-adjusted daily calorie target in kcal.",
                "type": "number"
              },
              "lean_mass_kg": {
                "description": "Lean body mass in kg, or null when body_fat_percent was not supplied.",
                "type": ["number", "null"]
              },
              "macros": {
                "additionalProperties": false,
                "description": "A protein/fat/carb split of goal_target_kcal.",
                "properties": {
                  "carbs_g": {
                    "description": "Carbohydrate grams per day: whatever the target has left after protein and fat, floored at 0.",
                    "type": "number"
                  },
                  "fat_g": {
                    "description": "Fat grams per day, from 25% of the target calories.",
                    "type": "number"
                  },
                  "protein_g": {
                    "description": "Protein grams per day, at 1.8 g per kg of body weight.",
                    "type": "number"
                  }
                },
                "required": ["carbs_g", "fat_g", "protein_g"],
                "type": "object"
              },
              "primary_formula": {
                "description": "Which formula drove the headline numbers: 'Katch-McArdle' when body fat % was given, otherwise 'Mifflin-St Jeor'.",
                "type": "string"
              },
              "resolved_inputs": {
                "additionalProperties": false,
                "description": "What the imperial/metric inputs actually resolved to internally -- the numbers every formula above was fed.",
                "properties": {
                  "height_cm": {
                    "description": "Height in cm after any imperial conversion.",
                    "type": "number"
                  },
                  "weight_kg": {
                    "description": "Weight in kg after any imperial conversion.",
                    "type": "number"
                  }
                },
                "required": ["height_cm", "weight_kg"],
                "type": "object"
              },
              "safety_floor_kcal": {
                "description": "The floor that was checked against: 1500 kcal/day for male, 1200 for female.",
                "type": "number"
              },
              "safety_warning": {
                "description": "The full warning text when below_safety_floor is true, otherwise null.",
                "type": ["string", "null"]
              },
              "spread_kcal": {
                "description": "Difference in kcal/day between the highest and lowest TDEE among the formulas that computed.",
                "type": "number"
              },
              "tdee_kcal": {
                "description": "Total daily energy expenditure in kcal/day: primary BMR x activity factor.",
                "type": "number"
              }
            },
            "required": ["activity_factor", "activity_label", "below_safety_floor", "bmr", "disclaimer", "formula_comparison", "goal_label", "goal_pct", "goal_target_kcal", "lean_mass_kg", "macros", "primary_formula", "resolved_inputs", "safety_floor_kcal", "safety_warning", "spread_kcal", "tdee_kcal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:53d6ae3df87f5bcafef3d23563aba1f128b36fb6ffc455374a05efbd9c600eb4"
        },
        {
          "name": "check_contrast",
          "title": "WCAG/APCA contrast checker",
          "description": "Computes the WCAG 2.x contrast ratio between a foreground (text) and background hex colour, and reports AA/AAA pass or fail for normal text, large text, and UI components (icons/borders/focus rings) separately, since WCAG grades each case on its own threshold. Also reports the newer APCA Lc figure alongside it for information -- APCA is not yet what conformance is measured against, only the WCAG ratio is.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "background": {
                "description": "Background colour as a hex string, same format as foreground.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "foreground": {
                "description": "Foreground/text colour as a hex string, e.g. \"#6b7280\" or \"6b7\" (3- or 6-digit, leading # optional).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["background", "foreground"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "apca": {
                "additionalProperties": false,
                "description": "The APCA (WCAG 3 draft) reading, which models perceived contrast rather than a pure luminance ratio and often disagrees with WCAG 2.",
                "properties": {
                  "lc": {
                    "description": "APCA lightness contrast, signed -- the sign encodes which of the two colours is lighter.",
                    "type": "number"
                  },
                  "lcAbs": {
                    "description": "Absolute Lc value, which is what the APCA thresholds are stated against.",
                    "type": "number"
                  },
                  "polarity": {
                    "description": "Whether this is light text on dark, or dark text on light.",
                    "type": "string"
                  }
                },
                "required": ["lc", "lcAbs", "polarity"],
                "type": "object"
              },
              "backgroundHex": {
                "description": "The background colour normalised to hex.",
                "type": "string"
              },
              "cases": {
                "description": "The pair judged against each WCAG use case, since one ratio passes for large text and fails for body copy.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "aaThreshold": {
                      "description": "The AA ratio this case must meet.",
                      "type": "number"
                    },
                    "aaaThreshold": {
                      "description": "The AAA ratio, or null for cases WCAG defines no AAA level for (UI components).",
                      "type": ["number", "null"]
                    },
                    "key": {
                      "description": "Stable identifier for the use case.",
                      "type": "string"
                    },
                    "label": {
                      "description": "Human-readable name, e.g. 'Normal text'.",
                      "type": "string"
                    },
                    "need": {
                      "description": "What this case requires, written out.",
                      "type": "string"
                    },
                    "passAA": {
                      "description": "Whether the pair meets AA for this case.",
                      "type": "boolean"
                    },
                    "passAAA": {
                      "description": "Whether it meets AAA, or null where no AAA level exists.",
                      "type": ["boolean", "null"]
                    }
                  },
                  "required": ["aaThreshold", "aaaThreshold", "key", "label", "need", "passAA", "passAAA"],
                  "type": "object"
                },
                "type": "array"
              },
              "foregroundHex": {
                "description": "The foreground colour normalised to hex.",
                "type": "string"
              },
              "ratio": {
                "description": "WCAG 2 contrast ratio, from 1 (identical) to 21 (black on white).",
                "type": "number"
              },
              "ratioDisplay": {
                "description": "That ratio formatted the way it is conventionally written, e.g. '4.53:1'.",
                "type": "string"
              },
              "summary": {
                "additionalProperties": false,
                "description": "The tally, so a caller can gate on one boolean instead of walking cases.",
                "properties": {
                  "allPass": {
                    "description": "True only when every gradeable check passed.",
                    "type": "boolean"
                  },
                  "graded": {
                    "description": "How many checks were gradeable (a null AAA level is not counted).",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "passed": {
                    "description": "How many graded checks passed.",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["allPass", "graded", "passed"],
                "type": "object"
              }
            },
            "required": ["apca", "backgroundHex", "cases", "foregroundHex", "ratio", "ratioDisplay", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
