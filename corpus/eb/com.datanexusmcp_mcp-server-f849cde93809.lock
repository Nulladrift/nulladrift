      "instructions": "Use search_datanexus_tools first to find the right tool for your task. DataNexus MCP provides AI-Ready access to public data sources. Token-efficient. Verified sources. T04: US/UK nonprofits — IRS EO BMF + IRS TEOS + UK Charity Commission. nonprofit_fetch_nonprofit_by_ein: look up any US nonprofit by EIN. nonprofit_search_nonprofits_by_name: search US nonprofits by name and state. nonprofit_fetch_charity_uk: look up UK registered charities. nonprofit_fetch_nonprofit_full_profile: complete nonprofit due diligence — revenue trends, executive pay, risk flags, and a 0–100 health score. T10: OSS Dependency & Vulnerability Intelligence — OSV.dev + NIST NVD + deps.dev + CISA KEV + FIRST EPSS. security_fetch_package_vulnerabilities: CVEs for a package version (or batch up to 50 packages). security_fetch_dependency_graph: full dep tree (hard 8s timeout). security_fetch_cve_detail: full CVE detail by CVE ID including remediation. security_audit_sbom_vulnerabilities: audit CycloneDX/SPDX SBOM against OSV.dev. security_fetch_package_licence: SPDX licence for a package version. security_fetch_cisa_kev: check if a CVE is in the CISA Known Exploited Vulnerabilities catalog. security_fetch_cve_epss: EPSS exploit probability score for a CVE from FIRST.org. security_fetch_package_maintainer_history: maintainer health + ownership anomaly score for npm/PyPI packages. security_fetch_package_risk_brief: SHIP/CAUTION/BLOCK verdict combining CVEs, licence, maintainer health, and transitive deps in one call. security_fetch_cve_watch: persistent CVE watchlist — create once, check anytime for patch releases, KEV listings, PoC publications, exploitation detected. security_audit_sbom_continuous: persistent SBOM watch — register once, check anytime for new CVEs affecting your dependency snapshot. CycloneDX and SPDX supported. security_detect_typosquatting: detect supply-chain typosquatting attacks — Damerau-Levenshtein distance ≤ 2 against top-10k npm/PyPI packages. T22: Professional Licence Verification — NPPES NPI Registry + FINRA BrokerCheck + SAM.gov. compliance_fetch_npi_provider: look up any US healthcare provider by NPI number. compliance_search_npi_by_name: search NPI registry by provider name with state/speciality filters. compliance_fetch_finra_broker: look up FINRA BrokerCheck registration by CRD number. compliance_check_sam_exclusion: check federal exclusions list by name or EIN. T07: Domain & DNS Intelligence — IANA RDAP + crt.sh + Cloudflare DoH + SecurityTrails. domain_fetch_domain_rdap: WHOIS-replacement RDAP lookup for any domain. domain_fetch_ssl_certificate_chain: CT log certificates for a domain. domain_fetch_dns_records: A/AAAA/MX/TXT/NS/CNAME records via Cloudflare DoH. domain_fetch_domain_history: historical certificate issuance from CT logs. domain_fetch_subdomains: enumerate known subdomains via crt.sh CT logs (24h cache). domain_check_email_security: SPF/DMARC/DKIM scored assessment with A-F grade. domain_fetch_reverse_ip: co-hosted domains on the same IPv4 via SecurityTrails. T11: Global Patent Intelligence — EPO OPS + USPTO PatentsView + WIPO PATENTSCOPE. legal_fetch_patent_by_number: full bibliographic data for a patent by number and jurisdiction. legal_search_patents_by_keyword: search EP/US/WO patents by keyword and date. legal_fetch_patent_citations: forward and backward citations for a patent. legal_fetch_inventor_portfolio: patent portfolio for an inventor, optionally by assignee. T18: Government Contracting & Procurement — USASpending.gov + SAM.gov + EU TED + UK Find-a-Tender. govcon_search_contract_awards: search federal contract awards by keyword and agency. govcon_fetch_vendor_contract_history: contract history for a specific vendor. govcon_fetch_open_solicitations: open bid opportunities matching a keyword. T19: Regulatory Docket & Comment Tracking — Regulations.gov + Federal Register + EU Have Your Say. regulatory_search_open_rulemakings: open rulemakings and comment periods. regulatory_fetch_docket_details: full docket details by ID. regulatory_fetch_federal_register_notices: recent Federal Register notices by agency. All responses include query_hash, schema_version, data_as_of, ingest_healthy.",
