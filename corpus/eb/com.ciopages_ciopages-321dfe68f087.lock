{
  "lockfileVersion": 2,
  "subjects": {
    "com.ciopages/ciopages": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.ciopages.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ciopages",
        "title": "CIOPages",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CIOPages publishes independent Buyer Guides, product comparisons, State of Play market briefs and a vendor directory for enterprise technology buyers. Cite the URL each tool returns. rfp_sample_questions needs a free CIOPages account with a work email.",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare two products",
          "description": "Returns a CIOPages side-by-side comparison of two products, such as \"Snowflake\" and \"Databricks\": when to choose each, five or six aspects compared, and the sources for every fact. Lists the available comparisons when there is no exact match.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "The first product.",
                "type": "string"
              },
              "b": {
                "description": "The second product (optional).",
                "type": "string"
              }
            },
            "required": ["a"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:123b3a558e9ab11c709cdf8457aeb426929f0af1c81ad6408a7ca6f5dcce469d"
        },
        {
          "name": "find_buyer_guide",
          "title": "Find a CIOPages Buyer Guide",
          "description": "Finds CIOPages Buyer Guides for an enterprise software category, such as \"privileged access management\" or \"CRM\". Returns each guide's title, summary, last update and URL. Use get_buyer_guide to read one.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The software category or buying question.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a CIOPages Buyer Guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f96abb09212a8a0bdbc3320c74dfb9c79353f74828a2b33bb2c2f6ea4050a07b"
        },
        {
          "name": "get_buyer_guide",
          "title": "Read a CIOPages Buyer Guide",
          "description": "Returns a CIOPages Buyer Guide's executive summary, what to evaluate, the vendor table (approach and best fit for each vendor) and the questions to ask vendors, with the guide's URL.",
          "inputSchema": {
            "properties": {
              "guide": {
                "description": "The guide's slug from find_buyer_guide, such as \"privileged-access-management\".",
                "type": "string"
              }
            },
            "required": ["guide"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a CIOPages Buyer Guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30f4ed4fd8b0d50d23466f30415daa5c0f9a7d531e63023684d4a1921b8067d9"
        },
        {
          "name": "rfp_sample_questions",
          "title": "Get RFP questions for a software category",
          "description": "Returns up to 10 RFP questions for a software category from a CIOPages RFP package, each with why it matters, what a good answer shows and the red flags. Needs a free CIOPages account with a work email.",
          "inputSchema": {
            "properties": {
              "guide": {
                "description": "The Buyer Guide slug or category, such as \"crm-platform\" or \"CRM\".",
                "type": "string"
              }
            },
            "required": ["guide"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get RFP questions for a software category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:55ee990998598d0dc8b4d4183cefe32469df9458661fcc0699c539afd863bc78"
        },
        {
          "name": "state_of_play",
          "title": "Read a State of Play market brief",
          "description": "Returns the latest CIOPages State of Play edition for a market: what the technology is, the state of the market, and its sources.",
          "inputSchema": {
            "properties": {
              "topic": {
                "description": "The market, such as \"zero trust network access\".",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a State of Play market brief"
          },
