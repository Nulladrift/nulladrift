          },
          "digest": "sha256:304d7260056e803e075cc2629fe18910622b6e7ea7ddc8bec641ee44b91888c9"
        },
        {
          "name": "vendor_profile",
          "title": "Look up a vendor in the CIOPages Directory",
          "description": "Returns a vendor's CIOPages Directory profile: what it does, its main capabilities, who it serves, where it is based and the profile URL.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The vendor's name, such as \"CyberArk\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a vendor in the CIOPages Directory"
