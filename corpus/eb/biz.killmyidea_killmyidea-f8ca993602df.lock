{
  "lockfileVersion": 2,
  "subjects": {
    "biz.killmyidea/killmyidea": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://killmyidea.biz/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "killmyidea",
        "title": "Kill My Idea",
        "version": "1.0.0",
        "description": "Helps an agent judge a startup or side-project idea before anyone builds it: send a plain-words description and get a KILL IT, FIX IT or SHIP IT verdict, a 0-100 score, the best signal, the biggest risk and eight 0-100 sub-scores from Jev (TypeSafe AI). Also reports how many ideas have been judged and how they ended.",
        "websiteUrl": "https://killmyidea.biz/mcp/",
        "icons": [
          {
            "src": "https://killmyidea.biz/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kill My Idea judges startup and side-project ideas with Jev (TypeSafe AI), a classifier, not a chatbot.\njudge_idea works best with a concrete description: who it is for, what it does, how it makes money or spreads.\nIt returns KILL IT (<50), FIX IT (50-64) or SHIP IT (65+), a 0-100 score and eight 0-100 sub-scores.\nThe text result is a preformatted card with bar charts in a code block; structuredContent holds the same data as fields.\nWhen an idea is too vague to judge, needs_detail is true and no verdict or score is given.\nIdeas are archived anonymously for product analytics unless do_not_archive is true.",
      "tools": [
        {
          "name": "get_stats",
          "title": "Kill My Idea stats",
          "description": "How many ideas Kill My Idea has analyzed so far and how many were killed, fixed or shipped. Cached for 5 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analyzed": {
                "description": "Ideas judged and archived so far. Ideas judged with do_not_archive (or the website privacy opt-out) are not counted.",
                "type": "integer"
              },
              "verdicts": {
                "description": "How many of the archived ideas got each verdict.",
                "properties": {
                  "FIX": {
                    "description": "Ideas that got FIX IT.",
                    "type": "integer"
                  },
                  "KILL": {
                    "description": "Ideas that got KILL IT.",
                    "type": "integer"
                  },
                  "SHIP": {
                    "description": "Ideas that got SHIP IT.",
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["analyzed", "verdicts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Kill My Idea stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c57f0ad70a9a511fe1d49d5776f4d645fad9563ed48c90d85c4f6bdb5d78ddde"
        },
        {
          "name": "judge_idea",
          "title": "Judge a startup idea",
          "description": "Judge a startup or side-project idea. Returns a verdict (verdict KILL, FIX or SHIP, shown as verdict_label KILL IT, FIX IT or SHIP IT), an overall score, the best_signal, the biggest_risk and the eight scored dimensions. If the idea is too vague to judge, needs_detail is true and verdict, verdict_label, score, best_signal and biggest_risk are null, and message says which details are missing. 10 Jev decisions in about a second. Deterministic rubric, no generated prose. The text result is a preformatted card with bar charts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "do_not_archive": {
                "default": false,
                "description": "When true, the idea text is not stored, for confidential ideas. Otherwise it is archived anonymously (no IP, no identity).",
                "type": "boolean"
              },
              "goal": {
                "default": "money",
                "description": "Why the idea is being built, which decides the questions it is scored on. Making money judges it as a business. Open source scores Adoption instead of Money. Just for fun scores Immediate appeal and Fun instead of Real problem and Money.",
                "enum": ["money", "open_source", "fun"],
                "type": "string"
              },
              "idea": {
                "description": "The idea in plain words: who it is for, what it does, how it makes money or spreads. More detail, better verdict.",
                "maxLength": 5000,
                "minLength": 20,
                "type": "string"
              }
            },
            "required": ["idea"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "best_signal": {
                "description": "The highest-scoring dimension. null when needs_detail is true.",
                "properties": {
                  "dimension": {
                    "description": "Dimension key.",
                    "type": "string"
                  },
                  "label": {
                    "description": "Dimension name for display.",
                    "type": "string"
                  },
                  "note": {
                    "description": "Fixed one-line comment on this strength.",
                    "type": "string"
                  },
                  "score": {
                    "description": "Dimension score.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["dimension", "label", "note", "score"],
                "type": ["object", "null"]
              },
              "biggest_risk": {
                "description": "The lowest-scoring dimension. null when needs_detail is true.",
                "properties": {
                  "dimension": {
                    "description": "Dimension key.",
                    "type": "string"
                  },
                  "label": {
                    "description": "Dimension name for display.",
                    "type": "string"
                  },
                  "note": {
                    "description": "Fixed one-line comment on this risk.",
                    "type": "string"
                  },
                  "score": {
                    "description": "Dimension score.",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["dimension", "label", "note", "score"],
                "type": ["object", "null"]
              },
              "category": {
                "description": "Product category Jev assigned to the idea.",
                "type": "string"
              },
              "dimensions": {
                "description": "The scored questions for this goal, in display order.",
                "items": {
                  "properties": {
                    "key": {
                      "description": "Dimension key.",
                      "type": "string"
                    },
                    "label": {
                      "description": "Dimension name for display.",
                      "type": "string"
                    },
                    "question": {
                      "description": "What this dimension asks about the idea.",
                      "type": "string"
                    },
                    "score": {
                      "description": "Score for this dimension.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "weight": {
                      "description": "Weight of this dimension in the overall score.",
                      "type": "integer"
                    }
                  },
                  "required": ["key", "label", "question", "score", "weight"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 8,
                "type": "array"
              },
              "goal": {
                "description": "The goal the idea was judged against.",
                "enum": ["money", "open_source", "fun"],
                "type": "string"
              },
              "judged_by": {
                "description": "The model that judged the idea.",
                "type": "string"
              },
              "latency_ms": {
                "description": "Time Jev took to answer, in milliseconds.",
                "type": "integer"
              },
              "message": {
                "description": "One-line summary such as \"SHIP IT. 72/100.\", or the request for more detail when needs_detail is true.",
                "type": "string"
              },
              "needs_detail": {
                "description": "True when Jev could not understand the idea well enough to judge it: no verdict, score or signals are given, and message says which details are missing.",
                "type": "boolean"
              },
              "score": {
                "description": "Overall score: weighted average of the dimension scores, rounded. null when needs_detail is true.",
                "maximum": 100,
                "minimum": 0,
                "type": ["integer", "null"]
              },
              "scoring_version": {
                "description": "Version of the questions, weights and thresholds used.",
                "type": "integer"
              },
              "thresholds": {
                "description": "Score ranges for each verdict.",
                "properties": {
                  "fix": {
                    "description": "Score range for FIX, e.g. \"50-64\".",
                    "type": "string"
                  },
                  "kill": {
                    "description": "Score range for KILL, e.g. \"<50\".",
                    "type": "string"
                  },
                  "ship": {
                    "description": "Score range for SHIP, e.g. \"65+\".",
                    "type": "string"
                  }
                },
                "required": ["fix", "kill", "ship"],
                "type": "object"
              },
              "try_it": {
                "description": "Link to the Kill My Idea website.",
                "type": "string"
              },
              "verdict": {
                "description": "Verdict code from the score and the thresholds below. null when needs_detail is true.",
                "enum": ["KILL", "FIX", "SHIP", null],
                "type": ["string", "null"]
              },
              "verdict_label": {
                "description": "Display form of the verdict, e.g. \"KILL IT\". null when needs_detail is true.",
                "type": ["string", "null"]
              }
            },
            "required": ["best_signal", "biggest_risk", "category", "dimensions", "goal", "judged_by", "latency_ms", "message", "needs_detail", "score", "scoring_version", "thresholds", "try_it", "verdict", "verdict_label"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Judge a startup idea"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f6184f9b6c0012670582636cf6a269fe4b3800c142a1cdb5d3d2327ad6e48c5f"
        }
      ],
      "digest": "sha256:6543a49fec7b62d4aaf7ee93cc448f80f0b3f7f3485e83cd1370fe009948a0e4"
    }
  }
}
