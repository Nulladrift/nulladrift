            "additionalProperties": false,
            "properties": {
              "book_id": {
                "maxLength": 24,
                "minLength": 2,
                "type": "string"
              },
              "chapter": {
                "maximum": 150,
                "minimum": 1,
                "type": "integer"
              },
              "source_id": {
                "enum": ["bsb", "web"],
                "type": "string"
              },
              "verse": {
                "maximum": 176,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["book_id", "chapter", "source_id", "verse"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Structured Macaroon Faith evidence or catalogue result.",
