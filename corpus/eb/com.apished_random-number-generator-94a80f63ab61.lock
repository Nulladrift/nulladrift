{
  "lockfileVersion": 2,
  "subjects": {
    "com.apished/random-number-generator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://apished.com/mcp/v1/random"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "apished-random",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "random_int",
          "description": "Generates cryptographically random integers in [min, max] (inclusive), using crypto/rand — an actual random value, not a guess. count defaults to 1, max 1000.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "description": "how many numbers to generate, 1-1000, default 1",
                "type": "integer"
              },
              "max": {
                "description": "upper bound, inclusive; must be >= min",
                "type": "integer"
              },
              "min": {
                "description": "lower bound, inclusive",
                "type": "integer"
              }
            },
            "required": ["max", "min"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "numbers": {
                "items": {
                  "type": "integer"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["numbers"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2164650f3e843abc0ec9d77cfb2d8d8bea343a591eaa8e11e2e7e9b915ba1b76"
        }
      ],
      "digest": "sha256:7bc981758772730619db9e592d42b7698e3ba4cb7ffaefdb27c2ba9d14f94bd9"
    }
  }
}
