            "additionalProperties": false,
            "properties": {
              "bugId": {
                "description": "The bug ID",
                "format": "uuid",
                "type": "string"
              },
              "eventLimit": {
                "default": 200,
                "description": "Max raw events to scan before summarizing",
                "maximum": 500,
                "minimum": 20,
                "type": "number"
              },
              "occurrenceId": {
                "description": "Pin to one occurrence. If omitted, uses the latest occurrence when available.",
                "format": "uuid",
                "type": "string"
