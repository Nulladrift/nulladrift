        {
          "name": "list_bug_groups",
          "title": "List Bug Groups",
          "description": "Grouped triage view: bugs collapsed across pages by error signature (one group per distinct error within a project, even when dedup created many bug rows). Each group includes projectId + groupKey (the stable group identity), a representative sampleBugId/sampleTitle, instanceCount, occurrenceCount, sessionCount, userCount, maxSeverity, topStatus, signalReason (why the classifier flagged it), browsers/oses, platforms (web/ios/android/react-native/flutter/server — one issue can span several), and anyRegression. Pass both projectId and groupKey as one groupRefs entry to bulk_update_bugs. Legacy groupKeys are accepted only when unique across the organization and are rejected when ambiguous. Prefer this over list_bugs for triage.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assignee": {
                "description": "'unassigned', or a user id from list_team — narrows to bugs assigned to that person (or none)",
                "type": "string"
              },
              "deliveryFeed": {
                "description": "Delivery feed: all, urgent_critical, or ui_ux. Defaults to the PAT or project setting.",
                "enum": ["all", "urgent_critical", "ui_ux"],
                "type": "string"
              },
              "direction": {
                "default": "desc",
                "description": "Sort direction for the chosen key (default desc; ties break on last_seen desc)",
                "enum": ["asc", "desc"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Number of groups (default 20)",
                "maximum": 200,
                "minimum": 1,
                "type": "number"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset",
                "minimum": 0,
                "type": "number"
              },
              "platform": {
                "description": "Only groups with an occurrence captured on this platform",
                "enum": ["web", "ios", "android", "react-native", "flutter", "server", "other"],
                "type": "string"
              },
              "projectId": {
                "description": "Filter by project ID",
                "format": "uuid",
                "type": "string"
              },
              "search": {
                "description": "Search text in title and description",
                "type": "string"
              },
              "severity": {
                "description": "Filter by per-bug severity",
                "enum": ["critical", "high", "medium", "low"],
                "type": "string"
              },
              "sort": {
                "default": "last_seen",
                "description": "Sort key: last_seen (default), first_seen, count (occurrences), severity, title, signal (regressions first), assignee (display name, unassigned last)",
                "enum": ["last_seen", "first_seen", "count", "severity", "title", "signal", "assignee"],
                "type": "string"
              },
              "status": {
                "description": "Filter by per-bug status (groups also expose aggregated topStatus)",
                "enum": ["new", "known", "working", "resolved", "silenced", "awaiting_verification", "verified_fixed"],
                "type": "string"
              },
              "unresolved": {
                "default": false,
                "description": "true = only groups whose aggregated topStatus is not resolved/silenced",
                "type": "boolean"
              }
            },
            "type": "object"
          },
