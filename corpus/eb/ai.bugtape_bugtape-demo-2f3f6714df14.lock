      "instructions": "This is the public BugTape demo: a read-only workspace \"BugTape Demo\" with one project, \"John's Shoes\", a sample shoe shop. Its issues are sample captures with real evidence: console, network, clicks, stack traces and affected users. Start with list_recommended_critical, then read an issue with get_repro_context and explain the root cause and the fix. Nothing here is a real customer. Writes (ack, claims, comments) are not available. To connect your own app, use https://app.bugtape.ai/mcp (sign in with OAuth) or run `npx -y bugtape connect`.",
