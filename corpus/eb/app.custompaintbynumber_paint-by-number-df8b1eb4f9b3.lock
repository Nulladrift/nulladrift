          },
          "digest": "sha256:817c870666bb0a4c9fdecdc51dfac96f9f35d766a174bec0db331774d9cfdc24"
        },
        {
          "name": "print_size_facts",
          "title": "Print sizes and home-printer tiles",
          "description": "Page size (mm, cm, inches), picture area and how many overlapping Letter/A4 tiles each print size (A4, A3, 16×20 in) needs for a photo’s aspect ratio.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aspect_ratio": {
                "default": "3:4",
                "description": "Photo width:height, e.g. \"3:4\" (portrait phone photo) or \"4:3\" (landscape)",
                "maxLength": 20,
                "type": "string"
              },
              "size": {
                "description": "a4, a3 or 16x20; omit for all three",
                "enum": ["a4", "a3", "16x20"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
