      },
      "instructions": "Custom paint by number help from custompaintbynumber.app: which color count and print size to choose, print sizes and home-printer tiles, what the $9.99 printable PDF contains, acrylic mixing recipes for a color, and the photo-to-pattern steps. Read-only; nothing is stored. It cannot receive photos: send people to the generator link to make a pattern from their photo.",
      "tools": [
        {
          "name": "how_to_make_from_photo",
          "title": "How to make a paint by number from a photo",
          "description": "Step-by-step: choosing the photo, size and color count, previewing, printing or transferring to canvas, mixing and painting. Includes the link to the free in-browser generator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6743c8c0365c1b966f9641d902b45a474532b0bbab214581c1425caae7230d5e"
        },
        {
          "name": "paint_mixing_recipe",
          "title": "Acrylic mixing recipe for a color",
          "description": "Mixing recipe in whole parts for any HEX color from a basic eight-paint acrylic set, with how close the mix gets (the same recipe the PDF color chart prints).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "hex": {
                "description": "Target color as HEX, e.g. \"#C49A6C\"",
                "maxLength": 16,
                "type": "string"
              }
            },
            "required": ["hex"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
