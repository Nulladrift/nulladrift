            "readOnly": true
          },
          "digest": "sha256:58e95c39fe1cb3860ab5bec5338da09e2a0f9a6c38d34ff70557cc84109ca65c"
        },
        {
          "name": "recommend_colors_and_size",
          "title": "Recommend color count and print size",
          "description": "Recommend 24, 36 or 48 colors and an A4, A3 or 16×20 in print size for a custom paint by number, from the subject and how much detail the painter wants.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "balanced",
                "description": "simple (bold, relaxing), balanced, or detailed (keeps gradients and fine detail; a longer project)",
                "enum": ["simple", "balanced", "detailed"],
                "type": "string"
              },
              "first_project": {
                "default": false,
                "description": "True for a first paint by number or a beginner",
                "type": "boolean"
              },
              "subject": {
                "default": "other",
                "description": "pet, person (portrait), landscape, sky_or_sunset or other",
                "enum": ["pet", "person", "landscape", "sky_or_sunset", "other"],
                "type": "string"
              }
            },
