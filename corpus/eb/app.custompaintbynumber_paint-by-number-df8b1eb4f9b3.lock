        },
        {
          "name": "pattern_pdf_contents",
          "title": "What the printable PDF contains",
          "description": "What the $9.99 custom paint by number PDF includes (outline, color chart with HEX/RGB and mixing recipes, painted reference, tiles), the price, re-download and refund terms.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
