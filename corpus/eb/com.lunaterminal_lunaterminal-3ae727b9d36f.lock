        {
          "name": "rebalance_plan",
          "title": "Rebalance plan",
          "description": "Build a tax-aware rebalancing trade list that brings holdings back to the target model or custom allocation, optionally investing new cash. Sells come from tax-advantaged accounts first, then taxable lots with losses, then the smallest gains; proceeds stay in the account that raised them. Returns each trade (account, symbol, dollars, estimated shares, estimated realized gain and tax), totals, the allocation after the trades, wash-sale and concentration warnings, and notes. Takes the same holdings, prices and target inputs as portfolio_review; missing prices are fetched from live quotes. Trades are estimates for advisor review, not orders.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "band": {
                "description": "Rebalancing band in percentage points (default 5): an asset class further than this from target is out of band.",
                "maximum": 25,
                "minimum": 1,
                "type": "number"
              },
              "force": {
                "description": "Rebalance to target even when every class is within the band (default false).",
                "type": "boolean"
              },
              "holdings": {
                "description": "Holdings as objects, instead of holdingsCsv. Up to 300 rows; one row per lot gives the best tax estimates.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "account": {
                      "description": "Account name, e.g. \"Joint brokerage\". Default \"Brokerage\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "accountType": {
                      "description": "taxable, brokerage, individual, joint, trust, ira, traditional ira, rollover ira, sep ira, 401k, 403b, 457, roth, roth ira, roth 401k, hsa or other. Default taxable.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "acquired": {
                      "description": "Date acquired, YYYY-MM-DD; decides short- or long-term gains.",
                      "maxLength": 10,
                      "type": "string"
                    },
                    "assetClass": {
                      "description": "Optional override: us_equity, intl_equity, bonds, cash or alternatives, or a split such as \"us_equity:60;bonds:40\". Common ETFs and index funds are classified automatically; unknown tickers count as US stocks.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "costBasis": {
                      "description": "Total cost basis of this row in dollars (not per share). Omit when unknown.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "shares": {
                      "description": "Number of shares; for CASH, the dollar amount.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "symbol": {
                      "description": "Ticker, e.g. VTI. Use CASH for cash balances.",
                      "maxLength": 18,
                      "type": "string"
