      "instructions": "LunaTerminal (https://lunaterminal.com), the AI research terminal for financial advisors. Market tools return quotes, stock snapshots, price history, 13F holdings, a fundamentals screener, FRED economic series, the Treasury curve, sentiment and news, with dates and sources where available. Deterministic advisor calculations from afa: portfolio review and rebalancing, retirement Monte Carlo, Roth conversions, Social Security claiming, compliance screening and client email triage. Every figure is computed by code, not a model: quote numbers as returned and keep their caveats. Projections and stress tests are hypothetical. Results are for a financial advisor to review; they are not investment, tax or legal advice. Run compliance_screen on client-facing text before it is sent.",
      "tools": [
        {
          "name": "compliance_screen",
          "title": "Compliance screen",
          "description": "Screen draft client communications (emails, letters, social posts, meeting notes) for common FINRA/SEC communication-rule problems, including guarantees, misleading projections, pressure tactics, testimonials, specific recommendations, tax claims, missing performance disclosures, and Social Security or account numbers. Returns a status (clear, review or revise), findings with suggested revisions, and disclosure language for the firm’s compliance review.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "clientFacing": {
                "description": "True (default) when the text goes to a client or the public; checks for a general risk disclosure.",
                "type": "boolean"
              },
              "hasProfile": {
                "description": "True when the client has a documented risk profile on file; lowers the severity of specific recommendations.",
                "type": "boolean"
              },
              "text": {
                "description": "The text to screen, up to 60,000 characters.",
                "maxLength": 60000,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compliance screen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2553ec642191d09ee374851389d61a10882cca860d8efb90589b8c94733c764c"
        },
