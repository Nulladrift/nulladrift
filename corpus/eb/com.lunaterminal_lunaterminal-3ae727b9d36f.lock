        {
          "name": "risk_profile_score",
          "title": "Risk profile score",
          "description": "Score the eight-question risk questionnaire and map the client to a model portfolio. Four questions measure capacity to absorb losses and four measure willingness to take risk. The profile uses the lower of the two. With no answers, the result contains the questions and choices. With eight answers scored from 1 to 5, it returns the profile, score, rationale, model allocation, and illustrative return and volatility.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": false,
                "description": "All eight answers, each 1-5 (1 = first option). Omit to get the questionnaire.",
                "properties": {
                  "drawdown": {
                    "description": "If the portfolio fell 20% over a few months, the client would most likely… 1 = Sell everything; 2 = Sell some; 3 = Wait it out; 4 = Rebalance into stocks; 5 = Add significant new money.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "experience": {
                    "description": "How would you describe the client’s investing experience? 1 = None; 2 = Limited; 3 = Moderate; 4 = Experienced; 5 = Extensive, including market downturns.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "horizon": {
                    "description": "When will the client need to start withdrawing a significant part of this money? 1 = Within 3 years; 2 = 3 to 5 years; 3 = 6 to 10 years; 4 = 11 to 15 years; 5 = More than 15 years.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "income": {
                    "description": "How stable is the client’s income, excluding this portfolio? 1 = No other income; relies on this portfolio; 2 = Unstable; 3 = Somewhat stable; 4 = Stable; 5 = Very stable with a surplus.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "objective": {
                    "description": "What is the client’s primary objective for this money? 1 = Preserve capital; 2 = Generate income; 3 = Balance growth and income; 4 = Growth; 5 = Aggressive growth.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "range": {
                    "description": "Which one-year range of outcomes would the client accept? (illustrative) 1 = −2% to +6%; 2 = −6% to +12%; 3 = −12% to +20%; 4 = −20% to +30%; 5 = −30% to +45%.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "reserves": {
                    "description": "How much emergency savings does the client hold outside this portfolio? 1 = None; 2 = Less than 3 months of expenses; 3 = 3 to 6 months; 4 = 6 to 12 months; 5 = More than 12 months.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "withdrawals": {
                    "description": "How much of the portfolio will the client withdraw each year over the next five years? 1 = More than 10%; 2 = 6% to 10%; 3 = 3% to 5%; 4 = Less than 3%; 5 = None.",
                    "maximum": 5,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Risk profile score"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
