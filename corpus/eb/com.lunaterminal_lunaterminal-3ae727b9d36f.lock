        {
          "name": "inherited_ira_plan",
          "title": "Inherited IRA plan",
          "description": "Work out the distribution rules for an inherited IRA under the SECURE Act final regulations (T.D. 10001) and IRS Pub. 590-B: the beneficiary class (eligible designated, designated or non-designated), whether the owner died before or after the required beginning date, the rule that applies (life expectancy, 10-year with or without annual RMDs, 5-year), the deadline to empty the account, this year's required minimum from the Single Life Expectancy Table, and four ways to drain it (back-loaded, even, front-loaded, fill a bracket) compared on federal tax in 2026 dollars and after-tax value. No names or account numbers are needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "balance": {
                "description": "Account balance on December 31 of the prior year.",
                "minimum": 0,
                "type": "number"
              },
              "beneficiaryBirthYear": {
                "description": "Beneficiary's birth year (not needed for non_designated).",
                "maximum": 2026,
                "minimum": 1900,
                "type": "integer"
              },
              "beneficiaryClass": {
                "description": "spouse = Surviving spouse; minor_child = Owner’s child under 21; disabled = Disabled; chronically_ill = Chronically ill; close_in_age = Not more than 10 years younger than the owner; designated = Other person (designated beneficiary); non_designated = Estate, charity or non-qualifying trust.",
                "enum": ["spouse", "minor_child", "disabled", "chronically_ill", "close_in_age", "designated", "non_designated"],
                "type": "string"
              },
              "electTenYear": {
                "description": "Eligible beneficiary elected the 10-year rule (owner died before the required beginning date).",
                "type": "boolean"
              },
              "filingStatus": {
                "description": "Beneficiary's filing status (default single).",
                "enum": ["single", "mfj"],
                "type": "string"
              },
              "fillRate": {
                "description": "Bracket to fill each year in the fill strategy (default 24).",
                "enum": [10, 12, 22, 24, 32, 35],
                "type": "integer"
              },
              "otherIncome": {
                "description": "Beneficiary's other ordinary income per year (default 0).",
                "minimum": 0,
                "type": "number"
              },
              "ownerBirthYear": {
                "description": "Original owner's birth year.",
                "maximum": 2026,
                "minimum": 1900,
                "type": "integer"
              },
              "ownerDeathDate": {
                "description": "Owner's date of death, YYYY-MM-DD (or a year).",
                "maxLength": 10,
                "type": "string"
              },
              "realReturn": {
                "description": "Annual return after inflation in percent (default 0).",
                "maximum": 15,
                "minimum": -10,
                "type": "number"
              },
              "roth": {
                "description": "True for an inherited Roth IRA.",
                "type": "boolean"
              },
              "stateTaxRate": {
                "description": "Flat state tax rate in percent (default 0).",
                "maximum": 15,
                "minimum": 0,
                "type": "number"
              },
              "takenThisYear": {
                "description": "Distributions already taken this year (default 0).",
                "minimum": 0,
                "type": "number"
              },
              "year": {
                "description": "Plan year (default 2026).",
                "maximum": 2200,
                "minimum": 1990,
                "type": "integer"
              }
            },
            "required": ["balance", "beneficiaryClass", "ownerBirthYear", "ownerDeathDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Inherited IRA plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:341c30b67ba1d218e6f0feeaf5b9ee753754947e7033c6cf22b2de040bd0cfdf"
        },
        {
          "name": "portfolio_review",
          "title": "Portfolio review",
          "description": "Review a household's holdings against a target model or custom allocation. Returns value by asset class and account, allocation drift, single-stock concentration, tax-loss harvesting candidates, unrealized gains, stress tests, and an asset-location score with suggestions. Missing prices are fetched from live quotes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "band": {
                "description": "Rebalancing band in percentage points (default 5): an asset class further than this from target is out of band.",
                "maximum": 25,
                "minimum": 1,
                "type": "number"
              },
              "concentrationLimit": {
                "description": "Flag a single non-diversified holding above this % of the household (default 10).",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "harvestMinimum": {
                "description": "Smallest unrealized loss in dollars worth listing as a tax-loss candidate (default 1000).",
                "maximum": 10000000,
                "minimum": 0,
                "type": "number"
              },
              "holdings": {
                "description": "Holdings as objects, instead of holdingsCsv. Up to 300 rows; one row per lot gives the best tax estimates.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "account": {
                      "description": "Account name, e.g. \"Joint brokerage\". Default \"Brokerage\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "accountType": {
                      "description": "taxable, brokerage, individual, joint, trust, ira, traditional ira, rollover ira, sep ira, 401k, 403b, 457, roth, roth ira, roth 401k, hsa or other. Default taxable.",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "acquired": {
                      "description": "Date acquired, YYYY-MM-DD; decides short- or long-term gains.",
                      "maxLength": 10,
                      "type": "string"
                    },
                    "assetClass": {
                      "description": "Optional override: us_equity, intl_equity, bonds, cash or alternatives, or a split such as \"us_equity:60;bonds:40\". Common ETFs and index funds are classified automatically; unknown tickers count as US stocks.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "costBasis": {
                      "description": "Total cost basis of this row in dollars (not per share). Omit when unknown.",
                      "minimum": 0,
                      "type": "number"
                    },
                    "shares": {
                      "description": "Number of shares; for CASH, the dollar amount.",
                      "exclusiveMinimum": 0,
                      "type": "number"
                    },
                    "symbol": {
                      "description": "Ticker, e.g. VTI. Use CASH for cash balances.",
                      "maxLength": 18,
                      "type": "string"
                    }
                  },
                  "required": ["shares", "symbol"],
                  "type": "object"
                },
                "maxItems": 300,
                "type": "array"
              },
              "holdingsCsv": {
                "description": "Holdings as CSV text in the afa import format: a header row with at least symbol and shares; the full header is account,account_type,symbol,shares,cost_basis,asset_class,acquired. cost_basis is the row's total dollars, acquired is YYYY-MM-DD. Example:\naccount,account_type,symbol,shares,cost_basis,asset_class,acquired\nJoint brokerage,taxable,VTI,120,24000,,2021-03-15\nJoint brokerage,taxable,AAPL,150,18000,,2019-06-01\nJoint brokerage,taxable,CASH,8000,8000,,\nUp to 300 rows and 128 KB. Send this or holdings, not both.",
                "maxLength": 131072,
                "type": "string"
              },
              "model": {
                "description": "Target model portfolio: conservative (20% stocks), moderately_conservative (40% stocks), moderate (60% stocks), growth (75% stocks), aggressive (90% stocks). Default moderate. risk_profile_score maps a client to one.",
                "enum": ["conservative", "moderately_conservative", "moderate", "growth", "aggressive"],
                "type": "string"
              },
              "prices": {
                "additionalProperties": {
                  "exclusiveMinimum": 0,
                  "type": "number"
                },
                "description": "Latest price per share by symbol, e.g. {\"VTI\": 301.25}. CASH and money-market funds are priced at $1. Symbols without a price here are fetched from live quotes.",
                "maxProperties": 1000,
                "type": "object"
              },
              "target": {
                "additionalProperties": false,
                "description": "Custom target allocation in percent, totalling 100. Use instead of model.",
                "properties": {
                  "alternatives": {
                    "description": "Real estate & alternatives target %",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "bonds": {
                    "description": "Bonds target %",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "cash": {
                    "description": "Cash & equivalents target %",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "intl_equity": {
                    "description": "International stocks target %",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "us_equity": {
                    "description": "US stocks target %",
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Portfolio review"
          },
          "behavior": {
