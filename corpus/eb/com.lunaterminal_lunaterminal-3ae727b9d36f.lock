        {
          "name": "retirement_plan",
          "title": "Retirement plan (Monte Carlo)",
          "description": "Run a retirement Monte Carlo simulation in today's dollars: probability that savings last through the planning age, the range of portfolio values at retirement and at the end, median depletion age when paths fail, the initial withdrawal rate, the effect of three levers (save more, retire two years later, spend 10% less) and the highest spending that keeps the target success rate. Required: currentAge, retirementAge, planToAge, savings and spending. Return and volatility default to afa's capital market assumptions for the chosen model (a step more conservative in retirement); other optional inputs default to 0, and inflation to 2.5%. Results are hypothetical.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contribution": {
                "description": "Annual savings until retirement.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "contributionGrowth": {
                "description": "Annual savings growth above inflation (%).",
                "maximum": 10,
                "minimum": -10,
                "type": "number"
              },
              "currentAge": {
                "description": "Current age.",
                "maximum": 100,
                "minimum": 18,
                "type": "integer"
              },
              "distribution": {
                "description": "normal (default) or fat-tailed returns (Student-t), which make severe years more frequent.",
                "enum": ["normal", "fat"],
                "type": "string"
              },
              "expectedReturn": {
                "description": "Expected annual return before retirement (%).",
                "maximum": 20,
                "minimum": -5,
                "type": "number"
              },
              "expectedReturnRetired": {
                "description": "Expected annual return in retirement (%).",
                "maximum": 20,
                "minimum": -5,
                "type": "number"
              },
              "inflation": {
                "description": "Inflation (%).",
                "maximum": 15,
                "minimum": -2,
                "type": "number"
              },
              "model": {
                "description": "Model portfolio used for omitted return and volatility inputs: conservative (20% stocks), moderately_conservative (40% stocks), moderate (60% stocks), growth (75% stocks), aggressive (90% stocks). Default moderate.",
                "enum": ["conservative", "moderately_conservative", "moderate", "growth", "aggressive"],
                "type": "string"
              },
              "otherIncome": {
                "description": "Social Security, pensions and other income per year, in today’s dollars.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "otherIncomeAge": {
                "description": "Age other income starts.",
                "maximum": 100,
                "minimum": 50,
                "type": "integer"
              },
              "planToAge": {
                "description": "Plan through age.",
                "maximum": 110,
                "minimum": 60,
                "type": "integer"
              },
              "retirementAge": {
                "description": "Retirement age.",
                "maximum": 100,
                "minimum": 30,
                "type": "integer"
              },
              "savings": {
                "description": "Current investable savings.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "seed": {
                "description": "Random seed; the same inputs and seed give the same result (default 1).",
                "maximum": 2147483648,
                "minimum": 0,
                "type": "integer"
              },
              "spending": {
                "description": "Annual retirement spending from the portfolio and other income, in today’s dollars.",
                "maximum": 100000000,
                "minimum": 0,
                "type": "number"
              },
              "targetSuccess": {
                "description": "Success rate in percent used for sustainable spending (default 85).",
                "maximum": 99,
                "minimum": 50,
                "type": "number"
              },
              "trials": {
                "description": "Number of simulated market paths (default 2000).",
                "maximum": 10000,
                "minimum": 100,
                "type": "integer"
              },
              "volatility": {
                "description": "Annual volatility before retirement (%).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
              "volatilityRetired": {
                "description": "Annual volatility in retirement (%).",
                "maximum": 60,
                "minimum": 0,
                "type": "number"
              },
