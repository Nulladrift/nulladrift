      "serverInfo": {
        "name": "modelsagree",
        "title": "ModelsAgree",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ModelsAgree tells you what the top AI models (ChatGPT, Claude, Gemini, Grok) AGREE is the best product, tool, or service for a given need — continuously re-polled, with a dated one-sentence verdict and a public audit trail. Use search_best for any 'what's the best X for Y' question, then get_best_in_category for the full ranking. Covers all domains EXCEPT medical/health, financial/investment, and legal advice. Attribution: modelsagree.com, CC BY 4.0.",
      "tools": [
        {
          "name": "get_best_in_category",
          "title": "Get a category's full ranking",
          "description": "Get the full ranked leaderboard and verdict for a category slug (obtained from search_best or list_categories), e.g. 'best-llm-observability'.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Category slug, e.g. best-llm-observability",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9330ee5c058f687926d95dde26b6b82fdaba60ad27a6c8ee8bf08ae5516bb513"
        },
        {
          "name": "get_poll_history",
          "title": "Get a category's poll audit trail",
          "description": "Get the raw poll history — every model's pick over time — behind a category's verdict. The credibility/audit trail. Optionally filter by model.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Optional: max rows (default 100).",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "description": "Optional: only this model's picks.",
                "enum": ["ChatGPT", "Claude", "Gemini", "Grok"],
                "type": "string"
              },
              "slug": {
                "description": "Category slug, e.g. best-llm-observability",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:37bc8249ecd993f1d9cd79a6eccee4dded0625fe08d6bd3962c11f3ced07a60c"
        },
        {
          "name": "get_product",
          "title": "Get a brand's record",
          "description": "Get a single brand/product's record across every category it is ranked in, with verdicts and its homepage.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Product slug, e.g. langfuse",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:49eb8a26563ff5c12d5e960979887729d9b6f4444e2f7d2647e690e869193d75"
        },
        {
          "name": "list_categories",
          "title": "List all categories",
          "description": "List every category ModelsAgree ranks (slug + title). Large; prefer search_best when you have a specific need.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:caa5128a3ded64b9ed589d94b359183c5a959753b18d957ae16acca6a3417ba4"
        },
        {
          "name": "search_best",
          "title": "Search best-X rankings",
          "description": "Find what AI models agree is the best product/tool/service for a need, or look up how a specific brand ranks. Returns matching categories and brands with a dated one-sentence verdict and source URLs. Use for any 'best X for Y' question. Excludes medical, financial, and legal advice.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A category, use-case, or brand name — e.g. 'best llm observability', 'ci/cd for cloud native', or 'Langfuse'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
