{
  "lockfileVersion": 2,
  "subjects": {
    "com.open5500/open5500": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.open5500.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "open5500",
        "title": "Open5500",
        "version": "1.0.0",
        "websiteUrl": "https://www.open5500.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Open5500 answers questions about U.S. employers' health and welfare benefit plans from public Form 5500 filings: insurance carriers, brokers of record and their commissions, premiums, medical funding (fully insured / self-funded), renewal months, plan-year history and comp-rate benchmarks. Use search_employers to find employers by name, place, size, funding, renewal month, broker, carrier or recent broker change; get_employer for one employer's contracts, service providers (TPA, consultants), retirement plan (401(k)/403(b) assets, participants, advisors) and history; get_broker / get_carrier / get_state / get_recordkeeper / get_retirement_advisor for market views; get_benchmarks for typical comp rates and premiums. Data is as filed with the Department of Labor (may be incomplete or out of date) and is not advice. Cite the url field so users can check the original filing.",
      "tools": [
        {
          "name": "get_benchmarks",
          "title": "Get comp and premium benchmarks",
          "description": "Broker comp-rate benchmarks (median, 25th and 75th percentile of commissions + fees as a share of premium) and median premium per covered life per month, by line of coverage and group size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "line": {
                "description": "Line of coverage, e.g. Medical, Dental, Life. Omit for all lines.",
                "type": "string"
              },
              "participants": {
                "description": "Group size to pick the size band. Omit for all bands.",
                "minimum": 0,
                "type": "integer"
              },
              "plan_assets": {
                "description": "With retirement: plan assets in dollars to pick the size band",
                "minimum": 0,
                "type": "number"
              },
              "retirement": {
                "description": "Instead return 401(k)/403(b) fee benchmarks: administrative expenses paid from plan assets as a share of assets and per active participant, by plan size (fund expenses not included)",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f01209b33538bd31f4eb9ce58fbe81a0aaadd069a1cb1abeba786d2b77c925c0"
        },
        {
          "name": "get_broker",
          "title": "Get broker book of business",
          "description": "A brokerage firm's book from Form 5500 filings: employers, participants, premium placed, commissions and fees, comp rate, top states and carriers, group sizes, recent broker-of-record changes (groups gained and groups that moved), largest employers. Firms with 5+ employers only; individual agents aren't covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Firm name or page slug, e.g. Lockton or marsh-mclennan-agency",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cb10bde06b01e03ca37637aed59fafd742fc38446d40c239688ff6fadbd5215"
        },
        {
          "name": "get_carrier",
          "title": "Get carrier market view",
          "description": "An insurance carrier's group business from Form 5500 filings: employers, premium, covered lives, lines, top states, brokers placing it, median comp rate, largest employers; plus its fully insured small- and large-group market share, 3-year MLR and rebates owed by state from CMS Medical Loss Ratio data (field mlr). Carriers with 5+ employers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Carrier name or slug, e.g. Cigna",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:512b1cad5415bc2218055789f8b01c665872243fa0b9567fd170bfb93eef80c4"
        },
        {
          "name": "get_employer",
          "title": "Get employer details",
          "description": "One employer by EIN: every Schedule A contract (carrier, lines, premium, covered lives, commissions and fees, comp rate, broker), plans with links to the original filing PDFs, and plan-year history back to 2019 (participants, premium, funding, carriers, brokers).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ein": {
                "description": "9-digit EIN (dashes optional)",
                "type": "string"
              }
            },
            "required": ["ein"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b91c3f564e34edc4ca1803629124efbd6590b279c92ac443fe9c49e185ebb466"
        },
        {
          "name": "get_recordkeeper",
          "title": "Get recordkeeper market view",
          "description": "A 401(k)/403(b) recordkeeper's plans among employers on Open5500: plans, share of plans with a recordkeeper identified, active participants, plan assets, plans by asset size, states, advisor firms on its plans and largest plans. From Schedule C (plans paying providers $5,000+), identified with an AI model. Recordkeepers with 25+ plans.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Recordkeeper name or slug, e.g. Fidelity, Empower, Principal",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a890d9581e9d318a7e01618cb0b2b1707740e3d5052c92364847cbde5d98ece1"
        },
        {
          "name": "get_retirement_advisor",
          "title": "Get retirement advisor firm view",
          "description": "A 401(k)/403(b) advisory or consulting firm's plans among employers on Open5500 (Schedule C codes 16, 17, 26, 27): plans, active participants, plan assets, plans by size, states, recordkeepers on its plans and largest plans; bd = mostly filed as a broker-dealer platform. Managed-account and fiduciary services offered through recordkeepers are not included. Firms with 25+ plans or a broker page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Firm name or slug, e.g. CAPTRUST, SageView Advisory Group, OneDigital",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:211a1f4830aa73d7084ca68b4fa0f55d14d75fef1cc03870c87f0df4afa9aa75"
        },
        {
          "name": "get_state",
          "title": "Get state market view",
          "description": "Employee benefits market in one state: employers, participants, premium, funding mix, top medical carriers, top brokers, renewal months, median comp rate, largest employers; plus fully insured small- and large-group market share, 3-year MLR and rebates owed by carrier from CMS Medical Loss Ratio data (field mlr), which also covers groups too small to file a 5500.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "Two-letter state code, e.g. OH",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8fc9acd71aedc2ef2ab5fe6d980db11e8d53bfcabcb6991f13951715d02beb31"
        },
        {
          "name": "search_employers",
          "title": "Search employers",
          "description": "Find employers with Form 5500 health and welfare filings. All filters are optional and combine with AND. Returns up to 100 matches, largest first, with carriers, brokers, premium, comp rate, funding and renewal month. Union and multiple-employer plans are excluded unless include_union is true, and PEOs unless include_peo is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "broker": {
                "description": "Broker firm name (exact or partial), e.g. Lockton",
                "type": "string"
              },
              "broker_changed": {
                "description": "Only employers whose broker of record changed in one of the two latest plan years",
                "type": "boolean"
              },
              "carrier": {
                "description": "Carrier name (exact or partial), e.g. Cigna",
                "type": "string"
              },
              "changed": {
                "description": "Only employers with any of these recent changes vs their previous filing, comma-separated: broker, carrier (main medical carrier), funding (fully insured <-> self-funded), headcount (participants up or down 25%+ and 100+), ended (plan ended: final filing), new (first Form 5500 filing under this EIN), recordkeeper (401(k)/403(b) recordkeeper changed), advisor (401(k)/403(b) advisor firm changed)",
                "type": "string"
              },
              "city": {
                "description": "City (prefix match)",
                "type": "string"
              },
              "current_plan_year_only": {
                "description": "Only employers whose latest filing is plan year 2025 or later",
                "type": "boolean"
              },
              "employer_type": {
                "description": "Employer type: Company, Nonprofit, School or university, Health system, Government, Church, Union or trust fund, Association or MEWA, PEO, Other (identified by an AI model from the name)",
                "type": "string"
              },
              "funding": {
                "description": "Medical funding, comma-separated: Fully insured, Self-funded (stop-loss), Self-funded, Mixed, Unknown, No medical reported. Partial words like 'self-funded' match both self-funded labels.",
                "type": "string"
              },
              "has_line": {
                "description": "Line of coverage the employer offers, e.g. Medical, Dental, Vision, Life, LTD, STD, Stop-Loss",
                "type": "string"
              },
              "include_peo": {
                "description": "Include PEOs (professional employer organizations such as ADP TotalSource or Insperity), which file one plan for many client companies",
                "type": "boolean"
              },
              "include_small_plans": {
                "description": "Also include about 170,000 small-plan employers (25+ participants) that file only the short Form 5500-SF. They have no carriers, brokers, premium or renewal month; their size and 401(k)/403(b) plan come from the short form",
                "type": "boolean"
              },
              "include_union": {
                "description": "Include union (Taft-Hartley) and multiple-employer plans",
                "type": "boolean"
              },
              "industry": {
                "description": "Industry sector, e.g. Manufacturing, Health care",
                "type": "string"
              },
              "limit": {
                "description": "Default 25",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_participants": {
                "minimum": 0,
                "type": "integer"
              },
              "max_plan_assets": {
                "description": "Maximum retirement plan net assets in dollars",
                "minimum": 0,
                "type": "number"
              },
              "min_participants": {
                "minimum": 0,
                "type": "integer"
              },
              "min_plan_assets": {
                "description": "Minimum retirement plan net assets in dollars (largest 401(k)/403(b))",
                "minimum": 0,
                "type": "number"
              },
              "missing_line": {
                "description": "Line the employer does NOT have on Schedule A",
                "type": "string"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to match in employer name, DBA, city, ZIP or EIN",
                "type": "string"
              },
              "recordkeeper": {
                "description": "401(k)/403(b) recordkeeper (exact or partial), e.g. Fidelity, Empower. From the retirement plan's Schedule C, identified with an AI model",
                "type": "string"
              },
              "renewal_months": {
                "description": "Renewal months, 1-12",
                "items": {
                  "maximum": 12,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "retirement_advisor": {
                "description": "Advisory or consulting firm paid by the 401(k)/403(b) plan (exact or partial), e.g. CAPTRUST, SageView. Firms only",
                "type": "string"
              },
              "sort": {
                "description": "Sort order (default participants)",
                "enum": ["participants", "premium", "comp"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, e.g. OH",
                "type": "string"
              },
              "tpa": {
                "description": "Third-party administrator from Schedule C (exact or partial), e.g. UMR, Meritain. Mostly self-funded plans with a trust.",
                "type": "string"
              },
              "zip": {
                "description": "ZIP code prefix, e.g. 432",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8ec02cd5899df1be9c271f5d449dd00ed4631c3e844c4c256beeb6d5af727e7"
        }
      ],
      "digest": "sha256:87ac79e123c37bfbeae5dcc814582d58a176e6dd502db42be9ca67884eaf2e25"
    }
  }
}
