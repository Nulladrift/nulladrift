{
  "lockfileVersion": 2,
  "subjects": {
    "com.mahastrategies/context-review": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.mahastrategies.com/api/mcp/context-review"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "maha-context-review",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "review_context_retention",
          "title": "Review context retention",
          "description": "Select passages from explicitly supplied sanitized documents under an estimated token budget, and check whether user-declared exact evidence excerpts remain in selected passages from their specified source. No web access, storage, payments, semantic correctness guarantee, or downstream prompt capture. Do not send credentials, government IDs, payment card data, protected health information, or confidential personal records.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "documents": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,79}$",
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 60000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "maxLength": 160,
                      "type": "string"
                    }
                  },
                  "required": ["id", "text"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "expectedEvidence": {
                "description": "Caller-declared exact excerpts required for this task. An empty list means completeness was not tested.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "excerpt": {
                      "maxLength": 2000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "sourceId": {
                      "maxLength": 80,
                      "type": "string"
                    }
                  },
                  "required": ["excerpt", "sourceId"],
                  "type": "object"
                },
                "maxItems": 32,
                "type": "array"
              },
              "sanitized": {
                "const": true,
                "description": "Confirm these are authorized, sanitized or synthetic task-specific excerpts, not restricted data.",
                "type": "boolean"
              },
              "task": {
                "maxLength": 1200,
                "minLength": 8,
                "type": "string"
              },
              "tokenBudget": {
                "maximum": 16000,
                "minimum": 64,
                "type": "integer"
              }
            },
            "required": ["documents", "sanitized", "task", "tokenBudget"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad27e5706ea53abdf75a04be3b1a98f77e88707d9a1b7e6c6fe909d9f6c6dcb6"
        }
      ],
      "digest": "sha256:86ae48bcdcce7c7679531043915f6df430f99564b011dfa532839b741e7a57f7"
    }
  }
}
