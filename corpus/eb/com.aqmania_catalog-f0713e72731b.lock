      },
      "instructions": "CPQ-инструменты AquaMania для оснащения раздевалок: list_concepts → configure_locker → get_quote → make_kp. Цены реальные. Читающие инструменты публичны; пишущие (make_kp/make_tender_package/make_project/dealer_order) требуют API-ключ в заголовке Authorization: Bearer aqm_live_… (получить у менеджера AquaMania, 8 800 700 99 12). Диагностика авторизации различима: HTTP 401 + structuredContent.error=\"missing_api_key\" — заголовок не передан; 401 + \"invalid_api_key\" — ключ не распознан (проверьте формат/опечатку); 403 + \"revoked_api_key\" — ключ отозван; 503 + \"db_unavailable\" — проверить ключ временно нельзя, дело не в вас; 403 + \"insufficient_scope\" — инструмент вне прав ключа. НЕТ КЛЮЧА? Звонить никуда не нужно: вызовите request_api_key (достаточно email), заявку одобряет человек, затем заберите ключ через check_api_key_request.",
      "tools": [
        {
          "name": "calc_nmck",
          "description": "Рассчитать НМЦК (начальную максимальную цену контракта) методом сопоставимых рыночных цен, ст. 22 ФЗ-44, по конфигурации раздевалки. Возвращает 3 предложения по позициям (№1 — цена производителя, №2/№3 — РАСЧЁТНЫЕ по модели разброса +9%/+17%, не полученные КП — для закупки заменить реальными), среднюю, коэффициент вариации и НМЦК. Без файлов.",
          "inputSchema": {
            "properties": {
              "concept": {
                "enum": ["max", "bench", "bench3", "bench4"],
                "type": "string"
              },
              "lockers": {
                "type": "number"
              },
              "material": {
                "enum": ["ЛДСП", "HPL"],
                "type": "string"
              },
              "name": {
