        },
        {
          "name": "calc_nmck_cart",
          "description": "НМЦК (ст. 22 ФЗ-44) по ЛЮБОЙ корзине каталога или явным позициям — для агента закупщика (не только раздевалки). Передайте cart:[{article,qty}] (артикулы — через find_product; имя/цена берутся из прайса производителя как источник №1) ИЛИ items:[{name,qty,price}] с собственными ценами заказчика. Опц. coeffs — свои коэффициенты рыночного разброса (по умолчанию 1.0/1.09/1.17). Возвращает по позициям 3 ценовых предложения, среднюю, коэффициент вариации V, однородность (V≤33%) и НМЦК. Без файлов.",
          "inputSchema": {
            "properties": {
              "cart": {
                "description": "позиции каталога [{article, qty}] — цены из прайса производителя (источник №1)",
                "items": {
                  "properties": {
                    "article": {
                      "type": "string"
                    },
                    "qty": {
                      "type": "number"
                    }
                  },
                  "required": ["article", "qty"],
                  "type": "object"
                },
                "type": "array"
              },
              "coeffs": {
                "description": "опц. коэффициенты рыночного разброса (≥2 значения), напр. [1.0, 1.08, 1.15]",
