        {
          "name": "find_product",
          "description": "Поиск по всему каталогу продукции AquaMania (162 SKU: шкафы, ПВХ-стеллажи, скамьи, тумбы, дорожки, алюминий). Ищет по артикулу (платформенному и 1С), названию, габаритам, описанию; фильтры по категории и материалу. Каждая позиция возвращает description (габариты · материал · особенности конструкции) и size — по ним и выбирайте. Цена НЕ означает «базовость» модели: если у нескольких позиций совпали габариты и материал, поле note предупредит об этом — уточните у заказчика, а не угадывайте.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "фильтр по категории",
