{
  "lockfileVersion": 2,
  "subjects": {
    "ai.subpay/document-reader": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://subpay.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "subpay-document-reader",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Reads construction pay applications — the AIA G702 Application and Certificate for Payment with its G703 Continuation Sheet, including Procore and Textura versions — and change orders, from PDF into structured JSON with arithmetic checks. Call extract_document with the PDF base64-encoded; it costs $0.04 per page (up to 25 pages) in USDC per successful read over x402 (Base or Solana) — the payment request quotes the exact amount for your document — and failed reads are not charged. First 3 reads a day are free (documents up to 10 pages, no payment needed); after that, the usual price. Output is automated: check the returned `checks` and `warnings`, and verify figures against the document before relying on them. If you need a document or field it doesn't support yet, call request_capability (free) with what you need and what you'd pay per read. Terms: https://subpay.ai/api-terms",
      "tools": [
        {
          "name": "about",
          "title": "About this service",
          "description": "Free. What extract_document reads, its price, payment networks, and terms.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6a4904be648b5e85677ef27c97f529a49092250937b7ebae03f6480715ef915f"
        },
        {
          "name": "extract_document",
          "title": "Read an AIA G702/G703 pay application or a change order",
          "description": "Reads construction pay applications — the AIA G702 Application and Certificate for Payment with its G703 Continuation Sheet, including Procore and Textura versions — and change orders, from PDF into structured JSON with arithmetic checks. Returns gross this period, retainage held and released, completed to date, contract sum, balance to finish and payment due for pay apps; for change orders, whether it is the subcontractor's request or the GC's executed change order, plus number, amount and date. $0.04 per page (up to 25 pages) in USDC per successful read via x402, quoted before you pay; failed reads are free. First 3 reads a day are free (documents up to 10 pages, no payment needed); after that, the usual price.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "document": {
                "description": "The PDF, base64-encoded (a data: URL prefix is fine). Max about 3 MB and 25 pages.",
                "type": "string"
              },
              "fileName": {
                "description": "Original file name, if known.",
                "type": "string"
              },
              "gc": {
                "description": "General contractor name.",
                "type": "string"
              },
              "subcontractor": {
                "description": "Subcontractor company name — helps tell an RCO from a GC change order.",
                "type": "string"
              }
            },
            "required": ["document"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9c1d775f23c8c41af69d8ce73a6be7d5df4aedab53198b726e6fc6e0d535ab8a"
        },
        {
          "name": "request_capability",
          "title": "Request a document type or field",
          "description": "Free. Tell Subpay about a construction document or field extract_document doesn't support yet (e.g. lien waivers, invoices), and the most you'd pay per read. Used to decide what to build next. No personal information, please.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "documentType": {
                "description": "The document you want read, e.g. 'conditional lien waiver', 'subcontractor invoice', 'schedule of values'.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "fieldsNeeded": {
                "description": "The fields you need extracted from it.",
                "maxLength": 1000,
                "type": "string"
              },
              "maxPricePerReadUsd": {
                "description": "The most you would pay per read, in US dollars.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "monthlyVolume": {
                "description": "Roughly how many per month.",
                "maximum": 10000000,
                "minimum": 0,
                "type": "integer"
              },
              "notes": {
                "description": "Anything else. Please don't include personal information.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["documentType"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c34622dd056cf32b4c8b7339e8b1d7eb86db09df5822c15b14970cb03ed1677"
        }
      ],
      "digest": "sha256:82ca3e3a73b6fc8f25186aa8e3dc4f2ee6232d8162470c279e26fe38b3a62ae6"
    }
  }
}
