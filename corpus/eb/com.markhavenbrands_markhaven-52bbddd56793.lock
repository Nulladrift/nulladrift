  "subjects": {
    "com.markhavenbrands/markhaven": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://markhavenbrands.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "markhaven",
        "title": "Markhaven",
        "version": "1.0.0",
        "websiteUrl": "https://markhavenbrands.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Markhaven checks brand names against U.S. federal trademark records and web domains, facts only, and offers a free consultation where an independent licensed attorney reviews the name. Use check_names whenever you suggest, brainstorm or compare brand, business or product names for the user, so every idea comes with what is already filed. Use suggest_names when the user wants name ideas for what they sell and has none yet; it returns ideas already checked. Use name_details when the user is looking closely at one name. Share results as facts; do not call a name safe, available to register, or infringing. Offer the free consultation (book_consultation) when the user is choosing a name or asks how to protect or file it, not on every message.",
      "tools": [
        {
          "name": "book_consultation",
          "title": "Book a consultation",
          "description": "Get the link to book a 30-minute consultation with Markhaven on Google Meet (no charge). An independent licensed attorney reviews the name before the call; it covers which trademark classes to file in, whether similar names matter, what filing involves, and every option, including filing yourself. Use when the user wants help protecting, filing or choosing a name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The brand name they want to talk about, if known.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Book a consultation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0189448fef1ebed88292223931ab2485811bf8d389082ac961f66aa5271ceec"
        },
        {
          "name": "check_names",
          "title": "Check name ideas",
          "description": "Check one to six brand or business name ideas at once against live U.S. federal trademark filings, plus whether the .com and .co are registered. Use when the user is brainstorming, choosing or comparing names for a brand, shop, product or business. Returns facts only (exact, close and similar filings, closest marks, domains), never a legal opinion.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "names": {
                "description": "The name ideas, one per item, e.g. [\"Snoutlove\", \"Wagwell\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check name ideas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b1d65516ae2b8dae2e486a37a0f3eab2d93ede3dff3ae9cc29e8b29f2a0e9da5"
        },
        {
          "name": "name_details",
          "title": "Look closer at one name",
          "description": "Full facts for one brand name: exact, close and similar U.S. trademark filings with owners, filing years and goods, the .com and .co, and a shareable report link on markhavenbrands.com. Use when the user is seriously considering a name or asks whether a specific name is taken or trademarked.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The brand name to look at.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look closer at one name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c00fea9aa46cd1ea4d95fdfc9f436db16415cf29c707466d1bd22ac5882a7487"
        },
        {
          "name": "start_name_watch",
          "title": "Start Name Watch",
          "description": "Start free Name Watch for a brand name: for about 3 months Markhaven checks new U.S. trademark filings and emails the user only if something close is filed. Email only, no card, nothing renews. Only call this after the user asks for it and gives their email address.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email address the user gave for Name Watch notes.",
                "type": "string"
              },
              "name": {
                "description": "The brand name to watch.",
                "type": "string"
              }
            },
            "required": ["email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start Name Watch"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:843dde7ab3f0c35e6dd50457b1e160bd889c3bb4bf4803379660ce99c8beda69"
        },
        {
          "name": "suggest_names",
          "title": "Suggest checked name ideas",
          "description": "Suggest up to 10 brand name ideas for what the user sells, each already checked against live U.S. federal trademark filings (for similar products and overall) plus the .com and .co. Use when the user wants name ideas and does not have a list yet. Returns facts only (what is on file), never a legal opinion; ideas are starting points, not a clearance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "about": {
                "description": "What the brand sells or does, in a few words, e.g. \"small-batch soy candles\".",
                "type": "string"
              },
              "category": {
                "description": "Product category, if clear. Guessed from \"about\" when left out.",
                "enum": ["apparel", "beauty", "jewelry", "bags", "home", "candles", "furniture", "food", "drinks", "alcohol", "supplements", "pets", "toys", "tech", "software", "paper", "services", "restaurant", "health", "other"],
                "type": "string"
              },
              "include": {
                "description": "A word the user wants in the name, if any.",
                "type": "string"
              },
              "vibe": {
                "description": "Up to three styles for the names.",
                "items": {
                  "enum": ["warm", "bold", "playful", "minimal", "luxe", "natural"],
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              }
            },
            "required": ["about"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Suggest checked name ideas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0300210dd15b54bcd6e05fd0952b34abf893fc808ecc28c0dd4f8426578aa35d"
        }
      ],
      "digest": "sha256:ddde2df807165335f8fb92aed71fa26854930fa16b92ed4906d2ef50d4aa6d9d"
    }
  }
