      "instructions": "BilYe Yemek (bilyeyemek.com) aynı restoranın aynı ürününün Yemeksepeti, Trendyol Yemek, Migros Yemek ve Tıkla Gelsin’deki fiyatını İstanbul’da ilçe/mahalle bazında karşılaştırır; sipariş almaz, platforma yönlendirir. Fiyat adrese göre değişir: önce kullanıcının ilçesini (varsa mahallesini) öğren. Akış: yemek_ara → urun_karsilastir (teslimat ücreti biliniyorsa dahil toplam; bilinmiyorsa araç açıkça yazar) → gerekirse sepet_karsilastir. Cevapta rakamı tarihiyle ver ve araçların döndürdüğü bilyeyemek.com bağlantısını kaynak olarak göster. Fiyatlar platformların açık sayfalarından düzenli okunur; siparişten önce platformda son fiyatı kontrol etmek gerekir.",
