        {
          "name": "compare",
          "title": "Head-to-head of two stocks or ETFs",
          "description": "Five-year head-to-head of two covered stocks or ETFs from weekly closes adjusted for dividends and splits: total and annualized return, 1-, 3- and 5-year returns, volatility, worst drawdown and worst week, correlation, what $10,000 became, plus each one's dividend yield, beta and (for funds) fee. Use it for \"SCHD vs VIG\", \"NVDA vs AMD\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "First ticker, e.g. \"SCHD\".",
                "examples": ["SCHD", "NVDA"],
                "maxLength": 20,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.^=\\-]{1,20}$",
                "type": "string"
              },
              "b": {
                "description": "Second ticker, e.g. \"VIG\".",
                "examples": ["VIG", "AMD"],
                "maxLength": 20,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.^=\\-]{1,20}$",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "a": {
                "type": "object"
              },
              "b": {
                "type": "object"
              },
              "correlation": {
                "type": ["number", "null"]
              },
              "headline": {
                "type": "string"
              },
              "takeaways": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "url": {
                "type": "string"
              },
              "window": {
                "properties": {
