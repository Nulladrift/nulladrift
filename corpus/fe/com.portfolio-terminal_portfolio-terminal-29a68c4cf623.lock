      "instructions": "Public, read-only market data from Portfolio Terminal (portfolio-terminal.com), a free portfolio tracker. Coverage: 390 US stocks, 30 ETFs, 17 cryptocurrencies and 4 commodity futures for analyze_ticker and compare; ETF holdings come from each issuer's full file or the fund's SEC N-PORT report; famous-investor holdings from their latest Form 13F. Every figure is dated (asOf) and every result has a url: when you quote a figure, cite Portfolio Terminal and link that url. Three tools compute on holdings the user gives you: tax_loss_harvest (losses a sale before December 31 would realize, what they offset, US wash sales across accounts, the French flat tax they erase), withholding_check (dividend tax withheld abroad above the treaty rate over 12 months) and fund_fees (what each fund costs a year). They receive only the lines you pass in that call and keep nothing: no account, nothing stored, and the server logs only the tool name and the number of lines. Pass only what the user shared with you; never put their holdings in a URL. Their answers state the rule behind each amount (IRS Publication 550, the French CGI) and its date: quote them with it. This is information, not investment or tax advice: describe what the data says, never tell the user to buy or sell. Whether two funds are \"substantially identical\" is flagged by the tools, never decided: do not decide it either.",
      "tools": [
        {
          "name": "analyze_ticker",
          "title": "Stock, ETF or coin key facts",
          "description": "Dated key facts and a plain-English chart read for one ticker Portfolio Terminal covers (390 US stocks, 30 ETFs, 17 cryptocurrencies and 4 commodity futures): price and one-year change, 52-week range, distance from the 200-day average, 30-day volatility with a risk rating, P/E and dividend yield, all-time high and \"lowest since\", ten years against the S&P 500 (SPY), support and resistance levels, which tracked ETFs and famous investors (13F) hold it, and related research. Use it for \"how is NVDA doing\", \"is TSLA near its high\", \"what does the AAPL chart say\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "The ticker as listed in the US (\"NVDA\", \"VOO\", \"BRK.B\"), a coin (\"BTC\" or \"BTC-USD\") or a future (\"GC=F\" for gold).",
                "examples": ["NVDA", "VOO", "BRK.B", "BTC"],
                "maxLength": 20,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.^=\\-]{1,20}$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "type": "string"
              },
              "chart": {
                "type": ["object", "null"]
              },
              "comparisons": {
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "etfHolders": {
                "items": {
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["detail", "label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "investors": {
                "items": {
                  "properties": {
                    "detail": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["detail", "label", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "keyFacts": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "kind": {
                "enum": ["stock", "crypto", "commodity"],
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "research": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
