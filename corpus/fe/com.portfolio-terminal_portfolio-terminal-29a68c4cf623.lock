        {
          "name": "fund_fees",
          "title": "What your funds cost a year",
          "description": "Computes, on the funds and amounts the user gives, what each fund's expense ratio takes a year (amount × expense ratio), the total and the weighted ratio, with the expense ratios of Portfolio Terminal's fees view (the fund's latest annual report as Yahoo Finance lists it). A fact, not a verdict: no other fund is suggested. A line that is not a fund, or whose ratio is not published, is named. Nothing is stored. Use it for \"how much do my ETFs cost me a year\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency of every amount (default USD).",
                "examples": ["USD", "EUR"],
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "funds": {
                "description": "One line per fund: its ticker and what is invested in it now. At most 50.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "What the holding is worth now, in `currency`.",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "ticker": {
                      "description": "The fund's ticker: \"VOO\", \"SCHD\", \"IWDA.AS\".",
                      "examples": ["VOO", "IWDA.AS"],
                      "maxLength": 20,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9.^=\\-]{1,20}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount", "ticker"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["funds"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "annualCost": {
                "type": "number"
              },
              "asOf": {
                "type": "string"
              },
