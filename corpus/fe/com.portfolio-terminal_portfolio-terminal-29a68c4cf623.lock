        {
          "name": "withholding_check",
          "title": "Dividend tax withheld abroad",
          "description": "Computes, on the dividends the user gives (a year of dividends, gross, by payer: a ticker such as \"NESN.SW\" or a country code), the tax each payer's country keeps at source, the treaty rate, and what was withheld above it over 12 months, which only that country refunds on a claim; for a French resident, also the treaty part France credits on form 2047. Same engine as Portfolio Terminal's Income and Pro tabs: statutory rates as of 2026, a US dividend at 15% (W-8BEN on file), European-listed funds paying no withholding. Countries outside its table are named, never guessed. Nothing is stored. Use it for \"how much Swiss tax do I lose on Nestlé dividends\", \"which of my dividends are over-withheld\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency of every amount (default EUR for FR, USD otherwise).",
                "examples": ["USD", "EUR"],
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "dividends": {
                "description": "One line per payer: a year of dividends, gross (before any tax). At most 100.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Dividends over 12 months, gross, in `currency`.",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "country": {
                      "description": "The payer's country, ISO code (\"CH\", \"DE\", \"US\"), when there is no ticker or it says better.",
                      "examples": ["CH", "DE"],
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "kind": {
                      "description": "stock (default) or fund: a fund listed in Europe pays its holders no withholding.",
                      "enum": ["stock", "fund"],
                      "type": "string"
                    },
                    "ticker": {
                      "description": "The payer's ticker with its exchange suffix: \"NESN.SW\", \"ALV.DE\", \"MSFT\".",
                      "examples": ["NESN.SW", "ALV.DE", "MSFT"],
                      "maxLength": 20,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9.^=\\-]{1,20}$",
                      "type": "string"
                    }
                  },
                  "required": ["amount"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "residence": {
                "description": "Where the user pays tax: FR (France), US, or other (the usual 15% treaty rate is used).",
                "enum": ["FR", "US", "other"],
                "type": "string"
              }
            },
            "required": ["dividends", "residence"],
            "type": "object"
          },
          "outputSchema": {
