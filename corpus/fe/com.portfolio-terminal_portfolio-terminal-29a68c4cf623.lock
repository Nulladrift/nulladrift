        {
          "name": "tax_loss_harvest",
          "title": "Tax-loss harvesting before December 31",
          "description": "Computes, on the lots the user gives (ticker, shares, price, date, account and its type), the losses a sale before December 31 would realize and what they offset, with the engine of Portfolio Terminal's \"Before December 31\" panel. US resident: FIFO lots per account, short vs long term, this year's realized gains, the year netted as Schedule D nets it (the $3,000 off ordinary income, the carryforward), and the wash-sale rule across every account, IRA and 401(k) included: losses it took this year, windows still open, and the first day the same security can be bought back without one (IRS Publication 550). French resident: weighted average cost across accounts at ECB rates, PEA and crypto left out, and the flat tax those losses erase against this year's net gains (CGI art. 150-0 D, 200 A). Funds on the same index are flagged, never judged \"substantially identical\". Current prices are fetched unless given in `prices`. Nothing is stored. Use it for \"how much tax can my losses save before December 31\", \"would this be a wash sale\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carryover": {
                "additionalProperties": false,
                "description": "US only: capital losses carried into this year from last year's return, in dollars, by term.",
                "properties": {
                  "long": {
                    "description": "Long-term carryover.",
                    "maximum": 1000000000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "short": {
                    "description": "Short-term carryover.",
                    "maximum": 1000000000000,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "filing_status": {
                "description": "US only: Form 1040 filing status (default single). Married filing separately caps the deduction at $1,500.",
                "enum": ["single", "married-joint", "married-separate", "head-of-household", "surviving-spouse"],
                "type": "string"
              },
              "lots": {
                "description": "Every purchase of the shares held, one per lot; add this year's sales (side \"sell\") with the purchases they came from, so realized gains and wash sales count. At most 300.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "account": {
                      "description": "The account's name, e.g. \"Schwab\", \"Fidelity Roth IRA\", \"Boursorama PEA\". Lots with the same name are one account.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "account_type": {
                      "description": "taxable (US brokerage), ira (traditional IRA), roth_ira, 401k (any workplace plan), pea (French PEA) or cto (French compte-titres). Default: what the account name says, else taxable/CTO.",
                      "enum": ["taxable", "ira", "roth_ira", "401k", "pea", "cto"],
                      "type": "string"
                    },
                    "currency": {
                      "description": "Currency of `price` and `fee` (default: the listing's currency).",
                      "examples": ["USD", "EUR"],
                      "pattern": "^[A-Za-z]{3}$",
                      "type": "string"
                    },
                    "date": {
                      "description": "Trade date, YYYY-MM-DD. Needed for a sale, and for wash sales and short vs long term (US). Without it a holding is valued at its cost and its term is unknown.",
                      "examples": ["2025-03-14"],
                      "pattern": "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$",
                      "type": "string"
                    },
                    "fee": {
                      "description": "Commission on this trade, in `currency` (default 0).",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "price": {
                      "description": "Per share, in `currency`: what was paid for a buy, what was received for a sale.",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "quantity": {
                      "description": "Number of shares (fractions allowed).",
                      "maximum": 1000000000000,
                      "minimum": 1e-9,
                      "type": "number"
                    },
                    "side": {
                      "default": "buy",
                      "description": "buy (default) for shares bought, sell for a sale already made.",
                      "enum": ["buy", "sell"],
                      "type": "string"
                    },
                    "ticker": {
                      "description": "The ticker as the broker lists it: \"NVDA\", \"VOO\", \"MC.PA\", \"IWDA.AS\".",
                      "examples": ["NVDA", "VOO", "MC.PA"],
                      "maxLength": 20,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9.^=\\-]{1,20}$",
                      "type": "string"
                    }
                  },
                  "required": ["price", "quantity", "ticker"],
                  "type": "object"
                },
                "maxItems": 300,
                "minItems": 1,
                "type": "array"
              },
              "prices": {
                "description": "Current price per share by ticker, in the lots' currency, when the user gave it. Tickers left out are priced from Yahoo Finance. At most 150.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "price": {
                      "description": "Price per share now.",
                      "maximum": 1000000000000,
                      "minimum": 0,
                      "type": "number"
                    },
                    "ticker": {
                      "description": "The ticker.",
                      "examples": ["NVDA"],
                      "maxLength": 20,
                      "minLength": 1,
                      "pattern": "^[A-Za-z0-9.^=\\-]{1,20}$",
                      "type": "string"
                    }
                  },
                  "required": ["price", "ticker"],
                  "type": "object"
                },
                "maxItems": 150,
                "type": "array"
              },
              "residence": {
                "description": "Where the user pays tax: US or FR (France).",
                "enum": ["US", "FR"],
                "type": "string"
              }
            },
            "required": ["lots", "residence"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "approximate": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "asOf": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "daysLeft": {
                "type": "integer"
              },
              "flatTaxRate": {
                "type": ["number", "null"]
              },
              "leftOut": {
                "properties": {
                  "blocked": {
                    "items": {
                      "properties": {
                        "reason": {
                          "type": "string"
                        },
                        "ticker": {
                          "type": "string"
                        }
                      },
                      "required": ["reason", "ticker"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "crypto": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "pea": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "sheltered": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "unpriced": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["blocked", "crypto", "pea", "sheltered", "unpriced"],
                "type": "object"
              },
              "lossTotal": {
                "type": "number"
              },
              "notAdvice": {
                "type": "string"
              },
              "realizedNet": {
                "type": "number"
              },
              "residence": {
                "enum": ["US", "FR"],
                "type": "string"
              },
              "rows": {
                "items": {
                  "properties": {
                    "accounts": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "loss": {
                      "type": "number"
                    },
                    "shares": {
                      "type": "number"
                    },
                    "taxErased": {
                      "type": ["number", "null"]
                    },
                    "term": {
                      "type": ["string", "null"]
                    },
                    "ticker": {
                      "type": "string"
                    },
                    "washIfSoldToday": {
                      "type": ["object", "null"]
                    }
                  },
                  "required": ["accounts", "loss", "shares", "ticker"],
                  "type": "object"
                },
                "type": "array"
              },
              "rule": {
                "type": "string"
              },
              "substantiallyIdentical": {
                "items": {
                  "properties": {
                    "account": {
                      "type": "string"
                    },
                    "date": {
                      "type": "string"
                    },
                    "index": {
                      "type": ["string", "null"]
                    },
                    "shares": {
                      "type": "number"
                    },
                    "ticker": {
                      "type": "string"
                    }
                  },
                  "required": ["account", "date", "index", "shares", "ticker"],
                  "type": "object"
                },
                "type": "array"
              },
              "taxErasable": {
                "type": ["number", "null"]
              },
              "url": {
                "type": "string"
              },
              "us": {
                "type": ["object", "null"]
              },
              "year": {
                "type": "integer"
              }
            },
            "required": ["asOf", "currency", "daysLeft", "leftOut", "lossTotal", "realizedNet", "residence", "rows", "rule", "url", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Tax-loss harvesting before December 31"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
