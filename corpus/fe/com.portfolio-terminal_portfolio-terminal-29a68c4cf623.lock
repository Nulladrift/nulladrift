        {
          "name": "dividend_calendar",
          "title": "Dividend calendar",
          "description": "US stocks and ETFs (of the 420 Portfolio Terminal covers) going ex-dividend in a month or a date range: ex-dividend date, pay date, dividend per share, yield, frequency, and whether the date is confirmed by the company or estimated from its payment rhythm. Buy before the ex-date to receive the dividend. Filter by one ticker with `symbol`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 10,
                "description": "Length of the range that starts at `from`, in calendar days (1–31, default 10).",
                "maximum": 31,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "First day of a date range, YYYY-MM-DD (instead of `month`). Use it for \"this week\" or \"the next 10 days\".",
                "examples": ["2026-10-06"],
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "How many entries, earliest first to return (1–200, default 50).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "month": {
                "description": "A calendar month as YYYY-MM, from three months back to three months ahead. Defaults to the current month. Ignored when `from` is given.",
                "examples": ["2026-10"],
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "symbol": {
                "description": "Only this ticker, e.g. \"KO\".",
                "examples": ["KO"],
                "maxLength": 20,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9.^=\\-]{1,20}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "end": {
                "type": "string"
              },
              "entries": {
                "items": {
                  "properties": {
                    "exDate": {
                      "type": "string"
                    },
                    "frequency": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "payDate": {
                      "type": ["string", "null"]
                    },
                    "payDateEstimated": {
                      "type": "boolean"
                    },
                    "perShare": {
                      "type": "number"
                    },
                    "status": {
                      "enum": ["confirmed", "estimated"],
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "yieldPct": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["exDate", "frequency", "name", "payDate", "payDateEstimated", "perShare", "status", "symbol", "yieldPct"],
                  "type": "object"
                },
                "type": "array"
              },
              "returned": {
                "type": "integer"
              },
              "start": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["count", "end", "entries", "returned", "start", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Dividend calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
