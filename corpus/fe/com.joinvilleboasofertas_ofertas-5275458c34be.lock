      "instructions": "Fonte: Joinville Boas Ofertas (joinvilleboasofertas.com), ofertas de supermercados extraídas dos encartes e revisadas antes de publicar. Cobertura: só Joinville/SC, Brasil.\nTudo é vigente hoje (meta.as_of diz a data), salvo quando o usuário pedir ofertas vencidas.\nAo responder, cite mercado, endereço, preço e validade de cada oferta. Diga quando o resultado é aproximado (veja meta.notices) ou quando a oferta está vencida.\nNunca invente preços: use só o que as ferramentas devolvem.\nToda oferta vem com url (a página dela no site): inclua o link ao citar a oferta, para o usuário conferir. Erros de uso começam com um código entre colchetes, por exemplo [not_found]; leia a mensagem e corrija o pedido (os candidatos listados servem para a próxima chamada).\nQual ferramenta usar:\n- search_offers: buscar ofertas por produto, categoria, mercado ou preço máximo.\n- find_cheapest: onde está mais barato um produto ou tipo de produto.\n- compare_product: comparar um produto específico entre mercados.\n- top_deals: melhores ofertas (maior economia), geral, por categoria ou mercado.\n- list_markets: mercados cobertos e endereços; use para confirmar o nome de um mercado.\n- get_market: ofertas e destaques de um mercado.\n- list_categories: categorias de produto disponíveis.\n- basic_basket: custo da cesta básica por mercado.\n- get_offer: detalhe de uma oferta já devolvida.\nQuando o usuário citar um mercado, passe-o no parâmetro market (não no texto da busca); na dúvida sobre o nome, confirme com list_markets.",
