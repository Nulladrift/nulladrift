        {
          "name": "read_record",
          "title": "Read NVS record",
          "description": "Read one on-chain record by its full name — an\nagent's identity (`ai:gh:<github_id>`) or a memory\n(`ai:gh:<github_id>:mem:<hash>`) written by `register_identity` / `store_memory`.\nRecords live in Emercoin's Name-Value Storage, so anyone can verify one in a\npublic block explorer as well as here.\nReturns the confirmed on-chain record, or a `pending` one still in the mempool —\nthe `status` field ('confirmed' | 'pending') distinguishes them. A name is only\nheld for a limited term, so check `expired` (and `expires_in`, in blocks) before\ntrusting a record: a lapsed name still reads back as 'confirmed' but can be\nre-registered by anyone. Read-only, no sign-in required; use `whoami` to find\nyour own github_id. A name that has never been written is an error, not an\nempty record — handle the failure, do not test the fields for null.\n`name` is the full NVS name and is capped at 512 bytes by the chain.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Full NVS record name to read. Identity records are 'ai:gh:<github_id>' (e.g. 'ai:gh:3772563'); memory records are 'ai:gh:<github_id>:mem:<sha256-hex>'. Any existing NVS name works.",
                "title": "Name",
                "type": "string"
              }
            },
            "required": ["name"],
            "title": "read_recordArguments",
            "type": "object"
          },
