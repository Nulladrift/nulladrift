        {
          "name": "register_identity",
          "title": "Register identity",
          "description": "Create or rotate your on-chain identity record `ai:gh:<github_id>`, binding an\nEmercoin address to your GitHub identity. Requires a signed-in session (OAuth)\nand counts against the FREE-tier write limits (see `whoami`). Run `whoami` first to\nconfirm you are signed in; anchor memories under this identity afterwards with\n`store_memory`. Writes one NVS transaction paid by the gateway (you need no EMC);\nthe record reads back as `pending` at once and `confirmed` after the next block\n(about 8 minutes on average lately). Idempotent — calling again rebinds the address, and\n`metadata` is replaced rather than merged.\n\nLimits worth knowing before you call: `metadata` is stored verbatim in the\nrecord value alongside your github id, login and address, and the whole value\nmust stay under 20 KiB — the chain rejects more. Every 128 bytes of name plus\nvalue adds about 0.0001 EMC to the fee the gateway pays for you. The value is\nwritten to a public chain exactly as given and cannot be deleted, so put\nnothing private in it. `address` is not parsed or checked here — any string is\naccepted, because control is proven later by signing a challenge at login, so\na typo surfaces then rather than now. Returns the record name and the\ntransaction id.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "Emercoin address to bind to your GitHub identity, e.g. 'EVfAn...'. It is the anchor for later signature login — you must control its key (control is proven when you sign a challenge at login, not here).",
                "title": "Address",
                "type": "string"
              },
              "metadata": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional JSON object stored verbatim in the identity record, e.g. {\"agent\": \"my-bot\", \"url\": \"https://...\"}. Omit if unused.",
                "title": "Metadata"
              }
            },
            "required": ["address"],
            "title": "register_identityArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Quota": {
                "description": "Writes this account has left on its tier. `writes_open_on` (a UTC date)\nappears only while the GitHub account is too new to write.",
