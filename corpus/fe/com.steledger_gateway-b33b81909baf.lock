        {
          "name": "store_memory_batch",
          "title": "Store memories (batch)",
          "description": "Anchor many fingerprints in ONE on-chain transaction — the way to record a\nsession's worth of artifacts without spending a write per minute on each.\nEach item becomes `ai:gh:<github_id>:mem:<content_hash>`, exactly as with\n`store_memory`: only hashes and metadata, never content. All or nothing: if\nany item is refused (a malformed hash, say), nothing is written.\n\nRequires a signed-in session. A batch of N counts as N writes against the\nFREE-tier limits (10 per minute, 100 per 24 hours), so at most 10 items fit\nin one call on a fresh minute; the result says how many writes are left.\nOne transaction id comes back for the whole batch; each name reads back\n`pending` at once and `confirmed` after the next block.",
          "inputSchema": {
            "$defs": {
              "MemoryItem": {
                "properties": {
                  "content_hash": {
                    "title": "Content Hash",
                    "type": "string"
                  },
                  "metadata": {
                    "anyOf": [
                      {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Metadata"
                  }
                },
                "title": "MemoryItem",
                "type": "object"
              }
            },
            "properties": {
              "records": {
                "description": "1–100 items, each {\"content_hash\": \"<digest>\", \"metadata\": {...}}; metadata is optional. Same rules as store_memory for each item.",
                "items": {
                  "$ref": "#/$defs/MemoryItem"
                },
                "maxItems": 100,
                "minItems": 1,
                "title": "Records",
                "type": "array"
              }
            },
            "required": ["records"],
            "title": "store_memory_batchArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
