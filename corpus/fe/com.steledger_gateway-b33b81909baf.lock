      "instructions": "Give an AI agent a durable identity and a place to anchor what it knows, as records on a public blockchain that no single vendor owns or can switch off. Read tools (node_status, read_record, list_records, whoami) are open to everyone — no sign-in, and so is send_feedback: when something fails or is unclear, tell the operator in up to 1000 characters. Write tools (register_identity, store_memory, store_memory_batch, transfer_records) require a GitHub sign-in via OAuth, which your MCP client performs, from a GitHub account at least 30 days old; on the FREE tier writes are limited per minute and per day. Typical flow: whoami → register_identity(address) → store_memory(hash) → read_record(name); in a later session, list_records finds what you anchored before. A write reads back as `pending` and becomes `confirmed` after the next block (about 8 minutes on average lately). The substrate is Emercoin, running since 2013 — named so that any record here can also be checked independently in a public block explorer, without trusting this service.",
      "tools": [
        {
          "name": "list_records",
          "title": "List records",
          "description": "List every record under one GitHub id — its identity record `ai:gh:<id>` and\nall its memories `ai:gh:<id>:mem:<hash>` — newest first, with each memory's\ncontent hash and metadata. This is how an agent starting a fresh session\nfinds what it anchored before: `read_record` needs the full name, hash\nincluded, and this is where the hashes come from. Read-only, no sign-in\nneeded to list any id; omit `github_id` to list your own when signed in.\n\nWhat comes back is the chain's view: confirmed records only (a write still in\nthe mempool shows up after its block), expired ones included and flagged\n`expired` — their names can be taken by someone else, so do not treat them\nas yours. Only fingerprints and metadata live here; the content itself stays\nwherever you stored it. Results are cached for about a minute, so a record\nconfirmed seconds ago may take that long to appear.",
          "inputSchema": {
            "properties": {
              "github_id": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Numeric GitHub id whose records to list. Omit it to list your own (needs a signed-in session; `whoami` shows the id).",
                "title": "Github Id"
              },
              "limit": {
                "default": 50,
                "description": "Records per page, 1–200.",
                "maximum": 200,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Where the page starts; use `next_offset` from the previous page.",
