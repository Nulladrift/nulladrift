        {
          "name": "node_status",
          "title": "Node status",
          "description": "Check that the chain node behind this service is healthy and fully synced:\nits version, block height, header height, peer connections and sync state.\nIt is an Emercoin node. Read-only, no sign-in required, no parameters.\n\n`synced` is not a comparison of the two heights — it is true once the node's\nverification progress passes 0.9999, so it can still be false while `blocks`\nand `headers` already match. Trust that field, not the arithmetic. While it is\nfalse, a `read_record` may reflect an older state of the chain; writes still\nwork, they simply confirm later.\n\nAlso the way to make sense of expiry: `expires_in` on a record is denominated\nin blocks, and this tool reports the current height, so the two together are\nthe only authoritative answer to when something lapses. A term is bought in\ndays and charged at a flat 175 blocks each; the chain has been producing about\n171 a day lately (8.4 min/block over the 103 days to 2026-09-22), so a term is\nclose to its nominal length right now — but that rate drifts, which is why you\nshould read the blocks rather than convert to days.",
          "inputSchema": {
            "properties": {},
            "title": "node_statusArguments",
            "type": "object"
          },
          "outputSchema": {
            "description": "Node sync status. Fields are nullable: the node may report any of them as null.",
            "properties": {
              "blocks": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
