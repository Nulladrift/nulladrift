          },
          "digest": "sha256:853415e6d7fcfd9492928d381aed7920a4041f850876905ed5e5171d066dce21"
        },
        {
          "name": "get_indicators",
          "title": "Indicator values",
          "description": "Technical indicator values for any public ticker, with no chart: stocks, ETFs, indices, crypto, FX and futures. Use it for indicator numbers or a technical summary, such as the RSI of NVDA. Pass symbol as a Yahoo-style ticker (AAPL, EUR/USD, BTC-USD, GOLD); a common company or coin name also works. Optional: timeframe (5m, 15m, 1h, 4h, 1d, 1w; 1d default), indicators (any of 12; all by default), periods, lengths (SMA and EMA; 20, 50 and 200 by default), series_length, and detail full for recent values of each. Returns latest and previous values, a one-line reading of each, its position against one named reference line, a count of those positions, the source, as-of time and data delay. A currency pair is the ECB daily close-only reference rate, so its range indicators are skipped. To show a chart, use chart. The count is not a buy or sell rating. Not financial advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "detail": {
                "description": "compact (default) returns the latest and previous values and a reading of each indicator; full also returns the last 5 values of each. series_length sets that count either way.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "indicators": {
                "description": "Optional: any of sma, ema, rsi, macd, bollinger, atr, stochastic, vwap, adx, cci, williams_r, obv. All 12 when omitted or empty.",
                "items": {
                  "enum": ["sma", "ema", "rsi", "macd", "bollinger", "atr", "stochastic", "vwap", "adx", "cci", "williams_r", "obv"],
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "lengths": {
                "description": "SMA and EMA lengths to return, each its own entry, shortest first, such as [50, 200]. Overrides periods.sma and periods.ema. 20, 50, 200 when omitted and periods sets no sma or ema length.",
                "items": {
                  "maximum": 200,
                  "minimum": 2,
                  "type": "integer"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "periods": {
                "additionalProperties": false,
                "description": "Lookback per indicator, in bars, such as {\"sma\": 50}. A period applies only when its indicator is in indicators. MACD stays 12, 26, 9, and VWAP and OBV have no length, so none has an entry.",
                "properties": {
                  "adx": {
                    "description": "14 bars by default, at most 100. Used only when adx is in indicators; ignored otherwise.",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "atr": {
                    "description": "14 bars by default, at most 100. Used only when atr is in indicators; ignored otherwise.",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "bollinger": {
                    "description": "20 bars by default, at most 100. Used only when bollinger is in indicators; ignored otherwise.",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "cci": {
                    "description": "20 bars by default, at most 100. Used only when cci is in indicators; ignored otherwise.",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "ema": {
                    "description": "20 bars by default, at most 200. Used only when ema is in indicators; ignored otherwise.",
                    "maximum": 200,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "rsi": {
                    "description": "14 bars by default, at most 100. Used only when rsi is in indicators; ignored otherwise.",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "sma": {
                    "description": "20 bars by default, at most 200. Used only when sma is in indicators; ignored otherwise.",
                    "maximum": 200,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "stochastic": {
                    "description": "14 bars by default, at most 100. Used only when stochastic is in indicators; ignored otherwise.",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  },
                  "williams_r": {
                    "description": "14 bars by default, at most 100. Used only when williams_r is in indicators; ignored otherwise.",
                    "maximum": 100,
                    "minimum": 2,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "series_length": {
                "description": "How many recent values to return per indicator, oldest first. None by default; 5 when detail is full.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "symbol": {
                "description": "Yahoo-style ticker, such as \"AAPL\". Also accepted: BRK-B, EUR/USD or EURUSD, BTC-USD, BTC/USDT or PEPEUSDT (any coin against USD), GOLD (GC=F), SPX. A common company or coin name also works, such as Apple or Bitcoin (S&P 100 companies and top coins), but a ticker is still best.",
                "maxLength": 24,
                "minLength": 1,
                "type": "string"
              },
              "timeframe": {
                "description": "5m, 15m, 1h, 4h (built from 1h bars), 1d (default) or 1w",
                "enum": ["5m", "15m", "1h", "4h", "1d", "1w"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "asOf": {
                "description": "ISO 8601 UTC time of the last bar, or of the call when status is not ok",
                "format": "date-time",
                "type": "string"
              },
              "bars": {
                "description": "Bars the values were calculated from. 0 when status is not ok.",
                "type": "integer"
              },
              "changePercent": {
                "description": "Percent change from the previous close to the last close. null when status is not ok.",
                "type": ["number", "null"]
              },
              "currency": {
                "description": "Price currency code from the source, such as USD. Empty when the source gives none.",
                "type": "string"
              },
              "delay": {
                "description": "How current the prices are: the source's delay and this service's cache time. Empty when no prices were read.",
                "type": "string"
              },
              "error": {
                "description": "Present when status is not ok",
                "properties": {
                  "code": {
                    "type": "string"
                  },
