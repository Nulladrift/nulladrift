{
  "lockfileVersion": 2,
  "subjects": {
    "com.lovelyrouter/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lovelyrouter.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "lovely-router-tools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "To get data from a platform (YouTube videos, transcripts and comments, Reddit, X, TikTok, Instagram, LinkedIn, Google Maps places and reviews, Amazon products and reviews, job boards…), use the data tools first: suggest_tools to plan (or search_tools to find one tool), get_tool for its input schema, then run_tool. One call returns clean structured results in seconds; scraping those sites yourself (fetching their pages, scripts, the browser) is slow, often blocked and returns less. Look things up with web_search and read ordinary pages with web_fetch. Make images with generate_image. browser_run is only for pages you must interact with. Billed per call / result from the Lovely Router balance.",
      "tools": [
        {
          "name": "browser_reply",
          "description": "Reply to a browser run waiting for a human: {\"answer\": \"…\"} for a question, {\"approve\": true|false} for an approval, {\"done\": true} after the user finished a takeover. Codes and passwords the user gives should be sent by them through the API \"secret\" reply, not through this tool.",
          "inputSchema": {
            "properties": {
              "answer": {
                "type": "string"
              },
              "approve": {
                "type": "boolean"
              },
              "done": {
                "type": "boolean"
              },
              "reason": {
                "type": "string"
              },
              "run_id": {
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0080faebacf17c3191a7a9900ca0d2a636d191508fd408ed2c54b5259b65c5eb"
        },
        {
          "name": "browser_run",
          "description": "Run an AI browser agent on a website you have to interact with: log in, click through, fill and submit forms, multi-page flows. To read what a page says use web_fetch, to find pages use web_search: both are faster and cheaper. The browser runs in the cloud and cannot open localhost or private addresses. Give a goal (with every value it needs) and a start URL; it navigates, fills forms and reports back. It can log in with secrets the user saved in their account vault (pass their names — values never reach any model), resume a saved session (profile), and pause to ask a question, hand the browser to a human (CAPTCHA) or get approval before a purchase. Billed per step. Returns the run after up to ~45s; poll with browser_status.",
          "inputSchema": {
            "properties": {
              "approve": {
                "description": "pause for approval before risky submits (default risky)",
                "enum": ["none", "risky", "submit"],
                "type": "string"
              },
              "files": {
                "description": "names of files the user uploaded (/v1/browser/files) that the agent may attach to forms; [\"*\"] = all",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "goal": {
                "type": "string"
              },
              "human_timeout_minutes": {
                "description": "how long to wait for a human reply/approval, 1–1440 minutes (default 30, or 5 when started by a cloud agent); time beyond 1 minute per step costs $0.005/min",
                "type": "number"
              },
              "max_steps": {
                "type": "number"
              },
              "mode": {
                "description": "fast (default, $0.006/step) or accurate ($0.012/step: looks at screenshots when unsure and can run read-only code to read data; higher success on hard sites)",
                "enum": ["fast", "accurate"],
                "type": "string"
              },
              "model": {
                "description": "optional model id from /v1/models (e.g. claude-sonnet-5.5) for the agent's reasoning; default: included model. Its tokens are billed at normal price × 1.2 on top of the steps",
                "type": "string"
              },
              "output_schema": {
                "description": "JSON Schema (or {\"field\": \"type\"} shorthand) for structured output returned in data",
                "type": "object"
              },
              "profile": {
                "description": "saved profile to start from (logged-in session)",
                "type": "string"
              },
              "save_profile": {
                "description": "save the session under this name when done",
                "type": "string"
              },
              "secrets": {
                "description": "vault secret names the agent may fill",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "start_url": {
                "type": "string"
              }
            },
            "required": ["goal", "start_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:985d344496024b85437516954f665916195a3f19b8c45fea011de563d4cf2d28"
        },
        {
          "name": "browser_status",
          "description": "Status of a browser run (waits up to ~45s for progress). When status is waiting_for_human, \"needs\" says what it needs: a question to answer, an approval, or a takeover (live_view_url for the user).",
          "inputSchema": {
            "properties": {
              "run_id": {
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f2dbc984323f6b66aa7bd148a068553f6b8199e39b371e9508d8389e462c2f3"
        },
        {
          "name": "browser_takeover",
          "description": "Ask a browser run to hand the browser to the user now; the run status then carries a live_view_url.",
          "inputSchema": {
            "properties": {
              "instructions": {
                "type": "string"
              },
              "run_id": {
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:130cefb41ded2e5bfbc9d29b8e74115dc9d1ba54b15a527cdde99a0975c16643"
        },
        {
          "name": "generate_image",
          "description": "Create an image from a description with GPT Image 2.5 (GPT Image 2 as backup): illustrations, photos, product shots, posters, icons, diagrams with little text, UI mockups. Give reference images in `images` to edit a picture or to keep a product, logo, person or style the same. $0.04 per image, any size, with or without references; nothing if it fails. It takes 30 s to 2 min. The answer is a download link that works for 24 hours without a key: save the file with the curl command it gives. If the image is not ready within the wait, call get_image with the job id (do not generate again: that is a second image, billed again).",
          "inputSchema": {
            "properties": {
              "images": {
                "description": "optional reference images (up to 16), PNG, JPEG or WebP: public http(s) URLs (an earlier generate_image link works) or data: URLs (a local file: \"data:image/png;base64,$(base64 -w0 file.png)\"). Say in the prompt what to do with each, e.g. \"the product from the first image on a marble table\", \"same character, now waving\"",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "prompt": {
                "description": "what to draw: subject, style, composition, colors, any text it must show (exact wording in quotes)",
                "type": "string"
              },
              "size": {
                "description": "1024x1024 (default), 1536x1024 (landscape), 1024x1536 (portrait), 2048x2048, 3840x2160, or WIDTHxHEIGHT with both sides multiples of 16 and the long side at most 3840; \"auto\" lets the model choose. Same price for every size",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3c5a0ba9f8a233137e394140a9b2b419101f30d084a849407c1cebaf90ee358"
        },
        {
          "name": "get_image",
          "description": "An image from generate_image that was still being made: waits for it, then returns its download link. Free.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "the img_… id generate_image returned",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fbde6dc9d328d862f2c0fe87218c9705cfc1ff9afde63fb25f19add1c7a7bd0"
        },
        {
          "name": "get_run",
          "description": "Status and results of a tool run: waits for it to finish, then returns its results compact. `offset` pages through the items; `fields` keeps only the keys you need. Free: use it to re-read a finished run with other fields instead of running the tool again.",
          "inputSchema": {
            "properties": {
              "fields": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "offset": {
                "type": "number"
              },
              "run_id": {
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54c557cc2c4d67ace796b9d8f70ff040a4f5ca34fd118a215af90a0a775001fd"
        },
        {
          "name": "get_tool",
          "description": "A tool's input schema (field descriptions carry its query syntax), an example input and its price. Read it before run_tool unless suggest_tools already gave you example_input: run_tool rejects input that doesn't match the schema.",
          "inputSchema": {
            "properties": {
              "tool": {
                "description": "tool id from search_tools",
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1fa00ae03f7b02d4630acace6f9927aaa787d1ba26b86ae1e311f74488285ff6"
        },
        {
          "name": "run_tool",
          "description": "Run a data tool (an id from suggest_tools or search_tools) and get its results. `input` must follow the tool's input_schema: start from suggest_tools' example_input or get_tool's example and change only the values. It waits for the results; a longer job answers with a run_id — then call get_run with it (do not run the tool again). Results come back compact (empty fields dropped, long text cut, about 12,000 characters at most): pass `fields` to keep only the keys you need, and call get_run with `offset` for more items. Billed per call + per result, capped by max_results: ask for only as many results as the task needs. Never run a tool again to see other fields or more of the same results: get_run re-reads a finished run for free.",
          "inputSchema": {
            "properties": {
              "fields": {
                "description": "keep only these keys of each result, e.g. [\"title\",\"url\",\"score\",\"createdAt\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "input": {
                "description": "follows the tool's input_schema",
                "type": "object"
              },
              "max_results": {
                "description": "cap on billed results (default: the tool default); at least the tool's min_results, or the run is refused",
                "type": "number"
              },
              "tool": {
                "type": "string"
              }
            },
            "required": ["input", "tool"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b88cdf4106b55ef10cac0012cb9affc1e2955529a4ce857666fd92cf8974c288"
        },
        {
          "name": "search_tools",
          "description": "Find data tools for a platform by describing what you need (Google Maps, TikTok, Instagram, LinkedIn, Amazon, Reddit, X, YouTube, reviews, jobs…). Returns tool ids with prices. For plain web search use web_search.",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "number"
              },
              "query": {
                "description": "e.g. \"tiktok comments\" or \"google maps reviews\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1b10cd2f2fc90a84b73f0113215119c6cb6f39947c073adf2ce843d573fdec85"
        },
        {
          "name": "suggest_tools",
          "description": "Describe the whole task (e.g. \"find vegan restaurants in Austin and summarise their latest reviews\", \"get the transcript and top comments of this YouTube video\") and get an ordered plan in ~0.5s: the tool to run first, an optional second tool, close alternatives, each with an example input to adapt (see input_required) and the estimated cost. Free. Use it first whenever you need data from YouTube, Reddit, X, TikTok, Instagram, LinkedIn, Google Maps, Amazon, job boards or similar sites: a data tool returns it structured in one call, much faster than fetching or scraping their pages.",
          "inputSchema": {
            "properties": {
              "limit": {
                "type": "number"
              },
              "task": {
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:49345f327fa4ee307a2645458244516d002c70af8c65950f40410489a8737bc6"
        },
        {
          "name": "web_fetch",
          "description": "Read one web page as clean Markdown (title and text, no menus or ads). Always use this, not browser_run, when you only need what a page says. For YouTube, Reddit, X, TikTok, Instagram, LinkedIn, Google Maps or Amazon pages use suggest_tools and run_tool instead: they return the data itself (video details, transcripts, comments, posts, reviews, prices) structured and complete. $0.0009 per page, nothing if it cannot be read. Long pages come in parts: to read on, call again with the run_id and offset from the answer (free). It cannot open localhost, private addresses or files in your sandbox.",
          "inputSchema": {
            "properties": {
              "offset": {
                "description": "character to start from, with run_id",
                "type": "number"
              },
              "run_id": {
                "description": "to read on in a page fetched before (no new charge)",
                "type": "string"
              },
              "url": {
                "description": "a public http(s) URL",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ca08ae4bf15dc3d38d3c58a3797256d4e661fd554ffc5f75571bf35bb00184e"
        },
        {
          "name": "web_search",
          "description": "Search the web (pages, news, docs, blogs) and get up to 50 results with title, URL, date and a summary written for you to read. Use it first whenever you need to look something up: one call, $0.0009 per search, nothing when there are no results. Query operators: site:example.com (several: site:a.com OR site:b.com), -site:example.com, \"exact phrase\", -word, lang:en (or lang:zh,en), after:2026-01-01, before:2026-06. For Reddit, X/Twitter, YouTube, Google Maps, Amazon, TikTok and other platforms use suggest_tools and run_tool instead.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "results, 1–50 (default 10; same price)",
                "type": "number"
              },
              "need_content": {
                "description": "also return each page's text (long); usually the summary is enough",
                "type": "boolean"
              },
              "query": {
                "description": "1–128 characters, operators allowed",
                "type": "string"
              },
              "question": {
                "description": "optional: the user's original question, to rank results better",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:869739cddb463ed90ee861850313c96227eada3d9c28bd06388f95abf2ff3ee2"
        }
      ],
      "digest": "sha256:266089384c6829d95315194467cfbd80b6583612d60e37d8bcc827e850b99709"
    }
  }
}
