                "type": "string"
              },
              "logo_url": {
                "description": "Public https URL of the wide logo (PNG, JPEG, WebP, GIF or SVG), e.g. from get_brand_kit.",
                "type": "string"
              },
              "name": {
                "description": "Store name in Leal, usually the business or client name, e.g. \"Bean There Coffee\".",
