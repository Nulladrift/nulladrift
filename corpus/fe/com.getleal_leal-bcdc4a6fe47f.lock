        {
          "name": "list_design_options",
          "title": "List card design options",
          "description": "Lists what a Leal loyalty card can look like: stamp icons, preset strip photos, limits, and how the pass is laid out on Apple and Google Wallet. Works without a Leal account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
