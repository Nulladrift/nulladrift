        {
          "name": "create_poster",
          "title": "Create a signup poster",
          "description": "Creates a printable poster with a QR code for a card. Customers scan it, fill in a short form on a public Leal signup page, and add the card to their wallet. Returns the signup link and a print link. Colours default to the card's.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "card_id": {
                "description": "Card id from list_cards.",
                "type": "integer"
              },
              "contact_collection_mode": {
                "description": "What the signup form asks for. Default email_and_phone.",
                "enum": ["email_and_phone", "email_only", "phone_only"],
                "type": "string"
              },
              "intent": {
                "description": "Optional. One short sentence on what the person asked you to do, e.g. \"Set up a stamp card for Ground Up Café\". Leal shows it in the person's activity log under Settings → AI agents, so they can see what was done for them. Leave out customer details.",
                "type": "string"
              },
              "paper_size": {
                "description": "Default a4.",
                "enum": ["a4", "a5", "a6", "letter"],
                "type": "string"
              },
              "primary_color": {
                "description": "Poster background colour, hex. Defaults to the card colour.",
                "type": "string"
              },
              "require_birthday": {
                "description": "Ask for a birthday (for birthday rewards). Default false.",
                "type": "boolean"
              },
              "secondary_color": {
                "description": "Accent panel colour, hex.",
                "type": "string"
              },
              "text_color": {
                "description": "Poster text colour, hex. Defaults to the card's text colour.",
                "type": "string"
              },
              "title": {
                "description": "Headline, e.g. \"Join our coffee club\". Defaults to the card name.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["card_id"],
            "type": "object"
