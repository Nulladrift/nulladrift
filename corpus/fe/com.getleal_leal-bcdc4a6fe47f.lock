        {
          "name": "preview_card_designs",
          "title": "Preview loyalty card designs",
          "description": "Renders one to four loyalty card designs as Apple Wallet and Google Wallet passes so the person can compare them and pick one. Checks each design against Leal's rules and flags hard-to-read colour combinations. Returns a shareable preview link per design. Works without a Leal account; nothing is saved.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "designs": {
                "description": "The designs to show side by side.",
                "items": {
                  "properties": {
                    "auxiliary_fields": {
                      "description": "Up to two extra front-of-pass fields, e.g. {label: \"Perk\", value: \"10% off pastries\"}.",
                      "items": {
                        "properties": {
                          "label": {
                            "maxLength": 20,
                            "type": "string"
                          },
                          "value": {
                            "maxLength": 30,
                            "type": "string"
                          }
                        },
                        "required": ["value"],
                        "type": "object"
                      },
                      "maxItems": 2,
                      "type": "array"
                    },
                    "card_color": {
                      "description": "Pass background colour, hex (#RRGGBB).",
                      "type": "string"
                    },
                    "header_text": {
                      "description": "Text at the top of the pass. Defaults to the store name. Wallet apps truncate long headers, so keep it short.",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "initial_stamps": {
                      "description": "Stamps a new customer starts with (a head start). Must be less than stamps_required.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "label": {
                      "description": "Short name for this direction, e.g. \"Espresso\" or \"Light & airy\".",
                      "maxLength": 30,
                      "type": "string"
                    },
                    "logo_url": {
                      "description": "Public https URL of the wide logo shown top-left of the Apple pass (PNG, JPEG, WebP, GIF or SVG; transparent PNG works best). Ideally a version that reads on card_color.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Internal name for the card, e.g. \"Coffee card\". Shown in Leal, not on the pass.",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "qr_style": {
                      "description": "What the pass QR holds. link (default for new cards): a phone camera opens the store's sign-up page with this customer as referrer, and the store scanner still reads it. code: the bare card code only. Passes showing the old QR keep scanning.",
                      "enum": ["link", "code"],
                      "type": "string"
                    },
                    "rationale": {
                      "description": "One sentence on why this design suits the brand.",
                      "maxLength": 160,
                      "type": "string"
                    },
                    "referee_stamps": {
                      "description": "Stamps the invited friend gets on their first stamped visit. Less than stamps_required. Default 1.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "referrals_enabled": {
                      "description": "Let customers invite friends from the back of their pass. Both get stamps once the store first stamps the friend's card on a visit, never just for signing up. Default false.",
                      "type": "boolean"
                    },
                    "referrer_stamps": {
                      "description": "Stamps the inviting customer gets when their friend's first visit is stamped. Less than stamps_required. Default 1.",
                      "minimum": 0,
                      "type": "integer"
                    },
                    "reward": {
                      "description": "The main reward, shown under the preview.",
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "stamps_required": {
                          "minimum": 1,
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "show_member_field": {
                      "description": "Show the customer's name on the front of the pass. Default true.",
                      "type": "boolean"
                    },
                    "show_stamps_to_reward_field": {
                      "description": "Show how many stamps until the next reward. Default true.",
                      "type": "boolean"
                    },
                    "square_logo_url": {
                      "description": "Public https URL of a square logo or icon, used as the round logo on Google Wallet.",
                      "type": "string"
                    },
                    "stamp_background_color": {
                      "description": "Fill colour of a collected stamp circle, hex. Empty stamp slots use a translucent version of it, so it should stand out from the strip.",
                      "type": "string"
                    },
                    "stamp_color": {
                      "description": "Colour of the icon inside a collected stamp, hex. Must read clearly on stamp_background_color.",
                      "type": "string"
                    },
                    "stamp_icon": {
                      "description": "Icon shown in each collected stamp.",
                      "enum": ["star", "heart", "coffee", "coffee_bean", "pint_glass", "cake", "barbell", "check", "spray_bottle", "shopping_trolley", "diamond", "high_heel", "hairdryer", "paw_print", "scissors", "sun", "flower", "coat_hanger"],
                      "type": "string"
                    },
                    "stamps_required": {
                      "description": "Stamps needed to fill the card. 6, 8 or 10 are common.",
                      "maximum": 21,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "strip_color": {
                      "description": "Strip colour, hex. Also shows behind preset and image strips when strip_opacity is below 100.",
                      "type": "string"
                    },
                    "strip_image_url": {
                      "description": "Public https URL of a wide photo for the strip (strip_type image), e.g. a hero image from the brand's website. Cropped to 375×144.",
                      "type": "string"
                    },
                    "strip_opacity": {
                      "description": "Opacity of the strip colour or image over the card colour. 100 shows it exactly; 60–85 tints a photo with the card colour so stamps stand out.",
                      "maximum": 100,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "strip_preset": {
                      "description": "Preset strip photo, used when strip_type is preset.",
                      "enum": ["coffee_beans", "coffee_cup", "bakery", "pizza", "sushi", "burger", "ice_cream", "smoothie", "flowers", "spa"],
                      "type": "string"
                    },
                    "strip_type": {
                      "description": "Background of the stamp strip: a flat colour, one of Leal's preset photos, or an image from strip_image_url.",
                      "enum": ["color", "preset", "image"],
                      "type": "string"
                    },
                    "text_color": {
                      "description": "Colour of all text on the pass, hex. Must read clearly on card_color (4.5:1 contrast or better).",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "intent": {
                "description": "Optional. One short sentence on what the person asked you to do, e.g. \"Set up a stamp card for Ground Up Café\". Leal shows it in the person's activity log under Settings → AI agents, so they can see what was done for them. Leave out customer details.",
                "type": "string"
              },
              "store_name": {
                "description": "The business name, shown where the pass shows the store.",
                "type": "string"
              }
            },
            "required": ["designs"],
            "type": "object"
          },
