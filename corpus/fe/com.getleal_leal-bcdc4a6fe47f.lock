              },
              "square_logo_url": {
                "description": "Public https URL of a square logo or icon.",
                "type": "string"
              },
              "store_name": {
                "description": "Public name customers see on cards and signup pages, if different from name.",
                "maxLength": 60,
                "type": "string"
