        {
          "name": "egf_prepare_group_quote",
          "title": "Prepare a group flight quote request",
          "description": "Checks a group flight enquiry for 10 or more seated travellers and returns the exact brief that would go to a human specialist, with a confirmation_token valid for 15 minutes. Nothing is sent.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Travellers aged 16 or over.",
                "minimum": 1,
                "type": "integer"
              },
              "cabin_class": {
                "description": "Defaults to economy.",
                "enum": ["economy", "business"],
                "type": "string"
              },
              "children": {
                "description": "Travellers aged 2–11, each in their own seat.",
                "minimum": 0,
                "type": "integer"
              },
              "children_ages": {
                "description": "Age of each child, one entry per child.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "date_flexibility_days": {
                "description": "How many days either side of the given dates the group can move. 0 means fixed dates.",
                "minimum": 0,
                "type": "integer"
              },
              "departure_date": {
                "description": "Outbound date, ISO 8601 (YYYY-MM-DD).",
                "type": "string"
              },
              "destination": {
                "description": "Arrival airport as an IATA code, e.g. [\"BCN\"].",
                "items": {
                  "pattern": "^[A-Za-z]{3}$",
                  "type": "string"
                },
                "type": "array"
              },
              "email": {
                "description": "Where the quote is sent. Required.",
                "type": "string"
              },
              "first_name": {
                "description": "Organiser's first name.",
                "type": "string"
              },
              "infants": {
                "description": "Under 2, travelling on an adult lap. They do not occupy a seat and do not count towards the group of 10.",
                "minimum": 0,
                "type": "integer"
              },
              "last_name": {
                "description": "Organiser's surname.",
                "type": "string"
              },
              "market": {
                "description": "Which market handles the enquiry: en (easygroupflights.com), pl (grupoweloty.pl) or at (gruppenfluege.at). Defaults to en.",
                "enum": ["en", "pl", "at"],
                "type": "string"
              },
              "note": {
                "description": "Anything that shapes the fare: what the group is (school trip, wedding, sports team, conference), baggage or equipment needs, budget, who pays, whether names are known yet.",
                "type": "string"
              },
              "origin": {
                "description": "Departure airport as an IATA code, e.g. [\"LHR\"]. Several codes are allowed when the group converges from more than one city.",
                "items": {
                  "pattern": "^[A-Za-z]{3}$",
                  "type": "string"
                },
                "type": "array"
              },
              "phone": {
                "description": "Contact number in international form, e.g. +441244568183. Required: a group specialist may phone to confirm details.",
                "type": "string"
              },
              "return_date": {
                "description": "Return date, ISO 8601 (YYYY-MM-DD). Omit for a one-way group booking.",
                "type": "string"
              },
              "return_destination": {
                "description": "Return leg arrival airports, if travellers go home to a different city.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "return_origin": {
                "description": "Return leg departure airports, if the group flies home from somewhere other than the destination.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "youths": {
                "description": "Travellers aged 12–15.",
                "minimum": 0,
                "type": "integer"
              },
              "youths_ages": {
                "description": "Age of each youth, one entry per youth.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              }
            },
            "required": ["adults", "departure_date", "destination", "email", "origin", "phone"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "adults": {
                "type": "integer"
              },
              "cabin": {
                "enum": ["economy", "business"],
                "type": "string"
              },
              "children": {
                "type": "integer"
              },
              "confirmation_token": {
                "description": "Authorises sending exactly this brief.",
                "type": "string"
              },
              "departure_date": {
                "description": "ISO 8601 date (YYYY-MM-DD).",
                "type": "string"
              },
              "destination": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "description": "The market whose desk handles the enquiry.",
                "type": "string"
              },
              "expires_at": {
                "description": "ISO 8601 date-time after which the token is refused.",
                "type": "string"
              },
              "infants": {
                "type": "integer"
              },
              "market": {
                "enum": ["en", "pl", "at"],
                "type": "string"
              },
              "origin": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reply_to": {
                "description": "Where the quote will be emailed.",
                "type": "string"
              },
              "return_date": {
                "description": "ISO 8601 date (YYYY-MM-DD). Absent for one way.",
                "type": "string"
              },
              "seats": {
                "description": "Seated travellers; lap infants excluded.",
                "type": "integer"
              },
              "youths": {
                "type": "integer"
              }
            },
            "required": ["adults", "cabin", "children", "confirmation_token", "departure_date", "destination", "domain", "expires_at", "infants", "market", "origin", "reply_to", "seats", "youths"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prepare a group flight quote request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:193321ad9e369f5b01c8ab3370bf316855454aa4421c61a10bcc77941b6e54b2"
        },
        {
          "name": "egf_request_group_quote",
          "title": "Send a group flight quote request",
          "description": "Sends a prepared group flight enquiry to a human specialist, who replies by email with a written quote, usually within about 2 hours. Takes only the confirmation_token from preparing it; it returns a confirmation, not a price, and books or charges nothing.",
          "inputSchema": {
            "properties": {
              "confirmation_token": {
                "description": "confirmation_token returned when this write was prepared. Valid for 15 minutes.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Optional. Any unique string for this request, such as a UUID. Calling again with the same key and the same arguments returns the first result instead of sending again. Kept for 24 hours.",
                "maxLength": 128,
                "type": "string"
              }
            },
            "required": ["confirmation_token"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "adults": {
                "type": "integer"
              },
              "cabin": {
                "enum": ["economy", "business"],
                "type": "string"
              },
              "children": {
                "type": "integer"
              },
              "departure_date": {
                "description": "ISO 8601 date (YYYY-MM-DD).",
                "type": "string"
              },
              "destination": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "description": "The market whose desk handles the enquiry.",
                "type": "string"
              },
              "infants": {
                "type": "integer"
              },
              "market": {
                "enum": ["en", "pl", "at"],
                "type": "string"
              },
              "max_reply_hours": {
                "type": "integer"
              },
              "origin": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reply_to": {
                "description": "Where the quote will be emailed.",
                "type": "string"
              },
              "return_date": {
                "description": "ISO 8601 date (YYYY-MM-DD). Absent for one way.",
                "type": "string"
              },
              "seats": {
                "description": "Seated travellers; lap infants excluded.",
                "type": "integer"
              },
              "status": {
                "description": "The enquiry reached the specialist desk. Nothing is booked or charged.",
                "enum": ["submitted"],
                "type": "string"
              },
              "typical_reply_hours": {
                "type": "integer"
              },
              "youths": {
                "type": "integer"
              }
            },
            "required": ["adults", "cabin", "children", "departure_date", "destination", "domain", "infants", "market", "max_reply_hours", "origin", "reply_to", "seats", "status", "typical_reply_hours", "youths"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a group flight quote request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ad935774e7f28d653c1b426e385e984a69fc932325539094a47735b08182ffb"
        },
        {
          "name": "egf_search_flights",
          "title": "Search flights for a small party",
          "description": "Searches live public fares for 1 to 9 travellers and returns options with per-person prices, carriers and stops, cheapest first, each with an offer_id valid for 30 minutes. Results come in pages: pass next_cursor back as cursor, with the same route and dates, for more.",
          "inputSchema": {
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page of this search. Omit for the first page.",
                "type": "string"
              },
              "departure_date": {
                "description": "Outbound date, ISO 8601 (YYYY-MM-DD).",
                "type": "string"
              },
              "destination": {
                "description": "Arrival airport, IATA code, e.g. BCN.",
                "type": "string"
              },
              "limit": {
                "description": "Fares per page. Defaults to 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "origin": {
                "description": "Departure airport, IATA code, e.g. VIE.",
                "type": "string"
              },
              "passengers": {
                "description": "How many people are travelling, 1 to 9. Defaults to 1.",
                "maximum": 9,
                "minimum": 1,
                "type": "integer"
              },
              "return_date": {
                "description": "Return date, ISO 8601 (YYYY-MM-DD). Omit for one way.",
                "type": "string"
              }
            },
            "required": ["departure_date", "destination", "origin"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "description": "ISO 4217 code every price is in.",
                "type": "string"
              },
              "departure_date": {
                "description": "ISO 8601 date (YYYY-MM-DD).",
                "type": "string"
              },
              "destination": {
                "type": "string"
              },
              "fares": {
                "items": {
                  "properties": {
                    "carriers": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "departure": {
                      "description": "Local departure, ISO 8601 (YYYY-MM-DDTHH:MM).",
                      "type": "string"
                    },
                    "flight_numbers": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "offer_id": {
                      "description": "Identifies this fare when emailing it as an offer. Valid for this search only.",
                      "type": "string"
                    },
                    "price": {
                      "description": "Per person, in currency.",
                      "type": "number"
                    },
                    "rank": {
                      "description": "1 is the cheapest.",
                      "type": "integer"
                    },
                    "return": {
                      "description": "Local return departure, ISO 8601 (YYYY-MM-DDTHH:MM).",
                      "type": "string"
                    },
                    "stops_back": {
                      "type": "integer"
                    },
                    "stops_out": {
                      "type": "integer"
                    }
                  },
                  "required": ["carriers", "flight_numbers", "offer_id", "rank"],
                  "type": "object"
                },
                "type": "array"
              },
              "next_cursor": {
                "description": "Pass as cursor for the next page. Absent on the last page.",
                "type": "string"
              },
              "origin": {
                "type": "string"
              },
              "passengers": {
                "type": "integer"
              },
              "return_date": {
                "description": "ISO 8601 date (YYYY-MM-DD). Absent for one way.",
                "type": "string"
              },
              "total": {
                "description": "Fares the search found, across all pages.",
                "type": "integer"
              }
            },
            "required": ["currency", "departure_date", "destination", "fares", "origin", "passengers", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
