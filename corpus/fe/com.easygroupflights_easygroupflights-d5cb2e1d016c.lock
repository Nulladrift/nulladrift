      "instructions": "easygroupflights.com books group air travel. A party of 10 or more seated travellers gets a negotiated group fare, which has no online price. egf_prepare_group_quote checks a group brief and returns it with a confirmation token; egf_request_group_quote sends a confirmed brief to the group desk, which replies by email with a quote. For 1 to 9 travellers, egf_search_flights returns live public fares and egf_get_offer returns one fare's booking link. The operator's guides and published studies are available as resources, each with its public URL as the source. Prompts cover five trip types: school-trip, wedding-guests, sports-team, company-offsite and pilgrimage.",
      "tools": [
        {
          "name": "egf_get_offer",
          "title": "Get one flight offer",
          "description": "Returns one fare from a recent flight search, by its offer_id: the per-person price, the flights, a booking link and the time until which the offer_id is valid. Works for 30 minutes after the search.",
          "inputSchema": {
            "properties": {
              "offer_id": {
                "description": "offer_id of a fare, exactly as the flight search returned it.",
                "type": "string"
              }
            },
            "required": ["offer_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booking_url": {
                "description": "Absolute https link where the traveller books this fare.",
                "type": "string"
              },
              "carriers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "currency": {
                "description": "ISO 4217 code.",
                "type": "string"
              },
              "departure": {
                "description": "Local departure, ISO 8601 (YYYY-MM-DDTHH:MM).",
                "type": "string"
              },
              "flight_numbers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "offer_id": {
                "type": "string"
              },
              "price": {
                "description": "Per person, in currency.",
                "type": "number"
              },
              "return": {
                "description": "Local return departure, ISO 8601 (YYYY-MM-DDTHH:MM).",
                "type": "string"
              },
              "stops_back": {
                "type": "integer"
              },
              "stops_out": {
                "type": "integer"
              },
              "valid_until": {
                "description": "ISO 8601 date-time. After it, search again: the price is live.",
                "type": "string"
              }
            },
            "required": ["booking_url", "carriers", "currency", "flight_numbers", "offer_id", "valid_until"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one flight offer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:caa1a09a240c9330bbd8df7bccc2de8303293718f3e21b64122aebda618ae1a9"
