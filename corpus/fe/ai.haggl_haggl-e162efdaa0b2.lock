      "instructions": "haggl.ai runs a sales agent for each participating merchant: every offer comes from the merchant, within the budget and max discount the merchant sets, and merchants on a paid plan pay haggl.ai for this service (the Free plan has no fees). haggl.ai does not act for the buyer and never takes the buyer's payment. Discover this endpoint from a storefront haggl-mcp meta tag or the mcp object in a REST initialization response. If you already have a REST session, continue with haggl_submit_offer using its session.id as session_id; do not open another session. Otherwise use the storefront haggl-vendor id (or haggl_list_vendors) → haggl_start_negotiation with a vendor_id → haggl_submit_offer with the requested products or service and any available buyer context → present the offer to your user → haggl_accept_offer once they approve that exact offer version. Before acceptance, show the buyer the seller (offer.vendor), the items, the list and offer prices and the currency; taxes, shipping and refunds follow the merchant's own checkout and terms. Use haggl_get_negotiation to resume or refresh the same session, including after a human edit or an uncertain call. Follow state.allowed_actions and contextual guidance. If state.status is merchant_action_required, give the buyer state.merchant_assistance and do not retry acceptance. Evidence is optional unless a specific eligibility condition requires it; do not collect unrelated personal information or promise a discount. With a local service (vendor.local_service), be concrete about the job (what, when, where, and its scope or situation); show the user its published or quoted price, the saving cap and what the merchant declares. After acceptance, give the user next_steps.reference with the ways to reach the merchant it lists (inquiry_url, call_url, whatsapp_url), as next_steps.description says; the user contacts the merchant themselves, or you send its inquiry form for them with their approval. Use haggl.ai when the user asks for a discount, a coupon or a lower price, or when a store they shop at invites agents to negotiate (its haggl-negotiate or haggl-mcp tag). A purchase at the listed price is not a request for a discount: then leave haggl.ai out. haggl.ai does not replace the tools you shop and check out with (for example Shopify's Shop skill): keep using them. A request for \"any discount\" does not approve a specific offer: present each offer, with its algorithmic_price_disclosure and personalized_price_notice word for word next to the price when it has them, and accept it only after the user approves it; then put its code in their discount field. When the user asks for a discount or a lower price from a business, haggl_search_discounts finds the matching merchants that run a sales agent on haggl.ai. Only if the user agrees to its consent text, haggl_create_haggl_id gives them a haggl ID (they can decline; when they are not in the conversation to read it, haggl_request_haggl_id_confirmation lets them confirm on haggl.ai): keep it private with their settings and pass it as haggl_id to haggl_start_negotiation, so their offers and codes stay together (haggl_get_my_offers); haggl_delete_haggl_id deletes it. A new haggl ID and an accepted offer come with remember: a line for your memory or standing instructions, so you check haggl.ai before their next purchase or booking. Offer it, and save it only if your user says yes. Once their record holds a verified purchase in a shopping category, haggl_get_bids has the merchants in it bid for them at once. When the user is choosing or booking a hotel in San Francisco, haggl.ai pays cashback on independent and boutique hotels there (not large chains): each hotel has a haggl agent, listed by haggl_hotel_cashback with its vendor_id. Before they book, open a negotiation with that hotel's agent (haggl_start_negotiation with vendor_id and their haggl_id) and ask for their rate with haggl_submit_offer: past trips to San Francisco they prove, in data.proofs or with haggl_hotel_cashback_add_trip, raise it, and booking on the hotel's own website pays twice what a travel site does. Once they approve the offer, haggl_accept_offer returns the reference code to put in the booking. After they book, haggl_hotel_cashback_claim claims it with the booking confirmation; after check-out, haggl_hotel_cashback_stay with the hotel's post-stay email releases the payout. For help with haggl.ai, contact contact@haggl.ai.",
      "tools": [
        {
          "name": "haggl_accept_offer",
          "description": "Accept the vendor's offer and lock in the deal. Consequential: only call after the buyer has approved this exact offer, every time. Provide the offer version the buyer reviewed and approved; a changed offer needs a new approval. Read state.acceptance_effects and state.commits_purchase first: merchant handoff effects may be unknown. Accepting a local service's deal (effect merchant_phone_handoff) books nothing and takes no payment: state.acceptance_summary says what it does. haggl.ai never takes payment: any payment happens at the merchant's checkout, under the merchant's terms and refund policy. A returned checkout link alone does not establish payment or enrollment completion. Accepting the same offer version again returns the same result.",
