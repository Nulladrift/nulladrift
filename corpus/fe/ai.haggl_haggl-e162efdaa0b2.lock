          "name": "haggl_get_bids",
          "description": "Have the merchants on haggl.ai in one shopping category (for example travel) bid for the user at once, from their haggl ID record, without new proof. Works once the record holds a verified purchase in that category (from an earlier offer with signed email proof); otherwise it says so and returns no bids. Each bid is a merchant's own offer, funded by the merchant, with an accept_url; show the user each one with its personalized_price_notice, and its algorithmic_price_disclosure when it has one (users in New York), word for word next to the price, and accept only with their approval.",
