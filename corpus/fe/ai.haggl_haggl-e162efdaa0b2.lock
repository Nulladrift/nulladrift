                "type": "string"
              },
              "raw_mime_b64": {
                "description": "Base64 (standard or url-safe) of the original email, byte for byte (Gmail format=RAW, or Show original → Download original).",
                "type": "string"
              },
              "statement": {
                "description": "The user's words of agreement, quoted; no names, emails or phone numbers.",
                "maxLength": 200,
                "type": "string"
              },
              "terms_version": {
                "description": "\"2026-10-29.2\".",
                "type": "string"
              }
            },
            "required": ["haggl_id", "payout_email", "raw_mime_b64", "statement", "terms_version"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "claim": {
                "description": "A hotel cashback claim.",
                "properties": {
                  "booking_total": {
                    "description": "The booking total.",
                    "type": "string"
                  },
