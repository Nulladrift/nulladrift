        {
          "name": "haggl_hotel_cashback_claim",
          "description": "After the user booked the hotel whose agent's offer they accepted, before its reference code expired: claim the cashback with the hotel's booking confirmation email, exactly as received. Show the user these conditions first, and call this only if they agree: \"haggl.ai (MOOJO.ID, INC.) pays cashback on stays at independent and boutique hotels in San Francisco booked while your quote holds (72 hours), for a stay starting within 60 days. Your rate depends on the trips to San Francisco you prove with signed flight or hotel emails from the last 12 months. Booking on the hotel's own site pays the full rate; booking through a travel site pays half. One booking per person. Your agent sends us the hotel's booking confirmation email as the hotel sent it, then, after you check out, the hotel's receipt or thank-you email; we check their signatures and read the hotel, dates, total and trips from them with an AI model, and keep those and fingerprints of the emails, not the emails. We pay within 2 business days of the post-stay email, to the email address you give, by bank transfer through Stripe (Stripe emails you a secure link to enter your bank details) or by PayPal; we delete that address 6 months later. Cancelled stays aren't paid. We may refuse a claim that looks fraudulent, and the offer ends when its budget is spent. Privacy policy: https://www.haggl.ai/privacy.\" Send terms_version \"2026-10-29.2\", statement (their words of agreement, quoted, without names or contact details) and payout_email: their email address for the payout, where haggl.ai sends the cashback after the stay (by bank transfer through Stripe, which emails them a link to enter bank details, or by PayPal).",
          "inputSchema": {
