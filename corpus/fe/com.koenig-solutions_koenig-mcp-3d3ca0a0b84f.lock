{
  "lockfileVersion": 2,
  "subjects": {
    "com.koenig-solutions/koenig-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.koenig-solutions.com/koenig-mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "koenig-mcp",
        "title": "Koenig MCP",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Koenig Solutions' IT training catalog. Pick the tool by what the user names: a specific course or exam code (e.g. 'PL-300', 'AZ-104T00') -> get_course_details; a technology (e.g. 'Azure', 'Kubernetes', 'Cyber Security') -> list_technology_courses; a vendor (e.g. 'Microsoft', 'AWS', 'Cisco') -> list_vendor_courses; a vague topic or goal -> search_courses. Send only the name, not the whole sentence. Link courses with the returned url and describe them only with the fields the tools return.",
      "tools": [
        {
          "name": "get_course_details",
          "title": "Get Koenig course details",
          "description": "Full details of ONE Koenig Solutions course: name, code, page url, vendor, technology, level, duration, overview, who should attend, prerequisites, what you will learn, curriculum, skills gained, career roles and hiring companies, exam format and cost, FAQs, course outline PDF and delivery options (1-on-1, Flexi). Accepts the course name, its course or exam code (e.g. 'PL-300', 'AZ-104T00') or its page url. match = 'exact' or 'closest'; for 'closest', other_matches lists other courses with a similar name - if the user may have meant one of them, say so. Prices and schedules are not included: give the user the course url for those.",
          "inputSchema": {
            "properties": {
              "course": {
                "description": "Course name, course/exam code or course page url, e.g. 'PL-300', 'Microsoft Azure Administrator', 'AZ-104T00'. 2-300 characters.",
                "type": "string"
              }
            },
            "required": ["course"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Koenig course details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:028ab64d120770366adcb2f7612b3473fade6b52f0392b002c2e8d5289b64508"
        },
        {
          "name": "list_technology_courses",
          "title": "List a technology's Koenig courses",
          "description": "All Koenig Solutions courses for a technology, as listed on that technology's page (the technology and its direct sub-technologies), the technology's own courses first, then most popular. Each course has name, code, url, vendor, level and duration. Paged: total, page, page_size, total_pages. other_technologies lists similarly named technologies the user may have meant (e.g. 'Azure' -> also 'Azure AI', 'Azure Security').",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "description": "Page number, starting at 1. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 20,
                "description": "Courses per page, 1-50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "technology": {
                "description": "Technology name, e.g. 'Azure', 'Kubernetes', 'Cyber Security', 'Power Platform'. 2-200 characters.",
                "type": "string"
              }
            },
            "required": ["technology"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List a technology's Koenig courses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc0f609bd80f95eb66069cbbce23a167d6f6b12a38bb56bb3b325db4434bfc0e"
        },
        {
          "name": "list_vendor_courses",
          "title": "List a vendor's Koenig courses",
          "description": "All Koenig Solutions courses of a vendor (e.g. Microsoft, AWS, Cisco, Red Hat), most popular first. Each course has name, code, url, technology, level and duration. Also returns technologies: the vendor's main technologies with course counts - for a big vendor offer those to the user and use list_technology_courses to narrow down. Paged: total, page, page_size, total_pages.",
          "inputSchema": {
            "properties": {
              "page": {
                "default": 1,
                "description": "Page number, starting at 1. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 20,
                "description": "Courses per page, 1-50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "vendor": {
                "description": "Vendor name, e.g. 'Microsoft', 'AWS', 'Cisco', 'Red Hat'. 2-200 characters.",
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List a vendor's Koenig courses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:73dfe82c0ad0d28cdfe24f64b8b5e0bfa5835abdf93094a81d9813b62b204ef8"
        },
        {
          "name": "search_courses",
          "title": "Search Koenig courses",
          "description": "Search Koenig Solutions' live IT training catalog. Accepts a course name, exam or course code (e.g. 'AZ-104', 'DP-600'), technology, vendor or a short topic ('azure devops', 'oracle dba'). Returns the best-matching courses, best first, each with name, code, course page URL, technology, level, vendor and duration. Pass only the subject as keywords: for 'give me details of Azure DevOps' send 'Azure DevOps'. This tool returns a course list, not outlines, prerequisites, prices or schedules; for those, give the user the course url.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many courses to return, 1-25. Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to search for, e.g. 'Azure DevOps', 'AZ-104', 'python for data science'. 2-200 characters.",
                "type": "string"
              },
              "vendor": {
                "description": "Optional vendor to rank first, e.g. 'Microsoft', 'AWS', 'Cisco'. Other vendors still appear.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Koenig courses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9947070cf1673d7060d4292a4144dcbf24fd3d8e9c8c9366eacdd9a246f783b2"
        }
      ],
      "digest": "sha256:c88ec4f013b923f572b2ebe7076712a5999ef3b610cea8c3a9250c6a7a383a32"
    }
  }
}
