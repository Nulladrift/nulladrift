        {
          "name": "emt_rent",
          "description": "Start a PAID GPU rental with exactly one of environment (verified, from emt_environments: preferred) or template. Requires explicit spending authorization, fresh quote, rent scope, credit and accepted terms. Store payload and key before requesting.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "backups": {
                "default": false,
                "description": "true enables scheduled backups of /root for this rental (billed as storage).",
                "type": "boolean"
              },
              "confirm_paid_rental": {
                "const": true,
                "description": "Must be true: confirms the user explicitly authorized this paid spend.",
                "type": "boolean"
              },
              "environment": {
                "description": "Verified environment ID from emt_environments (preferred over template), e.g. \"pytorch\", \"vllm\".",
                "maxLength": 40,
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique key (16–120 chars of A-Z a-z 0-9 _ . : -). Reuse the same key and payload when retrying an uncertain request.",
                "maxLength": 120,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "jupyter": {
                "default": false,
                "description": "true also starts JupyterLab on the machine (default false).",
                "type": "boolean"
              },
              "name": {
                "description": "Human-readable name for the rental or job, shown in the console.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "ports": {
                "default": 10,
                "description": "Number of public ports to expose, 0–200 (default 10).",
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "quote": {
                "description": "UUID of a fresh, unexpired quote from the matching quote tool.",
                "format": "uuid",
                "type": "string"
              },
              "setup": {
                "additionalProperties": false,
                "description": "Optional start-up for a verified environment: repo (public https Git URL), ref (branch/tag) and script (bash, max 3000 chars).",
                "properties": {
                  "ref": {
                    "pattern": "^[A-Za-z0-9._/-]{1,100}$",
                    "type": "string"
                  },
                  "repo": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "script": {
                    "maxLength": 3000,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "ssh": {
                "description": "OpenSSH public key (ssh-ed25519 / ssh-rsa / ecdsa) authorized on the machine. Never send a private key.",
                "maxLength": 4096,
                "type": "string"
              },
              "template": {
                "description": "UUID of a public template from emt_templates; use only when no verified environment fits.",
                "format": "uuid",
                "type": "string"
