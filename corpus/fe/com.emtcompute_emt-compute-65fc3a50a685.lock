        {
          "name": "emt_rent_cluster",
          "description": "Start a PAID whole-node cluster rental. Public SSH key only. Confirm cost and fabric limits with the user first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acknowledgeSlowNetwork": {
                "const": true,
                "description": "Set true to accept that this cluster's inter-node network is slower than a dedicated fabric.",
