        {
          "name": "emt_rent",
          "description": "Start a PAID GPU rental with exactly one of environment (verified, from emt_environments: preferred) or template. Requires explicit spending authorization, fresh quote, rent scope, credit and accepted terms. Store payload and key before requesting.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "backups": {
                "default": false,
