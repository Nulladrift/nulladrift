{
  "lockfileVersion": 2,
  "subjects": {
    "com.emtcompute/emt-compute": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://emtcompute.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "emt-compute",
        "title": "EMT Compute",
        "version": "1.2.1",
        "websiteUrl": "https://emtcompute.com/integrations",
        "icons": [
          {
            "src": "https://emtcompute.com/brand/emt-logo-1200.png",
            "mimeType": "image/png",
            "sizes": ["1200x1200"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "EMT Compute rents paid GPU nodes and clusters and runs scientific experiments. Quote first; require the user's authorization for spending. Persist the exact launch payload and idempotency key before sending, and reuse both after an uncertain response. Never infer shutdown from a missing response: inspect releasing/order state. Reports record available calculations and evidence, not an independent proof of arbitrary customer code. Custom files use the REST upload API. Prices are EUR micro-units (1 EUR = 1000000). Use a scoped API key created in the intended EMT workspace. Change individual/business profile, accept terms, create workspaces and manage invitations in the EMT console, not through MCP. Shared workspace balances and resources are separate.",
      "tools": [
        {
          "name": "emt_attach_cluster_experiment",
          "description": "Attach work to an already rented dedicated 2–4-node cluster. Does NOT start SSH remotely: run emt_cluster.py locally with the returned job ID and your private key. Whole cluster stops on completion/cancel; billing continues during preparation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clusterOrder": {
                "description": "UUID of an already rented 2–4-node cluster order owned by the workspace.",
                "format": "uuid",
                "type": "string"
              },
              "config": {
                "additionalProperties": {},
                "description": "The customer's own data for a ready experiment, checked against the preset's custom-input schema.",
                "propertyNames": {
                  "maxLength": 64
                },
                "type": "object"
              },
              "experiment": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "kind": {
                        "const": "preset",
                        "type": "string"
                      },
                      "preset": {
                        "maxLength": 64,
                        "type": "string"
                      }
                    },
                    "required": ["kind", "preset"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "entry": {
                        "maxLength": 120,
                        "pattern": "^[\\w][\\w .()+-]*\\.py$",
                        "type": "string"
                      },
                      "kind": {
                        "const": "script",
                        "type": "string"
                      },
                      "title": {
                        "maxLength": 120,
                        "type": "string"
                      }
                    },
                    "required": ["entry", "kind"],
                    "type": "object"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "command": {
                        "maxLength": 20000,
                        "minLength": 1,
                        "type": "string"
                      },
                      "environment": {
                        "default": "emt-lab",
                        "enum": ["emt-lab", "emt-lab-devel", "emt-lab-jax"],
                        "type": "string"
                      },
                      "kind": {
                        "const": "command",
                        "type": "string"
                      },
                      "setup": {
                        "default": "",
                        "maxLength": 20000,
                        "type": "string"
                      },
                      "title": {
                        "maxLength": 120,
                        "type": "string"
                      }
                    },
                    "required": ["command", "kind"],
                    "type": "object"
                  }
                ],
                "description": "What to run: {kind:\"preset\",preset}, {kind:\"script\",entry} for an uploaded Python file defining run(ctx), or {kind:\"command\",environment,setup,command} for any program."
              },
              "files": {
                "default": [],
                "description": "UUIDs of files uploaded through the REST upload API, made available to the job.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "idempotency_key": {
                "description": "Unique key (16–120 chars of A-Z a-z 0-9 _ . : -). Reuse the same key and payload when retrying an uncertain request.",
                "maxLength": 120,
                "minLength": 16,
                "pattern": "^[A-Za-z0-9_.:-]+$",
                "type": "string"
              },
              "level": {
                "default": "student",
                "description": "Problem scale for presets: student (small, quick), lab (research size) or frontier (largest). Default student.",
                "enum": ["student", "lab", "frontier"],
                "type": "string"
              },
              "maxMinutes": {
                "default": 60,
                "description": "Longest the job may run, in minutes (10–1440, default 60); also the most it can be billed.",
                "maximum": 1440,
                "minimum": 10,
                "type": "integer"
              },
              "name": {
                "description": "Human-readable name for the rental or job, shown in the console.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "releaseCluster": {
                "const": true,
                "description": "Must be true: the whole cluster is released when the job completes or is cancelled.",
                "type": "boolean"
              },
              "runs": {
                "description": "Parameter sets to compute, each {params:{name:value}}; they are distributed across the nodes.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "params": {
                      "additionalProperties": {
                        "anyOf": [
                          {
                            "type": "number"
                          },
                          {
                            "maxLength": 2000,
                            "type": "string"
                          },
                          {
                            "type": "boolean"
                          }
                        ]
                      },
                      "propertyNames": {
                        "maxLength": 64
                      },
                      "type": "object"
                    }
                  },
                  "required": ["params"],
                  "type": "object"
                },
                "maxItems": 64,
                "minItems": 1,
                "type": "array"
              },
              "seed": {
                "default": 0,
                "description": "Random seed for reproducible runs (default 0).",
                "maximum": 2147483648,
                "minimum": 0,
                "type": "integer"
              },
              "ssh": {
                "description": "OpenSSH public key (ssh-ed25519 / ssh-rsa / ecdsa) authorized on the machine. Never send a private key.",
                "maxLength": 4096,
                "type": "string"
              }
            },
            "required": ["clusterOrder", "experiment", "idempotency_key", "name", "releaseCluster", "runs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
