        {
          "name": "check_position",
          "description": "[measured + modeled] Your own position against the market in one call: the liquidation\n    price on each venue from THAT venue's maintenance-margin tier at this notional (read from\n    the exchanges' public tables, 'estimated' where none is published), the distance from the\n    current mark, how much modeled CEX leverage and how much MEASURED Hyperliquid leverage sits\n    between the mark and your liquidation price on your side, the funding cost per day at the\n    venue's live rate, and how often in our hourly archive price moved at least that far against\n    your side within 24 h and 72 h (a frequency, not a forecast). Assumes isolated margin and\n    ignores fees, so the real level is slightly nearer the entry. ONE venue (venue= given) is free; the\n    12-venue comparison is an answer we price: $0.02 per call (x402), 4 prepaid credits, or a key's daily quota.",
          "inputSchema": {
