        {
          "name": "create_alert",
          "description": "Subscribe an HTTPS URL to push alerts instead of polling (Pro: 3, Bot: 20 subscriptions).\n    type='condition': YOUR OWN trigger on one symbol — fires when `metric` `op` `threshold` becomes\n    true (edge-triggered: once per crossing, again only after it was false). metric = funding_apr_pct\n    (median annualised funding across venues) | oi_chg_1h_pct | oi_chg_24h_pct (Binance+Bybit+OKX, in\n    coins) | liq_1h_usd | liq_24h_usd | price_chg_1h_pct | price_chg_24h_pct (Binance mark) | long_pct\n    (mean long share of accounts) — the SAME definitions test_rule backtests, so test a rule first and\n    alert on it after; op = gt | lt. Example: symbol='BTC', metric='funding_apr_pct', op='gt',\n    threshold=50. The payload carries the value, the threshold and every other metric as context.\n    Checked every 60 s.\n    type='position': YOUR OWN position (symbol, side, entry, leverage, notional_usd, venue) — fires when it is\n    within max_dist_pct of its liquidation price, computed every 60 s from the venue's maintenance-margin\n    tier and the live mark (same numbers as check_position); again only when it gets a whole percent closer.\n    type='cascade': a liquidation cascade just ended, over min_usd and x_normal times the coin's\n    normal minute. type='hl_near_liq': a Hyperliquid whale position over min_usd within\n    max_dist_pct of its liquidation price. type='cluster_sweep': price reached one of the 10\n    largest modeled liquidation-map clusters (size over min_usd; no symbol = BTC, ETH, SOL), sent\n    3 min later with modeled vs actually liquidated USD. Returns the signing secret ONCE: verify header\n    X-LiquidVision-Signature = hex HMAC-SHA256(secret, raw body). Needs a Pro or Bot key.",
