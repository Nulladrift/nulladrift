      "instructions": "LiquidVision.app: crypto derivatives data for agents. READ-ONLY: every tool reads public market data; nothing here trades, signs, stores or touches private data. The conclusion tools (brief, regime, cascades, dispersion, carry, microstructure, maps, tokenized stocks, accuracy) and the live snapshots (open interest, funding rates, long/short, recent liquidation events) need no key. History and positions (OI/funding history, settlements, order books, candles, whale positions, exports) are metered: a free key (get_api_key tool) includes 100 such calls a day, Pro 10,000 and Bot 100,000; send the key as X-API-Key when connecting, otherwise those tools return an explanation. Open interest and funding across 13 venues (Binance, MEXC, Bybit, Bitget, Hyperliquid, HTX, Gate, OKX, KuCoin, BingX, Aster, Kraken, GMX on Arbitrum) exactly as the exchanges publish them — no haircuts, no doubling; /accuracy audits that against the exchanges every 10 minutes. START WITH: list_markets (what exists), then get_market_brief (one coin, one JSON) or the computed views. Prefer the computed views, which return conclusions rather than ticks: get_liquidation_cascades (cascades as events), get_positioning_regime (price x OI), get_funding_dispersion (cross-venue arbitrage), get_microstructure (spread/depth/basis), get_market_brief (one deterministic risk brief) and explain_market (grounded answer to 'why did BTC drop?'). Liquidation events cover Binance and Bitget (both exchange-throttled to one order per contract per second), OKX, Bybit, HTX, Gate, Kraken, Aster, GMX, Lighter and Hyperliquid whales, so totals are a floor for the whole market. Liquidation maps are MODELED estimates, except the measured Hyperliquid and Lighter maps (get_hl_liquidation_map, get_lighter_liquidation_map). Tool docstrings are tagged [measured] or [modeled]. Symbols are BASEUSDT. PRICED ANSWERS (say so in their docstring): get_fear_greed, get_smart_money, get_crypto_twitter, get_hl_top_traders, get_trader_profile, get_prediction_markets, get_defi_liquidations, get_precedents, test_rule, scan_rule, check_position on all venues, attest_snapshot. Pay with a key's daily units, prepaid credits (buy_credits), a $1 day pass (buy_day_pass), or per call over x402 / MPP / Nevermined / Skyfire (terms: https://liquidvision.app/api/v1/x402). FRESHNESS: answers carry age_s (seconds since the data was read from the exchange); rows of get_open_interest, get_funding_rates and get_long_short_ratio carry age_s each and stale=true when a venue feed is behind. Check it before acting on a number. History exports (CSV) and webhook alerts for bots: liquidvision.app/pricing.",
      "tools": [
        {
          "name": "ask",
          "description": "ONE CALL instead of five: ask in plain words ('where is leverage stacked on BTC',\n    'why did ETH drop', 'is SOL funding crowded', 'biggest whales near liquidation') and get\n    `answer`: short statements with the numbers in them, `facts`: the same numbers as JSON,\n    `sources`: which endpoints were read and how old their data is, `caveats`. The question is\n    read for its topics (liquidations, funding, open interest, whales, levels, sentiment;\n    English or Russian) and only those endpoints are fetched. No model involved: facts, not\n    opinion, so you do the judging. Free, no key. For the base rate of the current state\n    call get_precedents; for a narrative with an LLM call explain_market.",
          "inputSchema": {
            "properties": {
              "coin": {
