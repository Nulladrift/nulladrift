{
  "lockfileVersion": 2,
  "subjects": {
    "com.opensubtitles/guessit-js": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://guessit.opensubtitles.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "guessit-js",
        "title": "guessit-js",
        "version": "5.3.2",
        "description": "Parse movie and TV filenames: title, year, season, episode, codecs, languages, release group.",
        "websiteUrl": "https://opensubtitles.github.io/guessit-js/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "guessit-js extracts metadata (title, year, season, episode, resolution, codecs, languages, release group, ...) from movie and TV filenames. Use guessit for one name, guessit_batch for many. Output matches Python guessit; pass options.output=\"codes\" for ISO language codes with regions.",
      "tools": [
        {
          "name": "guessit",
          "title": "Parse a media filename",
          "description": "Extract metadata from one movie or TV episode filename or release name: title, year, season, episode, episode_title, screen_size, source, video_codec, audio_codec, language, subtitle_language, release_group, streaming_service, container, type (movie or episode) and more (56 properties). Output matches Python guessit's JSON. Pass just the file name or a full path; directory names help (e.g. \"Show/Season 2/episode.mkv\").",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "Filename, path or release name, e.g. \"The.Matrix.1999.1080p.BluRay.x264-GRP.mkv\"",
                "type": "string"
              },
              "options": {
                "additionalProperties": true,
                "description": "Optional guessit options, as in the library and Python guessit: type (\"movie\" | \"episode\"), output (\"python\" default: language/country as names like \"French\"; \"codes\": {\"alpha3\": \"fra\"} objects that keep regions such as pt-BR), expected_title, allowed_languages, allowed_countries, name_only, date_day_first, date_year_first, excludes, includes.",
                "type": "object"
              }
            },
            "required": ["filename"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Python guessit JSON: only the properties found; several values become an array. guessit_properties lists every property. Full schema: https://github.com/opensubtitles/guessit-js/blob/main/docs/output-schema.json",
            "properties": {
              "episode": {},
              "season": {},
              "title": {},
              "type": {
                "enum": ["movie", "episode"],
                "type": "string"
              },
              "year": {}
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Parse a media filename"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cadf7c82c7fcbd8a7a01490b429c64b5a23b77631022f63b2f3a6fbd53ffe52c"
        },
        {
          "name": "guessit_batch",
          "title": "Parse many media filenames",
          "description": "Parse up to 100 filenames in one call with the same options. Returns one entry per name, in order: {input_string, result} or {input_string, error}. Faster than calling guessit repeatedly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filenames": {
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "options": {
                "additionalProperties": true,
                "description": "Optional guessit options, as in the library and Python guessit: type (\"movie\" | \"episode\"), output (\"python\" default: language/country as names like \"French\"; \"codes\": {\"alpha3\": \"fra\"} objects that keep regions such as pt-BR), expected_title, allowed_languages, allowed_countries, name_only, date_day_first, date_year_first, excludes, includes.",
                "type": "object"
              }
            },
            "required": ["filenames"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "results": {
                "description": "One entry per input name, in order",
                "items": {
                  "properties": {
                    "error": {
                      "type": "string"
                    },
                    "input_string": {
                      "type": "string"
                    },
                    "result": {
                      "additionalProperties": true,
                      "type": "object"
                    }
                  },
                  "required": ["input_string"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Parse many media filenames"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33f1c098369074a7a3aee32220428aa6b7aaff3630bfba1f1624a4c0f630fc57"
        },
        {
          "name": "guessit_properties",
          "title": "List guessit properties",
          "description": "List every property guessit can return with its possible values (enum values such as source: [\"Blu-ray\", \"Web\", ...]; [null] for free-form ones such as title).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {
              "type": "array"
            },
            "description": "Property name -> possible values",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List guessit properties"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f77cec05760b62e9d008f444f4e2a84e03436b222cff0b8b95296b2702caeac"
        }
      ],
      "digest": "sha256:ca9150d9fdaefd8f7377d5814ac03a2fbf3344ee563b6fc6b101a8e46c9f78ba"
    }
  }
}
