{
  "lockfileVersion": 2,
  "subjects": {
    "com.reguscilabs.www/documentation": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.reguscilabs.com/docs"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "reguscilabs-docs",
        "version": "1.0.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "RegusciLabs documentation MCP. Read, search, list published news and curated public social activity (not live). Use the separate actions server at https://mcp.reguscilabs.com/mcp to submit an approved inquiry or subscription. Private records are not accessible.",
      "tools": [
        {
          "name": "get_latest_activity",
          "description": "Browse curated public RegusciLabs social posts with real post URLs, platform, language, topic and verified-date filters and pagination. Not a real-time feed; unverified post dates are null and platforms without approved sources may be empty.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Reuse nextCursor with identical filters.",
                "pattern": "^\\d{1,7}$",
                "type": "string"
              },
              "from": {
                "description": "Only posts with verified dates can match this lower bound.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "all",
                "enum": ["all", "es", "en"],
                "type": "string"
              },
              "platform": {
                "default": "all",
                "enum": ["all", "youtube", "instagram", "linkedin", "tiktok", "reddit"],
                "type": "string"
              },
              "to": {
                "description": "Only posts with verified dates can match this upper bound.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "topic": {
                "description": "Match only public titles, summaries, tags and approved project names.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:753b6ada39dc51cbc10dffe21a559f955e016d9f48e0322daefbbc94be7e7714"
        },
        {
          "name": "get_latest_news",
          "description": "List the latest published RegusciLabs Newsroom articles and El Pulso editions, newest first. Filter by language and source; return canonical URLs, dates, source citations and nextCursor. This is a read-only public archive, not a live breaking-news feed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Use nextCursor with the same locale and source.",
                "pattern": "^\\d{1,7}$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "es",
                "enum": ["es", "en"],
                "type": "string"
              },
              "source": {
                "default": "all",
                "enum": ["all", "newsroom", "pulse"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5ce89c0e7c3b27e6ca11647d541f94e678b419ff83d4dfdf4158c99754f74e4"
        },
        {
          "name": "read_information",
          "description": "Read published RegusciLabs information about the innovation lab, AI, hardware, POCs, discovery, cases, Newsroom or policies. No login needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "path": {
                "default": "/index.md",
                "description": "Public content path from llms.txt or sitemap.xml, such as /en/index.md. No private paths or external URLs.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3fd753b32867c18a1ba849ae1d5e4593e8f0029df9f9471d3c4b9356b0f625f"
        },
        {
          "name": "search_information",
          "description": "Search public RegusciLabs content in Spanish or English. Returns source links and excerpts, not generated claims.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Use nextCursor from the previous response with the same query and locale.",
                "pattern": "^\\d{1,7}$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "es",
                "enum": ["es", "en"],
                "type": "string"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebca00fa094b3d6b3a69e9a7948a84513cd8e6b415517d6f1aa5a7f819c3ce4d"
        }
      ],
      "digest": "sha256:742a93d63910457270681f228f526f53578bb02923d9ce7366044271ea794f13"
    }
  }
}
