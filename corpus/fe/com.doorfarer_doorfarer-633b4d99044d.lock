            }
          },
          "digest": "sha256:268434b6c71f0d658193ad81f16f69e50f132f6dab8d6ca5dfa996402eabbb06"
        },
        {
          "name": "find_trips",
          "title": "Find door-to-door trips",
          "description": "Finds the best round trips from where someone lives, not just from one airport: it adds the train or bus to every airport they can reach and ranks all options door to door, by price, by total travel time, or balanced. Use it when someone wants flights from their home town, could fly from several airports, or asks for the cheapest or fastest way to get somewhere, e.g. \"I live in New Haven: should I fly to Lisbon from JFK, Newark, Boston or Hartford?\" Not for a search from one airport already chosen. For a one-way trip set one_way (the trip length is then ignored). Multi-city: search each leg as one_way only when the user gave dates for it; otherwise ask for the dates. Set mode only when the user says how they get to the airport (car, train, bus, any): by default a home in the US compares driving, a taxi to a near airport and public transport, and a home elsewhere uses the train or bus. A named departure airport is an ordinary search: pass it as from_airports, with the home town the user gave. Ask when and for how long first: with no dates from the user this tool runs no search and returns the question to ask (and a form); it searches once the user names a time, or says any time suits them (dates \"flexible\"). A month or holiday without a year means the next one coming; don't ask which year or to confirm a town. Travellers default to 1 and the trip length to 2-14 nights; the answer's summary names both. Any town or village works. The first search from a town we haven't seen takes about 20 seconds while we look up its train and bus connections; tell the user you're checking the connections from their town to each airport. Later searches from that town take a second or two. Give the home town and where to: airport, city or country codes, a list of them, or a region such as \"Iberia\" or \"Southeast Asia\". For \"anywhere\", a continent (\"Asia\") or \"somewhere warm\" it finds the cheapest places itself: pass \"anywhere\", \"abroad\" (another country) or the continent, or for warm, sunny or a beach the countries that fit the season with anywhere true; it searches the best 6 cities door to door. `dates` says where the dates came from: \"from_user\" with depart_from and depart_to, or \"flexible\" when the user said any time suits them; never pick dates yourself. Example call: {\"home\": \"New Haven\", \"destinations\": [\"LIS\"], \"dates\": \"from_user\", \"depart_from\": \"2027-03-01\", \"depart_to\": \"2027-03-31\", \"nights_min\": 5, \"nights_max\": 9, \"travellers\": 2}. For a season or a month (\"next spring\", \"in June\") pass that window yourself as depart_from and depart_to (spring = 1 Mar to 31 May of the coming year); the answer's searched window says what was searched. The widget already shows every option, so reply in at most 4 sentences with no table: Doorfarer's `verdict` word for word as your first sentence (don't write an assessment of your own), the `headline` (flight + ground = total per person), then end with `close` as written. Never list airports without fares and add no facts about transit, airports or the destination. Don't repeat the table or list airports without fares (with no widget, list the top 3 rows compactly: route, dates, total per person), and give a booking link exactly as returned, as a clickable link (don't shorten or rewrite it). Airports more than 8.5 hours from the door are left out and named in the answer (max_ground_hours changes that: set it only if the user says how far they would travel). Say when a ground leg is an estimate. If the answer's status isn't \"ok\", tell the user plainly what its note says and don't invent prices; if nothing is found, say so and don't quote prices from other sources. Keep the user's own dates, trip length and places: if nothing is found, say so and offer to widen them, instead of widening on your own. Prices are in the traveller's home currency unless `currency` is given, per person; use the totals the answer gives for a party and don't convert or add up prices yourself; judge a price with the answer's verdict or price_calendar, never with outside benchmarks. Prices come from recent searches on Aviasales; the Book link shows today's price. Booking links are affiliate links: Doorfarer may earn a commission if you book, at no extra cost to you. Say so when you show them, and only then. When the user picks a trip, trip_details gives it step by step with a calendar file; when they ask which month is cheapest or whether a price is good, price_calendar answers: it is the cheapest fare found for each month, or the usual price where none was found (not bookable), while find_trips shows fares seen for the real dates (bookable). If an answer is wrong or confusing, report it with send_feedback.",
          "inputSchema": {
            "properties": {
              "anywhere": {
                "default": false,
                "description": "True to find the cheapest places anywhere in the countries or regions named, instead of searching each one's biggest airports. A continent (Asia, Europe), \"anywhere\" or \"abroad\" (outside the home country) in destinations always searches this way. For \"somewhere warm\" or \"a beach\", pass the countries that fit the season and set this.",
                "title": "Anywhere",
                "type": "boolean"
              },
              "currency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO code (USD, GBP, EUR) to show prices in. Default: the traveller's home currency.",
                "title": "Currency"
              },
              "dates": {
                "description": "\"from_user\" when the user named a time (a month, season, holiday, \"next week\"): pass it as depart_from and depart_to. \"flexible\" only when the user said any time suits them (\"whenever\", \"cheapest time\"): then the next 3 months are searched. \"assumed\" when they said nothing about when: nothing is searched, the answer is the question to ask them.",
                "enum": ["from_user", "flexible", "assumed"],
                "title": "Dates",
                "type": "string"
              },
              "depart_from": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The window to leave in: first day. Leave out with depart_to for the next 3 months. A window of about six months at most, within the next year.",
                "title": "Depart From"
              },
              "depart_to": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The window to leave in: last day. A window of about six months at most, within the next year.",
                "title": "Depart To"
              },
              "destinations": {
                "description": "Where to: airport codes (LIS), city codes (NYC), country codes (PT), a region, a continent (Asia), \"anywhere\" or \"abroad\" (outside the home country).",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 6,
                "title": "Destinations",
                "type": "array"
              },
              "from_airports": {
                "anyOf": [
                  {
                    "items": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "maxItems": 8,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only these departure airports. For narrowing a previous answer.",
                "title": "From Airports"
              },
              "home": {
                "description": "The traveller's home town or village, e.g. \"New Haven\" or \"Hamden, US\". Not an airport. Add the country when the name is common.",
                "maxLength": 80,
                "title": "Home",
                "type": "string"
              },
              "limit": {
                "anyOf": [
                  {
                    "maximum": 25,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Rows to return, 1-25. Default: the picks plus the best trip from each airport.",
                "title": "Limit"
              },
              "max_ground_hours": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The most hours from the front door to the departure airport, one way. Default 8.5: farther airports are left out and named in the answer. Set it only when the user says how far they would travel to the airport, or to include the far ones the answer names.",
                "title": "Max Ground Hours"
              },
              "mode": {
                "anyOf": [
                  {
                    "enum": ["public", "train", "bus", "car", "any"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "How the user gets to the airport: public (train or bus), train, bus, car (their own, parked at the airport), or any (car, taxi and public compete). Leave out unless the user says: then any for a home in the US, public elsewhere.",
                "title": "Mode"
              },
              "nights_max": {
                "anyOf": [
                  {
                    "maximum": 180,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Trip length in nights: longest. Default 14.",
                "title": "Nights Max"
              },
              "nights_min": {
                "anyOf": [
                  {
                    "maximum": 180,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Trip length in nights: shortest. Default 2.",
                "title": "Nights Min"
              },
              "one_way": {
                "default": false,
                "description": "True if the user wants one way only: then the trip length is ignored.",
                "title": "One Way",
                "type": "boolean"
              },
              "priority": {
                "default": "balanced",
                "description": "What matters most: budget (the cheapest door to door), time (the fastest) or balanced. Default balanced; the picks show the cheapest, the fastest and the balanced trip either way.",
                "enum": ["budget", "time", "balanced", "cheapest", "fastest"],
                "title": "Priority",
                "type": "string"
              },
              "travellers": {
                "default": 1,
                "description": "Adults travelling together. Default 1.",
                "maximum": 9,
                "minimum": 1,
                "title": "Travellers",
                "type": "integer"
              }
            },
            "required": ["dates", "destinations", "home"],
            "title": "find_trips_toolArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find door-to-door trips"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://doorfarer/find-trips-v3.html",
            "openai/toolInvocation/invoked": "Trips found",
            "openai/toolInvocation/invoking": "Finding trips door to door…",
            "openai/widgetAccessible": true,
            "ui": {
              "resourceUri": "ui://doorfarer/find-trips-v3.html"
            }
          },
          "digest": "sha256:f45e9e3a3b1d36d61ece017e00bad966622c1d8605a3cd2e7d18a8156c32eef4"
        },
        {
          "name": "price_calendar",
          "title": "Cheapest month from home",
          "description": "Shows the cheapest month to travel from someone's home town to a place, for each airport within reach: the cheapest fare found for each month (or, where none is found, what that route usually costs) plus the train or bus to the airport and the transfer into the city. Takes a few seconds. Airports further than 8.5 hours from home are left out and named. Use it when the user's dates are flexible or they ask when it's cheapest to go; then call find_trips for the month they choose to get bookable trips. Needs the home town; months as \"2027-03\", at most 12; for a season or a year pass its months (\"next spring\" = March to May), and the answer says which months have fares (state only those). Prices per person, in the home currency unless `currency` is given. The widget shows the months: reply in 3-4 sentences, with the best month and what it costs (\"cheapest found\" or \"usual price\", as the answer says), and don't quote prices from other sources.",
          "inputSchema": {
            "properties": {
              "currency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO code (USD, GBP, EUR). Default: the home's.",
                "title": "Currency"
              },
              "destinations": {
                "description": "Where to: airport codes (LIS), city codes (NYC) or country codes (PT).",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "title": "Destinations",
                "type": "array"
              },
              "home": {
                "description": "The traveller's home town or village, e.g. \"New Haven\" or \"Hamden, US\". Not an airport. Add the country when the name is common.",
                "title": "Home",
                "type": "string"
              },
              "month_from": {
                "anyOf": [
                  {
                    "maxLength": 7,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First month, \"2027-03\". Default: this month.",
                "title": "Month From"
              },
              "month_to": {
                "anyOf": [
                  {
                    "maxLength": 7,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last month. Default: 6 months in all.",
                "title": "Month To"
              },
              "one_way": {
                "default": false,
                "description": "True for one-way fares.",
                "title": "One Way",
                "type": "boolean"
              }
            },
            "required": ["destinations", "home"],
            "title": "price_calendar_toolArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Cheapest month from home"
          },
          "behavior": {
            "destructive": false,
