        {
          "name": "send_feedback",
          "title": "Report a problem with Doorfarer",
          "description": "Tell Doorfarer's maker where Doorfarer fell short, so it can be fixed. Use it when a find_trips answer was wrong, confusing, or missing something you needed to help, or when the user asks you to pass something on. Write as the assistant that used the tool: what you asked for, what came back, what you expected instead. The report is about Doorfarer only, never about the user: leave out names, contact details, travel plans, reasons for travelling and anything the user said about themselves. Be specific and honest, including when the problem may have been your own call. Pass the search_id from the answer's last line. One report per search. If the user asked you to report something, tell them it's sent.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "bug: something is wrong. confusing: right but hard to use. idea: something that would help.",
                "enum": ["bug", "confusing", "idea"],
                "title": "Kind",
                "type": "string"
              },
              "search_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The id from the find_trips answer this is about, e.g. \"s_7f3kq2m9xa\".",
                "title": "Search Id"
              },
              "suggestion": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What would have helped. At most 400 characters.",
                "title": "Suggestion"
              },
              "what_happened": {
                "description": "What you asked for, what came back and what you expected. About Doorfarer, not the user. At most 400 characters.",
                "title": "What Happened",
                "type": "string"
              }
            },
            "required": ["kind", "what_happened"],
            "title": "send_feedbackArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report a problem with Doorfarer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
