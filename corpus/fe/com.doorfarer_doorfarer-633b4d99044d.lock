      "instructions": "Doorfarer finds trips door to door: the flight plus the train or bus from the traveller's own town to each airport in reach. Use find_trips when someone wants the cheapest or fastest way to fly from where they live, and find_group_trips when people from different towns meet in one place, or ask where they should meet. Steps: first ask the user when they want to go and for how long (the tools run no search without the user's dates, unless they say any time suits them); then call find_trips; then tell the user the answer's summary and verdict as written; then offer trip_details for the trip they like, and price_calendar if they ask whether a price is good or are flexible. Judge prices with those two only, never outside benchmarks. Quote the answer's verdict sentence as written; the widget shows every option, so keep your reply to a few sentences. If a search finds nothing, say so and offer a wider window, other airports or a single-town search; never quote prices from other sources.",
      "tools": [
        {
          "name": "find_group_trips",
          "title": "Find group trips",
          "description": "Finds trips for a group whose people leave from different towns to meet in one place on the same dates: each person's own door-to-door trip (the train, bus or car to their best airport, and the flight), one line per town, with the group's total, the longest journey and the dates that work for everyone. E.g. \"Four of us want a week in Lisbon in May: two from New Haven, one each from Ithaca and Burlington.\" Put each town once in homes with how many people leave from it. For \"where should we meet?\" pass a region, countries or \"anywhere\" as destinations with anywhere true. For one home town, use find_trips. A month without a year means the next one coming. With no dates from the group this tool runs no search and returns the question to ask; once they name a time, or say any time suits them (flexible true), it searches. A month is enough to search: don't ask for exact dates. If a search finds nothing, say so and offer a wider window or single-town searches; never quote prices from other sources.",
          "inputSchema": {
            "$defs": {
              "HomeIn": {
                "properties": {
                  "town": {
                    "description": "A home town, e.g. \"Ithaca, NY\" or \"Hamden, US\". Not an airport.",
                    "title": "Town",
                    "type": "string"
                  },
                  "travellers": {
                    "default": 1,
                    "description": "People leaving from this town.",
                    "maximum": 9,
                    "minimum": 1,
                    "title": "Travellers",
                    "type": "integer"
                  }
                },
                "required": ["town"],
                "title": "HomeIn",
                "type": "object"
              }
            },
            "properties": {
              "anywhere": {
                "default": false,
                "description": "True to find the best places to meet in the countries or regions named.",
                "title": "Anywhere",
                "type": "boolean"
              },
              "currency": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "ISO code (USD, GBP, EUR). Default: the first town's currency.",
                "title": "Currency"
              },
              "depart_from": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The window to leave in: first day. Leave out with depart_to for the next 3 months.",
                "title": "Depart From"
              },
              "depart_to": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The window to leave in: last day.",
                "title": "Depart To"
              },
              "destinations": {
                "description": "Where to meet: airport codes (LIS), cities, country codes (PT), a region, a continent (Europe) or \"anywhere\".",
                "items": {
                  "type": "string"
                },
                "title": "Destinations",
                "type": "array"
              },
              "flexible": {
                "default": false,
                "description": "True only when the group said any time suits them: the next 3 months are searched. Otherwise pass the dates they named.",
                "title": "Flexible",
                "type": "boolean"
              },
              "homes": {
                "description": "Each town people leave from, with how many: [{\"town\": \"New Haven, CT\", \"travellers\": 2}, {\"town\": \"Ithaca, NY\"}]. Towns, not airports; the same town twice is one line.",
                "items": {
                  "$ref": "#/$defs/HomeIn"
                },
                "maxItems": 20,
                "minItems": 2,
                "title": "Homes",
                "type": "array"
              },
              "max_ground_hours": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The most hours from the front door to the departure airport, one way. Default 8.5: farther airports are left out and named in the answer. Set it only when the user says how far they would travel to the airport, or to include the far ones the answer names.",
                "title": "Max Ground Hours"
              },
              "mode": {
                "anyOf": [
                  {
                    "enum": ["public", "train", "bus", "car", "any"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "How people get to the airport: public, train, bus, car or any. Leave out unless the user says: then any in the US, public elsewhere.",
                "title": "Mode"
              },
              "nights_max": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Trip length in nights: longest. Default 14.",
                "title": "Nights Max"
              },
              "nights_min": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Trip length in nights: shortest. Default 2.",
                "title": "Nights Min"
              },
              "one_way": {
                "default": false,
                "description": "True if everyone flies one way only.",
                "title": "One Way",
                "type": "boolean"
              },
              "priority": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Best for the group: budget (the lowest total), time (the fewest hours) or balanced. Default balanced.",
                "title": "Priority"
              },
              "same_day": {
                "default": false,
                "description": "True if everyone must leave and return on the very same days; by default within a day.",
                "title": "Same Day",
                "type": "boolean"
              }
            },
            "required": ["destinations", "homes"],
            "title": "find_group_trips_toolArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find group trips"
