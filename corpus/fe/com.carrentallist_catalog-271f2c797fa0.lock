        "name": "carrentallist",
        "title": "CarRentalList — exotic car rentals in the US",
        "version": "8172f4b8-bb08-404b-a658-1d589e5cb6fe",
        "websiteUrl": "https://mcp.carrentallist.com/"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "CarRentalList is a directory of exotic and luxury cars for rent from independent US rental companies (no national chains, no peer-to-peer apps). Prices are the daily rates each company publishes on its own site, never estimated: daily_price null means none is published, so say \"contact for price\". Always cite the url fields (carrentallist.com pages). Unsure how a city or make is spelled? Call browse_locations or browse_makes first. \n\nTools: search_vehicles finds cars by make/model/family, state, city, price and class, with price stats over all matches; get_company returns one company's contact details, rental terms (age, deposit, mileage, delivery), fleet and recent price changes; browse_locations lists states and their cities with counts; browse_makes lists makes and a make's model families; vehicle_availability answers \"where can I rent model X\" by state and city; search_companies filters companies by place, make, specialization and rental terms (driver age, deposit, delivery, unlimited miles); price_overview gives published daily-rate statistics for a make, model, class or place; catalog_highlights lists new arrivals, price drops and rises, the rarest and most expensive cars, the biggest fleets and the most reviewed companies; top_companies is the monthly ranking of the best companies; search_news and get_news_article read the exotic car news; search and fetch find any company, model family, city or article by one query and return its document. Resource carrentallist://about explains the data; prompts plan_exotic_weekend, compare_companies and find_my_car are ready-made recipes. Results carry as_of (date of the last catalog change) and provenance. Lists page with limit (max 50) and next_cursor.",
