        {
          "name": "catalog_highlights",
          "title": "Catalog highlights",
          "description": "Show what is interesting in the exotic rental catalog right now, nationwide or in a state or city: cars newly listed in the last 30 days, recent daily price drops or rises (old and new price, date), the rarest model families (offered by at most two companies in the US), the most expensive cars, the biggest fleets and the most reviewed companies. Use this when someone asks \"what's new\", \"what got cheaper\", \"what's the rarest car I can rent\" or \"who has the biggest fleet in Miami\" questions, and for news-style summaries. Only published daily rates are used. A price change pairs a car's two latest rates, both recorded in the last 30 days, and counts only when both are plausible daily rates and the new one is still live. New arrivals leave out cars re-listed by a rescrape and bulk imports. Unknown places return did_you_mean.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "city name as people say it (Miami, LA, Vegas, NYC)",
                "maxLength": 60,
                "minLength": 1,
