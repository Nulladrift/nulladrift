        {
          "name": "fetch",
          "title": "Fetch a CarRentalList document",
          "description": "Fetch the full document for an id returned by search: a rental company (contact, terms, fleet with daily rates), a model family (price summary over every listed car, plus up to 50 of the cars with prices and companies), a city (makes available there and up to 30 cars; metadata.truncated says when more are listed) or a news article. Use this when you have an id from search and need the details of that one result; cite its url. Pass the id unchanged; an unknown id returns an error.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "an id from search results: company:<slug>, family:<make>/<family>, city:<city>-<st> or news:<slug>",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "date (YYYY-MM-DD) of the catalog's last content change",
                "type": ["string", "null"]
              },
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean", "null"]
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "provenance": {
                "type": "string"
              },
              "text": {
                "description": "the document as Markdown",
                "type": "string"
              },
              "title": {
                "type": "string"
