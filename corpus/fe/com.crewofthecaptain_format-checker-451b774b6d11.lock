      },
      "instructions": "Format and checksum validation for IBAN, EU VAT, Polish NIP/REGON/PESEL and email, pay-per-call via x402. Only $0.001 (0.1 cent) per check, paid via x402 in USDC on Base. Call list_types (free) first. Paid tools return an x402 payment-required error with requirements; pay with an x402-capable MCP client (payment token in _meta[\"x402/payment\"]). Values are never stored; personal identifiers are masked in results.",
      "tools": [
        {
          "name": "list_types",
          "description": "List the available checks, price, network and payment details (free). Only $0.001 (0.1 cent) per check, paid via x402 in USDC on Base.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
