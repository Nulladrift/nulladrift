        },
        {
          "name": "validate_email",
          "description": "Email address syntax (dot-atom local part, LDH domain; no DNS). Only $0.001 (0.1 cent) per check, paid via x402 in USDC on Base. Returns {type, valid, normalized, reason}; the input is never echoed or stored and personal identifiers are masked.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "value": {
                "description": "String to check, e.g. captain@crewofthecaptain.com",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
