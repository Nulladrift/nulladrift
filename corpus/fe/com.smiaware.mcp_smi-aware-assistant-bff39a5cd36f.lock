      "serverInfo": {
        "name": "mcp-server",
        "title": "SMI Aware Assistant",
        "version": "0.1.1",
        "description": "Remote MCP server exposing SMI Aware tools, resources, and skills over Streamable HTTP.",
        "websiteUrl": "https://smiaware.com"
      },
      "capabilities": {
        "logging": {},
        "prompts": {},
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "When you talk to the user, describe SMI fields and tool parameters in plain words. Do not show internal names such as isCurrent or releaseFiles unless the user asks for them. Still show ids, report identifiers, and other values. For example, ask \"Does the subject still live there?\" instead of naming a parameter.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch",
          "description": "Fetches the full SMI record for a typed reference (\"<type>:<id>\") that search returned. Pass only an id that appeared in a search result; do not construct one. If you already have a plain SMI record id, use smi_get_deep_report or smi_get_export to read it, or smi_check_order_complete for its readiness.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "A typed reference returned by search, e.g. \"deep_report:123\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "metadata": {
                "additionalProperties": {
                  "type": "string"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["id", "text", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f2f5a1ef29548b713fdd635d8843d96d866ede616ba8fe762283713172ffc91d"
        },
        {
          "name": "onboarding_next_step",
          "title": "SMI Onboarding Next Step",
          "description": "Pre-connection onboarding helper, callable before any SMI token is set. With no input, returns the fork question \"Do you already have an SMI token?\" — call again with hasToken: \"yes\" for connect guidance (then verify_access), or hasToken: \"no\" for prospect-intake guidance. Runs locally; makes no network calls and never reads or requires credentials.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hasToken": {
                "description": "Answer to the fork question \"Do you already have an SMI token?\" — omit on the first call to receive the question.",
                "enum": ["yes", "no"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fca32f1cc4d313331f7ce219df8d13720d3535aa980a2f9724ef3c780b9f445"
        },
        {
          "name": "search",
          "title": "Search",
          "description": "Open-ended discovery across SMI deep reports, research bundles, and exports when you do not already have a record id — finds candidates by subject name, url, or keyword and returns typed references to pass to fetch. If you already have a record id from the conversation rather than from a search result, call the specific tool instead: smi_get_deep_report or smi_get_export to read one record, smi_check_order_complete for order readiness, smi_list_deep_reports or smi_list_exports for filtered listings, smi_get_report_findings for findings within a report. Deep reports and research bundles are filtered server-side by subject first/last name, broadening to an unfiltered fetch ranked client-side (across id, name, url, summary) when the filtered fetch finds nothing; exports match on url.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Free-text search query, e.g. a subject name or record id",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cc293835aa689ab01dceed8f8094f3038b50b24e7cac85535798c6dea19e214e"
        },
        {
          "name": "smi_add_subject_address",
          "title": "Add Subject Address",
          "description": "Attaches a postal address to an SMI subject.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "The city.",
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "The country the address is in, spelled out (e.g. United States).",
                "minLength": 1,
                "type": "string"
              },
              "county": {
                "description": "The county, if the user gave one.",
                "minLength": 1,
                "type": "string"
              },
              "isCurrent": {
                "description": "Whether the subject currently lives at this address, as opposed to a former one. If it isn't clear from context, ask the user in plain words whether the subject still lives there, without naming this parameter.",
                "type": "boolean"
              },
              "state": {
                "description": "The state or province.",
                "minLength": 1,
                "type": "string"
              },
              "street1": {
                "description": "The street number and name.",
                "minLength": 1,
                "type": "string"
              },
              "street2": {
                "description": "A second address line, such as an apartment, suite, or unit number.",
                "minLength": 1,
                "type": "string"
              },
              "subjectId": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                ],
                "description": "The subject's id, from a prior smi_get_subject or subject-enrichment call."
              },
              "zip": {
                "description": "The postal or zip code.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["country", "isCurrent", "subjectId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "recordId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ]
              },
              "subjectId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ]
              }
            },
            "required": ["subjectId"],
            "type": "object"
          },
