        {
          "name": "onboarding",
          "description": "Get a new user started with SMI Aware, whether or not they already have a token — asks the token fork, then either walks through connecting with client-specific instructions or collects prospect contact details for the sales team. Use when someone is brand new, has no SMI Aware token yet, or asks how to get started / sign up.",
