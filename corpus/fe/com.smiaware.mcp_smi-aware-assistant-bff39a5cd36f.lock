        {
          "name": "smi_analyze",
          "title": "Analyze Case Notes",
          "description": "Scores free-text case notes against 5 weighted gap-analysis signals (no prior SMI order, high-relevance case type, known online presence, date of loss, social media mentioned) and returns a RECOMMEND/REVIEW/NO ACTION verdict, a confidence rating, which signals were/were not detected, a suggested product, and a best-effort orderData prefill (subject, matter id, case type, date of loss, handles/urls, suggested scope) for smi_create_deep_report. Runs entirely locally; makes no network calls.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "notes": {
                "description": "Free-text case notes to score against the 5-signal gap-analysis rubric.",
                "minLength": 1,
                "type": "string"
              },
              "thresholds": {
                "description": "Optional override of the RECOMMEND/REVIEW verdict thresholds.",
                "properties": {
                  "recommend": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "review": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "required": ["recommend", "review"],
                "type": "object"
              },
              "weights": {
                "description": "Optional override of all 5 signal weights; normalized to sum 100.",
                "properties": {
                  "caseType": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "dateOfLoss": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "noPriorOrder": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "onlinePresence": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "socialMedia": {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["caseType", "dateOfLoss", "noPriorOrder", "onlinePresence", "socialMedia"],
                "type": "object"
              }
            },
            "required": ["notes"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confidence": {
                "description": "Confidence in the verdict, derived from how many of the 5 signals were detected.",
                "enum": ["HIGH", "MED", "LOW"],
                "type": "string"
              },
              "orderData": {
                "additionalProperties": false,
                "description": "Best-effort prefill for smi_create_deep_report; fields absent when undetectable.",
                "properties": {
                  "caseType": {
                    "type": "string"
                  },
                  "dateOfLoss": {
                    "type": "string"
                  },
                  "matterId": {
                    "type": "string"
                  },
                  "productId": {
                    "anyOf": [
                      {
                        "const": 1,
                        "type": "number"
                      },
                      {
                        "const": 2,
                        "type": "number"
                      }
                    ]
                  },
                  "socialHandles": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "subject": {
                    "additionalProperties": false,
                    "properties": {
                      "firstName": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "lastName": {
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "suggestedScope": {
                    "type": "string"
                  },
                  "urls": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "signals": {
                "description": "Per-signal scoring breakdown.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "fraction": {
                      "type": "number"
                    },
                    "id": {
                      "enum": ["noPriorOrder", "caseType", "onlinePresence", "dateOfLoss", "socialMedia"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    },
                    "points": {
                      "type": "number"
                    },
                    "weight": {
                      "type": "number"
                    }
                  },
                  "required": ["fraction", "id", "label", "points", "weight"],
                  "type": "object"
                },
                "type": "array"
              },
              "signalsDetected": {
                "description": "Signal ids whose fraction is 1 (fully detected).",
                "items": {
                  "enum": ["noPriorOrder", "caseType", "onlinePresence", "dateOfLoss", "socialMedia"],
                  "type": "string"
                },
                "type": "array"
              },
              "signalsNotDetected": {
                "description": "Signal ids whose fraction is below 1 (not detected).",
                "items": {
                  "enum": ["noPriorOrder", "caseType", "onlinePresence", "dateOfLoss", "socialMedia"],
                  "type": "string"
                },
                "type": "array"
              },
              "suggestedProduct": {
                "description": "Recommended SMI product based on the detected subject kind.",
                "enum": ["DEEP_REPORT", "EXPORT", "RESEARCH_BUNDLE"],
                "type": "string"
              },
              "total": {
                "description": "Weighted total score, 0-100.",
                "type": "number"
              },
              "verdict": {
                "description": "Overall gap-analysis verdict.",
                "enum": ["RECOMMEND", "REVIEW", "NO ACTION"],
                "type": "string"
              }
            },
            "required": ["confidence", "orderData", "signals", "signalsDetected", "signalsNotDetected", "suggestedProduct", "total", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:011897dad26355f5a3531a6edc26da1211ccae3db9c90859b7098982e81c13fa"
        },
        {
          "name": "smi_check_order_complete",
          "title": "Check Order Complete",
          "description": "Checks the status of a deep report or export record (by its record id, e.g. from smi_create_deep_report draftIds). Returns state = ready | in_progress | draft | failed | unknown and a terminal flag. Poll with bounded attempts and backoff while in_progress; stop as soon as terminal is true (ready or failed) — a failed record will never become ready. Also stop when state is draft: the record was never submitted, so it will not progress until smi_submit_deep_reports or smi_submit_exports is called on it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "orderId": {
                "description": "Deep-report or export record id — the same id returned as draftIds by smi_create_deep_report and accepted by fetch. There is no separate order-level id. Product-prefixed ids are accepted and stripped: RB = Research Bundle, DR = Deep Report (both orderType \"deep_report\"), EX = Export (orderType \"export\").",
                "minLength": 1,
                "type": "string"
              },
              "orderType": {
                "description": "Whether the order is a deep report or an export",
                "enum": ["deep_report", "export"],
                "type": "string"
              }
            },
            "required": ["orderId", "orderType"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "orderId": {
                "type": "string"
              },
              "orderType": {
                "enum": ["deep_report", "export"],
                "type": "string"
              },
              "ready": {
                "type": "boolean"
              },
              "state": {
                "enum": ["ready", "failed", "in_progress", "draft", "unknown"],
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "terminal": {
                "type": "boolean"
              }
            },
            "required": ["orderId", "orderType", "ready", "state", "status", "terminal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:54293267b22941020346bbe97319376c79f00e8f5afeef06c247a33a01350687"
