        {
          "name": "smi_update_subject",
          "title": "Update Subject",
          "description": "Partially updates an SMI subject via PATCH /subjects/:id. type (PERSON or COMPANY) is required on every call — the SMI backend requires it as a discriminator on every subject PATCH. Editable fields match the API contract: firstName/lastName (or companyName for a COMPANY), birthYear/birthMonth/birthDay, and gender. At least one editable field must be provided.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "birthDay": {
                "description": "The subject's updated day of birth. Treated as the day the company was founded, for a COMPANY subject.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "birthMonth": {
                "description": "The subject's updated birth month, as a number from 1 (January) to 12 (December). Treated as the month the company was founded, for a COMPANY subject.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "birthYear": {
                "description": "The subject's updated birth year. Treated as the year the company was founded, for a COMPANY subject.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "companyName": {
                "description": "The subject's updated company name, required whenever type is COMPANY.",
                "minLength": 1,
                "type": "string"
              },
              "firstName": {
                "description": "The subject's updated first name, required whenever type is PERSON.",
                "minLength": 1,
                "type": "string"
              },
              "gender": {
                "description": "The subject's updated gender (PERSON subjects only).",
                "minLength": 1,
                "type": "string"
              },
              "lastName": {
                "description": "The subject's updated last name, required whenever type is PERSON.",
                "minLength": 1,
                "type": "string"
              },
              "subjectId": {
                "anyOf": [
                  {
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                ],
                "description": "The SMI subject id to update, from a prior smi_get_subject call."
              },
              "type": {
                "description": "The subject's type. Required on every call as a discriminator, even when it isn't changing — SMI's PATCH endpoint rejects the request without it. PERSON for a person, COMPANY for a company or organization.",
                "enum": ["PERSON", "COMPANY"],
                "type": "string"
              }
            },
            "required": ["subjectId", "type"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "subjectId": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ]
              },
              "updatedFields": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["subjectId", "updatedFields"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
