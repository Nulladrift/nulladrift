        {
          "name": "smi_create_deep_report",
          "title": "Create Deep Report",
          "description": "Creates one or more SMI deep report drafts from subject orders. Returns the draft ids for review before submission. All orders in one call are filed under a single project; call once per project. A batch of up to 25 orders is created immediately. A larger batch runs as a background job that the server waits on for a few seconds, then returns the same draft ids plus the jobId. If the result has status queued, the job is still running or could not be read: call smi_get_job with its jobId to read the created deep report draft ids, and do not resend the orders. If the job failed, SMI does not say whether any draft was created: check existing drafts before resending anything.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "orders": {
                "items": {
                  "properties": {
                    "additionalInformation": {
                      "description": "Context for the analyst team that is not part of the search scope, such as last known whereabouts or known associates.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "billingInformation": {
                      "description": "Invoicing instructions or a billing contact for this order.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "dateOfLoss": {
                      "description": "The date of the incident the case turns on, used to anchor the analyst to a specific event. Format: YYYY-MM-DD.",
                      "format": "date",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                      "type": "string"
                    },
                    "dueDate": {
                      "description": "The date the requester wants the finished order delivered. Dates ahead of the standard turnaround carry rush fees, and weekends, SMI closure days, and dates more than five business days out are not accepted. Format: YYYY-MM-DD.",
                      "format": "date",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                      "type": "string"
                    },
                    "endDate": {
                      "description": "The latest point in time an analyst should consider; nothing after this date is targeted. Format: YYYY-MM-DD.",
                      "format": "date",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                      "type": "string"
                    },
                    "isFcra": {
                      "description": "Whether this order needs FCRA compliance. Set it only when the user explicitly says the order does (true) or does not (false) need FCRA compliance. Otherwise leave it out, so the project or account FCRA default applies. Never send false by default: false overrides an FCRA default and removes the compliance the account requires.",
                      "type": "boolean"
                    },
                    "productId": {
                      "anyOf": [
                        {
                          "const": 1,
                          "type": "number"
                        },
                        {
                          "const": 2,
                          "type": "number"
                        }
                      ]
                    },
                    "recipients": {
                      "description": "Emails that receive the report when it is released.",
                      "items": {
                        "format": "email",
                        "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
