        },
        {
          "name": "klevero_konu_ara",
          "title": "Klevero konu notlarında ara",
          "description": "Klevero'nun herkese açık konu notlarında (LGS, TYT, AYT, YDT ve 5–12. sınıf dersleri) konu adına göre arar. Türkçe harf ve büyük/küçük harf duyarsızdır; konu adında geçenler önce gelir. Eşleşen konuların adını, seviyesini, dersini, ünitesini ve sayfa adresini döndürür. Notun metni için adresi klevero_not_getir aracına verin.",
          "inputSchema": {
            "properties": {
              "seviye": {
                "description": "İsteğe bağlı seviye süzgeci: lgs, tyt, ayt, ydt ya da 9-sinif gibi",
                "type": "string"
              },
              "sinir": {
                "description": "En çok sonuç (varsayılan 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "sorgu": {
                "description": "Aranacak konu, ör. \"türev\", \"fotosentez\", \"paragrafta anlam\"",
                "type": "string"
              }
            },
            "required": ["sorgu"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "sonuc_sayisi": {
                "type": "integer"
              },
              "sonuclar": {
