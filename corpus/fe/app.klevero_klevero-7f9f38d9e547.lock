                      "type": "string"
                    }
                  },
                  "required": ["ders", "konu", "seviye", "unite", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "sorgu": {
                "type": "string"
              }
            },
            "required": ["sonuc_sayisi", "sonuclar", "sorgu"],
