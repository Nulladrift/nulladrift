      "instructions": "Klevero, Türkiye'deki öğrenciler için yapay zekâ destekli ders koçu uygulamasıdır. Konu notu bulmak için klevero_konu_ara, notun metni için klevero_not_getir, ürün, fiyat ve SSS için klevero_bilgi kullanın. Tüm araçlar salt okunurdur ve yalnızca klevero.app'teki herkese açık içeriği döndürür.",
      "tools": [
        {
          "name": "klevero_bilgi",
          "title": "Klevero hakkında bilgi",
          "description": "Klevero yapay zekâ destekli ders koçu uygulamasının resmî özetini (llms.txt) döndürür: ne olduğu, kimler için, özellikler, fiyatlar, gizlilik ve SSS.",
          "inputSchema": {
