{
  "lockfileVersion": 2,
  "subjects": {
    "com.icepartsdb/ice-machine-parts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://icepartsdb.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "icepartsdb",
        "title": "IcePartsDB",
        "version": "1.0.0",
        "websiteUrl": "https://icepartsdb.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "IcePartsDB is a reference for commercial ice machine parts and machines (Hoshizaki, Manitowoc, Scotsman, Ice-O-Matic, Follett; US market).\nStart with lookup_number when the user has a part or model number (any spelling; the brand is optional), then get_part or get_machine for the facts.\nKeep the two kinds of compatibility apart: \"Listed in {Brand}'s parts list for\" is the maker's own document (cited); \"Listed by eBay sellers as compatible with\" and series lists are sellers' claims, not verified fitment.\nPrices are live eBay listings in USD including stated shipping, with an \"as of\" time; quote them with that time. Listing links are eBay Partner Network affiliate links: when you pass one on, include \"As an eBay Partner, IcePartsDB may be compensated if you make a purchase.\"\nCite the canonical page URL each result gives. Refrigerant work needs an EPA Section 608 certified technician; electrical work, a qualified one.",
      "tools": [
        {
          "name": "get_machine",
          "title": "Get a machine: ratings, running cost, parts, manuals",
          "description": "Facts for one commercial ice machine model: DOE / ENERGY STAR ratings (harvest rate, energy, water), estimated running cost per year, the maker's documents and parts list where available, parts eBay sellers list for the model or its series (claims), recalls and similar machines.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand slug.",
                "enum": ["hoshizaki", "manitowoc", "scotsman", "ice-o-matic", "follett"],
                "type": "string"
              },
              "model_number": {
                "description": "The model number from the data plate, e.g. \"KM-520MAJ\", \"IYT0500A-161\", \"CIM0530HA90\".",
                "type": "string"
              }
            },
            "required": ["brand", "model_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a machine: ratings, running cost, parts, manuals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d32467be78a8c468b31fb408b3860120d20b19dc460a32c8fb868d58145b5af3"
        },
        {
          "name": "get_part",
          "title": "Get a part: prices, makers' parts lists, sellers' compatibility claims",
          "description": "Facts for one commercial ice machine part: what it is, live eBay price range with \"as of\" time, the makers' parts lists that print it, the models and series eBay sellers list it for (claims, not verified fitment), other numbers sellers use, and the cheapest listings (affiliate links).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand slug.",
                "enum": ["hoshizaki", "manitowoc", "scotsman", "ice-o-matic", "follett"],
                "type": "string"
              },
              "listings": {
                "description": "How many of the cheapest listings to include (default 5).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "part_number": {
                "description": "The part number, any spelling.",
                "type": "string"
              }
            },
            "required": ["brand", "part_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a part: prices, makers' parts lists, sellers' compatibility claims"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea21a40774e19db0d91e0a6210dd5d1c136dcb0013396ec7c2a22769def1749a"
        },
        {
          "name": "lookup_number",
          "title": "Look up a part or model number",
          "description": "Find every IcePartsDB page a commercial ice machine part or model number could mean (any case, with or without dashes; aliases too), plus entries from the makers' own parts lists and model series eBay sellers name. Use first when the user gives a number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "number": {
                "description": "Part or model number as written, e.g. \"2A1410-02\", \"s0731\", \"KM-515MAH\", \"000008660\".",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a part or model number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6828465912cb3bfb46335030fefd3da7f0da836b3074f965f4969cee6e871b4f"
        },
        {
          "name": "running_cost",
          "title": "Compare running costs",
          "description": "Electricity and water cost per year (and over a machine's life) for up to three ice machine models, from their DOE / ENERGY STAR ratings and DOE's duty cycle. Same method and numbers as the running-cost tool page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "condenser_water": {
                "description": "Water-cooled machines: does the condenser water run to the drain or a closed loop / cooling tower?",
                "enum": ["drain", "loop", "unsure"],
                "type": "string"
              },
              "electricity_usd_per_kwh": {
                "description": "Optional electricity rate.",
                "minimum": 0,
                "type": "number"
              },
              "ice_lbs_per_day": {
                "description": "Ice actually used per day (optional; else DOE's duty cycle).",
                "minimum": 1,
                "type": "number"
              },
              "models": {
                "description": "Model numbers, e.g. [\"IYT0500A-161\", \"KM-520MAJ\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 1,
                "type": "array"
              },
              "water_usd_per_1000_gal": {
                "description": "Optional water + sewer rate.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare running costs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50a8a607d0fa0e15292b326e8e5dad5190210effac08c82852007ff3496b04d3"
        },
        {
          "name": "search",
          "title": "Search parts and machines",
          "description": "Search IcePartsDB by part or model number; a brand name may come first (\"hoshizaki 2A1410-02\"). Returns exact matches, similar numbers, seller-named series and makers' parts-list entries. Descriptions such as \"water pump\" are not searched: use the guides listed in llms.txt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A part or model number, optionally with the brand.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search parts and machines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5267663d474322b76a9939a73d27a5b8c9e58923fcac3eb91c9c621cece092a8"
        },
        {
          "name": "serial_number_age",
          "title": "When was this ice machine made?",
          "description": "Date of manufacture and age from the serial number, using only the makers' own published date rules (Scotsman, Manitowoc incl. the MFG DT code, Ice-O-Matic). Hoshizaki serials are not decoded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand slug.",
                "enum": ["hoshizaki", "manitowoc", "scotsman", "ice-o-matic", "follett"],
                "type": "string"
              },
              "mfg_dt": {
                "description": "Manitowoc only: the \"MFG DT\" code on the data plate (4 digits, year then month).",
                "type": "string"
              },
              "serial": {
                "description": "Serial number from the data plate.",
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "When was this ice machine made?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:377cf202b7f2a14b148c3927f794232eed419558955461e682e4fa32a5012a4c"
        }
      ],
      "digest": "sha256:f91f3428b6e1b4bc5971906f32796845274f6409fa397ac1a55a7c1b3f4c9bf7"
    }
  }
}
