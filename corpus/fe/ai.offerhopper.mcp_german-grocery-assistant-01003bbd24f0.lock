      "serverInfo": {
        "name": "ShoppingOptimizer",
        "version": "1.0.3",
        "websiteUrl": "https://offerhopper.ai"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
