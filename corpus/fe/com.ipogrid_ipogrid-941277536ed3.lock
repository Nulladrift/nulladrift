        {
          "name": "list_companies",
          "title": "List Companies",
          "description": "Discover IPOGrid companies and active deals with cursor pagination and market, issuer-kind, freshness, or proceeds filters. Use get_company after selecting an issuer. Anonymous requests return at most 10 rows and omit consensus enrichment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Opaque next_cursor from a previous response. Omit for the first page.",
                "type": "string"
              },
              "gross_proceeds_gt": {
                "description": "Lower bound on gross proceeds, using stated gross proceeds or a midpoint estimate from price range times shares offered.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "gross_proceeds_lt": {
                "description": "Upper bound on gross proceeds, using stated gross proceeds or a midpoint estimate from price range times shares offered.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "include": {
                "description": "Optional enrichments for each row. Anonymous requests silently omit consensus.",
                "items": {
                  "enum": ["latest_terms", "classification", "consensus"],
                  "type": "string"
                },
                "type": "array"
              },
              "kind": {
                "description": "Return only these issuer kinds. Omit to include every kind.",
                "items": {
                  "enum": ["operating", "spac", "funds", "follow_on"],
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Maximum rows to return. Defaults to 50 when authenticated; anonymous requests are capped at 10.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Filter by normalized market family.",
                "enum": ["all", "exchange", "otc", "unknown"],
                "type": "string"
              },
              "scope": {
                "description": "Filter to IPO-only rows or all active deal rows.",
                "enum": ["ipo", "all"],
                "type": "string"
              },
              "updated_since": {
                "description": "ISO-8601 lower bound on the company update timestamp.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data": {
                "description": "Rows for the current page.",
                "items": {
                  "additionalProperties": {},
                  "type": "object"
                },
                "type": "array"
              },
              "has_more": {
                "description": "Whether another page is available.",
                "type": "boolean"
              },
              "meta": {
                "additionalProperties": false,
                "properties": {
                  "count": {
                    "description": "Number of rows returned in this page.",
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["count"],
                "type": "object"
              },
              "next_cursor": {
                "description": "Opaque cursor for the next page, or null when this is the last page.",
                "type": ["string", "null"]
              }
            },
            "required": ["data", "has_more", "meta", "next_cursor"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ed93f5c0c4581e8295420d90d856d26fc2b9d9f9007e262fc43a189c251ace5c"
        },
        {
