        {
          "name": "get_chart",
          "title": "Get Chart",
          "description": "Build an aggregated IPO chart and return its data plus canonical embed, page, and API URLs. Use this instead of hand-building chart URLs. Anonymous requests are quota-limited and may clamp a 52-week range to 26 weeks or a daily bucket to weekly unless the explicit date window is at most 31 days.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bucket": {
                "description": "Time interval. Defaults to week; anonymous daily requests require an explicit window of at most 31 days or are clamped to week.",
                "enum": ["day", "week", "month", "quarter"],
                "type": "string"
              },
              "date_from": {
                "description": "Inclusive YYYY-MM-DD lower bound. Use with date_to for a custom window instead of range.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "description": "Inclusive YYYY-MM-DD upper bound. Use with date_from for a custom window instead of range.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "group": {
                "description": "Dimension used to split chart series. Defaults to sector for proceeds/returns and form_family for filing counts.",
                "enum": ["sector", "form_family", "status"],
                "type": "string"
              },
              "issuer": {
                "description": "Include every issuer or exclude SPACs. Defaults to all.",
                "enum": ["all", "exclude_spacs"],
                "type": "string"
              },
              "materiality": {
                "description": "Include all filing forms or only major IPO forms. Defaults to all.",
                "enum": ["all", "major"],
                "type": "string"
              },
              "metric": {
                "description": "Value to aggregate. Defaults to gross_proceeds.",
                "enum": ["gross_proceeds", "prospectus_count", "final_prospectus_count", "day1_return_pct"],
                "type": "string"
              },
              "range": {
                "description": "Trailing window when explicit dates are omitted. Defaults to 26w; anonymous 52w requests are clamped to 26w.",
                "enum": ["13w", "26w", "52w"],
                "type": "string"
              },
              "scope": {
                "description": "Include all matching records or only active offerings. Defaults to active.",
                "enum": ["all", "active"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data": {
                "additionalProperties": false,
                "properties": {
                  "points": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "period": {
                          "description": "Date bucket label.",
                          "type": "string"
                        },
                        "series": {
                          "description": "Grouped series label.",
                          "type": "string"
                        },
                        "value": {
                          "description": "Aggregated value for this bucket and series.",
                          "type": "number"
                        }
                      },
                      "required": ["period", "series", "value"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "spec": {
                    "additionalProperties": {},
                    "description": "Normalized chart filters actually applied to the query.",
                    "type": "object"
                  },
                  "subtitle": {
                    "description": "Display subtitle describing the filters.",
                    "type": "string"
                  },
                  "summary": {
                    "additionalProperties": false,
                    "properties": {
                      "periods": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "series": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "total": {
                        "description": "Total or average across returned points.",
                        "type": "number"
                      }
                    },
                    "required": ["periods", "series", "total"],
                    "type": "object"
                  },
                  "title": {
                    "description": "Display title for the chart.",
                    "type": "string"
                  },
                  "unit": {
                    "description": "Unit used by point values and summary.total.",
                    "enum": ["count", "usd", "percent"],
                    "type": "string"
                  }
                },
                "required": ["points", "spec", "subtitle", "summary", "title", "unit"],
                "type": "object"
              },
              "links": {
                "additionalProperties": false,
                "properties": {
                  "apiUrl": {
                    "description": "Chart JSON API URL.",
                    "type": "string"
                  },
                  "embedUrl": {
                    "description": "Embeddable chart URL.",
                    "type": "string"
                  },
                  "pageUrl": {
                    "description": "Public chart page URL.",
                    "type": "string"
                  }
                },
                "required": ["apiUrl", "embedUrl", "pageUrl"],
                "type": "object"
              }
            },
            "required": ["data", "links"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
