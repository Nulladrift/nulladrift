        {
          "name": "request_demo",
          "title": "Request a Samplyn demo",
          "description": "Send a demo request to the Samplyn team, who reply within one business day. Call this only when the person has asked to book a demo and has given their name, work email and company; never guess or invent their details. companyType is one of wholesaler, brand, private_label, other; companySize is one of 1-10, 11-50, 51-200, 200+; interests are any of develop, sell, samples, make, ship, run, cardi.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "Their company.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "companySize": {
                "enum": ["1-10", "11-50", "51-200", "200+"],
                "type": "string"
