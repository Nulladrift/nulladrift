{
  "lockfileVersion": 2,
  "subjects": {
    "com.digitalundergroundstore/marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://digitalundergroundstore.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "digital-underground-marketplace",
        "title": "Digital Underground Developer Marketplace",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Browse and search the free Digital Underground Developer Marketplace. Submitting needs the creator's own API key and always goes to human review.",
      "tools": [
        {
          "name": "get_listing",
          "title": "Get one listing",
          "description": "Get full public details (including the long description) of one approved listing by its id (cm_...).",
          "inputSchema": {
            "properties": {
              "id": {
                "pattern": "^cm_[a-z0-9_]{4,40}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bdf30e0484c2ffd5d86dd195aabc570b2a04d8231297f39907e52a98aa0d3278"
        },
        {
          "name": "get_my_listing_status",
          "title": "Check my listing status",
          "description": "Check the review status (pending, approved, rejected) of one of the user's own listings. Requires their API key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "id": {
                "type": "string"
              }
            },
            "required": ["api_key", "id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b8ccfe96f8b5860d2e60ada07d1ddd80f1ac1e3bdc7ef0d5b8253b7ccb338b6"
        },
        {
          "name": "search_listings",
          "title": "Search marketplace listings",
          "description": "Search approved products on the Digital Underground Developer Marketplace (apps, AI tools, books, templates by independent makers). Returns summaries with links. Checkout happens on each maker's own site.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["apps", "ai-tools", "games", "books", "templates", "other"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match in name, tagline, maker or tags. Omit to list everything.",
                "type": "string"
              },
              "tag": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7fbf99b038bfd3535f5b4e3bdeea96d4927e45b751fbd8a30b4f30ed9421035e"
        },
        {
          "name": "submit_listing",
          "title": "Submit a listing for review",
          "description": "Submit the user's own product to the marketplace. Requires the creator's API key (duk_..., from the Creator dashboard -> API keys; never guess one). Free. Every submission is screened automatically and goes live once it passes; flagged ones wait for owner review. Only submit real products the user owns, with accurate claims.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "Creator API key, duk_...",
                "type": "string"
              },
              "category": {
                "enum": ["apps", "ai-tools", "games", "books", "templates", "other"],
                "type": "string"
              },
              "descriptionLong": {
                "maxLength": 4000,
                "type": "string"
              },
              "imageUrl": {
                "description": "https cover image URL",
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "pitchShort": {
                "maxLength": 280,
                "type": "string"
              },
              "priceLabel": {
                "maxLength": 40,
                "type": "string"
              },
              "projectUrl": {
                "description": "https link to the product",
                "type": "string"
              },
              "stage": {
                "description": "Listing stage: concept, development, beta (testing), released or discontinued",
                "enum": ["concept", "development", "beta", "released", "discontinued"],
                "type": "string"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "terms": {
                "description": "Must be true: accepts the terms at https://digitalundergroundstore.com/community/submit/",
                "type": "boolean"
              },
              "videoUrl": {
                "type": "string"
              }
            },
            "required": ["api_key", "category", "descriptionLong", "name", "pitchShort", "projectUrl", "stage", "terms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:80a526cfb256a9410b7cc0f0f977452210aeeb9d57b975f6be072b85aaab4b56"
        }
      ],
      "digest": "sha256:91361f5292869cb9c6bfe1a911e911fe9003e219e82c5b179b4010131f65fad6"
    }
  }
}
