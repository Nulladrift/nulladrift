      "serverInfo": {
        "name": "front-sentinel",
        "title": "Front Sentinel",
        "version": "1.0.0",
        "websiteUrl": "https://frontsentinel.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only security checks of a public domain and its web frontend: registrar and registry locks, DNSSEC, CAA, expiry, nameserver consistency, SRI on third-party scripts, CSP, and the SEAL Security Frameworks DNS & Registrar controls. Uses public data only. Continuous monitoring with alerts is at https://frontsentinel.com.",
      "tools": [
        {
          "name": "check_registry_lock",
          "title": "Registry lock check",
          "description": "Reads the domain's EPP status codes from RDAP and tells whether registry lock (serverUpdateProhibited + serverTransferProhibited) is on, partly on or off, and which registrar-level locks are set.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, e.g. app.example.com. A URL is accepted too; only the host is used.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a6f32c4889ba5113a67144ba036a6ac1251bb693268c2930b8d021365aa47108"
        },
        {
          "name": "check_seal_dns_registrar",
          "title": "SEAL DNS & Registrar self-check",
          "description": "Goes through the 16 controls of the SEAL Security Frameworks certification for DNS & Registrar and marks what public data shows for each: ok, partial, gap, not visible from outside, or a process control the team has to document itself. Includes DNSSEC, CAA, SPF/DMARC/MTA-STS, locks, expiry and security.txt.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, e.g. app.example.com. A URL is accepted too; only the host is used.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6c0fc2e3e42ab73175a76a3183f140aa93b8f5dcab40c5db86ce76f2b17847e0"
        },
        {
          "name": "check_sri",
          "title": "Subresource Integrity check",
          "description": "Loads a public page and lists every script, stylesheet and preload it pulls in. For third-party files, checks whether an integrity= hash is present and matches, and returns a ready sha384 hash for files that have none.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public https page URL or domain, e.g. https://app.example.com/",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fabe7996dab044c18571f61297fa9f26b48b1c1fbefa4e5c398a5454a2e9ec18"
        },
        {
          "name": "scan_domain",
          "title": "Domain and frontend security scan",
          "description": "Scores how well a dApp or website domain is protected against hijacking: registrar transfer/update locks, registry lock, DNSSEC, CAA, expiry, nameserver consistency across resolvers, SRI on third-party scripts and the Content-Security-Policy header. Returns a 0-100 score, each check with pass/fail/unknown and advice. Results are cached for an hour.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Domain name, e.g. app.example.com. A URL is accepted too; only the host is used.",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6e72b41c5ee319094b67a58e9bf7f21c9768c40f77dcdf0e8bfbbeeaa74019f2"
        }
      ],
