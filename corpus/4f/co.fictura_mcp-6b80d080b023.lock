        {
          "name": "create_tracking_link",
          "title": "Create a tracking link",
          "description": "Creates a tracking link and returns its shareable URL. A tap is logged as a click, then redirected to destination_url with the click's id, which is how an install is credited to the link. A tap from a computer goes to desktop_url instead, or to the app's website when destination_url is a store page. Use the store address for a real campaign, or the app's own scheme (myapp://) for a link that opens the app in a test. Creates a new link each time; nothing existing changes. Needs read and edit access.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "campaign_id": {
                "description": "Campaign name or id",
                "maxLength": 200,
                "type": "string"
              },
              "deep_link_value": {
                "description": "Where in the app to send the person",
                "maxLength": 200,
                "type": "string"
              },
              "desktop_url": {
                "description": "Where a tap from a computer goes. Leave out to use the app's website",
                "maxLength": 1000,
                "type": "string"
              },
              "destination_url": {
                "description": "Where a tap goes: a store address, a web page or myapp://",
                "maxLength": 1000,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "What the link is for, shown on the Links page",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "play_store_url": {
                "description": "Google Play address, for the install referrer",
                "maxLength": 1000,
                "type": "string"
              },
              "provider": {
                "description": "Media source in lowercase, like tiktok",
                "maxLength": 40,
                "type": "string"
              },
              "slug": {
                "description": "Vanity slug, 3 to 50 letters and digits. Leave out for a random one.",
                "type": "string"
              }
            },
            "required": ["destination_url", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a tracking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
