{
  "lockfileVersion": 2,
  "subjects": {
    "co.fictura/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.fictura.co/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fictura",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Fictura documentation is available without signing in (search_docs, read_doc, list_docs). Not authenticated. Fictura data tools need you to sign in with your Fictura account (your client offers this when it supports MCP sign-in) or an MCP key: open the Fictura dashboard → Setup → “Coding agents (MCP)” → create a key, then reconnect with the header `x-api-key: fk_mcp_…` or `Authorization: Bearer fk_mcp_…` (or set FICTURA_MCP_KEY if you are using the @fictura/mcp npx shim). The documentation tools — search_docs, read_doc, list_docs — work without either.",
      "tools": [
        {
          "name": "check_entitlement",
          "title": "Check whether a user is subscribed",
          "description": "The authoritative paid/not-paid verdict for one user, unified across Stripe, RevenueCat, App Store and Play — the same answer GET /api/v1/entitlements/{user_id} returns to a server. Note: `environment` is SANDBOX when the verdict rests on test purchases, so always check it before granting production access; a cancellation only flips will_renew (access runs to expires_at); and an unknown user is a valid 'none' answer, not an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "user_id": {
                "description": "Device id, account id or RevenueCat id",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["user_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check whether a user is subscribed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:cd72da94d2750b14afa3b0e7dd7ae80ed3d5bcadcc77b4943cfa08631f9f4108"
        },
        {
          "name": "compare_releases",
          "title": "Compare two releases",
          "description": "Every route, screen and page seen in both releases, with count, p50, p95 and error rate in each, sorted by the extra time per minute release b spends against a: what got slower or faster. Also what appears in only one of them. Take release names from list_releases or get_tracing_health.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "a": {
                "description": "The earlier release",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "b": {
                "description": "The later release",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "environment": {
                "description": "Like production. Default: production when the app has it, else its busiest non-development one. 'all' for every environment.",
                "maxLength": 40,
                "type": "string"
              },
              "from": {
                "description": "An ISO time, or how long ago: 30m, 24h, 7d",
                "maxLength": 40,
                "type": "string"
              },
              "op": {
                "description": "Only this op, like http.server or ui.load",
                "maxLength": 64,
                "type": "string"
              },
              "range": {
                "description": "Window: 1h, 24h, 7d, 14d, 30d or 90d (default 24h). Ignored when from is given.",
                "enum": ["1h", "24h", "7d", "14d", "30d", "90d"],
                "type": "string"
              },
              "release": {
                "description": "Only this release (service version)",
                "maxLength": 60,
                "type": "string"
              },
              "service": {
                "description": "Only this service, like house-ai-api or the app's bundle id",
                "maxLength": 120,
                "type": "string"
              },
              "source": {
                "description": "backend (servers), frontend (app and web), or all (default)",
                "enum": ["backend", "frontend", "all"],
                "type": "string"
              },
              "to": {
                "description": "An ISO time, or how long ago (default now)",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two releases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8c4d5f29a84c5e77af38ea2b0b95230ac06eff071aefbff3a5a22e761916a037"
        },
        {
          "name": "create_experiment",
          "title": "Create a draft experiment",
          "description": "Create an A/B test as a DRAFT: nobody sees it until start_experiment. 2 to 4 arms, each pointing at a paywall or onboarding flow of this app on the experiment's surface (ids from list_surfaces); one arm may be a holdout with no target (it keeps the live config). Exactly one control; the first arm when none is marked. Defaults: mode notify (report the winner, don't ship it), new users only, the default placement, trial_started as the metric. Only works when the app allows MCP writes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audience_pct": {
                "description": "% of eligible users enrolled. Default 100",
                "maximum": 100,
                "minimum": 5,
                "type": "integer"
              },
              "enrollment": {
                "description": "Default new: users first seen after the start",
                "enum": ["new", "new_and_existing"],
                "type": "string"
              },
              "experiment_type": {
                "description": "A label. Default other",
                "enum": ["design", "price_point", "introductory_offer", "free_trial_offer", "subscription_duration", "subscription_ordering", "other"],
                "type": "string"
              },
              "hypothesis": {
                "description": "What you expect to happen and why",
                "maxLength": 500,
                "type": "string"
              },
              "is_qa": {
                "description": "A QA run on test builds. Default false",
                "type": "boolean"
              },
              "min_confidence": {
                "description": "Chance to be best a winner needs. Default 0.95",
                "maximum": 0.999,
                "minimum": 0.5,
                "type": "number"
              },
              "mode": {
                "description": "notify (default) reports a winner; auto ships it",
                "enum": ["notify", "auto"],
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "placement": {
                "description": "Placement id (letters, digits, _ or -). Default `default`",
                "maxLength": 40,
                "type": "string"
              },
              "primary_metric": {
                "description": "Default trial_started",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "priority": {
                "description": "Enrollment order, lowest first. Default 100",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "surface": {
                "enum": ["paywall", "onboarding"],
                "type": "string"
              },
              "targeting": {
                "additionalProperties": {},
                "description": "Who is eligible; every rule must pass, {} = everyone. Keys: countries (ISO-2), platforms (ios, android, web), app_version_min/max, days_since_install_min/max, billing_states, custom",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "variants": {
                "items": {
                  "properties": {
                    "allocation": {
                      "description": "Relative weight. Default 50",
                      "maximum": 100,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "is_control": {
                      "type": "boolean"
                    },
                    "is_holdout": {
                      "type": "boolean"
                    },
                    "name": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "target_id": {
                      "description": "Paywall or onboarding flow id; omit for the holdout",
                      "format": "uuid",
                      "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["name", "surface", "variants"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a draft experiment"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:3f03eca52d490e90fa9799f0efead636b52ef59e043dc8b1037de2ad94993ebd"
        },
        {
          "name": "create_fix_pr",
          "title": "Open a draft fix PR for an error issue",
          "description": "Open your fix for an issue as a draft PR in the app's repo, with `Fixes <short id>` so the issue resolves when it ships. Send patches (git diff) per file. No build, CI or .github changes. Needs \"Let MCP keys open pull requests\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "files": {
                "items": {
                  "properties": {
                    "content": {
                      "description": "The whole new file",
                      "maxLength": 1000000,
                      "type": "string"
                    },
                    "delete": {
                      "description": "Remove the file",
                      "type": "boolean"
                    },
                    "patch": {
                      "description": "Unified diff for this file (git diff output). Preferred: smaller.",
                      "maxLength": 400000,
                      "type": "string"
                    },
                    "path": {
                      "description": "Path from the repo root",
                      "maxLength": 400,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "issue_id": {
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "root_cause": {
                "maxLength": 6000,
                "minLength": 3,
                "type": "string"
              },
              "summary": {
                "description": "What the change does",
                "maxLength": 4000,
                "minLength": 3,
                "type": "string"
              },
              "tests_run": {
                "maxLength": 2000,
                "type": "string"
              },
              "title": {
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["files", "issue_id", "root_cause", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Open a draft fix PR for an error issue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:81fc4f52f7db4067a07f8941e5135bf64069e94991e60e38f934dafd3b58dfe9"
        },
        {
          "name": "create_inbound_filter",
          "title": "Add an inbound filter",
          "description": "Drop matching errors at ingest from now on (within 30 seconds): counted, never stored, grouped or alerted on. Use it for noise nobody will fix. Kinds as in list_inbound_filters; environment `simulator` drops events from simulators and emulators. Refuses an exact duplicate. Only works when the app allows MCP writes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "kind": {
                "enum": ["exc_type", "message", "environment", "release"],
                "type": "string"
              },
              "pattern": {
                "description": "Exact text, or for message a glob like *RevenueCat*network*",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["kind", "pattern"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add an inbound filter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["email"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:5ca9cb4b942bf1f80f810e788f500dedf000ab79e025a3ac412ea429a78ad956"
        },
