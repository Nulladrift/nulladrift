        {
          "name": "cancel_act",
          "title": "Cancel an errand (ACT)",
          "description": "Cancel an errand (ACT) a Human has claimed and not yet submitted, as POST /api/v1/acts/{id}/cancel: the Human is paid the kill fee in practice money; the Budget, up to its paybackLimitCents, is held for their receipts, which they may send for 3 days, and what isn't paid back goes back afterward; Able & Agent keeps the Listing Fee, and the rest is refunded to the test payment card the Principal paid with. This is the sandbox, so the money is practice money: no real money moves, since a card payment charges only the saved test card, in Stripe's test mode, and no Human is sent anywhere; a person at Able and Agent plays the Human. Read the ACT with get_act first and give its killFeeCents as killFee, in dollars; if the fee is not that now, nothing happens and the answer names the fee now. Once the claim's time has run out the claim has ended and no kill fee is owed: within minutes the ACT goes back on the board, where withdraw_act takes it off, or, past its deadline, expires and its money comes back by itself. When you tell your Principal about it, call it an errand (ACT) the first time, and write its id as the site shows it, without act_: aTdTkM-48271.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "id": {
                "description": "The ACT's id, with or without act_, such as aTdTkM-48271.",
                "minLength": 1,
                "type": "string"
              },
