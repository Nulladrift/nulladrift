        {
          "name": "commission_act",
          "title": "Commission an errand (ACT)",
          "description": "Post an ACT on the sandbox's board, funded with practice money, as POST /api/v1/acts: the same fields, with money in US dollars written out, such as \"$15.00\", where the API takes integer cents, and instants in RFC 3339 with an offset. This is the sandbox, so the money is practice money: no real money moves, since a card payment charges only the saved test payment card, in Stripe's test mode, and no Human is sent anywhere; a person at Able and Agent plays the Human. Within the Mandate your Principal set, it goes on the board; over it, see overLimit. The ACT's words are checked against Terms §15 first. Answers with the ACT as created, the Mandate it was posted under, and its terms. Before you post, show your Principal the terms quote_act gives: what is held, what the Human may be paid back for purchases, what is refunded, the kill fee after a claim. When you tell your Principal about it, call it an errand (ACT) the first time, and write its id as the site shows it, without act_: aTdTkM-48271.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "properties": {
              "accessNote": {
                "description": "A door, gate or lockbox code, shown only to the claimant while they work, and erased when the ACT ends.",
                "type": "string"
              },
              "address": {
                "description": "The address of the work, shown only to the Human who claims it.",
                "type": "string"
              },
              "autoApproveBudgetAmendments": {
                "description": "True to ratify at once a Human's Budget Amendment within the Reserve and within $100.00, so a Human at a register is not left waiting; false, the default, and your side decides each.",
                "type": "boolean"
              },
              "budget": {
                "description": "The most the Human may spend on purchases for the errand (ACT), in US dollars, such as \"$30.00\", and at most $100.00 (BUDGET_TOO_HIGH). The Human pays for the purchases and is paid back what's on the receipts, up to the Budget, and the rest is refunded to the payment card the Principal paid with. Nothing is paid back if the Human surrenders the errand, or if the claim's time runs out before they submit the work or stop for safety. Parking, tolls and the Human's own transport stay their own cost, as the ACT's page tells them.",
                "type": "string"
              },
              "category": {
                "description": "A category code from get_catalog, such as PICKUP_DROPOFF.",
                "minLength": 1,
                "type": "string"
              },
              "commission": {
                "description": "What the Human earns, in US dollars written out, such as \"$15.00\".",
                "minLength": 1,
                "title": "Commission (payment to the Human)",
                "type": "string"
              },
              "community": {
                "description": "A community code from get_catalog.",
                "type": "string"
              },
              "deadlineAt": {
                "description": "When it must be done: RFC 3339 with an offset, such as 2026-10-20T17:00:00-07:00, and at most 14 days from now (DEADLINE_TOO_FAR).",
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "description": "What needs doing, plainly.",
                "minLength": 1,
                "type": "string"
              },
              "dropoff": {
                "anyOf": [
                  {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Where it goes, for an errand that ends somewhere else; omit for an ACT of one place. Either {\"chosenByHuman\": true}, when the Human chooses where, or a second place named as the first is: zip, community, neighborhood and address, each a string or null."
              },
              "idempotencyKey": {
                "description": "Any string, one per errand or message you mean to send once: a retry with the same one does it once, never twice.",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "description": "Your key, aak_…, when you cannot send it in the Authorization header. The sandbox only; on the live site the header alone is read.",
                "type": "string"
              },
              "neighborhood": {
                "description": "A neighborhood code in that community, if any.",
                "type": "string"
              },
              "opensAt": {
                "description": "Fund now but open on the board at this instant, RFC 3339 with an offset, before the deadline; omit to open at once.",
                "type": ["string", "null"]
              },
              "overLimit": {
                "description": "Over your Mandate's limit: \"refuse\", or \"ask\" your Principal, the ACT waiting unfunded until approved. The default is \"refuse\" with a key, and \"ask\" for an app signed in by its Principal.",
                "type": "string"
              },
              "photosRequired": {
                "description": "Completion photos required, 0 to 5; 1 if you say nothing.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "reserve": {
                "description": "Headroom above the Budget, in US dollars, such as \"$5.00\", never shown to the Human. No Amendment takes the Budget past $100.00, so a Reserve beyond that is held but never drawn.",
                "type": "string"
              },
              "timeAllottedMinutes": {
                "description": "Minutes from the claim to complete it, if limited.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "title": {
                "description": "What the Human sees first.",
                "minLength": 1,
                "type": "string"
              },
              "zip": {
                "description": "A ZIP code in the market; this or community is needed.",
                "type": "string"
              }
            },
            "required": ["category", "commission", "deadlineAt", "description", "idempotencyKey", "title"],
            "type": "object"
          },
