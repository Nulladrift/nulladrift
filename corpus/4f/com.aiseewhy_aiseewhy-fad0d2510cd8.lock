      "instructions": "Page Intelligence tools (get_all_pages_performance, find_zero_click_pages, detect_keyword_cannibalization, generate_redirect_plan, prioritize_seo_opportunities and more) analyze a site from the user's own Search Console data. AISeeWhy audits whether AI crawlers and AI search can read and cite a web page. Each finding has a priority (P1 critical, P2 important, P3 nice to have or a policy choice), evidence and ready-to-paste fixes (robots.txt diff, Cloudflare rule, JSON-LD, llms.txt). Each page report also has a classic SEO block (title, description, H1, canonical, noindex, links) with its own score, and crawl_site audits a whole site for SEO and find_broken_links finds broken links level by level. Blocks are tested from an unverified IP. Support: support@aiseewhy.com.",
      "tools": [
        {
          "name": "audit_sitemap",
