                "description": "Report language as a code such as en, de, fr, es, ja or zh. Defaults to the account language (English without a key); 60 languages are supported.",
                "title": "Language"
              },
              "max_urls": {
                "default": 10,
                "description": "How many page URLs from the sitemap to audit, 1 to 10.",
