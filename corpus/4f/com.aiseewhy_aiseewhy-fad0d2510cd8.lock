{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiseewhy/aiseewhy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.aiseewhy.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "aiseewhy",
        "title": "AISeeWhy AI crawler & AEO audit",
        "version": "1.1.0",
        "websiteUrl": "https://aiseewhy.com",
        "icons": [
          {
            "src": "https://aiseewhy.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://aiseewhy.com/icons/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AISeeWhy audits whether AI crawlers and AI search can read and cite a web page. Each finding has a priority (P1 critical, P2 important, P3 nice to have or a policy choice), evidence and ready-to-paste fixes (robots.txt diff, Cloudflare rule, JSON-LD, llms.txt). Blocks are tested from an unverified IP. Support: support@aiseewhy.com.",
      "tools": [
        {
          "name": "audit_sitemap",
          "description": "Audit up to 10 pages listed in a sitemap or sitemap index. Returns one summary line per page plus the full report of every page with findings. Needs an API key.",
          "inputSchema": {
            "properties": {
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Report language as a code such as en, de, fr, es, ja or zh. Defaults to the account language (English without a key); 30 languages are supported.",
                "title": "Language"
              },
              "max_urls": {
                "default": 10,
                "description": "How many page URLs from the sitemap to audit, 1 to 10.",
                "minimum": 1,
                "title": "Max Urls",
                "type": "integer"
              },
              "sitemap_url": {
                "description": "URL of a sitemap.xml or sitemap index, for example https://example.com/sitemap.xml.",
                "title": "Sitemap Url",
                "type": "string"
              }
            },
            "required": ["sitemap_url"],
            "title": "audit_sitemapArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "audit_sitemapOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit pages from a sitemap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fa91c16ff0b1749812c19cbaa5245f4a41fa96f6c2e74f9a2e56a92f7701754c"
        },
        {
          "name": "audit_url",
          "description": "Audit one URL: fetch it as 16 AI and search crawlers plus curl and a browser, check robots.txt, structured data, answer-first content, freshness, hreflang and llms.txt. Returns a Markdown report with findings and fixes. language: report language code (en, de, ja, …).",
          "inputSchema": {
            "properties": {
              "bots": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only test these crawlers, by name (for example GPTBot, OAI-SearchBot, ClaudeBot, PerplexityBot, Google-Extended). Omit to test all 16 AI and search crawlers.",
                "title": "Bots"
              },
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Report language as a code such as en, de, fr, es, ja or zh. Defaults to the account language (English without a key); 30 languages are supported.",
                "title": "Language"
              },
              "url": {
                "description": "Page to audit: a full URL or a bare domain such as example.com (https is assumed).",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "audit_urlArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "audit_urlOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Audit a URL for AI crawlers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a5c06a67a6dd33d9cc3d35ed30ee624d5cd17d4dc5f2191bf55670ff5c98face"
        },
        {
          "name": "compare_urls",
          "description": "Audit 2 or 3 URLs (yours and competitors') and compare them side by side: score, P1/P2/P3 counts, blocked crawlers, llms.txt, structured data, text without JavaScript. Needs an API key.",
          "inputSchema": {
            "properties": {
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Report language as a code such as en, de, fr, es, ja or zh. Defaults to the account language (English without a key); 30 languages are supported.",
                "title": "Language"
              },
              "urls": {
                "description": "2 or 3 page URLs or domains to compare; put your own page first.",
                "items": {
                  "type": "string"
                },
                "title": "Urls",
                "type": "array"
              }
            },
            "required": ["urls"],
            "title": "compare_urlsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "compare_urlsOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare 2-3 URLs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e2d8716fefbc8939bc31ae96c6f8b2d97c73c1cf55bd8d05a9a96c430ca6b8fb"
        },
        {
          "name": "explain_finding",
          "description": "Explain a finding id (e.g. access.blocked, robots.disallowed, schema.software_no_offers) in the given language: what it means, why it matters for AI search and how to fix it.",
          "inputSchema": {
            "properties": {
              "finding_id": {
                "description": "Finding id exactly as shown in an audit report, for example access.blocked or llms.missing.",
                "title": "Finding Id",
                "type": "string"
              },
              "language": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Report language as a code such as en, de, fr, es, ja or zh. Defaults to the account language (English without a key); 30 languages are supported.",
                "title": "Language"
              }
            },
            "required": ["finding_id"],
            "title": "explain_findingArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "explain_findingOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Explain a finding"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:59d80533c25e12d670aa3de8a7fe445625b51ae307c55d624586588c3d10c074"
        },
        {
          "name": "list_watched_sites",
          "description": "List the URLs this account monitors, with the frequency, last score and last check time. Needs an API key.",
          "inputSchema": {
            "properties": {},
            "title": "list_watched_sitesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "list_watched_sitesOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List monitored URLs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c8628444ce1bfd7ec4519dfe0634e42d282330fd76b8af294fdff08489f45cc2"
        },
        {
          "name": "watch_site",
          "description": "Add a URL to the account's scheduled monitoring (freq: daily or weekly). The owner gets an email when a check finds a new P1 problem or the score drops by 10 or more. Needs an API key; adding the same URL again only changes the frequency.",
          "inputSchema": {
            "properties": {
              "freq": {
                "default": "weekly",
                "description": "How often to check the page: daily or weekly (default).",
                "title": "Freq",
                "type": "string"
              },
              "url": {
                "description": "Page to monitor: a full URL or a bare domain such as example.com.",
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["url"],
            "title": "watch_siteArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "watch_siteOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Monitor a URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a70bc09a5a79861d1ea9e5c576b6d4870bc8a22e9287da25ba6064e9c1fcbcb"
        }
      ],
      "digest": "sha256:0d444a0bc8146e1bd3f232a9e820cd2c54db9c205561eb58e113db1cfc197f90"
    }
  }
}
