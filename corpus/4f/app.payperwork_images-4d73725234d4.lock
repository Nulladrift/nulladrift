{
  "lockfileVersion": 2,
  "subjects": {
    "app.payperwork/images": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://payperwork.app/image/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "payperwork-image",
        "version": "0.4.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Image generation for agents, paid per image in USDC over x402: a prompt in, one image out, on GPT Image or Gemini image models. The generate_image tool quotes its price in the 402 for your exact request; models is free. Security model: every call is priced before it runs (the 402 states the amount) and charged only if it succeeds; the paying wallet is the identity; no account or key exists to revoke. Full statement: GET / (JSON) or /llms.txt. Images: the prompt goes to the model's provider and is not stored by PayperWork; a call that returns no image is not charged; the provider's safety filters apply.",
      "tools": [
        {
          "name": "generate_image",
          "description": "Generate one image from a prompt and return it as an image block. Models: google/nano-banana-2.1, google/nano-banana-2-lite, google/nano-banana-pro, openai/gpt-image-2, openai/gpt-image-2.5-flare, openai/gpt-image-2.5-sunburst (default google/nano-banana-2.1). openai/* models take size (1024x1024, 1024x1536, 1536x1024) and quality (low, medium, high; default medium); google/* models take resolution (1K, 2K, 4K where allowed) and aspect_ratio (1:1 default, 16:9, 9:16, 3:2, 2:3, 4:3, 3:4, 21:9). Price per image is quoted in the 402 from the provider's list price for that choice (x 1.4 + $0.0005, minimum $0.005); settled as quoted. Charged only if an image comes back. Text prompts only; up to 4000 characters.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aspect_ratio": {
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "output_format": {
                "enum": ["png", "jpeg", "webp"],
                "type": "string"
              },
              "prompt": {
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "quality": {
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "resolution": {
                "enum": ["1K", "2K", "4K"],
                "type": "string"
              },
              "size": {
                "enum": ["1024x1024", "1024x1536", "1536x1024"],
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Generate image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.005
          },
          "digest": "sha256:047a896de9917e183b6bebbc3148ef449be8d8e5d21913dab4d9a77e8917e236"
        },
        {
          "name": "models",
          "title": "Image models",
          "description": "List the image models with their options and per-image prices. Free.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a37361f3f6431de9e1cfaa2bf52508fdcb2daacbd09b3010148f0cd49651adec"
        }
      ],
      "digest": "sha256:20f71a02f8680af3945a77d4deb8d0d78ea403fd91f308317cc454e9443330b0"
    }
  }
}
