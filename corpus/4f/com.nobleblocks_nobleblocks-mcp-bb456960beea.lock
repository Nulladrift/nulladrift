        {
          "name": "search_papers",
          "title": "Search papers",
          "description": "Search the NobleBlocks index of scholarly papers by keyword relevance, with filters.\n\n        Each result has title, authors, year, journal, DOI, citation count, an abstract excerpt,\n        a NobleBlocks link and `best_link` (free full text when known, else the DOI/ARK).\n        Use get_paper with a result's `id` for full metadata, or cite to cite it.",
          "inputSchema": {
            "properties": {
              "language": {
                "anyOf": [
                  {
                    "pattern": "^[a-z]{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Two-letter language code, e.g. 'en'.",
                "title": "Language"
              },
              "limit": {
                "default": 10,
                "description": "Number of results (1-50; your access tier may cap it lower).",
                "maximum": 50,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "min_citations": {
                "anyOf": [
                  {
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only papers cited at least this many times.",
                "title": "Min Citations"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many results (paging).",
                "maximum": 1000,
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "query": {
                "description": "Topic, question, title words or author name. Supports AND / OR / NOT and \"quoted phrases\".",
                "maxLength": 500,
                "minLength": 2,
                "title": "Query",
                "type": "string"
              },
              "sort": {
                "default": "relevance",
                "description": "relevance (default), date (newest first) or citations.",
                "enum": ["relevance", "date", "citations"],
                "title": "Sort",
                "type": "string"
              },
              "source": {
                "anyOf": [
                  {
                    "enum": ["openalex", "pubmed", "crossref", "arxiv", "europepmc", "doaj", "semanticscholar", "scielo", "clinicaltrials", "ictrp"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only records from this source.",
                "title": "Source"
              },
              "year_from": {
                "anyOf": [
                  {
                    "maximum": 2100,
                    "minimum": 1000,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only records published in or after this year.",
                "title": "Year From"
              },
              "year_to": {
