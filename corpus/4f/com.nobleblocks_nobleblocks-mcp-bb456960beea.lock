            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cite"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f136048eff470c21c202293e47687503dc90ea60ade978a7ace49184b9931c3"
