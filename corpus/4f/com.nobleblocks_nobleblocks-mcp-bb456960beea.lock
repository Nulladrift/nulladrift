        {
          "name": "get_citation",
          "title": "Get citation",
          "description": "Format a citation for one paper as BibTeX, RIS or APA 7. The URL is the paper's NobleID ARK\n        when it has a confirmed one, else its DOI. DOIs known to be unreliable are left out rather than guessed.",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "bibtex",
                "description": "bibtex, ris or apa (APA 7, plain text).",
                "enum": ["bibtex", "ris", "apa"],
                "title": "Format",
                "type": "string"
              },
              "identifier": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "integer"
                  }
                ],
                "description": "A NobleBlocks paper id (the `id` from a search), a DOI (10.xxxx/...), a NobleID ARK (ark:/48914/...), an OpenAlex id (W...), 'pmid:<number>', 'arxiv:<id>' or a trial registry id (NCT...).",
                "title": "Identifier"
              }
            },
            "required": ["identifier"],
            "title": "get_citationArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_citationDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get citation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2463612416133976966e7ee78df227d7326db7b8c1b569d98174d1e23110e3bb"
