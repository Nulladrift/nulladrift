        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.mcpscores/cache-key-explosion-auditor",
        "title": "Cache Key Explosion Auditor",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Audits a sample of HTTP request URLs against explicit, documented cache-key standardization rules (query param drops, query sorting, fragment dropping) and reports which distinct request variants would collapse onto the same proposed cache key. Never fetches or applies anything: it is a bounded, pure computation over the exact samples you provide. Equivalence between merged variants is only ever reported as \"observed_equivalent\" when every contributing sample carries the same explicit representation_id; otherwise the merge is flagged \"conflict\" (proven mismatch) or \"unproven\" (no evidence either way). No hit-rate, revenue, or cache-performance prediction is made, and no CDN/Cloudflare rule is ever read or written. Tool calls cost 0.05 USDC on Base. Initialization, tool discovery and unpaid price challenges are free. Send x402 v2 PAYMENT-SIGNATURE on the POST or params._meta['x402/payment']. Reuse the identical input and authorization when recovering a pending purchase; do not sign a fresh charge. Results are retained24hours. Analyzes only the request samples supplied in this call; makes no claim about traffic not present in the sample (scope: supplied_samples_only). Does not fetch, crawl, or otherwise access the network; URLs are treated as opaque text. Does not predict cache hit-rate, revenue impact, or any performance outcome. Does not read, write, or apply any Cloudflare (or other CDN/vendor) cache rule. Default rules perform no query-parameter drops; marketing/tracking parameters are never assumed safe to drop unless explicitly named in drop_query_params. A merged group is only ever labeled observed_equivalent when every contributing request has a representation_id and all of them match; otherwise it is conflict or unproven. Bounded input only: <=1000 requests, URLs <=2048 chars, <=100 query parameter names per URL/rule list, each name <=128 chars, total request body <=128KiB. Only absolute http/https URLs without userinfo are accepted; malformed percent-encoding and other malformed input are rejected, never silently repaired. Results at most 96 KiB; retry identical input and authorization within 24 hours to recover a purchase.",
      "tools": [
        {
          "name": "cache_key_explosion_auditor",
          "description": "Audits a sample of HTTP request URLs against explicit, documented cache-key standardization rules (query param drops, query sorting, fragment dropping) and reports which distinct request variants would collapse onto the same proposed cache key. Never fetches or applies anything: it is a bounded, pure computation over the exact samples you provide. Equivalence between merged variants is only ever reported as \"observed_equivalent\" when every contributing sample carries the same explicit representation_id; otherwise the merge is flagged \"conflict\" (proven mismatch) or \"unproven\" (no evidence either way). No hit-rate, revenue, or cache-performance prediction is made, and no CDN/Cloudflare rule is ever read or written. Price: 0.05 USDC per completed bounded job on Base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "requests": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "count": {
                      "minimum": 0,
                      "type": "integer"
                    },
                    "method": {
                      "enum": ["GET", "HEAD"],
                      "type": "string"
                    },
                    "representation_id": {
                      "maxLength": 256,
                      "type": "string"
                    },
                    "url": {
                      "maxLength": 2048,
                      "type": "string"
                    }
                  },
                  "required": ["url"],
                  "type": "object"
                },
                "maxItems": 1000,
                "minItems": 1,
                "type": "array"
              },
              "rules": {
                "additionalProperties": false,
                "properties": {
                  "drop_fragment": {
                    "type": "boolean"
                  },
                  "drop_query_params": {
                    "items": {
                      "maxLength": 128,
                      "type": "string"
                    },
                    "maxItems": 100,
                    "type": "array"
                  },
                  "sort_query_params": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              }
            },
            "required": ["requests"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
