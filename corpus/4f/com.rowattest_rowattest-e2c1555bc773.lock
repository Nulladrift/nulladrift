{
  "lockfileVersion": 2,
  "subjects": {
    "com.rowattest/rowattest": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.rowattest.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "rowattest",
        "title": "RowAttest",
        "version": "1.1.0",
        "description": "Lists your RowAttest projects, starts isolation checks, follows them, and reads findings and the signed report.",
        "websiteUrl": "https://rowattest.com/mcp",
        "icons": [
          {
            "src": "https://app.rowattest.com/rowattest-mark.png",
            "mimeType": "image/png",
            "sizes": ["224x224"],
            "theme": "light"
          },
          {
            "src": "https://app.rowattest.com/rowattest-mark-dark.png",
            "mimeType": "image/png",
            "sizes": ["224x224"],
            "theme": "dark"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "RowAttest runs authorization tests against the Supabase project this account connected on app.rowattest.com and reports what it observed. The account owner agreed to connect staging or test projects only, not production databases with real customer data (Terms §4); do not use it to test production data. Typical loop: list_projects to get the project_id; run_review to start a run; wait_for_run until the status is complete or failed; get_findings for the cells that did not pass; change the policies; run again. A PASS means the listed identities and operations were executed and no leak was observed; it does not claim anything about what was not tested. When a result includes verify_url, quote it so a reader can check the signed report. When a result's verification is unverified, it comes from a run with no signed report; say the results are unverified when you quote them. Runs that do not fail count against the account's monthly allowance; when a run cannot start, the response says why.",
      "tools": [
        {
          "name": "get_findings",
          "description": "Returns the cells that did not pass in a complete run that has a signed report — verdict, surface, operation, boundary, identity, layer outcomes and notes — plus tenancy flags, blocking findings and, when the report includes catalog hygiene checks, the hygiene block (the checks run, each finding's check, severity, object, detail and hint, and any check not run). For a complete run with no signed report, while one can still be bought on the run page, it returns the run's unverified result instead: the verdict, surface, operation and principal of each cell that did not pass, the run page's finding lines, the counts, the coverage lines, the access model summary and the same hygiene block. The list of cells is empty when every tested cell passed. Cell results contain no fix suggestions: the engine records only what it observed. Hygiene findings are catalog observations, never verdicts; each carries the engine's one-line hint for the project owner's review.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "run_id": {
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a301882c8de0c94636438b4577e272970822552c680ac6f3becf0cc1ac431e48"
        },
        {
          "name": "get_report",
          "description": "Returns the full signed report of a complete run as the exact stored JSON, with its verify_url and report_sha256 (sha256 of the canonical signed bytes, the fingerprint shown on the verify page). Use get_findings for the compact view.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "run_id": {
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89120a728aa15604e076fe25150df50623f78edd3dc0541986a70eb5de8e4984"
        },
        {
          "name": "get_run_status",
          "description": "Returns a run's status (queued, running, complete or failed), its current stage, timestamps and, when a signed report exists, its verify_url.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "run_id": {
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b027546e1aea78167132085718302bd91586a16d4b821b0865dc3f21cb75d28"
        },
        {
          "name": "list_projects",
          "description": "Lists the Supabase projects connected to this account with id, name, connection state and whether each is ready to run. Call this first to get a project_id.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e5353fd608d1eaaa1db2cf7d6a5d6d104a954d56ae43b48c8d9ed333970f9690"
        },
        {
          "name": "run_review",
          "description": "Starts an authorization test run on a connected project and returns the run_id and status. If the project already has a run waiting to start, returns that run instead of starting another. Runs that do not fail count against the monthly allowance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "attest": {
                "type": "boolean"
              },
              "label": {
                "type": "string"
              },
              "project_id": {
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:dec5c3aa85851f199eafef9c11bffb7b1a8e2a2bc9edcf8585e2318416e42c5e"
        },
        {
          "name": "verify_attestation",
          "description": "Checks a RowAttest attestation published by a site or MCP server. Give it the origin (for example https://example.com); it fetches /.well-known/rowattest.json there, follows the first entry to the signed summary, verifies the signature offline against RowAttest's public key list, and returns whether the proof is valid, when it was issued, its totals, whether findings were present, and whether it is bound to the project ref you pass. It reads public data only, needs no project of yours, and starts no run. A valid proof means the listed checks ran at that time and were signed by RowAttest; it does not mean the application is secure.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "fingerprint": {
                "description": "optional, a sha256: value to compare with the summary's schema fingerprint",
                "type": "string"
              },
              "origin": {
                "description": "the origin (for example https://example.com)",
                "type": "string"
              },
              "project_ref": {
                "description": "optional, the first label of the Supabase project host",
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:588b1072bfbcd0d39b196f5cdea85667e047f851b7a9ce16f45f509bbf868528"
        },
        {
          "name": "wait_for_run",
          "description": "Waits up to timeout_seconds (1 to 60) for a run to finish, then returns the same information as get_run_status. Call it again while the status is still queued or running.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "run_id": {
                "type": "string"
              },
              "timeout_seconds": {
                "type": "number"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5ea19e9ee7125c488c01419db4bc4eb2310c931702aa17840352188665a2968"
        }
      ],
      "digest": "sha256:61efdaad8400357dd25af4244c61dfd39533eefee3dd9f6e7e0f1b18663f4bc8"
    }
