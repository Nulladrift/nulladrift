        {
          "name": "list_hotels",
          "title": "List hotels",
          "description": "Lists the curated hotel pool by country, area and stars, with facility tags. No supplier call and no price (a price needs dates and guests). city matches area words (\"Antalya\", \"Business Bay\"); the free-text argument matches name words. Each hotel carries a hotelId. When nothing matches, the reply lists nearby MBD hotels and a contact link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name in Turkish or English.",
                "maxLength": 100,
                "type": "string"
              },
              "country": {
                "description": "Country: name in English or Turkish, or ISO 3166-1 alpha-2 code (example: \"Turkey\", \"AE\").",
