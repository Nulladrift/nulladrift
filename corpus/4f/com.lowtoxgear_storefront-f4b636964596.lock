{
  "lockfileVersion": 2,
  "subjects": {
    "com.lowtoxgear/storefront": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.lowtoxgear.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.lowtoxgear/storefront",
        "title": "Lowtoxgear Storefront",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only MCP for the Lowtoxgear storefront (https://lowtoxgear.com) — Australian low-tox lifestyle brand: certified activewear, clean supplements, GOTS-organic apparel, low-tox home products. For chemical-safety analysis of AU product barcodes use the sister service com.lowtoxgear/scanner at scan.lowtoxgear.com. Checkout must be performed by a human.",
      "tools": [
        {
          "name": "filter_by_certification",
          "description": "Find Lowtoxgear products matching a specific low-tox certification or standard. Searches product tags + product_type for the term. Use for queries like \"show me GOTS-certified products\" or \"PFAS-free options\". Common terms: \"GOTS\", \"OEKO-TEX\", \"PFAS-free\", \"fluorocarbon-free\", \"fragrance-free\", \"organic\", \"responsibly sourced\".",
          "inputSchema": {
            "properties": {
              "certification": {
                "description": "Certification or low-tox standard to match",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "1–50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["certification"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ec316dd91201f949d22c0edb72b5cd0d599cdecd4b3a3af2c4bb4e13b55b57e5"
        },
        {
          "name": "get_policies",
          "description": "Get Lowtoxgear shipping, refund, privacy, terms policy URLs, the bot/agent policy text, AND a pointer to the sister scanner service (com.lowtoxgear/scanner) for chemical-safety analysis of barcoded products.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:679d92fb963c81ef30dc02cb65d082480422fbee65d45f39872218036b6f0a0d"
        },
        {
          "name": "get_product",
          "description": "Get detailed info for a single Lowtoxgear product by URL handle. Returns title, vendor, type, tags, full description HTML, variants with prices/SKU/availability, and images.",
          "inputSchema": {
            "properties": {
              "handle": {
                "description": "Product URL slug, e.g. \"black-hole-duffel-40l\"",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:18004ac6a867965face8e054f37fc3a7faad238513f14f33612f1a6d9a97cd32"
        },
        {
          "name": "list_collections",
          "description": "List all public collections on Lowtoxgear with title, handle, URL, and product count. Examples: \"Certified Activewear\", \"Clean Supplements\", \"GOTS Certified\", \"Low-Tox Home Products\".",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 50,
                "description": "1–100. Default 50.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:51ca2360eb3cd3d7f6127b538ccee0830f5989fb137c6034a7a507654fa6b145"
        },
        {
          "name": "search_products",
          "description": "Search the Lowtoxgear catalogue by keyword. Australian low-tox lifestyle brand spanning certified activewear, clean supplements, GOTS-organic apparel, and low-tox home goods. Returns up to 10 product summaries with title, price (AUD), image, availability, and storefront URL. Natural-language queries work: \"organic cotton tee\", \"PFAS-free duffel\", \"snow bibs\", \"magnesium supplement\".",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "1–10. Default 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text keyword or phrase",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:498a9459acdfcf6b327625e6a6090e0a703e16ce7c3e748a6ce52753258570bf"
        }
      ],
      "digest": "sha256:8c8cfa82dbcf73d0fab81cfefccbeb93a4337ccfb71042e146e8dc7ac2804117"
    }
  }
