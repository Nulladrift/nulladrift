{
  "lockfileVersion": 2,
  "subjects": {
    "com.ratedwithai/accessibility-checker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ratedwithai.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ratedwithai",
        "title": "RatedWithAI accessibility checker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ratedwithai runs a real WCAG 2.1/2.2 accessibility scan (axe-core in a headless browser) against a live public web page and reports the failing rules, how many elements each one affects, and example markup. Use scan_accessibility when the user wants a website or URL checked for accessibility, ADA/WCAG/EAA compliance problems, screen-reader or keyboard barriers, or an accessibility score. Use explain_accessibility_issue when the user asks how to fix a specific axe rule id returned by a scan (for example color-contrast or image-alt). Do not use these tools for questions about accessibility law in general, for pages behind a login, or for local files and HTML snippets — the scanner only loads public http(s) URLs. A scan is automated: it catches roughly a third to a half of WCAG issues and is not a legal compliance certification; say so when presenting results.",
      "tools": [
        {
          "name": "explain_accessibility_issue",
          "title": "Explain how to fix an accessibility rule",
          "description": "Use this when the user asks what an axe-core accessibility rule means or how to fix it — such as color-contrast, image-alt, label or link-name. Returns plain-English steps and a code example. Do not use it when the user wants a site checked; it explains a rule and does not scan pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "rule_id": {
                "description": "axe-core rule id, e.g. color-contrast",
                "type": "string"
              }
            },
            "required": ["rule_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "codeExample": {
                "type": "string"
              },
              "known": {
                "type": "boolean"
              },
              "referenceUrl": {
                "type": "string"
              },
              "ruleId": {
                "type": "string"
              },
              "steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["known", "referenceUrl", "ruleId", "steps", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain how to fix an accessibility rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d80bc6efb23cffdd1cd314a3f7432d6b867ced8fb5a6d9d6dc86d201129f643"
        },
        {
          "name": "scan_accessibility",
          "title": "Scan a website for accessibility issues",
          "description": "Use this when the user wants a public website or web page checked for accessibility (WCAG 2.1/2.2 AA, ADA, EAA, Section 508): it loads the live page in a real browser, runs axe-core on it and up to two more same-site pages, and returns a 0-100 score, a letter grade and the failing rules with example elements. Takes 15-40 seconds. Do not use it for pages that need a login, for localhost or private-network addresses, or for pasted HTML.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public website address, e.g. example.com or https://example.com/about",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "affectedElementCount": {
                "type": "integer"
              },
              "failingRuleCount": {
                "type": "integer"
              },
              "grade": {
                "enum": ["A", "B", "C", "D", "F"],
                "type": "string"
              },
              "moreInfoUrl": {
                "description": "Informational page on scheduled re-scans and fix help for this kind of result.",
                "type": "string"
              },
              "needsReviewCount": {
                "description": "Checks axe could not decide automatically; a human must confirm them.",
                "type": "integer"
              },
              "pagesScanned": {
                "type": "integer"
              },
              "rulesOmitted": {
                "description": "Failing rules not listed because the response is capped.",
                "type": "integer"
              },
              "scannedAt": {
                "type": "string"
              },
              "score": {
                "description": "0-100, weighted by violation severity.",
                "type": "number"
              },
              "url": {
                "description": "The URL that was scanned, after normalisation.",
                "type": "string"
              },
              "violations": {
                "items": {
                  "properties": {
                    "elementCount": {
                      "type": "integer"
                    },
                    "examples": {
                      "items": {
                        "properties": {
                          "html": {
                            "type": "string"
                          },
                          "selector": {
                            "type": "string"
                          }
                        },
                        "required": ["html", "selector"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "impact": {
                      "type": "string"
                    },
                    "ruleId": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "wcag": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["elementCount", "examples", "impact", "ruleId", "summary", "wcag"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["affectedElementCount", "failingRuleCount", "grade", "moreInfoUrl", "needsReviewCount", "pagesScanned", "rulesOmitted", "scannedAt", "score", "url", "violations"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Scan a website for accessibility issues"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f06ffd15a2260b809c731cb811702d389c95a69b84b1b6944fca2ff1612a41a7"
        }
      ],
      "digest": "sha256:1f68f651e7fca77cc62f222f3984f18ae643ebc35de23a4a32156ccab6759207"
    }
  }
}
