{
  "lockfileVersion": 2,
  "subjects": {
    "com.olyport/cdc-svi": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.olyport.com/cdc-svi/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cdc-svi",
        "version": "1.26.0"
      },
      "capabilities": {
        "experimental": {},
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "compare_svi",
          "description": "Compare SVI data across multiple counties.\n\n    Returns side-by-side SVI percentile rankings and key indicators for\n    the specified counties. Useful for comparing vulnerability across\n    service areas or peer counties.\n\n    Args:\n        fips_codes: Comma-separated 5-digit county FIPS codes (e.g. '53033,53053,53061').\n        year: SVI data year (default 2022, currently only 2022 available).\n    ",
          "inputSchema": {
            "properties": {
              "fips_codes": {
                "title": "Fips Codes",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["fips_codes"],
            "title": "compare_sviArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "compare_sviOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:744702d1103c06554863afeb3057432986236d85643793da880bab52d2bc0114"
        },
        {
          "name": "get_county_svi",
          "description": "Get CDC Social Vulnerability Index data for counties in a state.\n\n    Returns overall SVI percentile ranking and all four theme breakdowns\n    (socioeconomic status, household composition/disability, minority\n    status/language, housing type/transportation) plus key indicator\n    estimates for each county.\n\n    SVI values range 0-1 (percentile ranking); higher = more vulnerable.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA').\n        county_fips: Optional 5-digit county FIPS code to get a single county.\n        year: SVI data year (default 2022, currently only 2022 available).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["state"],
            "title": "get_county_sviArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_county_sviOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bfa351682e1985f7dc5b631bc7bd3bfbeef6dcce628517e9579e21a36bbe02b5"
        },
        {
          "name": "get_most_vulnerable",
          "description": "Get the most vulnerable counties in a state ranked by SVI score.\n\n    Returns counties sorted by highest SVI percentile ranking for the\n    specified theme. Useful for identifying priority areas for grants\n    and community health interventions.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA').\n        theme: SVI theme to rank by. Options: 'overall', 'socioeconomic',\n               'household' (composition/disability), 'minority' (status/language),\n               'housing' (type/transportation). Default is 'overall'.\n        limit: Number of counties to return (default 20, max 100).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "theme": {
                "default": "overall",
                "title": "Theme",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_most_vulnerableArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_most_vulnerableOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8a02652742af4e54851e60a3572dbd9860d994ec89365c850452f3a80c08538"
        },
        {
          "name": "get_tract_svi",
          "description": "Get tract-level CDC Social Vulnerability Index data within a county.\n\n    Returns overall SVI and all four theme percentile rankings for each\n    census tract in the specified county. Useful for identifying\n    sub-county areas of high vulnerability.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA').\n        county_fips: 5-digit county FIPS code (e.g. '53033' for King County, WA).\n        year: SVI data year (default 2022, currently only 2022 available).\n        limit: Maximum number of tracts to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": 2022,
                "title": "Year",
                "type": "integer"
              }
            },
            "required": ["county_fips", "state"],
            "title": "get_tract_sviArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_tract_sviOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83ad70398a55e14ac434819954cd94216462bc664d16030ccf6dc6361324885f"
        }
      ],
      "digest": "sha256:1f7551fb5c07afc8576f5a13b94e74e410abb2e070ca91b8da1792b22712fc8d"
    }
  }
}
