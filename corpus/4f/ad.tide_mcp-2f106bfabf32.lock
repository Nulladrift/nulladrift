        {
          "name": "build_transaction",
          "title": "Build a transaction to sign",
          "description": "Build an unsigned Sui transaction for an action and get it back already checked: tide adds the protocol's own calls, picks the sender's gas coins, sets the budget, dry-runs the exact bytes on current mainnet state and runs the pre-sign check. Returns tx_bytes, a plain description, what leaves and enters the wallet, gas and the verdict. If it would fail or the check says danger you get the reason and no bytes. Amounts are whole coins. Actions: stake {amount, validator}; unstake {staked_sui_id, validator, amount}; lst_mint {lst, amount}; lst_redeem {lst, amount}; swap {from, to, amount, slippage_pct}; supply {protocol, asset, amount}; withdraw {protocol, asset, amount}. Lending protocols: suilend, navi, scallop. Swaps use the Aftermath router with slippage_pct (default 0.5) enforced on chain. steps runs several actions in one transaction; a step without amount takes the previous output. tide never signs: sign tx_bytes with your own wallet. Example: { sender: \"0x...\", action: \"supply\", protocol: \"navi\", asset: \"USDC\", amount: 100 }.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "action": {
                "description": "What to do.",
                "enum": ["stake", "unstake", "lst_mint", "lst_redeem", "swap", "supply", "withdraw"],
                "type": "string"
              },
              "amount": {
                "description": "Whole coins, or \"all\" where allowed.",
                "type": ["number", "string"]
              },
              "asset": {
                "description": "supply / withdraw: the coin (USDC, SUI or a coin type).",
                "type": "string"
              },
              "from": {
                "description": "swap: coin to sell.",
                "type": "string"
              },
              "lst": {
                "description": "lst_mint / lst_redeem: afSUI, haSUI, vSUI, sSUI, stSUI.",
                "type": "string"
              },
              "pass": {
                "description": "Agent Pass id: build for the pass's agent within the owner's rules (allowance, venues, caps, price floor), prechecked, with a signed receipt. Actions: swap, supply (NAVI), stake (validator address), transfer (listed recipient name); each step needs an amount.",
                "type": "string"
              },
              "protocol": {
                "description": "supply / withdraw: suilend, navi or scallop.",
                "type": "string"
              },
              "sender": {
                "description": "The wallet that will sign (0x address). Not needed with pass.",
                "type": "string"
              },
              "slippage_pct": {
                "description": "swap: percent, default 0.5.",
                "type": "number"
              },
              "staked_sui_id": {
                "description": "unstake: one StakedSui object id.",
                "type": "string"
              },
              "steps": {
                "description": "Instead of action: [{ action, ...fields }, ...] in one transaction.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "to": {
                "description": "swap: coin to buy.",
                "type": "string"
              },
              "validator": {
                "description": "stake / unstake: validator address or name (stake picks one when left out).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a transaction to sign"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e01f029effc08dd5d44f620818603216ab836e43b1821933bda99501eb66991"
        },
