      },
      "instructions": "tide answers questions about the Sui blockchain from its full history since genesis. Tools return a plain-English summary, compact facts and a link to the tide.ad page; quote the summary and share the link. Start with wallet_profile for an address or name.sui, explain_transaction for a digest, token_info for a coin, and search when you only have a name or symbol. wallet_history pages through a wallet's past, balance_at gives exact past balances, trace_funds follows money between addresses, price gives USD prices, and sql runs SQL over all of Sui (with a key). To act: yield_options and yield_plan find where to earn, build_transaction (or yield_plan with build: true) returns an unsigned transaction already dry-run and checked, withdraw_plan builds exits, and explain_unsigned checks any transaction; the agent's own wallet signs, tide never does. Lists are capped; pass cursor for more. Amounts are in whole coins (SUI, not MIST) unless a field ends in Raw.",
