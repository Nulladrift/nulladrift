{
  "lockfileVersion": 2,
  "subjects": {
    "com.hugedomains/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.hugedomains.com/public/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hugedomains",
        "title": "HugeDomains: premium domain names for sale",
        "version": "1.0.85"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HugeDomains.com sells premium, previously-registered (aftermarket) domain names at fixed buy-it-now prices in USD, with monthly payment plans on most domains. These tools cover the HugeDomains catalog only; they do not check registrar availability for unregistered names. Use search_aftermarket_domains_for_sale when a person wants ideas or options (a keyword, an industry, a brand concept), and get_aftermarket_domain_listing when they name a specific domain and want its price. A domain that is not returned, or a not-found error, means it is not for sale on HugeDomains. To buy, send the person to the purchaseUrl in the result; purchases and payment plans are completed on HugeDomains.com, never through these tools. When a paymentPlan block is present its figures are estimates and final terms are shown at checkout. search and fetch are equivalents of the two tools above for clients that require those names.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a HugeDomains listing",
          "description": "Fetch the full listing for one domain for sale on HugeDomains.com by id (the domain name, as returned by search). Returns the USD price, purchase URL and payment plan estimate as text plus structured metadata. Equivalent to get_aftermarket_domain_listing.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The domain name, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch a HugeDomains listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:31546eebbc20a6a8fd2dd2cae6f6eb7f14cf9cc038183984a47701a440576b97"
        },
        {
          "name": "get_aftermarket_domain_listing",
          "title": "Get the price of a domain for sale on HugeDomains",
          "description": "Get the buy-it-now listing for one specific domain name for sale on HugeDomains.com: USD price, TLD, length, tags, the purchaseUrl where a person buys it, and estimated monthly payment plan terms when offered. Use when the person names an exact domain (e.g. \"how much is example.com?\"). This is an aftermarket listing lookup, not a registrar availability check; a not-found error means HugeDomains does not sell that domain.",
          "inputSchema": {
            "properties": {
              "domainName": {
                "description": "Exact domain name including the TLD, e.g. example.com",
                "type": "string"
              }
            },
            "required": ["domainName"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the price of a domain for sale on HugeDomains"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:5456ecd55ce4a06369196a7241f6bfec96a81f9b005f18bb89ef997ccaeb9166"
        },
        {
          "name": "search",
          "title": "Search HugeDomains listings",
          "description": "Search premium aftermarket domain names for sale on HugeDomains.com by keyword. Returns results with an id (the domain name), a title including the USD price, and the purchase URL. Pass an id to fetch for full details. Equivalent to search_aftermarket_domains_for_sale without filters.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Keyword or phrase describing the domain a person wants, e.g. \"coffee\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search HugeDomains listings"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:355d0740daefbdb91b12b258ddca417cd279a94eab4696ef9621b3606d335a66"
        },
        {
          "name": "search_aftermarket_domains_for_sale",
          "title": "Search premium domains for sale on HugeDomains",
          "description": "Search the HugeDomains.com catalog of premium aftermarket domain names for sale by keyword, with optional TLD, USD price range and name-length filters. Returns a fixed-size page of listings, each with a USD buy-it-now price and a purchaseUrl, plus a `next` cursor for the following page (a limited number of pages per query). Use when a person wants domain ideas or options for a business, product, brand or topic (e.g. \"short .com domains about coffee under $3000\"). An empty list means nothing matched. Results are existing registered domains being resold, not new registrations.",
          "inputSchema": {
            "properties": {
              "maxLength": {
                "default": null,
                "description": "Maximum length of the name without the TLD",
                "type": ["integer", "null"]
              },
              "maxPrice": {
                "default": null,
                "description": "Maximum buy-it-now price in USD",
                "type": ["number", "null"]
              },
              "minLength": {
                "default": null,
                "description": "Minimum length of the name without the TLD",
                "type": ["integer", "null"]
              },
              "minPrice": {
                "default": null,
                "description": "Minimum buy-it-now price in USD",
                "type": ["number", "null"]
              },
              "next": {
                "default": null,
                "description": "Cursor from a previous result to fetch the next page",
                "type": "string"
              },
              "query": {
                "description": "Keyword or phrase to search for, e.g. \"coffee shop\" or \"fintech\"",
                "type": "string"
              },
              "tld": {
                "default": null,
                "description": "TLDs to include, e.g. [\"com\", \"net\"]. Omit for all supported TLDs.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search premium domains for sale on HugeDomains"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "optional"
          },
          "digest": "sha256:59eb092bb6fc9860f785c37aa2c52fe71afa4d238470dfc8a69df16aa24b7423"
        }
      ],
      "digest": "sha256:1f581d8c1e14bad25fdee912d9515b1ae593b734da0432167fb8d842b042bd36"
    }
  }
}
