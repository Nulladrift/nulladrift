        {
          "name": "draft_list",
          "title": "Draft a list with Justy",
          "description": "Turn one sentence about a plan or errand (for example \"Friday dinner for 8\", \"packing for a weekend with kids\", \"ערב שישי ל-8\") into a ready-to-use list written by Justy. No account needed. Returns the items (grouped by aisle for shopping lists) and a justlistapp.com link where the user can keep the list, share it, or open it in the app. Use this when the user wants a list drafted and has not connected a Just List account; with a connected account prefer write_list_with_justy, which saves it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "description": "Language for the list when the sentence alone is ambiguous: he (Hebrew) or en (English). Defaults to the sentence's language.",
                "enum": ["he", "en"],
                "type": "string"
              },
              "sentence": {
                "description": "The user's request in one sentence, in their own words and language",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["sentence"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "alternativeUrl": {
                "description": "Where to make the list without Justy",
                "format": "uri",
                "type": "string"
              },
              "itemCount": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "keepUrl": {
                "description": "Opens the draft on justlistapp.com, where the user can save it to their account or get the app",
                "format": "uri",
                "type": "string"
              },
              "kind": {
                "enum": ["shopping", "todo", "general"],
                "type": "string"
              },
              "language": {
                "enum": ["he", "en"],
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "sections": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "aisle": {
                      "description": "Aisle token (produce, dairy, …) for shopping lists; null otherwise",
                      "type": ["string", "null"]
                    },
                    "items": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "label": {
                      "description": "English aisle label",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["aisle", "items", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["drafted", "capped", "unavailable", "rate_limited"],
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Draft a list with Justy"
