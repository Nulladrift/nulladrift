        {
          "name": "share_link",
          "title": "Get an invite link for a list",
          "description": "Make an invite link for one of the user's own lists. Anyone who opens it can join the list and edit it with them. Only for lists the user created.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
