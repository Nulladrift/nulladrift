      "serverInfo": {
        "name": "just-list",
        "title": "Just List",
        "version": "1.0.0",
        "websiteUrl": "https://justlistapp.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Just List makes shared lists and Events people open from a link, no app needed for guests. view_event: read what is still needed on an Event guest link (no account); claim_item claims an item on it. draft_list: Justy (Just List's list writer) drafts a list from one sentence, no account. With a connected account: write_list_with_justy saves Justy's list; create_list/add_items/get_list/list_my_lists manage lists; create_event makes a guest link people claim items on; share_link invites people to a list. Results are English; reply in the user's language.",
      "tools": [
        {
          "name": "add_items",
          "title": "Add items to a list",
          "description": "Add items to an existing list the user is on (their own or one shared with them). Use list_my_lists first to find the list id, e.g. for \"add milk and eggs to my weekly list\". People sharing the list see the items appear.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "description": "Items to add",
                "items": {
                  "maxLength": 1000,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              },
              "listId": {
                "description": "The list's id (listId from list_my_lists, create_list or write_list_with_justy)",
                "maxLength": 64,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["items", "listId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "added": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "message": {
                "type": "string"
              },
              "notAdded": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "status": {
                "enum": ["added", "partly_added", "item_limit", "not_found"],
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add items to a list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["lists.write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:89367abe1d3643d631f3e853041738c6e87e015abe01848860d2b945a95cb1a1"
        },
        {
          "name": "claim_item",
          "title": "Claim an item on an Event guest link",
          "description": "For a guest: claim something to bring on a Just List Event, using the guest link the host sent and the guest's first name — exactly what the guest page allows. Pass the item's text as shown on the Event. If the item is not found, the reply lists what is still open.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "firstName": {
                "description": "The guest's first name, shown to the host and other guests",
                "maxLength": 50,
                "minLength": 1,
                "type": "string"
              },
              "guestLink": {
                "description": "The Event guest link (…/p/<code>)",
                "maxLength": 300,
                "minLength": 4,
                "type": "string"
              },
              "item": {
                "description": "The item to claim, as written on the Event",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "quantity": {
                "description": "How many of it the guest brings (default 1)",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["firstName", "guestLink", "item"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "event": {
                "type": "string"
              },
              "guestUrl": {
                "format": "uri",
                "type": "string"
              },
              "item": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "remaining": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "status": {
                "enum": ["claimed", "taken", "no_such_item", "not_found", "closed", "rate_limited"],
                "type": "string"
              },
              "stillOpen": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["message", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Claim an item on an Event guest link"
          },
          "behavior": {
            "destructive": false,
