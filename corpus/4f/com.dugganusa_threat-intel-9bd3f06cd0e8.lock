          "digest": "sha256:c048f2317eeb659c6d9c2318d4967c6c7e8ffaaf5f5d075f46de34ecabc00909"
        },
        {
          "name": "stix-feed-summary",
          "title": "Summarize the STIX feed",
          "description": "Shows what is in the feed right now: useful for \"what's active this week\", feed freshness, or planning SIEM / blocklist ingestion.\n\nShape report on the most recent 5,000 indicators in the DugganUSA STIX 2.1 feed, bounded to a 1-7 day window. Returns how many of those fall in the window (capped at 5,000), the top malware families or list labels (list-based feeds such as Spamhaus's Don't Route Or Peer list label by list, not family), top source feeds, a breakdown by indicator type, and top countries when the records carry one.\n\nUseful before pulling the full STIX bundle, to gauge feed depth and freshness, plan a SIEM ingestion budget, or check that a campaign is in the corpus.\n\nDoes not return the full bundle (STIX 2.1 / TAXII 2.1), which is at bundle_url in the response and needs an API key.\n\nPublic read (no auth), cached for 10 minutes. The full bundle needs a free API key.\n\nExample: `{\"days\": 7}` returns the last week's feed shape — useful for capacity planning and spot-checking recent ingest tags.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Lookback window in days (1–7). Default 1.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Summarize the STIX feed"
          },
