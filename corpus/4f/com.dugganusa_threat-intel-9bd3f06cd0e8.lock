          "digest": "sha256:1dfc6d3da3a228e115d502a2b59e1668c23402a4fb9f8cd8976bedaeaa4a5511"
        },
        {
          "name": "check-repo",
          "title": "Check a stranger's repository for run-on-open and install-time lures",
          "description": "Before you open or run a repository someone else sent you (a recruiter's coding test, a downloaded zip, a proof of concept), pass it the few files that matter and get a verdict. It looks for the places a lure hides that a dependency check never reads: npm install hooks that fetch or evaluate code, a VS Code task set to run when the folder opens, agent hooks and MCP servers in .claude, .cursor and .mcp.json, dev container lifecycle commands (initializeCommand runs on your own machine), yarnPath and foreign npm registries, git or URL dependencies, source that decodes and evaluates a payload, and setup.py that fetches or executes. Prompted by the 2026-10-29 Binance theft, where a compromised engineer's laptop is the first account and fake recruitment coding tests are the documented route of the group blamed.\n\nStatic and local: nothing is fetched, run or stored. Pass { \"files\": { \"<path>\": \"<file text>\" } } with at most 40 files and 28000 characters in total (package.json, .vscode/tasks.json, .claude/settings.json, .mcp.json, .devcontainer/devcontainer.json, .yarnrc.yml, .npmrc, setup.py and any suspicious script). For a whole directory use the command line scanner or the DugganUSA Checks GitHub Action. Returns {verdict:\"block\"|\"review\"|\"no-findings\"|\"unknown\", findings:[{rule, severity, verdict, file, line, evidence, message, fix}], coverage, note}. \"no-findings\" means none of the listed patterns were seen in the files you sent; it does NOT mean the repository is safe. \"unknown\" means nothing was analyzed. Read the code on a machine that holds no credentials before you run it.\n\nOne tool call, no auth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "additionalProperties": {
                  "maxLength": 28000,
                  "type": "string"
                },
                "description": "Map of repository-relative path to file text.",
                "maxProperties": 40,
                "minProperties": 1,
                "type": "object"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a stranger's repository for run-on-open and install-time lures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b35c2c45ebaf417bf712b136eaf71db5ce26074a6c3498f9f2c0a20276759665"
        },
        {
          "name": "check-workflow",
          "title": "Check a GitHub Actions workflow for script injection",
          "description": "Checks the text of one GitHub Actions workflow file for script injection: places where text an outside user controls (an issue or pull request title or body, a comment, a branch name, a commit message) is pasted into a shell script or a github-script body, a privileged trigger that checks out a pull request's code, event text re-evaluated through eval, an externally triggerable workflow with open token permissions, and an AI agent action on such a trigger. Built from Radware's 2026-10-29 report of 83 hidden-command attacks on 61 public repositories.\n\nStatic and local: nothing is fetched, run or stored. Pass the workflow's YAML as text (max 28000 characters; use the DugganUSA Checks GitHub Action for whole repositories). Returns {verdict:\"block\"|\"review\"|\"advisory\"|\"no-findings\"|\"unknown\", findings:[{rule, severity, verdict, line, expression, message, fix}], coverage, note}. \"no-findings\" means none of the listed patterns were seen; it does NOT mean the workflow is safe. \"unknown\" means nothing was analyzed.\n\nOne tool call, no auth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "workflow": {
                "description": "The workflow file text (the YAML of a file under .github/workflows).",
                "maxLength": 28000,
