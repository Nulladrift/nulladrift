        {
          "name": "correlate",
          "title": "Correlate an indicator: do we hold it, and what is next to it",
          "description": "Answers two different questions about an IP address or domain, and keeps them apart: do we HOLD it, and what sits NEXT to it.\n\n`held` is an exact yes or no, with `held_in` naming the lane that answered (iocs, the published blocklist lane, or the graph). `neighbors` is group membership in our indicator graph: the same /24 for an IPv4 address, the same registrable domain for a domain, with a real count (or \"200+\" with truncated:true when the scan hit its bound). `neighbor_summary` says what those neighbors are: how many are attributed to which actor or malware family, from how many lanes. A range we carry that covers the address, with no exact record, is reported as `block_coverage`, never as a detection.\n\n`strength` is a single word for a hurried reader: none, adjacent-only, single-lane, multi-lane or corroborated. Read `caveats` before trusting it: a shared hosting platform or cloud range makes neighbors co-tenants, not related infrastructure, and the response says so when it applies.\n\nUse it after `enrich-ioc`, or first, when the question is \"is this part of something\": a scanner next to a known C2, a lookalike domain on a campaign's registrar, a clean address in a dirty /24. Keyed Pro and Enterprise callers also get the neighbor rows themselves (`neighbors.sample`) to pivot on with `enrich-ioc`; free and anonymous callers get the counts and the summary.\n\nNot consulted: our own edge observations (blocks, honeypot hits). Read-only. Hashes and URLs are not graph nodes; use `enrich-ioc` for those.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "indicator": {
                "description": "An IPv4 address or a domain.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "description": "Max neighbor rows returned to Pro and Enterprise callers. Default 10. Counts and the summary do not depend on it.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["indicator"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Correlate an indicator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9aa968d0dd27901f9450e2abd2edf3ea2fa4230bdc251d6e1e2cce168c73372"
        },
        {
          "name": "enrich-ioc",
          "title": "Enrich an indicator",
          "description": "Looks up an IP address, domain, URL or file hash, such as one from a message, log line, SIEM alert or code under review.\n\nLook up a single indicator of compromise (IP, domain, URL, or hash) in the DugganUSA corpus. Returns the threat type, malware family, confidence and references of the record with the strongest attribution (first-party, then curated, then third-party; not necessarily the highest confidence), the attributed actor if any record names one, and a `sources` list with each record's source, actor, confidence, first_seen (the source's own date when the record carries one, such as a vendor report date, otherwise when it entered our corpus) and ingested_at (always when it entered our corpus, which is not when it was first observed) and description (up to 10). `attribution` names the strongest record's class. Read-only. Country is filled in only when the source records one; many feeds publish none.\n\nUseful after `search` finds something, for the full attribution and cross-feed correlation, or directly when triaging a single indicator.\n\nPass the IOC as either `indicator` or `value` (both work). Optional `type` hint: ip / domain / url / hash / auto.\n\nExamples:\n  indicator=\"185.93.3.195\" → ShinyHunters/UNC6040 infrastructure.\n  indicator=\"goldenleafway.lat\" → fresh Apothecary/ClearFake .lat rotation domain.\n  indicator=\"ee28b3137d65d74c0234eea35fa536af\" → Volexity-attributed malware MD5 (BrazenBamboo/DEEPDATA campaign).\n\nReturns `found: false` when the indicator isn't in the corpus. That means we hold no record, not that it is safe.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "indicator": {
                "description": "The indicator to enrich (IP, domain, URL, or hash).",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "description": "Optional type hint. Default auto-detect.",
                "enum": ["ip", "domain", "url", "hash", "email", "auto"],
                "type": "string"
              },
              "value": {
                "description": "Alias of `indicator`. Either field works.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Enrich an indicator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc0470f46cdc2631ab269a22b255bb5c5bcd8748f34e221422ed8d0b8696f348"
        },
        {
          "name": "kev-exploitation-stickiness",
          "title": "KEV exploitation stickiness",
          "description": "Measures whether a product's exploitation risk is chronic or a one-off, for patch prioritization.\n\nDoes in-the-wild exploitation risk STICK to proven products, or SPREAD to new ones? Analyzes CISA KEV: correlates each product's historical known-exploited count against its RECENT KEV additions (Spearman rho), and splits recent additions into repeat-offenders (products with a prior KEV) vs first-time products.\n\nAnswers \"how should I prioritize patching — chase the chronic offenders, or watch for newcomers?\" The result is computed live: it reports rho, the repeat-offender versus first-time split, the share concentrated in the 20 most-exploited products, and an `interpretation` sentence. This is product-level stickiness, a proxy for exploitation dynamics, not proof of exploit timing.\n\nPublic read (no auth). Pass {\"days\": N} for the recent window (30-720, default 180).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Recent-window size in days (30-720). Default 180.",
                "maximum": 720,
                "minimum": 30,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "KEV exploitation stickiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f89314de79ab74ac8aaddd3e451d9deac4520d73e55a7b2692c83d6a312c362"
        },
        {
          "name": "kev-vendor-risk",
          "title": "KEV risk by vendor",
          "description": "Shows where confirmed exploitation concentrates for a vendor or product (Microsoft, Cisco, Fortinet, an appliance, an ERP), for questions like \"what should I patch first\".\n\nVendor / product risk matrix built from CISA's Known Exploited Vulnerabilities (KEV) catalog — where real, confirmed in-the-wild exploitation actually concentrates, not just where CVSS is high.\n\nWith no args: returns the top vendors ranked by KEV count (e.g. Microsoft, Cisco, Adobe, Ivanti, Citrix). With {\"vendor\":\"Adobe\"}: returns that vendor's or product's known-exploited CVEs (e.g. ColdFusion), most recent first, up to 50, each with a ransomware-use flag (Known or Unknown); `kev_count` is the full total and `truncated` says whether the list was cut.\n\nAnswers \"which vendors/products carry the exploitation risk we should patch first,\" to assess third-party / supply-chain exposure, or to check whether a freshly-dropped PoC lands on a chronically-exploited product (a proven-soft target) versus a one-off. KEV means CISA has confirmed active exploitation.\n\nPublic read (no auth). Source is CISA's KEV catalog, synced daily.\n\nExample: {\"vendor\":\"Citrix\"} → NetScaler's known-exploited CVEs; {} → the full top-vendor risk ranking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vendor": {
                "description": "Optional vendor or product name (e.g. \"Adobe\", \"Citrix\", \"SharePoint\", \"ColdFusion\"). Omit for the top-vendor risk ranking.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "KEV risk by vendor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c389a8b5ac922e2e81e952fcf2efb74509a855b973824942a7d964ee999979e9"
        },
        {
          "name": "search",
          "title": "Search threat intelligence",
          "description": "Searches threat-intelligence records about threat actors, malware, campaigns, CVEs, breaches, vendors and indicators. The default search covers security topics only; a few public-document archives can be searched by naming them (listed below). It holds no general programming or web content.\n\nHybrid (keyword + semantic) search across the DugganUSA threat-intelligence corpus (live counts: /api/v1/search/stats). Read-only, prompt-injection sanitized. Returns up to 25 hits, each with index, id, title, snippet, source, timestamp and url (null where the record has none), plus `returned` (hits in this response) and `indexes_unanswered` (any index that timed out). No total match count is given.\n\nSearched by default:\n  • iocs (indicators of compromise: IPs, domains, URLs, hashes, packages, with actor attribution)\n  • adversaries (366 threat-actor profiles)\n  • cisa_kev (CISA's Known Exploited Vulnerabilities catalog, synced daily)\n  • pulses (OTX community pulses)\n  • blog (1,800+ DugganUSA threat-intel research posts)\n\nSearched only when named in `indexes` (public research archives, not threat intel):\n  • epstein_files (public Epstein court and DOJ documents)\n  • the_finders and bishop_accountability (public abuse-accountability archives)\n  • paranormal (fringe-research documents)\n\nExamples:\n  query=\"ClearFake\" → returns the Apothecary/ClearFake records and the related research post.\n  query=\"ShinyHunters\" indexes=\"iocs,adversaries,blog\" → the UNC6040 actor across indicators, its adversary profile and research posts.\n  query=\"CVE-2026-31431\" → the Linux kernel KEV entry plus public proof-of-concept repositories we have collected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "indexes": {
                "description": "Optional comma-separated indexes. Default: iocs,adversaries,cisa_kev,pulses,blog. Archive indexes (epstein_files, the_finders, bishop_accountability, paranormal) are searched only when named.",
                "maxLength": 200,
                "pattern": "^[a-z0-9_,]+$",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, hard max 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search query.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search threat intelligence"
          },
          "behavior": {
