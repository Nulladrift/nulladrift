        {
          "name": "ai-model-price",
          "title": "Look up AI model prices",
          "description": "Looks up what an AI model or an agent session costs at list price. Prices are dated and copied from each provider's own pricing page.\n\nReturns the per-1M-token USD rates for a model (input, output, and for Anthropic models the 5-minute and 1-hour cache-creation, cache read and fast-mode rates), the date the provider page was checked, and the page it came from. Pass token counts to get an exact list-price cost for a call or a whole session.\n\nWith no args: lists every priced model and each provider's checked date. With {\"model\":\"claude-opus-5-5\",\"input_tokens\":2,\"cache_read_tokens\":300000,\"output_tokens\":800}: returns the rates and the cost breakdown. A model not in the table returns UNPRICED — never $0.\n\nPublic read (no auth).",
