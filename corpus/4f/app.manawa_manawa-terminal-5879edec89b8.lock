          "description": "Change an open portfolio order. Use this before cancel_order.\n\n    Attach or replace the investment case with library_item_id. That is the\n    document id. search_library returns it as item_id. list_library_items\n    returns it as id. Pass the id, not the title. An empty library_item_id\n    removes the case. The accept card and the book show it.\n\n    qty, price, expires_kind (day, gtc, or delete_after), expires_at,\n    after_hours, and library_item_id. Send only the fields that change.\n    Rules still apply. HIL on,\n    or an order above Skip HIL up to, opens the accept card again. A day\n    order needs an open session. A good till that lasts past the next open\n    can stay open while the session is closed.\n\n    Args:\n        portfolio_id: The portfolio UUID\n        order_id: The order UUID\n        qty: New share count\n        price: New price, or the new limit\n        expires_kind: day, gtc (90 days), or delete_after\n        expires_at: Required with delete_after. Naive times are New York.\n        after_hours: Extended session for a stock or ETF\n        library_item_id: The investment case. The document id from search_library\n            (item_id) or list_library_items (id). Not the title. An empty string removes the case.\n    ",
