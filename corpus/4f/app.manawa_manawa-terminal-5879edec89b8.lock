          "name": "create_alert",
          "title": "Create alert",
          "description": "Create a price alert, an event alert, a clock, or a trailing alert.\n\n    Calling this stores the alert. A clock may omit the ticker.\n\n    Args:\n        symbol: Stock symbol (e.g. \"AAPL\"). Required for price and event alerts. Optional for a clock.\n        alert_type: \"target_price\", \"movement_pct\", \"event\", \"schedule\", or \"trailing\"\n        direction: For price alerts: \"above\", \"below\", or \"either\". For trailing: \"long\" or \"short\".\n            Long trails the high since arming; short trails the low. Fires when price gives\n            back trail_pct percent or trail_amount from that extreme.\n        threshold: Required for price alerts — price level or percentage move. Not used for trailing.\n        notes: Optional description. Not the agent instruction.\n        event_types: Required when alert_type is \"event\". Live-tape ids such as\n            filing_13f, politician_senate, options_unusual, ipo_upcoming.\n        event_filters: Optional slices. Example: {\"politician_senate\": {\"type\": [\"purchase\"]}}.\n            An omitted field matches every value.\n        name: Optional title. Blank is filled from the rule.\n        agent_instruction: What the agent does when this fires. Empty means notify only.\n        max_fires: How many fires before it leaves Active. Omit to keep a repeating alert firing.\n        schedule_at: ISO time. Required when alert_type is \"schedule\".\n        schedule_tz: IANA zone. UTC when omitted.\n        schedule_repeat: once, daily, weekdays, weekly, or monthly. Default once.\n        skill_id: Strategy id this alert belongs to. Required when rule_ref is set.\n        rule_ref: The section tag of the strategy rule this alert serves; the agent\n            reads that section when the alert fires (STRATEGY_ALERTS=1).\n        off_hours: \"defer\" (wake at next session open) or \"now\" (act while closed).\n            Used when ALERT_OFF_HOURS=1 and the alert has an agent instruction.\n        trail_pct: Trailing give-back percent (0 < x <= 50). Exactly one of trail_pct or trail_amount.\n        trail_amount: Trailing give-back absolute amount (> 0). Exactly one of trail_pct or trail_amount.\n        activate_at: Optional price that must be reached before trailing starts.\n    ",
