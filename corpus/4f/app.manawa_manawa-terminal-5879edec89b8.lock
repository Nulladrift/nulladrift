        {
          "name": "run_deepdive",
          "title": "Run DeepDive analysis",
          "description": "Queue a full DeepDive suite for a stock using a monthly custom-run grant.\n\n    Prepaid search credits cannot pay for this. Free plans have 0 runs;\n    Basic has 10/month; Pro has 50/month. Re-running a ticker already\n    unlocked this month does not consume another grant. The call returns\n    as soon as the job is queued — do not poll.\n\n    Args:\n        ticker: Stock symbol (e.g. \"AAPL\")\n        force: Re-queue every chapter even when a current report exists.\n            Use when on-file content is the wrong instrument (e.g. ZS\n            Thesis written as soybeans).\n    ",
          "inputSchema": {
            "properties": {
              "force": {
                "default": false,
