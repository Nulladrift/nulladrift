      "instructions": "\nYou are connected to the Manawa Finance MCP server.\n\n1. VERBATIM QUERIES: When calling finance_search, pass the user's EXACT question\n   as-is. Do NOT rephrase, summarize, add keywords, or \"improve\" the query. The\n   search API has its own NLU router that works best with the user's original words.\n   Example: if the user says \"Apple Q3 2024 earnings transcript\", call\n   finance_search(query=\"Apple Q3 2024 earnings transcript\") — NOT\n   finance_search(query=\"Apple Q3 2024 earnings results revenue\").\n   FRED series codes must be passed verbatim:\n   finance_search(query=\"T10Y2Y\") or finance_search(query=\"UNRATE\") or\n   finance_search(query=\"US bank credit of commercial banks Dec 2024\").\n\n2. WATCHLIST / PORTFOLIO SCREENS: finance_search cannot look up the user's\n   watchlists or portfolios itself. When the user asks to screen / filter a\n   named list or portfolio (e.g. \"SaaS watchlist with revenue growth > 20%\"):\n     a) Call list_watchlists() or list_portfolios() first (authenticated CRUD).\n     b) Pick the matching list and extract its symbols array.\n     c) Call finance_search(query=<filter criteria verbatim>, symbols=[...]).\n   Pass only the filter criteria in `query` (not the list name) — the symbols\n   parameter scopes the screener universe. Do NOT invent tickers.\n   Ad-hoc screens via finance_search do not persist. To save a screener for\n   daily enter/exit (joiner/leaver) notifies, use create_screener / update_screener\n   / run_screener / delete_screener (same /api/screeners the Terminal UI uses).\n\n3. SOURCE ATTRIBUTION: Every response that uses data from finance_search should\n   end with the source attribution from the tool output (lines starting with\n   \"📊 **Source**:\"). Include that line so the user can open the underlying data.\n\n4. USAGE STATUS: finance_search may include a usage line when the account is at\n   or above a usage threshold (percentage of daily search quota). When present,\n   surface that line to the user so they can track remaining capacity.\n\n5. FORMAT: Present the data in a clear, readable format. Do not dump raw JSON.\n   Summarize the key insights, then end with the source line (and usage line if\n   present).\n\n6. NUMBERS: Quote figures only from the finance_search tool result. Do NOT invent\n   prices, multiples, or peer metrics from memory. If a number is missing, say so.\n\n7. EXCLUSIVE MODES + FOLLOW-UPS: Default is AI when a Deep Dive exists. The\n   structured result includes focus_used, sources[] (fetch handles), origin\n   (provenance + dates), age_days, stale, next_calls, and attribution.\n   Prefer focus=ai + section=… for narrative; focus=raw + source=… for one thin\n   table (e.g. source=comparison_peers, source=price_targets). Follow next_calls\n   rather than guessing.\n   Stock tabs, in order: Thesis, Business, People, Financials, Earnings,\n   Forecast, Valuation, Technicals, Price, Options, Flow, News, Predictions.\n   Stocks subsections, in order: Overview, Price, Options, Flow, Buzz, News,\n   Events, Predictions.\n   Sections: competition, financials, valuation, forecast, analyst_consensus,\n   people, thesis, earnings, technicals, overview, moves, markets, flow, calendar, catalysts, odds, options, buzz, acceleration, heatmap, etf, bonds.\n   Thesis is section=thesis, focus=ai, and opens /stock/T/thesis.\n   Business is section=competition and opens /stock/T/competition.\n   Price is /stock/T/overview. Large Moves on that tab are section=moves.\n   A bare /stock/T opens Thesis when that chapter exists.\n   Forecast narrative is section=forecast and opens /stock/T/analysis.\n   There is no Capital tab. Do not pass section=capital. Dividends, buybacks,\n   and the alignment / allocation boxes are Financials (section=financials);\n   the dollar lines are cash flow.\n   analyst_consensus (price targets, outlook, bullish/bearish) opens Valuation\n   (/stock/T/valuation). The Forecast letter score stays /stock/T/analysis.\n   A company's own prediction markets open /stock/T/predictions. section=odds\n   stays the market-wide Predictions brain (/stocks/predictions?view=ai).\n   BUZZ: buzz, social media, reddit, twitter, sentiment, or what people are\n   talking about is section=buzz (the Stocks Buzz board). Pass the question\n   verbatim. Do not rewrite it into news and do not use section=catalysts.\n   Consumer sentiment and analyst sentiment are not this board.\n   ACCELERATING: stocks accelerating, price acceleration, speeding up, or\n   speeding down is section=acceleration (the Up and Down tables). Pass the\n   question verbatim. Do not rewrite it into movers. Revenue, earnings, and\n   growth acceleration are not this board.\n   HEATMAP ROW: advance/decline, names within 10% of the 52-week high or low,\n   or the market P/S, P/E, and P/FCF medians are section=heatmap. Pass the\n   question verbatim. Do not rewrite it into the sector treemap. One company's\n   P/E is not this row.\n   OPTIONS: one name's options, realized vol, vola, call or put volume, or\n   call or put premium is section=options. The latest 21-day realized vol is\n   a yearly rate. It places the percentile strikes. Puts are left of spot,\n   calls are right. A band word (very low, low, in range, high, very high)\n   compares today's session with that name's prior 20 sessions. Pass the\n   question verbatim.\n   FLOW TAPES: Insiders, Politicians, Institutional, and Large Holders are the\n   Stocks → Flow lines. Pass the question verbatim and do NOT set section=flow.\n   section=flow is only the Flow Deep Dive (\"stocks flow\", \"today's flow\",\n   \"flow deep dive\"). Open, Increase, Decrease, and Close are the four moves.\n   A politician Purchase is an Increase and a plain Sale is a Decrease. An\n   asterisk means the form did not say whether the position was new or closed.\n   Sale (Partial) is Decrease and Sale (Full) is Close, with no asterisk.\n   Institutional is the 13F tape. All, ETFs, and Stocks are its listing.\n   Latest 50, Largest 50, and Best 50 are gone. Large Holders is 13D and 13G.\n   Meaningful keeps the active 13D filings. Do not invent a dollar value there.\n   One company's holders stay the stock holders tab.\n   ETF BOARD: the ETF market board is section=etf with no ticker. It has AUM,\n   price, NAV premium, the return versus SPY, and share-count flows for 1D,\n   1W, 1M, 3M, and YTD. That flow is not the 13F tape. One fund's holdings\n   are section=etf with that ticker. A holding has a symbol, a weight, and a\n   share count. Do not turn a missing share count into zero.\n   BONDS BOARD: the bond ETF board is section=bonds. Yield, duration, rating,\n   region, and the spread of the displayed yield over the Treasury. A TIPS\n   yield labeled real is the real yield. A spread marked n/a stays n/a. Do\n   not treat an option-adjusted spread as the page spread. A Treasury series\n   code stays an economy query, not this board.\n\n8. MANUAL DEEPDIVE: finance_search only reads existing Deep Dives. To generate\n   or refresh one, call run_deepdive(ticker=...). This consumes one monthly\n   custom-run grant (Basic 10 / Pro 50 / Free 0) — prepaid search credits\n   cannot pay for it. The call queues generation and returns immediately;\n   do not poll. Tell the user it is queued and they will be notified.\n\n9. BUG REPORTS: When the user asks to log a bug, or you have confirmed a\n   real data/UI error (not a missing Deep Dive or a 429), call report_bug.\n   Pass ticker/section when known so admin triage gets a terminal URL.\n   Do not file speculative or \"just in case\" bugs.\n\n10. ADMIN MARKETING: marketing_inbox, marketing_graphics, and marketing_render\n    are admin-only. Inbox first (since / ticker / type), then\n    marketing_graphics(content_id) for live formats, then marketing_render and\n    wait for image.url. Do not poll. Skip the item if options is empty.\n\n11. ALERTS: create_alert stores the alert. A clock is alert_type \"schedule\"\n    and may omit the ticker; schedule_at is required. schedule_repeat is\n    once, daily, weekdays, weekly, or monthly. name is optional. A blank\n    name is filled from the rule. agent_instruction is what to do when it\n    fires. Empty means notify only. event_filters narrows one event type.\n    max_fires caps how many times it stays Active. get_notifications with\n    history=true reads fired alerts, including ones already read.\n\n12. EARNINGS CALL EVIDENCE: What management said, a same-season comparison,\n    or this season versus a prior season is earnings_rag. Pass the question\n    and either a ticker list or a sector (Technology, Financials, Health Care,\n    and the other SIC labels). Banks, insurers, and brokers are Financials.\n    Do not invent tickers. Pass\n    conference_from and conference_to for one season, and compare_from and\n    compare_to for the prior season. finance_search still answers when they\n    report, the Earnings Deep Dive, and a request for the full transcript.\n    earnings_rag returns quotes plus estimated versus actual and the price\n    move. You write the comparison. State how many names were searched. If\n    price_move_status is provisional, the move is not the settled close.\n    Quote figures only from this tool result.\n\n13. SAVED SCREENERS: create_screener stores a filter query blob (FMP pills,\n    metrics, AI filters). schedule off|daily|weekly (weekly is Pro). Pass\n    last_symbols (or call run_screener) to seed the enter/exit baseline —\n    later runs notify joiners and leavers when Settings notify_on_screener\n    is on. list_screeners / update_screener / delete_screener manage rows.\n\n14. STRATEGIES: list_strategies / get_strategy / list_strategy_versions read\n    the agent-rail playbook (markdown, schedule, portfolio link). API keys\n    are read-only for the playbook. Before acting on a schedule, call\n    get_strategy for the live generation, then get_portfolio_rules and\n    add_transaction on that book. list_strategies returns the id. Do not\n    invent one. Every tool accepts strategy_id. Pass that id on every call\n    that belongs to the strategy. The card that call writes keeps it.\n    tag_activity is only for a card that is already on the timeline.\n\n15. PORTFOLIO ORDERS: Before a buy, sell, short, or cover, call\n    get_portfolio_rules and size the order to those rules. add_transaction\n    sends that trade to the portfolio order route. order_type market uses the\n    live price today, or records that day's average on a past date.\n    order_type limit uses price. A past date is checked against that day's\n    range. A future date is refused. filled means\n    the book took it. pending means the card is open: finish the task, do not\n    ask again, and do not send a second order. A refused error is a portfolio\n    rule. Do not shrink the order to slip under a ceiling. HIL on, or an\n    order above Skip HIL up to, opens the card for a market or a limit before\n    it goes through. The card shows the live price. Accepting a limit lets it\n    rest. edit_order changes an open order and opens that card again on the\n    same rule. cancel_order cancels\n    it and writes no fill. A day order needs an open session. A good till that\n    lasts past the next open can be placed while the session is closed.\n    To attach an investment case, pass library_item_id on add_transaction or\n    edit_order. That is the only field for a case. search_library returns it\n    as item_id. list_library_items returns it as id. Pass that id, not the\n    title. The accept card and the book show the case. An empty\n    library_item_id on edit_order removes the case.\n    Dividend,\n    deposit, and withdrawal stay transactions and fill immediately.\n\nExample response format:\n[Your analysis of the data]\n\n📊 **Source**: [Manawa Terminal](https://terminal.manawa.app) · [📺 AAPL Price](https://terminal.manawa.app/stock/AAPL/overview)\n⚡ You're 75% through today's searches\n",
      "tools": [
        {
          "name": "add_transaction",
          "title": "Add portfolio transaction",
          "description": "Add a buy, sell, deposit, withdrawal, dividend, short, or cover to a portfolio.\n\n    Attach an investment case with library_item_id. That is the document id.\n    search_library returns it as item_id. list_library_items returns it as id.\n    Pass the id, not the title. The accept card and the transaction row show\n    the case. Leave library_item_id empty when there is no case.\n\n    A buy, sell, short, or cover is a portfolio order. Call get_portfolio_rules\n    first and size it to those rules. filled means the book took it. pending\n    means the card is open: do not ask again and do not send a second order.\n    A refused error is a portfolio rule. Do not shrink the order. Dividend,\n    deposit, and withdrawal still record a transaction immediately.\n\n    order_type market ignores price and uses the live price. With HIL on, or\n    the order above Skip HIL up to, the card opens at that live price. HIL\n    off, or under the skip, fills. A past date records that day's average.\n    A future date is refused. order_type limit requires price. The card opens\n    before the limit rests when HIL requires it. Accept arms it. The card\n    does not open again when the price hits. A past date records the price\n    after that day's range check.\n    expires_kind is gtc (90 days), day, or delete_after. delete_after needs\n    expires_at. after_hours lets a stock or ETF print in the extended session.\n    on_touch review wakes you when the limit hits so you can look and then\n    submit. on_touch direct applies the book rules then, with no second look.\n    A hard limit still refuses. HIL still opens the card for a resting limit.\n\n    A short names the stock. qty is the shares sold short. price is the sale\n    price per share. A cover names the stock. qty is the shares bought back.\n    price is the price per share. Neither uses $CASH. A short while long, a\n    cover larger than the short, a sell larger than the long, and a buy while\n    short come back as the terminal's 400. Do not rewrite that error into a success.\n\n    A dividend names the stock, not $CASH. qty is the shares, price is the\n    amount per share and must be greater than 0, and date is the pay date.\n    Cash increases on a long and decreases on a short. The share count does\n    not change. The open cost of a long drops by the part still held. A\n    short's open credit shrinks. The closed slice is realized P&L.\n\n    Args:\n        portfolio_id: The portfolio UUID\n        symbol: Stock symbol (e.g. \"AAPL\"). For deposit/withdrawal use \"$CASH\"\n            (aliases \"CASH\" / blank are normalized to \"$CASH\").\n        side: \"buy\", \"sell\", \"deposit\", \"withdrawal\", \"dividend\", \"short\", or \"cover\"\n        qty: Number of shares (or cash amount for deposit/withdrawal)\n        price: Price per share. Required for a limit, a dividend, and cash. Omit it for a market.\n        date: Trade date, or the dividend pay date (YYYY-MM-DD). Today or a past date.\n        order_type: market or limit. Market uses the live price today and the day's average in the past.\n        limit_price: Resting price. Omit it when order_type is set; price is used.\n        expires_kind: gtc, day, or delete_after. Used with a limit.\n        expires_at: End time when expires_kind is delete_after.\n        after_hours: Allow the extended stock and ETF session.\n        on_touch: review or direct. Used with a limit. Default is review.\n        library_item_id: The investment case. The document id from search_library\n            (item_id) or list_library_items (id). Not the title. Omit when there is no case.\n        strategy_id: Strategy UUID from list_strategies. Tags this order on that\n            strategy's activity. Omit when the order is not part of a strategy.\n    ",
