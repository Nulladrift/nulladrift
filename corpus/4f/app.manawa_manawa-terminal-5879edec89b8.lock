        {
          "name": "finance_search",
          "title": "Search financial data",
          "description": "Search financial data and return an answer with an inline widget.\n\n    Covers stocks, macro, forex, crypto, commodities, earnings, technicals,\n    and related market questions. Pass the user's question in `query` without\n    rephrasing.\n\n    To screen a named watchlist or portfolio, call list_watchlists or\n    list_portfolios first, then pass the symbols here with filter criteria in\n    `query`.\n\n    Exclusive modes when a Deep Dive exists:\n      focus=ai + section=… → narrative section\n      focus=raw + source=… → thin data slice\n      focus=catalog → list available Deep Dives\n\n    Args:\n        query: The user's financial question\n        symbols: Optional ticker universe to screen (e.g. from list_watchlists)\n        section: Optional Deep Dive section (competition, valuation, thesis,\n            forecast, analyst_consensus, people, financials, earnings,\n            technicals, overview, moves, markets, flow, calendar, catalysts, odds)\n            or raw tapes: options, buzz, acceleration, heatmap, etf, bonds.\n            The ETF board is section=etf with no ticker. One fund's holdings\n            are section=etf plus that ticker. The bond board is section=bonds.\n            A TIPS yield labeled real is the real yield. A spread marked n/a\n            stays n/a. Do not use an option-adjusted spread as the page spread.\n            Thesis is section=thesis and opens /stock/T/thesis.\n            Business is section=competition (/stock/T/competition).\n            Price is /stock/T/overview; Large Moves on that tab are section=moves.\n            Forecast narrative is section=forecast (/stock/T/analysis).\n            Street targets and stance are section=analyst_consensus (/stock/T/valuation).\n            Dividends, buybacks, and the alignment / allocation boxes are\n            section=financials. There is no Capital section.\n            Buzz, social media, reddit, twitter, sentiment, or what people are\n            talking about MUST be section=buzz. Do not send those to news or\n            catalysts. Consumer sentiment and analyst sentiment are not Buzz.\n            Stocks accelerating, price acceleration, speeding up, or speeding\n            down MUST be section=acceleration. Do not send those to movers.\n            Revenue, earnings, and growth acceleration are not this board.\n            Advance/decline, names within 10% of the 52-week high or low, or\n            the market P/S, P/E, and P/FCF medians MUST be section=heatmap.\n            Do not send those to the sector treemap. One company's P/E is not\n            this row.\n            One name's options, realized vol, vola, call or put volume, or\n            call or put premium MUST be section=options. The 21-day realized\n            vol is a yearly rate that places the percentile strikes. A band\n            word compares today's session with the prior 20 sessions.\n            A press release, presentation, 10-Q, or 10-K for one ticker is\n            section=earnings, focus=raw, source=earnings_documents. That is\n            not the Earnings write-up.\n            Stocks Flow lines are Insiders, Politicians, Institutional, and\n            Large Holders. Pass those questions verbatim and do not set\n            section=flow. section=flow is only the Flow Deep Dive. Open,\n            Increase, Decrease, and Close are the four moves. A politician\n            Purchase is an Increase and a plain Sale is a Decrease; an\n            asterisk means the form did not say. Institutional ETFs and\n            Stocks are a listing. Latest, Largest, and Best are gone. Large\n            Holders is 13D and 13G. Do not invent a dollar value there.\n        focus: Optional exclusive mode: ai | raw | auto | catalog\n        source: Optional thin raw slice when focus=raw (comparison_peers,\n            price_targets, consensus, quote, key_financials,\n            earnings_documents, …)\n        strategy_id: Optional strategy UUID from list_strategies. When set,\n            the card this search writes keeps that id.\n    ",
          "inputSchema": {
            "properties": {
              "focus": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Focus"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "section": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Section"
              },
              "source": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Source"
              },
              "strategy_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Strategy Id"
              },
              "symbols": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Symbols"
              }
            },
            "required": ["query"],
            "title": "finance_searchArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search financial data"
          },
