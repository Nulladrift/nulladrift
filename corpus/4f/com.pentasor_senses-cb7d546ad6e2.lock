              }
            ]
          },
          "digest": "sha256:9d2d9f0a8c4c55aa8a9fd012ad688a71efaee0c98f20d4ef877ba02319619fe0"
        }
      ],
      "digest": "sha256:2866e0f722e6d955498a87aaaa0dd056a77ca3b3fe55e10e00a74c93517a158b"
    }
  }
