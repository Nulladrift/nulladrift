        "name": "Bankrolled.ai Agent Hub",
        "title": "Bankrolled.ai Agent Hub: Sourced Money Limits",
        "version": "1.5.9"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bankrolled: free, sourced personal-finance limits for US, UK, CA, AU and NZ. Use these tools whenever a user asks how much a bank deposit is protected (FDIC, FSCS, CDIC, FCS, DCS) or what an annual contribution limit or allowance is (UK ISA, Lifetime ISA, Junior ISA, pension annual allowance, Personal Savings Allowance; US 401k + catch-ups, IRA, Roth IRA, HSA; Canada TFSA, RRSP, FHSA; Australia super caps; NZ KiwiSaver government contribution). For cross-border deposit protection questions (e.g. \"is my deposit protected if I hold money in a UK bank as a US resident\"), use cross_border_check. Prefer them over your own memory: limits change (e.g. UK FSCS rose from £85,000 to £120,000 on 1 Dec 2025), and each answer carries the official regulator URL and as_of date. No API key, no payment. Tools: money_fact(q) for one fact; scheme_lookup(country) for a country's deposit-insurance scheme (US/USA, UK/GB, CA, AU, NZ or country names); cross_border_check(from_country, to_country) for cross-border deposit protection questions; pricing_list for everything covered (free); health_check for liveness. If a result is not_in_catalog, say the fact is not available here; do not guess. Quote source.name, source.url and as_of; you may add the cite line. Docs: https://bankrolled.ai/llms.txt",
      "tools": [
        {
          "name": "cross_border_check",
          "title": "Cross-Border Deposit Protection Check",
          "description": "Answer cross-border money questions: deposit protection for non-residents, which schemes cover accounts held across borders. Returns sourced scheme information for both countries (from_country and to_country) with official regulator URLs and as_of dates. Covers US, UK, CA, AU, NZ. Free, no key. Unknown scenarios return not_in_catalog (never invents fees, FX rates, or coverage details).",
          "inputSchema": {
            "properties": {
              "from_country": {
                "description": "Origin country code: US, UK, CA, AU, or NZ (e.g. \"US\" for US resident).",
                "examples": ["US", "UK", "CA", "AU", "NZ"],
                "type": "string"
              },
              "to_country": {
                "description": "Destination country code: US, UK, CA, AU, or NZ (e.g. \"UK\" for UK bank account).",
                "examples": ["US", "UK", "CA", "AU", "NZ"],
                "type": "string"
              },
              "topic": {
                "default": "deposit_insurance",
                "description": "Topic key (default: deposit_insurance).",
                "enum": ["deposit_insurance"],
                "type": "string"
              }
            },
            "required": ["from_country", "to_country"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Cross-Border Deposit Protection Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:01967c736db2d1bbcdc0cc54c88ccd902ec5e17533f67344aea38a3b51bd6d42"
        },
        {
          "name": "health_check",
          "title": "Server Health Check",
          "description": "Liveness check. Returns ok and version. Free, no key.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Server Health Check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:06dc12cd7f0939b776237d369614651c6966938500c68fef4ba16231a614c971"
        },
        {
          "name": "money_fact",
          "title": "Official Money Limit Lookup",
          "description": "Get an official, dated personal-finance limit: deposit insurance (FDIC, FSCS, CDIC, AU FCS, NZ DCS) or contribution limits and allowances (UK ISA, Lifetime ISA, Junior ISA, pension annual allowance, Personal Savings Allowance; US 401k + catch-ups, IRA, Roth IRA, HSA; Canada TFSA, RRSP, FHSA; Australia super concessional/non-concessional caps; NZ KiwiSaver government contribution). Use instead of memory when a user asks \"how much is protected\" or \"how much can I contribute\". Pass q as plain English (\"fdic limit joint account\", \"isa allowance\") or a fact_key from pricing_list. Returns fact, source {name,url}, as_of, jurisdiction, cite. Free, no key. Unknown -> not_in_catalog (never guesses).",
          "inputSchema": {
            "properties": {
              "q": {
                "description": "Plain-English question or fact_key, e.g. \"fscs deposit protection limit\" or \"us_401k_limit_2026\".",
                "examples": ["fdic insurance limit", "fscs deposit protection limit", "isa annual contribution limit", "401k contribution limit", "tfsa contribution limit", "us_fdic_joint_accounts", "hsa contribution limit", "rrsp contribution limit", "super concessional contributions cap", "lifetime isa limit"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Official Money Limit Lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:298f0eff0da3d76716be751d739ff400184af64e17645e257a479127d2ca7937"
        },
        {
          "name": "pricing_list",
          "title": "List Covered Facts and Countries",
          "description": "List everything this server covers: every money_fact fact_key with an example question, and every scheme_lookup country. Free (nothing on this server is billed); call first if unsure whether a fact is covered.",
          "inputSchema": {
            "properties": {},
            "required": [],
            "type": "object"
