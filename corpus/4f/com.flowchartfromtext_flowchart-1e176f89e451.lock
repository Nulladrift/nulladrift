{
  "lockfileVersion": 2,
  "subjects": {
    "com.flowchartfromtext/flowchart": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://flowchartfromtext.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.flowchartfromtext/flowchart",
        "title": "Flowchart From Text — Deterministic Text-to-Mermaid Flowchart Engine",
        "version": "1.0.0",
        "websiteUrl": "https://flowchartfromtext.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use text_to_mermaid_flowchart to deterministically convert structured text, outlines, or arrow chains into Mermaid flowchart syntax, or validate_mermaid_diagram to lint and analyze Mermaid diagram code.",
      "tools": [
        {
          "name": "text_to_mermaid_flowchart",
          "title": "Convert structured text or outline into a Mermaid flowchart",
          "description": "Deterministically convert a plain-text step list, numbered list, indented outline, or arrow chain (A -> B -> C) with optional Yes/No decision branches into valid Mermaid flowchart syntax, returning node and edge metadata. Pure rule-based engine with no LLM calls.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "direction": {
                "default": "TD",
                "description": "Optional Mermaid flowchart layout direction: TD (top-down), TB, LR (left-to-right), RL, or BT. Defaults to TD.",
                "enum": ["TD", "TB", "LR", "RL", "BT"],
                "type": "string"
              },
              "text": {
                "description": "Plain-text steps, numbered list, indented outline, or arrow chain (e.g. \"Start -> Valid Input? -> Yes: Save -> Done\").",
                "maxLength": 8000,
                "minLength": 1,
                "type": "string"
              },
              "title": {
                "description": "Optional short diagram title used for the suggested export filename and header metadata.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7209b62e468feea9c88ab0c50dd83c89d7171b6b9fe7009d6090541059316f37"
        },
        {
          "name": "validate_mermaid_diagram",
          "title": "Validate and analyze Mermaid diagram syntax",
          "description": "Deterministically lint and analyze Mermaid diagram syntax (flowchart, sequence, ER, Gantt, mindmap, state). Detects diagram category, counts nodes and edges, and reports line-level structural syntax issues.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "source": {
                "description": "Mermaid diagram source code to validate and analyze (e.g. \"flowchart TD\\n  A[Start] --> B[End]\").",
                "maxLength": 12000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:53262f639f13e35c97e9c183a9cde4e25e10c5c51f75cee968497654fafee93a"
        }
      ],
      "digest": "sha256:77fd235d4c292fc1e41b4083843201077c3fa530027c7d56888613b6fb4d350e"
    }
  }
}
