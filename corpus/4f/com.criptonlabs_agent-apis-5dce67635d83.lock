            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amm_spot_price": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Fee-free spot of the pair's pool, quote per base (quote reserve / base reserve), an input of both gaps; null without a usable pool (none, frozen or empty)"
              },
              "amm_to_clob": {
                "additionalProperties": false,
                "description": "Buy base on the AMM pool and sell it into the order book's bids",
                "properties": {
                  "best_bid": {
                    "anyOf": [
                      {
                        "description": "Decimal string",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Price of the best funded bid, quote per base, an input of gap_bps; null when the bid side is empty"
                  },
