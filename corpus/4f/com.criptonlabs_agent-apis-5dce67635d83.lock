                      "enum": ["out", "in", "other"],
                      "type": "string"
                    },
                    "fee_xrp": {
                      "anyOf": [
                        {
                          "description": "Decimal string",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Fee in XRP when the direction is `out`; else null"
