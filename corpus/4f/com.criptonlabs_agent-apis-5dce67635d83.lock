                            "anyOf": [
                              {
                                "description": "Decimal string",
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Total quote for `amount`, in units of `quote`: paid on a buy, received on a sell; null when it cannot fill"
