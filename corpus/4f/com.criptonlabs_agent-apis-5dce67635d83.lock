              "freeze_authority": {
                "description": "Null when the freeze authority is renounced",
                "type": ["string", "null"]
              },
              "meta": {
                "$ref": "#/$defs/MetaSolana"
              },
              "mint": {
                "type": "string"
              },
              "mint_authority": {
                "description": "Null when the mint authority is renounced",
                "type": ["string", "null"]
              },
              "reasons": {
                "description": "Every matched code of every level; empty for SAFE",
                "items": {
                  "enum": ["permanent_delegate", "transfer_hook", "pausable", "default_account_frozen", "mint_authority_set", "freeze_authority_set", "transfer_fee", "mint_close_authority", "unknown_extension"],
