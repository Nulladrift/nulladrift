        {
          "name": "xrpl_account_transactions",
          "title": "Account transactions",
          "description": "One page of an account's most recent validated transactions, newest first. When to use: To check what an account did recently (payments sent or received, offers, trust line changes) and whether each transaction succeeded. Prefer another tool: For balances and trust lines, use `/v1/xrpl/account/{address}/summary` or `/v1/xrpl/account/{address}/lines`; for full archival history, use a full-history node or indexer: history depth depends on the serving node and older pages may be slower. Example: xrpl_account_transactions {\"address\":\"rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Valid classic XRPL account address (r..., checksum verified)",
                "type": "string"
              },
              "limit": {
                "description": "Transactions per page: an integer from 1 to 50 (default 20)",
                "type": "string"
              },
              "marker": {
                "description": "Opaque cursor from the previous page's `marker`, for the same address",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Meta": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of the data at response time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When the data was read from the ledger",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "ledger_index": {
                    "description": "Validated ledger the data comes from",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "ledger_index", "stale"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "type": "string"
