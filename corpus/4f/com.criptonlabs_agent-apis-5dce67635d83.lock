        {
          "name": "solana_payment_verify",
          "title": "Solana payment verify",
          "description": "Did this settled Solana payment deliver the expected amount to the expected recipient? When to use: After a payment has been submitted: to confirm from the chain that the recipient received the mint and amount you expected, including the Token-2022 fee case. Prefer another tool: Before sending a transfer (use `/v1/solana/transfer-readiness`), or to list a wallet's transfers or balances (none are returned). Example: solana_payment_verify {\"signature\":\"B7yABUkY4RudiDfoax94mfqVv2YuNJ4AVsg7LjdFT9Qm8bScsw3PoB2LxpuUqzCkiniKQJ9AKXfSfWaw1kWYFaF\",\"recipient\":\"GEJySUi6LjHwQWKD2BDg3TiGKwhKmBU7JJTjZfk1RD54\",\"mint\":\"SOL\",\"amount\":\"0.02\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Positive decimal amount the payment had to deliver, in UI units (not lamports or raw units); at most 9 decimals for SOL",
                "type": "string"
              },
              "mint": {
                "description": "`SOL` for native SOL, or the mint address of the SPL Token or Token-2022 token the payment had to deliver",
                "type": "string"
              },
              "recipient": {
                "description": "Wallet the payment had to reach (not its token account): Solana wallet address: a base58 string that decodes to exactly 32 bytes",
                "type": "string"
              },
              "reference": {
                "description": "Reference key the payment had to carry among its account keys: Solana wallet address: a base58 string that decodes to exactly 32 bytes; omit to skip the reference check",
                "type": "string"
              },
              "signature": {
                "description": "Transaction signature of the payment to verify: a base58 string that decodes to exactly 64 bytes",
                "type": "string"
              },
              "source": {
                "description": "Wallet the payment had to be signed by: Solana wallet address: a base58 string that decodes to exactly 32 bytes; omit to skip the sender check",
                "type": "string"
              }
            },
            "required": ["amount", "mint", "recipient", "signature"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "MetaSolana": {
                "additionalProperties": false,
