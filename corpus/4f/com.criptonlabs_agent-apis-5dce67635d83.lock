        {
          "name": "xrpl_slippage",
          "title": "Slippage estimate",
          "description": "Slippage and average price for buying an amount of base currency. When to use: Before placing a market-style trade, to size it against available depth and to see whether the CLOB or the AMM pool is the cheaper venue. Prefer another tool: It is an estimate, not a quote, and it does not split an amount across venues or route through other pairs. To read pool reserves, use the amm page. Example: xrpl_slippage {\"base\":\"XRP\",\"quote\":\"USD.rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh\",\"amount\":\"1000\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Positive decimal amount of base to buy",
                "type": "string"
