        },
        {
          "name": "solana_fee_readiness",
          "title": "Solana fee readiness",
          "description": "Can this Solana account pay the fees of N transactions now? When to use: Before sending one or more transactions from a wallet: to learn whether it can pay their base fees without dropping below its rent-exempt minimum. Prefer another tool: To check one SOL or token transfer end to end (use `/v1/solana/transfer-readiness`), or to read a balance (none is returned). Example: solana_fee_readiness {\"address\":\"83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Fee-payer account: Solana wallet address: a base58 string that decodes to exactly 32 bytes",
                "type": "string"
              },
              "signatures": {
                "description": "Signatures per transaction: integer from 1 to 10; default 1",
                "type": "string"
              },
              "transaction_count": {
                "description": "Number of transactions to pay for: integer from 1 to 1000; default 1",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "MetaSolanaNullableSlot": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When we read the data from Solana (our read time)",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "description": "Cache state; a composite answer reports the worst state of its reads, miss above stale",
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "commitment": {
                    "const": "finalized",
                    "description": "Every read is at finalized commitment",
                    "type": "string"
                  },
                  "slot": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Lowest context slot of the finalized reads behind the answer; null when none of them carries one, never 0"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "commitment", "slot", "stale"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "account_kind": {
                "description": "Fee-payer class: none (no account or 0 lamports), system (System wallet), nonce (initialized System nonce account), other (cannot pay fees)",
                "enum": ["none", "system", "nonce", "other"],
                "type": "string"
              },
              "address": {
                "description": "Account queried (echo of the path `address`)",
                "type": "string"
              },
              "meta": {
                "$ref": "#/$defs/MetaSolanaNullableSlot"
              },
              "reasons": {
                "description": "Every blocking code that matched",
                "items": {
                  "enum": ["account_not_found", "not_fee_payer", "insufficient_sol_for_fees"],
                  "type": "string"
                },
                "type": "array"
              },
              "rent_exempt_minimum_sol": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The live rent-exempt minimum the rule compares, in SOL: a network figure, not the holder's (0 bytes for system, 80 bytes for nonce); null for none and other, whose rule compares no minimum"
              },
              "required_fee_sol": {
                "description": "transaction_count × signatures × 5,000 lamports, in SOL (priority fees excluded)",
                "type": "string"
              },
              "signatures": {
                "description": "Signatures per transaction (echo of the query `signatures`; 1 when absent)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "transaction_count": {
                "description": "Transactions paid for (echo of the query `transaction_count`; 1 when absent)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "verdict": {
                "description": "not_ready when any reason matched, else ready; unknown is not served (it needs a check that can fail without failing the request, and today a failed read fails the whole request)",
                "enum": ["ready", "not_ready"],
                "type": "string"
              },
              "warnings": {
                "description": "Every non-blocking warning that matched",
                "items": {
                  "enum": ["nonce_account"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["account_kind", "address", "meta", "reasons", "rent_exempt_minimum_sol", "required_fee_sol", "signatures", "transaction_count", "verdict", "warnings"],
            "type": "object"
          },
