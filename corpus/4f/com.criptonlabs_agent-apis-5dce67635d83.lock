                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Raw input of the depth component: peg's depth_at_peg_50, in units of the body's asset; null for the other components or when the input is missing"
                    },
                    "input_missing": {
                      "description": "True when the component's input is missing, so the component counts its full weight and never reads like a maxed input (a one-sided direct book has no spread and no mid; a book whose close time is unknown is missing); false otherwise, also for amm_gap without a usable pool",
                      "type": "boolean"
                    },
                    "name": {
                      "description": "peg: the peg deviation; spread: the direct book's spread; depth: the funded depth near the peg; amm_gap: the gap of the direct pool's spot to the book's mid",
                      "enum": ["peg", "spread", "depth", "amm_gap"],
                      "type": "string"
