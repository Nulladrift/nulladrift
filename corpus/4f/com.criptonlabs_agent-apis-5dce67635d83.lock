                            "description": "`XRP`, `CODE.issuer` or a 48-hex MPT issuance id",
                            "type": "string"
                          },
                          "currency_ascii": {
                            "description": "Readable text of a 40-hex currency code; null when not printable ASCII; absent for XRP and 3-character codes",
                            "type": ["string", "null"]
                          },
                          "value": {
                            "description": "Decimal string",
                            "type": "string"
                          }
                        },
                        "required": ["asset", "value"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Balance the source must hold for `amount`: XRP adds the larger of the reserve and the fee, a token sent between two holders adds the transfer fee (an MPT rounds up to whole base units); null without `amount` or when unknown"
                  },
                  "source": {
                    "type": "string"
                  },
                  "spendable_xrp": {
                    "anyOf": [
                      {
                        "description": "Decimal string",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
