                        "type": "string"
                      }
                    },
                    "required": ["figures", "window"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The 7-day stored baseline of the book of the metric's direct pair, in the metric's base and quote order; null while every figure warms up, when no stored series tracks the pair, or when the stored series cannot be read or lacks a figure"
              },
              "components": {
                "description": "The four components, in the order peg, spread, depth, amm_gap",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "contribution": {
                      "description": "weight × value_ratio, in score points, the unit of score",
                      "type": "string"
                    },
