        {
          "name": "xrpl_metrics_arbitrage",
          "title": "XRPL arbitrage",
          "description": "Whether a pair's AMM pool and its order book are apart after the AMM fee: per direction the gap, the executable size and the profit after transfer fees. When to use: To find whether a pair's AMM pool and its funded order book are apart after the AMM fee, in which direction, how much base the gap allows and the profit after transfer fees, optionally with the cycles of the USD registry stablecoins via XRP. Prefer another tool: To estimate the cost of a trade of a given size, CLOB against AMM (use `/v1/xrpl/slippage`), or to read the order book levels (use `/v1/xrpl/orderbook`) or an AMM pool (use `/v1/xrpl/amm/{a}/{b}`); the answer measures the ledger and is not an executable quote. Example: xrpl_metrics_arbitrage {\"base\":\"XRP\",\"quote\":\"524C555344000000000000000000000000000000.rMxCKbEDwqr76QuheSUMdEGf4B9xJ8m5De\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "base": {
                "description": "Base currency of the pair: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              },
              "include_triangles": {
                "description": "The string \"true\" adds the cycles of the USD registry coins (RLUSD, USDC) via XRP; \"false\" or omitted leaves them out",
                "enum": ["true", "false"],
                "type": "string"
              },
              "quote": {
                "description": "Quote currency of the pair, different from base: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              }
            },
            "required": ["base", "quote"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Meta": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time, not of the ledger close time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
