              },
              "transactions": {
                "description": "Validated transactions, newest first",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "balance_changes": {
                      "description": "The address's signed net balance changes in this transaction: XRP first, then the other assets sorted by spelling; zero changes omitted",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "asset": {
                            "description": "`XRP`, `CODE.counterparty` for a trust line (code as on the ledger) or a 48-hex MPT issuance id",
