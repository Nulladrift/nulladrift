                    "type": "string"
                  },
                  "cache": {
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "ledger_index": {
                    "description": "Validated ledger the data comes from",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
