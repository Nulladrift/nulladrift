        {
          "name": "xrpl_token",
          "title": "Token issuer",
          "description": "Issuer data for an issued asset: flags, domain, transfer fee and total issued. When to use: Before accepting or sending an issued token: check that the issuer exists, is not frozen, whether holders need authorization, and the transfer fee charged on every transfer between non-issuer accounts. Prefer another tool: For XRP (not an issued asset; 400), for one account's own balances use `/v1/xrpl/account/{address}/lines`, and for prices use `/v1/xrpl/orderbook` or `/v1/xrpl/amm/{a}/{b}`. Example: xrpl_token {\"asset\":\"USD.rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asset": {
                "description": "Issued asset, never XRP. Currency format: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Meta": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time, not of the ledger close time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When we read the data from the ledger (our read time), not the ledger close time",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "description": "Cache state; a composite answer reports the worst state of its reads, miss above stale",
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "ledger_index": {
                    "description": "Ledger the data comes from; ledger_state says whether it is validated or open",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "ledger_state": {
                    "description": "State of the ledger ledger_index names: open for the fee read, which reads the open ledger, else validated; a composite answer is open only when every read is",
                    "enum": ["validated", "open"],
                    "type": "string"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "ledger_index", "ledger_state", "stale"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amm_id": {
                "description": "`AMMID`: set only on that pseudo-account; else null",
                "type": ["string", "null"]
              },
              "asset": {
                "description": "Token queried, in the canonical form the route reads: `CODE.issuer` (echo of the path `asset`); its readable text is `currency_ascii`",
                "type": "string"
              },
              "blackholed": {
                "description": "True when the master key is disabled, there is no signer list and no usable regular key, so the account can never sign again",
                "type": "boolean"
              },
              "currency": {
                "description": "Canonical currency code (3 characters or 40 hex)",
                "type": "string"
              },
              "currency_ascii": {
                "description": "Readable text of a 40-hex currency code; null when not printable ASCII; absent for XRP and 3-character codes",
                "type": ["string", "null"]
              },
              "domain": {
                "description": "Issuer domain decoded to text, when set",
                "type": ["string", "null"]
              },
              "flags": {
                "additionalProperties": false,
                "description": "AccountRoot flags of the account decoded to booleans",
                "properties": {
                  "allow_clawback": {
                    "description": "True when `lsfAllowTrustLineClawback` is set",
                    "type": "boolean"
                  },
                  "allow_trustline_locking": {
                    "description": "lsfAllowTrustLineLocking: the issuer lets holders' trust lines be locked by escrow",
                    "type": "boolean"
                  },
                  "default_ripple": {
                    "description": "True when `lsfDefaultRipple` is set",
                    "type": "boolean"
                  },
                  "deposit_auth": {
                    "description": "True when `lsfDepositAuth` is set",
                    "type": "boolean"
                  },
                  "disable_master": {
                    "description": "lsfDisableMaster: the master key is disabled",
                    "type": "boolean"
                  },
                  "disallow_incoming": {
                    "additionalProperties": false,
                    "description": "Incoming checks, NFToken offers, payment channels and trust lines the account blocks",
                    "properties": {
                      "check": {
                        "description": "True when `lsfDisallowIncomingCheck` is set",
                        "type": "boolean"
                      },
                      "nftoken_offer": {
                        "description": "True when `lsfDisallowIncomingNFTokenOffer` is set",
                        "type": "boolean"
                      },
                      "paychan": {
                        "description": "True when `lsfDisallowIncomingPayChan` is set",
                        "type": "boolean"
                      },
                      "trustline": {
                        "description": "True when `lsfDisallowIncomingTrustline` is set",
                        "type": "boolean"
                      }
                    },
                    "required": ["check", "nftoken_offer", "paychan", "trustline"],
                    "type": "object"
                  },
                  "disallow_xrp": {
                    "description": "True when `lsfDisallowXRP` is set",
                    "type": "boolean"
                  },
                  "global_freeze": {
                    "description": "True when `lsfGlobalFreeze` is set",
                    "type": "boolean"
                  },
                  "no_freeze": {
                    "description": "True when `lsfNoFreeze` is set",
                    "type": "boolean"
                  },
                  "require_auth": {
                    "description": "True when `lsfRequireAuth` is set",
                    "type": "boolean"
                  },
                  "require_dest_tag": {
                    "description": "True when `lsfRequireDestTag` is set",
                    "type": "boolean"
                  }
                },
                "required": ["allow_clawback", "allow_trustline_locking", "default_ripple", "deposit_auth", "disable_master", "disallow_incoming", "disallow_xrp", "global_freeze", "no_freeze", "require_auth", "require_dest_tag"],
                "type": "object"
              },
              "frozen_obligations": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Sum of this currency's `frozen_balances` in `gateway_balances` (frozen lines, outside `obligations`), in units of `currency`; \"0\" when none; null when `obligations_status` is `unavailable`"
              },
              "issuer": {
                "description": "Issuer address",
                "type": "string"
              },
              "loan_broker_id": {
                "description": "`LoanBrokerID`: set only on that pseudo-account; else null",
                "type": ["string", "null"]
              },
              "locked_obligations": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "This currency's `locked` amount in `gateway_balances` (held in escrow), in units of `currency`; \"0\" when none; null when `obligations_status` is `unavailable`"
              },
              "meta": {
                "$ref": "#/$defs/Meta"
              },
              "obligations": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Total issued of this currency, in units of `currency` (its `obligations` entry in `gateway_balances`); \"0\" when none; null when `obligations_status` is `unavailable`"
              },
              "obligations_status": {
                "enum": ["ok", "unavailable"],
                "type": "string"
              },
              "tick_size": {
                "anyOf": [
                  {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The issuer's `TickSize` (3 to 15 significant digits in offer exchange rates), null when unset"
              },
              "transfer_fee_pct": {
                "description": "Issuer transfer fee in percent: (TransferRate - 1000000000) / 10000000, exact; \"0\" when the issuer sets none",
                "type": "string"
              },
              "vault_id": {
                "description": "`VaultID`: set only on that pseudo-account; else null",
                "type": ["string", "null"]
              }
            },
            "required": ["amm_id", "asset", "blackholed", "currency", "domain", "flags", "frozen_obligations", "issuer", "loan_broker_id", "locked_obligations", "meta", "obligations", "obligations_status", "tick_size", "transfer_fee_pct", "vault_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
