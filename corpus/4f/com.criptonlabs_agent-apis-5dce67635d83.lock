                        }
                      ],
                      "description": "Raw input of the peg, spread or amm_gap component in basis points, signed, before the absolute value and the clamp, rounded half-up to 2 decimals: peg's headline deviation_bps, the direct book's spread_bps, or (AMM spot − CLOB mid) / CLOB mid × 10000; null for depth, for amm_gap without a usable pool (the component is 0 by rule), or when the input is missing"
                    },
                    "input_depth": {
                      "anyOf": [
                        {
                          "description": "Decimal string",
