              "meta": {
                "$ref": "#/$defs/Meta"
              },
              "partial_payment": {
                "description": "True when the payment carried `tfPartialPayment`, so less than `Amount` could be delivered; null when there is no transaction",
                "type": ["boolean", "null"]
              },
              "sender": {
                "description": "The sending account of the transaction; null when there is no transaction",
                "type": ["string", "null"]
              },
