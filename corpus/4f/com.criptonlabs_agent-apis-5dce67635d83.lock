                "description": "`eligible` for the owner or when any credential is `valid`; `unknown` when none is valid and any is `unknown`; else `not_eligible`",
                "enum": ["eligible", "not_eligible", "unknown"],
                "type": "string"
              }
            },
            "required": ["checks_failed", "credentials", "domain", "matched_credential", "membership", "meta", "verdict"],
            "type": "object"
          },
