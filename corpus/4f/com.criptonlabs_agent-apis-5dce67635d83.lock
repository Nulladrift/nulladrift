        {
          "name": "xrpl_orderbook",
          "title": "Funded order book",
          "description": "CLOB order book for a currency pair with unfunded offers removed. When to use: To read executable liquidity for a pair on the XRPL central limit order book (CLOB). Prefer another tool: Not for AMM liquidity (use the amm page) and not for a cost estimate (use the slippage page). Example: xrpl_orderbook {\"base\":\"XRP\",\"quote\":\"USD.rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "base": {
                "description": "Base currency: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              },
              "depth": {
                "description": "Levels per side: a positive integer no larger than 9007199254740991, rounded up to 10, 50 or 100; a larger depth is served at 100 (see depth_effective)",
                "type": "string"
              },
              "domain": {
                "description": "Optional PermissionedDomain id (64 hex): reads that domain's permissioned order book; slippage then skips the AMM",
                "type": "string"
              },
              "quote": {
                "description": "Quote currency: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              }
            },
            "required": ["base", "quote"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "BookLevel": {
                "additionalProperties": false,
                "properties": {
                  "expires_at": {
                    "anyOf": [
                      {
                        "format": "date-time",
                        "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}(?:Z))$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "When the offer expires (its Expiration), RFC 3339 with milliseconds; null when it has no expiry"
                  },
                  "gets": {
                    "description": "Funded base quantity of the offer, a decimal string in units of `base` (XRP in XRP, not drops), on both sides",
                    "type": "string"
                  },
                  "owner": {
                    "description": "The account that placed the offer (its maker, the offer's Account)",
                    "type": "string"
                  },
                  "pays": {
                    "description": "Funded quote quantity of the offer, a decimal string in units of `quote` (XRP in XRP, not drops), on both sides",
                    "type": "string"
                  },
                  "price": {
                    "description": "Pays per gets, decimal string",
                    "type": "string"
                  }
                },
                "required": ["expires_at", "gets", "owner", "pays", "price"],
                "type": "object"
              },
              "Meta": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time, not of the ledger close time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When we read the data from the ledger (our read time), not the ledger close time",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "description": "Cache state; a composite answer reports the worst state of its reads, miss above stale",
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "ledger_index": {
                    "description": "Ledger the data comes from; ledger_state says whether it is validated or open",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "ledger_state": {
                    "description": "State of the ledger ledger_index names: open for the fee read, which reads the open ledger, else validated; a composite answer is open only when every read is",
                    "enum": ["validated", "open"],
                    "type": "string"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "ledger_index", "ledger_state", "stale"],
                "type": "object"
              }
            },
