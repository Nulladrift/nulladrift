                      "description": "True only when the ledger reports the delivered amount as `unavailable`",
                      "type": "boolean"
                    },
                    "destination_tag": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
