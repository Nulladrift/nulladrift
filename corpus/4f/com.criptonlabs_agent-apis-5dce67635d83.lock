        {
          "name": "solana_fee_readiness",
          "title": "Solana fee readiness",
          "description": "Can this Solana account pay the fees of N transactions now? When to use: Before sending one or more transactions from a wallet: to learn whether it can pay their base fees without dropping below its rent-exempt minimum. Prefer another tool: To check one SOL or token transfer end to end (use `/v1/solana/transfer-readiness`), or to read a balance (none is returned). Example: solana_fee_readiness {\"address\":\"83astBRguLMdt2h5U1Tpdq5tjFoJ6noeGwaY3mDLVcri\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Fee-payer account: Solana wallet address: a base58 string that decodes to exactly 32 bytes",
                "type": "string"
              },
              "signatures": {
                "description": "Signatures per transaction: integer from 1 to 10; default 1",
                "type": "string"
              },
              "transactions": {
                "description": "Number of transactions to pay for: integer from 1 to 1000; default 1",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "MetaSolana": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of the data at response time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When the data was read from Solana",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "commitment": {
                    "const": "finalized",
                    "description": "Every read is at finalized commitment",
                    "type": "string"
                  },
                  "slot": {
                    "description": "Lowest context slot of the finalized reads behind the answer",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "commitment", "slot", "stale"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "account_kind": {
                "description": "Fee-payer class: none (no account or 0 lamports), system (System wallet), nonce (initialized System nonce account), other (cannot pay fees)",
                "enum": ["none", "system", "nonce", "other"],
                "type": "string"
              },
              "blockers": {
                "description": "Every blocking code that matched",
                "items": {
                  "enum": ["account_not_found", "not_fee_payer", "insufficient_sol_for_fees"],
                  "type": "string"
                },
                "type": "array"
              },
              "meta": {
                "$ref": "#/$defs/MetaSolana"
              },
              "ready": {
                "description": "True when no blocker matched",
                "type": "boolean"
              },
              "required_fee_sol": {
                "description": "transactions × signatures × 5,000 lamports, in SOL (priority fees excluded)",
                "type": "string"
              },
              "warnings": {
                "description": "Every non-blocking warning that matched",
                "items": {
                  "enum": ["nonce_account"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["account_kind", "blockers", "meta", "ready", "required_fee_sol", "warnings"],
            "type": "object"
          },
