                            "description": "MPT only: the exact amount in whole base units; absent for XRP and issued currencies",
                            "type": "string"
                          }
                        },
                        "required": ["asset", "value"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Most the source's balance allows it to send now, rounded down (freezes, limits and authorization are reported as reasons, not deducted); for an MPT sent between two holders, the largest whole amount whose cost, rounded as `required_source_balance` says, fits the balance (without `amount` the amendment state is not read and the cost rounds up); for an MPT issuer, the room left below the maximum amount; null when the source is the issuer of a trust-line token or when unknown"
                  },
                  "reasons": {
                    "description": "Blocking reason codes",
