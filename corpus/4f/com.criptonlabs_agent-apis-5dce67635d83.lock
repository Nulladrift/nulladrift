      "tools": [
        {
          "name": "solana_address_kind",
          "title": "Solana address kind",
          "description": "What kind of Solana account is this address, and should a payment go to it? When to use: Before sending SOL or tokens to an address: to learn whether it is a wallet, a token account (and whose), a mint, a program or another program-owned account. Prefer another tool: To check one transfer end to end with amounts and fees (use `/v1/solana/transfer-readiness`), or to read balances (none are returned). Example: solana_address_kind {\"address\":\"Ffeie177PRngys3SwNH44AYdT9yExm63GAmTXHdmL1k1\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "address": {
                "description": "Address to classify: Solana wallet address: a base58 string that decodes to exactly 32 bytes",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "MetaSolanaNullableSlot": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When we read the data from Solana (our read time)",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "description": "Cache state; a composite answer reports the worst state of its reads, miss above stale",
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "commitment": {
                    "const": "finalized",
                    "description": "Every read is at finalized commitment",
                    "type": "string"
                  },
                  "slot": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Lowest context slot of the finalized reads behind the answer; null when none of them carries one, never 0"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "commitment", "slot", "stale"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Address queried (echo of the path `address`)",
                "type": "string"
              },
              "frozen": {
                "description": "For a token account: true when its state is Frozen, so it refuses transfers; false when Initialized or Uninitialized; null when the token account does not decode, and for every other kind",
                "type": ["boolean", "null"]
              },
              "is_ata": {
                "description": "For a token account: true when the address is the associated token account of its owner and mint; else null",
                "type": ["boolean", "null"]
              },
              "kind": {
                "description": "not_found, wallet, nonce, token_account, mint, token_multisig, program, stake, vote or other",
                "enum": ["not_found", "wallet", "nonce", "token_account", "mint", "token_multisig", "program", "stake", "vote", "other"],
                "type": "string"
              },
              "meta": {
                "$ref": "#/$defs/MetaSolanaNullableSlot"
              },
              "mint": {
                "description": "For a token account: its mint; else null",
                "type": ["string", "null"]
              },
              "on_curve": {
                "description": "For a wallet: false when the address is off the ed25519 curve (a program-derived address); else null",
                "type": ["boolean", "null"]
              },
              "owner_program": {
                "description": "For other: the program that owns the account; else null",
                "type": ["string", "null"]
              },
              "payment_hints": {
                "description": "Every hint that matched",
                "items": {
                  "enum": ["pay_token_owner", "not_a_payment_destination", "program_owned_destination", "pda_wallet"],
                  "type": "string"
                },
                "type": "array"
              },
              "token_owner": {
                "description": "For a token account: the wallet that owns it; else null",
                "type": ["string", "null"]
              },
              "token_program": {
                "description": "For a token account or mint: the SPL Token or Token-2022 program address; else null",
                "type": ["string", "null"]
              }
            },
            "required": ["address", "frozen", "is_ata", "kind", "meta", "mint", "on_curve", "owner_program", "payment_hints", "token_owner", "token_program"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
