                "description": "Base asset queried, in the canonical form the route reads (echo)",
                "type": "string"
              },
              "base_currency_ascii": {
                "description": "Readable text of `base`'s 40-hex currency code; null when not printable ASCII; absent for XRP and 3-character codes",
