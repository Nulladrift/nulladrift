        {
          "name": "xrpl_payment_readiness",
          "title": "Payment readiness",
          "description": "Pre-payment check: can this payment from source to destination succeed now? When to use: Right before sending a payment: to catch a missing or unfunded destination, a required destination tag, deposit authorization, missing or frozen trust lines, MPT authorization and locks, insufficient balance and issuer freezes, in one call. Prefer another tool: To find a multi-hop route or the source amount needed for a cross-currency payment (use the paths endpoint), or to list balances (use `/v1/xrpl/account/{address}/summary`). Example: xrpl_payment_readiness {\"source\":\"rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B\",\"destination\":\"rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Positive decimal amount of asset (whole base units for an MPT); omit to skip amount-dependent checks",
                "type": "string"
              },
              "asset": {
                "description": "Asset to deliver; default XRP. `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code. Or a 48-hex MPT issuance id (hex letters in either case), with `amount` in whole base units.",
                "type": "string"
              },
              "credentials": {
                "description": "Comma-separated Credential entry IDs (1 to 8, 64 hex); checked with deposit_authorized",
                "type": "string"
              },
              "destination": {
                "description": "Receiving account: valid classic XRPL address, different from source",
                "type": "string"
