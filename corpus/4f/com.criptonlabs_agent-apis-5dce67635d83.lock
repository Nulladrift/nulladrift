        {
          "name": "xrpl_domain_eligibility",
          "title": "XRPL domain eligibility",
          "description": "Is this account a member of this XRPL permissioned domain, as its owner or through an accepted, unexpired credential? When to use: Before trading in a permissioned order book (`/v1/xrpl/orderbook` or `/v1/xrpl/slippage` with `domain`): to check whether an account is a member of the domain, as its owner or through an accepted, unexpired credential, and which credential qualifies it. Prefer another tool: To check whether one payment can succeed now (use `/v1/xrpl/payment-readiness`, whose `credentials` takes the `credential_id` values of this answer), or to read the permissioned order book itself (use `/v1/xrpl/orderbook` with `domain`). Example: xrpl_domain_eligibility {\"domain_id\":\"DBABFD44A80DB623522628550B270FA5E2A845341E137530728E2E3699181A4E\",\"account\":\"rcKV6taNcBAi8GxudZnMdFUPcH3Ls5TAv\"}",
