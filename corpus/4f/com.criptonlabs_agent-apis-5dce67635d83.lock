                "$ref": "#/$defs/Meta"
              },
              "minimum_fee_drops": {
                "description": "Lowest cost that enters the queue now, a decimal string in drops (rippled `fee` drops.minimum_fee)",
                "type": "string"
              },
              "open_ledger_fee_drops": {
                "description": "Lowest cost that enters the open ledger now, a decimal string in drops (rippled `fee` drops.open_ledger_fee)",
                "type": "string"
              },
              "queue_full": {
                "description": "True when minimum_fee_drops > base_fee_drops",
                "type": "boolean"
              }
            },
            "required": ["base_fee_drops", "congestion", "current_ledger_size", "current_queue_size", "escalation_multiplier", "expected_ledger_size", "fee", "ledger_fill_ratio", "max_queue_size", "median_fee_drops", "meta", "minimum_fee_drops", "open_ledger_fee_drops", "queue_full"],
            "type": "object"
          },
