                      "type": "string"
                    },
                    "counterparty": {
                      "description": "The other account, when the transaction names one",
                      "type": ["string", "null"]
                    },
                    "delivered": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "asset": {
                              "description": "`XRP`, `CODE.issuer` or a 48-hex MPT issuance id",
                              "type": "string"
                            },
                            "currency_ascii": {
                              "description": "Readable text of a 40-hex currency code; null when not printable ASCII; absent for XRP and 3-character codes",
                              "type": ["string", "null"]
                            },
                            "value": {
                              "description": "Decimal string",
                              "type": "string"
                            }
                          },
                          "required": ["asset", "value"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Delivered amount, when the transaction reports one"
