        {
          "name": "solana_latest_slot",
          "title": "Solana latest slot",
          "description": "Latest finalized Solana slot and its block time. When to use: To check how fresh the finalized view of Solana is, or to anchor a read to a slot. Prefer another tool: Not a tip-of-chain feed: it is finalized, not processed or confirmed, and it is cached for 2 seconds. Example: solana_latest_slot {}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "MetaSolana": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of the data at response time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When the data was read from Solana",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "commitment": {
                    "const": "finalized",
                    "description": "Every read is at finalized commitment",
                    "type": "string"
                  },
                  "slot": {
                    "description": "Context slot of the finalized read",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "commitment", "slot", "stale"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "block_time": {
                "anyOf": [
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Block time of that slot; null when unavailable"
              },
              "meta": {
                "$ref": "#/$defs/MetaSolana"
              },
              "slot": {
                "description": "Latest finalized slot",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["block_time", "meta", "slot"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3ad58633a6c8bfd7dd80851a06d39f71cc41a7c7ec5424bbebb572f2515c0a30"
        },
