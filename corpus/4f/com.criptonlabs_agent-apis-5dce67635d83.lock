        {
          "name": "xrpl_stablecoin",
          "title": "XRPL stablecoin",
          "description": "Is this XRPL issued currency the canonical stablecoin it claims to be? When to use: Before accepting or quoting a stablecoin: to check the asset is the canonical one and that its issuer facts have not changed since the snapshot. Prefer another tool: To read supply or balances (use `/v1/xrpl/token/{asset}` or `/v1/xrpl/account/{address}/lines`), or as a regulatory or licensing check: none is served. Example: xrpl_stablecoin {\"asset\":\"4555524F50000000000000000000000000000000.rMkEuRii9w9uBMQDnWV5AA43gvYZR9JxVK\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asset": {
                "description": "Issued asset, never XRP. Currency format: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Meta": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of the data at response time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When the data was read from the ledger",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "ledger_index": {
                    "description": "Validated ledger the data comes from",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "ledger_index", "stale"],
                "type": "object"
              },
              "StablecoinRegistryEntry": {
                "additionalProperties": false,
                "properties": {
                  "issuer_name": {
                    "description": "Name of the issuer",
                    "type": "string"
                  },
                  "peg": {
                    "description": "Currency the stablecoin is pegged to",
                    "enum": ["USD", "EUR"],
                    "type": "string"
                  },
                  "source_url": {
                    "description": "The issuer's own documentation for this stablecoin",
                    "type": "string"
                  },
                  "symbol": {
                    "description": "Symbol of the canonical stablecoin",
                    "type": "string"
                  }
                },
                "required": ["issuer_name", "peg", "source_url", "symbol"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "canonical": {
                "description": "True when the asset is in the closed registry of canonical stablecoins",
                "type": "boolean"
              },
              "canonical_issuer": {
                "description": "The canonical issuer of that currency code when `impersonation_risk` is true; else null",
                "type": ["string", "null"]
              },
              "impersonation_risk": {
                "description": "True when the currency code is a registry code but the issuer is not its canonical issuer",
                "type": "boolean"
              },
              "meta": {
                "$ref": "#/$defs/Meta"
              },
              "posture": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "allow_clawback": {
                        "description": "The issuer may claw back issued balances",
                        "type": "boolean"
                      },
                      "global_freeze": {
                        "description": "The issuer has frozen every trust line of its currencies",
                        "type": "boolean"
                      },
                      "no_freeze": {
                        "description": "The issuer gave up its freeze powers for good",
                        "type": "boolean"
                      },
                      "require_auth": {
                        "description": "A holder needs the issuer's authorization to hold the token",
                        "type": "boolean"
                      },
                      "transfer_fee_pct": {
                        "description": "Issuer transfer fee as a percentage, a decimal string (`0` when there is none)",
                        "type": "string"
                      }
                    },
                    "required": ["allow_clawback", "global_freeze", "no_freeze", "require_auth", "transfer_fee_pct"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The live issuer or mint facts, read now; null when the asset is not canonical or its account is missing"
              },
              "posture_differences": {
                "description": "Every fact that changed since the snapshot, as `<field>_changed`, or `issuer_not_found` or `mint_not_found` when the canonical account is missing; empty when they match and when the asset is not canonical",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "posture_matches_registry": {
                "description": "True when every live fact equals the recorded snapshot; null when the asset is not canonical",
                "type": ["boolean", "null"]
              },
              "registry_entry": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/StablecoinRegistryEntry"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The registry entry: symbol, peg, issuer name and the issuer's documentation URL; null when the asset is not canonical"
              },
              "snapshot_date": {
                "description": "The date the recorded snapshot was read; null when the asset is not canonical",
                "type": ["string", "null"]
              }
            },
            "required": ["canonical", "canonical_issuer", "impersonation_risk", "meta", "posture", "posture_differences", "posture_matches_registry", "registry_entry", "snapshot_date"],
            "type": "object"
          },
