        {
          "name": "xrpl_paths",
          "title": "Payment paths",
          "description": "Multi-hop payment paths and their source cost. When to use: Before a cross-currency or multi-hop payment: to see whether a route exists and how much the source would spend to deliver the amount. A call can take up to about 20 seconds and paths may be non-optimal. Prefer another tool: To check whether a direct payment can succeed (use `/v1/xrpl/payment-readiness`), or for the single-hop cost of a trade on one pair (use `/v1/xrpl/slippage`, which compares the order book and the AMM). Example: xrpl_paths {\"source\":\"rHb9CJAWyB4rj91VRWn96DkukG4bwdtyTh\",\"destination\":\"rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B\",\"asset\":\"XRP\",\"amount\":\"1\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Positive decimal amount of asset the destination receives",
                "type": "string"
              },
              "asset": {
                "description": "Asset delivered: XRP or CODE.issuer (3-character or 40-hex code, classic issuer)",
                "type": "string"
              },
              "destination": {
                "description": "Receiving account: valid classic XRPL address",
                "type": "string"
              },
              "send_max": {
                "description": "Most the source may spend, in send_max_asset; not with source_assets",
                "type": "string"
              },
              "send_max_asset": {
                "description": "Asset of send_max: XRP or CODE.issuer; give it with send_max",
                "type": "string"
              },
              "source": {
                "description": "Sending account: valid classic XRPL address (r..., checksum verified)",
                "type": "string"
              },
              "source_assets": {
                "description": "Comma-separated assets the source may spend (1 to 4); not with send_max",
                "type": "string"
              }
            },
            "required": ["amount", "asset", "destination", "source"],
            "type": "object"
          },
