            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "decimals": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "extensions": {
                "description": "Token-2022 mint extensions by name; empty for SPL Token",
                "items": {
                  "type": "string"
                },
                "type": "array"
