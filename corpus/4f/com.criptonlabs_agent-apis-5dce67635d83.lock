                            "type": "string"
                          }
                        },
                        "required": ["asset", "value"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Most the source's balance allows it to send now, rounded down (freezes, limits and authorization are reported as reasons, not deducted); for an MPT issuer, the room left below the maximum amount; null when the source is the issuer of a trust-line token or when unknown"
                  },
                  "reasons": {
                    "description": "Blocking reason codes",
                    "items": {
