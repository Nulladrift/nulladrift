        {
          "name": "xrpl_mpt",
          "title": "MPT issuance",
          "description": "MPT issuance: issuer, supply, scale, transfer fee and flags. When to use: Before accepting or sending an MPT: to check its issuer, decimal scale, supply against its maximum, transfer fee, and whether it can be transferred, locked, escrowed or clawed back. Prefer another tool: To check whether one MPT payment between two accounts can succeed now (use `/v1/xrpl/payment-readiness` with the issuance id as `asset`), or for a trust-line token written `CODE.issuer` (use `/v1/xrpl/token/{asset}`). Example: xrpl_mpt {\"mpt_issuance_id\":\"05FA6AB8561E39FA605779B829BB5974E82B40AF173D6AF3\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mpt_issuance_id": {
                "description": "MPT issuance id: 48 hexadecimal characters, either case",
                "type": "string"
              }
            },
            "required": ["mpt_issuance_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Meta": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time, not of the ledger close time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When we read the data from the ledger (our read time), not the ledger close time",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "description": "Cache state; a composite answer reports the worst state of its reads, miss above stale",
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "ledger_index": {
                    "description": "Ledger the data comes from; ledger_state says whether it is validated or open",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "ledger_state": {
                    "description": "State of the ledger ledger_index names: open for the fee read, which reads the open ledger, else validated; a composite answer is open only when every read is",
                    "enum": ["validated", "open"],
                    "type": "string"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "ledger_index", "ledger_state", "stale"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "asset_scale": {
                "description": "Decimal places of the display values: base units / 10^asset_scale",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "auditor_encryption_key_present": {
                "description": "True when the issuance sets AuditorEncryptionKey; the key value is not served",
                "type": "boolean"
              },
              "confidential_outstanding_amount": {
                "description": "Part of outstanding_amount held in confidential balances (ConfidentialOutstandingAmount) in display units of the MPT: confidential_outstanding_amount_atomic / 10^asset_scale, exact",
                "type": "string"
              },
              "confidential_outstanding_amount_atomic": {
                "description": "Part of outstanding_amount_atomic held in confidential balances, in base units (ConfidentialOutstandingAmount; \"0\" when absent); already included in outstanding_amount_atomic, never to be added to it",
                "type": "string"
              },
              "domain_id": {
                "description": "The issuance's DomainID, a PermissionedDomain id; null when the issuance sets none",
                "type": ["string", "null"]
              },
              "flags": {
                "additionalProperties": false,
                "description": "Issuance flags",
                "properties": {
                  "can_clawback": {
                    "description": "The issuer can claw back holdings",
                    "type": "boolean"
                  },
                  "can_escrow": {
                    "description": "Holdings can be placed in escrow",
                    "type": "boolean"
                  },
                  "can_hold_confidential_balance": {
                    "description": "Holders can keep confidential balances (lsfMPTCanHoldConfidentialBalance)",
                    "type": "boolean"
                  },
                  "can_lock": {
                    "description": "The issuer can lock holdings",
                    "type": "boolean"
                  },
                  "can_trade": {
                    "description": "The issuer allows DEX trading",
                    "type": "boolean"
                  },
                  "can_transfer": {
                    "description": "Holders can transfer to each other",
                    "type": "boolean"
                  },
                  "locked": {
                    "description": "Every holding is locked: holders cannot transfer",
                    "type": "boolean"
