        {
          "name": "xrpl_x402_preflight",
          "title": "XRPL x402 preflight",
          "description": "Can this payer settle this x402 payment requirement right now? When to use: After an x402 server answered 402 with an XRPL `exact` requirement: to check, before signing, that this payer can settle that exact requirement to that recipient now. Prefer another tool: For a payment that is not an x402 requirement (use `/v1/xrpl/payment-readiness`), or once the payment has settled (use `/v1/xrpl/payment/verify`). Example: xrpl_x402_preflight {\"asset\":\"XRP\",\"amount\":\"10000000\",\"pay_to\":\"rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq\",\"payer\":\"rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Amount the requirement asks for: a whole number of drops for XRP, a positive decimal in token units for an issued asset",
                "type": "string"
              },
              "asset": {
                "description": "Asset of the x402 requirement: XRP, or the currency code of an issued asset (3 characters, case-sensitive, or 40 hexadecimal characters) whose issuer goes in issuer. Standard codes are case-sensitive: `usd` and `USD` are different tokens.",
                "type": "string"
              },
              "destination_tag": {
                "description": "Destination tag the requirement states (extra.destinationTag): an integer from 0 to 4294967295; it is passed to the readiness check",
                "type": "string"
              },
              "issuer": {
                "description": "Issuer of the asset (extra.issuer of the requirement): a valid classic XRPL address; required unless the asset is XRP",
                "type": "string"
              },
              "pay_to": {
                "description": "Account the requirement pays: valid classic XRPL address",
                "type": "string"
              },
              "payer": {
                "description": "Wallet that would pay: valid classic XRPL address (r..., checksum verified)",
                "type": "string"
              }
            },
            "required": ["amount", "asset", "pay_to", "payer"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "MetaNullableLedger": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time, not of the ledger close time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When we read the data from the ledger (our read time), not the ledger close time",
                    "format": "date-time",
