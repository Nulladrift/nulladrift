        {
          "name": "xrpl_paths",
          "title": "Payment paths",
          "description": "Multi-hop payment paths and their source cost. When to use: Before a cross-currency or multi-hop payment: to see whether a route exists and how much the source would spend to deliver the amount. A call can take up to about 25 seconds and paths may be non-optimal. Prefer another tool: To check whether a direct payment can succeed (use `/v1/xrpl/payment-readiness`), or for the single-hop cost of a trade on one pair (use `/v1/xrpl/slippage`, which compares the order book and the AMM). Example: xrpl_paths {\"source\":\"rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B\",\"destination\":\"rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq\",\"asset\":\"XRP\",\"amount\":\"1\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Positive decimal amount of asset the destination receives",
                "type": "string"
              },
              "asset": {
                "description": "Asset delivered: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              },
              "destination": {
                "description": "Receiving account: valid classic XRPL address",
                "type": "string"
              },
              "send_max": {
                "description": "Most the source may spend, in send_max_asset; not with source_assets",
                "type": "string"
              },
              "send_max_asset": {
                "description": "Asset of send_max; give it with send_max. `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              },
              "source": {
                "description": "Sending account: valid classic XRPL address (r..., checksum verified)",
                "type": "string"
              },
              "source_assets": {
                "description": "Comma-separated assets the source may spend (1 to 4); not with send_max. Each asset: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              }
            },
            "required": ["amount", "asset", "destination", "source"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "MetaNullableLedger": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time, not of the ledger close time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When we read the data from the ledger (our read time), not the ledger close time",
