                          "type": ["string", "null"]
                        },
                        "value": {
                          "anyOf": [
                            {
                              "description": "Decimal string",
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Decimal string in units of `asset`: XRP in XRP, not drops; an issued currency as the ledger holds it; null for an MPT, since this route reads no MPT issuance and so no `AssetScale` (its base units are in `value_atomic`)"
