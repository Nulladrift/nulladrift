        {
          "name": "xrpl_slippage",
          "title": "Slippage estimate",
          "description": "Slippage and average price for buying or selling an amount of base currency. When to use: Before placing a market-style trade, to size it against available depth and to see whether the CLOB or the AMM pool gives the better average price for the side. Prefer another tool: It is an estimate, not a quote, and it does not split an amount across venues or route through other pairs. To read pool reserves, use the amm page. Example: xrpl_slippage {\"base\":\"XRP\",\"quote\":\"USD.rvYAfWj5gh67oV6fW32ZzP3Aw4Eubs59B\",\"amount\":\"1000\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Positive decimal amount of base to buy or sell",
                "type": "string"
              },
              "base": {
                "description": "Base currency: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              },
              "depth": {
                "description": "Levels per side: a positive integer no larger than 9007199254740991, rounded up to 10, 50 or 100; a larger depth is served at 100 (default 100)",
                "type": "string"
              },
              "domain": {
                "description": "Optional PermissionedDomain id (64 hex): reads that domain's permissioned order book; slippage then skips the AMM",
                "type": "string"
              },
              "quote": {
                "description": "Quote currency: `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code.",
                "type": "string"
              },
              "side": {
                "description": "Trade direction: buy walks the asks (pays quote for amount of base), sell walks the bids (sells amount of base for quote)",
                "type": "string"
              }
            },
            "required": ["amount", "base", "quote"],
            "type": "object"
          },
