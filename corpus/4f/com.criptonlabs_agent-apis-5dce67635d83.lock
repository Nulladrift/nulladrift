        {
          "name": "xrpl_payment_verify",
          "title": "XRPL payment verify",
          "description": "Did this settled payment deliver the expected asset and amount to the expected account? When to use: After a payment has been submitted: to confirm from the ledger that it delivered the asset and amount you expected to the account you expected, including the partial-payment case. Prefer another tool: Before sending a payment (use `/v1/xrpl/payment-readiness`), or to list an account's recent payments (use `/v1/xrpl/account/{address}/transactions`). Example: xrpl_payment_verify {\"hash\":\"002C12C53476173ABC1001505C40A24CCC90F642480C924C1B748E339FA1B069\",\"destination\":\"rfaecmugiPaAkFpBT9Bmq8f3n42oXe6m1C\",\"asset\":\"XRP\",\"amount\":\"0.00001\"}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Positive decimal amount of asset the payment had to deliver (at most 6 decimals for XRP, whole base units for an MPT)",
                "type": "string"
              },
              "asset": {
                "description": "Asset the payment had to deliver. `XRP`, or `CODE.issuer`: `CODE` is a 3-character standard code or 40 hexadecimal digits, and `issuer` is a classic XRPL address. Standard codes are case-sensitive: `usd` and `USD` are different tokens, so send the exact code. A standard code uses letters, digits or `?!@#$%^&*<>(){}[]|` and is never `XRP`; percent-encode the symbols in a URL (for example `%3F` for `?`). A 40-hex code is read in any case, and the 40-hex form of a standard code means that code. Or a 48-hex MPT issuance id (hex letters in either case), with `amount` in whole base units.",
                "type": "string"
              },
              "destination": {
                "description": "Account the payment had to reach: valid classic XRPL address (r..., checksum verified)",
                "type": "string"
              },
              "destination_tag": {
                "description": "Destination tag the payment had to carry: an integer from 0 to 4294967295; omit to skip the tag check",
                "type": "string"
              },
              "hash": {
                "description": "Transaction hash of the payment to verify: 64 hexadecimal characters",
                "type": "string"
              },
              "last_ledger_sequence": {
                "description": "The LastLedgerSequence the payer signed: an integer from 1 to 4294967295; pass it for a definitive answer when the transaction is absent",
                "type": "string"
              },
              "source": {
                "description": "Account the payment had to come from; omit to skip the sender check",
                "type": "string"
              }
            },
            "required": ["amount", "asset", "destination", "hash"],
            "type": "object"
          },
