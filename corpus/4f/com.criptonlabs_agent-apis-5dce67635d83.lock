                    },
                    "partial_payment": {
                      "description": "True for a Payment with flag tfPartialPayment (0x00020000)",
                      "type": "boolean"
                    },
                    "result": {
                      "description": "Result code, for example `tesSUCCESS`",
                      "type": "string"
                    },
                    "succeeded": {
                      "description": "True when the result code starts with `tes`",
                      "type": "boolean"
                    },
                    "type": {
                      "description": "Transaction type, for example `Payment`",
                      "type": "string"
                    }
                  },
                  "required": ["balance_changes", "close_time", "counterparty", "delivered", "delivered_unavailable", "destination_tag", "direction", "fee_xrp", "hash", "ledger_index", "partial_payment", "result", "succeeded", "type"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["address", "limit", "marker", "meta", "transactions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
