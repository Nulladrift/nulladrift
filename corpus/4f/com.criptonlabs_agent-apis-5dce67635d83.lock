        {
          "name": "xrpl_metrics_fx_basis",
          "title": "XRPL FX basis",
          "description": "The EUR/USD rate the XRP Ledger DEX implies through the EUR registry stablecoin against each USD registry stablecoin, and its basis to the ECB reference rate. When to use: To measure, from the XRP Ledger's own order books and AMM pools, the EUR/USD rate the DEX implies through the EUR registry stablecoin against each USD registry stablecoin, and how far it sits from the ECB reference rate. Prefer another tool: To measure how far one registry stablecoin trades from its peg against another registry coin (use `/v1/xrpl/metrics/peg`), or to read an order book or an AMM pool (use `/v1/xrpl/orderbook` or `/v1/xrpl/amm/{a}/{b}`). Example: xrpl_metrics_fx_basis {}",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Meta": {
                "additionalProperties": false,
                "properties": {
                  "age_seconds": {
                    "description": "Age of our read at response time, not of the ledger close time",
                    "maximum": 9007199254740991,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "as_of": {
                    "description": "When we read the data from the ledger (our read time), not the ledger close time",
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d\\.\\d{3}(?:Z))$",
                    "type": "string"
                  },
                  "cache": {
                    "description": "Cache state; a composite answer reports the worst state of its reads, miss above stale",
                    "enum": ["hit", "miss", "stale"],
                    "type": "string"
                  },
                  "ledger_index": {
                    "description": "Ledger the data comes from; ledger_state says whether it is validated or open",
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "ledger_state": {
                    "description": "State of the ledger ledger_index names: open for the fee read, which reads the open ledger, else validated; a composite answer is open only when every read is",
                    "enum": ["validated", "open"],
                    "type": "string"
                  },
                  "stale": {
                    "description": "True when served past its fresh TTL (stale-on-error)",
                    "type": "boolean"
                  }
                },
                "required": ["age_seconds", "as_of", "cache", "ledger_index", "ledger_state", "stale"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "legs": {
                "description": "EURØP, the EUR registry coin, priced in each USD registry coin, one leg per coin in registry order (RLUSD, USDC)",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "basis_bps": {
                      "anyOf": [
                        {
                          "description": "Decimal string",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Basis of implied_usd_per_eur against the ECB rate in basis points: (implied_usd_per_eur / reference_rate.usd_per_eur − 1) × 10000 from the unrounded implied rate, rounded half-up to 2 decimals. The ECB rate is a daily reference, usually published at around 16:00 CET on TARGET working days, and implied_usd_per_eur a live ledger price, so the basis also carries the market move since that publication; null without a route or without a stored ECB rate"
                    },
                    "implied_usd_per_eur": {
                      "anyOf": [
                        {
                          "description": "Decimal string",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Median of the observed_price of the leg's routes, USD per EUR; null without a route"
                    },
                    "routes": {
                      "description": "The available routes only, in the order clob_direct, amm_direct, via_xrp",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "deviation_bps": {
                            "anyOf": [
                              {
                                "description": "Decimal string",
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ],
                            "description": "Deviation of observed_price from the ECB rate in basis points, rounded half-up to 2 decimals; null without a stored ECB rate"
                          },
                          "observed_price": {
                            "description": "USD per EUR implied on this route: the price of the EUR coin in the leg's USD coin",
                            "type": "string"
                          },
                          "route": {
                            "description": "clob_direct: mid of the EUR coin's book against the leg's USD coin; amm_direct: fee-free spot of their pool; via_xrp: mid of XRP in the USD coin over mid of XRP in the EUR coin",
                            "enum": ["clob_direct", "amm_direct", "via_xrp"],
                            "type": "string"
                          }
                        },
                        "required": ["deviation_bps", "observed_price", "route"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "usd_asset": {
                      "description": "The USD registry coin of the leg (RLUSD or USDC), as CODE.issuer (40-hex code)",
                      "type": "string"
                    },
                    "usd_asset_currency_ascii": {
                      "description": "Readable text of `usd_asset`'s 40-hex currency code; null when not printable ASCII; absent for XRP and 3-character codes",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["basis_bps", "implied_usd_per_eur", "routes", "usd_asset"],
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "$ref": "#/$defs/Meta"
              },
              "reasons": {
                "description": "no_route when a leg has no route; reference_rate_unavailable without a stored ECB rate; empty otherwise",
                "items": {
                  "enum": ["no_route", "reference_rate_unavailable"],
                  "type": "string"
                },
                "type": "array"
              },
              "reference_rate": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "description": "ECB reference the bases are measured against; null only without a stored ECB rate",
                    "properties": {
                      "age_days": {
                        "description": "Whole UTC days from rate_date to the answer's date",
                        "maximum": 9007199254740991,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "data_source": {
                        "description": "Attribution of the rate: \"Source: ECB statistics\"",
                        "type": "string"
                      },
                      "rate_date": {
                        "description": "Date of the stored ECB rate (YYYY-MM-DD)",
                        "type": "string"
                      },
                      "usd_per_eur": {
                        "description": "Stored ECB reference rate, USD per EUR, unmodified",
                        "type": "string"
                      }
                    },
                    "required": ["age_days", "data_source", "rate_date", "usd_per_eur"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "usd_leg_spread_bps": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Basis of the RLUSD leg minus basis of the USDC leg, in basis points, from the unrounded bases, rounded half-up to 2 decimals; null unless both legs have a basis"
              },
              "warnings": {
                "description": "stale_reference when the stored ECB rate is stale; empty otherwise",
                "items": {
                  "enum": ["stale_reference"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["legs", "meta", "reasons", "reference_rate", "usd_leg_spread_bps", "warnings"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
