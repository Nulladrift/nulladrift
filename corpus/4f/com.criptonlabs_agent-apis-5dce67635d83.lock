                        "description": "Delivered value in EUR, a decimal string",
                        "type": "string"
                      },
                      "value_usd": {
                        "description": "Delivered value in USD, a decimal string",
                        "type": "string"
                      }
                    },
                    "required": ["flag", "fx_rate_date", "note", "source", "value_eur", "value_usd"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "verdict": {
                "description": "The first verdict that matches, in the documented order",
                "enum": ["not_found", "not_found_recent", "beyond_history", "not_final", "not_a_payment", "failed", "wrong_recipient", "wrong_sender", "wrong_destination_tag", "unverifiable", "wrong_asset", "underpaid", "paid"],
                "type": "string"
              }
            },
            "required": ["close_time", "delivered", "excess", "expected", "ledger_index", "meta", "partial_payment", "sender", "valuation", "verdict"],
            "type": "object"
          },
