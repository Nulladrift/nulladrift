              "headroom": {
                "description": "headroom_atomic / 10^asset_scale: the amount the issuer can still issue, against the protocol cap 9223372036854775807 (2^63 - 1) base units without a maximum",
                "type": "string"
              },
              "headroom_atomic": {
                "description": "Base units the issuer can still issue: maximum_amount_atomic - outstanding_amount_atomic (MaximumAmount - OutstandingAmount), exact; without a maximum, the protocol cap 9223372036854775807 (2^63 - 1) - outstanding_amount_atomic",
                "type": "string"
              },
              "immutable_flags": {
                "additionalProperties": false,
                "description": "ImmutableFlags: the issuance settings frozen for good, one boolean per bit; all false when the issuance has no ImmutableFlags (its ledger default 0)",
                "properties": {
                  "can_clawback": {
                    "description": "The can_clawback flag can never change (lsifMPTCanClawback)",
                    "type": "boolean"
                  },
                  "can_escrow": {
                    "description": "The can_escrow flag can never change (lsifMPTCanEscrow)",
                    "type": "boolean"
                  },
                  "can_hold_confidential_balance": {
                    "description": "The can_hold_confidential_balance flag can never change (lsifMPTCanHoldConfidentialBalance)",
                    "type": "boolean"
                  },
                  "can_lock": {
                    "description": "The can_lock flag can never change (lsifMPTCanLock)",
                    "type": "boolean"
                  },
                  "can_trade": {
                    "description": "The can_trade flag can never change (lsifMPTCanTrade)",
                    "type": "boolean"
                  },
                  "can_transfer": {
                    "description": "The can_transfer flag can never change (lsifMPTCanTransfer)",
                    "type": "boolean"
                  },
                  "metadata": {
                    "description": "The issuance's MPTokenMetadata can never change (lsifMPTMetadata)",
                    "type": "boolean"
                  },
                  "require_auth": {
                    "description": "The require_auth flag can never change (lsifMPTRequireAuth)",
                    "type": "boolean"
                  },
                  "transfer_fee": {
                    "description": "The issuance's TransferFee can never change (lsifMPTTransferFee)",
                    "type": "boolean"
                  }
                },
                "required": ["can_clawback", "can_escrow", "can_hold_confidential_balance", "can_lock", "can_trade", "can_transfer", "metadata", "require_auth", "transfer_fee"],
                "type": "object"
              },
              "issuer": {
                "description": "Issuer account of the MPT",
                "type": "string"
              },
              "issuer_encryption_key_present": {
                "description": "True when the issuance sets IssuerEncryptionKey; the key value is not served",
                "type": "boolean"
              },
              "locked_amount": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "locked_amount_atomic / 10^asset_scale; null when locked_amount_atomic is null"
              },
              "locked_amount_atomic": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Base units locked in escrow; null when none"
              },
              "maximum_amount": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Maximum supply (MaximumAmount) in display units of the MPT: maximum_amount_atomic / 10^asset_scale, exact; null when maximum_amount_atomic is null"
              },
              "maximum_amount_atomic": {
                "anyOf": [
                  {
                    "description": "Decimal string",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Maximum supply in base units; null when the issuance sets none (the ledger limit 9223372036854775807 applies)"
              },
              "meta": {
                "$ref": "#/$defs/Meta"
              },
              "metadata_present": {
                "description": "True when the issuer set metadata; the content is not served",
                "type": "boolean"
              },
              "mpt_issuance_id": {
                "description": "The queried MPT issuance id, echoed in the canonical upper-case hex the route reads",
                "type": "string"
              },
              "outstanding_amount": {
                "description": "Supply held by holders (OutstandingAmount) in display units of the MPT: outstanding_amount_atomic / 10^asset_scale, exact",
                "type": "string"
              },
              "outstanding_amount_atomic": {
                "description": "Supply held by holders, in base units, confidential balances included",
                "type": "string"
              },
              "transfer_fee_pct": {
                "description": "Fee the issuer charges on transfers between holders, in percent (TransferFee / 1000)",
                "type": "string"
              },
              "transferable": {
                "description": "True when can_transfer is set and the issuance is not locked",
                "type": "boolean"
              },
              "utilization_ratio": {
