              },
              "membership": {
                "anyOf": [
                  {
                    "enum": ["owner", "credential"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "`owner`, `credential` (through a `valid` credential), or null when the verdict is not `eligible`"
              },
              "meta": {
