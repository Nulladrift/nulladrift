{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kolect.app/creator-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://app.kolect.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kolect",
        "title": "Kolect Creator Search (搜达人)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kolect (搜达人) finds TikTok, Instagram and YouTube creators for influencer marketing, using the user's own Kolect account and credits. Typical flow: search_creators (or lookup_creators for creators the user already has) → check_fake_followers → get_emails → save_creators into a collection. list_saved_creators reads saved lists back. Paid steps spend the user's credits (1 credit = 2 search results; fake-follower checks and email unlocks for looked-up creators have their own prices). Before a step that may cost more than about 50 credits, tell the user the cost and ask. Each result reports credits_used and credits_left. Unsupported requirements are not applied; disclose not_applied to the user. Retired filters require editing the search; do not silently remove them or claim automatic per-person screening. Old results remain readable. Fields under ai_estimate and fake-follower results are estimates; label them as such. Emails are only for this user; never put them anywhere public.",
      "tools": [
        {
          "name": "check_fake_followers",
          "title": "Check fake followers",
          "description": "Estimate how real up to 20 creators' followers are, from public views, engagement, likes and following. Creator ids must come from this user's searches (pass search_id), lookups or saved creators. The first checks each day are free (see get_account), then 5 credits each; creators without enough data cost nothing; results from the last 7 days are reused for free unless fresh=true. This is a rule-based estimate, not platform data; present it that way.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "creator_ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "fresh": {
                "description": "Check again even if checked in the last 7 days.",
                "type": "boolean"
              },
              "search_id": {
                "description": "The search these creators came from, if any.",
                "type": "string"
              }
            },
            "required": ["creator_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b84bc1e3a4832f8a027ad74169ba4ed6eb0033ffcee544c15c85d367cf56176b"
        },
        {
          "name": "get_account",
          "title": "Account and credits",
          "description": "The user's Kolect plan, credit balance, today's free fake-follower checks and email unlocks, lookup limits, this key's daily credit limit, and their collections. Free. Check it before a large paid step.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:099966ea2fdd1ddede1fb9e2f1940aa78472a11f46fd72f4e50a624e051cfd09"
        },
        {
          "name": "get_emails",
          "title": "Get contact emails",
          "description": "Get public contact emails for up to 20 creators. Free for creators from this user's search results (pass search_id; the search already paid for them) and for ones unlocked before. Creators found by lookup_creators need an unlock: free for paid subscribers during the current promotion (daily cap), otherwise 5 credits per email found; no email, no charge. Only show emails to this user; never publish them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "creator_ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "search_id": {
                "description": "The search these creators came from, if any.",
                "type": "string"
              }
            },
            "required": ["creator_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7c4003a08a19d903355408b3d1d65b0abdb3ae53da66441b62a0824211f64e9b"
        },
        {
          "name": "get_search_results",
          "title": "Read earlier search results",
          "description": "Read creators already delivered by one of the user's earlier searches (free). Use next_cursor to page through them. To get new creators beyond those already delivered, use load_more_results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from the previous page.",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "search_id": {
                "description": "search_id from search_creators.",
                "type": "string"
              }
            },
            "required": ["search_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:063b64f60c1784843e2d38b61ac86d02a882633d9dcf679beb559b41c5dd5f4b"
        },
        {
          "name": "list_saved_creators",
          "title": "List saved creators",
          "description": "List the user's saved creators (all, or one collection by name or id) with current follower and view numbers, plus the user's collections. Free. Good for building a shortlist, a report or a spreadsheet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Collection name or id. Omit for all saved creators.",
                "type": "string"
              },
              "limit": {
                "default": 200,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:193ee5fbd1dfa2013039b144b885a1364f4f66855c0859f619dfa4e92d1c44ee"
        },
        {
          "name": "load_more_results",
          "title": "Load more results",
          "description": "Get more new creators for one of the user's earlier searches. Costs 1 credit per 2 new creators returned. Calling again right away with the same arguments returns the same page without charging.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 20,
                "maximum": 50,
                "minimum": 10,
                "type": "integer"
              },
              "search_id": {
                "description": "search_id from search_creators.",
                "type": "string"
              }
            },
            "required": ["search_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:47f75fbfca8958ae560cbf504bef4b8d310620d403eb370ed6c6f30a8ace6165"
        },
        {
          "name": "lookup_creators",
          "title": "Look up creators by link or handle",
          "description": "Check whether specific creators are in Kolect's database, by profile link or @handle, and get their creator ids (needed for check_fake_followers, get_emails and save_creators). Free. Limits per call and per day depend on the user's plan (no subscription: 10 per call, 200 a day; Light: 30 and 500; Plus and above: 100 and 3,000); the daily limit counts only creators found for the first time, and creators past it come back in skipped as over_daily_limit. Bare @handles need platform. Supports TikTok, Instagram and YouTube only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "creators": {
                "description": "Profile URLs (tiktok.com/@x, instagram.com/x, youtube.com/@x) or @handles.",
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "platform": {
                "description": "Platform for bare @handles.",
                "enum": ["tiktok", "instagram", "youtube"],
                "type": "string"
              }
            },
            "required": ["creators"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:8e1fb7d3a77289a1d545148a14f3866e300e46fef0001940c73ced4d2be5d15d"
        },
        {
          "name": "save_creators",
          "title": "Save creators",
          "description": "Save creators to the user's Kolect favorites, optionally into a collection (an existing collection's name or id; a new name creates it). Free. Creator ids must come from this user's searches (pass search_id), lookups or saved creators. Saved creators appear on the Kolect website, where the user can export them as CSV. Pass quotes to record the rate the user actually got from a creator (shown only to this user as 'my quote').",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Collection name or id. Created if it doesn't exist.",
                "maxLength": 40,
                "type": "string"
              },
              "creator_ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "quotes": {
                "description": "Rates the user got from these creators, to record as 'my quote'.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "type": "number"
                    },
                    "creator_id": {
                      "type": "string"
                    },
                    "currency": {
                      "description": "ISO code, default USD",
                      "type": "string"
                    },
                    "note": {
                      "maxLength": 120,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "creator_id"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "search_id": {
                "description": "The search these creators came from, if any.",
                "type": "string"
              }
            },
            "required": ["creator_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:005629bf02c39e42809673dd9c51b2edfdc3cd2068d60c1cd4de29a0fa6de0ea"
        },
        {
          "name": "search_creators",
          "title": "Search creators",
          "description": "Search Kolect's database of TikTok, Instagram and YouTube creators. Give a plain-language brief (any language: market, niche, follower range, content style, audience...), or similar_to (a profile link, @handle or creator id) to find lookalike creators, or both. Costs the user's credits: 1 credit per 2 creators returned (count 20 = 10 credits); no results cost nothing. Calling again with the same arguments within 15 minutes returns the same results without charging. Results include each creator's id: use it with check_fake_followers, get_emails and save_creators, and the search_id with load_more_results and get_search_results. Values under ai_estimate are AI estimates; say so when you present them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "Who to find, in the user's words. Example: 'US beauty creators, 50k-500k followers, skincare reviews, mostly female audience'.",
                "type": "string"
              },
              "count": {
                "default": 20,
                "description": "How many creators to return now (more can be loaded later).",
                "maximum": 50,
                "minimum": 10,
                "type": "integer"
              },
              "platform": {
                "enum": ["tiktok", "instagram", "youtube"],
                "type": "string"
              },
              "similar_to": {
                "description": "Find creators similar to this one: profile URL, @handle (on the given platform), or a creator id from earlier results.",
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:95a44481e6013d5ca2fc9df0735a2d0c57f64d007f775f3b7c1ff8d8f910fea6"
        }
      ],
      "digest": "sha256:954d51c86c643be5f6b5fc5d1f419efa8a4b836735158537321d8bfb9f02bb36"
    }
  }
}
