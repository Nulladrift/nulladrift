{
  "lockfileVersion": 2,
  "subjects": {
    "com.airportia/flight-tracker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.airportia.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "airportia",
        "title": "Airportia Flight Tracker",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only flight data from Airportia.com, a flight tracker covering airports and airlines worldwide: live flight status, airport departure and arrival boards with delays, flights on a route, airline flight status and live aircraft positions. Times are local to each airport. Every result links to the page on Airportia.com.",
      "tools": [
        {
          "name": "airline_flights",
          "title": "Airline flight status",
          "description": "An airline's recent and upcoming departures (up to 15) with status, how many of its aircraft are in the air now (with up to 15 of them: flight number, route, altitude, speed), plus the airline's codes, country and base. Accepts the airline name or its IATA/ICAO code, e.g. \"Aegean\", \"A3\", \"AEE\". Data from Airportia.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airline": {
                "description": "Airline name or IATA/ICAO code.",
                "type": "string"
              }
            },
            "required": ["airline"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Airline flight status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75ad15abee036853db37544019b3ca594ee2793b7b3acfc67239c76d3ee61874"
        },
        {
          "name": "airport_board",
          "title": "Airport departures or arrivals",
          "description": "Departures or arrivals board of an airport around the current time: up to 20 flights with local scheduled time, flight number, airline, destination or origin and status, plus how many of them are delayed, cancelled or diverted. Accepts an IATA or ICAO code, an airport name or a city (the busiest airport of the city). Data from Airportia.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "airport": {
                "description": "IATA/ICAO code, airport name or city, e.g. \"ATH\", \"EGLL\", \"Heathrow\", \"Chicago\".",
                "type": "string"
              },
              "direction": {
                "default": "departures",
                "enum": ["departures", "arrivals"],
                "type": "string"
              }
            },
            "required": ["airport"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Airport departures or arrivals"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d85780b7069077455aafe95672de233b28096c950212373dc7ea72c8a547ffb7"
        },
        {
          "name": "flight_status",
          "title": "Flight status",
          "description": "Live status of a flight by its number (for example \"A3 600\", \"BA117\", \"UAL 920\"): status, scheduled and actual or estimated departure and arrival times in local time, terminal, gate and baggage belt when known, code-shares, and the live aircraft position (altitude, speed, aircraft type) while it is in the air. Data from Airportia.com, updated about every 10 minutes. A number that flies several routes returns up to 3 of them, today's first. Optional date (YYYY-MM-DD, local departure day) looks up the last 7 days or tomorrow.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Optional day, YYYY-MM-DD. Default: today / the flight in progress.",
                "type": "string"
              },
              "flight_number": {
                "description": "Airline code and number, IATA or ICAO style, e.g. \"A3 600\", \"LH400\", \"DAL15\".",
                "type": "string"
              }
            },
            "required": ["flight_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Flight status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://widget/airportia-flight-v1.html",
            "openai/toolInvocation/invoked": "Flight status ready",
            "openai/toolInvocation/invoking": "Checking the flight…",
            "openai/widgetAccessible": false,
            "ui": {
              "resourceUri": "ui://widget/airportia-flight-v1.html"
            }
          },
          "digest": "sha256:d54f98355407316dc353cf5b8e76d3ecbaf8ead6f35c8e9fe538784d4a22e0e1"
        },
        {
          "name": "route_flights",
          "title": "Flights between two airports",
          "description": "Flights between two airports: the next scheduled departures (up to 10, the next 30 days) and the most recent ones with their status. Accepts IATA/ICAO codes, airport names or cities; a city with several airports resolves to its main one (the answer names it), so other airports of that city need their own call with their codes, e.g. \"LGW\" or \"STN\" for London. Data from Airportia.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Departure airport or city, e.g. \"ATH\", \"Athens\".",
                "type": "string"
              },
              "to": {
                "description": "Arrival airport or city, e.g. \"LHR\", \"London Heathrow\".",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Flights between two airports"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b30377e68cf1380d67cc72b14aac6367bb7688d5a8101133b1923b472ba4f7ad"
        },
        {
          "name": "search",
          "title": "Search airports, airlines and flights",
          "description": "Finds airports (by code, name or city), airlines (by name or code) and flight numbers on Airportia.com. Returns codes and links; the codes are what the other tools accept.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "e.g. \"Heathrow\", \"Ryanair\", \"LGW\", \"A3 6\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search airports, airlines and flights"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dee4361874a12a9ddcf784d9a868e782074d824a425e15dc2760846171e279fe"
        }
      ],
      "resources": [
        {
          "uri": "ui://widget/airportia-flight-v1.html",
          "name": "airportia-flight",
          "title": "Airportia flight card",
          "description": "Flight status card with the route map and the live aircraft position.",
          "mimeType": "text/html;profile=mcp-app",
          "meta": {
            "openai/widgetCSP": {
