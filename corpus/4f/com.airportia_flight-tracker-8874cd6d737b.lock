            },
            "openai/widgetDescription": "Shows the flight number, airline, status, departure and arrival times, terminal and gate, and a route map with the aircraft position while it is in the air. The same facts are in the text of the result.",
            "openai/widgetDomain": "https://www.airportia.com",
            "openai/widgetPrefersBorder": false,
            "ui": {
              "csp": {
                "connectDomains": [],
                "resourceDomains": ["https://www.airportia.com"]
              },
              "prefersBorder": false
            }
          },
          "digest": "sha256:49b5082cd190cdf0c59184a652ef84b3ad56ed1542df50521cc04d090ace09cb"
        }
      ],
      "digest": "sha256:9a8b1dd6d4ae6782e7a51eddcc3c7c7909ad6bfaa5c7d7dda66b8992b877049d"
    }
  }
