{
  "lockfileVersion": 2,
  "subjects": {
    "com.solvecha/solvecha": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.solvecha.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "solvecha",
        "title": "Solvecha CAPTCHA solver",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Solvecha solves captcha images for AI agents. Pick the tool for the captcha type:\n- solve_recaptcha_grid: Google reCAPTCHA v2 image challenge (3x3, 4x4, or 1x1 tiles). Returns the tile numbers to click.\n- solve_text_captcha: a picture of distorted text. Returns the text.\n- solve_geetest_slider: a GeeTest slider puzzle. Returns the offset in percent of the background width.\n- solve_funcaptcha: FunCAPTCHA (Arkose Labs) tile or match puzzle.\nSend pictures as base64 or as https URLs. Each successful solve costs one credit; failed solves cost nothing.\nAfter you submit a reCAPTCHA answer, call report_result with Google's verdict. It is free and improves accuracy.\nget_account_status shows the remaining credit.",
      "tools": [
        {
          "name": "get_account_status",
          "title": "Show credit and plan",
          "description": "Shows the plan, the solves left today, the balance and the time until the daily reset. Free to call.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "balance_usd": {
                "type": "string"
              },
              "daily_quota": {
                "type": "integer"
              },
              "plan": {
                "description": "Plan name: a monthly plan, 'Free', 'Pay per use' or 'No plan'.",
                "type": "string"
              },
              "seconds_until_daily_reset": {
                "description": "The daily quota resets at 00:00 UTC.",
                "type": "integer"
              },
              "solves_left_today": {
                "description": "How many more successful solves can be paid today (daily quota left plus balance).",
                "type": "integer"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["balance_usd", "daily_quota", "plan", "seconds_until_daily_reset", "solves_left_today", "status"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:997b5e40eddee320148a81079870f7f505a09d7a566f3627924dc736488f2b5e"
        },
        {
          "name": "report_result",
          "title": "Report whether the site accepted the answer",
          "description": "Tells Solvecha whether a reCAPTCHA answer was accepted or rejected. Free, optional, and it improves accuracy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "grid": {
                "description": "The grid you sent: '3x3', '4x4' or '1x1'.",
                "type": "string"
              },
              "job_id": {
                "description": "The job_id returned by solve_recaptcha_grid.",
                "type": "string"
              },
              "round_index": {
                "description": "Optional: which challenge round this was, starting at 0.",
                "type": ["null", "integer"]
              },
              "verdict": {
                "description": "'accepted' if the site accepted the answer (the challenge was passed or the next step appeared), 'rejected' if it did not.",
                "type": "string"
              }
            },
            "required": ["grid", "job_id", "verdict"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "recorded": {
                "type": "boolean"
              }
            },
            "required": ["message", "recorded"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fe28fdb26581d9ed884d6b379e1f8dc108d7402967ac8a78c653cf8aabac842"
        },
        {
          "name": "solve_funcaptcha",
          "title": "Solve a FunCAPTCHA (Arkose Labs) puzzle",
          "description": "Solves a FunCAPTCHA tile-selection puzzle (mode 'tile') or a game-style match puzzle (mode 'match') and returns which tiles to pick. Costs one credit per successful solve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image": {
                "description": "One picture: the grid of tiles (mode tile) or the whole game image (mode match). Base64 or https URL.",
                "type": "string"
              },
              "mode": {
                "description": "'tile' picks tiles in a 3x2 grid (default). 'match' solves game puzzles where a picture must match a reference.",
                "type": "string"
              },
              "task": {
                "description": "The instruction text, for example 'Pick the sheep' or 'Match the number of rocks with the number on the left'.",
                "type": "string"
              },
              "timeout_seconds": {
                "description": "How long to wait for the answer, 5 to 90. Default 45.",
                "type": "integer"
              }
            },
            "required": ["image", "task"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "items": {
                  "type": "boolean"
                },
                "type": ["null", "array"]
              },
              "job_id": {
                "type": "string"
              },
              "mode": {
                "type": "string"
              },
              "selected_tiles": {
                "description": "Tiles to pick, counted from 1 (left to right, top to bottom for tile mode; in the order of the answer options for match mode).",
                "items": {
                  "type": "integer"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["answer", "job_id", "mode", "selected_tiles"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:174bc17e6eddf341e00b07c3a738d55d4ad88a515ec1185e8880ec962bf4349e"
        },
        {
          "name": "solve_geetest_slider",
          "title": "Solve a GeeTest slider",
          "description": "Solves a GeeTest slider puzzle and returns how far to drag the handle, as a percentage of the background width. Costs one credit per successful solve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "images": {
                "description": "Either one screenshot of the whole challenge, or two pictures in this order: the background, then the transparent puzzle piece. Each is base64 or an https URL.",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "task": {
                "description": "The instruction text of the challenge. Default 'slide'.",
                "type": "string"
              },
              "timeout_seconds": {
                "description": "How long to wait for the answer, 5 to 90. Default 45.",
                "type": "integer"
              }
            },
            "required": ["images"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "how_to_use": {
                "type": "string"
              },
              "job_id": {
                "type": "string"
              },
              "offset_percent": {
                "description": "How far to drag the slider handle, as a percentage of the width of the background picture as shown on the page.",
                "type": "number"
              }
            },
            "required": ["how_to_use", "job_id", "offset_percent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e17b5f64436e23ef5b404e953f32e2d26296fffe60ec085160e42019fe5c917"
        },
        {
          "name": "solve_recaptcha_grid",
          "title": "Solve a reCAPTCHA v2 image challenge",
          "description": "Solves a Google reCAPTCHA v2 image challenge from a screenshot and returns which tiles to click. Send the instruction text (task), the layout (grid) and the picture(s). Waits for the answer (usually 2 to 6 seconds). Costs one credit per successful solve. After you click and submit, call report_result with Google's verdict.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "grid": {
                "description": "Challenge layout: '3x3' or '4x4' (one picture of the whole grid) or '1x1' (single tile pictures, 1 to 9).",
                "type": "string"
              },
              "images": {
                "description": "For 3x3 and 4x4: exactly one picture of the whole grid. For 1x1: one to nine tile pictures. Each is base64 (PNG, JPEG, GIF or WebP; a data: URL is fine) or an https URL.",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "task": {
                "description": "The instruction text shown to the user, copied in full, for example 'Select all images with buses'.",
                "type": "string"
              },
              "timeout_seconds": {
                "description": "How long to wait for the answer, 5 to 90. Default 45. Solves usually take 2 to 6 seconds.",
                "type": "integer"
              }
            },
            "required": ["grid", "images", "task"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "answer": {
                "description": "One boolean per tile: true means click it.",
                "items": {
                  "type": "boolean"
                },
                "type": ["null", "array"]
              },
              "grid": {
                "type": "string"
              },
              "job_id": {
                "description": "Pass this to report_result after you submit the answer.",
                "type": "string"
              },
              "positions": {
                "description": "The same tiles as 'row R, column C' (3x3 and 4x4 only).",
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              },
              "selected_tiles": {
                "description": "Tiles to click, counted from 1. 3x3 and 4x4: left to right, top to bottom. 1x1: the number of the picture you sent. Empty means: click none (then press Verify or Skip).",
                "items": {
                  "type": "integer"
                },
                "type": ["null", "array"]
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["answer", "grid", "job_id", "selected_tiles", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c1ad5d4262141e5022a2cf17fce611d010c6729783dd4e7d8c2ae0f43c8a22d7"
        },
        {
          "name": "solve_text_captcha",
          "title": "Solve a text captcha",
          "description": "Reads a picture with distorted letters and digits and returns the text (case-sensitive). Costs one credit per successful solve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image": {
                "description": "The captcha picture: base64 (a data: URL is fine) or an https URL.",
                "type": "string"
              },
              "timeout_seconds": {
                "description": "How long to wait for the answer, 5 to 90. Default 45.",
                "type": "integer"
              }
            },
            "required": ["image"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "type": "string"
              },
              "text": {
                "description": "The recognised text. It is case-sensitive.",
                "type": "string"
              }
            },
            "required": ["job_id", "text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce15ad115a8d21c5edf691fd59a57a3d4b7a5746d4995024bd5cc15636458a21"
        }
      ],
      "digest": "sha256:825836b9f0c9962276a890307a79cb772fef3e9320138c882daa92e7c7320797"
    }
  }
}
