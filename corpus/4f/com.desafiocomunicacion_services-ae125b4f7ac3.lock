            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "company_type": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "language": {
                "const": "es-ES",
                "default": "es-ES",
                "type": "string"
              },
              "need": {
                "maxLength": 500,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["need"],
            "type": "object"
