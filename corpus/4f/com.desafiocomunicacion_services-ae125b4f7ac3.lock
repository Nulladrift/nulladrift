            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:643b89411c9defaf10cd688607f022b04bdea5d34c0be3b961c6bf7fc3e1c62a"
        },
        {
          "name": "search",
          "description": "Busca servicios, casos, preguntas frecuentes e información pública aprobada de Desafío Comunicación. Úsala cuando la necesidad todavía no corresponde a un identificador conocido.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "const": "es-ES",
                "default": "es-ES",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Necesidad o tema que se quiere localizar",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "type": {
                "default": "all",
                "enum": ["all", "service", "case", "article", "faq", "company"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6056aaf22a50a6d2a74c9d30e6be7f63f9c2d8ad79c21779a9d30f1c46b95603"
        }
