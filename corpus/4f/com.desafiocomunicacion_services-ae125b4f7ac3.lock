          "description": "Devuelve los canales públicos y el siguiente paso para contactar. No envía mensajes ni formularios.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "intent": {
                "maxLength": 100,
                "type": "string"
              },
              "language": {
                "const": "es-ES",
