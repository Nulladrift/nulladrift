          "description": "Lista únicamente casos publicados, filtrados opcionalmente por servicio o tecnología.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "const": "es-ES",
                "default": "es-ES",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "service_id": {
                "maxLength": 80,
                "type": "string"
              },
              "technology": {
                "maxLength": 80,
                "type": "string"
              }
