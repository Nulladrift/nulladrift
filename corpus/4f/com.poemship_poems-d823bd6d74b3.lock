          "description": "A plan to learn a poem by heart in a number of days (7 by default, 3 to 14): its stanzas and lines, which stanzas to learn on which day with a time estimate, the review days after, and the link to the free web trainer that does the drilling. No poem in mind: find_poems with easy_to_memorise suggests an easy first poem to learn.",
