{
  "lockfileVersion": 2,
  "subjects": {
    "com.poemship/poems": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://poemship.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "poemship",
        "title": "PoemShip",
        "version": "1.0.0",
        "description": "Poems and poets from the PoemShip and Poets.by library",
        "websiteUrl": "https://poemship.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "PoemShip is a poetry library of classic and modern poems in English, Belarusian, Russian, German, French, Spanish and other European languages, with biographies of the poets and analyses of the poems. For a situation, feeling or occasion: find_poems with need (what the reader wants from the poem: comfort, calm, hope or a good cry), or occasion and recipient for a poem to send, and audience for a child. Then narrow it with one mood or 1–3 tags from library_guide in the poem language (max_lines for a short poem), or call get_collection with the closest collection. For a poem the user names or remembers: find_poems with words from its title or a line. For what a poem means: get_analysis. To learn one by heart: learn_by_heart, and find_poems with easy_to_memorise for an easy first poem. For a poet: about_poet. When nothing a tool returned fits, or the user wants a deeper search by mood or situation, give them the Smart Search link from the find_poems result: a page of the site where they describe it in their own words. When you quote or recommend a poem, name the poet and link to the page given in the result, and quote only the lines a tool returned.",
      "tools": [
        {
          "name": "about_poet",
          "title": "About a poet",
          "description": "A poet in the library by name or by slug (the last part of the poet page URL): the biography (up to about 1,500 characters) and a one-line summary of it, the number of poems, up to 10 poems with links, and the poet page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The poet's name, for example \"Emily Dickinson\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "slug": {
                "description": "The poet page slug, for example \"emily-dickinson\".",
                "pattern": "^[a-z0-9-]{1,100}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About a poet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:755a8c4926b7976885d0e14ba73febee05a06e21d5c87f780029569d27ae69bd"
        },
        {
          "name": "find_poems",
          "title": "Find poems",
          "description": "Search the library. For a situation or a wish (\"I just lost my dad\", \"a poem to thank my mother\", \"something calm for a ten-year-old\", \"an easy first poem to learn by heart\"), set what the reader needs first: need, or occasion and recipient for a poem to send, audience, easy_to_memorise, easy_to_read. Narrow it with one mood or 1–3 tags from library_guide in the poem language, and max_lines for a short poem. Words in query are looked for in the title and text and in what the poem is about, so \"grief father\" finds poems of a father's death. For a poem or line the user remembers, put its words in query. Returns up to 10 poems, the best fit first, with the poet, the number of lines, the opening lines (a poem of 1 to 3 lines whole), one sentence on what the poem feels like (use it to choose, it is not the poet's words) and the link. need, occasion, recipient, easy_to_memorise, easy_to_read and audience cover English, Russian and Belarusian poems. Give at least one filter. When nothing fits, or the user wants a deeper search by mood or situation, give them the Smart Search link from the result: a page of the site where they describe it in their own words.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "children (up to 12), teens or anyone. Leaves out poems not suited to that age. With this or any of need, occasion, recipient, easy_to_memorise and easy_to_read, explicit poems are left out.",
                "enum": ["children", "teens", "anyone"],
                "type": "string"
              },
              "author": {
                "description": "The poet's name or part of it, for example \"Dickinson\".",
                "maxLength": 100,
                "type": "string"
              },
              "easy_to_memorise": {
                "description": "Only poems easy to learn by heart (steady rhythm and rhyme, not long), the easiest first. For a first poem to learn.",
                "type": "boolean"
              },
              "easy_to_read": {
                "description": "Only poems in plain language a teenager follows on first reading.",
                "type": "boolean"
              },
              "language": {
                "description": "Language of the poems, an ISO 639-1 code: en, ru, be, de, fr, es, it, pl, nl, sv, da, nb or uk.",
                "enum": ["be", "ru", "en", "de", "fr", "es", "it", "pl", "nl", "sv", "da", "nb", "uk"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_lines": {
                "description": "Only poems of at most this many lines.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "mood": {
                "description": "One library mood: sad, anxious, angry, contemplative, inspiring, romantic, dreamy or joyful, or its name in the poem language from library_guide.",
                "maxLength": 40,
                "type": "string"
              },
              "need": {
                "description": "What the reader wants the poem to do for them: comfort (consoling words for someone who suffers), calm (stillness, a gentle pace), hope (ends more hopeful than it begins), energy (courage, action), release (a good cry), perspective (troubles set against something larger), feel_understood (a painful feeling put into words and left as it is), smile (funny or playful) or tenderness (love toward someone). Only poems that clearly do it come back, the best fit first.",
                "enum": ["comfort", "calm", "hope", "energy", "release", "perspective", "feel_understood", "smile", "tenderness"],
                "type": "string"
              },
              "occasion": {
                "description": "For a poem to send someone as a personal message: greeting (good morning, good night, thinking of you), romance, thanks, celebration (birthday, wedding, newborn, graduation), holiday, support (illness, hard times, before a challenge), condolence, apology, farewell, blessing or friendship. Only poems that read as a message in the sender's own words come back.",
                "enum": ["greeting", "romance", "thanks", "celebration", "holiday", "support", "condolence", "apology", "farewell", "blessing", "friendship"],
                "type": "string"
              },
              "query": {
                "description": "Words in any order, looked for in the title, the text and what the poem is about. Every word must appear. Poems with all of them in the title come first. When no poem has them all, poems with any of them come back and the result says so.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              },
              "recipient": {
                "description": "Who the poem is sent to: partner, friend, parent, child or anyone. Poems for that person come first, then poems that suit anyone.",
                "enum": ["partner", "friend", "parent", "child", "anyone"],
                "type": "string"
              },
              "tags": {
                "description": "Tags from library_guide in the poem language, for example [\"grief\", \"father\"]. A poem matches any of them.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find poems"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bd5911ff63dbab0ba143512929213f10863a5ff73e3ac23b15bc8f013db2cf10"
        },
