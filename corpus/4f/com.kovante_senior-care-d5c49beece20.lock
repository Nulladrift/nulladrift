{
  "lockfileVersion": 2,
  "subjects": {
    "com.kovante/senior-care": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kovante.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kovante",
        "title": "Kovante: Senior care",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kovante is a free directory of licensed senior care in the United States, built from state licensing records and Medicare data. Quote the source line and the Kovante link with every answer. Monthly figures are modeled estimates, not quotes. Not a recommendation.",
      "tools": [
        {
          "name": "compare",
          "title": "Compare facilities side by side",
          "description": "Put 2 to 4 facilities side by side, in the order given, with the same public record fields. No score or ranking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "facilities": {
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["facilities"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "type": "string"
              },
              "facilities": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "links": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "rows": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["about", "links", "rows"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare facilities side by side"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7093be8c598b83e8d75d066ac38defa7d17ac06c3e5b529a4a9e0c6926bb96b"
        },
        {
          "name": "get_facility",
          "title": "Get one facility's public record",
          "description": "The public record of one facility on Kovante: address, license, capacity, memory care, phone where the page shows one, and Medicare ratings for nursing homes. Give its Kovante address or the id from search_facilities.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "facility": {
                "description": "A Kovante facility address (https://kovante.com/facilities/tx/...) or an id such as TX:TXAL1234.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["facility"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "type": "string"
              },
              "facility": {
                "type": "object"
              },
              "links": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["about", "links"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one facility's public record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25e5e21f6cc3cab30990db38f2c92eddcb5b64a7ca0a98e672ae4da817fd8bd2"
        },
        {
          "name": "questions_to_ask",
          "title": "Questions to ask a facility before you choose",
          "description": "The questions Kovante suggests asking a facility on the phone, for a care type. The public record does not answer these.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "care_type": {
                "enum": ["assisted_living", "memory_care", "nursing_home", "hospice"],
                "type": "string"
              }
            },
            "required": ["care_type"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "type": "string"
              },
              "care_type": {
                "type": "string"
              },
              "links": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "questions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["about", "links", "questions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Questions to ask a facility before you choose"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2b1f3c8c77c4342c2f0fdf7ef186bd49aa757460d818cb20882026f9334bf50"
        },
        {
          "name": "search_facilities",
          "title": "Find senior care facilities near a place",
          "description": "Find licensed nursing homes, assisted living and memory care near a US town, county or ZIP, from state and Medicare public records. Results come in the same order as the search on kovante.com. Every home links to its full record on Kovante.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "care_type": {
                "enum": ["assisted_living", "memory_care", "nursing_home", "hospice"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "max_monthly_budget": {
                "description": "Whole dollars a month; compared with the modeled estimate.",
                "maximum": 30000,
                "minimum": 500,
                "type": "integer"
              },
              "place": {
                "description": "A US town and state (\"Round Rock, TX\"), a county and state (\"Travis County, TX\") or a 5-digit ZIP.",
                "maxLength": 80,
                "type": "string"
              },
              "radius_miles": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "about": {
                "type": "string"
              },
              "choices": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "links": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "place_used": {
                "type": ["string", "null"]
              },
              "results": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "shown": {
                "type": "integer"
              }
            },
            "required": ["about", "links", "results", "shown"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find senior care facilities near a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae8e3f0d7d737dba0bca57d8022ca0d65e49b5bbb178fc89ddb1df3a64007fe9"
        }
      ],
      "digest": "sha256:698e1fe0a6d2350d84db7a4c8d1a424429c59174f2ea425f016112512cea69e5"
    }
  }
}
