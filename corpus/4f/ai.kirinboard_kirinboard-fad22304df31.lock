        {
          "name": "gate_compliance",
          "title": "Which pull request gates usually fail",
          "description": "Shows how a repository's pull request gates have fared over the last 7 and 30 days. A gate is a check the dashboard grades every pull request by (for example agent identity, persona, or \"closes an issue\"). For each gate: how many pull requests passed it, failed it, would have failed it (the gate only warns for now), were not checked by it, are still pending or not read yet, and were exempt (promotions, bots, or an exempt label); and the dashboard's verdict on whether the gate is ready to enforce. The gates that refused the most pull requests come first. Call it before you open or push a pull request, to see which gates usually trip pull requests here and meet them first. Counts only, no logs. Gate compliance is switched on per repository; where it is off, the answer says so. Read-only, and it never fails: if the counts cannot be read it says why.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "repo": {
                "description": "owner/name. Optional when the token covers one repository.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,38}\\/[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gate compliance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:27ae4546ce2391ecb90b81055d0ec84fdee0b8e23223ff8178ad30312199d1ac"
        },
        {
          "name": "left_behind",
          "title": "Work left behind",
          "description": "Answers \"what did I or another session start and leave?\". For a repository it lists three things. Left behind: open work held by a session that has ended, one row per open pull request (else per issue), most recently active first: the issue or pull request with its title and link, the session that held it, how long it has been quiet, and its status (recent, stale, or done when the issue was closed elsewhere), with the pull request's checks and merge state. Housekeeping: how many claims are still held for merged or closed pull requests, how many sessions have ended, and the running sessions that never registered. Active work by how long it has been quiet: the issues in progress, quietest first, marking those quiet for longer than the team's stall threshold. Use it when your human asks what was left unfinished, or before you pick work, to finish or hand on what is already started. Before taking over an item, check it with board and claim it as usual. Left behind needs the dashboard to read agent leases: where agents report through claim comments, the answer says it is not available. Read-only, and it never fails: if a part cannot be read it says why.",
