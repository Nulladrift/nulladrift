        {
          "name": "operations",
          "title": "Who holds a shared operation",
          "description": "Call this before you start a shared operation such as a deploy or a restart (deploy:production, restart:api), to see whether another agent is already doing it. For a repository it lists the operations an agent holds, or held in the last 24 hours: the operation, who holds it, since when, until when the hold lasts unless it is renewed, and the last heartbeat. If someone holds the operation you need, wait for them rather than starting it again. Give operation to ask about one. Operations are claimed with the agent pack's op-claim on the repository's operations issue; this tool only reads them. Read-only, and it never fails: if they cannot be read it says why.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "operation": {
                "description": "Only this operation, e.g. deploy:production.",
                "pattern": "^[a-z][a-z0-9_-]{0,39}(?::[a-z0-9][a-z0-9._/@-]{0,99})?$",
                "type": "string"
              },
              "repo": {
                "description": "owner/name. Optional when the token covers one repository.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,38}\\/[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Operations in progress"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b1f9410492d9ed25a87f12b311819a22997a951b4421f6adb66f8b660e78eb1"
        },
        {
          "name": "quick_wins",
          "title": "What is closest to finished",
          "description": "Lists what is closest to finished in a repository, so you can pick work that completes something. Two lists, in the dashboard's Quick wins order: initiatives (an initiative is a parent ticket that groups the tickets of one larger piece of work) with open tickets, almost done first, then open, then those whose remaining tickets are a new part, each with what is left and its open tickets, marking the ones free to pick up (not started and claimed by nobody); and the open pull requests closest to merging: ready to merge, waiting for review, approved but needing a rebase, one failing check, the rest, drafts last, each with what is left before it can merge. Use it when your human asks what is nearly done or what to finish next, or when you are choosing what to work on. kind limits it to initiatives or pull requests. Each row carries the dashboard's tag (action_label, such as Merge Ready, Review Needed or Check to Fix) and quick, true when it is one step from done: act on quick rows first. A pull request also says who opened it and which tickets it closes (closes, and the initiative it finishes a ticket of). Only the 50 most recently updated open pull requests are read; the answer says when there are more, and when check results could not be read. Read-only, and it never fails: if the list cannot be read it says why. Before starting a ticket, check it with board and claim it as usual.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "all (the default), initiative, or pull_request.",
                "enum": ["all", "initiative", "pull_request"],
                "type": "string"
              },
              "limit": {
                "description": "How many of each list (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "repo": {
                "description": "owner/name. Optional when the token covers one repository.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,38}\\/[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quick wins"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd52a4746108a6774ad25162f8113ff3046ee1d550bcc53e425d394ad3fabec4"
