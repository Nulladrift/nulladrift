      "serverInfo": {
        "name": "kirin-devops",
        "title": "KirinBoard",
        "version": "0.1.1",
        "description": "See what needs you, what's stuck and what's nearly done across your GitHub projects, and check the board before your agents start work. Read-only.",
        "websiteUrl": "https://kirinboard.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "KirinBoard shows what is happening in your repositories: who is working on what, CI results, and what needs a person. Every tool is read-only.\nBefore you claim or start an issue, call board for the repository you are working in. Before you push, call ci_queue. Before a deploy or restart, call operations.\nPass repo as owner/name, as in the repository's remote URL.",
      "tools": [
        {
          "name": "almost_done",
          "title": "Initiatives a few tickets from finished",
          "description": "Finds the last tickets that would finish an initiative, and which of them are free to pick up. An initiative is a parent ticket that groups the tickets of one larger piece of work. For a repository it lists the initiatives the dashboard classes as almost done (a few tickets left that belong to the original push; by default 3 or fewer open and at least 75% closed, a setting the team can change), smallest remainder first. Each comes with its remaining tickets (number, title, link, phase, whether someone is working on it, who has claimed it) and the dashboard's reason in plain words. Use it when your human asks what is close to finished, or when you are choosing what to work on: closing one of these tickets finishes something. unclaimed_only lists only tickets nobody is working on or has claimed. include_next_part also lists initiatives whose first part is done but whose remaining tickets were filed later and not started (better moved into a new initiative than counted as nearly done). Read-only, and it never fails: if the list cannot be read it says why. Before starting a ticket, check it with board and claim it as usual.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "include_next_part": {
                "description": "Also list initiatives whose first part is done and whose next part has not started.",
                "type": "boolean"
              },
              "limit": {
                "description": "How many initiatives (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "repo": {
                "description": "owner/name. Optional when the token covers one repository.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,38}\\/[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              },
              "unclaimed_only": {
                "description": "Only tickets that are free to pick up: not in progress and claimed by nobody. Initiatives with none are left out (and counted).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Almost-done initiatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8be49ce82ad935ed119fc79bd32b6a31966724cd62c5980c1a5dcf31ceabc355"
        },
        {
          "name": "area_suggestions",
          "title": "Issues with no area, and a suggested area for each",
          "description": "Lists the open issues in a repository that have no area (no [persona] title prefix and no persona: label), as the dashboard's Has an area line counts them, each with a suggested area, the persona: label that gives it, a confidence (high or medium) and a one-line reason. The suggestion comes from the repository's own issues: the area most of the other issues under the same initiative have, or else the area most issues with the same title prefix or scope have. When there is no clear majority, there is no suggestion, and the reason says why. Use it when your human asks you to tidy up issues with no area. Show them the list first, then apply only the labels they agree to, with your own GitHub access: the dashboard never writes labels. Read-only, and it never fails: if the list cannot be read it says why.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many issues (default 50).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "repo": {
                "description": "owner/name. Optional when the token covers one repository.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,38}\\/[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              },
              "suggested_only": {
                "description": "Only the issues that have a suggestion (default false: every issue with no area).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Area suggestions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f37590908500178665bd09613d97615e59fe1a7a322616963dba2dfd7301f71"
        },
        {
          "name": "board",
          "title": "Check the board before starting work",
          "description": "Call this before you claim or start an issue. One call returns, for the repository you are working in: every active claim (issue, phase, who, tool and model, branch, PR and checks, last active, live or stale); your own claims, if you pass session_id or branch; unclaimed issues in the ready phases (backlog, scoping, planning); who else is changing the paths you pass; and a one-line verdict per issue you name: free, held by someone (live), held by someone (stale, last active ...), or closed. It never fails: if the board cannot be checked it says why and you proceed uncoordinated. Pass repo as owner/name from your git remote.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "branch": {
                "description": "Your branch, to list your own claims separately.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "detail": {
                "description": "More rows (claims and unclaimed issues). Default compact.",
                "type": "boolean"
              },
              "issues": {
                "description": "Issue numbers you are about to work on: each gets a verdict.",
                "items": {
                  "maximum": 9999999,
                  "minimum": 1,
                  "type": "integer"
                },
                "maxItems": 20,
                "type": "array"
              },
              "paths": {
                "description": "Files or folders (trailing /) you will change: who else is changing them.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "repo": {
                "description": "owner/name from your git remote. Optional when the token covers one repository.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,38}\\/[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              },
              "session_id": {
                "description": "Your claim's session id, to list your own claims separately.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check the board"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef0c4f2debaa95b49d008c1bab3f2d07e18471b323827a1c9b679f0900d68ac5"
        },
        {
          "name": "ci_history",
          "title": "Finished CI pushes, 1 to 12 hours ago",
          "description": "Answers \"did the push I made a few hours ago pass?\". Lists the pushes on a repository that finished between 1 and 12 hours ago (or 1 and 4 hours ago), newest first, each with its branch, pull request, title, who pushed it, outcome (passed, failed, awaiting, superseded), when it finished, how long it took, its commit and a link to the run, plus a count of each outcome. Narrow it by branch, pull request, commit (sha, 7 or more characters) or outcome. It does not cover the last hour: for pushes queued, running or finished in the last hour, use ci_status. Read-only, and it never fails: if CI cannot be read it says why.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "branch": {
                "description": "Only this branch.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "hours": {
                "description": "How far back: 4 or 12 hours (default 12). Both read the same 12-hour list.",
                "enum": [4, 12],
                "type": "number"
              },
              "limit": {
                "description": "How many pushes to list (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "outcome": {
                "description": "Only pushes with this outcome.",
                "enum": ["passed", "failed", "awaiting", "superseded"],
                "type": "string"
              },
              "pr": {
                "description": "Only pushes for this pull request number.",
                "maximum": 9999999,
                "minimum": 1,
                "type": "integer"
              },
              "repo": {
                "description": "owner/name. Optional when the token covers one repository.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,38}\\/[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              },
              "sha": {
                "description": "Only the push of this commit (its first 7 or more characters).",
                "pattern": "^[0-9A-Fa-f]{7,40}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CI history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04c878c9384062d76be39987f2e7d56af7abb88736c413c246d8ac4fd4633e0e"
        },
        {
          "name": "ci_queue",
          "title": "Will my CI job wait for a runner",
          "description": "Call this before you push, to judge whether your job will wait for a runner and whether now is a busy time. For a repository it shows: what is waiting for a runner now (jobs, grouped by pull request or push, and the runner labels they wait on), how long the oldest has waited and whether the runners count as congested; the median wait for a runner (self-hosted jobs started today, else GitHub-hosted jobs in the last hour) and per workflow over its recent runs; which runners are busy and with which job (the runners the dashboard can see; where it cannot read the full list, those seen in recent jobs, and it says so); and runner capacity over the last 24 hours: the share of the day the runners were congested, and how much spare capacity there was. If the queue is long and your push is not urgent, keep committing locally and push once. Read-only, and it never fails: if the queue cannot be read it says why.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many waiting groups and workflows to list (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "repo": {
                "description": "owner/name. Optional when the token covers one repository.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9-]{0,38}\\/[A-Za-z0-9._-]{1,100}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CI queue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abd7dc424aeb82b0377945620b19515d9c1d60c0acc9143e5fe309ebd661536e"
        },
