        {
          "name": "read_latest_answer_reviews",
          "title": "Read latest answer reviews",
          "description": "Latest saved answer executions needing an owned-brand attribution review, with engine, recorded region/date, actual competing brands, excerpt, citations and a source-grounded review task. Last seven days; at most 200 question/engine/region/persona groups scanned per brand. Up to 30 pending and 30 reviewed/unchanged runs with triage state/version. triage.unchangedSinceReview references a prior explicit review of complete identical evidence; the current run remains reviewed=false. Use triage.needsReview for fresh tasks; changed or unverified earlier reviews need rechecking; state changes use dedicated review/restore tools. No comparison, provider calls or publication.",
