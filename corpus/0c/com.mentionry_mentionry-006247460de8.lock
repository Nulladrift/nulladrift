      "serverInfo": {
        "name": "mentionry",
        "title": "Mentionry",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mentionry measures how a brand appears in answer engines, and finds places that would plausibly link to a site.\n\nStart with read_brand_overview, then read_actionable_insights for evidence-backed SEO/GEO changes. These read saved data only, cost no paid collection quota, and share a 120/minute account read limit. Use list_brand_workspaces and pass workspace explicitly for owned brands. Findings include implementation and verification steps, confidence and limitations. Never treat missing data as zero or promise ranking/citation gains.\nOther tool families:\n\n1. The account's own agents and what they produced. list_agents, then describe_agent to learn what one needs, then run_agent with those values. An agent is a chain the customer built out of steps that read pages, search, score content, ask answer engines and call APIs, so this is the widest capability here. A chain ending in a write step leaves a document behind: list_documents and read_document reach those, including ones written before this conversation. You cannot create or edit an agent: chains are assembled by a person on the canvas, where each step's cost is shown.\n\n2. Link building. qualify_domain first to decide whether the site is worth the effort at all, then read_site for a brief, then discover_competitors and backlink_gap or find_prospects. draft_pitch needs a paid plan.\n\nThe prepare_page_changes tool queues a bounded internal draft job with an idempotency key; read_preparation_job polls it and cancel_preparation_job cancels queued work. Nothing here sends mail, publishes customer pages or posts messages: those exist in Mentionry's own chat, where a person approves each one first. Steps that reach a paid vendor are counted against the account's allowance, so prefer describe_agent over running one to find out what it does.",
      "tools": [
        {
          "name": "backlink_gap",
          "title": "Backlink gap",
          "description": "Find pages that link to the named competitors but not to you, classified by whether a link is realistically winnable and why. Competitors are excluded from their own results: a competitor is never a prospect.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "competitors": {
                "description": "Up to five competitor domains.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0107ef357d565da44085b6ba36b1bd1c4c5e62e0c783d711e591e10298efe7f0"
        },
