{
  "lockfileVersion": 2,
  "subjects": {
    "app.sharekite/sharekite": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://studio.sharekite.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "sharekite",
        "title": "Sharekite",
        "version": "0.1.3",
        "description": "Publish web pages and files from your agent and share them by link or with the people you name.",
        "websiteUrl": "https://www.sharekite.app",
        "icons": [
          {
            "src": "https://www.sharekite.app/assets/brand/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {
            "directoryRead": true
          }
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sharekite publishes static websites. upload prepares a version with a preview link and changes nothing online; publish puts a version online. The user chooses who can open the work: anyone with the link, only the people they name, or anyone with the password. An HTML form on a page that posts to /_form/{key} needs no backend: Sharekite stores what visitors send, and list_responses reads it.",
      "tools": [
        {
          "name": "create_project",
          "title": "Create project",
          "description": "Create an empty project and reserve its URL. Repeating the call with the same name returns the same project while it is empty.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Defaults to \"Untitled project\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "key": {
                "description": "Identifies the project. By default made from the project name.",
                "type": "string"
              },
              "studioLink": {
                "description": "Opens the project in Studio.",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["key", "studioLink", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["project:read-metadata", "project:read-content", "project:read-responses", "project:create", "project:publish", "project:change-sharing"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:62f861a7b2f72c9d53ab45f962391c1606ba851c6a9238148e57d92673117142"
        },
        {
          "name": "get_account",
          "title": "Get account",
          "description": "Read the Sharekite account that this connection uses: its email address and its workspaces.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The email address that the user signs in to Sharekite with.",
                "type": "string"
              },
              "name": {
                "description": "Empty if the user gave no name.",
                "type": "string"
              },
              "workspaces": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["owner", "publisher"],
                      "type": "string"
                    },
                    "studioLink": {
                      "description": "The Studio address of this Sharekite instance.",
                      "type": "string"
                    }
                  },
                  "required": ["name", "role", "studioLink"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["email", "name", "workspaces"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["project:read-metadata", "project:read-content", "project:read-responses", "project:create", "project:publish", "project:change-sharing"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d74969002648d9553e7c7cdbb8d158ef02a7ff16cba44dd33aa1fbf6b545019d"
        },
        {
          "name": "get_files",
          "title": "Read files",
          "description": "Read the files of a version. Without paths, lists the files; with paths, returns their content.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "paths": {
                "description": "Files whose content to return. Request large files one at a time.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "project": {
                "description": "The project key, such as client-report.",
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "Defaults to the published version.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "entrypoint": {
                "description": "The file served at the site's root.",
                "type": "string"
              },
              "files": {
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "contentType": {
                          "type": "string"
                        },
                        "path": {
                          "type": "string"
                        },
                        "sha256": {
                          "description": "Hex SHA-256 of the file's bytes.",
                          "type": "string"
                        },
                        "size": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        }
                      },
                      "required": ["contentType", "path", "sha256", "size"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "path": {
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["path", "text"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "base64": {
                          "type": "string"
                        },
                        "path": {
                          "type": "string"
                        }
                      },
                      "required": ["base64", "path"],
                      "type": "object"
                    }
                  ]
                },
                "type": "array"
              },
              "version": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["entrypoint", "files", "version"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["project:read-metadata", "project:read-content", "project:read-responses", "project:create", "project:publish", "project:change-sharing"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:4089f8ae244e81cf2d504cccbb3ad111531ffbffb121bfd5293b81170e5f7aaa"
        },
        {
          "name": "get_project",
          "title": "Get project",
          "description": "Read the state of one project.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "project": {
                "description": "The project key, such as client-report.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "access": {
                "additionalProperties": false,
                "properties": {
                  "mode": {
                    "anyOf": [
                      {
                        "enum": ["anyone_with_link", "restricted", "password"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "null while no audience was chosen."
                  },
                  "recipients": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "email": {
                          "type": "string"
                        },
                        "invitation": {
                          "enum": ["sent", "failed", "not_sent"],
                          "type": "string"
                        },
                        "opened": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "first": {
                                  "type": "string"
                                },
                                "last": {
                                  "type": "string"
                                }
                              },
                              "required": ["first", "last"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Not recorded yet, so always null."
                        }
                      },
                      "required": ["email", "invitation", "opened"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["mode", "recipients"],
                "type": "object"
              },
              "forms": {
                "description": "Forms that received at least one response, the most recent first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "form": {
                      "description": "The key in the form's address, /_form/{form}.",
                      "type": "string"
                    },
                    "latestAt": {
                      "type": "string"
                    },
                    "responses": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["form", "latestAt", "responses"],
                  "type": "object"
                },
                "type": "array"
              },
              "latestVersion": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "name": {
                "type": "string"
              },
              "publishedVersion": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "studioLink": {
                "description": "Opens the project in Studio.",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["access", "forms", "latestVersion", "name", "publishedVersion", "studioLink", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["project:read-metadata", "project:read-content", "project:read-responses", "project:create", "project:publish", "project:change-sharing"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:fd1ba06fb16c5d2d7fe548d59ed6281f9a133984c4b664feed6af13ba705c5c2"
        },
        {
          "name": "list_projects",
          "title": "List projects",
          "description": "List up to 30 projects, most recently changed first.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "projects": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "type": "string"
                    },
                    "latestVersion": {
                      "anyOf": [
                        {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "null if nothing was uploaded. Higher than publishedVersion while a prepared version is not published."
                    },
                    "name": {
                      "type": "string"
                    },
                    "publishedVersion": {
                      "anyOf": [
                        {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "null if never published."
                    },
                    "studioLink": {
                      "description": "Opens the project in Studio.",
                      "type": "string"
                    },
                    "updatedAt": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["key", "latestVersion", "name", "publishedVersion", "studioLink", "updatedAt", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["projects"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["project:read-metadata", "project:read-content", "project:read-responses", "project:create", "project:publish", "project:change-sharing"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:10d2cee74828790dbe606a35228c441edb2fe3ac9e47ebe8264b37afd9bda29c"
        },
        {
          "name": "list_responses",
          "title": "List form responses",
          "description": "Read the responses that visitors sent through one form of a project, newest first, 100 at a time.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "before": {
                "description": "The next value of an earlier call. Lists the responses older than that page.",
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              },
              "form": {
                "description": "The form key, such as contact for /_form/contact. Required when the project has several forms.",
                "type": "string"
              },
              "project": {
                "description": "The project key, such as client-report.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "form": {
                "description": "null when the project has no responses yet.",
                "type": ["string", "null"]
              },
              "next": {
                "description": "The ID of the last response. Pass as before to read older responses. null when no older responses exist.",
                "type": ["string", "null"]
              },
              "responses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "email": {
                      "description": "The verified email of a signed-in respondent; null without sign-in.",
                      "type": ["string", "null"]
                    },
                    "fields": {
                      "description": "In the order sent. A name repeats for a checkbox group.",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "value": {
                            "type": "string"
                          }
                        },
                        "required": ["name", "value"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "id": {
                      "type": "string"
                    },
                    "submittedAt": {
                      "type": "string"
                    }
                  },
                  "required": ["email", "fields", "id", "submittedAt"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["form", "next", "responses"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["project:read-metadata", "project:read-content", "project:read-responses", "project:create", "project:publish", "project:change-sharing"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8c18ae22e0a8ffe00b802ab9ce098c5293e24443e0476d273cbaa83e5351f146"
        },
        {
          "name": "publish",
          "title": "Publish and share",
          "description": "Change which version is online and who can open it. A call changes only the fields it names. With version, puts that version online; without it, changes only access to the live publication and retries failed invitations.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access": {
                "additionalProperties": false,
                "description": "Who can open the project. Without it, access stays as it is.",
                "properties": {
                  "mode": {
                    "description": "Required for the first publication unless an audience is already set; otherwise only to change it.",
                    "enum": ["anyone_with_link", "restricted", "password"],
                    "type": "string"
                  },
                  "notify": {
                    "description": "Default true. Set false to give access without invitation emails.",
                    "type": "boolean"
                  },
                  "password": {
                    "description": "For the password audience: at least 8 characters. Without it, Sharekite generates a password or keeps the existing one. A new password signs out current visitors.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "recipients": {
                    "description": "Addresses added to the existing recipients. Restricted only.",
                    "items": {
                      "format": "email",
                      "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "project": {
                "description": "The project key, such as client-report.",
                "minLength": 1,
                "type": "string"
              },
              "replaceVersion": {
                "description": "Needed for a rollback: the version that is online now.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "version": {
                "description": "The version number from upload.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              }
            },
            "required": ["project"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "access": {
                "additionalProperties": false,
                "properties": {
                  "mode": {
                    "anyOf": [
                      {
                        "enum": ["anyone_with_link", "restricted", "password"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "password": {
                    "description": "Present only when no password was given and Sharekite generated one.",
                    "type": "string"
                  },
                  "recipients": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "required": ["mode", "recipients"],
                "type": "object"
              },
              "invitations": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "email": {
                      "type": "string"
                    },
                    "reason": {
                      "const": "delivery_failed",
                      "type": "string"
                    },
                    "retry": {
                      "const": "skipped",
                      "type": "string"
                    },
                    "status": {
                      "enum": ["sent", "failed", "not_sent"],
                      "type": "string"
                    }
                  },
                  "required": ["email", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "publication": {
                "additionalProperties": false,
                "properties": {
                  "state": {
                    "description": "already_online: this call did not change which version is online.",
                    "enum": ["published", "already_online"],
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  },
                  "version": {
                    "anyOf": [
                      {
                        "exclusiveMinimum": 0,
                        "maximum": 9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["state", "url", "version"],
                "type": "object"
              },
              "studioLink": {
                "description": "Opens the project in Studio.",
                "type": "string"
              }
            },
            "required": ["access", "invitations", "publication", "studioLink"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["project:read-metadata", "project:read-content", "project:read-responses", "project:create", "project:publish", "project:change-sharing"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c1dd7ebae0872e99101800c53f5e5d5f21f84bde43ad1710f5fb17c1c9eb60e1"
        },
        {
          "name": "upload",
          "title": "Upload files",
          "description": "Create a prepared version of a project. The live publication stays unchanged. Takes file content only: no local paths and no ZIP archives. Send a large site across several calls with complete set to false.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "complete": {
                "default": true,
                "description": "Set false to keep the upload open for more files in later calls.",
                "type": "boolean"
              },
              "deletePaths": {
                "description": "Paths to remove. Only with patch, on the completing call.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "entrypoint": {
                "description": "The file served at the site's root, set on the completing call. Defaults to the root index.html or the only file; patch keeps the current one.",
                "type": "string"
              },
              "files": {
                "default": [],
                "description": "Use text for text files and base64 for binary files.",
                "items": {
                  "anyOf": [
                    {
                      "additionalProperties": false,
                      "properties": {
                        "path": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "text": {
                          "type": "string"
                        }
                      },
                      "required": ["path", "text"],
                      "type": "object"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "base64": {
                          "type": "string"
                        },
                        "path": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["base64", "path"],
                      "type": "object"
                    }
                  ]
