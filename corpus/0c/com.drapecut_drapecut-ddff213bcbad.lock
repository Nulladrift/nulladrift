        {
          "name": "run_drape",
          "description": "Drape one fabric at one warp angle (degrees); return statistics and an exportable result_id.\n\n        Omitted seed is suggested on the surface. Omitted pitch/lock_angle use the\n        fabric preset, including its UD spread/compression settings. pitch/offset\n        are mm; hole_area is mm² (null bridges holes). The API may increase pitch\n        to bound the grid; pitch_used reports the actual resolution. Kinematic\n        shear/locking statistics are not a structural strength calculation.\n        ",
          "inputSchema": {
            "properties": {
              "angle": {
                "default": 0,
                "title": "Angle",
                "type": "number"
              },
              "fabric_id": {
                "default": "carbon-twill-3k",
                "title": "Fabric Id",
