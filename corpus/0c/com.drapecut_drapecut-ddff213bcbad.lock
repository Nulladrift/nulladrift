                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Hole Area"
              },
              "lock_angle": {
                "anyOf": [
                  {
                    "exclusiveMaximum": 90,
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Lock Angle"
              },
              "max_pieces": {
                "default": 6,
                "maximum": 12,
                "minimum": 1,
                "title": "Max Pieces",
                "type": "integer"
              },
              "mesh_id": {
                "pattern": "^[A-Za-z0-9_-]{1,80}$",
                "title": "Mesh Id",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 50,
                "minimum": -50,
                "title": "Offset",
                "type": "number"
              },
              "overlap": {
                "default": 20,
                "minimum": 0,
                "title": "Overlap",
                "type": "number"
              },
              "pitch": {
