      "serverInfo": {
        "name": "DrapeCut",
        "title": "DrapeCut",
        "version": "0.2.0",
        "description": "Composite draping from CAD surfaces to DXF and PDF cutting patterns",
        "websiteUrl": "https://drapecut.com/docs/mcp"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DrapeCut makes composite cloth cutting patterns from selected CAD surfaces.\nHosted analysis is anonymous. Only built-in examples export without sign-in.\nExporting a user's uploaded part requires the signed-in website or an\nauthenticated local adapter; this hosted service has no account linking.\nStart with create_workspace and retain its secret\nworkspace_id for all part tools. load_sample works immediately. For a user's\nfile, give them the returned upload_url, wait for their upload, call list_uploads,\nthen import_part with its upload_id. Never pass a local filesystem path or a URL\nto import_part. STEP import is asynchronous: poll get_job(kind='step'), inspect\nlist_faces, and ask the user to choose the intended face IDs before select_faces.\nDo not assume every face of a solid is a ply surface. Use mm, mm² and degrees.\nCompare angles using one seed and the same cloth settings. Assess coverage,\nover-lock percentage and self-overlap as well as shear. Results are kinematic\ndry-cloth estimates, not structural certification. For built-in examples,\nexport_pattern returns a download_url: give it to the user and download wanted\nfiles promptly. For uploaded-part exports, open https://drapecut.com, sign in\nwith email and recreate the part/settings there, or use the authenticated local\nadapter. Signing in on the website does not authenticate this workspace. Workspaces\nand links expire after two hours or a restart; solver handles can expire earlier.\nWorkspace IDs and file URLs grant access; keep them private. This public beta is\nanonymous and does not connect to a signed-in user's saved projects. Backend\nexport permissions still apply. Setup: https://drapecut.com/docs/mcp\n",
      "tools": [
        {
          "name": "compare_drapes",
          "description": "Compare up to 12 warp angles, sequentially, at one fixed seed and cloth configuration.\n\n        When omitted, seed is suggested once for the first angle. Results rank by\n        coverage descending, then percentage above lock ascending, then maximum\n        shear ascending. This is a stated comparison rule, not a global optimum.\n        Runs use the requested/preset pitch, never a hidden coarse approximation.\n        Export the chosen result promptly: backend result IDs are temporary.\n        ",
          "inputSchema": {
            "properties": {
              "angles": {
                "items": {
                  "type": "number"
                },
                "maxItems": 12,
                "minItems": 1,
                "title": "Angles",
                "type": "array"
              },
              "fabric_id": {
                "default": "carbon-twill-3k",
                "title": "Fabric Id",
                "type": "string"
              },
              "hole_area": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Hole Area"
              },
              "lock_angle": {
                "anyOf": [
                  {
                    "exclusiveMaximum": 90,
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Lock Angle"
              },
              "mesh_id": {
                "pattern": "^[A-Za-z0-9_-]{1,80}$",
                "title": "Mesh Id",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 50,
                "minimum": -50,
                "title": "Offset",
                "type": "number"
              },
              "pitch": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Pitch"
              },
              "seed": {
                "anyOf": [
                  {
                    "items": {
                      "type": "number"
                    },
                    "maxItems": 3,
                    "minItems": 3,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Seed"
              },
              "workspace_id": {
                "pattern": "^[0-9a-f]{48}$",
                "title": "Workspace Id",
                "type": "string"
              }
            },
            "required": ["angles", "mesh_id", "workspace_id"],
            "title": "compare_drapesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "compare_drapesDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:c7af95e7ef865ff75d9c3ee1a5b5ec0b745b1ad8949b2f9bf365b55900a42f8e"
        },
        {
