          "inputSchema": {
            "properties": {
              "angle": {
                "default": 0,
                "title": "Angle",
                "type": "number"
              },
              "fabric_id": {
                "default": "carbon-twill-3k",
                "title": "Fabric Id",
                "type": "string"
              },
              "hole_area": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
