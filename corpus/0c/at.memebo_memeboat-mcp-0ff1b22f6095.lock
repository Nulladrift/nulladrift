{
  "lockfileVersion": 2,
  "subjects": {
    "at.memebo/memeboat-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://memebo.at/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "memeboat",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_meme",
          "title": "Create a meme",
          "description": "Create a real, shareable meme on memebo.at by captioning a template. texts are placed top-to-bottom: 1 caption = bottom text, 2 captions = classic top/bottom, N captions fill the template's boxes in order (match suggestedCaptionCount when possible). Returns the meme page URL and a direct image URL. Rate-limited per IP — space out repeated calls.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "deepFry": {
                "description": "Deep-fry the template picture (1 light, 2 medium, 3 extra); captions stay crisp",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "effects": {
                "description": "Up to 3 picture effects, applied in order to the template picture only: deep-fry, nuked, needs-more-jpeg, potato (144p), bulge, magik, swirl, triggered, intensifies, vaporwave, doomer, cursed, jail, glitch, vhs. A name, or {name, strength 1-3, x, y, radius} for nuked, bulge, swirl (x and y 0-1 across and down). Captions stay crisp. Not together with deepFry.",
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "center": {
                          "additionalProperties": false,
                          "properties": {
                            "x": {
                              "maximum": 1,
                              "minimum": 0,
                              "type": "number"
                            },
                            "y": {
                              "maximum": 1,
                              "minimum": 0,
                              "type": "number"
                            }
                          },
                          "required": ["x", "y"],
                          "type": "object"
                        },
                        "label": {
                          "type": "boolean"
                        },
                        "name": {
                          "maxLength": 40,
                          "minLength": 1,
                          "type": "string"
                        },
                        "radius": {
                          "maximum": 1,
                          "minimum": 0.1,
                          "type": "number"
                        },
                        "strength": {
                          "maximum": 3,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "version": {
                          "maximum": 99,
                          "minimum": 1,
                          "type": "integer"
                        },
                        "x": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        },
                        "y": {
                          "maximum": 1,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["name"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 3,
                "type": "array"
              },
              "font": {
                "description": "Default font for all captions, one of: impact, arial, helvetica, times, courier, titillium, thick, kalam, comic, notosans, notosanshebrew",
                "type": "string"
              },
              "layout": {
                "description": "layout:'top' puts captions in a white bar above the image; 'default' overlays them on the image",
                "enum": ["default", "top"],
                "type": "string"
              },
              "style": {
                "description": "Alternate background style name from get_meme_template's availableStyles, e.g. 'maga'",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "template": {
                "description": "Template slug, e.g. \"x-x-everywhere\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "texts": {
                "description": "Captions, top-to-bottom. Each is a string or { text, color?, outline?, font? } for per-caption styling. At least one must be non-empty.",
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 200,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "color": {
                          "description": "Caption fill color: hex or white/black/red/yellow/blue/green",
                          "type": "string"
                        },
                        "font": {
                          "description": "Caption font, one of: impact, arial, helvetica, times, courier, titillium, thick, kalam, comic, notosans, notosanshebrew",
                          "type": "string"
                        },
                        "outline": {
                          "description": "Caption outline color; omit for an auto-picked readable outline",
                          "type": "string"
                        },
                        "text": {
                          "maxLength": 200,
                          "type": "string"
                        }
                      },
                      "required": ["text"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "wide": {
                "description": "Stretch the picture sideways: 1 is 1.5 times, 2 is 2 times, 3 is 3 times as wide",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["template", "texts"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5c1b5eab2b59daac18a31119b328ec74231529516fb16054cbf0bb51014394f"
        },
        {
          "name": "get_meme_template",
          "title": "Get meme template details",
          "description": "Fetch one meme template by its slug (from search_meme_templates or a memebo.at/templates/<slug> URL): dimensions, image URL, suggested caption count and, when it has one, the meaning and origin of the meme with its sources.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Template slug, e.g. \"x-x-everywhere\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2fbae4a7ef9a62fe846acf06b77b93e2d057cb010a66fa8bf7f6aa2ee379ce3f"
        },
        {
          "name": "search_meme_templates",
          "title": "Search meme templates",
          "description": "Search memebo.at's catalog of 30,000+ meme templates by name, other names or topic (e.g. \"drake\", \"distracted boyfriend\", \"cat\"). Returns matching templates with their slug (use it with create_meme), image URL and a suggested caption count.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search terms, e.g. \"surprised pikachu\"",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da98728f52709e00159284815f0fd02db3d3e881d61eefd8187a4b5e72f2012e"
        }
      ],
      "digest": "sha256:8a38959cdf99e4df543a0d488347b48cb65c5c5011ef0ab67ad0c39fb7b11acf"
    }
  }
}
