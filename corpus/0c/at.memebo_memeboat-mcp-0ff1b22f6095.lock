{
  "lockfileVersion": 2,
  "subjects": {
    "at.memebo/memeboat-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://memebo.at/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "memeboat",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_meme",
          "title": "Create a meme",
          "description": "Create a real, shareable meme on memebo.at by captioning a template. texts are placed top-to-bottom: 1 caption = bottom text, 2 captions = classic top/bottom, N captions fill the template's boxes in order (match suggestedCaptionCount when possible). Returns the meme page URL and a direct image URL. Rate-limited per IP — space out repeated calls.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "font": {
                "description": "Default font for all captions, one of: impact, arial, helvetica, times, courier, titillium, thick, kalam, comic, notosans, notosanshebrew",
                "type": "string"
              },
              "layout": {
                "description": "layout:'top' puts captions in a white bar above the image; 'default' overlays them on the image",
                "enum": ["default", "top"],
                "type": "string"
              },
              "style": {
                "description": "Alternate background style name from get_meme_template's availableStyles, e.g. 'maga'",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "template": {
                "description": "Template slug, e.g. \"x-x-everywhere\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "texts": {
                "description": "Captions, top-to-bottom. Each is a string or { text, color?, outline?, font? } for per-caption styling. At least one must be non-empty.",
                "items": {
                  "anyOf": [
                    {
                      "maxLength": 200,
                      "type": "string"
                    },
                    {
                      "properties": {
                        "color": {
                          "description": "Caption fill color: hex or white/black/red/yellow/blue/green",
                          "type": "string"
                        },
                        "font": {
                          "description": "Caption font, one of: impact, arial, helvetica, times, courier, titillium, thick, kalam, comic, notosans, notosanshebrew",
                          "type": "string"
                        },
                        "outline": {
                          "description": "Caption outline color; omit for an auto-picked readable outline",
                          "type": "string"
                        },
                        "text": {
                          "maxLength": 200,
                          "type": "string"
                        }
                      },
                      "required": ["text"],
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["template", "texts"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:31859975df8e41931ba41d746c427e8b1062e4fda82a65351a072550d07795e7"
        },
        {
          "name": "get_meme_template",
          "title": "Get meme template details",
          "description": "Fetch one meme template by its slug (from search_meme_templates or a memebo.at/templates/<slug> URL): dimensions, image URL, suggested caption count and, when it has one, the meaning and origin of the meme with its sources.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Template slug, e.g. \"x-x-everywhere\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f725b1d22c4b7b94ce18950c89b697865e13ab02febe834c932c918c0029381a"
        },
        {
          "name": "search_meme_templates",
          "title": "Search meme templates",
          "description": "Search memebo.at's catalog of 30,000+ meme templates by name, other names or topic (e.g. \"drake\", \"distracted boyfriend\", \"cat\"). Returns matching templates with their slug (use it with create_meme), image URL and a suggested caption count.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search terms, e.g. \"surprised pikachu\"",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:445ad585ae17bed90e50805e02f20f3a378f4d6c2d951460b648e03101615492"
        }
      ],
      "digest": "sha256:af87a6608d928a024d42364a5a10f855720c9ca6275153ea823b87dc3149e58a"
    }
  }
}
