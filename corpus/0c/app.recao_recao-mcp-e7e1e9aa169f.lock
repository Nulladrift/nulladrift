        {
          "name": "generate_clips",
          "description": "Render UGC video scenes as ad-ready clips, metered per second of video (the estimate shows the exact price before anything renders). Pass 3 to 6 scenes (5 to 8 seconds each, one action per scene, spoken lines at most 20 words; empty spoken_line for silent characters). Consecutive scenes pack into single TAKES of up to 15 seconds, one generation each. HOW CHARACTER IDENTITY WORKS, read carefully: all characters are described in TEXT (avatar_id resolves to its persona brief; or write the persona field yourself, covering one character or a whole ensemble). The video model rejects every image that contains a person, so no photo can anchor a face. Text keeps a character IDENTICAL only WITHIN a take; ACROSS takes it preserves the look and styling but the exact face can drift, and neither avatar_id nor persona prevents that. Structure your script so scenes where the same character must be recognizably identical sit adjacent and fit one take (15s or less); treat cross-take appearances as different shots of a matching character, and review the result. reference_image_urls (up to 9 https images) keeps real products or props on-model in every take; these images must contain no people. Without confirm, it validates the contract and returns the per-scene price estimate in EUR, and makes nothing. With confirm=true it starts the metered render and returns a job_id: rendering runs in the background over a few minutes, so poll clips_status with that id to get per-scene clip URLs plus the uncut takes. Paid plans only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "default": "9:16",
                "description": "Output aspect ratio",
                "enum": ["9:16", "1:1", "16:9"],
                "type": "string"
              },
              "avatar_id": {
                "description": "Avatar id from generate_avatar (starts with av_). Its persona brief describes the recurring character in text; identity holds within a take only, not across takes.",
                "type": "string"
              },
              "confirm": {
                "default": false,
                "description": "Set true to start the metered render. Returns a job_id to poll with clips_status.",
                "type": "boolean"
              },
              "model": {
                "default": "bytedance/seedance-2.0",
                "description": "seedance-2.0 (default, highest quality) or seedance-2.0-fast (same generation, faster and cheaper).",
                "enum": ["bytedance/seedance-2.0", "bytedance/seedance-2.0-fast"],
                "type": "string"
              },
              "persona": {
                "description": "Alternative to avatar_id: describe the recurring character or the full ensemble (several characters) in words. Same limits: identity holds within a take, not across takes. Ignored when avatar_id is present.",
                "maxLength": 600,
                "type": "string"
              },
              "reference_image_urls": {
                "description": "Up to 9 https image URLs of products or props to keep on-model in every take. No people in these images.",
                "items": {
                  "type": "string"
                },
                "maxItems": 9,
                "type": "array"
              },
              "scenes": {
                "description": "3 to 6 scenes in order. Adjacent scenes sharing a character land in the same take when their combined length allows it.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "avatar_action": {
                      "description": "One gross action (hold, tap, point). No chained actions.",
                      "type": "string"
                    },
                    "camera": {
                      "description": "Camera framing",
                      "type": "string"
                    },
                    "duration_s": {
                      "description": "Scene length in seconds (5 to 8)",
                      "type": "number"
                    },
                    "energy": {
                      "description": "Delivery energy",
                      "type": "string"
                    },
                    "setting": {
                      "description": "Where the scene happens",
                      "type": "string"
                    },
                    "spoken_line": {
                      "description": "Spoken line, at most 20 words. Empty string for a silent scene.",
                      "type": "string"
                    }
                  },
                  "required": ["avatar_action", "duration_s", "setting", "spoken_line"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["scenes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate clips"
