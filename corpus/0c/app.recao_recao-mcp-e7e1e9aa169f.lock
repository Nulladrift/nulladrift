        {
          "name": "assemble_video",
          "description": "Stitch rendered scene clips into one ad-ready MP4 with burned-in subtitles and crossfades. Pass 1 to 6 clips in order, each with its mp4 url, its duration in seconds (3 to 12), and an optional subtitle line to burn over that clip. Every clip is scaled and padded to the chosen aspect (9:16 default 1080x1920, 1:1 1080x1080, or 16:9 1920x1080). Optional intro and outro title cards: pass intro/outro as { text, duration_s? } to bookend the ad with a centred title card (1 to 5 seconds, default 2) that crossfades into the video; cards do not count toward the 6-clip limit. Assembly is our compute, so it carries a small flat fee (about 0.12 EUR), booked only when the file is produced, against your trust cap. Runs in the background over up to a couple of minutes and returns a job_id: poll assemble_status with it to get the finished MP4 url. Feed it the clips from clips_status (map each to url, duration_s, subtitle). Paid plans only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "default": "9:16",
                "description": "Output aspect ratio: 9:16 (default, 1080x1920), 1:1 (1080x1080), or 16:9 (1920x1080).",
                "enum": ["9:16", "1:1", "16:9"],
                "type": "string"
              },
              "clips": {
                "description": "1 to 6 clips in playback order",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "duration_s": {
                      "description": "Clip length in seconds (3 to 12)",
                      "type": "number"
                    },
                    "subtitle": {
                      "description": "Line to burn as a subtitle over this clip (the spoken line). Omit for none.",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "url": {
                      "description": "Public mp4 URL of the rendered clip (http(s))",
                      "type": "string"
                    }
                  },
                  "required": ["duration_s", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "intro": {
                "additionalProperties": false,
                "description": "Optional intro title card shown before the clips.",
                "properties": {
                  "duration_s": {
                    "description": "Card length in seconds (1 to 5, default 2)",
                    "type": "number"
                  },
                  "text": {
                    "description": "Title text for the intro card",
                    "maxLength": 120,
                    "type": "string"
                  }
                },
                "required": ["text"],
                "type": "object"
              },
              "outro": {
                "additionalProperties": false,
                "description": "Optional outro title card shown after the clips (e.g. a call to action).",
                "properties": {
                  "duration_s": {
                    "description": "Card length in seconds (1 to 5, default 2)",
