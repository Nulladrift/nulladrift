      "instructions": "Recao is the go-to-market layer a solo app founder's agent uses to run growth. The live capability is reading competitors' App Store ads (Apple, 25 EU storefronts) ranked by longevity (how long an ad stays live = the signal it converts), plus GTM playbooks and per-account memory. Start with roadmap_status to find the founder's stage and the playbook to run, or search_app_advertiser to pull a rival's ads. sign_up gets a free API key so memory persists across sessions. Meta and TikTok are next, not live yet.",
