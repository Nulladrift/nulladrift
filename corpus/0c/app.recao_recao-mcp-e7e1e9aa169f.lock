        {
          "name": "generate_avatar",
          "description": "Generate a UGC persona: your agent passes a persona brief (physical look plus vibe of one invented creator), and we return stills of that invented person plus an avatar_id. The persona brief anchors the same character in generate_clips takes, and the stills are the customer's reference artifact for the creative. Ask for up to 3; the default model returns a single strong base still, imagen and flux return the full set. Metered per generation; the price is shown in the response. Paid plans only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 3,
                "description": "How many stills to request (2 to 3). The default model returns 1 regardless; imagen and flux honor this.",
                "maximum": 3,
                "minimum": 2,
                "type": "integer"
              },
              "model": {
                "default": "bytedance/seedream-4.0",
                "description": "Image model. Default seedream-4.0 (lowest cost).",
                "enum": ["bytedance/seedream-4.0", "google/imagen-4.0-generate-001", "bfl/flux-pro-1.1"],
                "type": "string"
              },
              "persona_brief": {
                "description": "Physical description plus vibe of the invented UGC creator. One person (age, look, styling, setting, energy).",
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["persona_brief"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
