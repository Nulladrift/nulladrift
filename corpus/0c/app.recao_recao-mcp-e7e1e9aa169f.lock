        {
          "name": "sign_up",
          "description": "Request a free Recao account for your human. This does NOT create an active account: it registers a PENDING one and emails your human an activation link; nothing works and no terms are accepted until they click it (the human accepts the terms at activation, not you). The API key in the response stays inert until then. Consent stays with the human, so calling this is a request, not a decision made for them: in an interactive session their approval of this tool call is the go-ahead; if you run autonomously, surface this step to your human instead of calling it. After activation, reconnect with header `Authorization: Bearer <key>`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "app_name": {
                "description": "The user's own app (App Store name), so reports and memory attach to it",
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "description": "The account owner's email (the human founder's)",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
