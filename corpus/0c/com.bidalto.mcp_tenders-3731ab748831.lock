  "subjects": {
    "com.bidalto.mcp/tenders": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bidalto.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bidalto",
        "title": "Bidalto: licitaciones públicas en España",
        "version": "1.0.0",
        "websiteUrl": "https://bidalto.com/claude/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Herramientas de solo lectura sobre licitaciones públicas abiertas en España: search_tenders para encontrar, get_tender para el detalle y el anuncio oficial, estimate_offer para el importe y el margen de una oferta. Importes en euros sin IVA salvo que se indique. Responde en el idioma del usuario.",
      "tools": [
        {
          "name": "estimate_offer",
          "title": "Calcular oferta y margen",
          "description": "Calcula el importe de una oferta a partir del presupuesto base sin IVA y la baja (%), y, si se indica el coste estimado, el margen en euros y en porcentaje, tanto sobre el precio de la oferta como sobre el coste (etiquetados por separado). Misma fórmula que el comprobador de bidalto.com. Acepta el id de una licitación para tomar su presupuesto base.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coste": {
                "description": "Coste estimado de ejecutar el contrato, en euros sin IVA (opcional).",
                "type": "number"
              },
              "descuento": {
                "description": "Baja ofertada en % sobre el presupuesto base (0-90), p. ej. 12 para un 12 %.",
                "type": "number"
              },
              "id": {
                "description": "Id de la licitación (opcional): usa su presupuesto base si no se da precio.",
                "type": "string"
              },
              "precio": {
                "description": "Presupuesto base de licitación sin IVA, en euros. Opcional si se da id.",
                "type": "number"
              }
            },
            "required": ["descuento"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcular oferta y margen"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fdc6b47648dd70fc551765ae0af60740124526c0c86cf48c8f9bd9288f4a9359"
        },
        {
          "name": "get_tender",
          "title": "Ver una licitación",
          "description": "Devuelve el detalle de una licitación abierta por su id (el que da search_tenders): órgano, presupuesto con y sin IVA, valor estimado, duración, lotes, criterios de adjudicación, procedimiento, fecha y hora de cierre, el enlace al anuncio oficial y la ficha en bidalto.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Id de 10 caracteres de search_tenders, p. ej. \"d8d5160679\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ver una licitación"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:23fbad3be96a942417f0b302c4fce9e2ca8624dd859ea71ec63b2920cb33c9a9"
        },
        {
          "name": "search_tenders",
          "title": "Buscar licitaciones públicas abiertas",
          "description": "Busca licitaciones públicas abiertas en España (Plataforma de Contratación del Sector Público y plataformas autonómicas agregadas; en plazo, actualizado a diario). Filtra por sector o palabra clave, provincia, municipio (busca el nombre en el título y en el órgano de contratación), tipo de contrato, presupuesto base sin IVA y fecha de cierre. Devuelve como máximo 25 resultados, cada uno con su enlace a la ficha en bidalto.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cierra_antes_de": {
                "description": "Solo las que cierran en o antes de esta fecha (AAAA-MM-DD).",
                "type": "string"
              },
              "cierra_despues_de": {
                "description": "Solo las que cierran en o después de esta fecha (AAAA-MM-DD). Por defecto, hoy.",
                "type": "string"
              },
              "limite": {
                "description": "Número de resultados (1-25, por defecto 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "municipio": {
                "description": "Municipio o texto que debe aparecer en el título o en el órgano de contratación, p. ej. \"Getafe\".",
                "type": "string"
              },
              "orden": {
                "description": "Orden: por fecha de cierre (por defecto) o por presupuesto.",
                "enum": ["cierre", "presupuesto_desc", "presupuesto_asc"],
                "type": "string"
              },
              "presupuesto_max": {
                "description": "Presupuesto base de licitación máximo, en euros sin IVA.",
                "type": "number"
              },
              "presupuesto_min": {
                "description": "Presupuesto base de licitación mínimo, en euros sin IVA.",
                "type": "number"
              },
              "provincia": {
                "description": "Provincia (nombre o código INE de 2 dígitos), p. ej. \"Madrid\", \"Valencia\", \"28\".",
                "type": "string"
              },
              "sector": {
                "description": "Sector o palabra clave: p. ej. \"limpieza\", \"seguridad\", \"jardinería\", \"comedores\", \"mantenimiento\", \"obras de carreteras\", \"software\".",
                "type": "string"
              },
              "tipo": {
                "description": "Tipo de contrato.",
                "enum": ["Servicios", "Suministros", "Obras", "Concesión de servicios", "Concesión de obras", "Otros"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Buscar licitaciones públicas abiertas"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7cbe426a115c7758502039aaeaf99c8f76b3ac7716e0365efe3807268ee256b"
        }
      ],
      "digest": "sha256:e08c2c3fec8ddbf22fb158487f0d3d8b29313c1b3ec1b3821602b9674968e81a"
    }
  }
}
