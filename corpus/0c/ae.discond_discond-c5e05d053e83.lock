        },
        {
          "name": "discond_list_offers",
          "title": "List offers",
          "description": "List live Discond offers, filtered by merchant, branch, provider, category, validity or online-only, sorted by newest, expiring or biggest discount. Has no place filter: filter by merchant id instead. Requires the user to be signed in to Discond.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "benefit": {
                "description": "Client-side filter on benefit_type",
                "enum": ["off", "cashback"],
                "type": "string"
              },
              "business_branch_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "business_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "category_ids": {
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "integer"
                },
                "maxItems": 20,
                "type": "array"
              },
              "cursor": {
                "description": "Pagination cursor from a previous response meta.next_cursor",
                "maxLength": 512,
                "type": "string"
              },
              "include_all_branches": {
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1–25, default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "online_only": {
                "type": "boolean"
              },
              "provider_ids": {
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "integer"
                },
                "maxItems": 20,
                "type": "array"
              },
              "q": {
                "maxLength": 200,
                "type": "string"
              },
              "response_format": {
                "default": "markdown",
                "description": "markdown (default, human-readable) or json (structured)",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "sort": {
                "default": "discount",
                "enum": ["newest", "expiring", "discount"],
                "type": "string"
              },
              "valid_now": {
                "default": true,
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List offers"
