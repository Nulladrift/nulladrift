        {
          "name": "discond_list_categories",
          "title": "List categories",
          "description": "List Discond merchant categories with ids, optionally filtered by name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 30,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "maxLength": 200,
                "type": "string"
              },
              "response_format": {
                "default": "markdown",
