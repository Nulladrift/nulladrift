{
  "lockfileVersion": 2,
  "subjects": {
    "ae.discond/discond": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.discond.ae/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "discond",
        "title": "Discond",
        "version": "1.0.0",
        "websiteUrl": "https://www.discond.ae/en-us/developers",
        "icons": [
          {
            "src": "https://www.discond.ae/icon-512-maskable.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://www.discond.ae/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Discond lists live discounts at UAE merchants across providers such as Fazaa, The Entertainer and Talabat. discond_find_discounts covers most searches. Offer details and redeem links need the user to be signed in to Discond. Each result has a www.discond.ae link the user can open.",
      "tools": [
        {
          "name": "discond_autocomplete_businesses",
          "title": "Autocomplete merchants",
          "description": "Typo-tolerant autocomplete of UAE merchant names on Discond. Returns matching merchant ids and names for partial or misspelled input.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Partial merchant name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "default": "markdown",
                "description": "markdown (default, human-readable) or json (structured)",
                "enum": ["markdown", "json"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Autocomplete merchants"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:65e2a6f4d2f5d363ff21f5af63db88a27c9c9c314868e498e1277269cc568280"
        },
        {
          "name": "discond_find_discounts",
          "title": "Find Discond discounts",
          "description": "Search UAE merchants with live discounts on Discond by free text, place (emirate or area such as \"Dubai Marina\"), coordinates, discount provider, or category. Returns merchants with links; when the user is signed in to Discond it also returns their best current offers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "One of Discond's 13 broad categories, e.g. \"Restaurants & Cafés\", \"Beauty & Spa\", \"Fitness & Sports\", \"Travel & Hotels\". There are no cuisine categories.",
                "maxLength": 200,
                "type": "string"
              },
              "category_ids": {
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "integer"
                },
                "maxItems": 20,
                "type": "array"
              },
              "cursor": {
                "description": "Pagination cursor from a previous response meta.next_cursor",
                "maxLength": 512,
                "type": "string"
              },
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Max results (1–25, default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "online_only": {
                "type": "boolean"
              },
              "place": {
                "description": "Emirate (e.g. Dubai, Abu Dhabi) or a UAE area (e.g. \"Dubai Marina\", \"JBR\", \"Business Bay\", \"Yas Island\"). Known areas search around the area centre; other areas fall back to their emirate. lat/lng overrides.",
                "maxLength": 200,
                "type": "string"
              },
              "provider": {
                "description": "Provider name e.g. Entertainer, Fazaa, Talabat",
                "maxLength": 200,
                "type": "string"
              },
              "provider_ids": {
                "items": {
                  "exclusiveMinimum": 0,
                  "type": "integer"
                },
                "maxItems": 20,
                "type": "array"
              },
              "q": {
                "description": "Merchant name or part of it (matches names only). A bare kind of place such as \"spa\", \"gym\" or \"dinner\" is searched as its category.",
                "maxLength": 200,
                "type": "string"
              },
              "radius_m": {
                "description": "Nearby radius in meters (500–25000)",
                "maximum": 25000,
                "minimum": 500,
                "type": "integer"
              },
              "response_format": {
                "default": "markdown",
                "description": "markdown (default, human-readable) or json (structured)",
                "enum": ["markdown", "json"],
                "type": "string"
              },
              "sort": {
                "enum": ["discover", "nearby"],
                "type": "string"
              },
              "with_active_offers": {
                "default": true,
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find Discond discounts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c968e4043261d54850fad53fd09193ac26cec573468fe1f849ea44f382cb38e2"
        },
        {
          "name": "discond_get_business",
          "title": "Get business",
          "description": "Get one Discond merchant by id: name, categories, providers and link. When the user is signed in to Discond, its top live offers are included.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "include_offers": {
                "description": "Include live offers (signed-in users only). Default: true when signed in.",
                "type": "boolean"
              },
              "offer_limit": {
                "default": 10,
                "description": "Max results (1–25, default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "response_format": {
                "default": "markdown",
                "description": "markdown (default, human-readable) or json (structured)",
                "enum": ["markdown", "json"],
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get business"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
