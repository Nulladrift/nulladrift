      "instructions": "Discond lists live discounts at UAE merchants across providers such as Fazaa, The Entertainer and Talabat. discond_find_discounts covers most discount searches; discond_find_venues picks restaurants and other venues near an area or landmark by cuisine, budget per person and must-haves such as alcohol or kids. Offer details and redeem links need the user to be signed in to Discond. Each result has a www.discond.ae link the user can open.",
      "tools": [
        {
          "name": "discond_autocomplete_businesses",
          "title": "Autocomplete merchants",
          "description": "Typo-tolerant autocomplete of UAE merchant names on Discond. Returns matching merchant ids and names for partial or misspelled input.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 8,
                "description": "How many suggestions (1–20, default 8).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many results, for the next page.",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Partial merchant name",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "default": "markdown",
                "description": "markdown (default, human-readable) or json (structured)",
                "enum": ["markdown", "json"],
                "type": "string"
              }
            },
