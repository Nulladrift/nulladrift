        {
          "name": "discond_resolve_place",
          "title": "Resolve place",
          "description": "Resolve a UAE place name to Discond place ids (emirate, community, settlement) or to a known area. A known area has level \"area\" and id 0; its name works as the place filter of discond_find_discounts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "community_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "level": {
                "default": "auto",
                "enum": ["region", "community", "settlement", "area", "auto"],
                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Place name to resolve",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "region_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "response_format": {
                "default": "markdown",
                "description": "markdown (default, human-readable) or json (structured)",
                "enum": ["markdown", "json"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
