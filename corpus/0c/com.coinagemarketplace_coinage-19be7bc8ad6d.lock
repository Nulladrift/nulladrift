        {
          "name": "save_search",
          "title": "Save search",
          "description": "Save a search the person is waiting on. Requires scope account:write. Use it when a search found nothing they want, or whenever they say \"tell me when one shows up\". Location works like search_listings (zip, city, or lat and lng; the home ZIP when omitted). Optional maxPriceCents. Matching handles plurals, synonyms, and compounds with or without a space (apple tv / appletv). Their own listings never match; only a listing from someone else creates a search_match. A match shows up in get_pending_actions (iOS app users also get a push). The daily get_pending_actions check you already have, or set up once, will show it, so never create a separate check per search.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
