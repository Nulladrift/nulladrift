                "type": "string"
              },
              "keywords": {
                "description": "1–3 item words, for example: couch, or kids bike.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "lat": {
                "description": "Latitude. Send with lng.",
                "type": "number"
              },
              "lng": {
                "description": "Longitude. Send with lat.",
                "type": "number"
              },
              "maxPriceCents": {
                "description": "Highest asking price in integer US cents.",
                "exclusiveMinimum": 0,
                "maximum": 100000000,
                "type": "integer"
              },
