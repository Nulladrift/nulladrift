          "description": "Attach one JPEG, PNG, WebP, or HEIC photo to the seller's draft or active listing. Requires scope listings:write. Pass the photo the person attached as the photo file parameter when your platform supports file inputs. Only send dataBase64 for a small file you can encode exactly; never type out a large photo. If you cannot pass the file, call create_photo_upload_link instead and give the person the link. Buyers see exactly the uploaded bytes, so do not resize, recompress, crop, or screenshot. Photos must be at least 1000 pixels on the long side and 600 on the short side; smaller ones are refused with photo_too_small, and then ask the person for the original photo. Maximum 8 MB and 5 photos. After the first photo, offer to publish with update_listing.",
