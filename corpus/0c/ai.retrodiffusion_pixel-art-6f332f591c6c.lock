        {
          "name": "start_lowpoly_generate",
          "title": "Start Low-Poly 3D Model",
          "description": "Start building a low-poly 3D model with pixel-art textures from a prompt and/or reference images (paid).\nreference_models puts your existing models (by asset_id) into it exactly, e.g. \"a tavern with my table\".\nOptional input_palette (a palette image, as for create_inference): the model uses only its colors, and\nrevisions and animations keep them.\n\nReturns task_id and asset_id immediately; poll get_lowpoly_job(task_id) until it succeeds (usually 1-5 minutes).\nThen use export_lowpoly_model for .glb/.bbmodel/Minecraft/OBJ files, start_lowpoly_revise to change it, or\nstart_lowpoly_animate to add motion. Failed jobs are refunded automatically; never restart a running job.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional retry key: repeating a start call with the same key returns the same job instead of charging again."
              },
              "input_palette": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Base64 image of a color palette; output colors are constrained to it."
              },
              "mode": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Omit (auto) to let the service pick: quality, or fast for simple requests. \"quality\" or \"fast\" to choose. Same price."
              },
              "prompt": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What to build or change, up to 250 characters."
              },
              "rd_api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "RetroDiffusion API key (rdpk-...) for this call only; overrides session or header auth."
              },
              "reference_images": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Up to 4 base64 reference images (PNG/JPEG/WEBP) of the object, e.g. front and side views."
              },
              "reference_models": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "asset_ids of your own finished Low-Poly models to build in: each is placed exactly (same shapes and textures) where the prompt puts it, or adapted. Images and models together: at most 4."
              },
              "size": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Cube size in texels: \"16\", \"32\", \"64\", \"128\", \"256\", or \"auto\" (default). Auto reads the prompt; reference-image-only requests default to 64. Bigger sizes cost more (see get_lowpoly_pricing)."
              },
              "style": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Low-Poly style id: rd_lowpoly__detailed (default, free-form shapes), rd_lowpoly__blocky (boxes only, tilted where needed, Minecraft-like), their Lite versions rd_lowpoly__detailed_lite / rd_lowpoly__blocky_lite (a lighter model: simpler results for much less, and Lite prices for everything done to the model later), or another style listed by get_lowpoly_pricing (each style lists its prices)."
              }
            },
            "type": "object"
          },
