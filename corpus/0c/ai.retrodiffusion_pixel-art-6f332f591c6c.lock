        {
          "name": "estimate_edit_tool_cost",
          "title": "Estimate Edit Cost (Free)",
          "description": "Validate an edit-tool request and estimate its cost and duration without running it. Always free.",
          "inputSchema": {
            "properties": {
              "color_count": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "color_reducer: target number of colors."
              },
              "dither_mode": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "color_reducer/palette_converter: dithering mode."
              },
              "dither_strength": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "color_reducer/palette_converter: dithering strength, 0-10 (0 disables, default 5)."
              },
              "expand_bottom": {
