        {
          "name": "export_lowpoly_model",
          "title": "Export Low-Poly Model",
          "description": "Export a Low-Poly model for an engine or tool and return a hosted download URL (free).\nEngines (Godot, Unity, Unreal, three.js) and Blender get .glb; Blockbench gets .bbmodel; Minecraft gets a\nresource pack; .glb and .bbmodel include every animation. Animated GIFs, sprite sheets and MP4 videos need an\nanimation name from the model.",
          "inputSchema": {
            "properties": {
              "animation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
