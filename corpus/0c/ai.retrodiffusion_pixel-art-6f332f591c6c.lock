      "instructions": "Authenticate first by calling authenticate(api_key), or pass rd_api_key directly on each tool call. For most stills prefer RD Core styles (rd_core__*, e.g. rd_core__default): $0.10 per image flat at any size, roughly 90% of RD Pro's quality at a little over half the price, about 4x faster than RD Pro, 12-512 px per side in any aspect ratio, up to 9 per-inference reference_images, up to 4 images per request, no tiling (rd_core__default, painterly, simple, fantasy, horror, scifi, isometric, topdown, platformer go 12-512 px; dungeon_map, spritesheet, hexagonal_tiles, inventory_items 128-512; fps_weapon, typography 64-512; ui_panel 256x256 only). RD Plus (rd_plus__*) and the regular animation styles (rd_animation__*) are API only: retired from the website but fully available here at unchanged prices. For the highest quality stills prefer RD Pro styles (rd_pro__*); they support per-inference reference_images (up to 9) for character/style consistency, and most (rd_pro__default, painterly, fantasy, horror, scifi, simple, isometric, topdown, platformer) go as small as 12x12 px for tiny sprites and icons, and rd_pro__pixelate converts an input_image down to 16x16 px — check list_available_styles for each style's exact limits. To animate an existing sprite prefer the advanced animation styles (rd_advanced_animation__walking/idle/jump/crouch/attack/destroy/custom_action/subtle_motion) started via start_inference_job and polled with get_inference_job — animations are long-running. rd_advanced_animation__rotate turns one sprite into its 8 directional views instead of motion (prompt optional, frames_duration ignored; GIF by default, return_spritesheet=true for the 3x3 direction sheet). Use fix_pixel_art on enlarged, softened, or AI-rendered pixel art to recover its native pixel grid. Post-process results with run_edit_tool: background_remover, color_style_transfer are $0.01; color_reducer, palette_converter, pixel_correction, k_centroid_downscale, rotate are $0.001 per run (per frame for animations); image_edit, inpainting, outpainting, seam_tiling are $0.12 (RD Core). fix_pixel_art costs $0.002 (standard) or $0.005 (neural) per call. Before create_inference, use list_available_styles or get_style_usage(prompt_style) to confirm whether you should send input_image, per-inference reference_images, or style_reference_images. create_inference returns hosted output_urls and a request_id; if delivery is pending, call get_inference_result(request_id) and never repeat the paid generation automatically. estimate_inference_cost and estimate_edit_tool_cost are always free — check prices before spending. For 3D, use the Low-Poly tools: start_lowpoly_generate builds a low-poly model with pixel-art textures (sizes 16-256 or auto; $0.25-$3.00), then poll get_lowpoly_job; start_lowpoly_revise changes it (new version), start_lowpoly_animate adds motion (the first animation rigs it for free), start_lowpoly_split breaks a scene into separate models (one per object, animations included), and export_lowpoly_model returns .glb/.bbmodel/Minecraft/OBJ/GIF download URLs. 3D jobs take minutes, so never restart one that is still running. On a plan, 2 jobs run at once on plan usage; more use balance or wait. Check `billing.source` in results. When a result starts with a notice (from its warnings), tell the user that notice. get_balance shows balance, plan usage left (%) and API job slots in use.",
