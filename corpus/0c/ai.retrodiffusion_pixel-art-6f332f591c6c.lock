        {
          "name": "fix_pixel_art",
          "title": "Fix Pixel Art",
          "description": "Recover the native pixel grid from enlarged, softened, AI-rendered, or compressed pixel art.\n\nStandard uses the native Rust detector. Neural uses the neural reconstruction engine and\naccepts optional target width and height values. This repairs existing art—it does not generate\na new image. Standard costs $0.002 per call and neural $0.005, charged before running and refunded\nautomatically if the call fails. Both engines share a limit of 10 requests per minute per API token.\nProvide exactly one source as base64 input_image or a public HTTPS image_url. URL input avoids\nthe ALB request-body limit. Decoded images may contain up to 16 megapixels. Successful response\nJSON is limited to 850,000 bytes for AWS ALB compatibility.",
          "inputSchema": {
            "properties": {
              "engine": {
                "default": "standard",
                "description": "Fixer engine. Standard uses the native Rust detector; neural uses the neural reconstruction engine.",
                "enum": ["standard", "neural"],
                "type": "string"
              },
              "height": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional neural target dimension in pixels. Accepted only with engine='neural'."
              },
              "image_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Public HTTPS PNG or JPEG URL to reconstruct. Provide this or input_image, not both. URL downloads may contain up to 20 MB and bypass the API request-body limit."
              },
              "input_image": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Base64 PNG or JPEG to reconstruct at its native pixel grid. Raw base64 or a data URL; provide this or image_url, not both. Decoded input may contain up to 16 megapixels, and complete base64 request JSON must stay within 900,000 bytes."
              },
              "rd_api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "RetroDiffusion API key (rdpk-...) for this call only; overrides session or header auth."
              },
              "timeout_seconds": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Read-timeout override in seconds for this call; increase for animations or large batches."
              },
              "width": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional neural target dimension in pixels. Accepted only with engine='neural'."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": {
              "items": {
                "type": "string"
              },
              "type": "array"
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fix Pixel Art"
          },
          "behavior": {
            "destructive": false,
