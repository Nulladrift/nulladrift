                "default": null,
                "description": "Animation name for the gif, sheet and mp4 targets. Omit it for gif or sheet to get every animation in one zip."
              },
              "asset_id": {
                "description": "asset_id returned by start_lowpoly_generate or get_lowpoly_job.",
                "type": "string"
              },
              "rd_api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "RetroDiffusion API key (rdpk-...) for this call only; overrides session or header auth."
              },
              "target": {
                "description": "godot, unity, unreal, web, blender (all .glb), blockbench (.bbmodel), obj (zip), minecraft (resource pack zip), atlas (png), turntable (png), axis_views (zip of 6 pixel-exact PNGs, one per axis direction), gif, sheet or mp4 (1024px video) (need an animation). The .glb and .bbmodel files include every animation.",
                "type": "string"
              },
              "version": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Version number to work on (default: the newest). Revisions create versions; animations do not."
