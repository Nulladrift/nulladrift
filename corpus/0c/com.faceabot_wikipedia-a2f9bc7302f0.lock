{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/wikipedia": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/wikipedia"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-wikipedia",
        "title": "Faceabot Wikipedia",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Wikipedia: search and read Wikipedia in any language, free, no key.\nStart with wiki_search {\"query\":\"…\",\"lang\":\"en\"}, then wiki_summary or wiki_article with the exact title.\nText is from Wikipedia (CC BY-SA 4.0): cite the page url when you reuse it. Cached a few minutes.\nAlso on its own site: https://wikiaibot.com (same tools, plain HTTP API too).\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "wiki_article",
          "title": "Read a Wikipedia article (plain text)",
          "description": "Full text of one Wikipedia article as plain text, in pages of up to 20,000 characters (use start to read further).\nUse when: you need details beyond the summary.\nExample: {\"title\":\"Marie Curie\",\"lang\":\"en\",\"max_chars\":8000}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Wikipedia language code. Default: en",
                "type": "string"
              },
              "max_chars": {
                "default": 8000,
                "maximum": 20000,
                "minimum": 500,
                "type": "integer"
              },
              "start": {
                "default": 0,
                "description": "Character offset to start from (for long articles)",
                "minimum": 0,
                "type": "integer"
              },
              "title": {
                "description": "Exact page title",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:585855cac4d9457839ada1e0d201a97f4d856b899a4580ef6c47a88cade2496f"
        },
        {
          "name": "wiki_search",
          "title": "Search Wikipedia",
          "description": "Searches Wikipedia in any language and returns matching page titles with a one-line description and an excerpt.\nUse when: you need to find the right Wikipedia page for a topic, person, place or concept.\nExample: {\"query\":\"Marie Curie\",\"lang\":\"en\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Wikipedia language code: en, fr, nl, de, es, it, ja… Default: en",
                "type": "string"
              },
              "query": {
                "description": "What to look for (any language)",
                "type": "string"
              },
              "results": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:de8016a73326504b75a952f72ee9ae4d7ef25c652f269d79b393234e05453c9d"
        },
        {
          "name": "wiki_summary",
          "title": "Wikipedia page summary",
          "description": "Short summary (lead paragraph) of one Wikipedia page, with its description, last edit time and link.\nUse when: you need a quick, sourced overview of a topic.\nExample: {\"title\":\"Marie Curie\",\"lang\":\"en\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Wikipedia language code. Default: en",
                "type": "string"
              },
              "title": {
                "description": "Exact page title (use wiki_search first if unsure)",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:53552f50b1a1b99b2855743fded6ce1bae2e82d6a0d59eb33932cbdd74f9952e"
        }
      ],
      "digest": "sha256:8877cdf71de006417ec19ec8971320ba0eaa1c57f45cac888f7edb272cb3cc57"
    }
  }
}
