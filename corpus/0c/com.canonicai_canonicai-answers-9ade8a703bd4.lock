{
  "lockfileVersion": 2,
  "subjects": {
    "com.canonicai/canonicai-answers": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://canonicai.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "canonicai-answers",
        "version": "1.0.0",
        "description": "Read-only hosted MCP over CanonicAI's cited Answers corpus — list, get, and search answer contract v0 records."
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_answer",
          "description": "Return one Answer contract v0 record with citations for a known slug. Never fabricates content for unknown slugs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Answer slug from answers/index.json.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answer": {
                "type": "string"
              },
              "citations": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "code": {
                "enum": ["not_found"],
                "type": "string"
              },
              "home": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "question": {
                "type": "string"
              },
              "shortAnswer": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["answer", "citations", "id", "question", "slug", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c91577c5c4eea6925bef556f40536d31076f4c131723267b6752d50cd22b42ef"
        },
        {
          "name": "get_canon",
          "description": "Return one canon-v1 record (constructs, relationships, open divergences, provenance, source works) for a known slug. Never fabricates content for unknown slugs; returns close-match slugs instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Canon slug from canons/index.json.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "action_statement": {
                "type": "string"
              },
              "closeMatches": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "code": {
                "enum": ["not_found"],
                "type": "string"
              },
              "constructs": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "coverage": {
                "type": "object"
              },
              "guide_url": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "open_divergences": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "provenance": {
                "type": "object"
              },
              "relationships": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "slug": {
                "type": "string"
              },
              "source_works": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["constructs", "slug", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:602da52c96bfbb2ed37408ea272cd1c8c09ca820ad29cb394256a5df8fa7a71b"
        },
        {
          "name": "list_answers",
          "description": "List published CanonicAI answer summaries from the static Answers corpus. Returns slug, id, question, canonical URLs, and citation counts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum summaries to return.",
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "Number of summaries to skip.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answers": {
                "items": {
                  "properties": {
                    "citationCount": {
                      "type": "integer"
                    },
                    "id": {
                      "type": "string"
                    },
                    "jsonUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["citationCount", "id", "jsonUrl", "question", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              }
            },
            "required": ["answers", "count"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdc028ef5b9758a9c6ef431e06e5099d9cd45001a17d5c02ecc8a140699b4f17"
        },
        {
          "name": "list_canons",
          "description": "List published CanonicAI domain canons from the static canon bundle. Returns slug, action statement, construct/source counts, and canonical URLs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum summaries to return.",
                "minimum": 0,
                "type": "integer"
              },
              "offset": {
                "description": "Number of summaries to skip.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "canons": {
                "items": {
                  "properties": {
                    "action_statement": {
                      "type": "string"
                    },
                    "date_modified": {
                      "type": "string"
                    },
                    "jsonUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "n_constructs": {
                      "type": "integer"
                    },
                    "n_source_works": {
                      "type": "integer"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["action_statement", "jsonUrl", "n_constructs", "n_source_works", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              }
            },
            "required": ["canons", "count"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd6f6aa51d2e20ace9ab899ae9b122d02f658c6bc52b463606293e2935dc42dc"
        },
        {
          "name": "search_answers",
          "description": "Search CanonicAI answers by simple deterministic token scoring over question, shortAnswer, and answer fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum matches to return.",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Search query.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "matches": {
                "items": {
                  "properties": {
                    "citationCount": {
                      "type": "integer"
                    },
                    "id": {
                      "type": "string"
                    },
                    "jsonUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "question": {
                      "type": "string"
                    },
                    "score": {
                      "type": "integer"
                    },
                    "shortAnswer": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "format": "uri",
                      "type": "string"
                    }
                  },
                  "required": ["citationCount", "id", "jsonUrl", "question", "score", "slug", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["count", "matches", "query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:843613b3ff7a43574119532c435788c498d2c57548d3ded6ab86db7abe28b554"
        },
        {
          "name": "search_constructs",
          "description": "Search construct names and definitions across all canons (or one canon) by deterministic token scoring.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "canon": {
                "description": "Restrict to one canon slug.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum matches to return.",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Search query.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "matches": {
                "items": {
                  "properties": {
                    "canon": {
                      "type": "string"
                    },
                    "definition": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "score": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["canon", "definition", "name", "score", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["count", "matches", "query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc94fea2bd1944213349e15360b0274218b8175c01d2527658dd1022189368bb"
        }
      ],
      "digest": "sha256:7c7a3181dec345275ab60bdfb041c341530a82f9fcd1b2717d76e6503cbbd6b2"
    }
  }
}
