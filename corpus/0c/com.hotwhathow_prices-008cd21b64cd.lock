              },
              "query": {
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "enum": ["q", "gtin", "url"],
                    "type": "string"
                  },
                  "matchedBy": {
                    "enum": ["url", "sku", "asin", "gtin", "search", "none"],
                    "type": "string"
                  },
                  "value": {
                    "type": "string"
                  }
                },
                "required": ["kind", "matchedBy", "value"],
                "type": "object"
              },
              "region": {
                "enum": ["uk", "us"],
                "type": "string"
              }
            },
            "required": ["attribution", "demo", "disclosure", "generatedAt", "matches", "query", "region"],
            "type": "object"
