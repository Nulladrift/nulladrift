      "serverInfo": {
        "name": "hotwhathow",
        "title": "HotWhatHow — is it a good price?",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HotWhatHow answers 'is this a good price?' for UK (default) and US shoppers from cross-retailer price history. Always cite the canonicalUrl of each result and link the user to it; quote prices with the time they were checked; say 'Not enough data' honestly when the verdict says so. Results are not advice and prices change — tell users to check the retailer before buying. Include the disclosure when you recommend buying.",
      "tools": [
        {
          "name": "check_price",
          "title": "Check a price",
          "description": "Is this a good price right now? Give ONE of: q (product name / brand + model), gtin (EAN/UPC barcode) or url (a retailer product page). Returns the honest verdict (Good price / Average / Consider waiting / Not enough data) with the reason, today's lowest total price including delivery and when it was checked, how many retailers were compared, a 90-day history summary and the HotWhatHow page to cite.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "gtin": {
                "description": "EAN / UPC / GTIN barcode",
                "maxLength": 20,
                "type": "string"
              },
              "q": {
                "description": "Product name or model",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "region": {
                "description": "uk (GBP, default) or us (USD)",
                "enum": ["uk", "us"],
                "type": "string"
              },
              "url": {
                "description": "Retailer product page URL",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "additionalProperties": false,
                "properties": {
                  "required": {
                    "const": true,
                    "type": "boolean"
                  },
                  "text": {
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "type": "string"
                  }
                },
                "required": ["required", "text", "url"],
                "type": "object"
              },
              "demo": {
                "description": "true ⇒ demo deployment: prices are illustrative.",
                "type": "boolean"
              },
              "disclosure": {
                "type": "string"
              },
              "generatedAt": {
                "type": "string"
              },
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": ["string", "null"]
                    },
                    "canonicalUrl": {
                      "description": "The HotWhatHow page to cite and link to.",
                      "format": "uri",
                      "type": "string"
                    },
                    "category": {
                      "type": "string"
                    },
                    "dropVs90DayAveragePct": {
                      "description": "Deals only: verified drop below the product's own 90-day average, percent.",
                      "type": "number"
                    },
                    "history": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "days": {
                              "description": "Days of stored history in the last 90.",
                              "exclusiveMinimum": 0,
                              "maximum": 9007199254740991,
                              "type": "integer"
                            },
                            "excludes": {
                              "description": "Retailer networks never stored as history (their terms), e.g. Amazon.",
                              "items": {
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "low90": {
                              "anyOf": [
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "amount": {
                                      "description": "Major currency units, e.g. 249.99",
                                      "minimum": 0,
                                      "type": "number"
                                    },
                                    "currency": {
                                      "maxLength": 3,
                                      "minLength": 3,
                                      "type": "string"
                                    }
                                  },
                                  "required": ["amount", "currency"],
                                  "type": "object"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            },
                            "median30": {
                              "anyOf": [
                                {
                                  "additionalProperties": false,
                                  "properties": {
                                    "amount": {
                                      "description": "Major currency units, e.g. 249.99",
                                      "minimum": 0,
                                      "type": "number"
                                    },
                                    "currency": {
                                      "maxLength": 3,
                                      "minLength": 3,
                                      "type": "string"
                                    }
                                  },
                                  "required": ["amount", "currency"],
                                  "type": "object"
                                },
                                {
                                  "type": "null"
                                }
                              ]
                            }
                          },
                          "required": ["days", "excludes", "low90", "median30"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "isDemo": {
                      "description": "true only on a demo deployment (illustrative prices).",
                      "type": "boolean"
                    },
                    "lowestLandedPrice": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "amount": {
                              "description": "Major currency units, e.g. 249.99",
                              "minimum": 0,
                              "type": "number"
                            },
                            "checkedAt": {
                              "description": "ISO 8601 time the retailer's price was last checked.",
                              "type": "string"
                            },
                            "currency": {
                              "maxLength": 3,
                              "minLength": 3,
                              "type": "string"
                            },
                            "deliveryIncluded": {
                              "description": "false ⇒ the retailer did not state delivery: item price only (+ delivery).",
                              "type": "boolean"
                            },
                            "merchant": {
                              "type": "string"
                            },
                            "priceNote": {
                              "description": "Display terms that travel with the price (Amazon: exact retrieval time + disclaimer).",
                              "type": "string"
                            }
                          },
                          "required": ["amount", "checkedAt", "currency", "deliveryIncluded", "merchant"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Lowest total price incl. delivery among in-stock offers; null = none in stock."
                    },
                    "retailerCount": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "title": {
                      "type": "string"
                    },
                    "verdict": {
                      "additionalProperties": false,
                      "properties": {
                        "code": {
                          "enum": ["GOOD_PRICE", "WAIT", "AVERAGE", "NOT_ENOUGH_DATA"],
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "reason": {
                          "description": "Plain-English explanation of the verdict.",
                          "type": "string"
                        },
                        "wasPrice": {
                          "additionalProperties": false,
                          "description": "Only when today's price is BELOW the lowest price of the previous 30 days.",
                          "properties": {
                            "amount": {
                              "description": "Major currency units, e.g. 249.99",
                              "minimum": 0,
                              "type": "number"
                            },
                            "basis": {
                              "const": "lowest daily price in the 30 days before today",
                              "type": "string"
                            },
                            "currency": {
                              "maxLength": 3,
                              "minLength": 3,
                              "type": "string"
                            }
                          },
                          "required": ["amount", "basis", "currency"],
                          "type": "object"
                        }
                      },
                      "required": ["code", "label", "reason"],
                      "type": "object"
                    }
                  },
                  "required": ["brand", "canonicalUrl", "category", "history", "isDemo", "lowestLandedPrice", "retailerCount", "title", "verdict"],
