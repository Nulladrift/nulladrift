            "properties": {
              "_payment": {
                "description": "Optional base64 x402 PAYMENT-SIGNATURE payload. Omit to receive payment requirements.",
                "type": "string"
              },
              "key": {
                "description": "The key (required for set/get/delete/exists).",
                "type": "string"
              },
              "limit": {
                "description": "For list: max keys to return (default 100, max 500).",
                "type": "integer"
              },
              "namespace": {
                "description": "Optional group for keys (default \"default\").",
                "type": "string"
              },
              "operation": {
                "description": "What to do.",
                "enum": ["set", "get", "delete", "exists", "list"],
                "type": "string"
              },
              "ttl_seconds": {
                "description": "Optional expiry in seconds (default 30 days, max 90; 0 = no expiry).",
                "type": "integer"
              },
              "value": {
                "description": "Any JSON value to store (required for set)."
              }
