      "serverInfo": {
        "name": "agentbit",
        "title": "AgentBIT — pay-per-call tools for AI agents (x402)",
        "version": "1.7.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Every tool is pay-per-call over the x402 protocol (USDC on Base, no signup). Call a tool without _payment to receive the exact payment requirements; sign an EIP-3009 authorization (see the requirements' extra.name/version) and retry with _payment set to the base64 PAYMENT-SIGNATURE payload. Docs: https://agentbit.app/llms.txt",
      "tools": [
        {
          "name": "agentbit.address_eip55",
          "title": "EIP-55 Address Checksum",
          "description": "EIP-55 mixed-case checksum for a 20-byte EVM (Ethereum/Base) hex address, via Keccak-256. Normalize and verify addresses before a transfer. Pay-per-call via x402 (USDC, Base).",
          "inputSchema": {
            "properties": {
              "_payment": {
                "description": "Optional base64 x402 PAYMENT-SIGNATURE payload. Omit to receive payment requirements.",
                "type": "string"
              },
              "address": {
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:62713dd70c2e9d2b60ee4977b09e024ad868f9cc345bd911723486704516fb73"
        },
        {
          "name": "agentbit.agent_counter",
          "title": "Agent Counter",
          "description": "Atomic per-agent integer counter (incr/decr/get/set/reset), scoped to the paying wallet. For tallies, quotas, sequence numbers. Pay-per-call via x402 (USDC, Base).",
          "inputSchema": {
            "properties": {
              "_payment": {
                "description": "Optional base64 x402 PAYMENT-SIGNATURE payload. Omit to receive payment requirements.",
                "type": "string"
              },
              "amount": {
                "description": "Step for incr/decr (default 1).",
                "type": "integer"
              },
              "key": {
                "description": "The counter key.",
                "type": "string"
              },
              "namespace": {
                "description": "Optional group (default \"default\").",
                "type": "string"
              },
              "operation": {
                "description": "What to do.",
                "enum": ["incr", "decr", "get", "set", "reset"],
                "type": "string"
              },
              "ttl_seconds": {
                "description": "Optional expiry in seconds (max 90 days; omit for none).",
                "type": "integer"
              },
              "value": {
                "description": "Value for set.",
                "type": "integer"
              }
            },
            "required": ["key", "operation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
