        },
        {
          "name": "agentbit.agent_list",
          "title": "Agent List (Queue)",
          "description": "Private ordered list/queue for an agent: push/pop/peek/range/length/clear, scoped to the paying wallet. For task queues, event logs, buffers. Pay-per-call via x402 (USDC, Base).",
          "inputSchema": {
            "properties": {
              "_payment": {
                "description": "Optional base64 x402 PAYMENT-SIGNATURE payload. Omit to receive payment requirements.",
                "type": "string"
              },
              "count": {
                "description": "For range: how many items (default 100).",
                "type": "integer"
              },
              "end": {
                "description": "Which end to push/pop/peek (default tail).",
                "enum": ["head", "tail"],
                "type": "string"
              },
              "key": {
                "description": "The list name.",
                "type": "string"
              },
              "namespace": {
                "description": "Optional group (default \"default\").",
                "type": "string"
              },
              "operation": {
                "description": "What to do.",
                "enum": ["push", "pop", "peek", "range", "length", "clear"],
                "type": "string"
              },
              "start": {
                "description": "For range: start index (negative counts from the end).",
                "type": "integer"
              },
              "ttl_seconds": {
                "description": "Optional expiry in seconds (max 90 days).",
                "type": "integer"
              },
              "value": {
                "description": "Any JSON value to push (for push)."
              }
            },
            "required": ["key", "operation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
