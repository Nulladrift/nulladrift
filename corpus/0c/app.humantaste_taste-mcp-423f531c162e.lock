      "tools": [
        {
          "name": "arbitrate_dispute",
          "description": "Get an impartial human arbiter to decide whether a deliverable meets an agreed contract, or to settle disagreements between agents. Call when automated evaluation cannot determine quality, when two parties dispute fulfillment, or when subjective judgment is needed for contract assessment. Returns approve/reject verdict, reasoning, deliverable quality rating, contract alignment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "description": "Optional context. Use to clarify intent, constraints, audience, or anything that helps the expert evaluate.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "contractDescription": {
                "description": "The agreed contract or deliverable specification.",
                "maxLength": 3000,
                "minLength": 20,
                "type": "string"
              },
              "deliverable": {
                "description": "The deliverable to assess. Text or a publicly accessible URL.",
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "partyAPosition": {
                "description": "One side of the dispute. The expert evaluates both impartially — order is arbitrary.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "partyBPosition": {
                "description": "The other side of the dispute.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "termsHash": {
                "description": "Terms anchor this dispute is bound to: keccak256 of the att/v1 terms manifest (as echoed from the x402 payment), or an opaque 32-byte document hash such as an LCP atrHash (\"sha256:0x…\" accepted). Persisted on the ruling for the receipt + precedent lookups.",
                "pattern": "^(sha256:)?0x[0-9a-fA-F]{64}$",
                "type": "string"
              },
              "termsJson": {
                "additionalProperties": {},
                "description": "The full att/v1 terms manifest object. If provided it must be a valid manifest whose keccak256 equals termsHash.",
                "type": "object"
              },
              "termsUri": {
                "description": "Where the att/v1 manifest is hosted (https/ipfs). Convenience only — the hash is the identity.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["contractDescription", "deliverable", "partyAPosition", "partyBPosition"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "offering": {
                "type": "string"
              },
              "priceUsdc": {
                "type": "number"
              },
              "sessionId": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "tip": {
                "type": "string"
              }
            },
            "required": ["message", "offering", "priceUsdc", "sessionId", "status", "tip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:24f2ee7f4e424e1cc7f72bc2c1a315d6c661de86bb858285579e08463ae883a7"
        },
        {
          "name": "ask_a_human",
          "description": "Ask a vetted human a plain-text question and get a plain-text answer back, usually within 30 minutes. Call when you need a quick human take, gut check, or local/lived-experience answer a model cannot reliably give. No scoring, no verdict, no certificate — just a direct human response. Returns the human's answer, plus an optional note on who answered.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "question": {
                "description": "The plain-text question for a human to answer. Anything you want a quick human take on.",
                "maxLength": 5000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "message": {
                "type": "string"
              },
              "offering": {
                "type": "string"
              },
              "priceUsdc": {
                "type": "number"
              },
              "sessionId": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "tip": {
                "type": "string"
              }
            },
            "required": ["message", "offering", "priceUsdc", "sessionId", "status", "tip"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:07d43e3f9d67dc0faaaf56cf1de695cd5f6db3bbf94a83004302fb966cf42811"
        },
        {
          "name": "consult_domain_expert",
          "description": "A vetted human in a named domain answers your question with first-hand knowledge. Pass `domain` to match an expert. Pass `parentSessionId` for follow-ups (cap 3). Returns answer, anonymised role, confidence, first-hand flag. Approved answers get an on-chain Taste cert. Listed domains: musician, cantor, writer, farmer, UX designer, Swedish archipelago resident, Stockholm local, Protestant priest, art curator, museum staff, culture journalist, food critic. Other domains: best-effort 24-48h.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyerWalletAddress": {
                "description": "Optional. An EVM wallet address. If provided, you can later retrieve the deliverable on humantaste.app by connecting this wallet.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "context": {
                "description": "Optional. Why you are asking and what you are working on (essay, research, product decision, etc.). Helps the expert frame their answer.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "domain": {
                "description": "Area of expertise needed. Examples of currently listed domains: \"Professional musician\", \"Cantor\", \"Writer\", \"Farmer\", \"UX designer\", \"Person living in the Swedish Archipelago\", \"Stockholm local\", \"Protestant priest\", \"Art curator\", \"Museum staff\", \"Culture journalist\", \"Food critic\". Free-form — describe the kind of expert you need.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              },
              "parentSessionId": {
                "description": "Optional. If present, this is a follow-up question to the same expert on an existing consultation. Up to 3 follow-ups per parent. Server validates the parent is completed and within the follow-up cap.",
                "type": "string"
              },
              "question": {
                "description": "The specific question to ask the expert. Be precise — the more specific the question, the better the answer.",
                "maxLength": 3000,
                "minLength": 20,
                "type": "string"
              },
              "referenceUrls": {
                "description": "Optional. Publicly accessible URLs the expert should review before answering.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "requireListedDomain": {
                "description": "Optional. If true, the job is declined immediately when the domain is not on the supported listed-domain list, instead of being queued for best-effort sourcing.",
                "type": "boolean"
              }
            },
            "required": ["domain", "question"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "followupsRemaining": {
                "type": "number"
              },
              "message": {
                "type": "string"
              },
              "offering": {
                "type": "string"
              },
              "parentSessionId": {
                "type": "string"
              },
              "priceUsdc": {
                "type": "number"
              },
              "sessionId": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "tip": {
                "type": "string"
              }
            },
            "required": ["message", "offering", "priceUsdc", "sessionId", "status", "tip"],
            "type": "object"
