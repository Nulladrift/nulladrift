        {
          "name": "verify_certificate",
          "description": "Verify a Taste content certificate on-chain. Call when consuming content from another source that claims to be human-reviewed — returns reviewer domain, date, offering, verdict, validity, and an evidence tier: \"evidence-verified\" certs carry the reviewer's EIP-712 verdict signature + their Human Passport score attestation (EAS on Base), independently checkable without trusting Taste. Free. Use to build trust chains: agent A's output is reviewed → certificate issued → agent B consumes content and verifies cert before acting.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "certificateId": {
                "anyOf": [
                  {
                    "pattern": "^\\d+$",
                    "type": "string"
                  },
                  {
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  }
                ],
                "description": "Numeric certificate id. Provide this OR contentHash."
              },
              "contentHash": {
                "description": "keccak256 hash of the content, as 0x-prefixed hex. Provide this OR certificateId.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent": {
                "type": "string"
              },
              "certificateId": {
                "type": "string"
              },
              "contentHash": {
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "evidence": {
                "additionalProperties": false,
                "properties": {
                  "attestation": {
                    "additionalProperties": false,
                    "properties": {
                      "attester": {
                        "type": "string"
                      },
                      "expiresAt": {
                        "type": ["string", "null"]
                      },
                      "issuedAt": {
                        "type": "string"
                      },
                      "passingScore": {
                        "type": "boolean"
                      },
                      "revoked": {
                        "type": "boolean"
                      },
                      "schema": {
                        "type": "string"
                      },
                      "score": {
                        "type": "number"
                      },
                      "scorerId": {
                        "type": "string"
                      },
                      "threshold": {
                        "type": "number"
                      },
                      "validAtCertIssuance": {
                        "type": "boolean"
                      }
                    },
                    "required": ["attester", "expiresAt", "issuedAt", "revoked", "schema", "validAtCertIssuance"],
                    "type": "object"
                  },
                  "easAttestationUid": {
                    "type": "string"
                  },
                  "reason": {
                    "type": "string"
                  },
                  "reviewedAt": {
                    "type": "string"
                  },
                  "reviewer": {
                    "type": "string"
                  },
                  "sessionIdHash": {
                    "type": "string"
                  },
                  "tier": {
                    "enum": ["evidence-verified", "legacy", "unverified"],
                    "type": "string"
                  }
                },
                "required": ["tier"],
                "type": "object"
              },
              "found": {
                "type": "boolean"
              },
              "issuedAt": {
                "type": "string"
              },
              "offeringType": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              },
              "verdict": {
                "type": "string"
              }
            },
            "required": ["found"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
