          "title": "Comparar lado a lado",
          "description": "Compara de 2 a 4 seguros ou contas (ex.: Wise vs Nomad, Assist Card vs GTA).",
          "inputSchema": {
            "properties": {
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
