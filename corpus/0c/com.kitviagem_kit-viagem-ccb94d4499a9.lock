      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kit-viagem",
        "title": "Kit Viagem: seguro viagem, câmbio/conta internacional e eSIM para brasileiros",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only comparison catalog for Brazilian travelers. Tools return public, dated reference data: travel insurance plans (reference quote in BRL for a 10-day trip to Europe, the US or South America), entry rules for 24 countries (whether insurance is required, minimum coverage, visa) the estimated cost of spending money abroad with international accounts and cards (IOF tax, spread, fees) and eSIM / international data chips (category esim: reference 7-day unlimited-data package price per region, Europe, US and Argentina/South America, in US dollars converted to BRL as an estimate; plans sold per GB or per day are listed separately and are not ranked). Each result links to the provider’s official page or to a page on kitviagem.com; some of those links are affiliate links, disclosed on the site. Prices are references: the final price is always the provider’s. Answer in the user’s language and cite the date of the data.",
      "tools": [
        {
          "name": "buscar_produtos",
          "title": "Buscar seguros, contas internacionais ou eSIM",
          "description": "Busca seguros viagem, contas/cartões/câmbio ou eSIM/chip internacional por categoria (seguro, cambio, esim), texto livre, uso (europa, eua, america_sul, argentina, ilimitado...) e preço máximo em reais.",
          "inputSchema": {
            "properties": {
              "categoria": {
                "enum": ["seguro", "cambio", "esim"],
                "type": "string"
              },
              "limite": {
                "type": "integer"
              },
              "preco_max": {
                "type": "number"
              },
              "texto": {
                "type": "string"
              },
              "uso": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search travel insurance and money products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a352b7a0516d4d6bab53fabfc44d5f8126655bb244b5f0aeb9a5ef82b2ffd2ae"
        },
        {
          "name": "categorias",
          "title": "Categorias, usos e destinos",
          "description": "Lista categorias (seguro, cambio, esim), ids, usos aceitos e destinos cobertos.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Categories, use cases and destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7c92f6d87a6945b1940709b86bcac31651d203992a60ddb340c430e29d92cd3"
        },
        {
          "name": "comparar_produtos",
          "title": "Comparar lado a lado",
          "description": "Compara de 2 a 4 seguros, contas ou eSIMs (ex.: Wise vs Nomad, Assist Card vs GTA, Airalo vs Holafly).",
          "inputSchema": {
            "properties": {
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92efe81a7e361761b2fc5c8268063f1962fa3f61aac663564c29c7d33bb92e2e"
        },
        {
          "name": "custo_cambio",
          "title": "Custo de gastar dinheiro no exterior",
          "description": "Ranking de contas globais, cartões e serviços de câmbio (Wise, Nomad, C6, Inter, cartão de crédito comum, dinheiro em espécie...) pelo custo estimado para gastar um valor em dólares no exterior, com IOF e spread.",
          "inputSchema": {
            "properties": {
              "uso": {
                "description": "viagem_curta, morar_fora, intercambio, enviar_dinheiro, varias_moedas, investir_dolar, receber_do_exterior",
                "type": "string"
              },
              "valor_usd": {
                "description": "Valor a gastar em US$ (padrão 1000)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
