            "readOnly": true
          },
          "digest": "sha256:a99871a39f67036b0441fbee2ce2f6f25fa6061f17a2de1136ba1cfed067d325"
        },
        {
          "name": "ficha_produto",
          "title": "Ficha completa",
          "description": "Todos os dados de um seguro, conta ou eSIM (ex.: airalo, holafly): planos, preços com data e fonte, coberturas ou tarifas, pontos fortes e fracos e link 'comprar'.",
          "inputSchema": {
