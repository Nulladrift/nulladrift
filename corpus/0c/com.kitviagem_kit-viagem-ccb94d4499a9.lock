      "serverInfo": {
        "name": "kit-viagem",
        "title": "Kit Viagem: seguro viagem e câmbio/conta internacional para brasileiros",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only comparison catalog for Brazilian travelers. Tools return public, dated reference data: travel insurance plans (reference quote in BRL for a 10-day trip to Europe, the US or South America), entry rules for 24 countries (whether insurance is required, minimum coverage, visa) and the estimated cost of spending money abroad with international accounts and cards (IOF tax, spread, fees). Each result links to the provider’s official page or to a page on kitviagem.com; some of those links are affiliate links, disclosed on the site. Prices are references: the final price is always the provider’s. Answer in the user’s language and cite the date of the data.",
      "tools": [
        {
          "name": "buscar_produtos",
          "title": "Buscar seguros ou contas internacionais",
          "description": "Busca seguros viagem ou contas/cartões/câmbio por categoria (seguro, cambio), texto livre, uso e preço máximo em reais.",
          "inputSchema": {
            "properties": {
              "categoria": {
                "enum": ["seguro", "cambio"],
                "type": "string"
              },
              "limite": {
                "type": "integer"
              },
              "preco_max": {
                "type": "number"
              },
              "texto": {
                "type": "string"
              },
              "uso": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search travel insurance and money products"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8e0fd4a7a33bd6a7e357832fef6c6f4977d8c8fa08d20c54fec67d6d6645ed3"
        },
        {
          "name": "categorias",
          "title": "Categorias, usos e destinos",
          "description": "Lista categorias, ids, usos aceitos e destinos cobertos.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
