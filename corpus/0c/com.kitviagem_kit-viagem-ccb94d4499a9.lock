                "type": "string"
              }
            },
            "required": ["categoria"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Best products for a use case"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:635a55acef89569d47c76be821e20da579d8b3359406cb92ea078a7ed9fd5cf0"
        },
        {
          "name": "seguro_para_destino",
          "title": "Seguro viagem para um destino",
          "description": "Para um país de destino (ex.: Portugal, Estados Unidos, Argentina, Cuba, Japão): diz se o seguro é obrigatório para brasileiros, a cobertura mínima, visto, custo médico e dicas de dinheiro, e lista os seguros mais baratos (cotação de referência em reais) e as contas/cartões internacionais de menor custo.",
          "inputSchema": {
            "properties": {
              "destino": {
                "type": "string"
              },
              "idade": {
                "description": "Opcional: faixa de idade do viajante, só para filtrar planos com limite de idade (não é armazenada)",
                "type": "integer"
              }
            },
            "required": ["destino"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Travel insurance for a destination"
          },
