          },
          "digest": "sha256:1ba26fdaeb98ac885bb2e0263108020893888572a549a70667c77294d9f9cfbc"
        },
        {
          "name": "melhores_para",
          "title": "Melhores para um uso",
          "description": "Seguros, contas ou eSIMs indicados para um uso (europa, eua, america_sul, argentina, ilimitado, intercambio, mochilao, cruzeiro, familia; viagem_curta, morar_fora, enviar_dinheiro...). Para eSIM (categoria esim) com uso europa, eua ou america_sul, ordena pelo preço do pacote de 7 dias ilimitado.",
          "inputSchema": {
            "properties": {
              "categoria": {
                "enum": ["seguro", "cambio", "esim"],
                "type": "string"
              },
              "limite": {
                "type": "integer"
              },
