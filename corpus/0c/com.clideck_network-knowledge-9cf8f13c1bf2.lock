      "instructions": "Treat unknown and partial results as incomplete. Such questions are automatically recorded for priority learning. If a returned answer does not address the original question, call report_knowledge_gap with the same question, context, reason and revision_refs (report_domain_knowledge_gap for technical-operations queries). Use get_learning_status to check progress. Ask the user for missing context when learning.needs_context is true. Never claim that research or model training has completed unless status is published; this system learns verified knowledge, not model weights.",
      "tools": [
        {
          "name": "advise_network_upgrade",
          "title": "Advise Network Upgrade",
          "description": "Return exact-model, exact-version upgrade prerequisites, risks, checks, and rollback without downloading software. Missing or incomplete knowledge may create or update a tracked research demand. No device commands are executed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "current_version": {
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9()._\\-/]*$",
                "type": "string"
              },
              "enabled_features": {
                "default": [],
                "items": {
                  "maxLength": 240,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "model": {
                "maxLength": 240,
                "minLength": 1,
                "type": "string"
              },
              "operating_system": {
                "default": "IOS XE",
                "maxLength": 240,
                "minLength": 1,
                "type": "string"
              },
              "target_version": {
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9][A-Za-z0-9()._\\-/]*$",
                "type": "string"
              }
            },
            "required": ["current_version", "model", "target_version"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "applicability": {
                "additionalProperties": false,
                "properties": {
                  "current_version": {
                    "type": "string"
                  },
                  "model": {
                    "type": "string"
                  },
                  "operating_system": {
                    "type": "string"
                  },
                  "target_version": {
                    "type": "string"
                  },
                  "vendor": {
                    "type": "string"
                  }
                },
                "required": ["current_version", "model", "operating_system", "target_version", "vendor"],
                "type": "object"
              },
              "assurance": {
                "additionalProperties": false,
                "properties": {
                  "confidence": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "last_verified_at": {
                    "type": "string"
                  },
                  "validation_level": {
                    "const": "documentation_reviewed",
                    "type": "string"
                  }
                },
                "required": ["confidence", "last_verified_at", "validation_level"],
                "type": "object"
              },
              "breaking_changes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limitations": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "next_action": {
                "enum": ["use_advice", "request_expert_answer"],
                "type": "string"
              },
              "prerequisites": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "procedure": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reload_expected": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "rollback": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "security_advisories": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "applicability": {
                      "type": "string"
                    },
                    "disposition": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    }
                  },
                  "required": ["applicability", "disposition", "id"],
                  "type": "object"
                },
                "type": "array"
              },
              "status": {
                "enum": ["supported_with_checks", "blocked", "unknown"],
                "type": "string"
              },
              "verification": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["applicability", "assurance", "breaking_changes", "limitations", "next_action", "prerequisites", "procedure", "reload_expected", "rollback", "security_advisories", "status", "verification"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
