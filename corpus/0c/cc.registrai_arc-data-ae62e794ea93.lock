        {
          "name": "arc_address_label",
          "title": "Arc address: label",
          "description": "Who an address on Arc mainnet belongs to: the project or app, the address's role and the source of the label (directory entries, stablecoins, Registrai's chain scan, the contracts the Arc indices count per app). Use this when asked whose contract or address something is on Arc. No label usually means a wallet or an unnamed contract.",
