{
  "lockfileVersion": 2,
  "subjects": {
    "app.sentn/opportunity-intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://sentn-opportunity-mcp-773063283118.us-central1.run.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "SENTn Opportunity Intelligence",
        "version": "0.1.0",
        "description": "Public read-only access to SENTn's evidence-backed software opportunity snapshots for AI agents and MCP clients."
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_opportunity",
          "description": "Use when an agent already knows a SENTn opportunity ID and needs its public snapshot details and canonical SENTn URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "maxLength": 160,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e90449ddd144e4e2b94b04fc0ad2d925b339d65210f29ceeb8ee5702bd00ce1"
        },
        {
          "name": "search_opportunities",
          "description": "Use when an agent needs to browse SENTn's opportunity intelligence library, retrieve a ranked page of opportunities, optionally filter by an existing category, or continue pagination.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1110d61c6544d2f97353c215d29b844cef2083ce7136f9aabc02590bb5c49f3c"
        }
      ],
      "digest": "sha256:ef26116de641bb53aac15c6de840135ad8773ba1e01eb5309953b845181b62c2"
    }
  }
}
