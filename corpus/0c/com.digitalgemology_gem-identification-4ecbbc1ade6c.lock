        {
          "name": "compare_gemstones",
          "title": "Tell two gemstones apart",
          "description": "Two gemstones side by side, and the tests that tell them apart: refractive index, birefringence (doubling of back facets, polariscope), specific gravity, dispersion (fire), hardness, pleochroism and spectrum, each with the free tool that shows it. For questions like 'how do I tell diamond from moissanite?'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gemstone_a": {
