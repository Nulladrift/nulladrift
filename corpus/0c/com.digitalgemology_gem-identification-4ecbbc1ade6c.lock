        },
        {
          "name": "identify_gem",
          "title": "Match gem test readings",
          "description": "Match a stone's test readings against the 36 gemstones in Digital Gemology's data and rank them, saying which reading fits and which does not. Give any of: refractive index, birefringence, specific gravity, optic character, pleochroism, a spectrum line, or that the refractometer read over the limit. A match is a lead, not an identification.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "birefringence": {
                "description": "The difference between the two readings, for example 0.008; 0 for a singly refractive stone.",
                "type": "number"
              },
              "optic_character": {
                "description": "From the polariscope: singly refractive (stays dark) or doubly refractive (blinks light and dark).",
                "enum": ["singly", "doubly"],
                "type": "string"
              },
              "over_the_limit": {
                "description": "True if the refractometer showed no reading because the stone is above about 1.81.",
                "type": "boolean"
              },
              "pleochroism": {
                "description": "What the dichroscope shows: none, weak, distinct or strong.",
                "enum": ["none", "weak", "distinct", "strong"],
                "type": "string"
              },
              "refractive_index": {
                "description": "A refractometer reading, for example 1.765.",
                "type": "number"
              },
              "specific_gravity": {
                "description": "Specific gravity, for example 4.0.",
                "type": "number"
              },
              "spectrum_line_nm": {
                "description": "A line or band seen in a hand spectroscope, in nanometres, for example 694.",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
