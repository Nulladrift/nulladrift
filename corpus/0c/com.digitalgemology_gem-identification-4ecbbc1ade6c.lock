        {
          "name": "gem_properties",
          "title": "Gemstone properties",
          "description": "Everything Digital Gemology has on one gemstone: refractive index (both rays for doubly refractive stones), birefringence, dispersion, specific gravity, hardness, crystal system, critical angle, what a refractometer, polariscope and dichroscope show, its pleochroic colors and the lines and bands a hand spectroscope shows, with links to the free tools. For the seven stones our tools model the values are the tools' own; for the others they are published reference values, with their sources. Also which stone's ray-traced cut scores apply to it (cut_scores_from, cut_scores_url), or why it has none (cut_scores_note).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gemstone": {
                "description": "Gemstone, as its slug.",
                "enum": ["diamond", "moissanite", "cubic-zirconia", "ruby", "sapphire", "emerald", "amethyst", "aquamarine", "morganite", "tanzanite", "topaz", "tourmaline", "pyrope", "almandine", "spessartine", "grossular", "demantoid", "spinel", "peridot", "citrine", "quartz", "opal", "jadeite", "nephrite", "turquoise", "chrysoberyl", "alexandrite", "zircon", "kunzite", "iolite", "moonstone", "yag", "ggg", "strontium-titanate", "glass", "synthetic-rutile"],
                "type": "string"
              }
            },
            "required": ["gemstone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Gemstone properties"
          },
          "behavior": {
