      "instructions": "Gemological properties and identification for 36 gemstones. Seven come from the data behind Digital Gemology's free Refractometer, Dichroscope, Spectroscope and Polariscope: diamond, moissanite, cubic zirconia, ruby, sapphire, emerald and amethyst. 29 more have published reference values with their sources (data 'reference'): colored stones such as aquamarine, tanzanite, spinel and the garnets, and diamond simulants such as YAG, GGG and strontium titanate. Use gem_properties for one stone's constants, pleochroism and spectrum, identify_gem to match readings (refractive index, birefringence, specific gravity, optic character, pleochroism, a spectrum line) against all of them, compare_gemstones for how to tell two apart (for example diamond or moissanite), and absorption_spectrum for what a hand spectroscope shows. A match is a lead, not an identification, and a laboratory report is the proof. Link people to the stone's page and the free tool that shows the test. Cut scores (brilliance, fire, scintillation and more, ray traced) exist for 30 of these stones: each stone's cut_scores_from, cut_scores_url and cut_scores_note say which stone's figures apply and where; the cut library server at /mcp scores cuts in them.",
      "tools": [
        {
          "name": "absorption_spectrum",
          "title": "Absorption spectrum",
          "description": "What a hand spectroscope shows for one gemstone: each absorption line and band with its position in nanometres, its cause (for example Cr3+ in ruby) and what it looks like, from Digital Gemology's Spectroscope or, for the stones it does not model, published references.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "gemstone": {
                "description": "Gemstone, as its slug.",
                "enum": ["diamond", "moissanite", "cubic-zirconia", "ruby", "sapphire", "emerald", "amethyst", "aquamarine", "morganite", "tanzanite", "topaz", "tourmaline", "pyrope", "almandine", "spessartine", "grossular", "demantoid", "spinel", "peridot", "citrine", "quartz", "opal", "jadeite", "nephrite", "turquoise", "chrysoberyl", "alexandrite", "zircon", "kunzite", "iolite", "moonstone", "yag", "ggg", "strontium-titanate", "glass", "synthetic-rutile"],
