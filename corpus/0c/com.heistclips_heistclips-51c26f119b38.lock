{
  "lockfileVersion": 2,
  "subjects": {
    "com.heistclips/heistclips": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://heistclips.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "heistclips",
        "title": "heistclips – GTA 6 clipping",
        "version": "0.1.0",
        "websiteUrl": "https://heistclips.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Clipping data for people who cut streams into Shorts/TikToks/Reels for money. rank_campaigns answers which campaign pays most per clip; find_moments finds the moments worth clipping in a Twitch stream. Quote numbers exactly as returned and link the page/cut_it URLs.",
      "tools": [
        {
          "name": "campaign_details",
          "title": "One clipping campaign in detail",
          "description": "Everything known about one clipping campaign: rates per platform, cap, budget left and runway, approved clips, views, typical earnings per clip, and its brief. Pass the campaign id, slug or a heistclips/Content Rewards URL from rank_campaigns.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "campaign": {
                "description": "Campaign id, slug or URL",
                "type": "string"
              }
            },
            "required": ["campaign"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Campaign details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1282df646067d62a09352b772d8e7dcb853a9478f5f2b48f1aa96e248ff17a7f"
        },
        {
          "name": "find_moments",
          "title": "Find clip-worthy moments in a Twitch stream",
          "description": "Finds the moments a Twitch stream's chat exploded (chat speed vs its normal pace, 'clip it' requests, clips viewers already made), and returns timestamps, a suggested clip window, event type, 3-5 hook lines, and music-claim risk (Twitch muted that audio for licensed music). Pass a Twitch or Kick channel (uses the live stream if live, else the latest one; Kick as kick.com/<name>) or a VOD link. A 7-hour stream takes about 15-40 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many moments (default 8)",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "source": {
                "description": "Twitch channel name or URL, a Kick channel URL (kick.com/<name>), or a VOD URL (twitch.tv/videos/… or kick.com/<name>/videos/…)",
                "type": "string"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find moments"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5cc022633892f12cffbfcf95af21ebaeef68da71768319334f72c1dd81f530dc"
        },
        {
          "name": "list_feature_requests",
          "title": "heistclips feature requests",
          "description": "The public heistclips feature-request board: every request with its upvotes and status (requested, building, shipped), most upvoted first. Use before request_a_feature to find an existing request to upvote instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "status": {
                "description": "Only this status",
                "enum": ["requested", "building", "shipped"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List feature requests"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0f4403a948e9886dc63ceba8523705afff753bef4c643b770b752b6d01f31426"
        },
        {
          "name": "live_gta_streams",
          "title": "Who is streaming GTA right now",
          "description": "Twitch and Kick channels streaming GTA (GTA VI and GTA V) right now, by viewers, each with a heistclips link to find its moments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many (default 15)",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Live GTA streams"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:085591401a4bfcc5da95a023130fa2a056e1e8b668a1b4cbb5dd7bc3fb22a99e"
        },
        {
          "name": "rank_campaigns",
          "title": "Rank clipping campaigns by pay per clip",
          "description": "Live clipping campaigns (people paying for Shorts/TikTok/Reels clips of streams) ranked by what a typical approved clip has actually earned, with rate per 1,000 views, cap per clip, budget left and days of budget left. Use for 'which GTA 6 clipping campaign pays most', 'best clipping campaigns right now'. Data refreshes every 30 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "filter": {
                "description": "gta = GTA campaigns only; gaming = gaming and streamer campaigns (default); all = every campaign",
                "enum": ["gta", "gaming", "all"],
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Only campaigns that pay on this platform",
                "enum": ["tiktok", "youtube", "instagram", "x"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Rank clipping campaigns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ea907027d9e097d4cdf3af09a4541f71d766f68898443fa2c8c59d9eb57c91cc"
        },
        {
          "name": "request_a_feature",
          "title": "Request a heistclips feature",
          "description": "Files a feature request on heistclips' public board (heistclips.com/requests) and emails the person who builds it. Use when the user wants heistclips or this connector to do something it does not: a platform, a layout, captions, alerts, a campaign source. Pass their words VERBATIM as `title` (short) and optional `detail`; pass `contact` only if they offer an email or handle, exactly as written. Ask first if you do not know what they want. Tell them it was filed only if ok is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "contact": {
                "description": "Optional: email or handle for a reply, verbatim, only if offered",
                "type": "string"
              },
              "detail": {
                "description": "Optional: what they were trying to do",
                "type": "string"
              },
              "title": {
                "description": "What they want, in their own words, under 90 characters",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a feature"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ce03a9aa8a069d055ca53325e54474534df0a68cdff726755d26a087c7b0ea9a"
        },
        {
          "name": "upvote_feature_request",
          "title": "Upvote a heistclips feature request",
          "description": "Adds one upvote to a request on the heistclips board, by id from list_feature_requests. One vote per caller; repeat calls do not add more.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Request id from list_feature_requests",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Upvote a feature request"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a83dfca82ef568f42c9a2de70886e6d3408339258c2831000f2115d75d49637f"
        }
      ],
      "digest": "sha256:0e8fc52d41a25381d220eff3b4e51d9e406be834de57e21f8a4d1c1500f3f116"
    }
  }
