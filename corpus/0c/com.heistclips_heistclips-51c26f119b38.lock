        {
          "name": "find_clip_moments",
          "title": "Find the best moments to clip in a Twitch, Kick or YouTube stream (live or VOD)",
          "description": "Finds the highlights worth clipping in a Twitch, Kick or YouTube stream of any game or category (Just Chatting included), live or a VOD, by reading chat: where chat exploded against its normal pace, 'clip it' requests, clips viewers already made. Returns timestamps, a clip window, event type, 3-5 hook lines for the first second, music-claim risk, spoiler risk (skip_spoilers leaves those out, for campaigns that ban story spoilers), and a cut_it link that opens the moment ready to render as a 9:16 clip for TikTok, Shorts or Reels. Answers 'best moments in xQc's stream', 'find highlights in this VOD', 'what should I clip from kick.com/<name>', 'clip this stream', 'the funniest moments in this long VOD'. Pass prefer 'funny' for the stretches chat laughed at, across the whole stream including a long VOD, instead of only the loudest spikes. Takes a Twitch channel or just the streamer's name (the live stream if live, else the latest), a Kick channel as kick.com/<name>, a VOD link or id, a Twitch clip link (its whole stream is read), or a YouTube stream link or channel (youtube.com/watch?v=…, youtube.com/@name). YouTube moments come from live chat for a live stream (read from the first call on) and from viewers' timestamped comments for a finished one; YouTube cannot be cut on heistclips' server, so its cut_it link opens the editor for the user's own copy of the video. Chat in any language works (German, Spanish, Portuguese…). A long Twitch stream takes 5-20 seconds and a stream that was read before answers at once; Kick takes about 2 minutes the first time. If the source cannot be read the result has found: false with the reason and channels that are live now; the same source gives the same answer again.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many moments (default 8)",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "prefer": {
                "description": "funny = the moments chat laughed at, across the whole VOD including a long one, ranked by laughs. best = where chat sped up (default). If chat never laughed in a burst, funny returns the loudest moments and says so.",
                "enum": ["best", "funny"],
                "type": "string"
              },
              "skip_spoilers": {
                "description": "true = leave out moments that look like story spoilers (chat warns about spoilers, talks about the ending, or reacts to a story scene), for campaigns that ban spoilers. Skipped moments come back in skipped_spoilers with the reason. Default false: every moment is returned with a spoiler_risk field.",
                "type": "boolean"
              },
              "source": {
                "description": "Twitch channel name or URL, a Kick channel URL (kick.com/<name>), a VOD URL (twitch.tv/videos/… or kick.com/<name>/videos/…), a Twitch clip URL, or a YouTube stream or channel URL (youtube.com/watch?v=…, youtu.be/…, youtube.com/@name)",
                "type": "string"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find moments"
          },
          "behavior": {
