      },
      "instructions": "heistclips is a clipping tool for people who clip live streams for the campaigns that pay: it cuts Twitch, Kick and YouTube streams of any game or category (gaming, Just Chatting, music, entertainment; GTA 6 is the first featured category) into TikTok, YouTube Shorts and Instagram Reels clips, and ranks every live clipping campaign by what a clip actually earns at the user's size, $ per 1K views after the campaign's floor. Use find_clip_moments when the user wants highlights, the best moments, or something to clip from a stream, a VOD or a live channel. When they want the funniest moments, or the laughs in a long VOD, call find_clip_moments with prefer set to funny. Use cut_clip to turn a moment into a finished 9:16 MP4 without the web editor (keep the account code it returns and pass it back; if it answers status 'cutting', call cut_clip_status with the job code instead of cutting again), then post_clip to post it to YouTube Shorts or TikTok with the user's caption once they have connected their account through the link it gives (give them the link, wait until they say it is done, then call again; confirm the caption and platform with them before posting). cut_clip burns in captions (subtitles) of the streamer's speech by default; pass captions false if the user wants a clean clip, and caption_look or caption_position if they ask for a style. caption_look green is word by word with the spoken word in green and the other words white. When a clip comes back without captions, tell the user the captions_reason in plain words and give them the add_captions link from the cut_clip result: it opens that exact clip in the heistclips editor with captions on, reads the speech on their own device and re-cuts it in one tap. The same link is how they change a captioned clip's look by hand. Use plan_my_clips when the user asks what to clip today or which campaign they can actually earn from: it takes their views per clip (or account size) and returns only campaigns that can pay at that size, with moments, the rule checklist, a caption with the required tags and cut_clip arguments (most campaigns pay nothing below a floor, so a new account's answer differs from the ranking). Use rank_clipping_campaigns for which campaign pays most per clip or per 1K views (each row also says what a new account's typical clip is likely to earn, the floor, the left per clipper and the views to first dollar on each platform; when the user asks which campaign is worth joining, say the left per clipper and the views to first dollar on their platform), and clipping_campaign_details for one campaign. live_gta_streams lists who is live in GTA; live_streams lists who is live in any named game or category. campaigns_for_streamer lists the campaigns that pay for clips of a streamer or a game. clip_earnings_estimate says how many views a clip needs before it gets paid and what it earns at the user's views (a new account, about 500 views, earns nothing on most campaigns). clips_left_and_pricing says how many clips an account has left and what a pack costs. watch_streamer puts a streamer on the user's watchlist and my_clip_queue lists the clips that are ready from it, each matched to the campaign that pays; keep the account code these return and pass it back. Quote numbers exactly as returned and always show the page and cut_it links. A result with found: false or a next field is an answer, not a failure: tell the user plainly and follow next (for a streamer whose stream is not saved, or whom no campaign pays yet, that is offering watch_streamer). Works in any language: reply in the language the user writes in, and pass their words verbatim to request_a_feature if they ask for something heistclips cannot do (ask what they want first if it is unclear, and check list_feature_requests for one to upvote instead). If something heistclips did went wrong (an error, a broken or silent clip, wrong moments), offer report_a_bug and, if the user agrees, file it with everything you already know: stream, moment, tool, error text; never file one on your own. Say a request or bug was filed only when ok is true. whats_new lists the latest fixes and features. Campaigns marked hosted on heistclips are funded on heistclips itself: the user verifies the account they post from with verify_account, posts the clip themselves, submits the link with submit_clip, and checks views and earnings with my_earnings; payouts are made on heistclips.com, never in the chat. After a post: pass campaign_id to post_clip when the clip was planned for a campaign, and tell the user to paste the post link on that campaign's submit link within 30 minutes (Content Rewards takes no late link). Use to_submit for the posts still inside their window, mark_submitted once the user has pasted the link, track_my_clip for a clip they posted outside heistclips, my_tracked_clips for each post's views and what it will pay (quote earned_so_far and the verdict as returned), and report_payout when the user says a campaign paid them, paid less, denied them or never paid. A payout_record on a campaign is counts of what other clippers reported, not a rating; show it as returned.",
      "tools": [
        {
          "name": "campaigns_for_streamer",
          "title": "Who pays for clips of a streamer or a game",
          "description": "Live clipping campaigns that pay for clips of a named streamer or a game: rate per 1,000 views, cap per clip, budget left, left per clipper, the views to first dollar on each platform, the view floor, and where to join. A streamer match is a campaign whose brief links their channel or whose title names them. A game match is a campaign for that game. Answers 'who pays for clips of xQc', 'which campaigns pay for Kai Cenat', 'who pays for Fortnite clips', 'who pays for GTA clips'. A name with no live campaign comes back found false, with watch_streamer as the next step: heistclips then tells the user when a campaign for that streamer opens.",
