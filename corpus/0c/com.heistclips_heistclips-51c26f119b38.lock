        {
          "name": "report_a_bug",
          "title": "Report a heistclips bug: something broke or came out wrong",
          "description": "Files a bug report on heistclips' public board (heistclips.com/requests, tagged Bug) and emails the person who fixes it. Use when something heistclips did went wrong: a clip with no sound or a black or empty video, a render or export that failed or got stuck, a cut_clip or find_clip_moments error, wrong moments, a post that did not arrive, a broken page. Only file when the user asks or agrees; never on your own. Include everything you already know from this chat so nobody has to ask again: the stream, the start and end of the moment, which tool or step failed, the exact error text returned, the clip_id and the account code if there are any. Pass the user's words VERBATIM as title and what_happened, in their language. Not for wishes: a missing feature goes to request_a_feature. Tell them it was filed only if ok is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "account": {
                "description": "The account code (hc_…) if the user has one. Sent to the builder only, never shown on the board.",
                "type": "string"
              },
              "client": {
                "description": "Which assistant this is, e.g. Claude, ChatGPT, Grok",
                "type": "string"
              },
              "clip_id": {
                "description": "clip_id from cut_clip, if the bug is about a clip that was made",
                "type": "string"
              },
              "contact": {
                "description": "Optional: email or handle for a reply, verbatim, only if offered. Sent to the builder only.",
                "type": "string"
              },
              "error_text": {
                "description": "The exact error text heistclips returned or showed, if any",
                "type": "string"
              },
              "expected": {
                "description": "What they expected to happen",
                "type": "string"
              },
              "failure": {
                "description": "The kind of failure",
                "enum": ["error_returned", "wrong_result", "empty_or_broken_file", "timeout", "other"],
                "type": "string"
              },
              "moment_end": {
                "description": "End of the moment, seconds into the stream",
                "type": "number"
              },
              "moment_start": {
                "description": "Start of the moment, seconds into the stream",
                "type": "number"
              },
              "source": {
                "description": "The stream: a Twitch or Kick VOD link or id, or the channel",
                "type": "string"
              },
