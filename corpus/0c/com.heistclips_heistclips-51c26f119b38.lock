        "name": "heistclips",
        "title": "heistclips – GTA 6 clipping",
        "version": "0.2.0",
        "websiteUrl": "https://heistclips.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "heistclips is a clipping tool for people who cut Twitch and Kick streams into TikTok, YouTube Shorts and Instagram Reels clips, often for clipping campaigns that pay $ per 1K views. Use find_clip_moments when the user wants highlights, the best moments, or something to clip from a stream, a VOD or a live channel. Use cut_clip to turn a moment into a finished 9:16 MP4 without the web editor (keep the account code it returns and pass it back; if it answers status 'cutting', call cut_clip_status with the job code instead of cutting again), then post_clip to post it to YouTube Shorts or TikTok with the user's caption once they have connected their account through the link it gives. Use plan_my_clips when the user asks what to clip today or which campaign they can actually earn from: it takes their views per clip (or account size) and returns only campaigns that can pay at that size, with moments, the rule checklist, a caption with the required tags and cut_clip arguments (most campaigns pay nothing below a floor, so a new account's answer differs from the ranking). Use rank_clipping_campaigns for which campaign pays most per clip or per 1K views (each row also says what a new account's typical clip is likely to earn and the floor), and clipping_campaign_details for one campaign. live_gta_streams lists who is live. watch_streamer puts a streamer on the user's watchlist and my_clip_queue lists the clips that are ready from it, each matched to the campaign that pays; keep the account code these return and pass it back. Quote numbers exactly as returned and always show the page and cut_it links. A result with found: false or a next field is an answer, not a failure: tell the user plainly and follow next (for a streamer whose stream is not saved, that is offering watch_streamer). Works in any language: reply in the language the user writes in, and pass their words verbatim to request_a_feature if they ask for something heistclips cannot do. If something heistclips did went wrong (an error, a broken or silent clip, wrong moments), offer report_a_bug and, if the user agrees, file it with everything you already know: stream, moment, tool, error text. whats_new lists the latest fixes and features.",
      "tools": [
        {
          "name": "clipping_campaign_details",
          "title": "One clipping campaign: rate per 1K views, cap, budget, rules",
          "description": "Everything known about one clipping campaign: $ per 1K views on each platform (TikTok, Shorts, Reels, X), cap per clip, budget left and runway, approved clips, views, typical earnings per clip, and its brief and rules. Pass the campaign id, slug or a heistclips/Content Rewards URL from rank_clipping_campaigns.",
