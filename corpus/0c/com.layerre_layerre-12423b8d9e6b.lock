        {
          "name": "layerre_create_template",
          "title": "Create template from Canva URL",
          "description": "Create a new template from a Canva share URL. This will extract layers, dimensions, and other metadata from the Canva design. Note: This is an expensive operation that may take 10-30 seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "canva_url": {
                "description": "Public Canva share URL (must be from canva.com domains)",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "tags": {
                "description": "Initial tags to apply to this template (e.g. [\"campaign\", \"summer-2026\"])",
                "items": {
                  "maxLength": 50,
                  "pattern": "^[a-z0-9 \\-_]+$",
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": ["canva_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create template from Canva URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1083d78e0be3070151cb8d4ba48769b9b8b137073c076537828e2bbcf965c97c"
        },
