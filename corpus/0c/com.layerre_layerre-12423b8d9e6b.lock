        {
          "name": "layerre_create_layer",
          "title": "Create layer",
          "description": "Create a new layer (text or image) for a template. Layer type is inferred from properties if not specified.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "layer_type": {
                "description": "Layer type (inferred from properties if not provided)",
                "enum": ["text", "image"],
                "type": "string"
              },
              "name": {
                "description": "Layer name (default: \"New Layer\")",
                "maxLength": 100,
                "type": "string"
              },
              "properties": {
                "additionalProperties": true,
                "description": "Layer properties (text, img_url, styling, etc.)",
                "properties": {
                  "color": {
                    "maxLength": 7,
                    "type": "string"
                  },
                  "flip_horizontal": {
                    "type": "boolean"
                  },
                  "flip_vertical": {
                    "type": "boolean"
                  },
                  "font_name": {
                    "maxLength": 100,
                    "type": "string"
                  },
                  "font_size": {
                    "maximum": 2000,
                    "minimum": 1,
                    "type": "number"
                  },
                  "font_style": {
                    "additionalProperties": false,
                    "properties": {
                      "italic": {
                        "type": "boolean"
                      },
                      "underline": {
                        "type": "boolean"
                      },
                      "weight": {
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "height": {
                    "maximum": 10000,
                    "minimum": 1,
                    "type": "number"
                  },
                  "image_fit": {
                    "enum": ["cover", "contain"],
                    "type": "string"
                  },
                  "img_url": {
                    "maxLength": 512000,
                    "type": "string"
                  },
                  "letter_spacing": {
                    "maximum": 800,
                    "minimum": -200,
                    "type": "number"
                  },
                  "line_spacing": {
                    "maximum": 2500,
                    "minimum": 500,
                    "type": "number"
                  },
                  "opacity": {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "number"
                  },
                  "rotation": {
                    "maximum": 360,
                    "minimum": -360,
                    "type": "number"
                  },
                  "text": {
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "text_align": {
                    "enum": ["left", "center", "right", "justify"],
                    "type": "string"
                  },
                  "text_direction": {
                    "const": "rtl",
                    "type": "string"
                  },
                  "vertical_align": {
                    "type": "string"
                  },
                  "width": {
                    "maximum": 10000,
                    "minimum": 1,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "template_id": {
                "description": "The UUID of the template to add the layer to",
                "format": "uuid",
                "type": "string"
              },
              "x": {
                "description": "X position in pixels (default: 0)",
                "maximum": 10000,
                "minimum": -10000,
                "type": "number"
              },
              "y": {
                "description": "Y position in pixels (default: 0)",
                "maximum": 10000,
                "minimum": -10000,
                "type": "number"
              }
            },
            "required": ["template_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
