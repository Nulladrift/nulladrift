        {
          "name": "layerre_update_layer",
          "title": "Update layer",
          "description": "Update layer properties like position, text content, image URL, styling, etc. Triggers background preview regeneration.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "layer_id": {
                "description": "The UUID of the layer to update",
                "format": "uuid",
                "type": "string"
              },
              "name": {
                "description": "New layer name",
                "maxLength": 100,
                "type": "string"
              },
              "position": {
                "description": "Z-order position (0=bottom/back, higher=top/front)",
                "maximum": 1999,
                "minimum": 0,
                "type": "integer"
              },
              "properties": {
                "additionalProperties": true,
                "description": "Updated layer properties",
                "properties": {
                  "color": {
                    "maxLength": 7,
                    "type": "string"
                  },
                  "flip_horizontal": {
