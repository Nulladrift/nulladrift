{
  "lockfileVersion": 2,
  "subjects": {
    "com.stayotter/stay-otter": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://stayotter.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stay-otter",
        "version": "1.4.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Stay Otter does three things: vetted stays, ground intelligence (the block around each stay, measured on the map) and price monitoring (before and after booking). It finds verified places to stay and shows its work. Use search_stays for a traveler's dates, party and wishes; it fetches live listings from Booking.com, Vrbo and Expedia Group for the dates, keeps top-rated entire places (stayType \"entire\", the default), hotel rooms (\"hotel\"), both side by side (\"any\") or resorts (\"resort\"), verifies each finalist against the map and returns picks with receipts: the all-in total and when it was quoted, venues within a ten-minute walk, whether the street is quiet or lively, the nearest stop when walkTo includes transit, the cancellation window. Searches take 30 to 90 seconds; if the result says \"running\", call get_stay with the searchId after ~20 seconds. A trip is one place, one set of dates, one party: refinements of it (call search_stays again with the same where, dates and party and different wishes) are free and, within three hours, come back in seconds (a switch between homes and hotels reads the sites fresh); without a key a connection gets 3 trips, a key's free account 5 a month, Pro no cap. city_picks is instant and free for the covered cities. get_activities lists things to do for a search or a place. check_listing reads a place the traveler found themselves (a Booking.com, Vrbo or Expedia page, or a hotel's name and city) into the same receipts; it needs a key (one a day free, Pro unlimited). watch_booking takes a booking confirmation's text and watches the property's rate until the free-cancellation deadline, with reminders 7, 3 and 1 days before; it needs a key and is free. A single whole home can't get cheaper once booked, so for one, watch_similar_homes watches other whole homes nearby for the same dates (free, until the deadline). A spot named in nearLandmark is placed near the city searched; one far from the center (a stadium, a theme park) moves the search to the area around it, and the card's notes say so. set_alert needs a key and starts daily price-drop alerts on a search (the first alert is free with an account, more are Pro). Pro is free for 30 days with no card, then $5.99 a month or $49 a year; a $9 trip pass covers one trip until check-in. Stay Otter never books anything: give the traveler the openUrl links, which open the booking site's own page for those dates (prices are the site's own, Stay Otter adds no fee or markup, and the site may pay Stay Otter a referral fee when the traveler books through the link: same price either way, ranking never depends on it), and share a pick with its stayUrl and shareText. Quote totals with their dates and say when they were checked.",
      "tools": [
        {
          "name": "check_listing",
          "title": "Check a listing the traveler found",
          "description": "Reads one place the traveler found themselves into the receipts a pick carries: where it is, whether the street is quiet or lively, bars, cafés and restaurants within a ten-minute walk, the distance to a spot they name and, with dates, the lowest total and the lowest they can still cancel, each read now. Takes a Booking.com, Vrbo or Expedia property page, or a hotel's name and city; Airbnb pages cannot be read. Needs a key: one check a day free, Pro up to thirty. 5 to 60 seconds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 16,
                "minimum": 1,
                "type": "integer"
              },
              "checkIn": {
                "description": "YYYY-MM-DD; with checkOut, prices are read too",
                "type": "string"
              },
              "checkOut": {
                "type": "string"
              },
              "city": {
                "maxLength": 80,
                "type": "string"
              },
              "spot": {
                "description": "A place they will walk to: 'Rainey Street', 'the convention center'",
                "maxLength": 120,
                "type": "string"
              },
              "text": {
                "description": "A property page URL, or a hotel's name with its city after a comma: 'Hilton Austin, Austin'",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a listing the traveler found"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b1169c6b36dcbfbbe61bc4ca07392513314fab045778dfea82a17db96eba4078"
        },
        {
          "name": "city_picks",
          "title": "Today's verified picks for a covered city",
          "description": "Instant and free: the latest finished standard search for one of the covered cities, about six weeks out, refreshed on a rota: whole homes for two adults and five nights in most cities, a six-adult weekend in New Orleans, Miami, Las Vegas, South Lake Tahoe, Sedona; stayType \"hotel\" gives the hotel-room trip (two adults, three nights) where one exists (Austin, Lisbon, Kyoto, Mexico City, New York, Paris, Barcelona, Montreal, San Diego, Edinburgh, Honolulu, London, Nashville, Scottsdale, New Orleans, Miami, Las Vegas, South Lake Tahoe, Sedona). Covered: Austin, Lisbon, Kyoto, Mexico City, New York, Paris, Barcelona, Montreal, San Diego, Edinburgh, Honolulu, London, Nashville, Scottsdale, New Orleans, Miami, Las Vegas, South Lake Tahoe, Sedona, Holbox, Niagara-on-the-Lake, Bentonville, Knoxville, Asheville, Canmore, Coeur d'Alene, Broken Bow, Lancaster, Ann Arbor, Da Nang, Hoi An. beachWeek gives the Beach Week Board instead: Playa del Carmen, Cancún, Punta Cana, one January week (2 adults, 5 nights from 2027-01-14) searched every Thursday, its picks grouped by area at stayotter.com/board. For other places or specific dates use search_stays.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "beachWeek": {
                "description": "true for the Beach Week Board's January week in Playa del Carmen, Cancún or Punta Cana",
                "type": "boolean"
              },
              "city": {
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "stayType": {
                "description": "hotel for the hotel-room trip; whole homes by default",
                "enum": ["entire", "hotel"],
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Today's verified picks for a covered city"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f47ae1b6f00f14f8c5afdd11ab35606002c316b76293736ee359a41cd74bc035"
        },
        {
          "name": "get_activities",
          "title": "Things to do",
          "description": "Top-rated things to do on Viator for a search's spot and dates (what the trip is for first, the city's best otherwise), with a second place to look when the row is thin. Pass a searchId from search_stays or city_picks; intent overrides the search's own.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "intent": {
                "description": "Override: 'kayaking', 'food tour'",
                "maxLength": 80,
                "type": "string"
              },
              "searchId": {
                "pattern": "^s_[0-9a-f]{8,32}$",
                "type": "string"
              }
            },
            "required": ["searchId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Things to do"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f139aef6765e5d122e92e3a17d93a5a748bffef7978f5ca78b076c6eee48642c"
        },
        {
          "name": "get_block",
          "title": "The block around a pick",
          "description": "Ground intelligence for one stay from a finished search: every bar and pub, café, restaurant and grocery within a ten-minute walk (counts, with + when the map read was capped in a dense center), the nearest stop and the walk to it, and map facts for walking back at night (bars within five minutes, the main road, the walk from the traveler's spot). Facts only: no crime figures, no safety rating. The same block is drawn as a map on the pick's stayUrl. Free; usually instant, a few seconds the first time a stay is asked about. Method: https://stayotter.com/ground.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "searchId": {
                "description": "The searchId from search_stays or get_stay",
                "pattern": "^s_[0-9a-f]{8,32}$",
                "type": "string"
              },
              "sourceId": {
                "description": "The pick's sourceId from the card",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["searchId", "sourceId"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "The block around a pick"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2ef526e93fb1e138537a1a046ddc13cbf4ae682b6c03e3eaaa4c7a5c17b5b30e"
        },
        {
          "name": "get_stay",
          "title": "Get a stay card",
          "description": "The card for a search by searchId: finished picks with receipts, or its running status. Free and instant. Use it to finish a search_stays call that returned 'running', or to read a shared stay (https://stayotter.com/stay/s_…). Each pick's stay card page on the site also draws the block (venues by kind, groceries, nearest stop) and lists map facts for walking back at night; the method is at https://stayotter.com/ground. For a group deciding together, https://stayotter.com/vote/<searchId> is a no-account vote page on the picks.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "searchId": {
                "description": "The searchId from search_stays, or the id in a stayotter.com/stay/s_… link",
                "pattern": "^s_[0-9a-f]{8,32}$",
                "type": "string"
              },
              "travellerCountry": {
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["searchId"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get a stay card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b5d9b2e3f345c3348a552743356d3d64594c515f6c38a0680f1198b2c3fd4081"
        },
        {
          "name": "search_stays",
          "title": "Search stays with receipts",
          "description": "Live search of Booking.com, Vrbo and Expedia Group (hotel rooms) for the dates and party, verified against the map. Returns up to three picks (best overall, best value, closest) with receipts and tracked openUrl links. Picks within about a minute and the fine print after that, stopping at two and a half minutes; returns status 'running' with a searchId if it is not done within waitSeconds. Three trips on the house per connection, then a key (free account: five a month; Pro: unlimited).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "budget": {
                "default": "mid",
                "description": "Super-cheap brands (Motel 6, Econo Lodge and the like) are out on every budget. value = cheapest that passes, mid = balanced, splurge = the nicest (ranked on star class and reviews, not price; no hotel under four stars or from an economy or limited-service brand; mid has none under three)",
                "enum": ["value", "mid", "splurge"],
                "type": "string"
              },
              "checkIn": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "checkOut": {
                "description": "YYYY-MM-DD, 1 to 90 nights after checkIn (Booking.com is skipped past 30 nights; Vrbo quotes longer stays)",
                "type": "string"
              },
              "children": {
                "default": 0,
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "flexDays": {
                "anyOf": [
                  {
                    "const": 0,
                    "type": "number"
                  },
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 3,
                    "type": "number"
                  },
                  {
                    "const": 7,
                    "type": "number"
                  }
                ],
                "default": 0,
                "description": "Date flexibility for the alert watcher: 0, 1, 2, 3 or 7 days"
              },
              "hotelBrands": {
                "description": "Hotel loyalty: keep hotel picks inside these groups (marriott, hilton, hyatt, ihg, accor, wyndham, choice, bestwestern); whole homes are unaffected",
                "items": {
                  "enum": ["marriott", "hilton", "hyatt", "ihg", "accor", "wyndham", "choice", "bestwestern"],
                  "type": "string"
                },
                "type": "array"
              },
              "intent": {
                "description": "What the trip is for, in the traveler's words: 'kayaking', 'a cooking class', 'a quiet writing week'. Steers things to do, never the ranking.",
                "maxLength": 80,
                "type": "string"
              },
              "maxPerNightUsd": {
                "description": "Hard cap per night in US dollars, all-in (taxes and fees included); kept per night, so the stay total follows the dates. Use instead of maxTotalUsd when the traveler gives a nightly figure (the top of a range).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "maxTotalUsd": {
                "description": "Hard cap on the whole-stay total in US dollars, taxes and fees included",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "nearLandmark": {
                "description": "A place the traveler wants to be near: 'Zilker Park', 'the old town', 'Shinkansen station'",
                "maxLength": 80,
                "type": "string"
              },
              "pets": {
                "default": false,
                "description": "A pet is coming: only listings whose own policy allows pets",
                "type": "boolean"
              },
              "quietStreet": {
                "default": false,
                "type": "boolean"
              },
              "stayType": {
                "default": "entire",
                "description": "entire = whole apartments and houses (default); hotel = hotel rooms (Booking.com and Expedia Group); any = rentals and hotel rooms side by side, each tagged; resort = resorts and all-inclusives, Booking.com only, priced per person too",
                "enum": ["entire", "hotel", "any", "resort"],
                "type": "string"
              },
              "travellerCountry": {
                "description": "ISO-2 country the traveler lives in (default US); decides whether an eSIM line applies",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "vibe": {
                "default": "local",
                "enum": ["lively", "local", "calm"],
                "type": "string"
              },
              "waitSeconds": {
                "default": 45,
                "description": "How long to wait for the search before returning a running status",
                "maximum": 150,
                "minimum": 0,
                "type": "integer"
              },
              "walkTo": {
                "default": ["bars_cafes"],
                "description": "What should be within a ten-minute walk",
                "items": {
                  "enum": ["bars_cafes", "restaurants", "groceries", "transit"],
                  "type": "string"
                },
                "type": "array"
              },
              "where": {
                "description": "City or town, with state or country when ambiguous: 'Lisbon', 'Wimberley, TX', 'Kyoto, Japan'.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["checkIn", "checkOut", "where"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search stays with receipts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f5990d83cfffa635bd1f6377f9f4b52c31ab47c6d09e66f08da8d4493f3ee10c"
        },
        {
          "name": "set_alert",
          "title": "Start price-drop alerts",
          "description": "Starts the otter's daily re-run of a finished search, emailing the key's account when a verified pick drops 5% or $50 or the cheapest pick disappears. Needs a key (stayotter.com/connect); the first alert is free with an account, more are Pro.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "searchId": {
                "pattern": "^s_[0-9a-f]{8,32}$",
                "type": "string"
              }
            },
            "required": ["searchId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Start price-drop alerts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e8598204f2aac5aa1b39683de7a846cf95a5c042dcf7ed7b7777124e079c9e23"
        },
        {
          "name": "watch_booking",
          "title": "Watch a booking until its free-cancellation deadline",
          "description": "For a stay already booked with free cancellation: pass the confirmation email's text. The otter keeps five facts (property, dates, total paid, deadline, where it was booked), discards the rest (no names, confirmation numbers or card details), reads the property's rate every morning and emails the account when a cheaper rate it can still cancel into appears (5% or $50), with reminders 7, 3 and 1 days before the deadline. Hotels booked direct are read across sellers through Google's rate list. A single whole home has one calendar, so once booked its price can't drop for the traveler: the first read finds the nights taken, the otter emails to say so and offers (free) to watch other whole homes nearby for the same dates until the deadline. A watch that closes without a drop ends with one note saying the price held (the reads and the lowest rate seen); a drop alert asks whether the traveler rebooked, and the answers feed the public track record as totals. Needs a key; free and unlimited. The otter never books or cancels.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirmation": {
                "description": "The confirmation email's text, as the traveler pasted or forwarded it",
                "maxLength": 12000,
                "minLength": 40,
                "type": "string"
              },
              "paidUsd": {
                "description": "What they paid in US dollars, when the confirmation is in a currency the otter can't convert",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["confirmation"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Watch a booking until its free-cancellation deadline"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:740b32c8514397e7e48cf5994211c11acdf3055aae273f33e93fa58c6e06fe79"
        },
        {
          "name": "watch_similar_homes",
          "title": "Watch other whole homes for a booked stay's dates",
          "description": "For a whole home already booked (watch_booking, then the first morning's read found the nights taken by the traveler): watches other verified whole homes nearby for the same dates and party, and emails the account when one comes in at least 5% or $50 under what they paid, until their free-cancellation deadline. A find is always a different home, never the same one cheaper; the traveler books the new one first and cancels theirs second. Starts with one live search now (30 to 90 seconds; not counted as a trip). Needs the key the booking was watched with; free.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "bookedId": {
                "description": "The bookedId watch_booking returned",
                "pattern": "^b_[0-9a-f]{8,32}$",
                "type": "string"
              }
            },
            "required": ["bookedId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Watch other whole homes for a booked stay's dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98009314b59066dfb774092bcf3e97d18500a2e0b87353e902a399e6f0582f3c"
        }
      ],
      "digest": "sha256:b6330c03f31b189326121ed51cc50ec8cf6cb5a01fb566066a9a1967b016d664"
    }
  }
}
