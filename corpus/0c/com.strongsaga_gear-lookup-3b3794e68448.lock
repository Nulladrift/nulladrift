        {
          "name": "find_home_gym_gear_alternatives",
          "title": "Find similar home gym gear",
          "description": "Use when a user asks \"what else is like this\", \"anything cheaper than X\", \"X is sold out, what instead\" or \"something similar that fits my room\" about one product. Returns products in the same category, near the same guide price, that need no more ceiling or floor than that product where the guides state both values, best first. Each result has reasons in plain words (same type, price gap, ceiling and floor fit, capacity, folding, who it is for) and not_known for values a guide does not state. Pass max_price for cheaper options only, or same_space=false to also see bigger or taller ones. Get the id from search_home_gym_gear.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
