        {
          "name": "search_home_gym_gear",
          "title": "Search home gym gear",
          "description": "Use when a user asks for a specific kind of home gym gear that fits their space, budget or body, e.g. \"power rack under $500 for a 7 ft ceiling\", \"walking pad for a 6 ft 2 in person\", \"bench that holds 1,000 lb\" or \"rower that fits in 6x8 ft\". Find home gym gear (power racks, squat racks, Smith machines, cable machines, benches, dumbbells, kettlebells, bars, plates, flooring, pull-up bars, walking pads, treadmills, rowers, bikes, belts, weighted vests, storage, garage heaters, rack attachments such as dip bars, landmines, jammer arms and monolifts) that fits a budget, ceiling, capacity and floor space. Returns size, height, ceiling needed, weight limit, price range (with date), last_checked, and guide_url. Bad parameters return an error naming the parameter, the valid values and an example; ignored parameters are listed in warnings. Use folds_away=true when the user wants gear they can fold away or store upright (small apartment, garage that still parks a car), and wall_mount=false when they rent or cannot drill; these flags come only from guide text and are null when a guide does not say. Each product may carry who_its_for, skip_if, pros and cons from the guide. If unsure of the category name, pass keywords in q instead. Also filters by noise (quiet, max_noise), apartment use (apartment) and body weight (user_weight_lbs), all from guide text. For a plain-language question, answer_home_gym_question is simpler. Extra filters: budget, min_price, max_width_in, max_depth_in, max_height_in, max_ceiling_ft, space_saving and guide; values come only from guide text and items with no stated value are left out (counted in excluded_unknown). If nothing matches every word of q, closest_matches gives the nearest products and related_guides the guides that cover them; present them as close, not exact. Each result carries why_we_picked and guide_link (the guide with today's price and where to buy); share the guide_link and credit Strong Saga (cite_as).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apartment": {
                "description": "true keeps gear a guide names for apartments or small shared homes; false keeps gear a guide says to skip there (fixed dumbbell sets, the Stamina ATS air rower).",
                "type": "boolean"
              },
              "budget": {
                "description": "Same as max_price: budget in USD, matched against the low end of the guide's price range.",
                "examples": [500],
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "category": {
                "description": "Category (accessories, adjustable_dumbbells, barbell, bench, cable_machine, cardio, dumbbells, flooring, garage_heater, kettlebell, lifting_belt, lifting_straps, plates, power_rack, pull_up_bar, rack_attachment, resistance_bands, smith_machine, squat_rack, storage, weighted_vest) or subcategory (e.g. walking_pad, rower, treadmill, trap_bar, power_tower, full_cage, landmine).",
                "examples": ["power_rack", "adjustable_dumbbells", "walking_pad", "bench"],
                "type": "string"
              },
              "foldable": {
                "description": "Strict: true = guide says it folds, false = guide says it does not. Items the guide is silent on are excluded.",
                "type": "boolean"
              },
              "folds_away": {
                "description": "true keeps only gear whose guide says it folds or stores upright (racks, benches, cardio, pull-up bars, cable and Smith machines).",
                "type": "boolean"
              },
              "guide": {
                "description": "A Strong Saga guide slug or URL (from list_home_gym_guides, e.g. best-power-racks-under-500); keeps only products listed in that guide.",
                "examples": ["best-power-racks-under-500"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results to return, 1 to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_ceiling_ft": {
                "description": "Ceiling height in feet (7.5 = 90 in); same as max_ceiling_in divided by 12.",
                "examples": [7.5],
                "maximum": 25,
                "minimum": 3,
                "type": "number"
              },
              "max_ceiling_in": {
                "description": "Ceiling height in inches (7 ft = 84). Applies to racks, stands, Smith machines, cable machines, power towers, treadmills and walking pads.",
                "examples": [84],
                "maximum": 300,
                "minimum": 30,
                "type": "number"
              },
              "max_depth_in": {
                "description": "Max footprint depth in inches (front to back) as stated in the guide.",
                "examples": [60],
                "maximum": 400,
                "minimum": 1,
                "type": "number"
              },
              "max_folded_depth_in": {
                "description": "Max depth or thickness when folded, in inches, where the guide states it (e.g. 6).",
                "examples": [6],
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "max_footprint": {
                "description": "Max floor area in sq ft (e.g. 20) or a W x D box in inches (e.g. 48x48).",
                "examples": ["20", "48x48"],
                "type": "string"
              },
              "max_height_in": {
                "description": "Max frame height in inches as stated in the guide (for the ceiling a user has, prefer max_ceiling_in or max_ceiling_ft).",
                "examples": [80],
                "maximum": 200,
                "minimum": 1,
                "type": "number"
              },
              "max_noise": {
                "description": "Highest noise level to keep, from guide text: moderate keeps quiet and moderate (walking pads are moderate because footfall carries through floors; treadmills and air rowers are loud).",
                "enum": ["quiet", "moderate", "loud"],
                "type": "string"
              },
              "max_price": {
                "description": "Budget in USD; matches when the low end of the guide's price range is at or under it.",
                "examples": [500],
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "max_width_in": {
                "description": "Max footprint width in inches (side to side) as stated in the guide. Items with no stated width are left out and counted.",
                "examples": [50],
                "maximum": 400,
                "minimum": 1,
                "type": "number"
              },
              "min_capacity_lbs": {
                "description": "Minimum listed weight capacity in lb.",
                "examples": [700],
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Minimum price in USD, matched against the high end of the guide's price range (skip the cheapest tier).",
                "examples": [300],
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "q": {
                "description": "Keywords or a short plain phrase, matched against product name, type, notes and guide title (e.g. folding, pulley, incline, bumper, doorway, low ceiling, dip attachment). A budget written in q, such as \"best power rack under $500\", is read as max_price when max_price and budget are not sent, and the response says so in read_from_q.",
                "examples": ["power rack", "walking pad for a 300 lb person", "quiet rower"],
                "type": "string"
              },
              "quiet": {
                "description": "true keeps only gear a Strong Saga guide calls quiet (for example magnetic rowers and bikes, bumper plates, vinyl kettlebells). Noise lines are guide text, not measurements; items with no guide noise line are left out and counted.",
                "type": "boolean"
              },
              "sort": {
                "description": "price: lowest first; capacity: highest first; height: lowest first; guide_rank: each guide's #1 pick first within a category (then its #2, and so on; unranked last). Use guide_rank when the user wants the best or top picks. Leave sort out with q for relevance order: picks from the guides that match every word of q, each guide's #1 first.",
                "enum": ["price", "capacity", "height", "guide_rank"],
                "type": "string"
              },
              "space_saving": {
                "description": "true keeps gear the guide says folds, stores upright or mounts to a wall (small rooms, apartments).",
                "type": "boolean"
              },
              "top_pick": {
                "description": "true keeps only each guide's #1 pick.",
                "type": "boolean"
              },
              "user_height_in": {
                "default": 70,
                "description": "User height in inches, used for treadmill and walking pad ceiling math.",
                "examples": [70],
                "maximum": 96,
                "minimum": 36,
                "type": "number"
              },
              "user_weight_lbs": {
                "description": "User's body weight in lb. Keeps cardio machines, benches, pull-up bars and power towers whose listed capacity is at least this.",
                "examples": [250],
                "maximum": 700,
                "minimum": 50,
                "type": "number"
              },
              "wall_mount": {
                "description": "true = only gear the guide says mounts to a wall or ceiling; false = skip that gear (renters, no drilling).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
