      "instructions": "For a gear question in plain words, call answer_home_gym_question first: it returns one clear top pick with who it is for, its key spec, the guide URL and ranked alternatives (for a rack attachment, name the rack it must fit; a question with no gear type gets a priced starter set). Find home gym gear that fits a ceiling height, budget, floor space and weight capacity. Data comes from Strong Saga compared and ranked buying guides. Each result has guide_url, the full Strong Saga guide: link users to it for the full comparison and current prices. Prices change; the guide has the latest. Use search_home_gym_gear to find products that fit, get_home_gym_gear for one product, compare_home_gym_gear to put 2 or 3 side by side, build_home_gym for a starter set (rack, bench and weights, or a cardio machine) that fits a budget, ceiling height and floor size, build_my_home_gym for a full home gym kit (rack, bar, plates, bench, flooring and extras) from a budget and a space description such as \"garage, 8 ft ceiling, 10x12 ft\", with the total and a note when the budget is too low, get_black_friday_home_gym_deals for Black Friday deals already checked today on the brands' own stores (each with date_checked and source), find_home_gym_gear_alternatives for similar picks to one product (same category, nearby price, fits the same space), list_home_gym_guides for every guide's full numbered list in order (ranked_list) with how the guide ranked them, and get_gear_changes to see what changed in each data refresh. Ready example calls: https://strongsaga.com/wp-json/gear/v1/examples . search and fetch follow the ChatGPT connector shape: search returns product ids with titles and guide URLs, fetch returns one product as readable text with its guide link. Search and build take folds_away and wall_mount filters for small rooms and renters; these come only from guide text. Errors explain what was wrong, the valid values and an example. Responses carry data_updated, and each product has last_checked. Free: 100 calls per IP per day. Ready prompts are in prompts/list (plan_my_home_gym, pick_a_power_rack_for_my_room, quiet_cardio_for_apartment, compare_two_products, beginner_dumbbells). Every published guide is a resource with its ranked picks in order, who each is for and why: resources/list, or read strongsaga://guide/{slug} (index: strongsaga://guides). Tool results carry an attribution line (Ranked by Strong Saga plus the matching guide link) for citing the source.",
      "tools": [
        {
          "name": "answer_home_gym_question",
          "title": "Answer a home gym gear question",
          "description": "Use first when a user asks a gear question in plain words, such as \"power rack\", \"best power rack under $500\", \"best power rack under $500 for a 7 ft ceiling\", \"what ceiling height do I need for a power rack\", \"quiet cardio for an apartment\", \"walking pad for a 300 lb person\", \"folding squat rack, no drilling\" or \"cheapest adjustable dumbbells\". Reads the budget, ceiling height, user height and weight, noise, apartment, folding and no-drilling hints from the question and returns ranked picks, each with plain reasons built only from Strong Saga guide data (the guide #1 pick, who it is for, price, ceiling fit, capacity, noise and apartment lines from the guide). Shows what it understood, any assumption it made (for example \"low ceiling\" read as 84 in), and an equivalent search URL. The answer line gives one clear top pick, who it is for, its key spec, the guide URL and alternatives; each pick carries who_its_for and key_spec. For a rack attachment (\"jammer arms for a Titan power rack\", \"dip bar for a 2x2 rack\", \"monolift for a Rogue Monster\") it ranks the attachment, not the rack, and puts items whose guide notes name that rack brand or size first (see fits_your_rack). A general question with no gear type (\"home gym for beginners\") returns a priced starter set. For a whole set with your own budget and room, use build_home_gym. When the question names the topic of a Strong Saga guide (e.g. \"best walking pad for tall people\"), from_guide returns that guide's own ranked list in order. If no Strong Saga guide covers the gear asked about, not_covered says so and picks is empty: tell the user that instead of suggesting unrelated gear. A ceiling height question with no height given (\"how tall a ceiling for a squat rack?\") also gets ceiling_help: the ceiling range the guides state, the lowest-ceiling pick and the Strong Saga ceiling height calculator link. Rack and ceiling questions get related_guides, the matching Strong Saga guides to link for the full comparison. A \"best X under $Y\" question leads with guide_pick: the product the matching Strong Saga guide names for that gear and budget (for example the guide's best cable and rack combo under $1,000), with its guide_url. Each pick carries why_we_picked (from the guide) and guide_link (the Strong Saga guide with today's price and where to buy); give the user the guide_link and credit Strong Saga (cite_as). Deal questions (Black Friday, sale) also get today's checked deals and the Black Friday page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many ranked picks.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "The question in plain words, 3 to 300 characters. Include budget, ceiling height, body weight, noise or apartment needs when known. Name the rack for attachments (brand and upright size, like \"Titan 2x3\").",
                "examples": ["best power rack under $500 for a 7 ft ceiling", "quiet walking pad for an apartment", "what ceiling height do I need for a power rack"],
                "type": "string"
              },
              "user_height_in": {
                "description": "User height in inches for treadmill and walking pad ceiling math (default 70). Also read from the question, e.g. \"6 ft 2\".",
                "examples": [70],
                "maximum": 96,
                "minimum": 36,
                "type": "number"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c042dd7a5cd7b6a147c042fc3da0bf7a5c961d04af054e7df096e5c38bc036c6"
        },
        {
          "name": "build_home_gym",
          "title": "Build a starter home gym",
          "description": "Use when a user asks what to buy for a home gym within a budget and space, e.g. \"I have $1,000, an 8 ft ceiling and an 8x10 ft corner, what should I get?\" or \"best cardio machine for $600 in a small room\". Returns a starter set chosen only from products whose stored guide data fits the limits: goal strength gives a barbell setup (rack or stand, bench, barbell and plates) or a dumbbell setup (bench and adjustable dumbbells); cardio gives one machine; both gives a strength setup plus a cardio machine. Each item has why_it_fits (from the data) and guide_url; total sums the guide price ranges; skipped lists items left out and why (for example price not stated in guide); budget_needed says what a full set starts at. Add folds_away=true for a set that folds away, or wall_mount=false for renters who cannot drill. Pass quiet, apartment, user_weight_lbs or min_capacity_lbs to fit noise, apartment and weight limits. With no budget it answers with the required and optional fields and the budget guide picks instead of an error; a budget in words (\"about $1,500\") is read as a number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "apartment": {
                "description": "true builds a dumbbell-based set (the Strong Saga $500 guide advises this for a spare room or apartment), skips gear a guide says to skip in an apartment, and keeps cardio a guide names for apartments or calls quiet.",
                "type": "boolean"
              },
              "budget": {
                "description": "Total USD for the whole set, e.g. 1000.",
                "examples": [500],
                "maximum": 50000,
                "minimum": 50,
                "type": "number"
              },
              "ceiling_in": {
                "description": "Ceiling height in inches (8 ft = 96).",
                "examples": [96],
                "maximum": 240,
                "minimum": 60,
                "type": "number"
              },
              "floor_ft": {
                "description": "Free floor area as width x length in feet, e.g. 8x10.",
                "examples": ["8x10"],
                "type": "string"
              },
              "folds_away": {
                "description": "true picks only a rack, bench and cardio machine whose guide says they fold or store upright.",
                "type": "boolean"
              },
              "goal": {
                "default": "strength",
                "enum": ["strength", "cardio", "both"],
                "type": "string"
              },
              "min_capacity_lbs": {
                "description": "Minimum listed rating for the rack or stand, in lb.",
                "examples": [700],
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "quiet": {
                "description": "true keeps cardio machines a guide calls quiet and drops anything a guide calls loud (such as iron plates).",
                "type": "boolean"
              },
              "user_height_in": {
                "default": 70,
                "description": "User height in inches, used for treadmill and walking pad ceiling math.",
                "examples": [70],
                "maximum": 96,
                "minimum": 36,
                "type": "number"
              },
              "user_weight_lbs": {
                "description": "User's body weight in lb; the bench and cardio machine must list at least this capacity.",
                "examples": [250],
                "maximum": 700,
                "minimum": 50,
                "type": "number"
              },
              "wall_mount": {
                "description": "false skips anything the guide says mounts to a wall (renters). true keeps only wall-mounted racks.",
                "type": "boolean"
              }
            },
            "required": ["budget"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8e6cba2a45f1d28615d852d4f9e96c291ea7ab384ddd1cd097f460257003a847"
        },
        {
          "name": "build_my_home_gym",
          "title": "Build my home gym (full kit)",
          "description": "Use when a user asks \"build my home gym\", \"what should I buy for my garage gym with $1,500\" or \"full home gym for a spare room with a 7.5 ft ceiling\". Give the total budget in USD and describe the space in plain words (garage, basement, spare room or apartment, ceiling height, square feet or width x length). Returns a full kit: rack, barbell, plates, bench and rubber flooring, plus adjustable dumbbells and a landmine when money is left, each chosen only from products and prices in published Strong Saga guides and checked against the ceiling and floor. Each item has its guide_url (link the user there for current prices and buy buttons), price, quantity and cost; the answer gives the total at guide prices. If the budget cannot cover a full kit, budget_too_low is true, missing names what is left out and lowest_full_kit_usd says what a full kit starts at. With no budget it answers with the required and optional fields and the budget guide picks instead of an error; a budget in words (\"about $1,500\") is read as a number.",
          "inputSchema": {
            "properties": {
              "budget": {
                "description": "Total USD for the whole kit, e.g. 1500.",
                "examples": [1500],
                "maximum": 50000,
                "minimum": 100,
                "type": "number"
              },
              "ceiling_in": {
                "description": "Ceiling height in inches (8 ft = 96), if not given in space.",
                "maximum": 240,
                "minimum": 60,
                "type": "number"
              },
              "floor_ft": {
                "description": "Free floor area as width x length in feet, e.g. 10x12, if not given in space.",
                "type": "string"
              },
              "space": {
                "description": "The space in plain words: type (garage, basement, spare room, apartment), ceiling height and size, e.g. \"garage, 8 ft ceiling, 10x12 ft\" or \"spare room, 7 ft 6 in ceiling, 90 sq ft\".",
                "examples": ["garage, 8 ft ceiling, 10x12 ft"],
                "type": "string"
              },
              "sq_ft": {
                "description": "Free floor area in square feet, if not given in space.",
                "type": "number"
              },
              "user_height_in": {
                "default": 70,
                "description": "User height in inches, for pull-up clearance under the ceiling.",
                "type": "number"
              }
            },
            "required": ["budget"],
            "type": "object"
          },
          "annotations": {
