        {
          "name": "get_black_friday_home_gym_deals",
          "title": "Black Friday home gym deals (checked today)",
          "description": "Use when a user asks about Black Friday, Cyber Monday or current sale prices on home gym gear, e.g. \"any Black Friday power rack deals?\" or \"adjustable dumbbells on sale\". Returns only the deals listed on the Strong Saga Black Friday home gym deals page that were checked today on the brand's own store: name, deal price, the brand's was price, saving, date_checked, source (the brand store) and the Strong Saga guide that ranked the product. Deals expire after the day they were checked, and prices are never guessed or carried over: if nothing was checked today, the list is empty and the answer says when the last check was. Optional filters: category (e.g. power rack, dumbbells, rower), max_price and q (a word in the product name). Each deal carries guide_link; the source_page has every deal with the date it was checked.",
          "inputSchema": {
            "properties": {
