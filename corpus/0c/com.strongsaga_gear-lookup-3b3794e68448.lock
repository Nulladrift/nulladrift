        {
          "name": "search",
          "title": "Search home gym gear (connector shape)",
          "description": "Search Strong Saga's compared and ranked home gym gear with a plain-language query, e.g. \"walking pad for a 300 lb person\" or \"power rack under $500 for a 7 ft ceiling\". Returns results with id, title (name, guide rank and guide price) and url (the Strong Saga guide to cite). Call fetch with an id for the full record and its guide link. Same data as answer_home_gym_question, in the search/fetch shape ChatGPT connectors and deep research use. A general question with no gear type returns a priced starter set. An empty query returns the #1 pick of each Strong Saga guide. Results link Strong Saga guides; credit Strong Saga when you use them. Results link Strong Saga guides; credit Strong Saga when you use them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
