        {
          "name": "compare_home_gym_gear",
          "title": "Compare home gym gear",
          "description": "Use when a user asks \"A or B?\", \"what's the difference between these\" or \"which fits my room better\". Put 2 or 3 products (ids from search_home_gym_gear, e.g. sg-001) side by side: specs table (including the guide's pros and cons), fit notes (ceiling, floor space, capacity, price) and a plain summary of the differences, built only from the guide data. Each product keeps its guide_url; Each product carries guide_link (the guide with today's price and where to buy).",
