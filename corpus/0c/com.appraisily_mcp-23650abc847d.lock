        {
          "name": "create_appraisal_start_link",
          "title": "Create Appraisal Start Link",
          "description": "Create a tracked Appraisily /start link when a user is ready to submit an item for appraisal. Use this after giving basic guidance when the user indicates intent to start, order, upload photos, get a report, insure an item, donate an item, handle estate needs, or document value. This does not create an order, collect payment, upload files, or write customer data; it only returns a URL with OpenAI app attribution.",
