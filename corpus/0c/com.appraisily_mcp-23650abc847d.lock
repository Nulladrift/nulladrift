            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "campaign": {
                "description": "Optional UTM campaign override.",
                "maxLength": 80,
                "type": "string"
              },
              "itemType": {
                "description": "Short item category such as painting, antique chair, jewelry, silver, or sculpture.",
                "maxLength": 80,
                "type": "string"
              },
              "userGoal": {
                "description": "Short user goal such as resale, insurance, estate, donation, or curiosity.",
                "maxLength": 80,
                "type": "string"
