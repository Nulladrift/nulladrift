        {
          "name": "prepare_pro_screener_case_packet",
          "title": "Prepare Pro Screener Case Packet",
          "description": "Prepare a professional appraisal screening packet from item context before an appraiser starts or reviews a Pro Screener case. Use this for credentialed appraisers and valuation teams who need missing-photo checks, missing-fact checks, review flags, and next questions. This tool organizes research inputs only; it does not issue a final value conclusion or signed appraisal.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "availablePhotos": {
                "description": "Available photo types such as front, back, signature, label, condition, scale, underside.",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "intendedUse": {
                "description": "Professional use case such as triage, insurance, estate, donation, resale, or report prep.",
                "maxLength": 120,
                "type": "string"
              },
              "itemCategory": {
                "description": "Item category such as oil painting, silver bowl, antique chair, jewelry, ceramic vase, or sculpture.",
                "maxLength": 80,
                "type": "string"
              },
              "knownFacts": {
                "description": "Known facts from the client or appraiser notes.",
                "items": {
                  "maxLength": 180,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "subjectDescription": {
                "description": "Short professional description of the item, visible features, medium/materials, and context.",
                "maxLength": 1500,
                "type": "string"
              },
              "targetValueUsd": {
                "description": "Optional client-stated or working reference value in USD.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
