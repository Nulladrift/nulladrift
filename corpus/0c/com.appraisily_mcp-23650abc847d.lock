        {
          "name": "start_pro_screener_run",
          "title": "Start Lotbook Run",
          "description": "Start a private Appraisily Lotbook (Pro Screener) run from a signed-in Appraisily account and a photo. Use this when the user wants Lotbook, Pro Screener, or a professional screening report from ChatGPT after they have signed in. This creates a private session, queues the same agent the website uses, and returns immediately with a sessionId. Do not wait for the full 8–12 minute run. Prefer a public HTTPS imageUrl. If the client provided image bytes, pass imageBase64. Then poll get_pro_screener_status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "declaredValueUsd": {
                "description": "Optional client-stated value in USD.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "imageBase64": {
                "description": "Optional raw or data-URL base64 image when no HTTPS URL is available.",
                "maxLength": 16000000,
                "type": "string"
              },
              "imageUrl": {
                "description": "Public HTTPS URL of the object photo. Do not use localhost or private network URLs.",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              },
              "notes": {
                "description": "Optional object facts from the user (max 1200 characters): artist, medium, size, inscriptions, or provenance.",
                "maxLength": 1200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
