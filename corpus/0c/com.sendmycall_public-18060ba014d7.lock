                    "additionalProperties": false,
                    "properties": {
                      "description": {
                        "type": "string"
                      },
                      "endpoint": {
                        "type": "string"
                      }
                    },
                    "required": ["description", "endpoint"],
                    "type": "object"
                  },
                  "rates_url": {
                    "description": "Absolute URL on https://sendmycall.com.",
                    "type": "string"
                  },
                  "to_phone": {
                    "additionalProperties": false,
                    "properties": {
                      "currency": {
                        "const": "USD",
                        "type": "string"
                      },
                      "offered": {
                        "type": "boolean"
                      },
                      "price_per_minute_max": {
                        "type": ["string", "null"]
                      },
