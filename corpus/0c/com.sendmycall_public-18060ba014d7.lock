      "serverInfo": {
        "name": "com.sendmycall/public",
        "title": "SendMyCall public data",
        "version": "1.0.0",
        "websiteUrl": "https://sendmycall.com/developers",
        "icons": [
          {
            "src": "https://sendmycall.com/brand/logo-mark.svg",
            "mimeType": "image/svg+xml"
