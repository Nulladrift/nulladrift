        {
          "name": "get_support_article",
          "title": "Get a support article",
          "description": "Get one SendMyCall help article as Markdown: billing and renewals, how calls are billed, the cloud phone system (IVR, queues, voicemail, call recording), audio files, SIP and softphones, number porting, legal requirements and restrictions. Pick the slug from the list.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The article's slug.",
                "enum": ["support", "step-by-step-guides", "virtual-pbx-user-guide", "call-flow-examples", "billing-and-prices", "how-are-calls-billed", "new-subscriptions-and-renewals", "paypal-payments", "money-back-policy", "free-virtual-pbx", "call-forwarding", "voice-menu-ivr", "queue", "time-routing", "time-schedule", "voicemail", "call-recording", "call-blocking", "text-to-speech", "real-time-notification", "audio-files", "uploading-files", "recording-messages", "creating-playlists", "audio-file-actions", "third-party-softphone-configuration", "general-sip-information", "voip-knowledgebase", "asteriskconfig", "received-calls-troubleshooting", "number-porting", "legal-requirements", "virtual-number-restrictions"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "markdown": {
                "type": "string"
              },
