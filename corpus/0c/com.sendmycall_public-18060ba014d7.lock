        {
          "name": "get_calling_rate",
          "title": "Get the per-minute price of calls to a number",
          "description": "Get the per-minute price of an outgoing call, or of a call forwarded, to one phone number, by the longest matching prefix. The same price applies when a call to a SendMyCall number is forwarded to that phone. The number is used for the lookup only: it is not stored or returned.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "phone_number": {
                "description": "Phone number in E.164 format: + then country code and number, 7 to 15 digits, e.g. +442079460000.",
                "pattern": "^\\+?[1-9]\\d{6,14}$",
                "type": "string"
              }
            },
            "required": ["phone_number"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "data_as_of": {
                "type": "string"
              },
              "rate": {
                "additionalProperties": false,
                "properties": {
                  "country": {
                    "type": ["string", "null"]
                  },
                  "currency": {
                    "const": "USD",
                    "type": "string"
                  },
                  "destination": {
                    "type": ["string", "null"]
                  },
                  "first_interval_price": {
                    "type": ["string", "null"]
                  },
                  "first_interval_seconds": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "matched_prefix": {
                    "description": "The longest prefix that matched, without +; null when none matched or the rule is the whole number.",
                    "type": ["string", "null"]
                  },
                  "offered": {
                    "type": "boolean"
                  },
                  "price_per_minute": {
                    "description": "US dollars per minute as a decimal string; null when not offered.",
                    "type": ["string", "null"]
                  },
                  "rates_url": {
                    "description": "Absolute URL on https://sendmycall.com.",
                    "type": "string"
                  },
                  "tax_included": {
                    "const": true,
                    "type": "boolean"
                  }
                },
                "required": ["country", "currency", "destination", "first_interval_price", "first_interval_seconds", "matched_prefix", "offered", "price_per_minute", "rates_url", "tax_included"],
                "type": "object"
              }
            },
            "required": ["data_as_of", "rate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the per-minute price of calls to a number"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
