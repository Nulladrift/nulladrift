        {
          "name": "search_areas",
          "title": "Search number areas",
          "description": "Search the number areas (cities, regions, national, mobile and toll-free ranges) by country, number type and text (a city, region or dialling prefix such as London or 4420). Returns each area's id, prefix, monthly price and whether it had numbers at the last snapshot. Use get_area_pricing with an id for the full details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. GB or US.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "limit": {
                "description": "Areas to return, 1 to 50; default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "number_type": {
                "description": "Kind of number: local, national, mobile, toll_free, shared_cost or global.",
                "enum": ["local", "national", "mobile", "toll_free", "shared_cost", "global"],
                "type": "string"
              },
              "offset": {
                "description": "Areas to skip, for the next page; default 0.",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Text in the area's name, city or region, or a dialling prefix.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "areas": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "available_at_snapshot": {
                      "type": "boolean"
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "country": {
                      "type": "string"
                    },
                    "id": {
                      "description": "Public area id, for get_area_pricing.",
                      "type": "string"
                    },
                    "monthly_price_cents": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Monthly price in US cents, tax included; null when not published (unknown, not free)."
                    },
                    "name": {
