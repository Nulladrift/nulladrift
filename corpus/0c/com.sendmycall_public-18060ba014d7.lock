        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only data about SendMyCall (https://sendmycall.com/), which sells virtual phone numbers (local, national, mobile and toll-free) in 90+ countries with call forwarding and a free cloud phone system. Prices are in US dollars, tax included.\n\nTypical flow: list_countries to see where numbers exist, search_areas to find a city, region or prefix in a country, get_area_pricing for one area's monthly price and the documents it requires, get_calling_rate or get_forwarding_rate for per-minute prices, get_support_article for help topics.\n\nThe data comes from snapshots shipped with the site: \"available_at_snapshot\" means an area had numbers when the snapshot was taken, not that a number is in stock now. Individual numbers are not listed here. Buying is done by the user on the website: send them to the order_url (the number picker), which shows the numbers in stock now. An agent cannot buy, sign in or change anything through this server. The same data is in the REST API https://sendmycall.com/api/v1 (https://sendmycall.com/openapi.json). Support: care@sendmycall.com.",
      "tools": [
        {
          "name": "get_area_pricing",
          "title": "Get an area's price and requirements",
          "description": "Get one number area by its id (from search_areas): monthly price and setup price in US cents, toll-free per-minute prices, the features of its numbers (voice, SMS, fax), the documents the holder must provide, the billing terms and the link where the user can buy a number.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "area_id": {
                "description": "Public area id from search_areas, e.g. gb-vn-london_44-20.",
                "maxLength": 220,
                "minLength": 6,
                "type": "string"
              }
            },
            "required": ["area_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "area": {
                "additionalProperties": false,
                "properties": {
                  "availability": {
                    "additionalProperties": false,
                    "properties": {
                      "available_at_snapshot": {
                        "type": "boolean"
                      },
                      "country_offered": {
                        "type": ["boolean", "null"]
                      },
                      "observed_at": {
                        "type": "string"
                      },
                      "stock_count": {
                        "type": "null"
                      }
                    },
                    "required": ["available_at_snapshot", "country_offered", "observed_at", "stock_count"],
                    "type": "object"
                  },
                  "city": {
                    "type": ["string", "null"]
                  },
                  "country": {
                    "type": "string"
                  },
                  "currency": {
                    "const": "USD",
                    "type": "string"
                  },
                  "features": {
                    "items": {
                      "enum": ["voice_in", "voice_out", "sms_in", "sms_out", "fax_t38"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "id": {
                    "type": "string"
                  },
                  "monthly_price_cents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "name": {
                    "type": "string"
                  },
                  "order_url": {
                    "description": "Absolute URL on https://sendmycall.com.",
                    "type": "string"
                  },
                  "page_url": {
                    "description": "Absolute URL on https://sendmycall.com.",
                    "type": "string"
                  },
                  "prefix": {
                    "type": "string"
                  },
                  "region": {
                    "type": ["string", "null"]
                  },
                  "registration": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "address_documents": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "address_required_in": {
                            "anyOf": [
                              {
                                "enum": ["world_wide", "country", "area", "city"],
                                "type": "string"
                              },
                              {
                                "type": "null"
                              }
                            ]
                          },
                          "documents_required": {
                            "type": "boolean"
                          },
                          "holder": {
                            "enum": ["personal", "business", "any"],
                            "type": "string"
                          },
                          "identity_documents": {
                            "maximum": 9007199254740991,
                            "minimum": -9007199254740991,
                            "type": "integer"
                          },
                          "service_description_required": {
                            "type": "boolean"
                          },
                          "summary": {
                            "type": "string"
                          }
                        },
                        "required": ["address_documents", "address_required_in", "documents_required", "holder", "identity_documents", "service_description_required", "summary"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "What the holder must provide before the number is activated; null when the snapshot does not say."
                  },
                  "setup_price_cents": {
                    "anyOf": [
                      {
                        "maximum": 9007199254740991,
                        "minimum": -9007199254740991,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "tax_included": {
                    "const": true,
                    "type": "boolean"
                  },
                  "toll_free_incoming_per_minute": {
