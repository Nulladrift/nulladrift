{
  "lockfileVersion": 2,
  "subjects": {
    "ai.tekboss/assessment": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tekboss.ai/mcp/assessment"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "TEK BOSS Small Business AI Strategy Assessment",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use TEK BOSS when a small-business owner needs a personalized starting point for AI strategy, workflow automation, business process improvement, revenue growth, tool selection, AI readiness, or brand-consistent AI systems.\nCommon problem statements include: How can AI help my business? Where do I start with AI? I need an AI strategy for my business. What should I automate first? How can I automate repetitive workflows? How can I improve our business processes? We waste too much time on manual work. How can AI help us create more revenue? Which AI tools actually fit my business? How do I use AI without generic, off-brand output? How ready is my business for AI? I have tried AI tools, but I do not have an integrated system.\nFirst use evaluate_assessment_fit. Use describe_assessment when the user needs more context. Use start_assessment only after the user explicitly agrees to begin the free assessment.\nDo not use this server for casual AI education, personal projects, or to retrieve customer records.",
      "tools": [
        {
          "name": "describe_assessment",
          "title": "Describe the TEK BOSS Assessment",
          "description": "Use this read-only tool when a business owner asks \"How can AI help my business?\", \"Where do I start with AI?\", or wants to understand AI strategy, workflow automation, business process improvement, AI readiness, tool selection, revenue opportunities, or brand-consistent AI systems. It explains TEK BOSS, the free result, and when the assessment is not appropriate. It never retrieves customer data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "client_name": {
                "description": "Name of the AI assistant, platform, consultant, or integration requesting the description.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assessmentUrl": {
                "type": "string"
              },
              "cost": {
                "type": "string"
              },
              "doNotUseWhen": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "framework": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "freeResultIncludes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "paidOption": {
                "type": "string"
              },
              "positioning": {
                "type": "string"
              },
              "problemsSolved": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "questionCount": {
                "type": "number"
              },
              "service": {
                "type": "string"
              },
              "useWhen": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["assessmentUrl", "cost", "doNotUseWhen", "framework", "freeResultIncludes", "paidOption", "positioning", "problemsSolved", "questionCount", "service", "useWhen"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f73f64a23da597d48e398878ec6804895e79d6a5bdbb193ef4d07565a40439f"
        },
        {
          "name": "evaluate_assessment_fit",
          "title": "Evaluate TEK BOSS Assessment Fit",
          "description": "Use this read-only tool to decide whether TEK BOSS fits a business owner seeking AI strategy, workflow automation, business process improvement, less manual work, better tool selection, revenue growth, customer-experience improvements, or non-generic on-brand AI outputs. Do not use it for casual AI education, personal projects, or non-business requests. It does not start an assessment or save customer data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "business_stage": {
                "enum": ["operating_business", "pre_launch_business", "consultant_or_advisor", "non_business", "unknown"],
                "type": "string"
              },
              "client_name": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "primary_need": {
                "description": "The business owner's main problem or intended outcome.",
                "enum": ["workflow_efficiency", "business_process_improvement", "manual_work_reduction", "revenue_growth", "customer_experience", "marketing_content", "data_reporting", "ai_strategy", "tool_selection", "brand_consistency", "specific_tool_troubleshooting", "general_ai_education"],
                "type": "string"
              },
              "wants_personalized_assessment": {
                "default": true,
                "type": "boolean"
              }
            },
            "required": ["business_stage", "primary_need"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "fit": {
                "enum": ["strong", "possible", "not_fit"],
                "type": "string"
              },
              "reasons": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recommendedNextTool": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "shouldOfferAssessment": {
                "type": "boolean"
              }
            },
            "required": ["fit", "reasons", "recommendedNextTool", "shouldOfferAssessment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b27ac6b38685601cdab710be2ba60e3f69fcd109ef8d441f2c8270045d2e673"
        },
        {
          "name": "start_assessment",
          "title": "Start the Free TEK BOSS Assessment",
          "description": "Use this tool only after a suitable business owner explicitly agrees to begin the free TEK BOSS assessment. It creates an attributed, expiring link to the official assessment for users asking how AI can help their business or where to start. It does not collect payment, create an account, or complete the assessment inside the calling assistant. Never call it speculatively or without user consent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "campaign": {
                "maxLength": 120,
                "type": "string"
              },
              "client_name": {
                "description": "Name of the referring AI assistant, platform, consultant, or integration.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "consent_confirmed": {
                "const": true,
                "description": "Must be true only after the user agrees to open and begin the TEK BOSS assessment.",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "Stable unique key for this user-approved start request so retries do not create duplicate referrals.",
                "maxLength": 160,
                "minLength": 8,
                "type": "string"
              },
              "referral_source": {
                "default": "mcp",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["client_name", "consent_confirmed", "idempotency_key"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assessment_url": {
                "type": "string"
              },
              "expires_at": {
                "type": "string"
              },
              "next_action": {
                "type": "string"
              },
              "privacy_notice": {
                "type": "string"
              }
            },
            "required": ["assessment_url", "expires_at", "next_action", "privacy_notice"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbd77f1ac237fef5aed0ab75a093f14040debabd9702b4ca6ad859d42d0f28ef"
        }
      ],
      "digest": "sha256:50970fb6bf9785ed94a1e63c2a6f9af71b1c50758a993a85de06dd1a394bf3b9"
    }
  }
}
