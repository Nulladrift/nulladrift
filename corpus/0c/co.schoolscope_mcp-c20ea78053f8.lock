        {
          "name": "track_application",
          "title": "Track an application",
          "description": "Adds a school to the authenticated user's SchoolScope application tracker, or changes the status or note of a school already on it. A new entry takes the school's door and how-to-apply line from SchoolScope's record and starts at \"planning\" (\"Planning to apply\") unless a status is given. It changes the user's saved list. Statuses, in order: planning (\"Planning to apply\"), applied (\"Applied\"), confirmed (\"Confirmation checked\"), waiting (\"Waiting for the lottery or letter\"), offer (\"Offered a seat\"), waitlisted (\"Waitlisted\"), accepted (\"Accepted\"), declined (\"Declined\"). A list holds at most 30 schools. Requires the `applications:write` OAuth scope.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "note": {
                "description": "The family's note on this school, up to 500 characters; it replaces any earlier note, and an empty string clears it.",
                "maxLength": 500,
                "type": "string"
              },
              "slug": {
                "description": "The school's slug: the last segment of its schoolscope.co/ca/school/<slug> address, e.g. 'lowell-high-3407'.",
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "status": {
                "description": "Where the family stands with this school.",
                "enum": ["planning", "applied", "confirmed", "waiting", "offer", "waitlisted", "accepted", "declined"],
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "application": {
                "additionalProperties": false,
                "properties": {
                  "added": {
                    "type": "string"
                  },
                  "closed": {
                    "type": "boolean"
                  },
                  "door": {
                    "type": "string"
                  },
                  "how": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "nextDate": {
                    "anyOf": [
                      {
                        "additionalProperties": false,
                        "properties": {
                          "date": {
                            "type": "string"
                          },
                          "label": {
                            "type": "string"
                          },
                          "note": {
                            "type": ["string", "null"]
                          },
                          "read": {
                            "type": ["string", "null"]
                          },
                          "source": {
                            "enum": ["school", "district"],
                            "type": "string"
                          },
                          "url": {
                            "type": "string"
                          }
                        },
                        "required": ["date", "label", "note", "read", "source", "url"],
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "note": {
                    "type": "string"
                  },
                  "ownDates": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        }
                      },
                      "required": ["date", "label"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "slug": {
                    "type": "string"
                  },
                  "status": {
                    "type": "string"
                  },
                  "updated": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["added", "closed", "door", "how", "name", "nextDate", "note", "ownDates", "slug", "status", "updated", "url"],
                "type": "object"
              },
