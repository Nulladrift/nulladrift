        {
          "name": "find_schools",
          "title": "Find California schools",
          "description": "Find California schools four ways, whichever fits the question: free text over school/city/district names (`query`), inside a zip code (`zip`), within a radius of a place or coordinate (`near`), or the top-ranked schools at one level (`level` alone). Returns band, Scope Score, archetype and profile URL for each match. Private schools are flagged and never ranked — they have no state testing data. Supply exactly one of query, zip or near; or none plus a level for a top list. Set `tk: true` to limit any of these searches to schools with active transitional kindergarten (TK) enrollment — a filter that composes with query, zip, near and level, and every result carries a `hasTk` field. Set `type` to `charter` to list only charter schools (they admit by application and lottery, not by address), `standard` for district-run public schools, or `private`; like `tk`, it composes with every mode.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
