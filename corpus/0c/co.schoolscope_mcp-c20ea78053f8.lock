                "description": "Restrict to one level. A campus matches every level it teaches (a K-8 matches elementary and middle) and reports that level's score. Applied before the result limit. Elementary, middle and high are scored on separate scales and are never mixed; without a level, results are grouped by level. With no query/zip/near, returns the top-ranked schools at this level.",
                "enum": ["elementary", "middle", "high"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A point to search around: 'lat,lng' (e.g. '37.4299,-122.1285'), a 5-digit zip, or a California city name. Zips and city names resolve to the centre of the schools we hold there, so no external geocoding is needed. Radius search crosses district and city lines on purpose — that is the point of asking geographically.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "query": {
                "description": "Free text: school, city or district name, e.g. 'lowell', 'palo alto unified'",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "radius_miles": {
                "default": 5,
                "description": "Radius for `near`, in miles. Default 5. Ignored unless `near` is set.",
                "maximum": 25,
                "minimum": 0.5,
                "type": "number"
              },
              "tk": {
                "description": "true limits results to schools with active transitional kindergarten (TK) enrollment.",
