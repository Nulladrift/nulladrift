            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slugs": {
                "description": "2-4 school slugs, each the last segment of a schoolscope.co/ca/school/<slug> address, e.g. ['lowell-high-3407', 'henry-m-gunn-high-2904']",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
