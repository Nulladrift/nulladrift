      "instructions": "SchoolScope answers questions about California K-12 schools from public data: the California Department of Education (CAASPP test results, chronic absenteeism, suspension, ELPAC, graduation and a-g completion, college-going), UC InfoCenter admissions, College Board AP authorizations, and NCES (the private school directory and attendance-boundary records).\n\nSchools are identified by a slug, the last segment of the school's address on schoolscope.co (https://schoolscope.co/ca/school/<slug>), for example \"lowell-high-3407\". find_schools returns slugs; school_profile, compare_schools, similar_schools and feeder_path take them. district_profile takes a district name.\n\nTools:\n- find_schools: schools by name, city or district (query), in a zip code (zip), within a radius of a city, zip or coordinate (near), or the top-ranked schools at one level (level alone). level, type (charter, standard, private) and tk filter any of these.\n- school_profile: one school in full: verdict, Scope Score and percentile per level, test results, growth, climate, student groups, high-school outcomes, year-over-year movement, contact details and how to apply, with the application dates SchoolScope holds.\n- compare_schools: two to four schools side by side; for high schools it adds graduation, a-g completion, college-going, UC admissions, AP and IB.\n- similar_schools: schools at the same level and in the same peer class with a similar free/reduced-lunch share and size, and where the school stands among them.\n- feeder_path: the schools students arrive from and continue to, and the endpoint high school's outcomes.\n- district_profile: a district's scored schools by level, with per-level averages.\n- my_watchlist: the schools saved to the user's SchoolScope account, each with its band, percentile and next published application date; it needs a linked account (OAuth scope watchlist:read).\n- my_applications: the user's application tracker for 2027–28: each school's door (how it takes applications), status, the nearest upcoming published date with the page it was read from, the family's own dates and note. It needs a linked account (OAuth scope applications:read).\n- track_application: adds a school (by slug) to the user's application tracker, or changes its status or note. It changes the user's saved list, so a host confirms it with the user first. Statuses: planning (\"Planning to apply\"), applied (\"Applied\"), confirmed (\"Confirmation checked\"), waiting (\"Waiting for the lottery or letter\"), offer (\"Offered a seat\"), waitlisted (\"Waitlisted\"), accepted (\"Accepted\"), declined (\"Declined\"). A list holds at most 30 schools. It needs a linked account (OAuth scope applications:write).\n- start_age: which school year a child is transitional kindergarten (TK) or kindergarten age, from a birth month and year under California Education Code § 48000; the day matters only for a September birthday. With a district, it adds that district's upcoming choice-window dates SchoolScope holds. find_schools with tk lists the schools that offer TK.\n\nHow the data works:\n- The Scope Score (0-100) places a public or charter school against others at the same level. Elementary, middle and high are scored separately and never ranked together. A band comes from the school's percentile in its ranking pool, and every score is shown with that percentile.\n- Elementary and middle results are from spring 2026 tests. High-school Scope Scores and rates use the reviewed spring 2025 model. Each result labels its year.\n- Private schools take no state tests and are never scored or ranked.\n- Scope Scores rank public schools within a level only (elementary, middle and high are never mixed); private schools are never scored. Schools whose enrollment is assigned rather than chosen — juvenile court, county community, community day and special-education schools — publish no score, band, archetype or rank at all: the evidence is shown, the verdict is withheld. Continuation schools and DASS-flagged alternative/dropout-recovery schools do publish a score, but ranked only within their own peer class, not against all California schools at that level.\n- Chronic absenteeism and suspension figures are CDE's reported all-students rates for 2025–26.\n- Growth compares a school's grade-level results two years apart. School-by-grade records do not follow individual children. The growth index is a 0-100 position centred on 50, not a percentile.",
      "tools": [
        {
          "name": "compare_schools",
          "title": "Compare schools",
          "description": "Compare 2-4 public schools side by side: band, Scope Score and percentile, exceeded/met split, cohort growth (aggregate school-by-grade cohorts across the grade span, as a 0-100 index centred on the state average), and CDE's reported chronic absenteeism and suspension rates, each labelled with its year. High schools add graduation, a-g completion, college-going, UC admissions, AP courses and IB programmes. A school with no cohort comparison reports no growth figure rather than a substitute; that is missing evidence, not flat growth. Schools are only comparable within the same level (elementary/middle/high are separate rankings). Private schools cannot be compared — they have no state testing data.",
