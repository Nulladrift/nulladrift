        {
          "name": "start_age",
          "title": "TK and kindergarten start age",
          "description": "Which school year a California child is transitional kindergarten (TK) or kindergarten age, from a birth month and year, under California Education Code § 48000 (TK: fourth birthday by September 1; kindergarten: fifth birthday on or before September 1). The birth day matters only in September, where September 1 and September 2–30 fall on different sides of the cutoff; without it, both outcomes are given. With a district, it adds that district's upcoming choice-window dates SchoolScope holds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "birth_day": {
                "description": "Only for a September birthday: the day of the month. Ignored for other months.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "birth_month": {
                "description": "The child's birth month, 1-12.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "birth_year": {
                "description": "The child's birth year, e.g. 2022.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "district": {
                "description": "Optional: the family's school district name, e.g. 'san diego unified'.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["birth_month", "birth_year"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "choiceDates": {
