          "title": "Forty Forward program overview",
          "description": "What Forty Forward is, who it is for and not for, what the 8-week 35+ Metabolic Reset Method includes, the guarantee, and how to get started. Use when a user asks about the coaching, Chris and Elle, or what she would get.",
