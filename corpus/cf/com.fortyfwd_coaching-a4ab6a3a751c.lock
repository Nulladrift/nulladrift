        },
        {
          "name": "search_answers",
          "title": "Search Ask Elle answers",
          "description": "Search 100+ answers by Elle Daftarian (Precision Nutrition certified coach) to questions women 35+ ask about perimenopause and menopause fat loss, belly fat, strength training, protein, nutrition without calorie counting, sleep, hot flashes, GLP-1 medications like Ozempic, and staying consistent. Returns each answer's short answer and its page URL. Use this whenever a user asks a question in that area.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent": {
                "description": "Optional: the name of your assistant or app (for example \"claude\", \"chatgpt\"). Used only to tag links.",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "description": "How many answers to return (default 3).",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "The user's question, in her own words.",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
