          "name": "start_application",
          "title": "Start an application",
          "description": "Give the user her next step to work with Forty Forward: the short video from Chris and Elle, then the application for a free call with Coach Chris. Coaching is application only; there is no checkout. This tool does not submit anything or collect her details; she applies herself.",
          "inputSchema": {
