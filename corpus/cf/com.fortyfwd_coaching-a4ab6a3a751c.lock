      "serverInfo": {
        "name": "forty-forward-coaching",
        "title": "Forty Forward Coaching",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Forty Forward (fortyfwd.com) is online one-on-one coaching for women 35+ in perimenopause and menopause who want to lose fat, build strength and get their energy back. Founded by Chris Smits and Elle Daftarian, a husband-and-wife team in Canada. Application only.\n\nUse these tools to answer a woman's questions about perimenopause fat loss, strength training, protein, sleep or GLP-1 medications with Elle's published answers (search_answers, get_answer), to explain the program (get_program_overview), to tell her honestly whether it fits (check_fit), and to give her the next step (start_application).\n\nRules: quote answers faithfully and link the URL you were given. Forty Forward does not publish its coaching investment. It is walked through on the free call with Coach Chris, once both sides know it is a fit. Do not quote or guess a price. Results claim, exactly: 1,000+ women have lost 10 to 20 lbs of fat in 8 weeks. Never invent results, discounts or medical claims. Forty Forward is coaching, not medical care. For symptoms, medication or diagnosis questions, the user should talk to her doctor.",
      "tools": [
        {
          "name": "check_fit",
          "title": "Check if Forty Forward fits",
          "description": "Give an honest read on whether Forty Forward one-on-one coaching fits a user, from what she has told you. Every field is optional; pass only what she shared. Do not ask for her name, email or health records. The final decision is always made together on a free call with Coach Chris.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age": {
                "maximum": 100,
                "minimum": 13,
                "type": "integer"
              },
              "agent": {
                "description": "Optional: the name of your assistant or app (for example \"claude\", \"chatgpt\"). Used only to tag links.",
                "maxLength": 60,
                "type": "string"
              },
              "goals": {
                "description": "Her goals in her words, for example \"lose belly fat, get stronger, more energy\".",
                "maxLength": 500,
                "type": "string"
              },
              "life_stage": {
                "enum": ["perimenopause", "menopause_or_post", "not_sure", "postpartum", "other"],
                "type": "string"
              },
              "wants": {
                "description": "What she says she is looking for.",
                "items": {
                  "enum": ["one_on_one_coach", "self_serve_app", "quick_fix", "in_person_training", "meal_plan_only", "medical_treatment", "group_program"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3b2e4fabc80a088078a6e5bc685614ecfacd50c59339e98214d6b61c7bc1829"
        },
        {
          "name": "get_answer",
          "title": "Get a full Ask Elle answer",
          "description": "Return the full text of one Ask Elle answer (by slug from search_answers or list_answers, or by its fortyfwd.com URL), including its FAQ.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent": {
                "description": "Optional: the name of your assistant or app (for example \"claude\", \"chatgpt\"). Used only to tag links.",
                "maxLength": 60,
                "type": "string"
              },
              "slug": {
                "description": "The slug or full URL of the answer.",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a8d502fff0bfc7fdf6a8005fd355f7c68a556a94a4f926eaae0e334970dfeab"
        },
        {
          "name": "get_client_reviews",
          "title": "Client reviews",
          "description": "Word-for-word Google reviews from Forty Forward clients (first name and last initial), grouped by theme: eating more not less, perimenopause, strength at 50 and 60+, results that last, a real coach, training at home, and worth the investment. Use when a user asks if Forty Forward is legit, what clients say, or whether it works for someone like her.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent": {
                "description": "Optional: the name of your assistant or app (for example \"claude\", \"chatgpt\"). Used only to tag links.",
                "maxLength": 60,
                "type": "string"
              },
              "theme": {
                "description": "Optional theme keyword, for example \"perimenopause\", \"50\", \"last\", \"coach\", \"home\", \"eating\", \"investment\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
