      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "jojapi-linkedin",
        "title": "LinkedIn API — JoJ API",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Tools are the documented endpoints of LinkedIn on the JoJ API marketplace, called through the live gateway. Calls require a JoJ API key sent as an HTTP header on this MCP connection (Authorization: Bearer jk_...). Keys: https://jojapi.com/workspace/api-keys · Plans: https://jojapi.com/hub/api/linkedin/pricing · Docs: https://jojapi.com/hub/api/linkedin",
      "tools": [
        {
          "name": "get_company",
          "title": "Get a company profile",
          "description": "Provide either `slug` or `companyId`. If neither is given, the request fails with\n`400 VALIDATION_ERROR`.\n\nTake the `slug` from a `/company/search` result rather than guessing it from the\ncompany name — a company's slug often differs from its display name. Group: Companies. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companyId": {
                "description": "The company's numeric identifier. Required unless `slug` is provided.",
                "example": "1035",
                "type": "string"
              },
              "slug": {
                "description": "The company's short name, as it appears in its LinkedIn URL.\nRequired unless `companyId` is provided.",
                "example": "intel-corporation",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a4db27c34137f5c3d186b8736227f7856d044ee1087cceba9853857f649076c"
        },
        {
          "name": "get_company_companyId_employees",
          "title": "List a company's employees",
          "description": "Returns people who list this company as their employer.\n\nResults may include private or out-of-network profiles, which appear with the name\n`LinkedIn Member`. Full profiles cannot be retrieved for those records, so check\nthe name before calling `/person-profile` with the returned `memberId`. Group: Companies. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companyId": {
                "description": "The company's numeric identifier, from `/company/search` or `/company`.",
                "example": "1035",
                "type": "string"
              },
              "count": {
                "default": 25,
                "description": "Number of results per page.",
                "type": "integer"
              },
              "start": {
                "default": 0,
                "description": "Offset of the first result. Pass the `cursor` value from the previous response to\nfetch the next page.",
                "type": "integer"
              }
            },
            "required": ["companyId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:803aa6738ca13576388f9e3b1b92b0178c324b221263cfee8fb269ac4e39bc3f"
        },
        {
          "name": "get_company_companyId_jobs",
          "title": "List a company's open jobs",
          "description": "Returns an empty list if the company has no open postings.\nUse the `jobId` from a result with `/jobs/detail/{jobId}`. Group: Companies. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companyId": {
                "description": "The company's numeric identifier, from `/company/search` or `/company`.",
                "example": "1035",
                "type": "string"
              },
              "count": {
                "default": 25,
                "description": "Number of results per page.",
                "type": "integer"
              },
              "start": {
                "default": 0,
                "description": "Offset of the first result. Pass the `cursor` value from the previous response to\nfetch the next page.",
                "type": "integer"
              }
            },
            "required": ["companyId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1450b1f6046f4c8cffa62172bff43e01a6cf33cee27dd3d32bb1a1e5a53a383"
        },
        {
          "name": "get_company_posts",
          "title": "List a company's posts",
          "description": "Returns the same post structure as `/person-profile/posts`.\nThis endpoint is addressed by `slug` only. Group: Companies. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 10,
                "description": "Number of posts per page.",
                "type": "integer"
              },
              "slug": {
                "description": "The company's short name, as it appears in its LinkedIn URL.",
                "example": "microsoft-azure",
                "type": "string"
              },
              "start": {
                "default": 0,
                "description": "Offset of the first result. Pass the `cursor` value from the previous response to\nfetch the next page.",
                "type": "integer"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:80aa7773b3609e4a959dac07deff9e2c5be3f0828567478b742147019eb17310"
        },
        {
          "name": "get_company_search",
          "title": "Search companies",
          "description": "Use the `slug` or `companyId` from a result to fetch full details from `/company`,\nthe employee list, or the job list. Group: Companies. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 25,
                "description": "Number of results per page.",
                "type": "integer"
              },
              "keyword": {
                "description": "Free-text search term.",
                "example": "teknoloji",
                "type": "string"
              },
              "start": {
                "default": 0,
                "description": "Offset of the first result. Pass the `cursor` value from the previous response to\nfetch the next page.",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39cc2f33a374e98064546fec12111117f311175586a66382788b2074c6ad180d"
        },
        {
          "name": "get_jobs_detail_jobId",
          "title": "Get a job posting",
          "description": "Returns the full description for a posting. Several fields are only present on some\npostings; the company name is most reliably taken from the search result that\nprovided the `jobId`. Group: Jobs. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "jobId": {
                "description": "The posting's identifier, from `/jobs/search` or `/company/{companyId}/jobs`.",
                "example": "4458090637",
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8fbaf8fee8be5af5d1f02e07d4ec2568f176ac5a9164c6d5eda951fdcd188ab4"
        },
        {
          "name": "get_jobs_search",
          "title": "Search job postings",
          "description": "Use the `jobId` from a result with `/jobs/detail/{jobId}`. Group: Jobs. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "count": {
                "default": 25,
                "description": "Number of results per page.",
                "type": "integer"
              },
              "geoId": {
                "description": "Location code. Türkiye is `102105699`; worldwide is `92000000`.",
                "example": "102105699",
                "type": "string"
              },
              "keyword": {
                "description": "Search term for the job title or description.",
                "example": "backend",
                "type": "string"
              },
              "start": {
                "default": 0,
                "description": "Offset of the first result. Pass the `cursor` value from the previous response to\nfetch the next page.",
                "type": "integer"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d76cb1f783600ec9914fcd3289e92b908b2f153a12ed254100bf94d525904407"
        },
        {
          "name": "get_people_search",
          "title": "Search people",
          "description": "All filters are optional and can be combined. Returns the same person structure as\n`/company/{companyId}/employees`. Returns an empty list when nothing matches. Group: Person. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "companyId": {
                "description": "Restrict results to people at this company.",
                "type": "string"
              },
              "count": {
                "default": 25,
                "description": "Number of results per page.",
                "type": "integer"
              },
              "geoUrn": {
                "description": "Location code. Türkiye is `102105699`.",
                "example": "102105699",
                "type": "string"
              },
              "keyword": {
                "description": "Free-text search term.",
                "example": "software engineer",
                "type": "string"
              },
              "start": {
                "default": 0,
                "description": "Offset of the first result. Pass the `cursor` value from the previous response to\nfetch the next page.",
                "type": "integer"
              },
              "title": {
                "description": "Restrict results by job title.",
                "example": "engineer",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b104deb646a96e4b5b7993031c2d3b56beae2b8dc1c438d34a9f3e8de2e860c3"
        },
        {
          "name": "get_person_profile",
          "title": "Get a person's profile",
          "description": "Returns a full profile including experience, education, and skills.\n\nObtain a `memberId` from `/people/search` or `/company/{companyId}/employees`.\nNote that profiles which are private or outside your network cannot be retrieved;\nthese appear in listings with the name `LinkedIn Member`. Group: Person. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "memberId": {
                "description": "A LinkedIn member identifier, returned by `/people/search` and\n`/company/{companyId}/employees`.",
                "example": "ACoAAAEkwwAB9KEc2TrQgOLEQ-vzRyZeCDyc6DQ",
                "type": "string"
              }
            },
            "required": ["memberId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:436e6ae409c6bfb1b4b23a6663eda6ed37415cacd0bb98260f1d79fdb8442f32"
        },
        {
          "name": "get_person_profile_posts",
          "title": "List a person's posts",
