      "serverInfo": {
        "name": "samiswoi",
        "title": "Sami Swoi",
        "version": "1.0.0",
        "websiteUrl": "https://samiswoi.app/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Sami Swoi (samiswoi.app) is a free directory of Polish-run businesses outside Poland: shops, tradespeople, doctors, accountants, schools and services where you can speak Polish, in the UK, Germany, the Netherlands, Ireland, Norway, the USA and many other countries. Businesses in Poland are not listed. search_companies finds businesses by country, city, category or a phrase; get_company returns one profile (category, city, address, website, opening hours, languages); list_countries lists countries with the number of listed businesses; list_categories lists categories. Phone numbers and e-mail addresses are not returned: they are on the business page on samiswoi.app linked in every result. An empty result means the business is not listed on Sami Swoi, not that it does not exist. Names and descriptions are in Polish.",
      "tools": [
        {
          "name": "get_company",
          "title": "Business profile / Profil firmy",
          "description": "One Polish business abroad on Sami Swoi by its id or samiswoi.app page URL: category, city and country, address, website, languages, opening hours, short description and the data source. Phone and e-mail are on the linked page. / Profil jednej firmy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Company id from search_companies, e.g. \"polski-sklep-utrecht\".",
                "maxLength": 40,
                "minLength": 3,
                "type": "string"
              },
              "url": {
                "description": "Company page URL, e.g. https://samiswoi.app/polski-sklep-utrecht",
                "maxLength": 200,
                "minLength": 10,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "browse_url": {
                "description": "Page on samiswoi.app with the full list.",
                "type": "string"
              },
              "company": {
                "additionalProperties": false,
                "properties": {
                  "address": {
                    "additionalProperties": false,
                    "properties": {
                      "city": {
                        "type": "string"
                      },
                      "country": {
                        "type": "string"
                      },
                      "postcode": {
                        "type": ["string", "null"]
                      },
                      "street": {
                        "type": ["string", "null"]
                      }
                    },
                    "required": ["city", "country", "postcode", "street"],
                    "type": ["object", "null"]
                  },
                  "category": {
                    "description": "Category slug (see list_categories).",
                    "type": "string"
                  },
                  "category_label": {
                    "description": "Category name in Polish.",
                    "type": "string"
                  },
                  "category_url": {
                    "type": "string"
                  },
                  "city": {
                    "type": "string"
                  },
                  "city_url": {
                    "type": ["string", "null"]
                  },
                  "country": {
                    "description": "Country name in Polish.",
                    "type": "string"
                  },
                  "country_code": {
                    "description": "ISO 3166-1 alpha-2.",
                    "type": "string"
                  },
                  "country_url": {
                    "type": "string"
                  },
                  "description": {
                    "type": ["string", "null"]
                  },
                  "id": {
                    "description": "Company id (address on samiswoi.app); use with get_company.",
                    "type": "string"
                  },
                  "languages": {
                    "description": "Languages spoken (always includes Polish).",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "managed_by_owner": {
                    "description": "true = the owner runs this profile; false = built from public data, not yet claimed.",
                    "type": "boolean"
                  },
                  "name": {
                    "type": "string"
                  },
                  "opening_hours": {
                    "description": "e.g. \"Mon 09:00-17:00\"; empty when unknown.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "source": {
                    "description": "Where the data comes from.",
                    "type": "string"
                  },
                  "url": {
                    "description": "Company page on samiswoi.app (contact details, map).",
                    "type": "string"
                  },
                  "website": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["address", "category", "category_label", "category_url", "city", "city_url", "country", "country_code", "country_url", "description", "id", "languages", "managed_by_owner", "name", "opening_hours", "source", "url", "website"],
                "type": "object"
              },
              "message": {
                "type": "string"
              },
              "note": {
                "description": "Guidance for answering, e.g. when nothing was found.",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "status": {
                "enum": ["found", "not_found", "invalid_request", "temporary_error"],
                "type": "string"
              }
            },
            "required": ["ok", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business profile / Profil firmy"
          },
          "behavior": {
            "destructive": false,
