        {
          "name": "search_companies",
          "title": "Search Polish businesses abroad / Szukaj polskich firm",
          "description": "Search Polish-run businesses outside Poland listed on Sami Swoi (samiswoi.app), for questions like \"Polish plumber in London\", \"Polish shop in Utrecht\", \"Polish dentist in Oslo\", \"polska księgowa w Dublinie\". Filters: country, city, category (slug or Polish word, see list_categories) and a phrase from the name or kind of business. Returns up to 20 businesses per call (page with offset/next_offset), each with city, category and its samiswoi.app page, plus the total. / Polskie firmy za granicą: kraj, miasto, kategoria, fraza.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug from list_categories (e.g. \"hydraulik\", \"sklep-spozywczy\") or a Polish word (\"dentysta\", \"fryzjer\"). / Kategoria.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "city": {
                "description": "City, e.g. \"London\", \"Londyn\", \"Utrecht\". Best together with country. / Miasto.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "country": {
                "description": "Country: ISO code (\"GB\", \"DE\", \"NL\") or name in Polish or English (\"Holandia\", \"Germany\"). / Kraj.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results (1-20, default 10).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many matches; use next_offset.",
                "maximum": 2000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words from the business name or kind, Polish works best (\"delikatesy\", \"mechanik\", \"Biedronka\"). / Fraza.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "browse_url": {
                "description": "Page on samiswoi.app with the full list.",
                "type": "string"
              },
              "candidates": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "companies": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "category": {
                      "description": "Category slug (see list_categories).",
                      "type": "string"
                    },
                    "category_label": {
                      "description": "Category name in Polish.",
                      "type": "string"
                    },
                    "city": {
                      "type": "string"
                    },
                    "country": {
