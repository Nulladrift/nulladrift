      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.gtmforone.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "gtm-for-one",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use preview_outreach when the user gives a company website and asks who might buy from that company, who its competitors are, which customer segments to target, or for a first outreach email to a prospect. Pass the website as domain. If the result has done: false, call continue_preview with its previewId until done is true. The tools read public website content only and never return email addresses or contact details for individuals; do not use them to look up a specific person.",
      "tools": [
        {
          "name": "continue_preview",
          "title": "Continue a preview",
          "description": "Fetch the latest results of a preview_outreach run that returned done: false. Pass the previewId it returned. Read-only for the user: it sends nothing, saves nothing to any account, and changes nothing anywhere.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "previewId": {
                "description": "The previewId from preview_outreach",
                "pattern": "^demo_[a-f0-9]{16}$",
                "type": "string"
              }
            },
            "required": ["previewId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Continue preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Preview updated",
            "openai/toolInvocation/invoking": "Carrying on",
            "openai/widgetAccessible": true
          },
          "digest": "sha256:d5aa6c7e12463fd032eba65b7eadd62e3463e1d4609bd9060a88987cd823b1cf"
        },
        {
          "name": "preview_outreach",
          "title": "Preview outreach for a company",
          "description": "Use when someone wants to know who might buy from a company, who its competitors are, or what a first cold email to a prospect could say. Give it the company website. It reads the public website and returns a preview: what the company sells, competitors, buyer segments, how many companies match, five example companies, and example email text. It is read-only for the user: it sends nothing, saves nothing to any account, and changes nothing anywhere; the example emails are text shown in the answer, not drafts in a mailbox. Takes up to a minute; if it is not finished, call continue_preview with the previewId it returns.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "The company website, for example acme.com or https://acme.com",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Preview outreach"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://gtmforone/preview-v5.html",
            "openai/toolInvocation/invoked": "Preview ready",
            "openai/toolInvocation/invoking": "Reading the website",
            "ui": {
              "resourceUri": "ui://gtmforone/preview-v5.html"
            }
          },
          "digest": "sha256:9dbed23fa7ba4f587445700f84f6235bff4f0784efe1694ab682c237a38441b5"
        }
      ],
      "resources": [
