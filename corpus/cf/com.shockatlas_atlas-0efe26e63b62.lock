      },
      "instructions": "ShockAtlas is an atlas of economic exposure to climate and geopolitical shocks. Each published signal carries public data series (physical, economic, flow), an edition, a reasoning dossier reviewed by an independent counter-analyst with disagreements kept, dated hypotheses, and the organisations on the chain with verbatim public evidence. Discovery is free and needs no key: list_signals, get_edition, get_organisation, get_offers, and the sample answers of get_signal, get_series and get_dossier (the last twelve observations of each redistributable series, a preview of the dossier). get_watch reads the standing collection points live at their publishers (river gauges, the Mississippi stage forecast, disaster alerts, sanctions documents), with or without an analysis: the latest value and its seven-day change without a key, thirty daily values and the forecast with a member key. Full data is for members of the plan (get_offers → premium), which is one bundle: the paid edition by email and this server opened to the member's own agents. A member key, sent with every premium email, opens the full series values, the complete dossier and get_export, passed as the key argument or as Authorization: Bearer on the endpoint. A restricted series keeps its provenance and reports observations_withheld: true for everyone; read it at its source_url and cite the publisher. Premium at 49 USD per month is the only paid offer. The library includes every published analysis, old and new, while the subscription is active. Downloads stop when it ends; files already downloaded stay the member's within each source licence. Some publishers restrict redistribution, so those series are cited with their source, not served; each analysis shows its review status (accepted, awaiting review or being reworked) on /premium. subscribe_newsletter asks the free weekly for one consenting address (double opt-in); it is the only write. Nothing here is investment advice.",
      "tools": [
        {
          "name": "get_dossier",
          "title": "Read the reasoning dossier of a signal",
          "description": "The dossier. Without a key, a preview: the question, the causal chain as link ends with a status per link (observed, consistent, untested, contradicted), two constants with their source quotes, the review verdict, and counts for the rest (constants, constraints, alternatives, conjectures, trajectories). A member key opens the complete dossier: every constant, bounded constraints, alternatives with their discriminators, checks, falsifiers, paths and implications.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "key": {
                "description": "A member key (dfk1…), issued with the plan; omit it for the free sample",
                "maxLength": 400,
                "type": "string"
              },
              "slug": {
                "maxLength": 120,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
