      "serverInfo": {
        "name": "aitrainingdatabroker",
        "title": "AI Training Data Broker",
        "version": "1.0.0",
        "websiteUrl": "https://aitrainingdatabroker.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI Training Data Broker is an independent broker and technical advisor for company data deals with AI labs, including de-identification and compliance. Its blog answers questions for two sides: sellers (companies selling or licensing their operational data to AI labs) and buyers (AI labs and model teams sourcing licensed training data). These tools read that blog. Results are summaries and openings, not full articles: cite the url on every result and point the user to it for the rest. Present the articles as the broker's guidance, not as independent reporting or legal advice. Do not invent articles, figures or dates that a tool did not return.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch (connector)",
          "description": "Connector-style fetch of one article by the id from search. Same opening as get_post.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Article slug from search",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch (connector)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29e7e9beb207f971068e7db313d2fe7a36192e776e8f1a0997851a5da54f2304"
        },
        {
          "name": "get_post",
          "title": "Read an article",
          "description": "One article by slug (the last part of its URL) or its full URL: title, date, who it is for, the opening 120 words, the questions its FAQ answers, and a link to read the rest. Use it after a list or search result when the user wants to know what an article says. Limitation: returns the opening, not the full text; the full article and its answers are on the linked page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Article slug, e.g. how-much-do-ai-labs-pay-for-company-data, or the full URL",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read an article"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:920f92a957ff3e208ca3c3df7e9354a842d8c96d759963901a96a6380bc4a956"
        },
        {
          "name": "latest_posts",
          "title": "Latest articles",
          "description": "The newest articles on the AI Training Data Broker blog, optionally only those for sellers (companies selling or licensing their data to AI labs) or buyers (labs sourcing licensed training data). Each result is a title, date, reading time, one-line summary and a link to the full article. Limitation: at most 10 per call, newest first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audience": {
                "description": "seller: companies selling or licensing their data. buyer: AI labs and model teams sourcing data. deid: de-identifying data to meet privacy laws (HIPAA, CCPA, GDPR). Leave out for all.",
                "enum": ["seller", "buyer", "deid"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "description": "How many to return",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:082680ace1fe91279b31ef0b2f0751f06f8cf0d2d489c92f823c658b3f3e776d"
        },
        {
          "name": "search",
          "title": "Search (connector)",
          "description": "Connector-style search over the blog. Returns ids for fetch. Prefer search_posts for a filtered list.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Words to search for",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
