      "instructions": "Capxule guided journeys: step-by-step journeys through one topic each, written from the creator's sources. Each step is composed here and returned as one beat (answer, statement, numbered options) for you to show the user. find_journey finds a journey for a topic; list_journey_categories and browse_journeys show what exists; open_journey starts or resumes one; take_journey_step sends the user's choice and returns the next step; get_journey_progress reports where the user is; create_takeaway makes a summary to keep; get_resume_link returns a link to continue later; restart_journey starts over only when the user asks. Show answer and every options[].text as given; statement may be reworded. Read each card's for and not_for to the user before opening a journey. If a step carries wall, tell the user wall.for_human; when it offers a link, share the link. Every error carries code, for_human, for_agent and next. At the first step, tell the user once that the answers come from Capxule's AI and not from a person (open_journey carries that sentence as notice.for_human). This service needs no personal information: do not ask the user for health, biometric, government ID, financial or payment details, email addresses or passwords, and do not pass such details in any argument. Documentation: https://capxule.ai/llms.txt. Topics covered: 344 guided journeys across 15 areas: Education (179, e.g. Master AP U.S. History: The Complete APUSH Exam…; Win More Financial Aid Support Before Enrollment), Career (41, e.g. Verify Remote Job Listings Before You Apply or…; Alaska Real Estate Salesperson License Exam), Culture (22, e.g. One Piece: The Grand Line Voyage — Complete Sto…; Mastering Speedrun Optimization Through Glitche…), Business (21, e.g. Mastering Email Sequences for Customer Recovery…; How to Navigate Budget Questions in Sales Disco…), Lifestyle (13, e.g. Choosing Childcare: Balancing Cost, Quality, an…; Home Solar Decisions, Done Right), Technology (13, e.g. The Age of AI: From Antiquity to Modern Age; AI Boom Economics: Profits, Compute Costs, and…), Psychology (12), Food (10), Fitness (8), Exam preparation (6), Science (5), Society (5), Creative (4), Applications and filings (3), History (2). The full list is the resource capxule://catalog.",
