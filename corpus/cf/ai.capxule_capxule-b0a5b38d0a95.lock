        {
          "name": "take_journey_step",
          "title": "Take a journey step",
          "description": "Use for every step after open_journey. Sends the user's choice and returns the next step: `answer`, `statement`, numbered `options` with ids, `media`, `progress` and `limits`. Send `pick` with an option id when the user chose an option or its number; otherwise send `say` with what the user said. `go` jumps to a stop from the contract; `drill` and `simulate` start practice on exam journeys; `exit` leaves practice. Supply a fresh `turn_id` per step; a repeat returns the stored step. If the step carries `wall`, tell the user `wall.for_human`.",
          "inputSchema": {
            "properties": {
              "action": {
                "oneOf": [
                  {
                    "properties": {
                      "kind": {
                        "const": "pick",
                        "type": "string"
                      },
                      "option": {
                        "description": "An option id from the LAST beat.",
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      "said": {
                        "description": "What else the user said about this step, when they said more than the option. No personal details.",
                        "maxLength": 500,
                        "type": "string"
                      }
                    },
                    "required": ["kind", "option"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "kind": {
                        "const": "say",
                        "type": "string"
                      },
                      "text": {
                        "description": "What the user said in reply to this step. No personal details.",
                        "maxLength": 1000,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["kind", "text"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "kind": {
                        "const": "go",
                        "type": "string"
                      },
                      "node": {
                        "description": "A stop id from the contract's toc.",
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": ["kind", "node"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "kind": {
                        "const": "drill",
                        "type": "string"
                      }
                    },
                    "required": ["kind"],
                    "type": "object"
                  },
                  {
                    "properties": {
                      "kind": {
                        "const": "simulate",
                        "type": "string"
                      },
                      "scenario": {
                        "description": "A scenario id from capabilities.scenarios.",
                        "maxLength": 64,
