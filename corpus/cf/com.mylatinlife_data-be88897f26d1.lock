              "origin": {
                "description": "Current tax-country model.",
                "enum": ["canada", "usa", "uk", "australia", "germany", "france", "netherlands", "other_high"],
                "type": "string"
              },
              "subdivision": {
                "description": "US state or Canadian province from the model; omit for the default rate curve.",
