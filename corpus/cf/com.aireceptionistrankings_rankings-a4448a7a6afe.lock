        },
        {
          "name": "get_vendor",
          "title": "One vendor's ranking facts",
          "description": "An AI receptionist's plans, cost at 100 and 200 calls (and any volume you choose), billing model, contract terms, trial, spam billing, integrations and score, each with its source page and read date. Accepts an id or a name, e.g. \"NextPhone\", \"Smith.ai\", \"Rosie\". Source: AI Receptionist Rankings, data read from vendor pages, https://www.aireceptionistrankings.com/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "calls": {
                "description": "Compute the monthly cost at this call volume too",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "vendor": {
                "description": "Vendor id or name",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["vendor"],
            "type": "object"
          },
