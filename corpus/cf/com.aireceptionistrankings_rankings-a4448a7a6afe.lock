          "name": "compare_vendors",
          "title": "Compare AI receptionists",
          "description": "Two or more AI receptionists side by side at 100 and 200 calls a month: cost, billing model, plan limit, contract, trial, spam billing, integrations and score. Accepts ids or names. Source: AI Receptionist Rankings, data read from vendor pages, https://www.aireceptionistrankings.com/",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "vendors": {
                "description": "Vendor ids or names",
                "items": {
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["vendors"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
