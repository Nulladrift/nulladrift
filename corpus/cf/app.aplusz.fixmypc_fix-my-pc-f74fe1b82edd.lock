        "name": "app.aplusz.fixmypc/fix-my-pc",
        "title": "Fix My PC",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "find_fix",
          "title": "Find the fix for a computer problem",
          "description": "Which one-press fix solves this computer problem? Give the problem in the user's own words (for example: my wifi keeps dropping, pc is slow, no sound). problem is required. system is optional (windows, macos, linux, android, ios): pass it when the user said which device they use, and the answer adds what the fix does on that system. Returns up to 3 fixes, best first, each with the page to open; there the user presses Fix it. Do not invent a fix name: call this.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "problem": {
                "description": "The problem in plain words. Example: bluetooth keeps disconnecting",
                "type": "string"
              },
              "system": {
                "description": "The user's device, when known",
                "enum": ["windows", "macos", "linux", "android", "ios"],
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d8e239f54bd6f3965284f1ad809d554d592d765cc6e85989a69e852f3342efe6"
        },
        {
          "name": "list_fixes",
          "title": "List every fix",
          "description": "Which computer problems can Fix My PC take care of? Lists every fix with the question it answers and its page. category is optional: one of speed, internet, devices, windows, startup, files, security, customize.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["speed", "internet", "devices", "windows", "startup", "files", "security", "customize"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
