      "instructions": "El Paso Air is a free referral service for AC repair in El Paso, Texas (El Paso, Horizon City, Socorro, Canutillo, Anthony, Santa Teresa). Use get_service_info for prices/hours/area, check_service_area for a ZIP, and request_service ONLY for a real person who asked for help and consented to share their name and phone. A local pro calls them back. Phone/text (915) 286-7051.",
