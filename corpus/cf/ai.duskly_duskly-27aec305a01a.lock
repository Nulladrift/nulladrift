        },
        {
          "name": "duskly_list_prohibited_alterations",
          "title": "Alterations no disclosure can cure",
          "description": "Edits that are prohibited outright in one or more markets and are never made acceptable by adding a disclosure.\n\nUse this when someone asks to remove, conceal or change something in a property photo and you need to know whether a label would make it acceptable. For these, it does not.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
