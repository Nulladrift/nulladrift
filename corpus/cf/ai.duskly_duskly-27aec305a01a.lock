        },
        {
          "name": "duskly_list_edits",
          "title": "List available edits and their compliance status",
          "description": "Every edit Duskly performs, with what it does and how it is classified for disclosure.\n\nUse this to pick the right edit for what someone is asking for, and to see in one call which ones carry compliance consequences.",
