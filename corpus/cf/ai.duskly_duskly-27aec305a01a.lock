        },
        {
          "name": "duskly_start_listing",
          "title": "Get a link for a person to upload photos",
          "description": "Returns the URL a person should open to upload listing photos and run an edit themselves.\n\nUse this when someone wants an edit performed. Editing is deliberately not callable over MCP: a render spends model credit and is gated behind a browser check that an automated client cannot pass. Hand the person the link rather than attempting the edit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "task": {
                "description": "Preselects the edit on the page, when known.",
                "enum": ["day-to-dusk", "virtual-staging", "declutter", "occupied-to-vacant", "sky-replacement", "virtual-renovation"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8284993fda7b02f67834fc7294a680b87aef10850a43da7020181f277a679be"
        },
        {
          "name": "duskly_verify_image",
          "title": "Check an image for provenance marks",
          "description": "Inspect an image for provenance signals: an invisible Duskly watermark, IPTC digital source type metadata, and whether a C2PA container appears present.\n\nWorks on images Duskly did not produce.\n\nRead the result carefully before repeating it. This is a limited inspection report, not a certificate of authenticity or compliance. **The absence of a mark is not evidence that an image is a camera capture** — most AI editors write nothing at all, and Duskly's own paid downloads are deliberately unmarked. The C2PA field reports only that a container appears present: manifests are not parsed, signatures are not validated, and Duskly does not sign them.\n\nPrefer repeating the summary lines over paraphrasing individual fields.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "image_base64": {
                "description": "Base64-encoded JPEG or PNG, up to 8MB decoded. A data: URL prefix is accepted and stripped.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["image_base64"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebea5588c6d53a6f8aae095ad97405103f42b73e0af69824e1ac59a79c981502"
        }
      ],
