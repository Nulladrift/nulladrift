      "serverInfo": {
        "name": "duskly-mcp-server",
        "title": "Duskly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Duskly edits real estate listing photos and returns the unaltered original, the disclosure wording for where the photo is published, and a record of the edit.\n\nThese tools cover the compliance half, which is the part that is free and the part most often got wrong. Use duskly_classify_edit before telling anyone an edit is safe to publish, and duskly_generate_disclosure to produce the wording that has to accompany it.\n\nEditing is not callable here. A render spends model credit and sits behind a browser check an automated client cannot pass, so duskly_start_listing returns a link for a person to open instead. Duskly does not take payment through MCP.\n\nTwo things to carry into any answer you give from these tools: the disclosure duty falls on the licensee publishing the listing rather than on the software, and the absence of a provenance mark is not evidence an image is a camera capture.",
      "tools": [
        {
          "name": "duskly_classify_edit",
          "title": "Classify a listing photo edit",
          "description": "Whether a given edit to a real estate listing photo must be disclosed, and whether any market prohibits it outright.\n\nUse this before telling someone an edit is safe to publish. Returns Duskly's classification with the reasoning behind it, drawn from rulebooks read directly rather than summarised from secondary sources.\n\nClassifications: \"disclosable\" (permitted with disclosure), \"ambiguous\" (most rulebooks Duskly has read do not name it; Duskly discloses by default), \"prohibited\" (one or more markets forbid it even with disclosure), \"exempt\".\n\nNote that \"prohibited\" means prohibited somewhere, not everywhere. Read carve_out when present.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "task": {
                "description": "The edit being performed. One of: day-to-dusk, virtual-staging, declutter, occupied-to-vacant, sky-replacement, virtual-renovation.",
                "enum": ["day-to-dusk", "virtual-staging", "declutter", "occupied-to-vacant", "sky-replacement", "virtual-renovation"],
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:061505e110134297cdb428bc7ab7b0b77f9050b54ef7f4292798eacbaf07f5f1"
        },
        {
          "name": "duskly_generate_disclosure",
          "title": "Generate MLS disclosure wording",
          "description": "The exact disclosure text to publish alongside an edited listing photo, written for each surface it has to appear on: the MLS photo description, public remarks, print, and the syndication feed.\n\nSurfaces have different character budgets, so the wording differs per surface rather than being one sentence repeated. Anything that exceeds its budget is reported in over_limit instead of being silently truncated.\n\nSupply original_url when the unaltered original is published somewhere, which California Bus. & Prof. Code §10140.8 requires for listings there. Supply required_string only when a jurisdiction mandates exact wording; it is then used verbatim and never paraphrased.\n\nThe disclosure duty falls on the licensee publishing the listing, not on the software or the photographer. This generates the wording; a licensee publishes it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "original_url": {
                "description": "Public URL where the unaltered original can be viewed, if one is published.",
                "format": "uri",
                "type": "string"
              },
              "required_string": {
                "description": "Exact wording a jurisdiction mandates. Used verbatim when supplied.",
                "maxLength": 300,
                "type": "string"
              },
              "task": {
                "description": "The edit being performed. One of: day-to-dusk, virtual-staging, declutter, occupied-to-vacant, sky-replacement, virtual-renovation.",
                "enum": ["day-to-dusk", "virtual-staging", "declutter", "occupied-to-vacant", "sky-replacement", "virtual-renovation"],
                "type": "string"
              }
            },
            "required": ["task"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d0c8defc0a6a9f8837c6b5d09bdc94123f64c4268ba3299ed032bc6ed9b986f"
        },
        {
          "name": "duskly_get_checkout_url",
          "title": "Get a payment link for a listing",
          "description": "A Stripe Checkout URL for an unpaid listing, for a **person** to open and pay.\n\nDuskly does not take payment through MCP and no agent completes a purchase. Give this URL to the person you are working for; once they have paid, the listing is unlocked and duskly_get_listing_pack returns the deliverables.\n\nReturns an error for a listing that is already paid.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "listing_id": {
                "description": "The listing id, the part of a Duskly listing URL after /listing/.",
                "pattern": "^listing_[a-f0-9]+$",
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2dba630d0871000ba75a84d8cdcae077e560333cbe89feb8653ff335926bae99"
        },
        {
          "name": "duskly_get_listing",
          "title": "Look up a listing",
          "description": "The state of a Duskly listing: how many photos it holds, which have been edited, whether it has been paid for, and how much of its render budget remains.\n\nTakes the listing id from the listing URL. Possession of that id is what authorises this, exactly as it does on the website.\n\nUse this before duskly_get_listing_pack to check whether a listing has been paid for.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "listing_id": {
                "description": "The listing id, the part of a Duskly listing URL after /listing/.",
                "pattern": "^listing_[a-f0-9]+$",
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d4a6fb2dd6746a3254e926724f2d1ff09fababacff8e37a256c72bcdd7e9918d"
        },
        {
          "name": "duskly_get_listing_pack",
          "title": "Get the deliverables for a paid listing",
          "description": "Everything a paid listing returns: the download link for the archive, the disclosure wording for every edited photo, and the public page showing the originals.\n\nRequires the listing to have been paid for. An unpaid listing returns the checkout URL instead, for a person to open.\n\nThe disclosure wording is generated per photo and per publishing surface. The duty to publish it falls on the licensee publishing the listing, not on the software.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "listing_id": {
                "description": "The listing id, the part of a Duskly listing URL after /listing/.",
                "pattern": "^listing_[a-f0-9]+$",
                "type": "string"
              }
            },
            "required": ["listing_id"],
            "type": "object"
          },
