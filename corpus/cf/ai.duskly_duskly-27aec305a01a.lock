        },
        {
          "name": "duskly_get_pricing",
          "title": "What Duskly costs and what a purchase includes",
          "description": "Duskly's price and what a paid listing returns. Use this when someone asks what it costs or what they get.\n\nEditing is not available over MCP: renders spend model credit and require a browser session. Send the person to the URL in the response to do the work.",
          "inputSchema": {
