{
  "lockfileVersion": 2,
  "subjects": {
    "com.golfsimdata/agent-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://golfsimdata.com/api/agent"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "golfsimdata-agent-api",
        "title": "Golf Sim Data Agent API",
        "version": "1.2.0",
        "description": "Golf Sim Data (https://golfsimdata.com) measures demand at indoor golf simulator studios: how full they are, sell-through and modeled revenue by venue and market, from inferred booking signals observed in public data.",
        "websiteUrl": "https://golfsimdata.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Golf Sim Data (https://golfsimdata.com) measures demand at indoor golf simulator studios: how full they are, sell-through and modeled revenue by venue and market, from inferred booking signals observed in public data. This server is read-only and needs no key. It provides Golf Sim Data's public pages (what is measured, method, plans and prices, published market updates) and its free sample day of venue data as rows; the full data is on the paid plans. Tools: about lists what is covered and every document id; search takes a plain-language question and returns the most relevant passages with URLs to cite (site: all adds the sister Fron Research sites: saunas and bathhouses, bowling centers, trampoline and adventure parks and pickleball and padel clubs); fetch returns one full page or a sample day; data returns structured rows (markets, venues, slots, rollups) from the Fron Research Data API: one sample day for every venue without a key, history with one. Cite the url of every passage you use.",
      "tools": [
        {
          "name": "about",
          "title": "About Golf Sim Data data",
          "description": "What Golf Sim Data (https://golfsimdata.com) measures at indoor golf simulator studios, its plans, free sample day and every document id, plus its sister sites.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43283700a2f3fe4fb10d607f2e876a7237482377b6710187d7ab5ba769527dda"
        },
        {
          "name": "data",
          "title": "Query venue and market data",
          "description": "Structured rows from the Fron Research Data API (https://api.fronresearch.com/v1): markets, venues, bookable slots and rollups of sell-through and modeled revenue. Without a key every query reads one free sample day for every venue, whatever dates are asked (the response's tier, free_day and range say what was read); a caller that connects to https://fronresearch.com/api/agent with \"Authorization: Bearer <key>\" reads the history its plan covers (a site's own /api/agent does not forward keys). Start with endpoint index (the sample day and endpoints), then markets or venues to get ids, then metrics. Fields, filters and how to get a key: https://fronresearch.com/data/history/",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "index: the sample day, tier and endpoints. markets, venues: lists (filters: market, brand, venue_type, activity). venue: one venue with its products and resources (needs venue_id). slots: one venue's slots (params venue, from, to). metrics: rollups (params group_by = market, brand, venue, venue_type, activity or day, plus from, to and optional filters). observations: one slot's booking curve (param slot; needs a key on a plan that includes it).",
                "enum": ["index", "markets", "venues", "venue", "slots", "metrics", "observations"],
                "type": "string"
              },
              "params": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Query parameters as the Data API names them, e.g. {\"group_by\": \"market\", \"from\": \"2026-11-05\", \"to\": \"2026-11-05\"}. limit (1-1000) and cursor (from next_cursor) page through lists.",
                "type": "object"
              },
              "venue_id": {
                "description": "For endpoint venue: a venue_id from venues.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["endpoint"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2752552b6b51aae63062603474e23886c1cc3f09e62108008717e3118f90ccf"
        },
        {
          "name": "fetch",
          "title": "Read a document or sample day",
          "description": "Read one document by id (from search or about). sample/<site> returns that site's free example day as rows, CC BY 4.0.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Document id, e.g. heatcheck/methodology or sample/heatcheck.",
                "type": "string"
              },
              "offset": {
                "description": "Continue a long document from nextOffset.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5c39a60d5d4c187dd0817d00608463fe17ae06afa1a5608abe01cff3f667dfb"
        },
        {
          "name": "search",
          "title": "Search Golf Sim Data",
          "description": "Ask a question in plain language. Returns the most relevant passages from Golf Sim Data's public pages, each with its canonical URL to cite, plus its free sample day. Set site to all to search every Fron Research site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "intent": {
                "description": "Optional but helpful: why you are asking and for whom, in a sentence (e.g. \"sizing the NYC sauna market for an investor memo\"). It does not change the results; it tells Fron Research which data to publish next. Put your user's answers to followUp.questions here. Do not include personal information.",
                "maxLength": 300,
                "type": "string"
              },
              "maxResults": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The question.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "site": {
                "description": "Optional: defaults to golfsimdata. all, heatcheck, bowlingdata, trampolineparkdata, golfsimdata, courtwatch or fronresearch.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f50a723fae421ab825d563950d6b6a1a8463bfa59be06ca354802b02f29f939"
        }
      ],
      "digest": "sha256:a8e0b64849dbbc081ce13641f836c69c57d20e89870300e306fb8bd247fce5db"
    }
  }
}
