      "tools": [
        {
          "name": "check_descent_eligibility",
          "title": "Check citizenship by descent eligibility",
          "description": "Check whether a person qualifies for citizenship by descent.\n\n    Input is the person's direct ancestral line, one entry per generation,\n    starting with relation='self'. Every generation between the person and\n    the ancestor is required, because descent passes generation by generation\n    and a gap changes the answer.\n\n    Exact dates give the most precise result. Year-only input is accepted and\n    the result carries a caveat; for Ireland, a registration and a birth in the\n    same year cannot be resolved.\n\n    Args:\n        country: ISO 3166-1 alpha-2, lowercase. Currently 'ie' or 'ca'.\n        line: The direct line, from the user upward.\n        as_of: Evaluation date. Defaults to today. Rules with commencement\n            dates (Canada's Bill C-3) depend on it.\n    ",
          "inputSchema": {
            "$defs": {
              "LineMember": {
                "description": "One person on the user's direct ancestral line.",
                "properties": {
                  "birth_country": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 3166-1 alpha-2 country of birth, e.g. 'IE', 'CA', 'US'. Northern Ireland counts as 'IE': Irish nationality law covers all 32 counties.",
                    "title": "Birth Country"
                  },
                  "birth_date": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Exact date of birth if known. Beats birth_year.",
                    "title": "Birth Date"
                  },
                  "birth_place_label": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Free-text place of birth, e.g. 'Cork, Ireland'.",
                    "title": "Birth Place Label"
                  },
                  "birth_year": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Year of birth if the exact date is unknown.",
                    "title": "Birth Year"
                  },
                  "citizenship_registered_country": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Country of a formal citizenship registration, e.g. 'IE' for an Irish Foreign Births Register entry. This is what carries a claim down a generation.",
                    "title": "Citizenship Registered Country"
                  },
                  "citizenship_registered_date": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Exact date (YYYY-MM-DD) of the citizenship registration, if known.",
                    "title": "Citizenship Registered Date"
                  },
                  "citizenship_registered_year": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Year of the citizenship registration. Use when the exact date is unknown.",
                    "title": "Citizenship Registered Year"
                  },
                  "days_in_country": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Days of physical presence in the ancestral country. Canada's Bill C-3 substantial-connection test needs this; other pathways ignore it.",
                    "title": "Days In Country"
                  },
                  "naturalized_country": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "ISO 3166-1 alpha-2 country where this person naturalized, if any.",
                    "title": "Naturalized Country"
                  },
                  "naturalized_year": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "description": "Year this person naturalized in naturalized_country, if they did.",
                    "title": "Naturalized Year"
                  },
                  "relation": {
                    "description": "Where this person sits on the direct line. Exactly one entry is 'self'.",
                    "enum": ["self", "parent", "grandparent", "great_grandparent"],
                    "title": "Relation",
                    "type": "string"
                  }
                },
                "required": ["relation"],
                "title": "LineMember",
                "type": "object"
              }
            },
            "properties": {
              "as_of": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Evaluation date (YYYY-MM-DD). Defaults to today. Canada's Bill C-3 rules depend on it.",
                "title": "As Of"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code, lowercase. Supported: 'ie' (Ireland) or 'ca' (Canada).",
                "title": "Country",
                "type": "string"
              },
              "line": {
                "description": "The person's direct ancestral line, one entry per generation, starting with relation 'self' and going up with no gaps.",
                "items": {
                  "$ref": "#/$defs/LineMember"
                },
                "title": "Line",
                "type": "array"
              }
            },
            "required": ["country", "line"],
            "title": "check_descent_eligibilityArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Source": {
                "properties": {
                  "title": {
                    "title": "Title",
                    "type": "string"
                  },
                  "type": {
                    "description": "'official' or 'secondary'",
                    "title": "Type",
                    "type": "string"
                  },
                  "url": {
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["title", "type", "url"],
                "title": "Source",
                "type": "object"
              }
            },
            "description": "One pathway verdict, plus everything needed to say it honestly.",
            "properties": {
              "blockers": {
                "items": {
                  "type": "string"
                },
                "title": "Blockers",
                "type": "array"
              },
              "caveats": {
                "description": "Approximations and unresolvable ambiguities in the input.",
                "items": {
                  "type": "string"
                },
                "title": "Caveats",
                "type": "array"
              },
              "confidence": {
                "description": "green, yellow, or red",
                "title": "Confidence",
                "type": "string"
              },
              "country_code": {
                "title": "Country Code",
                "type": "string"
              },
              "disclaimer": {
                "title": "Disclaimer",
                "type": "string"
              },
              "learn_more": {
                "title": "Learn More",
                "type": "string"
              },
              "missing": {
                "items": {
                  "type": "string"
                },
                "title": "Missing",
                "type": "array"
              },
              "next_action": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Next Action"
              },
              "pathway_id": {
                "title": "Pathway Id",
                "type": "string"
              },
              "rationale": {
                "title": "Rationale",
                "type": "string"
              },
              "rules_verified_as_of": {
                "title": "Rules Verified As Of",
                "type": "string"
              },
              "sources": {
                "description": "Law and official guidance the rules were built from.",
                "items": {
                  "$ref": "#/$defs/Source"
                },
                "title": "Sources",
                "type": "array"
              },
              "supporting_facts": {
                "items": {
                  "type": "string"
                },
                "title": "Supporting Facts",
                "type": "array"
              },
              "verdict": {
                "description": "One-line plain reading of the confidence band.",
                "title": "Verdict",
                "type": "string"
              }
            },
            "required": ["confidence", "country_code", "disclaimer", "learn_more", "pathway_id", "rationale", "rules_verified_as_of", "verdict"],
            "title": "DescentResult",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check citizenship by descent eligibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:411b6e77db1c0b940be54bbd5652690d175a87273bf8a60032a9464cbd4e8c29"
        },
        {
          "name": "get_move_checklist",
          "title": "Get visa application checklist",
          "description": "Step-by-step application checklist for one visa, with sources.\n\n    Takes a visa_id such as 'es_dnv' or 'pt_d7'. Also returns the fees and any\n    recent rule changes for that visa.\n    ",
          "inputSchema": {
            "properties": {
              "visa_id": {
                "description": "Visa id from get_visa_options, e.g. 'es_dnv' or 'pt_d7'.",
                "title": "Visa Id",
                "type": "string"
              }
            },
            "required": ["visa_id"],
            "title": "get_move_checklistArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_move_checklistDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get visa application checklist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ef3fe856ef930e1e3c6a6e180218e436151072b7c66efd1fb0649571df095b0"
        },
        {
          "name": "get_pathway_requirements",
          "title": "Get descent pathway requirements",
          "description": "Documents, cost, and processing time for a supported descent pathway.\n\n    Covers the documents to gather, fees, typical processing time and common\n    pitfalls, with official sources.\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code, lowercase, of a supported pathway: 'ie' or 'ca'.",
                "title": "Country",
                "type": "string"
              }
            },
            "required": ["country"],
            "title": "get_pathway_requirementsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_pathway_requirementsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get descent pathway requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b4448da24fc3c15a07228ddd8ebf23b7b14615db163223e0031bc2db63f66700"
        },
        {
          "name": "get_rule_changes",
          "title": "Get recent visa rule changes",
          "description": "Recent changes to visa and residence rules that GoThere has verified.\n\n    Newest first. Each entry has the old and new value and the official source.\n\n    Args:\n        country: Optional ISO alpha-2 code or English name.\n        since: Optional date; only changes on or after it are returned.\n        limit: Maximum entries, 1 to 100. Default 20.\n    ",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional ISO alpha-2 code or English country name. Omit for all countries.",
                "title": "Country"
              },
              "limit": {
                "default": 20,
                "description": "Maximum entries to return, 1 to 100. Out of range values are clamped.",
                "title": "Limit",
                "type": "integer"
              },
              "since": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional date (YYYY-MM-DD). Only changes on or after it are returned.",
                "title": "Since"
              }
            },
            "title": "get_rule_changesArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_rule_changesDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get recent visa rule changes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3de22ba46c360757faa5bafdadbebdd11ca75f029f53fddc15227bafd0b754f"
        },
        {
          "name": "get_visa_options",
          "title": "Get residence visa options",
          "description": "Residence visas GoThere has researched for Americans moving abroad.\n\n    Covers Spain, Ireland, Italy, Mexico and Portugal today. Each option\n    carries the income threshold, fees, processing time, years to permanent\n    residence and citizenship, each with its source URL and the date it was\n    last checked.\n\n    Args:\n        country: Optional ISO alpha-2 code or English name, e.g. 'es' or 'Spain'.\n        category: Optional 'digitalNomad', 'passiveIncome' or 'work'.\n    ",
          "inputSchema": {
            "properties": {
              "category": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional visa category: 'digitalNomad', 'passiveIncome' or 'work'. Omit for all.",
                "title": "Category"
              },
              "country": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional ISO alpha-2 code or English country name, e.g. 'es' or 'Spain'. Omit for all countries.",
                "title": "Country"
              }
            },
            "title": "get_visa_optionsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "get_visa_optionsDictOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get residence visa options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97afa55fedd6b861c64abd8996de21ff23e754846b94d94ee9c03c35aeeea4fa"
        },
        {
          "name": "list_pathways",
          "title": "List citizenship by descent pathways",
          "description": "List the citizenship-by-descent pathways this server can evaluate.\n\n    Returns each supported pathway with its summary, official sources and\n    verification date. Countries marked 'planned' have no rules implemented\n    yet and are listed so their status is clear.\n    ",
          "inputSchema": {
            "properties": {},
            "title": "list_pathwaysArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "PathwayInfo": {
                "properties": {
                  "country_code": {
                    "title": "Country Code",
                    "type": "string"
                  },
                  "country_name": {
                    "title": "Country Name",
                    "type": "string"
                  },
                  "pathway_id": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Pathway Id"
                  },
                  "rules_verified_as_of": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Rules Verified As Of"
                  },
                  "sources": {
                    "items": {
                      "$ref": "#/$defs/Source"
                    },
                    "title": "Sources",
                    "type": "array"
                  },
                  "status": {
                    "description": "'supported' or 'planned'",
                    "title": "Status",
                    "type": "string"
                  },
                  "summary": {
                    "title": "Summary",
                    "type": "string"
                  }
                },
                "required": ["country_code", "country_name", "status", "summary"],
                "title": "PathwayInfo",
                "type": "object"
              },
              "Source": {
                "properties": {
                  "title": {
                    "title": "Title",
                    "type": "string"
                  },
                  "type": {
                    "description": "'official' or 'secondary'",
                    "title": "Type",
                    "type": "string"
                  },
                  "url": {
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["title", "type", "url"],
                "title": "Source",
                "type": "object"
              }
            },
            "properties": {
              "result": {
                "items": {
                  "$ref": "#/$defs/PathwayInfo"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "list_pathwaysOutput",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List citizenship by descent pathways"
          },
          "behavior": {
