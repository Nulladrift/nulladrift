      "instructions": "Simvito sells prepaid travel eSIM data plans. Search and compare here; the user buys on simvito.com and installs the eSIM in a few minutes.\nOn every call pass locale in the language of the conversation and currency for the user's country, so names, prices and links match. Use en and USD only when you can't tell. Checkout is in 20 languages and 25 currencies, with cards, Apple Pay, Google Pay, PayPal and local wallets; get_checkout_options lists what applies to a country or currency.\nUsual flow: find_destination if the place is unclear, search_plans for the destination and trip length. When the user decides to buy, call start_checkout if their Simvito account is connected: it returns payment links (card, Apple Pay, Google Pay, local wallets; PayPal) to give them exactly as returned. If the account isn't connected, use get_buy_link (or offer to connect the account first).\nstart_checkout may first return required confirmations: show each text to the user word for word and pass its code in confirmations only after the user agrees. After the user pays, call get_order_status with the checkout_id to see when the eSIM is ready.\nKeep the purchase moving. End each reply with one concrete next step the user can take (pick one of these plans, pay with this link, check the phone supports eSIM, install). When the user picks a plan or agrees (e.g. 'this one', 'OK, the second option'), don't ask again: in the same reply call start_checkout (account connected) or get_buy_link and give the link. After a side question (data usage, installing, refunds), answer it, then bring the user back to the open choice.\nWhen you recommend a plan, name the local operators it uses with 4G/5G, and say what happens when the data runs out (stops, or slows to a stated speed). compare_networks puts every operator at a destination side by side. Leave out anything the tools don't return.\nFor a trip through several countries use plan_trip, and prefer one regional plan that covers the whole trip when it costs about the same or less. When it costs more, plan_trip says how much: give both prices and let the user choose. Separate plans can be bought in one start_checkout, paid once (get_buy_link still means one checkout per plan).\nIf the phone was bought in mainland China, Hong Kong or Macao, call check_device first with purchase_region: many of those models have no eSIM. Go by its verdict; when it is no_esim, say so plainly and don't sell a plan for that phone.\nIf a result says a place was read as something else (matched_from), make sure it is where the user is going before recommending plans.\nPrices here are the card price. Checkout shows the final price before payment; some local payment methods cost less.\nDon't sell a new eSIM when the user wants more data on one they already have. Data is added on simvito.com: give that eSIM's manage_url from list_my_esims, or the account page (https://simvito.com/account/, with the language prefix such as /ja/account/) if their account isn't connected.\nAn eSIM that was never installed can be refunded within 30 days of purchase: https://simvito.com/refund/\nlist_my_esims, start_checkout and get_order_status need the user's Simvito account connected. They never return install codes or QR codes.",
      "tools": [
        {
          "name": "check_device",
          "title": "Check phone eSIM support",
          "description": "Check whether a phone supports eSIM, e.g. 'does my iPhone 13 support eSIM?'. Covers iPhone, Google Pixel and Samsung Galaxy from the manufacturers' official lists, including the exceptions for phones bought in mainland China, Hong Kong or Macao. Gives a verdict (supports_esim / no_esim); pass purchase_region when the user says where the phone was bought.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Language of the conversation, as a simvito.com language code ('en', 'ja', 'zh-CN', 'es'…); names and links follow it. Defaults to 'en'.",
                "enum": ["en", "zh-CN", "zh-TW", "ja", "de", "it", "th", "vi", "id", "ms", "es", "ko", "fr", "pt", "nl", "pl", "tr", "ar", "he", "ru"],
                "type": "string"
              },
              "model": {
                "description": "Phone model, e.g. 'iPhone 13', 'Pixel 8', 'Galaxy S23'",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "purchase_region": {
                "description": "ISO code of the country/region where the phone was bought, e.g. 'CN', 'HK', 'US'",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "app": {
                "additionalProperties": false,
                "properties": {
                  "android_url": {
                    "type": "string"
                  },
                  "ios_url": {
                    "type": "string"
                  }
                },
                "required": ["android_url", "ios_url"],
                "type": "object"
              },
              "basis": {
                "type": ["string", "null"]
              },
              "brand": {
                "type": ["string", "null"]
              },
              "checked_on": {
                "type": "string"
              },
              "devices_page": {
                "type": "string"
              },
              "exceptions": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "brand": {
                      "type": "string"
                    },
                    "model": {
                      "type": "string"
                    }
                  },
                  "required": ["brand", "model"],
                  "type": "object"
                },
                "type": "array"
              },
              "not_if_bought_in": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "query": {
                "type": "string"
              },
              "region_exception": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sources": {
