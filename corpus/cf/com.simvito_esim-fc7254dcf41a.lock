                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "slug": {
                    "type": "string"
                  }
                },
                "required": ["kind", "name", "slug"],
                "type": "object"
              },
              "note": {
                "type": "string"
              },
              "operators": {
                "items": {
                  "additionalProperties": false,
