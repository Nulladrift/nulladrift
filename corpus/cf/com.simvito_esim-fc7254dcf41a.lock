        {
          "name": "get_checkout_options",
          "title": "Checkout options: languages, currencies, payment methods",
          "description": "Languages, currencies and payment methods at simvito.com checkout. Pass the buyer's country or currency to get the default currency there and the payment methods that currency can be paid with (cards, Apple Pay, Google Pay, PayPal, local wallets and bank payments).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Buyer's country or region (ISO 3166-1 alpha-2, e.g. 'JP', 'DE')",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
