            "properties": {
              "locale": {
                "description": "Language of the conversation, as a simvito.com language code ('en', 'ja', 'zh-CN', 'es'…); names and links follow it. Defaults to 'en'.",
                "enum": ["en", "zh-CN", "zh-TW", "ja", "de", "it", "th", "vi", "id", "ms", "es", "ko", "fr", "pt", "nl", "pl", "tr", "ar", "he", "ru"],
