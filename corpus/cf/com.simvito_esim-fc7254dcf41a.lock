                        "properties": {
                          "network": {
                            "type": "string"
                          },
                          "operator": {
                            "type": "string"
                          }
                        },
                        "required": ["network", "operator"],
                        "type": "object"
                      },
                      "type": "array"
                    }
                  },
                  "required": ["code", "name", "operators"],
                  "type": "object"
                },
                "type": "array"
              },
              "destination": {
                "additionalProperties": false,
                "properties": {
                  "also_matches": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "name": {
                          "type": "string"
                        },
                        "slug": {
                          "type": "string"
                        }
                      },
                      "required": ["name", "slug"],
