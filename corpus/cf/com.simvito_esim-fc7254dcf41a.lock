        {
          "name": "compare_networks",
          "title": "Compare networks",
          "description": "Compare the local mobile networks for a destination side by side, for questions like 'which network is best in Thailand' or 'which eSIM has 5G in Tokyo': each operator the plans use, its best generation (4G/5G), how many plans use it and the cheapest one. For a multi-country plan, pass country to see that country's operators.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Only for multi-country destinations: one covered country (name or ISO code)",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "currency": {
                "description": "The user's currency (ISO 4217) for prices: USD, EUR, GBP, HKD, CNY, SGD, JPY, AUD, NZD, CAD, BRL, IDR, MYR, PHP, THB, KRW, PLN, CHF, SEK, TWD, VND, TRY, SAR, AED, ILS. Defaults to USD.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "destination": {
                "description": "Destination slug from find_destination (e.g. 'japan', 'europe-33'), an ISO country code, or a country name in any language.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "locale": {
                "description": "Language of the conversation, as a simvito.com language code ('en', 'ja', 'zh-CN', 'es'…); names and links follow it. Defaults to 'en'.",
                "enum": ["en", "zh-CN", "zh-TW", "ja", "de", "it", "th", "vi", "id", "ms", "es", "ko", "fr", "pt", "nl", "pl", "tr", "ar", "he", "ru"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
