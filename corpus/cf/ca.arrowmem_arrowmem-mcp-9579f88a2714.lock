            "readOnly": false
          },
          "digest": "sha256:d2b367c028a46d9720f6560aa98e839bbf60e7deeb1848d6c3d9964617d26937"
        },
        {
          "name": "enrol_alert_relay",
          "description": "Enrols this API key in the ArrowMem Guard alert relay (the watchdog page and the family 'Is It Really Me' check). Mints a relay token stored beside your key and returns an alert topic derived from it (subscribe to it once, in a push notification app, on your own phone), plus a one-time family link you share with the one person you want able to check on you if a call sounds like you and asks for money. No arguments. On an already-enrolled key it returns the SAME topic and no new family link (never re-shown once given). To replace the topic or the link use rotate_alert_relay; to end the enrolment use disable_alert_relay. Honest limit: ArrowMem can derive this topic from what it stores, so a topic is public-by-name the moment it exists - every page sent over it is a fixed, contentless sentence, never your real findings or any personal detail. The family check cannot be faked the same way; an answer comes back through the server, bound to a one-time token, and only proves someone holding the phone tapped Yes or No. Paid tool - requires a valid API key. Spends one call. A family member's own ask also spends one call from your plan, so you can see a leaked link being used.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Enrol ArrowMem Guard alert relay"
