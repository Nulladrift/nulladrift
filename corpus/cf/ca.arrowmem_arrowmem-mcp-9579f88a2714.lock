        {
          "name": "disable_alert_relay",
          "description": "Ends this API key's ArrowMem Guard alert relay enrolment. No arguments. Your family link stops resolving, your old topic gets one fixed notice that the relay ended, and every relay attribute is removed from your key's row; it mints nothing, and calling it again is a no-op. Your key, usage, cap and subscription are untouched; call enrol_alert_relay afterward to enrol again. Paid tool - requires a valid API key. Spends one call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Disable ArrowMem Guard alert relay"
          },
          "behavior": {
