          "name": "rotate_alert_relay",
          "description": "Replaces part of this API key's ArrowMem Guard alert relay enrolment. Argument: {\"scope\": \"topic\"|\"family\"|\"both\"} (required). scope=\"topic\" replaces the relay token only (the old topic gets one notice that it is changing, then stops being used) - your family link keeps working. scope=\"family\" replaces the family link only (the old one stops working) and returns the new link - your topic is unchanged. scope=\"both\" does both. Your key, usage, cap and subscription are untouched. Requires an existing enrolment (enrol_alert_relay). Paid tool - requires a valid API key. Spends one call.",
