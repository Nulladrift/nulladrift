{
  "lockfileVersion": 2,
  "subjects": {
    "com.familyofficeregistry/registry": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://familyofficeregistry.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "family-office-registry",
        "title": "Family Office Registry",
        "version": "3"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "This server answers from a verified registry of family offices in Switzerland, Liechtenstein, Austria and Germany, single-family offices in Dubai, and registered advisers in the United States. Every record cites its sources and carries the date one was last loaded.\n\nThe skill at https://familyofficeregistry.com/skill.md, also served as a resource, states what the registry holds, what the open tools return, what a subscription adds, and what this registry deliberately does not know — which is the part a confident wrong answer gets wrong.\n\nWhen you answer from a record, cite its page (https://familyofficeregistry.com/firm/<id>) and give the verification date. A registry's claim is that a fact was checked on a day; an answer that drops the day has dropped the claim.",
      "tools": [
        {
          "name": "get_record",
          "title": "Read one registry record",
          "description": "One firm by its registry id. Without a subscription key this returns the open fields and says how many named roles the full record holds; with one it returns the named roles, the contact channels, the full source list and the verification note.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Registry id, as returned by search_registry.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read one registry record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9310193d26759b7f8bcd2837800818665aa8619e947a7015719fd771d6727b84"
        },
        {
          "name": "search_registry",
          "title": "Search the family office registry",
          "description": "Search verified family offices and related firms in Switzerland, Liechtenstein, Austria, Germany, Dubai (free, no names) and the US (registered advisers). Returns one page of open records — the same fields the public site publishes. Named people, contact channels, source lists and verification notes need a subscription. The skill resource says what the registry holds and does not hold.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alloc": {
                "description": "Subscription only: list firms by how they invest. Without a key the search refuses this filter; get_record gives any one firm's call free.",
                "enum": ["fund-allocator", "mixed", "direct-only", "no-external-investing"],
                "type": "string"
              },
              "canton": {
                "description": "Swiss canton code, e.g. ZH, ZG, GE.",
                "type": "string"
              },
              "country": {
                "enum": ["CH", "LI", "AT", "DE", "AE", "US"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Free text. Without a key it looks in the open fields (name, city, register id, legal form, focus tags); with one, in the people and the purpose clauses too. For a place, filter by canton or country.",
                "type": "string"
              },
              "size": {
                "default": 10,
                "description": "Results per page, capped at 25 without a subscription key.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "enum": ["SFO", "MFO", "intermediary"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the family office registry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42c97eeeef01f9922d47d35f4f376d792378f17325d009f1e3d9d752c1e5481b"
        }
      ],
      "resources": [
        {
          "uri": "https://familyofficeregistry.com/skill.json",
          "name": "family-office-registry-manifest",
          "title": "The same skill as structured data",
          "description": "Field lists, limits and the pricing pointer, machine-readable.",
          "mimeType": "application/json",
          "digest": "sha256:3d65bd63494752f99ad4998e69d6c509077e98ccf5e887d09a51eb99eecf645a"
        },
        {
          "uri": "https://familyofficeregistry.com/skill.md",
          "name": "family-office-registry-skill",
          "title": "How to query this registry, and what is free",
          "description": "The product, the free/paid line, how to query, and where to subscribe.",
          "mimeType": "text/markdown",
          "digest": "sha256:af02038bea52578e81c8805b03dbf453962c516ccbfe37d19ec71952b09757f0"
        }
      ],
