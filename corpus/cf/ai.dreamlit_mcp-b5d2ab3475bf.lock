      "instructions": "Dreamlit is a database-driven notification workflow platform for Supabase and Postgres apps.\nPrefer outcome-oriented prompts: describe the event or schedule, audience, recipient, message goal, timing, business rules, and unsubscribe intent.\nDreamlit keeps a read-only history of the email it sends. Workflows can use it to target by opens or clicks and to skip people a workflow already emailed in a period, so the user's database rarely needs a notified-at column. It filters by history; it does not guarantee exactly-once delivery.\nUse get_status for workspace, project, setup, and prompting context before authoring.\nUse list_brand_styles when the user wants to inspect saved project brand styles for generated email drafts.\nUse get_workflow_and_preview_url before editing an existing workflow.\nUse get_analytics for raw notification analytics: email and Slack sends and deliveries, email opens, clicks and bounces, overview metrics, per-recipient rows and workflow run rows. Filter large datasets and paginate with returned cursors instead of asking for exports or bulk dumps.\nUse get_lifecycle_report and get_recommendations for Dreamlit's prepared analysis, available on Pro and Scale only. Reports are prepared by Dreamlit's agents and reviewed by our team. They may return a processing state; check back later. The requester is also emailed when ready.\nCreate or update workflow drafts with create_or_update_workflow. Pass name when creating a workflow the user has named.\nWhen asking create_or_update_workflow for changes, refer to steps by what they do (the database trigger, the query that finds returning customers, the email with subject \"Welcome back\"), never by step id.\nMake exact changes to existing steps (subject, email HTML, Slack text, SQL, wait, description) with edit_workflow_steps; it applies them instantly and uses no AI credits. Use create_or_update_workflow for anything that needs writing, new steps, or trigger changes.\nPass startNewChat when switching to an unrelated change or when earlier turns were long or went off track.\nRename an existing workflow with rename_workflow.\nPut a workflow in a folder, or take it out of one, with move_workflow_to_folder.\nDrafts are not live after authoring. Ask the user to open the preview link and confirm workflow tests for important email or Slack messages before publishing.\nPublish only with prepare_publish and confirm_publish after explicit user confirmation.",
