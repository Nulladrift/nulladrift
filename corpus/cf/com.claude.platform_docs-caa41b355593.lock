    "com.claude.platform/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://platform.claude.com/docs/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "claude-platform-docs",
        "title": "Claude Platform Docs",
        "version": "1.0.1",
        "description": "Search and read the Claude Platform documentation and API reference.",
        "websiteUrl": "https://platform.claude.com/docs",
        "icons": [
          {
            "src": "https://platform.claude.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://platform.claude.com/images/claude-platform-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Official docs for the Claude API, Anthropic SDKs and Claude Managed Agents (not Claude Code or the Agent SDK, which are at code.claude.com).\n\nUse before answering or recommending anything, never from memory, when the user mentions Claude or Anthropic, asks about LLM pricing, models or limits, or wants to build an agent or app that uses an LLM with no provider named. Skip only if the user has chosen other providers and none of them is Anthropic.\n\nStart with search_docs, then get_doc. Use get_navigation to see what exists.",
      "tools": [
        {
          "name": "get_api_endpoint",
          "title": "Read API endpoint reference",
          "description": "Get detailed information about a specific API endpoint including parameters, request body, and responses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "method": {
                "description": "HTTP method",
                "enum": ["GET", "POST", "PUT", "PATCH", "DELETE"],
                "type": "string"
              },
              "path": {
                "description": "API path (e.g., /v1/messages)",
                "type": "string"
              },
              "sdk_language": {
                "description": "Language of the endpoint's types and code example. Default: http (a cURL example).",
                "enum": ["http", "cli", "typescript", "python", "java", "go", "ruby", "csharp", "php"],
                "type": "string"
              }
            },
            "required": ["method", "path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read API endpoint reference"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2e011b2e10d6c1e54416740aa0b26917411fd9711606608b76fd935345d029ec"
        },
        {
          "name": "get_doc",
          "title": "Read docs page",
          "description": "Get the full content of a documentation page. Returns the page title, description, URL, and cleaned markdown content.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "path": {
                "description": "Documentation path (e.g., /docs/en/intro or intro) or a result URL from search_docs (e.g., https://platform.claude.com/docs/en/intro). For fuzzy lookup, use search_docs.",
                "type": "string"
              },
              "sdk_languages": {
                "description": "Only include code examples in these languages. Without it, pages include the examples in every language and are much longer.",
                "items": {
                  "enum": ["typescript", "javascript", "boto3", "python", "java", "kotlin", "swift", "ruby", "go", "cli", "bash", "curl", "php", "csharp", "http", "node", "terraform", "shell", "c#"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read docs page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fe1690efd9744119d67c782f9561021faea2f45e653b79ead4f7d51f69d02493"
        },
        {
          "name": "get_navigation",
          "title": "List docs pages",
          "description": "Get the documentation navigation: tabs, groups of pages, and pages with their paths. Call it without arguments to see every tab and its groups, then pass `tab` and `group_path` to see the pages of a group. A group marked \"(not expanded)\" in the markdown, or without pages and groups in the structured result, has pages or subgroups that the result leaves out.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "depth": {
                "description": "How many levels of groups below the start to include (default: 1). Groups at the last level come without their pages or subgroups; add their labels to `group_path` to see them. Each extra level makes the result larger.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "format": {
                "description": "Format of the text result (default: markdown). The structured result is always JSON.",
                "enum": ["json", "markdown"],
                "type": "string"
              },
              "group_path": {
                "description": "Start at this group inside `tab`: the labels of the nested groups, outermost first (e.g., [\"Context management\"]). Needs `tab`.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "tab": {
                "description": "Start at this tab, by label or slug, including a sub-tab of a dropdown (e.g., messages, api-reference). Without it, the result covers every tab.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": {},
            "definitions": {
              "__schema0": {
                "additionalProperties": {},
                "properties": {
                  "defaultPath": {
                    "pattern": "^\\/docs\\/[\\s\\S]{0,}\\/[\\s\\S]{0,}$",
                    "type": "string"
                  },
                  "externalUrl": {
                    "pattern": "^https:\\/\\/[\\s\\S]{0,}$",
                    "type": "string"
                  },
                  "groups": {
                    "items": {
                      "$ref": "#/definitions/__schema1"
                    },
                    "type": "array"
                  },
                  "items": {
                    "items": {
                      "$ref": "#/definitions/__schema0"
                    },
                    "type": "array"
                  },
                  "label": {
                    "type": "string"
                  }
                },
                "required": ["label"],
                "type": "object"
              },
              "__schema1": {
                "additionalProperties": {},
                "description": "A group without pages and groups has more that the depth input left out: add its label to group_path to see it.",
                "properties": {
                  "groups": {
                    "items": {
                      "$ref": "#/definitions/__schema1"
                    },
                    "type": "array"
                  },
                  "label": {
                    "type": "string"
                  },
                  "pages": {
                    "items": {
                      "additionalProperties": {},
                      "properties": {
                        "beta": {
                          "const": true,
                          "type": "boolean"
                        },
                        "path": {
                          "pattern": "^\\/docs\\/[\\s\\S]{0,}\\/[\\s\\S]{0,}$",
                          "type": "string"
                        },
                        "title": {
                          "description": "The title of the page.",
                          "type": "string"
                        }
                      },
                      "required": ["path", "title"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "path": {
                    "pattern": "^\\/docs\\/[\\s\\S]{0,}\\/[\\s\\S]{0,}$",
                    "type": "string"
                  }
                },
                "required": ["label"],
                "type": "object"
              }
            },
            "properties": {
              "tabs": {
                "items": {
                  "$ref": "#/definitions/__schema0"
                },
                "type": "array"
              }
            },
            "required": ["tabs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List docs pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d63fb3cb2cb947d71f9b77d77ccbd9899f6262bb40cf60e6765ed13965ec3169"
        },
        {
          "name": "search_docs",
          "title": "Search docs",
          "description": "Search Claude documentation (the guides and the API reference together) by keyword or phrase. Returns matching pages and API endpoints ranked by relevance, with snippets showing context around matches.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Only return results of one kind: \"prose_page\" (guide pages), \"api_sdk_method\" (one API method, such as \"Create a Message\"), or \"api_sdk_resource\" (a group of endpoints, such as Messages).",
                "enum": ["prose_page", "api_sdk_method", "api_sdk_resource"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum results to return (default: 10, max: 50)",
                "type": "number"
              },
              "query": {
                "description": "Search query (keywords or phrase)",
                "type": "string"
              },
              "sdk_language": {
                "description": "Search this SDK's API reference together with the guides. Accepts an SDK language such as \"python\" or \"typescript\", or \"http\" (default — the language-neutral REST reference); unrecognized values fall back to \"http\". Results for endpoints then link to that SDK's reference pages and match its method names.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:61b5fa5bf1a8ed143ebf9923c466493dd1ea66f60af2dd5238c20738e35afd4e"
        }
      ],
      "digest": "sha256:21d9e3e823466070fccbe33b8c1e88bd0c5e3039343aba6a46efa660b0090038"
    }
  }
}
