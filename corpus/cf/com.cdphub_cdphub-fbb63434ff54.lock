      "serverInfo": {
        "name": "cdphub",
        "title": "CdpHub",
        "version": "1.0.3",
        "websiteUrl": "https://cdphub.com/mcp",
        "icons": [
          {
            "src": "data:image/png;base64,",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CdpHub (cdphub.com) is an independent directory of customer data platform (CDP) integrations: the public integration catalogs of every CDP it tracks, in one graph, each listing linked to the page it came from. Use get_tool for one tool (which CDPs list it and which way data flows), check_stack for two to ten tools together, compare_cdps for two CDPs, get_cdp for one CDP's catalog, list_cdps for every CDP, search_directory for keyword, category or direction searches, and get_api_recipe for the exact API request for five everyday jobs at a CDP. The figures count each CDP once per tool. A CDP with no listing for a tool doesn't document one, which is not proof the two can't be connected. Results link to the matching pages on cdphub.com, and each result's source block gives the data's date and terms of use. CdpHub is independent and takes no referral fees or vendor commissions.",
      "tools": [
        {
          "name": "check_stack",
          "title": "Check a stack",
          "description": "Check a stack of two to ten tools against every CDP in CdpHub's directory, as the stack check on cdphub.com does: how many CDPs list all of them and which, those CDPs grouped by how they connect to each tool with each group counted, how they connect to each tool on its own with each group counted and a sentence for it, the CDPs that miss exactly one tool grouped by the tool they miss, and a link to the same check on cdphub.com. Use it for any question about two or more tools together, such as which CDPs fit a company's stack.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tools": {
                "description": "The tools, for example [\"Shopify\", \"Klaviyo\", \"Snowflake\"]: two to ten.",
                "items": {
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["tools"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a stack"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8610ad4f7f9673fbb03a5d7ecdb0326472f4086078564c054cb89b2bc1f4755e"
        },
        {
          "name": "compare_cdps",
          "title": "Compare two CDPs",
          "description": "Compare two CDPs' integration catalogs in CdpHub's directory, tool by tool: how many tools both list, how many only one does, the most widely listed tools in both, each side's largest categories of tools the other lacks, and the link to their comparison page on cdphub.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "a": {
                "description": "The first CDP, for example \"Segment\".",
                "type": "string"
              },
              "b": {
                "description": "The second CDP, for example \"mParticle\".",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two CDPs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f4fb9c83e8fe7814bc024245328521eaa2221694602116baac24003cd8aa934"
        },
        {
          "name": "get_api_recipe",
          "title": "Get an API recipe",
          "description": "The exact HTTP request a CDP's own developer docs give for an everyday job: send an event (send_event), create or update a profile (upsert_profile), send a batch of events (send_batch), look up a profile (read_profile) or delete a person (delete_user). Each request is written with one shared example (customer u_1001, ada@example.com, order ord_5001) and checked with the rules of CdpHub's agent readiness test; none was sent to the vendor's API. Where the CDP doesn't offer the job, or its docs couldn't be read, the answer says why. Covers the 30 CDPs in the agent readiness test and names the others. Placeholders in angle brackets are for the caller to fill in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cdp": {
                "description": "The CDP, by name or by its CdpHub slug, for example \"Braze\", \"Segment\" or \"treasure-ai\".",
                "type": "string"
              },
              "job": {
                "description": "The job. Leave it out to get all five.",
                "enum": ["send_event", "upsert_profile", "send_batch", "read_profile", "delete_user"],
                "type": "string"
              }
            },
            "required": ["cdp"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an API recipe"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3249d3aa403494d2741660db6a80292bf081dbdf912d452db86749f587d9744b"
        },
        {
          "name": "get_cdp",
          "title": "Look up a CDP",
          "description": "Look up one customer data platform's integration catalog in CdpHub's directory: its number of tools and listings and its rank by catalog size, which way its integrations run, its largest categories with their most widely listed tools, how it connects to the main data warehouses, the CDPs that list the most of the same tools, and its page on cdphub.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The CDP, for example \"Segment\", \"Braze\" or \"Adobe Experience Platform\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a CDP"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a160dd892f63a6fff433563f0f79c9fd4a33753652a279931d5be5864d5fda16"
        },
        {
          "name": "get_tool",
          "title": "Look up a tool",
          "description": "Look up one marketing or data tool (for example Snowflake, Braze, Google Ads or The Trade Desk) in CdpHub's directory: how many of the customer data platforms (CDPs) it tracks list an integration with it, each CDP counted once (both sends data to it and reads from it, only sends, only reads), which CDPs list it in each group and which don't, every listing with its direction, how it runs (server-side, client-side, in the warehouse) and a link to the CDP's own documentation, and the tool's page on cdphub.com. Use it for any question about one tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "The tool, for example \"Snowflake\" or \"Google Ads\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:406b50d7e70ec916ad1e55683a2726bd251241a2216190d7e99f38c9d5dc0b52"
        },
        {
          "name": "list_cdps",
          "title": "List the CDPs",
          "description": "List every customer data platform in CdpHub's directory with its number of tools and listings and its page on cdphub.com, largest catalog first, with the directory's totals.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the CDPs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6439469c89ca6f3db97085caeeb689a1aec3967b7eea459f1df93e046f99fd82"
        },
        {
          "name": "search_directory",
          "title": "Search the directory",
          "description": "Search CdpHub's directory of CDP integrations by keyword, CDP, category, direction or how the integration runs. Returns the exact totals, the first results and the link to the same search on cdphub.com. Use get_tool for one named tool and check_stack for several.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Only these categories, for example [\"Advertising\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cdps": {
                "description": "Only these CDPs, for example [\"Tealium\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "directions": {
                "description": "Which way data moves, from the CDP's side: \"out\" sends data to the tool, \"into\" reads from it, \"both\", or \"unknown\" when the listing doesn't say.",
                "items": {
                  "enum": ["out", "into", "both", "unknown"],
                  "type": "string"
                },
                "type": "array"
              },
              "group": {
                "description": "Group the results by tool or by listing. Leave it out to let the directory decide.",
                "enum": ["tool", "listing"],
                "type": "string"
              },
              "query": {
                "description": "Words to search for in tool, listing and CDP names, categories and descriptions, for example \"reverse etl\".",
                "type": "string"
              },
              "runs": {
                "description": "How the integration runs: server-side, client-side, through a warehouse, or \"none\" when the listing doesn't say.",
                "items": {
                  "enum": ["server", "client", "warehouse", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "description": "The result order. Leave it out to let the directory decide.",
                "enum": ["relevance", "coverage", "az", "added", "recommended"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the directory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0bfc590904acdf91b3be811032d587073e747f54bd314e10d747dd12c15817e"
        }
      ],
      "digest": "sha256:343b8b5ef2fade62ca170d8a3d13b7b170604c000a6febb9d4b31d9740e246ce"
