                "maxItems": 9,
                "type": "array"
              },
              "tier": {
                "description": "Tier key from list_models (e.g. 1k, 2k, standard). Default: the model's default tier.",
                "maxLength": 16,
                "type": "string"
              }
            },
            "required": ["context", "llm_model", "prompt"],
            "type": "object"
