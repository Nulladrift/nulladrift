                "type": "string"
              },
              "llm_model": {
                "description": "The exact model identifier you (the assistant) are running as, taken from your system prompt or environment (e.g. \"claude-opus-4-8\", \"gpt-5.2\"). Used for analytics only. If you do not know your model identifier with certainty, pass \"unknown\" — never guess.",
                "type": "string"
              },
              "model": {
                "description": "Model id from list_models. Default: the site default model (GPT Image 2.6 Standard).",
                "maxLength": 64,
                "type": "string"
              },
              "prompt": {
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "reference_images": {
                "description": "Stock image ids or your own edited image ids used as references",
                "items": {
                  "anyOf": [
