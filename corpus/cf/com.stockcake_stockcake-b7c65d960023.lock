      "instructions": "StockCake: CC0 / public-domain stock images, every one AI-generated. Free for commercial use, no attribution required.\nTo show an image to the user, call get_image — it returns an inline image block (preview_url may not render in every client).\nAlways give the user the page_url when you recommend an image; full-resolution downloads happen on that page and need a free StockCake account.\nSearch: keep `query` short — 2–5 words, the subject plus one or two qualifiers ('red vintage rocket'), not a sentence.\nIf total_results is low or the matches miss, retry with FEWER keywords first, then with different phrasing (synonyms, singular/plural, a broader subject) — try 2–3 variations before telling the user nothing fits.\nUse `limit` to request only as many results as you need.\nFor `mood` / `style`, pass exact values from `refinements` of a previous search_images result; `refinements.counts` says how many of the current matches carry each value — both are exact filters (together: their intersection), so rephrase instead of filtering on a small count.\nPass `locale` for non-English users (titles and links are localized; descriptions are English).\nIf no tool fits the task, or a tool misled you, call send_feedback — it records the report for the StockCake team (nothing changes for the user).\nThe endpoint allows 120 requests per minute per IP.\nAccount tools (generate, upscale, resize, video, download, account) need a free StockCake account — the host will prompt to sign in.",
      "tools": [
        {
          "name": "create_video",
          "title": "Create Video",
          "description": "Generate a short video from a prompt and/or a start image with one of StockCake's video models (list_models). Priced per second of output; charges credits. Video usually takes longer than the 20 s inline wait: expect a pending result and poll get_job. Re-sending identical arguments within 2 hours returns the same job (reused: true) instead of charging again. Requires a free StockCake account (the host will prompt to sign in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "aspect_ratio": {
                "description": "Text-to-video only; a start image sets the ratio",
                "enum": ["9:16", "4:5", "3:4", "2:3", "1:1", "3:2", "4:3", "5:4", "16:9"],
                "type": "string"
              },
              "context": {
                "description": "In one sentence, what is the user trying to make or find?",
                "type": "string"
              },
              "conversation_id": {
                "description": "Pass the exact conversation_id from the server's previous response, unchanged. The server provides it on the first call — never invent one, and do not issue parallel tool calls until you have it. Keep passing the same conversation_id for the rest of the conversation, including after later user messages or on a different task; do not reset it when the user starts a new request.",
                "type": "string"
              },
              "duration_seconds": {
                "description": "Clip length; must be one of the model's durations",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "llm_model": {
                "description": "The exact model identifier you (the assistant) are running as, taken from your system prompt or environment (e.g. \"claude-opus-4-8\", \"gpt-5.2\"). Used for analytics only. If you do not know your model identifier with certainty, pass \"unknown\" — never guess.",
                "type": "string"
              },
              "model": {
                "description": "Video model id from list_models (default: H3 Max)",
                "maxLength": 64,
                "type": "string"
              },
              "negative_prompt": {
                "maxLength": 1000,
                "type": "string"
              },
              "prompt": {
                "description": "Required unless start_image is given",
                "maxLength": 2000,
                "type": "string"
              },
              "start_image": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "maximum": 9007199254740991,
                    "type": "integer"
                  },
                  {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  }
                ],
                "description": "Animate from this image (stock id or your edited image id)"
              },
              "tier": {
                "description": "Tier key from list_models (e.g. 720p, 1080p, 768p)",
                "maxLength": 24,
                "type": "string"
              }
            },
            "required": ["context", "llm_model"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
