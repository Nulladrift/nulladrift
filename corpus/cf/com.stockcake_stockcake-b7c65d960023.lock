              {
                "additionalProperties": false,
                "properties": {
                  "credits_charged": {
                    "type": "number"
                  },
                  "job_id": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  },
                  "reused": {
                    "const": true,
                    "type": "boolean"
                  },
                  "status": {
                    "const": "completed",
                    "type": "string"
                  },
                  "video": {
                    "additionalProperties": false,
                    "properties": {
                      "duration_seconds": {
                        "type": ["number", "null"]
                      },
                      "url": {
                        "type": "string"
                      }
                    },
                    "required": ["duration_seconds", "url"],
                    "type": "object"
                  }
                },
                "required": ["credits_charged", "job_id", "status", "video"],
                "type": "object"
              },
              {
                "additionalProperties": false,
