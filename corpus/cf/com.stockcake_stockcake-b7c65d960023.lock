                          },
                          {
                            "type": "null"
                          }
                        ],
                        "description": "Output pixel size; null when the file could not be probed"
                      },
                      "id": {
                        "description": "Edited image id — pass it to get_image (preview), download_image, or as an image reference",
                        "type": ["number", "null"]
