        {
          "name": "generate_image",
          "title": "Generate Image",
          "description": "Generate a new image from a prompt with one of StockCake's AI models (list_models). Charges credits; free credits work with every model. Waits up to 20 s, then returns a job_id for get_job. Re-sending identical arguments within 2 hours returns the same job (reused: true) instead of charging again. Optional reference images guide the composition (the number allowed depends on your plan). Requires a free StockCake account (the host will prompt to sign in).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
