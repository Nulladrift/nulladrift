          "digest": "sha256:30a80696cdc62859960147d4104579757287d1c23e0a949fc23dfc6555f901ac"
        },
        {
          "name": "free_sample",
          "title": "Free sample result (no payment)",
          "description": "Free. A real, recent result from a paid tool: fetch (a product page from Germany), compare (one product's price in several countries) or search (a Google search from Canada in French).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
