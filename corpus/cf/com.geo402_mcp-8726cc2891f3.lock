{
  "lockfileVersion": 2,
  "subjects": {
    "com.geo402/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://geo402.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "geo402",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Geo402: public web pages, product prices and Google results as seen from 190+ countries, through residential IPs. Paid tools cost fractions of a cent to a few cents in USDC on Base via x402: an unpaid call returns a payment quote; an x402 MCP client (e.g. @x402/mcp) pays and repeats the call. Charged only on success. Use check_url (free) for unfamiliar sites and free_sample to see results. Docs: https://geo402.com/llms.txt",
      "tools": [
        {
          "name": "check_url",
          "title": "Check if a URL can be fetched (free)",
          "description": "Free. Whether a URL is allowed (public page, not a blocked service, allowed by robots.txt) before paying.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country of the residential exit IP, e.g. de, jp, br (default: any)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "url": {
                "description": "Public http(s) page, e.g. https://www.allbirds.com/products/mens-wool-runner-nz",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:bb4bddfd5c9cbe47b104f3eb170a84d6abf96cb6814926e4745287dcc85d9d40"
        },
        {
          "name": "compare_page_across_countries",
          "title": "Compare one page (and its price) across countries",
          "description": "Fetch the same public page from 2-5 countries in one paid call: status, redirect, language, the product price converted to USD, an excerpt (or full content), and the cheapest country. $0.005 per country, one payment; not charged if no country loads.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "2-5 country codes, e.g. [\"us\",\"de\",\"jp\"]",
                "items": {
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "format": {
                "description": "markdown (default, best for reading), text, or raw html",
                "enum": ["markdown", "text", "html"],
                "type": "string"
              },
              "include_content": {
                "description": "true = full content per country (default: excerpts)",
                "type": "boolean"
              },
              "url": {
                "description": "Public http(s) page, e.g. https://www.allbirds.com/products/mens-wool-runner-nz",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["countries", "url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1fe29acdf66d552b67c852076461ae3cdb31d97b4933d16555de89d5679ffe25"
        },
        {
          "name": "compare_search_across_countries",
          "title": "Compare Google results across countries",
          "description": "Run one Google search in 2-5 countries: ranked results per country, sites ranking in several, and (optional) where your domain ranks in each. $0.004 per country, one payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "2-5 country codes, e.g. [\"us\",\"ca\",\"fr\"]",
                "items": {
                  "pattern": "^[A-Za-z]{2}$",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "domain": {
                "description": "Optional site to track, e.g. example.com",
                "type": "string"
              },
              "lang": {
                "description": "Result language, e.g. fr, en, de, pt-br (default: the market's)",
                "type": "string"
              },
              "num": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["countries", "q"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8f2b0e88e1c56519fd9ee0e5d1c8e518284225e65cd8961224fd7a908bfe358c"
        },
        {
          "name": "fetch_page_from_country",
          "title": "Read a web page as it appears from a country",
          "description": "Fetch one public web page through a residential IP in the chosen country (optionally a city or US state) and return clean markdown (or text/html), with title, final URL, status, and the product price/currency/availability extracted when present. $0.005 per page (x402, USDC on Base), charged only if the page loads. Public pages only; robots.txt respected; no CAPTCHA solving.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Optional city for the exit IP, needs country (e.g. berlin). +$0.005.",
                "type": "string"
              },
              "country": {
                "description": "Country of the residential exit IP, e.g. de, jp, br (default: any)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "format": {
                "description": "markdown (default, best for reading), text, or raw html",
                "enum": ["markdown", "text", "html"],
                "type": "string"
              },
              "state": {
                "description": "Optional US state, needs country=us (e.g. texas). +$0.005.",
                "type": "string"
              },
              "url": {
                "description": "Public http(s) page, e.g. https://www.allbirds.com/products/mens-wool-runner-nz",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
