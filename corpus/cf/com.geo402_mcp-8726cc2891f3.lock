          "digest": "sha256:8f876a7af465625c25b0250ca224c86e0361d0ce7de96a32d367a9d2bcba3c00"
        },
        {
          "name": "search_from_country",
          "title": "Google search as seen from a country",
          "description": "Search Google as a user in the chosen country and language sees it: ranked results, answer box, People Also Ask, related searches; or news, Maps places or images. $0.004 per search, charged only on success.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Google market to search from, e.g. ca, fr, de, jp (default us)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Result language, e.g. fr, en, de, pt-br (default: the market's)",
                "type": "string"
              },
              "location": {
                "description": "With type=places: the city, e.g. \"Montreal, Quebec, Canada\"",
                "type": "string"
              },
              "num": {
                "description": "Results, 1-20 (default 10)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Search query",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "type": {
                "enum": ["web", "news", "places", "images"],
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
