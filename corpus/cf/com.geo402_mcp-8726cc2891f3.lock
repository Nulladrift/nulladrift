        {
          "name": "render_page_from_country",
          "title": "Load a JavaScript page in a real browser from a country (optional screenshot)",
          "description": "Load one public page in headless Chrome through a residential IP in the chosen country, so JavaScript runs: single-page apps, prices and content filled in by scripts. Returns markdown (or text/html), title, final URL, the extracted product price, and optionally a JPEG screenshot as an image. $0.020 per page, +$0.020 with a screenshot (x402, USDC on Base), charged only if the page loads. Use fetch_page_from_country first for ordinary pages: it's cheaper. Public pages only; robots.txt respected; no CAPTCHA solving.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Optional city for the exit IP, needs country. +$0.005.",
                "type": "string"
              },
              "country": {
                "description": "Country of the residential exit IP, e.g. de, jp, br (default: any)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "format": {
                "description": "markdown (default, best for reading), text, or raw html",
                "enum": ["markdown", "text", "html"],
                "type": "string"
              },
              "screenshot": {
                "description": "none (default), viewport (1280x900) or full page. +$0.020.",
                "enum": ["none", "viewport", "full"],
                "type": "string"
              },
              "state": {
                "description": "Optional US state, needs country=us. +$0.005.",
                "type": "string"
              },
              "url": {
                "description": "Public http(s) page, e.g. https://www.allbirds.com/products/mens-wool-runner-nz",
                "format": "uri",
                "type": "string"
              },
              "wait_for": {
                "description": "Optional CSS selector to wait for (up to 10 s), e.g. .price",
                "maxLength": 200,
                "type": "string"
              },
              "wait_ms": {
                "description": "Optional extra wait after the page settles, in ms",
                "maximum": 5000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:aa82eebc08376707331394d98d84b029b9a6bf8e5e31ec72dda7ccbfb2b429af"
        },
        {
          "name": "search_and_read",
          "title": "Search from a country and read the top results",
          "description": "Search Google from a country, then open the top 1-5 results through residential IPs in that same country and return each page as markdown. $0.004 + $0.005 per page read, one payment; not charged if no page loads.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Google market to search from, e.g. ca, fr, de, jp (default us)",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "lang": {
                "description": "Result language, e.g. fr, en, de, pt-br (default: the market's)",
                "type": "string"
              },
              "max_chars": {
                "description": "Max characters per page (default 4000)",
                "maximum": 20000,
                "minimum": 500,
                "type": "integer"
              },
              "q": {
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "read": {
                "description": "How many top results to read (default 3)",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
