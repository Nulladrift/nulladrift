      "serverInfo": {
        "name": "getkonnekted-websites",
        "title": "GetKonnektED Websites",
        "version": "1.0.0",
        "websiteUrl": "https://getkonnekted.com/",
        "icons": [
          {
            "src": "https://getkonnekted.com/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
