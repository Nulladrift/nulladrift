          "digest": "sha256:d2cbaa28da620ebd3c6c52d0590362898b440ba08a016da75508ad180aa31a4f"
        },
        {
          "name": "upload_website_files",
          "title": "Hand the finished website to GetKonnektED for hosting",
          "description": "After the order is PAID, upload the static website you designed for the customer (HTML, CSS, JavaScript, images, fonts) so GetKonnektED can host it. Send the files in one or more calls (text files as text, images and fonts as base64); index.html is the home page. Page limit by plan: Basic 4, Business 10, Enterprise 50 HTML pages. Set finished: true on the last call — the GetKonnektED team then checks the site, adds a small \"Powered by GetKonnektED\" footer badge with a Terms link, and publishes it on the customer's domain. Static sites only: no PHP, databases or server code (point contact forms to email, WhatsApp or a phone link). replace: true starts the upload again from empty.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "description": "Files to add (or overwrite)",
                "items": {
                  "properties": {
                    "content": {
                      "description": "The file content: plain text, or base64 when encoding is \"base64\"",
                      "type": "string"
                    },
                    "encoding": {
                      "description": "text (default) or base64 (images, fonts, PDFs)",
                      "enum": ["text", "base64"],
                      "type": "string"
                    },
                    "path": {
                      "description": "Path in the site, e.g. \"index.html\", \"about.html\", \"css/site.css\", \"img/logo.png\"",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 60,
                "type": "array"
              },
              "finished": {
                "description": "true on the last call: the site is complete and can be checked and published",
                "type": "boolean"
              },
              "order_id": {
                "description": "The order reference from start_website_order",
                "type": "string"
              },
              "replace": {
                "description": "true = discard what was uploaded before and start again",
                "type": "boolean"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Hand the finished website to GetKonnektED for hosting"
