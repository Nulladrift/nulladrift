          "title": "Website hosting packages and prices (South Africa)",
          "description": "GetKonnektED's website hosting for South African businesses: Basic, Business and Enterprise with live prices in rand (VAT included), the page limit and what each includes, domain prices (.co.za and international names), and how ordering and the site hand-over work. No design fee: the customer's own AI assistant designs the site and uploads it to us for hosting.",
