              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:3d3ce91aac4db1f54cadadbba924e96b4ddfc14ace78fbd2e5f80c257c66a2f1"
        },
        {
          "name": "get_website_quote",
          "title": "Quote for a domain and hosting",
          "description": "An itemised quote in rand (VAT included): the domain (first year) plus the chosen hosting plan's first month, what is due now, and the monthly amount after that. plan \"park\" = register the domain now and add hosting later.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain, e.g. \"smithplumbing.co.za\" or \"smithplumbing.com\" (a bare name gets .co.za)",
                "type": "string"
              },
              "plan": {
                "description": "basic (up to 4 pages), business (up to 10 pages), enterprise (more than 10 pages), or \"park\" for the domain only",
                "enum": ["basic", "business", "enterprise", "park"],
                "type": "string"
              }
            },
            "required": ["domain", "plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote for a domain and hosting"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:3a64cd555922c90cb3e586fb874b6332384b3610b0655af2e561322d533d5e30"
        },
        {
          "name": "start_website_order",
          "title": "Order a domain and hosting (returns a payment link)",
          "description": "Start an order for a domain and a hosting plan (or the domain parked) and get ONE secure Paystack payment link for the amount due now. Nothing is registered or set up until the customer pays. Before calling: show the quote, show the terms link and get the customer's yes to the terms and to the use of their contact details. GetKonnektED registers the domain on the customer's behalf; the customer owns it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accept_terms": {
                "description": "true only after the customer has accepted GetKonnektED's terms (https://getkonnekted.com/terms.html)",
                "type": "boolean"
              },
              "business_name": {
                "description": "The business name",
                "type": "string"
              },
              "contact_name": {
                "description": "The person ordering",
                "type": "string"
              },
              "domain": {
                "description": "The domain, e.g. \"smithplumbing.co.za\" or \"smithplumbing.com\" (a bare name gets .co.za)",
                "type": "string"
              },
              "email": {
                "description": "Their email — receipt and next steps go there",
                "type": "string"
              },
              "phone": {
                "description": "Their phone number",
                "type": "string"
              },
              "plan": {
                "description": "basic (up to 4 pages), business (up to 10 pages), enterprise (more than 10 pages), or \"park\" for the domain only",
                "enum": ["basic", "business", "enterprise", "park"],
                "type": "string"
              },
              "popia_consent": {
                "description": "true only after the customer agreed that GetKonnektED may use these details to set up the order and contact them about it",
                "type": "boolean"
              }
            },
            "required": ["accept_terms", "business_name", "contact_name", "domain", "email", "phone", "plan", "popia_consent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Order a domain and hosting (returns a payment link)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
