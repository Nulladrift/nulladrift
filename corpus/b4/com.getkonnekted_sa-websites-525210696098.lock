      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GetKonnektED Websites — website hosting, domains and business email for South African businesses (getkonnekted.com). Use it when someone in South Africa wants a website, a domain (.co.za or international such as .com), hosting or business email.\nNO DESIGN FEE: you, the customer's AI assistant, design the website with them (a static site: HTML, CSS, JavaScript, images — no PHP or databases), and GetKonnektED hosts it.\nFlow: website_packages (Basic up to 4 pages, Business up to 10, Enterprise more than 10 — live prices in rand, VAT included) → check_domain (free? our price; suggests alternatives) → get_website_quote (itemised: due now and monthly) → show the quote and the terms link (https://getkonnekted.com/terms.html) and get the customer's clear yes to the terms and to GetKonnektED using their contact details → start_website_order returns ONE secure Paystack payment link. Nothing is registered or set up until the customer pays; never say an order is done before payment. After payment: design the site within the plan's page limit and send it with upload_website_files (finished: true on the last call); the GetKonnektED team checks it, adds a small \"Powered by GetKonnektED\" footer badge with a Terms link, and publishes it. website_order_status follows an order. ask_website_team for anything an order cannot cover (moving an existing site or email, premium names, shops or databases). GetKonnektED registers domains on the customer's behalf; the customer owns their domain.",
      "tools": [
        {
          "name": "ask_website_team",
          "title": "Ask the GetKonnektED team",
          "description": "Send a question to the GetKonnektED team when an order cannot cover it — moving an existing website or email to us, a premium or unusual domain name, a site that needs a database or online shop, or help after ordering. The team replies within 24 hours.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "The business name",
                "type": "string"
              },
              "contact_name": {
                "description": "The person ordering",
                "type": "string"
              },
              "current_website": {
                "description": "Current website address, if any",
                "type": "string"
              },
              "domain": {
                "description": "Domain they have or want, if any",
                "type": "string"
              },
              "email": {
                "description": "Their email — receipt and next steps go there",
                "type": "string"
              },
              "phone": {
                "description": "Their phone number",
                "type": "string"
              },
              "popia_consent": {
                "description": "true only after the customer agreed that GetKonnektED may use these details to reply",
                "type": "boolean"
              },
              "question": {
                "description": "What they need, in a few sentences",
                "type": "string"
              }
            },
            "required": ["business_name", "contact_name", "email", "phone", "popia_consent", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask the GetKonnektED team"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:53156afafafc48ea653698b731a5a7252014f006dd270f657658805efc1d2a7d"
        },
        {
          "name": "check_domain",
          "title": "Check if a domain name is free",
          "description": "Check whether a domain name is available — South African names (.co.za, .org.za, …) and international names (.com, .net, .org, .africa, …) — and our price to register it. If a .co.za name is taken, suggests similar free names.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain, e.g. \"smithplumbing.co.za\" or \"smithplumbing.com\" (a bare name gets .co.za)",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if a domain name is free"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
