{
  "lockfileVersion": 2,
  "subjects": {
    "com.lastminutedealshq/ai-visibility": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ai-visibility.lastminutedealshq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "ai-visibility",
        "title": "AI visibility checker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Free, no-auth tools that check a site's AI-crawler access in robots.txt, generate or validate an llms.txt, and lint a robots.txt for AI-crawler mistakes. See https://ai-visibility.lastminutedealshq.com/for-agents.",
      "tools": [
        {
          "name": "check_site",
          "description": "Check a site's AI search visibility: which AI crawlers (OAI-SearchBot, PerplexityBot, GPTBot, ClaudeBot and more) robots.txt allows, whether the homepage ships readable text without JavaScript, and whether an llms.txt exists.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A site to check, e.g. example.com or https://example.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:da5608f0290965ed80d52296690efc1321a2eca338b278f9d74f2c1041929679"
        },
        {
          "name": "generate_llms_txt",
          "description": "Generate an llms.txt file from a site's real pages and sitemap.",
          "inputSchema": {
            "properties": {
              "credit": {
                "description": "Include a one-line attribution back to this tool. Default true.",
                "type": "boolean"
              },
              "url": {
                "description": "A site to generate an llms.txt for",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:03107f230d670fa1bafe3342b3fd1334df13d35a6741ea213a041a977afbb88c"
        },
        {
          "name": "lint_robots_txt",
          "description": "Lint a robots.txt for AI-crawler-specific mistakes. Pass url to fetch it live, or robots_txt to lint pasted text directly.",
          "inputSchema": {
            "properties": {
              "robots_txt": {
                "description": "Raw robots.txt text to lint directly, instead of fetching url",
                "type": "string"
              },
              "url": {
                "description": "A site whose /robots.txt should be fetched and linted",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:94f86434f7e19b1f0b4428cab6fbe2f60a1b65b482aa10d7ab32cab05790a848"
        },
        {
          "name": "validate_llms_txt",
          "description": "Validate an existing llms.txt against the spec.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "A site whose /llms.txt should be fetched and validated",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:67f2463f34e94967d3d5ff7cb7d9fff18c09cfc7df31ff27346ab6f5b4d4a841"
        }
      ],
      "digest": "sha256:9c14611c16904f227a2273151c282d1ff9302ceb888ef59ff8777124570266ae"
    }
  }
