{
  "lockfileVersion": 2,
  "subjects": {
    "app.craftme/craftme": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.craftme.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "craftme-booking",
        "title": "CraftMe booking",
        "version": "1.0.0",
        "websiteUrl": "https://www.craftme.app",
        "icons": [
          {
            "src": "https://www.craftme.app/images/app-icon.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CraftMe lists craftsperson studios with online booking (all trades: electrical, plumbing, heating, roofing, painting, tiling, flooring, carpentry, windows, garden, cleaning and moving). Appointments: search_studios → get_studio → find_free_slots → prepare_booking. Nothing is booked by these tools: always give the user the confirm_url so they confirm themselves. Times are in the studio time zone.",
      "tools": [
        {
          "name": "find_free_slots",
          "title": "Free times",
          "description": "Free start times for one service, in the studio's time zone. Days from tomorrow up to 90 days ahead, at most 14 days per call. A time with a promotion field has a discount of the studio (percent, discounted price); it applies automatically when booked.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "Number of days, default 7, at most 14",
                "type": "integer"
              },
              "earliest_time": {
                "description": "HH:mm, only times starting at or after",
                "type": "string"
              },
              "employee_id": {
                "description": "Only this employee (group studios)",
                "type": "string"
              },
              "from_date": {
                "description": "YYYY-MM-DD, default tomorrow",
                "type": "string"
              },
              "latest_time": {
                "description": "HH:mm, only times starting at or before",
                "type": "string"
              },
              "service_id": {
                "type": "string"
              },
              "studio_id": {
                "description": "studio_id from search_studios (or the handle from a profile link)",
                "type": "string"
              }
            },
            "required": ["service_id", "studio_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25b775921f7af69b8dacbb8d54e627d3bda28c9daf4ed93bc782bc56e7256a3c"
        },
        {
          "name": "get_studio",
          "title": "Studio details and services",
          "description": "Name, address, rating and the bookable services (id, duration, price) of one studio. Nail and hair studios also list their upcoming courses.",
          "inputSchema": {
            "properties": {
              "studio_id": {
                "description": "studio_id from search_studios (or the handle from a profile link)",
                "type": "string"
              }
            },
            "required": ["studio_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:02f433baccebe0a55083a7fdfbd5e2c2534acf212ba0bebc2451aefab950e2bf"
        },
        {
          "name": "prepare_booking",
          "title": "Prepare a booking",
          "description": "Checks that the time is still free and returns a confirm_url. Nothing is booked yet: the user opens the link, signs in and confirms (deposit and terms of the studio apply there).",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "employee_id": {
                "description": "Optional, group studios",
                "type": "string"
              },
              "service_id": {
                "type": "string"
              },
              "start_time": {
                "description": "HH:mm in the studio time zone",
                "type": "string"
              },
              "studio_id": {
                "description": "studio_id from search_studios (or the handle from a profile link)",
                "type": "string"
              }
            },
            "required": ["date", "service_id", "start_time", "studio_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9cefbd9a28962a5e0915c16f324d965adb570e379ffedd9b484b4d1b23728080"
        },
        {
          "name": "search_studios",
          "title": "Search studios",
          "description": "Find bookable craftsperson studios on CraftMe near a location or in a city, nearest first. Optionally only studios with a matching service.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "City name, used when no coordinates are known",
                "type": "string"
              },
              "latitude": {
                "type": "number"
              },
              "limit": {
                "description": "Max studios, default 10, at most 20",
                "type": "integer"
              },
              "longitude": {
                "type": "number"
              },
              "radius_km": {
                "description": "Search radius around the coordinates, default 25",
                "type": "number"
              },
              "service_query": {
                "description": "Words the service name must contain, e.g. \"electrician\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66c53073a1673df873ef71743c4600d02a42a952c7636c6ec8ca09fc0613e3e6"
        }
      ],
      "digest": "sha256:8c21050df80d1faf5600731c2fac408635ac463c4505f09babe95fd52189b2c5"
    }
  }
}
