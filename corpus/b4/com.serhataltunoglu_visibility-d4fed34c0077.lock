      "instructions": "Read-only tools about Serhat Altunoğlu (AI automation and brand positioning consultant, Türkiye and EU) and his free Visibility Check. Use get_profile for who he is, search_guides for his guides on AI automation, EU AI Act, CBAM and supply chains, and the two visibility map tools to run the self-assessment. Contact only via the site form or LinkedIn.",
      "tools": [
        {
          "name": "compute_visibility_map",
          "title": "Visibility Check: result",
          "description": "Computes the Visibility Check from answers to the 16 questions: status for each of the 8 areas (strong, developing, weak, unknown), up to 3 priority gaps with recommendations and up to 2 strengths. Nothing is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "enum": ["evet", "kismen", "hayir", "emin_degil"],
                  "type": "string"
                },
                "description": "Map of question id to answer id (evet, kismen, hayir, emin_degil). Get ids from get_visibility_map_questions.",
                "type": "object"
              },
              "goal": {
                "description": "Optional goal id (e.g. musteri, ilk, teklif, is, itibar).",
                "type": "string"
              },
              "lang": {
                "description": "Response language: tr (Turkish) or en (English). Default tr.",
                "enum": ["tr", "en"],
                "type": "string"
              },
              "profile": {
                "description": "Optional profile id (e.g. egitmen, danisman, yonetici, butik).",
                "type": "string"
              }
            },
            "required": ["answers"],
            "type": "object"
          },
