{
  "lockfileVersion": 2,
  "subjects": {
    "app.tresca/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tresca.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "tresca",
        "title": "Tresca",
        "version": "1.0.0",
        "websiteUrl": "https://tresca.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Tresca (https://tresca.app) is a directory of MCP servers, agent skills and vendor AI assistants for engineering software (CAD, CAE, BIM, EDA, PLC and more). Every listing has sources and a checked date; \"unknown\" means the project's documentation doesn't say. \"official\" means the software's vendor (or the open-source tool's own developers) publishes it, with evidence. Results follow the site's order, not a ranking. Tresca records facts and doesn't audit code: show the user the facts and let them choose, and ask before installing anything. AI-generated models, drawings and results must be checked by a qualified engineer before use.",
      "tools": [
        {
          "name": "get_install_steps",
          "title": "Get install steps",
          "description": "The install steps for one MCP server or skill, copied exactly from the project's own documentation, each with its source URL, plus warnings (archived, can change models, needs a licence). With client, only that client's steps plus the general ones (downloads, builds, packages). Show the user the steps and ask before running a command or editing a file.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "client": {
                "description": "The user's AI client, e.g. \"Claude Desktop\", \"Claude Code\", \"Cursor\"",
                "maxLength": 50,
                "type": "string"
              },
              "listing": {
                "description": "Tresca listing URL, slug, name or repository URL",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["listing"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3e421833faec7c64a99147ca16a6733cabeb09afddf320fe461ba8ec322e0279"
        },
        {
          "name": "get_listing",
          "title": "Get a listing's facts",
          "description": "Every fact Tresca holds for one MCP server or skill: what it does, capabilities, limitations, connection (drives the running app, files only, cloud API or documentation only), whether it can change models, operating systems, supported tool versions, licence, AI clients documented, official evidence, GitHub activity, sources and checked date. A loose name that matches nothing exactly returns suggestions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "listing": {
                "description": "Tresca listing URL, slug, name or repository URL",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["listing"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f8ae6b4ea8c280113d37a26982bbccee08cd788550d3e141a4b0404c6f612b7"
        },
        {
          "name": "get_tool",
          "title": "Look up an engineering tool",
          "description": "Is there an MCP server or agent skill for an engineering tool (e.g. AutoCAD, Revit, ANSYS, KiCad, PLAXIS), and is one official? Returns counts, official listings, the vendor's AI assistant and its status, scripting interfaces with documentation links, and the tool's Tresca page. If the name could mean several tools (e.g. 'ansys') or isn't on Tresca, returns found: false with suggestions to call again with.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "tool": {
                "description": "Tool slug, name or other name, e.g. \"revit\", \"SOLIDWORKS\", \"fusion 360\"",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a39e7645565c87796213e9a8c24a11033a1e5bd6db6a5ea7dec65f1dc5b9fd8a"
        },
        {
          "name": "get_vendor_assistant",
          "title": "Look up a vendor's AI assistant",
          "description": "The AI assistants engineering software vendors build into their products (Autodesk Assistant, Bentley Copilot, Creo AI Assistant and others): status in each product in the vendor's own words, what it does, how it relates to MCP servers, and pricing as stated, with sources.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "assistant": {
                "description": "Assistant name, vendor or tool, e.g. \"Autodesk Assistant\", \"Siemens\", \"Creo\"",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["assistant"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0910143f93a04e3d96a01c0f7beca10931754d42fa2db219c6b7acd27a4fa32"
        },
        {
          "name": "list_disciplines",
          "title": "List disciplines and tools",
          "description": "Tresca's engineering disciplines, the tools in each that have MCP servers or skills (with counts), and the slugs to pass as discipline to search_listings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a814568865297294c89ea1850ad766a846c3fe49d465879af559eefa60800df8"
        },
        {
          "name": "search_listings",
          "title": "Search MCP servers and agent skills for engineering software",
          "description": "Search Tresca's MCP servers, agent skills and plugins for engineering software by text, or browse by tool, discipline or AI client; filter by type, official, operating system and whether it can change models. Returns the facts that decide a choice and each listing's Tresca page. Order: official first, then most recently updated (with a query, best matches first); never a ranking. Words like 'best' or 'MCP' are ignored; if no listing matches every word, listings matching some of them are returned with a note. Needs a query, tool, discipline, client, or official: true.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "access": {
                "description": "Whether it can change models or files",
                "enum": ["read_only", "read_write", "configurable"],
                "type": "string"
              },
              "client": {
                "description": "AI client named in the project's docs, e.g. \"Claude Code\", \"Cursor\"",
                "maxLength": 50,
                "type": "string"
              },
              "cursor": {
                "description": "nextCursor from the previous page",
                "maxLength": 20,
                "type": "string"
              },
              "discipline": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 100,
                      "type": "string"
                    },
                    "maxItems": 8,
                    "type": "array"
                  }
                ],
                "description": "Discipline slug or slugs from list_disciplines, e.g. \"geotechnical-engineering\", or [\"fea-simulation\", \"cfd\"]; \"simulation\" covers both"
              },
              "limit": {
                "description": "Results per page, 1-25 (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "official": {
                "description": "true: only listings the software's vendor publishes",
                "type": "boolean"
              },
              "os": {
                "description": "Operating system it runs on",
                "enum": ["windows", "macos", "linux"],
                "type": "string"
              },
              "query": {
                "description": "Words to search for, e.g. \"revit\", \"plaxis python\", \"kicad drc\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "tool": {
                "description": "Tool slug or name, e.g. \"autocad\", \"Ansys Mechanical\", \"civil3d\"",
                "maxLength": 100,
                "type": "string"
              },
              "type": {
                "description": "Only MCP servers, agent skills or plugins",
                "enum": ["mcp_server", "skill", "plugin"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d97fe8afce8da44a7d2e9b5a4dead27dfbc3a73114a9b4012b21c3c63178fd8"
        }
      ],
      "digest": "sha256:34b0ef21153dad273e6085b3f639b480038bbe5f82aca56ca07c8e1ff74c0e0f"
    }
  }
}
