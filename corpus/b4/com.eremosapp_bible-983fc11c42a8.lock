{
  "lockfileVersion": 2,
  "subjects": {
    "com.eremosapp/bible": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.eremosapp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "eremos-bible",
        "title": "Eremos Thai Bible",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use these tools when a user wants Thai Bible text. Quote the returned Thai exactly; do not paraphrase it and present the result as Scripture. Name the source as the Eremos Translation and mention it is a draft under review. Verse numbers follow English (BSB) numbering.",
      "tools": [
        {
          "name": "get_passage",
          "title": "Get a Thai Bible passage",
          "description": "Return the Eremos Translation (Thai) text of a Bible reference, word for word, with verse numbers and a link. Accepts English or Thai book names, abbreviations or USFM codes: 'John 3:16', 'Jn 3:16-18', 'Psalm 23', '1 Cor 13:4-7', 'ยอห์น 3:16', 'JHN 3'. One chapter or a verse range within one chapter.",
          "inputSchema": {
            "properties": {
              "reference": {
                "description": "A Bible reference, e.g. 'John 3:16' or 'สดุดี 23'",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f00d382b00c4ea20fa9cf9536599c62884c4f10ea03b652cbaafffb06238069"
        },
        {
          "name": "get_translation_notes",
          "title": "Why a verse was translated this way",
          "description": "Return the published decision record for one verse: the Hebrew or Greek words, the Thai chosen, and the translator's reason, plus any notes. Useful when a user asks why the Thai reads as it does.",
          "inputSchema": {
            "properties": {
              "reference": {
                "description": "A single verse, e.g. 'Mark 1:35'",
                "type": "string"
              }
            },
            "required": ["reference"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fd038681bb8c1c630b0572afcbdd636d832c3d274fb797e38a17205503a89ec"
        },
        {
          "name": "list_books",
          "title": "List the books",
          "description": "List all 66 books with English and Thai names, USFM codes and chapter counts.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ac3ee0bca3ab55456c0ed8c290cbfa01b8d98aeea35f9c162d696aa86dcd3a4"
        },
        {
          "name": "search_text",
          "title": "Search the Thai text",
          "description": "Find verses in the Eremos Translation whose Thai text contains the given words (all words must appear). Optionally limit to one book. Returns up to `limit` verses with references.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "Optional book name or code to search within",
                "type": "string"
              },
              "limit": {
                "default": 15,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Thai words or phrase, e.g. 'ความรักมั่นคง'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ee918778d4b66eb0cb544228ca5eac1f04f74fc63e7c924a0b3d4c5d4062c0a2"
        }
      ],
      "digest": "sha256:eab6714bcd3a7641708eb73dce05afe84dde263b0de891d69f539edb64493eb7"
    }
  }
}
