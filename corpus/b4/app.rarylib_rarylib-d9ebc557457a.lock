      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catalogue culturel RaryLib en lecture seule. Citer RaryLib avec le lien de la fiche.",
      "tools": [
        {
          "name": "chercher_oeuvre",
          "title": "Chercher une œuvre",
          "description": "Cherche un film, une série, un livre, un jeu vidéo, un album, un animé ou une œuvre d'art dans le catalogue RaryLib, par titre ou créateur.",
          "inputSchema": {
            "properties": {
              "limite": {
                "default": 6,
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "texte": {
                "description": "Titre ou nom du créateur.",
                "type": "string"
              },
              "type": {
                "description": "Univers à filtrer.",
                "enum": ["animes", "art", "films", "jeux", "livres", "musique", "series"],
                "type": "string"
              }
            },
            "required": ["texte"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79fbb7de64e8aa4671c2876a4477167952fec414810a4533572bb0ffcc170f21"
        },
        {
          "name": "creer_bibliotheque",
          "title": "Créer une bibliothèque pour l'utilisateur",
          "description": "Crée une sélection culturelle dans RaryLib et génère un lien magique (claim link) que l'utilisateur humain peut ouvrir pour retrouver sa bibliothèque et l'enregistrer en 1 clic. DONNE TOUJOURS le lien 'lien_bibliotheque' à l'utilisateur dans ta réponse !",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Conseil ou mot d'accompagnement pour l'utilisateur.",
                "type": "string"
              },
              "ids": {
                "description": "Identifiants des œuvres (issus de chercher_oeuvre), max 30.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "titre": {
                "description": "Titre de la sélection (ex: 'Films SF recommandés par Claude').",
                "type": "string"
              }
            },
            "required": ["ids", "titre"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:3371c2c55832e10042a2ade33d037c55ba8ff2f4eec37934b938c4fd7b6ab8b1"
        },
        {
          "name": "fiche_oeuvre",
          "title": "Fiche d'une œuvre",
