      },
      "instructions": "Catalogue culturel RaryLib : recherche, fiches, où regarder, guides (lecture seule) et préparation d'une sélection que l'utilisateur enregistre lui-même. Citer RaryLib avec le lien de la fiche.",
      "tools": [
        {
          "name": "chercher_oeuvre",
          "title": "Chercher une œuvre",
          "description": "Cherche un film, une série, un livre, un jeu vidéo, un album, un animé ou une œuvre d'art dans le catalogue RaryLib, par titre ou créateur.",
          "inputSchema": {
            "properties": {
              "limite": {
                "default": 6,
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "texte": {
                "description": "Titre ou nom du créateur.",
                "type": "string"
              },
              "type": {
                "description": "Univers à filtrer.",
                "enum": ["animes", "art", "films", "jeux", "livres", "musique", "series"],
                "type": "string"
              }
            },
            "required": ["texte"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79fbb7de64e8aa4671c2876a4477167952fec414810a4533572bb0ffcc170f21"
        },
        {
          "name": "creer_bibliotheque",
          "title": "Créer une bibliothèque pour l'utilisateur",
          "description": "Crée une sélection d'œuvres du catalogue RaryLib (30 maximum) et renvoie un lien personnel (champ lien_bibliotheque), valable 30 jours, que l'utilisateur ouvre pour la retrouver et l'enregistrer dans son compte en un clic. Aucune donnée personnelle n'est stockée et aucun compte n'est créé par cet outil.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Conseil ou mot d'accompagnement pour l'utilisateur.",
                "type": "string"
              },
              "ids": {
                "description": "Identifiants des œuvres (issus de chercher_oeuvre), max 30.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "titre": {
                "description": "Titre de la sélection (ex: 'Films SF recommandés par Claude').",
                "type": "string"
              }
            },
            "required": ["ids", "titre"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9bff959dc721834edf1113e92882b3c807a92fa3edf8d39a37be04f77b7a022d"
        },
        {
          "name": "fiche_oeuvre",
          "title": "Fiche d'une œuvre",
          "description": "Résumé, créateur, année, note, où la regarder en France et œuvres proches, par identifiant.",
          "inputSchema": {
            "properties": {
              "id": {
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:20ccf27d230874fa58c6cb1e42353989f1f087228ec74b00d8d571ff482c59de"
        },
        {
          "name": "idees_soiree",
          "title": "Que regarder ce soir",
          "description": "Propose des films, séries ou animés pour ce soir, filtrés par humeur (rire, frissons, réfléchir, romantique, action, évasion, enquête) et par durée maximale, parmi les mieux notés du catalogue RaryLib.",
          "inputSchema": {
            "properties": {
              "duree_max_minutes": {
                "description": "Durée maximale en minutes (films).",
                "maximum": 400,
                "minimum": 30,
                "type": "integer"
              },
              "humeur": {
                "enum": ["action", "enquete", "evasion", "frissons", "reflechir", "rire", "romantique"],
                "type": "string"
              },
              "limite": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "default": "films",
                "enum": ["films", "series", "animes"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a976af551cc6e9d50049c36d3742a7828ea8c50a19a8a206b1c29c26d72de44b"
        },
        {
          "name": "identifier_par_isbn",
          "title": "Identifier un livre par son ISBN",
          "description": "Retrouve la fiche RaryLib d'un livre à partir de son ISBN-10 ou ISBN-13 (code-barres au dos du livre, lu par l'assistant sur une photo). Interroge le catalogue puis le service public Open Library pour le titre. Renvoie les fiches trouvées, utilisables avec creer_bibliotheque.",
          "inputSchema": {
            "properties": {
              "isbn": {
                "description": "ISBN-10 ou ISBN-13, avec ou sans tirets.",
                "type": "string"
              }
            },
            "required": ["isbn"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8add4aad3f549cc5c166b06cabb27620262895f78839c3105088702f9ec8082d"
        },
        {
          "name": "lire_guide",
          "title": "Lire un guide RaryLib",
          "description": "Renvoie le texte complet (Markdown) d'un guide RaryLib à partir de son slug, obtenu avec lister_guides.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Slug du guide, par exemple « ordre-star-wars ».",
                "type": "string"
              }
            },
            "required": ["slug"],
