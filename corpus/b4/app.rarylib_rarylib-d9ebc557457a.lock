          "title": "Recommander à partir de ce que j'aime",
          "description": "À partir de un à cinq titres aimés par l'utilisateur, renvoie des œuvres du même univers qui partagent leurs genres, parmi les mieux notées du catalogue RaryLib, avec la raison du choix. Ne lit aucune donnée personnelle et n'enregistre rien.",
          "inputSchema": {
            "properties": {
