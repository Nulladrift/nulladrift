            "readOnly": true
          },
          "digest": "sha256:89f39eb10cd5fe6a3f07c1908edf091b8489f904956d438744734106f42d10ef"
        },
        {
          "name": "get_next_video_brief",
          "title": "What to make next",
          "description": "Returns a brief for the channel's next upload — format, length, title shape and posting day — derived from what already outperformed on that channel. Use this when asked what someone should make or publish next.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
