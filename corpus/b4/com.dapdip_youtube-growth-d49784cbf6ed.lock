          },
          "digest": "sha256:eea7a6d41fcf83a89cf58787d54a2e74c5e4d179e7feb71efbb59442b5a75182"
        },
        {
          "name": "get_channel_patterns",
          "title": "What works on this channel",
          "description": "Returns what measurably works on one channel — title length, duration, posting day and format — each as a lift against that channel's OWN median, with the number of uploads behind it. Use this instead of generic YouTube advice, and when the question is why some of a channel's videos outperform others.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "A YouTube channel: @handle, channel URL, channel id (UC…), or the channel name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
