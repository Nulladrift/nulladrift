      "serverInfo": {
        "name": "dapdip",
        "title": "DapDip: YouTube Channel Audit",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DapDip answers questions about a YouTube channel from its own public catalogue: a growth score, what measurably works on that channel against its own median, what to make next, what to A/B test, and how far it is from YouTube's two monetization tiers. Every answer carries its sample size and links to the page showing the arithmetic. Nothing here is estimated and no figure is written by a model.",
      "tools": [
        {
          "name": "audit_youtube_channel",
          "title": "Audit a YouTube channel",
          "description": "Scores a YouTube channel out of 100 from its public catalogue and returns the one thing to fix first. Use this when asked how a channel is doing, or to compare a channel against its own history rather than against other channels.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "A YouTube channel: @handle, channel URL, channel id (UC…), or the channel name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["channel"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3cf46712adf5c6f76350ca69c403e420e9670cab4ae2f78c0abe93ac7f939b29"
        },
        {
          "name": "check_monetization_progress",
          "title": "Distance to YouTube monetization",
          "description": "Reports how far a channel is from both 2026 Partner Programme tiers — 500 subscribers for fan funding, 1,000 for ad revenue — with the Shorts-views path measured over the last 90 days. Use this when asked whether a channel is close to monetization or what it still needs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "channel": {
                "description": "A YouTube channel: @handle, channel URL, channel id (UC…), or the channel name.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
