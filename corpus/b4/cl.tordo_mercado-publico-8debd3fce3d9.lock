      },
      "instructions": "Datos públicos de Mercado Público (ChileCompra).\n\nConviene `panel_de_licitacion` —que responde de una vez precio, competencia,\ncomprador y ventana— antes que encadenar herramientas sueltas.\n\n**Las bandas de precio vienen siempre con `confianza` y `n` (tamaño de muestra).\nMenciónalos.** Una mediana calculada con cuatro órdenes no es un precio de\nmercado, y presentarla como un hecho es el error más caro que puedes cometer\naquí.\n\nLos precios están en pesos chilenos.\n",
      "tools": [
        {
          "name": "buscar_productos",
          "title": "Buscar productos por nombre",
          "description": "Encuentra el código ONU de un producto a partir de su nombre. Es el paso previo a `precio_de_producto`: el catálogo usa códigos, y el usuario habla de «guantes» o «papel». Busca por palabras, en cualquier orden y con sus plurales y algunos sinónimos («lápiz» también trae «bolígrafo»; «pc», computadores): no hace falta probar variantes. Devuelve cuántas transacciones tiene cada uno, que es lo que indica si el precio será fiable.",
          "inputSchema": {
            "properties": {
              "limite": {
                "default": 20,
                "title": "Limite",
                "type": "integer"
              },
              "texto": {
                "maxLength": 100,
                "minLength": 1,
                "title": "Texto",
                "type": "string"
              }
            },
            "required": ["texto"],
            "title": "buscar_productosArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "buscar_productosDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:78934f8d7568dcf0fbccaaadfd7df266523e9581d3d73b9b91235a983367d00b"
        },
        {
          "name": "panel_de_licitacion",
          "title": "Panel de una licitación",
          "description": "Todo lo que hace falta para decidir si postular a una licitación, en una sola llamada: perfil del comprador, si la ventana de preparación es holgada o apretada, los competidores habituales, y las bandas de precio de sus productos con su confianza. Úsala en vez de encadenar varias herramientas.",
          "inputSchema": {
            "properties": {
              "codigo": {
                "maxLength": 64,
                "minLength": 1,
                "title": "Codigo",
                "type": "string"
              }
            },
            "required": ["codigo"],
            "title": "panel_de_licitacionArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "panel_de_licitacionDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad924f6ce533116f53d1658eae770d8f3cdb0bc891a8d883b19f71ec889bf759"
        },
        {
          "name": "perfil_de_comprador",
          "title": "Perfil de un comprador",
          "description": "Cómo se comporta un organismo público: qué tan transparente es su historial, cuánto de lo que llama termina adjudicando y sus señales de riesgo. Sirve para decidir si conviene trabajar con él antes de mirar el precio.",
          "inputSchema": {
            "properties": {
              "organismo_id": {
                "maxLength": 64,
                "minLength": 1,
                "title": "Organismo Id",
                "type": "string"
              }
            },
            "required": ["organismo_id"],
            "title": "perfil_de_compradorArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "perfil_de_compradorDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:78ea1196695f00a652214d1ffa37ea370ae8806d2ffd81a5e640fe8e8598b1a9"
        },
        {
          "name": "precio_de_producto",
          "title": "Precio de referencia de un producto",
          "description": "Bandas de precio históricas de un producto (código ONU): percentiles 10 a 90, con el nivel de datos usado, la confianza y el tamaño de muestra. Si se indica organismo, usa sus datos y sólo cae al sector o al país cuando no tiene suficientes.",
          "inputSchema": {
            "properties": {
              "codigo_producto": {
                "maxLength": 64,
                "minLength": 1,
                "title": "Codigo Producto",
                "type": "string"
              },
              "organismo_id": {
                "anyOf": [
                  {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Organismo Id"
              }
            },
            "required": ["codigo_producto"],
            "title": "precio_de_productoArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "precio_de_productoDictOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:78206e54a8563f2ef72eb33eaadc3ebcad306d3d8679468367de6ea7d5b1a942"
        }
