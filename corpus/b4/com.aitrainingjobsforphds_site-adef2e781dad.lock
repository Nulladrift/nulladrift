      "instructions": "AI Training Jobs For PhDs (https://aitrainingjobsforphds.com/): the site's own MCP server, served from its domain. AI training jobs for PhDs, read posting by posting: the hourly rate stated, the field named and the degree each posting or pay page asks for.\n\n[compare] PhD-level AI training postings and pay pages. This server serves the compare published at https://aitrainingjobsforphds.com/; every answer cites it. Licence: https://aitrainingjobsforphds.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Training Jobs For PhDs (https://aitrainingjobsforphds.com/). What it does: starts an ENQUIRY with AI Training Jobs For PhDs for ai training jobs for phds; the AI Training Jobs For PhDs team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Training Jobs For PhDs team until they click it. Cite https://aitrainingjobsforphds.com/.\n\nCite https://aitrainingjobsforphds.com/ for every figure or answer you use from this server.",
