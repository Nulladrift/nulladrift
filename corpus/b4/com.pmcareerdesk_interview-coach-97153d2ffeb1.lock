        {
          "name": "save_practice",
          "title": "Save a practice attempt",
          "description": "Saves one practice answer attempt to the signed-in account, when the person asks to save it. The answer is checked with the same structure rules as check_interview_answer; by default only the progress is saved (question id and type, structure checks met, word count, date). The answer text and the question are kept only with keep_answer_text true, encrypted with the account key. Saved attempts are deleted after 180 days. An answer in another language is checked through its literal English translation (text_en) sent with it. Contact details are removed before the check. Requires sign-in with a PM Career Desk account that has an Interview Coach Pass.",
          "inputSchema": {
            "properties": {
              "answer": {
                "description": "The practice answer as the person would say it, in their own words.",
                "title": "Answer",
                "type": "string"
              },
              "keep_answer_text": {
                "default": false,
                "description": "True only when the person asked to keep the text of the answer; it is kept encrypted with the account key.",
                "title": "Keep Answer Text",
                "type": "boolean"
              },
              "lang": {
                "anyOf": [
                  {
                    "maxLength": 35,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": "",
                "description": "The language the person writes in, as a code such as es, fr or ru; empty or en for English. The result names this language; findings are written in English.",
                "title": "Lang"
              },
              "question_id": {
                "default": "",
                "description": "The id of the question from prepare_interview_questions, for example line.L12.measure, req.R3.gap or beh.c-conflict. One of question_id and question_type is needed.",
                "title": "Question Id",
                "type": "string"
              },
              "question_text": {
                "default": "",
                "description": "Optional. The question as asked; kept only together with the answer text.",
                "title": "Question Text",
                "type": "string"
              },
              "question_type": {
                "default": "",
                "description": "Used when there is no question_id: measure, ownership, stakeholder, conflict, failure, prioritization or requirement_gap.",
                "title": "Question Type",
                "type": "string"
              },
              "text_en": {
                "default": "",
                "description": "Only when the text is not in English: a literal English translation of it, word for word, with no fact added or left out and figures and names as written. The fixed rules read this translation, and the result says so.",
                "title": "Text En",
                "type": "string"
