                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": "",
                "description": "The full text of the job posting, as the person gave it. Optional; with it the result adds the requirements, the gaps and questions about them.",
                "title": "Job Posting"
              },
              "job_requirements": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. The requirement lines of the job posting, each word for word from job_posting; lines that are not are left out and counted in the result. Without them the requirements are read from job_posting.",
