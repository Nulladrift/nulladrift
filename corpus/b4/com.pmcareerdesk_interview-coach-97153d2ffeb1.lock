        {
          "name": "check_interview_answer",
          "title": "Check the structure of an interview answer",
          "description": "Checks the structure of one practice answer to an interview question. Use it when the person writes or pastes an answer and wants feedback before the interview. Checks for a situation, the speaker's own action in the first person, a result, a before and after figure or a named record, vague amounts, length, filler and hedging words, and the balance of we and I; returns the rubric for the question type and what is missing. Needs question_id (from prepare_interview_questions) or question_type (for example conflict, failure, stakeholder, prioritization, measure). With resume_text, figures the resume does not show are marked unconfirmed. It does not judge whether the story is true and does not write the answer. Up to 6000 characters; contact details are removed first; nothing is stored.",
          "inputSchema": {
            "properties": {
              "answer": {
                "description": "The practice answer as the person would say it, in their own words.",
                "title": "Answer",
                "type": "string"
              },
              "lang": {
                "anyOf": [
                  {
                    "maxLength": 35,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": "",
                "description": "The language the person writes in, as a code such as es, fr or ru; empty or en for English. The result names this language; findings are written in English.",
                "title": "Lang"
              },
              "question_id": {
                "default": "",
                "description": "The id of the question from prepare_interview_questions, for example line.L12.measure, req.R3.gap or beh.c-conflict. One of question_id and question_type is needed.",
                "title": "Question Id",
                "type": "string"
              },
              "question_type": {
                "default": "",
                "description": "Used when there is no question_id: measure, ownership, stakeholder, conflict, failure, prioritization or requirement_gap.",
                "title": "Question Type",
                "type": "string"
              },
              "resume_text": {
                "default": "",
                "description": "Optional. The resume, or the resume line the question came from; figures of the answer it does not show are marked unconfirmed.",
                "title": "Resume Text",
                "type": "string"
              },
              "text_en": {
                "default": "",
                "description": "Only when the text is not in English: a literal English translation of it, word for word, with no fact added or left out and figures and names as written. The fixed rules read this translation, and the result says so.",
                "title": "Text En",
                "type": "string"
              }
            },
            "required": ["answer"],
            "title": "check_interview_answer_toolArguments",
            "type": "object"
