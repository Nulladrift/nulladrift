      "instructions": "PM Career Desk: interview and resume preparation for project managers, program managers, technical program managers (TPM), PMO leads and close roles (product manager, scrum master, delivery manager, business analyst), written for the US job market. The tools apply when a person in one of these roles asks for help with a job interview, a resume, a job posting or a LinkedIn profile. Where each request starts: a resume and a job posting before an interview: prepare_interview_questions (questions that quote the person's own resume lines, each requirement of the posting with the resume lines found for it, behavioral questions for the role); a resume alone: review_resume; a resume and a posting, fit only: match_resume_to_job; one practice answer: check_interview_answer, with the question id from prepare_interview_questions or a question type; a LinkedIn headline or About: check_linkedin_profile. The resume can be pasted or attached; the tools take its plain text. The tools return findings and questions from fixed rules written by practitioners; they do not write or rewrite the person's text, so their results are the input for the conversation that follows. The free tools store nothing the user sends. Nine tools need sign-in to a PM Career Desk account: a full interview plan (prepare_interview_plan), saving and reading practice progress (save_practice, get_practice), a prep file (export_prep_pack), a mock interview (start_mock_interview, answer_mock_question, finish_mock_interview) that returns one question or follow-up at a time and checks each answer, a STAR story bank from a resume (build_story_bank) and a 30-60-90 day plan skeleton for a job posting (draft_30_60_90_plan); the user writes every answer. Practice is saved only when the user asks or finishes a mock interview (progress only; answer texts only on request). Language: the fixed rules read English. Tools that read the user's own text take lang, the user's language, and, for a text not in English, text_en, a literal English translation of that text, word for word, with no fact added or left out; the rules then read text_en and the result says so, and without text_en the result is a request for it. Questions from the question bank and findings are written in English. The resume and job posting tools read English text: for a resume in another language they read its literal English translation, and quotes come from that translation.",
      "tools": [
        {
          "name": "answer_mock_question",
          "title": "Answer a mock interview question",
          "description": "Records the person's answer to the current question of a mock interview and checks its structure with the rules of check_interview_answer. Returns a compact verdict and what comes next: a follow-up probe for what the answer does not show (own action, a result in numbers, the figure before, one specific example), or the next question. skip moves on without an answer. An answer in another language is recorded and checked as its literal English translation (text_en) sent with it. Contact details are removed first. Requires sign-in with a PM Career Desk account that has an Interview Coach Pass.",
          "inputSchema": {
            "properties": {
              "answer": {
                "default": "",
                "description": "The person's answer to the current question or follow-up, exactly as given.",
                "title": "Answer",
                "type": "string"
              },
              "lang": {
                "anyOf": [
                  {
                    "maxLength": 35,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": "",
                "description": "The language the person writes in, as a code such as es, fr or ru; empty or en for English. The result names this language; findings are written in English.",
                "title": "Lang"
              },
              "session_id": {
                "description": "The session_id that start_mock_interview returned.",
                "title": "Session Id",
                "type": "string"
              },
              "skip": {
                "default": false,
                "description": "True moves on to the next question without an answer.",
                "title": "Skip",
                "type": "boolean"
              },
              "text_en": {
                "default": "",
                "description": "Only when the text is not in English: a literal English translation of it, word for word, with no fact added or left out and figures and names as written. The fixed rules read this translation, and the result says so.",
                "title": "Text En",
                "type": "string"
              },
              "turn": {
                "default": 0,
                "description": "Optional. The turn number of the question being answered; a repeated turn returns the same reply without recording the answer twice. 0 when not known.",
                "title": "Turn",
                "type": "integer"
              }
            },
            "required": ["session_id"],
            "title": "answer_mock_question_toolArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Answer a mock interview question"
          },
          "behavior": {
