                "title": "OutlineRole",
                "type": "object"
              },
              "ResumeOutline": {
                "properties": {
                  "certifications": {
                    "description": "One credential per item, word for word.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 60,
                    "title": "Certifications",
                    "type": "array"
                  },
                  "education": {
                    "description": "Education lines, word for word.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 60,
                    "title": "Education",
                    "type": "array"
                  },
                  "roles": {
                    "description": "Roles in resume order.",
                    "items": {
                      "$ref": "#/$defs/OutlineRole"
                    },
                    "maxItems": 30,
                    "title": "Roles",
                    "type": "array"
                  },
                  "skills": {
                    "description": "Skills or tools lines, word for word.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 60,
                    "title": "Skills",
                    "type": "array"
                  },
                  "summary": {
                    "description": "Summary lines, word for word.",
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 60,
                    "title": "Summary",
                    "type": "array"
                  }
                },
                "title": "ResumeOutline",
                "type": "object"
