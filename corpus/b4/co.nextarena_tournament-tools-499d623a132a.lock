                    "items": {
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 64,
                    "type": "array"
                  },
                  "pointsPerMatch": {
                    "default": 32,
                    "description": "Combined rally points shared by the two pairs, not points per pair. Both final scores must add to this number.",
                    "maximum": 64,
                    "minimum": 8,
                    "type": "integer"
                  },
                  "ranking": {
                    "default": "total",
                    "description": "How the table ranks players. total: rally points, and a rest scores 0. average: points per match played. Offer average when some players rest more often than others.",
                    "enum": ["total", "average"],
                    "type": "string"
                  },
                  "restMinutes": {
                    "default": 0,
                    "description": "Break between rounds, in minutes.",
                    "maximum": 120,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rounds": {
                    "default": 5,
                    "maximum": 30,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "sport": {
                    "const": "padel",
