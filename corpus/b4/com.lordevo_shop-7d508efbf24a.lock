          "description": "$0.002 per call (x402, USDC on Base; free trial: add \"trial\": true or use try_free). [Fetch and read the web] Pre-fetch gate for agents and scrapers: is this exact URL allowed by robots.txt (RFC 9309: missing = allow, 5xx/unreachable = disallow) for generic agents and 16 named AI agents/crawlers (ChatGPT-User, Claude-User, PerplexityBot, GPTBot, ClaudeBot, Google-Extended, CCBot...), plus Crawl-delay, Content-Signal (search / ai-input / ai-train), X-Robots-Tag noai/noindex from a HEAD request, and sitemaps. Verdict allowed / disallowed / allowed_but_no_ai_use / allowed_with_crawl_delay. Never downloads the page body. Cached up to 10 min. ~0.3-2 s.",
