          "description": "$0.002 per call (x402, USDC on Base; free trial: add \"trial\": true or use try_free). [Web and domain checks] Resolve one link the way a browser would: follows up to 10 redirects (HEAD first, GET fallback), returns alive true/false with a reason (http_404, dns_not_found, timeout...), the final URL and domain, every hop with its status, cross-domain and HTTPS-downgrade flags, URL-shortener detection, content type/length, Last-Modified/ETag, X-Robots-Tag and TLS validity. robots.txt is checked before the link and each redirect is requested; a disallowed link is refused (not charged), a disallowed hop is reported. Dead links are an answer, not an error. Cached up to 5 min. ~0.3-3 s.",
