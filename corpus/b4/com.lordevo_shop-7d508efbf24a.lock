      "instructions": "No wallet yet? Paid tools priced up to $0.005 have a free trial: add \"trial\": true to the tool arguments (3 free calls per IP per UTC day; failed calls do not count). Example: page_markdown with {\"url\": \"https://example.com\", \"trial\": true}, or try_free with {\"tool\":\"page_markdown\",\"arguments\":{\"url\":\"https://example.com\"}}. Website checks and data tools for AI agents, grouped by job: fetch and read the web (page Markdown, RAG chunks, feeds, PDFs, page changes), web and domain checks (links, redirects, DNS, TLS, RDAP), data utilities (JSON validate/repair, token estimates, time zones, cron, URL cleaning) and SEO/security checks. Start with site_check ($0.02, not in the free trial) for a website: URL risk signals (evidence + risk level, never a safety claim) + AI readiness + security headers in one call. Not sure which tool fits? Read the resource lordevo://guide/choose-a-tool. server/discover, initialize, tools/list, the resources, try_free, list_services, get_sample_output and preflight (would a paid fetch succeed on this URL?) are free. Paid tools cost $0.002-$0.02 in USDC on Base via the x402 MCP transport: call the tool, receive PaymentRequired (isError, structuredContent), sign with any x402 client and retry with params._meta[\"x402/payment\"]. Only check sites you are allowed to; all checks are passive and read-only.",
