          "description": "$0.002 per call (x402, USDC on Base; free trial: add \"trial\": true or use try_free). [Data utilities] Screens text an agent is about to read (web page, email, tool output, document) for prompt injection: instruction overrides (\"ignore previous instructions\"), role hijacks and jailbreak modes, fake chat delimiters (<|im_start|>, [INST], \"system:\" lines), requests to reveal the system prompt or send secrets, Markdown-image exfiltration URLs, hiding things from the user, coerced tool calls, payments or shell one-liners, and text hidden from humans (zero-width, bidi and Unicode tag characters, HTML comments, display:none blocks, base64), which is decoded and scanned too. Returns verdict likely_injection / suspicious / no_injection_found, a 0-100 score, findings with excerpt and line, and hidden-content counts. Rule-based and offline: not a model and not a guarantee. Input: text (POST for long text), optional format, max_findings, clean. Limit: 200,000 characters.",
