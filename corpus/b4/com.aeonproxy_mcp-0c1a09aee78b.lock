          },
          "digest": "sha256:e7cb12a32daf1d29eefc4eaf3248e95790873b7057777a5464339a2ea5fbe7ba"
        },
        {
          "name": "test_proxies",
          "title": "Test proxies",
          "description": "Tests proxy lines from any provider with one request each (the AeonProxy proxy tester): whether the proxy answers, the HTTP status, latency, the exit IP and its country; SOCKS5 lines also get a UDP check. Accepts host:port:user:pass, user:pass@host:port or scheme://user:pass@host:port. Up to 10 lines per call without signing in, 50 when signed in. Testing AeonProxy lines uses a few KB of their traffic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "protocol": {
                "default": "http",
                "description": "how to talk to the proxies (lines with a scheme:// keep theirs)",
                "enum": ["http", "https", "socks5"],
                "type": "string"
              },
              "proxies": {
                "description": "proxy lines",
                "items": {
                  "maxLength": 300,
                  "minLength": 5,
                  "type": "string"
                },
                "maxItems": 50,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["proxies"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Test proxies"
