        {
          "name": "list_proxy_locations",
          "title": "List proxy locations",
          "description": "Residential or mobile proxy coverage of AeonProxy. Without country it lists the countries served (narrow it with query, e.g. \"japan\"). With a country code it lists that country's regions, cities and ISPs (residential) or mobile carriers, each with the key that targets it in the proxy login (e.g. -cc-us-city-newyork). With a region as well, the cities are only that region's, the ones that go with its -st- key in one login. generate_proxy_lines and fetch_via_proxy accept exactly these values. Works without signing in.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "two-letter country code (us, gb, jp); leave out to list countries",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "product": {
                "default": "residential",
                "description": "residential (home IPs) or mobile (4G/5G carrier IPs)",
                "enum": ["residential", "mobile"],
                "type": "string"
              },
              "query": {
                "description": "part of a country, region, city, ISP or carrier name, e.g. \"bavaria\", \"osaka\", \"vodafone\"",
                "maxLength": 60,
                "type": "string"
              },
              "region": {
                "description": "with country: a region from its regions list (e.g. \"california\"), to list only the cities of that region",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List proxy locations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7a86ca77a02d98ada76780d580dfc24e3b912ac56adffbfb20340f048841d8f8"
        },
        {
          "name": "quote_proxy_price",
          "title": "Quote a purchase",
          "description": "The exact price of one AeonProxy purchase: residential or mobile traffic in GB (1–1000; the tier rate applies to the whole amount) or a number of ISP / datacenter IPs for a rental term. When the user is signed in, their loyalty discount is applied. Promo codes are entered in the dashboard and are not checked here.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "GB for residential and mobile, number of IPs for ISP and datacenter",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "product": {
                "enum": ["residential", "mobile", "isp", "datacenter"],
                "type": "string"
              },
              "term": {
                "default": "month",
                "description": "rental term for IPs (ISP: month only; datacenter: 3days, week, half_month or month); ignored for traffic",
                "enum": ["month", "half_month", "week", "3days"],
                "type": "string"
              }
            },
            "required": ["amount", "product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Quote a purchase"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a8e4bced61bd54861f20563a64d145f348941111bd8ab1278f33747d356903e6"
        },
        {
          "name": "search_aeonproxy_docs",
          "title": "Search AeonProxy docs",
          "description": "Searches the AeonProxy website and documentation (setup guides for antidetect browsers, browsers, phones, scraping tools and code; how sessions, targeting, protocols, limits and gateway errors work; the REST API; FAQ) and returns the best matching sections with their links. The documentation is in English, so English keywords match best, e.g. \"Playwright proxy setup\", \"sticky session length\", \"407 error\".",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AeonProxy docs"
          },
