          "name": "get_proxy_prices",
          "title": "Get proxy prices",
          "description": "AeonProxy price list: residential and mobile traffic per GB by volume tier (the tier rate applies to the whole purchase and traffic never expires), ISP and datacenter IPs per IP for each rental term, unlimited residential plans, the free trial and first top-up bonus on offer now, and the loyalty discount levels. Works without signing in.",
