        {
          "name": "list_orders",
          "title": "List my orders",
          "description": "The signed-in AeonProxy account's orders, newest first: traffic purchases, trial and bonus traffic, ISP and datacenter IP rentals and unlimited plans, with status, GB left, number of IPs, expiry and next renewal. get_order returns the IPs and logins of one order.",
