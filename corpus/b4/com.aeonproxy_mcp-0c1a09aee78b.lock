  "subjects": {
    "com.aeonproxy/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aeonproxy.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "aeonproxy",
        "title": "AeonProxy",
        "version": "1.1.0",
        "websiteUrl": "https://aeonproxy.com",
        "icons": [
          {
            "src": "https://aeonproxy.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://aeonproxy.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AeonProxy sells residential and mobile proxies (paid per GB, traffic never expires), ISP and datacenter IPs (per IP and rental term) and unlimited residential plans, all through one gateway with targeting keys in the proxy login.\nTools that read public data (locations, prices, IP stock, site blocks, service status, proxy tests, documentation search) work without signing in. get_account, generate_proxy_lines, fetch_via_proxy, get_traffic_usage, list_orders and get_order need the user's AeonProxy sign-in or API key.\nRegion, city, ISP and carrier values must be taken from list_proxy_locations; the gateway refuses other values. fetch_via_proxy uses the account's paid traffic. Purchases, top-ups and account changes are made by the user in the dashboard (https://aeonproxy.com/dashboard), not with these tools.",
      "tools": [
        {
          "name": "check_site_access",
          "title": "Check if a site is blocked",
          "description": "Whether the AeonProxy gateway blocks a site or port by default for residential and mobile traffic: mail ports, .gov / .mil sites and listed banking, payment and ticketing sites; and whether the signed-in account has the site blocks lifted. It does not test whether the site itself accepts proxy traffic (fetch_via_proxy or test_proxies do).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "host": {
                "description": "site name or URL, e.g. paypal.com",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "port": {
                "default": 0,
                "description": "target port, 0 if not known",
                "maximum": 65535,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["host"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if a site is blocked"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7523179cfa00a942f71924f08319d1121551b55c2f60fe34edaf7801789205b3"
        },
        {
          "name": "fetch_via_proxy",
          "title": "Fetch a page through a proxy",
          "description": "Fetches a web page through the signed-in account's AeonProxy residential (default) or mobile proxy from the chosen country, region or city, and returns the HTTP status, the final URL and the content as Markdown (default), plain text or HTML. Use it to see a page as people in another country see it (local prices, search results, ads, availability) or when a site refuses data-center IPs. One GET request, redirects followed, no JavaScript is run, binary files are not returned. It uses the account's paid traffic: each result reports the KB used. It goes through the AeonProxy proxy gateway (https://aeonproxy.com/docs); set-up and limits: https://aeonproxy.com/docs/setup/mcp-server.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accept_language": {
                "description": "Accept-Language header, e.g. \"ja-JP,ja;q=0.9\"; default en-US",
                "maxLength": 100,
                "type": "string"
              },
              "city": {
                "description": "city from list_proxy_locations",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "two-letter country code of the exit IP; leave out for any country",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "format": {
                "default": "markdown",
                "enum": ["markdown", "text", "html"],
                "type": "string"
              },
              "max_chars": {
                "default": 20000,
                "description": "longest content to return; the rest is cut",
                "maximum": 100000,
                "minimum": 1000,
                "type": "integer"
              },
              "product": {
                "default": "residential",
                "description": "residential (home IPs) or mobile (4G/5G carrier IPs)",
                "enum": ["residential", "mobile"],
                "type": "string"
              },
              "region": {
                "description": "region from list_proxy_locations",
                "maxLength": 80,
                "type": "string"
              },
              "session_id": {
                "description": "reuse the same exit IP for 10 minutes across calls by passing the same id; leave out for a fresh IP",
                "pattern": "^[a-z0-9]{1,16}$",
                "type": "string"
              },
              "url": {
                "description": "full http:// or https:// address",
                "maxLength": 2000,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Fetch a page through a proxy"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:262e2d64f97fd251b3d4ad1d80b3627e60966f6058bc178283521556e9ab55a6"
        },
        {
          "name": "generate_proxy_lines",
          "title": "Generate proxy lines",
          "description": "Ready-to-use residential or mobile proxy lines for the signed-in AeonProxy account, with the proxy login and password in them: country, region, city and ISP (residential) or carrier (mobile) targeting, rotating (a new IP for every connection) or sticky sessions of 1 minute to 6 hours, HTTP or SOCKS5, up to 100 lines. Region, city, isp and carrier take the names list_proxy_locations returns. Making lines is free; traffic is counted only when they are used.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "carrier": {
                "description": "mobile only: carrier from list_proxy_locations",
                "maxLength": 80,
                "type": "string"
              },
              "city": {
                "description": "city from list_proxy_locations",
                "maxLength": 80,
                "type": "string"
              },
              "count": {
                "default": 10,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "country": {
                "description": "two-letter country code; leave out for any country",
                "pattern": "^[a-z]{2}$",
                "type": "string"
              },
              "format": {
                "default": "host:port:user:pass",
                "enum": ["host:port:user:pass", "host:port@user:pass", "user:pass:host:port", "user:pass@host:port", "protocol://user:pass@host:port"],
                "type": "string"
              },
              "isp": {
                "description": "residential only: ISP from list_proxy_locations",
                "maxLength": 80,
                "type": "string"
              },
              "product": {
                "default": "residential",
                "description": "residential (home IPs) or mobile (4G/5G carrier IPs)",
                "enum": ["residential", "mobile"],
                "type": "string"
              },
              "protocol": {
                "default": "http",
                "enum": ["http", "socks5"],
                "type": "string"
              },
              "region": {
                "description": "region from list_proxy_locations",
                "maxLength": 80,
                "type": "string"
              },
              "session": {
                "default": "sticky",
                "description": "sticky keeps one IP for session_minutes; rotating gives a new IP per connection",
                "enum": ["sticky", "rotating"],
                "type": "string"
              },
              "session_minutes": {
                "default": 10,
                "description": "sticky session length, 1–360 minutes",
                "maximum": 360,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate proxy lines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:71b4ca0b71029c5cf6fa9c1bfc3d1c7f4c8864d0c22aefc1d90afceacc97a213"
        },
