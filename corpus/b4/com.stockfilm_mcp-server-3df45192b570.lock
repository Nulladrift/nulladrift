        {
          "name": "quote_training_dataset",
          "description": "Create a fixed-price dataset quote for a filtered subset and get a private order_token. Freezes the exact clip list. Ask the buyer for their email, organization, and intended use first. Does not charge anyone. Show the buyer the tier, clip count, hours, price, payment method (card or bank wire), and the agreement before asking them to accept.",
          "inputSchema": {
            "$defs": {
              "DatasetFilters": {
                "properties": {
                  "countries": {
                    "description": "Country names as they appear in the catalog, e.g. [\"United States\", \"France\"]",
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "decades": {
                    "description": "Decades to include, e.g. [\"1950s\", \"1960s\"]. Default: all six, 1930s–1980s.",
                    "items": {
                      "type": "string"
                    },
                    "type": ["array", "null"]
                  },
                  "exclude_logos": {
                    "description": "Exclude clips with logos or trademarks (implies reviewed_only)",
                    "type": ["boolean", "null"]
                  },
                  "exclude_minors": {
                    "description": "Exclude clips where minors are visible (implies reviewed_only)",
                    "type": ["boolean", "null"]
                  },
                  "exclude_music": {
                    "description": "Exclude clips with audible music (implies reviewed_only)",
                    "type": ["boolean", "null"]
                  },
                  "exclude_people": {
                    "description": "Exclude clips where people are visible (implies reviewed_only)",
                    "type": ["boolean", "null"]
                  },
                  "max_clips": {
                    "description": "Cap the selection at this many clips (stable pseudo-random sample of the matches)",
                    "format": "uint32",
                    "minimum": 0,
                    "type": ["integer", "null"]
                  },
                  "max_risk": {
                    "description": "Highest clearance risk to include: low, medium, or high (default)",
                    "type": ["string", "null"]
                  },
                  "query": {
                    "description": "Free text matched against titles, descriptions, and keywords",
                    "type": ["string", "null"]
                  },
                  "require_4k_master": {
                    "description": "Only clips with a restored 4K master online (forced on for 4k media)",
                    "type": ["boolean", "null"]
                  },
                  "reviewed_only": {
                    "description": "Only clips with clearance flags populated. Default true.",
                    "type": ["boolean", "null"]
                  },
                  "year_from": {
                    "description": "Earliest shot year (1930–1989)",
                    "format": "int32",
                    "type": ["integer", "null"]
                  },
                  "year_to": {
                    "description": "Latest shot year (1930–1989)",
                    "format": "int32",
                    "type": ["integer", "null"]
                  }
                },
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "customer_email": {
                "description": "Buyer's work email at their organization's own domain, used for the order, invoice, and delivery; ask the user, never invent one. Consumer and disposable mailboxes (Gmail, Outlook, iCloud, Proton, etc.) are refused.",
                "type": "string"
              },
              "customer_org": {
                "description": "Buyer organization name",
                "type": ["string", "null"]
              },
              "filters": {
                "anyOf": [
                  {
                    "$ref": "#/$defs/DatasetFilters"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "intended_use": {
                "description": "What the buyer intends to train or evaluate with the data (10–2000 characters). Shown to the person who approves the order.",
                "type": "string"
              },
              "media_resolution": {
                "description": "proxy (default) or 4k",
                "type": ["string", "null"]
              },
              "tier": {
                "description": "evaluation, research, or commercial",
                "type": "string"
              }
            },
            "required": ["customer_email", "intended_use", "tier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
