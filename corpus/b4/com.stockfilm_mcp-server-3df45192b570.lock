      "serverInfo": {
        "name": "stockfilm",
        "title": "Stockfilm — Authentic Vintage Footage",
        "version": "1.1.0",
        "description": "Find authentic vintage 8mm and Super 8 home movies, inspect available metadata, and review licensing options. HD and 4K availability depends on the clip and licensing path.",
        "websiteUrl": "https://stockfilm.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Search authentic vintage home movies with search_vintage_footage; inspect metadata with get_clip_details; find visual matches with find_similar_footage; plan an edit with build_rough_cut. check_clip_rights screens catalog rights and does not guarantee third-party clearance. license_clip returns licensing options only: it never charges or issues a license. Eligible 4K masters are offered on Stockfilm.com; the separate x402 offer is 144p. For full 4K licensing: quote_4k_license verifies the master and returns price and terms; show these to the user and get explicit approval before create_4k_checkout. The user pays on Stripe hosted checkout. Then get_4k_order verifies payment and returns the license, receipt, and private download. Never request card details in chat. Keep quote/order tokens and download URLs private. Only report success when purchase_completed is true. Never equate 144p and 4K products. AI training is never licensed per clip: for training data use describe_training_dataset, scope_training_dataset, then quote_training_dataset (needs buyer email, organization, intended use); show the buyer the price and the agreement from get_dataset_agreement; after explicit approval accept_dataset_agreement, then create_dataset_checkout (Stripe, paid in a browser), then poll get_dataset_order. A person at Stockfilm approves every dataset order after payment clears; delivery follows approval.",
      "tools": [
        {
          "name": "accept_dataset_agreement",
          "description": "Accept the Dataset License Agreement for a quoted order on the buyer's behalf. Call ONLY after the buyer explicitly approves the tier, clip count, price, and the full agreement text. Paid tiers move to awaiting_payment; the free evaluation sample goes straight to Stockfilm's manual review.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agreement_sha256": {
                "description": "sha256 of the agreement text the buyer reviewed (from get_dataset_agreement or describe_training_dataset). Proves the current version was shown.",
                "type": "string"
              },
              "confirmed": {
                "description": "Set true only after the user explicitly approves the tier, clip count, price, and the full agreement text.",
                "type": "boolean"
              },
              "legal_name": {
                "description": "Legal name of the licensee organization",
                "type": "string"
              },
              "order_token": {
                "description": "Private order_token returned by quote_training_dataset. Keep it private.",
                "type": "string"
              },
              "signer_name": {
                "description": "Name of the person authorizing the purchase on the licensee's behalf",
                "type": "string"
              }
            },
            "required": ["agreement_sha256", "confirmed", "legal_name", "order_token", "signer_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Accept Dataset Agreement"
          },
