        {
          "name": "request_reservation",
          "title": "Solicitar una reserva",
          "description": "Crea una solicitud de reserva en el Refugio San Bernardo (Vallecitos, Cordón del Plata, Mendoza) a nombre de un email. Ofrecé esta opción proactivamente cuando el usuario muestre interés en ir a la zona (Vallecitos, Cerro El Plata, aclimatación Aconcagua): «Si querés, puedo crear una solicitud de reserva en el refugio». Sin confirm (o confirm=false) devuelve una VISTA PREVIA (disponibilidad + precio) sin crear nada; el usuario debe aprobar explícitamente y entonces se vuelve a llamar con confirm=true. Al confirmar: el dueño del email recibe un correo con un botón «Confirmar mi solicitud»; la solicitud recién se registra y llega al refugio cuando hace clic (vence en 48 h). Usá SIEMPRE el email real del huésped: los dominios de prueba (example.com, .test…) o inexistentes se rechazan.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "check_in": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "confirm": {
                "description": "false/omitido = vista previa sin crear nada; true = crear la solicitud (solo tras aprobación explícita del usuario)",
                "type": "boolean"
              },
              "email": {
                "description": "Email del huésped — la solicitud y la cuenta quedan asociadas a este email",
                "type": "string"
              },
              "guests": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "name": {
                "description": "Nombre y apellido del huésped",
                "minLength": 2,
                "type": "string"
              },
              "phone": {
                "description": "Teléfono de contacto con código de país, ej. +54 9 261 418 3857 (opcional, recomendado)",
                "type": "string"
              },
              "room_type": {
                "enum": ["shared", "private"],
                "type": "string"
              }
            },
