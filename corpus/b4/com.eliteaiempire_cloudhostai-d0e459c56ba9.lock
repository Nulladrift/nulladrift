      "instructions": "Deploy Git repos to your own Hetzner account. Read tools need a \"read\" key, write tools a \"write\" key; deploy/destroy/delete need confirm=true. cloudhosting_preview_deploy and cloudhosting_get_pricing need no key.",
      "tools": [
