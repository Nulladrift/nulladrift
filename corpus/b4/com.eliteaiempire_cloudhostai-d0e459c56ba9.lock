          "name": "cloudhosting_create_project",
          "description": "Register a project (repo + server size). Creates no server. [scope: write]",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "branch": {
                "default": "main",
                "type": "string"
              },
              "custom_domain": {
                "type": "string"
              },
              "location": {
                "default": "fsn1",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "repo_url": {
                "description": "Public Git https URL with a Dockerfile.",
                "type": "string"
              },
              "server_type": {
                "default": "cpx11",
                "type": "string"
              }
            },
            "required": ["name", "repo_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
