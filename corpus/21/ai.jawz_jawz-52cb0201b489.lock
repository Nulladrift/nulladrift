        {
          "name": "get_drift_alerts",
          "title": "Get drift alerts",
          "description": "Portfolio-wide drift scan. Iterates Decision Records, calls score_position_drift on each, returns flagged positions with severity + why_flagged + review_questions. Flag types: drift_severe (review_now), drift_meaningful (deteriorated), fit_low_structural (score ≤2 but unchanged since entry — low by design, not decay), fit_low_decayed (score ≤2 AND below entry fit — deteriorated after entry), conviction_gap (|gap| ≥3), thesis_undocumented (entry_date or thesis missing). Backs Chapter 4 Mode 4.3 (Thesis Status Sweep) as the portfolio-wide drift scan; flagged names feed a Mode 4.2 (Position Retrospective).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "portfolio": {
                "description": "Array of Decision Records — one per position the user wants scanned",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "asset_class": {
                      "enum": ["equities-growth", "equities-quality", "equities-cyclical", "equities-defensive", "bonds-long-duration", "bonds-short-duration", "credit-high-yield", "commodities-broad", "gold", "btc-beta", "eth-beta", "crypto-speculative", "crypto-beta", "cash"],
                      "type": "string"
                    },
                    "conviction": {
                      "maximum": 10,
                      "minimum": 1,
                      "type": "number"
                    },
                    "entry_date": {
                      "description": "Missing entry_date flags the position as thesis_undocumented",
                      "type": "string"
                    },
                    "symbol": {
                      "type": "string"
                    },
                    "symbol_type": {
                      "enum": ["crypto", "stock", "etf"],
                      "type": "string"
                    },
                    "thesis": {
                      "description": "Missing thesis flags the position as thesis_undocumented",
                      "type": "string"
                    }
                  },
                  "required": ["asset_class", "symbol"],
                  "type": "object"
                },
                "type": "array"
