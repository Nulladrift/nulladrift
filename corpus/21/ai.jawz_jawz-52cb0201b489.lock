        {
          "name": "get_conditions_history",
          "title": "Get conditions history",
          "description": "Financial-conditions read-history — a timeseries of how conditions have moved over recent weeks. Returns one row per sample date with the composite (loose/neutral/tight), direction (easing/stable/tightening), and every pillar's value + class: 10Y real yield, HY/IG credit spreads, DXY, VIX, global-liquidity class. The rate legs behind the real yield are exposed numerically too (dgs10_pct, t10yie_pct, t5yie_pct, t10y2y_pct), so a real-yield move can be read as nominal-led or breakeven-led rather than only as a fused number. Completes the Chapter 1 history trio with get_regime_history (the judgment) and get_liquidity_history (the flow) — this is the price of risk. Surfaces trajectory that a point read hides (e.g. HY spreads widening for six straight weeks while VIX stays calm), and grounds 'conditions are tightening' statements in observed pillar changes. Window deltas per pillar are in 'summary.deltas'; composite/direction/pillar classification changes are listed as events. The response includes a 'presentation' object whose 'display_markdown' is a pre-formatted table; 'data.rows' and 'summary' carry the same values structured. Rows are provenance-tagged 'observed' (live that day, true vintage) or 'reconstructed' (point-in-time from vintage data — each series as it was published on that date, ~4 months deep). Defaults to the last 12 weeks, weekly. get_indicator_history covers any card or row of get_dashboard over a year, at its own print dates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "interval": {
                "description": "Sample cadence (default weekly)",
                "enum": ["weekly", "monthly"],
                "type": "string"
