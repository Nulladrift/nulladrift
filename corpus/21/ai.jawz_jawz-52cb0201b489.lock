        {
          "name": "score_position_drift",
          "title": "Score position drift",
          "description": "Score how a single position's regime fit has drifted since entry. Returns regime_at_entry, regime_now, fit_score_at_entry, fit_score_now, drift_score (now - entry), drift_label (improved/stable/deteriorated/review_now), explanation, and review_questions. No buy/sell recommendation — output is observational. Supports Chapter 4 Mode 4.2 (Position Retrospective) for single-name regime-fit review and Mode 4.3 (Thesis Status Sweep) for per-position drift across the book.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "asset_class": {
                "description": "Asset class for fit-score lookup, drawn from the holding's actual exposure (Chapter 2 Mode 2.1) rather than from the current regime. A hybrid holding is scored per sleeve and weight-blended. Drives the regime-fit calculation.",
                "enum": ["equities-growth", "equities-quality", "equities-cyclical", "equities-defensive", "bonds-long-duration", "bonds-short-duration", "credit-high-yield", "commodities-broad", "gold", "btc-beta", "eth-beta", "crypto-speculative", "crypto-beta", "cash"],
                "type": "string"
              },
              "conviction": {
                "description": "User-supplied conviction 1–10. Drives conviction_gap if a meaningful gap exists vs the regime fit score.",
                "maximum": 10,
                "minimum": 1,
                "type": "number"
              },
              "entry_date": {
                "description": "ISO date (YYYY-MM-DD) when the position was opened",
                "type": "string"
              },
              "symbol": {
                "description": "Ticker or instrument (e.g. AAPL, BTC, TLT)",
                "type": "string"
              },
              "symbol_type": {
                "description": "Price-API hint. Inferred from asset_class if omitted.",
                "enum": ["crypto", "stock", "etf"],
                "type": "string"
              },
              "thesis": {
                "description": "Original thesis text. Echoed back word-for-word in review questions.",
