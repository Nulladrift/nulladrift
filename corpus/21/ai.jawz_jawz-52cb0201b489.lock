        {
          "name": "get_liquidity_history",
          "title": "Get liquidity history",
          "description": "Global-liquidity read-history — a timeseries of central-bank liquidity over recent weeks. Returns one row per sample date with the full decomposition (Fed / ECB / BoJ / PBoC in USD trillions), the active basis (g4/g3/us_fallback), the supportive/neutral/draining classification of that week's read, and US net liquidity (us_net_t: Fed balance sheet minus the Treasury General Account minus reverse repo, USD trillions) with its own classification (us_net_class), plus coverage (basis) changes, China-leg publication steps, and classification changes as events. The held money condition, which changes only after two consecutive weekly reads agree, is in get_macro_regime and the Money card of get_dashboard. History companion to get_financial_conditions (Chapter 1 Mode 1.5 Global Liquidity Read). Reading note, enforced by the artifact: when the basis flips g4↔g3 (China PBoC publication freshness), the headline total moves by the ~$7T China component, which is a coverage change rather than a liquidity move. The window trend is therefore computed on constant G3 basis, and every basis flip is listed with an explicit note. A China-leg publication step is a DIFFERENT event and is reported separately: PBoC publishes monthly ~15 days in arrears, so on the day a new statement is recorded the PBoC leg absorbs a whole month of balance-sheet change (plus FX) in one step — real change, but not change that happened on that date, and not the same thing as a coverage flip. The response includes a 'presentation' object whose 'display_markdown' is a pre-formatted table; 'data.rows' and 'summary' carry the same values structured. Rows are provenance-tagged 'observed' (live that day, true vintage) or 'reconstructed' (point-in-time from vintage data — each series as it was published on that date, ~4 months deep). Defaults to the last 12 weeks, weekly. get_indicator_history covers any card or row of get_dashboard over a year, at its own print dates.",
