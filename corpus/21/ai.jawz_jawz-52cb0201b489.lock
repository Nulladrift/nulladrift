        {
          "name": "get_weekly_data_releases",
          "title": "Get weekly data releases",
          "description": "Past week's data releases with H.4.1 net liquidity update. Anchored to Friday — most current when run Friday morning or later. Each release classifies actual vs consensus where BOTH are on file (both Mako-curated): `surprise` is hot / modestly hot / in-line / modestly cool / cool on the headline metric, `vs_consensus` is the same comparison stated neutrally as above/below/in-line, and `metrics` breaks it down per metric. hot/cool is DIRECTIONAL versus consensus, not a verdict — a hot CPI and a hot payrolls print mean opposite things for the same book. `surprise: \"n/a\"` means the comparison could not be made; `implication` names which half is missing. consensus_provenance.age_days is measured at week_ending, not at call time, so re-asking for an earlier week returns the same age it did the first time.",
