        {
          "name": "get_prices",
          "title": "Get prices",
          "description": "Live prices for one or more holdings, and the answer shows its work. Resolves raw tickers (stocks, ETFs, crypto, international listings) and returns price, value, and day change per symbol, plus per holding: what it resolved to (asset: type, exchange, ISIN, provider id; asset.isin is filled when you pass an isin hint or the provider profile carries one, and is null otherwise — it is not looked up), how surely (resolution: matched_by isin|qualified_symbol|bare_symbol, candidates, mismatch against the caller's hints), the native quote with its own time (quote), the FX rate actually applied, dated and sourced (fx), and the position value native and in the base currency. Optional per-holding hints — isin (equities/ETFs/funds), exchange, asset_class — narrow resolution; a hint that contradicts the result is reported, not silently overridden. A bare ticker is resolved listing first: when the same symbol is both a US listing and a crypto token that is not a known major coin (HOOD, MSTR, and tokenized-stock proxies such as ALAB, LITE, NBIS), it prices the listing, never the token; the token is priced only when no such listing exists. A known major coin that shares its symbol with a well-known US listing (STX is Stacks and Seagate) stays the coin, with a line warning that names the listing and how to get it (qualify it, or asset_class 'equity'). A bare ticker shared by differently named funds on other venues (DRAM) is priced with a line warning naming the alternatives and their qualified symbols, counted in resolution.candidates. Qualifying as NASDAQ:X / X.US picks the US listing explicitly. Line warnings are in each holding's warning; a summary is in the top-level warnings. base_currency defaults to USD; 'native' returns unconverted quotes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "base_currency": {
                "description": "Currency for price, value and totalValue. Omit for USD (default). 'native' or null: no conversion — each line is stated in its quote currency and fx is null.",
                "type": ["string", "null"]
              },
              "holdings": {
                "description": "Portfolio holdings to analyze",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "asset_class": {
                      "description": "Optional. 'equity' | 'etf' | 'fund' force the listed-instrument path; 'crypto' forces the token path. Reported as resolution.mismatch when the result disagrees.",
                      "enum": ["equity", "etf", "fund", "crypto", "commodity", "other"],
                      "type": "string"
                    },
                    "exchange": {
                      "description": "Optional exchange hint — NASDAQ, NYSE, NYSEARCA, XETRA, OSL, MIL, LSE, PAR, AMS, SWX, HKG, TSX, ASX. Narrows a bare symbol to a venue; a non-US venue prices the local listing.",
                      "type": "string"
                    },
                    "isin": {
                      "description": "Optional ISIN (equities, ETFs, funds — crypto has none). When present, resolution goes by ISIN first; the exchange hint picks the listing when the ISIN trades on several.",
                      "type": "string"
