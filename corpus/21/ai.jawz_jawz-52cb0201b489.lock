        {
          "name": "get_regime_history",
          "title": "Get regime history",
          "description": "Macro regime read-history — a timeseries of how the regime and its drivers have moved over recent weeks. Returns one row per sample date (regime color, business-cycle quadrant, growth + inflation class, consumer sentiment, global liquidity, dominant risk, confidence) plus the transitions between them (e.g. SUMMER → FALL). Provides the observed history behind a 'what changed since …' question, rather than a comparison of two separate point reads. Rule changes that moved the published colour or season without the market moving are listed in data.events as method events (kind 'method'), each dated the first day the new rule was live, with what changed and why: for example the money condition waiting for two consecutive weekly reads (2026-09-25) and the growth vote with two prints to change the season (2026-09-30). Observed rows keep what Jawz published that day under the rules then in force. Reading note, enforced by the artifact: the Liquidity column steps for two reasons that are NOT the market, and both are listed as first-class events in summary.liquidity_events — a g4↔g3 coverage flip (the whole PBoC component entering or leaving the sum: not a liquidity move at all), and a China-leg publication step (PBoC publishes monthly ~15d in arrears, so the day a new statement is recorded the column absorbs a whole month of change: real change, wrong date). get_liquidity_history carries a constant-basis G3 series that is immune to both. The response includes a 'presentation' object whose 'display_markdown' is a pre-formatted table; 'data.rows' and 'summary' carry the same values structured. Each row is provenance-tagged: 'observed' (captured live that day — true vintage) or 'reconstructed' (computed point-in-time from vintage data — each series as it was published on that date, so later revisions are excluded; depth-limited). Defaults to the last 12 weeks, weekly. get_indicator_history covers any card or row of get_dashboard over a year, at its own print dates.",
