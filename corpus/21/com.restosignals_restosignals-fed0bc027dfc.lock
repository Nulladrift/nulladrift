{
  "lockfileVersion": 2,
  "subjects": {
    "com.restosignals/restosignals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.restosignals.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "restosignals",
        "title": "RestoSignals: restaurant opening leads",
        "version": "0.2.0",
        "websiteUrl": "https://restosignals.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RestoSignals finds US restaurants, bars and cafes 1-6 months BEFORE they open, by fusing public liquor-license applications, food permits and new-business filings into one scored venue (opening_score 0-100). Call `coverage` first (free, no key needed) to see live states, then `new_openings` for a state (1 credit per returned lead). `venue_signals` shows the raw filings behind a venue; `watch_area` registers a webhook for new matches (paid accounts). Subscribers also get owner contact from the filings: owner name on nearly every lead, phone for many NYC venues, owner mailing address for most Texas venues. Never invent venues for states not in coverage. Authenticate via OAuth (this server is its own OAuth 2.1 provider) or with 'Authorization: Bearer pk_<key>'; a free trial key is one POST to /v1/register. When credits run out, send the user to https://restosignals.com/pricing/",
      "tools": [
        {
          "name": "coverage",
          "description": "List the states RestoSignals currently has data for and how many scored venues each holds (with a count of hot leads, opening_score >= 80). Call this FIRST to see live inventory before new_openings — querying a state with no data returns nothing. Free (0 credits) and needs no API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3dd32ce2705b13e6c0ff5343527890c58fdd1ae670176b9d205483374344b080"
        },
        {
          "name": "new_openings",
          "description": "Find restaurants/bars about to open in a state, ranked by opening_score (0-100). Fuses liquor licenses, food permits and new-business filings into one scored venue. signal_types on each lead are 'liquor', 'food_permit' and 'business'. Live states: NY, TX, IL, OR, CO, WA, CA (call `coverage` for the current list). 1 credit per returned lead. Each lead has a `contact` block: subscribers get the owner name from the filing plus phone (many NYC venues) and owner mailing address (most TX venues) where public records carry them; trial keys see contact.locked with contact.available telling whether details exist.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Max leads to return (<=100). Each lead costs 1 credit.",
                "type": "integer"
              },
              "min_score": {
                "default": 30,
                "description": "Minimum opening_score (0-100). Fused multi-signal venues rank highest; 30 includes recent issued-liquor leads, 80+ is a hot multi-signal lead.",
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state, e.g. NY, TX, IL, OR, CO, WA, CA. Use `coverage` to see live states.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cc16e19b69cb2af6763dbacf0b54c0119921fe259ef9a230e3efa23d429b6956"
        },
        {
          "name": "venue_signals",
          "description": "Return the raw underlying signals (liquor/permit/business filings) that were fused into one venue, for transparency. 1 credit.",
          "inputSchema": {
            "properties": {
              "venue_id": {
                "description": "A venue id from new_openings.",
                "type": "integer"
              }
            },
            "required": ["venue_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb5304472cce5a3a76b95c1342b2fd919ff493dbe05c4fdfc6f6b6e853064568"
        },
        {
          "name": "watch_area",
          "description": "Register a webhook that fires when a new matching venue opens in an area. criteria = {state, city, signal_type, min_opening_score}. Free.",
          "inputSchema": {
            "properties": {
              "criteria": {
                "description": "{state, city, signal_type, min_opening_score}.",
                "type": "object"
              },
              "url": {
                "description": "HTTPS endpoint to POST matching venues to.",
                "type": "string"
              }
            },
            "required": ["criteria", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f535eb7e157fc446b030622894aa8b5226c46dc6e9bc156e23a1dc22bf9ebb26"
        }
      ],
      "digest": "sha256:ac42392a125e2118302248c1549030959c8f6aa2ca3164606abf73a43cbd2179"
    }
  }
}
