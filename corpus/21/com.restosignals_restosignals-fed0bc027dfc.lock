{
  "lockfileVersion": 2,
  "subjects": {
    "com.restosignals/restosignals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.restosignals.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "restosignals",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "coverage",
          "description": "List the states RestoSignals currently has data for and how many scored venues each holds (with a count of hot leads, opening_score >= 80). Call this FIRST to see live inventory before new_openings — querying a state with no data returns nothing. Free (0 credits).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:740dd1492dc67f01c2bf00bb4f66550ba4fb59fd7726ce63ff014499555f1ae5"
        },
        {
          "name": "new_openings",
          "description": "Find restaurants/bars about to open in a state, ranked by opening_score (0-100). Fuses liquor licenses, food permits and new-business filings into one scored venue. signal_types on each lead are 'liquor', 'food_permit' and 'business'. Live states: NY, TX, IL, OR, CO, WA, CA (call `coverage` for the current list). 1 credit per returned lead.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Max leads to return (<=100). Each lead costs 1 credit.",
                "type": "integer"
              },
              "min_score": {
                "default": 30,
                "description": "Minimum opening_score (0-100). Fused multi-signal venues rank highest; 30 includes recent issued-liquor leads, 80+ is a hot multi-signal lead.",
                "type": "integer"
              },
              "state": {
                "description": "Two-letter state, e.g. NY, TX, IL, OR, CO, WA, CA. Use `coverage` to see live states.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a4c5128a1245784e2edc480e6eb1598030c35dca7744e7e3910c3bcc6861d69"
        },
        {
          "name": "venue_signals",
          "description": "Return the raw underlying signals (liquor/permit/business filings) that were fused into one venue, for transparency. 1 credit.",
          "inputSchema": {
            "properties": {
              "venue_id": {
                "description": "A venue id from new_openings.",
                "type": "integer"
              }
            },
            "required": ["venue_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb5304472cce5a3a76b95c1342b2fd919ff493dbe05c4fdfc6f6b6e853064568"
        },
        {
          "name": "watch_area",
          "description": "Register a webhook that fires when a new matching venue opens in an area. criteria = {state, city, signal_type, min_opening_score}. Free.",
          "inputSchema": {
            "properties": {
              "criteria": {
                "description": "{state, city, signal_type, min_opening_score}.",
                "type": "object"
              },
              "url": {
                "description": "HTTPS endpoint to POST matching venues to.",
                "type": "string"
              }
            },
            "required": ["criteria", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f535eb7e157fc446b030622894aa8b5226c46dc6e9bc156e23a1dc22bf9ebb26"
        }
      ],
      "digest": "sha256:e6e709e4fdcf9e441eb4c9c6892f8cd92b22d1058f4e2c9e9c59d134446d84d0"
    }
  }
}
