      "instructions": "Use generate_landing_page to create a complete, responsive single-file HTML landing page for a small business from its name and a few details (free, deterministic template, nothing stored). Use get_service_info when the user wants a custom landing page written, designed and published for them in 24 hours. Use list_paid_apis to discover the pay-per-call x402 HTTP APIs (Argentina dolar blue/MEP/CCL quotes, FX rates, Argentine CUIT/CBU validators and phone normalizer, web audit). The same data is also available as paid MCP tools (ar_dolar, ar_inflacion, ar_feriados, ar_cuit, ar_cbu, ar_phone, fx_rate, web_audit; 0.002-0.02 USDC per call): an unpaid call returns an x402 payment-required result; retry with the signed payment in params._meta[\"x402/payment\"].",
      "tools": [
        {
          "name": "ar_cbu",
          "title": "Validate Argentine CBU/CVU",
          "description": "Validate an Argentine bank account number (CBU) or virtual account (CVU): checks both check digits offline and returns type, entity/branch codes, bank name for major banks and a formatted value. Send {cbu}. Nothing is stored. Paid tool: 0.01 USDC per call via x402 (USDC on Base, Polygon or Solana, no account or key). An unpaid call returns a payment-required result (isError, structuredContent with x402Version 2 and accepts); sign one of the accepts and retry the same call with the PaymentPayload in params._meta[\"x402/payment\"]. Returns JSON text; the settlement is in result._meta[\"x402/payment-response\"].",
          "inputSchema": {
            "properties": {
              "cbu": {
                "description": "22-digit CBU or CVU",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["cbu"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Validate Argentine CBU/CVU"
