{
  "lockfileVersion": 2,
  "subjects": {
    "com.bonissystems/sstv-decoder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bonissystems.com/api/knox/agents/sstv-decoder/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "sstv-decoder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Bonis SSTV Decoder — demodulate a presented slow-scan-television audio recording, anchor the audio fingerprint and decoded image hash to the Knox event chain, and receive a receipt bundle (Knox anchor + C2PA-aligned envelope + FRE 902(13)/(14)-shape affidavit). Bitcoin-rolled via OpenTimestamps. Look up any receipt at bonissystems.com. Phase 1 supports Martin M1 (VIS code 0x2C, 320×256 RGB).",
      "tools": [
        {
          "name": "decode_sstv",
          "description": "Demodulate a presented slow-scan-television (SSTV) audio recording, anchor the audio fingerprint and the decoded image hash to the Knox event chain, and return a receipt bundle (Knox anchor + C2PA-aligned envelope + FRE 902(13)/(14)-shape affidavit). Audio bytes are NOT retained — only the SHA-256 fingerprint and the decoded image are anchored. Bonis Systems does not capture audio on its own; the audio must be presented by the caller (a public WebSDR recording, a customer-controlled SDR capture they consent to submit, or audio they own). Phase 1 supports Martin M1 (VIS code 0x2C, 320×256 RGB). Other VIS codes return mode = 'unsupported' with detected hex. Requires a Knox Bearer API key on the Authorization header — unauthenticated calls are rejected.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "audioBase64": {
                "description": "Base64-encoded audio. Either a complete WAV file (RIFF/WAVE, 8/16/24-bit PCM or 32-bit IEEE float, mono or stereo, 4-192 kHz) or raw 16-bit signed little-endian mono PCM samples.",
                "type": "string"
              },
              "audioFormat": {
                "description": "Audio container ('wav' default, or 'pcm16-mono').",
                "enum": ["wav", "pcm16-mono"],
                "type": "string"
              },
              "capture": {
                "description": "Optional capture-context metadata.",
                "properties": {
                  "callsignClaim": {
                    "description": "Transmitting callsign claim. Recorded as a claim only — the agent does not verify callsign-to-operator binding.",
                    "type": "string"
                  },
                  "capturedAt": {
                    "description": "ISO timestamp when the audio was captured.",
                    "type": "string"
                  },
                  "operatorClaim": {
                    "description": "Claim about who operated the receiver.",
                    "type": "string"
                  },
                  "sourceUrl": {
                    "description": "Audio source URL. Hashed before anchoring; the raw URL is not committed.",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "name": {
                "description": "Display name for the recording (max 256 chars).",
                "type": "string"
              },
              "sampleRate": {
                "description": "Required when audioFormat = 'pcm16-mono'.",
                "maximum": 192000,
                "minimum": 4000,
                "type": "integer"
              }
            },
            "required": ["audioBase64", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:61300a38496c7429d11b5d94ef593ec6370af40e7c79d0123e1d3a026e9cab2c"
        },
        {
          "name": "verify_sstv_decode",
          "description": "Verify a previously anchored SSTV-decode record. Given a SHA-256 anchor hash (the payload_hash from a prior decode_sstv call), return the anchor record, predecessor hash, sequence number, and timestamp. Public — no authentication required. The verification path itself is also accessible at GET /api/knox/verify?hash=<hash>.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hash": {
                "description": "SHA-256 anchor hash (64 lowercase hex chars).",
                "pattern": "^[a-fA-F0-9]{64}$",
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:66a25c61f721a362d498443827eacb7e98fde4a7296bc9b9cc7ed7f7c8fb33ac"
        }
      ],
      "digest": "sha256:a5b1ff76a5b0792a2e09916b00a8df0fcfe4da453fda28649b62498eaa607341"
    }
  }
}
