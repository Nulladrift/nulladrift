{
  "lockfileVersion": 2,
  "subjects": {
    "com.answerkb/kb": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://answerkb.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agent-kb",
        "title": "AnswerKB",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public knowledge base named AnswerKB. Browse with list_sections and list_questions (no query required), or search_questions then get_answer with the returned id. Use submit_feedback to suggest improvements, and get_feedback_status to check a submission by id. Entries are reviewed before they appear publicly.",
      "tools": [
        {
          "name": "get_answer",
          "description": "Fetch the full answer for one knowledge-base question by id, exact question text, or path. Use an id from search_questions when possible. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Stable page id, e.g. edu-1-math-how-do-you-add-two-numbers",
                "type": "string"
              },
              "path": {
                "description": "Site path or URL for the question, e.g. /education/1/math/how-do-you-add-two-numbers/",
                "type": "string"
              },
              "question": {
                "description": "Exact question or a known alternate phrasing",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6fc1d825896b9e4db63e5a4d852c7de4639c4d3681e1f946875a9b1eddd75618"
        },
        {
          "name": "get_feedback_status",
          "description": "Check the review status of a feedback item previously returned by submit_feedback. Pass the feedback id (starts with fb_). Returns whether the item is pending, approved, or rejected. Does not expose private reviewer or visitor fields. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Feedback id returned by submit_feedback, e.g. fb_...",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7ac33ac5b4b98ca7619af5d776bdc8a1c76731f82b04ed7fd87ccc050b2c45e9"
        },
        {
          "name": "list_questions",
          "description": "Browse question pages in this knowledge base without a search query. Filter by section (education, how-to, science, geography, popular, 2026, markets, news), grade (for education pages, e.g. '1' or 'k'), subject (e.g. 'math'), or category (e.g. 'units', 'money', 'physics', 'capitals', a markets topic such as 'fed-funds-rate', or a news topic such as 'us'). Results are paginated. Use list_sections first to see available filters and counts. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category, e.g. 'units', 'money', 'cooking', 'physics', 'capitals', 'fed-funds-rate', or 'us'",
                "type": "string"
              },
              "grade": {
                "description": "Optional education grade, e.g. '1', '8', 'k', or 'college'",
                "type": "string"
              },
              "limit": {
                "description": "Page size (default 25, max 50)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Number of matching items to skip (default 0)",
                "minimum": 0,
                "type": "integer"
              },
              "section": {
                "description": "Optional section slug, e.g. 'education', 'how-to', 'science', 'geography', 'popular', '2026', 'markets', or 'news'",
                "type": "string"
              },
              "subject": {
                "description": "Optional education subject, e.g. 'math'",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:011e6a0cd0182a9a21ff857b039ab1d2c454196a93b6aa1606ea822a5a2c2109"
        },
        {
          "name": "list_sections",
          "description": "Return the knowledge-base taxonomy with page counts: sections, grades, subjects, and categories. Use this to browse available entries before calling list_questions. No input required. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3996184cdbb1881b5c789d63ac0962eda79a8f38b87426983186b631c9b1cfaa"
        },
        {
          "name": "search_questions",
          "description": "Search this public knowledge base of short, accurate math, how-to, science, geography, popular-question, official 2026-numbers, official US economic-data, and news-brief answers. Use when the user asks a question that might already have a page here, including current Fed funds, Treasury yields, CPI, unemployment, gas prices, mortgage rates, or the latest US, world, China, business, tech, health, science, pop culture, or sports news. Returns matching question ids, titles, short answers, and URLs. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Maximum hits to return (default 8)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural-language question or keywords, e.g. 'how do I add fractions' or '2 + 3'",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0267b8771f2dff613079942cbf27dddc7e479b084869315cdc5255d5d489bc5"
        },
        {
          "name": "submit_feedback",
          "description": "Leave a suggestion about how to make this knowledge base more useful or accessible to AI agents. Use for missing content, errors, format issues, accessibility, praise, or other suggestions. Submissions are reviewed before they appear on the public board. Do not include off-site links in the message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Optional name of the calling agent or client",
                "type": "string"
              },
              "agent_url": {
                "description": "Optional http(s) URL for the calling agent",
                "type": "string"
              },
              "category": {
                "description": "Kind of feedback",
                "enum": ["accessibility", "missing-content", "error", "format", "suggestion", "praise"],
                "type": "string"
              },
              "message": {
                "description": "The suggestion or comment, at most 2000 characters. No off-site links.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "page": {
                "description": "Optional site path or URL on this knowledge base that the feedback is about",
                "type": "string"
              }
            },
            "required": ["category", "message"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:129c17e9821b89237e472116ffd7a066dd8e17985a3eb1f025c09fa819b8b323"
        }
      ],
      "digest": "sha256:7989599e58e1c9ccc328620ca718e07736fdffd7e9485049af0421bd9b8bbd10"
    }
  }
}
