  "subjects": {
    "com.measuredsize/fit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.measuredsize.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "com.measuredsize/fit",
        "title": "Measured Size",
        "version": "1.1.0",
        "description": "Bra sizes from measurements, in each brand's own labels, with the confidence behind each.",
        "websiteUrl": "https://measuredsize.com/how-it-works.html"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Measured Size sizes bras from two measurements (underbust and bust) and translates the size into each brand's own labels. Every size it returns comes with a badge (Best Match, Strong Match, Good Match or Fair Match) and a reason. Always tell the shopper the badge with the size, and never present a Good Match or Fair Match size as certain. Asked with no listing, no size here is Best Match: stock is checked on each listing. Between two of a brand's sizes it picks one and says why; pass on that size, its badge and the reason. When it refuses (Not carried here, Not on their chart, Outside standard sizes), say so and give its reason, with the closest size it names; do not substitute a size of your own. Prefer measurements: a size translated from another brand's label is rated no higher than Good Match. It does not judge shape, style or fit preference, and a listing's own chart can differ; the answers are for a brand in general. How it works: https://measuredsize.com/how-it-works.html",
      "tools": [
        {
          "name": "bra_size_at_brand",
          "title": "Bra size at a brand",
          "description": "Her size at one brand, in that brand's own labels (for example 32E at a UK-lettered brand where her US size is 32DDD), for its band and cup bras and for its letter-sized styles, each with a confidence badge and a reason. Use this when a shopper names a brand. If the brand doesn't carry her size, the answer says so and why (for example its bands start at 34, or its cups stop at DD) and names the closest size it makes (closest_made); pass that on rather than guessing. Use list_bra_brands if the brand isn't found.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "A brand name as shoppers write it (aliases accepted, any case), or an id from the brand list.",
                "examples": ["Wacoal"],
                "type": "string"
              },
              "bust": {
                "description": "Around the fullest part of the bust, the tape flat and not pressing in. Decimals allowed.",
                "examples": [38],
                "type": "number"
              },
              "underbust": {
                "description": "Snug around the ribcage, just under the bust, after breathing out. Decimals allowed.",
                "examples": [32],
                "type": "number"
              },
              "unit": {
                "default": "in",
                "description": "The unit both measurements are in: inches (in) or centimeters (cm).",
                "enum": ["in", "cm"],
                "type": "string"
              }
            },
            "required": ["brand", "bust", "underbust"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bra size at a brand"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:143ea4814c7a87e89047c83f24b61353d05819196b58969d923e10c927467788"
        },
        {
          "name": "bra_size_from_measurements",
          "title": "Bra size from measurements",
          "description": "Her bra size from her underbust and bust measurements (inches or cm, decimals allowed): her base US size, sister sizes one band each way, the UK size, EU and French sizes where their tables give the whole size, and the usual letter size (S/M/L). Use this when a shopper gives her measurements and wants her size in general. The answer includes a confidence badge and a reason: pass both on with the size. If the measurements are refused, tell her the reason given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bust": {
                "description": "Around the fullest part of the bust, the tape flat and not pressing in. Decimals allowed.",
                "examples": [38],
                "type": "number"
              },
              "underbust": {
                "description": "Snug around the ribcage, just under the bust, after breathing out. Decimals allowed.",
                "examples": [32],
                "type": "number"
              },
              "unit": {
                "default": "in",
                "description": "The unit both measurements are in: inches (in) or centimeters (cm).",
                "enum": ["in", "cm"],
                "type": "string"
              }
            },
            "required": ["bust", "underbust"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bra size from measurements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f3239a327f38e535c7d5d2734c23ec506506e81ef2440964f1008468c88c6ba"
        },
        {
          "name": "list_bra_brands",
          "title": "Brands Measured Size knows",
          "description": "The brands Measured Size has researched, with their other names, whether they sell band and cup sizes or letter sizes, their cup letters, band and cup ranges, whether their own letter chart is on file, and when their record was last researched. Use it to find a brand's name before the other tools, or to say which brands are covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "q": {
                "description": "Optional: only brands whose name or an alias contains this text.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Brands Measured Size knows"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:25365ac8b42f569f28c55c5fe3769e14b54365aeab1ad481f021f5dd0a5b5a94"
        },
        {
          "name": "translate_bra_size",
          "title": "Translate a bra size between brands",
          "description": "Translate a band and cup size she wears at one brand (for example 34DD at Wacoal) into another brand's label, through Measured Size's base size. Use this only when the shopper has no measurements; measurements give a better answer. Translated sizes are rated no higher than Good Match: tell her so. If the second brand doesn't make the size, the answer says so and why and names the closest size it makes (closest_made); pass that on rather than guessing. It refuses letter sizes (S/M/L), labels the first brand's record doesn't give, and brands that sell letter sizes only, with the reason.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_brand": {
                "description": "The brand whose size she knows.",
                "examples": ["Wacoal"],
                "type": "string"
              },
              "size": {
                "description": "Her band and cup size at from_brand, as that brand labels it.",
                "examples": ["34DD"],
                "type": "string"
              },
              "to_brand": {
                "description": "The brand to translate the size into.",
                "examples": ["Curvy Kate"],
                "type": "string"
              }
            },
            "required": ["from_brand", "size", "to_brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Translate a bra size between brands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4fc197460ede81a22af98d8268f54f9a406bd4f9590801d83f06bb6735a8e31"
        }
      ],
      "digest": "sha256:9ed7f71473e1026c0c712a5fc1298f629a64fb99aef6c05fc58f42f838a161c5"
    }
  }
