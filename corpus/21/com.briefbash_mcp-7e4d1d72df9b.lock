    "com.briefbash/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://briefbash.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "briefbash",
        "title": "BriefBash",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Submit a URL with submit_analysis (first brief per email free), then poll get_brief until status \"done\".",
      "tools": [
        {
          "name": "get_brief",
          "title": "Fetch Brief Summary",
          "description": "Fetch the summary of a BriefBash teardown by brief_id. While status is \"processing\", wait check_back_seconds and call again. When done, returns the AI-citation score, potential score, blockers and top attack points. Full interactive teardown is at brief_url.",
          "inputSchema": {
            "properties": {
              "brief_id": {
                "description": "The brief_id returned by submit_analysis (starts with bb_)",
                "type": "string"
              }
            },
            "required": ["brief_id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e077d9ca3a9279a23d410e6cab75a8344092380a96905625b5e840fd67c3b1f"
        },
        {
          "name": "submit_analysis",
          "title": "Submit Website Analysis",
          "description": "Submit a website URL to BriefBash for an AI-citation (GEO) teardown: how visible the site is to ChatGPT/Perplexity/AI Overviews, what blocks citations (llms.txt, bot access, schema), and the attack points a competitor is winning with. Returns a brief_id — poll get_brief until status is done (typically 1-3 minutes). The first brief per email is free.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email the brief is billed/claimed under (first brief free; later briefs use the email's BriefBash credits)",
                "type": "string"
              },
              "token": {
                "description": "Access token — required only when this email already holds BriefBash credits (verify the email once at briefbash.com to get one). Omit it for first-free usage.",
                "type": "string"
              },
              "url": {
                "description": "Absolute http(s) URL of the page or site to analyze, e.g. https://example.com/blog/post",
                "type": "string"
              }
            },
            "required": ["email", "url"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f5bc2f494bc7b414f06f008ad4c52fd07c81720c5cff04be53ebe1eb46a457e0"
        }
      ],
      "digest": "sha256:244a7211cda4a1c87f751940e39563a01486301dad06fe555ec545b0bbbf1d96"
    }
