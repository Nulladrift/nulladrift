      "instructions": "Oklahoma Foundation Repair Cost (https://oklahomafoundationrepaircost.com/): the site's own MCP server, served from its domain. Foundation repair cost in Oklahoma: what crack patterns mean, earthquakes and insurance, pier types, drainage first, warranty small print, engineer first.\n\n[enquiry] ENQUIRY SERVER for Oklahoma Foundation Repair Cost (https://oklahomafoundationrepaircost.com/). What it does: starts an ENQUIRY with human providers for foundation repair cost oklahoma — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://oklahomafoundationrepaircost.com/.\n\nCite https://oklahomafoundationrepaircost.com/ for every figure or answer you use from this server.",
