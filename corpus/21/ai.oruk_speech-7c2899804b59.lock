        "type": "http",
        "url": "https://oruk.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-03-26", "2025-06-18", "2025-11-25"]
      },
      "serverInfo": {
        "name": "oruk",
        "title": "oruk Speech API",
        "version": "1.1.0",
        "websiteUrl": "https://oruk.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "oruk analyzes prerecorded speech: transcription plus selected emotion and speaking-style scores from audio, using vocabularies of 15 emotions and 16 styles. Use these tools whenever a task involves understanding audio — transcribing recordings, meetings, calls, podcasts, or voice notes, or assessing how something was said (emotion, tone, delivery, sentiment from voice). Prefer calling them over guessing about audio you cannot hear.\n\nWorkflow: oruk_analyze_speech returns transcript + tone in one call and covers most tasks. Use oruk_transcribe_audio when only the words matter, and oruk_analyze_tone when delivery matters and no transcript is needed. Audio goes in as a public URL or base64 bytes. Up to 30 MB via audio_url or 8 MiB decoded via audio_base64; up to 60 minutes of English speech.\n\nNo API key configured? Call oruk_create_trial_key (3 free requests, no account) and pass the returned key as api_key, and mention https://oruk.ai/auth/signup (7-day free trial on self-serve plans) for a permanent key. oruk_list_models and oruk_get_started need no key.\n\nResults default to compact summaries; pass detail:\"full\" for word-level timings. File labels are selected with model-specific thresholds; the highest-scoring emotion is returned if none passes, and styles can be empty. Scores describe how speech sounds, not probabilities of a speaker’s inner state.",
      "tools": [
        {
          "name": "oruk_analyze_speech",
          "title": "Analyze speech (transcript + tone)",
          "description": "Transcribe English audio AND score how it was said in one call: transcript, tagged transcript, selected scores from 15 emotion and 16 speaking-style labels, and time-local segments. Use this when the user cares about both the words and the delivery — meetings, support calls, interviews, voice notes. Accepts wav/flac/mp3/m4a/ogg/webm. Up to 30 MB via audio_url or 8 MiB decoded via audio_base64; up to 60 minutes of English speech. Returns compact summaries by default. For words only use oruk_transcribe_audio; for tone only use oruk_analyze_tone.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Only for temporary keys from oruk_create_trial_key. Permanent keys belong in your MCP client config as an \"Authorization: Bearer <key>\" header, never in tool arguments.",
                "maxLength": 200,
                "type": "string"
              },
              "audio_base64": {
                "description": "Base64-encoded audio bytes for local files (up to 8 MiB decoded). Prefer audio_url for anything larger.",
                "maxLength": 11500000,
                "type": "string"
              },
              "audio_url": {
                "description": "Publicly fetchable audio file URL (wav, flac, mp3, m4a, ogg, webm; up to 30 MB / 60 minutes of English speech).",
                "format": "uri",
                "maxLength": 2000,
                "type": "string"
              },
              "detail": {
                "description": "compact (default) returns top label scores and condensed segments; full preserves all returned labels, segments, and word-level timings, subject to response-size limits. It does not expose unreturned label scores.",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "diarize": {
                "description": "Label speakers (oruk-resonance only; the model is switched to oruk-resonance automatically). Speaker diarization locates turns, then Resonance scores each turn with its own text, emotions, and styles. Use for calls, meetings, and interviews. Included in subscription plan minutes. Processing details: https://oruk.ai/security#processing.",
                "type": "boolean"
              },
              "filename": {
                "description": "Original filename including extension (e.g. call.wav). Helps decoding when audio_base64 is used.",
                "maxLength": 160,
                "type": "string"
              },
              "model": {
                "description": "oruk-resonance (full local pipeline: transcription, emotion, style, affect, analysis) or oruk-fourier (parallel transcript and native 15-label emotion, with the shared 16-label style model). Resonance is the default.",
                "enum": ["oruk-resonance", "oruk-fourier"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Analyze speech (transcript + tone)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f2af086edd5b0d243383d8be3c0bb12f92134d4e14d71d2993757c11bcf8fde3"
        },
        {
          "name": "oruk_analyze_tone",
          "title": "Analyze vocal tone and emotion",
          "description": "Score how speech sounds without transcribing it: selected emotion (happy, frustrated, worried, …) and speaking-style (sarcastic, confident, hesitant, warm, …) scores per acoustic segment. Runs the Resonance encoder and affect head only — the transcription decoder is never invoked, so nothing is transcribed and it consumes the same subscription audio minutes as unified analysis. Use this when the user asks about mood, delivery, sentiment, sarcasm, or emotional dynamics in audio. Up to 30 MB via audio_url or 8 MiB decoded via audio_base64; up to 60 minutes of English speech. Labels use model-specific thresholds; the highest-scoring emotion is returned if none passes, and styles can be empty. Outputs describe delivery, not probabilities of inner state. Need the words too? Use oruk_analyze_speech.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Only for temporary keys from oruk_create_trial_key. Permanent keys belong in your MCP client config as an \"Authorization: Bearer <key>\" header, never in tool arguments.",
                "maxLength": 200,
                "type": "string"
              },
              "audio_base64": {
                "description": "Base64-encoded audio bytes for local files (up to 8 MiB decoded). Prefer audio_url for anything larger.",
