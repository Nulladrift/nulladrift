          "name": "oruk_plan_hume_migration",
          "title": "Plan a local Hume batch migration",
          "description": "Return bounded planning guidance from redacted enums and counts only. No key is needed. Never send source, paths, audio, credentials or provider responses. This does not inspect customer code, generate or apply a patch, run inference, validate score equivalence or complete a migration; the separate local planner performs source-bound proposal work.",
