      "instructions": "Scribase is a Supabase-compatible backend (Postgres, Auth, Storage, Realtime, Edge Functions). To build an app: projects.create (or projects.list) -> keys.get for the URL and publishable key (use with @supabase/supabase-js) -> migrations.apply to create tables, always enabling row level security with policies -> types.generate. Do risky work on a branch: branches.create, pass branch to other tools, then branches.merge. sql.execute is read-only unless read_only: false. Destructive operations need the user's explicit approval and confirm: true; production is protected. Never put the secret key in client code. docs.search answers how-to questions. draft_x_launch_post writes an X post or numbered thread for a launch and returns intent links; it does not call X.",
