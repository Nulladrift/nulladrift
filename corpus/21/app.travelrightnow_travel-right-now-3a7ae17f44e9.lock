{
  "lockfileVersion": 2,
  "subjects": {
    "app.travelrightnow/travel-right-now": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.travelrightnow.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "travel-right-now",
        "title": "Travel Right Now",
        "version": "1.0.0",
        "websiteUrl": "https://travelrightnow.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Current travel conditions for the destinations returned by list_destinations, compiled weekly from official agencies, local news and traveler reports. Each item includes an as_of date, sources, a confirm_with note and a page_url. When using an item, give its as_of date, its sources or page_url, and any confirm_with advice. Items marked stale were last confirmed more than 30 days ago. Links in 'book' (and tour links from find_tours, when available) are affiliate links: when sharing one, tell the user it is an affiliate link.",
      "tools": [
        {
          "name": "check_trip",
          "title": "Check a trip",
          "description": "Get the conditions relevant to a planned trip, given a destination, start and\nend dates (YYYY-MM-DD) and optional interests such as 'volcano', 'northern\nlights', 'driving' or 'beach'. Returns alerts first, then other relevant items,\nwith booking options where available. Entry rules, safety and weather are\nalways included. Items reflect conditions as of their as_of date, not\nforecasts for the trip dates.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination, e.g. 'Maui' or 'Turks and Caicos'",
                "type": "string"
              },
              "end_date": {
                "description": "Trip end, YYYY-MM-DD",
                "type": "string"
              },
              "interests": {
                "description": "Optional interests, e.g. ['volcano', 'beach']",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "start_date": {
                "description": "Trip start, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["destination", "end_date", "start_date"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a trip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb7d8f44ff6e0a955cc8ed9e1b5bc17b3826cadc34b8606a6a95a0c803167b69"
        },
        {
          "name": "find_tours",
          "title": "Find tours",
          "description": "Find specific bookable tours and activities on Viator for a destination and an\nactivity, for example 'Arenal volcano hike' in Costa Rica, 'snorkel' in Turks and\nCaicos or 'northern lights' in Iceland. Returns each tour's title, from-price,\nrating, review count, duration, free-cancellation flag and booking link, plus any\ncurrent conditions from the destination's data that could affect the activity.\nUse when someone is choosing or asking which tour or activity to book.",
          "inputSchema": {
            "properties": {
              "activity": {
                "description": "What they want to do, e.g. 'Arenal volcano hike'",
                "type": "string"
              },
              "count": {
                "default": 5,
                "description": "How many tours, 1 to 10",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "description": "Destination, e.g. 'Costa Rica'",
                "type": "string"
              }
            },
            "required": ["activity", "destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find tours"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:32235ee08a979ca5f6cfe2150c6c2f693ba83c5b60f95f277a03b3ccd8f541b6"
        },
        {
          "name": "get_conditions",
          "title": "Get current conditions",
          "description": "Get current travel conditions for one destination: weather and road alerts,\nvolcano activity, closures, park and attraction reservations, flights, entry\nrules, safety, costs and upcoming events. Use when someone asks what is happening\nnow, or whether something is open, running or safe.\n\ntopic is optional and narrows the results (for example weather, driving,\nvolcanoes, northern-lights).",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination, e.g. 'Costa Rica' or 'Iceland'",
                "type": "string"
              },
              "topic": {
                "description": "Optional topic, e.g. weather or driving",
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get current conditions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d1ba4f165aa9db2b55b2e8b8efd4f8e4191e46297aa07073b135967911c4c71d"
        },
        {
          "name": "list_destinations",
          "title": "List destinations",
          "description": "List the destinations that have current travel conditions, with each one's\nlast update date and topics. Use it when unsure whether a destination is covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List destinations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0a4252241dee41529421ecc4735de61533dc5c265b333d4f0a729b413e10ec7"
        },
        {
          "name": "what_changed",
          "title": "What changed recently",
          "description": "Get a destination's travel conditions that were confirmed or updated on or\nafter a date (YYYY-MM-DD), newest first. Use when someone asks what is new or\nhas changed recently.",
          "inputSchema": {
            "properties": {
              "destination": {
                "description": "Destination, e.g. 'Iceland'",
                "type": "string"
              },
              "since": {
                "description": "Date in YYYY-MM-DD format",
                "type": "string"
              }
            },
            "required": ["destination", "since"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What changed recently"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92a8ba6bd24a598e42c3c703fa7fc98fd1ec0a89044a0d72346c8c37670c76be"
        }
      ],
      "digest": "sha256:a60c1e2f8bf29c37df134a8c270d4168fd28c11ee369d0d981a8bb2bc20431de"
    }
  }
}
