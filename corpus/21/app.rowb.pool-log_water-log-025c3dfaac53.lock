{
  "lockfileVersion": 2,
  "subjects": {
    "app.rowb.pool-log/water-log": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pool-log.rowb.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "pool-log",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "add_readings",
          "description": "Append water readings to an existing log. Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "readings": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "site_id": {
                "type": "string"
              }
            },
            "required": ["readings", "site_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0c060c2b18ac447436d38b0905ecb4c58ea10eb7669f1344632d58ad2563f718"
        },
        {
          "name": "check_readings",
          "description": "Check a list of pool or spa water readings for things that cannot be true, and compare pH, free chlorine and bromine against the ranges published on the US CDC pages. Deterministic arithmetic only - no AI. It does not decide whether a pool is legally compliant, and it does not know your local code.",
          "inputSchema": {
            "properties": {
              "as_of": {
                "description": "Treat this date as \"today\" (YYYY-MM-DD) when rejecting future timestamps. Defaults to the server date.",
                "type": "string"
              },
              "readings": {
                "description": "Readings to check. Each: {at:\"YYYY-MM-DDTHH:MM\", kind:\"pool|hot_tub|splash_pad|wading_pool|other\", ph?:number, free_chlorine_ppm?:number, total_chlorine_ppm?:number, bromine_ppm?:number, cyanuric_acid_ppm?:number, water_temp_f?:number, disinfectant?:\"chlorine|bromine|none\", method?:\"dpd|test_strip|meter|other\", by?:\"who tested\"}.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["readings"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:489b6b698157df37bab8bbd8a249649cbd7eb29cde77d80c13f71de35342df6b"
        },
        {
          "name": "create_site",
          "description": "Open a water-test log for one pool, hot tub or splash pad (returns a site id). Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "address": {
                "type": "string"
              },
              "disinfectant": {
                "description": "chlorine | bromine | none",
                "type": "string"
              },
              "label": {
                "description": "What to call this water, e.g. \"Apartment pool - north\".",
                "type": "string"
              },
              "volume_gallons": {
                "type": "number"
              },
              "water_type": {
                "description": "pool | hot_tub | splash_pad | wading_pool | other",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0747e5952b7ae6099c9e438dd8fbfa848440ef846b18939c7e6f46c2ef4efff"
        },
        {
          "name": "get_log_summary",
          "description": "Every reading, the flagged issues, the CDC-range counts, the longest gap between tests, and the A4 log sheet URL, for one log. Requires a bearer key.",
          "inputSchema": {
            "properties": {
              "site_id": {
                "type": "string"
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:043b5091dcc082ab3c2b04911c1f7a5620ef2c92c323165b5cc6192491dd98e6"
        },
        {
          "name": "get_rules",
          "description": "The exact rule table this service checks against, the quoted source of every range, and what it explicitly does not claim. Quote it if you need to explain a result.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:60119e2c22f6378898159a734c8f2ff6837d274449215783711a467d99b195ea"
        },
        {
          "name": "request_operator_signoff",
          "description": "Create a one-time URL the pool operator can open to confirm the log. Requires a bearer key. The token is single use.",
          "inputSchema": {
            "properties": {
              "provider_email": {
                "type": "string"
              },
              "provider_name": {
                "type": "string"
              },
              "site_id": {
                "type": "string"
              }
            },
            "required": ["site_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ff7a7f25ab26363d8beb82cbd91fc9228c20bc4b03b6c9c05f5dca54668c743a"
        }
      ],
      "digest": "sha256:e5292d57420c7f49ef8da468cf1b230f2ee36b35eb3673c1ca1b813828288b76"
    }
  }
}
