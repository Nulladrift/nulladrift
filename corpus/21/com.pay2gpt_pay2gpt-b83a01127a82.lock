            "readOnly": true
          },
          "digest": "sha256:79d4e072a4318cff34d2c85de5f4d5744b818d3cefddd1eef69379c6e73187a3"
        },
        {
          "name": "cancel_business_order",
          "title": "Business: cancel an order",
          "description": "For a company with a Pay2GPT business API key: cancel one of its orders that no ChatGPT account has been connected to yet; the credit goes back to the company's balance. A cancelled order cannot be reopened.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "order_number": {
                "description": "The order number",
                "type": "string"
              }
            },
            "required": ["order_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
