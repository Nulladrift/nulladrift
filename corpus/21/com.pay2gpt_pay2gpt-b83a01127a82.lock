            "readOnly": true
          },
          "digest": "sha256:d5135ad1b54468c361fc81244acead551eaa76bc7f1d864c0902eb0eb293a7c8"
        },
        {
          "name": "get_x402_checkout",
          "title": "Get the x402 payment address of a plan",
          "description": "For an agent that holds USDC on Base: returns the HTTP address where one Pay2GPT plan is bought with the x402 payment protocol, with the current price in US cents and in USDC atomic units. This tool pays nothing. A GET to the returned url answers 402 with the payment requirements; the same GET with a PAYMENT-SIGNATURE header settles the payment and returns the order number and the order page, where the buyer connects their own ChatGPT account.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "The buyer's email address; order updates go there",
                "type": "string"
              },
              "plan": {
                "description": "Plan slug from list_plans, such as plus",
                "type": "string"
              }
            },
            "required": ["email", "plan"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:822f39daa312f5625e309453754664553b7344b62598ac509a29230ed8881f20"
        },
        {
          "name": "list_articles",
          "title": "List guides and articles",
          "description": "List Pay2GPT's how-to guides (ordering, paying, connecting a ChatGPT account, renewing) and blog articles in one language, each with its title, page URL and Markdown URL. Pass a URL to read_page for the full text.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "locale": {
                "description": "Language of the list: zh-CN (default), en or ru",
                "enum": ["zh-CN", "en", "ru", "fa"],
                "type": "string"
              },
              "section": {
                "description": "guide, blog or all (default)",
                "enum": ["guide", "blog", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3dc10ffe1997db9b0823cec3680ceb3598658a9ce6b9c5aeea0d92e93ff4102"
        },
        {
          "name": "list_business_orders",
          "title": "Business: list orders",
          "description": "For a company with a Pay2GPT business API key: its latest orders, newest first, each with its order number, product, status, redemption link and timestamps. Optionally only orders in one status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many orders, 1-50, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "status": {
                "description": "Only orders in this status",
                "enum": ["awaiting_account", "checking", "account_rejected", "processing", "succeeded", "failed", "refunded"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c871caa704c01e3c90fabc0b4dabbe08823878585f0d20f805571c4921bb1703"
        },
        {
          "name": "list_plans",
          "title": "List plans and prices",
          "description": "List every Pay2GPT plan (ChatGPT Go, Plus, Pro, Codex credits and the rest) with its current price in US cents for each website payment method (card, alipay, crypto), whether it can be bought now, and its checkout URL. Card and Alipay include the card service fee; crypto pays the list price. Ruble methods are quoted at checkout.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6950da077cf02c6d5e6f2087ec54167e98b78d07b25beb0cbc8b94393c48bef"
        },
        {
          "name": "place_business_orders",
          "title": "Business: place orders",
          "description": "For a company with a Pay2GPT business API key: open 1-100 orders of one product, each spending one of the company's credits for that product. Each order comes back with a redemption link for the end user. Reusing the same idempotency_key with the same arguments returns the same orders and spends nothing more. An order nobody has connected an account to can be given back with cancel_business_order.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "idempotency_key": {
                "description": "A unique key for this purchase, reused on retry",
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "product": {
                "description": "Product slug from business_credits",
                "type": "string"
              },
              "quantity": {
                "description": "How many orders",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["idempotency_key", "product", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:6d2e744c4eb5305bac3b84ddd8f1825965e4fa326841b902ada39a2607393f5c"
        },
        {
          "name": "read_page",
          "title": "Read a page as Markdown",
          "description": "Read one public Pay2GPT page as Markdown: a guide or blog article from list_articles, the home page, help, about, terms, privacy, delivery status, business, business/api, codex-credits, codex-reset or codex-sms. Pass its full URL (https://pay2gpt.com/... or https://ru.pay2gpt.com/...) or its path, such as /en/guide/session. Returns the final URL to cite and the page's Markdown.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url": {
                "description": "Page URL or path on pay2gpt.com",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad903fac4643310dbce77050bbf51449ddfce8318e25cc215b04a42dfbe7bdf3"
        }
