            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:84aa6e12269f64f759a632a327be234b8d970f9cd77bfa669c305d64263041b7"
        },
        {
          "name": "get_business_order",
          "title": "Business: get an order",
          "description": "For a company with a Pay2GPT business API key: one of its orders by order number, with its current status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "order_number": {
                "description": "The order number",
                "type": "string"
              }
            },
            "required": ["order_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
