      "serverInfo": {
        "name": "pay2gpt",
        "title": "Pay2GPT",
        "version": "1.0.0",
        "websiteUrl": "https://pay2gpt.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Pay2GPT tops up ChatGPT Go, Plus and Pro, sells Codex credits, and serves companies a prepaid activation API. Use list_plans for current prices and checkout links, list_articles and read_page to answer how buying, paying, connecting a ChatGPT account and renewing work, and cite the page URLs these tools return. Prices and policies change: quote them from tool results, not from memory. The business_* tools need a business API key sent as \"Authorization: Bearer <key>\"; without one they return an error and the public tools keep working.",
      "tools": [
        {
          "name": "business_credits",
          "title": "Business: credits and products",
          "description": "For a company with a Pay2GPT business API key (sent as Authorization: Bearer <key>): the remaining activation credits per product, how many openings are in progress against the limit, and the products it can order, by slug.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
