                "type": ["array", "null"]
              },
              "hint": {
                "type": ["null", "string"]
              },
              "none": {
                "type": ["null", "object"]
              },
              "note": {
                "type": ["null", "string"]
              },
              "refusal": {
                "description": "why nothing was answered, by name",
                "type": ["null", "string"]
              },
              "today": {
                "description": "today's rising hits, newest first, the asker's side first",
                "type": ["array", "null"]
              },
              "week": {
                "description": "the Monday (KST) the week's picks are fixed on",
                "type": ["null", "string"]
              }
            },
            "type": "object"
          },
