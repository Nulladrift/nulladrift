        "name": "shorti",
        "title": "Shorti",
        "version": "43e2692c22a592944a59e9f6646359d47b289c92",
        "description": "Shorti(쇼티) reads TikTok, Instagram Reels and YouTube Shorts: a pasted link's video and how it was shot, its format, and what to shoot this week. 틱톡·릴스·쇼츠 링크의 영상을 어떻게 찍었는지, 이번 주 뭘 찍을지 읽어 줘요.",
        "websiteUrl": "https://shorti.ai",
        "icons": [
          {
            "src": "https://shorti.ai/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/tasks": {},
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
