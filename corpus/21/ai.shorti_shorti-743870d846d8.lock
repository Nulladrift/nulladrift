        {
          "name": "shorti_what_to_shoot",
          "title": "What to shoot this week",
          "description": "Shorti(쇼티) for «what should I shoot this week?», «이번 주 뭐 찍지?», «find videos of…» or «… 영상 찾아줘». Today's rising hits and this week's formats, for a field, a product or any words, from the West, or by their taste. `about`: a field, product, niche or @handle (Korean initials work). `category` narrows it ('food'). `lens`: radar (the West first) or mine. Signed in, their week leads.",
          "inputSchema": {
            "properties": {
              "about": {
                "description": "Their words: a profession, team, shop or field (피부과, 카페, 브랜드팀), a product, a niche, an action or an @handle.",
                "maxLength": 200,
                "type": "string"
              },
              "category": {
                "description": "The creator's niche, when they have one.",
                "enum": ["beauty", "food", "fashion", "daily", "comedy", "dance", "music", "pets", "fitness", "travel", "art", "gaming", "product", "info", "ai", "household", "tech", "parenting"],
                "type": "string"
              },
              "cursor": {
                "maxLength": 12,
                "type": "string"
              },
              "lang": {
                "default": "ko",
                "description": "'en': Shorti's own English; never translate its Korean.",
                "enum": ["ko", "en"],
                "type": "string"
              },
              "lens": {
                "default": "week",
                "description": "radar: formats breaking out in the West no Korean video holds yet; mine: by their stated taste.",
                "enum": ["week", "radar", "mine"],
                "type": "string"
              },
              "limit": {
                "default": 6,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "Only formats with videos on this platform.",
                "enum": ["tiktok", "instagram", "youtube"],
                "type": "string"
              },
              "state": {
                "description": "With radar: none in Korea yet, or the first ones.",
                "enum": ["not_in_korea", "arriving"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "when the data was compiled",
                "type": ["null", "string"]
              },
              "for_you": {
                "description": "true when a signed-in reader's own week leads the list",
                "type": ["boolean", "null"]
              },
