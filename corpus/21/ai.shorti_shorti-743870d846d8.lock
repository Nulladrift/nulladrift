        {
          "name": "shorti_how_to_shoot",
          "title": "How it was shot",
          "description": "Shorti(쇼티) for a TikTok, Reels or Shorts link with «how was this shot?», «이 영상 어떻게 찍었어?», «나도 이렇게 찍으려면?» or «분석해줘». One video or format as a creator shoots it. `url` or `video_id`: its hook, beats and numbers (not_in_corpus: not read yet). `format_id`: its plan and hits. `part`: plan (its format's), flow (how it moved; `lineage`), scene (where the phone stood).",
          "inputSchema": {
            "properties": {
              "cursor": {
                "maxLength": 12,
                "type": "string"
              },
              "detail": {
                "default": "summary",
                "description": "full: every field, paged.",
                "enum": ["summary", "full"],
                "type": "string"
              },
              "format_id": {
                "description": "A format's id or its page's slug.",
                "maxLength": 120,
                "type": "string"
              },
              "lang": {
                "default": "ko",
                "description": "'en': Shorti's own English.",
                "enum": ["ko", "en"],
                "type": "string"
              },
              "lineage": {
                "description": "A lineage's id (lin_…).",
                "maxLength": 120,
                "type": "string"
              },
              "part": {
                "description": "Which answer about it.",
                "enum": ["plan", "flow", "scene"],
                "type": "string"
              },
              "url": {
                "description": "The post's link.",
                "maxLength": 2048,
                "type": "string"
              },
              "video_id": {
                "description": "Shorti's id of the video.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "When the release these rows were read from was compiled."
