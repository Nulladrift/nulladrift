        {
          "name": "shorti_check",
          "title": "Check my video",
          "description": "Shorti(쇼티) for «check my take», «내가 찍은 거 봐줘», «내 피드백 보여줘» or «내 결과 공유해줘». The person's own video checked against its format's hits. `url` (a posted Reels, TikTok or Short): the page on Shorti to paste it on. `upload`: their own file, on that page. `token`: their summary, once they send it to this chat. Its feedback (피드백): a likeness is not a forecast of views.",
