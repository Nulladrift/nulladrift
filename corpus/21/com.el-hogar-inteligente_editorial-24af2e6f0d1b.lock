      },
      "transport": {
        "type": "http",
        "url": "https://el-hogar-inteligente.com/wp-json/amazonwapi/v1/mcp/editorial"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-06-18"]
      },
      "serverInfo": {
        "name": "el-hogar-inteligente-editorial",
        "title": "El Hogar Inteligente Editorial",
        "version": "1.7.9"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Search published smart-home articles by language and cite their canonical URLs.",
      "tools": [
        {
          "name": "get_editorial_context",
          "description": "Get a citable editorial summary for a canonical article URL returned by search_editorial.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:177123a74ca105c0e8825df0a5428cdb423236aa8dd85693f511aa68e5456f26"
        },
        {
          "name": "search_editorial",
          "description": "Find published smart-home articles, comparisons, guides and ideas. Use short keywords in the requested language. Omit query for recent articles.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["guide", "comparison", "idea", "review"],
                "type": "string"
              },
              "language": {
                "enum": ["es", "ca", "pt", "fr", "it"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c020e69007c945454fa79c72dda00f66440f723fd798b6200611755cfa947b50"
        }
      ],
      "digest": "sha256:e3c14183b91e1c33042773781fb4ab619bfd23b5ede986eddd9404207db893c2"
    }
  }
