{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/compute": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://compute.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "compute-connector",
        "title": "Compute Connector",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "More compute for your bot. When the machine your agent runs on is low on memory, Compute Connector warns it and sends the heavy job (builds, installs, test suites, headless browsers) to a cloud sandbox on your own provider account: Vercel Sandbox by default, or E2B, Daytona, Modal and Workers Sandbox. You bring the keys and pay the provider directly; we charge a flat connector fee and never resell compute. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "check_memory",
          "description": "Before a heavy job, send how much memory the machine your agent runs on has free (free -m, os.freemem()) and what you are about to run. Get a memory warning and a verdict: run_local, or offload with the provider to use. Free watch-only logs would_offload for the weekly report; nothing runs.",
          "inputSchema": {
            "properties": {
              "floor_mb": {
                "description": "Keep at least this much free. Default 2048.",
                "type": "number"
              },
              "free_mb": {
                "description": "Free or available memory right now, in MB (Linux: the \"available\" column of free -m).",
                "type": "number"
              },
              "host": {
                "description": "Optional name of the machine, e.g. \"my-laptop\".",
                "type": "string"
              },
              "job": {
                "description": "The command or a short description, e.g. \"npm run build\" or \"playwright crawl of 40 pages\".",
                "type": "string"
              },
              "job_mb": {
                "description": "Optional: your own estimate of the job's peak memory in MB. Without it we use a rough guess by job type.",
                "type": "number"
              },
              "total_mb": {
                "type": "number"
              }
            },
            "required": ["free_mb"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4917033f2f930bc26ea575af3a222d4ebb42aad7e7a23bb1f10dcc80200ca3b"
        },
        {
          "name": "delete_provider_key",
          "description": "Pro, owner only: delete a saved provider key by name. Jobs on that key stop working at once.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4bcb030a9746f65acee6ac9903124e2f7fcf502b548f3b0813c941543a7edbd6"
        },
        {
          "name": "list_providers",
          "description": "Every provider this connects to, how each one runs, and (with your key) the provider keys you saved: name, provider, fingerprint, default, last used. Never shows a key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a1d0c8b8703d2a476750452283b5098c0ba54ba3a8e624f27141e5da93cdeb0"
        },
        {
          "name": "provider_setup",
          "description": "Step-by-step setup for one provider: where to get the key, what to pass to save_provider_key, links to its docs and price page, and for Modal or Workers Sandbox the bridge code to deploy on your own account.",
          "inputSchema": {
            "properties": {
              "provider": {
                "description": "vercel, e2b, daytona, modal or workers.",
                "type": "string"
              }
            },
            "required": ["provider"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9ad745b6a89e0b0535af7d45e26b2226f86482b1344e615d381e7024e673025"
        },
        {
          "name": "run_job",
          "description": "Pro: run a shell command in a fresh cloud sandbox on your own provider account (vercel (Vercel Sandbox, default), e2b, daytona, modal, workers (Workers Sandbox)) and get the exit code and the last 16 KB of stdout and stderr back. Send small input files with it. The sandbox is created for the job and stopped right after, so nothing idles on your bill. Free watch-only logs would_offload and runs nothing.",
          "inputSchema": {
            "properties": {
              "cmd": {
                "description": "Shell command, run with bash -lc, e.g. \"git clone https://github.com/you/app && cd app && npm ci && npm test\".",
                "type": "string"
              },
              "env": {
                "description": "Optional non-secret environment variables for the command (strings).",
                "type": "object"
              },
              "files": {
                "description": "Optional input files written before cmd runs: [{path, content, encoding?: \"base64\"}]. 50 files, 500 KB total.",
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "encoding": {
                      "type": "string"
                    },
                    "path": {
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "type": "array"
              },
              "free_mb": {
                "description": "Optional: memory free on your machine now, for the weekly report.",
                "type": "number"
              },
              "provider": {
                "description": "Name of a saved provider key (default: your default key, else vercel).",
                "type": "string"
              },
              "runtime": {
                "description": "Vercel only: node24 (default), node22, node26 or python3.13.",
                "type": "string"
              },
              "template": {
                "description": "E2B only: template id, default base.",
                "type": "string"
              },
              "timeout_s": {
                "description": "1-240 seconds, default 120.",
                "type": "integer"
              }
            },
            "required": ["cmd"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:349f4f92fcae0faa2a7a6f1b7fd2bf2b7f56300a51e6d168a7615958f5f69098"
        },
        {
          "name": "save_provider_key",
          "description": "Pro, owner only: save one provider key, sealed with AES-256-GCM before it reaches the database. Providers: vercel (Vercel Sandbox, default), e2b, daytona, modal, workers (Workers Sandbox). Vercel needs team_id and project_id; Modal and Workers Sandbox need bridge_url (see provider_setup). The key is checked with a read-only call first and is never returned or logged. Free stores nothing.",
          "inputSchema": {
            "properties": {
              "api_url": {
                "description": "Daytona: API base, default https://app.daytona.io/api.",
                "type": "string"
              },
              "bridge_url": {
                "description": "Modal / Workers Sandbox: https URL of the bridge you deployed.",
                "type": "string"
              },
              "make_default": {
                "type": "boolean"
              },
              "name": {
                "description": "Label for this key, default the provider name. Use it in run_job provider.",
                "type": "string"
              },
              "project_id": {
                "description": "Vercel: project id or name the sandboxes bill to.",
                "type": "string"
              },
              "provider": {
                "description": "vercel, e2b, daytona, modal or workers.",
                "type": "string"
              },
              "skip_check": {
                "description": "Save without the read-only check (not recommended).",
                "type": "boolean"
              },
              "team_id": {
                "description": "Vercel: team id (team_...).",
                "type": "string"
              },
              "token": {
                "description": "The provider API key or token (or your bridge token).",
                "type": "string"
              }
            },
            "required": ["provider", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0a5b6b5062b1aeba9e75ea953f6452230310f693d80a3f89eaabe6e65ace277"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $9/month upgrade link. Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9976e3342e295e0be5a023bb57d60324ebd7c104df1c76e8d7effcdadec38b20"
        },
        {
          "name": "weekly_report",
          "description": "Plain-English summary of the last 7 days: memory checks, low-memory warnings, jobs that would have been offloaded (free) or ran (Pro) by provider, minutes and failures. Read-only; sends nothing. Needs an API key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:75ba40de5106324656fa3f4136dc6c7f58c6f9da827a857dc86c7a0d11cdc8df"
        }
      ],
      "digest": "sha256:d22e3409596b068e55a41f99b4879ef056b5bc14f2300e119bd03d5bdfb9e7ba"
    }
  }
}
