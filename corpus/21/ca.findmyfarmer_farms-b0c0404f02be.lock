{
  "lockfileVersion": 2,
  "subjects": {
    "ca.findmyfarmer/farms": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://findmyfarmer.ca/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Find My Farmer Port",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Find My Farmer is a registry (a Sol Port) and agricultural knowledge graph of local farms in Canada. Unclaimed listings are compiled from each farm's own public pages and carry where and when each fact was observed; a claimed listing is maintained by the farm. Listing is free and ranking is never sold. Start with find_near for \"where can I get X near here\" (a place slug or lat/lng, plus species / good / practice / event filters); price_stats for what a good costs in a province (aggregate, never per-farm); whats_in_season for a month; get_place_catalogue for everything near a place; search_farmdex then get_species to resolve food and species knowledge; define_term for farming practices; list_places / list_goods / list_filters for the vocabularies; search_farms + get_farm for a single farm's full public profile and contact channels. Always hand the user the canonical url from a result — the registry is a conduit to the farm, not a destination. Vocabulary: https://findmyfarmer.ca/.well-known/ontology",
      "tools": [
        {
          "name": "best_for",
          "description": "The best varieties of a species for a use — \"best apple varieties for baking\" — ranked from the Farmdex's documented tasting notes and trait spectra (1–5, relative to the species' reference variety). Pass species + use for the ranked answer; species alone lists the uses it can answer; use alone lists the species with an answer. A guide exists only once at least 3 documented varieties carry the use.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max varieties returned (default 25); the url carries the full guide.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "species": {
                "description": "species id from search_farmdex, e.g. \"apple\", \"tomato\".",
                "type": "string"
              },
              "use": {
                "description": "a best-uses token, e.g. \"baking\", \"canning\", \"fresh eating\", \"juicing\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3b7866a4960a8a73dd7d919b8dfc05d173f8855653432c5f27d5ff32950ae7f2"
        },
        {
          "name": "compare",
          "description": "Two Farmdex varieties head to head — \"Honeycrisp vs Gala\": documented tasting prose, uses, and (same species) 1–5 trait values on shared axes relative to the species' reference variety. Both variants must clear a completeness bar (description + >= 2 documented sensory/use fields). Machine-only — there is deliberately no compare page family; cite the two variety URLs returned.",
          "inputSchema": {
            "properties": {
              "a": {
                "description": "first variant id, e.g. \"apple-honeycrisp\" (from search_farmdex / best_for).",
                "type": "string"
              },
              "b": {
                "description": "second variant id, e.g. \"apple-gala\".",
                "type": "string"
              }
            },
            "required": ["a", "b"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64386fd59fd70bf1c7ac5102864b650d6ee0ebaee64fc9e924612236e808cb79"
        },
        {
          "name": "define_term",
          "description": "Find My Farmer's definition of a farming practice (rotational grazing, grass-finished, no-till…): the meaning, the nuance, the questions to ask a farmer, FAQs, and how many farms claim it. Returns the term's stable IRI.",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "Practice slug (\"rotational-grazing\") or id (\"rotationalGrazing\"). An unknown term returns the full list.",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02bdea4bb798adaafa24f79a476d3942573c55691bf6e37610c4c0124babf2f0"
        },
        {
          "name": "find_near",
          "description": "Farms AND coordination points (farmers' markets, off-farm pickup points, stockists) within a radius of a point or a named place, ordered by distance, optionally filtered by what is sold (species ids or a good slug), a farming practice, a service category, or an event type. Points carry their schedule and the farms present. Distances are straight-line from each farm's PUBLIC map point, or pass distance=\"road\" for cached driving distance + minutes (cold pairs are filled once per call, capped). This is the \"where can I get X near here — and where on Saturday\" primitive.",
          "inputSchema": {
            "properties": {
              "distance": {
                "description": "straight (default) = geodesic from the public point. road = driving km + minutes from the shared 90-day cache; a bounded number of cold pairs are routed fresh per call, the rest carry straight-line only until warmed. Maps-hidden farms never carry road figures.",
                "enum": ["straight", "road"],
                "type": "string"
              },
              "event_types": {
                "description": "event type slugs from list_filters, e.g. [\"berry-picking\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "good": {
                "description": "A goods slug from list_goods (e.g. \"grass-fed-beef\") — expands to its species and practice scope.",
                "type": "string"
              },
              "include": {
                "description": "What to return: farms, points (markets / pickups / stockists), or both (default).",
                "enum": ["both", "farms", "points"],
                "type": "string"
              },
              "kinds": {
                "description": "Point kinds to include (default all).",
                "items": {
                  "enum": ["market", "pickup", "retail"],
                  "type": "string"
                },
                "type": "array"
              },
              "lat": {
                "description": "Latitude of the centre. Pass lat+lng OR place.",
                "type": "number"
              },
              "limit": {
                "description": "Results per page, applied to farms and points separately (default 25).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the centre.",
                "type": "number"
              },
              "page": {
                "description": "Page number.",
                "minimum": 1,
                "type": "integer"
              },
              "place": {
                "description": "A place slug from list_places, e.g. \"calgary\", \"alberta/calgary\" or \"alberta\". Its centroid becomes the centre and its reach the default radius.",
                "type": "string"
              },
              "practices": {
                "description": "farming practice ids from list_filters, e.g. [\"rotationalGrazing\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "radius_km": {
                "description": "Search radius in km (default: the place's reach, else 50; max 300).",
                "maximum": 300,
                "minimum": 1,
                "type": "number"
              },
              "service_categories": {
                "description": "service category slugs from list_filters, e.g. [\"hay-feed-forage\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "species": {
                "description": "species ids (from search_farmdex / get_place_catalogue), OR-matched, e.g. [\"cattle-taurus\"].",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bb49f55371551a8bbf7b68e3ec4ba9f37da4f815acd1b3580bd12d54655fd993"
        },
        {
          "name": "get_farm",
          "description": "Fetch one farm's full public profile by its URL slug (the last path segment of a findmyfarmer.ca/farms/... URL, also returned by search_farms). Includes the farm story, contact channels the farmer chose to publish, and how to buy from them. Volume-capped: 50 profiles per caller per UTC day — this registry serves reference use and does not offer bulk datasets.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The farm's URL slug, e.g. \"po-s-broccoli-patch\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0bc5e17ae777c32f1703d82ad4d816b6be22a09460d7aac37a7f7e9703134d6"
        },
        {
          "name": "get_place_catalogue",
          "description": "Everything available near a place — every species that published farms serving the place list, in taxonomy shape (category → subcategory → species) with local farm counts — plus the place's Wikidata / GeoNames ids.",
          "inputSchema": {
            "properties": {
              "metro": {
                "description": "Metro slug under that province, e.g. \"calgary\". Omit for the whole province.",
                "type": "string"
              },
              "province": {
                "description": "Province slug, e.g. \"alberta\".",
                "type": "string"
              }
            },
            "required": ["province"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cf7a239273cde57b0f74823683ee8da723d4d9d36dda2559b83822e7d98e2101"
        },
        {
          "name": "get_species",
          "description": "One Farmdex species: names, taxonomy, description, its GBIF / Wikidata / ITIS identifiers, and its varieties or breeds. Resolve a food name to a species id first with search_farmdex.",
          "inputSchema": {
            "properties": {
              "species": {
                "description": "species id, e.g. \"cattle-taurus\", \"garlic\".",
                "type": "string"
              }
            },
            "required": ["species"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5637e69f0d8e6a66deb4e1d4145b078358e829fe726c60ad22f99f8152fd406e"
        },
        {
          "name": "list_filters",
          "description": "The controlled vocabularies find_near accepts: farming practice ids, service category slugs, event type slugs.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b7d037988ddf362c721c3c33796c5a671a988ae6c7b3f45de46a295785dc95d"
        },
        {
          "name": "list_goods",
          "description": "The goods Find My Farmer publishes reports and price statistics for — the slugs price_stats and find_near accept, each with the species and practices that define it.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f84d3c3e86122e0915012e5afc3f6a2173c1e899e2564d76f5f8c10cb45de7c6"
        },
        {
          "name": "list_hubs",
          "description": "List Find My Farmer hubs — the named local-food regions (foodsheds) farms dock into. Useful for narrowing a farm search to a place.",
          "inputSchema": {
            "properties": {
              "province": {
                "description": "Two-letter province/state code filter, e.g. \"AB\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9e211bf4d177906217ef3861ce57b3be6064170bd1efc4180c80ac96ab3a8e51"
        },
        {
          "name": "list_places",
          "description": "The place graph: countries and provinces/states (no args), one country's provinces (country), or one province's metros (province). Each place carries its slug, centroid, reach, and Wikidata / GeoNames identifiers.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2, e.g. \"CA\".",
                "type": "string"
              },
              "province": {
                "description": "Province slug, e.g. \"alberta\" — returns its metros.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:50f0a4b0e66b5778961369ab3cd8a303719c59c8f29286c36dbced67c5a8c544"
        },
        {
          "name": "price_stats",
          "description": "Aggregate price statistics (low / median / mean / high, farm + observation counts, as-of dates) for a good, nationally or in one province, from Find My Farmer's price ledger. Every bucket covers at least 3 farms and names none; a single farm's own prices, each dated and cited, come from get_farm.",
          "inputSchema": {
            "properties": {
              "good": {
                "description": "A goods slug from list_goods, e.g. \"grass-fed-beef\", \"raw-honey\".",
                "type": "string"
              },
              "province": {
                "description": "Province slug (\"alberta\"), code (\"AB\") or name. Omit for national.",
                "type": "string"
              }
            },
            "required": ["good"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d9c9e8bc966ad1348053bf986bc0a49a7ef13c77c952688133d58900f270d3c"
        },
        {
          "name": "search_farmdex",
          "description": "Search the Farmdex — Find My Farmer's agricultural knowledge database of categories, species, and variants (e.g. heritage vegetable varieties, livestock breeds). Useful for resolving what a food product actually is before searching for farms that sell it.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "e.g. \"brandywine tomato\", \"highland cattle\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:db3fd67244b144dcebe6899fbb9cbf07c51c5864e6a985bbbddd5ab2ce551c93"
        },
        {
          "name": "search_farms",
          "description": "Search the Find My Farmer registry of local farms in Canada. Returns farm name, location (city/province), type, and the canonical findmyfarmer.ca page URL. Search matches farm names, stories, and what each farm sells (goods, packages, events).",
          "inputSchema": {
            "properties": {
              "page": {
                "description": "Page number (10 results per page).",
                "minimum": 1,
                "type": "integer"
              },
              "province": {
                "description": "Two-letter province/state code filter, e.g. \"AB\", \"BC\", \"MT\".",
                "type": "string"
              },
              "query": {
                "description": "Free-text search, e.g. \"beef\", \"sourdough\", \"farm stays\". Omit to list farms.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cc5b371fdfb69c7abbf058d7b02d1f87e12bff7c7a73087c316ce2d1d27d9c3"
        },
        {
          "name": "whats_in_season",
          "description": "Species in their harvest window in a Canadian province for a given month (default: this month), with how many local published farms list each. Window-based (is the month inside start..end), not peak-based.",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "Month number 1–12. Default: current month (UTC).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "province": {
                "description": "Province slug (\"ontario\"), code (\"ON\") or name.",
                "type": "string"
              }
            },
            "required": ["province"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:72ab79690065eb021fbe89dc859cc285121058e6d14a7305afdc16a7a87f02ea"
        }
      ],
      "digest": "sha256:53af5ba587a651cd350cc393424ffe8a15b0cc055bc26ffcb53d27533e355d0f"
    }
  }
}
