          "name": "list_courses",
          "title": "List courses for a country",
          "description": "List the online CPR, AED and first aid courses Mandatory Training offers for a country: each with its page URL, price (a certificate of completion, paid for only after passing; learning and the test are free), length, how long the certificate is valid, a summary and who it is for, plus that country's wording on whether an employer will accept the certificate. Give people the employer_acceptance wording as it is, without shortening it into a yes. To enrol, send the person to the course's url, where they enter and confirm their own details. country is a two-letter code (US, CA, GB or UK, NZ, and others); without it the answer is for the United States.",
