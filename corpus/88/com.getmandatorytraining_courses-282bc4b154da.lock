      "instructions": "Get Mandatory Training's catalogue server: the online CPR, AED and first aid courses offered in a person's country, their certificate prices, what each covers, and our wording on whether an employer will accept the certificate. Rules: Ask for, or confirm, the person's country before listing courses, and pass it as country. Give the employer_acceptance wording exactly as the tools return it; don't shorten it into a yes, strengthen it, or say the certificate meets a requirement. State no price except what a tool result shows. To enrol, send the person to the course's url; they enter and confirm their own details there. Give no medical advice; the courses are education, and in an emergency the person should call their local emergency number.",
      "tools": [
        {
          "name": "employer_acceptance",
          "title": "Will my employer accept this?",
          "description": "Our wording, for a country, on whether an employer will accept a certificate from these online courses. Whether a certificate is enough is up to the employer or licensing body; give the person this wording as it is.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Two-letter country code, e.g. NZ, GB (or UK), CA, US. Optional: the United States when omitted.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "type": "string"
              },
              "employer_acceptance": {
                "items": {
                  "type": "string"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["country", "employer_acceptance"],
            "type": "object"
          },
