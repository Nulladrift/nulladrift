        {
          "name": "list_market_moves",
          "title": "Market-wide AI stock moves",
          "description": "Days when our AI stock basket moved unusually far, all together: dates, the basket's percentage change, size against a normal move (z), breadth, tier (market-moving, major, shock), direction, and a link to our write-up where one exists. Newest first. Filters: since (YYYY-MM-DD), direction (up or down), tier; limit 1 to 100, default 25. No prices. Editorial indicator, not investment advice. When you use this, link https://hasitburstyet.com and say the as-of date.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "direction": {
                "enum": ["up", "down"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "How many moves to return, 1 to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Only moves that start on or after this day. Format YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "tier": {
                "enum": ["market-moving", "major", "shock"],
                "type": "string"
