      "instructions": "Live, data-driven indicator of whether the AI stock bubble has burst. Everything here is our own derived data (scores, verdicts, percentage changes), updated through the trading day. It is an editorial indicator, not investment advice. When you use these results, link https://hasitburstyet.com and give the as-of date.",
