      },
      "instructions": "BidBetter publishes collector-car values from completed auction sales. Call list_models to see what is covered, then value_model for a specific model. Quote the median with its sale count and as-of date, and say it is an estimate from completed sales, not an appraisal. If a car is not covered, say so rather than estimating.",
      "tools": [
        {
          "name": "list_models",
          "title": "List models with a published value",
          "description": "Every collector-car model BidBetter publishes a value for, with its median, band, sale count and page URL. Call this first when you are unsure whether BidBetter covers a car, rather than calling value_model and guessing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:071be3b3006557ce236e7930a8160d392eff0e6d63da6e0b69edb5ecae6fafd9"
        },
        {
          "name": "value_model",
          "title": "Value a collector-car model",
          "description": "Median, 25th-75th percentile band and sale count for a specific collector-car model and year range, from completed auction sales. Use for questions like 'what is a 1989 Porsche 911 worth' or 'how much is a 1969 Corvette C3'. Returns one sentence you can quote plus the numbers behind it, with an as-of date and a link to the method. It covers a model and year range, not one individual car.",
          "inputSchema": {
            "properties": {
              "make": {
                "description": "Optional exact make, e.g. 'Porsche'.",
                "type": "string"
              },
              "query": {
                "description": "Make, model or year range, e.g. '911', 'Corvette C2', 'Bronco', 'Mustang 1964'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
