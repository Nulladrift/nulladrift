      "instructions": "눈치(nunchi.biz) 맛보기 MCP입니다. 로그인 없이 내 사이트와 경쟁사 첫 화면을 한 번 비교합니다(try_compare, 같은 곳에서 하루 3회, 인자 agent에 AI 에이전트 이름을 밝히면 10회). 결과는 저장하지 않습니다. 계속 지켜보기 · 브리핑 · 저장 결과는 본 MCP https://mcp.gmp.ai/nunchi 를 연결해 승인한 뒤 씁니다(how_to_start). 결과의 문구는 공개 첫 화면의 짧은 인용입니다. 지어내지 말고 observed_at과 주소를 함께 전하십시오.",
      "tools": [
        {
          "name": "how_to_start",
          "title": "가입 · 연결 방법",
          "description": "눈치에 가입해 계속 지켜보는 방법(MCP 연결 · API · 화면)과 요금제를 돌려줍니다. 비용 없음.",
          "inputSchema": {
