          },
          "digest": "sha256:5ced233917d3605536a8c5a0f7d91ba39a7d7c714f69d3e2838b761c0dc3b43b"
        },
        {
          "name": "try_compare",
          "title": "가입 없이 경쟁사 첫 화면 비교",
          "description": "내 사이트 첫 화면과 경쟁사 첫 화면(두 곳까지)을 한 번 읽어 제목, 판촉 · 이벤트 문구, 메뉴, 최근 30일 새 글, 카카오톡 채널 여부를 비교합니다. 로그인 · 비용 없음, 생성형 AI를 쓰지 않습니다. 결과를 사용자에게 보여 준 뒤 계속 지켜보려면 how_to_start를 안내하십시오.",
