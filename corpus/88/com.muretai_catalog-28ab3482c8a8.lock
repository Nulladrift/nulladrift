{
  "lockfileVersion": 2,
  "subjects": {
    "com.muretai/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://catalog.muretai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "muretai-catalog",
        "version": "268f3d14b3369197157de60ec38fd162d8ff684b"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Muretai Catalog is an index of independent online shops, built from public data; most listed shops are not Muretai customers and have no relationship with Muretai. Use catalog.search to find which shops sell a product. Query with one or two product nouns (\"teapot\", \"wool socks\"), not a sentence, and use the max_price and in_stock filters instead of putting a price or stock words in the query. Prices and stock are as the catalog last read them: each row carries last_read and each shop's products carry verified_at, so say when a price was read and do not present an old price as current. To cite a result, give the shop's name and link its product page (the permalink) or its origin. You cannot buy or pay through this catalog, so never claim you can buy something for the user; send them to the shop's own page. When an answer carries model_note, read it before you answer.",
      "tools": [
        {
          "name": "catalog.search",
          "title": "Search independent shops",
          "description": "Search shops that publish a signed Agent Card, plus shops listed from public data (provenance \"unclaimed\": search-only, no door). Shops are listed by how well their PRODUCTS match, best first; demo stores, wholesalers, off-topic sellers and non-shop sites (reviews, how-to, repair, coupons, with no known price) are left out and counted in `filtered`. Each result gives the shop's origin, DID, Agent Card URL and its best matching products (name, price, link, image when the shop is signed or claimed), so an agent can go straight to that shop's Agent Entry with a signed request. Without `limit` the answer is the top 5 shops with 3 products each (`more` says how many further shops matched); pass `limit` for more shops, or use GET /catalog/search for the full rows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "in_stock": {
                "description": "true: only in-stock products, and only shops that have one.",
                "type": "boolean"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Keep products whose known price (a fixed price, or the low end of a range) is at most this, in the shop's currency. A product with an unknown price never passes.",
                "type": "number"
              },
              "q": {
                "description": "Words to match in shop cards and products.",
                "type": "string"
              },
              "sort": {
                "description": "\"price\": each shop's products cheapest first, unknown prices last.",
                "enum": ["price"],
                "type": "string"
              },
              "tags": {
                "description": "Keep shops whose card skills carry ALL of these tags.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "unfiltered": {
                "description": "Operators only. true: also list the shops the relevance filters leave out (demo/sample stores, wholesalers, off-topic sellers, non-shop sites); `filtered` counts them otherwise.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f5864a9c6a7ee089c64bc8ef791b00817a9c17498121e8683e6ab8203cea8baa"
        }
      ],
      "digest": "sha256:8a4dea2292bc639449fbdd8307f4bc24317f7dc150fe4133a7b1c59c001a3bc5"
    }
  }
}
