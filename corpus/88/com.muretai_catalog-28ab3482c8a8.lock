{
  "lockfileVersion": 2,
  "subjects": {
    "com.muretai/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://catalog.muretai.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "muretai-catalog",
        "version": "f9b7353c0a81084144cf9ebd08aad0266f4a5447"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Muretai Catalog is an index of independent online shops, built from public data; most listed shops are not Muretai customers and have no relationship with Muretai. Use catalog.search to find which shops sell a product. Query with one or two product nouns (\"teapot\", \"wool socks\"), not a sentence, and use the max_price and in_stock filters instead of putting a price or stock words in the query. Prices and stock are as the catalog last read them: each row carries last_read and each shop's products carry verified_at, so say when a price was read and do not present an old price as current. To cite a result, give the shop's name and link its product page (the permalink) or its origin. You cannot buy or pay through this catalog, so never claim you can buy something for the user; send them to the shop's own page. When an answer carries model_note, read it before you answer.",
      "tools": [
        {
          "name": "catalog.get_product",
          "title": "Get one product",
          "description": "Return one stored product of one indexed shop, chosen by the shop's origin (https://shop.example, or any page URL on it) and the product's permalink, or its sku where the catalog shows one. The answer is the same JSON as that product's entry in GET /catalog/shop/products.json?origin=<origin>: name, price, currency, stock, link and when the catalog read it. Stored data only: nothing is fetched. An unknown shop or product is refused by name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "origin": {
                "description": "The shop's origin or a page URL on it (http or https).",
                "type": "string"
              },
              "permalink": {
                "description": "The product page URL, exactly as the catalog lists it.",
                "type": "string"
              },
              "sku": {
                "description": "The product's sku, where the catalog's entry shows one.",
                "type": "string"
              }
            },
            "required": ["origin"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2744f516e930c6c8503e4086a11187058898290bbfd88bc35b9e1860fa409195"
        },
        {
          "name": "catalog.lookup",
          "title": "Look up one shop",
          "description": "Return the catalog record of one indexed shop, from its origin (https://shop.example) or from any page URL on it, such as a product link. The record is the same JSON as GET /catalog/shop?origin=<origin>: name, provenance, DID and Agent Card URL when signed or claimed, and when the catalog last read it. Stored data only: nothing is fetched. A host the catalog has not indexed is refused by name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "The shop's origin or a page URL on it (http or https).",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a99f4c6dd182700ec207e2a205dfa9f4afc786b5cf57f13f5dc986fa4378f87a"
        },
        {
          "name": "catalog.search",
          "title": "Search independent shops",
          "description": "Search shops that publish a signed Agent Card, plus shops listed from public data (provenance \"unclaimed\": search-only, no door). Shops are listed by how well their PRODUCTS match, best first; demo stores, wholesalers, off-topic sellers and non-shop sites (reviews, how-to, repair, coupons, with no known price) are left out and counted in `filtered`. Each result gives the shop's origin, DID, Agent Card URL and its best matching products (name, price, link, image when the shop is signed or claimed), so an agent can go straight to that shop's Agent Entry with a signed request. Without `limit` the answer is the top 5 shops with 3 products each (`more` says how many further shops matched); pass `limit` for more shops, or use GET /catalog/search for the full rows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO 4217 price currency for max_price; defaults to USD. Ignored without max_price.",
                "type": "string"
              },
              "in_stock": {
                "description": "true: only in-stock products, and only shops that have one.",
                "type": "boolean"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Keep products whose known price (a fixed price, or the low end of a range) is at most this, in currency (default USD). Zero or unknown prices and other or unknown currencies never pass; no conversion.",
                "type": "number"
              },
              "q": {
                "description": "Words to match in shop cards and products.",
                "type": "string"
              },
              "sort": {
                "description": "\"price\": each shop's products cheapest first, unknown prices last.",
                "enum": ["price"],
                "type": "string"
              },
              "tags": {
                "description": "Keep shops whose card skills carry ALL of these tags.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "unfiltered": {
                "description": "Operators only. true: also list the shops the relevance filters leave out (demo/sample stores, wholesalers, off-topic sellers, non-shop sites); `filtered` counts them otherwise.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8eaa1c7db5597e30d7f27329b8e307760d57e7b4090b829e2c0a8add3e3bd6f"
        }
      ],
      "digest": "sha256:0e4feb861f11b45794abdd3b91874d95f11bbbb41ff5a05229dbf1f3c21d1e34"
    }
  }
}
