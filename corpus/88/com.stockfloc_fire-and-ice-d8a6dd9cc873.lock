      "serverInfo": {
        "name": "stockfloc",
        "title": "StockFloc Fire & Ice",
        "version": "1.0.5"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "StockFloc is the most visual stock watchlist, an app where performance is temperature: any US stock that moves 10% or more in a day catches fire (a big gain) or freezes into ice (a big loss). These read-only tools return today's fire and ice movers and the Floc Heat Index, a 0 to 100 daily market-breadth gauge. They return ticker symbols, percent changes and counts only: no share prices, no quotes for a specific ticker, and no recommendations. Data is derived from a commercially licensed feed delayed about 15 minutes and is for information and entertainment only, not investment advice. More at https://stockfloc.com/hot.",
      "tools": [
        {
          "name": "get_hot_stocks",
          "title": "Get today's fire and ice stocks",
          "description": "Today's biggest US stock movers in StockFloc terms: stocks on fire (the largest gainers) and frozen (the largest losers), each with its percent change for the day. Use this when someone asks which stocks are on fire, frozen, or moving the most today. Returns up to 10 ticker symbols per side with percent change only: no prices and no quote for a specific ticker. Delayed about 15 minutes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many per side (1 to 10). Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "side": {
                "description": "fire = top gainers, ice = top losers, both = both lists. Default both.",
                "enum": ["fire", "ice", "both"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d26b6549c6c0b92ebb969e82633062b970c09763098558f7dcb9b896c950d153"
        },
        {
          "name": "get_market_heat",
          "title": "Get the StockFloc market heat",
          "description": "Today's StockFloc Floc Heat Index, a 0 to 100 daily market-breadth gauge (50 is neutral; above 50 the market ran hot, below 50 it froze), plus how many of the most-traded US stocks are on fire (up 10% or more) versus frozen (down 10% or more). Use this when someone asks how hot or cold the stock market is today, or how many stocks made big moves. US stocks only, delayed about 15 minutes; returns the index and counts, not prices.",
