{
  "lockfileVersion": 2,
  "subjects": {
    "com.struxurenorcal.walnbot/struxure-knowledge-base": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://walnbot.struxurenorcal.com/mcp/information"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Walnbot.Mcp",
        "version": "1.0.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {}
      },
      "tools": [
        {
          "name": "contact",
          "description": "This is for Norcal to contact the client in case they have additional questions",
          "inputSchema": {
            "properties": {
              "what_is_your_email_address": {
                "description": "What is your email address?",
                "type": "string"
              },
              "what_is_your_name": {
                "description": "What is your Name?",
                "type": "string"
              },
              "where_may_we_call_or_text_you": {
                "description": "Where may we call or text you?",
                "type": "string"
              }
            },
            "required": ["what_is_your_name", "where_may_we_call_or_text_you"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a2e2f9ea25e39a7d2325dd6ae4076e8c649af9020f9f2bf6cf0f6c36ab4bd1d"
        },
        {
          "name": "faq",
          "description": "Answer a question from this knowledge base's FAQ content. Returns the closest-matching FAQ passages, not extracted answers — for a customer reporting that something is broken, `troubleshoot` returns the resolution itself.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The question to answer from the FAQ.",
                "type": "string"
              },
              "topK": {
                "default": 8,
                "description": "Maximum number of results to return (1–20).",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d916b48689a3c4905095e8118131600bca24cd43cdf2481ad6cd76f4aaed7427"
        },
        {
          "name": "get_product",
          "description": "Look up one product by name, as returned by list_products, with a short excerpt of the page describing it and any documents the business has attached to it — an installation guide, a spec sheet. Those attachments are the authoritative answer to \"where are the instructions for X\": when the list is empty, no document is on file, and searching for one will only turn up a different product's manual. If no such product exists this says so plainly and suggests the nearest names — treat that as authoritative too: the business does not offer it.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The product name, exactly as returned by list_products. Matching is case-insensitive.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:98e507547283d3e325436b913b2266509751cfe825759ea14559e9d988db7a84"
        },
        {
          "name": "get_service",
          "description": "Look up one service by name, as returned by list_services, with a short excerpt of the page describing it. If no such service exists this says so plainly and suggests the nearest names — treat that as authoritative: the business does not offer it.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The service name, exactly as returned by list_services. Matching is case-insensitive.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fc2107c8ebbaac6c6890796f95a99bead5f05b7e4a410f743d985f84f51402f6"
        },
        {
          "name": "list_products",
          "description": "List this business's products from its extracted catalogue. This is a complete, enumerable list with a total count — unlike `products`, which is a semantic search returning only the closest matches. Use `filter` to narrow by name and `offset` to page.",
          "inputSchema": {
            "properties": {
              "filter": {
                "default": null,
                "description": "Optional words to narrow the list; case-insensitive. Each word must appear in the name or summary, in any order — so fewer, more distinctive words match more. Omit it to list the whole catalogue.",
                "type": ["string", "null"]
              },
              "limit": {
                "default": 25,
                "description": "How many to return (1-100). Default 25.",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "How many to skip. Pass the nextOffset from the previous call to get the next page.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6b0db491cbd117cec68a8bc8d36f46c567fe39bf0501241448f6e40260920e8a"
        },
        {
          "name": "list_services",
          "description": "List this business's services from its extracted catalogue. This is a complete, enumerable list with a total count — unlike `services`, which is a semantic search returning only the closest matches. Use `filter` to narrow by name and `offset` to page.",
          "inputSchema": {
            "properties": {
              "filter": {
                "default": null,
                "description": "Optional words to narrow the list; case-insensitive. Each word must appear in the name or summary, in any order — so fewer, more distinctive words match more. Omit it to list the whole catalogue.",
                "type": ["string", "null"]
              },
              "limit": {
                "default": 25,
                "description": "How many to return (1-100). Default 25.",
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "How many to skip. Pass the nextOffset from the previous call to get the next page.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bf9db3757d558da7d6d8eea5812d49c2c5e03c8d148ad9a73617baeee56e83cf"
        },
        {
          "name": "products",
          "description": "Find products relevant to a natural-language query. Returns the closest matches, not a complete catalogue — use `list_products` for the complete catalogue.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What the user wants — describe the product they're looking for.",
                "type": "string"
              },
              "topK": {
                "default": 8,
                "description": "Maximum number of results to return (1–20).",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96f05828600f41aacceba41658cc5cd9b9252e56b9fadea782236ad553bf1cd0"
        },
        {
          "name": "search",
          "description": "Search this knowledge base for content relevant to a natural-language query. Returns the closest-matching snippets with their source, not an exhaustive list.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "The natural-language query to search for.",
                "type": "string"
              },
              "topK": {
                "default": 8,
                "description": "Maximum number of results to return (1–20).",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1d5310e013c6bd9c94beceacd3e092bce51e7adbeb5c16e8fba0241086a49caa"
        },
        {
          "name": "services",
          "description": "Find service offerings relevant to a natural-language query. Returns the closest matches, not a complete list — use `list_services` for the complete catalogue.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What the user wants — describe the service they're looking for.",
                "type": "string"
              },
              "topK": {
                "default": 8,
                "description": "Maximum number of results to return (1–20).",
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:25b70fe5c9a63be6af325e3510fdd68c0aca6209987d2c883de98ff5e0a79a08"
        },
        {
          "name": "troubleshoot",
          "description": "Find the resolution for a problem a customer is reporting, or the answer to a question they asked, from question-and-answer pairs extracted out of this business's FAQ pages and installation guides. Use this the moment a customer reports that something is wrong or does not work — it returns the actual fix rather than a passage that mentions the part, which is what `search` and `faq` would give you. Pass their words through unchanged. An empty result with a non-zero total means this business has troubleshooting material and none of it covers this, which you can say plainly.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 3,
                "description": "How many to return (1-10). Default 3.",
                "type": "integer"
              },
              "problem": {
                "description": "The problem in the customer's own words, or the question they asked. Pass it through as they said it — the match is on their vocabulary, so rephrasing it into the manual's terms makes it worse, not better.",
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c833dadfec70d5a3e82eeb18a8d7eda2462f7e30eb4082215b1836510651f6a"
        }
      ],
      "digest": "sha256:36fcb770cc519f4083bf1031a1b14c1e904c7c9275dc7b3c72625830f1e8811c"
    }
  }
}
