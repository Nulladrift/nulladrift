                "type": "integer"
              },
              "tier": {
                "enum": ["base", "mid", "top"],
                "type": "string"
              },
              "timeoutMs": {
                "maximum": 300000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["action", "code", "name", "seatKey"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:17a767b01ff8b961eec5cee78b760fd7005acf41510c3fe3fbe7f623390b9243"
        }
      ],
