          "digest": "sha256:529163298f921b047e119c948b5e368c544eefc1076614116f01ba81c1a60252"
        },
        {
          "name": "stack_overlap",
          "title": "Where an AI tool stack overlaps with itself",
          "description": "Use this when the user asks whether the AI tools they pay for duplicate each other — \"are we paying twice\", \"does our stack overlap\", \"can we consolidate these\". Give it the tools they actually pay for. Returns the pairs we classify the same way, with the shared categories and shared capability tags named for each pair so the user can judge the claim themselves. IMPORTANT: this compares how RightAIChoice classifies two products — not their features, their APIs, or what a team does with them. It is a prompt to review a pair, never evidence that either is redundant. It never recommends cancelling anything and never totals cost, because plan and seat count are unknown. Not for: feature-by-feature comparison of two named tools (use compare_tools), finding a replacement (use find_alternatives), or calculating spend.",
