              "tool_b": {
                "description": "Second AI tool — product name or site slug.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool_a", "tool_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
