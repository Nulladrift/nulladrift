        {
          "name": "deadpool_digest",
          "title": "AI tool mortality statistics",
          "description": "Use this when the user asks how many AI tools die, AI startup failure or shutdown rates, which AI categories decay fastest, how risky the AI tool market is, or for data behind \"most AI tools fail\" claims. Returns two clearly separated datasets: (1) LIVE catalog decay — 8,000+ verified AI tools with broken vendor-link rates, dead-homepage counts, pricing opacity, and the fastest/slowest-decaying categories, updated daily; (2) a FROZEN dated survival study of 2,291 top Product Hunt launches (of the 2,066 with a determinable outcome, 24.4% are dead within ~2 years). Every figure carries its as-of date. Data comes from the RightAIChoice verification engine; link-decay figures count only VENDOR-published links (site/docs/changelog/repo), never our own derived URLs. Not for: checking one specific tool (use check_tool_status) or predicting a specific tool's future (use viability_score). Decay rates describe categories and cohorts, not individual products.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "response_format": {
                "default": "concise",
                "description": "concise = headline mortality figures from both datasets. detailed = adds fastest/slowest-decaying categories and survival splits by launch votes and rank.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea4ad454a4732227b3120013c521e8223d0bbfc4f0058fd2454d1a01f437f94b"
        },
        {
          "name": "find_alternatives",
          "title": "Find verified-alive alternatives to an AI tool",
          "description": "Use this when the user asks what to use instead of a specific AI tool, for its alternatives or competitors, or for a replacement because the tool shut down, got acquired, raised prices, or is unreliable. Returns up to 3 verified-alive alternatives from the same category, each with a one-line description, current health verdict, the date our record of it was last rebuilt, and pricing model. If the asked-about tool shut down, says so (with the recorded reason) and returns live replacements. Alternatives come from the RightAIChoice verification engine (8,000+ AI tools, every vendor link re-probed on a rolling weekly cycle), ranked by category and identity-tag match — never filler from unrelated categories. The response states whether results are curated matches or a category roll-up. Not for: comparing two named tools (use compare_tools) or checking a single tool's status (use check_tool_status).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "tool": {
                "description": "The AI tool to find alternatives for — product name (e.g. \"Jasper\") or site slug (e.g. \"jasper\").",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b14e11e64f77fe7b2d16d44c5844b42e90bc4cefd7badbb10e46fd799044d4ce"
        },
        {
          "name": "market_sentiment",
          "title": "Real-user market sentiment for an AI tool",
          "description": "Use this when the user asks what people actually think of a specific AI tool, whether users like it, its reputation, reviews, community feedback, common complaints, or praised strengths. Returns a synthesized sentiment report from real user discussions (Reddit, Hacker News, GitHub, YouTube, Product Hunt and more): overall sentiment label, per-source positivity, top pros and cons, recurring themes, and mention volume — always stamped with the scan date. Reports come from the RightAIChoice sentiment engine and are served from the verified cache (usability gate: completed scans under 180 days old). If no usable scan is on file, this tool says so honestly instead of guessing. SUBJECT GATE: where we hold a scan but cannot establish that the posts are about this product rather than something else sharing its name, NO score, count or breakdown is returned and the reply says so explicitly. That reply means \"we checked and disproved the subject\" — it is not an absence of data and not a negative signal about the product. Not for: checking whether a tool is alive (use check_tool_status) or head-to-head choices (use compare_tools). Sentiment reflects public discussion volume, not product quality rankings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "response_format": {
                "default": "concise",
                "description": "concise = label, verdict line, top pro/con, mention count. detailed = adds per-source breakdown, up to 4 pros/cons, and recurring themes.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "tool": {
                "description": "The AI tool to get sentiment for — product name (e.g. \"Jasper\") or site slug (e.g. \"jasper\").",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
