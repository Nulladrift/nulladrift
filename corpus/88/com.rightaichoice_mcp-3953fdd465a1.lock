        {
          "name": "check_tool_status",
          "title": "Check if an AI tool is alive",
          "description": "Use this when the user asks whether a specific AI tool is alive, dead, shut down, still maintained, safe to adopt, or trustworthy — or asks for its current health, viability, or verification status. Returns a verified verdict (healthy / monitor / at-risk / shut down / delisted) with evidence: link-health probe results, a 5-signal viability assessment, real-user market sentiment, pricing reality, and verified-alive alternatives. Data comes from the RightAIChoice verification engine: 8,000+ AI tools with every vendor link re-probed on a rolling weekly cycle. Every answer states BOTH dates it stands on and does not merge them: when we last probed the vendor links (what the verdict is built on) and when our catalog record was last rebuilt. Not for: tools outside the AI/software space, historical company research, or legal/financial advice. \"Not in the catalog\" and a verdict of UNKNOWN are DIFFERENT answers: the first means we hold no entry, the second means we hold one whose signals are not measured yet. Neither is evidence the tool is dead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "response_format": {
                "default": "concise",
                "description": "concise = verdict + freshness + source link. detailed = adds viability signals, link health, sentiment, pricing, and alternatives.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "tool": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "items": {
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  }
                ],
                "description": "The AI tool to check — product name (e.g. \"Jasper\") or site slug (e.g. \"jasper\"). Pass an ARRAY of up to 20 names to assess a whole stack at once."
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:abaad1e3d7b1d41105396e294b0d29b8e8cd619e5beeb83678063c4c140e25a3"
        },
        {
          "name": "compare_tools",
          "title": "Compare two AI tools head-to-head",
          "description": "Use this when the user asks how two specific AI tools compare, which of two tools to choose, or \"X vs Y\". Returns live verification status for BOTH tools side by side (alive/at-risk/shut-down verdict, the vendor-link probe date AND the separate catalog-rebuild date, pricing reality, market sentiment) plus an editorial head-to-head verdict when a reviewed comparison exists for the pair. Data comes from the RightAIChoice verification engine: 8,000+ AI tools with every vendor link re-probed on a rolling weekly cycle, and 19,000+ maintained comparison analyses. Not for: single-tool checks (use check_tool_status), comparing more than two tools, or category browsing. If either tool is reported as not in the catalog, that is not evidence it is dead.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "response_format": {
                "default": "concise",
                "description": "concise = per-tool verdict + pricing + editorial verdict. detailed = adds sentiment, viability signals, and link health per tool.",
                "enum": ["concise", "detailed"],
                "type": "string"
