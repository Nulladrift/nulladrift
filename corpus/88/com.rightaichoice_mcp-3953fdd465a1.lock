        {
          "name": "best_for",
          "title": "The best AI tools for a topic, ranked",
          "description": "Use this when the user asks for the best AI tools for a task, niche or category — \"best AI meeting notes tools\", \"top AI video editors\", \"what should I use for logo design\". Returns our ranked list for the topic: the same ranking our \"Best AI tools for X\" pages use — topic match, real-user mentions, how often AI engines read each tool, and viability, with a founder-reviewed consensus list as a sanity gate. A #1 is named ONLY when the leader clears that gate; otherwise the answer says no single top pick is warranted. Every tool carries its pricing model, viability score and page. Not for: a single named tool (use check_tool_status), two named tools (compare_tools), or a described need with hard filters (recommend_tools).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many tools to return (3–15, default 10).",
                "maximum": 15,
                "minimum": 3,
                "type": "integer"
              },
              "topic": {
                "description": "The task, niche or category — e.g. \"meeting notes\", \"video editing\", \"customer support chatbots\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b4dc5bd368d201c2ce7ae69f154abc7e39005e85b2d74753ffee828141adfbd6"
        },
        {
          "name": "category_landscape",
          "title": "The risk landscape of an AI tool category",
          "description": "Use this when the user asks what a whole category of AI tools looks like — how crowded it is, how healthy or risky it is overall, which tools in it are strongest, or which are in trouble. Examples: \"how risky is the AI video generation market\", \"what does the code assistant category look like\". Returns the number of tools we track in that category, how they distribute across survival bands, the category's vendor-link decay rate, and named examples at both the strongest and weakest ends — each with its own survival score and the date our record of it was last rebuilt. Categories are our own classification and tools belong to several at once, so category sizes overlap and never sum to the catalog total. Bands classify risk, not quality — the model has no notion of company size. Not for: choosing between named tools (use compare_tools), finding a tool for a job (use recommend_tools), or market-wide mortality statistics (use deadpool_digest).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "The category, in plain words or as a slug — e.g. \"image generation\", \"code-development\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise = size, distribution and the strongest few. detailed = adds the weakest end and the decay rate.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d16e7e1a166392f72b3afab07494192723499ff2808327f3c2836b18e3f777db"
