          },
          "digest": "sha256:6c6913e0f5c43211b6d3f874cd000d9380a486fdd9606123d31a43384fe414a1"
        },
        {
          "name": "pricing_reality",
          "title": "What an AI tool really costs",
          "description": "Use this when the user asks what a specific AI tool costs, its pricing model, plans and tiers, whether it has a free tier, hidden costs, or whether the vendor even publishes prices. Returns the recorded pricing model, per-plan prices exactly as the vendor lists them, and — unique to this catalog — documented HIDDEN COSTS: annual-commitment markups, seat minimums, paywalled features, and undisclosed usage fees. Data comes from the RightAIChoice verification engine (8,000+ AI tools re-verified on a rolling weekly cycle). The response distinguishes \"the vendor publishes no prices\" (their choice — sales call required) from \"not recorded in our catalog\" (our gap), and never converts currencies. Not for: negotiating quotes, historical price tracking, or financial advice. Prices change frequently — treat the verification date as part of the answer.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "response_format": {
                "default": "concise",
                "description": "concise = pricing model + plan prices + top 2 hidden costs. detailed = full plan list with key features and up to 6 hidden costs.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "tool": {
                "description": "The AI tool to get pricing for — product name (e.g. \"Jasper\") or site slug (e.g. \"jasper\").",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
