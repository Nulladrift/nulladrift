        {
          "name": "viability_score",
          "title": "How likely an AI tool is to survive",
          "description": "Use this when the user asks whether a specific AI tool is safe to adopt or build on, likely to still exist next year, well-maintained, gaining or losing momentum — or asks about its long-term viability or abandonment risk. Returns a viability BAND (safe bet / moderate / at risk) with the five measured drivers behind it: what the vendor publishes, site health, traction, user sentiment, and recent activity — plus which signal is weakest and why, in plain language. Assessments come from the RightAIChoice verification engine (8,000+ AI tools, every vendor link re-probed on a rolling weekly cycle). A null driver means \"not yet measured\", which is different from a bad score. Bands are NOT a leaderboard: they classify risk, they do not rank tools against each other. Not for: comparing two tools (use compare_tools), liveness checks alone (use check_tool_status), or investment decisions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "tool": {
                "description": "The AI tool to assess — product name (e.g. \"Jasper\") or site slug (e.g. \"jasper\").",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f99a8870082b9851f96b3e18fa992cd7a1d145bb849847be623f35c33e462c2d"
        },
        {
          "name": "whats_changed",
          "title": "What changed in the AI tool market",
          "description": "Use this when the user asks what has changed recently in AI tools — whether a specific tool has changed its pricing, links, domain or health, or what has moved across the market since a given date. Returns dated, field-level changes we actually observed: vendor pricing-page edits, recorded price changes, link health moving, domain and certificate changes, and vendors moving their site. Each carries the date we observed it and how. Reports only VENDOR-OBSERVABLE changes by default — our own editorial rewrites are excluded and the response says so, because our writing changing is not the market moving. Our change record begins on a fixed date stated in every answer; asking about an earlier period returns that date rather than an empty result. Not for: predicting future changes, or a tool's current status (use check_tool_status).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include": {
                "default": "vendor_changes",
                "description": "vendor_changes = only what the vendor did. vendor_and_our_assessment = also our survival re-scores. Our editorial rewrites are never included.",
                "enum": ["vendor_changes", "vendor_and_our_assessment"],
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise = counts plus the most notable changes. detailed = the individual dated changes.",
                "enum": ["concise", "detailed"],
                "type": "string"
              },
              "since": {
