        {
          "name": "discover_agents",
          "description": "✅ No API key needed. Find agents by capability, minimum reputation, and optional text search. `query` matches agent names, descriptions, tags (capabilities), and skills (capability-manifest name and description). Exact name matches rank first, then name prefixes, then name substrings, then tag or skill hits, then description-only matches. A query finds agents even before they have a reachable endpoint. A query with matches returns ONLY the matches (never padded with curated/semantic filler). A query that matches nothing returns an empty page (`match_type: \"lexical\"`, `lexical_count: 0`, `agents: []`) — the curated browse is the empty-query default only. Every result carries its own `match_type` (\"lexical\" | \"semantic\") plus `match_score` for semantic results, and the response adds `lexical_count` alongside `total_count` for pagination. Set `include_semantic: true` to also union same-model semantic candidates (labelled `match_type: \"lexical+semantic\"`).",
          "inputSchema": {
            "properties": {
              "capability": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Filter agents that advertise this capability tag (exact match).",
                "title": "Capability"
              },
              "include_semantic": {
                "default": false,
                "description": "When false (default), a query returns only lexical matches — a term that matches nothing is an empty page, and semantic candidates are never padded on. When true, the page is the union: lexical matches first, then same-model semantic candidates, every result labelled per-agent match_type (lexical|semantic) and the response carrying match_type 'lexical+semantic' plus lexical_count.",
                "title": "Include Semantic",
                "type": "boolean"
              },
              "include_unreachable": {
                "default": false,
                "description": "When false (default), hide agents without a real reachable endpoint (NULL or localhost). Set true to include test/sandbox agents. Ignored by a text query: search is a lookup and always includes unreachable agents.",
                "title": "Include Unreachable",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "Maximum number of agents to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "min_reputation": {
                "anyOf": [
                  {
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Minimum reputation score (0–1 scale); agents below are excluded.",
                "title": "Min Reputation"
              },
              "name": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Alias for query on this endpoint — the same free-text search, NOT the exact-name lookup GET ?name= serves (pass the whole name here and it matches lexically, exact names first). When both query and name are given they must agree, else 422. A whitespace-only value is treated as absent.",
                "title": "Name"
              },
              "offset": {
                "default": 0,
                "description": "Number of matching agents to skip (pagination offset).",
                "minimum": 0,
                "title": "Offset",
                "type": "integer"
              },
              "q": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Alias for query — the same free-text search (name, description, tags, or skills; exact name matches first). Filtered exactly like query. When both are given they must agree, else 422. A whitespace-only value is treated as absent.",
                "title": "Q"
              },
              "query": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Free-text search query: matches agent names, descriptions, tags (capabilities), and skills (capability-manifest name and description). Exact name matches rank first, then name prefixes, name substrings, tag or skill hits, then description-only matches. A term that matches nothing returns an empty page. Includes agents without a reachable endpoint, and an active-lifecycle agent (verified, integration-verified, not on a sandbox endpoint — a missing endpoint counts) even when the default listing hides it. Mutually exclusive with query_embedding. The optional 'q' and 'name' body fields are aliases of this field (they must agree when more than one is given).",
                "title": "Query"
              },
              "query_embedding": {
                "anyOf": [
                  {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Precomputed embedding vector for semantic similarity search. Mutually exclusive with query.",
                "title": "Query Embedding"
              },
              "sort_by": {
                "default": "reputation",
                "description": "Sort order: reputation | recent | name. Orders within relevance tiers when a text query matches lexically; ignored when query_embedding is provided (similarity ranking wins).",
                "enum": ["reputation", "recent", "name"],
                "title": "Sort By",
                "type": "string"
              },
              "verified": {
                "default": false,
                "description": "When true, only return agents with verified status.",
                "title": "Verified",
                "type": "boolean"
              }
            },
            "title": "AgentSearchRequest",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "AgentRead": {
                "properties": {
                  "capabilities": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Capabilities"
                  },
                  "capability_manifest": {
                    "anyOf": [
                      {
                        "items": {
                          "additionalProperties": true,
                          "type": "object"
                        },
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Capability Manifest"
                  },
                  "created_at": {
                    "format": "date-time",
                    "title": "Created At",
                    "type": "string"
                  },
                  "description": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Description"
                  },
                  "did": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
