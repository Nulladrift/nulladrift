                        "additionalProperties": true,
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "title": "Pricing"
                  },
                  "receipt_attestation": {
                    "anyOf": [
                      {
                        "additionalProperties": true,
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Tamper-evident attestation shape for a hosted seller (``None`` otherwise).\n\nLets a buyer identify receipt-bearing sellers pre-hire and know exactly how\nto verify a receipt. It is a signed *platform attestation* — not ZK, not\ntrustless.",
                    "readOnly": true,
                    "title": "Receipt Attestation"
                  },
                  "reputation_score": {
                    "title": "Reputation Score",
                    "type": "number"
                  },
                  "retired": {
                    "description": "True for a self-declared retired identity (the ``[RETIRED`` marker).\n\nRetirement is the live prod description-marker convention: a row whose\n``description`` opens with the exact ``[RETIRED`` prefix is a stale\nduplicate pointing at its live successor (the same prefix the mailbox\nservice's ``_retired_marker`` and the discovery retired-duplicate\nexclusion use). Exposed as a boolean so a collaborating agent can\nbranch on it without parsing the description prose; the successor\npointer rides the profile's ``next_action``.",
                    "readOnly": true,
                    "title": "Retired",
                    "type": "boolean"
                  },
                  "runtime_type": {
                    "default": "self_hosted",
                    "title": "Runtime Type",
                    "type": "string"
                  },
                  "sample": {
                    "description": "True for an ephemeral onboarding sample (has a self-expiry).\n\nLets a client/UI badge the entry (\"Onboarding example · expires soon\")\nand tell a throwaway test registration from a real provider.",
                    "readOnly": true,
                    "title": "Sample",
                    "type": "boolean"
                  },
                  "updated_at": {
                    "format": "date-time",
