      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Crosswire",
        "version": "0.6.1"
      },
      "capabilities": {
        "experimental": {},
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": false
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Crosswire is a pre-trade resolution-truth gate for autonomous cross-venue trading agents. Before an agent hedges two same-looking contracts on different venues, call check_resolution_risk to learn whether they actually settle on the same source / instant / rules — verdict safe / caution / block, with the exact divergence and structured findings. Paid inventory: cross-venue crypto oracle-divergence pairs (e.g. daily matched-strike BTC, Kalshi BRTI vs Polymarket Binance-close) — metered at $0.02 USDC/call after 3 free calls/day. Free demo: World Cup 2026 football pairs (Polymarket/Kalshi), free forever. Call list_covered_events first for valid ids. Advisory only — Crosswire never predicts outcomes, executes, or holds funds; coverage is limited to the frozen identity graph.",
      "tools": [
        {
          "name": "check_resolution_risk",
          "description": "Pre-trade safety check for cross-venue event markets (crypto\noracle-divergence pairs, metered; World Cup football, free). Flags\nresolution mismatches, void-rule divergence, scope differences\n(e.g. 90-minute vs extra-time; matched vs differing strike),\nsettlement-source and -timing gaps, stale data, and thin liquidity\nbetween the two Polymarket and Kalshi legs BEFORE you execute both.\nReturns a machine-readable verdict — execution_verdict:\nsafe / caution / block — inside a full Fungibility & Settlement Audit Object\n(FSAO) with structured findings, top-level divergence flags, venue\nrule overrides, fee-adjusted spread, and verdict reasons. Identify the\npair by EITHER canonical_event_id (a live pair id from\nlist_covered_events — the metered 'crypto:' inventory rolls daily, so\nfetch a current id there rather than reusing an old one; the free 'wc26:'\nWorld Cup pairs are stable) OR market_a + market_b (one Polymarket\nconditionId + one Kalshi ticker, order-insensitive). If the pair is not\ncovered, returns a non-error\ncoverage reply (covered: false) naming the covered inventories (free\nWorld Cup football + metered crypto pairs) and the coverage cutoff\ninstead of an FSAO.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Crosswire API key (cw_…). Optional. Free for the World Cup graph and the first calls/day on metered crypto pairs; beyond that, metered crypto calls draw down this key's prepaid USDC balance (top up via the x402 /v1/credits/topup endpoint)."
              },
              "canonical_event_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A covered pair id — the outcome-suffixed canonical id. Two namespaces: the metered crypto oracle-divergence inventory (shape 'crypto:btc-above:<date>:strike-<n>#above' — $0.02 USDC per call after 3 free calls/day; the daily pair rolls, so fetch a current id from list_covered_events rather than reusing an old one) and the free World Cup football pairs (shape 'wc26:match:<TEAMS>:<date>:result#home|#draw|#away'; the suffix selects the outcome leg-pair). A bare event id without the suffix is ambiguous and only accepted when market_a + market_b are also given to select the leg. Always get live pair ids from list_covered_events."
              },
              "market_a": {
                "anyOf": [
                  {
                    "description": "One outcome leg on one venue (mirrors the REST `AuditRequest` refs).",
                    "properties": {
                      "market_id": {
                        "description": "Venue-native market id: Polymarket conditionId (0x… hex) or Kalshi market ticker (e.g. 'KXWCGAME-26JUN11MEXRSA-MEX').",
                        "type": "string"
                      },
                      "outcome": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "Venue-native outcome label. Optional — pair matching uses only (venue, market_id); when omitted the venue's binary book key ('Yes' on Polymarket, 'yes' on Kalshi) is assumed."
                      },
                      "side": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "'yes' | 'no' if applicable. Optional, informational."
                      },
                      "venue": {
                        "description": "The venue: 'polymarket' or 'kalshi'.",
                        "enum": ["polymarket", "kalshi"],
                        "type": "string"
                      }
                    },
                    "required": ["market_id", "venue"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First leg of the pair to audit (either venue; order does not matter). Provide market_a AND market_b together, or use canonical_event_id instead."
              },
              "market_b": {
                "anyOf": [
                  {
                    "description": "One outcome leg on one venue (mirrors the REST `AuditRequest` refs).",
                    "properties": {
                      "market_id": {
                        "description": "Venue-native market id: Polymarket conditionId (0x… hex) or Kalshi market ticker (e.g. 'KXWCGAME-26JUN11MEXRSA-MEX').",
                        "type": "string"
                      },
                      "outcome": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "Venue-native outcome label. Optional — pair matching uses only (venue, market_id); when omitted the venue's binary book key ('Yes' on Polymarket, 'yes' on Kalshi) is assumed."
                      },
                      "side": {
                        "anyOf": [
                          {
                            "type": "string"
                          },
                          {
                            "type": "null"
                          }
                        ],
                        "default": null,
                        "description": "'yes' | 'no' if applicable. Optional, informational."
                      },
                      "venue": {
                        "description": "The venue: 'polymarket' or 'kalshi'.",
                        "enum": ["polymarket", "kalshi"],
                        "type": "string"
                      }
                    },
                    "required": ["market_id", "venue"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Second leg of the pair to audit (the other venue)."
              },
              "mode": {
                "default": "advisory",
                "description": "'advisory' (default) or 'strict'.",
                "type": "string"
              },
              "notional_usd": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Intended position size in USD. Optional; sizes the thin-liquidity check against live top-of-book depth."
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3eef7a9c73e02360c9bc04a4a4c52ece5984b9e7b67b2f0568df0f365291d63c"
        },
        {
          "name": "list_covered_events",
          "description": "Free discovery of everything check_resolution_risk can audit across\nboth inventories — the free World Cup football pairs and the metered\ncrypto oracle-divergence pairs (the 'crypto:' namespace is the paid\nsurface: $0.02 USDC per call after 3 free calls/day). Returns the\ncovered canonical events, their per-outcome pair ids (…#home / #draw /\n#away for football), the Polymarket conditionIds and Kalshi tickers\nwith outcome labels for each pair, match dates, the frozen ruleset_sha\npinning the identity graph, the coverage kickoff cutoff, and snapshot\nfreshness. Use a returned pair_id (or a pair's two market ids) as input\nto check_resolution_risk.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
