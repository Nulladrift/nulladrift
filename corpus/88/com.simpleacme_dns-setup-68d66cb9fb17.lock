            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc319cee9c6d4f53b2824ca1b90c4619184c5752e8d08a243f580a2dabf467fe"
        },
        {
          "name": "get_service_info",
          "description": "Get public SimpleACME service facts and limitations",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
