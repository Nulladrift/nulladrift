          },
          "digest": "sha256:0561befa6255486651f24308d246b6594b1ea893c06a9892ed05442365643559"
        },
        {
          "name": "get_setup_guide",
          "description": "Get public integration guidance for a supported ACME client",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client": {
                "enum": ["traefik", "win-acme", "certbot"],
                "type": "string"
              }
            },
            "required": ["client"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
