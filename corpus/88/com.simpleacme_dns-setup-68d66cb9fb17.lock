{
  "lockfileVersion": 2,
  "subjects": {
    "com.simpleacme/dns-setup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://simpleacme.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "simpleacme-public-guidance",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public setup guidance only. Never provide passwords or private keys. Tools return placeholder configurations; they do not create domains or change DNS.",
      "tools": [
        {
          "name": "build_client_config",
          "description": "Build placeholder-only client configuration for a public hostname; never supply credentials",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client": {
                "enum": ["traefik", "win-acme", "certbot"],
                "type": "string"
              },
              "domain": {
                "maxLength": 253,
                "type": "string"
              }
            },
            "required": ["client", "domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bcb140c643f1e31b8c9c94844527978e04ac8cf06f6b21c75ea5b3312e09015f"
        },
        {
          "name": "generate_update_script",
          "description": "Generate a placeholder-only Bash or PowerShell DNS update starter; does not run it",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "enum": ["bash", "powershell"],
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
