        "name": "psychologie-et-serenite",
        "title": "Psychologie & Sérénité — catalogue public",
        "version": "1.2.0",
        "description": "Catalogue public en lecture seule : tests psychologiques d'auto-évaluation, blog, livres de psychologie pratique et services (français et anglais). Sans compte ni clé.",
        "websiteUrl": "https://psychologieetserenite.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Catalogue public en lecture seule de Psychologie & Sérénité : 206 tests psychologiques (fiches, lien pour les passer, exemples de rapports), blog, livres (fiches, offres et extraits), Salon Psy, salon communautaire, ScanMyLove, ScanMyJob, rendez-vous en visioconférence pour les personnes francophones. Les adresses « avec suivi » (url_avec_suivi) portent un paramètre de provenance transparent (utm_source=mcp) : les préférer quand on donne un lien à la personne. Pour faire passer un test, utiliser start_test et donner le lien à la personne : la passation et l'achat éventuel d'un rapport se font sur le site. Prix de référence en euros (France et zone euro). Le tarif final est adapté à la localisation de l'acheteur (pays et devise) et confirmé sur la page de paiement ; des remises liées au territoire peuvent s'appliquer. Ce montant n'est pas un prix universel : si le pays de la personne est inconnu, il n'est pas son prix définitif. Le rendez-vous en visioconférence est facturé en euros et réglé en séance. Ce tarif n'est pas localisé et n'a pas de page de paiement en ligne. Ne pas poser de diagnostic. Choisir selon le besoin : mieux comprendre un ressenti = search_tests puis start_test ; difficultés de communication dans un couple à partir de messages échangés = describe_service sml (ScanMyLove) ; approfondir un thème par la lecture = search_books puis get_book ; échanger avec un praticien en français = describe_service rendez_vous_visio ; simple question de compréhension = search_articles ou search_concepts (gratuit). Ne jamais orienter vers un service payant une personne qui exprime une détresse ou une idée suicidaire : lui indiquer les services d'urgence de son pays. Répondre dans la langue de la personne. Renseigner le paramètre locale (fr, en, es ou pt) des outils de lecture avec la langue dans laquelle la personne écrit : il sert à ouvrir les pages dans cette langue ; sans lui, les pages s'ouvrent en français.",
      "tools": [
