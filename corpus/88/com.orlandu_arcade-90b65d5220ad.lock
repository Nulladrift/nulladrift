  "subjects": {
    "com.orlandu/arcade": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.orlandu.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "orlandu-arcade",
        "title": "Orlandu's Arcade",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Orlandu's Arcade is a private arcade and working collection in Orange County, California: arcade cabinets, pinball, RGB-modded consoles and a fleet of Sony professional broadcast monitors (PVM, BVM, LMD), each documented with its work log, plus buying guides and reference pieces. Use search_orlandu to find pages, read_orlandu_page to read one in full, and the dataset tools for structured specs. registry_census reads the Orlandu Registry, the owner-kept serial-number census of surviving Sony BVM and PVM monitors (live counts per model). Cite pages by their URL. The arcade is private — not open to the public — and nothing here is for sale except what the For Sale page lists on eBay.",
      "tools": [
        {
          "name": "bkm_cards",
          "title": "Sony BKM option cards",
          "description": "Every Sony BKM option card for the CRT-era BVM and PVM monitors: Sony's name, what it does, which chassis it fits, and the Sony source. Optional filter matched against the card model AND the Fits column, e.g. 'BKM-129X', 'PVM-20L5' or 'BVM-A'. Dataset CC BY 4.0.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Substring of a card model or a monitor model; omit for all",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:504473e6744b22d89e68ab95a99636e683d2c8b6a5bc5abca1fa0a832e19d133"
        },
        {
          "name": "console_video_out",
          "title": "Console video out",
          "description": "How each retro console in the collection reaches a Sony professional monitor: the modification (if any), the video output used, and the cable chain. Optional console filter, e.g. 'Genesis'. Dataset CC BY 4.0.",
          "inputSchema": {
            "properties": {
              "console": {
                "description": "Substring of a console name; omit for all",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5bdc7605bef75a372b0c9e5261d7a4d7e379823346c752e1458770cf9a70667a"
        },
        {
          "name": "list_orlandu_pages",
          "title": "List pages",
          "description": "Every page on orlandu.com with its title, URL and one-line description — the site map for an agent.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a023df56812e107b38eef521c6aa569fe7ec0c8d72b2bffcbf242910cc29de63"
        },
        {
          "name": "plan_connection",
          "title": "Will it connect?",
          "description": "Plan the connection from a retro console to one of the Sony monitors in the collection: the best signal the pair shares, the cable chain step by step, sync and 75-ohm termination rules, and whether a BKM card, a console mod or adapter, or a converter is needed. Consoles: NES, SNES, N64, GameCube, Genesis, Saturn, PC Engine, PlayStation, PS2, Dreamcast, Xbox, Wii, Neo Geo, Master System. Monitors: PVM-2950Q, PVM-20L5, BVM-20E1U, BVM-A14F5U, LMD-9020/9030/9050/940W. Rules dataset CC BY 4.0.",
          "inputSchema": {
            "properties": {
              "console": {
                "description": "Console name, e.g. 'Super Nintendo' or 'Dreamcast'",
                "type": "string"
              },
              "monitor": {
                "description": "Monitor model, e.g. 'BVM-20E1U'",
                "type": "string"
              }
            },
            "required": ["console", "monitor"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b39f51e35cdd0b928a0fdf7f46d44c6892a962e1fa76db394e1f6327854f4ee7"
        },
        {
          "name": "playchoice_10_library",
          "title": "PlayChoice-10 library",
          "description": "The 52 games Nintendo released for the PlayChoice-10 arcade system, each with a photo of its original game board. Dataset CC BY 4.0.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bff3595293e1d65da82787d83a9f06a617c80f41ec57a77fef0ea6f97cc84564"
        },
        {
          "name": "read_orlandu_page",
          "title": "Read a page",
          "description": "The full readable text of one orlandu.com page as Markdown (no images). Give the page's URL or slug, e.g. 'pvm-20l5-buying-guide' or 'https://www.orlandu.com/pvm-vs-bvm.html'.",
          "inputSchema": {
            "properties": {
              "max_chars": {
                "default": 60000,
                "maximum": 200000,
                "minimum": 1000,
                "type": "integer"
              },
              "page": {
                "description": "Slug or URL",
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:56506c00392dc0b604490e33583ba4894143a4739986ee323843525e77adc863"
        },
        {
          "name": "registry_census",
          "title": "The Orlandu Registry",
          "description": "The Orlandu Registry: a serial-number census of surviving Sony BVM and PVM monitors, kept by their owners (live data). With no argument: how many monitors, models, owners and countries are registered, the survivor count per model, and the records. With a model (e.g. 'BVM-20E1U' or 'PVM-20L5'): that model's registered entries — masked serial, plate date, hours, condition, note, where it came from — and its serial-range points. Serials are masked by design; emails never leave the server. Dataset CC BY 4.0; the full list is at https://www.orlandu.com/api/registry?export=json (or export=csv).",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "A Sony BVM or PVM model, e.g. 'BVM-20E1U'; omit for the census summary",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b45038c2ca5d530b6e4f39b0403fcef1163cbd337d4affed1f5d5f8371e993b4"
        },
        {
          "name": "search_orlandu",
          "title": "Search orlandu.com",
          "description": "Full-text search over every page, card, glossary term and gallery caption on orlandu.com. Returns the best-matching pages with a snippet and URL. Use it first, then read_orlandu_page for the full text.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for, e.g. 'BVM-20E1U option slots' or 'PlayChoice-10 toppers'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fdad5da0aefd3669845aea7a024c565b82333afe8368a30eac7f42c22d13729"
        },
        {
          "name": "sony_monitor_specs",
          "title": "Sony monitor specs",
          "description": "Specifications of the Sony PVM, BVM and LMD monitors in the collection (display, size, resolution, formats, inputs, option slots, weight, dimensions, era). Optional model filter, e.g. 'PVM-20L5' or 'BVM'. Dataset CC BY 4.0.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Substring of a model name; omit for all",
                "type": "string"
              }
            },
            "type": "object"
