                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "ddmDecimals": {
                "description": "Decimal places on DDM minutes, 0-6 (default 4).",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "dmsDecimals": {
                "description": "Decimal places on DMS seconds, 0-4 (default 1).",
                "maximum": 4,
                "minimum": 0,
                "type": "integer"
              },
              "geohashLength": {
                "description": "Geohash characters, 1-12 (default 9, about 5 m).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "input": {
                "description": "The coordinate as text, up to 200 characters, URL-encoded.",
                "maxLength": 200,
                "type": "string"
              },
              "inputFormat": {
                "description": "Skip auto-detection: latlon (dd/dms/ddm), utm, ups, mgrs, pluscode, geohash, maidenhead.",
                "enum": ["latlon", "dd", "dms", "ddm", "utm", "ups", "mgrs", "pluscode", "geohash", "maidenhead"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude in decimal degrees (instead of input).",
                "type": "number"
              },
              "lon": {
                "description": "Longitude in decimal degrees (instead of input).",
                "type": "number"
              },
              "maidenheadLength": {
                "anyOf": [
                  {
                    "const": 2,
                    "type": "number"
                  },
                  {
                    "const": 4,
                    "type": "number"
                  },
                  {
                    "const": 6,
                    "type": "number"
                  },
                  {
                    "const": 8,
                    "type": "number"
                  }
                ],
                "description": "Maidenhead characters: 2, 4, 6 (default) or 8."
              },
              "mgrsPrecision": {
                "anyOf": [
                  {
                    "const": 1,
                    "type": "number"
                  },
                  {
                    "const": 10,
                    "type": "number"
                  },
                  {
                    "const": 100,
                    "type": "number"
                  },
                  {
                    "const": 1000,
                    "type": "number"
                  },
                  {
                    "const": 10000,
                    "type": "number"
                  },
                  {
                    "const": 100000,
                    "type": "number"
                  }
                ],
                "description": "MGRS square size in metres: 1 (default), 10, 100, 1000, 10000, 100000."
              },
              "order": {
                "description": "For letterless numbers: latlon (default) or lonlat. Hemisphere letters and lat/lon labels win.",
                "enum": ["latlon", "lonlat"],
                "type": "string"
              },
              "pluscodeLength": {
                "description": "Plus code digits: 2, 4, 6, 8, 10 (default) to 15.",
                "maximum": 15,
                "minimum": 2,
                "type": "integer"
              },
              "ref": {
                "description": "Reference point for short plus codes (in the input, and to add a short code to the output), like \"40.4,-79.9\".",
