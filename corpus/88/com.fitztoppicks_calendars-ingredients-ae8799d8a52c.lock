        {
          "name": "convert_clothing_size",
          "title": "Convert a clothing size",
          "description": "Convert women's dress/top sizes or men's suit and shirt sizes between US, UK, EU, FR, IT, Japan and others. More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "women: us, uk, au, fr, eu (= fr), es, be, de, at, nl, it, jp, letter, bust-cm, bust-in. men-suits: us, uk, eu, de, fr, it, letter, chest-cm, chest-in. men-shirts: us, uk, eu, jp, letter, neck-cm, neck-in.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "size": {
