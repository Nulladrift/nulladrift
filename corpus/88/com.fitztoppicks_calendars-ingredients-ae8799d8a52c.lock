            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "A first name as SSA spells it: 2-15 letters A-Z, any case (\"olivia\" works). Spaces, hyphens and apostrophes are dropped like SSA drops them (\"Mary-Kate\" → \"Marykate\"). Accents are read as plain letters (\"Sofía\" finds \"Sofia\").",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              },
              "sex": {
                "description": "F or M, as recorded by SSA. Leave out for both.",
                "enum": ["F", "M"],
                "type": "string"
              },
              "year": {
                "description": "Year, 1910 or later (territories from 1998). Default: the latest year with state data for this name.",
                "maximum": 9007199254740991,
                "minimum": 1910,
                "type": "integer"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
