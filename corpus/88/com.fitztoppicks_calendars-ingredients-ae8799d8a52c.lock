      "serverInfo": {
        "name": "fitztoppicks-calendars-ingredients",
        "title": "FitzTopPicks World Calendars and Ingredient Parser",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Exact answers from FitzTopPicks' World Calendars and Ingredient Parser APIs. Calendars: use convert_date for \"what is the Hebrew/Islamic/Chinese/Persian date of ...\", holidays for \"when is Passover/Ramadan/Chinese New Year/Easter/Nowruz in <year>\"; Islamic dates are calculated and can differ by 1-2 days from moon sighting, so say so. Ingredients: parse_ingredients, convert_ingredient, scale_recipe, merge_shopping_lists. Without a key each network gets a small free daily allowance; with your own Zyla API Hub key (header \"Authorization: Bearer <key>\") the calendar tools run through your Zyla account.",
      "tools": [
        {
          "name": "calendar_months",
          "title": "Months of a year",
          "description": "Every month of a year in one calendar with its first and last Gregorian day and length (Hebrew leap years and Adar II, Chinese leap months, Islamic methods, Persian, Indian, Ethiopian and Coptic months). More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "calendar": {
                "description": "The calendar.",
                "enum": ["gregorian", "hebrew", "islamic", "chinese", "persian", "indian", "ethiopian", "coptic"],
                "type": "string"
              },
              "method": {
                "description": "Islamic method: umalqura (default, Saudi Arabia's official calendar), civil or tabular.",
                "enum": ["umalqura", "civil", "tabular"],
                "type": "string"
              },
              "year": {
                "description": "The year in that calendar (e.g. Hebrew 5787, Islamic 1448, Persian 1405).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["calendar", "year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Months of a year"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d5c0db8e3e6fd2614ca0f5da1bbcb0421764ce38f8aea83eaaa20ea8dcc94de"
        },
        {
          "name": "convert_date",
          "title": "Convert a date between calendars",
          "description": "Convert a date between the Gregorian, Hebrew, Islamic (Hijri), Chinese lunisolar, Persian (Solar Hijri), Indian national, Ethiopian and Coptic calendars. Give a Gregorian \"date\" (YYYY-MM-DD), or \"calendar\" with \"year\", \"month\" (number or name, e.g. \"Kislev\", \"Ramadan\", \"Farvardin\") and \"day\". Use it for questions like \"what is the Hebrew date of my birthday\" or \"when is 1 Ramadan 1448 in the Gregorian calendar\". More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "afterSunset": {
                "description": "True when the time is after sunset: Hebrew and Islamic dates move to the next day (their days begin at sunset).",
                "type": "boolean"
              },
              "calendar": {
                "description": "Calendar of year/month/day.",
                "enum": ["gregorian", "hebrew", "islamic", "chinese", "persian", "indian", "ethiopian", "coptic"],
                "type": "string"
              },
              "date": {
                "description": "A Gregorian date, YYYY-MM-DD.",
                "maxLength": 200,
                "type": "string"
              },
              "day": {
                "description": "Day of the month.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "leap": {
                "description": "Chinese only: a leap month.",
                "type": "boolean"
              },
              "method": {
                "description": "Islamic method: umalqura (default, Saudi Arabia's official calendar), civil or tabular.",
                "enum": ["umalqura", "civil", "tabular"],
                "type": "string"
              },
              "month": {
                "description": "Month number or name.",
                "maxLength": 200,
                "type": "string"
              },
              "to": {
                "description": "Calendars to return, comma-separated (gregorian, hebrew, islamic, chinese, persian, indian, ethiopian, coptic) or \"all\". Default: gregorian,hebrew,islamic,chinese.",
                "maxLength": 200,
                "type": "string"
              },
              "year": {
                "description": "Year in that calendar.",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert a date between calendars"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f8e9abe75116ada164feeca81f22d26334a96e50d0e04993645ec9ec3176034"
        },
        {
          "name": "convert_ingredient",
          "title": "Convert ingredient units",
          "description": "Convert an ingredient amount between US and metric units, or to one unit (g, ml, cup, oz, tbsp...). Volume to weight only for items with a known density (e.g. 250 g sugar to cups). Send one \"line\", up to 100 \"lines\", or \"amount\" + \"unit\" (+ \"item\" for volume <-> weight), and \"to\". More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "maxLength": 40,
                    "type": "string"
                  }
                ],
                "description": "An amount (with \"unit\"), e.g. 250 or \"1 1/2\"."
              },
              "item": {
                "description": "The ingredient (needed for volume <-> weight), e.g. sugar.",
                "maxLength": 200,
                "type": "string"
              },
              "line": {
                "description": "One ingredient line, e.g. \"1 1/2 cups flour\".",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "lines": {
                "description": "Up to 100 ingredient lines.",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "prefer": {
                "description": "Keep the kind of unit (same, default), or prefer weight or volume.",
                "enum": ["same", "weight", "volume"],
                "type": "string"
              },
              "rounding": {
                "description": "Round to kitchen-friendly amounts (default) or not at all.",
                "enum": ["kitchen", "none"],
                "type": "string"
              },
              "spoons": {
                "description": "Keep teaspoons and tablespoons as they are (default) or convert them too.",
                "enum": ["keep", "convert"],
                "type": "string"
              },
              "to": {
                "description": "\"metric\", \"us\" or a unit: tsp, tbsp, cup, fl oz, pint, quart, gallon, ml, l, oz, lb, g, kg.",
                "maxLength": 200,
                "type": "string"
              },
              "unit": {
                "description": "The amount's unit, e.g. g, cup, oz.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Convert ingredient units"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aba694402e2fc63b0611daa648987032d4dfa61d779143d3964b4e7a67e7c9d8"
        },
        {
          "name": "holidays",
          "title": "Holidays of a year",
          "description": "Holidays of a year: Jewish (hebrew; Israel or diaspora), Islamic, Chinese festivals, Christian (Easter and the movable feasts, Western and Orthodox), Persian (Nowruz), Indian national, Ethiopian (Enkutatash, Meskel) or Coptic (Nayrouz). \"year\" is a Gregorian year; \"calendarYear\" is the calendar's own year instead. More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "calendar": {
                "description": "Which holidays.",
                "enum": ["hebrew", "islamic", "chinese", "christian", "persian", "indian", "ethiopian", "coptic"],
                "type": "string"
              },
              "calendarYear": {
                "description": "The calendar's own year (not for christian).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "include": {
                "description": "Hebrew only: categories, comma-separated (major, minor, fast, modern, roshchodesh).",
                "maxLength": 200,
                "type": "string"
              },
              "israel": {
                "description": "Hebrew only: Israel's schedule.",
                "type": "boolean"
              },
              "method": {
                "description": "Islamic method: umalqura (default, Saudi Arabia's official calendar), civil or tabular.",
                "enum": ["umalqura", "civil", "tabular"],
                "type": "string"
              },
              "tradition": {
                "description": "Christian only: western, orthodox or both.",
                "enum": ["western", "orthodox", "both"],
                "type": "string"
              },
              "year": {
                "description": "Gregorian year (default this year).",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["calendar"],
            "type": "object"
          },
          "annotations": {
