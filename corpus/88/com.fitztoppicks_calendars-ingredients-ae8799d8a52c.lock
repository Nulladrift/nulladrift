      "instructions": "Exact answers from FitzTopPicks' APIs: world calendars and holidays, recipe ingredients, US baby names, world cities and time zones, coordinate formats and distances, concrete/paint/gravel and lumber amounts, the US hazmat table, US federal per diem, plugs and voltage by country, tipping by country, shoe/ring/hat/clothing sizes, a thesaurus, screw threads and drill bits, tire sizes, and sudoku/maze puzzles. Pick the tool whose description matches the question. Islamic dates are calculated and can differ by 1-2 days from moon sighting, so say so. Without a key each network gets a small free daily allowance of units (most calls 1; puzzles 3, hazmat and per diem 2, ingredient batches 1 a line); with your own Zyla API Hub key (header \"Authorization: Bearer <key>\") the tools listed on Zyla run through your Zyla account.",
      "tools": [
        {
          "name": "antonyms",
          "title": "Antonyms by meaning",
          "description": "Opposites of an English word, by meaning (direct and indirect antonyms). More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "pos": {
                "description": "Only this part of speech: noun, verb, adjective or adverb.",
                "enum": ["noun", "verb", "adjective", "adverb"],
                "type": "string"
              },
              "safe": {
                "description": "Best-effort family-friendly filter (default false). Drops senses WordNet tags as vulgar, derogatory, slur or slang, senses whose definitions describe sexual, excretory or illegal-drug meanings, and a list of profane and slur words, everywhere in the answer. Not a guarantee;",
                "type": "boolean"
              },
              "word": {
                "description": "A word or phrase (up to 64 characters; \"ice cream\", \"run away\"). Inflected forms are matched to their base form: ran → run, mice → mouse, dogs → dog.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["word"],
            "type": "object"
