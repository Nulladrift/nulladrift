        {
          "name": "scale_recipe",
          "title": "Scale a recipe",
          "description": "Scale a recipe's ingredient lines by a factor (e.g. 2 or 0.5) or from one number of servings to another, with kitchen-friendly rounding and optional US/metric units. More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "factor": {
                "description": "Multiply every amount (send this or \"servings\").",
                "maximum": 100,
                "minimum": 0.01,
                "type": "number"
              },
              "lines": {
                "description": "The recipe's ingredient lines (up to 100).",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              },
              "rounding": {
                "description": "Kitchen rounding (default) or none.",
                "enum": ["kitchen", "none"],
                "type": "string"
              },
              "servings": {
                "additionalProperties": false,
                "description": "Scale from one number of servings to another, e.g. { \"from\": 4, \"to\": 6 }.",
                "properties": {
                  "from": {
                    "maximum": 1000,
                    "minimum": 0.25,
                    "type": "number"
                  },
                  "to": {
                    "maximum": 1000,
                    "minimum": 0.25,
                    "type": "number"
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              },
              "system": {
                "description": "Keep the units' system (default), or answer in US or metric units.",
                "enum": ["keep", "us", "metric"],
                "type": "string"
              },
              "units": {
                "description": "Switch to friendlier units when amounts grow or shrink (default) or keep them.",
                "enum": ["friendly", "keep"],
                "type": "string"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
