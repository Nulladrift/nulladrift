        {
          "name": "parse_ingredients",
          "title": "Parse recipe ingredient lines",
          "description": "Parse recipe ingredient lines (English or Spanish) into amount, unit, item, prep, notes, optional flag, canonical key, grocery aisle, confidence and any unparsed remainder, with keyword flags for the major US food allergens (text matching, not a safety check). Send one \"line\" (e.g. \"2 (14.5 oz) cans diced tomatoes, drained\") or up to 100 \"lines\". More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "line": {
                "description": "One ingredient line.",
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              },
              "lines": {
                "description": "Up to 100 ingredient lines (send this or \"line\").",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
