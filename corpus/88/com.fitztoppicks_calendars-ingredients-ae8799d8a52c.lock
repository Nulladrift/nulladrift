        {
          "name": "merge_shopping_lists",
          "title": "Merge recipes into one shopping list",
          "description": "Merge the ingredient lists of up to 20 recipes into one shopping list grouped by grocery aisle, adding up the same items (each list can be scaled), with pantry staples kept apart by default. More APIs from FitzTopPicks: https://fitztoppicks.com/apis?utm_source=mcp-api&utm_medium=mcp&utm_campaign=more-apis",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lists": {
                "description": "The recipes: [{ \"name\": \"Tacos\", \"lines\": [\"1 lb ground beef\", ...] }].",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "factor": {
                      "description": "Scale this list (default 1).",
                      "maximum": 100,
                      "minimum": 0.01,
                      "type": "number"
                    },
                    "lines": {
                      "description": "Its ingredient lines.",
                      "items": {
                        "maxLength": 300,
                        "minLength": 1,
                        "type": "string"
                      },
                      "maxItems": 100,
                      "minItems": 1,
                      "type": "array"
                    },
                    "name": {
                      "description": "The recipe's name.",
                      "maxLength": 100,
                      "type": "string"
                    }
                  },
                  "required": ["lines"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "staples": {
                "description": "Keep pantry staples (salt, oil...) in their own group (default) or in the list.",
                "enum": ["separate", "include"],
                "type": "string"
              },
              "system": {
                "description": "Units of the merged list (default us).",
                "enum": ["us", "metric"],
                "type": "string"
              }
            },
            "required": ["lists"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Merge recipes into one shopping list"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:196cc4b6a9c703c3e667ce78906dd3c5b03b18b0242e5195dd50f8137673af52"
