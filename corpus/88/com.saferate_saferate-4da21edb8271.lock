        {
          "name": "get_treasury_curve",
          "title": "Get the Treasury yield curve",
          "description": "Get the U.S. Treasury yield curve for a single day: the fitted zero-coupon (spot) curve and, on request, the par curve, money-market curve, TIPS real curve, breakeven inflation, the prior trading day for day-over-day moves, and per-CUSIP yields. Omit the date for the most recent published day, which is what you want on a weekend or holiday. Treasury yields are not mortgage rates.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "description": "Trading day as YYYY-MM-DD. Omit for the most recent published day — most calendar days are not trading days, so omitting is usually right.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include": {
                "description": "Which curves to return. Defaults to [\"zero\"]. \"real\" is the TIPS curve, \"breakeven\" the inflation implied between them, \"prior\" the previous trading day for comparison, \"queue_yields\" per-CUSIP yields and curve residuals.",
                "items": {
                  "enum": ["breakeven", "prior", "queue_yields", "real", "zero"],
                  "type": "string"
                },
                "type": "array"
              },
              "queue_kind": {
                "description": "Security kind for \"queue_yields\". Defaults to Note.",
                "enum": ["Bill", "Bond", "FRN", "Note", "TIPS"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the Treasury yield curve"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84a29fa4d3b9d738b64a6873e9e2e308e056e7809f9e5556068b6c5e95eb3b67"
        },
        {
          "name": "get_treasury_debt",
          "title": "Get the federal debt statement",
          "description": "Get the U.S. federal debt from the monthly Treasury statement: debt held by the public, total public debt outstanding, and its composition, plus the STRIPS float on request. These two headline figures differ by trillions: debt held by the public excludes intragovernmental trust-fund holdings.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include_strips": {
                "description": "Also return how much of the debt is held as STRIPS — separated coupon and principal payments traded as zero-coupon instruments.",
                "type": "boolean"
              },
              "on": {
                "description": "Any date; the month-end statement in force on it is returned, so a mid-month date gives the prior month-end. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the federal debt statement"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5c7592db2db52109149ca20f1fff7f0b6ad858e2421f108712350add5212033"
        },
        {
          "name": "get_treasury_index",
          "title": "Get a Treasury index",
          "description": "Get Safe Rate's Treasury total-return indices — by maturity bucket, plus bills, TIPS, floating-rate and aggregate. Call with no code to list every index with its current level and discover the codes. These are TOTAL RETURN levels, not yields: a rising level usually means yields fell. Constructed by Safe Rate, not an official Treasury statistic.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "Index code, e.g. \"broad\", \"1020\", \"TIPS\". Omit to list every index with its latest level.",
                "maxLength": 16,
                "minLength": 1,
                "type": "string"
              },
              "constituents_on": {
                "description": "Rebalance date for constituents. Defaults to the most recent — constituents exist on rebalance dates only, not daily.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include": {
                "description": "Extras. \"fund_comparison\" sets each index beside comparable public bond funds and applies to the no-code listing.",
