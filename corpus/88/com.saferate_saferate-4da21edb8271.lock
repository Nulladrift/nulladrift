        {
          "name": "find_lenders_in_market",
          "title": "Find top lenders in a market",
          "description": "List the lenders Safe Rate publishes rankings for in a metro area or a whole state, sliced by loan type OR by institution type. Rankings are derived from public federal HMDA filings; placement cannot be purchased. This is a starting list, not a recommendation for a specific borrower.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "institution_type": {
                "description": "Rank lenders of one institution type, across all loan types. Cannot be combined with loan_type.",
                "enum": ["all", "banks", "credit-unions", "mortgage-companies"],
                "type": "string"
              },
              "limit": {
                "anyOf": [
                  {
                    "maximum": 25,
                    "minimum": 1,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "How many lenders to return. Defaults to 10, max 25."
              },
              "loan_type": {
                "description": "Rank lenders for one loan type, across all institution types. Cannot be combined with institution_type. Omit both to get the conventional-loans slice, which the response flags as an assumption.",
                "enum": ["all", "conventional-loans", "fha-loans", "va-loans", "usda-loans", "jumbo-loans"],
                "type": "string"
              },
              "location": {
                "anyOf": [
                  {
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "A US state (\"Ohio\", \"OH\") for statewide rankings, or a ZIP, city + state or county + state inside a metro area."
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find top lenders in a market"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50780143bac0a7ff5c89a01ad876c43a46c87091cd2f4d95d1fa7d242fbfe2ec"
