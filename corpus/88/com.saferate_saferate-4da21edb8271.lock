                "type": "string"
              },
              "since": {
                "description": "Start date for \"daily_history\".",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
