        {
          "name": "get_treasury_rate_history",
          "title": "Get Treasury rate history",
          "description": "Get a history of U.S. Treasury yields between two dates: the nominal zero curve, the short-end money-market curve, or the TIPS real curve, one row per trading day. Use this for 'how have rates moved' questions. Coverage starts 2008-09-02. Keep ranges tight — a decade is thousands of rows.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "curve": {
                "description": "Which curve. Defaults to \"zero\" (nominal spot). \"money_market\" covers below one year; \"real\" is TIPS and its yields sit above inflation.",
                "enum": ["money_market", "real", "zero"],
                "type": "string"
              },
              "from": {
                "description": "Start date, YYYY-MM-DD. Not before 2008-09-02.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "End date, YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Treasury rate history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:854feea322812a121cb212f68060138084813756ac7662e0c574c4d34bb033eb"
        },
        {
          "name": "get_treasury_security",
          "title": "Look up a Treasury security",
          "description": "Look up one Treasury security by CUSIP: its terms, price history, and analytics including duration, convexity, DV01 and key-rate durations, plus TIPS and floating-rate analytics where they apply, and the amount outstanding. Takes a CUSIP, not a description such as 'the current 10-year'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cusip": {
                "description": "Nine-character Treasury CUSIP, e.g. \"91282CJL6\".",
                "minLength": 1,
                "type": "string"
              },
              "outstanding_on": {
                "description": "Date for the amount outstanding. The month-end statement in force on it is used. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "summarize": {
                "description": "True drops the daily price and analytics series and keeps the latest values. Use it unless you need the full history — a 30-year bond carries thousands of rows.",
                "type": "boolean"
              }
            },
            "required": ["cusip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a Treasury security"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4867cc9f9a39ca9b30517ed78891dd6a42b3125840c27a4c11d12c2bd82caf70"
        },
        {
          "name": "list_treasury_securities",
          "title": "List Treasury securities",
          "description": "List Treasury securities as at a date: which security is on-the-run for each tenor (this is how to resolve 'the current 10-year' to a CUSIP), the full outstanding and priced universe, or just the priced CUSIPs. Omit the date for the most recent day with prices.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "basis": {
                "description": "When a security becomes on-the-run. \"auction\" is the trading convention and flips sooner; \"issue\" waits for settlement. Defaults to \"issue\". Between an auction and its issue the two disagree.",
                "enum": ["auction", "issue"],
                "type": "string"
              },
              "date": {
                "description": "Date as YYYY-MM-DD. Omit for the most recent day with published prices.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include": {
                "description": "Defaults to [\"on_the_run\"]. \"outstanding\" returns every priced security, which is several hundred rows.",
                "items": {
                  "enum": ["cusips_only", "on_the_run", "outstanding"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Treasury securities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc02901f577f00f2b0eb82d65f9edca9f04e70ef39abbb0fb137158b5dc21075"
        },
        {
          "name": "price_treasury_security",
          "title": "Price a Treasury security",
          "description": "Convert between price and yield for a Treasury bill, note or bond. Supply exactly one side — a price or a yield (a discount rate for a bill) — and the other is returned, with accrued interest, dirty price and the investment rate as applicable. For a note or bond, a CUSIP looks the terms up instead of restating them.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "clean_price": {
                "description": "Price per 100 of face, excluding accrued interest.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "coupon_rate_percent": {
                "description": "Annual coupon rate. Required for a coupon security without a CUSIP.",
                "minimum": 0,
                "type": "number"
              },
              "cusip": {
                "description": "CUSIP of a note or bond; its terms are looked up.",
                "type": "string"
              },
              "discount_rate_percent": {
                "description": "Bank discount rate for a bill.",
                "type": "number"
              },
              "frequency": {
                "description": "Coupon payments per year. Defaults to 2.",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "instrument": {
                "description": "\"bill\" for a discount instrument under a year, \"coupon\" for a note or bond. The maths differs; the wrong choice returns a plausible wrong number.",
                "enum": ["bill", "coupon"],
                "type": "string"
              },
              "maturity_date": {
                "description": "Maturity, YYYY-MM-DD. Required for a bill.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "trade_date": {
                "description": "Settlement date. Defaults to the most recent trading day.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "yield_percent": {
                "description": "Yield to maturity for a coupon security.",
                "type": "number"
              }
            },
            "required": ["instrument"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price a Treasury security"
          },
          "behavior": {
            "destructive": false,
