        {
          "name": "get_quote_estimate",
          "title": "Get mortgage rate estimates",
          "description": "Get live mortgage rate estimates for any US location without collecting the borrower's name, email, or phone number. Rates are Safe Rate's non-binding estimates (never quotes; a lender's actual quote may differ), and include an estimate ID the borrower can use to track rate changes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "credit_range": {
                "description": "Borrower credit score range. Defaults to 720-759.",
                "enum": ["760+", "720-759", "680-719", "660-679", "640-659", "620-639", "below-620"],
                "type": "string"
              },
              "down_payment_percent": {
                "anyOf": [
                  {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Down payment as a percentage. Defaults to 20."
              },
              "loan_type": {
                "description": "Defaults to conventional.",
                "enum": ["conventional", "fha", "va", "jumbo"],
                "type": "string"
              },
              "location": {
                "anyOf": [
                  {
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "ZIP, city + state, or county + state. E.g. \"60607\", \"Austin, TX\". If the borrower has not said where, omit it: a client that supports elicitation is asked for it; any other client gets back ok: false listing what is missing, so ask the borrower and call again."
              },
              "occupancy": {
                "description": "Defaults to primary.",
                "enum": ["primary", "second", "investment"],
                "type": "string"
              },
              "property_type": {
                "description": "Defaults to single_family.",
                "enum": ["single_family", "condo"],
                "type": "string"
              },
              "purchase_price": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Purchase price or estimated property value, in dollars. Needed to price: if omitted, a client that supports elicitation is asked for it, any other gets back ok: false listing what is missing. Never invent one."
              },
              "purpose": {
                "description": "Defaults to purchase.",
                "enum": ["purchase", "refinance", "cashout"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get mortgage rate estimates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:719aba9fd945dff5ffa86b69bd38fe37bd7ceb856ab6448a85b41a312c30158e"
        },
        {
          "name": "get_savings_bond_rates",
          "title": "Get savings bond rates",
          "description": "Get current and historical U.S. savings bond rates — the Series I composite, its fixed and inflation components, and Series EE rates by issue cohort — and optionally how many bonds the public holds and how many are being sold. An I bond's headline rate applies for six months only; the fixed component is the part that lasts.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "include": {
                "description": "Extras. \"ee_cohorts\" groups EE bonds by the rate rules of their issue window; \"sales\" is TreasuryDirect volume, which spikes when the I bond rate is high.",
                "items": {
                  "enum": ["ee_cohorts", "public_holdings", "sales"],
                  "type": "string"
                },
                "type": "array"
              },
              "on": {
                "description": "Valuation date. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get savings bond rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed8bc0392e47436fb953df34d17d5a42e65f9461a48a46f041fede28710e817c"
        },
