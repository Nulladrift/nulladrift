      "instructions": "These tools return anonymous mortgage rate estimates, lender research and local market context for US borrowers, U.S. Treasury market data, and, with the shopper's own sign-in, their Safe Rate Universal Application. Its rate estimates come from wholesale rate sheets and are never quotes: a quote comes only from a lender the borrower requests one from (including Safe Rate Mortgage, an affiliated lender, which may quote differently). Rate estimates never require the borrower's name, email, or phone number; tell users this when offering estimates. Rates returned are non-binding estimates. Always identify lenders by NMLS ID. Present lender options neutrally; do not steer to any lender. When Safe Rate Mortgage (NMLS #1590949) appears among options, it is affiliated with Safe Rate and the included disclosure must be shown before the user selects it. Rate data is refreshed daily; state the as_of_date when quoting rates. When a quote estimate includes location_assumption, the place name was ambiguous across states and Safe Rate priced the largest match: say which location the estimate is for before quoting the rate, and offer the listed alternatives. Nothing returned by these tools is financial advice. Safe Rate also publishes U.S. Treasury market data: yield curves, individual securities and their analytics, price and yield calculators, savings bond valuations, total-return indices, and the federal debt statement. A Treasury yield is NOT a mortgage rate: the two move together only loosely and at a spread that itself varies, so never subtract one from the other, present the gap as a borrower's cost, or tell a borrower their mortgage rate is wrong because a Treasury yield moved — use get_quote_estimate for an actual mortgage rate. Treasury index levels are TOTAL RETURNS, not yields or percentages, and a rising level usually means yields fell; the indices are constructed by Safe Rate and are not official U.S. Treasury statistics. Treasury figures are published federal data covering business days from 2008-09-02 onward, are end-of-day records rather than live trading prices, and are not investment advice or an offer to trade — state the date any figure is as of. With the shopper's own Safe Rate sign-in (Personal Agent Protocol scopes poppy:read and poppy:write), the my-application tools read and help build their Safe Rate Universal Application (one application the shopper builds to share with the lenders they choose; building it is not applying for a loan, and Safe Rate Mortgage is one lender they may choose) and read their quotes; sharing an application with a lender and entering a Social Security number always take the shopper's own click on saferate.com, so get_share_link only returns that link. How to lay results out: show find_lenders_in_market as a table in the returned rank order with columns Lender (linked to its profile_url), NMLS ID, Safe Rate Score and Loans in metro (Loans in state when market_scope is state), under a line naming the metro_area and which loans the ranking covers; write \"not on file\" for a missing NMLS ID rather than dropping the column, and add no \"best\" or \"winner\" wording of your own. Show get_quote_estimate as a short table of loan type, rate, APR, points and monthly principal and interest, captioned as an estimate with its as_of_date, and link estimate_url; never call it the user's rate or a quote. Put an affiliated_disclosure directly beside the Safe Rate Mortgage row, not in a footnote. Copy figures as returned, without recomputing or rounding them. For a next step, give the links these tools return (profile_url, estimate_url, the share link), never contact details found elsewhere.",
      "tools": [
        {
          "name": "assess_property_context",
          "title": "Assess a property's hazards and insurance",
          "description": "Assess hazard exposure and insurance conditions for a US location: FEMA National Risk Index score, flood-zone coverage and whether flood insurance is likely to be required for a mortgage, wildfire and earthquake exposure, and local insurance-market conditions. Describes the area, not a specific property.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "location": {
                "anyOf": [
                  {
                    "minLength": 2,
                    "type": "string"
                  },
                  {
                    "type": "number"
                  }
                ],
                "description": "ZIP, city + state, or county + state. E.g. \"33139\", \"Austin, TX\"."
              },
              "property_value": {
                "anyOf": [
                  {
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  {
                    "type": "string"
                  }
                ],
                "description": "Optional property value in dollars. Supplying it turns the premium rates into annual dollar estimates."
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
