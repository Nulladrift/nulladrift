        {
          "name": "search_deals",
          "title": "Search discounted yachts",
          "description": "Discounted boats (one row per boat and week) filtered by destination, departure month or date window, boat type, cabins, group size (berths), minimum discount and maximum whole-boat price. Sorted by discount, whole-boat price or price per berth. With any filter beyond destination/month/type/cabins every matching boat is considered, `matching` says how many there are and `next_offset` pages through them. Without a month or date window each boat appears once (its best week). Returns dates, whole-boat price, list price, discount, per-berth price, photo, source, when the price was checked and the boat page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "boat_type": {
                "enum": ["catamaran", "monohull"],
                "type": "string"
              },
              "cabins": {
                "description": "Guest cabins; 6 means 6 or more",
                "enum": [2, 3, 4, 5, 6],
                "type": "integer"
              },
              "country": {
                "description": "Destination slug",
                "enum": ["croatia", "greece", "italy", "turkey", "spain", "montenegro", "seychelles", "france", "caribbean", "thailand", "canaries"],
                "type": "string"
              },
              "departure_from": {
                "description": "Earliest departure date, YYYY-MM-DD (e.g. a flexible week: 2026-11-01 to 2026-11-15)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "departure_to": {
                "description": "Latest departure date, YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_eur": {
                "description": "Maximum whole-boat price for the week, EUR",
                "minimum": 0,
                "type": "number"
              },
              "min_discount_pct": {
                "description": "Only boats at least this much off the list price, %",
                "maximum": 95,
                "minimum": 0,
                "type": "number"
              },
              "month": {
                "description": "Departure month, YYYY-MM (the next three months are covered)",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many results: pass next_offset from the previous call",
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "people": {
                "description": "People sleeping aboard: only boats with at least this many berths",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "discount",
                "description": "discount — biggest first; price — cheapest whole boat; per_berth — cheapest per berth (best for a full boat)",
                "enum": ["discount", "price", "per_berth"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "deals": {
                "items": {
                  "properties": {
                    "base": {
                      "type": ["string", "null"]
                    },
                    "berths": {
                      "type": ["number", "null"]
                    },
                    "boat_type": {
                      "type": ["string", "null"]
                    },
                    "cabins": {
                      "type": ["number", "null"]
                    },
                    "country": {
                      "type": "string"
                    },
                    "departure": {
                      "type": "string"
                    },
                    "discount_pct": {
                      "type": ["number", "null"]
                    },
                    "list_price_eur": {
                      "type": ["number", "null"]
                    },
                    "model": {
                      "type": "string"
                    },
                    "page": {
                      "type": ["string", "null"]
                    },
                    "per_berth_eur": {
                      "type": ["number", "null"]
                    },
                    "price_checked_at": {
                      "type": ["string", "null"]
                    },
                    "price_eur": {
                      "type": "number"
                    },
                    "return": {
                      "type": ["string", "null"]
                    },
                    "source": {
