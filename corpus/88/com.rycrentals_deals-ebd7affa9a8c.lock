      "instructions": "Live discounted yacht charters found by the RYC agent across 11 destinations. Prices are for the whole boat for the listed dates, as shown by the source, in EUR, before extras; availability is confirmed by an RYC manager before booking. Cite the page URL of each boat or destination. Use search_deals to find boats (it filters by group size, dates and minimum discount) and get_boat for one boat's full data (specs, equipment, extras, photos, other weeks). is_good_deal tells whether a boat's price is low or high against the market for its month and type; trip_cost gives the full price of the week for a group with mandatory extras; compare_boats puts 2–5 boats side by side. get_destination answers when and where to sail in a country; search_guides searches the site's answers (licences, payment, deposit, extras, seasons, routes); list_yacht_models and get_yacht_model cover yacht models. When the person wants a boat, give them the link from request_availability; when nothing fits their dates or budget, give them the link from create_deal_alert. Both links open a form on the site that the person sends themselves. list_routes and get_route give sailing routes from a charter base, from a few days to two weeks, most of them loops back to base and some one-way (one_way, end): day-by-day plan, miles, stop coordinates and discounted boats from the start port.",
