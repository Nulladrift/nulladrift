        {
          "name": "create_deal_alert",
          "title": "Link to a deal alert",
          "description": "A link to set up an alert on the site when nothing current fits the person's dates or budget. The answers given here are filled in; the site asks only what is missing. After the person signs in by email, the RYC agent searches charter portals and booking sites at once, repeats the search every week and sends only new discounted boats to the Messages page, by notification or email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "boat_type": {
                "enum": ["catamaran", "monohull"],
                "type": "string"
              },
              "cabins": {
                "description": "Guest cabins, exactly (2–5)",
                "enum": [2, 3, 4, 5],
                "type": "integer"
              },
              "country": {
                "description": "Destination slug",
                "enum": ["croatia", "greece", "italy", "turkey", "spain", "montenegro", "seychelles", "france", "caribbean", "thailand", "canaries"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Site language for the link",
                "enum": ["ru", "en", "de", "es"],
                "type": "string"
              },
              "max_price_eur": {
                "description": "Budget for the whole boat per week, EUR; rounded up to the site's bands (2500, 5000, 8000, 10000; above the top band — any price)",
                "minimum": 0,
                "type": "number"
              },
              "month": {
                "description": "Departure month, YYYY-MM; this month or later",
                "pattern": "^\\d{4}-(0[1-9]|1[0-2])$",
                "type": "string"
