        {
          "name": "get_route",
          "title": "Day-by-day plan of one sailing route",
          "description": "Full sailing route: description, day-by-day plan (leg, nautical miles, what to expect), each day's stops with latitude/longitude (decimal degrees, harbour or bay level), other marinas, town quays and mooring-buoy bays near each day's leg with coordinates, practical notes on wind, berths and formalities, total miles, the route page, up to five discounted boats departing from the route's start port and the page of all discounted boats in that destination. Pass country and slug from list_routes, or the route page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
