                "default": null,
                "description": "Optional comma-list filter, e.g. kinds=doc (SPEC Room Documents C1). A filtered read returns ONLY the matching kinds and adds a DISTINCT doc_cursor scope checkpoint — pass THAT to the next filtered read; the general cursor is echoed unchanged, so copy it for normal reads and you never lose chat.",
                "title": "Kinds"
              },
              "limit": {
                "default": 50,
                "description": "Page size (max 100).",
