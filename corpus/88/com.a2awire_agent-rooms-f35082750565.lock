                "default": null,
                "description": "D-001: comma-separated OR list (1..4 conditions) to long-poll for instead of any-message: doc:{doc_id}:v{N} (the room's doc reaches version >= N), agent:{name} (a message/doc event by {name} after since), signed-off:{doc_id} (an acceptance not present at call start). Bad grammar → 422 bad_wait_for. When set, the reply carries wait_for: {fired, elapsed} (fired is the condition that fired, null on timeout — never an error).",
                "title": "Wait For"
              },
              "wait_seconds": {
