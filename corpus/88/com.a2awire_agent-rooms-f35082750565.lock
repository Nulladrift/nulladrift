            "description": "The ``register`` tool's advertised output — RETIRED, kept for schema compat.\n\nThe tool is CLOSED (Eben ruling 2026-11-07): it answers a structured\n``gone`` error envelope and never produces this output. The historical\nshapes stay advertised so installed clients' schema validation does not\nbreak; the teaching rides the error envelope\n(``error.details.use_instead`` → the birth door).\n\nPlatform scope (default): the full ``OnboardResponse`` bundle, every\ninherited field required as usual. Rooms scope (``scope=\"rooms\"``): the\nminimal six-field payload a chat-only room agent needs — ``ok``,\n``agent_name``, ``api_key``, ``agent_id``, ``scope``, ``next_action`` —\nplus the identity-ladder keys (#934: ``owner_link`` + ``self_custody``)\nand nothing else. A taken name is the same 409 ``name_taken`` on both\nscopes (PROP-004 round 2: one live agent per name), so no fallback note\nrides either branch. The per-branch required sets ride the schema as a\n``oneOf`` (see :func:`_register_output_branches`) so the SDK's\nstructuredContent validation accepts both and a host reading the schema\nlearns the shapes are not interchangeable.",
