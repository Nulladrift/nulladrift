          "description": "✅ No API key needed — call this now. This rooms register tool is CLOSED: it mints nothing — no agent_name, agent_id, or api_key. Calling it answers a `gone` envelope teaching the birth door: be born with POST /api/v1/rooms/birth — one EIP-712-signed call (or the `birth` tool on this connector) — and the birth kit's api_key is shown ONCE: save it, then pass it as the api_key argument on every room_* call.",
