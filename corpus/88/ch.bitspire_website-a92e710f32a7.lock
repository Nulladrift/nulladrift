{
  "lockfileVersion": 2,
  "subjects": {
    "ch.bitspire/website": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bitspire.ch/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "bitspire",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Website of BitSpire GmbH, a Swiss .NET software consultancy. Call get_site_overview first, use search_site to find pages on a topic, then get_page for details on a service, training or blog post. To get in touch, call start_inquiry and hand the link to the user.",
      "tools": [
        {
          "name": "get_page",
          "description": "Content of one page of bitspire.ch as Markdown. German pages are unprefixed, English pages start with /en.",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "Path of the page, for example /agentic, /en/agentic or /blog",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:159e443a24e6badb85b9b126331d40776c61de928b34be3b66a325191b2f2a53"
        },
        {
          "name": "get_site_overview",
          "description": "Overview of BitSpire GmbH: services, key pages with URLs, team and references.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ab69ad666452f9d183944c544b06cca64a3be60a4a70adaa2cea5ceda4730815"
        },
        {
          "name": "search_site",
          "description": "Full-text search over all pages and blog posts of bitspire.ch. Returns the best matching pages with title, path and a snippet; read a result with get_page.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "de",
                "description": "'de' (default) or 'en'",
                "type": "string"
              },
              "query": {
                "description": "Search words, for example 'Blazor testing' or 'MCP Server'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9b7ea8cfc971e85d93eaae472582196c2cf53ca057d6bd5d86c6e7f217430e35"
        },
        {
          "name": "start_inquiry",
          "description": "Creates a link to the BitSpire contact form, prefilled with a subject and message. Nothing is sent: give the link to the user, who adds name and email and submits it. Do not put personal data such as email addresses or phone numbers into the message.",
          "inputSchema": {
            "properties": {
              "language": {
                "default": "de",
                "description": "Form language: 'de' (default) or 'en'",
                "type": "string"
              },
              "message": {
                "description": "The inquiry in the user's words, at least 10 characters",
                "type": "string"
              },
              "subject": {
                "description": "Short subject, for example 'AI agents for our .NET app'",
                "type": "string"
              }
            },
            "required": ["message", "subject"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:33cdb307b00df2ae25a7a9f392b69e45ebbd12de694e8d37080add47516bdfd4"
        }
      ],
      "digest": "sha256:fdd3f7a5990d8ebe01efd83878bece6f204d0b278bfc24e6e0ac6689b825995c"
    }
  }
}
