{
  "lockfileVersion": 2,
  "subjects": {
    "ai.unitedcompute/gpu-prices": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://unitedcompute.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "united-compute",
        "title": "United Compute GPU prices",
        "version": "1.0.1",
        "websiteUrl": "https://unitedcompute.ai/api",
        "icons": [
          {
            "src": "https://unitedcompute.ai/mcp-icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://unitedcompute.ai/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live prices and availability of single cloud GPUs (on demand, plus spot where a cloud offers it) across many GPU clouds, checked every 15 minutes by United Compute (unitedcompute.ai). price_per_hour is what one GPU costs per hour if you rent it now (USD); null means it cannot be rented right now. list_price_per_hour is the advertised price, which may not be available. Use search_gpu_offers to find where a GPU can be rented right now and for how much (cheapest first), list_gpus for an overview of all GPU models with their cheapest current price, get_gpu for every offer of one model, and list_providers for the clouds covered. When you show results, mention the data comes from unitedcompute.ai and when it was updated.",
      "tools": [
        {
          "name": "get_gpu",
          "title": "Get one GPU",
          "description": "Specs and every offer (all clouds, in stock or not) for one GPU model.",
          "inputSchema": {
            "properties": {
              "gpu": {
                "description": "GPU id (e.g. 'h100-sxm-80gb') or name (e.g. 'H100 SXM')",
                "type": "string"
              }
            },
            "required": ["gpu"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17e0c71c9afb639b48119ed293281adcb275e139619a2c607cc224130ef4431b"
        },
        {
          "name": "list_gpus",
          "title": "List GPU models",
          "description": "All tracked GPU models with VRAM, the cheapest price you can rent each at right now (data center and community) and how many clouds have it in stock.",
          "inputSchema": {
            "properties": {
              "gpu": {
                "description": "GPU id or name fragment, e.g. 'H100', 'B200', 'RTX 4090', 'h100-sxm-80gb'. Comma-separated for several.",
                "type": "string"
              },
              "in_stock_only": {
                "description": "Only GPUs rentable somewhere right now (default true)",
                "type": "boolean"
              },
              "min_vram": {
                "description": "Minimum VRAM in GB",
                "type": "number"
              },
              "vendor": {
                "enum": ["NVIDIA", "AMD"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f970edf4fa4a6cea405a5b34356c953c08289adee28f0d8db6a8a5f34e5427b"
        },
        {
          "name": "list_providers",
          "title": "List GPU clouds",
          "description": "Every GPU cloud in the index, with its website, whether it is a marketplace or reseller, and how many offers it has in stock.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e1c7b39e05f28178cb2411dfd87b716a060a003e7d19e13cf5a199db14f2acdb"
        },
        {
          "name": "search_gpu_offers",
          "title": "Search GPU offers",
          "description": "Find single cloud GPUs (on demand) you can rent right now, cheapest first, across all tracked clouds. Returns price per GPU-hour in USD, cloud, stock level, regions and a link to rent.",
          "inputSchema": {
            "properties": {
              "cloud_type": {
                "description": "datacenter = provider's own data centers; community = marketplace hosts (cheaper, less reliable)",
                "enum": ["datacenter", "community"],
                "type": "string"
              },
              "exclude_resellers": {
                "description": "Drop resellers and offers read through a reseller",
                "type": "boolean"
              },
              "gpu": {
                "description": "GPU id or name fragment, e.g. 'H100', 'B200', 'RTX 4090', 'h100-sxm-80gb'. Comma-separated for several.",
                "type": "string"
              },
              "include_unavailable": {
                "description": "Also return offers that cannot be rented right now (default false)",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 20, max 200)",
                "type": "number"
              },
              "max_price": {
                "description": "Maximum USD per GPU-hour",
                "type": "number"
              },
              "min_vram": {
                "description": "Minimum VRAM in GB",
                "type": "number"
              },
              "pricing": {
                "description": "Default on_demand. spot is cheaper but the provider can stop it at any time.",
                "enum": ["on_demand", "spot", "any"],
                "type": "string"
              },
              "provider": {
                "description": "Cloud id(s), comma-separated, e.g. 'runpod,lambda'",
                "type": "string"
              },
              "region": {
                "description": "ISO country code or name (US, DE, Germany), an area (Europe, North America, Asia, Oceania, South America, Africa), a data center id, or a city",
                "type": "string"
              },
              "sort": {
                "description": "Default price (cheapest first)",
                "enum": ["price", "vram"],
                "type": "string"
              },
              "vendor": {
                "enum": ["NVIDIA", "AMD"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:42bed6205f19ec8dfb11a60a7d5d500bfe0e4304e9d6c388d008351c9947b8ac"
        }
      ],
      "digest": "sha256:b20c982a7b3f47aff323c4539bcd8e49635ac2bff3f5bc402afd761879f6bf6f"
    }
  }
}
