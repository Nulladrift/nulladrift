      },
      "instructions": "Desert Road Catholic is a free, independent daily companion for Catholic men making Exodus 90 (not affiliated with Exodus 90). Day 1 is Monday, January 11, 2027 and Day 90 is Saturday, April 10, 2027. Use the read tools to answer questions about the reading plan, stages and prayers, and the Rosary tools for today's Rosary mysteries and the free guided Rosary at https://desertroadcatholic.com/armory/rosary/. Use get_daily for the liturgical day of a date (November 9, 2026 to December 31, 2027): the celebration, Mass reading citations, fast and abstinence, saints and the Rosary mysteries; with no date it uses today in US Eastern time. Use get_follow_options for the official start date and its source, Day 90 and Easter by our count, days until Day 1, and how to follow along: the web and the free iPhone app (App Store) are live today; Android is coming soon and has no link yet. This server takes no sign-ups and no email addresses. Registration is free and happens on the website: https://desertroadcatholic.com/#register. If the user wants to register, give them that link.",
      "tools": [
        {
          "name": "get_daily",
          "title": "The liturgical day",
          "description": "Call this when the user asks about today's or a given date's liturgical day: the feast or saint, the Mass reading citations, whether it is a day of fasting or abstinence, the season or liturgical color, or the Rosary mysteries for that date. Covers November 9, 2026 to December 31, 2027, following the General Roman Calendar for the United States. Returns the celebration, rank, season and color, fast and abstinence, the reading citations with a link to the readings on the USCCB site, the saints, the quote of the day with its source, the Rosary mysteries with links to the free guided Rosary, the Exodus 90 day number from January 11 to April 10, 2027, and links to the day's page, month calendar and calendar feed. With no arguments it uses today's date in US Eastern time (America/New_York), because this server cannot see the user's time zone; pass date (YYYY-MM-DD) for the user's own date. Set include_text to true to add the Douay-Rheims (Challoner) text of the passages, which differs from the translation read at Mass; some readings are citations only. Desert Road Catholic is independent and not affiliated with the USCCB or Exodus 90. Example: \"What are today's Mass readings?\" or get_daily with {\"date\": \"2027-02-10\", \"include_text\": true}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Calendar date, YYYY-MM-DD, from 2026-11-09 to 2027-12-31. Leave out for today in US Eastern time.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "include_text": {
                "default": false,
                "description": "Add the Douay-Rheims (Challoner) text of the readings that have it. Default false (citations only).",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "abstinence_day": {
                "description": "A day of abstinence from meat.",
                "type": "boolean"
              },
              "calendar_feed_url": {
                "description": "Calendar feed for every date.",
                "type": "string"
              },
              "celebration": {
                "description": "The day's celebration: id, name, rank, rank_label, season, season_label, colors, color_label, holy_day_of_obligation.",
                "type": "object"
              },
              "citation_only": {
                "description": "Readings with no Douay-Rheims text on the site.",
