            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90ebf872bba1a9e57b1643b7fd9b35d3c111688fd64c11b5726b3448edf6d685"
        },
        {
          "name": "get_trigger_memory",
          "description": "Retrieve psychological trigger profile for a subject.\n\n    Returns which conversation topics consistently cause stress (active triggers) and which have been resolved over time.\n\n    - active triggers: topics where stress was elevated across multiple sessions. Tread carefully.\n    - resolved triggers: topics where stress has decreased. Safe to explore deeper.\n\n    Each trigger includes observation_count, avg_score, peak_score, and last_seen.\n\n    Requires prior ingest calls with the same subject_id. Not a medical device.\n    ",
          "inputSchema": {
            "properties": {
              "subject_id": {
                "title": "Subject Id",
                "type": "string"
              }
            },
            "required": ["subject_id"],
            "title": "get_trigger_memoryArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:58b875264dcc50678d0e3afa5379581bfe6b317d1464611ee86dc95005aa419d"
        },
        {
          "name": "ingest",
          "description": "Send biometric signals from any sensor, get unified state back.\n\n    Required: session_id + timestamp (ISO 8601) + at least one signal.\n    Send whatever you have — the API fuses all signals into one state.\n\n    Common signals (highest impact):\n    - heart_rate (bpm, 30-220) + rmssd (ms) — cardiovascular\n    - tone: calm | tense | anxious | hostile — vocal\n    - sentiment: -1.0 to 1.0 — textual\n    - expression: relaxed | neutral | tense — visual\n\n    For trigger memory (cross-session psychological tracking):\n    - Include subject_id (consistent per user, hashed)\n\n    Returns same fields as get_human_state plus signals_received list and topics_detected (if conversation text was included).\n\n    source_device is optional but improves confidence scoring. Not a medical device.\n    ",
