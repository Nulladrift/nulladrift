        {
          "name": "get_human_state",
          "description": "Get current unified human state for a session. Call this before generating important responses.\n\n    Returns:\n    - state: calm | relaxed | focused | stressed | acute_stress\n    - stress_score: 0-100 (lower = calmer)\n    - confidence: 0.0-1.0 (based on signal quality and device type)\n    - suggested_action: maintain_engagement | simplify_and_focus | de-escalate_and_shorten | pause_and_ground\n    - action_reason: human-readable explanation of why this action was suggested\n    - adaptation_effectiveness (on 2nd+ call): shows whether your previous suggested_action actually reduced stress — contains previous_action, stress_delta, and effective boolean. Use this to self-improve.\n\n    Use suggested_action to adapt your response: calm/relaxed = full complexity, focused = shorter and structured, stressed = max 2 sentences, acute_stress = one grounding sentence only.\n\n    Requires a prior ingest call to have data. Not a medical device.\n    ",
          "inputSchema": {
            "properties": {
              "session_id": {
                "title": "Session Id",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "title": "get_human_stateArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5c4643f238929810f9ebe52f99709774361261da5352eba23fbe8b7d4bf12506"
        },
        {
          "name": "get_session_history",
          "description": "Get state history for a session over time.\n\n    Returns timestamped datapoints with stress_score, state, and heart_rate for each observation.\n    Includes an overall trend: rising | falling | stable.\n\n    Use minutes parameter to control the lookback window (default: 5, max: 60).\n    Useful for detecting stress patterns during a conversation. Not a medical device.\n    ",
          "inputSchema": {
            "properties": {
              "minutes": {
                "default": 5,
                "maximum": 60,
                "minimum": 1,
                "title": "Minutes",
                "type": "integer"
              },
              "session_id": {
                "title": "Session Id",
                "type": "string"
              }
            },
            "required": ["session_id"],
            "title": "get_session_historyArguments",
            "type": "object"
          },
