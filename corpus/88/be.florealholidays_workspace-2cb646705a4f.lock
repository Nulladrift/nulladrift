        {
          "name": "get_stay_price",
          "title": "Price of a stay",
          "description": "Live all-in price and availability for a stay at one Floreal location, per accommodation type, for the given arrival date, number of nights and party. Each option carries its kind (hotel room, studio, apartment, chalet, glamping, camping pitch) and how many people it sleeps. Pass a packageId from list_arrangements to price that specific package. With flexibleDays the same call also prices the days around the arrival; when the exact date is full the answer already lists \"alternatives\" within three days. The answer carries a bookingUrl: the same search on our own booking site — always share it so the guest can book. When the guest has not chosen a location yet, use search_stays instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "description": "Number of adults",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "arrival": {
                "description": "Arrival date (YYYY-MM-DD)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "babies": {
                "description": "Number of babies (under 2)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "children": {
                "description": "Number of children (under 12)",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "domain": {
                "description": "Location slug from list_locations, e.g. \"floreal-blankenberge\"",
                "type": "string"
              },
              "flexibleDays": {
                "description": "Also search this many days before and after the arrival date, in the same call (0 = that day only). Use it for \"around the 12th\" or \"some weekend in July\". When the exact date has nothing, the tool already looks 3 days around it by itself.",
                "maximum": 14,
                "minimum": 0,
                "type": "integer"
              },
              "lang": {
                "description": "Language for accommodation names; defaults to Dutch, the language they are maintained in",
                "enum": ["nl", "fr", "en"],
                "type": "string"
              },
              "nights": {
                "description": "Number of nights",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "packageId": {
                "description": "Package id from list_arrangements (optional)",
                "type": "string"
              },
              "pets": {
                "description": "Number of pets",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["adults", "arrival", "domain", "nights"],
            "type": "object"
          },
