        {
          "name": "search_stays",
          "title": "Search stays across all locations",
          "description": "Find where Floreal Holidays has a stay available, across every location in one call, with the live all-in price per accommodation type. Use this whenever the guest has not picked a location yet — \"somewhere at the Belgian coast in July\", \"a hotel room in the Ardennes with a dog\", \"the cheapest week for a family of four\". Narrow with `region` (coast, ardennes, kempen, gaume, wallonie-picarde), with `accommodation` (hotel_room, studio, apartment, chalet, mobile_home, glamping, camping_pitch, or plain words like \"hotel\", \"appartement\", \"chalet\") or with `maxPrice`; widen with `flexibleDays`. Results are sorted cheapest first, one cheapest option per accommodation type, and each result carries a bookingUrl for that location — always share it so the guest can book. When nothing matches, the answer lists \"alternatives\" within three days. For one known location get_stay_price gives the full picture.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "accommodation": {
                "description": "Accommodation kind (hotel_room, studio, apartment, chalet, mobile_home, glamping, camping_pitch) or a word from the type name, e.g. \"hotel\", \"apartment\", \"chalet\", \"tent\"",
                "type": "string"
              },
              "adults": {
                "description": "Number of adults",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "arrival": {
                "description": "Arrival date (YYYY-MM-DD)",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "babies": {
                "description": "Number of babies (under 2)",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "children": {
                "description": "Number of children (under 12)",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "domains": {
                "description": "Location slugs to limit the search to; takes precedence over region",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "flexibleDays": {
                "description": "Also search this many days before and after the arrival date, in the same call (0 = that day only). Use it for \"around the 12th\" or \"some weekend in July\". When the exact date has nothing, the tool already looks 3 days around it by itself.",
                "maximum": 14,
                "minimum": 0,
                "type": "integer"
              },
              "lang": {
                "description": "Language for accommodation names; defaults to Dutch, the language they are maintained in",
                "enum": ["nl", "fr", "en"],
                "type": "string"
              },
              "maxPrice": {
                "description": "Highest acceptable all-in price for the whole stay, in euro",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "nights": {
                "description": "Number of nights",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "pets": {
                "description": "Number of pets",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "region": {
                "description": "Region to limit the search to: coast, ardennes, kempen, gaume, wallonie-picarde (Dutch/French names work too)",
                "type": "string"
              }
            },
            "required": ["adults", "arrival", "nights"],
            "type": "object"
          },
