        {
          "name": "list_accommodation_types",
          "title": "Accommodation types of a location",
          "description": "What kinds of accommodation one Floreal Holidays location offers — hotel rooms, studios, apartments, chalets, glamping, camping pitches — each with how many people it sleeps and an indicative \"from\" price. Use this for questions about what a location has (\"does Blankenberge have hotel rooms?\", \"are there apartments in Nieuwpoort?\"). A location can combine several kinds. Without a date it probes the next two months and every length of stay up to a week, so it also finds types that need a fixed number of nights. The prices are samples; ask get_stay_price for the guest's own dates.",
