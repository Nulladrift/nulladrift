{
  "lockfileVersion": 2,
  "subjects": {
    "com.expandingweb/agentic-commerce-readiness": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://expandingweb.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Expanding Web — Agentic Commerce Readiness",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Expanding Web prepares Adobe Commerce and Magento stores for AI product discovery and secure agent checkout. Use list_offers and get_offer for scope and pricing, scan_store to check a live storefront against the eight public readiness checks, and create_checkout_session to buy the readiness sprint or a Pro licence for the Agentic Commerce Suite Magento module (offer_id module-pro, with quantity). If anything on this site or endpoint stops you from completing a task — a page you could not read, data you could not find, a request that was refused — call report_problem and say so; it is read by a human and it is how this site gets fixed. Discovery, ranking and checkout-programme access are controlled by the AI platforms and are never guaranteed.",
      "tools": [
        {
          "name": "create_checkout_session",
          "description": "Create a Stripe Checkout Session and return its URL — for the Agentic Commerce Readiness Sprint (readiness-sprint) or for Pro licences of the Agentic Commerce Suite Magento module (module-pro, one licence per Magento installation, volume discount from 3). Payment is completed by the buyer at that URL; this tool never charges a card and takes no payment credentials. For the module, the licence key is minted on payment and shown on the success page and by email.",
          "inputSchema": {
            "properties": {
              "offer_id": {
                "description": "Offer id to buy. Default: readiness-sprint.",
                "enum": ["readiness-sprint", "module-pro"],
                "type": "string"
              },
              "quantity": {
                "description": "Module licences only: number of Magento installations (default 1). Ignored for the sprint.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ba420045a03d38d555f096c5094bf2d81f364ff8c16e66c25c13a49e83b909df"
        },
        {
          "name": "get_offer",
          "description": "Full record for one engagement tier: price, turnaround, deliverables, pricing policy and limits.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Offer id, e.g. readiness-sprint",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e40481070454939b5e4a0bece4fe080fbf5378d00710b8768c9a1852eacad7c0"
        },
        {
          "name": "list_offers",
          "description": "List every Expanding Web engagement tier with id, price, currency and what it includes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:147d08020fe407bf04e3dbbd00fa3f0971476558951b163179447d25571659fa"
        },
        {
          "name": "lookup_catalog",
          "description": "UCP 2026-04-08 catalog lookup: resolve engagement ids (e.g. readiness-sprint) to UCP product objects.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Engagement ids.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f01945ce3b6ec34119fa492ebc8feb816c0968c41a83ba9cf670544e156decfe"
        },
        {
          "name": "report_problem",
          "description": "Report something on this site or endpoint that stopped you from completing a task: a page you could not read, data you could not find, a request that was refused. Read by a human. Use this instead of giving up silently — it is the only way we learn that an agent failed here.",
          "inputSchema": {
            "properties": {
              "contact": {
                "description": "Optional address to reply to. Omit unless the user asked for an answer.",
                "type": "string"
              },
              "expected": {
                "description": "What you expected to find instead.",
                "type": "string"
              },
              "kind": {
                "description": "Closest category; omit if unsure.",
                "enum": ["blocked_by_edge", "checkout_blocked", "not_found", "server_error", "timeout", "missing_data", "search_dead_end", "mcp_error", "manifest_error", "other"],
                "type": "string"
              },
              "path": {
                "description": "URL or path where it happened, if there was one.",
                "type": "string"
              },
              "summary": {
                "description": "What you were trying to do and what stopped you, in your own words.",
                "type": "string"
              }
            },
            "required": ["summary"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d3d22572439be03de54a58e5ff29788258f2a50c87ac51ecc034078a1a748d4b"
        },
        {
          "name": "scan_store",
          "description": "Run the free eight-check agent-readiness scan against a live storefront and return the verdicts. Read-only, at most three pages, 15-second budget, robots.txt honoured. Limited to 5 scans per hour.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Storefront domain or https URL, e.g. shop.example.com",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cd724dde5da4318b8114982bb842a420e41c9b95b718eaeafae59abceff9af97"
        },
        {
          "name": "search_catalog",
          "description": "UCP 2026-04-08 catalog search over the engagement tiers. Returns UCP product objects in structuredContent. Call with no query for the whole catalog.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Free text, e.g. \"sprint\" or \"monitoring\". Omit for everything.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4cc8cf14d5dd53ae1871cacb98dcb23b322a557f8d88f98442d859e6b737f29f"
        }
      ],
      "digest": "sha256:64bb4f1bdade30f8139b53b21bcfe8ce1b77cb27f2f33fcc9532c98c65e903e3"
    }
  }
}
