      "instructions": "esimoa is a travel eSIM comparison and shop. Use search_esims to compare plans for a destination (sort: recommended, price, data, price_per_gb, validity). Use its filters instead of scanning results — local_number (local phone number), network (local or roaming), data_type (daily or total), unlimited, countries (several countries at once), max_price_krw, hotspot, five_g. Use compare_esims with 2-5 plan ids to compare plans side by side. Pass lang in the user’s language. Prices are in KRW. Each plan has a `url` to its page on esimoa.com, where the user can review and buy it.",
      "tools": [
        {
          "name": "compare_esims",
          "title": "Compare eSIM plans side by side",
          "description": "Compare 2 to 5 esimoa (이심모아) eSIM plans side by side by id (ids come from search_esims): price, data, validity, price per GB, coverage, network, hotspot and local phone number. Returns which plan has the lowest price, most data, longest validity and lowest price per GB, and each plan page `url` on esimoa.com. Prices are in KRW.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Plan ids from search_esims.",
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "lang": {
                "description": "Language for country names and the plan page. Match the user’s language (ko, en, ja, zh-CN, zh-TW, es, fr, ar, vi, th, id, it, de).",
                "enum": ["ko", "en", "ja", "zh-CN", "zh-TW", "es", "fr", "ar", "vi", "th", "id", "it", "de"],
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "highlights": {
                "description": "Plan id that is best on each measure among the compared plans (null when tied or unknown).",
                "properties": {
                  "longestValidity": {
                    "type": ["string", "null"]
                  },
                  "lowestPrice": {
                    "type": ["string", "null"]
                  },
                  "lowestPricePerGb": {
                    "type": ["string", "null"]
                  },
                  "mostData": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "items": {
                "items": {
                  "properties": {
                    "countryCode": {
                      "type": ["string", "null"]
                    },
                    "countryName": {
                      "type": ["string", "null"]
                    },
                    "coverageCountries": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "currency": {
                      "enum": ["KRW"],
                      "type": "string"
                    },
                    "dataAmount": {
                      "type": "string"
                    },
                    "dataAmountGB": {
                      "type": ["number", "null"]
                    },
                    "dataType": {
                      "description": "daily | total | null (unknown)",
                      "type": ["string", "null"]
                    },
                    "hasLocalNumber": {
                      "type": "boolean"
                    },
                    "hotspot": {
                      "type": ["boolean", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "isLocalNetwork": {
                      "type": "boolean"
                    },
                    "isMultiCountry": {
                      "type": "boolean"
                    },
                    "isUnlimited": {
                      "type": "boolean"
                    },
                    "networkType": {
                      "type": ["string", "null"]
                    },
                    "priceKrw": {
                      "type": "number"
                    },
                    "provider": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Plan page on esimoa.com",
                      "type": "string"
                    },
                    "validityDays": {
                      "type": "number"
                    }
                  },
                  "required": ["currency", "id", "priceKrw", "title", "url", "validityDays"],
                  "type": "object"
                },
                "type": "array"
              },
              "lang": {
                "enum": ["ko", "en", "ja", "zh-CN", "zh-TW", "es", "fr", "ar", "vi", "th", "id", "it", "de"],
                "type": "string"
              },
              "notFound": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["highlights", "items"],
            "type": "object"
