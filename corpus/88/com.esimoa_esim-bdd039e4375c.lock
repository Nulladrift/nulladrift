        {
          "name": "search_esims",
          "title": "Search & compare travel eSIMs",
          "description": "Search the travel eSIM catalog of esimoa (이심모아) and compare plans for a destination. Filter by trip length, data, unlimited or daily data, local phone number, local or roaming network, multi-country coverage, price, provider, hotspot and 5G. Sort by \"recommended\" (esimoa’s default order), \"price\" (lowest first), \"data\" (most data first), \"price_per_gb\" or \"validity\" (longest first). Each result includes its `id` (for get_esim and compare_esims) and a `url` to the plan page on esimoa.com. Prices are in KRW.",
          "inputSchema": {
            "properties": {
              "countries": {
                "description": "Multi-country trip — only plans that work in ALL of these countries (ISO codes or names). Use instead of country.",
                "items": {
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "country": {
                "description": "Destination country — ISO code (JP) or name in any language (Japan, 일본).",
                "type": "string"
              },
              "data_gb": {
                "description": "Minimum data needed in GB.",
                "minimum": 0,
                "type": "number"
              },
              "data_type": {
                "description": "daily = data allowance resets every day; total = one allowance for the whole trip.",
                "enum": ["daily", "total"],
                "type": "string"
              },
              "days": {
                "description": "Trip length in days. Plans covering at least this many days (and not much longer) are returned.",
                "minimum": 1,
                "type": "integer"
              },
              "five_g": {
                "description": "true = 5G network. Checked within the top 50 matches, so the total is approximate.",
                "type": "boolean"
              },
              "hotspot": {
                "description": "true = hotspot/tethering supported. Checked within the top 50 matches, so the total is approximate.",
                "type": "boolean"
              },
              "lang": {
                "description": "Language for country names and the plan page. Match the user’s language (ko, en, ja, zh-CN, zh-TW, es, fr, ar, vi, th, id, it, de).",
                "enum": ["ko", "en", "ja", "zh-CN", "zh-TW", "es", "fr", "ar", "vi", "th", "id", "it", "de"],
                "type": "string"
              },
              "limit": {
                "description": "Number of plans (default 5, max 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "local_number": {
                "description": "true = only plans that include a local phone number for calls/SMS.",
                "type": "boolean"
              },
              "max_data_gb": {
                "description": "Maximum data in GB.",
                "minimum": 0,
                "type": "number"
              },
              "max_price_krw": {
                "description": "Maximum price in KRW (budget).",
                "minimum": 0,
                "type": "integer"
              },
              "min_price_krw": {
                "description": "Minimum price in KRW.",
                "minimum": 0,
                "type": "integer"
              },
              "multi_country": {
                "description": "true = multi-country (regional) plans only; false = single-country plans only.",
                "type": "boolean"
              },
              "network": {
                "description": "local = local carrier network (usually faster); roaming = roaming network.",
                "enum": ["local", "roaming"],
                "type": "string"
              },
              "provider": {
                "description": "Provider code exactly as returned in results (e.g. from a previous search).",
                "type": "string"
              },
              "sort": {
                "description": "recommended | price | data | price_per_gb | validity",
                "enum": ["recommended", "price", "data", "price_per_gb", "validity"],
                "type": "string"
              },
              "unlimited": {
                "description": "Only unlimited-data plans.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "countryCode": {
                      "type": ["string", "null"]
                    },
                    "countryName": {
