        {
          "name": "search",
          "title": "Search esimoa eSIMs",
          "description": "Free-text search of esimoa (이심모아) eSIM plans in the search/fetch format used by ChatGPT deep research, e.g. \"Japan 7 days unlimited\" or \"USA 3 days local phone number\". Understands unlimited, daily, local phone number, local network, hotspot and 5G. Returns ids to use with fetch. When you can fill filters, prefer search_esims.",
