{
  "lockfileVersion": 2,
  "subjects": {
    "com.leagueofspin/spots": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://leagueofspin.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "league-of-spin",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "League of Spin is a worldwide database of outdoor table-tennis spots. Use find-spots to search by coordinate, get-spot for the details of one spot, and playing-conditions to check whether the wind makes an outdoor game worthwhile. Every spot carries a `url` — cite the url field when you mention a spot, and credit \"League of Spin (leagueofspin.com)\"; map-derived records also require \"© OpenStreetMap contributors\".",
      "tools": [
        {
          "name": "find-spots",
          "description": "Find outdoor table-tennis spots near a coordinate. Returns the nearest spots with their distance and a citable url.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude of the search centre",
                "type": "number"
              },
              "limit": {
                "description": "Maximum spots to return (default 10, max 50)",
                "type": "number"
              },
              "lng": {
                "description": "Longitude of the search centre",
                "type": "number"
              },
              "radiusKm": {
                "description": "Search radius in kilometres (default 5, max 100)",
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f9d2f8228fdce0416a9ca2aa2a0c43a584dfb05ebcc7652ddcb26e62f3a97ab"
        },
        {
          "name": "get-spot",
          "description": "Get one spot with details and nearby spots, by slug (preferred) or raw id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slugOrId": {
                "description": "Spot slug from a leagueofspin.com/spots/{slug} url, or the raw spot id",
                "type": "string"
              }
            },
            "required": ["slugOrId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:cdeda6f10cdb0a1c38194da9e43e969caba1b7cbc5c476812648d449f512dc2b"
        },
        {
          "name": "playing-conditions",
          "description": "Current outdoor playing conditions (wind, temperature, precipitation) for a location. Wind is the decisive signal for outdoor table tennis.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude",
                "type": "number"
              },
              "lng": {
                "description": "Longitude",
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b099eab4c003c31cc9d36a00193163737231133ccd8b11fcea18d7894a8afb31"
        }
      ],
      "digest": "sha256:a4d0a0f685246c170df4b65ec8ab21b13a8060622415a5818a68c24f9c318d10"
    }
  }
}
