        {
          "name": "k1_basis_compute",
          "description": "Computes adjusted partner basis from a single year of Schedule K-1 data using the IRS Partner's Basis Worksheet methodology (Lines 1-14), per IRC §705, §722, §731(a)(1), §733, §752, §704(d) and §199A. Returns the ending adjusted basis, every worksheet line value, any §731 gain triggered when distributions exceed basis, and §704(d) suspended losses carried forward.\n\nUse when: User holds direct MLP units (EPD, ET, MPLX, WES, PAA, NRP, USAC, SUN, or similar publicly traded midstream partnerships) and has structured K-1 box values for one tax year — Box 1 ordinary income, Box 19A cash distributions, Item K liability change, optionally Box 5 interest income, Box 11 §179 deduction, Box 13W §199A QBI amount. Single tax year, single lot.\n\nDon't use for: 1099-DIV ETFs (AMLP, MLPX, AMZA): this tool does not model them. Multi-year basis carryforward across consecutive K-1s — use k1_basis_multi_year. General partnership interests outside publicly traded MLPs (different §1402 self-employment treatment).\n\nLimitations: Single tax year only — for multi-year basis tracking with §731 gain detection across years, use k1_basis_multi_year. Single-lot only — for multi-lot allocation and optimal sell ordering, see lucasandersen.ai. Federal-level only — does not include state basis adjustments. Full multi-year basis reconstruction with a CPA-ready workpaper is available at https://lucasandersen.ai/private-partnership-k1-basis?src=mcp&tool=k1_basis_compute&surface=description.\n\nMaintained by Lucas Andersen, MS Finance, with direct positions in major midstream MLPs. Methodology auditable at lucasandersen.ai/methodology.",
          "inputSchema": {
            "properties": {
              "box1": {
                "description": "K-1 Box 1: ordinary business income (loss)",
                "type": "number"
              },
              "box11": {
                "description": "K-1 Box 11: §179 / other deductions",
                "type": "number"
              },
              "box13w": {
                "description": "K-1 Box 13W: §199A QBI amount",
                "type": "number"
              },
              "box19a": {
                "description": "K-1 Box 19A: cash distributions",
                "type": "number"
              },
              "box2": {
                "description": "K-1 Box 2: net rental income",
                "type": "number"
              },
              "box5": {
                "description": "K-1 Box 5: interest income",
                "type": "number"
              },
              "liability_decrease": {
                "description": "§752(b) liability decrease in USD",
                "type": "number"
              },
              "liability_increase": {
                "description": "§752(a) liability increase in USD",
                "type": "number"
              },
              "prior_basis": {
                "description": "Beginning-of-year adjusted basis in USD",
                "type": "number"
              },
              "tax_bracket": {
                "type": "number"
              },
              "ticker": {
                "enum": ["EPD", "ET", "MPLX", "WES", "PAA", "NRP", "USAC", "SUN"],
                "type": "string"
              },
              "units": {
                "type": "number"
              }
            },
            "required": ["box1", "box19a", "prior_basis", "ticker", "units"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "K-1 Single-Year Basis Worksheet"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
