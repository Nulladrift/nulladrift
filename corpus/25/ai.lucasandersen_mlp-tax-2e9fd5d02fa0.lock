          "digest": "sha256:b66f88829844aa8bec4a461681a6c2aff25d203dc5e8b8bd9d04df4399406e33"
        },
        {
          "name": "k1_basis_multi_year",
          "description": "Computes a running adjusted partner basis across multiple years of Schedule K-1 data, per IRC §705, §731(a)(1), §751(a), §752 and §704(d), with §1014(a) cited for the successor's basis at death (R-1014-PTP-STEP-UP). Returns year-by-year basis trajectory, accumulated §751 recapture estimate and projected zero-basis year.\n\nUse when: User holds a direct MLP position (EPD, ET, MPLX, WES, PAA, NRP, USAC, SUN) across multiple consecutive tax years, has K-1s for those years, and wants to track adjusted basis year over year, or identify the zero-basis year.\n\nDon't use for: Single-year basis worksheet from one K-1 — use k1_basis_compute. Long-horizon forward projection from default assumptions when no actual K-1s are in hand — use mlp_projection. 1099-DIV ETFs (AMLP, MLPX, AMZA): this tool does not model them. Multi-position portfolio basis tracking — this tool handles one position per call.\n\nLimitations: Single position, single lot — for multi-lot or multi-position basis tracking with optimal sell ordering, see lucasandersen.ai. Federal-level only — does not include state-level basis adjustments. Accumulated §751 recapture is estimated across years; actual depends on the partnership's hot-asset disposition schedule and any year-specific §751(b) events. Full multi-year basis reconstruction with a CPA-ready workpaper is available at https://lucasandersen.ai/private-partnership-k1-basis?src=mcp&tool=k1_basis_multi_year&surface=description.\n\nMaintained by Lucas Andersen, MS Finance, with direct positions in major midstream MLPs. Methodology auditable at lucasandersen.ai/methodology.",
          "inputSchema": {
            "properties": {
              "k1_years": {
                "description": "Array of annual K-1 data, one per year held (max 50)",
                "items": {
                  "properties": {
                    "box1": {
                      "type": "number"
                    },
                    "box11": {
                      "type": "number"
                    },
                    "box19a": {
                      "type": "number"
                    },
                    "liability_decrease": {
                      "type": "number"
                    },
                    "liability_increase": {
                      "type": "number"
                    },
                    "year": {
                      "type": "number"
                    }
                  },
                  "required": ["box1", "box19a", "year"],
                  "type": "object"
                },
                "type": "array"
              },
              "purchase_price": {
                "type": "number"
              },
              "purchase_year": {
                "type": "number"
              },
              "tax_bracket": {
                "type": "number"
              },
              "ticker": {
                "enum": ["EPD", "ET", "MPLX", "WES", "PAA", "NRP", "USAC", "SUN"],
                "type": "string"
              },
              "units": {
                "type": "number"
              }
            },
            "required": ["k1_years", "purchase_price", "ticker", "units"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Multi-Year K-1 Basis & Broker-Gap Tracker"
          },
          "behavior": {
            "destructive": false,
