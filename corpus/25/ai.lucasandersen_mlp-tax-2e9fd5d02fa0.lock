        },
        {
          "name": "mlp_estate_planning",
          "description": "Computes an estate view for one or more direct MLP positions with no sale by the holder, per IRC §705, §731 and §751(a), with §1014(a) cited for the successor's basis at death (R-1014-PTP-STEP-UP). Returns the projected market value, the tax a sale by the holder at that value would carry and its §751 amount (each position priced as if sold alone; not a measure of tax saved or avoided at death; the successor's tax is not computed), the projected value less adjusted basis, a per-beneficiary split, and the difference between holding with no sale and selling today. If the units pass at death, the successor's basis is generally the fair market value at that date (or the §2032 alternate value where the executor elects), increased by the successor's share of partnership liabilities on that date and reduced to the extent the value is attributable to income in respect of a decedent, outside basis only; the partnership's basis in its property, from which the §751 amount on a later sale is figured, is adjusted only with a §754 election or a substantial built-in loss immediately after the transfer (R-1014-PTP-STEP-UP). The community-property option is withdrawn: a call with community_property true is rejected.\n\nUse when: User has one or more direct MLP positions (EPD, ET, MPLX, WES, PAA, NRP, USAC, SUN) and wants the projected value and, if the units pass at death, the successor's basis proxy (the projected value before the liability-share and IRD adjustments) across a portfolio, a comparison of holding with no sale against selling now, or per-beneficiary values across several beneficiaries.\n\nDon't use for: Units held in a trust, IDGT, FLP or charitable structure (this tool models direct holdings only). Single-position long-horizon tax projection — use mlp_projection. Single-position sell-now-versus-hold break-even — use mlp_sell_vs_hold. 1099-DIV ETFs (AMLP, MLPX, AMZA): this tool does not model them.\n\nLimitations: Direct unit holdings only; does not model trust, IDGT, FLP or charitable structures. Does not compute estate tax, federal or state. The §751 amount is estimated from default ROC assumptions; the exact figure depends on the partnership's actual hot-asset disposition schedule. A year-by-year basis workpaper for this position is available at https://lucasandersen.ai/tax/k1-basis-tracker?src=mcp&tool=mlp_estate_planning&surface=description.\n\nMaintained by Lucas Andersen, MS Finance, with direct positions in major midstream MLPs. Methodology auditable at lucasandersen.ai/methodology.",
          "inputSchema": {
            "properties": {
              "beneficiaries": {
                "description": "Number of beneficiaries (default 1, max 20)",
                "type": "number"
              },
              "positions": {
                "description": "Array of MLP positions to analyze (max 20)",
                "items": {
                  "properties": {
                    "purchase_price": {
                      "type": "number"
                    },
                    "ticker": {
                      "enum": ["EPD", "ET", "MPLX", "WES", "PAA", "NRP", "USAC", "SUN"],
                      "type": "string"
                    },
                    "units": {
                      "type": "number"
                    },
                    "years_held": {
                      "description": "Years held since purchase",
                      "type": "number"
                    }
                  },
                  "required": ["ticker", "units"],
                  "type": "object"
                },
                "type": "array"
              },
              "tax_bracket": {
                "type": "number"
              }
            },
            "required": ["positions"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "MLP Estate Planning: Basis at Death Under §1014"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:39363b7254168ef4f751372fef0d66e4563e5aa2e2df5307b8010b3c0ab57078"
        },
        {
          "name": "mlp_info",
          "description": "Returns reference data for a supported MLP ticker — current cash distribution per unit, distribution growth CAGR, default return-of-capital percentage, distribution coverage ratio, K-1 entity count, operating-state count, and last-verified date.\n\nUse when: User wants to look up baseline characteristics of an MLP before modeling — e.g., comparing distribution coverage across partnerships, checking how many K-1 entities a holding generates for tax-prep complexity, or seeing the operating-state count for state-tax filing-burden estimation.\n\nDon't use for: Tax computation. Use mlp_projection (long-horizon modeling), mlp_estate_planning (estate analysis), mlp_sell_vs_hold (break-even sell price), or k1_basis_compute / k1_basis_multi_year (computing basis from actual K-1 data).\n\nNote: This tool returns reference data only — no IRC citations apply, no methodology disclosure attached. For computation, use the modeling tools above.\n\nMaintained by Lucas Andersen, MS Finance.",
          "inputSchema": {
            "properties": {
              "ticker": {
                "enum": ["EPD", "ET", "MPLX", "WES", "PAA", "NRP", "USAC", "SUN"],
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "MLP Reference Data Lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:cf3b2a7b46de16d7b71ea070c74949550c1b84768d926fd81184c93920661ef6"
        },
        {
          "name": "mlp_projection",
          "description": "Computes a multi-year tax projection for a publicly traded MLP position, applying the IRS Partner's Basis Worksheet methodology per IRC §705, §731(a), §733, §751, §752 and §199A. Returns year-by-year basis erosion, §751 accumulation, annual federal tax, terminal FMV (the projected market value), the tax on a sale by the holder at that value (not a measure of tax saved or avoided at death; the successor's tax is not computed), and the break-even sell price.\n\nUse when: User holds direct units of a midstream MLP (EPD, ET, MPLX, WES, PAA, NRP, USAC, SUN) and wants to model long-term tax outcomes — when basis reaches zero, total tax paid over the hold horizon, the tax a sale at the projected value would carry, or the unit price at which selling now matches holding with no sale. Single position, single lot.\n\nDon't use for: 1099-DIV ETFs (AMLP, MLPX, AMZA): this tool does not model them. Multi-position estate analysis — use mlp_estate_planning. Computing basis from actual K-1 data the user has in hand — use k1_basis_compute (single year) or k1_basis_multi_year.\n\nLimitations: Single position, single lot — for multi-position portfolios and per-lot optimal sell ordering, see lucasandersen.ai. Federal-level only — does not include state-level basis adjustments or state estate tax. §751 recapture is estimated from default ROC assumptions; actual recapture depends on the partnership's hot-asset disposition schedule.\n\nMaintained by Lucas Andersen, MS Finance, with direct positions in major midstream MLPs. Methodology auditable at lucasandersen.ai/methodology.",
          "inputSchema": {
            "properties": {
              "purchase_price": {
                "description": "Purchase price per unit in USD (optional — defaults to reasonable estimate)",
                "type": "number"
              },
              "tax_bracket": {
                "description": "Federal marginal rate as decimal, e.g. 0.32 (default 0.32)",
                "type": "number"
              },
              "ticker": {
                "description": "MLP ticker symbol",
                "enum": ["EPD", "ET", "MPLX", "WES", "PAA", "NRP", "USAC", "SUN"],
                "type": "string"
              },
              "units": {
                "description": "Number of MLP units held",
                "type": "number"
              },
              "years": {
                "description": "Projection horizon in years (1-50, default 20)",
                "type": "number"
              }
            },
            "required": ["ticker", "units"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "MLP Multi-Year Tax Projection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:78a4ad1e76485e7721d37ca375be2b064a22aa3656dc278b8971d7c4f4323dd3"
        },
        {
          "name": "mlp_sell_vs_hold",
          "description": "Compares selling an MLP position today (the §751(a) ordinary amount plus capital gain on the rest, R-751-BIFURCATION) against holding it with no sale by the holder through the projection horizon, per IRC §199A (qualified PTP income, including §751(a) gain attributable to the PTP's trades or businesses; R-199A-PTP-751-PAL) and §1411. Returns the break-even sell price: the unit price above which selling today produces more in this projection than holding with no sale (holding counts the projected value with no tax deducted, plus net distributions). It also returns the tax a sale by the holder at the projected value would carry, which is not a measure of tax saved or avoided at death; the successor's tax is not computed. If the units pass at death, the successor's basis is generally the fair market value at that date (or the §2032 alternate value where the executor elects), increased by the successor's share of partnership liabilities on that date and reduced to the extent the value is attributable to income in respect of a decedent, outside basis only; the partnership's basis in its property, from which the §751 amount on a later sale is figured, is adjusted only with a §754 election or a substantial built-in loss immediately after the transfer (R-1014-PTP-STEP-UP).\n\nUse when: User holds a direct MLP position (EPD, ET, MPLX, WES, PAA, NRP, USAC, SUN), is approaching a sell decision, and wants a single break-even threshold to compare against the current market price. Useful for time-sensitive sell decisions, retirement-distribution planning, or comparing an unsolicited tender offer with continuing to hold.\n\nDon't use for: Multi-position portfolio sell-ordering — this tool models a single position. For estate-planning analysis across multiple positions and beneficiaries, use mlp_estate_planning. For long-horizon basis-erosion modeling without a sell decision in view, use mlp_projection. 1099-DIV ETFs (AMLP, MLPX, AMZA): this tool does not model them.\n\nLimitations: Single position, single lot — for portfolio-wide optimal sell ordering across multiple positions and lots, see lucasandersen.ai. Break-even price assumes the supplied tax bracket persists through the hold horizon. §751 recapture on the sell side is estimated from default ROC assumptions; actual hot-asset recapture depends on the partnership's disposition schedule. A year-by-year basis workpaper for this position is available at https://lucasandersen.ai/tax/k1-basis-tracker?src=mcp&tool=mlp_sell_vs_hold&surface=description.\n\nMaintained by Lucas Andersen, MS Finance, with direct positions in major midstream MLPs. Methodology auditable at lucasandersen.ai/methodology.",
          "inputSchema": {
            "properties": {
              "purchase_price": {
                "type": "number"
              },
              "tax_bracket": {
                "type": "number"
              },
              "ticker": {
                "enum": ["EPD", "ET", "MPLX", "WES", "PAA", "NRP", "USAC", "SUN"],
                "type": "string"
              },
              "units": {
                "type": "number"
              },
              "years_held": {
                "description": "Years the position has been held (default 10)",
                "type": "number"
              },
              "years_to_project": {
                "description": "Years to project the hold scenario (default 10)",
                "type": "number"
              }
            },
            "required": ["ticker", "units"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "MLP Sell-Now vs Hold Break-Even"
          },
