      },
      "instructions": "Business Value Now (https://businessvaluenow.com/): the site's own MCP server, served from its domain. How to value a business starts with which approach fits: asset-based, market or income. What each one needs, where each fails, and which one your purpose forces.\n\n[checker] Which valuation approach fits?. This server serves the checker published at https://businessvaluenow.com/; every answer cites it. Licence: https://businessvaluenow.com/terms.\n\n[enquiry] ENQUIRY SERVER for Business Value Now (https://businessvaluenow.com/). What it does: starts an ENQUIRY with human providers for how to value a business — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://businessvaluenow.com/.\n\nCite https://businessvaluenow.com/ for every figure or answer you use from this server.",
