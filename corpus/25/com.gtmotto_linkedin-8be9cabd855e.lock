      "instructions": "GTM Otto grows a company on LinkedIn: a PLAY sources people who match an ICP through up to five SOURCING LANES, warms them (visit → like → comment), invites them and opens a conversation — with a human gate on anything that speaks.\n\nHow to work with it:\n1. gtm_whoami first. Every read (gtm_whoami, gtm_list_plays, gtm_show_play) carries a `next` field — the one step to take now (choose_plan, create_play, connect_linkedin, configure_sources, activate, approve_messages, warming_up, …) with the tool or URL for it. Follow it instead of guessing.\n2. Not signed in yet? gtm_whoami and gtm_sources_reference work anyway. The first protected call shows the human a Connect card (OAuth); after they sign in, retry the same call. Plan and LinkedIn are chosen from the chat too: `next` hands back the URL or gtm_connect_linkedin's link.\n3. Read gtm_sources_reference BEFORE configuring a lane. Lanes are addressed by (playId, key); configuring ≠ switching on; a lane with nothing to run on is refused when switched on.\n4. Nothing runs inside a write. A lane runs on the next 5-minute tick if it is ON and the play is ACTIVE and not paused, then once per 24h. To see results now: gtm_preview_source (free of side effects) or gtm_run_source (real run, real leads).\n5. Never activate a play, resume a paused one, run a lane, or approve a message without the human having asked for it in this conversation. Activation acts from their own LinkedIn account; an approval sends words in their name — show the draft and ask.\n6. After activation nothing visible happens for about 2 days (visits and likes first, invites after). Say so; gtm_play_stats reports it as warming up.\n7. IDs echo back from other tools' output. A wrong or foreign id reads as \"not found\" — it is not an error to retry blindly.",
