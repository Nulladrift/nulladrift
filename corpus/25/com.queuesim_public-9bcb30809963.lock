        {
          "name": "compare_analytical_vs_simulated",
          "description": "Run the same M/M/c configuration through BOTH the closed-form Erlang-C formula AND the discrete-event simulator, returning a side-by-side comparison with deltas. Use this when the user is validating QueueSim's engine against textbook values, learning queueing theory by watching simulation converge on the formula, or auditing a result that 'feels off' — agreement within ~5% is the canonical sanity check for an M/M/c run. Pure-Exponential M/M/c only; the closed-form Erlang-C is undefined for other service distributions. Large deltas usually mean the simulation run was too short for steady-state — raise simulationDays. ANTI-FABRICATION: both sides come from real computation — closed-form is deterministic, simulation is stochastic but engine-backed. Quote both verbatim. Do not synthesize an 'average of the two' or recompute the formula from training-data recall.",
          "inputSchema": {
            "properties": {
              "arrivalRate": {
                "default": 20,
                "description": "Mean arrivals per hour (λ).",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "servers": {
                "default": 2,
                "description": "Number of parallel servers (c). Integer 1-50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "serviceRate": {
                "default": 12,
                "description": "Mean customers one server can finish per hour (μ). Must be > 0.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "simulationDays": {
                "default": 7,
                "description": "Days to simulate on the DES side. Closed-form is instant. Range 1-30; longer runs converge closer to the formula.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["arrivalRate", "servers", "serviceRate"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "analytical": {
                "properties": {
                  "avgQueueLength": {
                    "type": "number"
                  },
                  "avgWaitMinutes": {
                    "type": "number"
                  },
                  "offeredLoad": {
                    "type": "number"
                  },
                  "probabilityOfWaiting": {
                    "type": "number"
                  }
                },
                "required": ["avgQueueLength", "avgWaitMinutes", "offeredLoad", "probabilityOfWaiting"],
                "type": "object"
              },
