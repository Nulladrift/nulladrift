        {
          "name": "compare_separate_vs_pooled",
          "description": "Run the classic operations-research teaching demo: pooled queueing (one shared queue, c servers) vs separate queues (c independent queues, one server each, λ/c traffic to each). Both runs have identical total capacity (c × μ) and identical total arrivals (λ), so the offered load ρ is the same; the only structural difference is whether arrivals share a queue or split into c isolated streams. The pooled configuration ALWAYS produces shorter waits — that's the whole teaching point. Use this when the user asks 'should we pool our resources?' / 'should we cross-train?' / 'why do banks have one line instead of c?' / 'what's the cost of siloing my call center into specialist queues?'. Returns both runs side by side with the pooled-vs-separate wait delta. ANTI-FABRICATION: numbers come from two real DES runs. Quote them VERBATIM.",
          "inputSchema": {
            "properties": {
              "arrivalRate": {
                "default": 30,
                "description": "Mean total arrival rate (λ). Pooled run takes all of it; separate run divides evenly across the c queues.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "servers": {
                "default": 3,
                "description": "Number of servers (c). Pooled: one queue feeds all c. Separate: c independent queues, each with one server and λ/c traffic. Range 2-50 (with c=1 there's nothing to compare).",
                "maximum": 50,
                "minimum": 2,
                "type": "integer"
              },
              "serviceRate": {
                "default": 12,
                "description": "Mean service rate per server (μ, customers/hour each server finishes). Identical across both runs.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "simulationDays": {
                "default": 7,
                "description": "Days to simulate (same for both runs). Range 1-30.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["arrivalRate", "servers", "serviceRate"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hourly": {
                "items": {
                  "properties": {
                    "avgArrivals": {
                      "type": "number"
                    },
                    "avgDepartures": {
                      "type": "number"
                    },
                    "avgQueueLength": {
                      "type": "number"
                    },
                    "avgWaitMinutes": {
                      "type": "number"
                    },
                    "hour": {
                      "type": "integer"
                    },
                    "label": {
                      "type": "string"
                    },
