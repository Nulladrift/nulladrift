        {
          "name": "interpret_result",
          "description": "Given an M/M/c configuration (arrivalRate, serviceRate, servers) and optionally an observed average wait, returns a queueing-theory framed interpretation: where you sit on the utilization curve, what ρ means in plain language, what one more or fewer server would qualitatively do, and which complexity factors (priority, abandonment, skills routing) might be hiding in real data the M/M/c model can't see. Use this to TEACH while answering — when the user wants context around a number, not just the number itself. Pure text computation, no simulation, no RNG — deterministic output.",
          "inputSchema": {
            "properties": {
              "arrivalRate": {
                "default": 20,
                "description": "Mean arrivals per hour (λ).",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "observedAvgWaitMinutes": {
                "description": "Optional. The avg wait the user observed (from simulate_mmc, an Erlang-C calculator, or real measurements). If omitted, the tool computes ρ from the inputs and gives a parameter-only interpretation.",
                "minimum": 0,
                "type": "number"
              },
              "servers": {
                "default": 2,
                "description": "Server count (c).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "serviceRate": {
                "default": 12,
                "description": "Mean customers one server finishes per hour (μ).",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["arrivalRate", "servers", "serviceRate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Interpret M/M/c result"
          },
          "behavior": {
