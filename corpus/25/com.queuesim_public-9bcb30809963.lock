                    "maximum": 200,
                    "type": "number"
                  },
                  "servers": {
                    "description": "Override server count applied to every hour the scenario had staff.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "serviceCoV": {
                    "maximum": 5,
                    "minimum": 0,
                    "type": "number"
                  },
                  "serviceDistribution": {
