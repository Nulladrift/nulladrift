                  "type": "object"
                },
                "type": "array"
              },
              "inputs": {
                "description": "Echo of the run's parameters.",
                "type": "object"
              },
              "summary": {
                "properties": {
                  "effectiveDays": {
                    "type": "integer"
                  },
                  "offeredLoad": {
                    "type": ["number", "null"]
                  },
