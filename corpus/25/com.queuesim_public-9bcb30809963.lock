                    "type": "number"
                  },
                  "totalArrivals": {
                    "type": "integer"
                  },
                  "totalServed": {
                    "type": "integer"
                  }
                },
                "required": ["effectiveDays", "overallAvgWaitMinutes", "totalArrivals", "totalServed"],
                "type": "object"
              }
            },
            "required": ["hourly", "inputs", "summary"],
            "type": "object"
