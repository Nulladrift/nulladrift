        {
          "name": "recommend_staffing",
          "description": "INVERSE of simulate_mmc — given an arrival rate, service rate, and a target average wait time, returns the SMALLEST number of servers needed to meet the target. Use this when the user asks 'how many servers do I need?' / 'what staffing keeps wait under N minutes?'. The tool runs a binary search over candidate server counts (up to maxServers, default 50), invoking the simulator for each candidate. Saves Claude from iterating simulate_mmc 3-5 times by hand. If even maxServers servers can't meet the target, the recommendation is null and the response includes the achieved wait so Claude can explain that the target is infeasible at the given load. ANTI-FABRICATION: `recommendedServers` and `achievedAvgWaitMinutes` come from real DES runs. Quote them VERBATIM. Do not propose a different number you think 'feels right'; this tool already binary-searches for the minimum that meets the target. If the user asks 'what if c=N?' for a specific N, call simulate_mmc with that c.",
          "inputSchema": {
            "properties": {
              "arrivalDistribution": {
                "default": "Exponential",
                "enum": ["Exponential", "Constant"],
                "type": "string"
              },
              "arrivalRate": {
                "default": 20,
                "description": "Mean arrivals per hour (λ).",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "maxServers": {
                "default": 50,
                "description": "Search ceiling (default 50, max 50). If even this many servers can't meet the target, the tool returns null with the achieved wait.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "serviceCoV": {
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "serviceDistribution": {
                "default": "Exponential",
                "enum": ["Exponential", "Constant", "Normal", "LogNormal"],
                "type": "string"
              },
              "serviceRate": {
                "default": 12,
                "description": "Mean customers one server can finish per hour (μ). Must be > 0.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "simulationDays": {
                "default": 7,
                "description": "Days to simulate per candidate (default 7). Range 1-30. Lower = faster search; higher = less seed-to-seed variance.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "targetAvgWaitMinutes": {
                "default": 3,
                "description": "Maximum average wait time you're willing to accept, in minutes. The tool returns the smallest server count that meets this target.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["arrivalRate", "serviceRate", "targetAvgWaitMinutes"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "achievedAvgWaitMinutes": {
                "type": "number"
              },
              "note": {
                "type": "string"
              },
              "offeredLoadAtRecommendation": {
                "description": "Present only when a feasible recommendation was found.",
                "type": "number"
              },
              "recommendedServers": {
                "description": "Smallest c meeting the target. null when even maxServers can't meet it.",
                "type": ["integer", "null"]
              },
              "targetAvgWaitMinutes": {
                "type": "number"
              },
              "trials": {
                "items": {
                  "properties": {
                    "avgWaitMinutes": {
                      "type": "number"
                    },
                    "servers": {
                      "type": "integer"
                    }
                  },
                  "required": ["avgWaitMinutes", "servers"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["achievedAvgWaitMinutes", "note", "targetAvgWaitMinutes", "trials"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend minimum staffing for a wait-time target"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5ea8e4dc62c867a50cac2ff1e500cbe1c3aaa48c6af43598147d8d191f1e9b6f"
        },
        {
          "name": "run_queue_model",
          "description": "Run a QueueSim Cloud model (a multi-step queueing system built from nodes and staff groups) on the QueueSim Cloud discrete event engine. Returns, per service node: customers joined, served, gave up and turned away, mean and percentile waits in minutes and service levels; per staff group: utilization and busy staff; per exit: count and time in system. Also returns a link that opens the model in QueueSim Cloud to see it drawn and animated. Free plan: up to 8 nodes, 3 staff groups, 30 days, 1 run. Use simulate_mmc or simulate_schedule instead for a single line.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "A QueueSim Cloud model: staff groups plus nodes linked by id. The model guide tool gives the rules and an example.",
                "properties": {
                  "blocks": {
                    "description": "The nodes. Every path must end at an exit node.",
                    "items": {
                      "properties": {
                        "branches": {
                          "description": "split: where customers go, by percent (percents add up to 100).",
                          "items": {
                            "properties": {
                              "percent": {
                                "maximum": 100,
                                "minimum": 0,
                                "type": "number"
                              },
                              "to": {
                                "description": "Target node id.",
                                "pattern": "^[a-z][a-z0-9_]{0,30}$",
                                "type": "string"
                              }
                            },
                            "required": ["percent", "to"],
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "giveUp": {
                          "description": "service: where customers go when they give up waiting (needs patience).",
                          "pattern": "^[a-z][a-z0-9_]{0,30}$",
                          "type": "string"
                        },
                        "hourly": {
                          "description": "arrivals: optional arrivals per hour for each hour of the day, midnight first (24 numbers). Overrides perHour. Every hour needs more than 0.",
                          "items": {
                            "minimum": 0,
                            "type": "number"
                          },
                          "maxItems": 24,
                          "minItems": 24,
                          "type": "array"
                        },
                        "id": {
                          "description": "Node id (unique; must not equal a staff group id).",
                          "pattern": "^[a-z][a-z0-9_]{0,30}$",
                          "type": "string"
                        },
                        "kind": {
                          "description": "settype: the customer type (1, 2, …).",
                          "minimum": 1,
                          "type": "integer"
                        },
                        "maxLine": {
                          "description": "service: optional line limit; who arrives to a full line goes to whenFull.",
                          "minimum": 0,
                          "type": "integer"
                        },
                        "name": {
                          "type": "string"
                        },
                        "next": {
                          "description": "Where customers go next (arrivals, service, delay, settype).",
                          "pattern": "^[a-z][a-z0-9_]{0,30}$",
                          "type": "string"
                        },
                        "patience": {
                          "description": "service: optional patience; who waits longer leaves to giveUp in minutes. kind: exponential (a = average), fixed (a = minutes), normal or lognormal (a = average, b = spread), uniform (a = lowest, b = highest), triangular (a = lowest, b = most likely, c = highest).",
                          "properties": {
                            "a": {
                              "minimum": 0,
                              "type": "number"
                            },
                            "b": {
                              "minimum": 0,
                              "type": "number"
                            },
                            "c": {
                              "minimum": 0,
                              "type": "number"
                            },
                            "kind": {
                              "enum": ["exponential", "fixed", "normal", "lognormal", "uniform", "triangular"],
                              "type": "string"
                            }
                          },
                          "required": ["a", "kind"],
                          "type": "object"
                        },
                        "perHour": {
                          "description": "arrivals: average arrivals per hour (random, Poisson).",
                          "minimum": 0,
                          "type": "number"
                        },
                        "priority": {
                          "description": "settype: priority (lower is served first where the staff group has byPriority).",
                          "type": "number"
                        },
                        "serviceLevels": {
                          "description": "service: optional wait thresholds in minutes to report the share served within (e.g. [2, 5]).",
                          "items": {
                            "minimum": 0,
                            "type": "number"
                          },
                          "maxItems": 4,
                          "type": "array"
                        },
                        "staff": {
                          "description": "service: the staff group that serves this line.",
                          "pattern": "^[a-z][a-z0-9_]{0,30}$",
                          "type": "string"
                        },
                        "targets": {
                          "description": "bytype: type 1 goes to the first target, type 2 to the second …; untyped customers go to the last.",
                          "items": {
                            "description": "Target node id.",
                            "pattern": "^[a-z][a-z0-9_]{0,30}$",
                            "type": "string"
                          },
                          "type": "array"
                        },
                        "time": {
                          "description": "service: time to serve one customer; delay: time spent in minutes. kind: exponential (a = average), fixed (a = minutes), normal or lognormal (a = average, b = spread), uniform (a = lowest, b = highest), triangular (a = lowest, b = most likely, c = highest).",
                          "properties": {
                            "a": {
                              "minimum": 0,
                              "type": "number"
                            },
                            "b": {
                              "minimum": 0,
                              "type": "number"
                            },
                            "c": {
                              "minimum": 0,
                              "type": "number"
                            },
                            "kind": {
                              "enum": ["exponential", "fixed", "normal", "lognormal", "uniform", "triangular"],
                              "type": "string"
                            }
                          },
                          "required": ["a", "kind"],
                          "type": "object"
                        },
                        "type": {
                          "enum": ["arrivals", "service", "delay", "split", "settype", "bytype", "exit"],
                          "type": "string"
                        },
                        "whenFull": {
                          "description": "service: where customers go when the line is full (needs maxLine).",
                          "pattern": "^[a-z][a-z0-9_]{0,30}$",
                          "type": "string"
                        }
                      },
                      "required": ["id", "type"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "days": {
                    "default": 30,
                    "description": "Run length in days (Free plan: at most 30).",
                    "exclusiveMinimum": 0,
                    "maximum": 365,
                    "type": "number"
                  },
                  "name": {
                    "maxLength": 80,
                    "type": "string"
                  },
                  "runs": {
                    "default": 1,
                    "description": "Independent runs (different random seeds). Free plan: 1.",
                    "maximum": 25,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "seed": {
                    "description": "Seed of the first run (default 1).",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "staff": {
                    "description": "Staff groups. A Service node draws one person from its group per customer.",
                    "items": {
                      "properties": {
                        "byPriority": {
                          "description": "Serve lower priority numbers first (set by a settype node).",
                          "type": "boolean"
                        },
                        "count": {
                          "description": "People on duty all day.",
                          "minimum": 1,
                          "type": "integer"
                        },
                        "hourly": {
                          "description": "Optional: people on duty for each hour of the day, midnight first (24 numbers). Overrides count.",
                          "items": {
                            "minimum": 0,
                            "type": "integer"
                          },
                          "maxItems": 24,
                          "minItems": 24,
                          "type": "array"
                        },
                        "id": {
                          "description": "Staff group id.",
                          "pattern": "^[a-z][a-z0-9_]{0,30}$",
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        }
                      },
                      "required": ["count", "id"],
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "required": ["blocks", "staff"],
                "type": "object"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run a QueueSim Cloud model"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64c616098e65486a69ad8e807a0da1030e4d45e6a0327a8e35b12ef829fc01ea"
        },
        {
          "name": "simulate_mmc",
          "description": "Run a generic M/M/c queue simulation. Provide an arrival rate (λ, arrivals/hour), a service rate per server (μ, customers/hour each server can finish), and a server count (c). Optional: distribution shapes, service coefficient of variation, run length. Returns per-hour metrics and an overall summary (avg wait, queue length, offered load, throughput). This is the primary tool for 'how many servers do I need?' / 'what's my average wait?' style questions. ALSO preferred over simulate_scenario for what-if questions about scheduled scenarios (Coffee Shop) when the user wants flat uniform numbers — pull the peak params from describe_scenario and run them here. That usually matches user intent better than collapsing a schedule. ANTI-FABRICATION: the returned numbers come from a real discrete-event simulation run. Quote them VERBATIM in your reply. Do not round, estimate, or compute derived figures from training-data recall. If the user asks a follow-up about the same configuration, re-call this tool rather than recalling numbers from earlier in the conversation.",
          "inputSchema": {
            "properties": {
              "arrivalDistribution": {
                "default": "Exponential",
                "description": "Shape of inter-arrival times. 'Exponential' = Poisson process (default). 'Constant' = evenly-spaced.",
                "enum": ["Exponential", "Constant"],
                "type": "string"
              },
              "arrivalRate": {
                "default": 20,
                "description": "Mean arrivals per hour (λ). Any positive value up to 200.",
                "exclusiveMinimum": 0,
                "maximum": 200,
                "type": "number"
              },
              "servers": {
                "default": 2,
                "description": "Number of parallel servers (c). Integer 1-50.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "serviceCoV": {
                "description": "Coefficient of variation for service time — used when serviceDistribution is 'Normal' or 'LogNormal'. Ignored for Exponential/Constant. Range 0-5.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "serviceDistribution": {
                "default": "Exponential",
                "description": "Shape of service-time distribution. 'Exponential' = classical M/M/c (default).",
                "enum": ["Exponential", "Constant", "Normal", "LogNormal"],
                "type": "string"
              },
              "serviceRate": {
                "default": 12,
                "description": "Mean customers one server can finish per hour (μ). Must be > 0.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "simulationDays": {
                "default": 7,
                "description": "Days to simulate (default 7). Range 1-30 — longer runs are not supported on the public surface; for production-scale studies contact queuesim@chiaha.com.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["arrivalRate", "servers", "serviceRate"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hourly": {
                "items": {
                  "properties": {
                    "avgArrivals": {
                      "type": "number"
                    },
                    "avgDepartures": {
                      "type": "number"
                    },
                    "avgQueueLength": {
                      "type": "number"
                    },
                    "avgWaitMinutes": {
                      "type": "number"
                    },
                    "hour": {
                      "type": "integer"
                    },
                    "label": {
                      "type": "string"
                    },
                    "maxArrivals": {
                      "type": "integer"
                    },
                    "maxDepartures": {
                      "type": "integer"
                    },
                    "maxQueueLength": {
                      "type": "number"
                    },
                    "maxWaitMinutes": {
                      "type": "number"
                    },
                    "serversOnDuty": {
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "inputs": {
                "description": "Echo of the run's parameters.",
                "type": "object"
              },
              "summary": {
                "properties": {
                  "effectiveDays": {
                    "type": "integer"
                  },
                  "offeredLoad": {
                    "type": ["number", "null"]
                  },
                  "overallAvgWaitMinutes": {
                    "type": "number"
                  },
                  "totalArrivals": {
                    "type": "integer"
                  },
                  "totalServed": {
                    "type": "integer"
                  }
                },
                "required": ["effectiveDays", "overallAvgWaitMinutes", "totalArrivals", "totalServed"],
                "type": "object"
              }
            },
            "required": ["hourly", "inputs", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Run M/M/c queue simulation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09d4e51c5766c7041bc0db927ceef60a5e40512286742aa859ee99aff11b9896"
