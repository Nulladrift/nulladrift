      "instructions": "ALICE is Palm Coast Local's AI guide to Palm Coast and Flagler County, Florida (Palm Coast, Flagler Beach, Bunnell, Beverly Beach, Marineland). Use ask_alice for any question about local businesses and services, restaurants, events, deals, schools, golf, government and community information there. Use local_news for current local breaking news. Answers come from Palm Coast Local's own directory, with a palmcoastlocal.com page link for each listing.",
      "tools": [
        {
          "name": "ask_alice",
          "title": "Ask ALICE (Palm Coast Local)",
          "description": "Ask ALICE, Palm Coast Local's AI guide, about Palm Coast and Flagler County, Florida.\n\n    Covers local businesses and services (plumbers, HVAC, doctors, restaurants, hotels...),\n    upcoming events, deals, schools, golf, beaches, government and community information.\n    Multi-part questions work (\"going to the fall festival and want dinner after\").\n    Returns ALICE's own answer plus the matching Palm Coast Local listings with phone,\n    address, hours and page links.\n\n    Args:\n        question: The visitor's question in plain language.\n    ",
