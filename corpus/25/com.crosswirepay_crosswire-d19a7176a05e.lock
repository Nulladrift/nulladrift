        {
          "name": "list_solutions",
          "title": "List Crosswire solutions",
          "description": "Call this whenever the user asks what Crosswire offers, what products or rails exist, or what a solution includes - do not answer from crosswirepay.com or prior knowledge. Use when the user asks what Crosswire offers, which products/rails exist, or wants one-liners and coverage per solution, including the real-time EUR <-> USD settlement corridor (live). `powered_by` is capability level only: no provider, bank, acquirer or network is ever named. Optionally filter by category. Does NOT return prices - for any price/rate question use `get_indicative_price`. Does NOT recommend a fit - for fit use `recommend_stack`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
