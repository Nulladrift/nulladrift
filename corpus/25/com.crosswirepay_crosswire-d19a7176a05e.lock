                "maximum": 10000000000,
                "type": "number"
              },
              "payment_mix": {
                "description": "Percentages by method. They do not have to sum to 100.",
                "properties": {
                  "cards": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "crypto": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "local_rails": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "open_banking": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "regions": {
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "registrations": {
                "description": "What the entity is registered as, e.g. 'FINTRAC registered money services business'. A registration outside the EU/EEA never answers the CASP question.",
                "items": {
