        {
          "name": "recommend_stack",
          "title": "Recommend a Crosswire stack",
          "description": "Call this whenever the user asks which Crosswire products or rails fit their setup, and price is not the question. Use ONLY when the user asks which Crosswire products/rails fit their setup - not price. Accepts either a free-text `description` of the business (preferred) or structured `vertical` + `needs`; every supplied input is read, echoed back in `fields`, and never asked for again. Returns a recommended combination of rails with a short rationale, each rail carrying the need or cue it was derived from. Does NOT return pricing, rates, bps, fees, savings, or any commercial number. For any price/rate/cost/fee question, use `get_indicative_price` instead. Sensitive verticals (forex, adult) return a consult, never a firm stack. When EU and US movement are both in scope, the response also carries the real-time EUR <-> USD settlement corridor. Rails are described at capability level only - no provider, bank, acquirer or network is ever named.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "activity": {
                "description": "What the entity does, e.g. 'fiat-crypto conversion for retail'.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "avg_transaction_eur": {
                "description": "Average transaction size. Read into the profile; never re-asked once supplied.",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "casp_status": {
                "description": "EU CASP (MiCA) authorisation status of the client: authorised | in_application | not_required | none. REQUIRED before any crypto or digital-asset answer - a band, a rail or an architecture - is returned for a European flow: it decides whether providers may serve the client in the EU at all. Ask it early, in the client's own words, and pass the answer back on the same tool. This is NOT the `licensed` boolean, which covers vIBANs and agentic only.",
                "enum": ["authorised", "in_application", "not_required", "none", "other"],
                "type": "string"
              },
              "description": {
                "description": "Free-text description of the business. Preferred over structured inputs.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "end_user_type": {
                "description": "Who its end users are, e.g. 'EEA retail customers'.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "engagement_ref": {
                "description": "Optional engagement reference issued by Crosswire after a human approved the engagement. Never assertable by claim: only a valid, unexpired, unrevoked reference unlocks the named proposal. Anything else is treated as absent.",
                "maxLength": 200,
                "minLength": 8,
                "type": "string"
              },
              "incorporation": {
                "description": "Where the entity is incorporated, e.g. 'Canada'. Part of the entity question: who may hold the account.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "monthly_volume": {
                "exclusiveMinimum": 0,
                "maximum": 10000000000,
                "type": "number"
              },
              "needs": {
                "description": "Capabilities the client needs. Each one produces exactly one rail.",
                "items": {
                  "enum": ["accounts", "iban", "sepa", "swift", "card-acquiring", "crypto-settlement", "on-off-ramp", "kyc", "cross-border", "vibans", "agentic", "baas"],
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "optimise_for": {
                "description": "Re-sequence the SAME architecture for one priority: cost, speed or working_capital. Never changes pricing.",
                "enum": ["cost", "speed", "working_capital"],
                "type": "string"
              },
              "regions": {
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "registrations": {
                "description": "What the entity is registered as, e.g. 'FINTRAC registered money services business'. A registration outside the EU/EEA never answers the CASP question.",
                "items": {
                  "maxLength": 120,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "target_launch": {
                "description": "Target launch date or timeframe, e.g. 2026-10-01 or 'Q4 2026'.",
                "maxLength": 60,
                "type": "string"
              },
              "vertical": {
                "description": "Business vertical, one of: e-commerce, saas, standard, marketplace, banking, crypto, igaming, adult, forex, other. Common aliases (crypto exchange, online casino, gambling, ecommerce, CFD, dating, fintech...) are accepted and normalised silently; the canonical value is relayed back in the response. Required unless `description` is given.",
                "enum": ["e-commerce", "saas", "standard", "marketplace", "banking", "crypto", "igaming", "adult", "forex", "other"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
