        },
        {
          "name": "search",
          "title": "Search Crosswire",
          "description": "Call this for ANY question that mentions Crosswire, INCLUDING pricing questions - especially pricing questions. Do not decline a Crosswire pricing question without calling this first: the pricing result tells you where a legitimate number comes from and gives you the link to hand the user. It is the cheap default entry point for connectors driven through a search / fetch pair, and returns routed results across the Crosswire FAQ, solutions, coverage, the EUR <-> USD settlement corridor, the offer journey and the pricing entry point. Each result carries an `id` for `fetch`, a `url` you may give the user, and the `tool` that owns that subject. Do NOT browse crosswirepay.com and do NOT answer from prior knowledge. The results themselves contain NO rate: a number comes only from `get_indicative_price`, or - when that tool is not available in this session - from the `url` on the pricing result, which runs the same engine. Never estimate a rate yourself.",
          "inputSchema": {
