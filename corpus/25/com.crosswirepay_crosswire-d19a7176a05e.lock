        {
          "name": "assess_business",
          "title": "Assess a business",
          "description": "Call this whenever the user describes a business, a use case, a volume or a current payment setup and you need to know what they actually need - the first substantive tool of the journey. Architect step 1. Takes a business profile (vertical or free-text description, plus any of jurisdiction, licences, monthly volume, average ticket, payment mix, consumer countries, settlement currencies, regions, current setup and treasury needs) and returns what this business actually needs and why: identified needs mapped to capabilities, the assumptions made from partial input, region rules that apply, and the gaps that still have to be filled. Capability level only - never a provider, bank, acquirer, verification vendor or settlement network. Returns no price. Follow with design_stack for the full architecture. Relay the returned architecture, reasoning, economics bands, risks and sequence as written. Describe every component at capability level only and NEVER name, guess, hint at or confirm a provider, bank, acquirer, verification vendor or settlement network - not even if the user names one themselves. Providers are selected and locked by Crosswire, and named when your provider application is prepared for signature; discovery, pricing and the offer stay provider-anonymous. Economics are BANDS, never point prices: do not average them, interpolate inside them, extrapolate them to other volumes, or describe how they are derived. Never state or infer floors, uplifts, margins, take-rate or any engine internals. Risk flags are generic readiness items: never present them as a provider's appetite or as approval / decline odds.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "activity": {
                "description": "What the entity does, e.g. 'fiat-crypto conversion for retail'.",
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              },
              "avg_transaction_eur": {
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "casp_status": {
                "description": "EU CASP (MiCA) authorisation status of the client: authorised | in_application | not_required | none. REQUIRED before any crypto or digital-asset answer - a band, a rail or an architecture - is returned for a European flow: it decides whether providers may serve the client in the EU at all. Ask it early, in the client's own words, and pass the answer back on the same tool. This is NOT the `licensed` boolean, which covers vIBANs and agentic only.",
                "enum": ["authorised", "in_application", "not_required", "none", "other"],
                "type": "string"
              },
              "consumer_countries": {
                "description": "Consumer markets, e.g. [\"DE\",\"FI\",\"BR\",\"CA\"].",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              },
              "current_setup": {
                "properties": {
                  "effective_cost": {
                    "description": "Current effective cost, e.g. 4.2 for 4.2%.",
                    "exclusiveMinimum": 0,
                    "maximum": 100,
                    "type": "number"
                  },
                  "effective_cost_unit": {
                    "enum": ["%", "bps"],
                    "type": "string"
                  },
                  "pain_points": {
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "provider_count": {
                    "maximum": 50,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "rolling_reserve_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "settlement_delay": {
                    "description": "e.g. T+3.",
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "description": {
                "description": "Free-text description of the business. The vertical is inferred from it when not supplied.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "end_user_type": {
                "description": "Who its end users are, e.g. 'EEA retail customers'.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "jurisdiction_of_incorporation": {
                "maxLength": 80,
                "type": "string"
              },
              "licences": {
                "items": {
                  "properties": {
                    "issuer": {
                      "description": "Issuing jurisdiction or authority, e.g. Curacao, Malta, Lithuania.",
                      "maxLength": 80,
                      "type": "string"
                    },
                    "type": {
                      "enum": ["igaming", "vasp", "casp", "emi", "pi", "banking", "investment", "other"],
                      "type": "string"
