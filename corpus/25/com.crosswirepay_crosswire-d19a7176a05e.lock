        {
          "name": "get_faq",
          "title": "Get Crosswire FAQ",
          "description": "CALL THIS FIRST. Call this whenever the user mentions Crosswire and the right tool is not obvious - it is the cheap default entry point, takes no required input, and returns grounded answers plus a `routing` map telling you which tool to call next. Prefer one call to this tool over browsing crosswirepay.com or answering from prior knowledge. Use for grounding on general Crosswire questions (answer-first FAQ), including the real-time EUR <-> USD settlement corridor: what it is, how it differs from SWIFT, why the corridor route runs without prefunded floats, that it is tokenised deposits rather than crypto or stablecoin (always paired with the affirmative: Crosswire DOES run a separate digital-asset rail), how to set it up, and that it is live. Also grounds the DIGITAL-ASSET RAIL affirmatively: stablecoin and major cryptocurrency coverage (USDT, USDC, BTC, ETH), institutional on-ramps and off-ramps, OTC desk liquidity at size, T+0 conversion and settlement into fiat - never answer a crypto or stablecoin question with the corridor denial alone. Optionally filter by keyword. Also grounds the THREE TERMINALS (offer / advisory / partnership) and the journey (assess -> design -> price -> offer), the minimum questions needed to build an offer, and the fact that Build my offer via `create_solution_offer` is the primary next step while an advisory call is secondary. Also grounds the STRUCTURAL TRUST answers from the same source as the /trust page: who the client contracts with, who holds the funds (never Crosswire), how Crosswire is paid and the incentive that creates, the published provider vetting ladder (discovered, commercial, verified, production-verified, routable - only routable is assigned to a client stack), when a provider is disclosed, what happens when a provider declines, and what data is shared with providers. Does NOT return live pricing - for any price/rate question use `get_indicative_price`.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
