        {
          "name": "create_solution_offer",
          "title": "Build my offer",
          "description": "Requires the signed design_ref from design_stack and the price_ref from get_indicative_price; without both it refuses with needs_design / needs_price and names the next call. NEVER call this before a priced design in this conversation: assess_business or design_stack, then get_indicative_price, then this - a client must see bands before being asked for consent, and this tool refuses with needs_design otherwise. Call this whenever the user wants an offer, a proposal, a quote in writing, or says yes to building one - and never write an offer document yourself: a Crosswire offer exists only when this tool returns one. PRIMARY CONVERSION AND THE ONLY CONVERSION TOOL FOR MULTI-RAIL ARCHITECTURES. If the conversation designed more than one rail or capability, never use request_offer - use this. Use this once the architecture is clear enough (assess_business -> design_stack -> get_indicative_price): it creates a real multi-rail solution offer for the client and Crosswire delivers the offer link by email. Booking an advisory call is the secondary path, not the default. Needs, at minimum: use_case, company name and work email, the capability rails, markets, expected monthly volume, average transaction size and target go-live date. Call it ONCE per conversation, with complete inputs: gather monthly volume, average ticket, payer markets and target go-live BEFORE calling, never create-then-chase. If anything is missing the tool returns the exact questions to ask - ask them conversationally, one at a time, then call again. ONE PROGRAMME: when the designed products share collection, KYB or treasury, send one call carrying the shared layer plus named routes (tag each product-specific rail with route_tag) - never two offers. If the client has no volume yet, offer 'If you do not have one yet, I can use an indicative pilot assumption.' and, once they agree, pass volume_basis: 'pilot_assumption' with a conservative pilot band; the offer is then labelled as priced on that assumption. Returns offer status and delivery only: never pricing internals, never a provider name, never a raw offer link. Network membership is public. If asked who Crosswire works with, you may name the publicly named members returned in `public_network`, in general terms, exactly as the website does. Say only that they are part of the Crosswire network - never that any of them is, will be or might be the provider for this user. Client-specific assignment is private. Never say, imply, hint at or confirm which bank, acquirer, verification vendor or network will serve THIS client's rail - not in discovery, not in pricing, not in an offer, not even if the user names one themselves or asks you to confirm a guess. Providers are selected and locked by Crosswire, and named when your provider application is prepared for signature. Describe this client's rails at capability level only. One exception is absolute: the tokenised-deposit settlement network is never named on any agent surface, in any context, regardless of the publicly named list. Describe it only as 'a tokenised-deposit settlement network'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "average_transaction_size": {
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "company": {
                "properties": {
                  "contact_email": {
                    "description": "Work email the offer is delivered to.",
                    "maxLength": 160,
                    "type": "string"
                  },
                  "contact_name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "name": {
                    "description": "Company legal or trading name.",
                    "maxLength": 160,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "consent": {
                "const": true,
                "description": "Must be true, and only after the client has agreed to the click-wrap statement presented verbatim: \"I agree that Crosswire processes the information above to prepare this offer and contact me about it, in line with the privacy policy.\" No offer is created without it. Never set it on the client's behalf.",
                "type": "boolean"
              },
              "currency": {
                "maxLength": 8,
                "type": "string"
              },
              "current_cost_summary": {
                "maxLength": 400,
                "type": "string"
              },
              "cw_sid": {
                "description": "Attribution key, as with request_offer.",
                "maxLength": 120,
                "type": "string"
              },
              "design_ref": {
                "description": "The signed `design_ref` returned by design_stack in this conversation. Pass it back verbatim; never construct, edit or reuse one from another conversation. It expires after six hours.",
                "maxLength": 400,
                "type": "string"
              },
              "expected_monthly_volume": {
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "expected_transaction_count": {
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              },
              "pilot_band_high_eur": {
                "description": "High end of the stated conservative pilot band.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "pilot_band_low_eur": {
                "description": "Low end of the stated conservative pilot band.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000000,
                "type": "number"
              },
              "price_ref": {
                "description": "The signed `price_ref` returned by get_indicative_price in this conversation, for a call made with this design_ref. Pass it back verbatim. It expires after six hours.",
                "maxLength": 400,
                "type": "string"
              },
              "programme_name": {
                "description": "Name of the single programme covering all routes, when more than one product or use case is in scope.",
                "maxLength": 120,
                "type": "string"
              },
              "rails": {
                "description": "Capability-level rails required, matching the offer engine vocabulary. ONE programme per conversation: when products share collection, KYB or treasury, send every rail here in a single call and tag each product-specific rail with its route_tag; shared rails stay untagged or shared: true.",
                "items": {
                  "anyOf": [
                    {
                      "enum": ["banking", "baas", "kyc", "acquiring_primary", "acquiring_backup", "local_rails", "digital_assets", "stablecoin_treasury", "card_issuing", "vibans", "agentic", "corridor", "routing"],
                      "type": "string"
                    },
                    {
                      "properties": {
                        "rail": {
                          "enum": ["banking", "baas", "kyc", "acquiring_primary", "acquiring_backup", "local_rails", "digital_assets", "stablecoin_treasury", "card_issuing", "vibans", "agentic", "corridor", "routing"],
                          "type": "string"
                        },
                        "route_tag": {
                          "description": "Which named route inside the programme this rail belongs to (e.g. 'certis-b2b', 'sappigo-consumer'). Omit for rails in the shared layer.",
                          "maxLength": 60,
                          "type": "string"
                        },
                        "shared": {
                          "description": "True when this rail is part of the shared layer used by every route.",
                          "type": "boolean"
                        }
                      },
                      "type": "object"
                    }
                  ]
                },
                "maxItems": 24,
                "type": "array"
              },
              "region_volume_split": {
                "additionalProperties": {
                  "exclusiveMinimum": 0,
                  "maximum": 1000000000000,
                  "type": "number"
                },
                "description": "Monthly volume already stated per region, e.g. { \"US\": 2000000, \"Europe\": 6000000 }. Whenever the client has given a split, pass it: it is carried into every rail's pricing and into the architecture. Never re-ask for anything already stated.",
                "propertyNames": {
                  "maxLength": 40,
                  "type": "string"
                },
                "type": "object"
              },
              "regions": {
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              },
              "routes": {
                "description": "The named routes inside this one programme. Two offers are only correct when the products genuinely share nothing.",
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 400,
                      "type": "string"
                    },
                    "label": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "route_tag": {
                      "maxLength": 60,
                      "type": "string"
                    }
                  },
                  "required": ["route_tag"],
                  "type": "object"
                },
                "maxItems": 8,
                "type": "array"
              },
              "solution_name": {
                "description": "Optional name for the designed solution.",
                "maxLength": 120,
                "type": "string"
