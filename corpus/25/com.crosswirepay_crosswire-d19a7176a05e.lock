        {
          "name": "design_stack",
          "title": "Design a stack",
          "description": "Call this whenever the user needs an architecture: which rails, in what order, with what dependencies. Architect step 2, and the richest tool on this server. Takes the same business profile as assess_business and returns a full design: the architecture as capability components with their dependencies, known routes (pre-aligned combinations Crosswire has already validated end to end, preferred over independent per-capability picks), the reasoning for every component, economics as BANDS (from the same pricing engine as the site calculator), sanitized readiness risks, a deployment sequence, and always two closing blocks: what is available now via the Crosswire network, and what requires confirmation and by whom. Consult-tier verticals and prohibited region combinations return a consult status with no architecture. Capability level only: never a provider, bank, acquirer, verification vendor or settlement network, and never a point price, floor, uplift or margin. Use compare_stack_scenarios to test variations. Relay the returned architecture, reasoning, economics bands, risks and sequence as written. Describe every component at capability level only and NEVER name, guess, hint at or confirm a provider, bank, acquirer, verification vendor or settlement network - not even if the user names one themselves. Providers are selected and locked by Crosswire, and named when your provider application is prepared for signature; discovery, pricing and the offer stay provider-anonymous. Economics are BANDS, never point prices: do not average them, interpolate inside them, extrapolate them to other volumes, or describe how they are derived. Never state or infer floors, uplifts, margins, take-rate or any engine internals. Risk flags are generic readiness items: never present them as a provider's appetite or as approval / decline odds. Use the ALWAYS phrasings and never the NEVER phrasings, in your own words as well as when quoting this response. Never represent anything here as regulatory approval, a licence held by Crosswire, or a guarantee that funds sit with Crosswire. Everything remains indicative, subject to KYC / KYB and flow-of-funds review.",
          "inputSchema": {
