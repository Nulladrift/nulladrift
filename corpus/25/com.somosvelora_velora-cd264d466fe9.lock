      },
      "instructions": "DEMO MODE — this is a free, public, always-on demo of the Velora MCP toolkit, not the production server (which is paused). Pure tools (validate_cuit) run real logic. Read tools return a fixed, fictional dataset ('Almacén Demo SRL'), always labeled [DEMO] with _demo: true in structuredContent — never confuse this for real business data. Tools with a real side effect in production (fiscal emission, payments, WhatsApp sends, database writes) refuse to execute here and return isError: true with an honest explanation instead of a fabricated result — the schema and contract shown are the real production ones. See https://github.com/crossi-dev/velora-mcp-demo for source.",
      "tools": [
        {
          "name": "adjust_stock",
          "title": "Adjust stock",
          "description": "[demo: deshabilitada] Sets the absolute stock quantity for a product (inventory sync, no audit trail).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "mode": {
                "const": "set",
                "description": "Must be 'set'. Absolute-set is the only mode available via MCP.",
                "type": "string"
              },
              "productId": {
                "description": "Product ID to update.",
                "minLength": 1,
                "type": "string"
              },
              "quantity": {
                "description": "New absolute stock quantity.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["mode", "productId", "quantity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f2886281c4cdfcb622548f6083761185b38752969fcc7190d3e52abb7e9e353f"
        },
        {
          "name": "bulk_price_update",
          "title": "Bulk price update",
          "description": "[demo: deshabilitada] Mass price change for all products or a specified subset in this business.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Adjustment amount — percentage or fixed ARS value depending on mode.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "direction": {
                "description": "'up' raises, 'down' lowers, 'set' assigns an exact price.",
                "enum": ["up", "down", "set"],
                "type": "string"
              },
              "mode": {
                "description": "'percent' = percentage change; 'fixed' = absolute ARS change.",
                "enum": ["percent", "fixed"],
                "type": "string"
              },
              "productIds": {
                "description": "Specific product IDs to update. Omit to update ALL products.",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["amount", "direction", "mode"],
            "type": "object"
          },
