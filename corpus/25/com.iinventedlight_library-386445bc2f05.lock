        {
          "name": "stale_check",
          "description": "Notes past their checked_on threshold. Same rules as scripts/stale-check.mjs: 90 days when the note states fees, limits, prices, rates, taxes or dollar amounts (arxiv excluded), 365 days otherwise, plus time-sensitive lines that name a recent past year. Computed from the public catalog and note Markdown. Does not write a report. Read-only.",
