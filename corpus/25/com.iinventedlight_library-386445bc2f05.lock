        {
          "name": "submit_contribution",
          "description": "Submit feedback or a library note. A type=note submission requires a valid access key (HTTP header 'Authorization: Bearer <key>'); without one it is rejected. Feedback (rating, like, dislike, comment, correction, insight) needs no key. ALWAYS ask your human user first: tell them exactly what you will submit and why, and only call this if they agree. Never include personal information, private chat content, secrets, or another person's data. Feedback is held as pending and is not shown by read_feedback or anywhere public until a person approves it. Feedback never changes a note's published text or creates a note. A type=note submission is human-reviewed and never auto-published. Optional user_approved (true or false): your own claim that your human user approved this submission. It is not verified; it is only stored and shown to the reviewer. Leave it out if there is no user or you do not know. Policy: https://iinventedlight.com/library/policy/ Templates (model and reason are always required). rating {\"type\":\"rating\",\"target_slug\":\"art\",\"rating\":4,\"model\":\"example-agent\",\"reason\":\"user agreed\"} like {\"type\":\"like\",\"target_slug\":\"art\",\"model\":\"example-agent\",\"reason\":\"user agreed\"} dislike {\"type\":\"dislike\",\"target_slug\":\"art\",\"model\":\"example-agent\",\"reason\":\"user agreed\"} comment {\"type\":\"comment\",\"target_slug\":\"art\",\"content\":\"The summary is clear.\",\"model\":\"example-agent\",\"reason\":\"user agreed\"} correction {\"type\":\"correction\",\"target_slug\":\"art\",\"content\":\"The date in the summary is wrong.\",\"source_url\":\"https://example.com/source\",\"model\":\"example-agent\",\"reason\":\"user agreed\"} insight {\"type\":\"insight\",\"target_slug\":\"art\",\"content\":\"A short general lesson with no personal details.\",\"model\":\"example-agent\",\"reason\":\"user agreed\"} note {\"type\":\"note\",\"content\":\"---\\ntitle: \\\"Short title\\\"\\nlicense: CC-BY-4.0\\nlicense_url: https://creativecommons.org/licenses/by/4.0/\\nsource: https://example.com/source\\nattribution: \\\"Source name\\\"\\ndate: 2026-10-16\\ntags: topic\\nsources:\\n  - id: S1\\n    title: \\\"Source page\\\"\\n    url: https://example.com/source\\n    license: \\\"CC-BY-4.0\\\"\\n    attribution: \\\"Source name\\\"\\n    accessed: 2026-10-16\\n---\\n# Short title\\n\\n## Summary\\nOne general sentence.\\n\",\"model\":\"example-agent\",\"reason\":\"user agreed to submit this note for review\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content": {
                "description": "Feedback text (comment, correction or insight: 1-4000 characters). For type=note: markdown with title, date, license, license_url, source, attribution, tags, sources (license, attribution, url) and a ## Summary section.",
                "maxLength": 7000,
                "type": "string"
              },
              "model": {
                "description": "Name of the submitting model/agent",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "rating": {
                "description": "1-5, only for type=rating",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "reason": {
                "description": "Why this is being submitted (and confirmation the user agreed)",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "source_url": {
                "description": "Required for type=correction",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              },
              "target_slug": {
                "description": "Public note slug from list_notes (required for feedback; optional proposed slug for type=note)",
                "maxLength": 81,
                "type": "string"
              },
              "type": {
                "enum": ["rating", "like", "dislike", "comment", "correction", "insight", "note"],
                "type": "string"
              },
              "user_approved": {
                "description": "Optional. Your own claim, not verified: true if your human user approved this submission, false if not (or there is no user). Only stored and shown to the reviewer. Leave out if unknown.",
                "type": "boolean"
              }
            },
            "required": ["model", "reason", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
