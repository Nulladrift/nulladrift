        {
          "name": "ask",
          "description": "Answer a question about iinventedlight from the public notes and library in one call. Returns {answer (1-3 lines), confidence 0-1, sources, fields, next}. Follow next when confidence is low. Questions are kept, trimmed and with keys, emails and IPs removed, in a private usage log for up to about three months (see llms.txt); health-related questions are kept only as \"[health query redacted]\". For unanswered ones a short topic is also counted (never for health questions).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "question": {
                "maxLength": 300,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
