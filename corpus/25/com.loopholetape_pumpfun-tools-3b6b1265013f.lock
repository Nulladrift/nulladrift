            "properties": {
              "mint": {
                "pattern": "^[1-9A-HJ-NP-Za-km-z]{32,44}$",
                "type": "string"
              },
              "venue": {
                "enum": ["pump", "pumpswap"],
                "type": "string"
              }
            },
            "required": ["mint", "venue"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
