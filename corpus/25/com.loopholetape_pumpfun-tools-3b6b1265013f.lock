        {
          "name": "feed_count",
          "description": "Count recorded transactions for your window and filters before comparing a log.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "coins": {
                "items": {
                  "pattern": "^[1-9A-HJ-NP-Za-km-z]{32,44}$",
                  "type": "string"
                },
                "maxItems": 64,
                "type": "array"
              },
              "end_us": {
                "type": "integer"
              },
              "include_failed": {
                "type": "boolean"
              },
              "signers": {
                "items": {
                  "pattern": "^[1-9A-HJ-NP-Za-km-z]{32,44}$",
                  "type": "string"
                },
                "maxItems": 64,
                "type": "array"
              },
              "start_us": {
                "type": "integer"
              },
              "venues": {
                "items": {
                  "enum": ["pump.fun", "PumpSwap"],
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["end_us", "include_failed", "start_us", "venues"],
            "type": "object"
          },
