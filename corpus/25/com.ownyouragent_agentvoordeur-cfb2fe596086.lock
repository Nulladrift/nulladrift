        {
          "name": "prepare_intake_link",
          "title": "Prepare an OwnYourAgent request link",
          "description": "Returns a link to the OwnYourAgent request form (the agreement sheet (afsprakenkaart) as a form) with the chosen starting phase, topic and, optionally, Ownership Check IDs pre-filled. It contains no personal data and submits nothing: the person opens the link, checks the answers, adds their own contact details and sends it themselves. Use it when the user wants to ask OwnYourAgent for a proposal.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_ids": {
                "description": "Optional Ownership Check IDs (from get_ownership_check) the user wants OwnYourAgent to review, e.g. [\"E-02\",\"E-03\"].",
                "items": {
                  "enum": ["E-01", "E-02", "E-03", "E-04", "E-05", "E-06", "E-07", "E-08", "E-09", "E-10"],
                  "type": "string"
                },
                "maxItems": 40,
                "type": "array",
                "uniqueItems": true
              },
              "lang": {
                "default": "nl",
                "description": "Language of the form: nl (default) or en.",
                "enum": ["nl", "en"],
                "type": "string"
              },
              "phase": {
                "description": "Starting phase: kansenrapport (AI opportunity report), pilot, implementatie (implementation) or beheer (management).",
                "enum": ["kansenrapport", "pilot", "implementatie", "beheer"],
                "type": "string"
              },
              "topic": {
                "description": "The work the agent should help with: facturen (invoices and orders), klantvragen (customer questions), telefoon (phone), kennis (internal knowledge), offertes (quotations) or anders (other).",
                "enum": ["facturen", "klantvragen", "telefoon", "kennis", "offertes", "anders"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
