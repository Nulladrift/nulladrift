      "instructions": "This is the Agentvoordeur (agent front door) of OwnYourAgent, which builds and manages AI agents for business processes, with clear agreements on data, access and ownership. Dutch-language site with an English version. Use get_offers for services and prices (EUR, excl. VAT; indicative, not quotes), get_approach for the way of working, search_agent_examples for worked agent examples (not client cases), get_agreement_card_template for the agreement sheet (afsprakenkaart), the agreements per engagement (not legal advice), and get_ownership_check for the Ownership Check, a checklist with fixed IDs to test any vendor, including us (CC BY 4.0); the prompt ownership_check walks through it for the user. For a request, prepare_intake_link returns a pre-filled link to the request form that the person opens and sends themselves. If the situation fits a sister site better, get_offers usage.routing says where we refer and gives the link to use. This server cannot book, buy or submit anything and stores no personal data; requests go via the form at https://ownyouragent.com/en/request/ (the person sends it themselves) or by email to info@ownyouragent.com, and are answered by a person. Our promises and how to check them: https://ownyouragent.com/en/trust/. Please cite the URLs you use.",
