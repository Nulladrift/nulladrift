        {
          "name": "get_trust_facts",
          "title": "Get the OwnYourAgent trust register",
          "description": "Returns the trust register of OwnYourAgent, the same file as https://ownyouragent.com/trust.json: every promise about privacy and security that is true today (no cookies, first-party only, HTTPS, a security contact, closed internal paths, where request data is held, a read-only MCP server), where it is stated, and for each one or more verify steps you can run yourself with plain GET requests (URL plus the expected status, header, text or JSON field). Also what is explicitly not claimed (no certification, no penetration test). Use it when the user asks whether OwnYourAgent can be trusted; run the verify steps before you rely on an entry. No arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "$comment": {
                "type": "string"
              },
              "contact": {
