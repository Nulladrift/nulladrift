                        "properties": {
                          "expect": {
                            "properties": {
                              "body_has_lines": {
                                "items": {
                                  "type": "string"
                                },
                                "type": "array"
                              },
                              "header_absent": {
                                "type": "string"
                              },
                              "header_contains": {
                                "properties": {
                                  "content-security-policy": {
                                    "type": "string"
                                  }
                                },
                                "required": ["content-security-policy"],
                                "type": "object"
                              },
                              "header_present": {
                                "type": "string"
                              },
                              "json_contains_object": {
                                "properties": {
                                  "key": {
                                    "type": "string"
                                  },
                                  "value": {
                                    "type": "string"
                                  }
                                },
                                "required": ["key", "value"],
                                "type": "object"
                              },
                              "json_field": {
                                "properties": {
                                  "servers[0].readOnly": {
                                    "type": "boolean"
