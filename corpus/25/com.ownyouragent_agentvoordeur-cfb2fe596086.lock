        {
          "name": "get_ownership_check",
          "title": "Get the Ownership Check (Eigendomscheck)",
          "description": "Returns the Ownership Check (Eigendomscheck): a vendor-neutral checklist with fixed IDs to test whether an AI agent is owned by the customer, with any vendor, including OwnYourAgent. Sections: exit (E-01..E-10, before signing), protocol (P-, MCP versions and ownership), data (D-), proofs (A-) and switching (X-); only sections whose guide is published are returned, sectionsPlanned lists all. Each item has the question or item and, where the guide gives them, a good answer, a red flag or a done-when. Licence CC BY 4.0: cite the source URL. Not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the returned text: nl (Dutch) or en (English). Omit to get both.",
