      },
      "instructions": "This is the Agentvoordeur (agent front door) of OwnYourAgent, which builds and manages AI agents for business processes, with clear agreements on data, access and ownership. Dutch-language site with an English version. Use get_offers for services and prices (EUR, excl. VAT; indicative, not quotes), get_approach for the way of working, search_agent_examples for worked agent examples (not client cases), get_agreement_card_template for the agreement sheet (afsprakenkaart), the agreements per engagement (not legal advice), and get_ownership_check for the Ownership Check, a checklist with fixed IDs to test any vendor, including us (CC BY 4.0); get_vendor_answers gives our own answers on it, with proof per ID (a self-declaration: check each quote); the prompt ownership_check walks through it for the user. For a request, prepare_intake_link returns a pre-filled link to the request form that the person opens and sends themselves. If the situation fits a sister site better, get_offers usage.routing says where we refer and gives the link to use. This server cannot book, buy or submit anything and stores no personal data; requests go via the form at https://ownyouragent.com/en/request/ (the person sends it themselves) or by email to info@ownyouragent.com, and are answered by a person. Our promises and how to check them: https://ownyouragent.com/en/trust/. Please cite the URLs you use.",
      "tools": [
        {
          "name": "compare_ownership_checks",
          "title": "Compare answer files of the Ownership Check",
          "description": "Compares two answer files of the Ownership Check (Eigendomscheck) question by question: per ID the answer of every vendor (yes, partial, no or unknown) and whether it has a proof URL, whether the answers differ, a count per vendor, and the sha256 of each file as received (JSON with unescaped slashes and unicode), so the user can show which files were compared. Without \"b\", the own answers of OwnYourAgent (get_vendor_answers) are the second file, which compares another vendor with OwnYourAgent. At most 8 vendors in total. The server fetches nothing: pass the files themselves. Nothing is stored. It compares self-declarations; it does not certify anyone. Not legal advice.",
