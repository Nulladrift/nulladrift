{
  "lockfileVersion": 2,
  "subjects": {
    "cc.aiones/x-news-digest": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://x-news-digest-mcp.aiones.cc/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "x-news-digest-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_post",
          "description": "读取单条 X 帖子详情（含 views/媒体信息），接受帖子 URL 或数字 id。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "url_or_id": {
                "description": "帖子链接或 id",
                "type": "string"
              }
            },
            "required": ["url_or_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cdb828a48a95a474d83775df3b69af6d9d745e15b29a8ec2eb05f8fa88744fe"
        },
        {
          "name": "list_presets",
          "description": "列出内置精选账号包（scan_accounts 可直接引用包名）。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb96a9e0acc308ebaca21aa3d127a193c3667cd5e85b959493894e2287e25551"
        },
        {
          "name": "reset_seen",
          "description": "清空已见去重库（下次扫描会把时间窗内命中帖当新帖再推一遍，慎用）。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c209d56d4c92283a4ab1a8d2ae6567b6d9cd4b910726768db8a14afab3eaa05b"
        },
        {
          "name": "scan_accounts",
          "description": "扫描一批 X 账号近 N 小时的帖子，按热度排序输出中文资讯日报（核心工具）。accounts 支持逗号分隔账号或预设包名（ai_llm/ai_dev/tech_news/crypto），可混合。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "accounts": {
                "default": "ai_llm",
                "description": "账号列表或预设包名，如 'OpenAI,dotey' 或 'ai_llm'",
                "type": "string"
              },
              "hours": {
                "default": 24,
                "description": "时间窗口（小时）",
                "type": "number"
              },
              "mark_seen": {
                "default": true,
                "description": "是否记入已见库（下次自动跳过）",
                "type": "boolean"
              },
              "min_heat": {
                "default": 0,
                "description": "最低热度分门槛（热度=赞+转×3+藏×2+评×0.5）",
                "type": "number"
              },
              "top": {
                "default": 10,
                "description": "最多返回条数",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b17d4ebe625cef684b7411de85ff8a4221ebeaea1775ddee56f04b86972ca20b"
        },
        {
          "name": "search_x_news",
          "description": "按关键词搜索 X 帖子并按热度排序。注意：免费镜像搜索索引较浅，空结果不代表没有内容，主通道请用 scan_accounts。",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "count": {
                "default": 20,
                "description": "抓取条数",
                "type": "number"
              },
              "hours": {
                "default": 24,
                "description": "只保留近 N 小时的结果",
                "type": "number"
              },
              "query": {
                "description": "搜索关键词，支持 'AI agent'、'from:OpenAI' 等",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3c26d9a9f7f055760c8b1cd11484fec08c7474c0ac67e104cfaf6121a7ce9bee"
        }
      ],
      "digest": "sha256:a2c0eb81ee83aceac200d9b10c7419649efde8ff0b3bafc6b22e63500e8245dc"
    }
  }
}
