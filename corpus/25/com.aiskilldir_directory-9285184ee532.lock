{
  "lockfileVersion": 2,
  "subjects": {
    "com.aiskilldir/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiskilldir.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ai-skill-directory",
        "title": "AI Skill Directory",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public directory of AI agent skills, prompts, MCP servers and agent rules. Use `search_skills` to find entries, then `get_skill` with a slug to fetch full content and install guidance. `list_categories` lists sections.",
      "tools": [
        {
          "name": "get_skill",
          "title": "Get skill",
          "description": "Fetch the full content of a skill by slug (SKILL.md, prompt text or MCP config) so the agent can use or install it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Skill slug from search_skills.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51df70bb79908bdcf22ad94b954b6f76a812ed57450f15cda0d8057f384a5a83"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List all sections of the AI Skill Directory with their slugs.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:910a78c92c269714e58910ec00a4096e632f62b570a8fb8d351c94df565f978d"
        },
        {
          "name": "search_skills",
          "title": "Search skills",
          "description": "Search the AI Skill Directory for agent skills, prompts, MCP servers and agent rules. Returns slugs to pass to get_skill.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug from list_categories.",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keywords matched against name, summary and author.",
                "maxLength": 100,
                "type": "string"
              },
              "type": {
                "description": "Filter by entry type.",
                "enum": ["skill", "mcp_server", "prompt", "gpt_instructions", "rules"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:464a2e6ae00e2bbf88ef773ab2c31d5ef0caa4d0a00c894177e752114c0118a1"
        }
      ],
      "digest": "sha256:fe4a68476eb49e976de0e18720942de7428aa955244def7dc3750f06a25d9e3c"
    }
  }
}
