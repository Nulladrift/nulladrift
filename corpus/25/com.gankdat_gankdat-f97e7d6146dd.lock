        {
          "name": "query_uk_care_locations",
          "title": "Regulated care locations in England (CQC)",
          "description": "Every health and social care location regulated by the Care Quality Commission in England — hospitals, care homes, GP practices, dentists, homecare agencies, hospices, ambulance services — with service types, specialisms, provider, address and area, local authority, region, and the date of the latest CQC check. From the official weekly CQC care directory, keyed by the stable CQC location id. Phone numbers are dropped at ingest; registered-manager names are never ingested. Filters combine with AND; q searches all text fields. Costs 1 credit(s) per call with an API key; without one, a preview of up to 5 rows (20 calls/day).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
