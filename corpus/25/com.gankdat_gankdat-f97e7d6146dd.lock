        {
          "name": "get_changes",
          "title": "Changes since a date",
          "description": "Rows added, removed or changed between daily refreshes of a register dataset (sam-exclusions, uk-food-hygiene, uk-sponsors, uk-charities, uk-care-locations, uk-schools, nhs-ods, uk-trademark-journal, uk-gambling-operators, uk-payment-practices, uk-company-accounts), newest first, 90-day history. Poll this instead of re-reading a whole register. `filter` takes the source's own query params (see list_sources supported_params, plus q) applied to the changed record — e.g. {\"classes\":\"09\",\"q\":\"acme\"} watches one Nice class of uk-trademark-journal for a mark. Costs 1 credit per call with an API key; without one, a preview of up to 5 rows (20 calls/day).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "change": {
                "enum": ["added", "removed", "changed"],
                "type": "string"
              },
              "filter": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "The source's query params (as for its query_ tool, plus q) to match the changed record against",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "page": {
                "default": 1,
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "anyOf": [
                  {
                    "format": "date",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                    "type": "string"
                  },
                  {
                    "format": "date-time",
                    "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                    "type": "string"
                  }
                ]
              },
              "source": {
                "enum": ["sam-exclusions", "uk-food-hygiene", "uk-sponsors", "uk-charities", "uk-care-locations", "uk-schools", "nhs-ods", "uk-trademark-journal", "uk-gambling-operators", "uk-payment-practices", "uk-company-accounts"],
                "type": "string"
              }
            },
            "required": ["source"],
            "type": "object"
          },
