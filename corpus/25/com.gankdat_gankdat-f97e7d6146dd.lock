          "name": "confirm_credit_purchase",
          "title": "Capture an approved PayPal order and add the credits",
          "description": "After the user approves the buy_credits link on PayPal, capture the order: the pack credits are added to the account and the new balance returned. Safe to repeat — an order is captured at most once. Free to call; needs the user's account.",
