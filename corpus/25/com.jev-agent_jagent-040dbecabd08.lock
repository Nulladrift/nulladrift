{
  "lockfileVersion": 2,
  "subjects": {
    "com.jev-agent/jagent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jev-agent.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "jagent",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Jagent grades writing and checks resumes with Jev, a judgment model that returns calibrated probabilities instead of generated text.\n- check_resume: score a resume against a job posting (keyword coverage, ATS format checks, the chance a recruiter interviews).\n- grade_essay: class essays, Common App personal statements and SAT School Day essays, against built-in rubrics.\n- grade_with_rubric: one or many submissions against a teacher's own rubric.\n- judge_yes_no, judge_choice, judge_score: any yes/no, multiple-choice or rubric question about a text, answered with probabilities.\n- compare_versions: which of two versions is stronger, asked in both orders to cancel position bias.\nNone of these tools write or rewrite text. Each call costs credits from the API key's balance (1 credit per 1,000 input tokens).",
      "tools": [
        {
          "name": "check_resume",
          "title": "Check a resume",
          "description": "Score a resume, optionally against a job posting: a 0-100 match score, the posting's keywords found and missing (matched literally, as an ATS search would), ATS format checks, the level fit, and the probability a recruiter would move it to interview.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "job_description": {
                "description": "The job posting to match against. Omit for a general resume check.",
                "maxLength": 8000,
                "type": "string"
              },
              "resume": {
                "description": "The resume as plain text.",
                "maxLength": 12000,
                "minLength": 150,
                "type": "string"
              }
            },
            "required": ["resume"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:97aba0ee2b6a9a1a30c74306eaabec3d6013feb75c648ea32f09fde6f1b026a2"
        },
        {
          "name": "compare_versions",
          "title": "Compare two versions",
          "description": "Which of two versions is stronger for a stated purpose. Asked twice with the order swapped and averaged, because the model favors the second option on close calls; if the two orders disagree the result is a tie.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "context": {
                "description": "The surrounding text, such as the whole essay or the job posting.",
                "maxLength": 60000,
                "type": "string"
              },
              "question": {
                "description": "e.g. 'Which opening line would an admissions reader find more compelling?'",
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              },
              "version_a": {
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              },
              "version_b": {
                "maxLength": 5000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["question", "version_a", "version_b"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3218aa038f0e33e2716ae91665f60c364bde4d14a024c3747c53a124ac5ce1eb"
        },
        {
          "name": "grade_essay",
          "title": "Grade an essay",
          "description": "Grade one essay against a built-in rubric. kind \"essay\": six criteria and a letter grade, for class essays at middle school, high school or college level. kind \"common-app\": a Common App personal statement (pass the prompt number, 1-7). kind \"sat\": an SAT School Day essay, Reading/Analysis/Writing each 1-4 (pass the source passage to check quotations).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "assignment": {
                "description": "kind \"essay\": the assignment prompt.",
                "maxLength": 2000,
                "type": "string"
              },
              "essay": {
                "description": "The essay text.",
                "maxLength": 20000,
                "minLength": 100,
                "type": "string"
              },
              "kind": {
                "default": "essay",
                "enum": ["essay", "common-app", "sat"],
                "type": "string"
              },
              "level": {
                "description": "kind \"essay\" only. Default high school.",
                "enum": ["middle school", "high school", "college"],
                "type": "string"
              },
              "passage": {
                "description": "kind \"sat\": the source passage.",
                "maxLength": 8000,
                "type": "string"
              },
              "prompt": {
                "description": "kind \"common-app\": which of the seven prompts. Default 7, topic of your choice.",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["essay"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d75cc22e2bd6bac2a68b13ec2d40c39e25f74656ebd5a1e2127f230fe8037d9e"
        },
        {
          "name": "grade_with_rubric",
          "title": "Grade against your own rubric",
          "description": "Grade one or more submissions (up to 30, in parallel) against a rubric you supply: each criterion scored on a 3- to 6-point scale, summed per submission. Each submission is graded in its own call, so its score never depends on the others.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "assignment": {
                "maxLength": 2000,
                "type": "string"
              },
              "criteria": {
                "description": "Rubric rows, e.g. { \"name\": \"Evidence\", \"description\": \"Supports the claim with specific evidence\" }.",
                "items": {
                  "properties": {
                    "description": {
                      "maxLength": 300,
                      "type": "string"
                    },
                    "name": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "points": {
                "default": 4,
                "maximum": 6,
                "minimum": 3,
                "type": "integer"
              },
              "submissions": {
                "items": {
                  "properties": {
                    "name": {
                      "maxLength": 80,
                      "type": "string"
                    },
                    "text": {
                      "maxLength": 20000,
                      "minLength": 100,
                      "type": "string"
                    }
                  },
                  "required": ["text"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["criteria", "submissions"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e7baa3899b35004891beb4ac44b0532ac914ec49e01761a0209857016bc49a37"
        },
        {
          "name": "judge_choice",
          "title": "Multiple-choice judgment",
          "description": "Pick the option that best fits a text, with a probability for every option and a confidence. Options map an id to a description of when it applies.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "options": {
                "additionalProperties": {
                  "maxLength": 500,
                  "minLength": 1,
                  "type": "string"
                },
                "description": "e.g. { \"billing\": \"Payments, refunds, invoices\", \"technical\": \"Bugs and errors\" }",
                "propertyNames": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "type": "object"
              },
              "question": {
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              },
              "text": {
                "maxLength": 60000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["options", "question", "text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d50c0e5d2ad8d4ca743c09cc39b6adbf816a38f14211c533fa987bc919567d40"
        },
        {
          "name": "judge_score",
          "title": "Rubric judgment",
          "description": "Place a text on an ordered scale you define (lowest level first) and get the nearest level, the exact position and a probability for each level.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "levels": {
                "description": "Lowest first, e.g. [\"Off-topic\", \"Partly relevant\", \"Fully relevant\"].",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              },
              "question": {
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              },
              "text": {
                "maxLength": 60000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["levels", "question", "text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:889df6af00dcbedc01cdb832d22d512242499cc575a272460b31188ac2120d01"
        },
        {
          "name": "judge_yes_no",
          "title": "Yes/no judgment",
          "description": "Ask any yes/no question about a text and get the probability that the answer is yes. Use for checks and gates, e.g. 'Does this reply answer the customer's question?'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "no_means": {
                "maxLength": 300,
                "type": "string"
              },
              "question": {
                "maxLength": 1000,
                "minLength": 3,
                "type": "string"
              },
              "text": {
                "description": "The text to judge.",
                "maxLength": 60000,
                "minLength": 1,
                "type": "string"
              },
              "yes_means": {
                "description": "What a yes looks like, if it helps to spell out.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["question", "text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b3288c999f5c336dc9ddcbc10c74e2be6f931c05f484e5941c120542189646ed"
        }
      ],
      "digest": "sha256:07de7b9e028177c4468797eadb8a5eb62cdbc660e06c9059d31552bf3be22aae"
    }
  }
}
