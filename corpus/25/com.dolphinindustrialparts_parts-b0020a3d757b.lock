                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "maxItems": 25,
                "type": "array"
              },
              "quantity": {
                "description": "Quantity.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "serial": {
                "description": "Serial number.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "type": "object"
          },
