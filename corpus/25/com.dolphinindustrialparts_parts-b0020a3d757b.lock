      "serverInfo": {
        "name": "dolphin-industrial-parts",
        "title": "Dolphin Industrial Parts",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dolphin Industrial Parts (dolphinindustrialparts.com, a division of Dolphin Marine Services Inc., dba Dolphin Centrifuge, Warren, Michigan) quotes compatible EU-made spare parts for marine and industrial equipment such as pumps, fresh water generators, self-cleaning filters, UV sterilizers and plate heat exchangers, for customers in the United States, Canada and Mexico. The parts are compatible alternatives, not OEM parts. These tools are read-only: look up a part number, list OEM brands, models and catalog pages, or prepare a quote request (request_quote never submits anything). Availability and price are quoted per application. The tools never return prices or stock, so do not state either. To order: Send the part number, quantity and equipment make, model and serial number through the quote form, or email sales@dolphincentrifuge.com or call (248) 522-2573. We confirm fit and reply with a USD quote within 1 business day. Parts are compatible alternatives, not original manufacturer parts. Dolphin Industrial Parts is not affiliated with, or authorized by, the equipment manufacturers named. Brand names are used for identification only. Pricing and availability are given only in a written quote.",
      "tools": [
        {
          "name": "get_manifest",
          "title": "Get the site manifest",
          "description": "Site, contact details, endpoints, tools, limits and disclaimer for Dolphin Industrial Parts. Availability and price are quoted per application.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:feaed21a717aeafe15e530ff22858c753acbf8ba561e7e58d3f037cb0558e4b4"
        },
        {
          "name": "list_brands",
          "title": "List OEM brands",
          "description": "List the OEM brands and equipment families for which Dolphin Industrial Parts quotes compatible parts, with model counts. Availability and price are quoted per application.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40d82b25ffd4d097b4dedfe09fb759651cd4ebcbe71e2fdb6ed4872c214ad799"
        },
        {
          "name": "list_catalog",
          "title": "Page through catalog parts",
          "description": "Page through catalog parts for one equipment family, 100 per page. Returns part numbers and descriptions with paging info. Availability and price are quoted per application.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "Equipment family slug.",
                "enum": ["pumps", "fresh-water-generators", "self-cleaning-filters", "uv-sterilizers", "rehardening-filters", "plate-heat-exchanger-gaskets", "tank-cleaning-machines", "compressor-parts", "separator-parts"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "1-based page number.",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["family"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d4d3ccb216855d3943a3712baf7ca9236d975d39d2204d65b404771768d8288"
        },
        {
          "name": "list_models",
          "title": "List models for a brand",
          "description": "List the equipment models and series quoted for one OEM brand (for example IMO, Moatti, Alfa Laval). Use list_brands for brand names. Availability and price are quoted per application.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "OEM brand name as returned by list_brands.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:00ca6c8d5a6d31c6ed73d542ce5ec46ab38838425c3ecd9f414ac19335e356fb"
        },
        {
          "name": "lookup_part",
          "title": "Look up a part number",
          "description": "Look up a part number: exact match, then prefix match, then a format-based guess of brand and family (not a confirmed match). Returns matching parts, how to order and the quote form URL. Parts are compatible alternatives, not OEM parts. Availability and price are quoted per application.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "part_number": {
                "description": "Part number, for example 223401-28 or P190123.",
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["part_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:43a8b43f8fcd471992447eefde739b5106086a9d99d16b0a9102ee11ab564489"
        },
        {
          "name": "request_quote",
          "title": "Prepare a quote request",
          "description": "Prepare a parts quote request (part numbers, quantities, equipment type, make, model, serial, country, notes). It never submits anything: it returns the cleaned request, the quote form URL and contact details so the customer can send it. Quotes are in USD within 1 business day. Availability and price are quoted per application.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Ship-to country.",
                "enum": ["United States", "Canada", "Mexico", "Other"],
                "type": "string"
              },
              "description": {
                "description": "Part description.",
                "maxLength": 300,
                "type": "string"
              },
              "equipment_type": {
                "description": "For example Pump, Separator / Centrifuge, Fresh Water Generator.",
                "maxLength": 80,
                "type": "string"
              },
              "make": {
                "description": "Equipment make.",
                "maxLength": 120,
                "type": "string"
              },
              "model": {
                "description": "Equipment model.",
                "maxLength": 120,
                "type": "string"
              },
              "notes": {
                "description": "Anything that helps identify the part.",
                "maxLength": 3000,
                "type": "string"
              },
              "part_number": {
                "description": "Single part number (use parts for several).",
                "maxLength": 80,
                "type": "string"
              },
              "parts": {
                "description": "Parts to quote.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "Description.",
                      "maxLength": 300,
                      "type": "string"
                    },
                    "part_number": {
