{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/memory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://memory.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "run-memory",
        "title": "Run Memory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Checkpoint and resume for AI agent runs. Save state after each step; when a run crashes, resume hands back the last step, state and finished items so it picks up where it left off instead of starting over. Free watch-only mode shows exactly what would be saved; Pro at $9 a month saves and resumes. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "list_checkpoints",
          "description": "List recent checkpoints (step, size, time) for one run or all runs on your key.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "description": "A stable id for this job that survives a crash, e.g. \"invoice-import-oct\". Use the same id when you restart.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e496c59a1e7ee518b05c4dbaf74bfcd80ec7e4a2accf733fe6ce295e37537529"
        },
        {
          "name": "resume",
          "description": "Call FIRST when a run starts. If a checkpoint exists for run_id (Pro), returns the last step, state and done list: continue from there and skip finished work. If none, start fresh.",
          "inputSchema": {
            "properties": {
              "run_id": {
                "description": "A stable id for this job that survives a crash, e.g. \"invoice-import-oct\". Use the same id when you restart.",
                "type": "string"
              }
            },
            "required": ["run_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de66b90bda3a0ae8e31ff1833808c38fdc77fa8ee6f508af32b6bbea806bc314"
        },
        {
          "name": "save_checkpoint",
          "description": "Call after each completed step with the state you would need to continue (cursor, ids done, partial results; up to 256 KB JSON). Pro saves it (last 20 per run, kept 30 days). Free watch-only saves nothing and returns would_save: exactly what would have been stored. Never put passwords or API keys in state.",
          "inputSchema": {
            "properties": {
              "done": {
                "description": "Optional list of completed item ids, so a resume skips them.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "run_id": {
                "description": "A stable id for this job that survives a crash, e.g. \"invoice-import-oct\". Use the same id when you restart.",
                "type": "string"
              },
              "state": {
                "description": "JSON state needed to resume.",
                "type": "object"
              },
              "step": {
                "description": "The step you just finished, e.g. \"imported page 3 of 10\".",
                "type": "string"
              }
            },
            "required": ["run_id", "state", "step"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:39ceecfe1617a4ffb981f3d989e6fd248201e6b2e8fc992fd8a598178312ccb9"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $49/month All Access upgrade link (cloudforbots.com/offer). Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f8895c9a1d194591686eb4108d589d31d709219a106bc36796a604b3aea5de83"
        },
        {
          "name": "weekly_report",
          "description": "Draft a plain-English report of the last 7 days: runs, checkpoints saved (Pro) or that would have been saved (free). Read-only; sends nothing.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c14f9413aafa4ac7997d79cef0003d6fdfc35043ac0c63831335386fce07ae2c"
        }
      ],
      "digest": "sha256:f4bbd201cb2def16b3423614d0601f89e44399405b6411f7dbd1704109b7fc45"
    }
  }
}
