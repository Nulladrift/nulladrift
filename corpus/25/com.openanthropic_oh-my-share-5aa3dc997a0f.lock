{
  "lockfileVersion": 2,
  "subjects": {
    "com.openanthropic/oh-my-share": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openanthropic.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "oh-my-share",
        "version": "2.3.0",
        "description": "Publish HTML/code from your agent and get a shareable link."
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Publish one HTML/code payload with upload, or a multi-file static site with upload_site (auth required). Both return an id, share URL and editToken; pass an idempotencyKey so retries after a timeout return the original asset instead of duplicating it. Anonymous single-file uploads are allowed (10/hour, 50/day, 7d default expiry, badge on the link); authenticated uploads are badge-free and can use upload_site (200 files, 20 MB total). Use view to read an asset back, list_assets for your own uploads, search_gallery for public works, and delete to remove one. Call get_info for limits and capabilities.",
      "tools": [
        {
          "name": "delete",
          "description": "Permanently delete one of your own assets by id. Irreversible: the share URL stops working immediately and the content cannot be restored. Requires authentication and ownership; ids you do not own return an error. Use list_assets to find the id; there is no bulk delete.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "12-character asset id you own (from list_assets).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false,
            "title": "Delete Asset"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:665fe1f1a56eb8e42a4b3bb1493bf8e28e577f1402220f9d789197a51b478e96"
        },
        {
          "name": "get_info",
          "description": "Return Oh My Share service metadata: version, REST and MCP endpoints, feature list, and per-IP rate limits (10 uploads/hour, 500 views/hour). Read-only, no auth, cheap to call. Use it once at startup to discover capabilities; use list_assets or search_gallery for actual content.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Service Info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:412040e02b81c944afa64728c514a1ce12730cbbe763031179c99a3f10d75332"
        },
        {
          "name": "list_assets",
          "description": "List up to 50 assets owned by the authenticated user, newest first, with id, filename, timestamps and share URL. Requires an API key or signed-in session; read-only, and results are capped at 50 with no pagination. Use search_gallery for public works from other users, or view to open one of your assets.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "List Assets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:78c3b0f7deac390b2668e3c982a05614266a4dcddcbe4acf5ae79d4270b92a16"
        },
        {
          "name": "search_gallery",
          "description": "Search public gallery works by keyword across title, description, tags and id; omit query to browse the newest works. Returns a paginated result set (items, total, page, pages) where each item has id, title, views and URLs. sort is new (newest) or hot (most liked and viewed); limit is capped at 20. No auth required. Use view to open a result, or list_assets for your own uploads.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Results per page, 1 to 20. Default 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "1-based page number. Default 1.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword matched against title, description, tags and id; empty returns the newest works.",
                "type": "string"
              },
              "sort": {
                "default": "new",
                "description": "new = newest first; hot = most liked and viewed.",
                "enum": ["new", "hot"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "Search Gallery"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4e0c4d60aa6847ca9b853afcbaea2f928b910786f1313ce348f0c932db9954aa"
        },
        {
          "name": "upload",
          "description": "Upload one HTML/code payload and get a public share URL plus an edit token. Each call creates a new asset unless idempotencyKey is reused. Anonymous uploads are rate-limited to 10/hour and 50/day per IP; authenticated uploads are limited per account. Content is public unless password-protected and expires after expiresIn (default 7d). Use upload_site for multi-file sites, view to read back, list_assets for your own files, or delete to remove one.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "HTML or code to publish (required, max 500 KB).",
                "type": "string"
              },
              "description": {
                "description": "Optional description for the asset.",
                "type": "string"
              },
              "expiresIn": {
                "default": "7d",
                "description": "Retention: 1h, 24h, 7d, 30d, 90d, or 0 for permanent. Default 7d.",
                "type": "string"
              },
              "filename": {
                "description": "Optional display filename used in the title and download name (max 200 chars).",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Optional 1-128 char retry key. Reusing it with the same payload returns the original asset; the edit token is only returned to the original caller.",
                "type": "string"
              },
              "language": {
                "default": "html",
                "description": "Content language hint, e.g. html, css, js, json, markdown. Default html.",
                "type": "string"
              },
              "password": {
                "description": "Optional password; the web view asks for it before showing content.",
                "type": "string"
              },
              "tags": {
                "description": "Optional comma-separated tags.",
                "type": "string"
              },
              "title": {
                "description": "Optional title shown in the viewer and gallery metadata.",
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Upload Content"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ddd0798d464c555c9a1a888cd4ef2849876ead9088271367bd89e36f34da1b80"
        },
        {
          "name": "upload_site",
          "description": "Publish a multi-file static site from an authenticated account. Pass files as an array of {path, content} strings; the root must contain index.html or index.htm. Returns a /s/<id>/ URL that serves HTML/CSS/JS/assets. Limits: 200 files, 20 MB total, 5 MB per file. Requires OAuth or an API key; site links never show the anonymous badge. Use idempotencyKey to make retries safe.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "Optional description.",
                "type": "string"
              },
              "expiresIn": {
                "default": "7d",
                "description": "Retention: 1h, 24h, 7d, 30d, 90d, or 0 for permanent. Default 7d.",
                "type": "string"
              },
              "files": {
                "description": "Site files. Paths are relative and must not contain .. or absolute paths.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "UTF-8 file content.",
                      "type": "string"
                    },
                    "path": {
                      "description": "Relative path, e.g. index.html or assets/app.css.",
                      "type": "string"
                    }
                  },
                  "required": ["content", "path"],
                  "type": "object"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              },
              "idempotencyKey": {
                "description": "Optional 1-128 char retry key. Reusing it with the same payload returns the original site; the edit token is only returned to the original caller.",
                "type": "string"
              },
              "tags": {
                "description": "Optional comma-separated tags.",
                "type": "string"
              },
              "title": {
                "description": "Optional site title; defaults to \"site\".",
                "type": "string"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false,
            "title": "Upload Static Site"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fe7141227fb814c821e94a11958e92bffcdee974321528484b1404450b9a0bf"
        },
        {
          "name": "view",
          "description": "Fetch a single asset by id and return its content, filename, creation time and share URL. Read-only and safe to retry; public assets need no auth, password-protected assets return an error with the share URL, and client-encrypted content is returned as stored. Use search_gallery to find an id, or list_assets for your own uploads.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "12-character asset id returned by upload or search_gallery.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true,
            "title": "View Content"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ba6b7df7d9bb189af50b0d0db6320a0dd72cb71ab00eff2d39638e11450ecd7f"
        }
      ],
      "digest": "sha256:d849b13fdc4e2bb6c96cc03246698b300352cfaedfa66be4b2a35f278b2a2a72"
    }
  }
}
