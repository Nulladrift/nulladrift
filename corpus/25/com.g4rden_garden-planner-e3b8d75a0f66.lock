{
  "lockfileVersion": 2,
  "subjects": {
    "com.g4rden/garden-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://g4rden.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "g4rden",
        "title": "g4rden garden planner",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only gardening data from g4rden.com: city growing guides with frost dates, month-by-month planting, and plant growing notes. Use find_city first to get a slug. No login; please be gentle (about one call a second).",
      "tools": [
        {
          "name": "find_city",
          "title": "Find a g4rden city guide",
          "description": "Find g4rden's growing guides by place name, or the nearest guides to a latitude/longitude. Returns slugs to use with the other tools. Covers 400+ cities worldwide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lon": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "query": {
                "description": "A city or town name, e.g. 'Leeds' or 'Portland'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b514c5f6c3714dcc8bd6aeaa7139e78f29e9a8920cd13d5d64609ac351b9a1bc"
        },
        {
          "name": "get_city_guide",
          "title": "Get a city's growing guide",
          "description": "A city's growing guide as Markdown: average last and first frost dates (from a nearby weather station where there is one), the frost-free season, hardiness zone, climate, and the crops that suit it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "A slug from find_city (e.g. 'leeds') or a city name.",
                "type": "string"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c9a471249c912ae460049f1aaf2f188fa78124b664d18754b5bedecc957d990"
        },
        {
          "name": "get_pest",
          "title": "Identify and treat a garden pest or disease",
          "description": "A garden pest or disease as Markdown: how to recognise it, which plants it attacks, and a treatment ladder from least to most drastic. Covers 46 common pests and diseases with treatment advice and about 390 plant-health records (host plants, where recorded, regulatory status) by common or scientific name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pest": {
                "description": "A pest or disease name, e.g. 'aphids', 'powdery mildew', 'slugs', 'Popillia japonica'.",
                "type": "string"
              }
            },
            "required": ["pest"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c467f4e92080f41631d65d1f778f1dc7bf46c567f83c1632661b6b62c72ebce1"
        },
        {
          "name": "get_plant",
          "title": "Get a plant's growing notes",
          "description": "How to grow a plant (vegetable, herb, fruit or flower) as Markdown: spacing, sun, water, timing relative to frost, companions and pests.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plant": {
                "description": "A plant name, e.g. 'tomato', 'garlic', 'sweet pea'.",
                "type": "string"
              }
            },
            "required": ["plant"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d619848a3e7231ce79fe36d72d3edde5e6d345d5cfd741d556b0c55990861e4f"
        },
        {
          "name": "planner_link",
          "title": "Link to the free planner for a place",
          "description": "A link that opens g4rden's free garden planner already set to a city or location, for the person to open themselves. Creates nothing: the person decides whether to make an account.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "A slug or city name.",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "place": {
                "description": "A label for a lat/lon location, e.g. a town name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4f5aa651072125f934ce57427605fd66bc4646f39cb8ea07d27030f84973d6a5"
        },
        {
          "name": "what_to_plant",
          "title": "What to plant in a city in a month",
          "description": "What to start indoors, sow outdoors or plant out in a given city and month, as Markdown, from that city's own frost dates. Months with nothing new to sow say so and point to the next sowing month.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "month": {
                "description": "Month name or number, e.g. 'March' or '3'.",
                "type": "string"
              }
            },
            "required": ["city", "month"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ae82baf41f69ada5ba0622e16dee10b2a2255efdac4ff58a3f2e02b04b0c527"
        }
      ],
      "digest": "sha256:a3772432d016f00ff53d5e8f86ec658b18c50ea2c1b43c8506f756aa5c047792"
    }
  }
}
