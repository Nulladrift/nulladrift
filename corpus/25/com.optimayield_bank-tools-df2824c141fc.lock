{
  "lockfileVersion": 2,
  "subjects": {
    "com.optimayield/bank-tools": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.optimayield.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "optimayield-bank-tools",
        "title": "OptimaYield free bank-treasury tools",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free calculators and reports for bank treasury, CFO, and ALCO staff, computed from FFIEC Call Report filings. Every tool takes an FDIC certificate number. Results state whether each number is filed, derived, or assumed, and include limitations; relay them when you summarize.",
      "tools": [
        {
          "name": "deposit_pricing_decision",
          "title": "Deposit pricing decision: Defend, Match, or Lead",
          "description": "Price holding, matching, or beating the market rate on a bank's deposits: annual cost, balances at risk, breakeven retention, and sensitivity. Free; computed from FFIEC filings; results state whether each number is filed, derived, or assumed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "baselineRunoffPercent": {
                "default": 5,
                "description": "The share of the repriced balances that leaves within a year even when your rate matches the market. Your assumption, not a filed figure; a starting value to replace.",
                "maximum": 50,
                "minimum": 0,
                "type": "number",
                "x-step": 1,
                "x-unit": "percent"
              },
              "category": {
                "default": "savings",
                "description": "Which filed deposit category the pricing decision applies to. Balances and current cost come from the bank's Call Report.",
                "enum": ["transaction", "savings", "time_small", "time_large"],
                "type": "string"
              },
              "certificate": {
                "description": "FDIC certificate number of the bank.",
                "minimum": 1,
                "type": "integer"
              },
              "leadPremiumBp": {
                "default": 25,
                "description": "How far above the market rate the Lead option prices, in basis points. A starting value to replace with your own.",
                "maximum": 200,
                "minimum": 0,
                "type": "number",
                "x-step": 5,
                "x-unit": "basis_points"
              },
              "marketRatePercent": {
                "default": null,
                "description": "The rate competitors pay for this product. Leave empty to use the FDIC national average for the product as a reference; that average is usually well below competitive offers, so enter your own market rate when you have one.",
                "maximum": 15,
                "minimum": 0,
                "type": ["number", "null"],
                "x-step": 0.05,
                "x-unit": "percent"
              },
              "replacementSpreadBp": {
                "default": 25,
                "description": "What it costs, above the Fed funds rate, to replace balances that leave, in basis points.",
                "maximum": 300,
                "minimum": 0,
                "type": "number",
                "x-step": 5,
                "x-unit": "basis_points"
              },
              "repricedSharePercent": {
                "default": 100,
                "description": "The part of the category balance whose rate changes under Match or Lead. For time deposits, use the share maturing soon (see the maturity wall calculator).",
                "maximum": 100,
                "minimum": 1,
                "type": "number",
                "x-step": 1,
                "x-unit": "percent"
              },
              "runoffPerPointPercent": {
                "default": 10,
                "description": "The additional share of balances lost for every 100 basis points your rate sits below the market, and recovered for every 100bp above it. This is the elasticity assumption that drives the decision; the sensitivity table shows how the answer changes with it.",
                "maximum": 100,
                "minimum": 0,
                "type": "number",
                "x-step": 1,
                "x-unit": "percent"
              }
            },
            "required": ["certificate"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4a6985838fcb359a488ffc042d1abd4774d7cca6ca82df2b7fa632cce509a5cc"
        },
        {
          "name": "get_bank_profile",
          "title": "Bank profile: size, capital, margin, liquidity",
          "description": "Headline profile for one bank from its latest Call Report data: identity, total assets, deposits, loans, ROA, ROE, net interest margin, capital, liquidity and credit ratios, with the reporting period and source. Units are stated on every value.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certificate": {
                "description": "FDIC certificate number of the bank (from search_banks).",
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["certificate"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21838d7ecab4b280f7c0d07cb2e2e91223167e248fefd9b2f61f86b0310af59c"
        },
        {
          "name": "loss_reserve_scenario",
          "title": "Loss and reserve scenario: charge-offs, provision, and capital",
          "description": "Stress a bank's net charge-offs: provision needed to hold its allowance ratio and the after-tax hit to CET1 or leverage capital, with peers. Free; computed from FFIEC filings; results state whether each number is filed, derived, or assumed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "capitalFloorPercent": {
                "default": null,
                "description": "The capital ratio to measure headroom against. Leave empty to use 7.0% for a CET1 ratio (the 4.5% minimum plus the 2.5% conservation buffer) or 5.0% for a Tier 1 leverage ratio (well capitalized). Community banks that elected the leverage framework may use 9%.",
                "maximum": 30,
                "minimum": 0,
                "type": ["number", "null"],
                "x-step": 0.5,
                "x-unit": "percent"
              },
              "certificate": {
                "description": "FDIC certificate number of the bank.",
                "minimum": 1,
                "type": "integer"
              },
              "earningsOffsetPercent": {
                "default": 0,
                "description": "The part of the provision covered by pre-provision earnings before it reaches capital. Zero is the conservative case: every dollar of provision reduces capital.",
                "maximum": 100,
                "minimum": 0,
                "type": "number",
                "x-step": 5,
                "x-unit": "percent"
              },
              "loanGrowthPercent": {
                "default": 0,
                "description": "Growth in loans over the stress year. Growth raises the allowance needed to hold the ratio; it does not change the charge-off dollars, which are based on today's loans.",
                "maximum": 50,
                "minimum": -20,
                "type": "number",
                "x-step": 1,
                "x-unit": "percent"
              },
              "reserveBuildBp": {
                "default": 0,
                "description": "How much the bank lets its allowance ratio change, in basis points of loans. Zero holds today's allowance-to-loans ratio, which is the base case; a positive number models a reserve build as conditions deteriorate.",
                "maximum": 300,
                "minimum": -100,
                "type": "number",
                "x-step": 5,
                "x-unit": "basis_points"
              },
              "stressNcoRatePercent": {
                "default": null,
                "description": "The annual net charge-off rate to stress, as a share of loans. Leave empty to use the 90th percentile rate among banks in the same asset band as a labelled reference; enter your own for a specific scenario.",
                "maximum": 15,
                "minimum": 0,
                "type": ["number", "null"],
                "x-step": 0.05,
                "x-unit": "percent"
              },
              "taxRatePercent": {
                "default": 21,
                "description": "The tax shield on the provision. 21% is the U.S. federal statutory corporate rate, used as a starting reference; add state tax or set to zero if the bank cannot use the shield.",
                "maximum": 50,
                "minimum": 0,
                "type": "number",
                "x-step": 1,
                "x-unit": "percent"
              }
            },
            "required": ["certificate"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:711b6adea9efe9b7e0e353bf1750fd054faae4a956a08214f05428172c16612b"
        },
        {
          "name": "margin_capture",
          "title": "Margin capture report: loan beta versus deposit beta",
          "description": "Compare a bank's loan beta with its deposit beta and rank the spread against its asset-band peers, from FFIEC filings. Free; computed from FFIEC filings; results state whether each number is filed, derived, or assumed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certificate": {
                "description": "FDIC certificate number of the bank.",
                "minimum": 1,
                "type": "integer"
              },
              "cycle": {
                "default": "hike_2022_23",
                "description": "Which past rate cycle the loan and deposit betas are measured over. Both betas use the same cycle so they are comparable.",
                "enum": ["hike_2022_23", "ease_2019_20", "ease_2024_26", "hike_2017_19", "interval_up", "interval_down", "interval_full"],
                "type": "string"
              }
            },
            "required": ["certificate"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bcdfc286c9d7639ade2048fdfa4c326de17a6812763913f1aa871992e02c4e04"
        },
        {
          "name": "maturity_wall_refinancing",
          "title": "Maturity wall refinancing calculator",
          "description": "Measure time deposits maturing or repricing within a year, then test explicit renewal and replacement assumptions against tier-specific costs. Free; computed from FFIEC filings; results state whether each number is filed, derived, or assumed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certificate": {
                "description": "FDIC certificate number of the bank.",
                "minimum": 1,
                "type": "integer"
              },
              "renewalRatePercent": {
                "default": null,
                "description": "The rate you expect to pay on renewing time deposits. Leave empty to use the current Fed funds rate as a reference; the scenario table shows other reference rates.",
                "maximum": 15,
                "minimum": 0,
                "type": ["number", "null"],
                "x-step": 0.05,
                "x-unit": "percent"
              },
              "retentionPercent": {
                "default": 80,
                "description": "How much of the time deposits maturing within 12 months stay with the bank. The rest runs off and is replaced with other funding.",
                "maximum": 100,
                "minimum": 0,
                "type": "number",
                "x-step": 5,
                "x-unit": "percent"
              },
              "wholesaleSpreadBp": {
                "default": 25,
                "description": "What you would pay above the Fed funds rate to replace deposits that run off, in basis points.",
                "maximum": 300,
                "minimum": 0,
                "type": "number",
                "x-step": 5,
                "x-unit": "basis_points"
              }
            },
            "required": ["certificate"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:79401b6a0e535002ed2e4950296850e9323c778a32a8f808f4b67d22a3252ef6"
        },
        {
          "name": "nim_rate_shock",
          "title": "Net interest income rate-shock calculator",
          "description": "Estimate how a Fed funds move changes a bank's loan yield, deposit cost, and net interest income, using its own filed pass-through history. Free; computed from FFIEC filings; results state whether each number is filed, derived, or assumed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certificate": {
                "description": "FDIC certificate number of the bank.",
                "minimum": 1,
                "type": "integer"
              },
              "depositBetaOverride": {
                "default": null,
                "description": "Replace the derived deposit beta with your own assumption. Leave empty to use the filed history.",
                "maximum": 1.5,
                "minimum": -0.25,
                "type": ["number", "null"],
                "x-step": 0.05,
                "x-unit": "ratio"
              },
              "fedMoveBp": {
                "default": -100,
                "description": "Parallel change in the Fed funds rate, in basis points. Negative is a cut.",
                "maximum": 400,
                "minimum": -400,
                "type": "number",
                "x-step": 25,
                "x-unit": "basis_points"
              },
              "loanBetaOverride": {
                "default": null,
                "description": "Replace the derived loan beta with your own assumption. Leave empty to use the filed history.",
                "maximum": 1.5,
                "minimum": -0.25,
                "type": ["number", "null"],
                "x-step": 0.05,
                "x-unit": "ratio"
              },
              "regime": {
                "default": "auto",
                "description": "Which past rate cycle supplies the loan and deposit betas. Automatic is right for most uses.",
                "enum": ["auto", "hike_2022_23", "hike_2017_19", "ease_2019_20", "ease_2024_26", "intervals"],
                "type": "string"
              }
            },
            "required": ["certificate"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9bcae8966b2ae4c7f757dbb32eb7edd03e069624e256833c740ff6debb4476fc"
        },
        {
          "name": "search_banks",
          "title": "Find a bank's FDIC certificate number",
          "description": "Look up a US bank by name (legal or common, e.g. \"Chase\", \"state street\") and return its FDIC certificate number, city, state and total assets. Use this first: every other tool needs the certificate. Optionally narrow by two-letter state.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum results.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Bank name, or words from it; a city name also matches.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code to narrow the search, e.g. MA.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67cb75638dbd42671ae59999b01b58620b236b3153d95a0aa707ca04f6ab9684"
        }
      ],
      "digest": "sha256:a863ba6d7ebaf5506d33a4d09ebd539f72c6224878c5e1db9d3169b721fac31d"
    }
  }
}
