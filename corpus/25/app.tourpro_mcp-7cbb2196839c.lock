                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "sold": {
                      "description": "Tickets sold.",
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["label", "price", "sold"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "tourEventId": {
                "description": "The show event id (see list_events).",
                "format": "uuid",
                "type": "string"
              },
              "tourId": {
                "description": "The TourPro tour ID (see list_my_tours).",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["currency", "tourEventId", "tourId"],
