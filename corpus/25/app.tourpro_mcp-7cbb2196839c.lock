        {
          "name": "create_event",
          "title": "Create event",
          "description": "Add an event (show, travel, day_off, load_in, sound_check, rehearsal, meeting, other) to a tour's schedule. Requires the can_create_events permission. Times are 24-hour HH:MM (e.g. 7pm = \"19:00\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Date as YYYY-MM-DD.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "endTime": {
                "description": "24-hour time HH:MM, e.g. 19:00 for 7pm.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "location": {
                "additionalProperties": false,
                "description": "Venue and address of the event.",
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "postalCode": {
                    "type": "string"
                  },
                  "state": {
                    "type": "string"
                  },
                  "streetAddress": {
                    "type": "string"
                  },
                  "venueName": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "notes": {
                "description": "Free-text notes.",
                "maxLength": 5000,
                "type": "string"
              },
              "startDayOffset": {
                "description": "Set to 1 when the event occurs after midnight on the calendar day following `date` (e.g. a 2am curfew listed under the show day). Only for timed event types, never travel or day_off.",
                "maximum": 1,
                "minimum": 0,
                "type": "integer"
              },
              "startTime": {
                "description": "24-hour time HH:MM, e.g. 19:00 for 7pm.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "title": {
                "description": "Event title.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "tourId": {
                "description": "The TourPro tour ID (see list_my_tours).",
                "format": "uuid",
                "type": "string"
              },
              "type": {
                "description": "Event type: show, travel, day_off, load_in, sound_check, rehearsal, meeting, or other.",
