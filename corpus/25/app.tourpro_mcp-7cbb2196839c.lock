        {
          "name": "update_settlement_draft",
          "title": "Update settlement draft",
          "description": "Change a settlement draft: deal type, guarantee, percentage and base, gross or ticket tiers, deductions, expenses, expense cap, promoter. Only the fields you pass change; list fields replace the whole list. Adjustments, chargebacks, tax on fee and reimbursements are kept as they are (edit those in the app). Returns the new server calculation. A finalized settlement must be reopened in the app first. Requires Manage finance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dealType": {
                "description": "Deal type: flat (guarantee only), percentage (of a base), versus (guarantee versus a percentage, whichever is higher), plus (guarantee plus a percentage of NBOR over the split point).",
                "enum": ["flat", "percentage", "versus", "plus"],
                "type": "string"
              },
              "deductions": {
                "description": "Taxes and ticketing fees taken off the gross before NBOR. Replaces all existing deductions.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "amount": {
                      "description": "Amount as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "label": {
                      "description": "What the deduction is, e.g. \"Sales tax\".",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "note": {
                      "description": "Optional note, e.g. \"13% HST\".",
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "required": ["amount", "label"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "expenseCap": {
                "anyOf": [
                  {
                    "description": "Cap on total allowed expenses as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                    "maxLength": 40,
                    "minLength": 1,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Cap on total allowed expenses as a decimal string, or null to remove the cap."
              },
              "expenses": {
                "description": "Show expenses. Replaces all existing expense lines.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "actual": {
                      "description": "Actual cost as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "allowed": {
                      "description": "Amount the deal lets the promoter deduct (defaults to actual) as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "label": {
                      "description": "Expense name, e.g. \"Production\".",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["actual", "label"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "gross": {
                "description": "Gross box office, entered directly (replaces ticket tiers) as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "guarantee": {
                "description": "Guarantee as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "percentage": {
                "description": "Artist percentage, e.g. \"85\" or \"87.5\" (at most 4 decimals).",
                "maxLength": 12,
                "type": "string"
              },
              "percentageBase": {
                "description": "What the percentage applies to: gross, nbor (net box office) or nae (net after expenses).",
                "enum": ["gross", "nbor", "nae"],
                "type": "string"
              },
              "promoterCompany": {
                "description": "Promoter company shown on the statement.",
                "maxLength": 200,
                "type": "string"
              },
              "promoterName": {
                "description": "Promoter or buyer name shown on the statement.",
                "maxLength": 200,
                "type": "string"
              },
              "promoterProfit": {
                "description": "Promoter profit for a plus deal as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "rowVersion": {
                "description": "The rowVersion from get_settlement. When given, the update is refused if someone changed the settlement since.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "settlementId": {
                "description": "The settlement id (see list_settlements).",
                "format": "uuid",
                "type": "string"
              },
              "ticketTiers": {
                "description": "Ticket tiers; the gross is computed from them. Replaces all existing tiers.",
                "items": {
                  "additionalProperties": false,
