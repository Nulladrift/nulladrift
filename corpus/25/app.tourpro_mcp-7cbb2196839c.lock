                    },
                    "label": {
                      "description": "Tier name, e.g. \"GA\".",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "price": {
                      "description": "Ticket price as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                      "maxLength": 40,
                      "minLength": 1,
                      "type": "string"
                    },
                    "sold": {
                      "description": "Tickets sold.",
                      "minimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": ["label", "price", "sold"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "tourId": {
                "description": "The TourPro tour ID (see list_my_tours).",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["settlementId", "tourId"],
            "type": "object"
          },
