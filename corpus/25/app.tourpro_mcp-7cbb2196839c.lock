        {
          "name": "record_settlement_payment",
          "title": "Record settlement payment",
          "description": "Record a ledger entry on a settlement: deposit, payment, withholding_credit, write_off or refund_to_promoter. Cash kinds (deposit, payment, refund_to_promoter) need heldBy; non-cash kinds need notes giving the reason. Entries are permanent (void them instead of deleting). Requires Manage finance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "amount": {
                "description": "Amount (positive) as a decimal string in the currency, e.g. \"1250.50\", \"1.250,50\" or \"1 250,50\". Never a float.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "confirmDuplicate": {
                "description": "Set true only when TourPro warned about a possible duplicate and the user confirmed this is a separate entry.",
                "type": "boolean"
              },
              "counterparty": {
                "description": "Who paid, e.g. the promoter.",
                "maxLength": 200,
                "type": "string"
              },
              "currency": {
                "description": "Currency of the amount; must be the settlement currency.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "heldBy": {
                "description": "Who holds the cash. Required for cash kinds, not allowed otherwise.",
                "enum": ["artist", "agency", "other"],
                "type": "string"
              },
              "kind": {
                "description": "Ledger entry kind.",
                "enum": ["deposit", "payment", "withholding_credit", "write_off", "refund_to_promoter"],
                "type": "string"
              },
              "method": {
                "description": "Payment method, e.g. wire, cash, check.",
                "maxLength": 50,
                "type": "string"
              },
              "notes": {
                "description": "Notes; required for withholding_credit and write_off.",
                "maxLength": 1000,
                "type": "string"
              },
              "operationId": {
                "description": "Optional. Leave empty for a new action. When a previous attempt of this exact call failed with an unknown outcome, pass the operationId that attempt reported so TourPro applies it at most once.",
                "format": "uuid",
                "type": "string"
              },
              "receivedOn": {
                "description": "Date received as YYYY-MM-DD (not in the future).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "reference": {
                "description": "Bank or check reference.",
                "maxLength": 200,
                "type": "string"
              },
              "settlementId": {
                "description": "The settlement id (see list_settlements).",
                "format": "uuid",
                "type": "string"
              },
              "tourId": {
                "description": "The TourPro tour ID (see list_my_tours).",
                "format": "uuid",
                "type": "string"
              }
