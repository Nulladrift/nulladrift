        {
          "name": "finalize_settlement",
          "title": "Finalize settlement",
          "description": "Finalize a settlement draft into a published revision, in two steps. First call without calculationDigest: nothing changes and the tool returns the server-computed result, its calculationDigest and rowVersion. Show that result to the user. Only after they confirm, call again with that calculationDigest and rowVersion. If the numbers changed in between, TourPro refuses and you must review again. A correction (revision 2 or later) needs correctionReason. Requires Manage finance.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calculationDigest": {
                "description": "The digest from the review step. Only pass it after the user confirmed that exact result.",
                "pattern": "^[0-9a-f]{64}$",
                "type": "string"
              },
              "correctionReason": {
                "description": "Why a finalized settlement is being corrected. Required for revision 2 or later.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "operationId": {
                "description": "Optional. Leave empty for a new action. When a previous attempt of this exact call failed with an unknown outcome, pass the operationId that attempt reported so TourPro applies it at most once.",
                "format": "uuid",
                "type": "string"
              },
              "rowVersion": {
                "description": "The rowVersion from the review step. Required with calculationDigest.",
                "exclusiveMinimum": 0,
                "type": "integer"
              },
              "settlementId": {
                "description": "The settlement id (see list_settlements).",
                "format": "uuid",
                "type": "string"
              },
              "tourId": {
                "description": "The TourPro tour ID (see list_my_tours).",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["settlementId", "tourId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Finalize settlement"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
