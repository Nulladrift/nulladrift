{
  "lockfileVersion": 2,
  "subjects": {
    "com.esimeagle/plans": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://esimeagle.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "eSIM Eagle",
        "version": "1.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use this server to find live eSIM plans and prices for one or more travel destinations. It is read-only; send users to the returned checkout URL to buy.",
      "tools": [
        {
          "name": "find_esim_plans",
          "title": "Find Esim Plans Tool",
          "description": "Finds up to five live eSIM plans that cover every requested country or region, priced for the trip length, data need, currency, and locale. Use the returned checkout URL to buy.",
          "inputSchema": {
            "properties": {
              "currency": {
                "default": "USD",
                "description": "ISO 4217 display currency code.",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "data_need": {
                "default": "recommended",
                "description": "Expected data usage. Recommended assumes about 500 MB per day.",
                "enum": ["light", "recommended", "heavy"],
                "type": "string"
              },
              "destinations": {
                "description": "One to ten ISO country codes, destination slugs, or exact English destination names, such as JP, japan, or Europe.",
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "locale": {
                "default": "en",
                "description": "Language for destination names, activation guidance, and checkout URLs.",
                "enum": ["en", "es", "fr", "de", "ar", "zh", "hi", "ru"],
                "type": "string"
              },
              "trip_days": {
                "description": "Number of travel days.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["destinations", "trip_days"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "type": "string"
              },
              "data_need": {
                "type": "string"
              },
              "destinations": {
                "items": {
                  "properties": {
                    "code": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["code", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "locale": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "plan_count": {
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "plans": {
                "items": {
                  "properties": {
                    "activation": {
                      "type": "string"
                    },
                    "checkout_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "currency": {
                      "type": "string"
                    },
                    "daily_allowance_mb": {
                      "type": ["integer", "null"]
                    },
                    "data": {
                      "type": "string"
                    },
                    "fup": {
                      "type": ["string", "null"]
                    },
                    "high_speed_data_mb": {
                      "type": ["integer", "null"]
                    },
                    "id": {
                      "type": "integer"
                    },
                    "plan_destination": {
                      "type": "string"
                    },
                    "plan_type": {
                      "type": "string"
                    },
                    "price": {
                      "type": "string"
                    },
                    "price_cents": {
                      "type": "integer"
                    },
                    "top_up_supported": {
                      "type": "boolean"
                    },
                    "validity_days": {
                      "type": "integer"
                    }
                  },
                  "required": ["activation", "checkout_url", "currency", "daily_allowance_mb", "data", "fup", "high_speed_data_mb", "id", "plan_destination", "plan_type", "price", "price_cents", "top_up_supported", "validity_days"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "recommended_data_mb": {
                "type": "integer"
              },
              "trip_days": {
                "type": "integer"
              }
            },
            "required": ["currency", "data_need", "destinations", "locale", "message", "plan_count", "plans", "recommended_data_mb", "trip_days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Esim Plans Tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7421ddb97da99fe2b82e5685679ab711f012e3a0c285fa3ef75d8afc6f6d9b7f"
        }
      ],
      "digest": "sha256:504b156a8a95972d3b47773b42ad2401119fa7561c46c5710b7d1ff5f9f433ff"
    }
  }
}
