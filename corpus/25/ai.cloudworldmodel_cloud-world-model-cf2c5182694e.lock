        {
          "name": "simulation.metrics",
          "title": "Get Simulation Metrics",
          "description": "Requires simulationId from simulation.create (optional in demo). Returns latest/history; full retains evidence. No new IDs. Next tool is simulation.step. CWM_RAMP_GAP_NOT_ERRORS=\"true\": owned AWS lean/2-app typical-v1 (500-RPS diagnostic) returns rampAveragingShortfallPct=100*(1-throughput/offeredRps), not errors; goodputSemantics=whole_run_average_including_warmup_ramp. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.metrics calibrationEligibility: recorded AWS selection, reasons and warnings; not measurement validation. GCP gcpFitPrediction: holdout-validated for one us-central1 topology at 300–500 RPS; see guide. Owned AWS calibrated outputs may include rampAveragingShortfallPct: the warmup-ramp goodput gap, reported separately and not counted as errors.",
