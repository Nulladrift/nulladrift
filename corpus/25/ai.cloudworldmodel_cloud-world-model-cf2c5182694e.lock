        {
          "name": "simulation.from_input",
          "title": "Simulate General Input",
          "description": "Requires write key, content and target. Formats: compose/kubernetes/terraform-plan. Compose/manifests/Docker need host; cloud plans derive hosts. target.resourceKind: workload/Service/Ingress. Manifest placement: fixed workers/pod slots, pooled CPU/latency, not per-node. Cloud scaling is assumed, not Terraform policy. Returns simulation.id and importReceipt target IDs. Next tool is simulation.step, then simulation.metrics. Requires API key with write scope; discovery only without a key. Read resource cwm://guides/public/simulation.from_input",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "activeProfiles": {
                "default": [],
                "items": {
                  "pattern": "^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$",
                  "type": "string"
                },
                "maxItems": 32,
                "type": "array"
              },
              "content": {
                "maxLength": 262144,
                "minLength": 1,
                "type": "string"
              },
