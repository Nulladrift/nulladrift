        {
          "name": "scenario.get",
          "title": "Get Scenario",
          "description": "Requires scenarioId returned by scenario.list (also available as id). Returns the complete selected graph, presets, assumptions and phase details. Next tool is simulation.create with scenarioId or the hydrated resources/connections. No API key required; demo limits apply. Read resource cwm://guides/public/scenario.get",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scenarioId": {
                "description": "Scenario ID from scenario.list.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["scenarioId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c71f7b7c8d2fd26f455bf01a8f0a58aa2711a319deb2c4f11172a7329442f4e7"
        },
        {
          "name": "scenario.list",
          "title": "List Scenarios",
          "description": "No prerequisites. Returns paginated scenarios cards with scenarioId (alias of id), name, summary and available provider/category/difficulty. Pass scenarioId to scenario.get. Filters precede stable ID paging: limit default 8, maximum 20; pass nextCursor as cursor until null. detailed=true restores rich cards. Next tool is scenario.get, then simulation.create with scenarioId. No API key required; demo limits apply. Read resource cwm://guides/public/scenario.list",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "maxLength": 256,
                "type": "string"
              },
              "detailed": {
                "default": false,
                "type": "boolean"
              },
              "difficulty": {
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "enum": ["aws", "gcp", "azure", "oci", "digitalocean", "hetzner"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {
              "limit": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "nextCursor": {
                "type": ["string", "null"]
              },
              "scenarios": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "difficulty": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "provider": {
                      "type": "string"
                    },
                    "scenarioId": {
                      "type": "string"
                    }
                  },
                  "required": ["category", "id", "name", "scenarioId"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["limit", "nextCursor", "scenarios", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
