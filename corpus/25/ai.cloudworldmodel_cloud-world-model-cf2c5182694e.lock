        {
          "name": "simulation.inject_failure",
          "title": "Inject Failure",
          "description": "Requires simulationId and resourceId from simulation.create. Injects a bounded resource failure; returns updated state. Next tool is simulation.step, then simulation.recover_resource and simulation.metrics to confirm authoritative health. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.inject_failure",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "Only with explicit type cdn_cache_loss or az_outage and CDN-capable network resourceId or resourceName. Integer 1–86400 simulation steps, not seconds; default 30. No random/node-pool selectors; omit for legacy quick failures.",
                "maximum": 86400,
                "minimum": 1,
                "type": "integer"
              },
              "nodePoolId": {
                "minLength": 1,
                "type": "string"
              },
              "nodePoolName": {
                "minLength": 1,
                "type": "string"
              },
              "resourceId": {
                "type": "string"
              },
              "resourceName": {
                "type": "string"
              },
              "simulationId": {
                "description": "ID returned by simulation.create.",
                "type": "string"
              },
              "type": {
                "description": "Only cdn_cache_loss or az_outage, with an explicit CDN-capable network resourceId or resourceName; no random/node-pool selectors. Cache loss forwards misses; az_outage blocks the edge. Omit type and duration for legacy quick failures.",
                "enum": ["cdn_cache_loss", "az_outage"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
