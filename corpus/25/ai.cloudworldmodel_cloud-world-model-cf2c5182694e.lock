        {
          "name": "simulation.step",
          "title": "Simulate Step",
          "description": "Requires simulationId from simulation.create (optional in demo). Returns completedSteps/currentStep; next tool is simulation.metrics. Retry same operationId/inputs. CWM_RAMP_GAP_NOT_ERRORS=\"true\": owned AWS lean/2-app typical-v1 (500-RPS diagnostic) returns rampAveragingShortfallPct=100*(1-throughput/offeredRps), not errors; goodputSemantics=whole_run_average_including_warmup_ramp. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.step calibrationEligibility: recorded AWS selection, reasons and warnings; not measurement validation. Owned AWS calibrated outputs may include rampAveragingShortfallPct: the warmup-ramp goodput gap, reported separately and not counted as errors.",
