                "additionalProperties": false,
                "properties": {
                  "drains": {
                    "default": [],
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "step": {
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "integer"
