              "filename": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "files": {
                "additionalProperties": {
                  "maxLength": 262144,
                  "type": "string"
                },
                "default": {},
                "type": "object"
              },
              "format": {
                "enum": ["compose", "kubernetes", "terraform-plan"],
                "type": "string"
              },
              "host": {
                "additionalProperties": false,
                "properties": {
                  "provider": {
                    "enum": ["digitalocean", "aws", "azure", "gcp", "oci"],
                    "type": "string"
