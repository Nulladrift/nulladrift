                  "overrides": {
                    "default": [],
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "criticality": {
                          "enum": ["critical", "optional", "startup-only"],
                          "type": "string"
                        },
                        "dependency": {
                          "maxLength": 512,
                          "minLength": 1,
                          "type": "string"
                        },
                        "service": {
                          "maxLength": 512,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["criticality", "dependency", "service"],
                      "type": "object"
                    },
                    "maxItems": 256,
                    "type": "array"
                  },
                  "startupAsRuntime": {
                    "default": false,
                    "type": "boolean"
