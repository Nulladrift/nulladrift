      "instructions": "Cloud World Model Streamable HTTP MCP server. build_revision=244248ce8be1 build_timestamp=2026-11-11T00:26:50.721Z simulation_create_schema_fingerprint=sha256:b2ecb54ad1d47b5a99a39de782ce6df8cc6a30bdd25d1316cfd48a637b97f384 anonymous_mcp_capability_version=proxy-safe-v1",
      "tools": [
        {
          "name": "scenario.get",
          "title": "Get Scenario",
          "description": "Requires scenarioId from scenario.list. Returns the complete selected graph, presets, assumptions and phase details. Next tool is simulation.create with scenarioId or the hydrated resources/connections. No API key required; demo limits apply. Read resource cwm://guides/public/scenario.get",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "scenarioId": {
                "description": "Scenario ID from scenario.list.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["scenarioId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49d2d5a5b040d974bbd1d19c8b69f14581d85e8040b3eb6c9ca48ee65722eee3"
        },
        {
          "name": "scenario.list",
          "title": "List Scenarios",
          "description": "No prerequisites. Returns scenarios cards with id/name/summary. Filters precede stable ID paging: limit default 8, maximum 20; pass nextCursor as cursor until null. detailed=true restores rich cards per page. Next tool is scenario.get, then simulation.create with scenarioId. No API key required; demo limits apply. Read resource cwm://guides/public/scenario.list",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "minLength": 1,
                "type": "string"
              },
              "cursor": {
                "maxLength": 256,
                "type": "string"
              },
              "detailed": {
                "default": false,
                "type": "boolean"
              },
              "difficulty": {
                "enum": ["beginner", "intermediate", "advanced"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "provider": {
                "enum": ["aws", "gcp", "azure", "oci", "digitalocean"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4a4852bf6da78ff160f2c57b4f47187b7c035755e326c9f83b4b2b193708cf5"
        },
        {
          "name": "simulation.create",
          "title": "Create Simulation",
          "description": "Create from scenarioId (scenario.list → scenario.get), or resources/connections for a custom graph. Returns id for simulation.step. Never blindly retry a timeout: creation may have succeeded. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.create",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appWeight": {
                "enum": ["lean", "typical", "heavy"],
                "type": "string"
              },
              "autoscaleTargetCpuPercent": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "autoscalingConfig": {
                "additionalProperties": true,
                "type": "object"
              },
              "autoscalingTargetCpu": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "connections": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "sourceId": {
                      "type": "string"
                    },
                    "targetId": {
                      "type": "string"
                    }
                  },
                  "required": ["sourceId", "targetId"],
                  "type": "object"
                },
                "type": "array"
              },
              "costAssumptions": {
                "additionalProperties": true,
                "type": "object"
              },
              "description": {
                "maxLength": 500,
                "type": "string"
              },
              "ecsCpuTargetTracking": {
                "description": "Opt into CPU-only ECS Fargate target tracking; requires an AWS Fargate compute resource. Required for scaleOutCooldownSeconds, scaleInCooldownSeconds and top-level simulationSecondsPerStep; other providers keep their existing policy.",
                "type": "boolean"
              },
              "maxInstances": {
                "minimum": 1,
                "type": "integer"
              },
              "minInstances": {
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "resilienceConfig": {
                "additionalProperties": true,
                "type": "object"
              },
              "resources": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["compute", "database", "storage", "network", "cache", "queue", "kubernetes"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "responseMode": {
                "default": "compact",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "scaleInCooldownSeconds": {
                "description": "ECS scale-in cooldown in simulated seconds; requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Defaults to cooldownSeconds.",
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              },
              "scaleOutCooldownSeconds": {
                "description": "ECS scale-out cooldown in simulated seconds; requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Defaults to cooldownSeconds.",
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              },
              "scaleOutCpuPercent": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "scaleOutCpuThreshold": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "scenarioId": {
                "description": "Scenario ID from scenario.list.",
                "minLength": 1,
                "type": "string"
              },
              "scenarioOverrides": {},
              "seed": {
                "minimum": 0,
                "type": "integer"
              },
              "simulationSecondsPerStep": {
                "description": "Requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Converts ECS cooldown seconds into step counts only (default 1); not a global simulation clock.",
                "maximum": 60,
                "type": "number"
              },
              "traffic": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d706d61382bd0a99c99c40e3c8d62dd62e2da79f4588b967fc8191b9ff242d2d"
        },
        {
          "name": "simulation.delete",
          "title": "Delete Simulation",
          "description": "The likely next tool is simulation.create to use the freed slot. Prerequisite: a simulationId from simulation.create, or an active simulation in the preserved MCP session. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.delete",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "simulationId": {
                "description": "ID returned by simulation.create.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b614cddf8029ec4917c2162397d8f30c8b6abe5788b3f321c2bacf5c7a13bd09"
        },
        {
          "name": "simulation.inject_failure",
          "title": "Inject Failure",
          "description": "Requires simulationId and resourceId from simulation.create. Injects a bounded resource failure; returns updated state. Next tool is simulation.step, then simulation.recover_resource and simulation.metrics to confirm authoritative health. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.inject_failure",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "Only with explicit type cdn_cache_loss or az_outage and CDN-capable network resourceId or resourceName. Integer 1–86400 simulation steps, not seconds; default 30. No random/node-pool selectors; omit for legacy quick failures.",
                "maximum": 86400,
                "minimum": 1,
                "type": "integer"
              },
              "nodePoolId": {
                "minLength": 1,
                "type": "string"
              },
              "nodePoolName": {
                "minLength": 1,
                "type": "string"
              },
              "resourceId": {
                "type": "string"
              },
              "resourceName": {
                "type": "string"
              },
              "simulationId": {
                "description": "ID returned by simulation.create.",
                "type": "string"
              },
              "type": {
                "description": "Only cdn_cache_loss or az_outage, with an explicit CDN-capable network resourceId or resourceName; no random/node-pool selectors. Cache loss forwards misses; az_outage blocks the edge. Omit type and duration for legacy quick failures.",
                "enum": ["cdn_cache_loss", "az_outage"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:afe458257452ec96f00092fa80bb3fb3e9dd4b72d8a17dcd3125e34deae8c54a"
        },
        {
          "name": "simulation.inject_traffic",
          "title": "Inject Traffic",
          "description": "Requires simulationId from simulation.create and target traffic RPS. Returns applied traffic settings. Next tool is simulation.step, then simulation.metrics to read observed latency; do not assume its direction. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.inject_traffic",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "deltaPercent": {
                "type": "number"
              },
              "ramp": {
                "additionalProperties": true,
                "type": "object"
              },
              "random": {
                "const": true,
                "type": "boolean"
              },
              "simulationId": {
                "description": "ID returned by simulation.create.",
                "type": "string"
              },
              "targetRps": {
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1e782c727dbca439f1dfc49aec3bb7967fff458e73823e1cc1324d50e9022e8b"
        },
        {
          "name": "simulation.metrics",
          "title": "Get Simulation Metrics",
          "description": "Requires simulationId from simulation.create (optional for current demo). Returns latest metrics or requested history; responseMode full retains evidence. Read authoritative resource health after recovery. No new identifiers. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.metrics",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "responseMode": {
                "default": "compact",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "simulationId": {
                "description": "ID returned by simulation.create.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26aa33b7842704aee4537b3322662409511e1c4afa28c86fb196c7463cd999de"
        },
        {
          "name": "simulation.recover_resource",
          "title": "Recover Failed Resource",
          "description": "Requires simulationId and resourceId from simulation.create. Requests reversible resource recovery; success does not prove healthy. Next tool is simulation.step, then simulation.metrics to inspect resource health. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.recover_resource",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "resourceId": {
                "type": "string"
              },
              "resourceName": {
                "type": "string"
              },
              "simulationId": {
                "description": "ID returned by simulation.create.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5cc96b52fcdabd9eb57099e3e3f023d72f872328a5553fedeb417b96d63dd447"
        },
        {
          "name": "simulation.step",
          "title": "Simulate Step",
          "description": "Requires simulationId from simulation.create (optional for the current demo simulation). Advances simulation; inspect completedSteps/currentStep, not HTTP success. Next tool is simulation.metrics. Preserve operationId and original inputs on retries. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.step",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "expectedCheckpoint": {
                "additionalProperties": true,
                "description": "Optional guard for new steps: omit to skip; a mismatched generation, currentStep or supplied metricId rejects the step with 409 without advancing.",
                "type": "object"
              },
              "operationId": {
                "description": "Optional retry ID: omit for a new ID; reuse with identical inputs replays the saved result, while changed inputs, expired results or another run return 409.",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "responseMode": {
                "default": "compact",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "simulationId": {
                "description": "ID returned by simulation.create.",
                "type": "string"
              },
              "steps": {
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "traffic": {
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a02ffc693f36bb88375fb3d05ad6b68bc001b8833db62d4d7e1b78e19682d8a6"
        }
