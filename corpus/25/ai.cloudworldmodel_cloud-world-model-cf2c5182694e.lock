        {
          "name": "simulation.create",
          "title": "Create Simulation",
          "description": "Create from scenarioId (scenario.list → scenario.get), or resources/connections for a custom graph. Returns id for simulation.step. Never blindly retry a timeout: creation may have succeeded. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.create GCP gcpFitPrediction: holdout-validated for one us-central1 topology at 300–500 RPS; see guide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appWeight": {
                "enum": ["lean", "typical", "heavy"],
                "type": "string"
              },
              "autoscaleTargetCpuPercent": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "autoscalingConfig": {
                "additionalProperties": true,
                "type": "object"
              },
              "autoscalingTargetCpu": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "connections": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "sourceId": {
                      "type": "string"
                    },
                    "targetId": {
                      "type": "string"
                    }
                  },
                  "required": ["sourceId", "targetId"],
                  "type": "object"
                },
                "type": "array"
              },
              "costAssumptions": {
                "additionalProperties": true,
                "type": "object"
              },
              "description": {
                "maxLength": 500,
                "type": "string"
              },
              "ecsCpuTargetTracking": {
                "description": "Opt into CPU-only ECS Fargate target tracking; requires an AWS Fargate compute resource. Required for scaleOutCooldownSeconds, scaleInCooldownSeconds and top-level simulationSecondsPerStep; other providers keep their existing policy.",
                "type": "boolean"
              },
              "maxInstances": {
                "minimum": 1,
                "type": "integer"
              },
              "minInstances": {
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "resilienceConfig": {
                "additionalProperties": true,
                "type": "object"
              },
              "resources": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["compute", "database", "storage", "network", "cache", "queue", "kubernetes"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "responseMode": {
                "default": "compact",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "scaleInCooldownSeconds": {
                "description": "ECS scale-in cooldown in simulated seconds; requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Defaults to cooldownSeconds.",
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              },
              "scaleOutCooldownSeconds": {
                "description": "ECS scale-out cooldown in simulated seconds; requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Defaults to cooldownSeconds.",
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              },
              "scaleOutCpuPercent": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "scaleOutCpuThreshold": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "scenarioId": {
                "description": "Scenario ID from scenario.list.",
                "minLength": 1,
                "type": "string"
              },
              "scenarioOverrides": {},
              "seed": {
                "minimum": 0,
                "type": "integer"
              },
              "simulationSecondsPerStep": {
                "description": "Requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Converts ECS cooldown seconds into step counts only (default 1); not a global simulation clock.",
                "maximum": 60,
                "type": "number"
              },
              "traffic": {
                "type": "number"
              }
            },
            "type": "object"
          },
