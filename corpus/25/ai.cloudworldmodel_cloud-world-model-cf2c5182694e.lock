        {
          "name": "simulation.create",
          "title": "Create Simulation",
          "description": "Use scenarioId (scenario.list → scenario.get) or resources/connections. Returns id; next tool is simulation.step. A timeout may have created a simulation; check before retrying. GET /api/prediction/generic-shapes lists fallbacks; predictionEvidence.legacyGeneric flags use. No API key required; demo limits apply. Read resource cwm://guides/public/simulation.create GCP gcpFitPrediction: holdout-validated for one us-central1 topology at 300–500 RPS; see guide.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appWeight": {
                "enum": ["lean", "typical", "heavy"],
                "type": "string"
              },
              "autoscaleTargetCpuPercent": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "autoscalingConfig": {
                "additionalProperties": false,
                "description": "Complete autoscaling policy, including min/max bounds, thresholds and cooldowns. Preserved without duplicate top-level bounds; explicit top-level bounds and CPU targets take precedence. Unknown fields are rejected. Pass scenario.get's config when copying its graph.",
                "properties": {
                  "cooldownSeconds": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "ecsCpuTargetTracking": {
                    "type": "boolean"
                  },
                  "maxInstances": {
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  },
                  "minInstances": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "scaleInCooldownSeconds": {
                    "maximum": 86400,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "scaleInCpuThreshold": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "scaleInThroughputThreshold": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "scaleOutCooldownSeconds": {
                    "maximum": 86400,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "scaleOutCpuThreshold": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "scaleOutLatencyThreshold": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "scaleOutThroughputThreshold": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "simulationSecondsPerStep": {
                    "exclusiveMinimum": 0,
                    "maximum": 60,
                    "type": "number"
                  }
                },
                "required": ["cooldownSeconds", "maxInstances", "minInstances", "scaleInCpuThreshold", "scaleInThroughputThreshold", "scaleOutCpuThreshold", "scaleOutLatencyThreshold", "scaleOutThroughputThreshold"],
                "type": "object"
              },
              "autoscalingTargetCpu": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "connections": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "sourceId": {
                      "type": "string"
                    },
                    "targetId": {
                      "type": "string"
                    }
                  },
                  "required": ["sourceId", "targetId"],
                  "type": "object"
                },
                "type": "array"
              },
              "costAssumptions": {
                "additionalProperties": true,
                "type": "object"
              },
              "description": {
                "maxLength": 500,
                "type": "string"
              },
              "ecsCpuTargetTracking": {
                "description": "Opt into CPU-only ECS Fargate target tracking; requires an AWS Fargate compute resource. Required for scaleOutCooldownSeconds, scaleInCooldownSeconds and top-level simulationSecondsPerStep; other providers keep their existing policy.",
                "type": "boolean"
              },
              "maxInstances": {
                "minimum": 1,
                "type": "integer"
              },
              "minInstances": {
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "maxLength": 120,
                "type": "string"
              },
              "resilienceConfig": {
                "additionalProperties": true,
                "type": "object"
              },
              "resources": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "characteristics": {
                      "additionalProperties": true,
                      "properties": {
                        "appDbPoolSize": {
                          "description": "Owned typical: pool size 250 on each app.",
                          "exclusiveMinimum": 0,
                          "type": "integer"
                        },
                        "capacityProvisioning": {
                          "additionalProperties": true,
                          "description": "Deterministic GCE MIG/GKE/AWS/AKS allocation. Declare seconds/step, request deadlines, pool controller/version, zone/type/purchaseOption placements, total/per-zone bounds, initial nodes, retries/startup. Optional cap-one GCE MIG retained statefulDisks with explicit reattachment time. Stockout blocks NEW allocations; exact Spot preemption uses failure.create spot_interruption parameters.spotPreemption with explicit simulated-seconds loss/notice/unavailable window. On-demand fallback only if declared; no probabilities. Full strict guide linked; metrics.capacityProvisioning retains spotBilling, preemptions and readiness.",
                          "type": "object"
                        },
                        "databaseConnectionModel": {
                          "const": "held-pools",
                          "description": "Physical database opt-in: held-pools uses current running host replicas for named/legacy pools; static binding preserves independent consumers. Explicit managedPoolId deduplicates backend pools; dedicated proxy server slots never multiply by tasks. Inspect runtimeConnections, pools and connectionLimitProvenance.",
                          "type": "string"
                        },
                        "databaseConsumers": {
                          "description": "Named logical pools, not billed resources. On the target database select held-pools to assume full pools retained by current running host replicas. Static binding preserves independent replicas. Explicit managedPoolId/mode shares backend slots once; proxy is dedicated. Full constraints and transaction client/server limits: linked tool guide. Results: metrics.databases[].runtimeConnections, pools, firstSaturation and connectionLimitProvenance; ASSUMED/MODELED, not measured sessions.",
                          "items": {
                            "additionalProperties": true,
                            "properties": {
                              "databaseId": {
                                "$ref": "#/properties/resources/items/properties/characteristics/properties/databaseConsumers/items/properties/id"
                              },
                              "id": {
                                "pattern": "^[a-zA-Z0-9][a-zA-Z0-9_.:/#-]{0,511}$",
                                "type": "string"
                              },
                              "managedPoolId": {
                                "$ref": "#/properties/resources/items/properties/characteristics/properties/databaseConsumers/items/properties/id"
                              },
                              "name": {
                                "maxLength": 128,
                                "minLength": 1,
                                "type": "string"
                              },
                              "poolSize": {
                                "exclusiveMinimum": 0,
                                "maximum": 1000000,
                                "type": "integer"
                              },
                              "replicaBinding": {
                                "enum": ["host-runtime", "static"],
                                "type": "string"
                              },
                              "replicas": {
                                "default": 1,
                                "exclusiveMinimum": 0,
                                "maximum": 1000,
                                "type": "integer"
                              }
                            },
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "gpuReadiness": {
                          "description": "EKS assumptions, not measured performance. initialReadyNodes required; warmSpareNodes adds ready reserve. autoscalerReaction/nodeProvision/imagePull/modelLoad: {seconds,provenance}. capacity: {unit:'requests-per-second'|'concurrent-calls',perNode,provenance}; concurrent-calls needs meanCallDurationSeconds. servedRequestP99Ms: {value,provenance}. provenance: user-supplied|estimated. Missing phases/capacity stay not_evaluated; omit for legacy behavior. Full constraints: linked guide.",
                          "type": "object"
                        },
                        "hetznerTraffic": {
                          "additionalProperties": true,
                          "type": "object"
                        },
                        "maxConnections": {
                          "description": "Fixed concurrent DB connection budget; Aurora Serverless defaults from maximum configured ACU.",
                          "exclusiveMinimum": 0,
                          "maximum": 1000000,
                          "type": "integer"
                        },
                        "maxThroughput": {
                          "type": "number"
                        },
                        "memoryGiB": {
                          "type": "number"
                        },
                        "nodePools": {
                          "description": "EKS GPU pools: id/name, size, nodeCount/minNodes/maxNodes; each has gpuReadiness as above.",
                          "items": {
                            "additionalProperties": true,
                            "type": "object"
                          },
                          "type": "array"
                        },
                        "preemptible": {
                          "description": "Legacy GCP preemptible purchase identity; no probabilistic interruption schedule.",
                          "type": "boolean"
                        },
                        "pricingModel": {
                          "description": "AWS/GCP/Azure require a dated official exact type/region Spot quote; missing rates are explicitly unverified, never a flat discount.",
                          "enum": ["on-demand", "spot"],
                          "type": "string"
                        },
                        "provisioningModel": {
                          "enum": ["STANDARD", "SPOT"],
                          "type": "string"
                        },
                        "size": {
                          "type": "string"
                        },
                        "spot": {
                          "type": "boolean"
                        },
                        "spotPricingUnverified": {
                          "description": "Unresolved imported mixed purchase configuration; do not substitute an on-demand rate.",
                          "type": "boolean"
                        },
                        "spotProvisioningModel": {
                          "enum": ["spot", "preemptible"],
                          "type": "string"
                        },
                        "vcpu": {
                          "type": "number"
                        }
                      },
                      "type": "object"
                    },
                    "id": {
                      "type": "string"
                    },
                    "location": {
                      "additionalProperties": true,
                      "type": "object"
                    },
                    "name": {
                      "type": "string"
                    },
                    "provider": {
                      "default": "aws",
                      "enum": ["aws", "gcp", "azure", "oci", "digitalocean", "hetzner"],
                      "type": "string"
                    },
                    "type": {
                      "enum": ["compute", "database", "storage", "network", "cache", "queue", "kubernetes"],
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "responseMode": {
                "default": "compact",
                "enum": ["compact", "full"],
                "type": "string"
              },
              "scaleInCooldownSeconds": {
                "description": "ECS scale-in cooldown in simulated seconds; requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Defaults to cooldownSeconds.",
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              },
              "scaleOutCooldownSeconds": {
                "description": "ECS scale-out cooldown in simulated seconds; requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Defaults to cooldownSeconds.",
                "maximum": 86400,
                "minimum": 0,
                "type": "integer"
              },
              "scaleOutCpuPercent": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "scaleOutCpuThreshold": {
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "scenarioId": {
                "description": "Scenario ID from scenario.list.",
                "minLength": 1,
                "type": "string"
              },
              "scenarioOverrides": {},
              "seed": {
                "minimum": 0,
                "type": "integer"
              },
              "simulationSecondsPerStep": {
                "description": "Requires ecsCpuTargetTracking: true with an AWS Fargate compute resource. Converts ECS cooldown seconds into step counts only (default 1); not a global simulation clock.",
                "maximum": 60,
                "type": "number"
              },
              "traffic": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
