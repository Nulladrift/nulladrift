{
  "lockfileVersion": 2,
  "subjects": {
    "com.simorago/esim": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://simorago.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.simorago/esim",
        "title": "SimoraGo travel eSIM plans",
        "version": "1.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "SimoraGo sells travel eSIM data plans: mobile data abroad without roaming charges. These tools read the current plan catalogue: price in USD, how much data, validity in days, the daily high-speed limit and the speed after throttling, the hotspot (tethering) rule, mobile networks, and countries a plan does not cover. Start with search_plans for a country or region; use list_destinations to see coverage. Payment happens only on simorago.com, by the traveller in a browser; no tool can buy a plan. Every result states whether checkout is open (purchasable).",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check if eSIM plans cover a country",
          "description": "Check whether a country is covered, plan by plan: for example, does the Europe eSIM cover France or Turkey? Regional plans can leave countries out, so a destination's country list is not every plan's coverage. Returns, per plan, covered yes / no / not published, with name, validity and price in USD, and a one-line summary such as \"Covered by 2 of 7 Europe plans\". Leave destination out to find every destination that includes the country (its own page first, then regional plans).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "The country to check: two-letter ISO code (FR) or its name in any site language (France, Francia, Frankreich).",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "destination": {
                "description": "Destination slug or name whose plans to check, for example europe. Leave out to check every destination.",
                "maxLength": 100,
                "type": "string"
              },
              "locale": {
                "description": "Language for plan names, destination names and page links: en, es, de, fr, pt or he. Default en.",
                "enum": ["en", "es", "de", "fr", "pt", "he"],
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if eSIM plans cover a country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4cf88c877d0c9d297938c91598b0d93d90e9945e7e444fd72e39dcabf26ae514"
        },
        {
          "name": "get_checkout_link",
          "title": "Get the checkout link for a plan",
          "description": "Get the simorago.com checkout page link for one plan, with purchasable (whether checkout is open now). Payment is made by the traveller on simorago.com in a browser; this tool does not buy anything. Use it when someone wants to buy a plan found with search_plans.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for plan names, destination names and page links: en, es, de, fr, pt or he. Default en.",
                "enum": ["en", "es", "de", "fr", "pt", "he"],
                "type": "string"
              },
              "plan_id": {
                "description": "Plan id exactly as returned by search_plans (the id field of a plan).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the checkout link for a plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb66897eaa82616c9fa15283d6ca143d4d0acec2d936c78ee9bd8abe6e9417f9"
        },
        {
          "name": "get_plan",
          "title": "Get one eSIM plan's details",
          "description": "Get the full facts for one travel eSIM plan by its id: price in USD, data, validity, daily limit and throttled speed, hotspot / tethering rule, networks, covered and not covered countries, SMS, 5G, top-up, and whether checkout is open. Use it after search_plans when someone asks about a specific plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for plan names, destination names and page links: en, es, de, fr, pt or he. Default en.",
                "enum": ["en", "es", "de", "fr", "pt", "he"],
                "type": "string"
              },
              "plan_id": {
                "description": "Plan id exactly as returned by search_plans (the id field of a plan).",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one eSIM plan's details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://simorago/plans.html",
            "ui": {
              "resourceUri": "ui://simorago/plans.html"
            }
          },
          "digest": "sha256:d4e45fba21973d73fd6a26f6d5762efbeabd1da59beac6b3ee2e3591a5eae27c"
        },
        {
          "name": "get_policies",
          "title": "eSIM install guide, refunds and phone compatibility",
          "description": "How to install and activate a travel eSIM (an emailed link to an install page with the QR code), whether a phone will work (it must be eSIM-capable and carrier-unlocked), refunds and cancellation (before the eSIM is installed, less a small fee), and payment checks. Use it for questions about installing or activating an eSIM, refunds, or phone compatibility.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for plan names, destination names and page links: en, es, de, fr, pt or he. Default en.",
                "enum": ["en", "es", "de", "fr", "pt", "he"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "eSIM install guide, refunds and phone compatibility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5e6aa50b9a1ad6086c3e1eff5a031b5635925100c2eb37336b1c54f53fc652b"
        },
        {
          "name": "list_destinations",
          "title": "List the countries with travel eSIM plans",
          "description": "List the countries and regions you can get a SimoraGo travel eSIM for right now, from the live catalogue, including the Europe and Global plans: for each, the number of plans, the lowest price in USD, the ISO codes of the countries it covers and its page link. Use it when someone asks which countries or destinations are available. For whether a given plan covers a country, use check_coverage.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language for plan names, destination names and page links: en, es, de, fr, pt or he. Default en.",
                "enum": ["en", "es", "de", "fr", "pt", "he"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the countries with travel eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6925143a955cbee81d42ed7da513bd8dde02b3a932115aaccd770458972cff3"
        },
        {
          "name": "recommend_plan",
          "title": "Recommend a travel eSIM for a trip",
          "description": "Recommend which travel eSIM to buy for a trip. Give the destination (country, region or city), any other countries on the same trip, the trip length and how the traveller uses data (light: maps and messages; normal: plus social media and browsing; heavy: video, video calls or hotspot). Estimates the data needed and returns up to 3 plans valid for the whole trip, each with a reason: best_fit (cheapest that covers the estimate), budget (cheaper, below the estimate) and roomier (more data). Each plan has its price in USD, data, daily cap, hotspot rule, networks and page link.",
          "inputSchema": {
            "properties": {
              "also_countries": {
                "description": "Other countries on the same trip, by name or ISO code; only plans covering all of them are recommended.",
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "destination": {
                "description": "Where the traveller is going: a country, region or city, by name or ISO code (Mexico, JP, Europe, Rome).",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "locale": {
                "description": "Language for plan names, destination names and page links: en, es, de, fr, pt or he. Default en.",
                "enum": ["en", "es", "de", "fr", "pt", "he"],
                "type": "string"
              },
              "trip_days": {
                "description": "Trip length in days (the whole trip for several countries).",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "usage": {
                "description": "How the traveller uses data: light (maps, messages), normal (plus social media, browsing; default) or heavy (video, video calls, hotspot).",
                "enum": ["light", "normal", "heavy"],
                "type": "string"
              }
            },
            "required": ["destination", "trip_days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a travel eSIM for a trip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7972625898b338f40807268174aba87b79972a71763a63ffbcd0d7c2f063f6b4"
        },
        {
          "name": "search_plans",
          "title": "Find and compare travel eSIM plans",
          "description": "Find the cheapest travel eSIM data plans for a trip: one country, a region, or several countries on the same trip (also_countries). Filter by trip length (trip_days), data needed (min_gb) and budget (max_price_usd); sort by price or price per GB. Each plan has its price in USD and price per GB, data (GB, or a daily high-speed allowance and the speed after it), validity in days, the hotspot / tethering rule, mobile networks, countries not covered and its simorago.com page. Use it to recommend, compare or price eSIMs for a trip, for what an unlimited plan's daily high-speed limit is and how slow it gets after it (throttled speed), or when someone asks how to get mobile data abroad without roaming charges.",
          "inputSchema": {
            "properties": {
              "also_countries": {
                "description": "Other countries on the same trip, by name or ISO code. Only plans covering all of them are returned (Paris then Rome: destination France, also_countries [\"Italy\"]).",
                "items": {
                  "maxLength": 60,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "destination": {
                "description": "Where the traveller is going: a country, region or city, by name or ISO code (Japan, JP, Italy, Europe, Tokyo). A country without plans of its own returns the regional plans that cover it.",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "limit": {
                "description": "Most plans to return per destination. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language for plan names, destination names and page links: en, es, de, fr, pt or he. Default en.",
                "enum": ["en", "es", "de", "fr", "pt", "he"],
                "type": "string"
              },
              "max_price_usd": {
                "description": "Highest total price in US dollars.",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "min_gb": {
                "description": "Least data needed, in GB. Daily-allowance plans always match.",
                "maximum": 1000,
                "minimum": 0,
                "type": "number"
              },
              "sort": {
                "description": "price (default, cheapest first) or price_per_gb (lowest price per GB of high-speed data first).",
                "enum": ["price", "price_per_gb"],
                "type": "string"
              },
              "trip_days": {
                "description": "Length of the trip in days. Returns only plans valid for at least this many days, so the plan lasts the whole trip.",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find and compare travel eSIM plans"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://simorago/plans.html",
            "ui": {
              "resourceUri": "ui://simorago/plans.html"
            }
          },
          "digest": "sha256:12dd9194a72785067dc144a401519f78e2b54e7e9e8997712bd5a48bc1e918e3"
        }
