                          "items": {
                            "anyOf": [
                              {
                                "additionalProperties": false,
                                "properties": {
                                  "hidden": {
                                    "type": "boolean"
                                  },
                                  "id": {
                                    "$ref": "#/properties/theme_config/properties/home"
                                  },
