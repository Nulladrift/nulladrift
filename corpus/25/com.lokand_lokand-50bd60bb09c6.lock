        },
        {
          "name": "update_item",
          "title": "Update item",
          "description": "Update a menu item's fields (name, description, price, availability, category, sort order). Only provided fields change. Setting is_available=false takes a dish off the public site (86 it).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
