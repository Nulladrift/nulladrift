        {
          "name": "set_theme",
          "title": "Set theme",
          "description": "Switch the site to a system theme with `theme_id` (lokand-base, lokand-one — get_site lists them; pages, sections and settings are kept). Legacy shape: `theme_key` (a style preset) plus an optional v1 `theme_config` patch (colors, fonts, hero title/subtitle) — prefer apply_style_preset / update_theme_settings for that. Revertible with revert_last_site_change.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "theme_config": {
                "additionalProperties": false,
                "description": "Legacy: merge patch such as {\"colors\":{\"primary\":\"#aa3300\"},\"fonts\":{\"heading\":\"...\"}}",
                "properties": {
                  "colors": {
                    "additionalProperties": false,
                    "properties": {
                      "accent": {
                        "$ref": "#/properties/theme_config/properties/colors/properties/primary"
                      },
                      "bg": {
                        "$ref": "#/properties/theme_config/properties/colors/properties/primary"
                      },
                      "fg": {
                        "$ref": "#/properties/theme_config/properties/colors/properties/primary"
                      },
                      "primary": {
                        "pattern": "^#[0-9a-fA-F]{6}$",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "fonts": {
                    "additionalProperties": false,
                    "properties": {
                      "body": {
                        "$ref": "#/properties/theme_config/properties/fonts/properties/heading"
                      },
                      "heading": {
                        "maxLength": 80,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9 ,_\\-]+$",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "hero": {
                    "additionalProperties": false,
                    "properties": {
                      "subtitle": {
                        "maxLength": 280,
                        "type": "string"
                      },
                      "title": {
                        "maxLength": 140,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "home": {
                    "maxLength": 40,
                    "minLength": 1,
                    "pattern": "^[a-z0-9][a-z0-9-]*$",
                    "type": "string"
                  },
                  "inheritBrand": {
                    "type": "boolean"
                  },
                  "menuStyle": {
                    "enum": ["list", "cards", "photos"],
                    "type": "string"
                  },
                  "mobileNav": {
                    "enum": ["tabs", "menu"],
                    "type": "string"
                  },
                  "nav": {
                    "additionalProperties": false,
                    "properties": {
                      "cta": {
                        "enum": ["menu", "order", "reserve", "loyalty", "about", "none"],
                        "type": "string"
                      },
                      "links": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "label": {
                              "maxLength": 30,
                              "type": "string"
                            },
                            "path": {
                              "$ref": "#/properties/theme_config/properties/navLinks/items/properties/path"
                            }
                          },
                          "required": ["label", "path"],
                          "type": "object"
                        },
                        "maxItems": 8,
                        "type": "array"
                      },
                      "style": {
                        "enum": ["tabs", "menu", "none"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "navLinks": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "label": {
                          "maxLength": 30,
                          "minLength": 1,
                          "type": "string"
                        },
                        "path": {
                          "maxLength": 60,
                          "minLength": 1,
                          "pattern": "^\\/[a-z0-9\\-/]*$",
                          "type": "string"
                        }
                      },
                      "required": ["label", "path"],
                      "type": "object"
                    },
                    "maxItems": 8,
                    "type": "array"
                  },
                  "pages": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "enabled": {
                          "type": "boolean"
                        },
                        "id": {
                          "$ref": "#/properties/theme_config/properties/home"
                        },
                        "nav": {
                          "type": "boolean"
                        },
                        "path": {
                          "pattern": "^\\/[a-z0-9][a-z0-9-]{2,39}$",
                          "type": "string"
                        },
                        "sections": {
                          "items": {
                            "anyOf": [
                              {
