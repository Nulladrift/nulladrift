        {
          "name": "theme_write_files",
          "title": "Theme write files",
          "description": "Change some files of a custom theme (Pro plan) as one new commit: files maps path → whole new text (null deletes), edits are find/replace changes. Read the current files with theme_pull first. Same validation and background compile as theme_upload. On the LIVE theme the change goes live automatically once compiled; theme_rollback undoes it. On a system theme id (lokand-base, lokand-one) it creates a new unpublished theme from it; pass publish: true to make that live too.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
