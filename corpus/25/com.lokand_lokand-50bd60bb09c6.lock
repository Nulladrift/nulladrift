                "description": "Contact info: phone, email, address, instagram",
                "properties": {
                  "address": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "instagram": {
                    "pattern": "^@?[A-Za-z0-9._]{1,30}$",
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "currency_code": {
                "description": "ISO currency for menu prices, e.g. \"USD\"",
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "customer_email": {
                "description": "Customer's email: binds the claim to it and sends them the claim link",
                "format": "email",
                "type": "string"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "hours": {
                "additionalProperties": false,
                "description": "Opening hours keyed mon..sun, each {\"open\":\"10:30\",\"close\":\"22:00\"} or {\"closed\":true}",
                "properties": {
                  "fri": {
                    "$ref": "#/properties/hours/properties/mon"
                  },
                  "mon": {
                    "additionalProperties": false,
                    "properties": {
                      "close": {
