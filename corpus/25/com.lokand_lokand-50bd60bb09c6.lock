            "properties": {
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "edits": {
                "description": "Find/replace changes inside existing files. Prefer this over whole files: send only the lines that change",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "find": {
                      "description": "Exact text that occurs once in the file",
                      "maxLength": 20000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "path": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "replace": {
                      "maxLength": 60000,
                      "type": "string"
                    }
                  },
                  "required": ["find", "path", "replace"],
                  "type": "object"
                },
                "maxItems": 40,
                "type": "array"
              },
              "files": {
                "additionalProperties": {
                  "type": ["string", "null"]
                },
                "description": "path → whole new file text, or null to delete the file",
                "type": "object"
              },
              "message": {
                "description": "Commit message describing the change",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "publish": {
                "description": "Go live once compiled (always the case when editing the live theme)",
                "type": "boolean"
              },
              "theme_id": {
                "description": "A theme id from theme_list (or a system theme id: lokand-base, lokand-one)",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["business_id", "theme_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
