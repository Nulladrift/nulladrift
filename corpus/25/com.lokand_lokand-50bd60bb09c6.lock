        {
          "name": "check_compliance",
          "title": "Check compliance",
          "description": "Check a business's published menu against what a country's menu rules ask for — allergen and calorie declarations, price-list notices, banned surcharges, operator identity. Returns each requirement with its official sources, plus which ones the menu currently falls short of and the item ids involved. ADVISORY ONLY: it reports, it never changes the site, and it is not legal advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "ISO country to check against. Defaults to the business's own country_code; pass one explicitly to check against a market the business is considering.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check compliance"
