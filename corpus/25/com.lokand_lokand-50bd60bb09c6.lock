        {
          "name": "update_business",
          "title": "Update business",
          "description": "Update a business's profile: name, description, about text, opening hours, contact info, currency, default locale, menu display options, country, business details, or place (location, address, timezone, category, cuisines). Only provided fields change.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "about": {
                "anyOf": [
                  {
                    "maxLength": 10000,
                    "type": "string"
