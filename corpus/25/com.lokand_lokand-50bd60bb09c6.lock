        {
          "name": "apply_country_settings",
          "title": "Apply country settings",
          "description": "Fill the business's menu display options with the values a country's rules suggest — a notice about tax-inclusive pricing, the price-effective date, ordering restrictions. These are DEFAULTS: the owner can change any of them afterwards, and nothing here is enforced.",
