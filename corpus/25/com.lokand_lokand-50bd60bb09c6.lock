        {
          "name": "add_block",
          "title": "Add block",
          "description": "Add a block (a repeatable piece inside a section: a link, a photo, a testimonial, …) of a `type` the section accepts (get_site.theme.sections[type].blocks). Nest it in another block with parent_block_id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "page_id": {
                "description": "Page id, e.g. home, menu, about, loyalty",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "parent_block_id": {
                "description": "Nest inside this block instead of the section",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "position": {
                "description": "0-based position",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "preset": {
                "description": "Start from one of the block type's presets",
                "maxLength": 80,
                "type": "string"
              },
              "section_id": {
                "description": "Section id from get_site",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "settings": {
                "additionalProperties": {},
                "description": "Settings as a JSON merge patch (null removes a key). get_site lists each type's settings.",
                "type": "object"
              },
              "type": {
                "description": "Block type the section accepts (see get_site)",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["business_id", "page_id", "section_id", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add block"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["business:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d8b66603a06eabcc84f47bc67b9eade5bcf0944c029573ffe1ec847afc7882ce"
        },
        {
          "name": "add_category",
          "title": "Add category",
          "description": "Add a category (section) to a menu. Returns the new category_id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Optional caller-chosen id (8-64 chars). Reuse the same id when retrying so a retry can never create a duplicate.",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "menu_id": {
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Category name, e.g. \"Starters\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "sort_order": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["menu_id", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add category"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["menu:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:f85f143473ec1b401143b490fc23393de977e90a9de097d011292c0254760461"
        },
        {
          "name": "add_item",
          "title": "Add item",
          "description": "Add a dish/item to a menu (optionally inside a category). Returns the new item_id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category_id": {
                "minLength": 1,
                "type": "string"
              },
              "description": {
                "maxLength": 2000,
                "type": "string"
              },
              "dietary_info": {
                "additionalProperties": false,
                "description": "Allergen and dietary labels shown to diners. `allergens` uses the 14 standard codes (gluten, crustaceans, eggs, fish, peanuts, soybeans, milk, nuts, celery, mustard, sesame, sulphites, lupin, molluscs); `contains` flags alcohol, pork or tobacco; `suitableFor` carries positive claims (vegetarian, vegan, halal, ...); `caloriesKcal` and `portionGrams` are per portion. Optional `declaredAt` (epoch-ms) records that a dish was reviewed, which sharpens check_compliance — a dish with no allergens and no declaredAt is indistinguishable from one nobody has looked at yet.",
                "properties": {
                  "allergens": {
                    "items": {
                      "enum": ["gluten", "crustaceans", "eggs", "fish", "peanuts", "soybeans", "milk", "nuts", "celery", "mustard", "sesame", "sulphites", "lupin", "molluscs"],
                      "type": "string"
                    },
                    "maxItems": 14,
                    "type": "array"
                  },
                  "caloriesKcal": {
                    "maximum": 20000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "contains": {
                    "items": {
                      "enum": ["alcohol", "pork", "tobacco"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "declaredAt": {
                    "exclusiveMinimum": 0,
                    "type": "integer"
                  },
                  "portionGrams": {
                    "maximum": 100000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "suitableFor": {
                    "items": {
                      "enum": ["vegetarian", "vegan", "halal", "kosher", "gluten_free", "dairy_free", "nut_free", "spicy", "organic"],
                      "type": "string"
                    },
                    "maxItems": 9,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "id": {
                "description": "Optional caller-chosen id (8-64 chars). Reuse the same id when retrying so a retry can never create a duplicate.",
                "pattern": "^[A-Za-z0-9_-]{8,64}$",
                "type": "string"
              },
              "is_available": {
                "default": true,
                "type": "boolean"
              },
              "menu_id": {
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "description": "Item name, e.g. \"Cacio e pepe\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "price": {
                "description": "Price in the business's currency. Required unless `variations` is given, in which case it is derived from the cheapest variation.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "number"
              },
              "sort_order": {
                "minimum": 0,
                "type": "integer"
              },
              "variations": {
                "description": "Variations of this dish — sizes, volumes, portions, cuts — each with its own ABSOLUTE price (not a surcharge): e.g. [{name:'Small',price:3},{name:'Large',price:4.5}]. Use this instead of creating one item per variation. The item's own `price` becomes the 'from' price (the cheapest variation) automatically, so you may omit `price` when you pass variations. Names must be unique.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "is_available": {
                      "type": "boolean"
                    },
                    "name": {
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "price": {
                      "$ref": "#/properties/price"
                    }
                  },
                  "required": ["name", "price"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["menu_id", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add item"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["menu:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:86e921570e31cc671d6c31ade8c505503f1bc4ae128453913c2d5f3247e32ccb"
        },
