            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["menu:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8e200b40381d580b3ba30d9b2e0e10d0b90e5c629f47b077715041a18c6bc7e9"
