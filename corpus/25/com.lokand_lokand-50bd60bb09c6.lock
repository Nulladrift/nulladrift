                            "additionalProperties": false,
                            "properties": {
                              "description": {
                                "maxLength": 500,
                                "type": "string"
                              },
                              "dietary_info": {
                                "additionalProperties": false,
                                "description": "Allergen/dietary declaration for this dish — see add_item",
                                "properties": {
                                  "allergens": {
                                    "items": {
                                      "enum": ["gluten", "crustaceans", "eggs", "fish", "peanuts", "soybeans", "milk", "nuts", "celery", "mustard", "sesame", "sulphites", "lupin", "molluscs"],
                                      "type": "string"
