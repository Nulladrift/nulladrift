          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["menu:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c01950843ea429c710cd91fa12433cb48ea27f31f181cd72fa15a0a280826a4e"
        },
