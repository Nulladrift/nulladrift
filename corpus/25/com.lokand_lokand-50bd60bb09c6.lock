        {
          "name": "create_checkout_link",
          "title": "Create checkout link",
          "description": "Create a Stripe Checkout link to upgrade a business to a paid plan. Hand the returned URL to the customer — anyone who opens it can pay; the plan activates automatically after payment (3-month free trial). Pass customer_country (ISO 3166-1 alpha-2) so first-time pricing is quoted in the customer's region, not the agent's.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "customer_country": {
                "description": "Customer's ISO country code, e.g. DE",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "product_key": {
                "description": "The plan to purchase (Pro is monthly-only)",
                "enum": ["pro.monthly"],
                "type": "string"
