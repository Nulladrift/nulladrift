        {
          "name": "update_business",
          "title": "Update business",
          "description": "Update a business's profile: name, description, about text, opening hours, contact info, currency, default locale, the locales visitors can switch between, menu display options, country, business details, or place (location, address, timezone, category, cuisines). Only provided fields change.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "about": {
                "anyOf": [
                  {
                    "maxLength": 10000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "contact_info": {
                "additionalProperties": false,
                "description": "Contact info: phone, email, address, instagram",
                "properties": {
                  "address": {
                    "maxLength": 300,
                    "type": "string"
                  },
                  "email": {
                    "format": "email",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "instagram": {
                    "pattern": "^@?[A-Za-z0-9._]{1,30}$",
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "country_code": {
                "description": "ISO 3166-1 alpha-2 country the business operates in. ADVISORY: it seeds suggested menu options (apply_country_settings) and drives check_compliance. It never changes what the site renders.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency_code": {
                "maxLength": 3,
                "minLength": 3,
                "type": "string"
              },
              "default_locale": {
                "enum": ["en", "tr", "es", "fr", "de", "it", "pt", "nl", "pl", "ja", "zh", "ar"],
                "type": "string"
              },
              "description": {
                "anyOf": [
                  {
                    "maxLength": 2000,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "hours": {
                "additionalProperties": false,
                "description": "Opening hours keyed mon..sun, each {\"open\":\"10:30\",\"close\":\"22:00\"} or {\"closed\":true}",
                "properties": {
                  "fri": {
                    "$ref": "#/properties/hours/properties/mon"
                  },
                  "mon": {
                    "additionalProperties": false,
                    "properties": {
                      "close": {
                        "$ref": "#/properties/hours/properties/mon/properties/open"
                      },
                      "closed": {
                        "type": "boolean"
                      },
                      "open": {
                        "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "sat": {
                    "$ref": "#/properties/hours/properties/mon"
                  },
                  "sun": {
                    "$ref": "#/properties/hours/properties/mon"
                  },
                  "thu": {
                    "$ref": "#/properties/hours/properties/mon"
                  },
                  "tue": {
                    "$ref": "#/properties/hours/properties/mon"
                  },
                  "wed": {
                    "$ref": "#/properties/hours/properties/mon"
                  }
                },
                "type": "object"
              },
              "legal_info": {
                "additionalProperties": false,
                "description": "Business details published on the site when filled in: tradeName, taxNumber, registrationNumber, registeredAddress, contactEmail, contactPhone, plus `extra` label/value pairs for anything a jurisdiction names differently (a Vergi Dairesi, a US EIN). All optional.",
                "properties": {
                  "contactEmail": {
                    "format": "email",
                    "maxLength": 254,
                    "type": "string"
                  },
                  "contactPhone": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "extra": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "label": {
                          "maxLength": 60,
                          "minLength": 1,
                          "type": "string"
                        },
                        "value": {
                          "maxLength": 200,
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["label", "value"],
                      "type": "object"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "registeredAddress": {
                    "maxLength": 400,
                    "type": "string"
                  },
                  "registrationNumber": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "taxNumber": {
                    "maxLength": 60,
                    "type": "string"
                  },
                  "tradeName": {
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "maps_url": {
                "description": "A Google Maps, Apple Maps, Yandex or OpenStreetMap link (short share links work), or a \"lat, lng\" pair. Sets the coordinates.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "menu_options": {
                "additionalProperties": false,
                "description": "How the published menu presents itself: `menuNotice` (free text shown above the menu, in the owner's own words), `showPriceEffectiveDate`, and `orderingExcludedTags` (tags that can be listed but not ordered online, e.g. alcohol). This is the ONLY thing that changes what the site renders.",
                "properties": {
                  "menuNotice": {
                    "maxLength": 600,
                    "type": "string"
                  },
                  "orderingExcludedTags": {
                    "items": {
                      "enum": ["alcohol", "pork", "tobacco"],
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  "showPriceEffectiveDate": {
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "name": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "place": {
                "additionalProperties": false,
                "description": "Where the business is and what kind of place it is: lat/lng; address {streetAddress, addressLocality (district), addressRegion (city or province), postalCode, addressCountry (ISO 3166-1 alpha-2)}; timezone (IANA, e.g. \"Europe/Istanbul\"); category (e.g. restaurant, cafe, bakery, bar, meyhane, fast_food, dessert_shop); up to 6 cuisines (e.g. turkish, kebab, seafood, sushi, vegan). Merged into what is stored: keys you pass replace, keys you leave out stay.",
                "properties": {
                  "address": {
                    "additionalProperties": false,
                    "properties": {
                      "addressCountry": {
                        "pattern": "^[A-Z]{2}$",
                        "type": "string"
                      },
                      "addressLocality": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "addressRegion": {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      "postalCode": {
                        "maxLength": 20,
                        "minLength": 1,
                        "type": "string"
                      },
                      "streetAddress": {
                        "maxLength": 200,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "category": {
                    "pattern": "^[a-z][a-z0-9_]{1,39}$",
                    "type": "string"
                  },
                  "cuisines": {
                    "items": {
                      "$ref": "#/properties/place/properties/category"
                    },
                    "maxItems": 6,
                    "type": "array"
                  },
                  "lat": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "lng": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "timezone": {
                    "maxLength": 64,
                    "pattern": "^[A-Za-z][A-Za-z0-9_+-]*(?:\\/[A-Za-z0-9_+-]+){0,2}$",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "supported_locales": {
                "description": "Locales visitors can switch between, e.g. [\"pl\",\"en\"]; the default locale is always included",
                "items": {
                  "$ref": "#/properties/default_locale"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Update business"
          },
          "behavior": {
            "destructive": true,
