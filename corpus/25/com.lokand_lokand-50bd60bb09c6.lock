        {
          "name": "add_section",
          "title": "Add section",
          "description": "Add a section of a given `type` (keys of get_site.theme.sections) to a page, optionally from one of its presets, with a settings patch and a 0-based position (default: the end). Sections hold blocks; add them with add_block. An outside image url in an image setting is copied into the business's media library and the setting stores our copy; if it can't be downloaded the call fails with image_fetch_failed and nothing changes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "kind": {
                "$ref": "#/properties/type",
                "description": "Alias of type"
              },
              "page_id": {
                "description": "Page id, e.g. home, menu, about, loyalty",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "position": {
                "description": "0-based position",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "preset": {
                "description": "Start from one of the type's presets",
                "maxLength": 80,
                "type": "string"
              },
              "settings": {
                "additionalProperties": {},
                "description": "Settings as a JSON merge patch (null removes a key). get_site lists each type's settings.",
                "type": "object"
              },
              "type": {
                "description": "Section type from get_site",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
