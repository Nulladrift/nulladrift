        {
          "name": "apply_country_settings",
          "title": "Apply country settings",
          "description": "Fill the business's menu display options with the values a country's rules suggest — a notice about tax-inclusive pricing, the price-effective date, ordering restrictions. These are DEFAULTS: the owner can change any of them afterwards, and nothing here is enforced.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Defaults to the business's own country_code.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "locale": {
                "description": "Language for any suggested copy. Defaults to the business's.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "overwrite": {
                "default": false,
                "description": "false (default) fills only options the owner hasn't set; true replaces their existing values.",
                "type": "boolean"
              }
            },
            "required": ["business_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply country settings"
