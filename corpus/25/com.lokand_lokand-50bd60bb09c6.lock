                "type": "object"
              },
              "message": {
                "description": "Commit message",
                "maxLength": 200,
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "role": {
                "default": "development",
                "description": "development = your private work-in-progress theme (one per user, replaced on each upload); unpublished = a saved theme ready to publish",
                "enum": ["development", "unpublished"],
                "type": "string"
