                        "type": "array"
                      },
                      "caloriesKcal": {
                        "maximum": 20000,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "contains": {
                        "items": {
                          "enum": ["alcohol", "pork", "tobacco"],
                          "type": "string"
                        },
                        "maxItems": 3,
                        "type": "array"
                      },
                      "declaredAt": {
                        "exclusiveMinimum": 0,
                        "type": "integer"
