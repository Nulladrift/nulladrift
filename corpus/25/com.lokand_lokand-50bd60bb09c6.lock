        {
          "name": "export_qr_codes",
          "title": "Export qr codes",
          "description": "Render the business's QR codes as a printable file and return a download URL. Every code is a short link (lknd.to/<code>) the owner can re-point without reprinting. purpose: menu (one code to the menu site, repeated `copies` times), table_ordering (ONE CODE PER TABLE, each with its table name printed under it — needs tables, see create_tables) or link (its short links). format: home_pdf (sheets with cut guides on any paper: a4, a3, a5, letter, or custom with paper_width_mm and paper_height_mm; layout large=1, medium=4, small=12 per page, or size_mm for an exact code width with as many per page as fit), press_pdf (print shop: one code per page at size_mm wide, 3 mm bleed, trim box and crop marks, all vector) or svg_zip (one vector SVG per code, for a designer). Uses the saved design (get_qr_design) unless `design` overrides it for this file only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "bleed_mm": {
                "description": "press_pdf: default 3",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "copies": {
                "description": "menu/link: copies of each code; default fills one sheet",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "cut_lines": {
                "description": "home_pdf: dashed cut guides around each code; default true",
                "type": "boolean"
              },
              "design": {
                "additionalProperties": false,
                "properties": {
                  "accent": {
                    "description": "Frame color: caption text, card fill",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "bg": {
                    "description": "Background behind the code",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "cta": {
                    "anyOf": [
                      {
                        "maxLength": 40,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Optional text above the code, e.g. \"Scan to order\". null = none (only the name is printed)"
                  },
                  "eye_style": {
                    "description": "Corner markers: square, rounded or circle",
                    "enum": ["square", "rounded", "circle"],
                    "type": "string"
                  },
                  "fg": {
                    "description": "Code color (dark modules)",
                    "pattern": "^#[0-9a-fA-F]{6}$",
                    "type": "string"
                  },
                  "frame": {
                    "description": "none (code + label only), caption (call-to-action text above the code) or card (filled color card around the code)",
                    "enum": ["none", "caption", "card"],
                    "type": "string"
                  },
                  "logo": {
                    "description": "Put the business logo in the middle",
                    "type": "boolean"
                  },
                  "module_style": {
                    "description": "square (classic), rounded (soft, joined) or dots",
                    "enum": ["square", "rounded", "dots"],
                    "type": "string"
                  },
                  "show_label": {
                    "description": "Print the table's name under each per-table code (default true). Only turn off for stickers fixed to their table: on a stand that can move, an unnamed code sends orders to the wrong table",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "format": {
                "description": "Default home_pdf",
                "enum": ["home_pdf", "press_pdf", "svg_zip"],
                "type": "string"
              },
              "layout": {
                "description": "home_pdf: default medium; ignored when size_mm is set",
                "enum": ["large", "medium", "small"],
                "type": "string"
              },
              "paper": {
                "description": "home_pdf: default a4",
                "enum": ["a4", "a3", "a5", "letter", "custom"],
                "type": "string"
              },
              "paper_height_mm": {
                "description": "home_pdf, paper custom",
                "maximum": 1000,
                "minimum": 50,
                "type": "number"
              },
              "paper_width_mm": {
                "description": "home_pdf, paper custom",
                "maximum": 1000,
                "minimum": 50,
                "type": "number"
              },
              "print_link": {
                "description": "Also return print_link: a short link to forward to a print shop, opening a download page with the press PDF + SVGs and their specs (expires in 60 days). Default true for press_pdf and svg_zip",
                "type": "boolean"
              },
              "purpose": {
                "enum": ["menu", "table_ordering", "link"],
                "type": "string"
              },
              "shortlink_ids": {
                "description": "link: which short links (default all); menu: the short link to encode",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 200,
                "type": "array"
              },
              "size_mm": {
                "description": "Printed code width in mm. press_pdf/svg_zip: default 90. home_pdf: exact width instead of a layout",
                "maximum": 300,
                "minimum": 20,
                "type": "number"
              },
              "table_ids": {
                "description": "table_ordering: which tables; default all active ones",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 500,
                "type": "array"
              }
            },
            "required": ["business_id", "purpose"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Export qr codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["menu:read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0ac41f433203d876dc03ab6fdcb2bbec11c0622c363a7261259f785f5b74fd5d"
