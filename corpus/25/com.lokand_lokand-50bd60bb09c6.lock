              "country": {
                "description": "Defaults to the business's own country_code.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "locale": {
                "description": "Language for any suggested copy. Defaults to the business's.",
                "maxLength": 10,
                "minLength": 2,
                "type": "string"
              },
              "overwrite": {
                "default": false,
                "description": "false (default) fills only options the owner hasn't set; true replaces their existing values.",
