        {
          "name": "create_business",
          "title": "Create business",
          "description": "Create a new restaurant owned by the signed-in user (no claim step) — ONE call can produce a complete LIVE website when you pass `menu` (and optionally hours/theme). Returns the business_id for follow-up ops and the live site_url. To create a restaurant for someone else, use create_restaurant and hand them the claim link instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
