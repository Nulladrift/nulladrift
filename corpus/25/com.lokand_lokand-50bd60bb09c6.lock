        {
          "name": "add_block",
          "title": "Add block",
          "description": "Add a block (a repeatable piece inside a section: a link, a photo, a testimonial, …) of a `type` the section accepts (get_site.theme.sections[type].blocks). Nest it in another block with parent_block_id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "business_id": {
                "minLength": 1,
                "type": "string"
              },
              "page_id": {
                "description": "Page id, e.g. home, menu, about, loyalty",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "parent_block_id": {
                "description": "Nest inside this block instead of the section",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "position": {
                "description": "0-based position",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "preset": {
                "description": "Start from one of the block type's presets",
                "maxLength": 80,
                "type": "string"
              },
              "section_id": {
                "description": "Section id from get_site",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "settings": {
                "additionalProperties": {},
                "description": "Settings as a JSON merge patch (null removes a key). get_site lists each type's settings.",
                "type": "object"
              },
              "type": {
                "description": "Block type the section accepts (see get_site)",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
