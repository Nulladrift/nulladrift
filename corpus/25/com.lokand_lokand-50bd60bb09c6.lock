                    "type": "null"
                  }
                ],
                "description": "Replaces the item's whole variation list. Variations keep their identity by name, so re-sending the list to change one price is safe. Pass null to drop variations entirely — send `price` alongside it, otherwise the item keeps its old 'from' price."
