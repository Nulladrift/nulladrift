          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["business:write"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0d3e70ba43da39a3ea57c54720c2aff00aaa71f7f029cae51cd7c189fa3c51ed"
