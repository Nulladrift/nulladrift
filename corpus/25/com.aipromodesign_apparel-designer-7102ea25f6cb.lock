      },
      "instructions": "AI Promo Design (aipromodesign.com) makes print-ready designs for t-shirts, hoodies, mugs, totes and caps, and prints and ships them in the US. Workflow: design_item (artwork brief + item + color) -> the customer sees the preview -> revise_design for changes -> quote_order for prices -> open_in_studio for the link where they finish and order. The preview each design result returns is the picture of the design, exactly as it will be printed, and the designer link opens that same design. It is the only picture of this design; any other image shows an item that is not this design. Where the chat shows the design card, the card is the answer, and a reply of one or two plain sentences completes it. Describe only the artwork in a brief; the item and color are separate fields. Visitors get 10 free designs, a signed-in aipromodesign.com account 25 a day; pass the `visitor` value from the last answer back in. To change or order a design from earlier, pass its design_id; if that result is no longer in the conversation, leave design_id out to use the customer's most recent design. Never promise a delivery date; the designer shows dates at checkout. Designing is free and nothing is charged in chat.",
      "tools": [
        {
          "name": "design_item",
          "title": "Design artwork for an item",
          "description": "Make a print-ready design from a short description, for one item in one color. Returns a watermarked preview of the design on the item, a design_id for revise_design and open_in_studio, and how many free designs are left. Describe the ARTWORK only (\"a snarling wolf head, two colors\"), not the garment: the garment is chosen with `item` and `color`. Each call makes one design and spends one from the allowance (10 as a visitor, then 25 a day on an aipromodesign.com account). Pass back the `visitor` value from the previous answer so the allowance follows the customer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "What the artwork shows, in the customer's words. The artwork alone - no shirt, no mug.",
                "type": "string"
              },
              "color": {
                "description": "The item's color by name (Navy, Black, White, Forest Green, Sport Gray, Red, Royal, Maroon...). Defaults to White.",
                "type": "string"
              },
              "item": {
                "description": "Item key or the word a customer would use (tee, hoodie, mug, tote, cap, polo, long sleeve, crewneck, performance tee, women's tee, youth hoodie, notebook, tumbler). Use list_items for the full set. Defaults to the adult tee.",
                "type": "string"
              },
              "surface": {
                "description": "Which print area: front (default), back, left_sleeve, right_sleeve. The design is sized for it.",
                "type": "string"
              },
              "visitor": {
                "description": "The visitor value from an earlier answer in this conversation, if there was one.",
                "type": "string"
              }
            },
            "required": ["brief"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Design artwork for an item"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://aipromodesign/design-card-28b98d6c.html",
            "openai/toolInvocation/invoked": "Design ready",
            "openai/toolInvocation/invoking": "Designing",
            "ui": {
              "resourceUri": "ui://aipromodesign/design-card-28b98d6c.html"
            },
            "ui/resourceUri": "ui://aipromodesign/design-card-28b98d6c.html"
          },
          "digest": "sha256:594af97685b71f553d3a20df2c36ba8bfd9cc98f203da63ca28468678e9e8e23"
        },
        {
          "name": "list_items",
          "title": "What can be printed",
          "description": "The items a design can go on: key, name, the blank it is printed on, price per piece, colors, sizes, and the print areas with their sizes in inches. Call this before quoting or when the customer asks what is available. Prices are per piece in US dollars; the first print area is in the price and each further area adds a per-piece charge shown here. Designing is free; nothing is charged until the customer orders on aipromodesign.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What can be printed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3979cac01e2599e71bd0ffb7830049ad024aef4bf1067a996519de0912e45ea"
        },
        {
          "name": "open_in_studio",
          "title": "Continue on aipromodesign.com",
          "description": "A link that opens the aipromodesign.com designer with the design already on the item in that color and, when sizes are given, the order lines filled in. The customer finishes there: more edits with the designer's own tools, other print areas, names and numbers, sizes collected from a group, and checkout. Use it when the customer is ready to order or wants to keep working. Nothing is charged by opening it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "color": {
                      "description": "Defaults to the color the design was made for.",
                      "type": "string"
                    },
                    "design_id": {
                      "description": "The design_id from that design's earlier result. If that result is no longer in the conversation, leave this out to use the customer's most recent design.",
                      "type": "string"
                    },
                    "item": {
                      "description": "Item key or the word a customer would use (tee, hoodie, mug, tote, cap, polo, long sleeve, crewneck, performance tee, women's tee, youth hoodie, notebook, tumbler). Use list_items for the full set. Defaults to the item the design was made for.",
                      "type": "string"
                    },
                    "sizes": {
                      "additionalProperties": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "description": "Count per size, when the customer has said. Leave out to open the designer without an order line.",
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "visitor": {
                "description": "The visitor value from an earlier answer, if there was one.",
                "type": "string"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Continue on aipromodesign.com"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7c3147358798b8a2cb94fd7200b4da0ff2782d583ca56b5d853b13e84247b73c"
        },
        {
          "name": "quote_order",
          "title": "Price an order",
          "description": "What an order would cost: per piece by size, the pieces, any volume discount, shipping, and the total before sales tax (tax is added at checkout where it applies). Nothing is charged. Use the sizes the customer named; a line is one item in one color with a count per size.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lines": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "color": {
                      "description": "The item's color by name.",
                      "type": "string"
                    },
                    "design_id": {
                      "description": "The design_id this line prints, when one has been made. Omit on a price with no design yet.",
                      "type": "string"
                    },
                    "item": {
                      "description": "Item key or the word a customer would use (tee, hoodie, mug, tote, cap, polo, long sleeve, crewneck, performance tee, women's tee, youth hoodie, notebook, tumbler). Use list_items for the full set.",
                      "type": "string"
                    },
                    "sizes": {
                      "additionalProperties": {
                        "minimum": 0,
                        "type": "integer"
                      },
                      "description": "Count per size, e.g. {\"S\": 2, \"M\": 5, \"L\": 3}. Every item has a size list in list_items, mugs included (11oz, 15oz).",
                      "type": "object"
                    },
                    "surfaces": {
                      "description": "How many print areas carry a design: 1 for a design on one area, 2 for a front and a back. Defaults to 1.",
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["item", "sizes"],
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "annotations": {
