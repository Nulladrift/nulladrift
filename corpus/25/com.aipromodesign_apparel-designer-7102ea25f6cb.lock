        },
        {
          "name": "revise_design",
          "title": "Change a design",
          "description": "Redo an existing design with a change: a different color scheme, fewer details, bolder lines, a different pose, words added or removed. Works from the design, so the result stays recognizably the same piece. Spends one from the allowance like design_item. Returns a new design_id; the old one still exists.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "design_id": {
                "description": "The design_id from that design's earlier result. If that result is no longer in the conversation, leave this out to use the customer's most recent design.",
                "type": "string"
              },
              "instruction": {
                "description": "What to change, in a sentence.",
                "type": "string"
              },
              "visitor": {
                "description": "The visitor value from an earlier answer, if there was one.",
                "type": "string"
              }
            },
            "required": ["instruction"],
            "type": "object"
          },
