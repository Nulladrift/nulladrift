      "serverInfo": {
        "name": "com.clawhard/doorman",
        "title": "Doorman",
        "version": "1.2.0",
        "description": "Doorman reads any website's robots.txt and shows which AI bots it lets in: who can train on it, which AI search engines can find and cite it, and which assistants can read it for people. Pick what you want and copy a fixed robots.txt, including the new shared AI-training opt-out line. No account.",
        "websiteUrl": "https://doorman.clawhard.com",
        "icons": [
          {
            "src": "https://clawhard.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Doorman: Doorman reads any website's robots.txt and shows which AI bots it lets in: who can train on it, which AI search engines can find and cite it, and which assistants can read it for people. Pick what you want and copy a fixed robots.txt, including the new shared AI-training opt-out line. No account. Use it when you want to know which AI bots a website lets in (training, AI search, assistants) and fix its robots.txt. Tools: doorman_check_ai_bot_access (See which AI bots a website lets in). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "doorman_check_ai_bot_access",
          "title": "See which AI bots a website lets in",
          "description": "Use when the user asks whether their site (or any public site), or a robots.txt they pasted, blocks ChatGPT, Claude, Google AI, Perplexity or other AI crawlers, whether AI can read or train on their content, or why AI search does not mention their site. Fetches the live robots.txt and reports, for 22 named AI bots in four groups (AI training, AI search, assistants, search engines), which are let in, kept out or partly blocked, plus the site's content-signal preference and fixes. Example: {\"url\": \"example.com\"} or {\"robots_txt\": \"User-agent: GPTBot\\nDisallow: /\"}. Pass robots_txt instead of url to check a draft or pasted file without fetching anything. Read-only.",
          "inputSchema": {
            "properties": {
              "robots_txt": {
                "description": "robots.txt text to check instead of fetching a site (a draft or a pasted file, up to 512 KB). Empty means no robots.txt.",
                "minLength": 0,
                "type": "string"
              },
              "url": {
                "description": "Website address or domain, e.g. nytimes.com. Send this or robots_txt.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "See which AI bots a website lets in"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
