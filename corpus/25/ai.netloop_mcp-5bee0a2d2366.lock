        {
          "name": "acronym_lookup",
          "description": "Expand a network acronym/abbreviation from the vendor documentation\n(e.g. 'BGP' -> 'Border Gateway Protocol'), together with the source document\nwhen available.\n\nDeterministic dictionary lookup — no device, no connect token, not a fuzzy\nsearch. **Pass `platform` whenever the device or platform is known** (vendor\nkey or alias, e.g. 'aoscx', 'aos', 'ios', 'junos', 'Aruba CX'): some acronyms\nare defined differently per vendor, and without `platform` such a term is\nreturned as a per-vendor disambiguation instead of a single answer.",
          "inputSchema": {
            "properties": {
              "acronym": {
                "title": "Acronym",
                "type": "string"
              },
              "platform": {
                "default": "",
                "title": "Platform",
                "type": "string"
              }
            },
            "required": ["acronym"],
            "title": "acronym_lookupArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
