        {
          "name": "netloop_commands",
          "description": "Look up the documented CLI commands for a platform (deterministic index).\n\nThis is a command map built from the vendor skill docs (no LLM, no SSH).\nUse it to find the right command for a platform, or to validate a command\nbefore running it. `mode=\"lookup\"` returns candidate commands (with the\ndoc section and source page); `mode=\"validate\"` checks one command and\nreturns valid/unknown + the closest documented command.\n\nParameters:\n- platform: platform ID or alias (e.g. 'aos', 'aoscx', 'Aruba CX', 'ios').\n- query: natural-language intent (lookup) or the command to validate (validate).\n- mode: 'lookup' (default) or 'validate'.\n- limit: max candidates (default 10, max 50).\n- model: optional model ID (e.g. '2530', '6200') to use that model's index;\n  default = the vendor's default model (the vendor-level platform ID).\n\nA command that is NOT in the index is NOT necessarily invalid — it may be\nundocumented. Say so explicitly instead of presenting it as verified.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "mode": {
                "default": "lookup",
                "title": "Mode",
                "type": "string"
              },
              "model": {
                "default": "",
                "title": "Model",
                "type": "string"
              },
              "platform": {
                "title": "Platform",
                "type": "string"
              },
              "query": {
                "default": "",
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["platform"],
            "title": "netloop_commandsArguments",
            "type": "object"
          },
          "outputSchema": {
