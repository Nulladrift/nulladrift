        {
          "name": "netloop_path",
          "description": "Show the network path from a device up to the Internet as ASCII + JSON.\n\nUse this for \"show me the path / topology / uplink chain of <device>\"\nquestions; do not use netloop_ask for that.\n\nNEVER draw, sketch or reconstruct a network diagram yourself — the diagram\nshown to the user must be the output of THIS tool, verbatim. Do not build a\ntopology from raw CLI output (show lldp/cdp neighbors, etherchannel,\nspanning-tree, route/ARP tables) and do not re-label or redraw this tool's\noutput. If the device cannot be reached or this tool returns an error, say so\n— never substitute a self-made diagram.\n\nIMPORTANT: when you show the diagram to the user, wrap it in a ```text\nfenced code block (plain, no highlighting) — **never** ```python (or any\nother language tag) — and keep the ASCII exactly as returned. Show the JSON,\nif you include it, in a ```json block so it stays highlighted.\n\n`host` is the source device (management IP/hostname). **Leave `to` empty for\nthe path up to the Internet** (uplink chain → firewall/router → cloud):\n`netloop_path(host=<device>)`. Never pass a public IP (e.g. `8.8.8.8`) as\n`to` — that is not a device on the network. Set `to=<ip|mac>` ONLY to ask\n**where a LOCAL end device hangs**: the destination is then shown as a port\nannotation (`<port> -> <mac> (<ip>)`), not as its own box, and only the\ninvolved devices are shown (no Internet hop).\n`discovery` is `auto` (L2/LLDP first, then routing), `l2`, or `l3`.\n\n`format` is chosen by the caller when omitted: a **human** via LibreChat gets\nthe **full ASCII diagram** - **no JSON by default**; an **agent / naked MCP /\nA2A** caller gets the **short form plus the JSON** contract. JSON is delivered\nonly when it is **explicitly requested**: `format=full` (big diagram),\n`compact` (short tree), `json`, `both` (full + JSON) or `compact_json`\n(short + JSON). Do not paste a JSON blob into a human chat on your own\ninitiative; when you do include it (explicit request, or an agent caller),\nput it in a ```json block so it stays highlighted.\n\nThe JSON contract is **`netloop.path/v2`** and is **graph-only**: read\n`graph.nodes` (every device once, stable `id`) / `graph.links` (every edge\nonce, `kind` explained by `graph.kinds`) / `graph.path` (the followed chain\nas node-id list). A device's extra uplink is `kind: \"redundant_uplink\"` and\nleads back into the path via `kind: \"rejoin\"` - not an error. `speed_mbps`\nis numeric; `as_of` is the snapshot time.\n\n`include_downlinks` (default **on**) adds the downlink summary line under\neach device (the network neighbours that are NOT the followed uplink), e.g.\n`↓ 2 Downlinks: acc-02, acc-03`; pass `include_downlinks=false` to disable.\n`include_redundant_uplinks`\n(default on; `false` turns it off) discovers the **additional uplinks** of a\ndevice - multiple uplinks render as extra devices side by side\n(`redundant_uplink`) that rejoin the path further up (`rejoin`). The legacy\nname `include_fan` is still accepted as a deprecated alias.\n\n**Caching:** the topology is cached **in memory for ~10 minutes**, keyed on\n(device + `to` + the include flags), so a repeat call is fast and returns the\n**same** snapshot without re-crawling the device. Pass `refresh=true` for a\nfresh crawl (e.g. after a change on the device). The JSON contract reports it\nas `cache` (`{\"cached\": bool, \"age_s\": int|null, \"ttl_s\": int}`).",
          "inputSchema": {
            "properties": {
              "connect_token": {
                "default": "",
                "title": "Connect Token",
                "type": "string"
              },
              "discovery": {
                "default": "auto",
                "title": "Discovery",
                "type": "string"
              },
              "format": {
                "default": "",
                "title": "Format",
                "type": "string"
              },
              "host": {
                "title": "Host",
                "type": "string"
              },
              "include_downlinks": {
                "default": true,
                "title": "Include Downlinks",
                "type": "boolean"
              },
              "include_fan": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Include Fan"
              },
              "include_redundant_uplinks": {
                "default": true,
                "title": "Include Redundant Uplinks",
                "type": "boolean"
              },
              "max_hops": {
                "default": 12,
                "title": "Max Hops",
                "type": "integer"
              },
              "refresh": {
                "default": false,
                "title": "Refresh",
                "type": "boolean"
              },
              "to": {
                "default": "",
                "title": "To",
                "type": "string"
              }
            },
            "required": ["host"],
            "title": "netloop_pathArguments",
            "type": "object"
