          "digest": "sha256:54000e657d2ca5f6e6b15948f6a391cfc78530b717c0c306fb67cddcc6592e60"
        },
        {
          "name": "identify_platform",
          "description": "Identify the platform/vendor of a network device by probing `show version`.\nREQUIRES a reachable device: pass its management IP or hostname in `host`.\nNEVER pass a vendor name, model or free text (e.g. 'aruba instant aps') as\n`host`, and do NOT use this tool for documentation-only questions.\nFor a \"how do I configure X on <vendor>\" question that is not about a\nspecific reachable device, call skill_lookup(query=..., platform=<alias>)\ndirectly instead.\nReturns the platform id (ios, nxos, junos, comware, aos, aoscx, iap, aos8,\nfortios) or 'unknown'.\nSet `include_version=True` to also append the raw `show version` output as\nclearly-labelled EVIDENCE (platform + version in one call). Default off.\nUses the vendor manifests (skills/platform/*/_manifest.json) — first regex match wins.\nTo target a specific connector instead of the default one, pass its\nCONNECT or SUPPORT token as `connect_token` (never inside `host`).\nIdentity/tenant comes from the X-Auth-Token header — not a tool argument.",
          "inputSchema": {
            "properties": {
              "connect_token": {
                "default": "",
                "title": "Connect Token",
                "type": "string"
              },
              "host": {
                "title": "Host",
                "type": "string"
              },
              "include_version": {
                "default": false,
                "title": "Include Version",
                "type": "boolean"
              }
            },
            "required": ["host"],
            "title": "identify_platformArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "identify_platformOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cd82fc682427766a8191a5a70df49a83f014e5d3ab98efbfdffb859d204ca33"
        },
        {
          "name": "netloop_ask",
          "description": "Ask a question about a network device (switch, router, AP, firewall) in natural language.\nUses skills + show version. It DETERMINES the device's platform itself (via\n`show version`) and scopes the skill lookup to it — prefer this over\n`skill_lookup` with a guessed platform for any question that names a concrete\ndevice (IP/hostname/CIDR). Best quality, but slower.\nPass the device IP as `host` parameter if known. If omitted, the IP will\nbe extracted from `text` automatically.\nTo target a specific connector instead of the default one, pass its CONNECT\nor SUPPORT token as `connect_token`; alternatively prefix the text with\n'^TOKEN <token>'. Identity/tenant comes from the X-Auth-Token header.\nSet `include_raw=True` to also append the raw CLI output of the executed\ncommand as clearly-labelled EVIDENCE (capped 64 KB head+tail) — useful to\ncite/verify the answer. Default off.\nSet `include_docs=False` to omit the signed `> Source:` documentation links\n(they expire after ~1 h) — useful for agents that only want the answer.",
          "inputSchema": {
            "properties": {
              "connect_token": {
                "default": "",
                "title": "Connect Token",
                "type": "string"
              },
              "host": {
                "default": "",
                "title": "Host",
                "type": "string"
              },
              "include_docs": {
                "default": true,
                "title": "Include Docs",
                "type": "boolean"
              },
              "include_raw": {
                "default": false,
                "title": "Include Raw",
                "type": "boolean"
              },
              "text": {
                "title": "Text",
                "type": "string"
