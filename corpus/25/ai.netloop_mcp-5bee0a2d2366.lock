        {
          "name": "netloop_confirm_change",
          "description": "Approve or reject a pending configuration change plan (Human-in-the-Loop).\nA write operation detected in netloop_ask/netloop_fetch returns a\n```netloop-hitl``` block whose `plan_id` is the value to pass here. Call with\napprove=true to confirm and execute, or approve=false to reject. Set\nsave=true to persist the change in the same step when the plan offers an\nopt-in save (otherwise the configuration is only in the running config; some\ndevices persist automatically). Only the caller who created the plan (same\nidentity) may approve or reject it; the plan expires after 5 minutes. The\nresult also carries a machine-readable ```json block (per-command status,\ndiff excerpt, `saved`).\n\n**Device Y/N question:** if the device asks for a confirmation mid-execution\nthe result carries a ```netloop-hitl-confirm``` block; answer it with\n`confirm=\"yes\"` or `confirm=\"no\"` (the `approve` flag is then ignored).",
          "inputSchema": {
            "properties": {
              "approve": {
                "default": true,
                "title": "Approve",
                "type": "boolean"
              },
              "confirm": {
                "default": "",
                "title": "Confirm",
                "type": "string"
              },
              "plan_id": {
                "title": "Plan Id",
                "type": "string"
              },
              "save": {
                "default": false,
                "title": "Save",
                "type": "boolean"
              }
            },
            "required": ["plan_id"],
            "title": "netloop_confirm_changeArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "netloop_confirm_changeOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f43eb8ae62b1d78fa89f272fb816d25cf71f4a4c34e933def62f081738c6458"
        },
        {
          "name": "netloop_drill",
          "description": "Explore CLI command syntax on a device by recursively querying help.\n\nWhen a command fails (e.g. 'show spanning-tree' returns '% Invalid input'),\nthis tool systematically strips the last token and appends the platform's\nhelp suffix ('?' or 'help') to discover valid options.\n\nHOW THE LLM SHOULD USE THIS:\n1. Try a command via netloop_ask or netloop_fetch first\n2. If the command returns an error/rejection, call netloop_drill(host, command)\n3. Read the help output, pick the right sub-command, and try again\n4. You may also cross-reference with netloop_commands or skill_lookup\n\nParameters:\n- host: management IP or hostname of the device\n- command: the command that failed (e.g. 'show spanning-tree')\n- connect_token: optional connect/support token\n- max_calls: maximum ssh queries per call (default 10, min 1, max 50)\n- mode: 'privileged' (default, exec mode) or 'config' (configuration mode)\n- format: 'raw' for raw help output only (default, deterministic),\n          'structured' to include parsed options and cross-references\n",
          "inputSchema": {
            "properties": {
              "command": {
                "title": "Command",
                "type": "string"
              },
              "connect_token": {
                "default": "",
                "title": "Connect Token",
                "type": "string"
              },
              "format": {
                "default": "raw",
                "title": "Format",
                "type": "string"
              },
              "host": {
                "title": "Host",
                "type": "string"
              },
              "max_calls": {
                "default": 10,
                "title": "Max Calls",
                "type": "integer"
              },
              "mode": {
                "default": "privileged",
                "title": "Mode",
                "type": "string"
              }
            },
            "required": ["command", "host"],
            "title": "netloop_drillArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
