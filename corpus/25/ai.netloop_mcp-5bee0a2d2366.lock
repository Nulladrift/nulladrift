        {
          "name": "netloop_recover_change",
          "description": "Recover after the device REJECTED a configuration command (HITL).\nWhen a config command is rejected, the result ends with a recovery `[CHOICE]`\nblock (`RECOVER_<plan_id>` / `NORECOVER_<plan_id>`). Call this with that\n`plan_id` to run the recovery: the connector drills the device (live CLI\nhelp) and proposes a corrected command as a NEW plan — returned as a normal\n```netloop-hitl``` approval block (nothing is sent until you approve it).\n`cancel=true` aborts instead. Only the plan owner may recover it.",
