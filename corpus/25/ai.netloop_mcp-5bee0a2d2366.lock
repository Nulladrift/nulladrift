        {
          "name": "netloop_support_grant",
          "description": "Grant a support token to a worker for remote access to specified targets.\nThe caller must belong to a customer tenant (the demo tenant cannot grant).\nMFA policy follows the caller's token (`mfa_enabled: false` allows automation\nand agents; `mfa_enabled: true` requires a LibreChat session with 2FA).\nThe worker shows a TUI popup for manual approval (unless auto-grant is enabled).\nParameters:\n- targets: list of IPs or CIDR ranges the support person can access\n- duration_hours: how long the token is valid (default 1)\n- reason: optional description why support is needed\n- worker_id: optional specific worker connect_token (empty = any worker)\n- needs_credentials: if True, the grant popup also shows username/password fields (default False)",
          "inputSchema": {
            "properties": {
              "duration_hours": {
                "default": 1,
                "title": "Duration Hours",
