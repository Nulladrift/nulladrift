        {
          "name": "skill_lookup",
          "description": "Search the netloop skill DB (skills/platform/<vendor>/<model> + _index.json) for networking knowledge.\nReturns the most relevant sections from skill file(s).\nSearches multiple related files when the best match is small or a sibling\nfile covers additional query terms (e.g. general IGMP theory + MLD snooping\nfor an \"igmp snooping\" query).\nCall this when you need vendor- or topic-specific networking knowledge:\nplatform basics, CLI commands, best practices, troubleshooting steps.\nUse multiple calls for drill-down (first get platform overview,\nthen specific commands). Parameters:\n- query: what you need (e.g. 'STP root priority', 'save config', 'VLAN trunk').\n  ALWAYS write the query in ENGLISH (translate the user's question) — the\n  skill index is English-only, so non-English queries retrieve far worse.\n  To verify a specific command, call skill_lookup again with the exact\n  command (e.g. query='show clients') — command queries match precisely.\n  Spell out acronyms (e.g. 'intelligent power monitoring', not just 'ipm').\n- platform: OPTIONAL filter. If the user's question already names the\n  vendor/platform, you may OMIT it — it is auto-detected from `query`.\n  IMPORTANT: if the question names a CONCRETE DEVICE (IP address, hostname\n  or CIDR object), do NOT guess the platform — determine it from the device\n  first (`identify_platform(host=<IP>)`, or use `netloop_ask` which does it\n  for you), then pass the detected value. NEVER default to a vendor (e.g.\n  Cisco/IOS). If no device and no vendor is named, ask the user which\n  platform they mean.\n  If you pass it, use one of these aliases or internal IDs:\n        'ArubaOS-Switch'  /  'ArubaOS-S'  /  'AOS-S'  /  'AOS-Switch'  /  'AOS'  /  'Aruba 2930'  /  'Aruba 2530'  /  'ProVision'  /  'HP ProVision'  →  aos (default model 2930)\n        'ArubaOS 8'  /  'Aruba 8.x'  /  'Aruba Wireless'  →  aos8 (default model generic)\n        'Aruba CX'  /  'AOS-CX'  /  'ArubaOS-CX'  →  aoscx (default model 6200)\n        'H3C Comware'  /  'Comware'  /  'HP Comware'  →  comware\n        'FortiOS'  /  'FortiGate'  /  'Fortinet'  →  fortios (default model generic)\n        'Aruba Instant'  /  'Instant OS'  /  'InstantOS'  /  'Aruba IAP'  /  'Instant AP'  /  'ArubaOS 10'  /  'AOS-10'  →  iap (default model generic)\n        'Cisco IOS'  /  'IOS XE'  /  'Cisco IOS-XE'  /  'Cisco IOS Software'  →  ios\n        'Juniper JunOS'  /  'Junos'  /  'JUNOS'  →  junos\n        'Cisco NX-OS'  /  'NX-OS'  /  'Cisco Nexus'  →  nxos\n  A vendor-only value (e.g. 'aoscx') returns the platform's generic skills\n  (cross-model guides like transceiver/VSX) plus its default model;\n  a model-specific value (e.g. 'aoscx-6200') returns generic plus that model.\n- topic: optional subtopic filter (vlan, stp, interface, routing, troubleshooting)",
          "inputSchema": {
            "properties": {
              "platform": {
                "default": "",
                "title": "Platform",
                "type": "string"
              },
              "query": {
                "title": "Query",
                "type": "string"
              },
              "topic": {
                "default": "",
                "title": "Topic",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "skill_lookupArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "skill_lookupOutput",
            "type": "object"
          },
