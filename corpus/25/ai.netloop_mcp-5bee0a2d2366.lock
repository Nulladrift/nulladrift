        {
          "name": "netloop_vuln",
          "description": "Network vulnerability check: is this device affected by known advisories?\n\nReads the device's platform + firmware version with the existing probe\n(`show version` / `display version` / `get system status`) and matches it\nagainst the **ENISA EUVD** (European Union Vulnerability Database) — one\nadvisory source for Cisco, Aruba (switches + wireless), Juniper, Fortinet\n(+ a long tail). Result is a **deterministic verdict**:\n`affected` | `not_affected` | `unknown`, with per-advisory CVE id, severity\n(CVSS), CISA-KEV flag and the advisory link.\n\nUse this for \"is <device> affected by known CVEs / vulnerabilities?\",\n\"are there security advisories for this firmware?\", \"is the firmware\npatched?\".\n\n**Informational only, currently in a test phase** — it is NOT a scan, NOT a\npenetration test, NOT a compliance/audit or patch certificate, and it never\nsays a device is safe: \"no matching advisories\" is explicitly **not** proof\nof absence (the source can be incomplete for a platform, and the verdict is\nthen `unknown` on purpose). Third-party advisories are cited by link, not\nmirrored.\n\n**Output (caller-aware default):** a human in the chat (email identity) gets\nthe **human-readable markdown table** (the chat renders it as a real table);\nan **agent** (token identity) gets the **JSON contract** `netloop.vuln/v1`\n(with CVSS vector, KEV flag and EPSS per finding). The table has fixed CVSS\nbands critical/high/medium/low/unknown with a traffic-light emoji and one row\nper CVE linked to the advisory: `CVE | CVSS | Exploitability | Description`\n— the severity is the band heading, `Exploitability` explains the attack\nvector + KEV flag in plain words and the description is a short complete\nsentence (there is no recommendation column: EUVD states no fix release).\nPlus the source + terms links, an assessment sentence for this device and the\nguardrail block.\nUse the table **as returned** — do not re-sort, re-group or trim it, keep the\nemoji and the CVE links, and always carry the source + retrieval date into\nyour answer. Never state that a device is **safe**: \"no matching advisories\"\nis explicitly **not** proof of absence.\n\n**Volume:** the table shows the **top 20 findings by CVSS** by default; its\nfooter states how many were not shown. If the user may want the rest, offer\nit as a choice — the front end renders `[CHOICE]{\"q\":\"…\",\"options\":[…]}` as\nclickable options, e.g.\n`[CHOICE]{\"q\":\"9 findings, 20 shown — show the full list?\",\"options\":[\"Show all\",\"Top 20 is enough\"]}`.\nWhen the full list is wanted, call this tool again with `all_findings=true`.\n\n**JSON is compact by default** (agents): top 20 findings by CVSS, one short\ncomplete `description` sentence, and no redundant `advisory_groups` — the\nfull contract can be 100–240 KB, which exceeds the 64 KB A2A result cap and\nwould arrive truncated. `verbose=true` returns the **full** contract (every\nfinding + long source prose + `recommendation` + `advisory_groups`); combine\nit with `all_findings=true` for everything.\n\n`format`: `table` (human default), `ascii` (plain text, for terminals),\n`json` (compact `netloop.vuln/v1` contract — the agent default), `both`\n(table + JSON). When you show the ASCII to the user, wrap it in a ```text\nblock (never ```json). `refresh=true` bypasses the local EUVD TTL cache\n(~15 min).\n",
          "inputSchema": {
            "properties": {
              "all_findings": {
                "default": false,
                "title": "All Findings",
                "type": "boolean"
              },
              "connect_token": {
                "default": "",
                "title": "Connect Token",
                "type": "string"
              },
              "format": {
                "default": "",
                "title": "Format",
                "type": "string"
              },
              "host": {
                "title": "Host",
                "type": "string"
              },
              "refresh": {
                "default": false,
                "title": "Refresh",
                "type": "boolean"
              },
              "verbose": {
                "default": false,
                "title": "Verbose",
                "type": "boolean"
              }
            },
            "required": ["host"],
            "title": "netloop_vulnArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "netloop_vulnOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
