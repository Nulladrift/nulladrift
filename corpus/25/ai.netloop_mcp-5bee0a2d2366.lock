            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:138b9bebba35ceb22bb99df5d7edf80eb708635cc996166861e8f6f3313e7f40"
        },
