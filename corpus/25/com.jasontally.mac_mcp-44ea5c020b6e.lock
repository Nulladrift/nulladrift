{
  "lockfileVersion": 2,
  "subjects": {
    "com.jasontally.mac/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mac.jasontally.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "mac-address-lookup",
        "title": "MAC Address Lookup",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public, read-only MAC address and OUI lookup derived from the IEEE Registration Authority registries. Call lookup once per address. The record page at the returned url carries the organization address, the block range, and ownership history. See https://mac.jasontally.com/help for block types and how to read your own MAC address.",
      "tools": [
        {
          "name": "lookup",
          "title": "Look up a MAC address or OUI prefix",
          "description": "Resolve a MAC address or OUI prefix to its registered organization using longest-prefix match across the MA-L, MA-M, MA-S, IAB, and CID registries. Reports the block type, address count, registration country, and a link to the full record page. Randomized and locally administered addresses usually have no registered organization.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mac": {
                "description": "MAC address or OUI prefix, 6 to 12 hex characters. Accepts colon, hyphen, Cisco dot, or plain hex, for example 8C:1F:64:AF:A4:B2 or 8C1F64.",
                "type": "string"
              }
            },
            "required": ["mac"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "addressCount": {
                "description": "Addresses in the matched block.",
                "type": ["number", "null"]
              },
              "blockType": {
                "description": "MA-L, MA-M, MA-S, IAB, or CID.",
                "type": ["string", "null"]
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 registration country.",
                "type": ["string", "null"]
              },
              "locallyAdministered": {
                "description": "The bit pattern marks the address locally administered, which usually means a randomized or virtual-machine address.",
                "type": "boolean"
              },
              "multicast": {
                "description": "The bit pattern marks the address a multicast group.",
                "type": "boolean"
              },
              "orgName": {
                "description": "Registered organization name.",
                "type": ["string", "null"]
              },
              "prefix": {
                "description": "Longest registered prefix that matched.",
                "type": ["string", "null"]
              },
              "query": {
                "description": "The normalized query, colon-separated.",
                "type": "string"
              },
              "url": {
                "description": "Record page on https://mac.jasontally.com.",
                "type": "string"
              }
            },
            "required": ["prefix", "query", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:847f082b6f93a41df9975507708ac9fb7e3b0a00a9e37a40419e727fd65bb9ed"
        }
      ],
      "digest": "sha256:7224ccf1dbe6169f2dc4438348b58ea6303eb4888824fbe6509d1846aa2d08ae"
    }
  }
}
