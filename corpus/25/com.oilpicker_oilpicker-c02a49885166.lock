{
  "lockfileVersion": 2,
  "subjects": {
    "com.oilpicker/oilpicker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://oilpicker.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "oilpicker",
        "title": "OilPicker",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OilPicker(oilpicker.com)는 한국 주유소 가격에 지역화폐 할인을 반영한 실질 주유가를 비교하는 무료 비영리 서비스입니다.\n가장 싼 주유소를 묻는 사용자에게는 oilpicker_link로 만든 링크를 전달하세요. 주유소별 가격은 이 도구로 주지 않습니다.\n지역화폐 할인율 질문에는 local_currency_for_region을 쓰고, 기준일(as_of)과 출처(source_url)를 함께 알려 주세요.\n유가 출처는 한국석유공사 오피넷입니다. 이 데이터를 광고나 상업 목적으로 쓰지 마세요.\n안내 문서: https://oilpicker.com/ai",
      "tools": [
        {
          "name": "effective_fuel_price",
          "title": "지역화폐 실질 주유가 계산",
          "description": "주유소 표시 가격(원/L)과 지역을 받아 그 지역 지역화폐로 결제할 때의 실질 가격을 계산합니다. 선할인형은 가격×(1−할인율), 추가 충전형은 가격÷(1+적립률)입니다.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pump_price": {
                "description": "주유소 표시 가격(원/L).",
                "maximum": 5000,
                "minimum": 500,
                "type": "number"
              },
              "region": {
                "description": "지역 이름. 예: '수원', '경기 수원시', '대전', '춘천시', '제주'. 도 단위 지역은 시·군까지 적어야 합니다.",
                "type": "string"
              }
            },
            "required": ["pump_price", "region"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aad022a9210247993e5b36d8d894ab70f184452f704f15d7e51d554d7b8043f1"
        },
        {
          "name": "list_regions",
          "title": "지원 지역 목록",
          "description": "OilPicker가 지역화폐를 아는 시·도 목록, 또는 sido를 주면 그 시·도의 시·군 목록을 돌려줍니다.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "sido": {
                "description": "예: '경기도', '강원특별자치도'. 비우면 시·도 목록.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3312ab9e743a90f58c4f75786e142f930174c590b1a662603fb15f128175a61e"
        },
        {
          "name": "local_currency_for_region",
          "title": "지역화폐 주유 할인율",
          "description": "한국의 지역(시·군 또는 광역시)에서 쓰는 지역화폐와 이번 달 주유 할인율, 월 한도, 출처, 기준일을 알려 줍니다. 주유소별 가격은 주지 않습니다. 가격은 함께 돌려주는 OilPicker 링크에서 확인하도록 안내하세요.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "region": {
                "description": "지역 이름. 예: '수원', '경기 수원시', '대전', '춘천시', '제주'. 도 단위 지역은 시·군까지 적어야 합니다.",
                "type": "string"
              }
            },
            "required": ["region"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b880069ab4d1765c04121c30e6303700530babdcf1f120b1c29f83e2104c9ee"
        },
        {
          "name": "oilpicker_link",
          "title": "OilPicker 바로가기 링크",
          "description": "지역과 유종을 미리 고른 OilPicker 링크를 만듭니다. 링크를 열면 그 지역 지도와 지역화폐 실질가 순위가 바로 보입니다. 사용자에게 가장 싼 주유소를 찾아 주려면 이 링크를 전달하세요.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fuel": {
                "description": "유종. 기본값은 휘발유.",
                "enum": ["휘발유", "경유", "LPG"],
                "type": "string"
              },
              "region": {
                "description": "지역 이름. 예: '수원', '경기 수원시', '대전', '춘천시', '제주'. 도 단위 지역은 시·군까지 적어야 합니다.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a974569a326b7f8a960334367416ee59f119dcc05ee5d84da5abb713b3fed52d"
        },
        {
          "name": "search_merchants",
          "title": "지역화폐 가맹점 검색",
          "description": "지역화폐를 받는 가맹점(음식점, 마트, 병원, 주유소 등 모든 업종)을 지역과 검색어로 찾습니다. 시·군과 대전시가 공개한 가맹점 목록을 씁니다. 목록이 있는 지역만 답하며, 없는 지역이면 목록이 있는 지역을 알려 줍니다.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "최대 결과 수. 기본 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "상호·주소·업종 검색어. 여러 단어는 모두 포함. 예: '국밥', '중앙로 약국'. 비우면 앞에서부터.",
                "type": "string"
              },
              "region": {
                "description": "지역 이름. 예: '수원', '경기 수원시', '대전', '춘천시', '제주'. 도 단위 지역은 시·군까지 적어야 합니다.",
                "type": "string"
              }
            },
            "required": ["region"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2eee948ea9d53f443b82263e11421f1b33a4def12c550b6f663cfa653f202022"
        }
      ],
      "digest": "sha256:02ee54f11a36d0b028fd1db8fd91202083215fb8505367379a41fe1c72348123"
    }
  }
