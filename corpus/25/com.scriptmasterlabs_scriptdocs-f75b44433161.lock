          "digest": "sha256:7684a0f65bb57fedfd381dff20b371890ed50026facad792c654c955b50942d1"
        },
        {
          "name": "docs_search_docs",
          "title": "Search Package Docs",
          "description": "Search for keywords inside a package's real README/docs and return verbatim matching snippets with surrounding context.\n\nThis does keyword matching over the actual fetched document (registry README for npm, long description for PyPI, README-derived text for Cargo) — it does not summarize or paraphrase, and it does not answer from general knowledge. If no matches are found, it says so rather than guessing at an answer.\n\nArgs:\n  - ecosystem ('npm' | 'pypi' | 'cargo')\n  - package_name (string): exact package name\n  - query (string): keyword(s) to search for, e.g. \"rate limit\" or \"async client\"\n  - max_snippets (number, 1-20, default 5): cap on returned matches\n  - version (string, optional): specific version to search; defaults to latest\n\nReturns JSON with: snippets (array of {match, context, line_hint}), source_url, fetched_at.\n\nError Handling:\n  - Returns \"Error: ...\" if the package/docs can't be fetched\n  - Returns an empty snippets array (not an error) if the docs were fetched successfully but the query has no matches",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "Which package registry to query: 'npm', 'pypi', or 'cargo'.",
                "enum": ["npm", "pypi", "cargo"],
                "type": "string"
              },
              "max_snippets": {
                "default": 5,
                "description": "Maximum number of matching snippets to return.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "package_name": {
                "description": "Exact package name as published on the registry.",
                "maxLength": 214,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "Keyword(s) to search for inside the package's real documentation, e.g. 'authentication middleware'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "Specific version to search within. Defaults to the latest published version if omitted.",
                "type": "string"
              }
            },
            "required": ["ecosystem", "package_name", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
