        {
          "name": "docs_resolve_library",
          "title": "Resolve Library Name",
          "description": "Turn a fuzzy or partial name into real, ranked candidate package names, using the registry's own live search index — not a guess at what the package is probably called.\n\nFor npm this queries registry.npmjs.org's actual search API (the same one npmjs.com uses). For Cargo this queries crates.io's real search endpoint. For PyPI: there is currently no official PyPI search API (XML-RPC search was permanently disabled in 2022 and never replaced) — calling this with ecosystem 'pypi' returns an explicit message saying so rather than a fabricated or scraped result, along with a suggestion to use the exact package name with docs_get_package_info instead.\n\nArgs:\n  - ecosystem ('npm' | 'pypi' | 'cargo')\n  - query (string): the name or description to resolve, e.g. \"react\" or \"async http client\"\n  - max_results (number, 1-10, default 5)\n\nReturns JSON with: candidates (array of {name, version, description, score, url}), source_url, fetched_at.\n\nError Handling:\n  - ecosystem 'pypi' always returns an explanatory message, not an error and not fabricated results\n  - Returns \"Error: ...\" only for actual npm/crates.io request failures",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "Which registry to search: 'npm', 'pypi', or 'cargo'. Note: PyPI has no official search API (see limitation below).",
                "enum": ["npm", "pypi", "cargo"],
                "type": "string"
              },
              "max_results": {
                "default": 5,
                "description": "Maximum number of candidates to return.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Natural-language or partial name to resolve, e.g. 'react', 'http client for python', 'serde'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ecosystem", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
