        {
          "name": "docs_get_package_info",
          "title": "Get Package Info",
          "description": "Fetch real, current metadata for a package directly from the npm registry, PyPI JSON API, or crates.io.\n\nThis tool makes a live HTTP request to the actual registry (registry.npmjs.org, pypi.org, or crates.io) at call time. It never returns cached, guessed, or simulated data — if the package doesn't exist, it returns an explicit error rather than a plausible-looking fabrication.\n\nArgs:\n  - ecosystem ('npm' | 'pypi' | 'cargo'): which registry to query\n  - package_name (string): exact package name, e.g. \"zod\", \"fastapi\", or \"serde\"\n\nReturns JSON with: name, latest_version, description, homepage, repository, source_url (the exact registry URL the data came from, for verification), fetched_at (ISO timestamp).\n\nError Handling:\n  - Returns \"Error: package not found\" if the registry has no such package\n  - Returns \"Error: registry request failed\" on network/HTTP errors",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "Which package registry to query: 'npm', 'pypi', or 'cargo' (Rust/crates.io).",
                "enum": ["npm", "pypi", "cargo"],
                "type": "string"
              },
              "package_name": {
                "description": "Exact package name as published on the registry, e.g. 'express', 'requests', or 'serde'.",
                "maxLength": 214,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["ecosystem", "package_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
