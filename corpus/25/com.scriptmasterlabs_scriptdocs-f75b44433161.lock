        {
          "name": "docs_check_vulnerabilities",
          "title": "Check Package Vulnerabilities",
          "description": "Check a real, specific package version against OSV.dev (Google-run, aggregates GitHub/PyPA/npm/RustSec advisories) — and, when a fix exists, automatically fetch that fixed version's README in the same call, so the result is \"here's what's wrong\" AND \"here's exactly what upgrading looks like,\" not just a CVE list you have to research further yourself.\n\nThis is a live query against OSV.dev's public API for the exact package+version given. It never estimates or guesses risk — if OSV has no advisories on record for that version, this correctly reports zero vulnerabilities rather than implying danger that isn't documented. Note: this tool is more limited than dedicated vulnerability-intelligence tools (e.g. VulnCheck, Snyk) — it reports what OSV.dev has on file, not exploit activity or threat intelligence.\n\nArgs:\n  - ecosystem ('npm' | 'pypi' | 'cargo')\n  - package_name (string): exact package name\n  - version (string, optional): specific version to check; defaults to the latest published version\n  - include_fix_docs (boolean, default true): also fetch the README for the version that fixes the found vulnerabilities\n\nReturns JSON with: vulnerability_count, vulnerabilities (array of {id, summary, severity, aliases, fixed_in, references}), recommended_fix (null, or {version, readme, truncated, source_url} for the version that resolves the found issues), source_url, fetched_at.\n\nError Handling:\n  - Returns \"Error: ...\" if the package doesn't exist or OSV.dev can't be reached\n  - vulnerability_count: 0 with an empty array is a normal, valid result — not an error\n  - If fetching the fix's README fails, recommended_fix is null rather than the whole call failing — the vulnerability data itself is never withheld because of it [PAID: $0.009 per call via x402 - send a PAYMENT-SIGNATURE header on the /mcp request; unpaid calls return an HTTP 402 x402 challenge with five accepts at the same $0.009 price: Base USDC (9000 atomic), Solana USDC (9000 atomic), XRPL XRP (drops at the live XRP/USD rate), Arc USDC (9000 atomic), or Xahau XAH (drops at the live XAH/USD rate). The other ScriptDocs tools are free.]",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ecosystem": {
                "description": "Which package registry the version belongs to: 'npm', 'pypi', or 'cargo'.",
                "enum": ["npm", "pypi", "cargo"],
                "type": "string"
              },
              "include_fix_docs": {
                "default": true,
                "description": "When a vulnerability is found with a known fixed version, also fetch that version's README so the response includes what upgrading actually looks like. Set false to skip the extra fetch.",
                "type": "boolean"
              },
              "package_name": {
                "description": "Exact package name as published on the registry.",
                "maxLength": 214,
                "minLength": 1,
                "type": "string"
              },
              "version": {
                "description": "Specific version to check. Defaults to the current latest published version if omitted.",
                "type": "string"
              }
            },
            "required": ["ecosystem", "package_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
