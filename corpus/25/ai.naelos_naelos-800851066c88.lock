        },
        {
          "name": "natal_chart",
          "title": "Birth chart",
          "description": "A complete natal (birth) chart: every planet's sign, degree and house, the Ascendant and Midheaven, retrogrades, and the aspects between planets with exact orbs. Calculated from NASA JPL data by Naelos Ephemeris.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Birth date, YYYY-MM-DD",
                "pattern": "^[+-]?\\d{4,5}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "house_system": {
                "description": "House system (default placidus)",
                "enum": ["placidus", "whole_sign", "koch", "equal", "campanus", "regiomontanus", "porphyry", "meridian", "morinus"],
                "type": "string"
              },
              "latitude": {
                "description": "Birthplace latitude in decimal degrees (north positive)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Birthplace longitude in decimal degrees (east positive)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "Birthplace name, echoed back so the user can check the coordinates",
                "maxLength": 120,
                "type": "string"
              },
              "time": {
                "description": "Local clock time, HH:MM (24-hour). If unknown, omit: noon is used, and houses and angles are then unreliable.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone of the birthplace, e.g. America/New_York. Historical daylight saving is applied from it.",
                "type": "string"
              }
            },
            "required": ["date", "latitude", "longitude", "timezone"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Birth chart"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:89cae9dfc8a5ae1dc1b1d26823cce0dc6db7433f407f0b053cf1495957cde51c"
        },
        {
          "name": "planet_position",
          "title": "One planet at any date",
          "description": "One body's tropical position on a date, anywhere from 13,200 BC to AD 17,191, with its speed and whether it is retrograde. For historical and ancient dates; dates before 1582 are proleptic Gregorian.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "body": {
                "enum": ["sun", "moon", "mercury", "venus", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto", "true_node", "chiron"],
                "type": "string"
              },
              "date": {
                "pattern": "^[+-]?\\d{4,5}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "time_utc": {
                "description": "HH:MM UTC (default 12:00)",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              }
            },
            "required": ["body", "date"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One planet at any date"
          },
          "behavior": {
            "destructive": false,
