        },
        {
          "name": "naelos_library",
          "title": "Naelos's national and empire charts",
          "description": "Which national charts (198) and empire charts (19) Naelos holds, each researched and sourced, with the founding event it is cast for. The charts themselves, with their times, places and readings, are in Naelos's Mundane suite.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "search": {
