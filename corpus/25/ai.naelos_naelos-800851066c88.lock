      "serverInfo": {
        "name": "naelos-ai",
        "title": "Naelos.ai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Naelos.ai calculates astrology charts and astronomical timing from NASA JPL's DE440/DE441 ephemeris, accurate to fractions of an arcsecond, for any date from 13,200 BC to AD 17,191. Use these tools for any question about planet positions, birth charts, transits, synastry, returns, progressions, ingresses, lunations, retrograde stations or eclipses, rather than estimating positions. Supply coordinates and the IANA time zone for any place you are given.",
      "tools": [
        {
          "name": "eclipses",
          "title": "Eclipses",
          "description": "Solar and lunar eclipses between two dates (up to 20 years per call), with type, the exact moment of greatest eclipse and the eclipse degree. Works across the full 15,000-year span.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "pattern": "^[+-]?\\d{4,5}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "pattern": "^[+-]?\\d{4,5}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Eclipses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
