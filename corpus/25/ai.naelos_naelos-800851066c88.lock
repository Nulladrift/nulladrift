        {
          "name": "returns",
          "title": "Solar or lunar return",
          "description": "The solar return for a year (the moment the Sun returns to its birth position, the chart for that year) or the most recent lunar return (the last time the Moon reached its birth position), cast for the birthplace or another location.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "Birth date, YYYY-MM-DD",
                "pattern": "^[+-]?\\d{4,5}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "kind": {
                "enum": ["solar", "lunar"],
                "type": "string"
              },
              "latitude": {
                "description": "Birthplace latitude in decimal degrees (north positive)",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "longitude": {
                "description": "Birthplace longitude in decimal degrees (east positive)",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "place": {
                "description": "Birthplace name, echoed back so the user can check the coordinates",
                "maxLength": 120,
                "type": "string"
              },
              "return_latitude": {
                "description": "Where the person is for the return, if not the birthplace",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "return_longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "time": {
                "description": "Local clock time, HH:MM (24-hour). If unknown, omit: noon is used, and houses and angles are then unreliable.",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "timezone": {
                "description": "IANA time zone of the birthplace, e.g. America/New_York. Historical daylight saving is applied from it.",
                "type": "string"
              },
              "year": {
                "description": "Solar return year (default this year)",
                "maximum": 17180,
                "minimum": -13190,
                "type": "integer"
              }
            },
            "required": ["date", "kind", "latitude", "longitude", "timezone"],
            "type": "object"
