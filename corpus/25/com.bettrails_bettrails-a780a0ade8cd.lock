        },
        {
          "name": "esoccer_player",
          "title": "eSoccer player profile",
          "description": "Profile of an eSoccer (virtual football, EA FC) player: ELO rating and position in the league ranking, win rate, draws, goals scored and conceded per match, goals per match compared with the league, how many matches had 3, 4 or 5+ goals, current run of matches with 3+ goals (or 2 or fewer), recent form, latest matches with clubs, most frequent opponents and next scheduled match. Answers questions like \"how is X playing\", \"X stats\", \"is X in form\", \"how many goals does X score\", \"who does X play most\", \"when does X play next\". Same window as the Bettrails page: last 6 months when there are at least 15 matches, otherwise the whole career. May include a free sample of member data (active streaks). Statistics only: no odds, no betting advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the bettrails.com links returned (normally the language of the conversation). Default: es.",
                "enum": ["es", "en", "de", "fr", "pt"],
                "type": "string"
              },
              "league": {
                "description": "League. If omitted, the league where the player has played most. gt = GTLeagues; adriatic = Adriatic League; valhalla = Valhalla League; valkyrie = Valkyrie League; ggleague = GG League; esportsbattle = EsportsBattle; erivals = eRivals; cyberlivearena = Cyber Live Arena; volta = EsportsBattle Volta.",
                "enum": ["gt", "adriatic", "valhalla", "valkyrie", "ggleague", "esportsbattle", "erivals", "cyberlivearena", "volta"],
                "type": "string"
              },
              "player": {
                "description": "Player nickname as on Bettrails (case does not matter).",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["player"],
            "type": "object"
          },
          "annotations": {
