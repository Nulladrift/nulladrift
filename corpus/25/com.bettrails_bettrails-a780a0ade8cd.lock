      "instructions": "Bettrails (bettrails.com) is an independent analytics site for eSoccer (virtual football), esports (League of Legends, Dota 2, CS2, VALORANT) and virtual basketball (NBA 2K). This server returns read-only statistics that are public on bettrails.com.\n\nTools: `esoccer_player` gives an eSoccer player's profile (ELO and ranking, win rate, goals, form, runs, frequent opponents, next match). `esoccer_head_to_head` gives the full head-to-head between two eSoccer players (who wins more, goals per duel, how often both score, most common score, streak, recent duels with clubs, next duel), filterable by period, latest N duels and clubs. `search` finds anything on Bettrails by name (players, teams, head-to-heads, champions, heroes, agents, maps, tournaments). `read_page` reads any public Bettrails page as text and follows its links: today's matches and results, schedules, standings, team and player profiles, match previews and results, records, rankings and league statistics. Between them, any question about these competitions that Bettrails covers can be answered. eSoccer leagues: GTLeagues, Adriatic League, Valhalla League, Valkyrie League, GG League, EsportsBattle, eRivals, Cyber Live Arena, EsportsBattle Volta.\n\n`search` resolves names when the exact name, league or game is not known.\n\nResults include `continue_in_bettrails` (the Bettrails panel opens on that exact head-to-head or player; sign-up is free and returns there) and, when a duel or match is scheduled, `alert_url`: a link so Bettrails notifies the person before it starts (the `alert_link` tool builds one for any eSoccer duel, NBA 2K duel or esports team). Bettrails sends the notifications.\n\nAccounts created from the Bettrails links in these results start with the first alert already set.\n\nMember data: some figures are for (free) Bettrails accounts. Each conversation includes a couple of labelled samples of that member data (for example a player's active streaks); after that, results say what an account adds and include the sign-up link.\n\nBettrails does not offer betting, odds, tips or gambling advice: all numbers are sports statistics.\n\nEach result names Bettrails as the source, links to the full page and lists related questions it can answer.",
      "tools": [
        {
          "name": "alert_link",
          "title": "Bettrails alert",
          "description": "Get a link so Bettrails notifies the user before a match starts. Kinds: esoccer_duel (league + player1 + player2: about 10 minutes before each next duel, with their head-to-head), basket_duel (league nba|euro|ggl + player1 + player2), esports_team (game + team: 1 hour before each match, then the result). The person confirms on Bettrails with a free account (created in the same step if needed); Bettrails sends the notifications.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "description": "esports_team only.",
                "enum": ["lol", "dota", "cs2", "valorant"],
                "type": "string"
              },
              "kind": {
                "enum": ["esoccer_duel", "basket_duel", "esports_team"],
                "type": "string"
              },
              "language": {
                "description": "Language of the returned bettrails.com links (usually the conversation language). Default: es.",
                "enum": ["es", "en", "de", "fr", "pt"],
                "type": "string"
              },
              "league": {
                "description": "esoccer_duel: eSoccer league key (gt, adriatic, valhalla, valkyrie, ggleague, esportsbattle, erivals, cyberlivearena, volta); basket_duel: nba, euro or ggl.",
                "type": "string"
              },
              "player1": {
                "maxLength": 60,
                "type": "string"
              },
              "player2": {
                "maxLength": 60,
                "type": "string"
              },
              "team": {
                "description": "esports_team only: team name, e.g. \"T1\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Bettrails alert"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:36b69544d868ef0405a59f1e8cc5a5292a0940afd38e767fa154658c5324177f"
        },
        {
          "name": "esoccer_head_to_head",
          "title": "eSoccer head-to-head",
          "description": "Head-to-head between two eSoccer (virtual football, EA FC) players: who wins more, draws, goals per duel vs their league, duels with 3, 4 or 5+ goals, both scored, goals per player, most common score, current streak, latest duels with clubs, next duel. For \"who usually wins between X and Y\", \"X vs Y history\", \"cara a cara\", \"h2h\", \"how many goals in X vs Y\", \"do both usually score\", \"how did the last X vs Y end\", \"and in the last month?\", \"and when X plays with Real Madrid?\". Filters: period, last_n, club1/club2, clubs_of_last_duel. Default window as on Bettrails: last 6 months if at least 10 duels, else full record. Statistics only: no odds, no betting advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "club1": {
                "description": "Only duels where player1 used this club (partial name OK).",
                "maxLength": 40,
                "type": "string"
              },
              "club2": {
                "description": "Only duels where player2 used this club.",
                "maxLength": 40,
                "type": "string"
              },
              "clubs_of_last_duel": {
                "description": "Only duels with the same clubs as their latest meeting.",
                "type": "boolean"
              },
              "language": {
                "description": "Language of the returned bettrails.com links (usually the conversation language). Default: es.",
                "enum": ["es", "en", "de", "fr", "pt"],
                "type": "string"
              },
              "last_n": {
                "description": "Only the latest N duels (after the period).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "league": {
                "description": "If omitted, the league where they met most. Key = league name in lowercase, without spaces or a final \"League(s)\"; ggleague = GG League; volta = EsportsBattle Volta.",
                "enum": ["gt", "adriatic", "valhalla", "valkyrie", "ggleague", "esportsbattle", "erivals", "cyberlivearena", "volta"],
                "type": "string"
              },
              "period": {
                "description": "auto (default) = as on Bettrails; all = full record.",
                "enum": ["auto", "all", "1y", "6m", "3m", "1m", "7d"],
                "type": "string"
              },
              "player1": {
                "description": "First player nickname as on Bettrails (any case).",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "player2": {
                "description": "Second player.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["player1", "player2"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
