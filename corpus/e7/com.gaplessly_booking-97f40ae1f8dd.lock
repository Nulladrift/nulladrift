      },
      "instructions": "Book at businesses that use Gaplessly: restaurants and venues that take table reservations, and\nsalons, clinics and studios that take appointments.\n\nIf the guest names a business or an area but you have no slug, call find_venues (name, suburb or\npostcode, kind). It only lists businesses that chose to be found by assistants, so an empty result\nmeans \"not found here\", not \"cannot be booked\": ask the guest for the booking link and use its slug.\n\nThen call get_venue. It returns the slug the other tools need, the service ids an\nappointment search needs, and venueClock: the venue's own current date and time. The argument is\ncalled `slug`; `venue` is accepted as the same thing. Resolve every\ndate the guest mentions against venueClock.today rather than your own date, because a guest and a\nvenue are frequently not on the same day.\n\nTimes are returned as text with no timezone attached, on purpose. Do not convert them, do not\nreformat them into an instant, and do not do date arithmetic on them. To search a specific day,\nsend \"today\", \"tomorrow\", or an exact YYYY-MM-DD date; a phrase like \"next Tuesday\" is rejected.\n\nEvery returned time carries a slotToken, which is the booking handle. It is signed and short\nlived. Pass one back exactly as given, and never move a token between venues. A day lists a\nhandful of times by default: narrow with near, partOfDay, notBefore or notAfter rather than asking\nfor everything. A party above a restaurant's online limit gets a groupEnquiry link, not times.\n\nNo tool here books anything. start_appointment_booking and start_table_booking turn a slotToken into a short\nlink on the venue's own booking page, opened at that time; the guest enters their own details\nthere and confirms. Never ask a guest for their name, email or phone to pass to a tool, because\nno tool accepts them. Give the guest the link and say the booking is not made until they open it.\n\nOne consequence worth relaying accurately: opening a start_table_booking link makes the venue hold that\ntable for about ten minutes, so the guest has time to fill the form in. Nothing is held before\nthey open it, so a popular sitting can still go in the meantime.",
      "tools": [
        {
          "name": "find_appointment_times",
          "title": "Find appointment times",
          "description": "Free appointment times at one venue for one service, over up to two weeks. For salons, clinics, studios and anywhere a guest books a named service with a provider. Use find_table_times for a restaurant instead.\n\nNeeds a service id from get_venue. Each returned time has an `at` label to show the guest and a `slotToken`. The token is the booking handle: it is signed, it expires in about 30 minutes, and it is the only way a time can be booked later. Pass it back exactly as given, never edited, and never reuse one from a different venue. An empty `times` array for a day means that day is genuinely unavailable, not that something failed.\n\nEach day lists at most 10 times unless `maxPerDay` says otherwise, spread across the day; `omitted` says how many more exist. To answer \"around 6pm\" or \"afternoons\", send `near`, `partOfDay`, `notBefore` or `notAfter` instead of asking for everything.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many consecutive days to search from that day, 1 to 14. Defaults to 3.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "Which day to start from: the word \"today\", the word \"tomorrow\", or an exact calendar date as YYYY-MM-DD. Resolved against the venue's own current date, which is often not yours. Do not send a phrase like \"next Tuesday\" or a time of day; both are rejected.",
                "type": "string"
              },
              "maxPerDay": {
                "description": "Most times to return per day, 1 to 40. Defaults to 10. Past it, the times are spread across the day (or nearest `near`) and `omitted` says how many were left out.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A 24 hour time as HH:MM, for example 19:00 for 7pm. When a day has more times than maxPerDay, keep the ones closest to this.",
                "type": "string"
              },
              "notAfter": {
                "description": "Drop times later than this 24 hour HH:MM.",
                "type": "string"
              },
              "notBefore": {
                "description": "Drop times earlier than this 24 hour HH:MM.",
                "type": "string"
              },
              "partOfDay": {
                "description": "Only times in this part of the day: morning (before 12:00), afternoon (12:00 to 16:59), evening (17:00 on).",
                "enum": ["morning", "afternoon", "evening"],
                "type": "string"
              },
              "serviceId": {
                "description": "One service id from this venue's get_venue result. Not a service name.",
                "type": "string"
              },
              "slug": {
                "description": "The venue's booking slug, exactly as find_venues or get_venue returned it or as it appears in the venue's own booking link: the last path segment of gaplessly.com/book/<slug>, or the first label of <slug>.gaplessly.com. Not the business name; use find_venues to turn a name into a slug.",
                "type": "string"
              },
              "venue": {
                "description": "Alias of `slug`, kept for existing clients. Send `slug`.",
                "type": "string"
              }
            },
            "required": ["serviceId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find appointment times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6a753f86ba7b21010ab4ca1b079d0d997715ffaa328d5abe2db4fbb26ff45340"
        },
        {
          "name": "find_table_times",
          "title": "Find table times",
          "description": "Free table times at one restaurant or venue for one party size, over up to two weeks. Use find_appointment_times for a salon or clinic instead.\n\nEach returned time has an `at` label to show the guest and a `slotToken`. The token is the booking handle: it is signed, it expires in about 30 minutes, and it is the only way a time can be booked later. Pass it back exactly as given, never edited, and never reuse one from a different venue. An empty `times` array for a day means the venue has nothing at that party size that day, which usually means closed or fully booked.\n\nEach day lists at most 10 times unless `maxPerDay` says otherwise, spread across the day; `omitted` says how many more exist. To answer \"around 7pm\" or \"lunch\", send `near`, `partOfDay`, `notBefore` or `notAfter`. A party above the venue's online limit gets no times: the result carries `groupEnquiry` (a link and any contact details the venue published) to give the guest instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "How many consecutive days to search from that day, 1 to 14. Defaults to 3.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "from": {
                "description": "Which day to start from: the word \"today\", the word \"tomorrow\", or an exact calendar date as YYYY-MM-DD. Resolved against the venue's own current date, which is often not yours. Do not send a phrase like \"next Tuesday\" or a time of day; both are rejected.",
                "type": "string"
              },
              "maxPerDay": {
                "description": "Most times to return per day, 1 to 40. Defaults to 10. Past it, the times are spread across the day (or nearest `near`) and `omitted` says how many were left out.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A 24 hour time as HH:MM, for example 19:00 for 7pm. When a day has more times than maxPerDay, keep the ones closest to this.",
                "type": "string"
              },
              "notAfter": {
                "description": "Drop times later than this 24 hour HH:MM.",
                "type": "string"
              },
              "notBefore": {
                "description": "Drop times earlier than this 24 hour HH:MM.",
                "type": "string"
              },
              "partOfDay": {
                "description": "Only times in this part of the day: morning (before 12:00), afternoon (12:00 to 16:59), evening (17:00 on).",
                "enum": ["morning", "afternoon", "evening"],
                "type": "string"
              },
              "partySize": {
                "description": "How many people are coming, including the person booking.",
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The venue's booking slug, exactly as find_venues or get_venue returned it or as it appears in the venue's own booking link: the last path segment of gaplessly.com/book/<slug>, or the first label of <slug>.gaplessly.com. Not the business name; use find_venues to turn a name into a slug.",
                "type": "string"
              },
              "venue": {
                "description": "Alias of `slug`, kept for existing clients. Send `slug`.",
                "type": "string"
              }
            },
            "required": ["partySize"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find table times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4820c56c984ce9163d8e2a95b75fbd1d3112af93b901e5040beb4f97924930a1"
        },
        {
          "name": "find_venues",
          "title": "Find a venue",
          "description": "Search the businesses that take bookings through Gaplessly by name, by suburb or postcode, or by kind, and get back each one's slug, name, kind, address and booking page link. Use this when the guest names a business or an area but you do not have a slug; every other tool needs one.\n\nSend at least one of `name`, `location` or `kind`. Only real businesses that have chosen to be found by assistants are searchable here, so an empty result means \"not found here\", not that the business does not exist or cannot be booked: ask the guest for its booking link, which works with every other tool. Then call get_venue with the slug.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "appointments for salons, clinics and studios; hospitality for restaurants, cafes and bars.",
                "enum": ["appointments", "hospitality"],
                "type": "string"
              },
              "limit": {
                "description": "How many venues to return, 1 to 10. Defaults to 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "A suburb, city or postcode, matched against the venue address, for example \"Newtown\" or \"2042\".",
                "type": "string"
              },
              "name": {
                "description": "Part of the business name, for example \"Saltline\". Case does not matter.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a venue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ac1891da637620d424f77b1a01563b8a190737287d2cc009a669e485d1434b37"
        },
        {
          "name": "get_venue",
          "title": "Look up a venue",
          "description": "Read a venue's public booking profile: what it is, where it is, what can be booked, and what time it is THERE right now. Call this first once you have a slug (find_venues turns a name or suburb into one): the other tools need it, and appointment searches need a service id from here.\n\nA detail the business has not entered (industry, address, phone) is left out and listed under `notProvided`; do not guess it. For a restaurant with an online party limit, `groupEnquiry` is where a larger party goes.\n\nReturns `venueClock`, which is the venue's own current date and time. Every date you ask for later is resolved against `venueClock.today`, not against your own today: the two are routinely different days. Times are given as text on purpose and there is no timezone identifier anywhere in the result, because converting them is how a booking ends up hours off.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "The venue's booking slug, exactly as find_venues or get_venue returned it or as it appears in the venue's own booking link: the last path segment of gaplessly.com/book/<slug>, or the first label of <slug>.gaplessly.com. Not the business name; use find_venues to turn a name into a slug.",
                "type": "string"
              },
              "venue": {
                "description": "Alias of `slug`, kept for existing clients. Send `slug`.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look up a venue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7e20f20e86b3b2b69f655950b136ed899d5b625645472fa9b12860840b929517"
        },
        {
          "name": "start_appointment_booking",
          "title": "Start an appointment booking",
          "description": "Turn a time from find_appointment_times into a link the guest taps to finish booking. This does NOT book anything: it returns a short-lived URL on the venue's own booking page, already opened at that service, that staff member and that exact time, where the guest enters their own name, email and phone and confirms.\n\nGive the guest the `url` and say plainly that the booking is not made until they open it. Never ask the guest for their contact details to pass here; this tool does not take them, and the page collects them directly. Nothing is reserved in the meantime, so a popular time can still go before they tap.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "serviceId": {
                "description": "The same service id passed to find_appointment_times, from get_venue. The link opens on this service.",
                "type": "string"
              },
              "slotToken": {
                "description": "A `slotToken` from find_appointment_times or find_table_times, copied exactly. It is signed and carries the venue and the time inside the signature, so it cannot be edited, built by hand, or used at a different venue. It expires about 30 minutes after the search.",
                "type": "string"
              },
              "slug": {
                "description": "The venue's booking slug, exactly as find_venues or get_venue returned it or as it appears in the venue's own booking link: the last path segment of gaplessly.com/book/<slug>, or the first label of <slug>.gaplessly.com. Not the business name; use find_venues to turn a name into a slug.",
                "type": "string"
              },
              "venue": {
                "description": "Alias of `slug`, kept for existing clients. Send `slug`.",
                "type": "string"
              }
            },
            "required": ["serviceId", "slotToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Start an appointment booking"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b31d5378a943b9f52d8242e5abfb3651b737fbc7f364d4c9c875b7015693f5b"
        },
        {
          "name": "start_table_booking",
          "title": "Start a table booking",
          "description": "Turn a time from find_table_times into a link the guest taps to finish booking. This does NOT book anything: it returns a short-lived URL on the venue's own booking page, already opened at that party size and that exact sitting, where the guest enters their own details and confirms.\n\nThe venue holds the table from the moment the guest opens the link, for about ten minutes, which is what gives them time to fill the form in. Until they open it nothing is held, so give them the `url` promptly and say the table is not theirs until they do.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "partySize": {
                "description": "The same party size passed to find_table_times. The link opens on it.",
                "minimum": 1,
                "type": "integer"
              },
              "slotToken": {
                "description": "A `slotToken` from find_appointment_times or find_table_times, copied exactly. It is signed and carries the venue and the time inside the signature, so it cannot be edited, built by hand, or used at a different venue. It expires about 30 minutes after the search.",
                "type": "string"
              },
              "slug": {
                "description": "The venue's booking slug, exactly as find_venues or get_venue returned it or as it appears in the venue's own booking link: the last path segment of gaplessly.com/book/<slug>, or the first label of <slug>.gaplessly.com. Not the business name; use find_venues to turn a name into a slug.",
                "type": "string"
              },
              "venue": {
                "description": "Alias of `slug`, kept for existing clients. Send `slug`.",
                "type": "string"
              }
            },
            "required": ["partySize", "slotToken"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
