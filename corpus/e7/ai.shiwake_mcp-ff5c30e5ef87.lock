          "description": "ふるさと納税で、自己負担が2,000円で済む寄附額の上限（控除上限額の目安）を計算します。令和8年（2026年）中の寄附が対象で、令和8年分の所得税と令和9年度の住民税で計算します。給与の年収（または事業所得など）・社会保険料・配偶者・扶養親族・iDeCo・生命保険料・地震保険料・医療費控除から、住民税の所得割額、特例控除割合、上限額と、上限まで寄附したときの所得税・住民税の控除額の内訳を返します。住民税は標準税率（所得割10%）。障害者控除・特定親族特別控除・住宅ローン控除・分離課税の所得は含めない目安です。金額は円（整数）。出典: ISZ™ 仕訳AI（shiwake.ai） の無料ツール「ふるさと納税 控除上限額シミュレーション」（https://shiwake.ai/tools/furusato/）と同じ計算エンジン。",
