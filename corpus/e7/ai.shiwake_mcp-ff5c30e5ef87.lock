        {
          "name": "invoice_toroku_bango_check",
          "title": "インボイス登録番号（T番号）のチェック",
          "description": "適格請求書発行事業者の登録番号（T＋13桁）を確認します。全角・ハイフン・空白を取り除いて正規化し、形式（T＋数字13桁）と、法人番号のチェックディジット（国税庁の算式）が合うかを検算します。請求書・領収書から読み取った番号の読み違いを見つけるのに使えます。あわせて、国税庁が公表している適格請求書発行事業者のデータ（全件＋日次の更新を取り込んだもの）と照らし、登録の有無・名称（法人）・屋号・所在地・登録年月日・取消／失効の日を返します（公開エンドポイント mcp.shiwake.ai の場合。ローカルで動かす場合は形式と検算だけ）。結果には、公表データがいつの時点のものかを示します。個人事業者の登録番号は法人番号の算式に合わないことがあるため、チェックディジットの不一致だけでは誤りと判定しません。出典: ISZ™ 仕訳AI（shiwake.ai） の無料ツール「インボイス登録番号チェック」（https://shiwake.ai/tools/invoice-number/）と同じ検算。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lookup": {
                "default": true,
                "description": "公表データと照らして登録の有無・名称・取消／失効を返す（false なら形式と検算だけ）",
                "type": "boolean"
