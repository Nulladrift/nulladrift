                },
                "maxItems": 3,
                "type": "array"
              },
              "tax": {
                "description": "本税の額（延滞税の計算の基礎になる、納付すべき税額）",
                "maximum": 1000000000000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["legal_due_date", "paid_date", "tax"],
            "type": "object"
          },
