        {
          "name": "gensen_kyuyo_zeigaku",
          "title": "給与の源泉徴収税額（月額表 甲欄・乙欄）",
          "description": "毎月の給与から天引きする所得税（源泉徴収税額。復興特別所得税を含む）を、国税庁「給与所得の源泉徴収税額表（月額表）」で求めます。令和7年分〜令和9年分に対応し、支給日で年分を決めます。入力は、その月の「社会保険料等控除後の給与等の金額」（総支給額 − 非課税の通勤手当 − 社会保険料）と扶養親族等の数。甲欄（扶養控除等申告書を出している人）は月額表または電算機計算の特例、乙欄（従たる給与）にも対応します。賞与・日額表・丙欄は対象外。金額は円（整数）。出典: ISZ™ 仕訳AI（shiwake.ai） の無料ツール「給与の源泉徴収税額 計算」（https://shiwake.ai/tools/gensen-kyuyo/）と同じ計算エンジン。",
          "inputSchema": {
