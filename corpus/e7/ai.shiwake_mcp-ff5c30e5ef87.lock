        {
          "name": "genka_shokyaku_keisan",
          "title": "減価償却費の計算（定額法・200%定率法）",
          "description": "固定資産の減価償却費を、取得価額・耐用年数・償却方法（定額法／200%定率法）・事業の用に供した日・決算月から計算し、償却が終わるまでの各事業年度の償却額と期末帳簿価額（備忘価額1円まで）を返します。平成24年4月1日以後に取得した資産の法人の計算で、初年度は月数按分、定率法は保証率・改定償却率への切り替えも反映します。あわせて、取得価額が少額のときに選べる処理（10万円未満の消耗品費、20万円未満の一括償却資産、中小企業者等の少額減価償却資産の特例。令和8年4月1日以後の取得は40万円未満）も示します。建物・建物附属設備・構築物・ソフトウェアなどは定額法だけの資産です（このツールは資産の種類からは方法を判定しません）。金額は円（整数）。出典: ISZ™ 仕訳AI（shiwake.ai） の無料ツール「減価償却 計算」（https://shiwake.ai/tools/genka-shokyaku/）と同じ計算エンジン。",
