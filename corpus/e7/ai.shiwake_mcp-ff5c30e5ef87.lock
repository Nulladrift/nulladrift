      "instructions": "ISZ™ 仕訳AI（https://shiwake.ai）が提供する、日本の税務・会計の無料計算ツールです。年末調整の還付額の試算、勘定科目・仕訳例の検索、インボイス登録番号のチェック、消費税の納付税額の比較、給与の源泉徴収税額、ふるさと納税の控除上限額、延滞税、減価償却、給与の手取りと社会保険料の計算ができます。計算は shiwake.ai の無料ツール（/tools/）と同じエンジンで、登録・ログインは不要です。結果には、同じ計算ができる shiwake.ai のツールのページ（出典）へのリンクが付きます。結果は一般的な計算・処理の例であり、個別の税務判断ではありません。",
      "tools": [
        {
          "name": "entaizei_keisan",
          "title": "延滞税の計算（国税）",
          "description": "国税（所得税・法人税・消費税など）を期限までに納めなかったときの延滞税を計算します。本税の額・法定納期限・納付した日から、納期限の翌日から2か月以内の低い割合と、2か月を過ぎた後の高い割合を、年ごとの割合（延滞税特例基準割合。平成26年〜令和8年）で区切って計算し、期間ごとの内訳を返します。期限内申告の納付遅れ、期限後申告、修正申告、更正・決定に対応し、修正申告・更正のときの計算から除く期間（除算期間）、一部納付、端数処理（本税1万円未満切捨て・延滞税100円未満切捨て・1,000円未満は0円）も反映します。地方税の延滞金・利子税・加算税は対象外。金額は円（整数）。出典: ISZ™ 仕訳AI（shiwake.ai） の無料ツール「延滞税 計算」（https://shiwake.ai/tools/entaizei/）と同じ計算エンジン。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "filed_date": {
                "description": "期限後申告書・修正申告書を提出した日、または更正通知書・決定通知書を発した日（kind が kigennai 以外のとき必須）",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "fraud": {
                "default": false,
                "description": "偽りその他不正の行為がある（除算期間の特例がない）なら true。修正申告・更正のときだけ使う",
                "type": "boolean"
              },
              "kind": {
                "default": "kigennai",
                "description": "kigennai = 期限内申告の納付遅れ、kigengo = 期限後申告、shusei = 修正申告、kosei = 更正・決定",
                "enum": ["kigennai", "kigengo", "shusei", "kosei"],
                "type": "string"
              },
              "legal_due_date": {
                "description": "法定納期限（本来納付すべき期限。YYYY-MM-DD。休日なら翌日）",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "original": {
                "description": "修正申告・更正のときの、もとの申告（省略すると期限内申告）",
                "properties": {
                  "filed_date": {
                    "description": "もとの期限後申告書を提出した日（kind が kigengo のとき必須）",
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  "kind": {
                    "description": "もとの申告: kigennai = 期限内申告、kigengo = 期限後申告",
                    "enum": ["kigennai", "kigengo"],
                    "type": "string"
                  }
                },
                "required": ["kind"],
                "type": "object"
              },
              "paid_date": {
                "description": "完納の日（残りを全部納めた日。YYYY-MM-DD）",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "partial_payments": {
