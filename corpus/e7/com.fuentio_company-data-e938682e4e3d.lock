      "serverInfo": {
        "name": "fuentio",
        "title": "Fuentio: UK, France & Spain company data from official registries",
        "version": "0.1.0",
        "websiteUrl": "https://fuentio.com"
      },
      "capabilities": {
        "completions": {},
