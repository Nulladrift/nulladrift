        {
          "name": "verify_company",
          "title": "Verify a company (registry check)",
          "description": "Verify a company against its official register, for onboarding or before paying or signing: an outcome with reasons, checks, warning signals and a proof code you can show an auditor. A registry check, not full KYB.\nUse it to decide about a company. Don't use it for a cheap single read (lookup_company) or with a name (call search_companies first).\nInputs: country FR or ES or GB; identifier as for lookup_company (441639465); optional id_scheme; optional reference (your case id).\nReturns: outcome (verified, partial, unverified; open insolvency never verified) + reasons, checks, signals (present, none_found, not_covered), recent changes, provenance, proof code (FUE-…).\nLimits: 5 units (1 if not found); keyless 20/day. Stored 24 months. France: insolvency from BODACC since 2008. BODACC events and dated capital. Public contracts won since 2024 (DECP, weekly). Spain: BORME acts since 2 January 2009. Every BORME act as an event. UK: no officers or PSCs. ISINs and BICs from GLEIF, by LEI. No person's name in any answer.\nSearch words: KYB, KYC, verify supplier, vérifier une société, verificar empresa.",
