                "type": "string"
              },
              "id_scheme": {
                "anyOf": [
                  {
                    "enum": ["FR_SIREN", "FR_SIRET", "EU_VAT", "LEI", "ES_RM_HOJA", "ES_NIF", "GB_COMPANY_NUMBER"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional: force the ID type.",
                "examples": ["FR_SIRET"],
                "title": "Id Scheme"
              },
              "identifier": {
                "description": "Official ID: FR SIREN or SIRET; ES Registro Mercantil sheet from search_companies. GB: Companies House company number, e.g. 00445790. Never a name.",
                "examples": ["441639465", "VI-23266", "00445790"],
                "maxLength": 64,
                "title": "Identifier",
                "type": "string"
