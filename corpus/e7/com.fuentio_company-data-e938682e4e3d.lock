            },
            "required": ["format", "proof_code"],
            "title": "get_receiptArguments",
            "type": "object"
          },
          "outputSchema": {
            "description": "get_receipt (brief 009): the Fuentio receipt by proof code. `data.markdown` is the\nbranded receipt to show as is, `data.text` the same in plain text; the rest is the JSON\n(`kind`, `format`, `proof_code`, `header`, `outcome`, `status`, `legal_form`,\n`registered_office`, `insolvency`, `source`, `checked_at`, `hash`, `check_url`).\nDetailed adds `checks`, `signals`, `changes_summary`, `sources`, `data_sha256`,\n`unchanged`, `served_at` and `limits`. A lookup's request id gives that lookup's proof\n(`kind: lookup_receipt`).",
