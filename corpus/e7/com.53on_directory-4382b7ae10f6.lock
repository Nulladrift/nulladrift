{
  "lockfileVersion": 2,
  "subjects": {
    "com.53on/directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://53on.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "53ON",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "53ON is a directory and marketplace of local businesses and independent professionals. Use search_providers to find who does the job, then get_business for prices and the link where the user requests a quote and pays.",
      "tools": [
        {
          "name": "get_business",
          "description": "Full public detail of one 53ON business by its slug: services, ratings, product catalog with prices, and the link where the user can request a quote and pay. Use the slug returned by search_providers.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language for service names. Default es.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "slug": {
                "description": "Public slug of the business, for example creacionlaura.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get business details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:570930131904b34f16648998533e9b96869fa3e389caa6ccc3eed25b7cf838d9"
        },
        {
          "name": "search_providers",
          "description": "Find local businesses and independent professionals on 53ON by what they do. Accepts free text in Spanish or English and resolves synonyms, so \"plumber\" and \"destapar caneria\" both work. Pass lat and lng to limit results to that area; without them the search is nationwide. Call with an empty query to get the list of services 53ON covers.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Language of the query. Default es.",
                "enum": ["es", "en"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the user. Optional.",
                "type": "number"
              },
              "limit": {
                "description": "Max results, 1 to 50. Default 10.",
                "type": "integer"
              },
              "lng": {
                "description": "Longitude of the user. Optional.",
                "type": "number"
              },
              "query": {
                "description": "What the user needs, in their own words. Empty returns the service list.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find local businesses"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8f11a26fd7b360ad7555a288235a627636729ffcb46558c806ff92a474fe8dab"
        }
      ],
      "digest": "sha256:c5efa0afff06344c98bf87eddbc71d0852c72c4d58ac9af10bb06154b88e30c9"
    }
  }
}
