        {
          "name": "comment",
          "title": "Manage Task Comment",
          "description": "Write on a task's comment thread. `action: \"add\"` posts a comment, attributed to the connected user and visible to everyone in the workspace, so write it as a message to the user's teammates rather than a note to the user; nobody is notified. `action: \"edit\"` rewrites one of your own (only its author may, and it is then marked edited). `action: \"remove\"` deletes one permanently — comments have no Trash — so confirm with the user first. Read the thread with task_show and `include: [\"comments\"]`.",
