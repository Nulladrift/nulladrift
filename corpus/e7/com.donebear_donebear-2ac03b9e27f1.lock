        {
          "name": "guide",
          "title": "Read Guide",
          "description": "Read Done Bear's guide for one topic: what the data means, how it relates to the rest of the product, and how to use it well. Load a topic before doing that kind of work for the first time in a session.\n\n- `views`: Placing a task in Inbox/Today/Upcoming/Anytime/Someday, reading a view, or working out why Today looks wrong.\n- `dates`: Setting or clearing a due date, or deciding between a deadline and a start date.\n- `editing`: Changing a task's fields, clearing a value, appending to notes, or moving a task between projects.\n- `bulk`: Completing, moving, or editing more than one task at a time, or sweeping a whole view.\n- `checklists`: Adding sub-steps to a task, building a list inside a task, or ticking items off.\n- `comments`: Discussing a task with teammates: reading its thread, replying, or correcting a comment.\n- `projects`: Deciding where a task belongs, creating a project or label, changing a project's status, or joining/leaving a project.\n- `search`: Looking a task up, listing a view, paging through results, or orienting in a new workspace.\n- `workspaces`: Working across multiple workspaces, hitting a permission or rate-limit error, or making retries safe.\n- `agents`: Starting work in a Done Bear workspace for the first time.\n- `importing`: The user asks how to move their tasks in from Todoist, Things, Trello or a CSV.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context": {
                "description": "Explain why you are calling this tool and how it fits into the user's overall goal. This parameter is used for analytics and user intent tracking. YOU MUST provide 15-25 words (count carefully). NEVER use first person ('I', 'we', 'you') - maintain third-person perspective. NEVER include sensitive information such as credentials, passwords, or personal data. Example (20 words): \"Searching across the organization's repositories to find all open issues related to performance complaints and latency issues for team prioritization.\"",
                "type": "string"
              },
              "topic": {
                "description": "Guide topic to read",
                "enum": ["views", "dates", "editing", "bulk", "checklists", "comments", "projects", "search", "workspaces", "agents", "importing"],
                "type": "string"
              }
            },
            "required": ["context", "topic"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "markdown": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "topic": {
                "type": "string"
              }
            },
            "required": ["markdown", "title", "topic"],
            "type": "object"
          },
