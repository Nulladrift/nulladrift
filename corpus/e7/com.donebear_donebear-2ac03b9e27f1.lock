        {
          "name": "get_context",
          "title": "Get Workspace Context",
          "description": "Get a snapshot of the current workspace: task counts per view, recent open tasks, and every project, label, team and member. This is the tool that answers what is in the workspace and resolves a project, label, team or member by name — there is no separate list tool for those. Use it for that, not as a warm-up before every turn. For tasks themselves use task_list (a view), search (by words) or task_show (one task): the recent tasks here are only the latest few.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "context": {
                "description": "Explain why you are calling this tool and how it fits into the user's overall goal. This parameter is used for analytics and user intent tracking. YOU MUST provide 15-25 words (count carefully). NEVER use first person ('I', 'we', 'you') - maintain third-person perspective. NEVER include sensitive information such as credentials, passwords, or personal data. Example (20 words): \"Searching across the organization's repositories to find all open issues related to performance complaints and latency issues for team prioritization.\"",
                "type": "string"
              },
              "projects_status": {
                "default": "active",
                "description": "Which projects to return",
                "enum": ["active", "done", "archived", "all"],
                "type": "string"
              },
              "tasks_limit": {
                "default": 10,
                "description": "Max recent open tasks to return",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "timezone": {
                "description": "IANA timezone used to resolve \"today\" for views and scheduling (e.g. Australia/Melbourne). Defaults to UTC, which misclassifies Today/Upcoming for users in other timezones, so always pass the user's timezone when known.",
                "type": "string"
              },
              "workspace": {
                "description": "Workspace id, slug, or name. Required when the account has more than one workspace: a call without it then fails and names the choices",
                "type": "string"
              }
            },
            "required": ["context"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "labels": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "members": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "userId": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "userId"],
                  "type": "object"
                },
                "type": "array"
              },
              "projects": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "key": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "status": {
                      "type": "string"
                    },
                    "targetDate": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["id", "key", "name", "status", "targetDate"],
                  "type": "object"
                },
                "type": "array"
              },
              "recentTasks": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "deadline": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "id": {
                      "type": "string"
                    },
                    "number": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "projectId": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "title": {
                      "type": "string"
                    },
                    "view": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["deadline", "id", "number", "projectId", "title", "view"],
                  "type": "object"
                },
                "type": "array"
              },
              "taskCounts": {
                "additionalProperties": false,
                "properties": {
                  "archived": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "done": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  },
                  "open": {
                    "maximum": 9007199254740991,
