        {
          "name": "task_add",
          "title": "Add Task",
          "description": "Create a new task. An explicit `when` selects its start placement: today, inbox, upcoming, anytime, or someday; upcoming schedules tomorrow, or the day given in `start_date` (YYYY-MM-DD, after today). A `start_date` with no `when` also selects upcoming. Without `when` or `start_date`, a `deadline` or omitted `timezone` selects anytime first. Otherwise, a `project` or `team` selects inbox; an unfiled task selects today. Pass the user's known IANA `timezone` to resolve calendar days. Use `when: \"inbox\"` for capture without a commitment to today. `deadline` uses YYYY-MM-DD. Optionally assign the task, attach existing labels, or pass checklist item titles in `checklist`; their order is preserved. The result's `view` reports the selected start placement, while a due or overdue deadline can make the task appear in Today. To change an existing task, use task_edit for fields or the available checklist tools for items. Search first when the user may be describing an existing task.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "assignee": {
                "description": "Member (user id, name, or email) or task agent (id or name) to assign the task to",
                "type": "string"
              },
              "checklist": {
                "description": "Checklist item titles to create on the task, kept in the given order",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "type": "array"
              },
              "context": {
                "description": "Explain why you are calling this tool and how it fits into the user's overall goal. This parameter is used for analytics and user intent tracking. YOU MUST provide 15-25 words (count carefully). NEVER use first person ('I', 'we', 'you') - maintain third-person perspective. NEVER include sensitive information such as credentials, passwords, or personal data. Example (20 words): \"Searching across the organization's repositories to find all open issues related to performance complaints and latency issues for team prioritization.\"",
                "type": "string"
              },
              "deadline": {
                "description": "Due date in YYYY-MM-DD format",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Stable key that makes retries safe: repeated calls with the same key create only one record and return the same id.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "labels": {
                "description": "Labels to attach (each a label id, title, or id prefix)",
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "type": "array"
              },
              "notes": {
                "description": "Task description/notes",
                "type": "string"
              },
              "project": {
                "description": "Project id, key, or name to assign this task to",
                "type": "string"
              },
              "start_date": {
                "description": "Day the task starts, in YYYY-MM-DD format. Must be after today in `timezone`. Places the task in Upcoming until that day, then in Today. Use with `when: \"upcoming\"` or no `when`; any other `when` is rejected.",
                "type": "string"
              },
              "team": {
                "description": "Team id, key, or name",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone used to resolve \"today\" for views and scheduling (e.g. Australia/Melbourne). Defaults to UTC, which misclassifies Today/Upcoming for users in other timezones, so always pass the user's timezone when known.",
                "type": "string"
              },
              "title": {
                "description": "Task title",
                "minLength": 1,
                "type": "string"
              },
              "when": {
                "description": "GTD view bucket: today, inbox, upcoming, anytime, someday. Omitting this means today, with three exceptions: a deadline or a missing timezone falls back to anytime (the work is due later, or today cannot be resolved), and a project or team falls back to inbox (the task is already filed). Pass timezone to get today. Use \"inbox\" for a capture the user has not committed to doing.",
                "enum": ["inbox", "anytime", "today", "upcoming", "someday"],
                "type": "string"
              },
              "workspace": {
                "description": "Workspace id, slug, or name. Required when the account has more than one workspace: a call without it then fails and names the choices",
                "type": "string"
              }
            },
            "required": ["context", "title"],
            "type": "object"
          },
