          "digest": "sha256:94a96e6f8d3c5501c0c6e255469c6d16aadf5edd4be6ca3c1af31a116135d8c8"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the RentRollDesk dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
