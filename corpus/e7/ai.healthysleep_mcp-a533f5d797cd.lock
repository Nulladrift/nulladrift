{
  "lockfileVersion": 2,
  "subjects": {
    "ai.healthysleep/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://healthysleep.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai.healthysleep/mcp",
        "title": "HealthySleep.ai",
        "version": "1.0.0",
        "websiteUrl": "https://healthysleep.ai/connectors/",
        "icons": [
          {
            "src": "https://healthysleep.ai/static/android-chrome-512x512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "HealthySleep.ai is an independent sleep health information site, not a clinic. These tools read its public pages: sleep disorders, sleep guides, CPAP therapy guides and the list of sleep tools. Every result is general information, not medical advice: pass on its disclaimer, cite the sources it lists, and point the user to a doctor or a sleep specialist for their own symptoms and treatment, as the pages do. Never give medication doses and never tell anyone to change a prescribed CPAP, APAP or BiPAP pressure. For an emergency, say to call 911 (US) or the local emergency number; for a crisis, call or text 988 (US). Search with English keywords; results come back in the requested language when the site serves it.",
      "tools": [
        {
          "name": "get_condition",
          "title": "Get a sleep disorder page",
          "description": "One sleep disorder page: summary, description, symptoms, causes, diagnosis, treatments, self care, when to see a doctor, FAQs and the sources it relies on (title and URL), with the site disclaimer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional ISO 639-1 code for the result language, e.g. \"es\". Languages the site does not serve fall back to English. Default: the account language, or English without sign in.",
                "type": "string"
              },
              "slug": {
                "description": "e.g. \"obstructive-sleep-apnea\" (from search or list).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a sleep disorder page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb11f8ba5c8d4a3fff6c1d52c9366e3019c22d14b4af30476fdba8940965155a"
        },
        {
          "name": "get_guide",
          "title": "Get a sleep or CPAP guide",
          "description": "One sleep guide or CPAP therapy guide: summary, sections, FAQs and the sources it relies on (title and URL), with the site disclaimer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Optional ISO 639-1 code for the result language, e.g. \"es\". Languages the site does not serve fall back to English. Default: the account language, or English without sign in.",
                "type": "string"
              },
              "slug": {
                "description": "Guide slug (from search or list).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a sleep or CPAP guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0505f951c54bc51a82c2234e7e69942676edaa9307576becf319d6e367a61532"
        },
        {
          "name": "list_topics",
          "title": "List sleep topics",
          "description": "Everything HealthySleep.ai covers: sleep disorders by category, guides by category (including CPAP) and the sleep tools, with slugs.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "all",
                "enum": ["all", "conditions", "guides", "cpap", "tools"],
                "type": "string"
              },
              "language": {
                "description": "Optional ISO 639-1 code for the result language, e.g. \"es\". Languages the site does not serve fall back to English. Default: the account language, or English without sign in.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List sleep topics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bb80df04a90e0cf86f8dabf4f9fd028b00951d5bcbfd1c65c3b8fc6cb1d70fd7"
        },
        {
          "name": "search_sleep_topics",
          "title": "Search sleep topics",
          "description": "Search HealthySleep.ai's sleep disorder pages, sleep guides, CPAP therapy guides and sleep tools by keyword. Returns titles, short summaries, slugs and links. Use get_condition or get_guide with a slug for the full page and its sources.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "any",
                "description": "Limit to one kind of page; \"cpap\" means CPAP guides.",
                "enum": ["any", "condition", "guide", "cpap", "tool"],
                "type": "string"
              },
              "language": {
                "description": "Optional ISO 639-1 code for the result language, e.g. \"es\". Languages the site does not serve fall back to English. Default: the account language, or English without sign in.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "English keywords, e.g. \"snoring\", \"CPAP dry mouth\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search sleep topics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df8f8b352395eb68380a508aa8ae6cd530c8f88cbaa9fd039f8f19d0c7813c06"
        }
      ],
      "digest": "sha256:2ad28205d2cce34de66b530cfe3650960a0fa7b7111edc7f54ad5300edf8f846"
    }
  }
}
