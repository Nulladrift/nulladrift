                "type": "string"
              },
              "guideUrl": {
                "format": "uri",
                "type": "string"
              },
              "lastReviewed": {
                "anyOf": [
                  {
                    "description": "YYYY-MM-DD",
                    "type": "string"
                  },
                  {
                    "type": "null"
