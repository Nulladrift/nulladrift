          "description": "Find the cultivators, importers, manufacturers, packagers and distributors behind UK products, by name, role or country, with product counts. Never stock or wholesale prices. Example: {\"type\":\"CULTIVATOR\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Where it is based, e.g. \"Canada\".",
                "maxLength": 60,
                "minLength": 2,
                "pattern": "^\\p{L}[\\p{L} .'’‘&()-]*$",
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Rows to skip.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Supplier name, or words from its profile.",
                "maxLength": 120,
                "type": "string"
              },
              "sort": {
                "description": "Default name_asc.",
                "enum": ["name_asc", "name_desc"],
                "type": "string"
              },
              "type": {
                "description": "Its role in the supply chain.",
                "enum": ["CULTIVATOR", "IMPORTER", "MANUFACTURER", "PACKAGER", "DISTRIBUTOR"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "directoryTotal": {
                "description": "The whole directory, when the tool read one window of it",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "page": {
                "description": "Which window of 60 directory rows this answer read",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
                      "type": ["string", "null"]
                    },
                    "country": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "productCount": {
                      "description": "Approved products it supplies on Findabis, as the /suppliers card counts them; never stock",
                      "maximum": 9007199254740991,
                      "minimum": -9007199254740991,
                      "type": "integer"
                    },
                    "slug": {
                      "type": ["string", "null"]
                    },
                    "types": {
                      "items": {
                        "enum": ["CULTIVATOR", "IMPORTER", "MANUFACTURER", "PACKAGER", "DISTRIBUTOR"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "url": {
                      "anyOf": [
                        {
                          "format": "uri",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Canonical Findabis page, absolute; null when the listing has no page"
                    },
                    "website": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["city", "country", "name", "productCount", "slug", "types", "url", "website"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "How many matched in all; narrow the query when this exceeds the results",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "required": ["results", "total"],
            "type": "object"
          },
