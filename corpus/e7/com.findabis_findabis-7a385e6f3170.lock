                "description": "Minimum review average.",
                "enum": ["3_plus", "4_plus"],
                "type": "string"
              },
              "near": {
                "description": "UK postcode or town; nearest first.",
                "maxLength": 64,
                "minLength": 2,
                "type": "string"
              },
              "offset": {
                "description": "Rows to skip.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "60-row window; the answer says when there is another.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Pharmacy name.",
                "maxLength": 120,
                "type": "string"
              },
              "radiusMiles": {
                "description": "Miles from `near`.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "sort": {
                "description": "Default distance with `near`, else az.",
                "enum": ["distance", "az", "za", "city", "rating"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "directoryTotal": {
                "description": "The whole directory, when the tool read one window of it",
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "page": {
                "description": "Which window of 60 directory rows this answer read",
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "city": {
