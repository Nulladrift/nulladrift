                "description": "The whole directory, when the tool read one window of it",
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "page": {
                "description": "Which window of 60 directory rows this answer read",
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "acceptingPatients": {
                      "description": "Shows 'Accepting patients' (an active published eligibility policy)",
                      "type": "boolean"
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "consultationTypes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "cqcRating": {
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "distanceMiles": {
                      "description": "Miles from `near`; null when no place was given",
                      "type": ["number", "null"]
                    },
