        {
          "name": "get_travel_rules",
          "title": "Travelling abroad with medical cannabis",
          "description": "Taking a UK prescription abroad: a country's checked rule (status, documents, permit, official sources, date checked) and nearby countries, or every country with one status, plus the UK's own rules. General information, not legal advice. Example: {\"country\":\"Spain\"}",
