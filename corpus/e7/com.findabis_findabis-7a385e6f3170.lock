                            "type": "string"
                          },
                          "recurring": {
                            "type": "boolean"
                          }
                        },
                        "required": ["cost", "label", "recurring"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "followUpConsultationFee": {
                      "type": ["number", "null"]
                    },
                    "initialConsultationFee": {
                      "type": ["number", "null"]
                    },
                    "laterYearClinicFees": {
                      "type": ["number", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "partnerPharmacies": {
                      "type": "integer"
                    },
                    "rating": {
                      "anyOf": [
                        {
                          "additionalProperties": false,
                          "properties": {
                            "average": {
                              "type": "number"
                            },
                            "count": {
                              "type": "number"
                            }
                          },
                          "required": ["average", "count"],
                          "type": "object"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "type": ["string", "null"]
                    },
                    "yearOneClinicFees": {
                      "type": ["number", "null"]
                    }
                  },
                  "required": ["acceptingPatients", "consultationTypes", "cqcRating", "feeBreakdown", "followUpConsultationFee", "initialConsultationFee", "laterYearClinicFees", "name", "partnerPharmacies", "rating", "slug", "url", "yearOneClinicFees"],
                  "type": "object"
