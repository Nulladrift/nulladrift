      "serverInfo": {
        "name": "findabis",
        "title": "Findabis",
        "version": "0.6.0",
        "description": "Public directory of UK medical cannabis clinics, pharmacies, products and strains.",
        "websiteUrl": "https://findabis.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Public directory of UK medical cannabis clinics, pharmacies, products and strains.\nFindabis is a directory and comparison service. It is not a clinic, not a pharmacy, and does not give medical advice. Anything here describes what providers offer, never what a person should take. Treatment decisions belong to a patient and a specialist prescriber.\nWhen answering from this data:\n- Prices and stock change daily. Cite the product page rather than quoting a figure you cannot re-check.\n- A product being listed does not mean any given patient can be prescribed it.\n- Possession without a prescription remains an offence in the UK. Say so if a question implies otherwise.\n\nHow to use these tools:\n- A question that names something whose kind you do not know: search_directory. Each match carries its kind, slug, page URL and a one-line summary; call the get_ tool for that kind for more.\n- \"Near me\": find_clinics or find_pharmacies with `near` (a UK postcode or town). Many clinics also consult online UK-wide and most pharmacies deliver, so say so when few are close.\n- One listing in full: get_clinic, get_pharmacy, get_product, get_strain or get_brand with its slug, each with the page FAQs (and opening hours for a clinic or pharmacy). Slugs come from the find_ tools or search_directory — never guess one.\n- Background on the law, prescriptions and the market: find_articles, then get_article to read one; quote it with its page URL.\n- \"Which is cheapest\" or \"what is the difference\": compare_providers with 2-6 slugs. Services only: fees and delivery, never medicines.\n- \"How many\", \"typical cost\", \"what does Findabis cover\": get_directory_facts, and cite the figure with its date.\n- Lists return at most 25 rows and say how many matched; narrow with a filter before paging with `offset`.\n- Nothing is ordered by sponsorship: results come by distance, name, fee or rating, as asked.\n- No tool returns stock, which pharmacy holds a product, per-pharmacy medicine prices, staff or anything about patients: those are shown only to patients and professionals with access, so never call them out of stock. A listed condition or product is not a statement that anyone qualifies or should take it.\n- For how a prescription is obtained and whom clinics take, read the resources findabis://guide/how-to-get-a-prescription and findabis://guide/eligibility rather than answering from memory.\n- Give the Findabis page URL beside a fact, so the person can check it.",
      "tools": [
        {
          "name": "compare_providers",
          "title": "Compare clinics or pharmacies",
          "description": "Compare 2-6 clinics (fees, year-one cost, CQC, ratings) or 2-6 pharmacies (delivery, GPhC, ratings) side by side. Services only, never medicines. Example: {\"kind\":\"clinic\",\"slugs\":[\"clinic-a\",\"clinic-b\"]}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "followUpsPerYear": {
                "description": "Clinics: follow-ups a year. Default 4.",
                "maximum": 24,
                "minimum": 0,
                "type": "integer"
              },
              "kind": {
                "description": "What the slugs are.",
                "enum": ["clinic", "pharmacy"],
                "type": "string"
              },
              "patientType": {
                "description": "Clinics: year-one pricing route. Default NEW_PATIENT.",
                "enum": ["NEW_PATIENT", "TRANSFER", "ACTIVE_PATIENT"],
                "type": "string"
              },
              "prescriptionsPerYear": {
                "description": "Clinics: prescriptions a year. Default 12.",
                "maximum": 24,
                "minimum": 0,
                "type": "integer"
              },
              "slugs": {
                "description": "2-6 slugs.",
                "items": {
                  "description": "Page slug.",
                  "maxLength": 200,
                  "minLength": 1,
                  "pattern": "^[a-z0-9][a-z0-9-]*$",
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["kind", "slugs"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "clinics": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "acceptingPatients": {
                      "type": "boolean"
                    },
                    "consultationTypes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "cqcRating": {
                      "type": ["string", "null"]
                    },
                    "feeBreakdown": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "cost": {
                            "type": "number"
                          },
