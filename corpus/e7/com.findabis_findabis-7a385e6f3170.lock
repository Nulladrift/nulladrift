                "maxLength": 120,
                "type": "string"
              },
              "consultationType": {
                "description": "Consultation type.",
                "enum": ["ONLINE", "IN_PERSON", "PHONE"],
                "type": "string"
              },
              "cqc": {
                "description": "CQC rating.",
                "enum": ["GOOD_OR_BETTER", "OUTSTANDING", "GOOD", "REQUIRES_IMPROVEMENT", "NOT_RATED"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxFirstConsultationFee": {
                "description": "Max first-consultation fee, GBP.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "near": {
                "description": "UK postcode or town; nearest first.",
                "maxLength": 64,
                "minLength": 2,
                "type": "string"
              },
              "offset": {
                "description": "Rows to skip.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "60-row window; the answer says when there is another.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "patientType": {
                "description": "Clinics taking this patient type; prices year one for it.",
                "enum": ["NEW_PATIENT", "TRANSFER", "ACTIVE_PATIENT"],
                "type": "string"
              },
              "query": {
                "description": "Clinic name.",
                "maxLength": 120,
                "type": "string"
              },
              "radiusMiles": {
                "description": "Miles from `near`.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "sort": {
                "description": "cheapest/dearest = year-one clinic fees. Default distance with `near`, else az.",
                "enum": ["distance", "az", "za", "cheapest", "dearest", "rating"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "directoryTotal": {
                "description": "The whole directory, when the tool read one window of it",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "note": {
                "type": "string"
              },
              "page": {
                "description": "Which window of 60 directory rows this answer read",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "acceptingPatients": {
                      "description": "Shows 'Accepting patients' (an active published eligibility policy)",
                      "type": "boolean"
                    },
                    "city": {
                      "type": ["string", "null"]
                    },
                    "consultationTypes": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "cqcRating": {
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "distanceMiles": {
                      "description": "Miles from `near`; null when no place was given",
                      "type": ["number", "null"]
                    },
                    "firstYearClinicFees": {
                      "description": "Estimated year-one clinic fees (consultations, membership, the clinic's prescription fee) for the asked patient type with 4 follow-ups and 12 prescriptions; never includes medicine; null when no price list is published",
                      "type": ["number", "null"]
                    },
                    "followUpConsultationFee": {
                      "description": "In `currency`; null when not published",
                      "type": ["number", "null"]
