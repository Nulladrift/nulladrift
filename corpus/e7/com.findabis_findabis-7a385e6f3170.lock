        {
          "name": "find_articles",
          "title": "Find Findabis articles",
          "description": "Find Findabis articles (UK law, prescriptions, clinics, products) by words or category, newest first. Example: {\"query\":\"travel abroad\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category slug.",
                "maxLength": 80,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Rows to skip.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words in the title or text.",
                "maxLength": 120,
                "type": "string"
              },
              "sort": {
                "description": "Default newest.",
                "enum": ["newest", "oldest"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "aiAssisted": {
                      "description": "The page labels it AI-assisted",
                      "type": "boolean"
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "excerpt": {
                      "$ref": "#/properties/results/items/properties/category"
                    },
                    "publishedAt": {
                      "description": "ISO date the article went live",
                      "type": ["string", "null"]
                    },
                    "readingMinutes": {
                      "anyOf": [
                        {
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "slug": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "anyOf": [
                        {
                          "format": "uri",
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  },
                  "required": ["aiAssisted", "category", "excerpt", "publishedAt", "readingMinutes", "slug", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Findabis articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8d0f8c136305bd34c51c7a26f363ab450489ecd0aa608ead981118b9a344a67"
        },
