        {
          "name": "find_clinics",
          "title": "Find medical cannabis clinics",
          "description": "Find UK clinics that prescribe cannabis-based medicines, nearest first with `near`, filtered by condition, consultation type, CQC rating, fee or patient type. Returns fees, year-one cost and CQC rating; not doctors or appointments. Example: {\"near\":\"Leeds\",\"consultationType\":\"ONLINE\"}",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "acceptingPatients": {
                "description": "Accepting patients only.",
                "type": "boolean"
              },
              "condition": {
                "description": "A condition the clinic's policy lists, e.g. \"chronic pain\", \"PTSD\".",
                "maxLength": 120,
                "type": "string"
              },
              "consultationType": {
                "description": "Consultation type.",
                "enum": ["ONLINE", "IN_PERSON", "PHONE"],
                "type": "string"
              },
              "cqc": {
                "description": "CQC rating.",
                "enum": ["GOOD_OR_BETTER", "OUTSTANDING", "GOOD", "REQUIRES_IMPROVEMENT", "NOT_RATED"],
                "type": "string"
              },
              "limit": {
                "description": "Default 10.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "maxFirstConsultationFee": {
                "description": "Max first-consultation fee, GBP.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "near": {
                "description": "UK postcode or town; nearest first.",
                "maxLength": 64,
                "minLength": 2,
                "type": "string"
              },
              "offset": {
                "description": "Rows to skip.",
                "maximum": 500,
                "minimum": 0,
                "type": "integer"
              },
              "page": {
                "description": "60-row window; the answer says when there is another.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "patientType": {
                "description": "Clinics taking this patient type; prices year one for it.",
                "enum": ["NEW_PATIENT", "TRANSFER", "ACTIVE_PATIENT"],
                "type": "string"
              },
              "query": {
                "description": "Clinic name.",
                "maxLength": 120,
                "type": "string"
              },
              "radiusMiles": {
                "description": "Miles from `near`.",
                "exclusiveMinimum": 0,
                "maximum": 500,
                "type": "number"
              },
              "sort": {
                "description": "cheapest/dearest = year-one clinic fees. Default distance with `near`, else az.",
                "enum": ["distance", "az", "za", "cheapest", "dearest", "rating"],
                "type": "string"
              }
