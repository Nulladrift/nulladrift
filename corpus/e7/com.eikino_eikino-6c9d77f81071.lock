{
  "lockfileVersion": 2,
  "subjects": {
    "com.eikino/eikino": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eikino.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eikino",
        "title": "Eikino",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Eikino (https://eikino.com) geolocates photos and video frames (locate_media) and checks media for AI generation signs (detect_ai_media). Each check uses 1 account check (0 if locate_media finds no place). Always confirm with the user before spending a check, and check balance with get_credits when needed.",
      "tools": [
        {
          "name": "detect_ai_media",
          "title": "Check if video frames or media were AI-generated",
          "description": "Analyze 1–6 still frames from a video (or a single image) for signs of AI generation (Sora, Veo, Kling, Runway, Seedance, etc.) vs. real camera footage, returning likelihood (low/medium/high), 0–100 score, summary, AI artifacts and real-footage signs. Uses 1 check.",
          "inputSchema": {
            "properties": {
              "duration": {
                "description": "Optional video duration in seconds.",
                "maximum": 36000,
                "minimum": 0,
                "type": "number"
              },
              "image_base64": {
                "description": "Base64-encoded JPEG, PNG or WebP image (with or without data: prefix).",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of a single JPEG, PNG or WebP image (up to 5 MB).",
                "format": "uri",
                "type": "string"
              },
              "image_urls": {
                "description": "Optional list of public https URLs of still frames sampled from one video (1–4 for locate_media, 1–6 for detect_ai_media).",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array"
              },
              "markers": {
                "description": "Optional container metadata markers such as \"c2pa\" or encoder tags.",
                "items": {
                  "maxLength": 80,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5f633c69abd576a0bc7864b4b96323382feece4b8b48d1c916d7919088380923"
        },
        {
          "name": "get_credits",
          "title": "Check remaining Eikino checks",
          "description": "Return the number of available AI checks remaining on this Eikino account. Free.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:936d7ad275d799145bf9bd46f5067b8c19459deaa4d66b9301b013c56cf344e3"
        },
        {
          "name": "locate_media",
          "title": "Find where a photo or video was taken",
          "description": "Estimate where a photo or 1–4 video frames were filmed, returning place name, country, coordinates, confidence, uncertainty radius in km, visual clues and alternatives. Uses 1 check when a location is found; 0 checks if unknown or failed.",
          "inputSchema": {
            "properties": {
              "hint": {
                "description": "Optional context hint, e.g. \"filmed in summer 2019\".",
                "maxLength": 200,
                "type": "string"
              },
              "image_base64": {
                "description": "Base64-encoded JPEG, PNG or WebP image (with or without data: prefix).",
                "type": "string"
              },
              "image_url": {
                "description": "Public https URL of a single JPEG, PNG or WebP image (up to 5 MB).",
                "format": "uri",
                "type": "string"
              },
              "image_urls": {
                "description": "Up to 4 public https URLs of evenly spaced frames from one video.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "kind": {
                "description": "Optional media type hint (photo or video).",
                "enum": ["photo", "video"],
                "type": "string"
              },
              "taken": {
                "description": "Optional recording date (YYYY-MM-DD) from EXIF or video metadata.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2233dc02877538f8dfd33d0cf334ce518a969ac00f62465177aae38f8290a903"
        }
      ],
      "digest": "sha256:ba03d17e1b94ac20f33cf7d6a57858dc049c442ade0f4b18f3e1196f88fb05b3"
    }
  }
}
