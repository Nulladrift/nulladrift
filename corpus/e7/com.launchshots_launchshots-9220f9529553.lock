      "serverInfo": {
        "name": "launchshots",
        "title": "LaunchShots",
        "version": "1.0.0",
        "websiteUrl": "https://launchshots.com/mcp"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "LaunchShots turns an app's raw screenshots into a finished, fully editable App Store / Google Play screenshot set: per-screen marketing headlines, palette, device frames and layout, in three art directions to choose from.\n\nWorkflow:\n1. Collect 3–8 screenshots of the app's most important screens, populated with realistic data (no empty states, login walls, debug banners or placeholder text). Capture them from a simulator/emulator if needed.\n2. Call prepare_screenshot_upload with the count, then PUT each file to its upload URL (curl commands are provided). If you cannot run shell commands, pass small screenshots inline to generate_screenshot_set instead.\n3. Call generate_screenshot_set with the set_id, the app name, a specific description (what it does, who it's for, what makes it different — read the README / store copy) and the platform.\n4. Call get_screenshot_set to wait for it (about 1–2 minutes). Then give the user the review link: they pick a direction and it opens in the LaunchShots editor, where every headline, color and frame stays editable and exports at every store size.\n\nWithout an API key the server works on the free tier (a few sets a day, from a shared daily allowance) and the user signs up free to keep the set. With an API key (Authorization: Bearer ls_key_…) sets are charged to that account: 3 free generations, then 1 credit each or unlimited on a plan. Call get_account to see what is left.",
      "tools": [
        {
          "name": "generate_screenshot_set",
          "title": "Generate screenshot set",
          "description": "Design a finished App Store / Google Play screenshot set from uploaded screenshots. Step 2 of 3.\n\nReturns immediately with a review link while the set is designed in the background (about 1–2 minutes) — then call get_screenshot_set to wait for it. The result is three art directions sharing one set of headlines, each fully editable in the LaunchShots editor.\n\nWrite app_description from the real source: the README, store listing, or the app's own copy — what it does, who it's for, and what makes it different. Specific beats generic; the headlines are only as sharp as this.\n\nEither pass set_id from prepare_screenshot_upload (preferred), or pass the screenshots inline as base64 if you cannot run shell commands (keep each under ~1 MB). Calling again with the same set_id after a failure retries it; nothing is charged for a failed run.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "app_description": {
                "description": "What the app does, who it is for and what sets it apart — 2–6 specific sentences drawn from the README, store listing or product copy.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "app_name": {
                "description": "The app’s name as it appears in the store.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "include_tablet": {
                "description": "Also produce the matching iPad / Android tablet set. Counts as a second generation; needs an API key.",
                "type": "boolean"
              },
              "language": {
                "description": "Store language to write the headlines in, e.g. en-US, de-DE, ja, pt-BR. Defaults to en-US.",
                "maxLength": 32,
                "type": "string"
              },
              "platform": {
                "description": "ios for the App Store, android for Google Play.",
                "enum": ["ios", "android"],
                "type": "string"
              },
              "screenshots": {
                "description": "Only if you cannot upload with prepare_screenshot_upload: the screenshots inline, each under ~1 MB.",
                "items": {
                  "properties": {
                    "data_base64": {
                      "description": "The image file, base64-encoded (no data: prefix).",
                      "maxLength": 2000004,
                      "type": "string"
                    }
                  },
                  "required": ["data_base64"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "set_id": {
                "description": "The set_id from prepare_screenshot_upload, once its screenshots are uploaded.",
                "maxLength": 80,
                "type": "string"
              },
              "style_note": {
                "description": "Optional art direction, e.g. \"dark and premium\", \"playful, uses our brand orange #FF6B00\".",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["app_description", "app_name", "platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:676e4dee78d31ebf50ce5929a8c2aca9b45a801f83e5d475dfb6dff6ca99aa2b"
        },
        {
          "name": "get_account",
          "title": "Get account",
          "description": "Show which LaunchShots account this connection uses and how many generations it has left. Without an API key, explains the free tier and how to connect an account.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:36e4668c6fef0ed17104adf15ecc3002dab2b0e97ad8f8df6b8ba59f502a2185"
        },
        {
          "name": "get_screenshot_set",
          "title": "Get screenshot set",
          "description": "Check on a screenshot set, waiting up to wait_seconds for it to finish. Step 3 of 3.\n\nWhen it is ready this returns the review link, the headline written for every screen and the three directions. Share the link with the user: they choose a direction and the set opens in the LaunchShots editor (free signup if they are not signed in). If it is still generating, call again — a set usually takes 1–2 minutes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "set_id": {
                "description": "The set_id (ls_set_…).",
                "maxLength": 80,
                "type": "string"
              },
              "wait_seconds": {
                "description": "How long to wait for a set that is still generating (0–50, default 45).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["set_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a48fe340510d15f8195ec4f9dfb75fbcdccc2c7eb657255489b7425b9be4dbb3"
        },
        {
          "name": "list_projects",
          "title": "List projects",
          "description": "List the most recently edited projects in this API key's LaunchShots account, with a link to open each in the editor. Requires an API key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c60122ef69d992aa8d4c716eaf036be2f8d6728bd0cb1d20942d172bcd55c969"
        },
        {
          "name": "prepare_screenshot_upload",
          "title": "Prepare screenshot upload",
          "description": "Start a screenshot set and get one upload URL per screenshot. Step 1 of 3.\n\nPick the app's key screens — one per core feature, in roughly the order a new user would care about them — captured with realistic content. Avoid empty states, onboarding walls, permission dialogs, debug banners and lorem ipsum: the headlines are written from what is on screen.\n\nUpload each file with an HTTP PUT of the raw bytes to its URL (the response includes ready-to-run curl commands). URLs are valid for 2 hours; PUT to the same slot again to replace a file. Then call generate_screenshot_set with the returned set_id.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "screenshot_count": {
                "description": "How many screenshots you will upload (1–10; 3–8 makes the best set).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["screenshot_count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6c408df4c72751c4af6b3a7082e24a608e84d7b602762510d88e0f20ba2e9883"
        }
      ],
