      "serverInfo": {
        "name": "app.randomcolorgenerator/color-palette",
        "title": "RandomColorGenerator Palette & WCAG MCP",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use generate_accessible_palette to create 5-color UI harmonies with WCAG text recommendations, and check_wcag_contrast to verify AA/AAA contrast ratios.",
      "tools": [
        {
          "name": "check_wcag_contrast",
          "title": "Check WCAG 2.1 Color Contrast Ratio",
          "description": "Calculate exact WCAG 2.1 contrast ratio between a foreground and background HEX color, reporting AA and AAA compliance for normal and large text.",
          "inputSchema": {
            "properties": {
              "background_hex": {
                "description": "Background HEX color (e.g. \"#0f172a\").",
                "type": "string"
              },
              "foreground_hex": {
                "description": "Text / foreground HEX color (e.g. \"#ffffff\").",
                "type": "string"
              }
            },
            "required": ["background_hex", "foreground_hex"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check WCAG 2.1 Color Contrast Ratio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:47a5bcb5fdaae29f5e031bb20c11d02ee178493d380f07219a4173bb9d7d202f"
        },
        {
          "name": "generate_accessible_palette",
          "title": "Generate Accessible 5-Color UI Palette",
          "description": "Generate a harmonious 5-color UI palette (complementary, analogous, triadic, or monochrome) with HEX, HSL, and optimal WCAG text contrast pairings.",
          "inputSchema": {
            "properties": {
              "base_hex": {
                "description": "Base HEX color (e.g. \"#0f172a\" or \"#60a5fa\").",
                "type": "string"
              },
              "harmony": {
                "description": "Color harmony mode.",
                "enum": ["complementary", "analogous", "triadic", "monochrome"],
                "type": "string"
              }
            },
            "required": ["base_hex"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Generate Accessible 5-Color UI Palette"
          },
