{
  "lockfileVersion": 2,
  "subjects": {
    "com.reguscilabs.www/innovation-lab": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.reguscilabs.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "reguscilabs-innovation-lab",
        "version": "1.0.3"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "RegusciLabs actions MCP for the Innovation Lab. Six tools: read_information, search_information, get_latest_news, get_latest_activity, submit_inquiry, subscribe_pulse. Social activity is a manually curated snapshot, not live. Validate writes with dryRun:true first. Obtain the person's approval before dryRun:false and confirmed:true. Newsletter consent must be separate. Save idempotencyKey before a live action; reuse the same key and identical input to check its outcome within 7 days. Never retry an uncertain action with a new key. Documentation-only MCP: https://mcp.reguscilabs.com/docs.",
      "tools": [
        {
          "name": "get_latest_activity",
          "description": "Browse curated public RegusciLabs social posts with real post URLs, platform, language, topic and verified-date filters and pagination. Not a real-time feed; unverified post dates are null and platforms without approved sources may be empty.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Reuse nextCursor with identical filters.",
                "pattern": "^\\d{1,7}$",
                "type": "string"
              },
              "from": {
                "description": "Only posts with verified dates can match this lower bound.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "all",
                "enum": ["all", "es", "en"],
                "type": "string"
              },
              "platform": {
                "default": "all",
                "enum": ["all", "youtube", "instagram", "linkedin", "tiktok", "reddit"],
                "type": "string"
              },
              "to": {
                "description": "Only posts with verified dates can match this upper bound.",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "topic": {
                "description": "Match only public titles, summaries, tags and approved project names.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:753b6ada39dc51cbc10dffe21a559f955e016d9f48e0322daefbbc94be7e7714"
        },
        {
          "name": "get_latest_news",
          "description": "List the latest published RegusciLabs Newsroom articles and El Pulso editions, newest first. Filter by language and source; return canonical URLs, dates, source citations and nextCursor. This is a read-only public archive, not a live breaking-news feed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Use nextCursor with the same locale and source.",
                "pattern": "^\\d{1,7}$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "es",
                "enum": ["es", "en"],
                "type": "string"
              },
              "source": {
                "default": "all",
                "enum": ["all", "newsroom", "pulse"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5ce89c0e7c3b27e6ca11647d541f94e678b419ff83d4dfdf4158c99754f74e4"
        },
        {
          "name": "read_information",
          "description": "Read published RegusciLabs information about the innovation lab, AI, hardware, POCs, discovery, cases, Newsroom or policies. No login needed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "path": {
                "default": "/index.md",
                "description": "Public content path from llms.txt or sitemap.xml, such as /en/index.md. No private paths or external URLs.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3fd753b32867c18a1ba849ae1d5e4593e8f0029df9f9471d3c4b9356b0f625f"
        },
        {
          "name": "search_information",
          "description": "Search public RegusciLabs content in Spanish or English. Returns source links and excerpts, not generated claims.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Use nextCursor from the previous response with the same query and locale.",
                "pattern": "^\\d{1,7}$",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "es",
                "enum": ["es", "en"],
                "type": "string"
              },
              "query": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ebca00fa094b3d6b3a69e9a7948a84513cd8e6b415517d6f1aa5a7f819c3ce4d"
        },
        {
          "name": "submit_inquiry",
          "description": "Send a project idea to RegusciLabs to start discovery. Requires the person's explicit approval and contact details. Validate with dryRun:true first. Does not subscribe the person. Live submissions send a team notification and attempt CRM storage. Save an idempotencyKey before sending and reuse it with identical input for retries within 7 days; never retry an uncertain action with a new key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Budget status from the person, e.g. to be defined. Do not invent an amount.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "challenge": {
                "description": "The idea, the problem and what the person wants to test.",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "challengeType": {
                "description": "The kind of idea: AI, software, hardware or an unusual experiment.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "company": {
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "confirmed": {
                "default": false,
                "description": "Set true only after the person explicitly approves sending these details to RegusciLabs.",
                "type": "boolean"
              },
              "dryRun": {
                "default": true,
                "description": "Defaults to true: validate only, with no delivery or storage. Set false only for an approved live submission.",
                "type": "boolean"
              },
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Unique key for one approved live action. Reuse it with identical input for retries for 7 days; use a new key for a different intended action. Without a key, automatic retry is unsafe.",
                "pattern": "^[A-Za-z0-9._:-]{8,128}$",
                "type": "string"
              },
              "locale": {
                "default": "es",
                "enum": ["es", "en"],
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "role": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "stage": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "timeline": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "whatsapp": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["budget", "challenge", "challengeType", "company", "email", "name", "role", "stage", "timeline", "whatsapp"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0aa64ce7e9bae8d7b5a4c0f60a0ec84fc6aa11212bddf395943861f96c456566"
        },
        {
          "name": "subscribe_pulse",
          "description": "Subscribe a person to The Pulse by email with their explicit newsletter consent and chosen format, frequency and language. Validate with dryRun:true first. Live calls store a subscription, send a confirmation email and notify the team. Save an idempotencyKey before sending and reuse it with identical input for retries within 7 days; never retry an uncertain action with a new key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "cadence": {
                "enum": ["daily", "weekly"],
                "type": "string"
              },
              "confirmed": {
                "default": false,
                "description": "Set true only after the person explicitly approves sending these details to RegusciLabs.",
                "type": "boolean"
              },
              "consent": {
                "const": true,
                "description": "The person explicitly opted into The Pulse. An inquiry does not imply newsletter consent.",
                "type": "boolean"
              },
              "deliveryFormat": {
                "enum": ["audio", "text", "both"],
                "type": "string"
              },
              "dryRun": {
                "default": true,
                "description": "Defaults to true: validate only, with no delivery or storage. Set false only for an approved live submission.",
                "type": "boolean"
              },
              "email": {
                "format": "email",
                "maxLength": 254,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Unique key for one approved live action. Reuse it with identical input for retries for 7 days; use a new key for a different intended action. Without a key, automatic retry is unsafe.",
                "pattern": "^[A-Za-z0-9._:-]{8,128}$",
                "type": "string"
              },
              "locale": {
                "default": "es",
                "enum": ["es", "en"],
                "type": "string"
              },
              "name": {
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "whatsapp": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["cadence", "consent", "deliveryFormat", "email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b3c8ba4ab9a687540708e3ffdd51aba93f58d1c358b54fe975fcb66a923b3a9"
        }
      ],
      "digest": "sha256:f1d8677635263cb9b4d4fe8b0f589df7c1924cb60c137e60a09f0cc0da8a4886"
    }
  }
}
