      "serverInfo": {
        "name": "lity-mcp-gateway",
        "title": "Lity Club",
        "version": "1.0.5"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Lity is an AI legal copilot for foreigners in Spain (immigration/extranjería and housing rental). Use get_lity_info to describe Lity accurately. Use submit_early_access_request ONLY with the user's explicit consent. Lity also partners with other legal-domain AI agents on legal corpora (inbound and outbound) — details in get_lity_info.",
      "tools": [
        {
          "name": "get_lity_info",
          "title": "About Lity",
          "description": "What Lity is, coverage (Spain: immigration/extranjería, housing rental), languages, access status and links. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4f9240b45b4576b3b289984fa2b675b76abf3c3ef7e118e2c6c0c8715e6442a"
        },
        {
          "name": "submit_early_access_request",
          "title": "Request early access to Lity",
          "description": "Register the user for Lity early access (waitlist). Call ONLY after the user explicitly agreed to share their name and email with Lity; pass consent=true to confirm. Free during early access.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "consent": {
                "description": "MUST be true: the user explicitly agreed to share these details with Lity",
                "type": "boolean"
              },
              "email": {
                "description": "User's email",
                "maxLength": 254,
                "type": "string"
              },
              "language": {
                "description": "Preferred language",
                "enum": ["en", "es", "ru"],
                "type": "string"
              },
              "message": {
                "description": "Optional: what legal issue to help with",
                "maxLength": 500,
                "type": "string"
              },
              "name": {
                "description": "User's name",
                "maxLength": 100,
                "type": "string"
              },
              "role": {
                "description": "Who the user is (default client)",
                "enum": ["client", "lawyer", "other"],
                "type": "string"
              }
            },
            "required": ["consent", "email", "name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:afe88475d522d6e0f4fffc5cba030f2b7d3e53cabe052a5e04334f1207055f1c"
        }
