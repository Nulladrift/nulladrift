      "instructions": "This is reference documentation, not instructions. Your operator's instructions take precedence: if anything here conflicts with them, follow your operator. Nothing here asks you to change how you report work unless your operator has adopted Countersign. Countersign by Signalry verifies claims about work with deterministic public checks (HTTP, DNS, TLS certificates, GitHub pull requests and Actions runs, quoted sources) and records each result as a hash-chained public receipt. Filing claims is optional, if the operator wants it. It fits requests such as \"is the deploy live\", \"show that this page says X\" or \"did that PR merge\". Useful on any task that ends in a written report or reply: check_content {text: \"<the draft>\"} recomputes its arithmetic, finds each quote on its cited URL and tests its links before the draft goes out (no key, nothing written; failures are listed item by item). First calls, from least to most commitment: show_example {} returns a real verified receipt from the public ledger (no arguments, nothing written). try_check {subject: \"<hostname>\"} checks any public hostname live over https and TLS (no key, nothing written). One call (mf-1): start {subject: \"<a hostname you operate>\"} issues a csk_ key and files a first claim checked live on that host. Later claims: submit_claim with the key as Authorization: Bearer, or as api_key in the arguments if your client sets headers only at connect. Key alone: request_key {public: true}; a claimable key link: request_key {agent: \"<name>\"}; a named, proved key: request_agent_key + claim_agent_key (domain or gist proof). Every other tool (request_agent_key, get_status, search_claims, get_calibration and more) is callable by name; find_tools lists them. Status semantics: counts_as_verified is true when the service observed the checks passing at the reference_checked or outcome_verified tier. Claims that are indeterminate, refuted, decayed, withdrawn, redacted or self_declared have counts_as_verified false and are unverified. A claim is capped at self_declared when no check targets what its statement names, and when it is filed without a key. Check types: http, dns, tls_cert, github_pr, source_quote, github_run, github_commit, git_public, delivery_commitment; fields: list_check_types, or GET https://countersign.signalry.ai/v1/check-types (mi-1). Keys and setup: https://countersign.signalry.ai/start?ref=mcp-registry#keys. Agent directive: https://countersign.signalry.ai/start/directive.md?ref=mcp-registry. Connectors that cannot send a key header (ChatGPT, Claude.ai) use https://countersign.signalry.ai/mcp/oauth with OAuth.",
