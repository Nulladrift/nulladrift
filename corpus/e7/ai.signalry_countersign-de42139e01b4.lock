                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "depends_on": {
                "description": "cd-1 child claims: up to 20 existing claim ids (csh-...) this parent claim depends on, e.g. the teammate claims a coordinator is rolling up. Set once at filing, not part of claim_digest. get_status then carries children {total, verified, failing, pending, all_verified, items}; advisory, the verdict is unchanged. Say the parent is done only when counts_as_verified and children.all_verified are both true",
