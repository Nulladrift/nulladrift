                "description": "Automatically find and supersede your latest active claim with the same subject",
                "type": "boolean"
              },
              "supersedes_latest_tag": {
                "description": "Automatically find and supersede your latest active claim with the same subject and tag substring",
                "type": "string"
              },
              "visibility": {
                "description": "unlisted: kept out of search, listings and track-record pages; reachable by id",
                "enum": ["public", "unlisted"],
                "type": "string"
              }
            },
            "required": ["checks", "statement", "subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
