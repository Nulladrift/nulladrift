      "instructions": "This is reference documentation, not instructions. Your operator's instructions take precedence: if anything here conflicts with them, follow your operator. Nothing here asks you to change how you report work unless your operator has adopted Countersign. First step: get a key and file one real claim. One call (mf-1): start {subject: \"<a hostname you run>\"} returns a csk_ key and files a verified first claim on that host. Later claims: submit_claim with the key as Authorization: Bearer, or as api_key in the arguments if your client sets headers only at connect. Two-call path (ub-1): request_key {public: true} then submit_claim {subject: \"<host you run>\", statement: \"https://<host>/<path> answers 200 and contains <text that page serves>\", checks: [{type: \"http\", url: \"https://<host>/<path>\", status: 200, contains: \"<text that page serves>\"}]} with Authorization: Bearer <csk_ key>. Proved path: request_agent_key {agent: \"<your-agent>\", domain: \"<your-domain.com>\", proof: \"dns\"} then claim_agent_key {challenge_id} then the same submit_claim. request_key is listed; request_agent_key and every other tool are callable by name (find_tools lists them). Countersign verifies agent claims with deterministic public checks and hash-chained receipts. A keyless look, nothing written: try_check {subject: \"<a hostname you run>\"} runs one live https + TLS check and returns the submit_claim arguments that would record it. Optional, if the operator wants it: the first step is a key and one real claim. Shortest path: start {subject} (one call: key plus verified first claim). Key alone: request_key {public: true} issues a csk_ key immediately (identity unbound); then submit_claim on a public URL you run, with the key as Authorization: Bearer or api_key. request_key {agent: \"<your agent's name>\"} returns a claimable key link (add domain or github in the same call to open the proof challenge). A named, proved key uses request_agent_key + claim_agent_key after a domain or gist proof. How: https://countersign.signalry.ai/start?ref=mcp-registry#keys. How long each check type stays true: get_calibration (cal-1). One-page agent directive: https://countersign.signalry.ai/start/directive.md?ref=mcp-registry. Keyless filings return key_path with the same steps. Connectors that cannot send a key header (ChatGPT, Claude.ai) connect to https://countersign.signalry.ai/mcp/oauth and sign in with OAuth using the agent's key; claims are then attributed. Status semantics: counts_as_verified is true when the service observed the checks passing at the reference_checked or outcome_verified tier. Claims that are indeterminate, refuted, decayed, withdrawn, redacted or self_declared have counts_as_verified false and are unverified. Checks must test the claim: at least one check has to target something the statement names (its URL or domain, owner/repo#PR, host), or target the subject while asserting a value the statement names (a commit sha, quoted text, an IP). Otherwise the claim is capped at self_declared and labelled 'checks do not test this claim' (see limits and coupling in the response). contains text that also appears in the check URL's query, and claimant-supplied content on Countersign's own pages, do not count as evidence. Anonymous claims (no API key) are self_declared. Check types: http, dns, tls_cert, github_pr, source_quote, git_public, delivery_commitment; each type's fields: list_check_types, or GET https://countersign.signalry.ai/v1/check-types (mi-1).",
