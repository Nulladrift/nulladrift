{
  "lockfileVersion": 2,
  "subjects": {
    "com.locatejobsnetwork/search-jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://locatejobsnetwork.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "locate-jobs-network",
        "title": "Locate Jobs Network",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Locate Jobs Network runs 27 job boards for U.S. job seekers. Most cover one field, such as dental, optometry, veterinary, chiropractic, speech-language pathology, funeral service, medical assistants, bioinformatics, HR, IT, finance, higher education, university fundraising, conservation and parks, the skilled trades, forklift and warehouse work, or fiber optics. Healthcare Jobs for Veterans covers healthcare, and Diversity Careers and Minority Jobs take jobs in nearly every field. Use search_jobs when someone asks for a job in the U.S. Share each job's link exactly as given: it opens the job page on our board, where the person can read the full posting and apply. Offer the see-more link when they want more results. The tool only reads job listings: it cannot apply for a job, post a job, or save a search. Use unemployment_answers for questions about a U.S. state's unemployment benefits. Share its guide link and agency link exactly as given, and for a covered state, say the answer comes from our checked guide and give its checked date.",
      "tools": [
        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search live jobs on the 27 Locate Jobs Network job boards: Diversity Careers, Healthcare Jobs for Veterans, Nature Jobs, University Fundraising Jobs, Fiber Optic Jobs, Certified Medical Assistant Jobs, Forklift Jobs, HR Analyst Jobs, The Trades Jobs, IT Jobs, Optometry Jobs, Dentist Jobs, Funeral Service Jobs, Chiropractor Jobs, Veterinarian Jobs, SLP Jobs, Diversity Higher Education Jobs, Minority Finance Jobs, Bioinformatics Jobs, Minority Jobs, Physical Therapist Jobs, Nurse Practitioner Jobs, Arborist Jobs, Social Worker Jobs, Paralegal Careers, LPN Jobs, and Medical Lab Jobs. Search by role or skill, by place (a city and state, a state, or a ZIP code, which searches its whole state), or for remote jobs. Returns 5 to 10 current jobs with title, employer, location, posted date, and a link to the job page on the board that lists it, plus a link to see more. It only reads job listings: it cannot apply for a job, post a job, or save a search.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "How many jobs to return, 5 to 10. Defaults to 10.",
                "type": "number"
              },
              "remote": {
                "description": "true for remote jobs only.",
                "type": "boolean"
              },
              "what": {
                "description": "The role or skill, such as \"dental hygienist\", \"forklift\", or \"payroll\". Every word must appear in the job title or the employer's name, so keep it to the words a title uses (\"help desk\", not \"IT help desk support role\"). Leave out to list the newest jobs.",
                "maxLength": 1000,
                "type": "string"
              },
              "where": {
                "description": "A city with its state (\"Columbus, OH\"), a state, a ZIP code (searches its whole state), or \"remote\". Leave out for the whole U.S.",
                "maxLength": 400,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "jobs": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "employer": {
                      "type": "string"
                    },
                    "location": {
                      "description": "City and state, a state, or Remote.",
                      "type": "string"
                    },
                    "postedDate": {
                      "description": "YYYY-MM-DD.",
                      "type": "string"
                    },
                    "site": {
                      "description": "The board the job page is on.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "The job page on our board. Share it as given.",
                      "type": "string"
                    }
                  },
                  "required": ["employer", "location", "postedDate", "site", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "searched": {
                "additionalProperties": false,
                "properties": {
                  "remote": {
                    "type": "boolean"
                  },
                  "what": {
                    "type": ["string", "null"]
                  },
                  "where": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["remote", "what", "where"],
                "type": "object"
              },
              "seeMoreUrl": {
                "description": "Our search page with more jobs like these.",
                "type": "string"
              }
            },
            "required": ["jobs", "searched", "seeMoreUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:4e7b8f5695b798dba3b89dc57a47d0ea660e1a2b89d11751346692c27ab60e59"
        },
        {
          "name": "unemployment_answers",
          "title": "Unemployment benefit answers",
          "description": "A checked answer about unemployment benefits for a U.S. state, covering Alabama, Arizona, Idaho, Indiana, Louisiana, Massachusetts, Minnesota, New Jersey, New York, Pennsylvania, South Carolina, Texas, and Utah. Give a state (a name or 2-letter code) and either a topic or the person's own question; the tool picks the topic from the question when none is given. For a state we do not cover yet, it names the federal page that finds that state's own unemployment office instead of guessing at a figure. It only reads a checked guide: it cannot file a claim, check a claim's status, or change anyone's benefits.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "question": {
                "description": "The person's own question, used to pick a topic when none is given.",
                "maxLength": 1500,
                "type": "string"
              },
              "state": {
                "description": "A U.S. state, by name or 2-letter code, such as \"Texas\" or \"TX\".",
                "type": "string"
              },
              "topic": {
                "description": "One of the 13 topics: \"home\" (An overview: how to apply and what it pays.), \"eligibility\" (Who qualifies for unemployment benefits.), \"apply\" (How to file an unemployment claim.), \"amounts\" (How much it pays each week.), \"duration\" (How many weeks benefits last.), \"weekly-claims\" (Requesting payment and work search each week.), \"jobs\" (The state's own job search and job bank.), \"appeals\" (Denials, appeals, and overpayments.), \"taxes\" (How unemployment benefits are taxed.), \"disability\" (Disability benefits (SSDI, SSI) and how they relate to unemployment.), \"offices\" (The agency's offices and phone numbers.), \"contact\" (Who to contact about a specific claim.), \"faq\" (Common questions that cross several topics.). Leave out to pick the topic from the question instead.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "action": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["label", "url"],
                "type": "object"
              },
              "agency": {
                "additionalProperties": false,
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "answer": {
                "type": "string"
              },
              "call": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "phone": {
                    "type": "string"
                  }
                },
                "required": ["label", "phone"],
                "type": "object"
              },
              "code": {
                "type": ["string", "null"]
              },
              "covered": {
                "type": "boolean"
              },
              "federalFinderUrl": {
                "type": "string"
              },
              "guideUrl": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "otherTopics": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "checked": {
                      "description": "YYYY-MM-DD.",
                      "type": "string"
                    },
                    "publisher": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["checked", "publisher", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "state": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "topic": {
                "type": "string"
              },
              "updated": {
                "type": "string"
              }
            },
            "required": ["code", "covered", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Unemployment benefit answers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:d1b99f21769a64cf51799502032e5d75a6f04b3c0eb08d6056853f3499ef2092"
        }
      ],
      "digest": "sha256:d1f807fe6bd2af19b83610058ba4d85565fd8a07a7b61609fbe3f5c5ff200f46"
    }
  }
}
