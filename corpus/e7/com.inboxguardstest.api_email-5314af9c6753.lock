    "com.inboxguardstest.api/email": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.inboxguardstest.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "inboxguards-email",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "InboxGuards Email Check: check an email address before sending. Use validate_email (free, offline syntax) and pricing (free) first, then check_email_address for MX, disposable, role-account and free-provider flags with an ok/risky/undeliverable verdict. email_fix_plan returns the exact SPF, DKIM and DMARC records a domain should publish, with steps for its DNS host. No SMTP probe is made and nothing is stored. Payment is x402 USDC on Base in _meta['x402/payment']; invalid or failed calls are not charged.",
      "tools": [
        {
          "name": "check_email_address",
          "description": "Check one email address before you send to it: syntax, whether the domain accepts mail (MX, null MX or implicit A record), a disposable-domain flag (public CC0 list of about 9,900 domains), a role-account flag (info@, support@, noreply@...) and a free-provider flag. Returns a verdict of ok, risky or undeliverable with plain reasons. Use validate_email first if you only need syntax. No SMTP probe is made and no mail is sent, so it cannot confirm the mailbox exists. The address is not stored or logged. Read-only; one live DNS lookup via Cloudflare DoH. Costs $0.005 USDC per call via x402 (payment goes in _meta[\"x402/payment\"]); invalid input or a DNS failure returns an error and is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "Email address to check, e.g. jane@example.com",
                "maxLength": 320,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.005
          },
          "digest": "sha256:2b4cf5ade0e4bd26a00740dd1a34b1342f843816c0a919e2f62fb1f871484f76"
        },
        {
          "name": "email_fix_plan",
          "description": "Get an email security fix plan for one domain: the exact SPF, DKIM and DMARC DNS records to publish (create / replace / keep, record name, value and why), in order, plus click-path steps for the domain's DNS host (Cloudflare, GoDaddy, Route 53, Namecheap, Squarespace/Google, Vercel and others). Reads live MX, NS, SPF, DKIM and DMARC; detects Google Workspace, Microsoft 365, Zoho, Proton, Fastmail, GoDaddy and Cloudflare Email Routing; merges SPF within the 10-lookup limit, keeps existing senders, and stages DMARC none -> quarantine -> reject. Domains that send no mail get a lock-down set. Use it when mail lands in spam, before a DMARC rollout, or for a client. DKIM keys are generated by the mail provider, so for those it gives the exact console path. Read-only; nothing is stored. Costs $1 USDC per call via x402 (payment goes in _meta[\"x402/payment\"]); invalid input, an unknown domain or a DNS failure returns an error and is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Domain to fix, e.g. example.com (an email address or URL on it also works)",
                "maxLength": 320,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 1
          },
          "digest": "sha256:e89343bc80d0815727a274ea18eea47f4b9dcc4c5d42fc73035334cd9dc5da58"
        },
        {
          "name": "pricing",
          "description": "Free. Return the price of check_email_address (and of the HTTP-only email test report), the payment network (Base) and the receiving address. No input, no network request, no payment.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Prices (free)"
          },
          "behavior": {
