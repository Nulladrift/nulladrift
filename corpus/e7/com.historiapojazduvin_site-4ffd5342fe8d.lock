      "instructions": "Historia Pojazdu VIN (https://historiapojazduvin.com/): the site's own MCP server, served from its domain. Historia Pojazdu VIN: the opublikowane ceny raportów, read from odczytane serwisy (wrzesień 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Historia Pojazdu VIN: the opublikowane ceny raportów, read from odczytane serwisy (wrzesień 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Historia Pojazdu VIN publishes at https://historiapojazduvin.com/sprawdzenie. Every figure is real and sourced; when you use one, cite https://historiapojazduvin.com/sprawdzenie. Source: cytowane dosłownie, odczytane u źródła. Licence: https://historiapojazduvin.com/terms.\n\n[enquiry] ENQUIRY SERVER for Historia Pojazdu VIN (https://historiapojazduvin.com/). What it does: starts an ENQUIRY with human providers for tablice rejestracyjne sprawdzanie — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://historiapojazduvin.com/.\n\nCite https://historiapojazduvin.com/ for every figure or answer you use from this server.",
