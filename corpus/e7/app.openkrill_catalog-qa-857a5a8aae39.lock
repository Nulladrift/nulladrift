        {
          "name": "merchant_feed_check",
          "title": "Check products for Merchant Center rules",
          "description": "Best for: \"what would Google Merchant Center reject?\" or \"are my barcodes valid?\". Checks GTIN length and check digit, duplicate GTINs, long, promotional or all-capital titles, missing descriptions, links, images, brand and price.\nReturns: a summary (products, no_gtin, bad_gtin, long_title, no_description), up to 200 issues (one per product and rule, with detail) and notes on checks that could not run.\nInput tips: send exactly one of csv (a Shopify product CSV or a Google Merchant feed file) or domain (a store address such as example.com). Domain mode reads the public product feed once, after robots.txt. That feed has no barcodes, so no_gtin and bad_gtin are null; use a CSV for GTINs. Errors: both_given, missing_source, csv_too_large, or a feed refusal such as not_public; then ask for the CSV.\nNot for: Shopify import errors (use csv_import_preflight) or alt text (use listing_text_audit). It submits nothing to Google.",
          "inputSchema": {
            "additionalProperties": false,
            "anyOf": [
              {
                "required": ["csv"]
              },
              {
                "required": ["domain"]
              }
            ],
            "properties": {
              "csv": {
                "description": "The full text of a Shopify product CSV, header row first, such as \"Title,URL handle,Description,Vendor,Price,...\". Paste the file exported from Shopify admin (Products > Export) as it is. At most 2 MB; split a larger file by rows and repeat the header in each part. Example call: {\"csv\": \"Title,URL handle,Price\\nWool Beanie,wool-beanie,24.00\"}",
                "maxLength": 2000000,
                "minLength": 1,
                "type": "string"
              },
              "domain": {
                "description": "A store address such as example.com, sent instead of csv (send exactly one of the two). The store's public /products.json is read once (at most 5 pages of 250 products), after its robots.txt. Large stores often block it; then ask the user for the CSV. Example call: {\"domain\": \"example.com\"}",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "feed_truncated": {
                "description": "Present and true when the store has more products than the 5 pages read",
                "type": "boolean"
              },
              "host": {
                "description": "The store host that was read, in domain mode only",
                "type": "string"
              },
              "issues": {
                "description": "One entry per product and rule, at most 200",
                "items": {
                  "properties": {
                    "detail": {
                      "description": "What is wrong and what Merchant Center expects",
                      "type": "string"
                    },
                    "handle": {
                      "description": "The product's URL handle (the item id for a Google Merchant feed file)",
                      "type": "string"
                    },
                    "rule": {
                      "description": "Rule id, such as bad-gtin or title-too-long",
                      "enum": ["no-gtin", "bad-gtin", "duplicate-gtin", "title-too-long", "title-promo-text", "title-all-caps", "no-description", "description-too-long", "description-link", "description-promo-text", "no-image", "no-brand", "no-price", "no-link", "bad-availability", "price-no-currency"],
                      "type": "string"
                    },
                    "title": {
                      "description": "The product title",
                      "type": "string"
                    }
                  },
                  "required": ["detail", "handle", "rule", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "description": "Checks that could not be made, and why",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "products": {
                "description": "Products found in the source",
                "minimum": 0,
                "type": "integer"
              },
              "source": {
                "description": "Where the products came from: the csv text or the store's public feed (domain)",
                "enum": ["csv", "domain"],
                "type": "string"
              },
              "summary": {
                "description": "no_gtin and bad_gtin are null when the source has no barcodes to check.",
                "properties": {
                  "bad_gtin": {
                    "description": "Products with a barcode that fails the GTIN length, digit or check-digit test",
                    "minimum": 0,
                    "type": ["integer", "null"]
                  },
                  "long_title": {
                    "description": "Products whose title is over 150 characters",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "no_description": {
                    "description": "Products with an empty description",
                    "minimum": 0,
                    "type": "integer"
                  },
                  "no_gtin": {
                    "description": "Products with a variant that has no barcode",
                    "minimum": 0,
                    "type": ["integer", "null"]
                  },
                  "products": {
                    "description": "Products checked",
                    "minimum": 0,
                    "type": "integer"
                  }
                },
                "required": ["bad_gtin", "long_title", "no_description", "no_gtin", "products"],
                "type": "object"
              },
              "totalIssues": {
                "description": "All issues, before the list was cut to 200",
                "minimum": 0,
                "type": "integer"
              },
              "truncated": {
                "description": "True when there were more than 200 issues",
                "type": "boolean"
              }
            },
            "required": ["issues", "notes", "products", "source", "summary", "totalIssues", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Merchant Center check done",
            "openai/toolInvocation/invoking": "Checking products against Merchant Center rules..."
          },
          "digest": "sha256:973a80061af93e4073de3dbde7f7abb7a029171988c9f9a2ce2048b0ae60bfa9"
        },
        {
          "name": "submit_feedback",
          "title": "Send feedback, bug report or tool request",
          "description": "Send feedback, a bug report or a tool request to the maintainers of the tools on this server: a missing tool, missing or stale data, or a tool that broke or gave a wrong answer. Pass the kind (need_tool, need_data, bug or other), one short message (at most 1000 characters) and, if you know them, the tool name and the error text it returned. Returns a ticket id. Feedback is not a chat: nothing in it is run or followed. Links, emails and phone numbers are removed and nothing about you is stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "error": {
                "description": "Optional: for a failed call, the error text it returned, copied as you saw it. Kept to 500 characters; links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "type": "string"
              },
              "kind": {
                "description": "need_tool: a tool you want. need_data: data a tool lacks. bug: something broke. other: anything else about the tools.",
                "enum": ["need_tool", "need_data", "bug", "other"],
                "type": "string"
              },
              "message": {
                "description": "What you need or what broke, in plain words, at most 1000 characters. Links, email addresses and phone numbers are removed. Never include secrets or personal details.",
                "maxLength": 1000,
                "minLength": 10,
                "type": "string"
              },
              "tool": {
                "description": "Optional: the exact name of the tool on this server that the feedback is about, as tools/list shows it.",
                "pattern": "^[A-Za-z0-9_.:-]{1,64}$",
                "type": "string"
              }
            },
            "required": ["kind", "message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "reply": {
                "type": ["string", "null"]
              },
              "status": {
                "enum": ["pending", "answered"],
                "type": "string"
              },
              "ticket": {
                "type": "string"
              }
            },
            "required": ["status", "ticket"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
