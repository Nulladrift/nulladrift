      "instructions": "Dom Kozak's knowledge server. It holds two things, both published material only: the Built for MENA podcast hosted by Dom Kozak (every aired episode, transcribed from the published audio: conversations with advertising and adtech leaders in the Middle East and North Africa) and Dom Kozak's pDOOH 101 and 201 lessons on programmatic digital out of home (every released lesson, transcribed from the published videos). Always attribute a quote: name the speaker when one is given, and give the episode or lesson title with its link (and the timestamp for podcast quotes). When the speaker is not confirmed, cite the episode and do not attribute the words to a person. If a tool returns no results, say so; never invent quotes.",
      "tools": [
        {
          "name": "explain_pdooh",
          "title": "Explain a pDOOH concept from Dom Kozak's lessons",
          "description": "Plain-English explanations of programmatic digital out of home (pDOOH) from Dom Kozak's released\npDOOH 101 and 201 lessons. Returns up to `limit` (max 10) passages with series (101/201), episode,\nlesson title, hook, airDate, the relevant lesson text and the lesson URL on domkozak.com.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 3,
                "title": "Limit",
                "type": "integer"
              },
              "topic": {
                "title": "Topic",
                "type": "string"
              }
            },
            "required": ["topic"],
            "title": "explain_pdoohArguments",
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:091c6b3a30d54af2a4240c73ba14a00e2228b018da04c04433e2b6c35ee602b2"
        },
        {
          "name": "get_episode",
          "title": "Get one Built for MENA episode",
          "description": "One Built for MENA episode by number (e.g. \"10\") or \"special\" for The Story So Far: title, guest,\ncompany, date, length, link, and up to 5 key passages (about 120 words each) in order. Never the full\ntranscript: use search_podcast to find specific quotes.",
          "inputSchema": {
