  "subjects": {
    "ai.bithuman/characters": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bithuman.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bithuman",
        "title": "bitHuman",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "bitHuman makes its own animated house characters talk. Call list_characters to see who is available. make_character_video: one character says the exact words you give (up to 200 characters, about 15 seconds) in a short clip that plays inline. To hold a conversation in character, write each reply yourself and call make_character_video for it. talk_to_character: opens a live voice conversation with one character in a small player (up to a minute). Only the listed house characters can speak; real people, photos and custom voices are not supported here.",
      "tools": [
        {
          "name": "list_characters",
          "title": "List characters",
          "description": "List the bitHuman house characters that can speak. Each has an id (pass it as `character` to make_character_video or talk_to_character), a name, a short description, a picture URL and `talk` (true when talk_to_character is open for it). No arguments and read-only; one call per conversation is enough. Only these characters can speak: real people, photos and custom voices are not supported.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "characters": {
                "items": {
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "image_url": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "talk": {
                      "type": "boolean"
                    }
                  },
                  "required": ["description", "id", "image_url", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "make_your_own_url": {
                "type": "string"
              }
            },
            "required": ["characters"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List characters"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://bithuman/characters-v3.html",
            "openai/toolInvocation/invoked": "Characters ready",
            "openai/toolInvocation/invoking": "Looking up characters",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://bithuman/characters-v3.html"
            }
          },
          "digest": "sha256:856992e8e9c7e576715aa0a66be00b72dd361d7c04604bef8d0eda7d7ff9da05"
        },
        {
          "name": "make_character_video",
          "title": "Make character video",
          "description": "Make a short video of one bitHuman house character saying `text` word for word, in its own voice. Returns video_url (an MP4 that plays inline and expires after 7 days), duration_seconds and share_url, labelled AI character. Example: {\"character\": \"wise-pup\", \"text\": \"Welcome back! Ready for today's lesson?\"}. Limits: `text` is 3 to 200 characters and at most 19 seconds when spoken (about 15 s is typical); one video at a time per user; 10 videos per user per UTC day; the same character and text again replays the earlier clip at once. Errors come back as isError with one sentence saying what to do: an unknown character (call list_characters), text too short or too long (rewrite it), personal information such as a phone number, email or street address (remove it), busy (retry in a minute), the daily limit (try again after 00:00 UTC), resting (try later). To hold a conversation in character, write each reply yourself and call this tool once per reply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "character": {
                "description": "A character id from list_characters.",
                "enum": ["wise-pup", "pip-the-red-panda-barista", "shelly-tidewater", "gio-the-curious-giraffe-guide", "grumblewick", "bolt", "mochi", "sprocket", "rusty", "peanut", "yuki", "chef-waddles", "naps", "captain-axl", "toasty", "flicker", "mari"],
                "type": "string"
              },
              "text": {
                "description": "The exact words the character says, 3 to 200 characters (at most 19 seconds of speech). No personal information.",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["character", "text"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "character": {
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["id", "name"],
                "type": "object"
              },
              "duration_seconds": {
                "type": "number"
              },
              "label": {
                "type": "string"
              },
              "label_burned": {
                "type": "boolean"
              },
              "make_your_own_url": {
                "type": "string"
              },
              "poster_url": {
                "type": "string"
              },
              "share_text": {
                "type": "string"
              },
              "share_url": {
                "type": "string"
              },
              "talk": {
                "type": "boolean"
              },
              "video_url": {
                "type": "string"
              }
            },
            "required": ["character", "duration_seconds", "label", "make_your_own_url", "video_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Make character video"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "openai/outputTemplate": "ui://bithuman/player-v4.html",
            "openai/toolInvocation/invoked": "Clip ready",
            "openai/toolInvocation/invoking": "Recording the clip",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://bithuman/player-v4.html"
            }
          },
          "digest": "sha256:6729747dbd307096ea68b0fc762599203b5801b507b2f14e910437e4181bc3a3"
        },
        {
          "name": "talk_to_character",
          "title": "Talk to character",
          "description": "Open a live voice conversation with one bitHuman house character in a player in the chat. The user presses Start and speaks through the microphone; the character answers out loud. A conversation lasts up to 60 seconds (max_seconds), then ends by itself; call again for another. Returns session_url: when the host shows no player, give the user that link. Example: {\"character\": \"wise-pup\"}. Needs a microphone in the user's browser. Errors come back as isError: an unknown character (call list_characters and use an id whose `talk` is true), resting (live conversations are off right now; make_character_video still works).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "character": {
                "description": "A character id from list_characters.",
                "enum": ["wise-pup", "pip-the-red-panda-barista", "shelly-tidewater", "gio-the-curious-giraffe-guide", "grumblewick", "bolt", "mochi", "sprocket", "rusty", "peanut", "yuki", "chef-waddles", "naps", "captain-axl", "toasty", "flicker", "mari"],
                "type": "string"
              }
            },
            "required": ["character"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent_code": {
                "type": "string"
              },
              "character": {
                "properties": {
                  "id": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "required": ["id", "name"],
                "type": "object"
              },
              "label": {
                "type": "string"
              },
              "make_your_own_url": {
                "type": "string"
              },
              "max_seconds": {
                "type": "number"
              },
              "session_url": {
                "type": "string"
              }
            },
            "required": ["character", "label", "max_seconds", "session_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Talk to character"
          },
          "behavior": {
            "destructive": false,
