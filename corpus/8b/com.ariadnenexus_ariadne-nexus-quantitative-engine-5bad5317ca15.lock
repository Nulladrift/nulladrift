      "instructions": "Ariadne Nexus Sovereign Quant, Policy & Clearing MCP Server. Tool selection guide: (1) Use get_cusip_valuation for single-bond YTM, duration, convexity, DV01, and jump-diffusion bounds. (2) Use get_debt_radar for FINRA TRACE secondary dealer spreads/liquidity and single-CUSIP zero-cost European collar strikes. (3) Use run_portfolio_stress_test for multi-bond portfolio macro rate shocks, 99% VaR/CVaR, and 10Y Treasury futures hedging. (4) Use screen_ofac_entity for counterparty OFAC SDN sanctions screening with SHA-256 Merkle proofs. (5) Use get_sovereign_policy_brief for the weekly Federal Reserve / Treasury OFR / FinCEN macro-prudential monitor. (6) Use synthesize_regulatory_docket to draft formal APA 5 U.S.C. § 553 regulatory comment letters locally (does not auto-submit externally). (7) Free discovery & onboarding tools (calculate_clearing_fee, provision_agent_key, and redeem_checkout_session) require no authentication. Paid tools accept an API key via arguments.apiKey or HTTP header x-api-key ($10/mo EVAL_PASS available via provision_agent_key), or pay-per-call Stripe Shared Payment Tokens (arguments.paymentToken / header x-payment-token).",
      "tools": [
        {
          "name": "calculate_clearing_fee",
          "title": "Institutional RWA Clearing Take-Rate & Bridge Fee Calculator",
          "description": "Calculates institutional RWA clearing house take-rates (in basis points and USD), cross-chain settlement bridge tolls, platform SaaS subscription fees, and net annual clearing cost projections across Ariadne Nexus membership tiers. Use when: estimating monthly or annual clearing fees, basis-point take-rates, and cross-chain bridge settlement costs before syndicating an RWA vault or selecting an institutional billing tier. Do not use when: provisioning an API key or generating a live Stripe checkout session (use provision_agent_key instead), or valuing bond CUSIPs (use get_cusip_valuation instead). Behavior: Free, open-access, read-only deterministic calculator ($0.00 USD; requires no apiKey or paymentToken and performs no external network calls or billing mutations).",
          "inputSchema": {
            "properties": {
              "billing_interval": {
                "default": "monthly",
                "description": "Subscription billing cycle used to calculate platform base fee discounts (\"monthly\" or \"annual\"; default: \"monthly\").",
                "enum": ["monthly", "annual"],
                "type": "string"
              },
              "bridge_volume_usd": {
                "default": 2500000,
                "description": "Projected monthly cross-chain bridge settlement volume (Base / Solana / Tempo USDC) in USD (e.g., 2500000 for $2.5M/month; default: 2500000).",
