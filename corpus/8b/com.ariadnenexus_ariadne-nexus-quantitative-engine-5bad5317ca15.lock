              },
              "clearing_volume_usd": {
                "default": 10000000,
                "description": "Projected monthly gross RWA transaction volume settled through the clearing house in USD (e.g., 10000000 for $10M/month; default: 10000000).",
                "type": "number"
              },
              "tier": {
                "default": "QUANT_PRO",
                "description": "Institutional membership tier governing base SaaS fee and clearing take-rate bps discount (e.g., \"QUANT_PRO\", \"INSTITUTIONAL_GOLD\", \"SOVEREIGN_PRIME\"; default: \"QUANT_PRO\").",
