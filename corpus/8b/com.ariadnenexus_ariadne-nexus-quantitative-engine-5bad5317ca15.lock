        {
          "name": "get_sovereign_policy_brief",
          "title": "Weekly Sovereign Macro-Prudential & Sanctions Policy Monitor",
          "description": "Generates the Weekly Sovereign Macro-Prudential & Sanctions Monitor for Federal Reserve (FOMC / Financial Stability), U.S. Treasury (OFR / OFAC / FinCEN), and SEC DERA policy desks, combining Dual-Track monetary stability indicators (10Y-3M yield curve inversion, FINRA TRACE G-SIB credit spread dislocations, H.8 bank credit impulse) and autonomous x402 sanctions enforcement telemetry. Use when: synthesizing macro-prudential systemic risk briefings, monitoring aggregate sanctions enforcement trends, or evaluating FAR Subpart 13.2 ($9,500 GPC Micro-Purchase) policy data procurement options. Do not use when: screening a specific individual or corporate counterparty against the OFAC SDN list (use screen_ofac_entity instead), or drafting a formal APA 5 U.S.C. § 553 public comment letter for a specific agency rulemaking docket (use synthesize_regulatory_docket instead). Behavior: Read-only, deterministic intelligence report generator ($1.00 USD per call via apiKey or paymentToken; returns an x402/MPP paymentChallenge without charging if credentials are omitted).",
          "inputSchema": {
            "properties": {
              "apiKey": {
                "description": "Optional Ariadne Nexus Developer API key (\"nexus_live_...\") for authenticated execution. May also be passed via the x-api-key HTTP header.",
                "type": "string"
              },
              "include_markdown": {
                "default": true,
                "description": "When true, includes the complete publication-ready Markdown policy brief in markdown_body alongside structured JSON telemetry (default: true).",
                "type": "boolean"
              },
              "paymentToken": {
                "description": "Optional Stripe Shared Payment Token (\"spt_...\") or settled x402 payment receipt hash (\"rcpt_...\") for pay-per-call execution ($1.00 USD).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "brief_id": {
                "description": "Unique weekly policy brief identifier.",
                "type": "string"
              },
              "cadence_schedule": {
                "description": "Publication cadence schedule.",
                "type": "string"
              },
              "executive_summary": {
                "description": "High-level macro-prudential and illicit-finance synthesis.",
                "type": "string"
              },
              "generated_at": {
                "description": "ISO-8601 generation timestamp.",
                "type": "string"
              },
              "illicit_finance_track_findings": {
                "description": "Track 2 Treasury FinCEN / OFAC autonomous x402 sanctions findings.",
                "items": {
