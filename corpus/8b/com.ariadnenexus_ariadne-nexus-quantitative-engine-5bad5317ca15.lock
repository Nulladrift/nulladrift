        {
          "name": "get_debt_radar",
          "title": "FINRA TRACE Secondary Debt Tape & Single-CUSIP Collar Structuring",
          "description": "Retrieves secondary-market FINRA TRACE dealer execution metrics (last clean price % of par, Z-spread over 10Y U.S. Treasury in bps, effective yield-to-worst %, dealer bid-ask spread in bps, and daily institutional block volume in USD) and solves a Black-Scholes zero-cost 1-year European option collar (put floor strike % and call cap strike %) for a single bond CUSIP or ticker. Use when: inspecting secondary-market dealer liquidity/spreads or structuring a zero-cost downside put / upside call collar for a single bond issue. Do not use when: calculating exact cashflow duration/convexity/DV01 for a custom face value (use get_cusip_valuation instead), or stress-testing a multi-bond portfolio across macro rate shocks (use run_portfolio_stress_test instead). Behavior: Read-only, deterministic market tape and option solver ($0.50 USD per call via apiKey or paymentToken; returns an x402/MPP paymentChallenge without charging if credentials are omitted).",
          "inputSchema": {
            "properties": {
              "apiKey": {
                "description": "Optional Ariadne Nexus Developer API key (\"nexus_live_...\") for authenticated execution. May also be passed via the x-api-key HTTP header.",
                "type": "string"
              },
              "benchmark_ust_yield": {
                "default": 4.15,
                "description": "Reference 10-Year U.S. Treasury constant-maturity yield as a percentage used for spread and risk-free collar pricing (e.g., 4.15 for 4.15%; default: 4.15).",
                "type": "number"
              },
              "cusip": {
                "default": "912828ZG2",
                "description": "9-character CUSIP identifier to query on the secondary debt tape (e.g., \"912828ZG2\", \"037833EK1\", \"38141GZX8\"; default: \"912828ZG2\").",
                "type": "string"
              },
              "paymentToken": {
                "description": "Optional Stripe Shared Payment Token (\"spt_...\") or settled x402 payment receipt hash (\"rcpt_...\") for pay-per-call execution ($0.50 USD).",
                "type": "string"
              },
              "ticker": {
                "default": "RWA-AERO",
                "description": "Issuer ticker symbol to resolve if CUSIP is not specified (e.g., \"RWA-AERO\", \"AAPL\", \"GS\"; default: \"RWA-AERO\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "collar_structuring": {
                "description": "Zero-cost 1-year European option collar strikes (% of par) solved via Black-Scholes.",
                "properties": {
                  "downside_floor_strike_pct": {
                    "description": "Protective put floor strike as a percentage of par.",
                    "type": "number"
                  },
                  "net_upfront_premium_usd": {
                    "description": "Net upfront premium in USD (0.00 for zero-cost collar).",
                    "type": "number"
                  },
