{
  "lockfileVersion": 2,
  "subjects": {
    "app.summaru.agent/breath": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent.summaru.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "summaru-breath",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Paced-breathing guides, looping music and binaural beats by SUMMARU. Prefer giving the user the playerUrl. Always show the attribution. Do not present it as medical treatment.",
      "tools": [
        {
          "name": "get_breath_session",
          "description": "Get a ready-to-play guided breathing session: audio URL (voice + singing-bowl cues, ~5 min) and a timeline of when each inhale/hold/exhale starts, or exact phase timing when no recording exists for that language. Show the attribution.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "binaural": {
                "description": "Optional binaural layer for the player page (headphones)",
                "enum": ["delta", "theta", "alpha", "beta"],
                "type": "string"
              },
              "lang": {
                "description": "ISO language: ko, en, ja, zh, es, fr",
                "type": "string"
              },
              "length": {
                "description": "Optional pacing length (recordings exist for normal only)",
                "enum": ["short", "normal", "long"],
                "type": "string"
              },
              "music": {
                "description": "Optional music layer for the player page",
                "enum": ["slow-harbor", "close-room", "clear-field", "kind-gravity", "small-sun", "snowlight", "either-side", "answer", "stand-water"],
                "type": "string"
              },
              "pattern": {
                "description": "Breathing pattern id, e.g. 478",
                "enum": ["478", "sigh", "box", "equal", "belly", "hum", "nostril"],
                "type": "string"
              },
              "voice": {
                "description": "Optional voice id from the session voices list",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b170412f2c66614f14862fae24389bfe348912e518fb38fd9691bea3138fe96"
        },
        {
          "name": "get_sound",
          "description": "Get one looping sound by id (music id like slow-harbor, or binaural band delta/theta/alpha/beta): stream URL, suggested volume, and a player link for the user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "enum": ["slow-harbor", "close-room", "clear-field", "kind-gravity", "small-sun", "snowlight", "either-side", "answer", "stand-water", "delta", "theta", "alpha", "beta"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d2f0e21c6ff0496851913f223ba889743b051fb281d6ec09d7841886bc503b9"
        },
        {
          "name": "list_breath_patterns",
          "description": "List SUMMARU paced-breathing patterns with exact phase timing (seconds) and which languages have recorded voice guides.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c6b5d440179ac53d5ca656e8aaa8867f1bfbb7f4ff22eae198d585a6291484bc"
        },
        {
          "name": "list_sounds",
          "description": "List SUMMARU looping music tracks (sleep, calm, focus, warmth, bright, stillness, singing bowl) and binaural beat bands, each with a stream URL and a player link. Show the attribution.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Optional filter",
                "enum": ["music", "binaural"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:943ebe2759b889d2fa73b20072f0a01b7e674286075cfdeb404ef9717993584d"
        }
      ],
      "digest": "sha256:226964d8184f2df24cebd3254974d39679215618d57dde6898c0ef06cd209057"
    }
  }
}
