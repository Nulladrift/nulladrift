                "type": "string"
              }
            },
            "required": ["template_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              },
              "status": {
                "description": "\"queued\" once generation has started.",
                "type": "string"
              },
              "web_url": {
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["job_id", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
