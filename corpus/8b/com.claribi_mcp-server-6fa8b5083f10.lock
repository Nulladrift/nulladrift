        {
          "name": "get_forecast_trust",
          "description": "Returns per-past-run accuracy for a forecast. Each row compares a prior run's projection against the actuals that have materialized since. Use this to see whether your forecasts have been getting MORE or LESS accurate over time, or to spot when a backtest sMAPE was systematically optimistic vs. realised performance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "forecast_id": {
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["forecast_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "runs": {
                "description": "Per-past-run accuracy ordered oldest-first. Each row compares one prior run's forecast against actuals that have since materialized.",
                "items": {
                  "properties": {
                    "created_at": {
                      "format": "date-time",
                      "type": ["string", "null"]
                    },
                    "horizon": {
                      "type": "integer"
                    },
                    "method": {
                      "type": ["string", "null"]
                    },
                    "observed_count": {
                      "description": "How many of the forecast points now have an actual observation to compare against.",
                      "type": "integer"
                    },
                    "run_id": {
                      "format": "uuid",
                      "type": "string"
                    },
                    "smape_actual": {
                      "description": "sMAPE between the run's forecast and what actually happened. Lower is better; [0, 200].",
                      "type": "number"
                    },
                    "smape_backtest": {
                      "description": "The run's own backtest sMAPE at the time it was generated. Compare against actual to spot drift over time.",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["runs"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
