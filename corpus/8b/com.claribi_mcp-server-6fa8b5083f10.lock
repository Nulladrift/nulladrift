              },
              "connection_id": {
                "type": ["string", "null"]
              },
              "created_at": {
                "format": "date-time",
                "type": ["string", "null"]
              },
              "data_source_id": {
                "description": "The created data source, present once status is \"connected\".",
                "type": ["string", "null"]
              },
              "error": {
