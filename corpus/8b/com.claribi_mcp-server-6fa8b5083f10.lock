        {
          "name": "get_forecast_run",
          "description": "Fetch one run of a forecast by ID, or pass run_id=\"latest\" for the most recent run. Returns the full forecast envelope: target series + 30-day projection, correlated drivers (with lag and bootstrap stability), anomalies, structural changes, and credit accounting.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "forecast_id": {
                "format": "uuid",
                "type": "string"
              },
              "run_id": {
                "description": "UUID of the run. Pass 'latest' to fetch the most recent run for the forecast.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["forecast_id", "run_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "completed_at": {
                "format": "date-time",
                "type": ["string", "null"]
              },
              "created_at": {
                "format": "date-time",
                "type": ["string", "null"]
              },
