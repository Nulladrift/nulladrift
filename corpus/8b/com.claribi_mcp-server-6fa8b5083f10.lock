                "type": "integer"
              },
              "credits_refunded": {
                "type": "integer"
              },
              "duration_ms": {
                "type": "integer"
              },
              "error_message": {
                "type": "string"
              },
              "forecast_id": {
                "format": "uuid",
                "type": "string"
              },
              "id": {
                "format": "uuid",
                "type": "string"
              },
              "narration": {
                "description": "Peer of result.narration for convenience. Null when the run pre-dates narration OR was gated out (insufficient credits, org disabled, etc.).",
                "type": ["object", "null"]
              },
              "result": {
                "description": "Forecast envelope. Contains keys: target, correlations, anomalies, changepoints, meta, and (when narration ran) narration. `target` carries lower/upper plus calibrated lower_50/upper_50, lower_80/upper_80, lower_95/upper_95 bands, the winning method, exogenous_driver when a leading-indicator was used, ensemble_components when the ensemble method won, transform applied, and non_negative flag. See docs/MCP_SERVER.md for the shape.",
                "type": "object"
              },
              "status": {
                "type": "string"
              },
              "trigger": {
                "type": "string"
              }
            },
            "required": ["forecast_id", "id", "status"],
