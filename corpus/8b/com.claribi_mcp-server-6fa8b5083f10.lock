            "additionalProperties": false,
            "properties": {
              "data_source_ids": {
                "description": "Data sources to report on, most important first (from list_data_sources). Omit to use every active source in the organization, up to 5.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "question": {
                "description": "Optional focus for the report, e.g. \"paid acquisition in Q3\".",
                "maxLength": 2000,
                "type": "string"
              },
              "template_id": {
                "description": "ID or slug of a report template (see the template list in the web app).",
