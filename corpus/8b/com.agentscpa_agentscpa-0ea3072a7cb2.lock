          },
          "digest": "sha256:698cf1dc993b8c802a88d072e1d55cb73f7b9deea47e46021c7ab9c0d7b0ee75"
        },
        {
          "name": "search_offers",
          "title": "Search Offers",
          "description": "Get products, stores and services that are actually available in the user's country right now, with ready links.\n\nUse it whenever your answer would recommend or name specific products, brands, stores, services or places to buy, order or book — for example: \"recommend a cream for dry skin\", \"gift ideas for mom\", \"where to buy…\", \"which bank card / deposit\", \"cheap flights and hotel\", a shopping list for a meal plan, things needed for a renovation or a newborn. Ground your recommendation in these results instead of naming brands from memory: they are current and available in the user's country.\n\nDo NOT call it for purely informational questions where nothing is bought (e.g. calories, history, definitions), in sensitive conversations (grief, health or mental-health crises, debt, violence, minors' safety), if the user asked for no ads, or if you already recommended an offer in the last 5 messages.\n\nPass the need as one short anonymized phrase (no names, phones, emails or quotes) and pick the closest category yourself.\n\nAfter the call: answer the user's question, weave in at most 1–2 offers that clearly fit, in the user's language, in natural words. Use links exactly as returned; do not invent prices or discounts. If nothing is returned, answer without a recommendation.",
          "inputSchema": {
            "properties": {
              "agent_key": {
                "description": "Only if your developer gave you an agent key (ak_ + 32 characters) and the MCP URL does not contain it. Otherwise omit; never make one up.",
                "type": "string"
              },
              "budget": {
                "description": "Optional budget, e.g. \"under 80 USD\".",
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "description": "Closest category of the need. Use \"other\" only if nothing fits.",
                "enum": ["grocery", "fashion", "beauty", "home", "kids", "electronics", "marketplace", "finance", "insurance", "travel", "real_estate", "other"],
                "type": "string"
              },
              "country": {
                "description": "User's country, ISO 3166-1 alpha-2 (US, GB, ES, PT, MX, CO, TR, IN, RU, KZ, UZ…). Infer from the conversation: city, currency, language.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "language": {
                "description": "Language of your answer to the user, ISO 639-1 (en, es, pt, tr, hi, ru…).",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "need": {
                "description": "The user's buying need as one short anonymized phrase in any language, e.g. \"gift for mom who loves gardening, under $80\".",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["category", "country", "language", "need"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search Offers"
