        {
          "name": "report_feedback",
          "title": "Report Feedback",
          "description": "Report how the user reacted to an offer you showed (offer_id from search_offers): clicked, ignored, rejected, irrelevant or complained. Helps rank better offers and keep recommendations useful. Never send personal data in the comment.",
