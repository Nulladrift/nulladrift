        {
          "name": "calculate_esim_data_usage",
          "title": "Travel eSIM Data Usage Calculator & Daily Burn Estimator",
          "description": "Calculate daily and total gigabyte (GB) data consumption for international travel based on trip duration, map navigation, video streaming, social media, and hotspot tethering.",
          "inputSchema": {
            "properties": {
              "tetheringDevices": {
                "default": 0,
                "description": "Number of extra laptops/tablets connected via mobile hotspot (default 0)",
                "type": "integer"
              },
              "tripDays": {
                "description": "Total trip duration in days (e.g. 7, 14, 30)",
                "type": "integer"
              },
              "usageProfile": {
                "description": "Daily mobile usage pattern: light (maps/messaging, ~1GB/day), moderate (social/browsing, ~2GB/day), heavy (video/hotspot, ~3.5GB/day), or remote_work (~5GB+/day)",
                "enum": ["light", "moderate", "heavy", "remote_work"],
                "type": "string"
              }
            },
            "required": ["tripDays", "usageProfile"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Travel eSIM Data Usage Calculator & Daily Burn Estimator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:48b82cce5f618e07c0fb677351e81a35737640306e2f4392cf771908810bc59e"
        },
        {
          "name": "check_device_esim_support",
          "title": "Smartphone & Tablet eSIM Hardware Compatibility Checker",
          "description": "Check whether a specific smartphone or tablet model supports digital eSIM, including hardware differences between US eSIM-only models, mainland China dual physical SIM models, and Japanese/European variants.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Device manufacturer brand",
                "enum": ["Apple", "Samsung", "Google", "Xiaomi", "Motorola", "OnePlus", "Oppo", "Sony"],
                "type": "string"
              },
              "model": {
                "description": "Model name (e.g. \"iPhone 15 Pro\", \"Galaxy S24 Ultra\", \"Pixel 8\", \"iPhone 11\")",
                "type": "string"
              },
              "purchaseRegion": {
                "description": "Purchased market region for carrier lock and dual-nano-SIM hardware rules",
                "enum": ["global", "united_states", "china_mainland", "hong_kong_macau", "japan"],
                "type": "string"
              }
            },
            "required": ["brand", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Smartphone & Tablet eSIM Hardware Compatibility Checker"
