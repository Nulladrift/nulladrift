        {
          "name": "search_ai_training_jobs",
          "title": "Search open AI training jobs",
          "description": "Search open AI training, RLHF, evaluation, annotation and expert-data roles across platforms' public job boards, best-paid first. Returns title, platform, field, places, stated pay and a link to each role.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "A country the role must be open to (roles open worldwide count too).",
                "type": "string"
              },
              "field": {
                "description": "A field id or label, e.g. 'medicine', 'law', 'coding', 'languages'. Use list_platforms_and_fields for ids.",
                "type": "string"
              },
              "language": {
                "description": "A language the role works in, e.g. 'Spanish'.",
                "type": "string"
              },
              "limit": {
                "description": "How many roles to return, 1-25.",
                "type": "number"
              },
              "min_hourly": {
                "description": "Minimum hourly pay in USD (top of the listed range).",
                "type": "number"
              },
              "platform": {
                "description": "A platform name, e.g. 'Mercor', 'Handshake AI', 'Outlier'.",
                "type": "string"
              },
              "query": {
                "description": "Words that must appear in the role title, e.g. 'nurse', 'python', 'spanish'.",
                "type": "string"
              },
              "remote_only": {
                "description": "Leave out on-site roles.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
