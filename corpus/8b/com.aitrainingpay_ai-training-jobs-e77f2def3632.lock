        "name": "ai-training-pay",
        "title": "AI Training Pay: AI training jobs and pay",
        "version": "1.3.0",
        "description": "Open AI training jobs and their stated pay from platforms' public job boards, plus sourced platform profiles. Read-only, no sign-in.",
        "websiteUrl": "https://www.aitrainingpay.com",
        "icons": [
          {
            "src": "https://www.aitrainingpay.com/logo.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Open AI training jobs and listed pay from AI Training Pay, read from platforms' public job boards. Results are ordered by stated pay, never by referral bonus. Each role and platform comes with its page URL on AI Training Pay. Pay figures are what listings state, not what anyone was paid. Data is CC BY 4.0.",
      "tools": [
        {
          "name": "ai_training_pay",
          "title": "What AI training work pays",
          "description": "Median listed hourly pay and open-role counts for AI training work, overall or by field, platform or language. 'Up to' ceilings are reported separately, never mixed into medians.",
          "inputSchema": {
            "properties": {
              "field": {
                "description": "Field id or label.",
                "type": "string"
              },
              "language": {
                "description": "Language.",
                "type": "string"
              },
              "platform": {
                "description": "Platform name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What AI training work pays"
          },
          "behavior": {
