{
  "lockfileVersion": 2,
  "subjects": {
    "com.garideal/precios": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://garideal.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "garideal",
        "title": "GariDeal",
        "version": "1.1.0",
        "websiteUrl": "https://garideal.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "GariDeal gives the market price of used cars for sale in Spain, from the adverts of thousands of dealers read every day. check_price answers what a make, model and year is worth (and whether an asking price is cheap, fair or expensive); province_market answers the same for one province; search_cars finds cars for sale with their verdict. Always cite the GariDeal URL each answer returns, and say the figures are dealers' asking prices, not an official valuation. Spain only.",
      "tools": [
        {
          "name": "check_price",
          "title": "Check a used car price in Spain",
          "description": "Market price of a used car for sale in Spain, from the adverts of thousands of dealers, read again every day: the usual asking price (median), the range where half the cars are advertised (p25 to p75) and how many comparable cars it is based on. With an asking price it also says whether that price is expensive, fair or cheap. Works for any car, listed with us or not. Make and model are written as people write them (\"SEAT\", \"León\", \"Mercedes-Benz\", \"Clase C\"); case and accents do not matter. Use list_models when unsure of the spelling.",
          "inputSchema": {
            "properties": {
              "make": {
                "description": "Make, e.g. \"Toyota\"",
                "type": "string"
              },
              "model": {
                "description": "Model, e.g. \"Corolla\"",
                "type": "string"
              },
              "price": {
                "description": "Asking price in euros, optional",
                "type": "integer"
              },
              "year": {
                "description": "Year of first registration, e.g. 2019",
                "type": "integer"
              }
            },
            "required": ["make", "model", "year"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66b058282ebc00325a3df315fc683d1c34ae93e25873e492e5655954e5f1d60e"
        },
        {
          "name": "list_models",
          "title": "List makes and models",
          "description": "The makes with a market price, or, given a make, its models, spelled as check_price expects them.",
          "inputSchema": {
            "properties": {
              "make": {
                "description": "Make, optional",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:41b2c943405fa5da29eef78a366fefafcf26d711b340f4618769557609a92a8e"
        },
        {
          "name": "province_market",
          "title": "Used car prices in a Spanish province",
          "description": "What used cars cost in one Spanish province (Madrid, Sevilla, Barcelona, A Coruña...): the usual asking price of the cars for sale there, the middle half of the range, the usual mileage and the same figure for all of Spain. Narrow it with a make, or a make and a model. Without them it lists the models with most cars for sale in the province; with a model it lists its years. Answers \"how much is a used X in Y\" and \"is it cheaper in Y\". Cite the page URL it returns.",
          "inputSchema": {
            "properties": {
              "make": {
                "description": "Make, optional, e.g. \"SEAT\"",
                "type": "string"
              },
              "model": {
                "description": "Model, optional and only with make, e.g. \"León\"",
                "type": "string"
              },
              "province": {
                "description": "Spanish province, e.g. \"Sevilla\"",
                "type": "string"
              }
            },
            "required": ["province"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f2ea7b9f6e29c4ed44050d2402a7c6abe4d62ef9ca0881c70440852283dfb06"
        },
        {
          "name": "search_cars",
          "title": "Search used cars for sale in Spain",
          "description": "Used cars for sale at Spanish dealers right now, each with its price against the usual price of comparable cars (cheap, fair or expensive) and the page to see it. Turn the user's request into the filters: words for make, model, version or fuel go in query (\"Toyota Corolla híbrido\"), and price, year, mileage and province in their own fields. Results come cheapest against the market first unless sort says otherwise.",
          "inputSchema": {
            "properties": {
              "fuel": {
                "description": "Optional: Gasolina, Diésel, Híbrido, Híbrido enchufable, Eléctrico, GLP or GNC",
                "type": "string"
              },
              "limit": {
                "description": "How many cars, 1 to 20; 8 if not given",
                "type": "integer"
              },
              "max_km": {
                "description": "Most kilometres, optional",
                "type": "integer"
              },
              "max_price": {
                "description": "Highest asking price in euros, optional",
                "type": "integer"
              },
              "min_price": {
                "description": "Lowest asking price in euros, optional",
                "type": "integer"
              },
              "min_year": {
                "description": "Oldest year of registration, optional",
                "type": "integer"
              },
              "province": {
                "description": "Spanish province, optional",
                "type": "string"
              },
              "query": {
                "description": "Make, model, version or fuel words, e.g. \"Golf GTI\"",
                "type": "string"
              },
              "sort": {
                "description": "market (cheapest against its market first, the default), price, year (newest first) or km",
                "enum": ["market", "price", "year", "km"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:72b7a6bc15f6123f3e10736b2fcb6b0481b7b99f50d8f83b7abb7700c434bf5a"
        }
      ],
      "digest": "sha256:5ea059d5a33fc32395ee621073736defcc24375c32a155ca14d2fe13b4b1d598"
    }
  }
}
