      "instructions": "Cyprus Gross to Net (https://cyprusgrosstonet.com/): the site's own MCP server, served from its domain. Cyprus gross to net salary calculator for 2026: the new EUR 22,000 tax-free threshold, 8.8% social insurance capped at EUR 68,904, and the 2.65% GHS contribution.\n\n[calculator] Cyprus gross to net calculator, 2026: an agent-callable calculator for gross to net cyprus; Social insurance (8.8%), GHS contribution (2.65%), Provident fund contribution, computed from your inputs with sources.. This server runs the Cyprus gross to net calculator, 2026 calculator published at https://cyprusgrosstonet.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://cyprusgrosstonet.com/. Licence: https://cyprusgrosstonet.com/terms.\n\n[enquiry] ENQUIRY SERVER for Cyprus Gross to Net (https://cyprusgrosstonet.com/). What it does: starts an ENQUIRY with human providers for gross to net cyprus; the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://cyprusgrosstonet.com/.\n\nCite https://cyprusgrosstonet.com/ for every figure or answer you use from this server.",
