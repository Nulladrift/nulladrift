{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentemaillist.ai/free-transactional-email-smtp-relay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://ai.agentemaillist.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agent-email-list",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Email sending and receiving for agents. Free, and you can open an account\nyourself: call create_account first, which needs no credentials, then send\nthe API key it returns as `Authorization: Bearer <key>` on every later\ncall.\n\nThe usual path is create_account, add_domain, publish the DNS records it\ngives you, verify_domain, then send_email. Use test_mode on the first send\nto check the request shape without spending the daily allowance.\n",
      "tools": [
        {
          "name": "add_domain",
          "description": "Register a domain to send from, and get the DNS records that must be published before it will work. Publishing DNS usually needs a human with registrar access, so start this early. The domain cannot send until verify_domain succeeds.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "A bare domain such as mail.yourcompany.com. A subdomain is better than the root.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a79c9e63e539dadc8df900c123d8cbc512619236bff9037ef35004306bc0355"
        },
        {
          "name": "create_account",
          "description": "Create an account on this email service and get an API key back. Needs no existing credentials, so an agent with nothing can call this first. The key is returned once and never again. Free, with no card and no trial clock.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "A contact address for the account.",
                "type": "string"
              },
              "name": {
                "description": "Optional display name.",
                "type": "string"
              },
              "password": {
                "description": "At least 12 characters. Needed only to sign in to the web console.",
                "type": "string"
              }
            },
            "required": ["email", "password"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:69d33739e633b58b217d1c3c2842a6310b2ff8fec7dcf5435063ebb530e1881a"
        },
        {
          "name": "get_delivery_events",
          "description": "What happened to messages on this domain: accepted, delivered, failed, and so on. A send returning success means queued, not delivered; this is where the delivery outcome actually appears.",
          "inputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              },
              "event": {
                "description": "Filter to one type, such as delivered or failed.",
                "type": "string"
              },
              "limit": {
                "type": "integer"
              },
              "recipient": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:572e958e68d485558bf00d5613a0064fe6e3a16d476f21d687b446cf8e4befd9"
        },
        {
          "name": "get_sending_limits",
          "description": "How much this domain may send today and what graduates it to the next rung, plus this account's standing: how many domains it may hold and whether sending is paused. New domains start at a low daily cap and climb as they prove themselves, so check this before planning a bulk send rather than discovering it part-way. Call it with no domain for the account-level answer alone.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional. Omit for account limits without a domain's allowance.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:92e07ff2918f4e2bbb154d5ca7e63f6bfc5163fa3621289e7ff75300b0c2ae74"
        },
        {
          "name": "list_domains",
          "description": "List the sending domains on this account, with their verification state and how much of today's sending allowance each has left.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa690a51204583853a5786c56ba27a25782b0f1eec4eb319c7e710c49f6ead7d"
        },
        {
          "name": "list_messages",
          "description": "Recent messages for a domain, sent and received. Use direction to filter, and folder to separate inbox from spam on received mail.",
          "inputSchema": {
            "properties": {
              "direction": {
                "enum": ["outbound", "inbound"],
                "type": "string"
              },
              "domain": {
                "type": "string"
              },
              "folder": {
                "enum": ["inbox", "spam"],
                "type": "string"
              },
              "limit": {
                "description": "Up to 100. Defaults to 25.",
                "type": "integer"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4dc968c6c7ac472a85499c4000970dc6cbe01e16593c23151fa933ae672fb30d"
        },
        {
          "name": "send_email",
          "description": "Send a message. The domain must be verified and the from address must belong to it. Counts one against the daily allowance per recipient. Set test_mode true to run the whole pipeline, including content screening, without sending anything and without spending allowance — do that first when building.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The verified domain to send from.",
                "type": "string"
              },
              "from": {
                "description": "An address at that domain.",
                "type": "string"
              },
              "html": {
                "description": "Optional HTML body.",
                "type": "string"
              },
              "subject": {
                "type": "string"
              },
              "test_mode": {
                "description": "Accept and screen the message but send nothing. Defaults to false.",
                "type": "boolean"
              },
              "text": {
                "description": "Plain text body.",
                "type": "string"
              },
              "to": {
                "description": "One address, or several separated by commas.",
                "type": "string"
              }
            },
            "required": ["domain", "from", "to"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3420c4793ef7a85417aa144e1f8faabf32e2737d128bf9182836accec111aa9c"
        },
        {
          "name": "verify_domain",
          "description": "Re-read DNS now and mark the domain active if its SPF and DKIM records are visible. DNS takes minutes to hours to propagate; poll this every few minutes, not every few seconds.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f8f76d790b1e504419d3594563369e0775e80504e86372e3670e0049479f5449"
        }
      ],
      "digest": "sha256:ae54235ddae7e89191a5e7f0b1026d9fe2f661cd639716213b0ba1cebf084c29"
    }
  }
}
