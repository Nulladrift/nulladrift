        {
          "name": "search_jobs",
          "title": "Search AI/ML Jobs",
          "description": "Search curated AI/ML engineering roles for free. Filter by tags (e.g. llm, pytorch), workplace (remote/hybrid/onsite), global remote eligibility, experience level, salary range, or keyword. After selecting a role, candidates may use compile_job_specific_resume for a $0 transient ATS-oriented preview without identity; a verified key is required only to save an approval-bound artifact. The employer outcome pilot never affects organic results.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company slug (e.g. 'openai', 'anthropic') — returns only that company's jobs",
                "type": "string"
              },
              "global_remote": {
                "description": "Only roles explicitly open to candidates worldwide. Ambiguous or region-restricted remote jobs are excluded.",
                "type": "boolean"
              },
              "job_type": {
                "description": "Employment type",
                "enum": ["full-time", "part-time", "contract", "freelance"],
                "type": "string"
              },
              "level": {
                "description": "Experience level",
                "enum": ["junior", "mid", "senior", "lead", "principal"],
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10, max 25)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Location substring (e.g. 'San Francisco')",
                "type": "string"
              },
              "posted_within_days": {
                "description": "Only return jobs posted within the last N days. Useful for polling agents that check for new listings — try 1 for daily, 7 for weekly.",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword query — matches title, description, company name, and tags",
