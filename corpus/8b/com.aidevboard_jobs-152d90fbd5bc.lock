          "description": "Returns a non-charging owner-review request template for the Verified Interview Pilot only. It creates no request, program, candidate action, invoice, or charge. Employer identity, exact-role authority, and acknowledgement of the capped 30-day terms are required before a separate review request may be submitted.",
