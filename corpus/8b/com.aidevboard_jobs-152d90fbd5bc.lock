{
  "lockfileVersion": 2,
  "subjects": {
    "com.aidevboard/jobs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aidevboard.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "aidevjobs",
        "title": "AI Dev Jobs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Specialized job board for AI/ML engineers. Search and matching are free. Candidates may use analyze_application_readiness without identity for a transient gap analysis, or call compile_job_specific_resume without identity for a non-persisted $0 preview based only on candidate-verified evidence. A verified candidate key is required to save an immutable draft. After a saved compilation, the agent must stop, display the complete artifact verbatim, and ask the candidate_review approval question. Saved drafts are non-submitting; only after the email-verified human candidate explicitly approves that exact artifact and job may the agent call approve_compiled_application, then apply_to_job with the short-lived single-use authorization. Candidates may use record_my_application_outcome to create a $0 self-reported screening-progression receipt; it is not employer verification or an acceptance-rate claim. Employer-reported interviews require independent candidate confirmation through list_my_interview_outcomes and respond_to_interview_outcome; candidates and agents are never charged. The sole commercial model is an employer-funded, owner-reviewed outcome pilot that never affects organic search.",
      "tools": [
        {
          "name": "analyze_application_readiness",
          "title": "Analyze Application Readiness",
          "description": "Analyze candidate-verified evidence against one active job for $0 without requiring identity. The transient response reports covered and unsupported public job signals without an acceptance probability, does not persist candidate evidence, does not submit an application, and rejects hidden screening-model instructions.",
          "inputSchema": {
            "properties": {
              "candidate_skills": {
                "description": "Candidate-declared skills used to identify relevant public job language. Only verified evidence counts as coverage.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "evidence_bullets": {
                "description": "Candidate-owned factual evidence. Raw text is processed transiently and is not retained in MCP analytics.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Candidate-controlled stable evidence reference.",
                      "type": "string"
                    },
                    "skills": {
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "text": {
                      "description": "One factual, single-line resume bullet. Hidden text and screening-model instructions are rejected.",
                      "type": "string"
                    },
                    "verified": {
                      "description": "True only when the candidate has verified this claim and its provenance.",
                      "type": "boolean"
                    }
                  },
                  "required": ["id", "skills", "text", "verified"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "job_id": {
                "description": "Active job UUID or slug returned by search_jobs or get_job.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0fe6d54f572369dd445d0118df6904596c437a0da2b570bb6cccba235066f567"
        },
        {
          "name": "apply_to_job",
          "title": "Submit a Confirmed Job Application",
          "description": "Submit only the exact, visible compiled artifact after the email-verified human principal approves its hash. Requires the single-use approval authorization, an API key, and principal_authorized=true. Candidates and agents are never charged.",
          "inputSchema": {
            "properties": {
              "compiled_artifact_hash": {
                "description": "Exact SHA-256 hash of the candidate-approved compiled artifact.",
                "type": "string"
              },
              "compiled_artifact_id": {
                "description": "Private artifact ID returned by compile_job_specific_resume.",
                "type": "string"
              },
              "compiled_authorization_id": {
                "description": "Short-lived single-use authorization returned by approve_compiled_application.",
                "type": "string"
              },
              "job_id": {
                "description": "Active job UUID returned by search_jobs or get_job.",
                "type": "string"
              },
              "principal_authorized": {
                "description": "True only after the named candidate explicitly authorizes this exact application.",
                "type": "boolean"
              }
            },
            "required": ["compiled_artifact_hash", "compiled_artifact_id", "compiled_authorization_id", "job_id", "principal_authorized"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d0809e12ced2efb5173af0f5840a85beccf723438c49c0ca1b73211ed4817b3"
        },
        {
          "name": "approve_compiled_application",
          "title": "Approve an Exact Compiled Application",
          "description": "Create a short-lived, single-use authorization for one email-verified candidate, one exact compiled artifact hash, and one unchanged active job. Requires principal_authorized=true, costs the candidate $0, and does not submit an application.",
          "inputSchema": {
            "properties": {
              "artifact_hash": {
                "description": "Exact SHA-256 artifact hash returned by compile_job_specific_resume.",
                "type": "string"
              },
              "artifact_id": {
                "description": "Private artifact ID returned by compile_job_specific_resume.",
                "type": "string"
              },
              "principal_authorized": {
                "description": "True only after the named candidate reviews and authorizes this exact artifact for its exact job.",
                "type": "boolean"
              }
            },
            "required": ["artifact_hash", "artifact_id", "principal_authorized"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48cab9848516546a1cbf8bbf2217d4e5a88e3358610a2df68968654046fa4b3c"
        },
        {
          "name": "compile_job_specific_resume",
          "title": "Compile a Job-Specific Resume Draft",
          "description": "Compile a $0 candidate-controlled ATS-oriented plain-text Markdown resume for one active job using only candidate-verified evidence. Without identity, returns a transient non-persisted preview that cannot be approved or submitted. With a verified candidate key, saves an immutable draft hash plus a machine-readable candidate_review handoff and requires the agent to pause for explicit human review. Never submits or authorizes an application.",
          "inputSchema": {
            "properties": {
              "candidate_skills": {
                "description": "Candidate-declared skills. The draft lists a skill as evidence-backed only when verified evidence supports it.",
                "items": {
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "evidence_bullets": {
                "description": "Candidate-owned factual evidence. Raw text is processed transiently and is not retained in MCP analytics.",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Candidate-controlled stable evidence reference.",
                      "type": "string"
                    },
                    "skills": {
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 20,
                      "type": "array"
                    },
                    "text": {
                      "description": "One factual, single-line resume bullet. Hidden text and screening-model instructions are rejected.",
                      "type": "string"
                    },
                    "verified": {
                      "description": "True only when the candidate has verified this claim and its provenance.",
                      "type": "boolean"
                    }
                  },
                  "required": ["id", "skills", "text", "verified"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "job_id": {
                "description": "Active job UUID or slug returned by search_jobs or get_job.",
                "type": "string"
              }
            },
            "required": ["evidence_bullets", "job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7d0e2a4b5d19fe8307daf45077000fb2c83f0a0ff79732813900cad3cadb518"
