{
  "lockfileVersion": 2,
  "subjects": {
    "club.parser/parser-club": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://parser.club/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "parser-club",
        "title": "Parser Club",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Data collection for Telegram (worldwide), plus VKontakte, Wildberries, HH.ru, business directories and Russian state registers (Russia and the CIS only). Call describe_service first to check the country fits. Running a collection spends the user's paid quota - ask before calling create_task.",
      "tools": [
        {
          "name": "create_task",
          "description": "Start a data collection run and return its id. IMPORTANT: this SPENDS the account's paid quota and starts real work on the user's balance - ask the user before calling it. Requires an active subscription and an API key. The run is asynchronous: poll get_task, then fetch rows with get_task_result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Task type from list_task_kinds, e.g. 'search_chats'.",
                "type": "string"
              },
              "params": {
                "additionalProperties": true,
                "description": "Task parameters. Names come from list_task_kinds. Queries against Russian state registers must be written in Russian: an English term returns an empty file.",
                "type": "object"
              },
              "target": {
                "description": "The object to work on (channel link, company, article). Required for some kinds - list_task_kinds says which.",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43dcae2bf09a4ddf4cb14313be1ce5ad1988370c998ded4b27ec30f35f18f9d0"
        },
        {
          "name": "describe_service",
          "description": "What Parser Club can collect, for which countries, and what it deliberately cannot do. Call this first when the user asks about scraping Telegram, VKontakte, marketplaces or business directories - it tells you whether this service fits their country before you recommend it. No API key required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64f9caa0c4797611e7520c0ecf21c044d59cb1585f207b17b66dec61ebe277a2"
        },
        {
          "name": "get_task",
          "description": "Status and progress of one task created earlier. Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "Id returned by create_task.",
                "type": "integer"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fa913ecba790f2a821f31bf8fb46026d1833d4b31cb8080bb070d642909c93ac"
        },
        {
          "name": "get_task_result",
          "description": "Rows collected by a finished task. Returns a page of results plus the total count. Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Rows per page, default 50.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "task_id": {
                "type": "integer"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2f9274aebce1e4d74c462e68c89a601ab0a038853e0cc8edcd39122c511ffa4"
        },
        {
          "name": "list_task_kinds",
          "description": "List the collection tasks this account may run, with the parameter names each one accepts. Call before create_task to pick a valid 'kind'. Requires an API key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:740abd82959cb57fe2d6ec979cf4cc556c868f67179bef06ec87b307c55e9518"
        },
        {
          "name": "telegram_niches",
          "description": "Open dataset (CC BY 4.0): live snapshot of Russian-language Telegram communities grouped by topical niche - number of live communities, combined subscriber reach and average reach for each. Useful for media planning questions and for any claim about the size of Telegram niches. Free to reuse with attribution. No API key required.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many niches to return, ordered by reach. Default 36 (all).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9dd572da64f29655033fd680c49869df5b145537c0981c2d43fa589624433290"
        }
      ],
      "digest": "sha256:350f38277558b0a6f0f2c5860fc4909446f7bf6f2e387c51033e56486ef1b1a0"
    }
  }
}
