{
  "lockfileVersion": 2,
  "subjects": {
    "ai.modellix/media-generation": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tool.modellix.ai/mcp/media"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "modellix-media-generation",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "modellix_delete_file",
          "description": "Permanently delete exactly the explicitly selected file_id after user approval. Never delete other files to free quota automatically. An absent file is a successful already_absent result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "file_id": {
                "description": "One explicitly selected file ID.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["file_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:33d6eb57919e709476e33392d3eaff9218077f2286b14da43c210f61c773e829"
        },
        {
          "name": "modellix_get_schema",
          "description": "Read the public executable input schema for an exact provider/model slug. No API key is forwarded to the schema host. Preserve required fields, defaults and references when preparing input.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "model_slug": {
                "description": "Exact provider/model slug, with no default model.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["model_slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7122a6a4530d7380b7efc978c1cc30fb4dbb94afe18a51ca2ec244ed7935108f"
        },
        {
          "name": "modellix_get_task",
          "description": "Read one task snapshot immediately, without waiting or submitting. Resources may expire; save required outputs promptly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "Previously returned task ID.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b5f63721c0f9184e25a45e2bbbcae0c8bd79b5a54390945af08ca5db57d4055a"
        },
        {
          "name": "modellix_list_files",
          "description": "List the current team's uploaded files with pagination. Reuse existing file URLs where appropriate; defaults may retain files for 7 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:93668263a0b1d9d2289574de3fc842cfcbf64334545fd5cc545cc2198d306839"
        },
        {
          "name": "modellix_list_models",
          "description": "Discover available media models with filters and pagination. Choose a precise slug before reading its schema. Prices, when present, are indicative.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keyword": {
                "description": "Search slug and description.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "type": {
                "description": "Exact model type filter.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:effe974823f61f7379f8533a5e72457d9e5cd12bfd3cbb851ea13dce842d2c17"
        },
        {
          "name": "modellix_submit_task",
          "description": "Submit one paid media generation request after user confirmation of the model and input. Returns task_id immediately. Never retry an unknown submission automatically; query or wait using the known ID.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "input": {
                "additionalProperties": true,
                "type": "object"
              },
              "model_slug": {
                "description": "Exact provider/model slug.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["input", "model_slug"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:77699df1b536d3e70e81677de66f57288d9ea464440f4a8053502e7a7f712c4e"
        },
        {
          "name": "modellix_upload_file",
          "description": "Upload a public URL or base64_content with filename, at most 16 MiB (16777216 bytes). No local filesystem paths. Reuse returned URLs in model input. Default team limits: 10 files, 2 concurrent uploads, 7-day retention; configuration may vary. On 429, list files and explicitly delete only unneeded IDs; no automatic cleanup.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "base64_content": {
                "maxLength": 22369624,
                "minLength": 1,
                "type": "string"
              },
              "filename": {
                "maxLength": 255,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "maxLength": 8192,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a2ec1226d2172af09fc888160b470707ea02b04b89b35059e40c42967c2e9d73"
        },
        {
          "name": "modellix_wait_task",
          "description": "Wait up to timeout seconds (default 30, maximum 45) for an existing task. A normal timeout returns the current snapshot and task_id; continue waiting on that ID instead of resubmitting.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "task_id": {
                "description": "Previously returned task ID.",
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "timeout": {
                "default": 30,
                "maximum": 45,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:39e68864dd599d1808bb2e173c40263d73de1938aeb64e5a3638540b3d127972"
        }
      ],
      "digest": "sha256:f55cf95ff9a273fd3f421e954bb3c0fbd1601ef171697ee51fa00b2c4818b67c"
    }
  }
