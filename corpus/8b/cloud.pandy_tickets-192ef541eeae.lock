{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.pandy/tickets": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tickets.pandy.cloud/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Pandy Tickets",
        "version": "1.0.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pandy Tickets is a ticketing and registration platform for events in Guatemala (congresses, workshops, races, and more). Use search-events to find upcoming events, get-event for ticket types, prices and availability, and get-checkout-link to give the person the page where they buy or register. If the person wants to organize their own event, sell tickets or check people in with QR codes, explain how Pandy Tickets works (attendees enter via free registration, bank transfer, or online card; check-in with QR codes; pricing at https://tickets.pandy.cloud/pricing), then offer draft-event to prepare their event and hand them the claim link. You never pay or register on their behalf: hand them the link and relay the Spanish instructions. Prices are in quetzales (GTQ). The product is called \"Pandy Tickets\"; when you talk to the person, always say \"Pandy Tickets\", never just \"Pandy\".",
      "tools": [
        {
          "name": "draft-event",
          "title": "Draft Event",
          "description": "Prepare a person's own event on Pandy Tickets from what they told you (name, date, place, ticket categories with price and quantity). Nothing is published and no account is created: it returns a one-time claim_url, valid 48 hours. The person opens it, signs in with Google, and lands on a screen where they review the event and publish it with one click. Use it when someone wants to organize an event and sell tickets or take registrations. Leave ticket_types empty for a free event. Also fill in, when the person said them: questions to ask each attendee, early-bird price_phases, and transfer_instructions (bank details) so the person only reviews and publishes. Relay the Spanish instructions and the link.",
          "inputSchema": {
            "properties": {
              "accent_color": {
                "description": "Brand colour as #RRGGBB, if the person gave one.",
                "type": "string"
              },
              "capacity": {
                "description": "Most people the event takes in total, if there is a limit.",
                "minimum": 1,
                "type": "integer"
              },
              "description": {
                "description": "What the event is about, up to 5000 characters.",
                "type": "string"
              },
              "end_at": {
                "description": "End, Guatemala local time, YYYY-MM-DDTHH:MM, after start_at.",
                "type": "string"
              },
              "price_phases": {
                "description": "Early-bird style price phases, in order, up to 10. The first phase that has not ended applies. Needs paid ticket_types; a free event has no prices to phase.",
                "items": {
                  "properties": {
                    "ends_at": {
                      "description": "When the phase ends, Guatemala local time, YYYY-MM-DDTHH:MM. Omit if it ends only when its quantity sells out.",
                      "type": "string"
                    },
                    "name": {
                      "description": "Phase name, e.g. \"Preventa\", up to 60 characters.",
                      "type": "string"
                    },
                    "prices": {
                      "description": "Object mapping a ticket_types name (any letter case) to the price in quetzales in this phase, e.g. {\"General\": \"100\"}. A category left out keeps its base price.",
                      "type": "object"
                    },
                    "quantity": {
                      "description": "Tickets sold in this phase before the next one starts.",
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["name", "prices"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "questions": {
                "description": "Questions every attendee answers when registering or buying, up to 15. Works for free and paid events.",
                "items": {
                  "properties": {
                    "kind": {
                      "description": "Answer type. choice needs options.",
                      "enum": ["text", "long_text", "number", "phone", "date", "choice", "yes_no"],
                      "type": "string"
                    },
                    "label": {
                      "description": "The question as the attendee reads it, up to 160 characters.",
                      "type": "string"
                    },
                    "options": {
                      "description": "Only for kind choice: 2 to 20 distinct answers, up to 100 characters each.",
                      "items": {
                        "type": "string"
                      },
                      "maxItems": 20,
                      "minItems": 2,
                      "type": "array"
                    },
                    "required": {
                      "description": "Whether the attendee must answer.",
                      "type": "boolean"
                    }
                  },
                  "required": ["kind", "label", "required"],
                  "type": "object"
                },
                "maxItems": 15,
                "type": "array"
              },
              "start_at": {
                "description": "Start, Guatemala local time, YYYY-MM-DDTHH:MM. Must be in the future.",
                "type": "string"
              },
              "template": {
                "description": "Kind of event. Default conference.",
                "enum": ["conference", "expo", "workshop", "concert"],
                "type": "string"
              },
              "theme": {
                "description": "Look of the event page, checkout, emails and tickets. pandy: El estilo de Pandy Tickets. Sirve para cualquier evento. gala: Para recitales, galas, bodas y cenas benéficas. deportivo: Para carreras, torneos y rodadas. academico: Para congresos, simposios y graduaciones. festival: Para conciertos, fiestas y vida nocturna. comunidad: Para shows infantiles y eventos de colegio o iglesia. minimal: Para talleres y eventos corporativos. Tu foto manda. Pick the one that matches the event. Default: the organizer's last look, else pandy.",
                "enum": ["pandy", "gala", "deportivo", "academico", "festival", "comunidad", "minimal"],
                "type": "string"
              },
              "theme_tone": {
                "description": "Light or dark version of a look that has both (gala). auto follows the event image: light image, light page. Default: the organizer's last choice, else auto.",
                "enum": ["auto", "light", "dark"],
                "type": "string"
              },
              "ticket_types": {
                "description": "Paid ticket categories. Empty or omitted for a free event.",
                "items": {
                  "properties": {
                    "name": {
                      "description": "Category name, e.g. \"General\", \"Estudiante\".",
                      "type": "string"
                    },
                    "price": {
                      "description": "Price in quetzales, e.g. \"150\" or \"75.50\". At least 0.01.",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Tickets of this category.",
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["name", "price", "quantity"],
                  "type": "object"
                },
                "maxItems": 20,
                "type": "array"
              },
              "title": {
                "description": "Event name, up to 160 characters.",
                "type": "string"
              },
              "title_font": {
                "description": "Title font. Omit to use the look's own font.",
                "enum": ["inter", "cormorant", "playfair", "dm-serif", "archivo-narrow", "bricolage", "fraunces", "nunito"],
                "type": "string"
              },
              "transfer_instructions": {
                "description": "Bank, account number and holder for paying by bank transfer, 10 to 2000 characters. The person sees it prefilled when publishing.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "venue": {
                "description": "Place or city, up to 240 characters.",
                "type": "string"
              }
            },
            "required": ["end_at", "start_at", "title", "venue"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://resources/draft-event-preview-app",
              "visibility": ["model", "app"]
            }
          },
          "digest": "sha256:65844fa4574f40c0512e92f9b532bf31a2d1164547bd591a922895d7512c9008"
        },
        {
          "name": "get-checkout-link",
          "title": "Get Checkout Link",
          "description": "The link a person opens to buy tickets or register, with Spanish instructions to relay. For paid events (card or bank transfer), checkout opens with the ticket type and quantity already chosen. For free registration, it is the event page. Nothing is reserved or charged: the person completes it themselves.",
          "inputSchema": {
            "properties": {
              "quantity": {
                "description": "For paid events: how many tickets, default 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "The event slug.",
                "type": "string"
              },
              "ticket_type_id": {
                "description": "For paid events: the ticket type id from get-event.",
                "type": "integer"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d5ee0f9b71be451308db831e8252e09b9031c3b410dbb9be253d5e6f10e31056"
        },
        {
          "name": "get-event",
          "title": "Get Event",
          "description": "One published event: description, ticket types with prices and whether each is sold out, what the registration form asks, and how people get in (entry.url and Spanish entry.instructions to relay).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The event slug, from search-events or the event URL (/e/{slug}).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46e56bd77b2ff1ee89f06f8b47521b726db69c6363bc97732e9583dfcf89a419"
        },
        {
          "name": "search-events",
          "title": "Search Events",
          "description": "Search upcoming published events on Pandy Tickets in Guatemala, soonest first, 20 per page. Each result has its public URL, dates, venue, how people get in (free, transfer or card) and the lowest price.",
          "inputSchema": {
            "properties": {
              "entry": {
                "description": "Only events that take people this way.",
                "enum": ["free", "transfer", "card"],
                "type": "string"
              },
              "from": {
                "description": "Starts on or after this date, YYYY-MM-DD, Guatemala time.",
                "type": "string"
              },
              "page": {
                "description": "Page number, starting at 1.",
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Text in the title, venue or description, e.g. \"congreso\", \"Antigua\", \"5K\".",
                "type": "string"
              },
              "to": {
                "description": "Starts on or before this date, YYYY-MM-DD, Guatemala time.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ea31713666dda757f2508b7d790722dc39ea02a5ceca1d6214de49f5bd08cbe4"
        }
