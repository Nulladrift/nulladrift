        {
          "name": "search-events",
          "title": "Search Events",
          "description": "Search upcoming published events on Pandy Tickets in Guatemala, soonest first, 20 per page. Each result has its public URL, dates, venue, how people get in (free, transfer or card) and the lowest price.",
          "inputSchema": {
            "properties": {
              "entry": {
                "description": "Only events people can get into this way now: free (register at no cost), transfer (pay by bank transfer and upload the receipt) or card (pay online by card). Omit for every event.",
                "enum": ["free", "transfer", "card"],
                "type": "string"
              },
              "from": {
                "description": "Earliest start date to include, in Guatemala time.",
                "format": "date",
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Which page of results, when total is more than one page.",
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Text in the title, venue or description, e.g. \"congreso\", \"Antigua\", \"5K\".",
                "type": "string"
              },
              "to": {
                "description": "Latest start date to include, in Guatemala time.",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
