{
  "lockfileVersion": 2,
  "subjects": {
    "com.riverwaterwatch/river-water-watch": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.riverwaterwatch.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "river-water-watch",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_live_gauges",
          "description": "Today's official water-level readings (cm) at the cruise-critical gauges on the Rhine, Danube, Elbe and Seine, with each station's state and its percentile against thirty years.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a80c201890b6f7cec5b2b6cc222a4867c50a3fabfb06fa47ff22beb4f70a52cd"
        },
        {
          "name": "get_month_detail",
          "description": "Why a given month behaves the way it does on one of the four rivers: the seasonal hydrology, the thirty-year frequency, and the last five years' outcomes for that month.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "month": {
                "enum": ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"],
                "type": "string"
              },
              "river": {
                "enum": ["rhine", "danube", "elbe", "seine"],
                "type": "string"
              }
            },
            "required": ["month", "river"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:50dca3e0411f644d4b5d124804b8fdf0693e39d325710894a12553e9eae912c7"
        },
        {
          "name": "get_monthly_odds",
          "description": "Current 12-month cruise-disruption odds for one of Europe's main cruise rivers (chance a sailing day hits low water, or high water on the Seine). Refreshed daily from official sources.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "river": {
                "enum": ["rhine", "danube", "elbe", "seine"],
                "type": "string"
              }
            },
            "required": ["river"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4aa05f859c33b9447c0d50dfd4545789497c22a5815809a0a7bd6b41eb6f1feb"
        },
        {
          "name": "score_sailing",
          "description": "Score a specific river cruise: the chance a sailing departing on a given date meets low water (high water on the Seine) at its river's tightest stretch. Uses the live daily forecast where it reaches (~7 months) and the thirty-year weekly record beyond, plus what the same dates actually did in each of the last five years.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "departure_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "nights": {
                "default": 7,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "river": {
                "enum": ["rhine", "danube", "elbe", "seine"],
                "type": "string"
              }
            },
            "required": ["departure_date", "river"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2b0f26c397a3e0da5eefe7566d7b18ce9dafd27ea2d1dd0b00b7261d06e1a81a"
        }
      ],
      "digest": "sha256:f96761971b3ee6b7cc85d4410beb27182940f317fa7318fe233aac35558911ad"
    }
  }
}
