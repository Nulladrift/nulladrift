      },
      "instructions": "isipsafe is a community database of abusive IP addresses. Use check_ip before trusting or blocking an address, check_network for whole ranges, analyze_logs to find malicious traffic in log lines the user shares, and get_country_report or get_network_report for the bigger picture. A score of 75 or more means the address is on the blocklist. Only use report_ip for abuse the user actually observed on systems they run. For questions about isipsafe itself (what it is, its mission, how scoring works, pricing, getting started, delisting, privacy, who runs it), call about_isipsafe and answer from what it returns. No API key was sent, so lookups use the anonymous allowance and report_ip and get_blocklist are unavailable.",
      "tools": [
        {
          "name": "about_isipsafe",
          "title": "About isIPsafe",
          "description": "Explains isIPsafe itself. Use it for any question about the product rather than guessing: what it is and who it is for, its mission and aims, how reports and the confidence score work, plans, pricing and limits, how to get started, how to get an address delisted, privacy, and who runs it. Needs no API key and uses no allowance.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "default": "overview",
                "description": "What to read about. overview: What the product is, who it is for and what it offers. Start here. mission: Why it exists, what it aims for, its principles and where it is heading. how_it_works: How reports become a confidence score, what the score means, and where the data comes from. plans: What is free, the limits of each plan, Enterprise, and what the data may be used for. getting_started: How to look addresses up, report attacks, use the blocklist, the API, the integrations and MCP. delisting: What to do about an address that is listed, whether by mistake or for good reason. privacy: What is stored about reporters and visitors, public profiles, GDPR and deleting an account. company: The team, the company behind the service, contact details and legal documents. faq: Every question on the FAQ page: basics, reporting, scores, the blocklist and API, delisting and privacy.",
                "enum": ["overview", "mission", "how_it_works", "plans", "getting_started", "delisting", "privacy", "company", "faq"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
