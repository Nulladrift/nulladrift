          "name": "get_country_report",
          "title": "Abuse report for a country",
          "description": "How many addresses in a country were reported in the last 30 days, how many are on the blocklist, the most reported addresses there, and the networks and attack categories behind them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 code, e.g. DE",
                "type": "string"
