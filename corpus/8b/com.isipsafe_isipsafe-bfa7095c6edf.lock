        {
          "name": "analyze_logs",
          "title": "Analyze log traffic",
          "description": "Find malicious traffic in logs. Pass raw log lines from any source (nginx/Apache/IIS access logs, sshd/auth.log, syslog, firewall such as iptables/UFW/pfSense/ASA, mail servers, Windows events as text, CEF, JSON lines from a SIEM or cloud, CSV); every IPv4/IPv6 address is extracted wherever it appears and each non-blank line is one event. Returns how many events came from malicious (score 75+), suspicious (25-74) and unreported addresses, the top offenders with score and attack categories, the busiest addresses, countries, networks, attack categories, detected log formats, HTTP status classes, failed logins and the time range. Each distinct address looked up counts as one lookup against the daily allowance, busiest first. Per analysis: without a key 256 KB and 100 addresses, free key 2 MB and 1,000, Enterprise 5 MB and 10,000. The log is not stored. Remove secrets (passwords, tokens) before sending.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "logs": {
                "description": "The raw log text, one event per line, in any format",
                "type": "string"
              }
            },
            "required": ["logs"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b2ca56c7b2675c549f807eb790ab2a959fa402b607bdc153d419f05c3a2d764"
        },
        {
          "name": "check_ip",
          "title": "Check an IP address",
          "description": "Reputation of one IPv4 or IPv6 address: abuse confidence score (0-100, 75+ is on the blocklist), number of reports and distinct reporters, attack categories, country, network owner (ASN), Tor exit status and a link to its page. Set verbose to include the latest reports with their comments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ip": {
                "description": "IPv4 or IPv6 address, e.g. 203.0.113.7",
                "type": "string"
              },
              "maxAgeInDays": {
                "default": 30,
                "description": "Only count reports from the last N days",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "verbose": {
                "description": "Include up to 100 recent reports with comments",
                "type": "boolean"
              }
            },
            "required": ["ip"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb685c7e9746bab2b2def8ca4d317534ada574d7a901e092bca5e9f0c7e631d2"
        },
        {
          "name": "check_network",
          "title": "Check a network (CIDR)",
          "description": "Every reported address inside a CIDR block (IPv4 up to /16, IPv6 up to /48), with score, report count and last report time, plus the network's owner. Use it to judge a whole hosting range or subnet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "maxAgeInDays": {
                "default": 30,
                "description": "Only count reports from the last N days",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "network": {
                "description": "CIDR block, e.g. 203.0.113.0/24",
                "type": "string"
              }
            },
            "required": ["network"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e05b7f3c75bef7f0b6345c4f8834c05c44b0c21f379efaed454f5764dac0132c"
        },
        {
          "name": "get_blocklist",
          "title": "Get the blocklist",
          "description": "The highest-confidence abusive addresses right now, best first, with score, country and categories. Needs an API key and counts as one blocklist download. For a firewall-ready file, point the firewall at the blocklist URL instead (see the integrations).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confidenceMinimum": {
                "default": 75,
                "description": "Lowest score to include",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "exceptCountries": {
                "description": "Comma-separated ISO country codes to leave out",
                "type": "string"
              },
              "ipVersion": {
                "description": "Only IPv4 or only IPv6",
                "enum": [4, 6],
                "type": "integer"
              },
              "limit": {
                "default": 100,
                "description": "Maximum number of addresses",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              },
              "onlyCountries": {
                "description": "Comma-separated ISO country codes to include, e.g. CN,RU",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1cfd7a27656c75894f3d1dcc10f45442545d84c23dfdc41e077c7d57567c905a"
        },
