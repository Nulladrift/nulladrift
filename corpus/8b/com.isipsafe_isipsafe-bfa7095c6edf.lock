        {
          "name": "report_ip",
          "title": "Report an abusive IP address",
          "description": "File an abuse report against an address that attacked a system you run. Needs an API key. Use category codes from list_categories (e.g. ssh,brute-force) and put the evidence (log lines, never personal data) in the comment. Each reporter can report the same address once per 15 minutes. Only report real, observed abuse.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Comma-separated category codes or numeric IDs, e.g. ssh,brute-force",
                "type": "string"
              },
              "comment": {
                "description": "Evidence: what happened, ideally the relevant log lines",
                "type": "string"
              },
              "ip": {
                "description": "The attacking IPv4 or IPv6 address",
                "type": "string"
              },
              "timestamp": {
                "description": "When the attack happened, ISO 8601 (optional, defaults to now)",
                "type": "string"
              }
            },
            "required": ["categories", "ip"],
            "type": "object"
          },
