{
  "lockfileVersion": 2,
  "subjects": {
    "com.siigolatam/siigo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.siigolatam.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "Siigo Latam",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "get_articles",
          "description": "Returns recent Siigo blog articles for a country, optionally filtered by topic. Each item has slug, title, excerpt, author, date, category, URL and the schema.org BlogPosting JSON-LD. Use this when the user wants up-to-date Siigo perspectives on accounting, taxes, PYMEs, fintech or product launches. Example calls: {\"country\": \"COL\", \"limit\": 10} for the latest across every category, or {\"country\": \"COL\", \"topic\": \"derecho-laboral\", \"limit\": 5} for one category.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-3 country code. Only countries listed in DependencyInjection:ProfileInjector:Actives are served. Examples: COL, MEX, ECU, PER, CHL, URY.",
                "examples": ["COL", "MEX", "ECU", "PER", "CHL", "URY"],
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "limit": {
                "description": "Optional max number of articles to return. Default 10. Keep it at 25 or below: articles are fetched with the author embedded and WordPress silently returns an empty payload past ~25 items, so higher values yield zero articles.",
                "examples": [10, 25],
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "topic": {
                "description": "Optional blog category slug. Must be one of the shell's six content categories: contabilidad-finanzas, gestion-administrativa, emprendimiento, derecho-laboral, obligaciones-fiscales, tecnologia-innovacion. Any other value returns an empty list. Omit to get the latest across all six.",
                "enum": ["contabilidad-finanzas", "gestion-administrativa", "emprendimiento", "derecho-laboral", "obligaciones-fiscales", "tecnologia-innovacion"],
                "examples": ["derecho-laboral", "obligaciones-fiscales"],
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a1e03aa2af59568cc683a3e1149ad4aafb20c0e4cd70cf45b9ef12292a288a76"
        },
        {
          "name": "get_compliance_info",
          "description": "Returns tax-and-regulatory compliance information for Siigo's country (Colombia DIAN: RADIAN, UGPP, documento soporte, electronic invoicing rules; Mexico SAT: CFDI 4.0, Carta Porte, DIOT, timbrado). Each item exposes title, summary, last updated date, source URL and the schema.org BlogPosting JSON-LD. Use this when the user asks about Siigo's compliance posture or specific regulations. Example calls: {\"country\": \"COL\"} or {\"country\": \"MEX\"} for the full list, or {\"country\": \"MEX\", \"regulation\": \"CFDI\"} to narrow it down.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-3 country code. Only countries listed in DependencyInjection:ProfileInjector:Actives are served. Examples: COL, MEX, ECU, PER, CHL, URY.",
                "examples": ["COL", "MEX", "ECU", "PER", "CHL", "URY"],
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "regulation": {
                "description": "Optional single-word filter forwarded to WordPress full-text search. Letters, digits, hyphen and underscore only — no spaces, max 100 chars. Working examples — Colombia: RADIAN, UGPP, IVA, renta, exogena, nomina; Mexico: CFDI, SAT, DIOT, timbrado. Do NOT reuse the multi-word regulation id echoed in the response (e.g. RETENCION_FUENTE): it matches nothing. Omit to get the 50 latest compliance items.",
                "examples": ["RADIAN", "UGPP", "CFDI", "SAT"],
                "maxLength": 100,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d6530125a8ebed12171f21d8ed2370072715c942f66535a1bed1b77e0138a7a4"
        },
        {
          "name": "get_organization_info",
          "description": "Returns canonical Organization data for Siigo in a country: legal name, URL, logo, social profiles (sameAs), address, phone and founding date — plus the full schema.org JSON-LD graphs for the 'about / por qué' page. Use this when the agent needs trustworthy company facts to cite Siigo as a source. Example call: {\"country\": \"COL\"}. The data is read from the country's home page (ContentProviders:{country}:Webapp:OrganizationSlug, COL: inicio), the only page that publishes the Organization graph; LocalBusiness and Corporation count as well.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-3 country code. Only countries listed in DependencyInjection:ProfileInjector:Actives are served. Examples: COL, MEX, ECU, PER, CHL, URY.",
                "examples": ["COL", "MEX", "ECU", "PER", "CHL", "URY"],
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f959cb1a1897666e8a6226e475344d9231cac7ed3822d49480e1e64ae93ca16"
        },
        {
          "name": "get_page_structured_data",
          "description": "Returns the curated JSON-LD structured data graphs (Service, SoftwareApplication, Product, Offer, Review, FAQ, Breadcrumb…) for a Siigo landing page, plus SEO metadata. Use this when the user asks about a specific Siigo product or topic and you want canonical, schema.org-ready data. Example call: {\"country\": \"COL\", \"slug\": \"facturacion-electronica\"}. Pages with no JSON-LD still return title + seo with an empty jsonLdGraphs array.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-3 country code. Only countries listed in DependencyInjection:ProfileInjector:Actives are served. Examples: COL, MEX, ECU, PER, CHL, URY.",
                "examples": ["COL", "MEX", "ECU", "PER", "CHL", "URY"],
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "slug": {
                "description": "WordPress page slug, without leading slash. Lowercase letters, digits and hyphens only, max 200 chars. Real COL slugs: facturacion-electronica, nomina-electronica, software-contable, gestion-de-inventario, sistema-de-costos, gestion-de-cobranza, precios-siigo, por-que-siigo, prueba-gratis. An unknown slug returns 'Page not found'.",
                "examples": ["facturacion-electronica", "precios-siigo"],
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["country", "slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a754be2af9513e0bbf8e39830e9099847ad2511fb3c0180eed193b768e2d874"
        },
        {
          "name": "get_products",
          "description": "Returns Siigo's catalog of products/plans for a country with price, currency and feature list, read from the pricing page (its schema.org Product graphs, or the shell catalogue where the country publishes one). Use this when the user asks about pricing, plans, discounts or what's included in each tier. `price` is the list price of the headline plan (yearly when there is one) and never includes a discount. `offers` holds every published price; an offer whose description ends in \"con descuento\" is a discount in force, with `regularPrice` (the list price it replaces) and `discountPercent` when the source publishes them. `monthlyEquivalent` is the per-month figure the pricing card shows for a multi-month plan (period total divided by its months), not the price of the monthly plan. Example call: {\"country\": \"COL\"} (uses the configured default slug precios-siigo). An empty products array means the page currently publishes no products.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-3 country code. Only countries listed in DependencyInjection:ProfileInjector:Actives are served. Examples: COL, MEX, ECU, PER, CHL, URY.",
                "examples": ["COL", "MEX", "ECU", "PER", "CHL", "URY"],
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "slug": {
                "description": "Optional WP page slug whose JSON-LD exposes the Product/Offer graphs. Defaults to ContentProviders:{country}:ProductsSlug (COL: precios-siigo). Ignored for countries whose shell publishes a catalogue endpoint (ContentProviders:{country}:Webapp:ProductsListUrl): there the whole catalogue is returned. Same slug rules as get_page_structured_data. Example: precios-siigo.",
                "examples": ["precios-siigo"],
                "maxLength": 200,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:504c78e156abd4a9b1d57fc3cd1d592768929d134459447608499283e1d7450f"
        },
        {
          "name": "search",
          "description": "Full-text search against Siigo's curated content for a country. Returns matching pages, posts, and resources. Use this when the user mentions a topic you don't have a more specific tool for. Example call: {\"country\": \"COL\", \"query\": \"facturacion electronica\"}. Note: the COL shell has search disabled until its cached search service ships, so it currently returns an empty items array — prefer get_articles or get_compliance_info meanwhile.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-3 country code. Only countries listed in DependencyInjection:ProfileInjector:Actives are served. Examples: COL, MEX, ECU, PER, CHL, URY.",
                "examples": ["COL", "MEX", "ECU", "PER", "CHL", "URY"],
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "query": {
                "description": "Free-text query against Siigo's WordPress content. Between 2 and 200 chars, no angle brackets. Examples: facturacion electronica, nomina, plan emprendedor.",
                "examples": ["facturacion electronica", "nomina"],
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["country", "query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a6093cad2a6ad21dc1d6e9875ad42d5fae2d6875901c600ba7534e06be5d5ac8"
        }
      ],
      "digest": "sha256:4fd61ca13e3d633be2e86f2b6de8d9844a8f564fea56ce5951bdad1b602a504a"
    }
  }
}
