      "serverInfo": {
        "name": "faceruler",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "classify_face_shape",
          "title": "Classify face shape",
          "description": "Classify a face into one of 7 shapes (oval, round, square, oblong, heart, diamond, triangle) from three measured outline ratios, with a match % for every shape.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "faceIndex": {
                "description": "Face height / face width (typical 1.1–1.5)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "foreheadRatio": {
                "description": "Forehead (temple) width / face width (typical 0.7–0.95)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "jawRatio": {
                "description": "Jaw (bigonial) width / face width at cheekbones (typical 0.75–1.0)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["faceIndex", "foreheadRatio", "jawRatio"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c1aa1caaa18ac85011cfa5efb7f6e0457585ec9021ab745ecaa1f35c14932ee4"
        },
        {
          "name": "get_face_measurement_tool",
          "title": "Get a face measurement tool",
          "description": "Return the link to FaceRuler’s free on-device tool for measuring a real face from one photo (PSL score, face shape, canthal tilt or facial ratios). Use when the user wants their own face measured.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "measurement": {
                "description": "What to measure",
                "enum": ["psl", "face_shape", "canthal_tilt", "facial_ratios"],
                "type": "string"
              }
            },
            "required": ["measurement"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4ba93329d6cdbffcab04e7231388d785cd7d5ab7d26ebfc5d8961cca8ca8b086"
        },
        {
          "name": "lookup_looksmaxxing_term",
          "title": "Look up a looksmaxxing term",
          "description": "Define a looksmaxxing / PSL term (e.g. LTN, HTN, Chadlite, canthal tilt, hunter eyes, mog) and link to its full explanation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "term": {
                "description": "The term to look up",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e69a2b01c6affc7b5963bfdbffe7c2858d7b598195f79e782fdef43f410cc066"
        },
        {
          "name": "psl_score_lookup",
          "title": "PSL score lookup",
          "description": "Convert a PSL score (0–8 looksmaxxing face rating scale) into its tier name, approximate population percentile and casual 1–10 equivalent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "psl": {
                "description": "PSL score, 0–8",
                "maximum": 8,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["psl"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f1c980134c03657539b453f118dd246b96a433610a5079b0f3c74a24cb043011"
        }
      ],
      "digest": "sha256:6ae0d4b927f54f60d4953332e0e1d496332417401265a7505e7e47fcd795cd2a"
    }
  }
