{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceruler/faceruler": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceruler.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "faceruler",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "classify_face_shape",
          "title": "Classify face shape",
          "description": "Classify a face into one of 7 shapes (oval, round, square, oblong, heart, diamond, triangle) from three measured outline ratios, with a match % for every shape.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "faceIndex": {
                "description": "Face height / face width (typical 1.1–1.5)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "foreheadRatio": {
                "description": "Forehead (temple) width / face width (typical 0.7–0.95)",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "jawRatio": {
                "description": "Jaw (bigonial) width / face width at cheekbones (typical 0.75–1.0)",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["faceIndex", "foreheadRatio", "jawRatio"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c3d5565538772efa9653006c744dc460021c1d4e5a69c1c1484c03277c477101"
        },
        {
          "name": "get_face_measurement_tool",
          "title": "Get a face measurement tool",
          "description": "Return the link to FaceRuler’s free on-device tool for measuring a real face from one photo (PSL score, face shape, canthal tilt or facial ratios). Use when the user wants their own face measured.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "measurement": {
                "description": "What to measure",
                "enum": ["psl", "face_shape", "canthal_tilt", "facial_ratios"],
                "type": "string"
              }
            },
            "required": ["measurement"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:89e8d1fcaf80ebad94678373f74be572bebf79b51631bcd6527d10e0f31ce469"
        },
        {
          "name": "lookup_looksmaxxing_term",
          "title": "Look up a looksmaxxing term",
          "description": "Define a looksmaxxing / PSL term (e.g. LTN, HTN, Chadlite, canthal tilt, hunter eyes, mog) and link to its full explanation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "term": {
                "description": "The term to look up",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5366d58f5175407aa728937320578e280e433f9aafe63f07c5cb3d8d66f6ed60"
        },
        {
          "name": "psl_score_lookup",
          "title": "PSL score lookup",
          "description": "Convert a PSL score (0–8 looksmaxxing face rating scale) into its tier name, approximate population percentile and casual 1–10 equivalent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "psl": {
                "description": "PSL score, 0–8",
                "maximum": 8,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["psl"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:610ab3e38ccf81d2a7d2375ae0efff6a6a26e9c4ccc5e9d6f1cb7f0f0612ee2c"
        }
      ],
      "digest": "sha256:a710a7fefa31a1b8a1edcdaf87847cb459410fc7bbb3335920d30ddcbaeefc4a"
    }
  }
}
