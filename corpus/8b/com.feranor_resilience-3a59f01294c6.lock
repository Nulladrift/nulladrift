        {
          "name": "domain_check_batch_v1",
          "title": "Domain Resilience Check, Batch",
          "description": "Runs the full resilience check on up to 100 domains in a single call and returns the same scored report for each one: TLS certificate, security headers, DNS redundancy, response time, with every individual finding. Use it to audit a portfolio, to rank a list of vendors, or to re-check a fleet after a config rollout. A domain that cannot be reached is returned with its own error rather than failing the batch, and it is still charged, because the crawl was attempted. Do not use it for a single domain: domain_check_v1 is simpler and costs the same for one. Private, internal and localhost hostnames and IP addresses are rejected. Price: $0.01 per domain, dropping to $0.005 from 100 domains, up to 100 per call. One payment covers the whole batch (x402, USDC on Base). No signup, no API key.",
          "inputSchema": {
            "properties": {
              "domains": {
                "description": "Bare domain names, apex or subdomain, for example ['example.com', 'www.example.org']. Between 1 and 100 entries. Scheme, path, port and query string are ignored if present. Duplicates are removed before billing.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "evaluated": {
                "description": "Number of distinct domains actually evaluated. This is the billed quantity.",
