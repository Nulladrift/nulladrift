                "description": "Number of domains in the request, before de-duplication.",
                "type": "integer"
              },
              "results": {
                "description": "One entry per distinct domain, in no guaranteed order.",
                "items": {
                  "properties": {
                    "domain": {
                      "description": "Domain as it was requested.",
                      "type": ["string", "null"]
                    },
                    "error": {
                      "description": "Why this domain could not be evaluated. Null on success.",
