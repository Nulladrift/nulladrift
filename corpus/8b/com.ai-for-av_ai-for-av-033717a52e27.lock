      },
      "transport": {
        "type": "http",
        "url": "https://ai-for-av.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "ai-for-av",
        "title": "AV女優判定AI",
        "version": ""
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AV女優判定AI (ai-for-av.com) の公開 MCP サーバーです。成人向けコンテンツを扱います。`search` は作品 / 女優名のキーワード検索で認証不要です。`identify_actress` は画像 (base64) から出演女優の候補を類似度順に返しますが、人間が連携ページ (https://ai-for-av.com/ai-assistant) で認証を解いて取得した認証コード (verification_code) が必要です。コードが無い場合はユーザーに連携ページを開いてコードを取得し、チャットへ貼り付けるよう案内してください。判定結果は『登録済み女優の中で特徴が近い候補』であり本人の断定ではありません。結果に含まれる URL (女優ページ / 作品ページ) をユーザーへ提示してください。",
      "tools": [
        {
          "name": "identify_actress",
          "title": "画像から出演女優を判定",
          "description": "画像 (base64) に写っている顔から、出演 AV 女優の候補を類似度が高い順に返します。本ツールの利用には、人間が連携ページ https://ai-for-av.com/ai-assistant で認証 (Cloudflare Turnstile) を解いて取得した認証コード (verification_code) が必要です。コードが無い場合はユーザーに連携ページを開いてコードを取得し、貼り付けてもらってください (有効期限 30 分、1 コードで最大 10 回まで判定可能)。画像は判定後すぐに破棄され保存されません。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "image_base64": {
                "description": "判定する画像 (JPG / PNG / WebP / HEIC / HEIF、5MiB 以下) の base64 文字列。data URL 形式 (data:image/jpeg;base64,...) も可。",
                "type": "string"
              },
              "verification_code": {
                "description": "人間が連携ページで認証を解いて取得した認証コード。無い場合はユーザーに取得を案内してください (連携ページの URL はツール説明を参照)。",
                "type": "string"
              }
            },
            "required": ["image_base64"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "has_results": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "actress_id": {
                      "type": "string"
                    },
                    "actress_name": {
                      "type": "string"
                    },
                    "similarity": {
                      "type": "number"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["actress_id", "actress_name", "similarity", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              }
            },
            "required": ["has_results", "notice", "results"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc25abc9a20fe6deb5218fa4dd95b0413095ed2d96d770c4ded6c0c747cfc0e5"
        },
        {
          "name": "search",
          "title": "作品・女優を検索",
          "description": "AV女優判定AI のデータベース (FANZA ビデオ / FANZA 素人 / MGS 動画) をキーワード検索します。作品タイトル・品番・メーカー名・女優名で検索でき、女優名に完全一致した場合は女優ページも返します。認証は不要です。結果の URL は本サイトの作品 / 女優ページです。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "floor": {
                "description": "絞り込むフロア。'a' = FANZAビデオ, 'c' = FANZA素人, 'mgs' = MGS動画。省略時は全フロア。",
                "type": "string"
              },
              "page": {
                "description": "ページ番号 (1 始まり、最大 100)。省略時は 1。",
                "type": "integer"
              },
              "query": {
                "description": "検索語 (女優名 / 作品タイトル / 品番 / メーカー名など)。100 文字以内。",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "actresses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "actress_id": {
                      "type": "string"
                    },
                    "actress_name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["actress_id", "actress_name", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "contents": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content_id": {
                      "type": "string"
                    },
                    "floor": {
                      "type": "string"
                    },
                    "floor_label": {
                      "type": "string"
                    },
                    "maker_name": {
                      "type": "string"
                    },
                    "released_at": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "top_actress_id": {
                      "type": "string"
                    },
                    "top_actress_name": {
                      "type": "string"
                    },
                    "top_actress_url": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["content_id", "floor", "floor_label", "title", "url"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "floor": {
                "type": "string"
              },
              "floor_counts": {
                "additionalProperties": {
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "object"
              },
              "has_next_page": {
                "type": "boolean"
              },
              "notice": {
                "type": "string"
              },
              "page": {
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "total_hits": {
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["actresses", "contents", "has_next_page", "notice", "page", "query", "total_hits"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
