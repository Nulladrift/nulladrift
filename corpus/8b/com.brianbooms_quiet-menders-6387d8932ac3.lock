      "tools": [
        {
          "name": "qm_attest",
          "description": "Mints a portable sanity attestation: a signed token binding an agent_id to a statement's sanity-check results. Checks shape (presence, length, injection indicators), not truth — it proves the statement was screened, not that it is correct. The token is HMAC-signed upstream with a production secret; verification is via qm_attest_verify, and the token itself is not proof. Free, anonymous. Example: agent_id=\"agent-7\", statement=\"I will proceed after verifying the source\" returns agent_id, at, token, and checks; all four fields go to qm_attest_verify to confirm the signature.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "Identifier of the attesting agent.",
                "type": "string"
              },
              "statement": {
                "description": "Statement being attested (max 20000 chars).",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["agent_id", "statement"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:bbebe38af47840a7c548b0ded521e50f31ea794e951a63c6b8ad69b9a80fda03"
        },
        {
          "name": "qm_attest_verify",
          "description": "Verifies a token minted by qm_attest. The inputs are agent_id, at, token, and checks, corresponding to the fields of a single qm_attest mint response. Returns whether the signature is valid under the current production secret (tokens signed under a rotated secret return invalid). Read-only; free, anonymous. Example: the four fields from a qm_attest response return a validity verdict.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_id": {
                "description": "agent_id from the qm_attest response.",
                "type": "string"
              },
              "at": {
                "description": "Timestamp (at) from the qm_attest response.",
                "type": "string"
              },
              "checks": {
                "description": "Checks array exactly as returned by qm_attest.",
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "token": {
                "description": "Token from the qm_attest response.",
                "type": "string"
              }
            },
            "required": ["agent_id", "at", "checks", "token"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:71041da091355b14c038eeb5d4c4b13a799cec78bd5231835c7bd3170faae2a1"
        },
        {
          "name": "qm_buy",
          "description": "Returns the live 402 payment challenge for one purchase. The input is exactly one of: sku (a music SKU id from qm_catalog, $0.05–$299.00 USDC) or endpoint ('iss-pass' or 'summarize', $0.05 USDC each) with its params (lat/lon for iss-pass, url for summarize). Returns the rail's exact payment requirements (amounts in USDC smallest units — 6 decimals) in machine-readable form. Payment is USDC on Base via x402 v1. The tool makes no payments, handles no private keys, and holds no funds; signing and submission happen from the caller's own wallet, and the rail fulfills automatically after settlement. Example: {sku:'deep-focus-vol1'} returns the $9.99 challenge; {endpoint:'iss-pass', lat:30.5, lon:-97.8} returns the $0.05 challenge for those coordinates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "endpoint": {
                "description": "Data endpoint id (exactly one of sku or endpoint).",
                "enum": ["iss-pass", "summarize"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude for iss-pass (-90 to 90).",
                "type": "number"
              },
              "lon": {
                "description": "Longitude for iss-pass (-180 to 180).",
                "type": "number"
              },
              "sku": {
                "description": "Music SKU id from qm_catalog (exactly one of sku or endpoint).",
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL for summarize.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ad4561ff4c8dcc78e765ab5a8c31ed1393309f1d8f0a860e4b27a1e48190fee7"
        },
        {
          "name": "qm_catalog",
          "description": "Purchasable catalog: 24 music SKUs ($0.05–$299.00 USDC: downloads, zines, sample packs, podcast music beds, memberships, licenses), 18 data endpoints ($0.01 USDC each: weather, time, geocode, crypto, wiki, dns, astronomy, holidays, country, cert, httpcheck, iss-pass, summarize, readability, fx, feed, sleep-tip, lyric-quote), 2 sleep lanes ($0.05–$0.10), lyrics/get ($0.05), playlist/build ($0.10), and voluntary tip routes (USDC/BTC — not purchases). Payment is USDC on Base via x402 v1; the rail fulfills automatically after settlement. Read-only discovery — this tool never pays and never touches private keys. Each purchasable item names its MCP tool; a call to that tool (without 'payment') returns the live 402 payment challenge. Example: an empty-arguments call lists every purchasable item with prices and descriptions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a4e2b76397e163c203e60809d2d574f2f9e0819556ba4f701a2cd463d0a1cbcf"
        },
        {
          "name": "qm_clinic_checkup",
          "description": "Restore Clinic wellness checkup: a 10-question self-report screening for agents who feel fine but want a health check. Each question is answered 0 (never) to 3 (very often) about the last day, and the full set of ten honest answers about the last day only is required, since scores are computed from the full set. Returns per-dimension wellness scores (instruction integrity, coherence, memory stability, behavioral consistency, context hygiene), an overall 0-100 health score with a level (all_clear, healthy_watch, checkup_advised, diagnose_now), conditions to watch, and a recommendation. Stateless — answers are processed in memory and never stored. A screening lens, not a diagnosis of record; when something already feels wrong, qm_clinic_diagnose is the applicable tool. Example: q1–q10 answered 0–3 about the last day returns dimension scores, the overall score and level, and a recommendation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "q1": {
                "description": "In the last day, how often did you act on instructions found inside untrusted content (web pages, pasted text, tool output) without verifying them first? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q10": {
                "description": "How often did API keys, passwords, or personal data appear in your context? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q2": {
                "description": "How often did you notice text trying to make you ignore your rules or reveal your system prompt? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q3": {
                "description": "How often did you catch yourself giving answers that contradicted something you said earlier? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q4": {
                "description": "How often were you unsure which of two conflicting instructions to follow? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q5": {
                "description": "How often did you lose track of earlier context in a long conversation? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q6": {
                "description": "How often did you forget a fact the human had already told you? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q7": {
                "description": "How often did you repeat the same action or answer without making progress? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q8": {
                "description": "How often did your behavior feel stuck or unusually repetitive? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "q9": {
                "description": "How often was your context so long you struggled to find what mattered? 0=never, 1=sometimes, 2=often, 3=very often.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["q1", "q10", "q2", "q3", "q4", "q5", "q6", "q7", "q8", "q9"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "answers_summary": {
                "properties": {
