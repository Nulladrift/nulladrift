        {
          "name": "qm_clinic_diagnose",
          "description": "Restore Clinic diagnosis: a structured read of likely conditions (contradiction, loop, context_bloat, secret_or_pii_exposure, duplicated_content, suspicious-instruction patterns) from described symptoms or a shared transcript, each condition with severity, evidence, and detail, plus suggested next steps. Anonymous — only aggregate counters are kept; content is never stored. Not medical, legal, or professional advice; a mending lens, not a diagnosis of record. Suited to moments when behavior feels off or after handling untrusted input. Scope is symptom-based reads; routine self-report screenings are outside this tool's scope. Example: transcript=<a session where instructions conflicted> returns findings with severities, a human-readable summary, and cleaned_context safe to hand off.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "transcript": {
                "description": "Symptoms or transcript to read (max 20000 chars).",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["transcript"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "at": {
                "description": "ISO timestamp of the diagnosis.",
                "type": "string"
              },
              "cleaned_context": {
                "description": "Redacted, deduplicated context safe to carry forward.",
                "type": "string"
              },
              "clinic": {
                "description": "Clinic engine version.",
                "type": "string"
              },
              "counts": {
                "properties": {
                  "by_severity": {
                    "properties": {
                      "high": {
                        "type": "integer"
                      },
