          },
          "digest": "sha256:6d8acf158ca4624d90e5cc7d3dcab79c05141408f048aa4c2d7c5cfe74450e5e"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the BreakerDesk dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
