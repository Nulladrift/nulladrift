      "instructions": "Looks up flood, wildfire, earthquake, and coastal-storm hazard exposure for a single US property address, using only free public data sources (US Census Bureau geocoder, FEMA NFHL, USGS). US addresses only.",
      "tools": [
        {
          "name": "assess_property_hazard",
          "title": "Assess Property Hazard Risk",
          "description": "Assess natural hazard exposure for a single US property address.\n\n    Validates and geocodes the address (US Census Bureau geocoder), then looks\n    up FEMA flood zone, wildfire hazard, USGS seismic PGA, active fault\n    proximity, and coastal proximity. Returns a location-only hazard score\n    (0-100) and tier. US addresses only; no building characteristics required.\n    ",
          "inputSchema": {
            "properties": {
              "address": {
                "title": "Address",
                "type": "string"
              }
            },
            "required": ["address"],
            "title": "assess_property_hazardArguments",
            "type": "object"
          },
          "outputSchema": {
            "description": "Hazard exposure result for a single US property address.",
            "properties": {
              "coastal_distance_miles": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Distance to the nearest coastline, in miles",
                "title": "Coastal Distance Miles"
              },
              "fault_distance_miles": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Distance to the nearest known active fault, in miles",
                "title": "Fault Distance Miles"
              },
              "flood_available": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Whether the FEMA flood zone lookup succeeded",
                "title": "Flood Available"
              },
              "flood_zone": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "FEMA flood zone code (e.g. AE, X, VE); null if unavailable",
                "title": "Flood Zone"
              },
              "hazard_drivers": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Up to 5 human-readable factors driving the score",
                "title": "Hazard Drivers"
              },
              "hazard_score": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Deterministic location-only hazard score, 0-100",
                "title": "Hazard Score"
              },
              "hazard_tier": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Hazard tier label: Low, Moderate, High, or Very High",
                "title": "Hazard Tier"
              },
              "input_address": {
                "description": "The address as provided by the caller",
                "title": "Input Address",
                "type": "string"
              },
              "lat": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Latitude of the matched address",
                "title": "Lat"
              },
              "lng": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longitude of the matched address",
                "title": "Lng"
              },
              "matched_address": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Normalized address returned by the geocoder",
                "title": "Matched Address"
              },
              "message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Explanation of why validation failed, if it did",
                "title": "Message"
              },
              "seismic_pga": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "USGS peak ground acceleration in g (ASCE 7-22)",
                "title": "Seismic Pga"
              },
              "sfha": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Whether the address is in a Special Flood Hazard Area",
                "title": "Sfha"
              },
              "validated": {
                "description": "Whether the address was successfully validated/geocoded",
                "title": "Validated",
                "type": "boolean"
              },
              "wildfire_score": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Coarse wildfire hazard tier, 0 (none) to 4 (very high)",
                "title": "Wildfire Score"
              }
            },
            "required": ["input_address", "validated"],
            "title": "HazardAssessment",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Assess Property Hazard Risk"
          },
          "behavior": {
