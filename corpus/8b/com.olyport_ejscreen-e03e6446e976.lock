      "tools": [
        {
          "name": "get_demographic_indicators",
          "description": "Get demographic vulnerability indicators by block group.\n\n    Returns demographic data including minority percentage, low income\n    percentage, linguistic isolation, education levels, and age\n    distributions. These are the demographic components used in\n    EJScreen's EJ index calculations.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA').\n        county_fips: Optional county FIPS code (3-digit or 5-digit).\n                     If omitted, returns state-level results sorted by\n                     highest demographic index.\n        limit: Maximum number of block groups to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_demographic_indicatorsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_demographic_indicatorsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a74bf65aee7157455c3fa9bbcf6f93b61758df1b6627ffbd2d8d8271df4ef5d8"
        },
        {
          "name": "get_ej_county_summary",
          "description": "Get EJ indicators for census block groups in a county.\n\n    Returns EJScreen environmental justice data for block groups within\n    the specified county, sorted by highest overall environmental burden.\n    Includes environmental indicators, demographic data, and EJ indexes.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA').\n        county_fips: County FIPS code, either 5-digit full (e.g. '53033')\n                     or 3-digit county portion (e.g. '033'). If 3 digits,\n                     state FIPS is prepended automatically.\n        limit: Maximum number of block groups to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "title": "County Fips",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["county_fips", "state"],
            "title": "get_ej_county_summaryArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_ej_county_summaryOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b86e896b126eda0580da7ab7b28b9b096d3dca9d7214a2249aaae98f437a71d"
        },
        {
          "name": "get_ej_data_by_location",
          "description": "Get EJScreen environmental justice data for a specific location.\n\n    Uses the EPA EJScreen REST broker to retrieve EJ screening indicators\n    for a point location with a buffer distance. Returns environmental\n    indicators, demographic data, and EJ indexes.\n\n    Args:\n        latitude: Latitude of the location (e.g. 47.61).\n        longitude: Longitude of the location (e.g. -122.33).\n        distance: Buffer distance in miles around the point (default 1.0).\n    ",
          "inputSchema": {
            "properties": {
              "distance": {
                "default": 1,
                "title": "Distance",
                "type": "number"
              },
              "latitude": {
                "title": "Latitude",
                "type": "number"
              },
              "longitude": {
                "title": "Longitude",
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "title": "get_ej_data_by_locationArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_ej_data_by_locationOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aff72efddc989b74bf44569cf4a8dde880745650456ea4fc2779a57432442df4"
        },
        {
          "name": "get_ej_state_summary",
          "description": "Get a state-level overview of EJ indicators across block groups.\n\n    Returns the most environmentally burdened block groups in the state,\n    sorted by PM2.5 percentile. Useful for identifying areas with the\n    highest environmental justice concerns.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA').\n        limit: Maximum number of block groups to return (default 100, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 100,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_ej_state_summaryArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_ej_state_summaryOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:53cfc03b6a31712b7146a0405068c4a57c03c9decf8e67a2d241428ffe0ba248"
        },
        {
          "name": "get_environmental_indicators",
          "description": "Get specific environmental indicators by block group.\n\n    Returns environmental indicator values and state percentiles for\n    block groups. Can filter to a specific indicator type or return all.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'WA', 'CA').\n        county_fips: Optional county FIPS code (3-digit or 5-digit).\n                     If omitted, returns state-level results.\n        indicator: Optional specific indicator to focus on. Options:\n                   'pm25', 'ozone', 'diesel', 'cancer', 'respiratory',\n                   'traffic', 'lead', 'superfund', 'hazwaste',\n                   'wastewater', 'rmp', 'ust'. If omitted, returns all.\n        limit: Maximum number of block groups to return (default 50, max 500).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "indicator": {
                "default": null,
                "title": "Indicator",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "get_environmental_indicatorsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_environmental_indicatorsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a022e7f131320e9a9dc0915a8b0101203583143cf6a285d74ca91d548514b924"
        }
