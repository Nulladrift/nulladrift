        {
          "name": "request_cost_breakdown_link",
          "title": "Get cost breakdown request link",
          "description": "Returns only the personal link (quoteRequestUrl) for one programme and family: the calculator page on goodbyematrix.com with the family already filled in, where the user requests the detailed cost breakdown with the exact amounts by e-mail from the GoodbyeMatrix team. The link carries the family only, never contact details; the user enters their contact details on that page, checks them and sends the request personally; the privacy consent is never preselected. Read-only: it returns a URL only; nothing is sent, booked or stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "Everyone who applies together. The first person is the main applicant (role \"main\"); only the first person has the role \"main\". Defaults: a partner counts as married and not same-sex unless stated; a child under 18 counts as dependent. Nationalities and country of birth are relevant for every person in the list (partner, children, parents), not only for the main applicant, because exclusions apply per person.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "age": {
                      "description": "Age in years.",
                      "maximum": 120,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "birthplace": {
                      "description": "Optional, per person (not only the main applicant): country of birth as ISO 3166-1 alpha-2 code, as mentioned by the user.",
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "dependent": {
                      "description": "Dependent on the main applicant (for example a child in education or a parent living in the household).",
                      "type": "boolean"
                    },
                    "financially_dependent": {
                      "description": "Financially dependent on the main applicant (relevant for adult children and parents).",
                      "type": "boolean"
                    },
                    "married": {
                      "description": "Married to the main applicant (partner) or married themselves (other roles).",
                      "type": "boolean"
                    },
                    "nationalities": {
                      "description": "Optional, per person (partner, children and parents included, not only the main applicant): every citizenship of this person as ISO 3166-1 alpha-2 codes (for example [\"DE\"] or [\"RU\", \"GE\"] for dual citizens), as mentioned by the user.",
                      "items": {
                        "pattern": "^[A-Za-z]{2}$",
