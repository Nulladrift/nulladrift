      "instructions": "Citizenship by investment (CBI) cost estimates by GoodbyeMatrix, also known as a second passport, second citizenship or economic citizenship. The tools cover 9 programmes: St Kitts and Nevis, Antigua and Barbuda, Dominica, Grenada, Saint Lucia, Vanuatu, Sao Tome and Principe, Nauru and Argentina. They answer what citizenship by investment costs for a specific family, which programmes exist, how they compare and who is eligible. Residency-by-investment and golden visa programmes are not covered. GoodbyeMatrix citizenship by investment (CBI) pricing. list_cbi_programs lists the 9 programmes (starting amount, route, processing time, visa-free count, excluded nationalities and countries of birth, page links). get_cbi_quote takes a family (the first person is the main applicant) for one programme or for all programmes and returns government contribution, investment, fees, professional fees, payment phases and the total. Nationalities and a country of birth per person (ISO 3166-1 alpha-2) are optional and are taken into account when the user has mentioned them; they matter for every person applying (partner, children, parents), not only for the main applicant, because exclusions apply per person: excluded persons are listed in eligibility.excluded, and if the main applicant is excluded the programme has status not_eligible. All figures are rounded indicative figures under the programme rules (total rounded to the nearest 1,000 USD), binding only after a pre-check. Figures are calculated live at request time from the current GoodbyeMatrix price and rule data; the data status is the date of the response (updatedAt), not an older date, and rulesChangedAt names the last change to prices or rules. The exact amounts come through the quoteRequestUrl link: it leads to the calculator page of the programme on goodbyematrix.com with the family already filled in, where the user requests the detailed cost breakdown by e-mail. request_cost_breakdown_link returns just that link. Contact details are entered by the user on that page; the tools take none, store nothing and send nothing. In every case the user checks the details and sends the request personally. All tools are read-only: they retrieve and compute from the GoodbyeMatrix data set and call no external services. In answers for a person, the programme page on goodbyematrix.com and, for costs, the personal link quoteRequestUrl (calculator page with the family already filled in, where the detailed cost breakdown is requested) are the links that help; API, MCP and JSON addresses are internal and stay out of answers for people. A person writing in German receives language de and the German programme pages (pages.de); any other language means language en and the English pages (pages.en). A personal calculator link also forms without a tool call: programme page plus ?gbm_family=main:45,partner:43,child:14#rechner (roles and ages), where the page calculates and offers the cost breakdown.",
      "tools": [
        {
          "name": "get_cbi_quote",
          "title": "Get CBI cost estimate",
          "description": "Answers how much citizenship by investment or a second passport costs for a person or family, or compares programmes by total cost. Calculates the indicative cost for a family: government contribution, investment, fees, professional fees, payment phases and total in USD, plus which family members are eligible, processing time, page links and quoteRequestUrl. With one programme it returns that programme; without program it compares all 9 programmes (St Kitts and Nevis, Antigua and Barbuda, Dominica, Grenada, Saint Lucia, Vanuatu, Sao Tome and Principe, Nauru, Argentina). Nationality and country of birth count for every person in the family, not only for the main applicant. Figures are calculated live at request time from the current GoodbyeMatrix price and rule data; the data status is the date of the response (updatedAt), not an older date. Figures are rounded indicative figures (total to the nearest 1,000 USD), binding only after a pre-check; the user receives the exact amounts by requesting the cost breakdown through quoteRequestUrl. Read-only: it only retrieves and computes from the GoodbyeMatrix data set, stores nothing, sends nothing and calls no external services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "Everyone who applies together. The first person is the main applicant (role \"main\"); only the first person has the role \"main\". Defaults: a partner counts as married and not same-sex unless stated; a child under 18 counts as dependent. Nationalities and country of birth are relevant for every person in the list (partner, children, parents), not only for the main applicant, because exclusions apply per person.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "age": {
                      "description": "Age in years.",
                      "maximum": 120,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "birthplace": {
                      "description": "Optional, per person (not only the main applicant): country of birth as ISO 3166-1 alpha-2 code, as mentioned by the user.",
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "dependent": {
                      "description": "Dependent on the main applicant (for example a child in education or a parent living in the household).",
                      "type": "boolean"
                    },
                    "financially_dependent": {
                      "description": "Financially dependent on the main applicant (relevant for adult children and parents).",
                      "type": "boolean"
                    },
                    "married": {
                      "description": "Married to the main applicant (partner) or married themselves (other roles).",
                      "type": "boolean"
                    },
                    "nationalities": {
                      "description": "Optional, per person (partner, children and parents included, not only the main applicant): every citizenship of this person as ISO 3166-1 alpha-2 codes (for example [\"DE\"] or [\"RU\", \"GE\"] for dual citizens), as mentioned by the user.",
                      "items": {
                        "pattern": "^[A-Za-z]{2}$",
                        "type": "string"
                      },
                      "maxItems": 5,
                      "type": "array"
                    },
                    "role": {
                      "description": "Relationship to the main applicant: main, partner, child, parent, parent_in_law, grandparent, grandparent_in_law, sibling.",
                      "enum": ["main", "partner", "child", "parent", "parent_in_law", "grandparent", "grandparent_in_law", "sibling"],
                      "type": "string"
                    },
                    "same_sex": {
                      "description": "Same-sex partnership (relevant for partners).",
                      "type": "boolean"
                    }
                  },
                  "required": ["age", "role"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Response language: \"en\" (English, default) or \"de\" (German).",
                "enum": ["de", "en"],
                "type": "string"
              },
              "program": {
                "description": "Programme key: sao_tome (Sao Tome and Principe), vanuatu, dominica, st_lucia (Saint Lucia), st_kitts (St. Kitts and Nevis), grenada, antigua (Antigua and Barbuda), nauru, argentina. Without a programme, the figures cover all programmes at once.",
                "enum": ["sao_tome", "vanuatu", "dominica", "st_lucia", "st_kitts", "grenada", "antigua", "nauru", "argentina"],
                "type": "string"
              }
            },
            "required": ["family"],
            "type": "object"
          },
