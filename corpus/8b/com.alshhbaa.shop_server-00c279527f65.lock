        },
        {
          "name": "list_categories",
          "title": "List Lighting Categories",
          "description": "Use when a shopper wants to browse store departments before searching specific items. Returns published lighting categories (chandeliers, lamps, sconces, chandelier accessories) with numeric IDs, slugs, and canonical URLs.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum number of categories to return (1-50). Defaults to 25.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "content": {
                "items": {
                  "properties": {
                    "text": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
