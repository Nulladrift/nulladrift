        "name": "alshhbaa-store-mcp",
        "title": "Alshhbaa Brassware Store MCP Server",
        "version": "2026-01-01",
        "description": "Official product and commerce MCP server for Alshhbaa Brassware — search luxury chandeliers, inspect product specs and VAT-inclusive SAR pricing, browse categories, and validate shopping carts."
      },
      "capabilities": {
        "experimental": {
          "apps": {},
          "io.modelcontextprotocol/apps": {},
          "mcp.apps": {}
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "Alshhbaa Brassware Store MCP Server provides commerce tools for searching luxury chandeliers, inspecting product details, listing categories, and validating shopping carts on shop.alshhbaa.com. For API and developer documentation, connect to https://shop.alshhbaa.com/docs/mcp.",
      "tools": [
        {
          "name": "get_product_details",
          "title": "Get Product Details",
          "description": "Use after searching or when you already know a product slug, numeric ID, or name and need full details. Returns the live VAT-inclusive SAR price, stock quantity, SKU, Arabic description, image URLs, and canonical product URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Numeric product ID.",
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Product name or search phrase when slug is unknown.",
                "type": "string"
              },
              "slug": {
                "description": "Product URL slug (e.g. \"chandelier-1\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "content": {
                "items": {
                  "properties": {
                    "text": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["text", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "structuredContent": {
                "properties": {
                  "product": {
                    "properties": {
                      "currency": {
                        "type": "string"
                      },
                      "description": {
                        "type": ["string", "null"]
                      },
                      "id": {
                        "type": "integer"
                      },
                      "images": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "inStock": {
                        "type": "boolean"
                      },
                      "name": {
                        "type": "string"
                      },
                      "price": {
                        "type": ["number", "null"]
                      },
                      "priceFormatted": {
                        "type": "string"
                      },
                      "priceIncludesVat": {
                        "type": "boolean"
                      },
                      "sku": {
                        "type": "string"
                      },
                      "slug": {
                        "type": "string"
                      },
                      "stockQuantity": {
                        "type": ["integer", "null"]
                      },
                      "url": {
                        "format": "uri",
                        "type": "string"
                      }
                    },
                    "type": ["object", "null"]
                  },
                  "resourceUri": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
