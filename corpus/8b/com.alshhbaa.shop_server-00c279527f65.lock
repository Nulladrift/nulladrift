        {
          "name": "search_products",
          "title": "Search Alshhbaa Brassware Products",
          "description": "Use when a shopper wants to discover luxury brass chandeliers, table lamps, wall sconces, or glass cups by Arabic or English keywords. Returns matching product IDs, SKUs, VAT-inclusive SAR prices, and canonical storefront URLs.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Maximum number of product suggestions to return (1-20). Defaults to 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search query for chandeliers, chandelier accessories, lamps, and wall sconces (e.g. \"ثريا\", \"chandelier\").",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "content": {
                "items": {
                  "properties": {
                    "text": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["text", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "structuredContent": {
                "properties": {
                  "endpoint": {
                    "format": "uri",
                    "type": "string"
                  },
