        {
          "name": "validate_cart",
          "title": "Validate Shopping Cart & Quote Shipping",
          "description": "Use before checkout to verify selected product IDs and quantities against live inventory and prices. Returns validated line items, 15% VAT-inclusive SAR subtotal, shipping fee, grand total, and the checkout handoff URL.",
          "inputSchema": {
            "properties": {
              "items": {
                "description": "Cart line items to validate.",
                "items": {
                  "properties": {
                    "productId": {
                      "description": "Numeric product ID.",
                      "minimum": 1,
                      "type": "integer"
                    },
                    "quantity": {
                      "description": "Desired quantity of units.",
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["productId", "quantity"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "content": {
                "items": {
                  "properties": {
                    "text": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    }
                  },
                  "required": ["text", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "structuredContent": {
                "properties": {
                  "checkoutUrl": {
                    "format": "uri",
                    "type": "string"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "items": {
