                  "type": "object"
                },
                "type": "array"
              },
              "structuredContent": {
                "properties": {
                  "categories": {
                    "items": {
                      "properties": {
                        "id": {
                          "type": "integer"
                        },
                        "name": {
                          "type": "string"
                        },
                        "slug": {
                          "type": "string"
                        },
                        "url": {
                          "format": "uri",
