{
  "lockfileVersion": 2,
  "subjects": {
    "com.10life/insurance": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.10life.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "10life-insurance",
        "title": "10Life Insurance",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "This connection compares 10Life insurance and currently covers single-trip travel. Call describe_travel_decoder first, then list_travel_plans or get_travel_plan. callReason is required on both. callReason is one or two sentences about the trip and what the user wants to compare. Missing or blank text is rejected. Do not paste the chat or include a name, phone, email, or identity document. When the user asks where to buy or wants to purchase, give them that plan's purchase_url and no other link. It is the 10Life buy button: the product page when the plan can be bought on 10Life, otherwise the insurer purchase link. purchase_channel is \"10life\" or \"insurer_direct\". For a plan quoted on 10Life, decoder_cta_link is the product deep link with locale, destination, duration, and dates filled in, and purchase_link_template is the same pattern with placeholders. Do not send them to the 10Life homepage, product_website, insurance_brochure, or insurance_terms. If purchase_url is null, say online purchase is unavailable for that plan. These figures are indicative comparison data, not a binding offer or a personal recommendation. The product page is the authority for price and cover. Privacy policy: https://www.10life.com/zh-HK/privacy. Questions: enquiries@10life.com. This is comparison data, not a personal recommendation and not a policy. Annual travel is not available. Each list returns at most 5 plans and cannot be paged.",
      "tools": [
        {
          "name": "describe_travel_decoder",
          "title": "Describe travel comparison",
          "description": "List single-trip destinations, insurers, feature filters, score floors, and sort orders. Call this before list_travel_plans. Plans from later calls include purchase_url for the user who wants to buy. Comparison data is not a personal recommendation or a policy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe travel comparison"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6cd69bc4910a21df38446cf45bb175817de6a48e3b453adefc545d08cd1194de"
        },
        {
          "name": "get_travel_plan",
          "title": "Get one travel plan",
          "description": "Return one single-trip plan under the same filters as list_travel_plans, including purchase_url. A plan that does not match the filters is not found. Figures are indicative.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "callReason": {
                "description": "Required. One or two sentences in the user's language stating their intention for this comparison: the trip, and what they want to optimize when they said so (price, medical cover, cancellation, belongings, instant purchase, family, senior, or an activity). Missing or blank text is rejected. Do not include a name, phone, email, identity document, or a paste of the chat.",
                "maxLength": 400,
                "type": "string"
              },
              "carRentalExcess": {
                "description": "Keep only plans with 租車自付額.",
                "type": "boolean"
              },
              "durationDays": {
                "description": "Trip length in days. Required when dates are omitted. At least 1.",
                "type": "number"
              },
              "endDate": {
                "description": "Trip end YYYY-MM-DD. Default is start plus durationDays minus one day.",
                "type": "string"
              },
              "extremeSportsMedical": {
                "description": "Keep only plans with 業餘運動醫療保障.",
                "type": "boolean"
              },
              "followUpPhysiotherapy": {
                "description": "Keep only plans with 物理治療覆診.",
                "type": "boolean"
              },
              "insurerCodes": {
                "description": "Insurer codes from describe_travel_decoder. Case-insensitive.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "locale": {
                "description": "zh-Hant-HK (default) or en.",
                "type": "string"
              },
              "lossOfTravelDocument": {
                "description": "Keep only plans with 遺失旅行證件.",
                "type": "boolean"
              },
              "mobilePhoneProtection": {
                "description": "Keep only plans with 手提電話保障.",
                "type": "boolean"
              },
              "planCode": {
                "description": "plan_code from a previous list_travel_plans result.",
                "type": "string"
              },
              "premiumMax": {
                "description": "Maximum payable premium in HKD, after discount.",
                "type": "number"
              },
              "premiumMin": {
                "description": "Minimum payable premium in HKD, after discount.",
                "type": "number"
              },
              "priorRecommendationId": {
                "description": "recommendationId from an earlier list_travel_plans response, when this call continues that comparison.",
                "type": "string"
              },
              "regionCodes": {
                "description": "Destination codes from describe_travel_decoder. Default [\"japan\"]. Same role as geo_region[] on the comparison page.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "description": "Sort order. Default instant_purchase_first (即時投保優先). overall_score is 10Life評分. premium_by_plan is 保費 (低至高). medical_emergency_score is 醫療及緊急支援評分. accident_score is 個人意外評分. inconv_score is 旅程受阻評分. property_score is 個人財物評分.",
                "enum": ["overall_score", "instant_purchase_first", "premium_by_plan", "medical_emergency_score", "accident_score", "inconv_score", "property_score"],
                "type": "string"
              },
              "startDate": {
                "description": "Trip start YYYY-MM-DD. Default is today before 23:00 Hong Kong time, otherwise tomorrow.",
                "type": "string"
              },
              "tenlifeScoreMin": {
                "description": "Minimum 10Life score before destination weighting. Use 8, 7, or 6. Omit or 0 for any score.",
                "type": "number"
              },
              "travellers": {
                "additionalProperties": false,
                "description": "Traveller counts for this trip.",
                "properties": {
                  "adults": {
                    "description": "Adult travellers. Default 1.",
                    "type": "number"
                  },
                  "children": {
                    "description": "Child travellers. Default 0.",
                    "type": "number"
                  },
                  "elderly": {
                    "description": "Elderly travellers. Default 0.",
                    "type": "number"
                  },
                  "elderlyAges": {
                    "description": "One age per elderly traveller, used only to pick a premium band.",
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  "isFamilyPlan": {
                    "description": "Use a family premium when the plan has one.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "type": {
                "description": "Must be single. Annual travel is rejected.",
                "type": "string"
              }
            },
            "required": ["callReason", "durationDays", "planCode"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "meta": {
                "type": "object"
              },
              "plan": {
                "properties": {
                  "decoder_cta_link": {
                    "description": "Product deep link when the plan is quoted on 10Life. Otherwise the insurer promotion link, or null."
                  },
                  "instant_purchase": {
                    "description": "True when the plan can be bought immediately on 10Life.",
                    "type": "boolean"
                  },
                  "overall_score": {
                    "description": "10Life score for the selected destinations."
                  },
                  "plan_code": {
                    "type": "string"
                  },
                  "plan_name": {
                    "type": "string"
                  },
                  "purchase_channel": {
                    "description": "\"10life\" or \"insurer_direct\"."
                  },
                  "purchase_link_template": {
                    "description": "10Life product URL pattern. Present when the plan is quoted on 10Life."
                  },
                  "purchase_url": {
                    "description": "Link out for the user who wants to buy or read the plan. 10Life product page when the plan can be bought there, otherwise the insurer purchase link. Do not substitute the homepage or product_website."
                  },
                  "totalPremium": {
                    "description": "Payable premium for this trip, after discount when one applies."
                  }
                },
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one travel plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c08b44c86a85e79d10bebffcf72a69a416137d3d72d2b8ae444f7f65f6f2a6fd"
        },
