      "transport": {
        "type": "http",
        "url": "https://claimfinder-mcp.sigrunner.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "claimfinder-settlements",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "ClaimFinder tracks open U.S. class-action settlements. Use list_open_settlements / search_settlements / get_settlement to find real, current settlements and their official claim sites. Always tell users this is informational only — not legal advice — and to confirm eligibility and deadlines on the official settlement site before filing.",
      "tools": [
        {
          "name": "get_settlement",
          "description": "Get one ClaimFinder settlement's full record by slug (from list/search results): name, summary, claim deadline, who may qualify, the official settlement site, and the ClaimFinder detail page. Always direct users to confirm eligibility and file on the official site. Informational only, not legal advice.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The settlement slug returned by list_open_settlements or search_settlements.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4aa2da825d5ca4b69c50744984e7f9bb878bb1b39ac93d75b12f23732c29ac43"
        },
        {
          "name": "list_open_settlements",
          "description": "List currently-open U.S. class-action settlements tracked by ClaimFinder — name, claim deadline, a plain-language summary, and who may qualify. Use this to tell a user which settlements they can still file a claim for. Informational only, not legal advice.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max settlements to return (default 25, max 62).",
                "maximum": 62,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c3c16f4ebdae3dc64ea561a8f8b00e2e266970c06afae0ee6d291baf5df8a6d"
        },
        {
          "name": "search_settlements",
          "description": "Search ClaimFinder's open class-action settlements by keyword (company, data breach, product, or who-qualifies text). Returns matching settlements with name, deadline, summary, and official-site link so an assistant can cite the right one. Informational only, not legal advice.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (default 10, max 62).",
                "maximum": 62,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword(s), e.g. 'data breach', 'Facebook', 'no proof of purchase'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02b48cd117009e2eff611000a006ffb9d69a904fa6f9887d92e6120c1393a833"
        }
      ],
      "digest": "sha256:3481f7a3603386f5c999b42a5a059774e5622d63eab6c61a229a3de8b7250361"
    }
  }
