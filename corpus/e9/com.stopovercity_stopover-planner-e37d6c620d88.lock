{
  "lockfileVersion": 2,
  "subjects": {
    "com.stopovercity/stopover-planner": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.stopovercity.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "stopover-planner",
        "title": "Stopover Planner: live Google Flights search",
        "version": "4.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Live Google Flights search: real GBP prices with a booking link on every flight. Unique searches: multi-day stopover itineraries, country-wide sweeps, explore-anywhere. Requires a RapidAPI key sent as an X-RapidAPI-Key header (free tier available at https://rapidapi.com/stopover-labs-stopover-labs-default/api/stopover-planner). Heavy searches run as background jobs: call the search tool, then poll get_job_result with the returned jobId.",
      "tools": [
        {
          "name": "get_job_result",
          "description": "Poll a search started by a background-job tool. Returns {status:\"pending\"} while running; when status is \"done\" the same object carries the search payload. Poll every 3 to 5 seconds.",
          "inputSchema": {
            "properties": {
              "jobId": {
                "type": "string"
              }
            },
            "required": ["jobId"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:692fcef2ef7510b7ba94ae9e1e87764ab4b864f6bcf9d99376072f6bbc68328a"
        },
        {
          "name": "search_country_sweep",
          "description": "Cheapest live fares from one origin to every destination city in a whole country, in one call (e.g. London to all of Spain). Replaces dozens of route searches. Runs as a background job: returns a jobId; poll get_job_result until done.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country or continent, e.g. \"Spain\"",
                "type": "string"
              },
              "dates": {
                "description": "Departure dates YYYY-MM-DD. 1 to 31 dates per call; must be real calendar dates (2026-02-30 is rejected).",
                "items": {
                  "format": "date",
                  "type": "string"
                },
                "maxItems": 31,
                "minItems": 1,
                "type": "array"
              },
              "nonstop": {
                "description": "Default true",
                "type": "boolean"
              },
              "oneway": {
                "description": "Default true",
                "type": "boolean"
              },
              "origin": {
                "description": "e.g. \"London\"",
                "type": "string"
              }
            },
            "required": ["country", "dates", "origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2d7366ebe6d1624372d72a4ae077f596f1370c504ec3c3c4abd6da44d1472ad1"
        },
        {
          "name": "search_explore_anywhere",
          "description": "Explore everywhere: the cheapest destinations worldwide from an origin on given dates, with live GBP prices and booking links. Great for \"where can I fly cheaply\" questions. Runs as a background job: returns a jobId; poll get_job_result until done.",
          "inputSchema": {
            "properties": {
              "dates": {
                "description": "Departure dates YYYY-MM-DD. 1 to 31 dates per call; must be real calendar dates (2026-02-30 is rejected).",
                "items": {
                  "format": "date",
                  "type": "string"
                },
                "maxItems": 31,
                "minItems": 1,
                "type": "array"
              },
              "nonstop": {
                "description": "Default true",
                "type": "boolean"
              },
              "oneway": {
                "description": "Default true",
                "type": "boolean"
              },
              "origin": {
                "description": "e.g. \"London\"",
                "type": "string"
              }
            },
            "required": ["dates", "origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7da95a96e3916c1fc8309ef7bf3619b74c2baa6f018b8cf2239745dcf5f7a7aa"
        },
        {
          "name": "search_flights",
          "description": "Live Google Flights prices for one route across one or more dates. Each flight includes airline, GBP price, duration, stops, times, and a Google Flights booking link. Synchronous: typically 5 to 20 seconds.",
          "inputSchema": {
            "properties": {
              "dates": {
                "description": "Departure dates YYYY-MM-DD. 1 to 31 dates per call; must be real calendar dates (2026-02-30 is rejected).",
                "items": {
                  "format": "date",
                  "type": "string"
                },
                "maxItems": 31,
                "minItems": 1,
                "type": "array"
              },
              "destination": {
                "description": "e.g. \"Madrid\"",
                "type": "string"
              },
              "nonstop": {
                "description": "Default true",
                "type": "boolean"
              },
              "oneway": {
                "description": "Default true",
                "type": "boolean"
              },
              "origin": {
                "description": "e.g. \"London\"",
                "type": "string"
              }
            },
            "required": ["dates", "destination", "origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8c7ea431a32670ba1a65a1ff3156dab4482e4991fa4715e5137d20ce5256762b"
        },
        {
          "name": "search_stopover_itineraries",
          "description": "Find complete multi-day stopover itineraries between two cities: an outbound leg, 1 to 7 days in an intermediate hub city, then the onward leg, priced as one trip from live Google Flights data (GBP) with a booking link on every leg. One call evaluates dozens of hub cities and date splits. Runs as a background job: returns a jobId immediately; poll get_job_result every few seconds until status is done.",
          "inputSchema": {
            "properties": {
              "deadlineDates": {
                "description": "Latest arrival date(s) at the destination, YYYY-MM-DD. 1 to 31 dates per call; must be real calendar dates (2026-02-30 is rejected).",
                "items": {
                  "format": "date",
                  "type": "string"
                },
                "maxItems": 31,
                "minItems": 1,
                "type": "array"
              },
              "destination": {
                "description": "Final destination, e.g. \"Tokyo\"",
                "type": "string"
              },
              "layoverDays": {
                "description": "Days to spend in the hub city (default 3)",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "nonstop": {
                "description": "Nonstop legs only (default true)",
                "type": "boolean"
              },
              "origin": {
                "description": "Origin city or airport, e.g. \"London\"",
                "type": "string"
              }
            },
            "required": ["deadlineDates", "destination", "origin"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5fe7d3f7ab588fb6574bea0eab1b0a620ee00e3c334374bd45f95487cd8f2dca"
        }
      ],
      "digest": "sha256:e33e8941443ec3c2454908fb4a3cae0350f92f01307036e49d4082f2a7f16b32"
    }
  }
}
