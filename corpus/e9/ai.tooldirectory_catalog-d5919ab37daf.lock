        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tooldirectory.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tooldirectory-ai",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to the AI Tool Directory catalog. Use check_tool_status before recommending a tool to confirm it still exists.",
      "tools": [
        {
          "name": "check_tool_status",
          "title": "Check if a tool is still active",
          "description": "Check whether an AI tool is still alive. Returns active, deceased, or acquired — with the date and cause if it shut down, and live alternatives if it did. Use this before recommending a tool to avoid suggesting one that no longer exists.",
          "inputSchema": {
            "properties": {
              "tool": {
                "description": "Tool name or directory slug to check, e.g. \"Jasper\" or \"jasper-ai\".",
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check if a tool is still active"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25c1b9c64fa2b2249ed40b61a5f1fbbcb154aa56e364adff16f6bcce965d9458"
        },
        {
          "name": "compare_tools",
          "title": "Compare two tools",
          "description": "Compare two AI tools side by side by their directory slugs. Returns each tool’s profile (pricing, rating, editorial verdict, lifecycle) plus the editor’s head-to-head verdict and bottom line when one exists for the pair.",
          "inputSchema": {
            "properties": {
              "slugA": {
                "description": "Directory slug of the first tool.",
                "type": "string"
              },
              "slugB": {
                "description": "Directory slug of the second tool.",
                "type": "string"
              }
            },
            "required": ["slugA", "slugB"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare two tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e65e97f4085c783e3ad3577d158c47e6fadb9b3eb4c7a6faf74df06d38a0dbde"
        },
        {
          "name": "find_alternatives",
          "title": "Find tool alternatives",
          "description": "Find curated alternatives to a given AI tool by its directory slug. If the tool has shut down, returns live replacements. Good for \"what should I use instead of X\" questions.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The directory slug of the tool to find alternatives for.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find tool alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f6f825e31307c234a23fc39ca81931bfa721b5d12466b197857a2f85ecf0e2b8"
        },
        {
          "name": "get_tool",
          "title": "Get tool details",
          "description": "Get the full profile of one AI tool by its directory slug: description, pricing, key features, editorial verdict and rating, the date it was last human-verified, lifecycle status, and the official site URL.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The directory slug, e.g. \"gamma-app-ai-powered-presenting-ideas\" (from search_tools).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get tool details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:954c1c9481cfb045962ce9c72332e85c41c11d6766926414b195200267c46814"
        },
        {
          "name": "list_tools",
          "title": "List tools by category or role",
          "description": "List the top-rated active AI tools in a category or for a job role, optionally filtered by pricing. Good for \"what are the best AI tools for sales\" or \"free tools in <category>\".",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug (from search_tools results), e.g. \"productivity\".",
                "type": "string"
              },
              "limit": {
                "description": "Max results (1-20, default 8).",
                "type": "integer"
              },
              "pricing": {
                "description": "Optional pricing filter: Free, Freemium, Free Trial, or Paid.",
                "type": "string"
              },
              "role": {
                "description": "Job-role slug, e.g. \"sales\", \"marketing\", \"customer-support\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List tools by category or role"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a611cc093cfb3468a0af592865b411c7e8e78e150a832c14a2e0b77d0668035f"
        },
        {
          "name": "search_tools",
          "title": "Search AI tools",
          "description": "Search the AI Tool Directory catalog (2,000+ AI tools) by keyword, use case, or category using hybrid semantic search. Returns ranked tools with slug, one-line description, pricing model, and rating. Use this to discover tools, then get_tool for full detail.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (1-20, default 8).",
                "type": "integer"
              },
              "query": {
                "description": "What the user is looking for, e.g. \"AI video editing\" or \"alternatives to Jasper\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search AI tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:49bf1bcc1de057d1bfa1d42bba01349cff7cca852a366b5f4988c2aeb94f0146"
        }
      ],
      "digest": "sha256:3c4a138978d928e06da26231c04987f75e0e96f00958aae1c1e2338d9ad66229"
