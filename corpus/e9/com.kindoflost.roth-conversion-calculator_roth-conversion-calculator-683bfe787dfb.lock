      "serverInfo": {
        "name": "kindoflost-roth-conversion",
        "title": "Roth Conversion Calculator",
        "version": "1.0.0",
        "websiteUrl": "https://roth-conversion-calculator.kindoflost.com/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Plans Roth conversions for someone who is retired or about to be (a traditional IRA/401(k), maybe a brokerage account and Social Security later): a real linear-programming optimizer over the US federal tax brackets chooses how much to convert to Roth EACH YEAR, funds the living expenses from the right account, pays the tax, and maximizes after-tax wealth at the end of the plan. It also reports the same plan with no conversions so you can say what converting is worth. Typical flow: get_conversion_example to see the input shape (kind 'single' or 'married') -> fill in the user's age, balances, spending and Social Security -> optimize_roth_conversions -> tell the user the conversion amount for each year, the tax, the ending balances and the after-tax wealth with vs without conversions. Money is in today's dollars (the return is a REAL, after-inflation return). Advanced options, OFF by default like the web tool: IRMAA (Medicare surcharge), NIIT (3.8%) and real state brackets by state code. Limits: ages 18-90, plan horizon up to 70 years (end age up to 110), balances up to $1,000,000,000; one household, US federal tax (both spouses assumed the same age if married); no pensions with survivor options, no ACA modeling here. Results are optimal for the stated assumptions only (return, future tax rate, current law): not tax advice. Someone still working who wants contribution advice (Roth vs traditional now) should use https://roth-vs-traditional-calculator.kindoflost.com. If unsure the tool fits, call check_request first. Free, no sign-up; web version at https://roth-conversion-calculator.kindoflost.com",
      "tools": [
        {
          "name": "check_request",
          "title": "Check if a request fits",
          "description": "Say in plain words what the user wants (e.g. 'I'm still working and want to know Roth vs traditional 401k'). Returns whether this optimizer can do it and, if not, the closest thing it can do (or the sister server that can). Fast, no solve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "The user's question in a sentence or two.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if a request fits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3d0e5a0ebf0fb0bf508e4451a01b54a7f1a612f6a1347946cb41cd4b68c7ee7"
        },
        {
          "name": "get_conversion_example",
          "title": "Get an example conversion input",
          "description": "Return a complete example input for optimize_roth_conversions with a one-line explanation of every field. No solve. Edit it to the user's situation. kind 'single' (default: a 60-year-old early retiree with a traditional IRA, a brokerage account and Social Security later) or 'married'.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["single", "married"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an example conversion input"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:758f410f4262a6b26357e32748d52ced2a6ea4cdcbaac8173cc11a5a0066c44e"
        },
        {
          "name": "optimize_roth_conversions",
          "title": "Optimize Roth conversions",
          "description": "Find the best Roth conversion amount for each year of a retirement plan, with living expenses funded from the right accounts and tax paid each year. Returns per-year conversions, taxes and balances, the after-tax wealth at the end with vs without conversions, totals, a plain-language plan narrative and the assumptions used. Advanced options (IRMAA, NIIT, real state brackets) are off by default. Runs in 1-3 seconds (up to ~15 with IRMAA/NIIT on a long horizon). All money in today's dollars. Optimal for the stated assumptions; not tax advice. Call get_conversion_example first if unsure of the shape.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "advanced": {
                "additionalProperties": false,
                "description": "Advanced layers, all OFF by default exactly like the web tool. IRMAA and NIIT make the solve a MILP (a few seconds longer; each solve is capped at 5 s, best plan found is returned).",
                "properties": {
                  "irmaa": {
                    "description": "Model the Medicare Part B/D income surcharge (IRMAA) so conversions can avoid or accept tiers. Default false.",
                    "type": "boolean"
                  },
                  "niit": {
                    "description": "Model the 3.8% Net Investment Income Tax. Default false.",
                    "type": "boolean"
                  },
                  "state": {
                    "additionalProperties": false,
                    "description": "State income tax. Default: none (0%).",
                    "properties": {
                      "code": {
                        "description": "Two-letter state code (e.g. 'KS'): uses that state's real 2026 brackets, standard deduction and credit.",
                        "maxLength": 2,
                        "minLength": 2,
                        "type": "string"
                      },
                      "exempts_social_security": {
                        "description": "The state does not tax Social Security. Default false.",
                        "type": "boolean"
                      },
                      "flat_rate_pct": {
                        "description": "Flat state rate, whole percent. Without 'code' it is the whole state model; with 'code' it only overrides the end-of-plan rate (default: the state's top rate).",
                        "maximum": 20,
                        "minimum": 0,
                        "type": "number"
                      },
                      "retirement_exclusion": {
                        "description": "Yearly cap on IRA distributions the state excludes, dollars. Default 0.",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "type": "object"
                  }
                },
                "type": "object"
              },
              "age": {
                "description": "Your age this year. The plan starts now (conversions can begin this year).",
                "maximum": 90,
                "minimum": 18,
                "type": "integer"
              },
              "assumptions": {
                "additionalProperties": false,
                "description": "Modeling assumptions; the defaults (same as the web tool) are reported back.",
                "properties": {
                  "ltcg_pct": {
                    "description": "Flat capital-gains rate on gains realized during the plan. Default 15.",
                    "maximum": 40,
                    "minimum": 0,
                    "type": "number"
                  },
                  "real_return_pct": {
                    "description": "Investment return above inflation, whole percent. Default 5.",
                    "maximum": 15,
                    "minimum": -5,
                    "type": "number"
                  },
                  "retirement_tax_rate_pct": {
                    "description": "Income tax rate applied to leftover traditional money at the end of the plan (heirs' or your own). Default 24.",
                    "maximum": 60,
                    "minimum": 0,
                    "type": "number"
                  },
                  "terminal_ltcg_pct": {
                    "description": "Capital-gains rate on leftover brokerage gain at the end. Default 15.",
                    "maximum": 40,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "balances": {
                "additionalProperties": false,
                "description": "Current household balances, dollars. Omitted = 0; at least one must be above 0.",
                "properties": {
                  "brokerage": {
                    "description": "Taxable brokerage and cash.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "brokerage_gain_long_term": {
                    "description": "Unrealized LONG-term gain inside the brokerage balance.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "brokerage_gain_short_term": {
                    "description": "Unrealized SHORT-term gain inside the brokerage balance (long + short cannot exceed the balance).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "roth": {
                    "description": "Roth IRA / 401(k) balance.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "roth_penalty_free": {
                    "description": "Of the Roth balance, the part that can be withdrawn penalty-free before 59.5 (contributions and conversions at least 5 years old). Default 0; cannot exceed 'roth'.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "traditional": {
                    "description": "Traditional IRA / 401(k) (pre-tax) balance: the money that can be converted.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "end_age": {
                "description": "Plan until this age (default 90; horizon at most 70 years).",
                "maximum": 110,
                "type": "integer"
              },
              "filing": {
                "description": "Tax filing status. Default 'single'. 'married' = one joint return (both spouses assumed the same age).",
                "enum": ["single", "married"],
                "type": "string"
              },
              "find_max_spending": {
                "description": "Instead of fixed spending, solve for the highest constant yearly spending the accounts can fund, ending near $0. Default false.",
                "type": "boolean"
              },
              "other_income": {
                "additionalProperties": false,
                "description": "Other steady ordinary income (pension, rental, part-time pay), today's dollars. Omitted = none.",
                "properties": {
                  "annual": {
                    "description": "Yearly amount.",
                    "maximum": 5000000,
                    "minimum": 0,
                    "type": "number"
                  },
                  "end_age": {
                    "description": "Last age it is received (default: end of plan).",
                    "type": "integer"
                  },
                  "start_age": {
                    "description": "First age it is received (default: now).",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "social_security": {
                "additionalProperties": false,
                "description": "Expected Social Security (household). Omitted = none.",
                "properties": {
                  "annual": {
                    "description": "Yearly benefit in today's dollars.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "start_age": {
                    "description": "Age benefits start. Default 70.",
                    "maximum": 70,
                    "minimum": 62,
                    "type": "integer"
                  },
                  "taxable_pct": {
                    "description": "Share of benefits taxed as ordinary income, whole percent. Default 85.",
                    "maximum": 85,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "spending_end_age": {
                "description": "Age spending ends (default: end of plan).",
                "type": "integer"
              },
              "spending_per_year": {
                "description": "Yearly spending the plan must fund, today's dollars, before income tax. Required unless find_max_spending is true.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "spending_start_age": {
                "description": "Age spending begins (default: now).",
                "type": "integer"
              }
            },
            "required": ["age", "balances"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Optimize Roth conversions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c7e10b77d720688912051e2927e47df21d6e2c74f29d24a300b300c2cd262d8a"
        }
      ],
      "digest": "sha256:82a321f3f6fb325595a44f20e73934fdc691d498a91affb7d5e2928e3e048d55"
    }
  }
