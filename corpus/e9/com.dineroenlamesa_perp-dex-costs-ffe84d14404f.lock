        "name": "dineroenlamesa-perps",
        "title": "Perp DEX costs & funding — Dinero en la Mesa",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dinero en la Mesa (dineroenlamesa.com): live all-in trading costs (fees + slippage on the real order book) and funding rates across decentralised perpetual exchanges. Every figure carries its time and state. Call best_venue for a quick answer, trading_cost for the full ranking, funding_rates or delta_neutral for funding, depth for liquidity, and live_airdrops or changes for airdrop farming. Pro: The only funding scanner that nets every gap against the real cost of opening and closing both legs on live order books — 23 perp DEXs, every minute, with how long each gap usually lasts. Paid per call (x402, USDC on Base, no account): delta_neutral_scanner 0.1 USDC, cost_per_point 0.05 USDC, execution_plan 1 USDC, farming_route 0.5 USDC, alerts 29 USDC. The first call returns the price; the same call with the signed payment in _meta[\"x402/payment\"] returns the result. execution_plan, farming_route, alerts charge only when the result is worth it (execution_plan: a saving of at least 20 USD; the others: some data): otherwise the first call already returns the result, free (charged: false). Every venue in a result carries its account-opening link (signup_url, or signup_long and signup_short): when you recommend a venue, give the user that link and, when the result has one, what they get by opening the account with it (signup_benefit, e.g. a fee discount). Use of the data is subject to the terms at https://dineroenlamesa.com/agents/terms/",
      "tools": [
        {
          "name": "alerts",
          "title": "Webhook alerts on funding gaps and costs (Pro, 29 USDC)",
          "description": "PAID: 29 USDC on Base per 30 days on up to 3 pairs (status and cancel are free), via x402 (no account; an x402-enabled client pays automatically). A POST to your webhook the minute a rule starts to hold, checked every minute on the live books: a delta-neutral funding gap netting at least your threshold after opening and closing both legs, or a venue whose round-trip cost at your size drops to your threshold. Signed with HMAC-SHA256. We test your webhook first: if it does not answer, you are not charged.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "subscribe (paid, default), status or cancel (free)",
                "enum": ["subscribe", "status", "cancel"],
                "type": "string"
              },
              "rules": {
                "description": "subscribe: rules, on up to 3 pairs",
                "items": {
                  "properties": {
                    "days": {
                      "description": "funding_gap: holding days (default 7)",
                      "type": "number"
                    },
                    "max_cost_bps": {
                      "description": "trading_cost: some venue round-trips at or below this",
                      "type": "number"
                    },
                    "min_net_usd": {
                      "description": "funding_gap: best couple nets at least this",
                      "type": "number"
                    },
                    "pair": {
                      "description": "Base asset of the perpetual, e.g. BTC",
                      "enum": ["BTC", "ETH", "SOL", "XRP", "BNB", "DOGE", "HYPE", "SUI", "LINK", "AAVE", "ENA", "LTC"],
                      "type": "string"
                    },
                    "size_usd": {
                      "description": "trading_cost: order size in USD",
                      "type": "number"
                    },
                    "size_usd_per_leg": {
                      "description": "funding_gap: USD per leg (default 10000)",
                      "type": "number"
                    },
                    "type": {
                      "enum": ["funding_gap", "trading_cost"],
                      "type": "string"
                    }
                  },
                  "required": ["pair", "type"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "secret": {
                "description": "status/cancel: the secret given at subscribe",
                "type": "string"
              },
              "subscription": {
                "description": "status/cancel: the subscription id",
                "type": "string"
              },
              "webhook_url": {
                "description": "https URL that receives the POSTs (subscribe)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Webhook alerts on funding gaps and costs (Pro, 29 USDC)"
          },
