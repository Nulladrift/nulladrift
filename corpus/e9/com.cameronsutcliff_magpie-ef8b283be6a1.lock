                "minLength": 2,
                "type": "string"
              },
              "slug": {
                "description": "The element slug (from a page URL /magpie/e/<slug>) or its canonical key, e.g. gh:openai/codex.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
