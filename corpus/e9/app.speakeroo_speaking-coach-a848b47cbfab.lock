      "serverInfo": {
        "name": "speakeroo",
        "title": "Speakeroo speaking coach",
        "version": "1.0.2",
        "description": "Speakeroo is an AI speaking coach. It analyses a speech from text or audio and returns feedback, scores, filler words, pronunciation guidance, speech topics and a speaking rubric.",
        "websiteUrl": "https://speakeroo.app/integrations/mcp?utm_source=mcp&utm_medium=analyze_transcript",
        "icons": [
          {
            "src": "https://speakeroo.app/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Speakeroo is an AI speaking coach (https://speakeroo.app).\nUse analyze_transcript for feedback on something written or transcribed, refine_transcript for a restructured version, and analyze_speech when there is a recording: only audio gives pace, pauses, pitch and vocal expression.\nThe other tools return free reference content: speech topics, pronunciation, a speaking rubric and filler words.\nEach result links to the matching page on speakeroo.app; share the link with the user.",
      "tools": [
        {
          "name": "analyze_speech",
          "title": "Analyze a speech recording",
          "description": "Analyze a spoken recording: it is transcribed, then returns everything analyze_transcript does plus delivery metrics only audio can give: words per minute, pace, pauses per minute, filler rate, pitch (median and range) and vocal expression, and pacing, pronunciation and engagement scores. Limits: up to 120 seconds and 10 MB; mp3, m4a/mp4, wav, webm, ogg or flac; at least 30 spoken words. Pass audioUrl (public https) or audioBase64. Free: 1 analysis a day per network, or per account when signed in; a try that fails on our side does not count, up to 3 tries a day. Audio is deleted once the response is sent.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "audioBase64": {
                "description": "The recording as base64 (a data: URL prefix is fine). Use this or audioUrl.",
                "type": "string"
              },
              "audioUrl": {
                "description": "A public https link to the recording. Use this or audioBase64.",
                "type": "string"
              },
              "context": {
                "description": "What the speech is for, so the feedback is calibrated to it. Defaults to general.",
                "enum": ["general", "impromptu", "presentation", "speech", "interview", "ielts", "conversation"],
                "type": "string"
              },
              "mimeType": {
                "description": "The audio type when it cannot be sniffed from the bytes, e.g. audio/mpeg. If omitted, Speakeroo tries to detect it from the bytes or URL.",
                "type": "string"
              },
              "topic": {
                "description": "The question or prompt being answered, e.g. an IELTS cue card or interview question. If omitted, the feedback is not tied to a specific prompt.",
                "examples": ["Should schools teach cooking?"],
                "maxLength": 500,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "callToAction": {
                "additionalProperties": false,
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["text", "url"],
                "type": "object"
              },
              "coaching": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "deliveryMoments": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "description": {
                              "type": "string"
                            },
                            "excerpt": {
                              "type": "string"
                            },
                            "label": {
                              "type": "string"
                            },
                            "sentiment": {
                              "enum": ["strength", "improvement"],
                              "type": "string"
                            },
                            "type": {
                              "enum": ["emphasis", "effective_pause", "missed_pause", "rush", "slow_deliberate", "flat_spot", "vocal_contrast", "energy_build", "warmth", "tension"],
                              "type": "string"
                            }
                          },
                          "required": ["description", "excerpt", "label", "sentiment", "type"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "feedback": {
                        "additionalProperties": false,
                        "properties": {
                          "delivery": {
                            "type": "string"
                          },
                          "rhetoric": {
                            "type": "string"
                          },
                          "weakWords": {
                            "type": "string"
                          }
                        },
                        "required": ["delivery", "rhetoric", "weakWords"],
                        "type": "object"
                      },
                      "rhetoricalDevices": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "device": {
                              "enum": ["rhetorical_question", "anaphora", "epistrophe", "epizeuxis", "triad", "antithesis", "climax", "metaphor", "simile", "hyperbole", "personification", "alliteration"],
                              "type": "string"
                            },
                            "effect": {
                              "type": "string"
                            },
                            "excerpt": {
                              "type": "string"
                            }
                          },
                          "required": ["device", "effect", "excerpt"],
                          "type": "object"
                        },
                        "type": "array"
                      },
                      "weakWords": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "category": {
                              "enum": ["hedging", "minimizer", "permission_seeking", "apologetic", "excessive_qualifier"],
                              "type": "string"
                            },
                            "count": {
                              "description": "How many times it was said",
                              "type": "number"
                            },
