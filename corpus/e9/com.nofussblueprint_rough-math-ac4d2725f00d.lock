      },
      "serverInfo": {
        "name": "money-gotchas-rough-math",
        "title": "Money Gotchas Rough Math",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Rough money calculators built around the money traps in the book Money Gotchas by Noah Field. Use them for quick estimates; answers are rounded on purpose and are not financial advice.",
      "tools": [
        {
          "name": "credit_card_payoff",
          "title": "What does paying the minimum really cost?",
          "description": "Credit card payoff at a fixed monthly payment: months to reach zero and total interest, plus the same with $50 more a month. Assumes the same payment and APR every month and no new purchases or fees; real minimums shrink, so paying only the minimum takes longer.",
          "inputSchema": {
            "properties": {
              "apr": {
                "description": "Interest rate (APR) in percent, e.g. 24.",
                "type": "number"
              },
              "balance": {
                "description": "Card balance in US dollars.",
                "type": "number"
              },
              "monthly_payment": {
                "description": "Fixed amount paid each month.",
                "type": "number"
              }
            },
            "required": ["apr", "balance", "monthly_payment"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What does paying the minimum really cost?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:409da8abdf953d43d53376c7ed51fed9a108d88c960b6a6b3a0925d3a861ba56"
        },
        {
          "name": "net_worth",
          "title": "What's my net worth, roughly?",
          "description": "Rough net worth: what you own minus what you owe. Count things at what they'd sell for today; skip things you'd never sell.",
          "inputSchema": {
            "properties": {
              "owe": {
                "description": "What you owe: cards, student loans, car loan, mortgage, other loans.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "own": {
                "description": "Values of what you own: savings, retirement, car at resale price, home, anything else worth selling.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["owe", "own"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What's my net worth, roughly?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5beac7d24d20bfb24769bf4bc02fee31680c62a94d80b9f9aa27d7dc742c0505"
        },
        {
          "name": "pay_later_share",
          "title": "How much of my next paycheck is already spoken for?",
          "description": "Buy now, pay later check: adds the pay-in-4 installments the next paycheck has to cover (due after it lands and before the one after it) and shows the share of the paycheck already promised, before rent and groceries.",
          "inputSchema": {
            "properties": {
              "installments": {
                "description": "Each installment that paycheck has to cover.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              },
              "next_paycheck": {
                "description": "Next paycheck after tax, in US dollars.",
                "type": "number"
              }
            },
            "required": ["installments", "next_paycheck"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How much of my next paycheck is already spoken for?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c949d8738458b50a6906450eafa2be0681daf0bc5a064e06abd3fb4cd71af42a"
        },
        {
          "name": "safe_to_spend",
          "title": "How much of my balance is really mine?",
          "description": "Rough safe-to-spend number: takes the bank balance shown in the app and subtracts bills due before the next payday, card charges not yet paid off, and money already set aside. Use when someone asks how much they can actually spend until payday. Balance may be negative (overdrawn).",
          "inputSchema": {
            "properties": {
              "balance": {
                "description": "Balance the bank app shows, in US dollars. Negative if overdrawn.",
                "type": "number"
              },
              "bills_before_payday": {
                "description": "Bills due before the next payday (rent, phone, insurance).",
                "type": "number"
              },
              "card_charges": {
                "description": "Card charges not paid off yet.",
                "type": "number"
              },
              "set_aside": {
                "description": "Money already set aside for something.",
                "type": "number"
              }
            },
            "required": ["balance"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "How much of my balance is really mine?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:75e6705ea449456af04fe598c0dce83a7bc5d8499bd7197deec74d112d04120f"
        },
        {
          "name": "subscription_cost",
          "title": "What do my subscriptions cost per year?",
          "description": "Adds up monthly subscription charges and shows the monthly, daily and yearly total. Yearly plans should be divided by 12 first.",
          "inputSchema": {
            "properties": {
              "monthly_charges": {
                "description": "Each subscription's monthly price in US dollars.",
                "items": {
                  "type": "number"
                },
                "type": "array"
              }
            },
            "required": ["monthly_charges"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What do my subscriptions cost per year?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:037103f3606de1977c3f1543b3be2b863dc33df2f06675fd167934cf5588b8cb"
        },
        {
          "name": "work_hours_cost",
          "title": "What does this cost in hours of work?",
          "description": "Turns a regular expense into hours and workdays of take-home pay per year. Uses 173 working hours a month and 8-hour workdays.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "The expense amount.",
                "type": "number"
              },
              "monthly_take_home": {
                "description": "Take-home pay per month, in US dollars.",
                "type": "number"
              },
              "per": {
                "description": "How often the expense happens.",
                "enum": ["week", "month", "year"],
                "type": "string"
              }
            },
            "required": ["amount", "monthly_take_home", "per"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What does this cost in hours of work?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4fb2bfba247dcafc02b218cba2b21016fa7a8fbde99a89f954f15ea0e8cbbf42"
        }
      ],
      "digest": "sha256:9deda2e3a0754f986332f116ebfc53e1c65b8530a10778b7f2d0d316b75aeb31"
    }
  }
