{
  "lockfileVersion": 2,
  "subjects": {
    "com.abwatcher/abwatcher": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.abwatcher.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "abwatcher",
        "title": "ABWatcher",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ABWatcher watches 1,000+ high-converting brands and catches the A/B tests they run on their public pages. Use search_tests to find tests (by brand, surface, page type or testing tool), get_test for one test with its hypothesis and takeaway, search_brands and get_brand for the brands watched and the testing tools found on their pages, who_uses_tool for the brands running a tool, and list_plays for conversion plays caught on their pages. Give the user the url of anything you cite. What a key sees follows its workspace plan; when a result has a note about the plan, pass it on.",
      "tools": [
        {
          "name": "get_brand",
          "title": "Get one brand",
          "description": "One brand by domain: its tags, the testing tools found on its pages (Optimizely, VWO, Adobe Target...) and its recent A/B tests.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "e.g. \"ally.com\" or \"microsoft.com/microsoft-365\"",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aad26db3a4fc535fd4b80a869df7486f4d921d68a19c92320bb64fbf85aa55a8"
        },
        {
          "name": "get_test",
          "title": "Get one A/B test",
          "description": "One A/B test by id: what changed, the likely hypothesis, the takeaway, the testing tools found and links to both screenshots.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The test id from search_tests",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c449424eebe014a39274795631d03d03874e8e27f566ed296fd455d7f81d151f"
        },
        {
          "name": "list_plays",
          "title": "List conversion plays",
          "description": "Conversion plays caught on brands' pages (social proof, urgency, calculators, signup flows...), rarest first, each with the brand and the evidence.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name or domain",
                "type": "string"
              },
              "category": {
                "enum": ["ai_integration", "calculator", "social_proof", "urgency", "copy", "risk_reversal", "interactive_demo", "design", "signup_flow", "contrarian", "unique_mechanic", "other"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c90e37a09b09adb9478fa5c433eac89915845a88be5382ab8e06dc5a70ab1e2"
        },
        {
          "name": "search_brands",
          "title": "Search brands",
          "description": "Brands ABWatcher watches, most detected tests first. Filter by name or domain and by industry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "industry": {
                "enum": ["saas", "fintech", "ecommerce", "marketplace", "healthtech", "edtech", "devtools", "hr", "media", "travel", "gaming", "telco", "banking", "insurance", "real_estate", "mobility", "other"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Part of a brand name or domain",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fba8618ed5539cfdacb1d0b00a8f45da7a8036f4a895a7575743f173078e7e37"
        },
        {
          "name": "search_tests",
          "title": "Search A/B tests",
          "description": "A/B tests ABWatcher caught on brands' public pages, newest first, each with what changed, the surface, the testing tool found and a link. Filter by brand, surface, page type or testing tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Brand name or domain, e.g. \"ally\" or \"monday.com\"",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "page_type": {
                "description": "Kind of page",
                "enum": ["home", "pricing", "signup", "login", "demo", "contact", "product", "features", "integrations", "customers", "landing", "blog", "docs", "careers", "about", "other"],
                "type": "string"
              },
              "surface": {
                "description": "Part of the page that changed",
                "enum": ["hero", "pricing", "cta", "form", "social_proof", "navigation", "layout", "copy", "other"],
                "type": "string"
              },
              "tool": {
                "description": "Testing tool found on the page",
                "enum": ["optimizely", "vwo", "ab_tasty", "convert", "kameleoon", "statsig", "launchdarkly", "google_optimize", "adobe_target", "split", "posthog", "growthbook", "mutiny", "frosmo", "dynamic_yield", "intellimize", "unbounce", "eppo"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0fc6849707c76dad050ba2a6620814651bc31a90241e83d879acb3209b39182b"
        },
        {
          "name": "who_uses_tool",
          "title": "Brands using a testing tool",
          "description": "Brands where ABWatcher found this A/B testing tool on their pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tool": {
                "enum": ["optimizely", "vwo", "ab_tasty", "convert", "kameleoon", "statsig", "launchdarkly", "google_optimize", "adobe_target", "split", "posthog", "growthbook", "mutiny", "frosmo", "dynamic_yield", "intellimize", "unbounce", "eppo"],
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1389b845cf62c3f624271f92e3161b046ddcf52e284010a8464d9d04d8fe4fc3"
        }
      ],
      "digest": "sha256:8b1210bbdd805ec9bdcf77887fc339d8475deacfa3297fac974405b1fbb9b457"
    }
  }
}
