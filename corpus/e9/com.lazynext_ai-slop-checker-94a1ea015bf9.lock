{
  "lockfileVersion": 2,
  "subjects": {
    "com.lazynext/ai-slop-checker": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://slop-checker.lazynext.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "lazynext-ai-slop-checker",
        "title": "Lazynext AI Slop Checker",
        "version": "1.4.6"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "judge",
          "description": "Run the judgement checklist (--judge) over text, HTML, or a directory: the 5-question review (purpose/audience/decision/variety/defaults) with machine-flagged signals per question, a craft-floor gate (contrast/alignment/text-hierarchy/spacing/no-fake-data/no-decorative-effects) mapped from scanner evidence with human-checkbox items for the non-machineable parts, refusal scaffolds, and a machine-computed PASS | REVIEW | REFUSE verdict computed ONLY from machine-verifiable parts. Same input always gives the same verdict.",
          "inputSchema": {
            "oneOf": [
              {
                "required": ["text"]
              },
              {
                "required": ["html"]
              },
              {
                "required": ["dir"]
              }
            ],
            "properties": {
              "dir": {
                "description": "directory path to judge — local filesystem access only",
                "type": "string"
              },
              "html": {
                "description": "HTML document to judge",
                "type": "string"
              },
              "text": {
                "description": "plain text to judge",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c0aff2dd1f88fdf362a73bf2aa5d0caa2ba2be35b6ba06c63ff2156b1c1c6ba5"
        },
        {
          "name": "list_rules",
          "description": "List the full pattern corpus (categories + every rule with id, severity, kind, match, fix). Use this to know what the scanner flags.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f862f41664b4fed673ab919bbbf55cb15eb89bcd372f906dc369db24d7598ac"
        },
        {
          "name": "rewrite_text",
          "description": "Apply conservative safe rewrites (whole-word synonym swaps and phrase deletions only) to a text. Returns the rewritten text plus the change list.",
          "inputSchema": {
            "properties": {
              "text": {
                "description": "text to rewrite",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e6d56ada3fd47279be79808160109eeacb61c13edf6bd515e4ddb69d77733c0d"
        },
        {
          "name": "scan_html",
          "description": "Scan HTML markup for AI-slop writing AND visual design tells (gradients, kickers, glassmorphism, stat rows, ...).",
          "inputSchema": {
            "properties": {
              "html": {
                "description": "HTML document to scan",
                "type": "string"
              },
              "profile": {
                "description": "severity profile (default | strict | lenient)",
                "enum": ["default", "strict", "lenient"],
                "type": "string"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:56b8cd0975076cd40765451ff672ff10ccc28d0803bc838988b1569a25c679ed"
        },
        {
          "name": "scan_project",
          "description": "Scan a local directory tree (prose/markup/styles/code lenses) and return a pooled report: score, top offending files, category breakdown. Local filesystem access only.",
          "inputSchema": {
            "properties": {
              "dir": {
                "description": "path to a directory",
                "type": "string"
              },
              "profile": {
                "description": "severity profile (default | strict | lenient)",
                "enum": ["default", "strict", "lenient"],
                "type": "string"
              },
              "topFiles": {
                "description": "how many top files to report (default 10)",
                "type": "integer"
              }
            },
            "required": ["dir"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f1c1532d880d64c414aad4e2ef53758e40326be3a0312d466e8beead701dd54"
        },
        {
          "name": "scan_render",
          "description": "Run the rendered-tier design checks (r-*): kicker size, gradient text, tracked caps, glued arrows, marquee, hidden reveal, fold budget, screen word budget, section rhythm, fake progress, and WCAG contrast — all pure functions over a computed snapshot ({elements:[...]}, see src/render-checks.js). Pass an object snapshot; no browser needed.",
          "inputSchema": {
            "properties": {
              "profile": {
                "description": "severity profile (default | strict | lenient)",
                "enum": ["default", "strict", "lenient"],
                "type": "string"
              },
              "snapshot": {
                "description": "computed snapshot: { viewport?, documentStyle?, elements: [...], screens? }",
                "type": "object"
              },
              "url": {
                "description": "http(s) URL to collect then check (requires the optional playwright collector)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3dd517c691707fc58c6ca689a50f406b1bbe9a269879613ccb7b71ebef9ae325"
        },
        {
          "name": "scan_text",
          "description": "Scan plain text for AI-slop writing tells. Returns score (0-100), verdict, per-category breakdown, and every match with a fix suggestion.",
          "inputSchema": {
            "properties": {
              "profile": {
                "description": "severity profile (default | strict | lenient)",
                "enum": ["default", "strict", "lenient"],
                "type": "string"
              },
              "rewrite": {
                "description": "include safe auto-rewrites (text only)",
                "type": "boolean"
              },
              "text": {
                "description": "plain text to scan",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2ebf6ff053dfbff1fca71c9b2591c12f0efc8ef4e202d9c61f758c0d4bfb3699"
        }
      ],
      "digest": "sha256:092e6c8d38422e53af7ce26610457bcba0b46cca312309a5ef31a24a3dc500e3"
    }
  }
}
