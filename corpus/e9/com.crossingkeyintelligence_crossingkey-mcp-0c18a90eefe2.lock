        {
          "name": "capability.search",
          "title": "capability.search",
          "description": "FREE MARKETPLACE FILTERED DISCOVERY ONLY. Search active public marketplace capabilities when one or more filters are known: text, category, provider, delivery type, or price. Metadata is free; purchased execution and deliverables are not. Do NOT use for unfiltered browsing; use catalog.list. Do NOT use for CrossingKey digital/service offers; use offers.list. For one exact capabilityId use capability.get.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional exact marketplace category identifier.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$",
                "type": "string"
              },
              "deliveryType": {
                "description": "Optional capability delivery-type filter.",
                "enum": ["mcp_tool", "api", "digital_asset", "workflow", "service", "dataset", "content", "software", "other"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "description": "Maximum number of results to return; 1-100, defaults to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "maxPrice": {
                "$ref": "#/properties/minPrice",
                "description": "Optional inclusive maximum USDC price in atomic units."
              },
              "minPrice": {
                "description": "Optional inclusive minimum USDC price in atomic units.",
                "pattern": "^(0|[1-9][0-9]{0,29})$",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Zero-based result offset; defaults to 0.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "provider": {
                "$ref": "#/properties/category",
                "description": "Optional exact provider identifier."
              },
              "query": {
                "description": "Optional case-insensitive search text across capability name, description, and category; maximum 160 characters.",
                "maxLength": 160,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": true,
            "properties": {},
            "type": "object"
