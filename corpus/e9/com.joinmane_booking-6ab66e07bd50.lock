{
  "lockfileVersion": 2,
  "subjects": {
    "com.joinmane/booking": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.joinmane.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "mane-booking",
        "title": "Mane",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Mane is booking software for independent barbers, stylists, nail techs and estheticians. This server lists only operators who chose to be found through AI assistants. All tools are read-only: get_booking_link returns a joinmane.com link with the service, date and time filled in, and the booking exists only after the client opens that link and confirms it on joinmane.com.",
      "tools": [
        {
          "name": "get_booking_link",
          "title": "Get booking link",
          "description": "Checks that a service, date and start time are open right now, and returns a joinmane.com link to the operator’s booking page with that service, date and time filled in. It does not book, hold the time, charge or contact anyone: the booking is made only when the client opens the link and confirms it on joinmane.com, where the operator’s card and cancellation rules apply. If the time is not open, the result is an error listing the open times that day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Date as YYYY-MM-DD.",
                "type": "string"
              },
              "service_id": {
                "description": "service_id from list_services.",
                "type": "integer"
              },
              "start_time": {
                "description": "Start time as HH:MM (24-hour, the operator’s local time), from list_availability.",
                "type": "string"
              }
            },
            "required": ["date", "service_id", "start_time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1ff18d4b09812e35ca4322fb83d8e4e624afa142581aa54eecf8782d36c88057"
        },
        {
          "name": "get_operator",
          "title": "Get operator profile",
          "description": "Returns the public profile of one listed operator: display name, business name, city, profession, years of experience, bio, Instagram handle and booking page URL. Provide exactly one of slug or operator_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "operator_id": {
                "description": "Numeric operator_id, as returned by search_operators.",
                "type": "integer"
              },
              "slug": {
                "description": "Operator slug, as returned by search_operators (for example \"christiangflair\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get operator profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6afd30af30a41bec99afb3190d8bb7463d6591ac8a475843c80677bfa976f30"
        },
        {
          "name": "list_availability",
          "title": "List open times",
          "description": "Lists the open start times for one service on one date, from the same rules as the operator’s booking page: their hours, breaks, days off, existing bookings and the same-day notice. Each slot has start_time (HH:MM, the operator’s local time), is_after_hours, and the price that applies at that time, which can differ from the list price. An empty list means nothing is open that day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "Date as YYYY-MM-DD.",
                "type": "string"
              },
              "service_id": {
                "description": "service_id from list_services.",
                "type": "integer"
              }
            },
            "required": ["date", "service_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List open times"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f9d4abafbaa4a53a3e38d03b368a2cbc7969492ee6eb9827b3948d59183a68da"
        },
        {
          "name": "list_services",
          "title": "List operator services",
          "description": "Lists the active services of one listed operator: service_id, name, description, duration in minutes, list price, after-hours price when the operator set one, and whether it is a mobile or request-only service. Provide exactly one of slug or operator_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "operator_id": {
                "description": "Numeric operator_id, as returned by search_operators.",
                "type": "integer"
              },
              "slug": {
                "description": "Operator slug, as returned by search_operators (for example \"christiangflair\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List operator services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:96dab1f7c5a2493c339d486fd557c844cb5878080988310d9a1bc23a91dd6eae"
        },
        {
          "name": "search_operators",
          "title": "Search Mane operators",
          "description": "Lists barbers, stylists, nail techs and estheticians on Mane who have chosen to be found through AI assistants. Returns each operator’s slug, operator_id, display name, business name, city, profession and booking page URL. Operators who have not opted in are never returned. Optional filters match part of the city or profession, case-insensitive.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Optional part of a city name, for example \"Royal Palm\".",
                "type": "string"
              },
              "profession": {
                "description": "Optional part of a profession, for example \"barber\" or \"esthetician\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Mane operators"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb2692b68db970a1522a77ed0b00b99d8eb3dd8c5d82d98c1450f74ec54c14b5"
        }
      ],
      "digest": "sha256:6755bd4087d2af02f3252a3c897ff3672dcc62083cc0011b21d42edd747ec32d"
    }
  }
