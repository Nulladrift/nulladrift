      "instructions": "Checkpoint402: checked data for AI agents, paid per call in USDC on Base via x402. No account or API key.\n\n- explain_transaction ($0.03): Transaction Explainer. Explains any Base or Ethereum transaction in plain English: who sent what to whom, which tokens/NFTs moved, the function called, success/failure and fee — plus the structured decoded data.\n  Inputs: hash (required), chain\n  Example output: https://checkpoint402.com/services/tx-explainer\n- find_defi_yields ($0.05): Best DeFi Yield Finder. Top DeFi yields across 16k+ pools, filtered by asset, chain, minimum TVL and risk, each with a simple explained risk tier (outlier APY, thin TVL, reward-heavy, IL exposure). Data: DefiLlama.\n  Inputs: asset, chain, minTvlUsd, stablecoinOnly, maxRisk, limit\n  Example output: https://checkpoint402.com/services/defi-yields\n- new_token_safety_feed ($0.10): New Token Launch Feed. Newly launched token pools on Base, Ethereum or BSC, each with a 0-100 safety score and explicit red flags (honeypot, unverified code, mintable, owner powers, high tax, unlocked liquidity, whale concentration). Data: GeckoTerminal + GoPlus.\n  Inputs: chain, minScore, limit\n  Example output: https://checkpoint402.com/services/new-tokens\n- token_safety_check ($0.02): Token Safety Check. Is this token a scam? Checks any token on Base, Ethereum or BSC and returns a 0-100 safety score, a verdict, red flags (honeypot, hidden fees, owner powers, unlocked liquidity, whale concentration, creator's past honeypots), good signs and a plain-English summary. Data: GoPlus + DexScreener.\n  Inputs: address (required), chain\n  Example output: https://checkpoint402.com/services/token-check\n- sec_8k_company_events ($0.10): Breaking Company Events (SEC 8-K). Latest SEC 8-K filings — market-wide within minutes of filing, or for one ticker — with each item code translated to plain English, high-impact events flagged (earnings, CEO changes, M&A, bankruptcy, cyber incidents) and AI summaries of the filing text.\n  Inputs: ticker, item, highImpactOnly, limit\n  Example output: https://checkpoint402.com/services/sec-8k\n- ofac_sanctions_screen ($0.05): OFAC Sanctions Screening. Screens a person/company name (fuzzy, alias-aware) and/or a crypto wallet address against the US Treasury OFAC SDN list, refreshed twice daily, including the extended-remarks file where most sanctioned crypto addresses are listed.\n  Inputs: name, address, threshold, limit\n  Example output: https://checkpoint402.com/services/ofac-screen\n\nPaying: each paid tool answers an unpaid call with an x402 payment request (price, network, receiving wallet). x402-capable MCP clients (for example @x402/mcp's client) pay automatically and retry; you are only charged when the call succeeds.\nClients that can't pay can run the same services in a browser wallet at https://checkpoint402.com/try. Developer docs: https://checkpoint402.com/docs. Terms: https://checkpoint402.com/terms.\nInformational data only; not financial, investment or legal advice.",
      "tools": [
