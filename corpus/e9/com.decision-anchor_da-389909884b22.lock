        {
          "name": "compare_anomaly",
          "title": "Compare Decision Against Pattern",
          "description": "Compare one of your decisions against your accumulated pattern. Returns band_position (within_band/outlier) for 5 dimensions: decision_scale, decision_class, target_class, time_zone, ee_resolution. Costs DAC.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "auth_token": {
                "description": "Your DA agent auth token. Optional when this connection already carries one (Authorization: Bearer header on the remote server, or DA_AUTH_TOKEN for a local stdio server); an explicit value takes precedence.",
                "type": "string"
              },
              "dd_id": {
                "description": "Decision ID (UUID) to compare",
                "type": "string"
              },
              "payment_signature": {
                "description": "Optional x402 payment payload (base64), required only for paid calls. Omit it on the first call: the tool returns the payment challenge. Sign that challenge with your own wallet, then call this tool again with identical arguments plus this field. Decision Anchor never holds your key and never signs on your behalf.",
                "type": "string"
              },
              "period_days": {
                "default": 90,
                "description": "Comparison window in days",
                "type": "number"
              }
            },
            "required": ["dd_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false,
            "title": "Compare Decision Against Pattern"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:628709ebe5f3aadc289310419c823f33b9463b17807f63d4c558b953d983fd6c"
        },
        {
          "name": "confirm_decision",
          "title": "Confirm Decision Record",
          "description": "Use after create_decision to settle the anchored boundary as an external record. Once confirmed, the agreed scope is fixed outside both parties' own logs. Confirm a pending decision: marks the anchored declaration as settled. The integrity hash and timestamp are created at declaration time (create_decision); confirm requires only the dd_id. Call this after the action described in the DD has been executed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "auth_token": {
                "description": "Your DA agent auth token. Optional when this connection already carries one (Authorization: Bearer header on the remote server, or DA_AUTH_TOKEN for a local stdio server); an explicit value takes precedence.",
                "type": "string"
              },
              "dd_id": {
                "description": "The DD ID to confirm",
                "type": "string"
              }
            },
            "required": ["dd_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false,
            "title": "Confirm Decision Record"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96a7d2bfe918e86198fcae139a4fa3a162499db1b06796e76f1a4d252cac7d6a"
        },
        {
          "name": "create_decision",
          "title": "Create Decision Record",
          "description": "Use when an action crosses an external boundary: payment, delegation, or agreement with another agent. This anchors the responsibility scope. You say when: before you execute, or after a decision you have already made. Record a tamper-evident decision. This route records self-declared decisions; a declaration that involves a counterparty is made with propose_bilateral instead. Each decision is added to your record trajectory, which you and a counterparty can check against DA's external entry. Omitting the EE axes applies the defaults (medium/basic/internal/standard), equivalent to the EE_standard preset. The cost is a base fee plus additions for the selected EE axis values and options, all taken from the current pricing settings; the amount charged is returned in the response as dac_amount, itemized in cost_breakdown.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "access_class": {
                "description": "Optional: read-access class for the record",
                "enum": ["self_direct", "ara_only", "internal_only"],
                "type": "string"
              },
              "auth_token": {
                "description": "Your DA agent auth token. Optional when this connection already carries one (Authorization: Bearer header on the remote server, or DA_AUTH_TOKEN for a local stdio server); an explicit value takes precedence.",
                "type": "string"
              },
              "content_disclosure_scope": {
                "description": "v1.3.0: external exposure scope. The addition for each value comes from the current pricing settings; the amount charged is returned in the response as dac_amount, itemized in cost_breakdown.",
                "enum": ["owner", "external", "public"],
                "type": "string"
              },
              "content_inclusion_flag": {
                "description": "v1.3.0: 0=branch 0 (default, no metadata), 1=branch 1 (template required). No extra DAC, same base fee as branch 0 (the v1.3.0 surcharge was removed in v1.3.14). Branch 1 decisions are the only ones counted toward the anomaly-compare sample.",
                "type": "number"
              },
              "dd_unit_type": {
                "default": "single",
                "description": "Decision unit type",
                "enum": ["single", "batch"],
                "type": "string"
              },
              "decision_action_type": {
                "description": "Action type",
                "enum": ["execute", "hold", "reject", "depend", "approve"],
                "type": "string"
              },
              "decision_at": {
                "description": "Optional: the time your agent itself decided, ISO 8601. The server normalizes it to UTC and that normalized value enters the integrity hash. It must not be later than the anchoring time (400 DECISION_AT_IN_FUTURE). Omit it and no decision time is recorded.",
                "type": "string"
              },
              "decision_type": {
                "description": "Decision type",
                "enum": ["internal_service", "external_interaction", "self_attestation"],
                "type": "string"
              },
              "delegation_state": {
                "description": "v1.3.0: delegation responsibility state. The addition for each value comes from the current pricing settings; the amount charged is returned in the response as dac_amount, itemized in cost_breakdown.",
                "enum": ["none", "partial", "full"],
                "type": "string"
              },
              "ee_direct_access_period": {
                "default": "30d",
                "description": "Direct access period (e.g., 30d)",
                "type": "string"
              },
              "ee_direct_access_quota": {
                "description": "Direct access quota (omit to use the server config default)",
                "type": "number"
              },
              "ee_disclosure_format_policy": {
                "default": "internal",
                "description": "Disclosure format",
                "enum": ["internal", "shareable", "exportable"],
                "type": "string"
              },
              "ee_integrity_verification_level": {
                "default": "basic",
                "description": "Verification rigor",
                "enum": ["basic", "enhanced", "certifiable"],
                "type": "string"
              },
              "ee_preset": {
                "description": "Optional EE preset name. The server looks it up among the presets active at call time and expands it into the four EE axes (retention, integrity verification level, disclosure format, responsibility scope), replacing the axis values sent with it. An unknown name returns 400 INVALID_EE_PRESET and a disabled one returns 400 EE_PRESET_DISABLED. Omit it and the four axis arguments apply as given (defaults medium/basic/internal/standard). The response does not echo the preset name: cost_breakdown and dac_amount are priced on the expanded axes, and those axes are stored on the record.",
                "type": "string"
              },
              "ee_responsibility_scope": {
                "default": "standard",
                "description": "Responsibility scope",
                "enum": ["minimal", "standard", "extended"],
                "type": "string"
              },
              "ee_retention_period": {
                "default": "medium",
                "description": "How long the record is retained. indefinite is declared but not currently available: selecting it is rejected with 403.",
                "enum": ["short", "medium", "long", "extreme_long", "indefinite"],
                "type": "string"
              },
              "origin_context_type": {
                "description": "Origin context",
                "enum": ["internal", "external", "self", "mixed"],
                "type": "string"
              },
              "parent_dd_id": {
                "description": "Parent DD ID for lineage tracking",
                "type": "string"
              },
              "payment_signature": {
                "description": "Optional x402 payment payload (base64), required only for paid calls. Omit it on the first call: the tool returns the payment challenge. Sign that challenge with your own wallet, then call this tool again with identical arguments plus this field. Decision Anchor never holds your key and never signs on your behalf.",
                "type": "string"
              },
              "premium_payment_source": {
                "description": "Premium payment source (trial is applied automatically by the server when eligible)",
                "enum": ["external", "earned"],
                "type": "string"
              },
              "request_id": {
                "description": "Optional idempotency key: must be a UUID (the server rejects non-UUID values). Auto-generated if omitted.",
                "type": "string"
              },
              "selection_scope": {
                "description": "Optional: declared scope of the selection",
                "enum": ["single_target", "multi_target", "chain_scope", "global"],
                "type": "string"
              },
              "selection_state": {
                "default": "SELECTED",
                "description": "Selection state",
                "enum": ["SELECTED", "REJECTED", "ABORTED", "SILENT", "NON_DECISION"],
                "type": "string"
              },
              "template": {
                "additionalProperties": false,
                "description": "v1.3.0: required when content_inclusion_flag=1. 7-dimensional decision content metadata.",
                "properties": {
                  "call_chain": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "decision_class": {
                    "enum": ["payment", "api_call", "data_access", "delegation", "resource_transfer", "communication", "other"],
                    "type": "string"
                  },
                  "decision_scale_unit": {
                    "type": "string"
                  },
                  "decision_scale_value": {
                    "type": "number"
                  },
                  "decision_trigger": {
                    "enum": ["user_request", "scheduled", "event_driven", "autonomous", "delegated", "external_event"],
                    "type": "string"
                  },
                  "human_involvement": {
                    "enum": ["none", "notification", "approval", "co_decision", "review"],
                    "type": "string"
                  },
                  "self_classification": {
                    "type": "string"
                  },
                  "target_class": {
                    "enum": ["internal", "external", "third_party", "subagent", "human_owner", "public", "system"],
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["decision_action_type", "decision_type", "origin_context_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false,
            "title": "Create Decision Record"
