            "additionalProperties": false,
            "properties": {
              "logs": {
                "description": "Include build logs",
                "type": "boolean"
              },
              "slug": {
                "description": "Site slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
