                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "products": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "description": {
                            "type": "string"
                          },
                          "matchedAs": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "sourceUrl": {
                            "format": "uri",
                            "type": "string"
                          }
                        },
                        "required": ["description", "name", "sourceUrl"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "profileUrl": {
                      "format": "uri",
                      "type": "string"
                    },
                    "roles": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "slug": {
                      "pattern": "^[a-z0-9-]{1,100}$",
                      "type": "string"
                    }
                  },
                  "required": ["categories", "country", "name", "products", "profileUrl", "roles", "slug"],
                  "type": "object"
