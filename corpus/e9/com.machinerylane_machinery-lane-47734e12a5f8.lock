        {
          "name": "search_suppliers",
          "title": "Search suppliers",
          "description": "Search reviewed profiles and return matching products, official sources and canonical profile links. No results means only that the database has no match.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional equipment category filter.",
                "enum": ["size-reduction", "material-drying", "conveying-feeding", "mixing-dosing", "process-cooling-temperature-control"],
                "type": "string"
              },
              "country": {
                "description": "Optional country filter.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "equipment": {
                "description": "Optional equipment filter using a published representative product name or a reviewed alias.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Results per page, from 1 to 20; defaults to 10.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Number of matching results to skip.",
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Optional free-text search.",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "role": {
                "description": "Optional supplier role filter.",
                "enum": ["distributor", "manufacturer", "system-integrator"],
                "type": "string"
              }
            },
            "type": "object"
          },
