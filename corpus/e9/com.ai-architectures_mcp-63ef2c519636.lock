        {
          "name": "search_house_plans",
          "title": "Search free house plans",
          "description": "Use this when the user wants ready-made house plans, floor plan ideas or downloadable plans (for example \"3 bedroom ranch under 2,000 sq ft\", \"small ADU\", \"barndominium\"). Searches a library of about 500 free house plans by AI Architectures, each with a floor plan image, room sizes and free PDF, DXF, IFC and GLB downloads. Returns plan cards with links to the plan page and to change the plan in the CAD studio. Filters are optional; leave out what the user did not ask for.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bathrooms": {
                "description": "Minimum number of bathrooms.",
                "maximum": 8,
                "minimum": 0,
                "type": "number"
              },
              "bedrooms": {
                "description": "Exact number of bedrooms (0 = studio).",
                "maximum": 8,
                "minimum": 0,
                "type": "integer"
              },
              "garage": {
                "description": "true = only plans with a garage, false = only without.",
                "type": "boolean"
              },
              "limit": {
                "default": 6,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "max_sqft": {
                "description": "Largest living area in square feet.",
                "maximum": 20000,
                "minimum": 0,
                "type": "integer"
              },
              "min_sqft": {
                "description": "Smallest living area in square feet (1 m² = 10.76 sq ft).",
                "maximum": 20000,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Style or type words, e.g. \"modern farmhouse\", \"ranch\", \"ADU\", \"barndominium\", \"narrow lot\", \"30x40\".",
                "maxLength": 200,
                "type": "string"
              },
              "stories": {
                "description": "Number of storeys.",
                "maximum": 3,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
