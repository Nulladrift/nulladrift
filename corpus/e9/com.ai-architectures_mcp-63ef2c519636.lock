      "instructions": "AI Architectures (20Vision GmbH, Vienna) makes floor plans, CAD drawings and architecture images.\n- Ready-made plans: search_house_plans, then get_house_plan. Free PDF/DXF/IFC downloads, no account.\n- A new floor plan as a measured CAD drawing (DXF/DWG/PDF): with the user's account, start_cad_drawing, then get_cad_drawing until it is ready; change_cad_drawing for edits. Without an account, or to attach a sketch on the site, prepare_cad_drawing_link.\n- Photos and renders (remodel preview, sketch to render, staging): get_design_tool_link.\nDrawings are concepts, not permit or construction documents.",
      "tools": [
        {
          "name": "change_cad_drawing",
          "title": "Change a CAD drawing",
          "description": "Use this when the user asks to change one of their CAD drawings in words (\"make the kitchen 4.2 m wide\", \"move the garage to the left\", \"add a window to bedroom 2\"). The drafter makes the change as a new version (earlier versions stay in the studio). Spends credits from the user's AI Architectures account (usually 60 to 600 per change). Then call get_cad_drawing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "change": {
                "description": "What should change, in the user's words.",
                "maxLength": 4000,
                "minLength": 3,
                "type": "string"
              },
              "drawing_id": {
                "pattern": "^[a-z0-9]{6,32}$",
                "type": "string"
              }
            },
            "required": ["change", "drawing_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "kind": {
                "const": "drawing",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change a CAD drawing"
