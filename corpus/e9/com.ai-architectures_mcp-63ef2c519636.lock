        {
          "name": "start_cad_drawing",
          "title": "Start a CAD drawing",
          "description": "Use this when the user asks to draw or design a floor plan as a real CAD drawing and wants it made now. The AI drafter of the Plan Chat CAD studio draws a layered, dimensioned plan (walls, doors, windows, furniture, dimensions, room names and areas) from the description and, if attached, a sketch or photo of a plan. Needs the user's AI Architectures account and spends credits from it (usually 700 to 1,800 credits per drawing; get_credit_balance shows the balance). Drawing takes 1 to 5 minutes; then call get_cad_drawing with the returned drawing_id. Confirm the brief with the user before starting.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "description": "The building: type, rooms with sizes if known, storeys, overall size or plot, style. Any language. With a sketch, say what it shows.",
                "maxLength": 4000,
                "minLength": 3,
                "type": "string"
              },
              "sketch": {
                "additionalProperties": false,
                "description": "A sketch, photo or screenshot of a floor plan the user attached in the chat.",
                "properties": {
                  "download_url": {
                    "type": "string"
                  },
                  "file_id": {
                    "type": "string"
                  },
                  "file_name": {
                    "type": "string"
                  },
                  "mime_type": {
                    "type": "string"
                  }
                },
                "required": ["download_url", "file_id"],
                "type": "object"
              },
              "sketch_url": {
                "description": "Optional https URL of a sketch, photo or screenshot of a floor plan (JPG, PNG, WebP, HEIC; up to 15 MB), if no file was attached.",
                "maxLength": 2000,
                "type": "string"
              },
              "units": {
                "default": "m",
                "description": "m = metres and m², ft = feet-inches and sq ft. Use ft for US users.",
                "enum": ["m", "ft"],
                "type": "string"
              }
            },
            "required": ["brief"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "kind": {
                "const": "drawing",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start a CAD drawing"
