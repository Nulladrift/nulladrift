{
  "lockfileVersion": 2,
  "subjects": {
    "com.geiant/mcp-perception": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://packagesmcp-perception-production.up.railway.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "geiant-perception",
        "version": "0.3.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "gns_get_compliance_report",
          "title": "Get Compliance Report",
          "description": "Returns a full EU AI Act compliance report for a GNS agent, including trust score, chain verification, Merkle epoch proofs, delegation certificate, and regulatory status.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agentHandle": {
                "description": "GNS handle of the agent (e.g. energy@italy-geiant)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://geiant/compliance-dashboard.html"
            },
            "ui/resourceUri": "ui://geiant/compliance-dashboard.html"
          },
          "digest": "sha256:67eda648e2205e5eea86a21e8c0eab1cf04763223754c92e8894071aede0313b"
        },
        {
          "name": "gns_get_trust_score",
          "description": "Get the current TierGate trust tier and score for an agent. Tiers: provisioned (0%) → observed (25%) → trusted (60%) → certified (85%) → sovereign (99%). Omit agent_pk to query the server's own agent.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent_pk": {
                "description": "Ed25519 public key (64 hex chars). Omit for own agent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:107f75ecb0ed2c16b4c6a97d8c521e15b0b5aeec7c636c5568218a549285bef7"
        },
        {
          "name": "gns_roll_epoch",
          "description": "Roll all pending breadcrumbs into a new sealed epoch with a Merkle root. Returns { epoch_index, merkle_root, block_count, epoch_hash }. Call this at the end of a session to produce a tamper-evident compliance snapshot.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:700474bfefd4ce832f82b49e4b96d27077a6c02da7feafb079863fa74c4d4ef0"
        },
        {
          "name": "gns_verify_chain",
          "description": "Verify the cryptographic integrity of an agent's breadcrumb chain. Returns { is_valid, block_count, issues[] } plus epoch Merkle roots. A valid chain proves no audit records have been tampered with.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent_pk": {
                "description": "Ed25519 public key (64 hex chars). Omit for own agent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dc52cd56d4190584604a1a27734d2dfb621985629a605e951d69e66c70c0aae2"
        },
        {
          "name": "perception_classify",
          "description": "Run Prithvi-EO-2.0-300M-TL-Sen1Floods11 flood classification on a Sentinel-2 tile previously fetched by perception_fetch_tile. Sends the 6-band chip to a RunPod endpoint and returns: dominant_class, flood_pixel_pct, confidence, class_counts, and the full perception_chain. The perception chain is written to Spatial Memory and a signed audit breadcrumb is dropped to the agent trail.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "h3_cell": {
                "description": "Override H3 cell. Defaults to the cell from the original fetch.",
                "type": "string"
              },
              "task": {
                "description": "Classification task. Currently only \"flood\" is supported.",
                "enum": ["flood", "landcover", "burnscar", "anomaly"],
                "type": "string"
              },
              "tile_id": {
                "description": "tile_id from perception_fetch_tile result (must be in session cache).",
                "type": "string"
              },
              "write_to_spatial_memory": {
                "description": "Write perception chain to geiant_geometry_state. Default: true.",
                "type": "boolean"
              }
            },
            "required": ["task", "tile_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7b156a771f2df87620761e760d3ae72fb8805b04767e83dafa0851870db0183c"
        },
        {
          "name": "perception_embed",
          "description": "[Sub-phase 4.2 — NOT YET IMPLEMENTED] Will generate Clay v1.5 embeddings.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "tile_id": {
                "description": "tile_id from perception_fetch_tile result",
                "type": "string"
              }
            },
            "required": ["tile_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:784a08f9f4743bf6b2e3c1d1d0d385a986bc6d1fc2896ee448ca0eb1374641af"
        },
        {
          "name": "perception_fetch_tile",
          "description": "Fetch the least-cloudy Sentinel-2 L2A tile covering a given H3 cell from Microsoft Planetary Computer. Returns signed COG band URLs for all 6 Prithvi/Clay spectral bands (B02 Blue, B03 Green, B04 Red, B8A NIR, B11 SWIR1, B12 SWIR2), plus tile metadata. The tile is cached in memory for subsequent perception_classify or perception_embed calls.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "days_back": {
                "description": "Days to search back. Default: 30.",
                "maximum": 365,
                "minimum": 1,
                "type": "number"
              },
              "h3_cell": {
                "description": "H3 cell ID at any resolution.",
                "type": "string"
              },
              "max_cloud_cover": {
                "description": "Max cloud cover %. Default: 20.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "timestamp": {
                "description": "ISO 8601 datetime. Search back from this point. Defaults to now.",
                "type": "string"
              }
            },
            "required": ["h3_cell"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0633c99177afdf811ec416d88458bb1d1a098cf41bf9524d38ecd9ff63a3c4d"
        },
        {
          "name": "perception_weather",
          "description": "Query atmospheric conditions for an H3 cell at a given timestamp from Open-Meteo ERA5. Returns wind, precipitation, temperature. Writes to Spatial Memory and drops a signed audit breadcrumb.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "h3_cell": {
                "description": "H3 cell ID at any resolution.",
                "type": "string"
              },
              "timestamp": {
                "description": "ISO 8601 datetime for weather lookup. Defaults to now.",
                "type": "string"
              },
              "write_to_spatial_memory": {
                "description": "Write weather context to geiant_geometry_state. Default: true.",
                "type": "boolean"
              }
            },
            "required": ["h3_cell"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:688e4c1eb728de952ddc7e150dd0a3436dfa4bbf3fc703c1e9586c1dcb385a4f"
        }
      ],
      "resources": [
        {
          "uri": "ui://geiant/compliance-dashboard.html",
          "name": "GEIANT Compliance Dashboard",
          "mimeType": "text/html;profile=mcp-app",
          "digest": "sha256:de1c5c948c9a0f3f6b0fbb9b005d5a9e29ec9dfb9fb44fd13fe9ccbf0a5a9df0"
        }
      ],
      "digest": "sha256:b12138b8b804d7eca0bc54ecb25b415160361afddf41102d71732e8fd97d89bb"
    }
  }
}
