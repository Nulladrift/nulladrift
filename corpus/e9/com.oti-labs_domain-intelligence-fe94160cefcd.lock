            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Email security (SPF, DMARC, DKIM)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2e7bcef0012b3572732aba6ffdc8c28da047ef585612e6905e82dad3348ea401"
