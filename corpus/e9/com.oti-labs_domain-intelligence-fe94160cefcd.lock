        "name": "domain-intelligence",
        "title": "Domain Intelligence",
        "version": "1.2.2",
        "websiteUrl": "https://oti-labs.com/mcp-server"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true,
          "subscribe": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Domain intelligence for any domain: WHOIS/RDAP registration (age, registrar, expiry), DNS records, the live SSL certificate, subdomains (live hosts with IPs vs historical names) and email authentication (SPF, DMARC, DKIM). Use domain_lookup for the full picture in one call, or a single tool when only one part is needed. Pass bare domains such as example.com. Works without a key for 1,000 lookups a month per IP (hosted Claude, ChatGPT and Smithery connectors share a larger pool per provider). After that, send a RapidAPI key subscribed to the Domain Intelligence API as the X-RapidAPI-Key header; its free plan adds 1,000 requests a month: https://rapidapi.com/osiris-technical-institute-osiris-technical-institute-default/api/domain-intelligence-api/pricing",
      "tools": [
        {
          "name": "dns_records",
          "title": "DNS records",
          "description": "DNS records for a domain: A, AAAA, MX, TXT, NS, CAA and SOA, resolved in parallel.",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["domain"],
            "title": "dns_recordsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "dns_recordsDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "DNS records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a665fb97bf95114c5c2513209829c2af6c50b97cc499e2c659b5d81d7af50891"
        },
        {
          "name": "domain_lookup",
          "title": "Full domain lookup",
          "description": "Full report on a domain in one call: WHOIS/RDAP registration, DNS records, live SSL\n    certificate, subdomains (live hosts with IPs first) and email authentication (SPF, DMARC, DKIM).\n    Use it to triage a suspicious domain or profile a company's domain. If one section fails it comes\n    back as an object with an `error` field and the rest is unaffected. Set wait=true to wait for every\n    subdomain source (up to about 20 s) instead of the fast first result.",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              },
              "subdomain_limit": {
                "default": 50,
                "title": "Subdomain Limit",
                "type": "integer"
              },
              "wait": {
                "default": false,
                "title": "Wait",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "title": "domain_lookupArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "domain_lookupDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Full domain lookup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:68c916fa48234989b7be0eecfe56df3e4947ccb1ed9e0d3ee51da04f8960ac31"
        },
        {
          "name": "email_security",
          "title": "Email security (SPF, DMARC, DKIM)",
