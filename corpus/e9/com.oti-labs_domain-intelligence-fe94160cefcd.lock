            "additionalProperties": true,
            "title": "subdomainsDictOutput",
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Subdomains"
          },
          "behavior": {
