          "name": "ssl_certificate",
          "title": "SSL certificate",
          "description": "The certificate a domain serves on port 443, from a live TLS handshake: issuer, subject,\n    valid_from, valid_to, days_until_expiry, SANs, signature algorithm and serial number.",
