            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "SSL certificate"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b7076b95c4afb0259d2fd94f19927d163d4a67a29242324e87b30d65467eed3c"
        },
        {
          "name": "subdomains",
          "title": "Subdomains",
          "description": "Subdomains of a domain from certificate transparency logs, passive DNS and DNS brute force.\n    `live` lists hosts that resolve now, each with its IP; `subdomains` lists every name found, live\n    first; `pools` summarises large shared-infrastructure zones. The first lookup of a domain is a fast\n    snapshot and later ones are fuller; set wait=true to wait for every source (up to about 20 s).",
          "inputSchema": {
            "properties": {
              "domain": {
                "title": "Domain",
                "type": "string"
              },
              "limit": {
                "default": 100,
