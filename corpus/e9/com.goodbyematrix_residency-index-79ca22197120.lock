        {
          "name": "explain_term",
          "title": "Explain a glossary term",
          "description": "Explains a term on relocation, residency, citizenship, tax and asset protection from the GoodbyeMatrix glossary (more than 120 terms, for example golden visa, 183-day rule, tax residency certificate, flag theory) with the glossary page in German and English. The definition is returned in the requested language (English or German); a term without an English entry yet comes with the German definition and a note. Related terms are listed when the search term matches several entries. Read-only: it only retrieves and computes from the GoodbyeMatrix data set, stores nothing, sends nothing and calls no external services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "en",
                "description": "Response language: \"en\" (English, default) or \"de\" (German).",
                "enum": ["de", "en"],
                "type": "string"
              },
              "term": {
                "description": "Term in English or German, for example \"183-day rule\" or \"Wegzugsbesteuerung\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "definition": {
                "properties": {
                  "language": {
                    "type": "string"
                  },
                  "text": {
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "definitionNote": {
                "description": "Only when the English definition is not available yet and the German one is returned.",
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "glossaryPage": {
                "properties": {
                  "de": {
                    "type": "string"
                  },
                  "en": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
