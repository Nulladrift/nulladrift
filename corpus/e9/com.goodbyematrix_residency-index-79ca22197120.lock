        {
          "name": "get_cbi_quote",
          "title": "Get CBI cost estimate",
          "description": "Answers how much citizenship by investment or a second passport costs for a person or family, or compares programmes by total cost. Calculates the indicative cost for a family: government contribution, investment, fees, professional fees, payment phases and total in USD, plus which family members are eligible, processing time, page links and quoteRequestUrl. With one programme it returns that programme; without program it compares all 9 programmes (St Kitts and Nevis, Antigua and Barbuda, Dominica, Grenada, Saint Lucia, Vanuatu, Sao Tome and Principe, Nauru, Argentina). Figures are rounded indicative figures (total to the nearest 1,000 USD), binding only after a pre-check; the user receives the exact amounts by requesting the cost breakdown through quoteRequestUrl. Read-only: it only retrieves and computes from the GoodbyeMatrix data set, stores nothing, sends nothing and calls no external services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "family": {
                "description": "Everyone who applies together. The first person is the main applicant (role \"main\"); only the first person has the role \"main\". Defaults: a partner counts as married and not same-sex unless stated; a child under 18 counts as dependent.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "age": {
                      "description": "Age in years.",
                      "maximum": 120,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "birthplace": {
                      "description": "Optional: country of birth as ISO 3166-1 alpha-2 code, as mentioned by the user.",
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "dependent": {
                      "description": "Dependent on the main applicant (for example a child in education or a parent living in the household).",
                      "type": "boolean"
                    },
                    "financially_dependent": {
                      "description": "Financially dependent on the main applicant (relevant for adult children and parents).",
                      "type": "boolean"
                    },
                    "married": {
                      "description": "Married to the main applicant (partner) or married themselves (other roles).",
                      "type": "boolean"
                    },
                    "nationalities": {
                      "description": "Optional: every citizenship of this person as ISO 3166-1 alpha-2 codes (for example [\"DE\"] or [\"RU\", \"GE\"] for dual citizens), as mentioned by the user.",
                      "items": {
                        "pattern": "^[A-Za-z]{2}$",
                        "type": "string"
                      },
                      "maxItems": 5,
                      "type": "array"
                    },
                    "role": {
                      "description": "Relationship to the main applicant: main, partner, child, parent, parent_in_law, grandparent, grandparent_in_law, sibling.",
                      "enum": ["main", "partner", "child", "parent", "parent_in_law", "grandparent", "grandparent_in_law", "sibling"],
                      "type": "string"
                    },
                    "same_sex": {
                      "description": "Same-sex partnership (relevant for partners).",
                      "type": "boolean"
                    }
                  },
                  "required": ["age", "role"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Response language: \"en\" (English, default) or \"de\" (German).",
                "enum": ["de", "en"],
                "type": "string"
              },
              "program": {
                "description": "Programme key: sao_tome (Sao Tome and Principe), vanuatu, dominica, st_lucia (Saint Lucia), st_kitts (St. Kitts and Nevis), grenada, antigua (Antigua and Barbuda), nauru, argentina. Without a programme, the figures cover all programmes at once.",
                "enum": ["sao_tome", "vanuatu", "dominica", "st_lucia", "st_kitts", "grenada", "antigua", "nauru", "argentina"],
                "type": "string"
              }
            },
            "required": ["family"],
            "type": "object"
          },
