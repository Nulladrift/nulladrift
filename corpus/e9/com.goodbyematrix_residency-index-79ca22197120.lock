      "instructions": "GoodbyeMatrix Residency & Citizenship Index: general information on residency programmes and citizenship by investment from the GoodbyeMatrix knowledge base, for moving abroad along the lines of flag theory (a second residency, a second passport, a new tax residence). It covers more than 170 public residency programmes in more than 80 countries (golden visa or residence by investment, digital nomad visa, independent means visa for retirees and passive income, active investor and entrepreneur visa), 20 citizenship by investment (CBI) programmes, about 200 countries with their tax system and a glossary of relocation and tax terms. search_programs filters programmes by country, region, programme type, maximum budget in USD, path to citizenship and dual citizenship, with paging. get_program returns one programme in detail, compare_programs sets 2 to 5 programmes side by side, get_country_overview summarises a country (tax system, programmes, link to the GoodbyeMatrix climate map) and explain_term explains a glossary term with its glossary page. For the 9 CBI programmes with a cost calculator (St Kitts and Nevis, Antigua and Barbuda, Dominica, Grenada, Saint Lucia, Vanuatu, Sao Tome and Principe, Nauru, Argentina), get_cbi_quote calculates indicative costs for a specific family, list_cbi_programs lists these programmes and request_cost_breakdown_link returns the link to the detailed cost breakdown; the figures are rounded and binding only after a pre-check. Nationality and country of birth count for every person in the family, not only for the main applicant, because exclusions apply per person. CBI figures are calculated live at request time from the current GoodbyeMatrix price and rule data; their data status is the date of the response (updatedAt), not an older date, and rulesChangedAt names the last change to prices or rules. The other CBI programmes are listed as on request, coming soon or closed. request_consultation_link returns the GoodbyeMatrix consultation page; the link carries no personal data. In answers for a person, the GoodbyeMatrix programme page and, for costs, the personal link quoteRequestUrl (calculator page with the family already filled in) are the links that help; API, MCP and JSON addresses are internal and stay out of answers for people. A person writing in German receives language de and the German programme pages (pages.de); any other language means language en and the English pages (pages.en). A personal calculator link also forms without a tool call: programme page plus ?gbm_family=main:45,partner:43,child:14#rechner (roles and ages), where the page calculates and offers the cost breakdown. Every answer names the GoodbyeMatrix programme page in German and English, the date of the source (stand) and a short note that the content is general information, not legal, tax or immigration advice, and does not decide eligibility. Answers are in English by default or in German with language \"de\".",
      "tools": [
        {
          "name": "compare_programs",
          "title": "Compare programmes",
          "description": "Sets 2 to 5 programmes of the index side by side: type, country, minimum amount, physical presence, time to permanent residency and to citizenship, path to citizenship, dual citizenship, tax system of the country, visa-free destinations and the programme page in German and English, plus the date of the source and consultationNote. Read-only: it only retrieves and computes from the GoodbyeMatrix data set, stores nothing, sends nothing and calls no external services.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ids": {
                "description": "2 to 5 programme ids (as returned by search_programs).",
                "items": {
                  "description": "Programme id from search_programs or get_country_overview, or a programme name (word order and country codes are tolerated).",
                  "maxLength": 120,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Response language: \"en\" (English, default) or \"de\" (German).",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "consultationNote": {
                "type": "string"
              },
              "language": {
                "enum": ["de", "en"],
                "type": "string"
              },
              "notice": {
                "description": "General information, not legal, tax or immigration advice.",
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              },
              "programs": {
                "items": {
                  "properties": {
                    "availability": {
                      "description": "Citizenship by investment only: cost_calculator, on_request, coming_soon or closed.",
                      "type": "string"
                    },
                    "betragsHauptart": {
                      "description": "Residency only: main kind of the headline amount: kapital_angelegt (capital invested and kept), zahlung (payment that is spent: contribution, fee, membership, minimum tax) or nachweis (proof of funds or income). null when not set.",
                      "type": ["string", "null"]
                    },
                    "betragsart": {
                      "description": "Residency only: kind of the headline amount (minimumAmount or incomeRequirement) as set by GoodbyeMatrix, one of immobilie (property purchase), bankeinlage (bank deposit), anleihen_fonds (bonds or funds), unternehmen (business investment), investition (minimum investment, several routes), staatsbeitrag (government contribution), mitgliedschaft (membership fee), gebuehr (one-time fee), mindeststeuer (minimum tax per year), vermoegen (proof of funds), einkommen (income). null when not set.",
                      "type": ["string", "null"]
                    },
                    "citizenshipPath": {
                      "type": ["boolean", "null"]
                    },
                    "country": {
                      "properties": {
                        "code": {
                          "type": ["string", "null"]
                        },
                        "name": {
                          "type": ["string", "null"]
                        }
                      },
                      "type": "object"
                    },
                    "dualCitizenship": {
                      "description": "permitted, conditional or prohibited.",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Programme id for get_program and compare_programs.",
                      "type": "string"
                    },
                    "incomeRequirement": {
                      "description": "Residency only, where published: minimum income as on the programme page.",
                      "type": "string"
                    },
                    "minInvestmentUsd": {
                      "description": "Minimum investment in USD where known (0 when no investment is required).",
                      "type": ["number", "null"]
                    },
                    "minimumAmount": {
                      "description": "Minimum investment as published on the programme page (currency as stated); for citizenship by investment the lowest starting amount in USD.",
                      "type": ["string", "null"]
