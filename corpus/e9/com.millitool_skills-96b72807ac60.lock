          "name": "recommend_skills",
          "description": "Find skills for a task or technology stack. Returns ranked candidates, indexed source commits, compatibility hints and installation suggestions. Does not install or run code.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
