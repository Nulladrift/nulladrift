        {
          "name": "get_bookings",
          "title": "Get bookings",
          "description": "Lists the connected Nexwin account's appointments/bookings in a date range (max 30 days, first 25 results). Each booking includes its appointmentId and teamMemberId (needed for reschedule_booking and cancel_booking), exact ISO startTime/endTime, and timezone. Requires a connected account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "endDate": {
                "description": "YYYY-MM-DD, business-local",
                "type": "string"
              },
              "startDate": {
                "description": "YYYY-MM-DD, business-local",
                "type": "string"
              },
              "status": {
                "enum": ["scheduled", "confirmed", "canceled", "completed"],
                "type": "string"
              }
            },
            "required": ["endDate", "startDate"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appointments": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "appointmentId": {
                      "description": "Pass to reschedule_booking or cancel_booking",
                      "type": ["string", "null"]
                    },
                    "customerName": {
                      "type": ["string", "null"]
                    },
                    "durationMinutes": {
                      "type": ["number", "null"]
                    },
                    "endTime": {
                      "description": "Exact end, ISO 8601 UTC",
                      "type": ["string", "null"]
                    },
                    "start": {
                      "description": "Start for display, in the business timezone, e.g. \"Wed 9 Jul, 2:00 PM\"",
