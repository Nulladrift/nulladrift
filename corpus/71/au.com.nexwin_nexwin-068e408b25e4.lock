        {
          "name": "add_assets",
          "title": "Add assets",
          "description": "Adds bookable assets (rooms, campsites, vehicles, equipment) to the connected Nexwin account, up to 100 in one call, and tells the live receptionist about them. Use it to set up a whole list the user has pasted or uploaded. All of them are added or none: if any row is invalid, or a name is already in use, nothing is saved and the error says which row. Identical units go in one asset with a quantity (e.g. \"Standard Room\", quantity 12) rather than twelve assets. bookingType: nightly (check in one day, out a later day), day (a block within one day), date_range (whole days), or not_applicable. Executes immediately. Call list_assets first to avoid clashing names.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "assets": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assetType": {
                      "description": "e.g. \"Campsite\", \"Hotel Room\", \"Car\"",
                      "maxLength": 60,
                      "minLength": 1,
                      "type": "string"
                    },
                    "bookingType": {
                      "enum": ["nightly", "day", "date_range", "not_applicable"],
                      "type": "string"
                    },
                    "checkInTime": {
                      "description": "HH:mm, business-local. Default 14:00 (nightly) or the day start",
                      "type": "string"
                    },
                    "checkOutTime": {
                      "description": "HH:mm, business-local. Default 10:00 (nightly) or the day end",
                      "type": "string"
                    },
                    "description": {
                      "description": "What the receptionist says when a caller asks about it",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "hideName": {
                      "description": "true if the receptionist should never say this specific name to callers",
                      "type": "boolean"
                    },
                    "name": {
                      "description": "e.g. \"Site 12\", \"Deluxe King Room\", \"Toyota Camry #3\"",
                      "maxLength": 120,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Identical bookable units this asset stands for",
                      "maximum": 1000,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["assetType", "bookingType", "name", "quantity"],
                  "type": "object"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["assets"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "created": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "assetId": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["assetId", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "liveOnReceptionist": {
                "type": "boolean"
              },
              "liveWarning": {
                "type": ["string", "null"]
              },
              "message": {
                "type": ["string", "null"]
              },
              "success": {
                "type": "boolean"
              }
            },
            "required": ["created", "liveOnReceptionist", "liveWarning", "message", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add assets"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:af5b40ebf6d02d5ddf31cc8d6a078cc96bb93a208fb5703387e7701e2b37f167"
        },
        {
          "name": "add_team_member",
          "title": "Add a team member",
          "description": "Adds a person to the connected Nexwin account's team without a login, so bookings can be made with them. Nobody is emailed. Use invite_team_member instead if they need to sign in. Set isInternalOnly for someone callers should never be told about by name. Returns the new teamMemberId.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Optional; kept on their profile",
                "format": "email",
                "type": "string"
              },
              "firstName": {
                "minLength": 1,
                "type": "string"
              },
              "isInternalOnly": {
                "description": "true hides this person's name from callers",
                "type": "boolean"
              },
              "lastName": {
                "minLength": 1,
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone, e.g. Australia/Sydney (the default)",
                "type": "string"
              }
            },
            "required": ["firstName", "lastName"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "invited": {
                "type": "boolean"
              },
              "message": {
                "type": ["string", "null"]
              },
              "success": {
                "type": "boolean"
              },
              "teamMemberId": {
                "type": "string"
              }
            },
            "required": ["message", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Add a team member"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d04627ad0ea3457b006c905f20e8655660fe0b3f0c42472d43d64fd4b91ea823"
        },
        {
          "name": "cancel_booking",
          "title": "Cancel a booking",
          "description": "Cancels a booking (appointmentId from get_bookings) by PERMANENTLY DELETING it — it will not appear afterwards, even as canceled. Also removes its Zoom meeting and calendar event and emails the customer a cancellation. Cannot be undone. Before calling, tell the user which booking (customer, time) will be cancelled and that the customer will be emailed, and get their explicit yes; then pass confirm: true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appointmentId": {
                "description": "From get_bookings",
                "type": "string"
              },
              "confirm": {
                "description": "true only after the user has explicitly confirmed cancelling this specific booking in the conversation",
                "type": "boolean"
              }
            },
            "required": ["appointmentId", "confirm"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appointmentId": {
                "type": "string"
              },
              "message": {
                "type": ["string", "null"]
              },
              "success": {
                "type": "boolean"
              }
            },
            "required": ["message", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel a booking"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:842d03a029070238a199c3dea7b1fd7331e7c91eb5e7d73eff9845fa6eda9e79"
        },
        {
          "name": "create_booking",
          "title": "Create a booking",
          "description": "Creates a new appointment on the connected Nexwin account and emails the customer a confirmation. Executes immediately. Get teamMemberId and timezone from list_team_members first. Online bookings require customerEmail and create a Zoom meeting; in-person bookings need customerEmail or customerPhone. Fails if the team member is already booked at that time.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "customerEmail": {
                "type": "string"
              },
              "customerName": {
                "type": "string"
              },
              "customerPhone": {
                "type": "string"
              },
              "endTime": {
                "description": "ISO 8601 with UTC offset, e.g. 2026-09-20T15:00:00+10:00",
                "type": "string"
              },
              "meetingAddress": {
                "description": "For in_person bookings",
                "type": "string"
              },
              "meetingType": {
                "enum": ["online", "in_person"],
                "type": "string"
              },
              "startTime": {
                "description": "ISO 8601 with UTC offset, e.g. 2026-09-20T14:00:00+10:00",
                "type": "string"
              },
              "teamMemberId": {
                "description": "From list_team_members",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone, e.g. Australia/Sydney — use the team member's timezone from list_team_members",
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
            "required": ["customerName", "endTime", "meetingType", "startTime", "teamMemberId", "timezone", "title"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "appointmentId": {
                "type": "string"
              },
              "message": {
                "type": ["string", "null"]
              },
              "success": {
                "type": "boolean"
              }
            },
            "required": ["message", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a booking"
          },
          "behavior": {
            "destructive": false,
