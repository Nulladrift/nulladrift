        },
        {
          "name": "update_team_member",
          "title": "Update a team member",
          "description": "Changes a team member's settings (teamMemberId from list_team_members): their timezone, role, how much notice they need before a booking (leadTimeMinutes), the travel gap kept around each of their bookings (travelBufferMinutes), or whether their name is hidden from callers (isInternalOnly). Only the fields given are changed. Only the account owner can change a role or isInternalOnly. Before calling, tell the user who is being changed and how, and get their explicit yes; then pass confirm: true.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "description": "true only after the user has explicitly approved this specific change in the conversation",
                "type": "boolean"
              },
              "isInternalOnly": {
                "type": "boolean"
              },
              "leadTimeMinutes": {
                "description": "Minutes from now before their next booking is allowed",
                "maximum": 10080,
                "minimum": 0,
                "type": "integer"
              },
              "role": {
                "enum": ["admin", "member"],
                "type": "string"
              },
              "teamMemberId": {
                "description": "From list_team_members",
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone, e.g. Australia/Perth",
                "type": "string"
              },
              "travelBufferMinutes": {
                "description": "Minutes kept free before and after each booking; 0 turns it off",
                "maximum": 480,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["confirm", "teamMemberId"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "invited": {
                "type": "boolean"
              },
              "message": {
                "type": ["string", "null"]
              },
              "success": {
                "type": "boolean"
              },
              "teamMemberId": {
                "type": "string"
              }
            },
            "required": ["message", "success"],
            "type": "object"
          },
