          "name": "update_ai_setup",
          "title": "Change receptionist settings",
          "description": "Changes how the connected account's AI receptionist answers, and puts the change live for real callers straight away. Editable fields: businessName, aboutYourBusiness (max 500 characters), businessAddress, handbook (the How to Handle Calls instructions), assistantName, greetingNew, greetingReturning, afterHoursAction (message, callback or voicemail) and sendConfirmationEmail (true or false). For the handbook, set append: true to add a line to the end of what's there, or remove: true to take one exact piece of text back out and leave the rest untouched; with neither, the whole handbook is replaced. Call get_ai_setup first. Before calling, tell the user exactly which settings will change and to what, and get their explicit yes; then pass confirm: true. All changes in one call are applied together or not at all, and are saved as a new version that restore_ai_setup_version can undo. For something temporary (someone on leave, a holiday closure): append a note to the handbook that carries its own dates, e.g. \"TEMPORARY, from Mon 12 Oct 2026 until Sun 18 Oct 2026: Raj is on leave. Offer callers a callback from Monday 19 October. Ignore this note outside those dates.\" Nothing removes the note automatically, so tell the user it stays in the handbook until they ask you to take it out, which is another call with remove: true and the exact text of the note.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changes": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "append": {
                      "description": "handbook and aboutYourBusiness only: add to the end of the existing text instead of replacing it",
                      "type": "boolean"
                    },
                    "field": {
                      "enum": ["businessName", "aboutYourBusiness", "businessAddress", "handbook", "assistantName", "greetingNew", "greetingReturning", "afterHoursAction", "sendConfirmationEmail"],
                      "type": "string"
                    },
                    "remove": {
                      "description": "handbook and aboutYourBusiness only: take this exact text out of the existing text and leave the rest as it is",
                      "type": "boolean"
                    },
                    "value": {
                      "description": "Text for most fields; true or false for sendConfirmationEmail",
                      "type": ["string", "boolean"]
                    }
                  },
                  "required": ["field", "value"],
                  "type": "object"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              },
              "confirm": {
                "description": "true only after the user has explicitly approved these specific changes in the conversation",
                "type": "boolean"
              }
            },
            "required": ["changes", "confirm"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changes": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["field"],
                  "type": "object"
                },
                "type": "array"
              },
              "liveWarning": {
                "type": ["string", "null"]
              },
              "message": {
                "type": ["string", "null"]
              },
              "previousVersion": {
                "type": "number"
              },
              "restoredFrom": {
                "type": "number"
              },
              "success": {
                "type": "boolean"
              },
              "version": {
                "type": "number"
              }
            },
            "required": ["changes", "liveWarning", "message", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change receptionist settings"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:aa0250f2f1278f9084f03ea7bb6bf4426b15b07854791b71c08a9feb8213870e"
        },
        {
          "name": "update_service_area",
          "title": "Change the service area",
          "description": "Changes which places the connected account's AI receptionist serves, and puts the change live for real callers straight away. In Australia the area is one list that can mix whole states, councils, suburbs and postcodes (a postcode adds every suburb in it); in Qatar it is a list of municipalities (type region). Name places as people write them, adding the state (and for a suburb, the postcode) when a name could mean more than one place; if a name still matches several, nothing changes and the error lists the matches to ask the user about. remove takes places off the list and runs before add, so one call can swap areas. coverAll: true serves the whole country instead of a list; adding areas to a whole-country setting narrows it to just those areas. The list cannot leave out part of a listed area: to stop serving one suburb of a listed state or council, remove that state or council and add the parts still served. outOfAreaPolicy sets what happens to callers outside the area: reject (told so, not booked) or flag_for_review (details taken for the team to check). Call get_ai_setup first: its serviceArea setting lists every place served now. Before calling, tell the user exactly which places will be added or removed (or that the whole country will be served) and that it goes live immediately, and get their explicit yes; then pass confirm: true. Saved as a new version that restore_ai_setup_version can undo.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "add": {
                "description": "Places to start serving",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "name": {
                      "description": "The place's name as people write it; for a postcode, its four digits",
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "postcode": {
                      "description": "A suburb's postcode, to tell same-named suburbs apart",
                      "maxLength": 10,
                      "type": "string"
                    },
                    "state": {
                      "description": "Australian state or territory (e.g. NSW), to tell same-named places apart",
                      "maxLength": 40,
                      "type": "string"
                    },
                    "type": {
                      "enum": ["state", "council", "suburb", "postcode", "region"],
                      "type": "string"
                    }
                  },
                  "required": ["name", "type"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              },
              "confirm": {
                "description": "true only after the user has explicitly approved this specific change in the conversation",
                "type": "boolean"
              },
              "coverAll": {
                "description": "true to serve the whole country instead of a list; not combined with add or remove",
                "type": "boolean"
              },
              "outOfAreaPolicy": {
                "description": "What happens to callers outside the area",
                "enum": ["reject", "flag_for_review"],
                "type": "string"
              },
              "remove": {
                "description": "Places on the list to stop serving",
                "items": {
                  "$ref": "#/properties/add/items"
                },
                "maxItems": 100,
                "type": "array"
              }
            },
            "required": ["confirm"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "changes": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "field": {
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["field"],
                  "type": "object"
                },
                "type": "array"
              },
              "liveWarning": {
                "type": ["string", "null"]
              },
              "message": {
                "type": ["string", "null"]
              },
              "previousVersion": {
                "type": "number"
              },
              "restoredFrom": {
                "type": "number"
              },
              "success": {
                "type": "boolean"
              },
              "version": {
                "type": "number"
              }
            },
            "required": ["changes", "liveWarning", "message", "success"],
            "type": "object"
          },
