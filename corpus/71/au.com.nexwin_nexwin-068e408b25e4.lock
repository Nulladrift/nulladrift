        {
          "name": "find_customer",
          "title": "Find a customer",
          "description": "Looks up customers on the connected Nexwin account by part of a name, phone number or email address. Returns contact details, how often they've called or chatted, and what their last conversation was about. Use for \"has Sam called before?\" or \"what did Sam want last time?\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Most matches to return (default 10)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "search": {
                "description": "Part of a name, phone number or email address",
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["search"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "customers": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "customerId": {
                      "type": "string"
                    },
                    "email": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": ["string", "null"]
                    },
                    "phone": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["email", "name", "phone"],
                  "type": "object"
                },
                "type": "array"
              },
              "hasMore": {
                "type": "boolean"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["customers", "hasMore", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a customer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
