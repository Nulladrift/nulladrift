        {
          "name": "get_activity_summary",
          "title": "Get activity summary",
          "description": "Summarises what happened on the connected Nexwin account over a period: the answer to \"what's happened the last two days?\" or \"anything I need to follow up?\". Returns totals for calls and for chats (how many, resolved, needing follow-up, transferred to staff, sentiment, bookings made) and one entry per conversation, newest first, with the receptionist's own summary and action items. Give lastDays (today counts as day 1, in the business's timezone) or startDate and endDate; 30 days at most. Set followUpsOnly for \"who do I need to call back?\". For a full transcript, pass an entry's channel and id to get_call_chat_detail.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "endDate": {
                "description": "YYYY-MM-DD, business-local",
                "type": "string"
              },
              "followUpsOnly": {
                "description": "Only list conversations that have action items",
                "type": "boolean"
              },
              "lastDays": {
                "description": "How many days back, today included. Use instead of startDate/endDate.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "maxItems": {
                "description": "Conversations to list (default 50)",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "startDate": {
                "description": "YYYY-MM-DD, business-local",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "calls": {
                "additionalProperties": true,
                "properties": {
                  "needingFollowUp": {
                    "type": "number"
                  },
                  "resolved": {
                    "type": "number"
                  },
                  "total": {
                    "type": "number"
                  },
                  "totalMinutes": {
                    "type": "number"
                  },
                  "transferredToStaff": {
                    "type": "number"
                  },
                  "unresolved": {
                    "type": "number"
                  }
                },
                "required": ["needingFollowUp", "resolved", "total", "totalMinutes", "transferredToStaff", "unresolved"],
                "type": "object"
              },
              "chats": {
                "$ref": "#/properties/calls"
              },
              "endDate": {
                "type": "string"
              },
              "followUpsOnly": {
                "type": "boolean"
              },
              "items": {
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "actionItems": {
                      "type": ["string", "null"]
                    },
                    "channel": {
                      "type": "string"
                    },
                    "customerName": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "startedAt": {
                      "type": ["string", "null"]
                    },
                    "summary": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["actionItems", "channel", "customerName", "id", "startedAt", "summary"],
                  "type": "object"
                },
                "type": "array"
              },
              "itemsOmitted": {
                "type": "number"
              },
              "partial": {
                "description": "True when the period had more conversations than were read; only the two totals then cover the whole period",
                "type": "boolean"
              },
              "startDate": {
                "type": "string"
              },
              "timezone": {
                "type": ["string", "null"]
              }
            },
            "required": ["calls", "chats", "endDate", "followUpsOnly", "items", "itemsOmitted", "partial", "startDate", "timezone"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get activity summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a3dfb25c120842cd5a0cb6c472b28709253a1b19d07c3049c08b31734bbbaca7"
        },
