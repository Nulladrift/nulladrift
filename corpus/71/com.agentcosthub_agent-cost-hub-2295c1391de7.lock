{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentcosthub/agent-cost-hub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentcosthub.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agentcosthub",
        "title": "AI Agent Cost & Tools Hub",
        "version": "0.1.0",
        "websiteUrl": "https://agentcosthub.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only LLM API price data and agent cost estimates from agentcosthub.com. Prices last verified 13 Nov 2026 (2026-11-13).",
      "tools": [
        {
          "name": "cheapest_models_for",
          "title": "Cheapest models for a workload",
          "description": "Rank models by monthly cost for a workload. Use a preset (chatbot, rag, coding_agent, research_agent) or give token numbers.",
          "inputSchema": {
            "properties": {
              "cached_percent": {
                "description": "Share of input billed at the cached price, 0-100 (default 50 if steps_per_task>1, else 0)",
                "type": "number"
              },
              "calls_per_day": {
                "description": "Calls (or agent tasks) per day",
                "type": "number"
              },
              "input_tokens": {
                "description": "Input tokens per call/step",
                "type": "number"
              },
              "limit": {
                "description": "How many to return (default 5, max 20)",
                "type": "number"
              },
              "output_tokens": {
                "description": "Output tokens per call/step",
                "type": "number"
              },
              "popular_only": {
                "description": "Only well-known models (default true)",
                "type": "boolean"
              },
              "preset": {
                "description": "Optional workload preset that fills in token defaults: chatbot, rag, coding_agent, research_agent. Explicit numbers override it.",
                "enum": ["chatbot", "rag", "coding_agent", "research_agent"],
                "type": "string"
              },
              "reasoning_ratio": {
                "description": "Hidden reasoning tokens per output token, billed at the output price, on reasoning-capable models only (default: the preset's value, 0.9 for agent presets and custom workloads, 0 for chatbot; 0 excludes reasoning)",
                "type": "number"
              },
              "steps_per_task": {
                "description": "Model calls per task for multi-step agents (default 1)",
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5bd4cb1c55dac70f6d452233a20a09b09d0bf11a0f442c0597e851952a5610d"
        },
        {
          "name": "compare_models",
          "title": "Compare models",
          "description": "Compare 2-5 models on price and (optionally) on the monthly cost of one workload.",
          "inputSchema": {
            "properties": {
              "cached_percent": {
                "description": "Share of input billed at the cached price, 0-100 (default 50 if steps_per_task>1, else 0)",
                "type": "number"
              },
              "calls_per_day": {
                "description": "Calls (or agent tasks) per day",
                "type": "number"
              },
              "input_tokens": {
                "description": "Input tokens per call/step",
                "type": "number"
              },
              "models": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              },
              "output_tokens": {
                "description": "Output tokens per call/step",
                "type": "number"
              },
              "preset": {
                "description": "Optional workload preset that fills in token defaults: chatbot, rag, coding_agent, research_agent. Explicit numbers override it.",
                "enum": ["chatbot", "rag", "coding_agent", "research_agent"],
                "type": "string"
              },
              "reasoning_ratio": {
                "description": "Hidden reasoning tokens per output token, billed at the output price, on reasoning-capable models only (default: the preset's value, 0.9 for agent presets and custom workloads, 0 for chatbot; 0 excludes reasoning)",
                "type": "number"
              },
              "steps_per_task": {
                "description": "Model calls per task for multi-step agents (default 1)",
                "type": "number"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:585320311a5697d0764fe4f39243d7fafe4794c274a6136e45a0aad5cc3bd2bf"
        },
        {
          "name": "estimate_cost",
          "title": "Estimate agent cost",
          "description": "Estimate the monthly API cost of an AI agent or chatbot on one model. Easiest: pass model + preset (chatbot, rag, coding_agent, research_agent). Or give input_tokens, output_tokens and calls_per_day (plus optional steps_per_task, cached_percent); explicit numbers override the preset.",
          "inputSchema": {
            "properties": {
              "cached_percent": {
                "description": "Share of input billed at the cached price, 0-100 (default 50 if steps_per_task>1, else 0)",
                "type": "number"
              },
              "calls_per_day": {
                "description": "Calls (or agent tasks) per day",
                "type": "number"
              },
              "input_tokens": {
                "description": "Input tokens per call/step",
                "type": "number"
              },
              "model": {
                "description": "Model id like anthropic/claude-sonnet-5.5, or a name like \"Grok 4.7\"",
                "type": "string"
              },
              "output_tokens": {
                "description": "Output tokens per call/step",
                "type": "number"
              },
              "preset": {
                "description": "Optional workload preset that fills in token defaults: chatbot, rag, coding_agent, research_agent. Explicit numbers override it.",
                "enum": ["chatbot", "rag", "coding_agent", "research_agent"],
                "type": "string"
              },
              "reasoning_ratio": {
                "description": "Hidden reasoning tokens per output token, billed at the output price, on reasoning-capable models only (default: the preset's value, 0.9 for agent presets and custom workloads, 0 for chatbot; 0 excludes reasoning)",
                "type": "number"
              },
              "steps_per_task": {
                "description": "Model calls per task for multi-step agents (default 1)",
                "type": "number"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3b6c123784ad659b0b8e96fda245f4987045723c8b8c49c9a5e2f003ed2163f"
        },
        {
          "name": "get_model_price",
          "title": "Get model price",
          "description": "API list price of one model (input, output, cached input per 1M tokens) plus example monthly agent costs. For retired models, rates are last recorded list prices (see pricing_basis/recorded_note).",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model id like anthropic/claude-sonnet-5.5, or a name",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c5b48194d9eeb09e743a3cd979b91777e5ce880cef351a74b57ee5db76915df0"
        },
        {
          "name": "list_models",
          "title": "List models",
          "description": "List LLMs tracked by Agent Cost Hub with API list prices per 1M tokens. Optional filter by provider or text.",
          "inputSchema": {
            "properties": {
              "popular_only": {
                "type": "boolean"
              },
              "provider": {
                "description": "e.g. openai, anthropic, google",
                "type": "string"
              },
              "search": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b24535099003352a86b5c7d26ebb3e1e6f1395aba295327b8d735ab03410e4f0"
        }
      ],
      "digest": "sha256:67d3a39b6454d81a24c97a3be861a2662cb32bf2c146d11ca10a964e3fce5db8"
    }
  }
}
