{
  "lockfileVersion": 2,
  "subjects": {
    "ch.qrsuisse/mcp-docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.qrsuisse.ch/mcp/docs"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ch.qrsuisse/mcp-docs",
        "title": "QR Suisse documentation",
        "version": "1.0.0",
        "websiteUrl": "https://www.qrsuisse.ch/en/api-documentation/mcp-server",
        "icons": [
          {
            "src": "https://www.qrsuisse.ch/brand/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only documentation of QR Suisse, a Swiss dynamic QR code generator, and of its REST API v1. Use qr_suisse_search_docs to find a page, then qr_suisse_get_page to read it. This server has no access to any account: to act on QR codes, use the QR Suisse API with an API key (see the auth-md page).",
      "tools": [
        {
          "name": "qr_suisse_get_page",
          "title": "Read a QR Suisse documentation page",
          "description": "Returns the full Markdown text of one page of the QR Suisse documentation (English), from a closed list: llms-txt, agents-md, auth-md, pricing-md, or api/<operationId> for an operation of the QR Suisse REST API v1.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "page": {
                "description": "Page identifier, as returned by qr_suisse_search_docs.",
                "enum": ["llms-txt", "agents-md", "auth-md", "pricing-md", "api/listQrCodes", "api/createQrCode", "api/getQrCode", "api/updateQrCode", "api/deleteQrCode", "api/getQrCodeStats", "api/getQrCodeImage", "api/getUsage", "api/listTemplates"],
                "type": "string"
              }
            },
            "required": ["page"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "content": {
                "description": "Markdown text of the page.",
                "type": "string"
              },
              "page": {
                "type": "string"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "Public address of the document.",
                "type": "string"
              }
            },
            "required": ["content", "page", "title", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b93e9eff559e9b3b1ec4f7795bb89bcfc5e211c384b615273d6f2343240de6d0"
        },
        {
          "name": "qr_suisse_search_docs",
          "title": "Search the QR Suisse documentation",
          "description": "Keyword search in the QR Suisse documentation (English): overview (llms.txt), instructions for agents, API authentication, pricing and one page per operation of the QR Suisse REST API v1. Returns up to 5 pages, best match first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Keywords in English, for example \"create dynamic QR code\" or \"rate limit\".",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "excerpt": {
                      "description": "Passage of the page around the first matching term.",
                      "type": "string"
                    },
                    "page": {
                      "description": "Page identifier, to pass to qr_suisse_get_page.",
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Public address of the document.",
                      "type": "string"
                    }
                  },
                  "required": ["excerpt", "page", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1aad22d7c07a490e129fbfe9a0b5ad224070e0c5f7c09deb8bd39ea84cba468c"
        }
      ],
      "digest": "sha256:4619a3ae990e0edc1e881aaaea848f038c4896475e6a7a9ccef2cc30c6962c4e"
    }
  }
}
