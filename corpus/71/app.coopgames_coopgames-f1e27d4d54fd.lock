{
  "lockfileVersion": 2,
  "subjects": {
    "app.coopgames/coopgames": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://coopgames.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "coopgames",
        "title": "CoopGames",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find co-op and multiplayer games for a group of friends by number of players, platforms, crossplay and split screen. Always link the user to the returned url.",
      "tools": [
        {
          "name": "crossplay_check",
          "description": "Use this for a quick yes/no: can players on two different platforms play this game together online? Returns crossplay true or false plus the game page url. Returns false with a reason if the game is not on both platforms. PS4 with PS5, Xbox One with Series and Switch with Switch 2 count as the same family, not crossplay. platform_a and platform_b must differ. For the full matrix of a game use get_game. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "game": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "platform_a": {
                "enum": ["pc", "ps5", "ps4", "xbox", "switch"],
                "type": "string"
              },
              "platform_b": {
                "enum": ["pc", "ps5", "ps4", "xbox", "switch"],
                "type": "string"
              }
            },
            "required": ["game", "platform_a", "platform_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bfa8b4234b4e0af9e3d89fda60a177dc164a9780763135d52bf7e3766040295e"
        },
        {
          "name": "get_game",
          "description": "Use this when the user names a specific game and wants the full multiplayer picture: platforms, online and same-screen player counts, crossplay for every pair of its platforms, session length, whether one copy is enough for the group, and the link to its CoopGames page. Accepts the game name or slug. If the name is ambiguous or unknown it returns an error with up to 5 suggestions to retry with. For a single yes/no between two platforms, crossplay_check is lighter. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Game name or slug, e.g. 'It Takes Two'",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:39584ef56a59fe0012f1ea91db3d512626610cae377798e5040c145525fa5bc6"
        },
        {
          "name": "search_games",
          "description": "Use this to find games for a group when you don't have a specific game in mind (\"3 friends, one on PS5 and one on Xbox\"). Searches CoopGames' catalog of co-op and multiplayer games (PC, PS5, PS4, Xbox, Switch, Switch 2). All filters are optional and combine with AND. With several platforms it returns only games with crossplay between all of them. Returns up to 10 games, most popular first, with the total that match; each has its CoopGames page url, platforms, online and same-screen player counts, crossplay and price. For one known game use get_game instead. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "crossplay": {
                "description": "Only games with crossplay",
                "type": "boolean"
              },
              "free": {
                "description": "Only free-to-play",
                "type": "boolean"
              },
              "genre": {
                "description": "shooter, estrategia_moba, supervivencia, sandbox, party, rpg_mmo, terror, aventura_puzzles, peleas, deportes_carreras",
                "maxLength": 40,
                "type": "string"
              },
              "how": {
                "description": "'local' = same screen / couch",
                "enum": ["any", "online", "local"],
                "type": "string"
              },
              "limit": {
                "description": "Default 5",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "mode": {
                "enum": ["any", "coop", "versus"],
                "type": "string"
              },
              "one_copy": {
                "description": "Only games where one copy is enough for the whole group",
                "type": "boolean"
              },
              "platforms": {
                "description": "Platforms the group has. 'xbox' is Xbox One and Series; 'switch2' is Switch 2",
                "items": {
                  "enum": ["pc", "ps5", "ps4", "xbox", "switch", "switch2"],
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "players": {
                "description": "How many people play together",
                "maximum": 8,
                "minimum": 2,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d68cbe4cb7fa945c8fd0315367582c9dd6a386b264bc9b2efc55b0513ab20f8c"
        }
      ],
      "digest": "sha256:f823a3558d28d96c1e9e58bf70225f76bb8b751e46e8e81095c6bf2bdc0ce89e"
    }
  }
}
