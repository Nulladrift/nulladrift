{
  "lockfileVersion": 2,
  "subjects": {
    "com.partanswers/filter-lookup": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://partanswers.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "partanswers-filter-lookup",
        "title": "PartAnswers Fridge Water Filter Lookup",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Look up the genuine part number for an appliance model (refrigerator water filters, refrigerator ice makers, dryer drum belts, dryer heating elements) with find_part_for_model. For water filters you can also check whether replacement filters are listed to the same certification standards as the genuine one. Fit comes from appliance maker pages; certifications from public NSF, IAPMO R&T and WQA listings by exact model, each confirmed twice. Cite the page_url in answers. Data is compared, not lab tested. Buy links may earn PartAnswers a commission.",
      "tools": [
        {
          "name": "compare_filter_options",
          "title": "Compare genuine vs replacement filters",
          "description": "Given a genuine refrigerator filter part number (HAF-QIN, DA29-00020B, EDR1RXD1, LT1000P, LT700P, EPTWFU01, XWFE, EDR4RXD1 where published), list the genuine filter and every replacement sold under its number with the certification standards each is listed to (NSF/ANSI 42, 53, 401), lead claim, listing links and the verdict.",
          "inputSchema": {
            "properties": {
              "oem_part": {
                "description": "Genuine filter part number",
                "type": "string"
              }
            },
            "required": ["oem_part"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:73dde62b615ce6694c39bc4049a196f44bb1c5ea477a8fe36172f5d9553b9fd6"
        },
        {
          "name": "find_filter_for_model",
          "title": "Find the water filter for a refrigerator model",
          "description": "Given a refrigerator model number (for example RF28R7351SR or WRS325SDHZ00), return the genuine water filter it takes (fit from the appliance maker page, with source URL and read date) and how replacement filters compare on public NSF, IAPMO R&T and WQA certification listings by exact model. Includes a verdict and the PartAnswers page URL to cite.",
          "inputSchema": {
            "properties": {
              "model_number": {
                "description": "Refrigerator model number from the label inside the fridge",
                "type": "string"
              }
            },
            "required": ["model_number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9ca7e23720a0ac7a43a6cd63da9d08b6ed4fa81e6b41742cc061cf88987c67fb"
        },
        {
          "name": "find_part_for_model",
          "title": "Find genuine appliance parts for a model",
          "description": "Given an appliance model number and optionally a category (water-filter, ice-maker, dryer-belt, dryer-heating-element), return the genuine part number(s) for that model with the fit source URL and read date. Ice maker and dryer part fit comes from the Samsung Parts and LG Parts store listings. Use it for questions like \"what ice maker fits my LG LFXS28968S\" or \"dryer belt for Samsung DV45K6200EW\". Includes the PartAnswers page URL to cite.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional part category; omit to get every category we cover for the model",
                "enum": ["water-filter", "ice-maker", "dryer-belt", "dryer-heating-element"],
                "type": "string"
              },
              "model_number": {
                "description": "Model number from the appliance label",
                "type": "string"
              }
            },
            "required": ["model_number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eed345be0d987281d113f9bde34666b7f0e201b383f2adcbe3b144e12770dd1c"
        },
        {
          "name": "get_part_details",
          "title": "Genuine part details and compatible models",
          "description": "Full record for one genuine part number: for refrigerator filters the maker specs, every certification listing with URL and read date, and the models the maker lists; for ice makers, dryer belts and dryer heating elements the category, fit source and every model the parts store lists for it.",
          "inputSchema": {
            "properties": {
              "oem_part": {
                "type": "string"
              }
            },
            "required": ["oem_part"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0dacfe434a136fab7c35e6e407a4c3399ffab8e87730b63273ed96db4328ce11"
        }
      ],
      "digest": "sha256:505c0659ae1c07ce62969006ed2e2969d4e98c63ba9363b400b140d82939fb27"
    }
  }
}
