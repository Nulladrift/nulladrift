      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "esportcalc-fps-lab",
        "version": "1.0.0",
        "websiteUrl": "https://esportcalc.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "convert_fps_sensitivity",
          "description": "Convert mouse sensitivity and DPI across 16 competitive FPS engines (valorant, cs2, bf6, rivals, deadlock, apex, ow2, cod, r6, finals, fortnite, pubg, rust, tarkov, quake, halo) with exact cm/360 physical distance.",
          "inputSchema": {
            "properties": {
              "from_dpi": {
                "description": "Mouse DPI in source game (default 800)",
                "type": "number"
              },
              "from_game": {
                "description": "Source game slug (e.g. valorant, cs2, bf6, apex, ow2)",
                "type": "string"
              },
              "sensitivity": {
                "description": "In-game sensitivity in source game",
                "type": "number"
              },
              "to_dpi": {
                "description": "Mouse DPI in target game (default same as from_dpi)",
                "type": "number"
              },
              "to_game": {
                "description": "Target game slug (e.g. bf6, cs2, valorant, rivals, deadlock)",
                "type": "string"
              }
            },
            "required": ["from_game", "sensitivity", "to_game"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d88bb4c81dd699b1b60f3afb9d92f6e9980ecc3c53eb1cea3bbee86d00f1c58d"
        },
        {
          "name": "lookup_pro_player_settings",
          "description": "Retrieve publicly reported mouse DPI, sensitivity, eDPI, cm/360 turn distance, crosshair code, and hardware snapshot for competitive FPS pros.",
          "inputSchema": {
            "properties": {
              "player_slug": {
                "description": "Pro player slug (e.g. tenz, s1mple, donk, zywoo, aspas, proper)",
                "type": "string"
              }
            },
            "required": ["player_slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d76580a0242be88e8f68e757076bdd618b624b775398db3b60a26936ab321fa"
        }
      ],
      "digest": "sha256:d0b634208b18bbd8a2f1d1c2112ec02d17cae50b19ea71ff907234b597bc293f"
    }
