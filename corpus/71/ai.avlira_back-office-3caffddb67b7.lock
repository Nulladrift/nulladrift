        {
          "name": "commission_calculator",
          "description": "Free commission calculator: what a real-estate agent and brokerage each get from a closed deal, to the cent. Give the sale price and commission percent (or the gross commission in dollars) and optionally the split (like 70/30, agent first), an annual cap, how much of the cap is already paid, a per-deal fee and a referral percent.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cap_cents": {
                "description": "Annual cap on the brokerage's share, in cents (0 or omitted = no cap)",
                "type": "integer"
              },
              "cap_paid_so_far_cents": {
                "description": "Brokerage share already paid toward the cap this year, in cents",
                "type": "integer"
              },
              "commission_pct": {
                "description": "Total commission as a percent of the price, e.g. 3",
                "type": "number"
              },
              "gci": {
                "description": "Gross commission income in dollars (instead of sale_price + commission_pct)",
                "type": "number"
              },
              "per_deal_fee": {
                "description": "Flat fee the brokerage charges per deal, in cents",
                "type": "integer"
              },
              "referral_pct": {
                "description": "Referral fee paid out of the gross commission, as a percent",
                "type": "number"
              },
              "sale_price": {
                "description": "Sale price in dollars",
                "type": "number"
              },
              "split": {
                "description": "Agent/brokerage split such as 70/30 (agent first). Default 100/0",
                "type": "string"
              }
