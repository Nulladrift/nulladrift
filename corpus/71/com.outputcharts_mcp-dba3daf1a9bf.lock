o 6 items, each { below or atLeast, status }; the first match wins. A text column may have hrefKey, a row key whose value (an http or https URL, null or empty) links the cell. Example: {\"columns\":[{\"key\":\"name\",\"label\":\"Name\",\"align\":\"left\",\"format\":\"text\"},{\"key\":\"amount\",\"label\":\"Amount\",\"align\":\"right\",\"format\":\"number\"}],\"data\":[{\"name\":\"Acme\",\"amount\":10}]}\n- markdown: The only key is source, a string of at most 20000 characters. Example: {\"source\":\"## Notes\\n\\n- Pipeline is up\\n- See [status](https://example.com)\"}\n- scatter: xKey and yKey values are numbers. labelKey is optional and its values are strings. Each row's keys are exactly xKey, yKey, and labelKey when labelKey is present. At most 500 points. Example: {\"xKey\":\"price\",\"yKey\":\"units\",\"labelKey\":\"label\",\"data\":[{\"price\":10,\"units\":3,\"label\":\"A\"}]}\n- funnel: Each row's keys are exactly nameKey and valueKey. Names are strings. Values are numbers greater than or equal to 0. data may be empty or have at most 12 stages. Keep array order. Example: {\"nameKey\":\"stage\",\"valueKey\":\"count\",\"data\":[{\"stage\":\"Visit\",\"count\":1000},{\"stage\":\"Signup\",\"count\":400},{\"stage\":\"Paid\",\"count\":80}]}\n- gauge: label is a string. value, min, and max are numbers with min less than max. suffix is an optional string. No other keys. Example: {\"label\":\"Utilization\",\"value\":72,\"min\":0,\"max\":100,\"suffix\":\"%\"}\n- map: region is world, us-states or us-counties. idKey and valueKey name the row fields; labelKey is optional. format is number (default), compact or percent; prefix and suffix are optional strings. Each data row's keys are exactly idKey, valueKey and labelKey when set. The idKey value is a region code: for world an ISO 3166-1 alpha-2 code such as DE (alpha-3 accepted), for us-states a USPS code such as CA (two-digit FIPS accepted), for us-counties a five-digit county FIPS code such as 06037 (the 2017 county lines, leading zero kept); case is ignored. At most one row per region; a code with no shape on the map (Puerto Rico and the territories on us-states; territories drawn as part of their country on world; Connecticut's planning regions and Alaska's Chugach and Copper River on us-counties) is refused with the region's name. valueKey values are numbers. Example: {\"region\":\"world\",\"idKey\":\"country\",\"valueKey\":\"signups\",\"format\":\"number\",\"data\":[{\"country\":\"US\",\"signups\":412},{\"country\":\"GB\",\"signups\":138},{\"country\":\"DE\",\"signups\":96},{\"country\":\"IN\",\"signups\":87},{\"country\":\"CA\",\"signups\":64},{\"country\":\"BR\",\"signups\":41},{\"country\":\"AU\",\"signups\":33},{\"country\":\"JP\",\"signups\":19}]}",
