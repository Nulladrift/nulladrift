      "serverInfo": {
        "name": "output-charts",
        "version": "1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You are connected without an API key. Every tool is listed, but only signup and describe_visual_types run without a key; the others answer invalid_api_key until you reconnect with one. Call signup with the person's email address to create their Output Charts account and get a key, then reconnect: scripts and IDE agents send Authorization: Bearer <key>; chat apps add a new connector at the mcpUrl in the result.",
      "tools": [
        {
          "name": "append_rows",
          "title": "Append rows",
          "description": "Add rows to the end of the visual's data and drop the oldest past keepLast; the visual's settings are unchanged. Adds rows to a line, area, bar, bar-horizontal, scatter, table or map visual; its settings (xKey, series, columns) are unchanged, and numeric strings are coerced as on push. On a map the rows merge by region: a row whose code matches an existing one replaces it, the others are added, and keepLast is ignored. A kpi, gauge, pie, funnel or markdown visual has no row list: replace its document with PUT /v1/visuals/{id}/data instead. Over HTTP keepLast may also go in the query string (?keepLast=7), and the body may be text/csv: the header row is the keys the visual's rows have. Needs an API key: with none yet, call signup first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "keepLast": {
                "description": "Keep only the newest keepLast rows after the append, dropping the oldest. The type's cap applies in any case: line 500, area 500, bar 500, bar-horizontal 500, scatter 500, table 200, map 4000 rows.",
                "minimum": 1,
                "type": "integer"
              },
              "rows": {
                "description": "Added after the rows the visual holds, in order.",
                "items": {
                  "description": "One data row, with the keys the visual's rows have: the xKey and the series keys, or the column keys.",
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "visualId": {
                "description": "The visual's id.",
                "format": "uuid",
                "type": "string"
              }
            },
            "required": ["rows", "visualId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e95459d8605c9e5f22462904e84182445d4c121ebadeee57744dfc656587ba3f"
        },
        {
          "name": "batch_update",
          "title": "Batch update",
          "description": "Replace the documents of several visuals at once, keyed by each visual's ref. Needs an API key: with none yet, call signup first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dashboardId": {
                "description": "The dashboard's id.",
                "format": "uuid",
                "type": "string"
              },
              "data": {
                "additionalProperties": {
                  "description": "The visual's whole JSON document, valid for the visual's type: the rules per type are on create_visual's document and in describe_visual_types; get_visual shows the current one.",
                  "type": "object"
                },
                "description": "The new documents, keyed by the ref of the visual each one replaces, so one call keeps a whole dashboard fresh. Each is read as PUT /v1/visuals/{id}/data reads it (whole document, numeric strings coerced). Every entry is tried in the order sent: 200 when all were written, 422 batch_failed with the same results when any was not.",
                "minProperties": 1,
                "propertyNames": {
                  "pattern": "^[a-z0-9-]{1,64}$"
                },
                "type": "object"
              }
            },
            "required": ["dashboardId", "data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9002c74573cec2a0f86ea4cf6ec3b149a86a572d84f9bcadb44c71023d072b82"
        },
        {
          "name": "create_api_key",
          "title": "Create api key",
          "description": "Create a narrower key: push only, or bound to one dashboard. Shown once. A Push key bound to one dashboard is the right key for a CI job or a cron that only sends data. Solo owners hold at most five live keys. Needs an API key: with none yet, call signup first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dashboardId": {
                "description": "Bind the key to one of the owner's dashboards: it then reaches only that dashboard's visuals.",
                "format": "uuid",
                "type": "string"
              },
              "name": {
                "default": "Key",
                "description": "Shown on the keys page.",
                "maxLength": 40,
                "type": "string"
              },
              "scope": {
                "default": "push",
                "description": "push: send data and read visuals. manage: everything this key can do.",
                "enum": ["push", "manage"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:fc81a8fae950f6a484a1eb470a0a8657538e7029e5417439899451ec955be9e0"
        },
        {
          "name": "create_dashboard",
          "title": "Create dashboard",
          "description": "Create a dashboard; with a ref already in use, return that dashboard with created false. One call can make a live page: send visuals and publish true, and the answer carries the dashboard's url. A ref already used by one of the owner's dashboards returns that dashboard, unchanged, with created false; its visuals are then created or found by their own refs, so a run cut short is finished by the next one. Needs an API key: with none yet, call signup first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "default": "",
                "maxLength": 500,
                "type": "string"
              },
              "dryRun": {
                "default": false,
                "description": "Check everything and write nothing; answers 200 { dryRun: true } or the error the real call would give.",
                "type": "boolean"
              },
              "publish": {
                "default": false,
                "description": "Make the page public for anyone with the link, as POST /v1/dashboards/{id}/publish would.",
                "type": "boolean"
              },
              "ref": {
                "description": "A slug you choose, 1 to 64 of a-z, 0-9 and -. Unique per owner for dashboards and per dashboard for visuals, and set once. Create with a ref so a later run finds the same object instead of making a duplicate.",
                "pattern": "^[a-z0-9-]{1,64}$",
                "type": "string"
              },
              "scheme": {
                "default": "ink",
                "enum": ["ink", "carbon", "paper", "ledger", "slate", "signal"],
                "type": "string"
              },
              "shareWith": {
                "description": "People who may view the dashboard after signing in with these addresses, each made as POST /v1/dashboards/{id}/shares would and emailed the link: view-only, and the dashboard stays private unless publish is true too.",
                "items": {
                  "format": "email",
                  "maxLength": 128,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "title": {
                "description": "Not blank.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "visuals": {
                "description": "Created in order, each as POST /v1/dashboards/{id}/visuals would, so give every visual a ref when the dashboard has one.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "document": {
                      "description": "The visual's whole JSON document, valid for its type. Rules and an example per type:\n- bar: orientation is vertical. mode is grouped or stacked. Each data row is an object whose keys are exactly the xKey and each series key. Series values are numbers. xKey values are strings. No other keys. series has 1 to 6 items. data has at most 500 rows. Optional references: up to 6 items, each { value, label } for a flat line at a number (a value reference may take axis right when a series is on the right axis) or { at, label } for a marker at a category. A series may have as line (drawn as a line, never stacked); such a series may have dashed true and axis right. Keep at least one bar series. Example: {\"orientation\":\"vertical\",\"mode\":\"grouped\",\"xKey\":\"month\",\"series\":[{\"key\":\"revenue\",\"label\":\"Revenue\"},{\"key\":\"cost\",\"label\":\"Cost\"}],\"data\":[{\"month\":\"Jan\",\"revenue\":120,\"cost\":80},{\"month\":\"Feb\",\"revenue\":140,\"cost\":90}]}\n- bar-horizontal: orientation is horizontal. mode is grouped or stacked. Each data row is an object whose keys are exactly the xKey and each series key. Series values are numbers. xKey values are strings. No other keys. Optional references: up to 6 items, each { value, label } for a flat line at a number or { at, label } for a marker at a category. Example: {\"orientation\":\"horizontal\",\"mode\":\"grouped\",\"xKey\":\"month\",\"series\":[{\"key\":\"revenue\",\"label\":\"Revenue\"},{\"key\":\"cost\",\"label\":\"Cost\"}],\"data\":[{\"month\":\"Jan\",\"revenue\":120,\"cost\":80},{\"month\":\"Feb\",\"revenue\":140,\"cost\":90}]}\n- line: curve is linear, monotone, or step. Each data row is an object whose keys are exactly the xKey and each series key. Series values are numbers. xKey values are strings. No other keys. Optional references: up to 6 items, each { value, label } for a flat line at a number (a value reference may take axis right when a series is on the right axis) or { at, label } for a marker at a category. A series may have dashed true. A series may have axis left or right; keep at least one series on the left. Example: {\"xKey\":\"date\",\"curve\":\"monotone\",\"series\":[{\"key\":\"users\",\"label\":\"Users\"}],\"data\":[{\"date\":\"2026-01\",\"users\":10}]}\n- area: Same row rules as line. stacked is a boolean. Each data row is an object whose keys are exactly the xKey and each series key. Series values are numbers. xKey values are strings. No other keys. Optional references: up to 6 items, each { value, label } for a flat line at a number or { at, label } for a marker at a category. A series may have dashed true. Example: {\"xKey\":\"date\",\"curve\":\"monotone\",\"stacked\":false,\"series\":[{\"key\":\"users\",\"label\":\"Users\"}],\"data\":[{\"date\":\"2026-01\",\"users\":10}]}\n- pie: Each data row is an object whose keys are exactly nameKey and valueKey. nameKey values are strings. valueKey values are numbers greater than or equal to 0. At most 24 slices. donut is a boolean. Example: {\"nameKey\":\"category\",\"valueKey\":\"amount\",\"donut\":true,\"data\":[{\"category\":\"New\",\"amount\":40},{\"category\":\"Returning\",\"amount\":60}]}\n- kpi: label is a string, value is a number, format is number, compact, or percent. Optional prefix, suffix, delta, deltaFormat (number or percent), deltaLabel, and trend (up to 60 numbers, oldest first, in the same unit as value). No other keys. Example: {\"label\":\"MRR\",\"value\":12840,\"format\":\"number\",\"prefix\":\"$\",\"suffix\":\"\",\"delta\":0.12,\"deltaFormat\":\"percent\",\"deltaLabel\":\"vs last month\"}\n- table: columns has 1 to 12 entries with key, label, align left or right, and format text, number, or percent. data has at most 200 rows. Each row's keys are column keys and hrefKey keys. Cell values are strings, numbers, or null. A text column may have statuses, a map from cell text to good, warn, or bad (1 to 20 entries). A number or percent column may have rules: 1 to 6 items, each { below or atLeast, status }; the first match wins. A text column may have hrefKey, a row key whose value (an http or https URL, null or empty) links the cell. Example: {\"columns\":[{\"key\":\"name\",\"label\":\"Name\",\"align\":\"left\",\"format\":\"text\"},{\"key\":\"amount\",\"label\":\"Amount\",\"align\":\"right\",\"format\":\"number\"}],\"data\":[{\"name\":\"Acme\",\"amount\":10}]}\n- markdown: The only key is source, a string of at most 20000 characters. Example: {\"source\":\"## Notes\\n\\n- Pipeline is up\\n- See [status](https://example.com)\"}\n- scatter: xKey and yKey values are numbers. labelKey is optional and its values are strings. Each row's keys are exactly xKey, yKey, and labelKey when labelKey is present. At most 500 points. Example: {\"xKey\":\"price\",\"yKey\":\"units\",\"labelKey\":\"label\",\"data\":[{\"price\":10,\"units\":3,\"label\":\"A\"}]}\n- funnel: Each row's keys are exactly nameKey and valueKey. Names are strings. Values are numbers greater than or equal to 0. data may be empty or have at most 12 stages. Keep array order. Example: {\"nameKey\":\"stage\",\"valueKey\":\"count\",\"data\":[{\"stage\":\"Visit\",\"count\":1000},{\"stage\":\"Signup\",\"count\":400},{\"stage\":\"Paid\",\"count\":80}]}\n- gauge: label is a string. value, min, and max are numbers with min less than max. suffix is an optional string. No other keys. Example: {\"label\":\"Utilization\",\"value\":72,\"min\":0,\"max\":100,\"suffix\":\"%\"}\n- map: region is world, us-states or us-counties. idKey and valueKey name the row fields; labelKey is optional. format is number (default), compact or percent; prefix and suffix are optional strings. Each data row's keys are exactly idKey, valueKey and labelKey when set. The idKey value is a region code: for world an ISO 3166-1 alpha-2 code such as DE (alpha-3 accepted), for us-states a USPS code such as CA (two-digit FIPS accepted), for us-counties a five-digit county FIPS code such as 06037 (the 2017 county lines, leading zero kept); case is ignored. At most one row per region; a code with no shape on the map (Puerto Rico and the territories on us-states; territories drawn as part of their country on world; Connecticut's planning regions and Alaska's Chugach and Copper River on us-counties) is refused with the region's name. valueKey values are numbers. Example: {\"region\":\"world\",\"idKey\":\"country\",\"valueKey\":\"signups\",\"format\":\"number\",\"data\":[{\"country\":\"US\",\"signups\":412},{\"country\":\"GB\",\"signups\":138},{\"country\":\"DE\",\"signups\":96},{\"country\":\"IN\",\"signups\":87},{\"country\":\"CA\",\"signups\":64},{\"country\":\"BR\",\"signups\":41},{\"country\":\"AU\",\"signups\":33},{\"country\":\"JP\",\"signups\":19}]}",
                      "type": "object"
                    },
                    "ref": {
                      "description": "A slug you choose, 1 to 64 of a-z, 0-9 and -. Unique per owner for dashboards and per dashboard for visuals, and set once. Create with a ref so a later run finds the same object instead of making a duplicate.",
                      "pattern": "^[a-z0-9-]{1,64}$",
                      "type": "string"
                    },
                    "size": {
                      "additionalProperties": false,
                      "description": "Defaults to the type's default size. Width and height within the type's limits, which describe_visual_types lists per type with the widths the editor offers.",
                      "properties": {
                        "h": {
                          "description": "Height in 50-pixel rows.",
                          "maximum": 16,
                          "minimum": 3,
                          "type": "integer"
                        },
                        "w": {
                          "description": "Columns out of 12.",
                          "maximum": 12,
                          "minimum": 3,
                          "type": "integer"
                        }
                      },
                      "required": ["h", "w"],
                      "type": "object"
                    },
                    "title": {
                      "default": "Untitled",
                      "maxLength": 120,
                      "type": "string"
                    },
                    "type": {
                      "enum": ["bar", "bar-horizontal", "line", "area", "pie", "kpi", "table", "markdown", "scatter", "funnel", "gauge", "map"],
                      "type": "string"
                    }
                  },
                  "required": ["document", "type"],
                  "type": "object"
                },
                "maxItems": 24,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ab624cc5f01f4db00f7baee9d6f11136da7c725e0c340dca6827fe2370ebaed4"
        },
