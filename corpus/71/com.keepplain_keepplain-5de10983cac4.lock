        {
          "name": "search_coding_agent_sessions",
          "title": "Search coding agent sessions on KeepPlain",
          "description": "KeepPlain library: find published sessions where developers did a similar task with a coding agent. Use before a non-trivial task on a known stack, or when the user asks how others did something; skip small edits and questions about this repository. Returns up to 5 cards with the outcome, how long it took and how often the human had to step in. Query: the task in a few words, e.g. \"migrate queues to horizon\". An empty result means nobody has published such a session yet.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Optional. Only sessions of this coding agent.",
                "enum": ["claude-code", "codex", "cursor", "copilot", "gemini-cli", "windsurf", "aider", "pi", "antigravity", "opencode", "junie", "cline", "kilo", "qwen-code", "vibe", "droid", "goose", "crush", "grok", "hermes", "other"],
                "type": "string"
              },
              "limit": {
                "description": "How many sessions, 1 to 5. Default 3.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "project": {
                "description": "Optional, your team's sessions only: those of one project, by the name the team's lists show (usually the repository's folder).",
                "type": "string"
              },
              "query": {
                "description": "The task in a few words, e.g. \"migrate queues to horizon\". No code, file paths, repository or company names.",
                "type": "string"
              },
              "space": {
                "description": "Optional. \"all\" (default): the user's own unpublished sessions first (two at most), then their team's, if the token belongs to a team, then the community's. \"mine\", \"team\" or \"community\": only those.",
                "enum": ["all", "mine", "team", "community"],
                "type": "string"
              },
              "stack": {
                "description": "Optional. The stack, e.g. \"laravel\" or \"nextjs, prisma\" (up to 5, comma-separated).",
                "type": "string"
              },
              "task": {
                "description": "Optional, your team's sessions only: those of one task, by its title or task number (list_team_tasks shows them).",
                "type": "string"
              },
              "task_type": {
                "description": "Optional. The kind of task.",
                "enum": ["greenfield", "feature", "refactor", "migration", "debug", "tests", "infra", "docs"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "description": "Set when nothing was found.",
                "type": "string"
              },
              "notice": {
