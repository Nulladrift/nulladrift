        {
          "name": "seat_availability",
          "title": "Seat availability",
          "description": "Use to see which seats are open right now on one flight (needs a signed-in SlickTrip account; nothing is charged or changed): open seat numbers by row, counts of window, aisle, middle and exit-row seats, and rows with two seats together. Needs the flight number, route and date. Then track_seats to be told when a seat opens. Not for prices.",
          "inputSchema": {
            "properties": {
              "cabin": {
                "default": "economy",
                "description": "Cabin to look at; any = every cabin on the flight.",
                "enum": ["economy", "premium_economy", "business", "first", "any"],
                "title": "Cabin",
                "type": "string"
              },
              "currency": {
                "anyOf": [
                  {
                    "enum": ["USD", "CAD", "EUR", "GBP", "ILS"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The currency the traveler wants prices in: USD, CAD, EUR, GBP or ILS. Send it when the traveler names a currency or says where they live (euros for someone in Spain). Empty answers in US dollars, or in the currency the traveler picked on SlickTrip. Amounts you send in (max_price_usd, target_price_usd, a price per night) stay US dollars.",
                "title": "Currency"
              },
              "depart_date": {
                "description": "YYYY-MM-DD.",
                "examples": ["2026-11-03"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "title": "Depart Date",
                "type": "string"
              },
              "destination": {
                "description": "A 3-letter airport code (JFK), or a city code that searches every airport in the city (SlickTrip's 4-letter codes: NYCA New York, LOND London, ROME Rome, TYOA Tokyo). Up to 3 places joined with _ search them together (JFK_EWR). A place name works when one place clearly matches; otherwise the result is an unknown_place error listing suggestions. When the traveler names a city rather than an airport, send the city (its name or code), not one of its airports: one airport can miss the cheapest or the only flights. Unsure of the code: call find_places.",
                "examples": ["JFK", "NYCA", "JFK_EWR"],
                "maxLength": 40,
                "minLength": 3,
                "title": "Destination",
                "type": "string"
              },
              "flight_number": {
                "description": "Airline code and number, no space.",
                "examples": ["UA254", "BA182"],
                "pattern": "^[A-Za-z0-9]{2}\\s?\\d{1,4}[A-Za-z]?$",
                "title": "Flight Number",
                "type": "string"
              },
              "origin": {
                "description": "A 3-letter airport code (JFK), or a city code that searches every airport in the city (SlickTrip's 4-letter codes: NYCA New York, LOND London, ROME Rome, TYOA Tokyo). Up to 3 places joined with _ search them together (JFK_EWR). A place name works when one place clearly matches; otherwise the result is an unknown_place error listing suggestions. When the traveler names a city rather than an airport, send the city (its name or code), not one of its airports: one airport can miss the cheapest or the only flights. Unsure of the code: call find_places.",
                "examples": ["JFK", "NYCA", "JFK_EWR"],
                "maxLength": 40,
                "minLength": 3,
                "title": "Origin",
                "type": "string"
              },
              "user_request": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional, and it works in the traveler's favor. Quote the traveler's latest message about this trip exactly as they wrote it, in their wording, language and spelling, not a summary. SlickTrip runs its own travel parser on these words: when a search fails or comes back empty, it compares what the traveler said with the arguments sent and returns a corrected search, so you can fix it without asking them again. It has caught Cancun sent as MEX instead of CUN, and travelers dropped from the party. A summary loses exactly the details it checks. If the message only answers a question (\"yes, the 20th\"), quote the message where they asked for the trip. Send the same quote on every call for this request. Leave out anything not about the trip, and never include names, contact details, or payment or ID information. The words also help SlickTrip improve its search.",
                "examples": ["we're 6 friends from madrid, want somewhere cheap and fun in europe dec 20-24, morning flights pls", "necesito llevar a mi mamá de Calgary a Kolkata a fines de octubre, no puede hacer escala en Estados Unidos"],
                "title": "User Request"
              }
            },
            "required": ["depart_date", "destination", "flight_number", "origin"],
            "title": "seat_availabilityArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "available_seats": {
                "description": "Items: seat, kind, exit_row (up to 80)",
                "type": ["array", "null"]
              },
              "cabin": {
                "description": "Cabin tier queried",
                "type": ["string", "null"]
              },
              "code": {
                "description": "On an error: a machine-readable kind, e.g. unknown_place",
                "type": ["string", "null"]
              },
              "counts": {
                "description": "seats, available, window, aisle, middle, exit_row, rows_with_2_together",
                "type": ["object", "null"]
              },
              "exit_rows": {
                "description": "Row numbers with exit-row seats",
                "type": ["array", "null"]
              },
              "field": {
                "description": "On unknown_place: which argument (origin, destination, ...)",
                "type": ["string", "null"]
              },
              "flight": {
                "description": "flight_number, origin, destination, departure_time, arrival_time, aircraft, airline",
                "type": ["object", "null"]
              },
              "message": {
                "description": "No seat map explanation or wrapper error",
                "type": ["string", "null"]
              },
              "note": {
                "description": "Use track_seats to be alerted",
                "type": ["string", "null"]
              },
              "open_seat_ids": {
                "description": "Every open seat id in the cabin, space-separated",
                "type": ["string", "null"]
              },
              "places_assumed": {
                "description": "Place names this call resolved on its own, e.g. 'Portland = Portland, OR (PDX)'; tell the traveler",
                "type": ["array", "null"]
              },
              "seat_kinds": {
                "description": "Seat letter to window | aisle | middle",
                "type": ["object", "null"]
              },
              "seat_map_svg": {
                "description": "url, view_box, aircraft, seats[] with x/y/w/h/status/kind",
                "type": ["object", "null"]
              },
              "seat_map_url": {
                "description": "slicktrip.com seat-tracker setup page link",
                "type": ["string", "null"]
              },
              "seat_tracker_url": {
                "description": "slicktrip.com seat-tracker route link",
                "type": ["string", "null"]
              },
              "status": {
                "description": "ok | no_data | error | sign_in_required",
                "type": ["string", "null"]
              },
              "suggestions": {
                "description": "On unknown_place: places to offer the traveler, each with code, name, kind (airport, all airports in the city, nearby airport), city, country",
                "type": ["array", "null"]
              },
              "taken_seat_ids": {
                "description": "Every taken seat id in the cabin, space-separated",
                "type": ["string", "null"]
              }
            },
            "type": "object"
          },
