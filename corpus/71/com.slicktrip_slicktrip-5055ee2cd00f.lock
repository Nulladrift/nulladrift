                "description": "The currency the traveler wants prices in: USD, CAD, EUR, GBP or ILS. Send it when the traveler names a currency or says where they live (euros for someone in Spain). Empty answers in US dollars, or in the currency the traveler picked on SlickTrip. Amounts you send in (max_price_usd, target_price_usd, a price per night) stay US dollars.",
