        {
          "name": "track_flight",
          "title": "Track a flight's price",
          "description": "Use to start price alerts on an itinerary from a search, after the traveler confirms (asking for alerts is confirming). One way: any itinerary_id from search_flights. Round trip: an outbound itinerary_id from search_flights watches that outbound with its cheapest return; a complete itinerary_id from search_return_flights tracks that exact pairing. Multi-city: a complete itinerary_id. Alerts go to the account's channels on a new low; alert_rule any hears every move; target_price_usd sets a bar.",
          "inputSchema": {
            "properties": {
              "alert_rule": {
                "anyOf": [
                  {
                    "enum": ["lowest", "any", "none"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "When to alert: lowest = only a new low, any = every price move, none = off. Leave empty for the default, or give target_price_usd instead.",
                "title": "Alert Rule"
              },
              "currency": {
                "anyOf": [
                  {
                    "enum": ["USD", "CAD", "EUR", "GBP", "ILS"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The currency the traveler wants prices in: USD, CAD, EUR, GBP or ILS. Send it when the traveler names a currency or says where they live (euros for someone in Spain). Empty answers in US dollars, or in the currency the traveler picked on SlickTrip. Amounts you send in (max_price_usd, target_price_usd, a price per night) stay US dollars.",
                "title": "Currency"
              },
              "email": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Send alerts by email. Empty keeps the account's setting.",
                "title": "Email"
              },
              "itinerary_id": {
                "description": "From search_flights (one way) or search_return_flights (a complete round trip or multi-city).",
                "title": "Itinerary Id",
                "type": "string"
              },
              "target_price_usd": {
                "anyOf": [
                  {
                    "maximum": 1000000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Alert when the price goes under this, USD. Replaces alert_rule. It is the TOTAL: the whole trip for all travelers on a flight, the whole stay on a hotel.",
                "title": "Target Price Usd"
              },
              "text": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Send alerts by text message. Needs a verified phone on the SlickTrip account; empty keeps the account's setting.",
                "title": "Text"
              }
            },
            "required": ["itinerary_id"],
            "title": "track_flightArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "alerts": {
                "description": "Plain-words description of what alerts fire",
                "type": ["string", "null"]
              },
              "alerts_when": {
                "description": "When alerts fire, from the alert preference",
                "type": ["string", "null"]
              },
              "channels": {
                "description": "{email: boolean, text: boolean} stored alert channels",
                "type": ["object", "null"]
              },
              "code": {
                "description": "On an error: a machine-readable kind, e.g. unknown_place",
                "type": ["string", "null"]
              },
              "fid": {
                "description": "Tracked itinerary id (flight numbers)",
                "type": ["string", "null"]
              },
              "field": {
                "description": "On unknown_place: which argument (origin, destination, ...)",
                "type": ["string", "null"]
              },
              "message": {
                "description": "Error or sign-in message from the server wrapper",
                "type": ["string", "null"]
              },
              "note": {
                "description": "Note about text alerts needing a verified phone",
                "type": ["string", "null"]
              },
              "outbound_fid": {
                "description": "Outbound watch only: the outbound fid",
                "type": ["string", "null"]
              },
              "places_assumed": {
                "description": "Place names this call resolved on its own, e.g. 'Portland = Portland, OR (PDX)'; tell the traveler",
                "type": ["array", "null"]
              },
              "price_at_save": {
                "description": "Price recorded when tracking started",
                "type": ["number", "null"]
              },
              "route": {
                "description": "Route dict: origin, destination, cabin, travelers, dates, trip_type (+names on outbound watch)",
                "type": ["object", "null"]
              },
              "saved_url": {
                "description": "slicktrip.com saved-flights page link",
                "type": ["string", "null"]
              },
              "search_key": {
                "description": "The tracked route's search key",
                "type": ["string", "null"]
              },
              "status": {
                "description": "tracking | error | sign_in_required",
                "type": ["string", "null"]
              },
              "suggestions": {
                "description": "On unknown_place: places to offer the traveler, each with code, name, kind (airport, all airports in the city, nearby airport), city, country",
                "type": ["array", "null"]
              },
              "text_not_enabled": {
                "description": "Text asked but no verified phone on account",
                "type": ["string", "null"]
