                "description": "Only destinations in this country or region, as the traveler said it.",
                "examples": ["Brazil", "Europe", "Caribbean", "Italy"],
                "title": "Country Or Region"
              },
              "currency": {
                "anyOf": [
                  {
                    "enum": ["USD", "CAD", "EUR", "GBP", "ILS"],
                    "type": "string"
