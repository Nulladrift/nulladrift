        {
          "name": "price_calendar",
          "title": "Price calendar",
          "description": "Use price_calendar only for a traveler who is flexible within a period they named (for example \"sometime in March\", \"any weekend in December\", \"this winter\"), has told you how many nights they want to stay, and wants to know which days are cheapest.\n\nIt shows the cheapest fare for each departure day, across about two months starting with the month you give. With max_stops=0 it also shows which days have a nonstop flight, for a traveler who is flexible within a period they named and wants a nonstop.\n\nEvery price in the calendar is for one exact trip: a set number of nights away, one cabin, one number of travelers, and one set of stops, airlines and times. If any of these is guessed, every price in the calendar is for a trip the traveler will not take.\n\nBefore you call it, you need from the traveler: the month or period, and for a round trip the number of nights they want to stay. Also pass any preferences the traveler gave you: nonstop or not, airlines, times of day, cabin, and number of travelers. If the traveler has not told you the period, or for a round trip the number of nights, ask them in one question. Do not choose a month for the traveler. Do not choose a trip length for the traveler.\n\nDo not call this tool when the traveler has given you dates. Search those dates with search_flights instead. Do not call this tool when the traveler has given no dates at all. Ask them when they want to go instead, and offer a bucket list alert with add_flight_bucket_list, which watches the route for them.\n\nCall it once, or twice at most, per answer. Then show the traveler the two or three cheapest days. The answer tells you how to close: one question that offers flights for the day they pick, or a bucket list alert that watches the whole period.",
          "inputSchema": {
            "properties": {
              "airlines": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 3,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Up to 3 carriers as IATA codes, or one alliance: star alliance, oneworld, skyteam.",
                "examples": [
                  ["UA", "LH"],
                  ["oneworld"]
                ],
                "title": "Airlines"
              },
              "arrive_after": {
                "anyOf": [
                  {
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HH:MM, local time at that airport.",
                "examples": ["06:00", "21:30"],
                "title": "Arrive After"
              },
              "arrive_before": {
                "anyOf": [
                  {
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HH:MM, local time at that airport.",
                "examples": ["06:00", "21:30"],
                "title": "Arrive Before"
              },
              "cabin": {
                "default": "economy",
                "description": "Cabin class.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "title": "Cabin",
                "type": "string"
              },
              "carry_on_bags": {
                "anyOf": [
                  {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Carry-on bags per traveler (0-1). Prices then include the bag fees: search_flights shows them as price_with_bags next to the fare; a calendar or bucket list prices every day with them.",
                "title": "Carry On Bags"
              },
              "checked_bags": {
                "anyOf": [
                  {
                    "maximum": 2,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Checked bags per traveler (0-2), priced only for flights within the US and Canada (elsewhere the answer says the prices do not include them). Prices then include the bag fees: search_flights shows them as price_with_bags next to the fare; a calendar or bucket list prices every day with them.",
                "title": "Checked Bags"
              },
              "connecting_airports": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only itineraries that change planes at these airports (codes or city codes), nonstops included: for 'US connections only' name the hubs.",
                "examples": [
                  ["MIA", "ATL", "IAH"]
                ],
                "title": "Connecting Airports"
              },
              "currency": {
                "anyOf": [
                  {
                    "enum": ["USD", "CAD", "EUR", "GBP", "ILS"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The currency the traveler wants prices in: USD, CAD, EUR, GBP or ILS. Send it when the traveler names a currency or says where they live (euros for someone in Spain). Empty answers in US dollars, or in the currency the traveler picked on SlickTrip. Amounts you send in (max_price_usd, target_price_usd, a price per night) stay US dollars.",
                "title": "Currency"
              },
              "depart_after": {
                "anyOf": [
                  {
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HH:MM, local time at that airport.",
                "examples": ["06:00", "21:30"],
                "title": "Depart After"
              },
              "depart_before": {
                "anyOf": [
                  {
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HH:MM, local time at that airport.",
                "examples": ["06:00", "21:30"],
                "title": "Depart Before"
              },
              "depart_from": {
                "anyOf": [
                  {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "YYYY-MM-DD, with depart_to: only departures in the traveler's own window (\"any day before Christmas\" is December 1 to 24; \"mid-March through April\" is March 15 to April 30). It can run to the end of the month after depart_from.",
                "title": "Depart From"
              },
              "depart_to": {
                "anyOf": [
                  {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "YYYY-MM-DD, the last day the traveler could leave.",
                "title": "Depart To"
              },
              "destination": {
                "description": "A 3-letter airport code (JFK), or a city code that searches every airport in the city (SlickTrip's 4-letter codes: NYCA New York, LOND London, ROME Rome, TYOA Tokyo). Up to 3 places joined with _ search them together (JFK_EWR). A place name works when one place clearly matches; otherwise the result is an unknown_place error listing suggestions. When the traveler names a city rather than an airport, send the city (its name or code), not one of its airports: one airport can miss the cheapest or the only flights. Unsure of the code: call find_places.",
                "examples": ["JFK", "NYCA", "JFK_EWR"],
                "maxLength": 40,
                "minLength": 3,
                "title": "Destination",
                "type": "string"
              },
              "exclude_airlines": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Leave out itineraries with any flight sold by these carriers (IATA codes, names or an alliance), by flight number or airline name: for 'not Gol' or 'avoid Air India'.",
                "examples": [
                  ["G3"],
                  ["Gulf Air", "Air India"]
                ],
                "title": "Exclude Airlines"
              },
              "exclude_connecting_airports": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Leave out itineraries that change planes at these airports (codes or city codes).",
                "examples": [
                  ["DOH"],
                  ["LOND"]
                ],
                "title": "Exclude Connecting Airports"
              },
              "lap_infants": {
                "default": 0,
                "description": "Babies under 2 who will sit on an adult's lap (no seat of their own). Not counted in travelers and not in the quoted fare; the answer says how airlines charge them.",
                "maximum": 9,
                "minimum": 0,
                "title": "Lap Infants",
                "type": "integer"
              },
              "lower_emissions": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only itineraries with lower emissions than is typical for the route.",
                "title": "Lower Emissions"
              },
              "max_duration_hours": {
                "anyOf": [
                  {
                    "maximum": 96,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longest itinerary to show, in hours.",
                "title": "Max Duration Hours"
              },
              "max_layover_hours": {
                "anyOf": [
                  {
                    "maximum": 26,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longest layover allowed at every connection, in hours (half hours allowed): for 'layovers no longer than 5 hours'.",
                "title": "Max Layover Hours"
              },
              "max_stops": {
                "default": 2,
                "description": "Most stops allowed: 0 nonstop, 1, or 2 (2 or more: any number).",
                "maximum": 9,
                "minimum": 0,
                "title": "Max Stops",
                "type": "integer"
              },
              "min_layover_hours": {
                "anyOf": [
                  {
                    "maximum": 26,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shortest layover allowed at every connection, in hours (half hours allowed): for 'at least 2 hours to connect'.",
                "title": "Min Layover Hours"
              },
              "month": {
                "anyOf": [
                  {
                    "pattern": "^\\d{4}-\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The month the traveler named, as YYYY-MM. Leave it empty only when the traveler asked about the next few weeks. Do not choose a month for the traveler.",
                "examples": ["2026-11"],
                "title": "Month"
              },
              "origin": {
                "description": "A 3-letter airport code (JFK), or a city code that searches every airport in the city (SlickTrip's 4-letter codes: NYCA New York, LOND London, ROME Rome, TYOA Tokyo). Up to 3 places joined with _ search them together (JFK_EWR). A place name works when one place clearly matches; otherwise the result is an unknown_place error listing suggestions. When the traveler names a city rather than an airport, send the city (its name or code), not one of its airports: one airport can miss the cheapest or the only flights. Unsure of the code: call find_places.",
                "examples": ["JFK", "NYCA", "JFK_EWR"],
                "maxLength": 40,
                "minLength": 3,
                "title": "Origin",
                "type": "string"
              },
              "travelers": {
                "default": 1,
                "description": "Travelers who need a seat (adults and children). Fares are quoted for all of them together; one booking holds up to 9 (a larger group gets a suggested split). A baby under 2 on a lap is not a seat and is not counted here.",
                "maximum": 30,
                "minimum": 1,
                "title": "Travelers",
                "type": "integer"
              },
              "trip_length_days": {
                "anyOf": [
                  {
                    "maximum": 90,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "How many nights the traveler wants to stay. Round trips only. Every price in the calendar is for exactly this many nights. If the traveler has not told you how many nights, ask them. Do not pick a number for the traveler.",
                "title": "Trip Length Days"
              },
              "trip_type": {
                "default": "roundtrip",
                "description": "Round trip or one way.",
                "enum": ["roundtrip", "one-way"],
                "title": "Trip Type",
                "type": "string"
              },
              "user_request": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional, and it works in the traveler's favor. Quote the traveler's latest message about this trip exactly as they wrote it, in their wording, language and spelling, not a summary. SlickTrip runs its own travel parser on these words: when a search fails or comes back empty, it compares what the traveler said with the arguments sent and returns a corrected search, so you can fix it without asking them again. It has caught Cancun sent as MEX instead of CUN, and travelers dropped from the party. A summary loses exactly the details it checks. If the message only answers a question (\"yes, the 20th\"), quote the message where they asked for the trip. Send the same quote on every call for this request. Leave out anything not about the trip, and never include names, contact details, or payment or ID information. The words also help SlickTrip improve its search.",
                "examples": ["we're 6 friends from madrid, want somewhere cheap and fun in europe dec 20-24, morning flights pls", "necesito llevar a mi mamá de Calgary a Kolkata a fines de octubre, no puede hacer escala en Estados Unidos"],
                "title": "User Request"
              }
            },
            "required": ["destination", "origin"],
            "title": "price_calendarArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "On an error: a machine-readable kind, e.g. unknown_place",
                "type": ["string", "null"]
              },
              "days": {
                "description": "Items: depart_date, return_date, price_usd, day_of_week, low_price",
                "type": ["array", "null"]
              },
              "field": {
                "description": "On unknown_place: which argument (origin, destination, ...)",
                "type": ["string", "null"]
              },
              "message": {
                "description": "Error or sign-in message from the server wrapper",
                "type": ["string", "null"]
              },
              "note": {
                "description": "Next-step guidance or why no data",
                "type": ["string", "null"]
              },
              "places_assumed": {
                "description": "Place names this call resolved on its own, e.g. 'Portland = Portland, OR (PDX)'; tell the traveler",
                "type": ["array", "null"]
              },
              "query": {
                "description": "The calendar query: origin, destination, cabin, travelers, trip_type, stops, month, airlines",
                "type": ["object", "null"]
              },
              "search_url": {
                "description": "slicktrip.com flights tab link",
                "type": ["string", "null"]
              },
              "status": {
                "description": "ok | no_data | error | sign_in_required",
                "type": ["string", "null"]
              },
              "suggestions": {
                "description": "On unknown_place: places to offer the traveler, each with code, name, kind (airport, all airports in the city, nearby airport), city, country",
