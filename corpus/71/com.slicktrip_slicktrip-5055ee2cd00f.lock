        {
          "name": "flight_lookup",
          "title": "Flights on a route that day",
          "description": "Call this tool when the traveler wants to know which flights operate on a route on a given date, or when you need a flight number for seat_availability or track_seats. It returns the departure and arrival times, the airline, the aircraft and the stops. It does not return prices. To find prices, use search_flights.",
          "inputSchema": {
            "properties": {
              "depart_date": {
                "description": "YYYY-MM-DD.",
                "examples": ["2026-11-03"],
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "title": "Depart Date",
                "type": "string"
              },
              "destination": {
                "description": "A 3-letter airport code (JFK), or a city code that searches every airport in the city (SlickTrip's 4-letter codes: NYCA New York, LOND London, ROME Rome, TYOA Tokyo). Up to 3 places joined with _ search them together (JFK_EWR). A place name works when one place clearly matches; otherwise the result is an unknown_place error listing suggestions. When the traveler names a city rather than an airport, send the city (its name or code), not one of its airports: one airport can miss the cheapest or the only flights. Unsure of the code: call find_places.",
                "examples": ["JFK", "NYCA", "JFK_EWR"],
                "maxLength": 40,
                "minLength": 3,
                "title": "Destination",
                "type": "string"
              },
              "display": {
                "anyOf": [
                  {
                    "enum": ["compact", "full"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "compact: one line per option, more options, far fewer tokens; full: every field (what the cards draw). Empty picks for you: compact when the app shows no cards, full when it does.",
                "title": "Display"
              },
              "flight_number": {
                "anyOf": [
                  {
                    "maxLength": 8,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only this flight, like AA100.",
                "title": "Flight Number"
              },
              "origin": {
                "description": "A 3-letter airport code (JFK), or a city code that searches every airport in the city (SlickTrip's 4-letter codes: NYCA New York, LOND London, ROME Rome, TYOA Tokyo). Up to 3 places joined with _ search them together (JFK_EWR). A place name works when one place clearly matches; otherwise the result is an unknown_place error listing suggestions. When the traveler names a city rather than an airport, send the city (its name or code), not one of its airports: one airport can miss the cheapest or the only flights. Unsure of the code: call find_places.",
                "examples": ["JFK", "NYCA", "JFK_EWR"],
                "maxLength": 40,
                "minLength": 3,
                "title": "Origin",
                "type": "string"
              },
              "user_request": {
                "anyOf": [
                  {
                    "maxLength": 500,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional, and it works in the traveler's favor. Quote the traveler's latest message about this trip exactly as they wrote it, in their wording, language and spelling, not a summary. SlickTrip runs its own travel parser on these words: when a search fails or comes back empty, it compares what the traveler said with the arguments sent and returns a corrected search, so you can fix it without asking them again. It has caught Cancun sent as MEX instead of CUN, and travelers dropped from the party. A summary loses exactly the details it checks. If the message only answers a question (\"yes, the 20th\"), quote the message where they asked for the trip. Send the same quote on every call for this request. Leave out anything not about the trip, and never include names, contact details, or payment or ID information. The words also help SlickTrip improve its search.",
                "examples": ["we're 6 friends from madrid, want somewhere cheap and fun in europe dec 20-24, morning flights pls", "necesito llevar a mi mamá de Calgary a Kolkata a fines de octubre, no puede hacer escala en Estados Unidos"],
                "title": "User Request"
              }
            },
            "required": ["depart_date", "destination", "origin"],
            "title": "flight_lookupArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "On an error: a machine-readable kind, e.g. unknown_place",
                "type": ["string", "null"]
              },
              "field": {
                "description": "On unknown_place: which argument (origin, destination, ...)",
                "type": ["string", "null"]
              },
              "flights": {
                "description": "Scheduled flights: flight_numbers, aircraft, airlines, stops, duration_minutes, segments",
                "type": ["array", "null"]
              },
              "message": {
                "description": "Error or sign-in text",
                "type": ["string", "null"]
              },
              "note": {
                "description": "Guidance for the assistant",
                "type": ["string", "null"]
              },
              "places_assumed": {
                "description": "Place names this call resolved on its own, e.g. 'Portland = Portland, OR (PDX)'; tell the traveler",
                "type": ["array", "null"]
              },
              "search": {
                "description": "origin, destination, depart_date with names",
                "type": ["object", "null"]
              },
              "seat_tracker_url": {
                "description": "The seat tracker on slicktrip.com",
                "type": ["string", "null"]
              },
              "status": {
                "description": "ok | no_data | error | sign_in_required",
                "type": ["string", "null"]
              },
              "suggestions": {
                "description": "On unknown_place: places to offer the traveler, each with code, name, kind (airport, all airports in the city, nearby airport), city, country",
                "type": ["array", "null"]
              }
            },
            "type": "object"
          },
