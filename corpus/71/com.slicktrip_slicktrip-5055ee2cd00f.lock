      "instructions": "SlickTrip finds live flight, hotel and seat prices, links to the sellers, and watches prices for travelers: when a watched price drops, SlickTrip emails them (and texts them, if they turned texts on), so they do not have to keep searching. Watches are free with a SlickTrip account.\n\nA watch is what keeps working for the traveler after this conversation. It fits when they have not booked yet and the trip is not days away, and best when price_check says the price is about usual or higher, or the fares are above a budget they named. Offer it in one line when it fits; skip it when they are booking now or already watch this trip. Asking to be told when a price drops is the go-ahead: start the watch.\n\nFlexible dates are a bucket list (add_flight_bucket_list, add_hotel_bucket_list): SlickTrip watches every date in the months they chose and alerts them when a good fare appears. For a watch request with no exact dates (\"tell me when LA to Honolulu gets cheap this winter\"), set it now with what they said and the defaults for the rest (1 traveler, economy, 3 to 10 nights), then say what you assumed; they can change any of it. A watch is the one place a default trip length is fine: it can be changed later, a search cannot.\n\nHow watched prices are checked: around the clock, more often as the trip gets close, and the alert goes out at the first check that finds the drop. Timing depends on the trip and how busy the route is, so do not promise a fixed interval; a fare that lasts only minutes can be missed.\n\nFlights: search_flights for the traveler's dates (a round trip returns outbound flights; search_return_flights completes the trip), booking_options for sellers and checkout links, flight_lookup for the flights a route has on a day. Hotels: search_hotels, hotel_details, hotel_booking_options, hotel_price_calendar. Seats: seat_availability, then track_seats. Watches: track_flight, track_hotel and the bucket lists; watch_details for one watch in full; check_my_watches for what moved on every watch (\"anything new?\", or a daily check). If you are unsure of a place, call find_places first.\n\nBefore any flight search, you need from the traveler: where they are flying from, where they are flying to, when they want to go, and whether it is one way or a round trip (for a round trip, the return date or the number of nights). If any of this is missing, ask the traveler for all of it in one question. Do not pick dates for the traveler. Do not pick a trip length for the traveler. If the traveler has no dates yet, also offer the bucket list alert. Search as soon as you have the dates. After the first results, help the traveler narrow them down.\n\nSearch with what the traveler said; do not invent anything they did not say. Say what the search assumed (searched_as: one way or round trip, travelers, cabin), which airports a city stood for when results land at more than one, and whether each price is per traveler, per night or for the whole trip.\n\nShow choices, not one fare. Results carry highlights (flights: cheapest, cheapest nonstop, fastest, earliest, latest; stays: cheapest, best rated, cheapest four-star, most reviewed). With a card, point to two or three without repeating the card's list; without one, list them briefly with their links. Say when a pick has an overnight layover or separate tickets. When results are broad, name the one or two filters most likely to help (time of day, nonstop, airline, budget; for stays: area, budget per night, stars, free cancellation).\n\nAccounts: signed-out travelers get a few free searches a day; seat maps, the hotel calendar, watches and saved lists need a free SlickTrip account. On sign_in_required, ask the traveler to sign in to SlickTrip and share any links already returned.\n\nErrors: on unknown_place, offer its suggestions (or ask) rather than guessing a code; say any places_assumed.\n\nChanges: confirm with the traveler before a track_, add_, update_, stop_ or remove_ call unless they already asked for it. Booking and payment happen on the seller's site; show the slicktrip.com and booking links results carry.",
      "tools": [
        {
          "name": "add_flight_bucket_list",
          "title": "Add a flight bucket list",
          "description": "Call this tool when the traveler wants to be alerted about a route over flexible dates, for example \"tell me when New York to Tokyo drops under $700 this winter\". SlickTrip keeps searching the months or dates the traveler chose and alerts them when a fare is under their price limit. It returns a bucket_id.\n\nWhen the traveler asks to be alerted, call it now: that is their go-ahead. Otherwise offer it first.\n\nUse the months, the number of nights and the price limit the traveler gave you, and the defaults for anything they did not say (every month on sale, 3 to 10 nights, 1 traveler); then tell them what you assumed. They can change any of it with update_bucket_list.\n\nDo not use this tool for fixed dates. Search those dates with search_flights, then use track_flight to watch the flight the traveler picks.",
          "inputSchema": {
            "properties": {
              "airlines": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only these marketing carriers, as IATA codes or names.",
                "examples": [
                  ["DL", "B6"],
                  ["JetBlue"]
                ],
                "title": "Airlines"
              },
              "arrive_after": {
                "anyOf": [
                  {
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HH:MM, local time at that airport.",
                "examples": ["06:00", "21:30"],
                "title": "Arrive After"
              },
              "arrive_before": {
                "anyOf": [
                  {
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HH:MM, local time at that airport.",
                "examples": ["06:00", "21:30"],
                "title": "Arrive Before"
              },
              "cabin": {
                "default": "economy",
                "description": "Cabin class.",
                "enum": ["economy", "premium_economy", "business", "first"],
                "title": "Cabin",
                "type": "string"
              },
              "carry_on_bags": {
                "anyOf": [
                  {
                    "maximum": 1,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Carry-on bags per traveler (0-1). Prices then include the bag fees: search_flights shows them as price_with_bags next to the fare; a calendar or bucket list prices every day with them.",
                "title": "Carry On Bags"
              },
              "checked_bags": {
                "anyOf": [
                  {
                    "maximum": 2,
                    "minimum": 0,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Checked bags per traveler (0-2), priced only for flights within the US and Canada (elsewhere the answer says the prices do not include them). Prices then include the bag fees: search_flights shows them as price_with_bags next to the fare; a calendar or bucket list prices every day with them.",
                "title": "Checked Bags"
              },
              "connecting_airports": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only itineraries that change planes at these airports (codes or city codes), nonstops included: for 'US connections only' name the hubs.",
                "examples": [
                  ["MIA", "ATL", "IAH"]
                ],
                "title": "Connecting Airports"
              },
              "currency": {
                "anyOf": [
                  {
                    "enum": ["USD", "CAD", "EUR", "GBP", "ILS"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The currency the traveler wants prices in: USD, CAD, EUR, GBP or ILS. Send it when the traveler names a currency or says where they live (euros for someone in Spain). Empty answers in US dollars, or in the currency the traveler picked on SlickTrip. Amounts you send in (max_price_usd, target_price_usd, a price per night) stay US dollars.",
                "title": "Currency"
              },
              "depart_after": {
                "anyOf": [
                  {
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HH:MM, local time at that airport.",
                "examples": ["06:00", "21:30"],
                "title": "Depart After"
              },
              "depart_before": {
                "anyOf": [
                  {
                    "pattern": "^\\d{2}:\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "HH:MM, local time at that airport.",
                "examples": ["06:00", "21:30"],
                "title": "Depart Before"
              },
              "depart_days": {
                "anyOf": [
                  {
                    "items": {
                      "enum": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only depart on these weekdays.",
                "title": "Depart Days"
              },
              "destination": {
                "description": "A 3-letter airport code (JFK), or a city code that searches every airport in the city (SlickTrip's 4-letter codes: NYCA New York, LOND London, ROME Rome, TYOA Tokyo). Up to 3 places joined with _ search them together (JFK_EWR). A place name works when one place clearly matches; otherwise the result is an unknown_place error listing suggestions. When the traveler names a city rather than an airport, send the city (its name or code), not one of its airports: one airport can miss the cheapest or the only flights. Unsure of the code: call find_places.",
                "examples": ["JFK", "NYCA", "JFK_EWR"],
                "maxLength": 40,
                "minLength": 3,
                "title": "Destination",
                "type": "string"
              },
              "end_date": {
                "anyOf": [
                  {
                    "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Last travel date, YYYY-MM-DD.",
                "title": "End Date"
              },
              "exclude_airlines": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Leave out itineraries with any flight sold by these carriers (IATA codes, names or an alliance), by flight number or airline name: for 'not Gol' or 'avoid Air India'.",
                "examples": [
                  ["G3"],
                  ["Gulf Air", "Air India"]
                ],
                "title": "Exclude Airlines"
              },
              "exclude_connecting_airports": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Leave out itineraries that change planes at these airports (codes or city codes).",
                "examples": [
                  ["DOH"],
                  ["LOND"]
                ],
                "title": "Exclude Connecting Airports"
              },
              "lower_emissions": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only itineraries with lower emissions than is typical for the route.",
                "title": "Lower Emissions"
              },
              "max_duration_hours": {
                "anyOf": [
                  {
                    "maximum": 96,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longest itinerary to show, in hours.",
                "title": "Max Duration Hours"
              },
              "max_layover_hours": {
                "anyOf": [
                  {
                    "maximum": 26,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Longest layover allowed at every connection, in hours (half hours allowed): for 'layovers no longer than 5 hours'.",
                "title": "Max Layover Hours"
              },
              "max_nights": {
                "default": 10,
                "description": "Longest trip, nights (round trips).",
                "maximum": 30,
                "minimum": 1,
                "title": "Max Nights",
                "type": "integer"
              },
              "max_price_usd": {
                "anyOf": [
                  {
                    "maximum": 100000,
                    "minimum": 1,
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "The price bar, USD per traveler (or the trip total when price_is_total).",
                "title": "Max Price Usd"
              },
              "max_stops": {
                "default": 1,
                "description": "Most stops allowed: 0 nonstop, 1, or 2.",
                "maximum": 2,
                "minimum": 0,
                "title": "Max Stops",
                "type": "integer"
              },
              "min_layover_hours": {
                "anyOf": [
                  {
                    "maximum": 26,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Shortest layover allowed at every connection, in hours (half hours allowed): for 'at least 2 hours to connect'.",
                "title": "Min Layover Hours"
              },
              "min_nights": {
                "default": 3,
                "description": "Shortest trip, nights (round trips).",
                "maximum": 30,
                "minimum": 1,
                "title": "Min Nights",
                "type": "integer"
              },
              "months": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Months to watch, as names or YYYY-MM, or give start_date + end_date. Leave both empty to watch every month on sale (the default).",
                "examples": [
                  ["November", "December"],
                  ["2026-11", "2026-12"]
                ],
                "title": "Months"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "A short name for the list in the traveler's words; give one. It is how the list is called in every alert and on the site.",
                "examples": ["Japan road trip", "Tokyo this winter"],
                "title": "Name"
              },
              "origin": {
                "description": "A 3-letter airport code (JFK), or a city code that searches every airport in the city (SlickTrip's 4-letter codes: NYCA New York, LOND London, ROME Rome, TYOA Tokyo). Up to 3 places joined with _ search them together (JFK_EWR). A place name works when one place clearly matches; otherwise the result is an unknown_place error listing suggestions. When the traveler names a city rather than an airport, send the city (its name or code), not one of its airports: one airport can miss the cheapest or the only flights. Unsure of the code: call find_places.",
                "examples": ["JFK", "NYCA", "JFK_EWR"],
                "maxLength": 40,
                "minLength": 3,
                "title": "Origin",
                "type": "string"
              },
              "price_is_total": {
                "default": false,
                "description": "max_price_usd is the total for all travelers.",
                "title": "Price Is Total",
                "type": "boolean"
              },
              "return_days": {
                "anyOf": [
