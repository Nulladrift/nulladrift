{
  "lockfileVersion": 2,
  "subjects": {
    "ai.aeoengine/best-ai-search-agency-aeo-report": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aeoengine.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "aeo-engine-aeo-report",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_aeo_report_status",
          "description": "Poll a previously submitted AEO report job once. status is queued, preparing, needs_review or running (keep polling) or complete, partial or failed (terminal); state carries the phase and reason. When complete or partial, returns the structured report (per-engine breakdown with provenance, recommendations, coverage, methodology, the measured questions, competitor evidence, named share of voice), the shareable report_url, and a markdown_summary to read to the user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "job_id from run_aeo_report",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get AEO report status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:52df851c7ae5b20acf5c988d5d107ef586659f2f5d3042d64aaf5bf5175f7525"
        },
        {
          "name": "run_aeo_report",
          "description": "Run the free AI-visibility report for a website (ChatGPT, Perplexity, Gemini, Claude coverage, competitor gaps, prioritized fixes). Requires the user's real email — the finished report is emailed there and a shareable report URL is returned. Takes up to ~10 minutes; set wait_seconds up to 50 to wait inline, or poll later with get_aeo_report_status. Never fill the company field.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "competitor": {
                "description": "Optional pinned competitor domain to compare.",
                "type": "string"
              },
              "competitors": {
                "description": "Optional competitor domains to compare (max 5). The public report pins exactly one; send more only with an agency key.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "context": {
                "anyOf": [
                  {
                    "description": "Short free-text vertical hint, e.g. 'medical aesthetics practice'. Same as {vertical_hint: '<text>'} on both the public and the agency-key path.",
                    "type": "string"
                  },
                  {
                    "additionalProperties": false,
                    "properties": {
                      "focus_terms": {
                        "description": "Named services/products to rank (max 8).",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "location": {
                        "description": "City and region, e.g. 'Austin, TX'.",
                        "type": "string"
                      },
                      "vertical_hint": {
                        "description": "Short vertical hint.",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  }
                ],
                "description": "Optional context that scopes the report. A string is the vertical hint. A value that cannot be used is rejected with invalid_context and a reason, never silently dropped: 422 on the public path, 400 with an agency key (including a blank string or a hint over 256 characters)."
              },
              "customQuestions": {
                "anyOf": [
                  {
                    "type": "null"
                  },
                  {
                    "pattern": "^\\s*$",
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 0,
                    "type": "array"
                  },
                  {
                    "items": {
                      "pattern": "\\S",
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 5,
                    "type": "array"
                  }
                ],
                "description": "Optional 5–20 exact questions, in order, replacing generated questions. Text and order are preserved verbatim; supplied questions are already approved. Omit, null, a blank string or [] to generate questions as before."
              },
              "domain": {
                "description": "Registrable domain or full URL to audit, e.g. example.com",
                "type": "string"
              },
              "email": {
                "description": "The user's real work email (MX-validated; disposable domains rejected). The report is emailed here.",
                "type": "string"
              },
              "fresh": {
                "description": "Force a fresh run instead of a cached report.",
                "type": "boolean"
              },
              "idempotency_key": {
                "description": "16-128 printable chars. Required for a trusted (agency-key) create so retries map to one job. May be sent as the Idempotency-Key HTTP header instead.",
                "type": "string"
              },
              "market": {
                "description": "Optional market the report is measured in, as a city and region, e.g. 'Austin, TX'. Same as context.location.",
                "type": "string"
              },
              "report_profile": {
                "description": "Report profile / engine cohort.",
                "enum": ["public", "aio"],
                "type": "string"
              },
              "wait_seconds": {
                "description": "Seconds to wait inline for completion (0-50). Default 0: returns the job to poll.",
                "type": "integer"
              }
            },
            "required": ["domain", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Run AEO visibility report"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:177017a6434bc4e53608bdf7f7a892ac31bdc6763cf0815e7805c3a8c5267541"
        }
      ],
      "digest": "sha256:8a898c49526f17a4310f8d77be43cf075df8dcdb4ec79784366ada70b354da7c"
    }
  }
}
