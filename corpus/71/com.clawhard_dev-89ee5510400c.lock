        {
          "name": "tick_matches",
          "title": "Would this cron fire at a datetime?",
          "description": "Use when you need a yes/no on whether a cron expression would fire at a specific instant in a timezone — for example before shipping a schedule that crosses a DST transition, or to verify a single expected fire. Example: {\"expression\":\"0 9 * * 1-5\",\"timezone\":\"America/New_York\",\"at\":\"2026-11-06T14:00:00Z\"}. Returns fires true/false, the local wall time of that instant, and DST notes if the local time is in a gap or fold.",
          "inputSchema": {
            "properties": {
              "at": {
                "description": "ISO datetime to test, e.g. 2026-11-06T14:00:00Z.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "expression": {
                "description": "Cron expression (5 or 6 fields, or a nickname like @hourly).",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone. Default UTC.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["at", "expression"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Would this cron fire at a datetime?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://clawhard/tick/result",
              "visibility": ["model", "app"]
            },
            "ui/resourceUri": "ui://clawhard/tick/result"
          },
          "digest": "sha256:3926f57ddcce8841ea28e4576be145f1b7a1ec9f107b0a13af5dec7b108714bd"
        },
        {
          "name": "tick_next_runs",
          "title": "Next cron run times in a timezone",
          "description": "Use when you or the user just wrote a cron expression (GitHub Actions, Vercel cron, Cloudflare Cron Triggers, systemd, an agent schedule) and need its next fire times. Pass the expression and an IANA timezone (default UTC). Returns the next N runs as local wall times and UTC ISO, a plain-English field breakdown, and DST gap/fold warnings (spring-forward skips, fall-back double fires). Example: {\"expression\":\"0 9 * * 1-5\",\"timezone\":\"America/New_York\",\"count\":5}. Uses the tz database, so DST rules match the region and year. Not for converting a meeting time across cities (use Meridian) or for email DNS (use Stamp).",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many next runs to return (1–20). Default 5.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "expression": {
                "description": "Cron expression: 5 fields (minute hour day-of-month month day-of-week) or 6 with seconds first. Also accepts @hourly, @daily, @weekly, @monthly, @yearly.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "from": {
                "description": "Optional ISO datetime to start from (default now), e.g. 2026-03-07T12:00:00Z.",
                "maxLength": 40,
                "type": "string"
              },
              "timezone": {
                "description": "IANA timezone for local wall times, e.g. America/New_York. Default UTC.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["expression"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Next cron run times in a timezone"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
