      "instructions": "Clawhard Dev Tools return exact, deterministic answers. stamp_check_email_domain and stamp_check_dns_record: SPF, DKIM, DMARC and MX from live DNS with fix records. deadbolt_check_supabase_access and deadbolt_catalog_query: per-table read and write access for anon and signed-in users, findings and fix SQL. tick_next_runs and tick_matches: cron next runs with DST warnings. mend_repair_json, mend_outline_json and mend_query_json: repair JSON without changing values, outline it, extract fields by path. swatch_check_contrast, swatch_fix_contrast, swatch_make_scale and swatch_check_pairs: WCAG and APCA contrast, nearest passing colors, palettes. meridian_now, meridian_convert_time, meridian_meeting_slots and meridian_zone_info: current time, conversion and meeting slots. doorman_check_ai_bot_access: AI bot access for a site or robots.txt text. notary_check_packages: whether npm and PyPI packages and exact versions exist in the live registries, with age, downloads, deprecation, install scripts and look-alike warnings. Results include a short text summary and structuredContent.",
