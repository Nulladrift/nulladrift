{
  "lockfileVersion": 2,
  "subjects": {
    "com.findcarcolors.mcp/findcarcolors": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.findcarcolors.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "findcarcolors",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_paint_details",
          "description": "Get sources, finish, code evidence, approximate swatch, and documented examples by stable paint ID or manufacturer and exact catalog code.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "code": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "id": {
                "maxLength": 180,
                "pattern": "^[a-z0-9-]+\\/[a-z0-9-]+$",
                "type": "string"
              },
              "manufacturer": {
                "description": "Manufacturer name or catalog slug",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bacb1205c674b2af7110f2198eff46d8c9179748f7d6bba11134db0dd37bd965"
        },
        {
          "name": "list_manufacturer_paints",
          "description": "List paints in the FindCarColors catalog for a manufacturer. Model and year filters use documented examples. Catalog coverage is partial.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "Manufacturer name or catalog slug",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 3000,
                "minimum": 0,
                "type": "integer"
              },
              "yearFrom": {
                "maximum": 2100,
                "minimum": 1886,
                "type": "integer"
              },
              "yearTo": {
                "maximum": 2100,
                "minimum": 1886,
                "type": "integer"
              }
            },
            "required": ["manufacturer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3febf7b1608301d607e59a03ba1d2191ca06d155cd5ae019ad1752b017e150a5"
        },
        {
          "name": "search_car_paints",
          "description": "Search the FindCarColors catalog by manufacturer, paint name, exact code, or documented model and year examples. Name similarity returns candidates for review.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "code": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "Manufacturer name or catalog slug",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "model": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "name": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "offset": {
                "default": 0,
                "maximum": 3000,
                "minimum": 0,
                "type": "integer"
              },
              "yearFrom": {
                "maximum": 2100,
                "minimum": 1886,
                "type": "integer"
              },
              "yearTo": {
                "maximum": 2100,
                "minimum": 1886,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24726a9db6915c33eb2ad3d1bfe69da357faee27335e618d3841d3c91c1de19d"
        }
      ],
      "digest": "sha256:3d809d9a14c32dad74d70b01827ce90b98560bece520bf4f84c5b020a160c2ed"
    }
  }
}
