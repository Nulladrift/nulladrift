        {
          "name": "board_status",
          "title": "Check collection progress",
          "description": "Shows how collection is going for a card: how many have signed, when collection closes and when it opens. Takes the participants' invite link.",
          "inputSchema": {
            "properties": {
              "invite": {
                "description": "The invite link (https://.../m/...) or its token.",
                "type": "string"
              }
            },
            "required": ["invite"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check collection progress"
          },
          "behavior": {
            "destructive": false,
