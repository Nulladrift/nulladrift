          "digest": "sha256:100a56b9778410207234881696e7283a31ec4624303853624f6548acd333799d"
        },
        {
          "name": "create_board",
          "title": "Create a group card",
          "description": "Creates a group greeting card that several people sign before it opens on a set date, and returns the link to send to participants. Requires the organiser's email: the full management links are sent there, and a one-time 'take control' link is returned. Ask the person for anything missing; never invent an email. For Дарим (darim.ai) names are Russian; for Yahad (yahad.ai) Hebrew.",
          "inputSchema": {
            "properties": {
              "occasion": {
                "description": "Occasion value from list_occasions, or a word like 'retirement'.",
                "type": "string"
              },
              "organizerEmail": {
                "description": "Organiser's email. Required; ask the person, never guess.",
                "type": "string"
              },
              "promptQuestion": {
                "default": null,
                "description": "Optional question shown to participants; see suggest_prompts.",
                "type": ["string", "null"]
              },
              "recipientGender": {
                "default": null,
                "description": "Optional: 'female' or 'male', used for Hebrew grammar.",
                "type": ["string", "null"]
              },
              "recipientName": {
                "description": "Who the card is for, as participants will see it.",
                "type": "string"
              },
              "revealDate": {
                "description": "Date the card opens, YYYY-MM-DD, in the future.",
                "type": "string"
              },
              "revealTime": {
                "default": null,
                "description": "Time the card opens, HH:MM, 24-hour. Default 18:00.",
                "type": ["string", "null"]
              },
              "timezone": {
                "default": null,
                "description": "IANA timezone, e.g. Europe/Moscow. Default: the service's own.",
                "type": ["string", "null"]
              }
            },
            "required": ["occasion", "organizerEmail", "recipientName", "revealDate"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a group card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://card/created.html"
            }
          },
          "digest": "sha256:40d7052e40362a5e306b2681954ec10494716b2518710ab5be10e48a91078e43"
        },
        {
          "name": "gift_budget",
          "title": "Split a group gift",
          "description": "How much each person gives toward a group gift: divide the cost by those who will actually pay, round down; the organiser adds the rest. Or, from a per-person amount, the total budget. Pass exactly one of giftCost or perPerson. Amounts are in the service's currency.",
          "inputSchema": {
            "properties": {
              "giftCost": {
                "default": null,
                "description": "Total gift cost, in the service's currency.",
                "type": ["number", "null"]
              },
              "payers": {
                "default": 0,
                "description": "How many people will actually pay, 2 to 500.",
                "type": "integer"
              },
              "perPerson": {
                "default": null,
                "description": "Amount each person gives.",
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Split a group gift"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:34cce1228d09ba95f844f536a3d888a08e848c651ad4473d847889dab30ce731"
        },
        {
          "name": "list_occasions",
          "title": "List occasions",
