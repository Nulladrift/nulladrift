          },
          "digest": "sha256:02275f6b6a9ed93687e9e23129b6ea1a335dda69dc29988f57b3180a2b1f88c4"
        },
        {
          "name": "suggest_prompts",
          "title": "Suggest questions for participants",
          "description": "Suggests ready questions the organiser can show participants, for an occasion. Optional recipientName fills the name in.",
          "inputSchema": {
            "properties": {
              "occasion": {
                "description": "Occasion value from list_occasions, or a word like 'retirement'.",
                "type": "string"
              },
              "recipientName": {
                "default": null,
                "description": "Recipient's first name, to fill into the questions.",
                "type": ["string", "null"]
              }
