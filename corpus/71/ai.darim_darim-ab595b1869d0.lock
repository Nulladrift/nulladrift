        },
        {
          "name": "occasion_date",
          "title": "When is a holiday",
          "description": "Next date and the one after for a professional day (Russian service) or a Jewish holiday (Hebrew service), computed from the calendar rule, never stale. For fasts and memorial days the answer says greetings are not customary.",
          "inputSchema": {
            "properties": {
              "occasion": {
                "description": "Holiday id like 'avtomobilista' or 'yom-kippur', or its name.",
                "type": "string"
              }
            },
            "required": ["occasion"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
