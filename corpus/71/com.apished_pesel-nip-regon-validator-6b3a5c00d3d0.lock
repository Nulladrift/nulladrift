      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "apished-idvalidate",
        "version": "1.0.0"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "nip_validate",
          "description": "Validates the checksum of a 10-digit Polish tax identification number (NIP). Checksum uses weights 6 5 7 2 3 4 5 6 7 over the first 9 digits; sum mod 11 must equal the 10th digit. A sum mod 11 of 10 is itself invalid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "digits-only identifier to validate (no spaces or dashes)",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "reason": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5170eb7c1049bcfe183202068265112c1300d92a1619d9b5e4f1e421c497b7da"
        },
        {
          "name": "pesel_validate",
          "description": "Validates the checksum of an 11-digit Polish national identification number (PESEL). Checksum uses weights 1 3 7 9 1 3 7 9 1 3 over the first 10 digits; control digit is (10 - sum mod 10) mod 10. On success also decodes the date of birth and sex embedded in the number; a checksum-valid number with an impossible calendar date (e.g. Feb 30) is still reported invalid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "digits-only identifier to validate (no spaces or dashes)",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "birthDate": {
                "type": "string"
              },
              "reason": {
                "type": "string"
              },
              "sex": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6bd6b958f2c2742df44d940f75f0f1ac8c3449b0932de2ccc4e0a8300132367f"
        },
        {
          "name": "regon_validate",
          "description": "Validates the checksum of a 9- or 14-digit Polish business registry number (REGON). 9-digit: weights 8 9 2 3 4 5 6 7 over the first 8 digits, sum mod 11 (10 mapped to 0) must equal the 9th digit. 14-digit: the first 9 digits must themselves be a valid 9-digit REGON, and weights 2 4 8 5 0 9 7 3 6 1 2 4 8 over the first 13 digits (sum mod 11, 10 mapped to 0) must equal the 14th digit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "value": {
                "description": "digits-only identifier to validate (no spaces or dashes)",
                "type": "string"
              }
            },
            "required": ["value"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "reason": {
                "type": "string"
              },
              "valid": {
                "type": "boolean"
              }
            },
            "required": ["valid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:65a9bf8227526c638c885c65a42fccf4156d2a319961775fe18da25d362f2504"
        }
      ],
      "digest": "sha256:7c7e3d11571cd58b956af50e9f2b9d32496d407f83ce0d4fc45cb1736fed1a77"
    }
  }
