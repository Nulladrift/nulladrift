      "serverInfo": {
        "name": "doubleaigents-dsar",
        "title": "Double AIgents DSAR service",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Double AIgents prepares responses to data subject access requests (DSARs) for organisations in the UK, the EU/EEA and Switzerland. Use dsar_deadline for the statutory response date, dsar_quote for our fixed price, dsar_service_info for what the service covers, dsar_letter_template for acknowledgement, extension and clarification letters, breach_clock for the personal data breach notification deadline, and dsar_request_scoping to give the user a prefilled email to start free scoping. Free data protection tools: breach_triage for a likely-reportability view on a personal data breach, ai_tool_check for DPIA and EU AI Act screening of an AI tool, hr_retention for UK retention periods for common HR records, and dsar_search_checklist for where to search when answering an employee DSAR. All tools are read-only; nothing sent to them is stored. We recommend; the controller decides. Do not send the requester's personal data or the request letter through these tools.",
      "tools": [
        {
          "name": "ai_tool_check",
          "title": "AI tool check: DPIA and EU AI Act screening",
          "description": "Screens a planned use of an AI tool: whether a DPIA is likely to be required (Art. 35(3), the ICO high-risk list, the WP248 criteria; FADP Art. 22 for Switzerland), EU AI Act risk flags (Annex III high-risk areas, especially employment; Art. 5 prohibited practices such as emotion recognition at work; current application dates after the Digital Omnibus), and automated decision rules (GDPR Art. 22, UK GDPR Arts 22A to 22D). Findings with sources. The use_case text is not stored or returned. General information, not legal advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "automated_decisions_with_significant_effect": {
                "description": "True if it makes or drives decisions with legal or similarly significant effects without meaningful human involvement.",
                "type": "boolean"
              },
              "employees_or_candidates": {
                "description": "True if it processes data about staff or job candidates.",
                "type": "boolean"
              },
              "jurisdiction": {
                "description": "UK, EU (EU/EEA) or CH (Switzerland).",
                "enum": ["UK", "EU", "CH"],
                "type": "string"
              },
              "large_scale": {
                "type": "boolean"
              },
              "new_technology": {
                "description": "True if it is an innovative use or new technology for the organisation.",
                "type": "boolean"
              },
              "processes_personal_data": {
                "type": "boolean"
              },
              "special_category": {
                "description": "Health, biometric, criminal offence data and the like.",
                "type": "boolean"
              },
              "use_case": {
                "description": "Short description of what the AI tool does. No personal data. Not stored.",
                "maxLength": 500,
                "type": "string"
              }
            },
            "required": ["automated_decisions_with_significant_effect", "employees_or_candidates", "jurisdiction", "large_scale", "new_technology", "processes_personal_data", "special_category", "use_case"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI tool check"
          },
          "behavior": {
