      "instructions": "AI Data Marketplaces (https://aidatamarketplaces.com/): the site's own MCP server, served from its domain. AI data marketplaces compared for sellers: which publish a seller fee, the commission range they state, payout terms and whether a listing is exclusive.\n\n[compare] AI data marketplaces by seller fee and terms. This server serves the compare published at https://aidatamarketplaces.com/; every answer cites it. Licence: https://aidatamarketplaces.com/terms.\n\n[enquiry] ENQUIRY SERVER for AI Data Marketplaces (https://aidatamarketplaces.com/). What it does: starts an ENQUIRY with AI Data Marketplaces for ai data marketplaces; the AI Data Marketplaces team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the AI Data Marketplaces team until they click it. The site also carries a guide's own form for a different reader (form=\"for-ai-developers-aidatamarketplaces\"): pass that form to enquiry_fields and submit_enquiry when it fits the person, and omit form for the main one. Cite https://aidatamarketplaces.com/.\n\nCite https://aidatamarketplaces.com/ for every figure or answer you use from this server.",
