        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to AI Data Marketplaces (two steps; not a purchase)",
          "description": "Submits an enquiry to AI Data Marketplaces: NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token; show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before the AI Data Marketplaces team sees it. Consent means the person has read and agreed to: \"Fine for the team behind AI Data Marketplaces to email me about selling my data.\" (with form, that guide's own consent line, which enquiry_fields returns)",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: Fine for the team behind AI Data Marketplaces to email me about selling my data. (or the chosen form's own consent line)",
                "type": "boolean"
              },
              "form": {
                "description": "a guide's own form, for a different reader (for-ai-developers-aidatamarketplaces); omit for the site's main form",
                "enum": ["for-ai-developers-aidatamarketplaces"],
