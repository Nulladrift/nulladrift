      "serverInfo": {
        "name": "benchleader",
        "title": "BenchLeader",
        "version": "1.0.0",
        "websiteUrl": "https://www.benchleader.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BenchLeader ranks large language models daily on the BenchLeader Index, a composite of independent public benchmarks (50 = average model, 15 = one standard deviation). Start with get_leaderboard or search_models; use get_model and compare_models for details, list_benchmarks and get_benchmark for the boards, about_benchleader for method and licence. Rows are model × reasoning-effort configurations; ids look like \"model-id@effort\". Cite the url fields when you quote figures.",
      "tools": [
        {
          "name": "about_benchleader",
          "title": "About BenchLeader",
          "description": "What BenchLeader is, how the BenchLeader Index is computed, the current method version, data date and update cadence, coverage counts, licence and how to cite it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About BenchLeader"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30d1688c5369e1ce05fd82354df52a18bb4639a5e7bcdae7a02d922a1dc0272c"
        },
        {
          "name": "compare_models",
          "title": "Compare two models",
          "description": "Head-to-head comparison of two models with BenchLeader's verdict: who leads on quality (a lead is claimed only outside the combined margin of error), price and speed ratios, category-by-category wins, when to choose each, and shared benchmark results. Links the comparison page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "effort_a": {
                "description": "Reasoning effort for model_a (defaults to its best-ranked configuration).",
                "type": "string"
              },
              "effort_b": {
                "description": "Reasoning effort for model_b (defaults to its best-ranked configuration).",
                "type": "string"
              },
              "model_a": {
                "description": "First model: id, configuration id, page URL or name.",
                "type": "string"
              },
              "model_b": {
                "description": "Second model: id, configuration id, page URL or name.",
                "type": "string"
              }
            },
            "required": ["model_a", "model_b"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare two models"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5450b03ed9bee67048aec6c0d0b9c07351ec98372505e64a771b1beef60018e1"
        },
        {
          "name": "get_benchmark",
          "title": "Benchmark details",
          "description": "One benchmark: what it measures, unit, publisher and source, whether and how much it counts in the BenchLeader Index, status and caveats, and its top models (one row per model, best result first).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "benchmark": {
                "description": "Benchmark id (\"gpqa_diamond\"), name (\"SWE-bench Verified\"), alias or page URL.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many top models to return (at most 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["benchmark"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Benchmark details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a0e3dcc2041d2dc3677c129a471046bbf93d51422b3b72e5203fe072b1de73a"
        },
        {
          "name": "get_leaderboard",
          "title": "BenchLeader leaderboard",
          "description": "The BenchLeader Index leaderboard of large language models: a daily composite of independent public benchmarks, one row per model (its best reasoning-effort configuration) as on the homepage. Optionally rank by one category score (coding, agentic, reasoning, math, knowledge…), list every model × effort configuration, or filter to open-weights models or one developer. Paged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Rank by this category score instead of the overall Index, e.g. coding, agentic, reasoning, math, knowledge, instruction, multimodal, long_context.",
                "type": "string"
              },
              "configurations": {
                "default": false,
                "description": "List every ranked model × reasoning-effort configuration rather than one row per model.",
                "type": "boolean"
              },
              "developer": {
                "description": "Only models from this developer, e.g. OpenAI, Anthropic, Google, DeepSeek.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "How many rows to return (at most 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip, for paging (use next_offset from the previous page).",
                "minimum": 0,
                "type": "integer"
              },
              "open_weights_only": {
                "default": false,
                "description": "Only models with downloadable weights.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "BenchLeader leaderboard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:31d8d33797c82ad514def942e4600ba366693be93d2cd9f09aa722bcdc87ff21"
        },
        {
          "name": "get_model",
          "title": "Model details",
          "description": "One model's BenchLeader profile: Index and rank, category scores, list price, speed, latency, context window, its other reasoning-effort configurations, and its strongest independent benchmark results (each with its board rank, publisher and source link).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "effort": {
                "description": "Reasoning-effort configuration to show (none, low, medium, high, xhigh, max…). Defaults to the best-ranked one.",
                "type": "string"
              },
              "model": {
                "description": "Model id (\"claude-opus-5-5\"), configuration id (\"gpt-6-astra@max\"), page URL or name.",
                "type": "string"
              },
              "results_limit": {
                "default": 10,
                "description": "How many benchmark results to return (at most 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Model details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad3711a4a2dbd451ad3c5eefed4b8c8603c5b44db0ffef5db4c4cd5bc8ba6309"
        },
        {
          "name": "list_benchmarks",
          "title": "List benchmarks",
          "description": "The benchmarks BenchLeader reads: what each measures, publisher, category, whether it feeds the Index (and its weight), how many models it covers, status and caveats. Filter by category or a search query. Paged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Only this category, e.g. coding, agentic, reasoning, math, knowledge.",
                "type": "string"
              },
              "in_index_only": {
                "default": false,
                "description": "Only benchmarks that feed the BenchLeader Index.",
                "type": "boolean"
              },
              "limit": {
                "default": 50,
                "description": "How many benchmarks to return (at most 100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Rows to skip, for paging (use next_offset from the previous page).",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Search benchmark names, ids, aliases and publishers (\"swe-bench\", \"arc\", \"epoch\").",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List benchmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:987f77f6123fe359b503f5b419728716ba09607e10b851794cd7ea15ea05243b"
        },
        {
          "name": "search_models",
          "title": "Search models",
          "description": "Find models by name, alias, id or developer (\"opus\", \"gemini 4\", \"deepseek\"). Returns each match's id, rank, Index and reasoning-effort configurations, for use with get_model and compare_models.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many matches to return (at most 25).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Model name, alias, id or developer.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search models"
          },
          "behavior": {
