      "serverInfo": {
        "name": "dincat",
        "title": "DinCat — learning and life in Japan",
        "version": "1.0.0",
        "websiteUrl": "https://www.dincat.ai"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DinCat (https://www.dincat.ai) is a learning and thinking companion for people living in Japan, in Japanese, Chinese and English. These tools return DinCat's own program-made content; none of them calls an AI model.\n- calc_take_home_pay: a company employee's take-home pay in Japan (social insurance, income tax, resident tax) from the 2026 official rates.\n- get_visa_rules: DinCat's summary of Japan's residence-status rules for a topic, with the official sources. Information only: it does not judge whether an application will be approved and does not write application documents.\n- list_library and search_library: DinCat's ready-made question pages (money and tax, visas, certification exams, languages, hard-to-say conversations at work). Each link opens that question in DinCat's chat; no sign-up is needed to try.\n- get_service_info: what DinCat's assistant can do and how pricing works.\nQuote figures as returned, keep the notes and official sources, and give links to the user unchanged.",
      "tools": [
        {
          "name": "calc_take_home_pay",
          "title": "Japan take-home pay calculator (2026 rates)",
          "description": "Calculate a company employee's take-home pay in Japan from the 2026 official rates: health, nursing-care, child-support, pension and employment insurance, income tax and resident tax, per month and per year, for the first year in Japan and for later years. Calculated by program, not AI. Give either monthlySalary or annualSalary. Age and prefecture default to 30 and Tokyo when not given (marked in the result). The inputs are not stored.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age": {
                "description": "Age (default 30). From 40 to 64, nursing-care insurance is added.",
                "maximum": 100,
                "minimum": 15,
                "type": "integer"
              },
              "annualBonus": {
                "description": "Total bonuses per year in yen (default 0). With annualSalary it is the part of that total paid as bonuses.",
                "maximum": 1000000000,
                "minimum": 0,
                "type": "integer"
              },
              "annualSalary": {
                "description": "Yearly gross pay in yen including bonuses, excluding commuting allowance. Give this or monthlySalary.",
                "maximum": 1000000000,
                "minimum": 1,
                "type": "integer"
              },
              "bonusPayments": {
                "description": "How many times a year the bonus is paid (default 2).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "industry": {
                "description": "Employment insurance category: general (default), agriculture (agriculture, forestry, fisheries, sake brewing) or construction.",
                "enum": ["general", "agriculture", "construction"],
                "type": "string"
              },
              "lang": {
                "default": "ja",
                "description": "Language of the reply and of the linked pages: ja = Japanese, zh = Simplified Chinese, en = English. Use the user's language.",
                "enum": ["ja", "zh", "en"],
                "type": "string"
              },
              "monthlyCommute": {
                "description": "Monthly commuting allowance in yen (default 0): not taxed, but counted for social insurance.",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "monthlySalary": {
                "description": "Monthly base pay in yen before deductions (額面), excluding commuting allowance. Give this or annualSalary.",
                "maximum": 100000000,
                "minimum": 1,
                "type": "integer"
              },
              "prefecture": {
                "description": "Prefecture where the user works (the health insurance rate depends on it), lowercase romaji, e.g. tokyo, osaka, kanagawa, aichi, fukuoka. Japanese or Chinese names such as 東京都 or 东京 are also accepted. Default tokyo.",
                "enum": ["hokkaido", "aomori", "iwate", "miyagi", "akita", "yamagata", "fukushima", "ibaraki", "tochigi", "gunma", "saitama", "chiba", "tokyo", "kanagawa", "niigata", "toyama", "ishikawa", "fukui", "yamanashi", "nagano", "gifu", "shizuoka", "aichi", "mie", "shiga", "kyoto", "osaka", "hyogo", "nara", "wakayama", "tottori", "shimane", "okayama", "hiroshima", "yamaguchi", "tokushima", "kagawa", "ehime", "kochi", "fukuoka", "saga", "nagasaki", "kumamoto", "oita", "miyazaki", "kagoshima", "okinawa"],
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Japan take-home pay calculator (2026 rates)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:568996bdff08fd719df11bc53c468a557ba9d987707ccd1a38f33464bfc3caed"
        },
        {
          "name": "get_service_info",
          "title": "What DinCat does and how pricing works",
          "description": "Describe what DinCat's assistant helps with (languages, salary and tax, visas, hard-to-say conversations, family check-ins, deep analysis, images) and how pricing works: a free daily chat allowance, per-message costs in cat food (counted in grams), cat food packs and monthly plans in yen. Figures come from the same settings the website uses.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "ja",
                "description": "Language of the reply and of the linked pages: ja = Japanese, zh = Simplified Chinese, en = English. Use the user's language.",
                "enum": ["ja", "zh", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What DinCat does and how pricing works"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f40a48666ad80b1ca87619045145f4458868040d9d0f2358978977d235825d55"
        },
        {
          "name": "get_visa_rules",
          "title": "Japan visa and residence rules (DinCat summary)",
          "description": "Get DinCat's summary of Japan's residence-status (visa) rules for one or more topics, compiled from official Immigration Services Agency pages, with the official sources. Information and self-check points only: it does not judge whether an application will be approved, and does not write or fill in application documents. Call without topics to list the topics.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "ja",
                "description": "Language of the reply and of the linked pages: ja = Japanese, zh = Simplified Chinese, en = English. Use the user's language.",
                "enum": ["ja", "zh", "en"],
                "type": "string"
              },
              "topics": {
                "description": "Up to 4 topics: renewal = Extension of period of stay / change of status; fees = Fees (applications accepted from 2026-10-01); pr = Permanent residence; naturalization = Naturalization (Japanese nationality); job_change = Notifications after changing or leaving a job; student_work = From student to work; family_stay = Family / Dependent status; dependent = Dependent procedures (bringing family over, renewal); spouse_jp = Spouse of a Japanese national (status: Spouse or Child of Japanese National); spouse_pr = Spouse of a permanent resident (status: Spouse or Child of Permanent Resident); hire = First work visa for a foreign hire (company / HR); employer = Company / HR side (employing foreign staff); school = Japanese language school side (international students); short_stay = Temporary visitor (tourism, business trips, visiting family); referral = Cases to refer to professionals; dv = Domestic violence and visas. Omit to list the topics.",
                "items": {
                  "enum": ["renewal", "fees", "pr", "naturalization", "job_change", "student_work", "family_stay", "dependent", "spouse_jp", "spouse_pr", "hire", "employer", "school", "short_stay", "referral", "dv"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Japan visa and residence rules (DinCat summary)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
