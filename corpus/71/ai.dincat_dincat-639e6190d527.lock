          },
          "digest": "sha256:14bb49c45cd46ff8e49b87e8013ad6e590745b3ed4047272a949cef3d106e04e"
        },
        {
          "name": "search_library",
          "title": "Search the DinCat library",
          "description": "Search DinCat's library of ready-made question pages by keyword, in the user's language (e.g. 手取り, 永住, 敬語, JLPT, 年末調整, 到手, take-home pay). Returns up to 8 pages with links that open the question in DinCat's chat; if nothing matches, returns the shelves instead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "ja",
                "description": "Language of the reply and of the linked pages: ja = Japanese, zh = Simplified Chinese, en = English. Use the user's language.",
                "enum": ["ja", "zh", "en"],
                "type": "string"
              },
              "query": {
                "description": "Keyword(s) in the user's language.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
