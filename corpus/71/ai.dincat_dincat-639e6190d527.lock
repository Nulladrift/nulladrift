          },
          "digest": "sha256:38e61b77557a84a1cb282e9eadcc3283f2ca0e47b118b2e51641caa0f925a8c4"
        },
        {
          "name": "list_library",
          "title": "DinCat library: question pages by shelf",
          "description": "List DinCat's library of ready-made question pages, grouped by shelf: money (take-home pay, staying a dependent, year-end adjustment), visa and residence, Japanese certification exams (FP, IT Passport, Applied Information Technology Engineer), languages (Japanese, English, Chinese) and hard-to-say conversations at work. Each link opens that question in DinCat's chat; no sign-up is needed to try.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "ja",
                "description": "Language of the reply and of the linked pages: ja = Japanese, zh = Simplified Chinese, en = English. Use the user's language.",
                "enum": ["ja", "zh", "en"],
                "type": "string"
              },
              "shelf": {
                "description": "Only this shelf: money, visa, exam, lang or awkward. Omit for all shelves.",
                "enum": ["money", "visa", "exam", "lang", "awkward"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "DinCat library: question pages by shelf"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
