        {
          "name": "set_branding",
          "title": "Change how a site looks",
          "description": "Change how a site looks: its theme, main colour, typeface, header links, logo and icon, and whether it has an Articles section. Only the site's owner can do this. Give only the things to change; the rest stay as they are. The changes show from the site's next publish. Every look change (theme, Articles, colour, typeface, header links, logo and icon) waits for the owner to publish; until then it shows in the site's preview. Before turning Articles on, tell the owner that readers won't see anything yet: they can look at it in the site's Preview, change anything, then publish, or ask to turn it off again. Offer to move pages that read like articles (comparisons, guides, news) under /articles with propose_edit; moved pages keep their old addresses. Page text is changed with propose_edit, not here. A logo or icon is taken from an address you give; say images_are_ours: true only when the owner has told you the pictures are theirs to use — otherwise they are kept but not shown until the owner confirms them on the site's preview. site_name is the name shown at the top of every page, not the web address: a preview's web address is chosen when it is kept, as claim_draft's or publish's subdomain, and no argument here changes it. On a preview nobody has kept yet, give its draft_id to set its name or its logo. Give languages to change the language the site's own words — Previous, Next, Search — are in.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "articles": {
                "description": "true turns on the Articles section: pages under /articles become dated posts, listed newest first at /articles and left out of the docs sidebar. false turns it off, and those pages go back into the sidebar as ordinary pages.",
                "type": "boolean"
              },
              "draft_id": {
                "description": "Which preview: the draft_id create_preview returned, a 43-character key of letters, digits, - and _ (stray quotes or punctuation around it are ignored). It is not the code in the preview's link. Leave it out for a kept site, which site names.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "font": {
                "description": "The typeface: system, serif, mono, humanist, grotesque.",
                "enum": ["system", "serif", "mono", "humanist", "grotesque"],
                "type": "string"
              },
              "header_links": {
                "description": "Up to 4 links for the header, each a label and an address starting with https://. They replace the current set.",
                "items": {
                  "properties": {
                    "label": {
                      "description": "The link's text, like Pricing.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "url": {
                      "description": "Where the link goes, starting with https://.",
                      "maxLength": 2048,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["label", "url"],
                  "type": "object"
                },
                "maxItems": 50,
                "type": "array"
              },
              "icon_url": {
                "description": "A direct https address of the small icon for the browser tab: PNG, JPEG, WebP or SVG, up to 1 MB. It is fetched once from that address; an address that redirects, is private or is not https is refused.",
                "maxLength": 2048,
                "type": "string"
              },
              "images_are_ours": {
                "description": "Say true only when the owner has told you the pictures are theirs to use. Otherwise they are kept but not shown until the owner confirms them.",
                "type": "boolean"
              },
              "languages": {
                "description": "The site's language as a code, like en, ru or pt-BR — the language every page, title and heading is written in.",
                "items": {
                  "pattern": "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "logo_shows_name": {
                "description": "true when the logo image itself spells the name, so the name is not printed again beside it. Leave it out otherwise.",
                "type": "boolean"
              },
              "logo_url": {
                "description": "A direct https address of the logo — PNG, JPEG, WebP or SVG, up to 1 MB. An empty value removes the logo.",
                "maxLength": 2048,
                "type": "string"
              },
              "primary_color": {
                "description": "The main colour as a hex code of six or three digits, with or without #, like #2e5fa3 or #25a. A colour that would not stay readable on light and dark screens is refused.",
                "maxLength": 32,
