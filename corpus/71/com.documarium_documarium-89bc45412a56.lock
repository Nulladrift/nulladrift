      "serverInfo": {
        "name": "documarium",
        "title": "Documarium",
        "version": "1.0.0",
        "description": "Your public documentation sites. Claude can read, change, preview and publish their pages.",
        "websiteUrl": "https://documarium.com/",
        "icons": [
          {
            "src": "https://documarium.com/_landing/brand/png/directory-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://documarium.com/_landing/brand/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Documarium hosts the public documentation sites this connection can edit. Use list_pages to see what is there and read_page to read one. Leave out the site argument when the connection only covers one site; a preview is never one of those sites, so always pass its draft_id. When you tell the person what you did, use plain words, not tool names or ids. Whenever you write or change a page, write it to be found by search engines and by AI search: title it in a reader's words, short and without the site's or product's name; put the search words and a one-sentence summary in the opening sentence; and put facts in the text.",
      "tools": [
        {
          "name": "apply_edit",
          "title": "Keep a change",
          "description": "Keeps changes. On a kept site it takes the proposal_id that propose_edit returned, or that site_status lists, and saves that staged set as the site's next numbered version, all at once or not at all. It does not publish: readers see the change after publish. A staged set is not kept if someone else changed the same pages in the meantime or if it is more than a day old, and the answer says which. A member whose role does not allow keeping leaves the change waiting for an editor. On a preview, given its draft_id, there is no staged set: it takes the operations themselves and saves them into the preview at once, and the preview's link shows them. rollback undoes a kept version.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "draft_id": {
                "description": "Which preview: the draft_id create_preview returned, a 43-character key of letters, digits, - and _ (stray quotes or punctuation around it are ignored). It is not the code in the preview's link. Leave it out for a kept site, which site names.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "operations": {
                "description": "On a preview only: the changes to save, 1 to 500, in the same form propose_edit takes, saved all at once or not at all. Not used on a kept site, where proposal_id names the staged set.",
                "items": {
                  "properties": {
                    "body": {
                      "description": "For a create, and needed for one: the page's full markdown. For an update: markdown that replaces all of the page's text; leave it out to change only the title. Not used for a delete or a move.",
                      "maxLength": 1000000,
                      "type": "string"
                    },
                    "op": {
                      "description": "What to do to one page: create (a new page at path), update (change the page at path), delete (remove it) or move (give it the new address to_path).",
                      "enum": ["create", "update", "delete", "move"],
                      "type": "string"
                    },
                    "path": {
                      "description": "The page's address within the preview, like /pricing or /guides/setup, up to 512 characters; it is stored lower-cased. For an update, a delete or a move, the page's current address. The front page's address is /.",
                      "maxLength": 512,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "description": "For a create or an update: the page's title, up to 200 characters. Left out of an update, the title stays as it is. A move keeps the title and refuses a new one.",
                      "maxLength": 200,
                      "minLength": 1,
                      "type": "string"
                    },
                    "to_path": {
                      "description": "For a move only, and needed for one: the new address, in the same form as path, like /guides/pricing.",
                      "maxLength": 512,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["op", "path"],
                  "type": "object"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "proposal_id": {
                "description": "On a kept site: the reference propose_edit returned, also listed by site_status. A reference can be kept once, within 24 hours of being proposed. Not used on a preview.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "site": {
                "description": "Which site: its name (like Acme Docs), its Documarium address (like acme.documarium.com) or the short name in that address (like acme); a custom domain is not accepted. Leave it out when this connection covers one site; when it covers several and site is left out, nothing is done and the answer names them. A preview is not one of these sites; draft_id names a preview.",
                "maxLength": 262,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Keep a change"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
