                "maxLength": 262,
                "type": "string"
              },
              "site_name": {
                "description": "The name shown at the top of every page.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "theme": {
                "description": "The theme preset: base, slab, space or paper.",
                "enum": ["base", "slab", "space", "paper"],
