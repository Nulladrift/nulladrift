        {
          "name": "publish",
          "title": "Publish",
          "description": "Publishes a kept site: its latest kept version goes out to readers at the site's address and replaces what they saw. It answers at once, the publish starts in about a minute and readers see it shortly after, and site_status shows the progress. Only kept versions go out, so changes from propose_edit need apply_edit first, and the site needs a front page at /. Publishing needs a paid plan with room for the site; without one nothing goes out and the answer says so. When the site has already published as often as its plan allows that day or month, the version waits and goes out on its own later. A writer on the site cannot publish; an editor or admin can. A site whose content was brought from somewhere else needs, once, the person's confirmation that it is theirs to publish (rights_confirmed). Given the draft_id of a preview nobody has kept yet, it first keeps the preview exactly as claim_draft does, under the name given as subdomain, and then publishes it; if it cannot publish, the preview stays kept and the answer says why. To keep a preview without publishing it, claim_draft is the tool, and it needs no paid plan. rollback goes back to an earlier version.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "draft_id": {
                "description": "Which preview: the draft_id create_preview returned, a 43-character key of letters, digits, - and _ (stray quotes or punctuation around it are ignored). It is not the code in the preview's link. Leave it out for a kept site, which site names.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "rights_confirmed": {
                "description": "Say true only after the person has confirmed, in this conversation, that the content is theirs or they have permission to publish it. Needed once, for a site whose content was brought from somewhere else.",
                "type": "boolean"
              },
              "site": {
                "description": "Which site: its name (like Acme Docs), its Documarium address (like acme.documarium.com) or the short name in that address (like acme); a custom domain is not accepted. Leave it out when this connection covers one site; when it covers several and site is left out, nothing is done and the answer names them. A preview is not one of these sites; draft_id names a preview.",
                "maxLength": 262,
                "type": "string"
              },
              "subdomain": {
                "description": "Only with the draft_id of a preview nobody has kept yet: the name for its web address, like acme for acme.documarium.com. 3 to 63 lower-case letters, digits and hyphens, not starting or ending with a hyphen; some names are reserved. Left out, or taken, the answer offers names that are free and nothing is kept or published.",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              }
