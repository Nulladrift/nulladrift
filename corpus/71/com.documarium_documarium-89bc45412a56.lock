        {
          "name": "propose_edit",
          "title": "Propose a change",
          "description": "Stages a set of page changes (create, update, delete or move) for review, without keeping any of them. On a kept site it returns a link that shows the site with the changes for 24 hours and can be shared, the reference apply_edit takes to keep them, and any links the changes would break; readers see nothing until the set is kept and published. On a preview, given its draft_id, it only reports what the changes would do, and apply_edit with the same operations saves them. The operations are checked together: if one is refused, none is staged. A change that would take the site past its plan's room for pages or storage is refused. It is the first step of every change to a kept site's pages, except going back to an earlier version, which rollback does; a preview of new content starts with create_preview.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "draft_id": {
                "description": "Which preview: the draft_id create_preview returned, a 43-character key of letters, digits, - and _ (stray quotes or punctuation around it are ignored). It is not the code in the preview's link. Leave it out for a kept site, which site names.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "operations": {
                "description": "The changes to stage, one operation per page, 1 to 500 of them. They are staged together, all of them or none.",
                "items": {
                  "properties": {
                    "body": {
                      "description": "For a create: the page's full markdown. For an update: markdown that replaces all of the page's text; leave it out to change only the title. Not used for a delete or a move.",
                      "maxLength": 1000000,
                      "type": "string"
                    },
                    "op": {
                      "description": "What to do to one page: create (a new page at path), update (change the page at path), delete (remove it) or move (give it the new address to_path).",
                      "enum": ["create", "update", "delete", "move"],
                      "type": "string"
                    },
                    "path": {
                      "description": "The page's address, like /pricing or /guides/setup: lower-case letters, digits and hyphens between slashes, up to 512 characters. For an update, a delete or a move, the page's current address. The front page's address is /.",
                      "maxLength": 512,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
