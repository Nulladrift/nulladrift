        },
        {
          "name": "claim_draft",
          "title": "Keep this site",
          "description": "Keeps a preview nobody has kept yet as a site in the signed-in person's own account, at the web address named by subdomain. Its pages come over as they are and nothing is published: the site gets a private link, and readers see it only after publish. Keeping needs no paid plan. Without a subdomain, or with one that is taken, the answer offers names that are free and nothing is kept. It is the tool for keeping a preview without publishing it; publish with the same draft_id and subdomain keeps and publishes in one call, which needs a paid plan. The subdomain is the web address, not the name shown at the top of the pages, which set_branding sets. Keeping a preview confirms the content is yours, or that you have permission to publish it; this is recorded.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "draft_id": {
                "description": "The preview to keep: the draft_id create_preview returned, a 43-character key, not the code in the preview's link.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "subdomain": {
                "description": "The name for the site's web address, like acme for acme.documarium.com: 3 to 63 lower-case letters, digits and hyphens, not starting or ending with a hyphen; some names are reserved. Left out, or taken, the answer offers names that are free and nothing is kept.",
                "maxLength": 63,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Keep this site"
          },
          "behavior": {
            "destructive": true,
