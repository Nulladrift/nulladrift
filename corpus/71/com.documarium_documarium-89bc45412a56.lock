        {
          "name": "site_status",
          "title": "Check a site",
          "description": "Reports the state of one site, or of a preview given its draft_id, at the moment of the call.\nFor a kept site: its name and address; whether readers can see it, and at which version; whether a publish is under way; when it was last published; whether the last publish failed, and at which file and line; and, when the site has published as often as its plan allows for the day or month, when waiting changes go out. Someone whose role lets them keep changes also gets the changes waiting to be kept, each with a link to read it and the reference apply_edit takes.\nFor a preview: its link, its number of pages, how many hours it has left and, for someone not signed in, how many more changes it can take before it is kept.\nWith site left out on a connection that covers several sites, it lists them by name and address.\nIt answers what readers see now and what is waiting: history lists past versions and who made them, and list_pages lists the pages.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "draft_id": {
                "description": "Which preview: the draft_id create_preview returned, a 43-character key of letters, digits, - and _ (stray quotes or punctuation around it are ignored). It is not the code in the preview's link. Leave it out for a kept site, which site names.",
