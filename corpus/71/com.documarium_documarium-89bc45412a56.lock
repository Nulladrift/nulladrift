        {
          "name": "find_references",
          "title": "Find every mention",
          "description": "Finds the passages in a site that state a fact, and returns each with its page address, its line numbers and its text, best match first. On a kept site it matches meaning, so passages that say the fact in other words are found too, each with a confidence from 0 to 1; if that search cannot answer in time or fails, a plain word match comes back instead and the answer says so. On a preview, given its draft_id, it matches words only. Before a fact such as a refund window, a limit or a product name changes, it shows every page that states it, so one propose_edit can change them all. read_page reads a whole page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "draft_id": {
                "description": "Which preview: the draft_id create_preview returned, a 43-character key of letters, digits, - and _ (stray quotes or punctuation around it are ignored). It is not the code in the preview's link. Leave it out for a kept site, which site names.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "query": {
                "description": "The fact to look for, in plain words, 3 to 500 characters, like how long the refund window is. On a kept site, passages that say it differently are found too.",
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              },
              "site": {
                "description": "Which site: its name (like Acme Docs), its Documarium address (like acme.documarium.com) or the short name in that address (like acme); a custom domain is not accepted. Leave it out when this connection covers one site; when it covers several and site is left out, nothing is done and the answer names them. A preview is not one of these sites; draft_id names a preview.",
                "maxLength": 262,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find every mention"
