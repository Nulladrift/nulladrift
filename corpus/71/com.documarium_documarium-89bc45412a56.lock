        {
          "name": "history",
          "title": "See what changed",
          "description": "Lists a kept site's numbered versions, newest first, a page of them at a time: each line is the version number, what changed, who changed it and the date. When older visible versions remain, the answer gives the starting_before value that lists the next page. Given compare_from and compare_to, it instead lists each page that differs between those two versions, as added, removed or the number of lines added and removed. How far back versions can be seen depends on the site's plan; older ones are still kept, and the answer says where the visible ones start. It answers what changed and when: site_status says what readers see now, and rollback takes these version numbers. A preview has no history until it is kept.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "compare_from": {
                "description": "The earlier of two version numbers to compare, as this list shows them, like 3. Give compare_to with it; one without the other is refused. A version older than the site's plan lets it see is refused.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "compare_to": {
                "description": "The later of two version numbers to compare, like 5. Give compare_from with it.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              },
              "site": {
                "description": "Which site: its name (like Acme Docs), its Documarium address (like acme.documarium.com) or the short name in that address (like acme); a custom domain is not accepted. Leave it out when this connection covers one site; when it covers several and site is left out, nothing is done and the answer names them. A preview is not one of these sites; draft_id names a preview.",
                "maxLength": 262,
                "type": "string"
              },
              "starting_before": {
                "description": "To see older versions: the version number the previous answer gave after starting_before, like 41; the list then starts at that version and goes back. Leave it out to start from the newest.",
                "maxLength": 32,
                "type": "string"
              }
            },
            "type": "object"
