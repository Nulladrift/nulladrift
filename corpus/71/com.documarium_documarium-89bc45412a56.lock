        {
          "name": "rollback",
          "title": "Go back",
          "description": "Puts a kept site, or chosen pages of it, back to how they were at an earlier version. The result is saved as a new version, so no version is lost and a rollback can be undone by going back again; when nothing would change, no version is saved. If the site is published, it republishes by itself and readers see the restored pages, unless the site has already published as often as its plan allows that day or month, when it goes out on its own later. Only versions the site's plan lets it see can be chosen, by the numbers history lists. A writer on the site cannot roll back, and someone who looks after part of a site names those pages. It is for going back to a version; propose_edit makes a new change to a page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "pages": {
                "description": "The addresses of the pages to put back, like [\"/pricing\", \"/guides/setup\"], up to 500. A named page that did not exist at that version is removed; one that exists in neither version is refused. Leave it out to put the whole site back.",
                "items": {
                  "maxLength": 512,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 500,
                "type": "array"
              },
              "site": {
                "description": "Which site: its name (like Acme Docs), its Documarium address (like acme.documarium.com) or the short name in that address (like acme); a custom domain is not accepted. Leave it out when this connection covers one site; when it covers several and site is left out, nothing is done and the answer names them. A preview is not one of these sites; draft_id names a preview.",
                "maxLength": 262,
                "type": "string"
              },
              "to_version": {
                "description": "The version number to go back to, as history lists it, like 4. A number that does not exist, or that is older than the site's plan lets it see, is refused, and the answer names the newest version, or the oldest one this site can go back to.",
                "maximum": 9007199254740991,
                "minimum": 1,
                "type": "integer"
              }
