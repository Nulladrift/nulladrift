        },
        {
          "name": "create_preview",
          "title": "Create a preview site",
          "description": "Creates a temporary preview site from pages already converted to markdown, and returns its link and its draft_id. The preview belongs to no one until somebody keeps it, and expires if nobody does. The result says what to check, page by page, before the link is shared.\nIt is the tool for content that has no site yet. A preview's pages are then changed with apply_edit and its draft_id; claim_draft keeps it, and publish keeps and publishes it in one call. A kept site is changed with propose_edit and apply_edit.\nIt takes one entry per page; a record of where the content came from, exactly as it happened: a code repository, a documentation site, a product landing page, writing supplied in this conversation, a file attached to it, or nothing, when it was drafted from what the person described, with the address when there is one; the product's name; and, when the source shows one, the address of its logo.\nIt reads no source itself: a call with no pages is answered with what to send instead. A source past the preview's page or size limit is refused, and the answer gives the limits.\nWhich pages come over from a source with many pages is the person's choice, made after they see what was found and before it is converted: everything, one part, or a new structure. When they have already named the pages, that choice is made.\nPages arrive finished, with no notes, placeholders, open questions or marks. A page with a note to its author, such as [GAP], [?] or TODO, is refused. Where the source is silent, a page carries the best answer and what was assumed is said in the conversation. On a legal page, the business's legal name, its address, the country whose law applies and who else handles its customers' data come only from the person or their source; a page missing one of them still reads complete without it, and what was assumed is said in the conversation.\nThe page list is short: every page should be one a reader would open on its own; contact details and short notes belong inside another page.\nEvery page, title and heading is in the site's language, passed as languages, like [\"de\"]. A translated copy is every page again, translated, at the same address under /<code>/ (/es/guides/setup), with its code listed after the site's own.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "attribution": {
                "description": "The code a starter prompt gives to pass here, when the conversation began from one. Leave it out otherwise.",
                "maxLength": 256,
                "type": "string"
              },
              "languages": {
                "description": "The site's language as a code, like en, ru or pt-BR — the language every page, title and heading is written in.",
                "items": {
                  "pattern": "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$",
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "logo_shows_name": {
                "description": "true when the logo image itself spells the name, so the name is not printed again beside it. Leave it out otherwise.",
                "type": "boolean"
              },
              "logo_url": {
                "description": "A direct https address of the product's logo as the source shows it in its header — the mark, not a banner or a picture made for social media. Leave it out if the source has none.",
                "format": "uri",
                "maxLength": 2048,
                "type": "string"
              },
              "pages": {
                "description": "The pages, already converted to markdown. One entry per page.",
                "items": {
                  "properties": {
                    "markdown": {
                      "description": "The page content, already converted to markdown.",
                      "maxLength": 20971520,
                      "type": "string"
                    },
                    "path": {
                      "description": "The address of the page, like /guides/setup. The front page's address is /.",
                      "maxLength": 2048,
                      "minLength": 1,
                      "type": "string"
                    },
                    "title": {
                      "description": "The page title, if it has one.",
                      "maxLength": 512,
                      "type": "string"
                    }
                  },
                  "required": ["markdown", "path"],
                  "type": "object"
                },
                "maxItems": 1000,
                "type": "array"
              },
              "site_name": {
                "description": "The name of the product or company the site is about, as the source writes it. It is shown at the top of every page.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "source": {
                "description": "Where this content came from, exactly as it happened.",
                "properties": {
                  "kind": {
                    "description": "Where the content came from: a code repository, a documentation site, a product landing page, writing supplied directly here, a file attached to this conversation, or nothing — drafted here from what the person described.",
                    "enum": ["repo", "docs_url", "landing_page", "paste", "file", "scratch"],
                    "type": "string"
                  },
                  "ref": {
                    "description": "The address it came from, like https://github.com/acme/docs, when there is one.",
                    "maxLength": 2048,
                    "type": "string"
                  }
                },
                "required": ["kind"],
                "type": "object"
              }
            },
            "required": ["source"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
