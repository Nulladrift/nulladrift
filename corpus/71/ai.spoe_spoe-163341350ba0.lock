{
  "lockfileVersion": 2,
  "subjects": {
    "ai.spoe/spoe": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://spoe.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "spoe",
        "title": "SPOE",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "SPOE is a private AI app builder whose users own and export their code. check_handle works without a key. Everything else acts on the SPOE account whose developer API key is sent as \"Authorization: Bearer spoe_sk_...\" (made at https://spoe.ai/settings, under API keys). Two ways to build. create_app: SPOE's own AI builds it, for credits; tell the user the estimate. Or build it yourself: new_project (free), read_file and list_files to see the starter, write_files to send whole files (checked and reviewed by a second AI, for the review's credits), then change_status until it is applied, fixing what the findings say; check_project runs the free ship check before the owner publishes. The owner previews, publishes and exports from the studio link.",
      "tools": [
        {
          "name": "app_status",
          "title": "Where a build has got to",
          "description": "Show where an app on this account stands: its latest build (queued, generating, reviewing, waiting for the owner, applied, failed), the review's verdict, and its live address when published.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "description": "The project id from create_app or list_apps.",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f7eb3184123f48895e8feac60031bb253b08576ea07782019dc48750c6325833"
        },
        {
          "name": "change_status",
          "title": "What the checks and the review said",
          "description": "Where a change sent with write_files stands: being reviewed, applied, or waiting for the owner, with every finding (severity, file, line, what is wrong and how to fix it). Fix the findings and send the files again with write_files.",
          "inputSchema": {
            "properties": {
              "change_id": {
                "description": "The change id write_files returned.",
                "type": "string"
              }
            },
            "required": ["change_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Change status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2ee254c1a5c967562a669cdc3ae65dbcd65c99c9a42f68b243df80997c5859f8"
        },
        {
          "name": "check_handle",
          "title": "Check a name on every platform",
          "description": "Check whether a brand name or username is free on X, YouTube, LinkedIn, GitHub, Shopify, Bluesky, Snapchat and more (29 platforms), and on the main domain endings (.com, .ai, .io, .com.au and others). Each platform is only trusted while it still calls a certainly-taken name taken; platforms that refuse checks (Instagram, TikTok, Facebook, Reddit) come back as \"check yourself\" with a link. Free, no API key needed.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "The brand name or handle, like \"rosiebakes\" or \"@rosie_bakes\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check a name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d4fc1130d27dd4e800f616bd5619a8280afb334e2661e05a49a062d48cf97982"
        },
        {
          "name": "check_project",
          "title": "Run the ship check",
          "description": "SPOE's ship check on the project as it stands, free and with no AI: keys written in the code, SQL or shell commands built from text, raw HTML, cookies accepted from any site, routes that change data without sign-in, and what search engines will miss. The same check every export ships as check.mjs. A critical finding stops a publish until the owner confirms it, so fix those with write_files first.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Ship check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:398a69b0062c83e1d71454ce445e23768a7b0e44d0cf3c436027a395aa2bb0fb"
        },
        {
          "name": "create_app",
          "title": "Build a new app or website",
          "description": "Start building a new app, website or game on SPOE from a description. kind \"website\" makes a plain HTML site (fast, can be published at name.spoe.dev); kind \"app\" makes a full-stack Next.js, Fastify and Postgres app; kind \"game\" makes a browser game (Phaser for 2D, Three.js for 3D) that plays on a computer and a phone, can be published at name.spoe.dev, and borrows the mechanics of any games it is asked to be like, never their names, characters or art. A second AI from another model family reviews the change. Costs credits from the account: estimated first, charged when the build finishes, never if it fails. Returns the studio link to watch it and the project id for app_status.",
          "inputSchema": {
            "properties": {
              "description": {
                "description": "What to build, in plain words: who it is for, the pages, what it should do. For a game: the kind of game, games it should be like, the controls and the goal.",
                "type": "string"
              },
              "kind": {
                "description": "website (plain HTML), app (full stack) or game (a browser game). Default website.",
                "enum": ["website", "app", "game"],
                "type": "string"
              },
              "name": {
                "description": "A short name for the project.",
                "type": "string"
              }
            },
            "required": ["description", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Build an app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:b400e7aac6a33054b15b028824e7a8cb8aeffb3bc6ac333407bf591e34e511d3"
        },
        {
          "name": "list_apps",
          "title": "List my SPOE apps",
          "description": "List the apps, websites and games on the SPOE account this API key belongs to, newest first, with their studio links.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my apps"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da0057a0332a5a0b31ca3eb6e2c6c30f40a3ab55afb4290d779e3118364ed6d7"
        },
        {
          "name": "list_files",
          "title": "List a project's files",
          "description": "Every file in a project on this account, with its size. Files in site/vendor/ are game engines and generated files are made by SPOE: read them, never write them.",
          "inputSchema": {
            "properties": {
              "project_id": {
                "description": "The project id from new_project, create_app or list_apps.",
                "type": "string"
              }
            },
            "required": ["project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:40c75bf09ee04bf5b2264f68f522029d9a413d0608a06d26ebd2c35bde5c95e7"
        },
        {
          "name": "new_project",
          "title": "Start an empty project to write yourself",
          "description": "Make a new SPOE project from SPOE's starter, with nothing built yet and nothing charged, for you to write with write_files. kind \"app\": Next.js 15 (web/, app router, React 19) with a Fastify API (api/src) on Postgres (migrations in api/migrations, numbered .sql files), owner pages behind ADMIN_PASSWORD, and a rate limiter in api/src/limits.js. kind \"website\": plain HTML, CSS and JavaScript in site/. kind \"game\": Phaser 3 or Three.js in site/, with the engines in site/vendor/ (never edit those). Returns the project id, its studio link (live preview, publish, export) and the starter's files.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "app (full stack), website (plain HTML) or game. Default app.",
                "enum": ["website", "app", "game"],
                "type": "string"
              },
              "name": {
                "description": "A short name for the project.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "New empty project"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0744e99e52d63a5aaa222bc3a3a662c2c78e578a028fb27659f2f6124e5bef09"
        },
        {
          "name": "read_file",
          "title": "Read a file",
          "description": "One file of a project on this account, as it stands now (with every applied change and the owner's own edits).",
          "inputSchema": {
            "properties": {
              "path": {
                "description": "The file's path, like web/app/page.tsx or site/index.html.",
                "type": "string"
              },
              "project_id": {
                "type": "string"
              }
            },
            "required": ["path", "project_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a file"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b04517a9adf5c2ab9939413a74423076aa7ab3532a6788aec9f560ae81777e4a"
        },
        {
          "name": "write_files",
          "title": "Write files, checked and reviewed",
          "description": "Send a change: whole files to write (path and full content) and files to delete. SPOE checks it (for an app: its migrations on a fresh Postgres and its API routes) and a second AI from another model family reviews it. On a project that applies changes on its own (the default) a change the review passes goes in as a version the owner can undo; one with a high or critical finding, or over a file the owner edited since, waits for the owner in the studio. Costs only the review's credits (estimated now, charged when it finishes, never if it fails). Then call change_status: fix what the findings say and send the files again.",
          "inputSchema": {
            "properties": {
              "files": {
                "description": "Up to 200 files, 3 MB of text in all. Each is { path, content } to write the whole file, or { path, delete: true }.",
                "items": {
                  "properties": {
                    "content": {
                      "description": "The whole file.",
                      "type": "string"
                    },
                    "delete": {
                      "type": "boolean"
                    },
                    "path": {
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "type": "array"
              },
              "project_id": {
                "type": "string"
              },
              "summary": {
                "description": "What this change does, in a sentence or two. The reviewer reads it beside the files.",
                "type": "string"
              }
            },
            "required": ["files", "project_id", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Write files"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:2fa5df9831a1c26cf19f461824cf3abb2a2674f3cbdca46c970f9978fc66ae12"
        }
      ],
      "digest": "sha256:0d3c7c0408ad3e63d5ae3ed49a4d0e927a8ae0352c007cda072219a295b7dbf6"
    }
  }
}
