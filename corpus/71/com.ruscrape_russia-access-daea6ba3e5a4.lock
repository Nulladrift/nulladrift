          "name": "run_code",
          "description": "Run agent code (python / javascript / bash) in an isolated sandbox (no network, CPU/RAM/time\n    limits) and get stdout/stderr/exit_code back. Charged from agent balance; returns payment_required\n    if insufficient (then topup_balance and retry).",
