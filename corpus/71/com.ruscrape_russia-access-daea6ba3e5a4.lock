          "description": "Get a Russian IP proxy to access RU-only sites (Wildberries, Ozon, Yandex, hh.ru, Avito)\n    that block foreign IPs. Charged from agent balance; returns payment_required if insufficient\n    (then call topup_balance and retry). Idempotent per agent.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "title": "Agent Id",
                "type": "string"
              },
              "count": {
                "default": 1,
                "title": "Count",
                "type": "integer"
              },
              "period_days": {
                "default": 30,
                "title": "Period Days",
                "type": "integer"
