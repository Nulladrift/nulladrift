        },
        {
          "name": "x402_seller_reputation",
          "description": "Reputation of an x402 payment recipient: weekly revenue, unique buyers, average ticket, what\n    they sell, and our organic-vs-farm verdict. Few unique buyers against sizeable revenue is the\n    signature of volume washing — six addresses with exactly 5 buyers each accounted for 45% of the\n    top-100 revenue in our last measurement.",
          "inputSchema": {
            "properties": {
              "address": {
                "title": "Address",
                "type": "string"
