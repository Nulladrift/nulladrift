      "instructions": "Russian Web Data Access for AI agents. Flagship tool fetch_ru(agent_id, url): give a URL of any Russian website or API, get its HTML/JSON fetched through a Russian IP — works on sites that block foreign traffic (Wildberries, Ozon, Yandex Market, hh.ru, Avito). Pay-per-use: on insufficient balance tools return payment_required → call topup_balance (x402/USDC or RUB) and retry. No human signup. Secondary: get_ru_proxy (raw RU IP), register_ru_domain (.ru/.рф).",
