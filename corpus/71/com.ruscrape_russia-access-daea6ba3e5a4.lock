        {
          "name": "fetch_web",
          "description": "Give a URL of ANY website or API — get its content (HTML/JSON) fetched through an IP of the\n    chosen country (country='ru','us','de','gb',...). Flagship tool — URL in, content out, no proxy setup.\n    Specialty: country='ru' unlocks Russia-only sites that block foreign IPs (Wildberries, Ozon, Yandex\n    Market, hh.ru, Avito). Set residential=true for sites that block datacenter IPs.\n    Set render=true to render JS in a real headless Chromium (SPA / JS-heavy / JS-challenge sites).\n    Charged from agent balance; returns payment_required if insufficient (then topup_balance and retry).",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "title": "Agent Id",
                "type": "string"
              },
              "country": {
                "default": "ru",
                "title": "Country",
                "type": "string"
              },
              "render": {
                "default": false,
                "title": "Render",
                "type": "boolean"
              },
              "residential": {
                "default": false,
                "title": "Residential",
                "type": "boolean"
              },
              "url": {
                "title": "Url",
                "type": "string"
              }
            },
            "required": ["agent_id", "url"],
            "title": "fetch_webArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
