        },
        {
          "name": "x402_service_check",
          "description": "Check ANY x402 endpoint BEFORE paying it. Payments in x402 are irreversible — there is no\n    dispute button — and by our measurement 1 in 6 listed services is dead while 76% of Base volume\n    comes from wash-trading farms. Returns: liveness verdict from our probes, current and historical\n    price, the receiving address, and an organic-vs-farm verdict on that seller. Built on our own\n    daily snapshots since 2026-06-16; no public source has this history.",
          "inputSchema": {
            "properties": {
              "agent_id": {
                "title": "Agent Id",
                "type": "string"
