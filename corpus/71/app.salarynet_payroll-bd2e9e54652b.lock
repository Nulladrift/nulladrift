{
  "lockfileVersion": 2,
  "subjects": {
    "app.salarynet/payroll": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://salarynet.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "salarynet",
        "version": "1.5.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use calculate_net_pay for take-home pay / payroll tax questions and calculate_employer_cost for the total cost of hiring, in the US, Philippines, Nigeria, Indonesia, India, Brazil, Kenya, Vietnam, Mexico, South Africa, Türkiye, Colombia, Pakistan, Egypt, Chile, Peru, Bangladesh, Argentina, Ghana, Saudi Arabia, the UAE, Thailand, Malaysia, Morocco, Poland, Portugal, Romania, Spain, Kazakhstan, Uzbekistan, Sri Lanka, Nepal, Ecuador, Costa Rica, the Dominican Republic, Ethiopia, Tanzania, Uganda, Rwanda, Zambia, Qatar, Kuwait, Oman, Bahrain, Jordan, Guatemala, Panama, Uruguay, Paraguay and Bolivia.",
      "tools": [
        {
          "name": "calculate_employer_cost",
          "description": "Total cost of employing someone: gross salary plus employer social security, health, pension and mandatory accruals (13th month etc.) in a supported country. Returns items, total cost, cost multiplier and sources.",
          "inputSchema": {
            "properties": {
              "country": {
                "enum": ["us", "ph", "ng", "id", "in", "br", "ke", "vn", "mx", "za", "tr", "co", "pk", "eg", "cl", "pe", "bd", "ar", "gh", "sa", "ae", "th", "my", "ma", "pl", "pt", "ro", "es", "kz", "uz", "lk", "np", "ec", "cr", "do", "et", "tz", "ug", "rw", "zm", "qa", "kw", "om", "bh", "jo", "gt", "pa", "uy", "py", "bo"],
                "type": "string"
              },
              "gross": {
                "description": "Gross salary in local currency (same period as calculate_net_pay).",
                "type": "number"
              },
              "options": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["country", "gross"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b5dcd3cfbadd262235c490eb053200dd2575a75e2591e459c1524565ccd60309"
        },
        {
          "name": "calculate_net_pay",
          "description": "Gross-to-net payroll: take-home pay, income tax and statutory contributions for a salary in a supported country (us, ph, ng, id, in, br, ke, vn, mx, za, tr, co, pk, eg, cl, pe, bd, ar, gh, sa, ae, th, my, ma, pl, pt, ro, kz, uz, lk, np, ec, cr, do, et, tz, ug, rw, zm, qa, kw, om, bh, jo, gt, pa, uy, py, bo). Returns a breakdown, rule version and official sources.",
          "inputSchema": {
            "properties": {
              "country": {
                "enum": ["us", "ph", "ng", "id", "in", "br", "ke", "vn", "mx", "za", "tr", "co", "pk", "eg", "cl", "pe", "bd", "ar", "gh", "sa", "ae", "th", "my", "ma", "pl", "pt", "ro", "es", "kz", "uz", "lk", "np", "ec", "cr", "do", "et", "tz", "ug", "rw", "zm", "qa", "kw", "om", "bh", "jo", "gt", "pa", "uy", "py", "bo"],
                "type": "string"
              },
              "gross": {
                "description": "Gross salary in local currency: annual for us, in and es; monthly for ph, ng, id, br, ke, vn, mx, za, tr, co, pk, eg, cl, pe, bd, ar, gh, sa, ae, th, my, ma, pl, pt, ro, kz, uz, lk, np, ec, cr, do, et, tz, ug, rw, zm, qa, kw, om, bh, jo, gt, pa, uy, py, bo.",
                "type": "number"
              },
              "options": {
                "additionalProperties": true,
                "description": "Optional country-specific inputs, same names as /v1/net query params (e.g. filing_status, dependents, married, rent_annual).",
                "type": "object"
              }
            },
            "required": ["country", "gross"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9699b1fc2949ba1fba705d2b56bbfe3ef69ecd5c93b5be67c3bb51702ef829e0"
        },
        {
          "name": "calculate_severance",
          "description": "Cost of terminating an employee in Brazil, Mexico or the Philippines: statutory severance, notice, proportional 13th month/aguinaldo, vacation and FGTS items, with the legal rule per line. Dates are YYYY-MM-DD; reason depends on country (ph: redundancy, retrenchment, closure, disease, just_cause, resignation, mutual; br: dismissal, mutual, resignation, just_cause; mx: dismissal, resignation, mutual).",
          "inputSchema": {
            "properties": {
              "country": {
                "enum": ["ph", "br", "mx"],
                "type": "string"
              },
              "end_date": {
                "type": "string"
              },
              "monthly_gross": {
                "type": "number"
              },
              "options": {
                "additionalProperties": true,
                "type": "object"
              },
              "reason": {
                "type": "string"
              },
              "start_date": {
                "type": "string"
              }
            },
            "required": ["country", "end_date", "monthly_gross", "reason", "start_date"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:55a14e4d9a1f3d4013f967ed2352d4b01f9dcbd58726e88059b1548f6c656c72"
        },
        {
          "name": "list_countries",
          "description": "List supported countries with currency, tax year, rule version, scope and sources.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e43498136dd95242526af1195bf4673f4f8817dedb86ed4fc2d32d94ad144cd8"
        }
      ],
      "digest": "sha256:ae873b10b702510be748c0836bb14532d1377fb9596ae7817146e4c0ad46051a"
    }
  }
}
