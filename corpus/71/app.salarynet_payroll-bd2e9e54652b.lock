{
  "lockfileVersion": 2,
  "subjects": {
    "app.salarynet/payroll": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://salarynet.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "salarynet",
        "version": "1.3.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use calculate_net_pay for take-home pay / payroll tax questions and calculate_employer_cost for the total cost of hiring, in the US, Philippines, Nigeria, Indonesia, India, Brazil, Kenya, Vietnam, Mexico, South Africa, Türkiye, Colombia, Pakistan, Egypt, Chile, Peru, Bangladesh, Argentina, Ghana, Saudi Arabia, the UAE, Thailand, Malaysia, Morocco, Poland, Portugal, Romania, Spain, Kazakhstan, Uzbekistan, Sri Lanka, Nepal, Ecuador, Costa Rica and the Dominican Republic.",
      "tools": [
        {
          "name": "calculate_employer_cost",
          "description": "Total cost of employing someone: gross salary plus employer social security, health, pension and mandatory accruals (13th month etc.) in a supported country. Returns items, total cost, cost multiplier and sources.",
          "inputSchema": {
            "properties": {
              "country": {
                "enum": ["us", "ph", "ng", "id", "in", "br", "ke", "vn", "mx", "za", "tr", "co", "pk", "eg", "cl", "pe", "bd", "ar", "gh", "sa", "ae", "th", "my", "ma", "pl", "pt", "ro", "es", "kz", "uz", "lk", "np", "ec", "cr", "do"],
                "type": "string"
              },
              "gross": {
                "description": "Gross salary in local currency (same period as calculate_net_pay).",
                "type": "number"
              },
              "options": {
                "additionalProperties": true,
                "type": "object"
              }
            },
            "required": ["country", "gross"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:05f569dc6d4a2a3251735a7cef831d89ab5185f52d045dfa33c547dcaf42dd3d"
        },
        {
          "name": "calculate_net_pay",
          "description": "Gross-to-net payroll: take-home pay, income tax and statutory contributions for a salary in a supported country (us, ph, ng, id, in, br, ke, vn, mx, za, tr, co, pk, eg, cl, pe, bd, ar, gh, sa, ae, th, my, ma, pl, pt, ro, es, kz, uz, lk, np, ec, cr, do). Returns a breakdown, rule version and official sources.",
          "inputSchema": {
            "properties": {
              "country": {
                "enum": ["us", "ph", "ng", "id", "in", "br", "ke", "vn", "mx", "za", "tr", "co", "pk", "eg", "cl", "pe", "bd", "ar", "gh", "sa", "ae", "th", "my", "ma", "pl", "pt", "ro", "es", "kz", "uz", "lk", "np", "ec", "cr", "do"],
                "type": "string"
              },
              "gross": {
                "description": "Gross salary in local currency: annual for us and in; monthly for ph, ng, id, br, ke, vn, mx, za, tr, co, pk, eg, cl, pe, bd, ar, gh, sa, ae, th, my, ma, pl, pt, ro, es, kz, uz, lk, np, ec, cr, do.",
                "type": "number"
              },
              "options": {
                "additionalProperties": true,
                "description": "Optional country-specific inputs, same names as /v1/net query params (e.g. filing_status, dependents, married, rent_annual).",
                "type": "object"
              }
            },
            "required": ["country", "gross"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:275707240a1049253f8cba1b9cefaa47585cc8ca5ede134b063b043497c54668"
        },
        {
          "name": "list_countries",
          "description": "List supported countries with currency, tax year, rule version, scope and sources.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e43498136dd95242526af1195bf4673f4f8817dedb86ed4fc2d32d94ad144cd8"
        }
      ],
      "digest": "sha256:fb1bb7d1e683a1ae7f95e4272cca54b96842f8e437723d76d085e935572757c0"
    }
  }
}
