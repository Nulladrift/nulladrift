        {
          "name": "check_oboe_f_fingering_choice",
          "title": "Oboe Regular F vs Left F vs Forked F Voice-Leading Resolver",
          "description": "Determine whether to finger Regular Side F, Left F, or Forked F given the preceding and following notes so fingers never slide across keys.",
          "inputSchema": {
            "properties": {
              "nextNote": {
                "description": "Following note (e.g. \"D4\", \"G4\", \"Db4\")",
                "type": "string"
              },
              "previousNote": {
                "description": "Preceding note (e.g. \"D4\", \"Eb4\", \"E4\")",
                "type": "string"
              }
            },
            "required": ["nextNote", "previousNote"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Oboe Regular F vs Left F vs Forked F Voice-Leading Resolver"
