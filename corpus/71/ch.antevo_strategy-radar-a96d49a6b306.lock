      "instructions": "Strategy Radar, by Antevo. What changed today for a company's strategy.\n\nEvery morning Antevo writes a business board: the risks and opportunities for companies from trade, regulation, supply, shipping, energy, demand, currencies, funding, labour, technology, cyber, geopolitics and climate. Each entry carries its theme, the exposures it touches, its impact, likelihood and trend in words, why it matters with a date, what to watch, the event that would make a response right, and two or three possible responses with their reasons.\n\nThe matching happens here, in the user's assistant. The set-up asks a company five short questions; the answers stay with the assistant and never reach Antevo, and no tool here takes company details. Each morning the assistant reads the day's board and keeps what touches that company.\n\nUse it when someone wants to know what changed for their company's strategy, which outside risks and opportunities touch their business, or wants a morning radar for their company.\n\nOptions on the board are possible responses with reasons, never advice. Public, no account, no personal data.",
      "tools": [
        {
          "name": "get_business_board",
          "title": "Business board",
          "description": "What changed for a company's strategy today: Antevo's business board for the day, the board behind Strategy Radar. Risks and opportunities for companies from trade, regulation, supply, shipping, energy, demand, currencies, funding, labour, technology, cyber, geopolitics and climate. Each entry carries its theme, exposure tags, impact, likelihood and trend in words, why it matters with a date, what to watch, the event that would make a response right, and two or three possible responses with their reasons. Pass as_of (YYYY-MM-DD) for a past board within the last 400 days. Takes no company details; matching to a company happens in the company's own assistant.",
