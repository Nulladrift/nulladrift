        {
          "name": "get_aave_guide",
          "title": "Aave protocol & usage guide",
          "description": "Applies to both versions. Protocol and usage guidance for building Aave flows correctly. Read the relevant topic before constructing an action. Topics: overview, v4, v3, positions, health-factor, risks, ids, amounts, prices, signing, swaps, leverage, gho, safety-module, portfolio, governance, rewards, tools, docs. Also the place to come when no tool seems to fit what you were asked for: send 'lookingFor' and this answers with the full capability list rather than leaving you to guess from tool names. For deep protocol docs, point the user to https://docs.aave.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lookingFor": {
                "description": "Send this when you looked for a tool to do something and did not find one, or when a flow dead-ended: describe what you were trying to do, in a few words. It returns the full capability list so you can check whether it exists under a name you did not guess, and records the gap when it does not. Omit the argument entirely when you already know which topic you want.",
                "type": "string"
              },
              "topic": {
                "description": "Guide topic (default overview). Read 'v3' or 'v4' before building an action on that version.",
