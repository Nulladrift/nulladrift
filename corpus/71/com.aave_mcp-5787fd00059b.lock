        {
          "name": "get_apy_history",
          "title": "Get APY history",
          "description": "Historical supply or borrow APY for a reserve over time, on v3 or v4. Returns a time-series of {date, apyPct}, where apyPct is a percent ('3.32' means 3.32%). Each point is an average over its sampling interval, and the interval widens with the window (hourly for 'day', coarser above that), so a series is not directly comparable to the instantaneous rate from get_reserve_details. Use get_markets first for the reserveId (v4) or market+token (v3). When comparing v3 against v4 for the same asset (a migration decision), read the history on both sides: a spot-rate gap can be one side's momentary spike.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chainId": {
                "description": "v3 only: chain id (positive integer).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "market": {
                "description": "v3 only: market pool address (from get_markets).",
                "type": "string"
              },
              "reserveId": {
                "description": "v4 only: the reserveId from get_markets, copied verbatim.",
                "type": "string"
              },
              "side": {
                "description": "Which rate (default supply).",
                "enum": ["supply", "borrow"],
                "type": "string"
              },
              "token": {
                "description": "v3 only: underlying token address.",
                "type": "string"
              },
              "version": {
                "description": "Optional: inferred from the reserve selector ('reserveId' is v4, 'market'+'token'+'chainId' is v3). Send it to be explicit, or if you somehow set both.",
                "enum": ["v3", "v4"],
                "type": "string"
              },
              "window": {
                "description": "Time window (default week).",
                "enum": ["day", "week", "month", "sixMonths", "year"],
                "type": "string"
              }
            },
            "type": "object"
          },
