                "description": "Optional, and only 'v4': this tool exists on v4 only.",
                "enum": ["v4"],
                "type": "string"
              },
              "window": {
                "description": "How far back to go (default week).",
                "enum": ["day", "week", "month", "sixMonths", "year"],
                "type": "string"
              }
            },
            "required": ["id", "scope"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
