        },
        {
          "name": "prepare_vault_action",
          "title": "Prepare an Aave Vault deposit, mint, withdraw or redeem",
          "description": "v3 only. Build an unsigned transaction to move value in or out of an Aave Vault. Non-custodial: the user's wallet signs and submits, so building one commits them to nothing - choose sensible values, build it, and say what you chose rather than stopping to ask. Which unit 'amount' is in depends on the action: 'deposit' and 'withdraw' take ASSETS, 'mint' and 'redeem' take SHARES. Set 'asAToken' true to move the reserve's aToken instead of its underlying token, which skips supplying first when the wallet already holds the aToken. 'recipient' is only for sending the result to a different address than the sender. A deposit or mint needs an allowance: when the result is ApprovalRequired, submit its 'approval' transaction, wait for it to be mined, then submit the 'originalTransaction' beside it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Which side to build: deposit/withdraw in assets, mint/redeem in shares.",
                "enum": ["deposit", "mint", "withdraw", "redeem"],
                "type": "string"
              },
              "amount": {
                "description": "Amount in main units, in the unit the action takes (assets or shares).",
                "type": "string"
              },
              "asAToken": {
                "description": "Move the reserve's aToken rather than its underlying token (default false).",
                "type": "boolean"
              },
              "chainId": {
                "description": "Chain the vault is on, e.g. 1 for Ethereum.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "recipient": {
                "description": "Optional address to receive the shares or the assets. Omit the argument entirely to use the sender.",
                "type": "string"
              },
              "sender": {
                "description": "Wallet address, 0x-prefixed (40 hex chars).",
                "type": "string"
              },
              "vault": {
                "description": "Vault contract address, 0x-prefixed (40 hex chars).",
                "type": "string"
              },
              "version": {
                "description": "Optional, and only 'v3': this tool exists on v3 only.",
                "enum": ["v3"],
                "type": "string"
              }
            },
            "required": ["action", "amount", "chainId", "sender", "vault"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:74968774ef946ddcd6584877d7a24af87baef78c74ca10a312d80c6d33b6c1b4"
        },
        {
          "name": "preview_action",
          "title": "Preview an action (simulate before executing)",
          "description": "Simulate a supply/borrow/withdraw/repay against a wallet's position WITHOUT executing, on v3 or v4 - or, v4 only, a quoted order that moves a position: a leverage, a position swap or a repay-with-supply. Always do this before a borrow, a withdraw or any of those orders. Send only the arguments that apply: v4 takes 'reserveId'; v3 takes 'market' + 'token' + 'chainId'; 'max' is for withdraw and repay; 'native' works on both; 'enableCollateral' is v4 only. A quoted order takes 'quoteId' and 'sender' and nothing else, since the quote already binds the wallet, the reserves and the amounts, and the action names the tool that minted it: 'leverage' for get_leverage_quote, 'supplySwap' or 'borrowSwap' for get_position_swap_quote with kind supply or borrow, 'repayWithSupply' for get_repay_with_supply_quote. Both versions answer with 'healthFactorBefore' and 'healthFactorAfter'; v4 also returns net APY, risk premium, net collateral, net balance, projected earnings and both borrowing-power figures, each as a matching Before/After pair, plus 'rewardsAcquired' / 'rewardsAbandoned' when the action changes rewards. v3 has the two health factors and nothing else. Either version also returns 'warnings' when the action would not actually succeed - an error level there means the prepare step will refuse it, so fix the inputs rather than building it. Simulate first even when you intend to build immediately: this is the cheapest way to find out that an action cannot succeed, and it commits nothing. It reports the position's own limits and not token allowances, so a clean simulation says the position allows this, not that no approval step remains.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action": {
                "description": "Action to simulate. 'leverage', 'supplySwap', 'borrowSwap' and 'repayWithSupply' simulate a quoted order and take 'quoteId' and 'sender', nothing else.",
                "enum": ["supply", "borrow", "withdraw", "repay", "leverage", "supplySwap", "borrowSwap", "repayWithSupply"],
                "type": "string"
              },
              "amount": {
                "description": "Amount in MAIN units (e.g. '10.5'), never base units: 100000 base units of a 6-decimal token is '0.1', not '100'. Convert before sending if the user stated base units. Omit only if max=true or the action is a quoted order.",
                "type": "string"
              },
              "chainId": {
                "description": "v3 only: chain id (positive integer).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "enableCollateral": {
                "description": "v4 supply only: also enable as collateral.",
                "type": "boolean"
              },
              "market": {
                "description": "v3 only: market pool address, from a get_markets row in this session. It cannot be recalled: an Aave pool address you already recognise belongs to another deployment (v2, or another chain) and is rejected.",
                "type": "string"
              },
              "max": {
                "description": "Withdraw/repay only: use the entire balance/debt.",
                "type": "boolean"
              },
              "native": {
                "description": "Use the chain's native gas token instead of an ERC-20, on either version. Pass it whenever the action is in the native token, or the balance check below reads the wrapped ERC-20 balance and can refuse a supply that would work.",
                "type": "boolean"
              },
              "quoteId": {
                "description": "Quoted orders only: the quoteId from the quote tool the action names, in this session. The quote binds everything else, wallet included, so 'sender' is the 'user' it was quoted for and no other selector or amount applies.",
                "type": "string"
              },
              "reserveId": {
                "description": "v4 only: the opaque reserveId, copied verbatim from a get_markets row or a get_position_items item in this session (e.g. 'MTo6MHg5NGU3...Ojo1') - it cannot be constructed or recalled, so fetch one before the first call rather than after a refusal. For a withdraw or a repay take it from get_position_items for the position being acted on, not from get_markets: the same asset exists on several spokes, and the one this wallet supplied is the only one it can exit. The 'spokeId' from get_user_positions is NOT this: it is the same encoding one segment short, names the spoke rather than a reserve inside it, and is rejected. A token symbol such as 'USDC' is rejected too.",
                "type": "string"
              },
              "sender": {
                "description": "Sender wallet address (0x, 40 hex): the wallet that will sign, as the user named it in this session. If no wallet has been named, ask for it; never substitute a placeholder, which is rejected.",
                "type": "string"
              },
              "token": {
                "description": "v3 only: underlying token address.",
                "type": "string"
              },
              "version": {
                "description": "Optional: inferred from the reserve selector ('reserveId' is v4, 'market'+'token'+'chainId' is v3). Send it to be explicit, or if you somehow set both.",
                "enum": ["v3", "v4"],
                "type": "string"
              }
            },
            "required": ["action", "sender"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c993e3560049aa08cc74a0d695eb59686c361d9b1f0311fd0f0c1db556a570fd"
        },
        {
          "name": "search_governance_proposals",
          "title": "Search Aave DAO proposals",
          "description": "Takes no 'version' argument (DAO governance is not per-market; Governance V3 is unrelated to Aave v3/v4 markets). List or search Aave DAO governance proposals. Filter by 'state' to answer \"what is live right now\" (state 'active') or \"what is waiting to execute\" (state 'queued'). Pass 'search' for full-text over title, author and description, ranked by relevance. Vote tallies are in AAVE.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "includeSummaries": {
                "description": "Include each proposal's ~500-char summary (default false). Adds roughly 500 bytes per row, so ask for it when summarising a list rather than when looking one up.",
                "type": "boolean"
              },
              "limit": {
                "description": "Max rows to return (1-100, default 20).",
                "type": "number"
              },
              "offset": {
                "description": "Rows to skip, for paging (default 0).",
                "type": "number"
              },
              "search": {
                "description": "Optional full-text query, e.g. 'GHO' or 'Chaos Labs'. Combines with 'state'.",
                "type": "string"
              },
              "state": {
                "description": "Filter to one lifecycle state. 'active' is open for voting, 'queued' passed and waits out the timelock, 'executed' is done. Omit for every state.",
                "enum": ["created", "active", "queued", "executed", "failed", "cancelled", "expired", "pending", "null"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
