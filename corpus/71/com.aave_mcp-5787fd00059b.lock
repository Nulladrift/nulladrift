        {
          "name": "get_asset_history",
          "title": "One asset's price, supply or borrows over time (v4)",
          "description": "v4 only. One asset across every v4 reserve that holds it: 'price' is its oracle price per sample, 'supply' and 'borrow' are the amounts plus the APY spread across those reserves (averageApyPct with the highest and lowest at that moment). Not the same question as get_apy_history, which is one reserve's own rate - an asset sits in several reserves at once, so a wide gap between highestApyPct and lowestApyPct is the point, not noise. The asset is named by its token address and chain, and get_markets does NOT return a token address, so do not look for one there: get_multichain_asset takes a symbol and returns the token address per chain in one call, and get_hub_assets returns it per hub asset.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chainId": {
                "description": "Chain the token is on, e.g. 1 for Ethereum. Required: the same symbol exists on several.",
