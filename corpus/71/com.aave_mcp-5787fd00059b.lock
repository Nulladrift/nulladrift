        {
          "name": "get_emode_categories",
          "title": "Get v3 eMode categories",
          "description": "v3 only. eMode groups correlated assets (ETH-correlated, stablecoins) so they borrow against each other at a higher LTV, raising borrowing power at the cost of restricting which assets the position may hold. Returns each market's categories with the 'categoryId' that prepare_set_emode takes, its LTV and liquidation thresholds, and which symbols are in it. Narrow with 'symbols' (e.g. ['USDC']) to get just the categories that asset is in - unfiltered this is every category on every chain. Markets with no matching category are left out entirely. v4 has no eMode: it replaces it with risk premium and dynamic config.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chainId": {
                "description": "Chain id to restrict to, e.g. 1 for Ethereum. Omit the argument entirely to cover every chain.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "symbols": {
                "description": "Optional token symbols to return, e.g. ['USDC','GHO']. Case-insensitive. Strongly preferred when you know the asset: a chain has ~70 reserves and listing them all is a large response.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "version": {
                "description": "Optional, and only 'v3': this tool exists on v3 only.",
                "enum": ["v3"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
