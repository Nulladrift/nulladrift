        {
          "name": "get_market_history",
          "title": "Market totals over time (v4)",
          "description": "v4 only. Deposits, borrows, available liquidity and utilisation over a window, for one hub or one spoke. Pick the layer deliberately: a hub is the liquidity itself and answers 'is this market growing', a spoke is one venue onto that liquidity and answers 'is this venue being used'. Ids come from get_reserve_details, which returns both 'hubId' and 'spokeId' for a reserve, or from get_hubs ('hubId') and get_user_positions ('spokeId' for a spoke the wallet already holds). The two are not interchangeable and the wrong one is rejected. To judge a venue before entering it, take the ids from get_reserve_details rather than from a position that does not exist yet. For the protocol as a whole rather than one market use get_protocol_history, for one reserve's rate use get_apy_history, and for one asset across every reserve holding it use get_asset_history.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The hubId (scope 'hub') or spokeId (scope 'spoke'). Not an address.",
                "type": "string"
              },
              "scope": {
                "description": "Which layer 'id' names: a hub's liquidity, or one spoke onto it.",
                "enum": ["hub", "spoke"],
                "type": "string"
