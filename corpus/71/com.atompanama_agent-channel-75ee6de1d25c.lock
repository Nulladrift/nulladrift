      "serverInfo": {
        "name": "atom-agent-channel",
        "title": "Atom Panamá agent channel",
        "version": "1.0.0",
        "websiteUrl": "https://atompanama.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Automated MCP server for Atom Panamá (not a person). Read tools return Atom Panamá's published facts, services, prices and FAQ. request_quote, book_call and send_inquiry record an inquiry that a person on the team reads and answers. Privacy: Atom Digital Technologies LLP (Inglaterra y Gales, OC450214), Torre de las Américas, piso 12, oficina 1203, Ciudad de Panamá, que opera Atom Panamá es responsable de la información que un agente envía aquí. Se usa para responder esta consulta, darle seguimiento y contar las consultas, según Ley 81 de 2019 de Panamá y su Decreto Ejecutivo 285 de 2021 (derechos ARCO); en España y el Espacio Económico Europeo, el RGPD. No se vende. Se conserva 12 meses desde su recepción y luego se elimina; escriba a privacidad@mail.atompty.com para conocerla, corregirla o eliminarla antes (derechos ARCO). Aviso completo: https://atompanama.com/privacidad",
      "tools": [
        {
          "name": "book_call",
          "title": "Request a call with Atom Panamá",
          "description": "Ask for a call with Atom Panamá for a person. Returns the self-service booking page and records the request so a person confirms a time. Set consent to true only if the person agreed to be contacted. A person on the team answers; nothing is emailed automatically.",
          "inputSchema": {
            "properties": {
              "agent": {
                "additionalProperties": false,
                "description": "The agent sending this (optional but recommended). The User-Agent header is recorded too.",
                "properties": {
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "operator": {
                    "description": "Who runs the agent.",
                    "maxLength": 160,
                    "type": "string"
                  },
                  "url": {
                    "format": "uri",
                    "maxLength": 300,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "budget": {
                "description": "Budget or range, free text (e.g. \"$20k-30k a month\").",
                "maxLength": 200,
                "type": "string"
              },
              "company": {
                "description": "The organization the person represents.",
                "maxLength": 160,
                "type": "string"
              },
              "consent": {
                "const": true,
                "description": "True only if the person named in contact agreed to be contacted by this company about this inquiry.",
                "type": "boolean"
              },
              "contact": {
                "additionalProperties": false,
                "description": "The person to answer. An email or a phone is required.",
                "properties": {
                  "email": {
                    "format": "email",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "phone": {
                    "description": "International format, e.g. +1 212 555 0100.",
                    "maxLength": 32,
                    "type": "string"
                  },
                  "role": {
                    "description": "Job title or role.",
                    "maxLength": 160,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "language": {
                "description": "Language for the answer.",
                "enum": ["en", "es", "pt"],
                "type": "string"
              },
              "need": {
                "description": "What the person needs, in their words: the problem, scope, roles or volumes.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              },
              "on_behalf_of": {
                "description": "Who the agent acts for: the person and, if any, their organization.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "preferred_times": {
                "description": "Preferred days and times, with the time zone.",
                "maxLength": 300,
                "type": "string"
              },
              "test": {
                "description": "True to test an integration: recorded and marked as a test, nobody follows up.",
                "type": "boolean"
              },
              "timeline": {
                "description": "When they want to start or decide.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["consent", "contact", "need", "on_behalf_of"],
            "type": "object"
          },
