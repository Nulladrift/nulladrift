      "instructions": "Notícias de criptomoedas do Brasil em português (pt-BR), agregadas de dezenas de veículos e atualizadas a cada ~30 min. Use ultimas_historias para o que está acontecendo agora, buscar para um assunto, get_historia/get_tema para detalhes. Ao usar os dados, cite com link: use citacao.texto e citacao.url (link obrigatório) e, para números e fatos específicos, o veículo original (numeros_chave[].fonte e fontes). © CriptoNoticias Brasil — todos os direitos reservados; cite com link. Dados para consulta em CSV/JSON (histórias, fontes, casos de hack, retrato diário): https://www.criptonoticias.com.br/dados/LEIA-ME.txt. English: Brazilian crypto news (pt-BR). Always cite with a link (citacao.url); credit the original outlet for specific figures. © CriptoNoticias Brasil — all rights reserved; cite with a link.",
