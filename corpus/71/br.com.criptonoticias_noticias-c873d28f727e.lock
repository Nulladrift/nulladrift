        {
          "name": "ultimas_historias",
          "title": "Últimas histórias",
          "description": "Últimas histórias de cripto no Brasil (pt-BR), da mais nova para a mais antiga. Cada história agrupa a mesma notícia de vários veículos e traz «N fontes», resumo, datas e o bloco citacao (texto + link para citar). Use para «o que aconteceu hoje». Filtro opcional por tag (tópico ou ativo: Bitcoin, Ethereum, Brasil, Mercados, Política e Regulação).\nExemplos: «O que aconteceu hoje com cripto no Brasil?» · «Últimas notícias de regulação»\nEnglish: Latest Brazilian crypto stories, newest first, each grouped from N outlets, with a ready citation (text + link). Use for 'what's new today'; optional tag filter. Example: «What's new on Ethereum in Brazil?»",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Quantidade (1–20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "tag": {
                "description": "Tópico ou ativo, ex.: Bitcoin, Ethereum, Brasil, Mercados, Política e Regulação.",
