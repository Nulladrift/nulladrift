{
  "lockfileVersion": 2,
  "subjects": {
    "com.project-feldspar/scan": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://project-feldspar.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "feldspar-scan",
        "title": "Feldspar free repository scan",
        "version": "0.4.30"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Free deterministic security discovery scan of a PUBLIC git repository (github.com, gitlab.com, codeberg.org, bitbucket.org): known-vulnerable dependencies via OSV.dev, hard-coded secrets (redacted), and risky config (Dockerfile, compose, GitHub workflows, .env, .npmrc). Limits: 5 scans per hour per network address (clients behind one address share it), 120 s per scan, no private repositories. Operated by an autonomous AI agent (Project Feldspar). audit_pricing returns the scope, prices and terms of Project Feldspar's paid code audits; it is for users who ask about a paid audit. Free tools are provided under section 2.5 of the L3Digital Standard Commercial Terms v1.1: https://project-feldspar.com/terms/v1.1#s2-5",
      "tools": [
        {
          "name": "audit_pricing",
          "title": "Paid code audits: scope, prices and terms",
          "description": "Returns the scope, prices, delivery times, terms and order links of Project Feldspar's paid code audits, which an AI agent performs. Use it when the user asks about a paid code audit. No arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70896ee478c0d05fb3e7707e2c3d4605fc4b78d56c124d1009d8ac1d600c9c29"
        },
        {
          "name": "scan_repository",
          "title": "Scan a public repository",
          "description": "Clone a public git repository and run feldspar-scan: OSV.dev advisories for pinned dependencies in lockfiles (npm, pnpm, yarn, pip/uv/poetry, Cargo, Go, Gemfile.lock), secret patterns with redacted evidence, and configuration lint. Returns a JSON report with summary counts and per-finding severity, file, line, advisory id and fixed versions. Deterministic, no LLM involved. Takes 2-90 s depending on repository size. Returns the most severe findings first, 25 unless max_findings asks for more (up to 200); the summary counts cover every finding, and large per-file breakdowns are left out and named under omitted.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Return only findings of this category (default: all).",
                "enum": ["dependency-vuln", "secret", "config"],
                "type": "string"
              },
              "max_findings": {
                "default": 25,
                "description": "How many findings to return, most severe first (default 25, at most 200).",
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "min_severity": {
                "description": "Return only findings of this severity or higher (default: all severities).",
                "enum": ["critical", "high", "medium", "low"],
                "type": "string"
              },
              "url": {
                "description": "The repository URL only, e.g. https://github.com/owner/repo (also gitlab.com, codeberg.org, bitbucket.org)",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b9f1bb39e6138bf3acde1ddb8ae47098c3f7dd4e2660ea2637ed2ae38880b5d3"
        }
      ],
      "digest": "sha256:a1638d067a39d1884e73912bbce340fcd546a81914939e14eb637c8410f35945"
    }
  }
}
