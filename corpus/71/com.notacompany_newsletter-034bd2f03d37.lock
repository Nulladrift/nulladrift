      "instructions": "notacompany's bookmarks feed The world according to capital, Tiago's newsletter: everything is a bookmark, with one category each (cool_company_raises, products, interesting, dev_tools, finance; dev_tools and finance are retired: kept on the site, no new ones) and grouped tags (tag_groups: topic, plus fundraising for investors, \"YC\", \"a16z speedrun\" and amount buckets like \"$10M+\"). A raise is a bookmark in cool_company_raises; amount is USD cents, so show amount_formatted. Public read tools need no sign-in and see approved bookmarks only. The private tools (curation and writes) need a curator: the Access login on mcp.notacompany.com, or a Bearer token with api:access on www.notacompany.com/mcp. A curator also sees pending and rejected bookmarks. New bookmarks start pending and are published by approve_bookmarks. A tag's slug (list_bookmark_tags) filters list_bookmarks and builds a collection's rule ({\"tags\": [\"robotics\"]}); a startups collection can be built on one round stage too ({\"stage\": \"series_b\"}; pre_seed, seed, series_a, series_b, series_c, series_d, growth). Tags have no pages of their own. A bookmark's page is https://www.notacompany.com/bookmarks/{slug}. Every page that lists bookmarks, outside an issue and the newsletter page, is a collection (list_collections) at /collections/{slug}: a category's page, a YC batch, an a16z speedrun cohort, a sector or any set people search for by name. The slug is the words people search for it by (\"yc-fall-2026\", \"robotics-startups\"), unique across collections and fixed once it is live. Each row says what its page offers over its cards (controls: search, filters, sorts, day groups). A curator drafts one with create_collection, always as a draft, written for one search no other collection targets; its copy is in American English, never defines a thing by what it is not (\"X, not Y\"), quotes no law, and its title ends \" | notacompany\" (a description at most 160 characters). publish_collection publishes it, and a curator may publish a draft on its own once it passes the gate (10 bookmarks under its rule; a category or startups page's own title, h1, lead and description; on a startups page its target_query and no live page on the same rule) and its list fits its name. Retiring or renaming a live page stays with Tiago. Finance bookmarks are archive history; the category takes no new ones. delete_bookmark is permanent and takes the slug's aliases with it: call it only after the user has confirmed that exact bookmark. newsletter_stats gives a curator the newsletter's subscriber counts (active, pending, unsubscribed, by signup form, and confirmations by day, landing page and utm_source over the last `days`): totals only, with no address and no single subscriber in them. subscribe_to_newsletter is public: it emails a confirmation link to an address its owner asked you to sign up, and the subscription starts when they click it. Rate limits apply to all tools.",
      "tools": [
        {
          "name": "approve_bookmarks",
          "title": "Approve bookmarks",
          "description": "Approve up to 100 bookmarks by slug and publish them. Approving a rejected bookmark restores it. All or nothing: if any slug is not found, nothing changes and the error names the missing slugs. Curator only.",
          "inputSchema": {
            "properties": {
              "slugs": {
                "items": {
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Approve bookmarks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a0f37910fd7ffec9af9cf21c0d0824b99f324acf2ece651897f7b6bcff641469"
        },
        {
          "name": "create_bookmark",
          "title": "Create a bookmark",
          "description": "Create a bookmark. It starts pending; approve it to publish. Needs a title and a url or source_url. The slug is derived from the title unless given. Curator only.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "A raise's amount in USD cents.",
                "minimum": 0,
                "type": "integer"
              },
              "batch": {
                "description": "An accelerator batch as the accelerator spells it: \"Summer 2026\" (YC), \"SR007\" (a16z speedrun).",
                "type": "string"
              },
              "category": {
                "enum": ["cool_company_raises", "products", "interesting", "dev_tools", "finance"],
                "type": "string"
              },
              "cover_url": {
                "description": "Found from the destination's og:image on approval when left out.",
                "type": "string"
              },
              "excerpt": {
                "type": "string"
              },
              "hidden": {
                "description": "Hidden bookmarks stay approved but leave the public feed.",
                "type": "boolean"
              },
              "note": {
                "description": "Tiago's take: his one-line note on the bookmark.",
                "type": "string"
              },
              "one_liner": {
                "description": "A company's name, a spaced em dash, and what it makes, for whom (\"Peppermint — Billing and collections for clinical trial sites\"); an issue prints it as the item's title, the name in bold, with the round under it. No amount, no investors. Written on approval when left blank.",
                "type": "string"
              },
              "published_at": {
                "description": "ISO 8601 date or datetime; defaults to now on create.",
                "type": "string"
              },
              "source_url": {
                "description": "The article or announcement, when it differs from url.",
                "type": "string"
              },
              "stage": {
                "enum": ["pre_seed", "seed", "series_a", "series_b", "series_c", "series_d", "growth", "other"],
                "type": "string"
              },
              "summary": {
                "type": "string"
              },
              "tag_groups": {
                "additionalProperties": {
                  "items": {
                    "type": "string"
                  },
                  "type": "array"
                },
                "description": "Tags in their display spelling (\"Sands Capital\", \"$100M+\"), grouped.",
                "properties": {
                  "fundraising": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "topic": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "description": "Where the bookmark points. ?ref=notacompany is added on the way out and stripped on the way in.",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a bookmark"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d14af49fc4cd0611418ea566863434c28c583491ba70aff0ee15ee0ae9281263"
        },
        {
          "name": "create_collection",
          "title": "Draft a collection",
          "description": "Draft a new collection page. It is always a draft, seen only at its preview_url until publish_collection. kind is yc_batch (rule {batch: \"Fall 2026\"}), speedrun_cohort (rule {batch: \"SR008\"}), startups (rule {tags: [slug, ...], category?}, any of the tags, or {stage: \"series_b\", category?}, every round at that stage: one of pre_seed, seed, series_a, series_b, series_c, series_d, growth; tags and stage never go together) or category (rule {category: value}; every category already has one). Every page is served at /collections/{slug}; slug is the words people search for it by (\"yc-fall-2026\", \"robotics-startups\"), unique across collections. A startups or category page needs its own title, h1, lead and description; a batch or cohort may leave them blank for its template. {count}, {first} and {latest} fill in, and {batch} on a batch. target_query is the one search the page is written for, unique across collections. controls says what the page offers over its cards: search (true/false), filters (any of topic, investor, stage), sorts (one or more of newest, biggest, the page's own order first) and group (day or none); a key left out keeps its default ({\"search\":false,\"filters\":[],\"sorts\":[\"newest\",\"biggest\"],\"group\":\"none\"}). Curator only.",
          "inputSchema": {
            "properties": {
              "controls": {
                "description": "What the page offers over its cards; a key left out keeps its default.",
                "properties": {
                  "filters": {
                    "items": {
                      "enum": ["topic", "investor", "stage"],
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "group": {
                    "description": "day groups the cards by the day each was logged.",
                    "enum": ["day", "none"],
                    "type": "string"
                  },
                  "search": {
                    "type": "boolean"
                  },
                  "sorts": {
                    "description": "The page's own order first.",
                    "items": {
                      "enum": ["newest", "biggest"],
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "description": {
                "description": "The meta description, at most 160 characters.",
                "type": "string"
              },
              "h1": {
                "type": "string"
              },
              "kind": {
                "enum": ["category", "yc_batch", "speedrun_cohort", "startups"],
                "type": "string"
              },
              "lead": {
                "type": "string"
              },
              "promise": {
                "type": "string"
              },
              "rule": {
                "properties": {
                  "batch": {
                    "description": "A YC batch (\"Fall 2026\") or a speedrun cohort (\"SR008\").",
                    "type": "string"
                  },
                  "category": {
                    "enum": ["cool_company_raises", "products", "interesting", "dev_tools", "finance"],
                    "type": "string"
                  },
                  "stage": {
                    "description": "One round stage, on a startups page built on a stage (\"series_b\" for Series B startups); sent without tags.",
                    "enum": ["pre_seed", "seed", "series_a", "series_b", "series_c", "series_d", "growth"],
                    "type": "string"
                  },
                  "tags": {
                    "description": "Tag slugs from list_bookmark_tags; a bookmark carrying any of them is in.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "slug": {
                "description": "The page's address, /collections/{slug}: lowercase words joined by hyphens, as people search for it (\"yc-fall-2026\", \"a16z-speedrun-sr008\", \"defense-tech-startups\").",
                "type": "string"
              },
              "target_query": {
                "description": "The one search this page is written for.",
                "type": "string"
              },
              "title": {
                "description": "The search title, ending \" | notacompany\".",
                "type": "string"
              }
            },
            "required": ["kind", "rule", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Draft a collection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
