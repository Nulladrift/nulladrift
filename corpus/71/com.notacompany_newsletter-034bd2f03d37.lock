        {
          "name": "newsletter_stats",
          "title": "Newsletter subscriber stats",
          "description": "The newsletter's subscriber counts, as totals only: no email address and no single subscriber's row. Returns subscribers (active = confirmed and still subscribed, pending = waiting on the confirmation link, unsubscribed), agent_inboxes (active and pending readers whose address is at an inbox built for agents: agentmail.to), active_by_source (the signup form: subscribe, footer, bookmarks, home, collection, archive, agent, mcp, unknown), and over the last `days` (default 28, at most 365, UTC, today included): confirmed.total, confirmed.daily (one row a day), confirmed.by_landing_path (the page the form was on, top 50), confirmed.by_utm_source (the utm_source of the link that brought the reader, when the page address carried one) and unsubscribes. (none) counts rows with no value; (other) counts values that are no page address or campaign token. Curator only.",
