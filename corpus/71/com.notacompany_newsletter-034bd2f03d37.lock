        {
          "name": "update_bookmark",
          "title": "Update a bookmark",
          "description": "Change a bookmark's fields; omitted fields keep their value. tag_groups merges by group: a group you send replaces that group, an empty list removes it, and groups you leave out are kept. new_slug renames it, and the old slug keeps resolving. Curator only.",
          "inputSchema": {
            "properties": {
              "amount": {
                "description": "A raise's amount in USD cents.",
                "minimum": 0,
                "type": "integer"
              },
              "batch": {
                "description": "An accelerator batch as the accelerator spells it: \"Summer 2026\" (YC), \"SR007\" (a16z speedrun).",
                "type": "string"
