{
  "lockfileVersion": 2,
  "subjects": {
    "com.madebydevx.namedrop/namedrop": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://namedrop.madebydevx.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "namedrop",
        "title": "NameDrop by DevX",
        "version": "1.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Register, renew or gift a Basename (name.base.eth) paying USDC on Base: check -> quote -> send exact USDC to pay_to -> submit_payment -> order. Independent service; not affiliated with Base, Coinbase or ENS.",
      "tools": [
        {
          "name": "namedrop_check",
          "title": "Check a Basename",
          "description": "Is yourname.base.eth available to register (or registered and renewable)? Free, read-only.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Label without .base.eth, e.g. alice",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:1784f2cb6ab66b9bcc35142bc4a102d0bcf2510daaa68bbf2bd45931cd003290"
        },
        {
          "name": "namedrop_order",
          "title": "Order status",
          "description": "Status of a NameDrop order by id (paid, registered with tx, or refunded with tx).",
          "inputSchema": {
            "properties": {
              "order_id": {
                "type": "string"
              }
            },
            "required": ["order_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:73f576349f5e55c63f25a82e166fb59f2826aebfd931c7b977916d648f0f40ca"
        },
        {
          "name": "namedrop_quote",
          "title": "Quote in USDC",
          "description": "Create a 30-minute quote to register (to an owner address) or renew a Basename, priced in USDC on Base (live Basenames fee + gas + $1 service). Returns quote_id, exact usdc amount, pay_to and instructions. Nothing is charged by quoting.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              },
              "owner": {
                "description": "0x address that will own the name (required for register)",
                "type": "string"
              },
              "type": {
                "default": "register",
                "enum": ["register", "renew"],
                "type": "string"
              },
              "years": {
                "default": 1,
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:49fc71e73858cd3d5740e050f8472879154695cba48b971a349b2217d2000982"
        },
        {
          "name": "namedrop_submit_payment",
          "title": "Submit payment tx",
          "description": "After sending EXACTLY the quoted USDC on Base to pay_to, submit the quote_id and your Base tx hash. NameDrop verifies the transfer on-chain and registers/renews the name (or refunds the USDC if the name was taken first).",
          "inputSchema": {
            "properties": {
              "quote_id": {
                "type": "string"
              },
              "tx_hash": {
                "description": "0x-prefixed Base transaction hash of the USDC transfer",
                "type": "string"
              },
              "type": {
                "default": "register",
                "enum": ["register", "renew"],
                "type": "string"
              }
            },
            "required": ["quote_id", "tx_hash"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c71adb0f73dbb769e6873a6af13d1b172f2adcccfc20ae82f7b407bb15e2478e"
        }
      ],
      "digest": "sha256:0b724327be5aa5f2b766677dc00ed1afc178f6e33e0584204ef711d66bb875c6"
    }
  }
}
