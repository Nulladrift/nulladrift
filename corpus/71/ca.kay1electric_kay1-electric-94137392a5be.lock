          },
          "digest": "sha256:375da1be4af21a1f605e79d21209dfd4583fdcf497f0b99335e7ef15409bec7f"
        },
        {
          "name": "list_service_areas",
          "title": "List service areas",
          "description": "Cities in Greater Vancouver that Kay1 Electric serves, with example neighbourhoods and each city page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the returned page links: en (English, default) or fa (Persian).",
