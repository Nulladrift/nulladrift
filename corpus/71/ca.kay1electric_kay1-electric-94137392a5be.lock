        },
        {
          "name": "list_services",
          "title": "List services",
          "description": "The electrical services Kay1 Electric offers (panel upgrades, EV chargers, commercial work, repairs, rewiring, lighting, heat pump / hot tub wiring, smart home, inspections), each with its page URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language of the returned page links: en (English, default) or fa (Persian).",
                "enum": ["en", "fa"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
