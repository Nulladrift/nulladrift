            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:86a8865a5bc529953628a85ec4192fb67ab1574f05b931e44b375c3b763c9d1e"
        },
        {
          "name": "get_page",
          "title": "Read a page as Markdown",
          "description": "Returns the Markdown version of a kay1electric.ca page, e.g. \"/our-services/ev-charger-installation/\" or \"/fa/contact-us/\". Use list_services, list_service_areas or https://kay1electric.ca/llms.txt to find paths.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Site path or full URL of the page, e.g. \"/about-us/\".",
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
