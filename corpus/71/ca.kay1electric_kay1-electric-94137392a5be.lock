            "readOnly": true
          },
          "digest": "sha256:40790d01ae22cde6c2a3a627bb0e4b8eb7c7ddd7f9b03c278769e500bcca182f"
        },
        {
          "name": "request_quote",
          "title": "Request a free estimate",
          "description": "Send a free-estimate request to Kay1 Electric on the customer's behalf. Kay1 receives it by email and calls the customer back during office hours (7:00 AM - 9:30 PM daily, Pacific Time); if an email is given, the customer also gets a confirmation email. Only call this after showing the customer the details and getting their explicit OK to send them and be contacted. Do not invent details. Not for emergencies: for sparking, burning smells or no power, tell the customer to call (778) 900-1004 now (911 for fire or danger to life).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent_name": {
                "description": "Name of the AI assistant or app sending this request, e.g. \"ChatGPT\" or \"Claude\".",
                "maxLength": 80,
                "type": "string"
              },
              "city": {
                "description": "City where the work is.",
                "enum": ["Coquitlam", "Port Coquitlam", "Port Moody", "Burnaby", "Vancouver", "North Vancouver", "West Vancouver", "New Westminster", "Richmond", "Surrey", "Other Lower Mainland"],
                "type": "string"
              },
              "customer_confirmed": {
                "const": true,
                "description": "Must be true: the customer reviewed these details, asked you to send them to Kay1 Electric, and agreed to be contacted by phone or email.",
                "type": "boolean"
              },
              "details": {
                "description": "Short description of the job: property type (house, condo, business), current panel size if known, what needs doing or what is wrong. No links.",
                "maxLength": 2000,
                "type": "string"
              },
              "email": {
                "description": "Customer email (optional). If given, a confirmation email is sent to it.",
                "maxLength": 254,
                "type": "string"
              },
              "name": {
                "description": "Customer full name.",
                "maxLength": 100,
                "type": "string"
              },
              "phone": {
                "description": "Customer phone number with area code (North American), e.g. \"604-555-0123\".",
                "maxLength": 30,
                "type": "string"
              },
              "preferred_language": {
                "description": "Language the customer prefers for the call back.",
                "enum": ["English", "Persian (Farsi)"],
                "type": "string"
              },
              "service": {
                "description": "Type of electrical work.",
                "enum": ["200A Electrical Panel Upgrade", "EV Charger Installation (Level 2)", "Commercial & Industrial Electrical", "Emergency Troubleshooting & Repair", "LED Lighting & Pot Lights", "Heat Pump & Hot Tub Electrical", "Whole-Home Rewiring & Renovation", "Smart Home Automation", "Safety Inspection & Permit Closure", "Other Electrical Project"],
                "type": "string"
              },
              "urgency": {
                "description": "How soon the work is needed.",
                "enum": ["Immediate Emergency (Power Out / Sparking)", "Within 24-48 Hours", "Within Next 2 Weeks", "Gathering Estimates"],
                "type": "string"
              }
            },
            "required": ["city", "customer_confirmed", "name", "phone", "service"],
            "type": "object"
          },
