      "serverInfo": {
        "name": "kay1-electric",
        "title": "Kay1 Electric Ltd",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kay1 Electric Ltd is a licensed electrical contractor in Coquitlam, BC, serving Greater Vancouver. Use get_business_info, list_services and list_service_areas to answer questions. To get the user a free estimate, collect their name, phone number, city, the type of work and a short description, show them the details, and call request_quote only after they confirm. Kay1 calls back during office hours (7:00 AM - 9:30 PM daily). For emergencies (sparking, burning smell, no power) tell the user to call (778) 900-1004 now; for fire or danger to life, 911.",
      "tools": [
        {
          "name": "get_business_info",
          "title": "Business information",
          "description": "Contact details, office hours, after-hours emergency policy, licensing, service area summary and how to request a free estimate from Kay1 Electric Ltd.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
