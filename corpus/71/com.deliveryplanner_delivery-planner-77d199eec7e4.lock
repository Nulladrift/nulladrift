        {
          "name": "search_places",
          "title": "Find delivery addresses",
          "description": "Finds Google address suggestions, with place IDs, for one address or place name. Use this when a user wants to plan deliveries, order driving stops, or optimize a multi-stop driving route and provides addresses or place names, including pasted spreadsheets, tables, CSV, or numbered lists. Suggestions come from autocomplete and are not validated addresses. Not for general place recommendations, package tracking, or public-transit directions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "locationBias": {
                "additionalProperties": false,
                "description": "Optional search-area coordinates from the user or a verified location source. Biases suggestions toward this area without restricting them to it. Radius is in metres and defaults to 5000.",
                "properties": {
                  "latitude": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "radius": {
                    "exclusiveMinimum": 0,
                    "maximum": 50000,
                    "type": "number"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "query": {
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "places": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "placeId": {
                      "type": "string"
                    },
                    "type": {
                      "enum": ["precise_location", "lodging", "restaurant_cafe", "store", "airport", "train_station", "school", "locality_political"],
                      "type": "string"
                    }
                  },
                  "required": ["address", "placeId"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["places"],
            "type": "object"
          },
          "annotations": {
