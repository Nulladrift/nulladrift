        {
          "name": "select_addresses",
          "title": "Choose addresses and route settings",
          "description": "Shows a panel where the user picks a match for each address and sets the start, finish, time at each stop and distance unit. Takes each original address with its suggested matches; addresses without suggestions let the user search again in the panel. Missing start and finish appear as empty fields, and fields in routeSettings.ignoredFields are listed as not applied. Read-only: when the user clicks Optimize, the panel issues a single-use confirmation token for route creation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "addresses": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "candidates": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "address": {
                            "maxLength": 1000,
                            "minLength": 1,
                            "type": "string"
                          },
                          "placeId": {
                            "maxLength": 512,
                            "minLength": 1,
                            "type": "string"
                          },
                          "type": {
                            "enum": ["precise_location", "lodging", "restaurant_cafe", "store", "airport", "train_station", "school", "locality_political"],
                            "type": "string"
                          }
                        },
                        "required": ["address", "placeId"],
                        "type": "object"
                      },
                      "maxItems": 5,
                      "type": "array"
                    },
                    "id": {
                      "maxLength": 100,
                      "minLength": 1,
                      "type": "string"
                    },
                    "notice": {
                      "description": "Town, country, street, or postcode differences between the candidates and the original address.",
                      "maxLength": 500,
                      "type": "string"
                    },
                    "originalAddress": {
                      "maxLength": 300,
                      "minLength": 1,
                      "type": "string"
                    },
                    "role": {
                      "enum": ["start", "stop", "finish"],
                      "type": "string"
                    }
                  },
                  "required": ["candidates", "id", "originalAddress", "role"],
                  "type": "object"
                },
                "maxItems": 22,
                "type": "array"
              },
              "routeSettings": {
                "additionalProperties": false,
                "default": {},
                "description": "Initial route settings. The form collects start, end (or a return to the start), time at stop and distance unit, and adds empty start and finish fields when they are missing.",
                "properties": {
                  "distanceUnit": {
                    "default": "km",
                    "enum": ["km", "miles"],
