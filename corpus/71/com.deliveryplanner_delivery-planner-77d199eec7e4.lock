              {
                "type": "noauth"
              }
            ],
            "ui": {
              "visibility": ["app"]
            }
          },
          "digest": "sha256:07b9329c9643f3550708f0e056da9d27989c886351de3b78c270a814b07329c2"
        },
        {
          "name": "create_route",
          "title": "Plan a delivery route with Spoke",
          "description": "Optimizes and saves one driving route for one driver with 1–20 delivery stops, from the addresses and settings the user confirmed in the address panel. Use this when a user asks what order to visit delivery addresses, wants an efficient driving route between multiple stops, or wants a route they can open and share. Takes the single-use token the panel issues when the user clicks Optimize route. Returns the stops in optimized order, estimated duration and distance, the route geometry, and route links. Every call creates a new route, and anyone with the returned link can view its addresses. Does not enforce delivery time windows, and not for package tracking, public transit, multiple drivers, or live-traffic estimates.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "confirmationToken": {
                "description": "Single-use token returned when the user clicks Optimize in the address panel.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "dispatchUrl": {
                "format": "uri",
                "type": "string"
              },
              "distanceMeters": {
                "type": "number"
              },
              "distanceUnit": {
                "enum": ["miles", "km"],
                "type": "string"
              },
              "driverUrl": {
                "format": "uri",
                "type": "string"
              },
              "durationMinutes": {
                "type": "number"
              },
              "encodedPolyline": {
                "description": "Saved driving route overview in Google encoded polyline format (precision 5). Empty when route geometry is unavailable.",
                "type": "string"
              },
              "estimateNotice": {
                "type": "string"
              },
              "ignoredFields": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "routeUrl": {
                "format": "uri",
                "type": "string"
              },
              "startTime": {
                "type": ["string", "null"]
              },
              "stops": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "address": {
                      "type": "string"
                    },
                    "deliveryNumber": {
                      "anyOf": [
                        {
                          "maximum": 9007199254740991,
                          "minimum": -9007199254740991,
                          "type": "integer"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "label": {
                      "type": "string"
                    },
                    "latitude": {
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "longitude": {
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    },
                    "minutesFromStart": {
                      "type": "number"
                    },
                    "role": {
                      "enum": ["start", "delivery", "finish"],
                      "type": "string"
                    }
                  },
                  "required": ["address", "deliveryNumber", "label", "latitude", "longitude", "minutesFromStart", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "timeAtStopMinutes": {
                "type": "number"
              }
            },
            "required": ["dispatchUrl", "distanceMeters", "distanceUnit", "driverUrl", "durationMinutes", "encodedPolyline", "estimateNotice", "ignoredFields", "routeUrl", "startTime", "stops", "timeAtStopMinutes"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
