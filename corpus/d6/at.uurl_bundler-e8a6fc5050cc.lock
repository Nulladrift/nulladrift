{
  "lockfileVersion": 2,
  "subjects": {
    "at.uurl/bundler": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://uurl.at/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "uurl-bundler",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "bundle_urls",
          "description": "Bundle multiple URLs into a single short link on UURL.at. Returns the short URL and QR code URLs (.svg and .png). Use this when you want to share multiple reference links as one URL.",
          "inputSchema": {
            "properties": {
              "urls": {
                "description": "List of URLs to bundle (1-12 URLs, each must start with https:// or http://).",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["urls"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81c26b6175f3b83d25d24e79e4fc0b80701f8612b6e644a72e71db530258dd9b"
        },
        {
          "name": "get_bundle",
          "description": "Retrieve the URLs and metadata from a UURL.at short link, including QR code URLs. Use this to inspect what URLs are behind a uurl.at link.",
          "inputSchema": {
            "properties": {
              "rid": {
                "description": "The 6-character short ID from the URL (e.g. 'Ab3cDe' from https://uurl.at/Ab3cDe).",
                "type": "string"
              }
            },
            "required": ["rid"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a043915196a12a3779a9e612dfdd00b2c70f35735359e3c669e0ae5568d0182"
        }
      ],
      "digest": "sha256:c6aff4f1dbea6665989c64050e601d2e5a61bd68b6e2eb742be5420412dc3e6b"
    }
  }
}
