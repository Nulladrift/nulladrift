                "type": "object"
              },
              "files": {
                "description": "Also return the texts of AGENTS.md, CREDITS.md, first-prompt.txt, install.txt and setup files",
                "type": "boolean"
              },
              "goal": {
                "description": "What to build, in plain words, e.g. 'a Mario-style browser game'",
                "type": "string"
              },
              "on": {
                "description": "Switch parts on or off: {role id: true|false}. Optional parts start off. Assets, agent skills and MCP servers can be switched off, and the brief then says they were removed; parts the plan is built on (libraries, runtimes, services) can only be swapped through picks",
                "type": "object"
              },
              "packs": {
                "description": "Choose a pack, model or font inside a picked source: {role id: item id}",
                "type": "object"
              },
