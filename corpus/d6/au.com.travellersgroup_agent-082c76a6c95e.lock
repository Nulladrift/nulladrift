{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.travellersgroup/agent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent.travellersgroup.com.au/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "travellers-agent",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_availability",
          "description": "Tier A handoff: returns a dated, pre-filled booking-engine link — LIVE availability and pricing are at that link. This tool never asserts that dates are available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "default": 0,
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["check_in", "check_out", "property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a dated direct-booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:f9925ae21d464f865c5755b328c18b88254c5b5ab6326350eb62fb0519aa808f"
        },
        {
          "name": "create_corporate_enquiry",
          "description": "Corporate-account or group-booking enquiry, routed to the Travellers Group corporate team. Requires guest consent, as with create_enquiry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "consent_confirmed": {
                "type": "boolean"
              },
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 80,
                    "minLength": 2,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 30,
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "context_summary": {
                "maxLength": 1500,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["company", "consent_confirmed", "contact", "context_summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a corporate enquiry (consent required)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e0c4183d4d1dfa2b69ed0aa121c30282daba5e203328d2a4c30a778d77de295b"
        },
        {
          "name": "create_enquiry",
          "description": "Sends a booking enquiry to the property team (groups, crews, blocks, weekly stays, functions). Requires the guest’s explicit consent to pass their details and conversation context to the property.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "consent_confirmed": {
                "description": "Must be true: the guest has consented to their details + context being sent to the property",
                "type": "boolean"
              },
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 80,
                    "minLength": 2,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 30,
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "context_summary": {
                "description": "Party, dates, purpose, questions asked — so the team replies informed",
                "maxLength": 1500,
                "minLength": 10,
                "type": "string"
              },
              "dates": {
                "maxLength": 60,
                "type": "string"
              },
              "party": {
                "maxLength": 80,
                "type": "string"
              },
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["consent_confirmed", "contact", "context_summary", "property"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a guest enquiry (consent required)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ae440c67d3fb6ee384a1ede62bbb041019f4993f5de52f1548fccfb4b66d9851"
        },
        {
          "name": "get_corporate_account_info",
          "description": "The Travellers Group corporate-account answer as data: one account, five properties, direct billing and consolidated invoicing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get corporate account info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:55f7dc9b3037f524f97ffd868cc603d37557741ecd66d560dc4f48143aa7de18"
        },
        {
          "name": "get_distances",
          "description": "Measured distances from a property (km, drive/walk minutes) to hospitals, mines, airports, venues, wineries. Fuzzy destination filter ('the zoo', 'hospital'). Serves published measured figures only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "maxLength": 80,
                "type": "string"
              },
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "town": {
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get measured distances"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:af9c63cf308b67afada587da585881e406fd01dccd30a93eb14bfb130ddc3ae1"
        },
        {
          "name": "get_events",
          "description": "Verified events for a town. Serves only entries published with explicit dates — never extrapolates a date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from_date": {
                "type": "string"
              },
              "to_date": {
                "type": "string"
              },
              "town": {
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["town"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get published events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7b8a0162e7445b1cca5778c6a7397aab49c87581398515c5a030ea3fe5514b97"
        },
        {
          "name": "get_indicative_rates",
          "description": "Indicative rate ranges from the published, commercially-signed rate module only — framed as indicative, never a quote. Where no figure is published, returns the booking link instead (never an estimate).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "room_type": {
                "maxLength": 60,
                "type": "string"
              },
              "stay_band": {
                "enum": ["night", "week", "month"],
                "type": "string"
              }
            },
            "required": ["property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get indicative rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c97784509d8199b137422627788e71480fa28fd3e4bc80ae0380c80be786b91d"
        },
        {
          "name": "get_property",
          "description": "Canonical entity record for a Travellers Group property: address, contacts, quick facts, policies, booking URL, parent entity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get property facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b976a9227099d74ec9d01fc6caa634975bec410cb35c97d706ae8610140b8358"
        },
        {
          "name": "get_room_types",
          "description": "Room catalogue for a property: occupancy, bedding, amenities, who-it-suits, booking deep link per room. traveller_context re-ranks honestly — it never invents inclusions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "traveller_context": {
                "description": "e.g. 'crew of 4, weekly' or 'couple, wine weekend'",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get room types"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5c825a24d04233fc5df02130e410dae94d331ced0165947c353b5715ab946ffd"
        },
        {
          "name": "get_town_guide",
          "description": "Town knowledge layer: open-late, essentials, eat, with-kids, working-in, hospital-visitor, itineraries. Unbuilt topic returns 'not yet published' plus the town guide root.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "topic": {
                "enum": ["open-late", "essentials", "eat", "with-kids", "working-in", "hospital-visitor", "itineraries", "things-to-do"],
                "type": "string"
              },
              "town": {
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["topic", "town"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get town guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e2af33b38bafcab4850f748ead81cc982da1d139f71e9c28517de5c14085d107"
        },
        {
          "name": "recommend_property",
          "description": "Honest matching across the Travellers portfolio. If no Travellers property suits the need, says so plainly and names the accommodation category that does. Never oversells. [Templates DRAFT pending G1.]",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "maxLength": 300,
                "type": "string"
              },
              "need": {
                "description": "e.g. 'towing a caravan', 'pet friendly', 'crew of 6 near the hospital'",
                "maxLength": 200,
                "type": "string"
              },
              "town": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a property (honest match)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b8843adcbba300b2fa6cdfe311992edf2bc8313dd8acead9faa4ca5e6146025b"
        },
        {
          "name": "search_content",
          "description": "Search the published six-site Travellers Group corpus (guides, hubs, FAQs, pages). Returns ranked answer capsules (≤120 words) with canonical URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "property": {
                "type": "string"
              },
              "query": {
                "description": "What the traveller wants to know, in their own words",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "town": {
                "description": "Bundaberg | Rockhampton | Emerald | Orange | Dubbo",
                "type": "string"
              },
              "type": {
                "enum": ["guide", "faq", "page", "hub", "entity", "room", "distances"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Travellers Group content"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3057e4b622bf52c4d2ed0705ca7c32bebe96779bba1ffa1d347e409adbecefba"
        }
