{
  "lockfileVersion": 2,
  "subjects": {
    "au.com.travellersgroup/agent": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent.travellersgroup.com.au/v1/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "travellers-agent",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_availability",
          "description": "Tier A handoff: returns a dated, pre-filled booking-engine link — LIVE availability and pricing are at that link. This tool never asserts that dates are available.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "adults": {
                "default": 2,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "check_out": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "children": {
                "default": 0,
                "maximum": 12,
                "minimum": 0,
                "type": "integer"
              },
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["check_in", "check_out", "property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a dated direct-booking link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5cd5402c280e098a9f238edcf4a95cc574aef0023873b90e76cfe57c683d56ef"
        },
        {
          "name": "create_corporate_enquiry",
          "description": "Corporate-account or group-booking enquiry, routed to the Travellers Group corporate team. Requires guest consent, as with create_enquiry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "company": {
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "consent_confirmed": {
                "type": "boolean"
              },
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 80,
                    "minLength": 2,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 30,
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "context_summary": {
                "maxLength": 1500,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["company", "consent_confirmed", "contact", "context_summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a corporate enquiry (consent required)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e2c2f35cb09bddd20381b56a29b9e9734081b0ef644e6a3846b5b6ee096202d2"
        },
        {
          "name": "create_enquiry",
          "description": "Sends a booking enquiry to the property team (groups, crews, blocks, weekly stays, functions). Requires the guest’s explicit consent to pass their details and conversation context to the property.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "consent_confirmed": {
                "description": "Must be true: the guest has consented to their details + context being sent to the property",
                "type": "boolean"
              },
              "contact": {
                "additionalProperties": false,
                "properties": {
                  "email": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 80,
                    "minLength": 2,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 30,
                    "type": "string"
                  }
                },
                "required": ["email", "name"],
                "type": "object"
              },
              "context_summary": {
                "description": "Party, dates, purpose, questions asked — so the team replies informed",
                "maxLength": 1500,
                "minLength": 10,
                "type": "string"
              },
              "dates": {
                "maxLength": 60,
                "type": "string"
              },
              "party": {
                "maxLength": 80,
                "type": "string"
              },
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["consent_confirmed", "contact", "context_summary", "property"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Send a guest enquiry (consent required)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43e670b29ed1d79fb09ed5c86ea28c67f830c7f04bafff8f18b6a1eb4af3e4e3"
        },
        {
          "name": "get_corporate_account_info",
          "description": "The Travellers Group corporate-account answer as data: one account, five properties, direct billing and consolidated invoicing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get corporate account info"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:65950ea35b89e40a167113fa02f576f8b371eebc9a1ca2d23201ba00bdd75b49"
        },
        {
          "name": "get_distances",
          "description": "Measured distances from a property (km, drive/walk minutes) to hospitals, mines, airports, venues, wineries. Fuzzy destination filter ('the zoo', 'hospital'). Serves published measured figures only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "destination": {
                "maxLength": 80,
                "type": "string"
              },
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "town": {
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get measured distances"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05b9324c3f24fc4dacfbb3b19de98d46c6ca65c4a7491c2dc37322782b9acd9f"
        },
        {
          "name": "get_events",
          "description": "Verified events for a town. Serves only entries published with explicit dates — never extrapolates a date.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "from_date": {
                "type": "string"
              },
              "to_date": {
                "type": "string"
              },
              "town": {
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["town"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get published events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24e2825e59a97a9b17810ef3c7d23bd76c7be493fbb728572f2357237b66114e"
        },
        {
          "name": "get_indicative_rates",
          "description": "Indicative rate ranges from the published, commercially-signed rate module only — framed as indicative, never a quote. Where no figure is published, returns the booking link instead (never an estimate).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "room_type": {
                "maxLength": 60,
                "type": "string"
              },
              "stay_band": {
                "enum": ["night", "week", "month"],
                "type": "string"
              }
            },
            "required": ["property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get indicative rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:41a35b495da062c7363e77dfc8917bd95b7f1f01ece63ea7c5b4eb81f2a04bc7"
        },
        {
          "name": "get_property",
          "description": "Canonical entity record for a Travellers Group property: address, contacts, quick facts, policies, booking URL, parent entity.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get property facts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6d569d413a04a814ed6e4c91223a4c0e501192b565f33457fde39b3c313d106c"
        },
        {
          "name": "get_room_types",
          "description": "Room catalogue for a property: occupancy, bedding, amenities, who-it-suits, booking deep link per room. traveller_context re-ranks honestly — it never invents inclusions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "property": {
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "traveller_context": {
                "description": "e.g. 'crew of 4, weekly' or 'couple, wine weekend'",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["property"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get room types"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9a2a9624ae75098b1cf72bd8e449d6022334b35186ee7c9a573a4171378533a5"
        },
        {
          "name": "get_town_guide",
          "description": "Town knowledge layer: open-late, essentials, eat, with-kids, working-in, hospital-visitor, itineraries. Unbuilt topic returns 'not yet published' plus the town guide root.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "topic": {
                "enum": ["open-late", "essentials", "eat", "with-kids", "working-in", "hospital-visitor", "itineraries", "things-to-do"],
                "type": "string"
              },
              "town": {
                "maxLength": 40,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["topic", "town"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get town guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b1073e5a8f234818f8c8623b4c2a7ed8d54af174b145b70ebce8eef3db4b59e7"
        },
        {
          "name": "recommend_property",
          "description": "Honest matching across the Travellers portfolio. If no Travellers property suits the need, says so plainly and names the accommodation category that does. Never oversells. [Templates DRAFT pending G1.]",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "context": {
                "maxLength": 300,
                "type": "string"
              },
              "need": {
                "description": "e.g. 'towing a caravan', 'pet friendly', 'crew of 6 near the hospital'",
                "maxLength": 200,
                "type": "string"
              },
              "town": {
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recommend a property (honest match)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:50bb3c15a05111eff16b0d130644413790bdf645b90336e75b027fbb566bf906"
        },
        {
          "name": "search_content",
          "description": "Search the published six-site Travellers Group corpus (guides, hubs, FAQs, pages). Returns ranked answer capsules (≤120 words) with canonical URLs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "property": {
                "type": "string"
              },
              "query": {
                "description": "What the traveller wants to know, in their own words",
                "maxLength": 300,
                "minLength": 2,
                "type": "string"
              },
              "town": {
                "description": "Bundaberg | Rockhampton | Emerald | Orange | Dubbo",
                "type": "string"
              },
              "type": {
                "enum": ["guide", "faq", "page", "hub", "entity", "room", "distances"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Travellers Group content"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:efa8897cedb22cd983c4b4475e9d60ce0b8c008ae595a2229c37549e122e65c0"
        }
      ],
      "digest": "sha256:8baac36cd93de561cf615c9d62c25307e502c73b91034c6636b6f0216b768970"
    }
  }
}
