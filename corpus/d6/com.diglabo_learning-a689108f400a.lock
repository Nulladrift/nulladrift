      "instructions": "diglabo の漢字プリント（小学校の教育漢字、漢検10〜1級）の練習プリントとテストを作るサーバーです。認証は不要です。作ったプリント案は確認用のリンク（30日有効）で開け、プリントの保存と PDF の作成はリンク先のサイトで行われます。\n写真や指定語から小学生のテストを作る原稿方式もあります。利用者のAIが確かめた対象の語・読み・語義・元番号と、作った問題文・正答をまとめた原稿を受け取り、構造・対象との対応・答えの見え方を検査して確認用のリンクを返します。原稿の構造と検査条件、作例を返すツールもあります。形式の指定がない原稿は全問を書き取り（送りがなも解答）にし、写真の見出しや色を理由に読み・混合にはしません。既存のバンクに無い語も受け付けます。サービスは生成AIを使いません。\n算数のプリント（小学1〜6年）の案も作れます。算数は、学年の単元の一覧、単元や言葉で探した問題の型（見本の問題と答えつき）、型と問題数から作った案と確認用のリンクを返します。既存問題の組合せは、写真の図や小問構成を再現できるとは限りません。保護者が diglabo で作った算数の学習のまとめのリンク（7日有効・子の名前を含まない）から、苦手な型・克服した型・単元ごとの取り組み・最近の回の一覧を読めます。",
