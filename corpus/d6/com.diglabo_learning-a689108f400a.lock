        {
          "name": "create_math_difficulty_worksheets",
          "title": "確認した難度別の案を作る",
          "description": "難度別の在庫確認と同じ入力・previewFingerprintで確認リンクを作ります。問題や評価が変わったら再確認を返します。条件を満たす難度の案だけを作り、不足の難度は理由を返します。リンク先で問題を確認して保存するとPDF・画面でとくを利用できます。",
