        {
          "name": "create_kanji_worksheet",
          "title": "プリント案を作る",
          "description": "既存の問題を組み合わせて A4 1枚のプリント案を作り、問題一覧（番号・種類・問題文・答え・字）と確認用の短いリンク（30日有効）を返します。形式を省くと書きと読みのテストになります。書き・読みのテストは字数と同じ問題数（1字1問）で作ります。足りなければ questionCount（24まで）を増やして作り直します。部首・画数テスト（format=test_strokes）・熟語の構成テスト（format=test_structure。1問の差し替えはできない）・対義語・類義語テスト（format=test_pairs。1問の差し替えはできない）・同音異字テスト（format=test_homophones。1問の差し替えはできない）・四字熟語テスト（format=test_yoji・意味つきは test_yoji_meaning。1問の差し替えはできない）・誤字訂正テスト（format=test_correction。4〜2級。1問の差し替えはできない）・同訓異字テスト（format=test_kun_homophones。1問の差し替えはできない）・音と訓テスト（format=test_onkun。4〜6年か7〜5級。4年・7級は1字の形。1問の差し替えはできない）・おなじなかまの漢字テスト（format=test_radical_group。2〜4年か9・8・7級。1問の差し替えはできない）・熟語の一字テスト（format=test_jukugo。5・6年か6・5級。1問の差し替えはできない）・二つの読みテスト（format=test_two_readings。1〜4年か10〜7級・準2・2級。1問の差し替えはできない）・漢字識別テスト（format=test_shikibetsu。4・3級。1問の差し替えはできない）・熟語作りテスト（format=test_tsukuri。4〜6年か7〜5級。1問の差し替えはできない）・よみがなの一字テスト（format=test_kana_blank。1・2年か10・9級）・正しいよみがなテスト（format=test_kana_choice。1年か10級。どちらも1問の差し替えはできない）・対となかまの字テスト（format=test_char_pair。1・2年か10・9級。1問の差し替えはできない）・正しい漢字テスト（format=test_kanji_choice。2年か9級。1問の差し替えはできない）も作れます。プリントの保存と PDF の作成はしません。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "chars": {
                "description": "プリントに載せる字（重複なし）。テスト（書き・読み）は8〜24字、部首・画数テストは4〜6年相当（7〜5級）が6〜12字・ほかは12〜24字、練習は1〜6字。書き・読みのテストで25字以上・8字未満のときは、字の絞り方や分け方の案（proposals）を返す。部首・画数テスト（test_strokes）は6〜12・12〜24字の範囲外なら誤りを返すだけで、proposals は付かない。熟語の構成テスト（test_structure）と対義語・類義語テスト（test_pairs）は6〜22字、同音異字テスト（test_homophones）は3〜12字、四字熟語テスト（test_yoji）は6〜24字、意味つき（test_yoji_meaning）は6〜12字、誤字訂正テスト（test_correction）は6〜24字、同訓異字テスト（test_kun_homophones）は3〜12字、音と訓テスト（test_onkun）・おなじなかまの漢字テスト（test_radical_group）は6〜22字、熟語の一字テスト（test_jukugo）は6〜24字、二つの読みテスト（test_two_readings）は3〜12字、漢字識別テスト（test_shikibetsu）は5・10・15字、熟語作りテスト（test_tsukuri）は 4年・7級が6〜15字、5年・6級が2・4・6字、6年・5級が5・10・15字、よみがなの一字テスト（test_kana_blank）・正しいよみがなテスト（test_kana_choice）は6〜16字、対となかまの字テスト（test_char_pair）は6〜22字、正しい漢字テスト（test_kanji_choice）は6〜16字で、それ以外は誤りを返すだけ。",
                "items": {
                  "type": "string"
                },
                "maxItems": 48,
                "minItems": 1,
                "type": "array"
              },
              "format": {
                "description": "practice（練習）・test_mixed（書きと読み）・test_write（書きだけ）・test_read（読みだけ）・test_strokes（部首・画数テスト。学年か級が必要）・test_structure（熟語の構成テスト。二字熟語の組み立てを記号で答える。5・6年か6〜2級だけ。6・5級は4型、4〜2級は5型）・test_pairs（対義語・類義語テスト。熟語の空いた字を後のひらがなから選んで漢字で書く。4〜6年か7〜2級だけ。4年・7級は対義語だけ、準2・2級は熟語まるごと。字数は6〜22字）・test_homophones（同音異字テスト。同じ音読みで字の違う2問を1組にし、カタカナの読みの漢字を書く。3〜6年か8〜2級だけ。字数は3〜12字（6〜24問）で、相手の字は自動で選ぶ）・test_yoji（四字熟語テスト。1字をカタカナにした四字熟語の、その字を漢字で書く。6年か5〜2級だけ。字数は6〜24字で、語は自動で選ぶ）・test_yoji_meaning（test_yoji に語の意味の短い文を付ける。字数は6〜12字）・test_correction（誤字訂正テスト。文の中で同じ読みの別の字にすり替えた1字を見つけ、誤字と正しい字を書く。4〜2級だけ。字数は6〜24字で、誤字は自動で選ぶ）・test_kun_homophones（同訓異字テスト。同じ訓読みで字の違う2問を1組にして漢字を書く。学年か級が必要。字数は3〜12字で、相手の字は自動で選ぶ）・test_onkun（音と訓テスト。4年・7級は漢字1字の読みが音読みか訓読みか、5・6年と6・5級は二字熟語の読みが音と音・音と訓・訓と訓・訓と音のどれかを記号で答える。4〜6年か7〜5級だけ。字数は6〜22字で、4年・7級は音読み・訓読みの読みがある字を、ほかはイ・ウ・エの語がある字を14字なら2字ずつ、22字なら3字ずつ以上入れる）・test_radical_group（おなじなかまの漢字テスト。部首を示し、同じ部首の字を語の□に書く。2〜4年か9・8・7級だけ。字数は6〜22字で、同じ部首の字を2字以上ずつ入れる）・test_jukugo（熟語の一字テスト。語の1字をカタカナにし、その字を漢字で書く。5・6年か6・5級だけで、5年・6級は三字の語、6年・5級は四字の語。字数は6〜24字で、語は自動で選ぶ）・test_two_readings（二つの読みテスト。同じ字の音読みの語と訓読みの語を2つの文で1組にし、線を引いた語の読みを書く。1〜4年か10〜7級・準2・2級だけで、字数は3〜12字。語は自動で選ぶ）・test_shikibetsu（漢字識別テスト。三つの熟語の□に共通する1字を10字の群から選んで書く。4・3級だけで、字数は5・10・15字。語とはずれの字は自動で選ぶ）・test_tsukuri（熟語作りテスト。4年・7級は上の字の前と後ろに付く字を選び肢から選び、5年・6級は同じ読みの字を群から選んで熟語を作り、6年・5級は意味の文に合う熟語を群の字で作る。4〜6年か7〜5級だけで、字数は4年・7級が6〜15字、5年・6級が2・4・6字、6年・5級が5・10・15字。語・相手の字・はずれの字は自動で選ぶ）・test_kana_blank（よみがなの一字テスト。熟語の読みの1字を□にし、ひらがな1字を書く。1・2年か10・9級だけ）・test_kana_choice（正しいよみがなテスト。正しい読みと誤りの読みから正しいほうの番号を書く。1年か10級だけ）・test_char_pair（対となかまの字テスト。対やなかまの語を手がかりに□の漢字を書く。1・2年か10・9級だけで、字数は6〜22字。手がかりは自動で選び、答えが別の問題の手がかりに見える字の組み合わせは作らない）・test_kanji_choice（正しい漢字テスト。熟語の1字をひらがなにし、正しい漢字の語と形の似た字の語から正しいほうの番号を書く。2年か9級だけで、字数は6〜16字。語と誤りの字は自動で選ぶ）。省くと test_mixed。",
                "enum": ["practice", "test_mixed", "test_write", "test_read", "test_strokes", "test_structure", "test_pairs", "test_homophones", "test_yoji", "test_yoji_meaning", "test_correction", "test_kun_homophones", "test_onkun", "test_radical_group", "test_jukugo", "test_two_readings", "test_shikibetsu", "test_tsukuri", "test_kana_blank", "test_kana_choice", "test_char_pair", "test_kanji_choice"],
                "type": "string"
