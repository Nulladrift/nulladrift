        {
          "name": "create_kanji_worksheet_from_words",
          "title": "語からプリント案を作る",
          "description": "語の一覧（8〜24語）から、1語1問の漢字テスト（書き取り・読み・読み書き）の A4 1枚のプリント案を作り、問題一覧（番号・種類・問題文・答え・字）と確認用の短いリンク（30日有効）を返します。小学校の教育漢字だけです。書き取りでは answers で語ごとの空欄の字を指定できます。問題にできない語や指定の空欄で作れない語が1つでもあると案を作らず、code: unresolved_words で作れない語（words・answersRejected と理由）と残りの語（remainingWords）を返し、作れない語ごとの代わりの語（alternatives。語・種類 kind・元の語と共有する漢字 focus。学年と形式で作れる語だけ）も返します。語を外すかどうかは利用者が決めるもので、このツールが語を外して案を作ることはありません。remainingWords が8語以上なら、その語で案を作れます。リンク先の画面でも空欄を選び直せます。プリントの保存と PDF の作成はしません。",
