            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "the person's answers, keyed by field key",
                "type": "object"
              },
              "confirmation": {
                "description": "the confirmation token from step 1, after the person has approved the summary",
                "type": "string"
              },
              "consent": {
                "description": "true only when the person has agreed to: Send my contact details to up to three notaries holding a notarial warrant in Malta, chosen by Malta Stamp Duty, who'll contact me directly. I'll be emailed each notary's name as my details go to it, and can stop any more notaries getting them.",
                "type": "boolean"
              }
            },
