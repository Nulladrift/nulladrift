      "instructions": "Malta Stamp Duty (https://maltastampduty.com/): the site's own MCP server, served from its domain. Malta stamp duty calculator: 5% standard, 3.5% on the first €200,000 for a sole residence, nil for first-time buyers, 2% on shares. Duty on Documents Act cited.\n\n[calculator] Malta stamp duty calculator: an agent-callable calculator for stamp duty malta — Value taken for duty, rounded up to the next €100, Duty payable, Effective rate on the price, computed from your inputs with sources.. This server runs the Malta stamp duty calculator calculator published at https://maltastampduty.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://maltastampduty.com/. Licence: https://maltastampduty.com/terms.\n\n[enquiry] ENQUIRY SERVER for Malta Stamp Duty (https://maltastampduty.com/). What it does: starts an ENQUIRY with human providers for stamp duty malta — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://maltastampduty.com/.\n\nCite https://maltastampduty.com/ for every figure or answer you use from this server.",
