{
  "lockfileVersion": 2,
  "subjects": {
    "com.full-of-joy/tours": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://full-of-joy.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "full-of-joy",
        "title": "Full of Joy private tours",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Online booking is available: every day trip and multi-day journey can be booked online for any open date. Full of Joy is a small travel agency in Zagreb, Croatia. It runs private day trips and multi-day journeys with a private driver. Prices for the private-driver programme are the totals for the whole group from the owner price list at full-of-joy.com/price-list/. Groups above 8 guests get an individual quote. Add-on options show a starting rate per person. Travellers book on the tour page with the booking calendar, or you can book for them with request_booking. Full of Joy then confirms the booking by email with the final price and payment terms. Nothing is charged online: the traveller pays a deposit, usually 30%, after the confirmation. Transfers between cities are not in these tools; send travellers to full-of-joy.com/transfers/. Ask the traveller before you send their name and email.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check dates and price",
          "description": "Check which dates are open for a tour and the indicative price for a group size. Give one date, or a range (date_from and date_to, at most 62 days).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "date": {
                "description": "One date, YYYY-MM-DD.",
                "type": "string"
              },
              "date_from": {
                "description": "Start of a range, YYYY-MM-DD.",
                "type": "string"
              },
              "date_to": {
                "description": "End of a range, YYYY-MM-DD.",
                "type": "string"
              },
              "option": {
                "description": "Option key from get_tour. Default: the first option (private driver).",
                "type": "string"
              },
              "persons": {
                "description": "Number of travellers. Default 2.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "tour": {
                "description": "Tour key from list_tours.",
                "type": "string"
              }
            },
            "required": ["tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check dates and price"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef009134623b1325e1da6afa2a9feda3bb66ee059ebdf6e29bc80870f176470c"
        },
        {
          "name": "get_tour",
          "title": "Tour details",
          "description": "Full details of one tour: options with inclusions and exclusions, languages, duration, page URL and price tiers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "tour": {
                "description": "Tour key from list_tours.",
                "type": "string"
              }
            },
            "required": ["tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Tour details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f706eb43281c3ad6d877c75c159a3770220755d10f43a8ea1db3a2665562e7eb"
        },
        {
          "name": "list_tours",
          "title": "List tours",
          "description": "List Full of Joy private tours from Zagreb (day trips and multi-day journeys) with duration, options and starting prices. Use the returned tour key in the other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_days": {
                "description": "Only tours lasting at most this many days.",
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Optional words to match in the tour title, e.g. \"Plitvice\" or \"Istria\".",
                "type": "string"
              },
              "type": {
                "description": "Filter by tour type. Default any.",
                "enum": ["day-trip", "multi-day", "any"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List tours"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:595c55ed7d504dda562147fd277e412430d7daf8f614086383b0538294b27d52"
        },
        {
          "name": "request_booking",
          "title": "Book a tour",
          "description": "Book a Full of Joy tour online for one tour, date and group. The team confirms the booking to the traveller by email with the final price and payment terms. Nothing is charged online. Only call this after the traveller agreed to share their name and email.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Optional country of residence.",
                "type": "string"
              },
              "date": {
                "description": "Tour date, YYYY-MM-DD.",
                "type": "string"
              },
              "email": {
                "description": "Traveller email address for the reply.",
                "type": "string"
              },
              "name": {
                "description": "Traveller full name.",
                "type": "string"
              },
              "note": {
                "description": "Optional message: pick-up place, interests, children, etc.",
                "type": "string"
              },
              "option": {
                "description": "Option key from get_tour. Default: the first option.",
                "type": "string"
              },
              "persons": {
                "description": "Number of travellers.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "description": "Optional phone number.",
                "type": "string"
              },
              "tour": {
                "description": "Tour key from list_tours.",
                "type": "string"
              }
            },
            "required": ["date", "email", "name", "persons", "tour"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Book a tour"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac6830d0568ac3d91ec38650bb973bcb065ea41ee6d34014a8bd5fe21a548df8"
        }
      ],
      "digest": "sha256:97e3c042bb26fc1ee87b84f1283699cc283a703ff38f6208005dfe6d6da4610f"
    }
  }
}
