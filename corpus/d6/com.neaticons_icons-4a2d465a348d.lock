{
  "lockfileVersion": 2,
  "subjects": {
    "com.neaticons/icons": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.neaticons.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "neat-icons",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_icon",
          "description": "One icon as ready-to-paste code. format svg = SVG markup, jsx = a React component, data-uri = for CSS or <img>. Default color currentColor so it follows the text color. Free mode (no seat key): every icon can be searched, 201 free ones come back as code; the rest need a license (https://neaticons.com/#pricing).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "animated": {
                "default": false,
                "description": "true = the icon's hover animation. format svg returns inline SVG with its own <style> (paste it into the HTML, not an <img>); format jsx returns an import from @neaticons/react/animated. data-uri can't animate.",
                "type": "boolean"
              },
              "color": {
                "default": "currentColor",
                "description": "Any CSS color; keep currentColor to inherit",
                "type": "string"
              },
              "format": {
                "default": "svg",
                "enum": ["svg", "jsx", "data-uri"],
                "type": "string"
              },
              "name": {
                "description": "Exact icon name from search_icons, e.g. 'wallet'",
                "type": "string"
              },
              "size": {
                "default": 24,
                "maximum": 512,
                "minimum": 8,
                "type": "integer"
              },
              "style": {
                "default": "rounded-stroke",
                "description": "rounded-stroke (default, calm UI), rounded-solid (selected / active), sharp-stroke, sharp-solid",
                "enum": ["rounded-stroke", "rounded-solid", "sharp-stroke", "sharp-solid"],
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dc632f2af1cf7ca1bc29b30cb66341e3ce6e75d8da4755af84c3c0f145324042"
        },
        {
          "name": "get_icons",
          "description": "Several icons at once (same style, size, color, format). Use for nav bars, tab bars, menus. Free mode (no seat key): every icon can be searched, 201 free ones come back as code; the rest need a license (https://neaticons.com/#pricing).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "animated": {
                "default": false,
                "description": "true = the icon's hover animation. format svg returns inline SVG with its own <style> (paste it into the HTML, not an <img>); format jsx returns an import from @neaticons/react/animated. data-uri can't animate.",
                "type": "boolean"
              },
              "color": {
                "default": "currentColor",
                "type": "string"
              },
              "format": {
                "default": "svg",
                "enum": ["svg", "jsx", "data-uri"],
                "type": "string"
              },
              "names": {
                "items": {
                  "type": "string"
                },
                "maxItems": 40,
                "minItems": 1,
                "type": "array"
              },
              "size": {
                "default": 24,
                "maximum": 512,
                "minimum": 8,
                "type": "integer"
              },
              "style": {
                "default": "rounded-stroke",
                "description": "rounded-stroke (default, calm UI), rounded-solid (selected / active), sharp-stroke, sharp-solid",
                "enum": ["rounded-stroke", "rounded-solid", "sharp-stroke", "sharp-solid"],
                "type": "string"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:094059660cfe251b34bf1b7aaf02860aa6f90af83b18dee23ceb697fd302192b"
        },
        {
          "name": "list_categories",
          "description": "All Neat Icons categories with their id and icon count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:932511d7ce4629fae40e85d5f385dada1a86601fb76ee226a8000b5a1cd106ec"
        },
        {
          "name": "search_icons",
          "description": "Search Neat Icons (1161 icons, 4 styles, 24px grid). Use plain words for what the icon shows (\"wallet\", \"arrow left\", \"hijri calendar\"). Returns icon names to pass to get_icon. Each result says free: true or false. Free mode (no seat key): every icon can be searched, 201 free ones come back as code; the rest need a license (https://neaticons.com/#pricing).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Optional category id or title from list_categories",
                "type": "string"
              },
              "limit": {
                "default": 24,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the icon should show, e.g. 'delete', 'saudi riyal', 'user add'",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6c6d209ed9b38bc04021edffe6935ed356014708f015d2dbdf4b23a7cf06a4a9"
        }
      ],
      "digest": "sha256:47afc5c83bac3e620cb447aea828423e52a8e75ddddea593eb101e298af4856b"
    }
  }
}
