            "readOnly": true
          },
          "digest": "sha256:520a3b69609b13565a53bdcdf97589f80029090f7158e93e57e373d1f52ec168"
        },
        {
          "name": "rotase_create_demo_project",
          "title": "Create a Rotase demo project",
          "description": "Create a localized demonstration project using the same project-creation operation as the Rotase API. The server chooses the current period in the requested timezone, loads the localized demo names and company name, applies the selected country calendar and can generate an initial schedule. The result is returned in the response; nothing is saved on the server or in a browser.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Settings for the same projects/create API operation. All fields are optional; defaults are country PL, language en, kind DEMO and the timezone selected for the country.",
            "properties": {
              "closeOnHolidays": {
                "type": "boolean"
              },
              "country": {
                "description": "ISO country code, for example PL, DE, GB or US.",
                "type": "string"
              },
              "kind": {
                "enum": ["DEMO", "EMPTY"],
                "type": "string"
              },
              "language": {
                "description": "Demo language code, for example en, pl, de, fr or es.",
                "type": "string"
              },
              "region": {
                "description": "Optional region code supported by the selected country.",
                "type": ["string", "null"]
              },
              "timezone": {
                "description": "IANA timezone, for example Europe/Warsaw.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "optimization": {
                "type": ["object", "null"]
              },
              "project": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "readOnlyHint": false
          },
          "behavior": {
