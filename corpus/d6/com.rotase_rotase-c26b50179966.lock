      "instructions": "Rotase is a stateless employee-scheduling service. It does not read or save projects in a user's browser and it does not require an account.\n\nRecommended workflow:\n1. If the user wants a ready-made starting point, call rotase_create_demo_project with the desired country, language and timezone.\n2. Otherwise call rotase_examples when the project shape or field names are unknown.\n3. Use the returned project object as a template and edit only the required business data.\n4. Call rotase_validate_project before feasibility checks or schedule generation.\n5. Call rotase_check_feasibility when the user asks whether the requirements can be satisfied.\n6. Call rotase_generate_schedule to calculate a schedule after validation. It returns results but does not save them.\n7. Call rotase_schedule_report or rotase_export_csv after generation when the user asks for a report or spreadsheet export. Pass the generated schedule as the top-level \"schedule\" argument or include it in the project's \"schedules\" array.\n8. Report validation errors, shortages and violations clearly. Never claim that a project was saved or that legal compliance is guaranteed.\n9. Do not invent missing employees, opening hours or requirements. Ask the user for missing business facts.\n\nTool arguments are the complete project object itself. Do not wrap it in an additional \"project\" property. Tool calls use JSON-RPC over POST /mcp.",
      "tools": [
        {
          "name": "rotase_check_feasibility",
          "title": "Check schedule feasibility",
          "description": "Check whether a complete Rotase project can satisfy opening hours, staffing requirements, availability, rest rules and work-hour limits. Use after rotase_validate_project and before generation when the user asks whether a schedule is possible. This operation is read-only and does not save or modify the project.",
          "inputSchema": {
            "additionalProperties": true,
            "description": "The complete Rotase project object. Use the object returned as the \"project\" field by rotase_examples as a template. Required top-level sections are project, store and employees; availability, preferences, monthlyTargets and schedules may be empty arrays when unused.",
            "properties": {
              "availability": {
                "type": "array"
              },
              "employees": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "monthlyTargets": {
                "type": "array"
              },
              "preferences": {
                "type": "array"
              },
              "project": {
                "type": "object"
              },
              "schedules": {
                "items": {
                  "type": "object"
                },
                "type": "array"
              },
              "schemaVersion": {
                "type": "string"
              },
              "store": {
                "type": "object"
              }
            },
            "required": ["employees", "project", "store"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Operation-specific Rotase result. Read the returned content and structuredContent fields; validation and feasibility results may contain violations, shortages or explanatory messages.",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
