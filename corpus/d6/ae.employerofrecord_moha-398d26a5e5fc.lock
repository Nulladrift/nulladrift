        },
        {
          "name": "get_quote",
          "title": "Price a hire in the UAE",
          "description": "Monthly and upfront cost of employing one person in the UAE through Moha, an Employer of Record: salary split, employer costs, government fees, insurance, our fee and VAT, plus how long the visa takes. No account needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "children": {
                "description": "Children moving with them on family visas.",
                "maximum": 10,
                "minimum": 0,
                "type": "integer"
              },
              "emirate": {
                "description": "Where they will work. Defaults to Dubai.",
                "enum": ["Dubai", "Abu Dhabi", "Sharjah", "Ajman", "Ras Al Khaimah", "Fujairah", "Umm Al Quwain"],
                "type": "string"
              },
              "inside_uae": {
                "description": "True if the person is already in the UAE. Defaults to false (coming from abroad).",
                "type": "boolean"
              },
              "insurance": {
                "description": "Health insurance plan. Defaults to standard.",
                "enum": ["basic", "standard", "premium"],
                "type": "string"
              },
              "monthly_salary_aed": {
                "description": "Total monthly package in AED: basic salary plus allowances. Example: 20000.",
                "type": "number"
              },
              "nationality": {
                "description": "The employee’s nationality, as a country name. Example: India.",
                "type": "string"
              },
              "spouse": {
                "description": "True if a spouse will move with them on a family visa.",
                "type": "boolean"
              }
            },
            "required": ["monthly_salary_aed", "nationality"],
            "type": "object"
          },
          "annotations": {
