        {
          "name": "prepare_account",
          "title": "Prepare a whole account for the person to confirm",
          "description": "Prepares a Moha account without signing in: company profile, the person setting it up, one to ten hires and colleagues to invite. Returns the quotes and one link to confirm. Moha checks the company first; hires go ahead and colleagues are invited only once approved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "additionalProperties": false,
                "description": "The hiring company.",
                "properties": {
                  "billing_email": {
                    "description": "Gets the invoices.",
                    "type": "string"
                  },
                  "headquarters_country": {
                    "type": "string"
                  },
                  "industry": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "website": {
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "hires": {
                "description": "The people to hire.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "children": {
                      "description": "Children moving with them on family visas.",
                      "maximum": 10,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "emirate": {
                      "description": "Where they will work. Defaults to Dubai.",
                      "enum": ["Dubai", "Abu Dhabi", "Sharjah", "Ajman", "Ras Al Khaimah", "Fujairah", "Umm Al Quwain"],
                      "type": "string"
                    },
                    "employee_email": {
                      "description": "The employee’s personal email, if known.",
                      "type": "string"
                    },
                    "first_name": {
                      "description": "The employee’s first name.",
                      "type": "string"
                    },
                    "inside_uae": {
                      "description": "True if the person is already in the UAE. Defaults to false (coming from abroad).",
                      "type": "boolean"
                    },
                    "insurance": {
                      "description": "Health insurance plan. Defaults to standard.",
                      "enum": ["basic", "standard", "premium"],
                      "type": "string"
                    },
                    "job_title": {
                      "description": "Their job title. It goes on the work permit, so use the real one.",
                      "type": "string"
                    },
                    "last_name": {
                      "description": "The employee’s last name.",
                      "type": "string"
                    },
                    "monthly_salary_aed": {
                      "description": "Total monthly package in AED: basic salary plus allowances. Example: 20000.",
                      "type": "number"
                    },
                    "nationality": {
                      "description": "The employee’s nationality, as a country name. Example: India.",
                      "type": "string"
                    },
                    "spouse": {
                      "description": "True if a spouse will move with them on a family visa.",
                      "type": "boolean"
                    },
                    "start_date": {
                      "description": "Wanted start date, YYYY-MM-DD. At least two weeks from today; earlier dates are moved to the earliest possible.",
                      "type": "string"
                    }
                  },
                  "required": ["first_name", "job_title", "last_name", "monthly_salary_aed", "nationality"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "team": {
                "description": "Colleagues to invite when the account is created, each with a role.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "email": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "role": {
                      "enum": ["admin", "hr", "finance", "manager", "viewer"],
                      "type": "string"
                    }
                  },
                  "required": ["email", "name", "role"],
                  "type": "object"
                },
                "maxItems": 10,
                "type": "array"
              },
              "you": {
                "additionalProperties": false,
                "description": "The person setting up the account.",
                "properties": {
                  "email": {
                    "description": "Their work email, on their company’s domain. Personal, forwarding and throwaway addresses are refused.",
                    "type": "string"
                  },
                  "job_title": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["company", "hires"],
            "type": "object"
          },
