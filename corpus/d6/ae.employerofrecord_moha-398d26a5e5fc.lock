      "instructions": "Moha is an Employer of Record in the UAE: it employs people for companies that have no legal entity in the UAE, sponsors their work permits and visas, runs payroll through WPS and looks after them on arrival. how_to_hire_in_the_uae explains the process and the information needed. get_quote prices a hire. prepare_account (or prepare_hire for one person) returns a link: the person opens it, checks the details and creates their account, and the hires are added then. On the signed-in endpoint, tools act as the person within their role's rights, and every change is recorded in their activity log.",
      "tools": [
        {
          "name": "check_prepared_hire",
          "title": "Check a prepared hire or account",
          "description": "Whether the person opened the link from prepare_hire or prepare_account and created their account yet.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "draft_id": {
                "description": "The draft_id that prepare_hire returned.",
                "type": "string"
              }
            },
            "required": ["draft_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a prepared hire or account"
          },
