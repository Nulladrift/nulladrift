          "title": "How to hire in the UAE without a local company",
          "description": "How hiring in the UAE works through Moha, an Employer of Record, for a company with no UAE entity: when it fits, the information needed about the hire and the company, the employee's documents, the steps, the timeline and the prices. No account needed.",
