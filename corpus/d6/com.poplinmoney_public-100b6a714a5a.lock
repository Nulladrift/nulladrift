{
  "lockfileVersion": 2,
  "subjects": {
    "com.poplinmoney/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agents.poplinmoney.com/public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Poplin",
        "version": "1.0.2"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Published facts about Poplin, an app for getting paid in several currencies and sending money to bank accounts in many countries. Bank payments are carried out by Poplin's payment partners. These tools read public information only: they cannot see anyone's account, sign anyone in or move money. When you relay a quote, say it is an estimate and include the fees. Every answer ends with a link into the Poplin app, where people sign up and do everything else; share that link rather than describing how to act. A question about the person's own account, such as their balance or a payment, can't be answered here: send them to the Poplin app at https://app.poplinmoney.com/?utm_campaign=ai-connector, and give no other address for it. The rate history shows past market exchange rates only: don't forecast exchange rates or advise when to convert.",
      "tools": [
        {
          "name": "get_business_requirements",
          "title": "Business sign-up requirements",
          "description": "Shows what a business in a country is asked for when it signs up: the company types its registry recognizes and what that registry calls the standard documents. Use it when a business owner asks what they need to get started.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business sign-up requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cb2872ca7e26d2b5631b083cd960505f81251c2bc691e87c6d17403eeda4a8cf"
        },
        {
          "name": "get_payout_options",
          "title": "Sending to bank accounts",
          "description": "Lists where money can be sent to a bank account: the country, the currency it arrives in, the method, the fee, the largest amount and how fast it arrives, for personal and business accounts. Give a country, a currency or both. Use it when someone asks whether they can send money to a country, what it costs or how long it takes.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sending to bank accounts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7ffc9c11b631e319b0f757369a3ecbc0b7d0f36faeca7f585f7a0e7c8233fffc"
        },
        {
          "name": "get_rate_history",
          "title": "Rate history",
          "description": "Shows how the market exchange rate from US dollars to another currency has moved over the last 24 hours, 7 days, 30 days, 90 days or a year. It is the rate before any fees, so it is not the rate a payment is priced at, and a past series is no forecast. Use it when someone asks how a currency has moved against the dollar. Don't forecast the rate or advise when to convert, all at once or in stages, from this or any other source.",
          "inputSchema": {
            "properties": {
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "range": {
                "enum": ["24h", "7d", "30d", "90d", "1y"],
                "type": "string"
              }
            },
            "required": ["currency", "range"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rate history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d32b13ed8c44c51ad2ca80a927029f2e9b9d0130572b26a7a65b5f14c6de3a9f"
        },
        {
          "name": "get_receive_quote",
          "title": "Receive quote",
          "description": "Estimates how many US dollars arrive in a Poplin account when someone pays to its account details in another currency, with the rate, the fees and the limits on the payment, for personal and business accounts at standard pricing. Use it when someone asks what they would receive for a payment in a currency such as EUR or GBP. It is an estimate; the final terms are shown in the Poplin app.",
          "inputSchema": {
            "properties": {
              "amount": {
                "maxLength": 40,
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "required": ["amount", "currency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Receive quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8c129893079d3854234f437e45b7572777711c4163369b6878c5ec377d264a8b"
        },
        {
          "name": "get_receiving_accounts",
          "title": "Account details",
          "description": "Lists the currencies Poplin gives account details in, whether those details take payments from other people, and the fee and the limits on a payment received, for personal and business accounts. Pass a country to see whether people living there can get each currency's account details. Use it when someone asks how to get paid by bank transfer, in which currencies, or what it costs.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Account details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:05804063d88090c15d42303de295e1e31e2b83a931fe2f642e8753e3d465bce4"
        },
        {
          "name": "get_send_quote",
          "title": "Send quote",
          "description": "Estimates sending money to a bank account from a Poplin account: how much is sent in US dollars, how much arrives in the other currency, the rate, the fees, the limits and how fast it arrives, for personal and business accounts at standard pricing. Use it when someone asks what a payment would cost or how much the recipient would get. It is an estimate; the final terms are shown in the Poplin app before anything is confirmed.",
          "inputSchema": {
            "properties": {
              "amount": {
                "maxLength": 40,
                "type": "string"
              },
              "amount_is": {
                "default": "sent",
                "enum": ["sent", "received"],
                "type": "string"
              },
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "required": ["amount", "currency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Send quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9d5f39132ea714662f05cd47f905dc48e64f9dd16ef2bf5534f5c32c568eeef"
        },
        {
          "name": "get_stablecoin_networks",
          "title": "Stablecoin networks",
          "description": "Lists the networks that stablecoins such as USDC can be received from and sent to, with the fee and speed for each, and Poplin's home network. Use it only when someone asks about receiving or sending stablecoins.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stablecoin networks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3c112239aed5eb573687dfdee317029a930ddbf1ef8874766f0d1f5df32f2cd"
        },
        {
          "name": "get_stablecoin_transfer_quote",
          "title": "Stablecoin transfer quote",
          "description": "Estimates the fee and speed of sending USDC from Poplin to another network, such as Base or Ethereum, for a fast and a standard transfer. Use it only when someone asks about sending stablecoins to another network.",
          "inputSchema": {
            "properties": {
              "amount": {
                "maxLength": 40,
                "type": "string"
              },
              "network": {
                "enum": ["ethereum", "base", "arbitrum", "optimism", "polygon", "avalanche", "unichain", "linea", "codex", "sonic", "worldchain", "monad", "xdc", "hyperevm", "ink", "plume", "arc", "edge", "morph", "pharos", "cronos"],
                "type": "string"
              }
            },
            "required": ["amount", "network"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stablecoin transfer quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24dba0b8475bad200d2a79ef1960b4a317f933bf97f43d0caf42fc03392e6c5c"
        },
        {
          "name": "get_supported_countries",
          "title": "Supported countries",
          "description": "Says which countries people can sign up to Poplin from, including any regions that are excluded, and which countries money can be sent to. Pass a country to check one. Use it when someone asks whether Poplin works where they live or where they want to send money.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Supported countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8402ce5a8740a9b988a1010df3ff3e12841cd0121aae6073f7939879563efb2"
        },
        {
          "name": "list_banks",
          "title": "Banks reached",
          "description": "Lists the banks money can be sent to in a country, with the other names people know them by. Use it when someone asks whether a particular bank is supported. Only some countries have a bank list.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Banks reached"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:32da03108a6870ac5dd41bf9c423c35313d0b2dad7a71f45491660cf471c2e3e"
        },
        {
          "name": "list_legal_documents",
          "title": "Legal documents",
          "description": "Lists Poplin's published legal documents, such as the terms of service, privacy policy and risk disclosure, with a link to the full text of each. Use it when someone asks about Poplin's terms, policies or what it doesn't allow. It returns links, not summaries.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Legal documents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5bcdc0357d0ef30017baf0fd6e7e6f59301d5722ee4453e87e5dbd8faa73efb0"
        }
      ],
      "digest": "sha256:e0f3ce5b160617e63555f070a89683c68598bd8a3a8e5563075e51047875ec9f"
    }
  }
}
