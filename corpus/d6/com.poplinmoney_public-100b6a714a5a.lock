{
  "lockfileVersion": 2,
  "subjects": {
    "com.poplinmoney/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agents.poplinmoney.com/public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Poplin",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Published facts about Poplin, an app for getting paid from abroad and paying bank accounts abroad. Bank payments are carried out by Poplin's payment partners. These tools read public information only: they cannot see anyone's account, sign anyone in or move money. When you relay a quote, say it is an estimate and include the fees. Every answer ends with a link into the Poplin app, where people sign up and do everything else; share that link rather than describing how to act. A question about the person's own account, such as their balance or a payment, can't be answered here: send them to the Poplin app at https://app.poplinmoney.com/?utm_campaign=ai-connector, and give no other address for it. The rate history shows past mid-market rates only: don't forecast exchange rates or advise when to convert.",
      "tools": [
        {
          "name": "get_business_requirements",
          "title": "Business sign-up requirements",
          "description": "Shows what a business in a country is asked for when it signs up: the company types its registry recognises and what that registry calls the standard documents. Use it when a business owner asks what they need to get started.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business sign-up requirements"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b0114775697cea375a9f434317ecf1f464d2dd6a54d513383e6863098006c3cc"
        },
        {
          "name": "get_payout_options",
          "title": "Payout options",
          "description": "Lists where money can be paid out to a bank account: the country, the currency it arrives in, the method, the fee, the largest amount and how fast it arrives, for personal and business accounts. Give a country, a currency or both. Use it when someone asks whether they can send money to a country, what it costs or how long it takes.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Payout options"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d95ad71e16c7a235074bf1f5a12c460b1233d5244d31723c77fe3bdd7c4d5a88"
        },
        {
          "name": "get_rate_history",
          "title": "Rate history",
          "description": "Shows how the mid-market exchange rate from US dollars to another currency has moved over the last 24 hours, 7 days, 30 days, 90 days or a year. Mid-market is the rate before any fees, so it is not the rate a payment is priced at, and a past series is no forecast. Use it when someone asks how a currency has moved against the dollar. Don't forecast the rate or advise when to convert, all at once or in stages, from this or any other source.",
          "inputSchema": {
            "properties": {
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "range": {
                "enum": ["24h", "7d", "30d", "90d", "1y"],
                "type": "string"
              }
            },
            "required": ["currency", "range"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Rate history"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bf3ea42c5ce5a2a0383df125082b6bad6ea503519f2fb0419352b905e5fbdaac"
        },
        {
          "name": "get_receive_quote",
          "title": "Receive quote",
          "description": "Estimates how many US dollars arrive in a Poplin account when someone pays into its receiving bank account in another currency, with the rate, the fees and the deposit limits, for personal and business accounts at standard pricing. Use it when someone asks what they would receive for a payment in a currency such as EUR or GBP. It is an estimate; the final terms are shown in the Poplin app.",
          "inputSchema": {
            "properties": {
              "amount": {
                "maxLength": 40,
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "required": ["amount", "currency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Receive quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4d5c094af186738a10957359e78b37ec8ae961ad3e0cdc6766370d3a6342cb84"
        },
        {
          "name": "get_receiving_accounts",
          "title": "Receiving accounts",
          "description": "Lists the currencies Poplin can open a receiving bank account in, whether the account takes payments from other people, and the fee and deposit limits for personal and business accounts. Pass a country to see whether people living there can open each account. Use it when someone asks how to get paid by bank transfer, in which currencies, or what it costs.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Receiving accounts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:431be52dc4e1da171713ff21573ef6db82e965ae08d56070f1074ea251c01a03"
        },
        {
          "name": "get_send_quote",
          "title": "Send quote",
          "description": "Estimates paying a bank account from a Poplin account: how much is sent in US dollars, how much arrives in the other currency, the rate, the fees, the limits and how fast it arrives, for personal and business accounts at standard pricing. Use it when someone asks what a payment would cost or how much the recipient would get. It is an estimate; the final terms are shown in the Poplin app before anything is confirmed.",
          "inputSchema": {
            "properties": {
              "amount": {
                "maxLength": 40,
                "type": "string"
              },
              "amount_is": {
                "default": "sent",
                "enum": ["sent", "received"],
                "type": "string"
              },
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "required": ["amount", "currency"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Send quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9294a542d07e6ff44aca42cc57bb7dfde4a0c25087f72f008e382688964f4db7"
        },
        {
          "name": "get_stablecoin_networks",
          "title": "Stablecoin networks",
          "description": "Lists the networks that stablecoins such as USDC can be received from and sent to, with the fee and speed for each, and Poplin's home network. Use it only when someone asks about stablecoin deposits or sends.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stablecoin networks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:542215b4b06dce72c520a39db6b29f0962ea2d1aa032fc16e401d960f32ffbb0"
        },
        {
          "name": "get_stablecoin_transfer_quote",
          "title": "Stablecoin transfer quote",
          "description": "Estimates the fee and speed of sending USDC from Poplin to another network, such as Base or Ethereum, for a fast and a standard transfer. Use it only when someone asks about sending stablecoins to another network.",
          "inputSchema": {
            "properties": {
              "amount": {
                "maxLength": 40,
                "type": "string"
              },
              "network": {
                "enum": ["ethereum", "base", "arbitrum", "optimism", "polygon", "avalanche", "unichain", "linea", "codex", "sonic", "worldchain", "monad", "xdc", "hyperevm", "ink", "plume", "arc", "edge", "morph", "pharos", "cronos"],
                "type": "string"
              }
            },
            "required": ["amount", "network"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stablecoin transfer quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:24dba0b8475bad200d2a79ef1960b4a317f933bf97f43d0caf42fc03392e6c5c"
        },
        {
          "name": "get_supported_countries",
          "title": "Supported countries",
          "description": "Says which countries people can sign up to Poplin from, including any regions that are excluded, and which countries money can be sent to. Pass a country to check one. Use it when someone asks whether Poplin works where they live or where they want to send money.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Supported countries"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e8402ce5a8740a9b988a1010df3ff3e12841cd0121aae6073f7939879563efb2"
        },
        {
          "name": "list_banks",
          "title": "Banks reached",
          "description": "Lists the banks a bank payout can reach in a country, with the other names people know them by. Use it when someone asks whether a particular bank is supported. Only some countries have a bank list.",
          "inputSchema": {
            "properties": {
              "country": {
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              },
              "currency": {
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Banks reached"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:98f742a6b97c1ea05a0878b7a339ac943fd16f33cb0986150a4b8bdaef0c4f10"
        },
        {
          "name": "list_legal_documents",
          "title": "Legal documents",
          "description": "Lists Poplin's published legal documents, such as the terms of service, privacy policy and risk disclosure, with a link to the full text of each. Use it when someone asks about Poplin's terms, policies or what it doesn't allow. It returns links, not summaries.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Legal documents"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5bcdc0357d0ef30017baf0fd6e7e6f59301d5722ee4453e87e5dbd8faa73efb0"
        }
      ],
      "digest": "sha256:8a4156c62a64741f58837bde1c60ec05dd425aec7756269254c430dc09caf821"
    }
  }
}
