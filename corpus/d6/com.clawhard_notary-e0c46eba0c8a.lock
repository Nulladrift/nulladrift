      "serverInfo": {
        "name": "com.clawhard/notary",
        "title": "Notary",
        "version": "1.0.0",
        "description": "Notary checks npm and PyPI package names against the live registry before you install them: does it exist, does that version exist, how old and how used is it, is it deprecated, does it run install scripts, is it a typo of a famous package. No account.",
        "websiteUrl": "https://notary.clawhard.com"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Notary: Notary checks npm and PyPI package names against the live registry before you install them: does it exist, does that version exist, how old and how used is it, is it deprecated, does it run install scripts, is it a typo of a famous package. No account. Use it when the user or an AI agent is about to install or import npm or PyPI packages, asks whether a package exists or is safe to install, or pastes a package.json or requirements.txt with names that may have been invented by an AI. Tools: notary_check_packages (Check that npm and PyPI packages really exist before installing them). Results include a link (open_url) that the user can open to see the same result on the website.",
      "tools": [
        {
          "name": "notary_check_packages",
          "title": "Check that npm and PyPI packages really exist before installing them",
          "description": "Use when the user or an agent is about to install or import npm or PyPI packages: before npm install or pip install, when adding lines to package.json or requirements.txt, or when a package name came from an AI answer, a tutorial or memory and may be invented. Looks each name up in the live registry and returns whether it exists, the latest version, whether a pinned version exists, weekly downloads, first and last publish dates, deprecation or yanked status, install-time scripts, whether the name is one or two typed characters from a well-known package, and real similar packages when the name does not exist. Example: {\"packages\":[{\"ecosystem\":\"npm\",\"name\":\"@anthropic/mcp-client\"},{\"ecosystem\":\"pypi\",\"name\":\"requests\",\"version\":\"2.32.3\"}]}. Up to 10 packages per call; versions must be exact, not ranges. Not a malware or vulnerability scan: \"ok\" means it exists and nothing looked wrong.",
          "inputSchema": {
            "properties": {
              "packages": {
                "description": "1 to 10 packages to look up.",
                "items": {
                  "properties": {
                    "ecosystem": {
                      "description": "Which registry: npm (JavaScript, TypeScript, Node) or pypi (Python).",
                      "enum": ["npm", "pypi"],
                      "type": "string"
                    },
                    "name": {
                      "description": "The package name only, e.g. left-pad, @types/node or requests. No version, extras (requests[security]), URL or path.",
                      "maxLength": 214,
                      "minLength": 1,
                      "type": "string"
                    },
                    "version": {
                      "description": "Optional: one exact version to verify, e.g. 4.17.21 (npm also accepts a dist-tag like latest). Not a range such as ^4.17.0.",
                      "maxLength": 64,
                      "type": "string"
                    }
                  },
                  "required": ["ecosystem", "name"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["packages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check that npm and PyPI packages really exist before installing them"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "ui": {
