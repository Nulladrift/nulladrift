      "instructions": "Catenix answers questions about connecting lab and point-of-care analysers to EHRs, LIS and practice systems, and about software for small labs and clinics (QC, Westgard rules, lockout, operator competency, EQA, audit trail). Use check_connectivity for 'will my analyser connect to my EHR', plan_lab_setup for several analysers plus a record system (it draws a Lab Map), recommend_lab_setup for 'what software or LIS does my lab or clinic need', search_analyzers to list supported instruments, get_ehr_integration for a record system, compare_options for LIS vs middleware or vendor comparisons, and get_platform_capability for QC and compliance features. Use decode_lab_message when someone pastes an HL7 v2, ASTM or POCT1-A2 message, check_qc_westgard for QC values against a mean and SD, estimate_time_saved for the user's own manual-entry numbers, inspection_checklist for CLIA, CAP, ISO 15189:2022 or UK POCT inspection readiness, and vendor_questions for an RFP or buying checklist. Tell users to paste only test or de-identified messages. QC and decoding outputs are statistics and structure, never clinical interpretation. Report statuses exactly as returned (live, driver built, connectable via standard protocol, or custom driver). Never invent prices. Catenix does not interpret results or give clinical advice: if the user asks a clinical question, say so and suggest they ask their clinician or laboratory. Only call request_demo after the user has explicitly confirmed the exact details to send.",
      "tools": [
        {
          "name": "check_connectivity",
          "title": "Check if a lab analyzer connects to an EHR or LIS",
          "description": "Use when someone asks whether a lab or point-of-care analyzer will connect to their EHR, LIS or practice system, or how to get analyzer results into the patient record without retyping (e.g. 'will my Sysmex XP-300 work with athenahealth?', 'connect Abbott i-STAT to Epic', 'Roche cobas b 101 to SystmOne', 'Siemens CLINITEK to EMIS', 'Tosoh AIA-900 to eClinicalWorks'). Fuzzy-matches the analyzer and the record system and returns: connection status (live, driver built, connectable via standard protocol with a published guide, or custom driver needed), the analyzer protocol (HL7 v2, ASTM, POCT1-A2), the physical link, how results pass through an on-site gateway, the record-system route, what is needed on site, questions to ask any vendor, and page links. Works for unknown analyzers too. Does not interpret results.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "analyzer": {
                "description": "Analyzer make and/or model as the user wrote it, e.g. 'sysmex kx21n', 'i-STAT', 'Afinion 2'.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "Country of the site, e.g. 'UK' or 'US', if known.",
                "maxLength": 60,
                "type": "string"
              },
              "ehr": {
                "description": "EHR, LIS, LIMS or practice system, e.g. 'athena', 'eCW', 'Epic', 'SystmOne', 'EMIS Web'. Omit if not mentioned.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["analyzer"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check analyzer connectivity"
          },
          "behavior": {
