        {
          "name": "estimate_time_saved",
          "title": "Estimate time spent retyping lab results",
          "description": "Use when someone wants to know how much staff time manual entry of analyzer results costs them, or would be saved by connecting analyzers to the EHR or LIS (e.g. 'we run 80 tests a day and typing each result takes 2 minutes, how much time is that?', 'is it worth interfacing our analyzers?'). Uses only the user's own numbers (tests per day, minutes of manual entry per result, sites, optionally results per test, working days and their own error rate) and returns hours per day, month and year and entries not retyped. Adds no benchmarks, prices or error statistics; without an error rate from the user it makes no error estimate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "error_rate_percent": {
                "description": "The user's own transcription error rate in percent. Omit unless the user gives it.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "minutes_per_result": {
                "description": "Minutes of manual entry per result.",
                "exclusiveMinimum": 0,
                "maximum": 120,
                "type": "number"
              },
              "results_per_test": {
                "description": "Results produced per test (panels give several). Default 1.",
                "exclusiveMinimum": 0,
                "maximum": 100,
                "type": "number"
              },
              "sites": {
                "description": "Number of sites, default 1.",
                "maximum": 10000,
                "minimum": 1,
                "type": "integer"
              },
              "tests_per_day": {
                "description": "Tests per day (per site unless tests_per_day_is_total).",
                "exclusiveMinimum": 0,
                "maximum": 1000000,
                "type": "number"
              },
              "tests_per_day_is_total": {
                "description": "True if tests_per_day is the total across all sites.",
                "type": "boolean"
              },
              "working_days_per_month": {
                "description": "Working days a month. Default 21.",
                "exclusiveMinimum": 0,
                "maximum": 31,
                "type": "number"
              }
            },
            "required": ["minutes_per_result", "tests_per_day"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate time saved"
