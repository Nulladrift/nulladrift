        {
          "name": "check_qc_westgard",
          "title": "Check lab QC values against Westgard rules",
          "description": "Use when someone has quality control (QC) results for a lab or point-of-care test and wants to know whether they break Westgard rules or how they look on a Levey-Jennings chart (e.g. 'do these control values fail any Westgard rules?', 'check my QC: mean 5.0, SD 0.1, values ...', 'is this a 2-2s or 4-1s violation?'). Takes control values in run order plus the target mean and SD (or computes them from the values if the user asks) and evaluates 1-2s (warning), 1-3s, 2-2s, R-4s, 4-1s and 10x. Returns z-scores, the rule hits for each point and a plain summary, and draws a Levey-Jennings chart in ChatGPT and Claude. Up to 500 values. QC statistics only: not a clinical interpretation of any patient result.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "analyte": {
                "description": "Test or analyte name, e.g. 'glucose'.",
                "maxLength": 80,
                "type": "string"
              },
              "compute_from_values": {
                "description": "True only if the user asks to compute the mean and SD from the values.",
                "type": "boolean"
              },
              "level": {
                "description": "Control level, e.g. 'level 1'.",
                "maxLength": 40,
                "type": "string"
              },
              "mean": {
                "description": "Target mean for this control lot and level.",
                "type": "number"
              },
              "sd": {
                "description": "Target SD for this control lot and level.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "units": {
                "description": "Units of the values.",
                "maxLength": 30,
                "type": "string"
              },
              "values": {
                "description": "Control values in run order, oldest first.",
                "items": {
                  "type": "number"
                },
                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["values"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Westgard QC check"
