                "description": "Manufacturer filter, e.g. 'Abbott', 'Sysmex', 'Roche'.",
                "maxLength": 60,
                "type": "string"
              },
              "query": {
                "description": "Free text: model, maker, test type or protocol.",
                "maxLength": 120,
                "type": "string"
              },
              "status": {
                "description": "Only return analyzers with this status.",
