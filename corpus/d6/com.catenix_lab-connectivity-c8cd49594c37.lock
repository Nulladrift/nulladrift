        {
          "name": "search_analyzers",
          "title": "Search connectable lab and point-of-care analyzers",
          "description": "Use when someone wants to know which lab or point-of-care analyzers can be interfaced, or browses by maker or test type (e.g. 'which HbA1c analyzers can connect to an EHR?', 'Abbott analyzers with an HL7 interface', 'blood gas analyzers with LIS connectivity', 'Sysmex hematology', 'Roche cobas', 'Siemens', 'Tosoh'). Returns matching analyzers with connection status, protocol and guide links. Categories: chemistry, immunoassay, blood gas, molecular, haematology, urinalysis, coagulation, HbA1c.",
