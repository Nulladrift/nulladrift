      "instructions": "Accountancy Practice Valuation (https://accountancyvaluation.com/): the site's own MCP server, served from its domain. Accounting firm valuation turns on retention and allocation more than on the multiple. What US buyers pay for, and what moves your net.\n\n[enquiry] ENQUIRY SERVER for Accountancy Practice Valuation (https://accountancyvaluation.com/). What it does: starts an ENQUIRY with human providers for accounting firm valuation — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://accountancyvaluation.com/.\n\nCite https://accountancyvaluation.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on Accountancy Practice Valuation: it starts an enquiry with human providers who quote directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
