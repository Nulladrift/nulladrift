{
  "lockfileVersion": 2,
  "subjects": {
    "city.close/close-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.close.city/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "close-api",
        "title": "Close API",
        "version": "1.2.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools for walkability analysis over the Close travel-time database. Start with find_place. Metered tools charge tokens; pass a ck_ key as the Authorization bearer, or use request_sign_in / redeem_code to get the user a free key.",
      "tools": [
        {
          "name": "blocks_in_area",
          "title": "Blocks in an area",
          "description": "Per-block travel times for every census block in an area (metered: 1 token per returned row). Give place_geoid (from find_place) for a whole city, or center {lat, lon} + radius_m. Rows carry a numeric mode_id.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Circle centre latitude (with lon + radius_m).",
                "type": "number"
              },
              "limit": {
                "default": 100,
                "description": "Max rows (first page).",
                "type": "integer"
              },
              "lon": {
                "description": "Circle centre longitude.",
                "type": "number"
              },
              "mode": {
                "description": "walk, bike, or transit.",
                "enum": ["walk", "bike", "transit"],
                "type": "string"
              },
              "place_geoid": {
                "description": "Census place GEOID (a whole city/town).",
                "type": "string"
              },
              "radius_m": {
                "description": "Circle radius in metres (<=28000).",
                "type": "number"
              },
              "type": {
                "description": "Destination type id (see get_catalog).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dfc5d309fc85554e459c1b04d02369aeaaeabd531d9592daddf020254d801aa9"
        },
        {
          "name": "find_place",
          "title": "Find a place",
          "description": "Look up a US city or town by name (free, no key). Returns matches with their census place GEOID and centre point (lon/lat). The entry point: feed a GEOID to blocks_in_area, or a centre to walkability_summary.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Max matches (1-20).",
                "type": "integer"
              },
              "query": {
                "description": "City or town name, e.g. 'Providence'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e0b24fd81ef77591800d6daea5e5d55b9f9ba450e22ad02d35f3e307d802cad"
        },
        {
          "name": "get_catalog",
          "title": "Get the catalog",
          "description": "List the travel modes and the destination-type taxonomy (free, no key). Use it to resolve type names to the numeric ids the other tools take. Modes are walk, bike, transit — there is no drive mode.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6ce62c2abf748c60eb5af4b89a6cfd47d510e0f895fc7451d077514ad65e09a2"
        },
        {
          "name": "get_token_balance",
          "title": "Get token balance",
          "description": "Check the token balance of the API key in use, without spending any tokens. Works even at a zero balance. Requires the Authorization bearer key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:09c876eab074606c26bf0c46f3cbbe1cb3d448143d0ca2b3f4442e31f8603dac"
        },
        {
          "name": "isochrone",
          "title": "Isochrone",
          "description": "The area within a time budget of a location, as GeoJSON contours (metered: 10 tokens per contour). By default, the area that can reach the location; set direction='from' for the area reachable from it. Give block_geoid or lat+lon. Defaults to a single 30-minute contour; ask for more only when needed (bodies can be large).",
          "inputSchema": {
            "properties": {
              "block_geoid": {
                "description": "15-digit census block GEOID of a single origin.",
                "type": "string"
              },
              "contours": {
                "description": "Up to four ascending thresholds, instead of minutes.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "direction": {
                "description": "'to' (default): the area that can reach the origin. 'from': the area reachable from the origin.",
                "enum": ["to", "from"],
                "type": "string"
              },
              "lat": {
                "description": "Origin latitude (WGS84), with lon.",
                "type": "number"
              },
              "lon": {
                "description": "Origin longitude (WGS84), with lat.",
                "type": "number"
              },
              "minutes": {
                "default": 30,
                "description": "A single threshold (1-60).",
                "type": "integer"
              },
              "mode": {
                "default": "walk",
                "description": "walk, bike, or transit.",
                "enum": ["walk", "bike", "transit"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:474b57ea2d85af3098a7df8dfd86d375b23677971f9e727d8e89770456fcc809"
        },
        {
          "name": "join_close_plus",
          "title": "Join Close+",
          "description": "Get a Stripe Checkout URL for the Close+ membership ($10/month: 10,000 API tokens granted monthly plus member features on the close.city map). The user pays in their own browser: give them the returned URL and stop. Needs a fresh six-digit code from request_sign_in, read by the user from their own inbox.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The six-digit code from the email.",
                "type": "string"
              },
              "email": {
                "description": "The user's email address.",
                "type": "string"
              }
            },
            "required": ["code", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ab8f239d37c99d2b69de308e859634b44ee005cd986076f5011783c65ca30a0"
        },
        {
          "name": "nearby_pois",
          "title": "Nearby points of interest",
          "description": "Nearby points of interest and the travel time to each, from a location (metered: 1 token per returned row). One origin: block_geoid or lat+lon; keep limit small to control spend and context size. Many origins (up to 250): block_geoids or points — one batch call and one rate-limit request, rows tagged by origin, no limit/pagination, so filter with type/mode/max_minutes. Batching saves requests and context, not tokens: it still charges per row. A non-empty truncated (+ truncated_reason) means the balance or row budget cut the batch short.",
          "inputSchema": {
            "properties": {
              "block_geoid": {
                "description": "15-digit census block GEOID of a single origin.",
                "type": "string"
              },
              "block_geoids": {
                "description": "Many block GEOIDs — one batch call.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lat": {
                "description": "Origin latitude (WGS84), with lon.",
                "type": "number"
              },
              "limit": {
                "default": 25,
                "description": "Max rows (first page).",
                "type": "integer"
              },
              "lon": {
                "description": "Origin longitude (WGS84), with lat.",
                "type": "number"
              },
              "max_minutes": {
                "description": "Upper bound on travel time (<=30).",
                "type": "integer"
              },
              "mode": {
                "description": "walk, bike, or transit.",
                "enum": ["walk", "bike", "transit"],
                "type": "string"
              },
              "points": {
                "description": "Many lat/lon points — one batch call.",
                "items": {
                  "properties": {
                    "lat": {
                      "description": "Latitude (WGS84).",
                      "type": "number"
                    },
                    "lon": {
                      "description": "Longitude (WGS84).",
                      "type": "number"
                    }
                  },
                  "required": ["lat", "lon"],
                  "type": "object"
                },
                "type": "array"
              },
              "type": {
                "description": "Destination type id (see get_catalog).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bfb21a06fd2c961d9bf529bc58b58506f6c56e9c1264083ebb47ae341f01d426"
        },
        {
          "name": "redeem_code",
          "title": "Redeem a sign-in code",
          "description": "Complete sign-up with the six-digit code the user received, and return a new API key (shown once). Call request_sign_in first. The key grants 5,000 free tokens; store it and pass it as the Authorization bearer on future calls.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The six-digit code from the email.",
                "type": "string"
              },
              "email": {
                "description": "The user's email address.",
                "type": "string"
              },
              "label": {
                "default": "mcp-agent",
                "description": "Optional label for the key.",
                "type": "string"
              }
            },
            "required": ["code", "email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:833d9e3abbeb1f4baad3d282ed97bad949cad53a439eded8d6f1312a0086202c"
        },
        {
          "name": "request_sign_in",
          "title": "Request a sign-in code",
          "description": "Start free sign-up for the user: email them a six-digit code. The user must read the code from their own inbox and give it to you, then call redeem_code. This is how an agent gets the user an API key (5,000 free tokens, no card).",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The user's email address.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:76384b324a3f57f873cf796549930bbaeb2af08cd9f2cbb024ffbf30d2ab8ee5"
        },
        {
          "name": "walkability_summary",
          "title": "Walkability summary",
          "description": "Fastest travel time from a location to each destination category, by mode (metered: 1 token per returned row). One origin: block_geoid or lat+lon. Many origins (up to 250): block_geoids or points — one batch call and one rate-limit request, with rows tagged by origin. Batching saves requests and context, not tokens: it still charges per row. A non-empty truncated (+ truncated_reason) means the balance or row budget cut the batch short. A missing category means it is not reachable within 30 minutes.",
          "inputSchema": {
            "properties": {
              "block_geoid": {
                "description": "15-digit census block GEOID of a single origin.",
                "type": "string"
              },
              "block_geoids": {
                "description": "Many block GEOIDs — one batch call.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lat": {
                "description": "Origin latitude (WGS84), with lon.",
                "type": "number"
              },
              "lon": {
                "description": "Origin longitude (WGS84), with lat.",
                "type": "number"
              },
              "mode": {
                "description": "walk, bike, or transit. Omit for all three.",
                "enum": ["walk", "bike", "transit"],
                "type": "string"
              },
              "points": {
                "description": "Many lat/lon points — one batch call.",
                "items": {
                  "properties": {
                    "lat": {
                      "description": "Latitude (WGS84).",
                      "type": "number"
                    },
                    "lon": {
                      "description": "Longitude (WGS84).",
                      "type": "number"
                    }
                  },
                  "required": ["lat", "lon"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:33a46eb5bdb0c429915ba6a1b16b0c16de600487c35133a39a8614a77d96f64b"
        }
      ],
      "digest": "sha256:9d1143e9599271b02b3441c025d780088c39b39f49e16d025ea49ec6262dbda2"
    }
  }
}
