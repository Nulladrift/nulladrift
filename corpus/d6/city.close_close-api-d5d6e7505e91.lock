{
  "lockfileVersion": 2,
  "subjects": {
    "city.close/close-api": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.close.city/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "close-api",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Tools for walkability analysis over the Close travel-time database. Start with find_place. Metered tools charge tokens; pass a ck_ key as the Authorization bearer, or use request_sign_in / redeem_code to get the user a free key.",
      "tools": [
        {
          "name": "blocks_in_area",
          "description": "Per-block travel times for every census block in an area (metered: 1 token per returned row). Give place_geoid (from find_place) for a whole city, or center {lat, lon} + radius_m. Rows carry a numeric mode_id.",
          "inputSchema": {
            "properties": {
              "lat": {
                "description": "Circle centre latitude (with lon + radius_m).",
                "type": "number"
              },
              "limit": {
                "default": 100,
                "description": "Max rows (first page).",
                "type": "integer"
              },
              "lon": {
                "description": "Circle centre longitude.",
                "type": "number"
              },
              "mode": {
                "description": "walk, bike, or transit.",
                "type": "string"
              },
              "place_geoid": {
                "description": "Census place GEOID (a whole city/town).",
                "type": "string"
              },
              "radius_m": {
                "description": "Circle radius in metres (<=28000).",
                "type": "number"
              },
              "type": {
                "description": "Destination type id (see get_catalog).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ecc6a4a433b504ee1e58523ed22d4e28aa1b10bcd072addcb41f8f398027d11d"
        },
        {
          "name": "find_place",
          "description": "Look up a US city or town by name (free, no key). Returns matches with their census place GEOID and centre point (lon/lat). The entry point: feed a GEOID to blocks_in_area, or a centre to walkability_summary.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "description": "Max matches (1-20).",
                "type": "integer"
              },
              "query": {
                "description": "City or town name, e.g. 'Providence'.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0a746c8430552fcf2147e894245097f6b5701652a96da2c239af1ce251ffbab7"
        },
        {
          "name": "get_catalog",
          "description": "List the travel modes and the destination-type taxonomy (free, no key). Use it to resolve type names to the numeric ids the other tools take. Modes are walk, bike, transit — there is no drive mode.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:055d9f25c98c5ff505c2af93a520aee2d718257369002c061a8c8b7d9de5ffc9"
        },
        {
          "name": "get_token_balance",
          "description": "Check the token balance of the API key in use, without spending any tokens. Works even at a zero balance. Requires the Authorization bearer key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef56f597f346941f78c80e64b10a86400c0857a1ff601ff95f35be9a44b4363e"
        },
        {
          "name": "isochrone",
          "description": "The area reachable from a location within a time budget, as GeoJSON contours (metered: 10 tokens per contour). Give block_geoid or lat+lon. Defaults to a single 30-minute contour; ask for more only when needed (bodies can be large).",
          "inputSchema": {
            "properties": {
              "block_geoid": {
                "type": "string"
              },
              "contours": {
                "description": "Up to four ascending thresholds, instead of minutes.",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "direction": {
                "description": "'from' the origin (default) or 'to' it.",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "minutes": {
                "default": 30,
                "description": "A single threshold (1-60).",
                "type": "integer"
              },
              "mode": {
                "default": "walk",
                "description": "walk, bike, or transit.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:641f0d7c55006d8cdcb3fba155634e4b10ce163c99f4a0aacd1f79117d7a1cd9"
        },
        {
          "name": "join_close_plus",
          "description": "Get a Stripe Checkout URL for the Close+ membership ($10/month: 5,000 API tokens granted monthly plus member features on the close.city map). The user pays in their own browser: give them the returned URL and stop. Needs a fresh six-digit code from request_sign_in, read by the user from their own inbox.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The six-digit code from the email.",
                "type": "string"
              },
              "email": {
                "type": "string"
              }
            },
            "required": ["code", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f07c37341c9e8c8c5e9bc59702d9597ba79ec9e31b68fa700521b09566a000a1"
        },
        {
          "name": "nearby_pois",
          "description": "Nearby points of interest and the travel time to each, from a location (metered: 1 token per returned row). One origin: block_geoid or lat+lon; keep limit small to control spend and context size. Many origins (up to 250): block_geoids or points — one batch call and one rate-limit request, rows tagged by origin, no limit/pagination, so filter with type/mode/max_minutes. Batching saves requests and context, not tokens: it still charges per row. A non-empty truncated (+ truncated_reason) means the balance or row budget cut the batch short.",
          "inputSchema": {
            "properties": {
              "block_geoid": {
                "type": "string"
              },
              "block_geoids": {
                "description": "Many block GEOIDs — one batch call.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lat": {
                "type": "number"
              },
              "limit": {
                "default": 25,
                "description": "Max rows (first page).",
                "type": "integer"
              },
              "lon": {
                "type": "number"
              },
              "max_minutes": {
                "description": "Upper bound on travel time (<=30).",
                "type": "integer"
              },
              "mode": {
                "description": "walk, bike, or transit.",
                "type": "string"
              },
              "points": {
                "description": "Many lat/lon points — one batch call.",
                "items": {
                  "properties": {
                    "lat": {
                      "type": "number"
                    },
                    "lon": {
                      "type": "number"
                    }
                  },
                  "required": ["lat", "lon"],
                  "type": "object"
                },
                "type": "array"
              },
              "type": {
                "description": "Destination type id (see get_catalog).",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:337a1b3ee0f6127af10690a027c71e6ecc62dc94e745db37b355ec99296b298a"
        },
        {
          "name": "redeem_code",
          "description": "Complete sign-up with the six-digit code the user received, and return a new API key (shown once). Call request_sign_in first. The key grants 5,000 free tokens; store it and pass it as the Authorization bearer on future calls.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "The six-digit code from the email.",
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "label": {
                "default": "mcp-agent",
                "description": "Optional label for the key.",
                "type": "string"
              }
            },
            "required": ["code", "email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7532181a262d40f28ed562bfc91d1c45f49618f41f98b6f1bf3beb830bff4293"
        },
        {
          "name": "request_sign_in",
          "description": "Start free sign-up for the user: email them a six-digit code. The user must read the code from their own inbox and give it to you, then call redeem_code. This is how an agent gets the user an API key (5,000 free tokens, no card).",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "The user's email address.",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f95176471f0591ab8a8fe8b710bb4169e935e666544fde500381339a621c4178"
        },
        {
          "name": "walkability_summary",
          "description": "Fastest travel time from a location to each destination category, by mode (metered: 1 token per returned row). One origin: block_geoid or lat+lon. Many origins (up to 250): block_geoids or points — one batch call and one rate-limit request, with rows tagged by origin. Batching saves requests and context, not tokens: it still charges per row. A non-empty truncated (+ truncated_reason) means the balance or row budget cut the batch short. A missing category means it is not reachable within 30 minutes.",
          "inputSchema": {
            "properties": {
              "block_geoid": {
                "description": "15-digit census block GEOID.",
                "type": "string"
              },
              "block_geoids": {
                "description": "Many block GEOIDs — one batch call.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "lat": {
                "type": "number"
              },
              "lon": {
                "type": "number"
              },
              "mode": {
                "description": "walk, bike, or transit. Omit for all three.",
                "type": "string"
              },
              "points": {
                "description": "Many lat/lon points — one batch call.",
                "items": {
                  "properties": {
                    "lat": {
                      "type": "number"
                    },
                    "lon": {
                      "type": "number"
                    }
                  },
                  "required": ["lat", "lon"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7a33b6b0dabccd40989a4fbdf61b37a0ac63400538de35627020a0572c2811b7"
        }
      ],
      "digest": "sha256:1a6bf70bd7eb9c2c550d1ac3f726812ba7f12e49163538f34a646fef866003d0"
    }
  }
}
