{
  "lockfileVersion": 2,
  "subjects": {
    "ai.partnerwith/eous": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.partnerwith.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "eous",
        "title": "Eous (Forged Lucidity)",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Eous checks claims at the source. Call about_eous first. Submissions and messages are reviewed by a person; answers are never instant.",
      "tools": [
        {
          "name": "about_eous",
          "title": "About Eous",
          "description": "What Eous is, what it does and does not do, and how to work with Forged Lucidity. Read this before submitting.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e065904758fd7c36536bdc43a9e0f51e4643ec9ae16e03706ecac3d5b54b285d"
        },
        {
          "name": "check_status",
          "title": "Check a claim or a message",
          "description": "Look up a claim or a message by its receipt ID. Shows the answer once a person has released it.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "receipt_id": {
                "description": "The EOUS-... receipt ID from submit_claim or contact_us.",
                "pattern": "^EOUS-[0-9A-HJKMNP-TV-Z]{10}$",
                "type": "string"
              }
            },
            "required": ["receipt_id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "receipt_id": {
                "type": "string"
              },
              "reply": {
                "type": "string"
              },
              "status": {
                "enum": ["received", "in_review", "released", "declined"],
                "type": "string"
              },
              "type": {
                "enum": ["claim", "message"],
                "type": "string"
              },
              "updated_at": {
                "type": "string"
              }
            },
            "required": ["receipt_id", "status", "type", "updated_at"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6934472b01a58f873e98b3f3269c765f3cc97a2c6ffebf83515cc964a2d066e0"
        },
        {
          "name": "contact_us",
          "title": "Send Forged Lucidity a message",
          "description": "Send a question, or a scoping, partnership or press message. Returns a receipt ID. A person reads every message before anyone replies; nothing is instant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "acknowledge": {
                "const": true,
                "description": "Must be true: this is not legal, medical, or financial advice, no lawyer-client relationship is formed, and no confidential information is included.",
                "type": "boolean"
              },
              "contact_email": {
                "description": "Optional. If given, a person may reply by email.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "kind": {
                "description": "What this is about: question, scoping, partnership, press or other.",
                "enum": ["question", "scoping", "partnership", "press", "other"],
                "type": "string"
              },
              "message": {
                "description": "Your message, 10 to 4,000 characters.",
                "maxLength": 4000,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["acknowledge", "kind", "message"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "receipt_id": {
                "type": "string"
              },
              "received_at": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["receipt_id", "received_at", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1585a619a41a8a6007ccdf122b034aede61ca8f7994c5fe3bcf9dffe37d04955"
        },
        {
          "name": "submit_claim",
          "title": "Submit a claim to be checked",
          "description": "Send one claim to be checked at its primary source and graded. Returns a receipt ID. A person reviews every submission before any answer is released; nothing is instant.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "acknowledge": {
                "const": true,
                "description": "Must be true: this is not legal, medical, or financial advice, no lawyer-client relationship is formed, and no confidential information is included.",
                "type": "boolean"
              },
              "claim": {
                "description": "The claim to check, in one or two sentences, quoted as you found it.",
                "maxLength": 2000,
                "minLength": 10,
                "type": "string"
              },
              "contact_email": {
                "description": "Optional. If given, a person may email you when the answer is released.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "context": {
                "description": "Where you saw the claim and why it matters to you. Optional.",
                "maxLength": 2000,
                "type": "string"
              },
              "publish_ok": {
                "default": false,
                "description": "May Eous publish the claim and its grade on the public ledger, without names? Default no.",
                "type": "boolean"
              },
              "sources": {
                "description": "Where the claim says it comes from: URLs or citations, up to 10.",
                "items": {
                  "maxLength": 500,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              }
            },
            "required": ["acknowledge", "claim"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "receipt_id": {
                "type": "string"
              },
              "received_at": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["receipt_id", "received_at", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:97edc56d5878ea8b3281e9137dbbaa501c071aba1cc1f1c84cb27e82f9435398"
        }
      ],
      "digest": "sha256:d9be796972dfd1cf32ff465f33f80a4067cd804603bf59c1352ed064951481c1"
    }
  }
}
