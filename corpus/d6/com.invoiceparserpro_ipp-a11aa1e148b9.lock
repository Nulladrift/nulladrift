        {
          "name": "preview_add_invoice_line_item",
          "title": "Preview: Add an invoice line",
          "description": "Prepare one explicit new invoice line with supplied values. Requires confirmation and records a correction. This returns an exact preview and a five-minute confirmation token; it does not apply the change.",
          "inputSchema": {
            "$defs": {
              "AddLine": {
                "additionalProperties": false,
                "properties": {
                  "fields": {
                    "$ref": "#/$defs/LineFields"
                  },
                  "invoice_id": {
                    "format": "uuid",
                    "title": "Invoice Id",
                    "type": "string"
                  }
                },
                "required": ["fields", "invoice_id"],
                "title": "AddLine",
                "type": "object"
              },
              "LineFields": {
                "additionalProperties": false,
                "properties": {
                  "description": {
                    "anyOf": [
                      {
                        "maxLength": 2000,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Description"
                  },
                  "is_verified": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Is Verified"
                  },
                  "quantity": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,14}|(?=[\\d.]{1,21}0*$)\\d{0,14}\\.\\d{0,6}0*$)",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Quantity"
                  },
                  "tax_amount": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,14}|(?=[\\d.]{1,21}0*$)\\d{0,14}\\.\\d{0,6}0*$)",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Tax Amount"
                  },
                  "total": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,14}|(?=[\\d.]{1,21}0*$)\\d{0,14}\\.\\d{0,6}0*$)",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Total"
                  },
                  "unit_price": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,14}|(?=[\\d.]{1,21}0*$)\\d{0,14}\\.\\d{0,6}0*$)",
                        "type": "string"
                      },
                      {
                        "type": "null"
