        {
          "name": "preview_approval_rule",
          "title": "Test a required-approval rule",
          "description": "Read a sampled draft match explanation without creating requests or notifications. Supports admin/owner role chains; named-person routing uses IPP.",
          "inputSchema": {
            "$defs": {
              "ApprovalCondition": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Currency"
                  },
                  "field": {
                    "enum": ["vendor_name", "total_amount", "client_id", "confidence", "validation_status", "currency"],
                    "title": "Field",
                    "type": "string"
                  },
                  "operator": {
                    "enum": ["gt", "gte", "lt", "lte", "eq", "neq", "contains", "in"],
                    "title": "Operator",
                    "type": "string"
                  },
                  "value": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,14}|(?=[\\d.]{1,25}0*$)\\d{0,14}\\.\\d{0,10}0*$)",
                        "type": "string"
                      },
                      {
                        "items": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "number"
                            },
                            {
                              "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,14}|(?=[\\d.]{1,25}0*$)\\d{0,14}\\.\\d{0,10}0*$)",
                              "type": "string"
                            }
                          ]
                        },
                        "type": "array"
                      }
                    ],
                    "title": "Value"
                  }
                },
                "required": ["field", "operator", "value"],
                "title": "ApprovalCondition",
                "type": "object"
              },
              "ApprovalDraft": {
                "additionalProperties": false,
                "properties": {
                  "auto_escalate_after_hours": {
                    "anyOf": [
                      {
                        "maximum": 8760,
                        "minimum": 1,
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Auto Escalate After Hours"
                  },
                  "chain_steps": {
                    "items": {
                      "$ref": "#/$defs/ChainStep"
                    },
                    "maxItems": 5,
                    "title": "Chain Steps",
                    "type": "array"
                  },
                  "conditions": {
                    "items": {
                      "$ref": "#/$defs/ApprovalCondition"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "title": "Conditions",
                    "type": "array"
                  },
                  "name": {
                    "maxLength": 255,
                    "minLength": 1,
                    "title": "Name",
                    "type": "string"
                  },
                  "priority": {
                    "default": 0,
                    "maximum": 1000000,
                    "minimum": -1000000,
                    "title": "Priority",
                    "type": "integer"
                  },
                  "require_notes": {
                    "default": false,
                    "title": "Require Notes",
                    "type": "boolean"
                  },
                  "required_approver_role": {
                    "default": "admin",
                    "enum": ["admin", "owner"],
                    "title": "Required Approver Role",
                    "type": "string"
                  }
                },
                "required": ["conditions", "name"],
                "title": "ApprovalDraft",
                "type": "object"
              },
              "ChainStep": {
                "additionalProperties": false,
                "properties": {
                  "required_role": {
                    "anyOf": [
                      {
                        "enum": ["admin", "owner"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Required Role"
                  }
                },
                "title": "ChainStep",
                "type": "object"
              }
            },
            "properties": {
              "input": {
                "$ref": "#/$defs/ApprovalDraft"
              }
            },
            "required": ["input"],
            "title": "preview_approval_ruleArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Test a required-approval rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.invoiceparserpro/capability": {
