        {
          "name": "search_invoices",
          "title": "Search your invoices",
          "description": "Find saved invoices with explicit client, supplier, date, review, due-date, duplicate and amount filters. Return a bounded page and total, not an export.",
          "inputSchema": {
            "$defs": {
              "InvoiceSearch": {
                "additionalProperties": false,
                "properties": {
                  "amount_max": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Amount Max"
                  },
                  "amount_min": {
                    "anyOf": [
                      {
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*\\d*\\.?\\d*$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Amount Min"
                  },
                  "client_id": {
                    "anyOf": [
                      {
                        "format": "uuid",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Client Id"
                  },
                  "confidence": {
                    "anyOf": [
                      {
                        "enum": ["high", "medium", "low"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Confidence"
                  },
                  "date_from": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Date From"
                  },
                  "date_to": {
                    "anyOf": [
                      {
                        "format": "date",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Date To"
                  },
                  "document_type": {
                    "anyOf": [
                      {
                        "enum": ["invoice", "receipt", "fuel_slip"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Document Type"
                  },
                  "due": {
                    "anyOf": [
                      {
                        "enum": ["overdue", "this_week", "days_30", "days_60", "days_90", "later", "no_due"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Due"
                  },
                  "duplicates": {
                    "default": false,
                    "title": "Duplicates",
                    "type": "boolean"
                  },
                  "limit": {
                    "default": 25,
                    "maximum": 100,
                    "minimum": 1,
                    "title": "Limit",
                    "type": "integer"
                  },
                  "offset": {
                    "default": 0,
                    "maximum": 10000,
                    "minimum": 0,
                    "title": "Offset",
                    "type": "integer"
                  },
                  "outstanding": {
                    "default": false,
                    "title": "Outstanding",
                    "type": "boolean"
                  },
                  "po_match": {
                    "anyOf": [
                      {
                        "enum": ["matched", "mismatch", "mismatch_3way", "no_po", "triage"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Po Match"
                  },
                  "review_bucket": {
                    "anyOf": [
                      {
                        "enum": ["clean", "attention"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Review Bucket"
                  },
                  "review_status": {
                    "anyOf": [
                      {
                        "enum": ["pending", "approved", "approved_with_corrections", "flagged", "rejected"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Review Status"
                  },
                  "sort_by": {
                    "default": "created_at",
                    "enum": ["created_at", "vendor", "date", "amount", "invoice_number"],
                    "title": "Sort By",
                    "type": "string"
                  },
                  "sort_order": {
                    "default": "desc",
                    "enum": ["asc", "desc"],
                    "title": "Sort Order",
                    "type": "string"
                  },
                  "validation_status": {
                    "anyOf": [
                      {
                        "enum": ["valid", "derived", "mismatch"],
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Validation Status"
                  },
                  "vendor": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Vendor"
                  }
                },
