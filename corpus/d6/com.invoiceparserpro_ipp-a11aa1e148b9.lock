        {
          "name": "preview_automation_rule",
          "title": "Test a draft automation rule",
          "description": "Read a sampled match explanation using execution evaluators. Does not save a rule or run actions. Supports flagging, approval and client/account assignment; exports/notifications use IPP.",
          "inputSchema": {
            "$defs": {
              "AccountParameters": {
                "additionalProperties": false,
                "properties": {
                  "gl_account_id": {
                    "maxLength": 200,
                    "minLength": 1,
                    "title": "Gl Account Id",
                    "type": "string"
                  },
                  "provider": {
                    "enum": ["quickbooks_online", "xero", "zoho_books"],
                    "title": "Provider",
                    "type": "string"
                  }
                },
                "required": ["gl_account_id", "provider"],
                "title": "AccountParameters",
                "type": "object"
              },
              "ApproveAction": {
                "additionalProperties": false,
                "properties": {
                  "params": {
                    "$ref": "#/$defs/Empty"
                  },
                  "type": {
                    "const": "auto_approve",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["type"],
                "title": "ApproveAction",
                "type": "object"
              },
              "AssignAccountAction": {
                "additionalProperties": false,
                "properties": {
                  "params": {
                    "$ref": "#/$defs/AccountParameters"
                  },
                  "type": {
                    "const": "assign_gl",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["params", "type"],
                "title": "AssignAccountAction",
                "type": "object"
              },
              "AssignClientAction": {
                "additionalProperties": false,
                "properties": {
                  "params": {
                    "$ref": "#/$defs/ClientParameters"
                  },
                  "type": {
                    "const": "assign_client",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["params", "type"],
                "title": "AssignClientAction",
                "type": "object"
              },
              "AutomationDraft": {
                "additionalProperties": false,
                "properties": {
                  "actions": {
                    "items": {
                      "discriminator": {
                        "mapping": {
                          "assign_client": "#/$defs/AssignClientAction",
                          "assign_gl": "#/$defs/AssignAccountAction",
                          "auto_approve": "#/$defs/ApproveAction",
                          "flag_for_review": "#/$defs/FlagAction"
                        },
                        "propertyName": "type"
                      },
                      "oneOf": [
                        {
                          "$ref": "#/$defs/FlagAction"
                        },
                        {
                          "$ref": "#/$defs/ApproveAction"
                        },
                        {
                          "$ref": "#/$defs/AssignClientAction"
                        },
                        {
                          "$ref": "#/$defs/AssignAccountAction"
                        }
                      ]
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "title": "Actions",
                    "type": "array"
                  },
                  "conditions": {
                    "items": {
                      "$ref": "#/$defs/Condition"
                    },
                    "maxItems": 50,
                    "minItems": 1,
                    "title": "Conditions",
                    "type": "array"
                  },
                  "name": {
                    "maxLength": 255,
                    "minLength": 1,
                    "title": "Name",
                    "type": "string"
                  },
                  "priority": {
                    "default": 100,
                    "maximum": 1000000,
                    "minimum": -1000000,
                    "title": "Priority",
                    "type": "integer"
                  }
                },
                "required": ["actions", "conditions", "name"],
                "title": "AutomationDraft",
                "type": "object"
              },
              "ClientParameters": {
                "additionalProperties": false,
                "properties": {
                  "client_id": {
                    "format": "uuid",
                    "title": "Client Id",
                    "type": "string"
                  }
                },
                "required": ["client_id"],
                "title": "ClientParameters",
                "type": "object"
              },
              "Condition": {
                "additionalProperties": false,
                "properties": {
                  "currency": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Currency"
                  },
                  "field": {
                    "enum": ["vendor_name", "total_amount", "client_id", "confidence", "validation_status", "currency"],
                    "title": "Field",
                    "type": "string"
                  },
                  "operator": {
                    "enum": ["equals", "contains", "starts_with", "gt", "gte", "lt", "lte", "between", "in"],
                    "title": "Operator",
                    "type": "string"
                  },
                  "value": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "number"
                      },
                      {
                        "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,14}|(?=[\\d.]{1,25}0*$)\\d{0,14}\\.\\d{0,10}0*$)",
                        "type": "string"
                      },
                      {
                        "items": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "number"
                            },
                            {
                              "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,14}|(?=[\\d.]{1,25}0*$)\\d{0,14}\\.\\d{0,10}0*$)",
                              "type": "string"
                            }
                          ]
                        },
                        "type": "array"
                      }
                    ],
                    "title": "Value"
                  }
                },
                "required": ["field", "operator", "value"],
                "title": "Condition",
                "type": "object"
              },
              "Empty": {
                "additionalProperties": false,
                "properties": {},
                "title": "Empty",
                "type": "object"
              },
              "FlagAction": {
                "additionalProperties": false,
                "properties": {
                  "params": {
                    "$ref": "#/$defs/FlagParameters"
                  },
                  "type": {
                    "const": "flag_for_review",
                    "title": "Type",
                    "type": "string"
                  }
                },
                "required": ["type"],
                "title": "FlagAction",
                "type": "object"
              },
              "FlagParameters": {
                "additionalProperties": false,
                "properties": {
                  "note": {
                    "default": "Flagged for review",
                    "maxLength": 1000,
                    "title": "Note",
                    "type": "string"
                  }
                },
                "title": "FlagParameters",
                "type": "object"
              }
            },
            "properties": {
              "input": {
                "$ref": "#/$defs/AutomationDraft"
              }
            },
            "required": ["input"],
            "title": "preview_automation_ruleArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Test a draft automation rule"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "com.invoiceparserpro/capability": {
              "category": "Automation rules",
              "description": "Read a sampled match explanation using execution evaluators. Does not save a rule or run actions. Supports flagging, approval and client/account assignment; exports/notifications use IPP.",
              "examples": ["Test a draft rule named Fictional Supplier review: when vendor_name contains Fictional Supplier, flag for review with note Check supplier details. Show sampled matches without saving the rule or running its actions.", "Test a draft auto-approval rule for high-confidence, valid invoices with USD totals at most 200. Bind the amount condition to USD, show sampled matches and explain approval/export implications without saving or executing the rule."],
              "mode": "read",
              "scope": "workspace.read"
            },
            "securitySchemes": [
              {
                "scopes": ["workspace.read"],
                "type": "oauth2"
              }
            ]
          },
