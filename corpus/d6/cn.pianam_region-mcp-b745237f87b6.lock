          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "lookup_region",
          "title": "Lookup Region",
          "description": "中国行政区划查询（GB/T 2260，省/市/区县三级约 4100 条，含邮政编码与长途区号）：支持按名称关键词（如 南山、青岛、凉山）查、按 6 位区划码精确查（如 440305）、按 6 位邮编反查（如 266001）、按长途区号反查（如 0532）；可用 level 限定省/市/区县层级。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "区划码（2/4/6 位，如 110105），精确查询"
              },
              "level": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "可选层级过滤：省 / 市 / 区县"
              },
              "limit": {
                "default": 20,
                "description": "返回条数上限，默认 20，最大 100",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "地区名称关键词（省/市/区县名，如 朝阳、深圳、凉山彝族自治州）"
              },
              "tel_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "长途区号（如 010、0571），反查地区"
              },
              "zip_code": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "6 位邮政编码（如 100010），反查地区"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:7289cc5daf7c6a7c89a9f40e415eb5ed208f7573a72e04f9145cd7a0e8344c7b"
        },
        {
          "name": "parse_id_card",
          "title": "Parse Id Card",
          "description": "解析 18 位中国大陆居民身份证号：按 GB 11643-1999 校验位算法验证合法性，返回归属地（省/市/区，含邮编区号）、出生日期、实足年龄、生肖、星座、性别。非法号码返回具体错误原因（校验位错误/格式错误/出生日期非法等）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id_number": {
                "description": "18 位身份证号（末位可为 X），仅做本地算法校验，不联网",
                "type": "string"
              }
            },
            "required": ["id_number"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:78614820cc747114861ef9c875174984bd272fe5a53d819b30faf8a7f68b98c4"
        },
        {
          "name": "parse_phone",
          "title": "Parse Phone",
          "description": "解析 11 位中国大陆手机号：返回运营商（中国移动/中国联通/中国电信/中国广电/虚拟运营商，含物联网卡等细分类型）、归属地省/市、邮编与长途区号。号段库含约 49.7 万个号段（2023 年公开数据）。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "phone": {
                "description": "11 位手机号（支持含空格/连字符输入，自动提取数字）",
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:8b21c0f6d6549516a966b2989031cb6a0d9c25b2d3c30852106a9cfee1f09ec4"
        },
        {
          "name": "parse_plate",
          "title": "Parse Plate",
          "description": "解析中国大陆机动车号牌：支持普通蓝牌/黄牌（7 位，如 鲁B12345、京A12345）与新能源绿牌（8 位，如 粤BD12345、沪AD12345），返回省份、发牌地市、是否新能源及动力类型（D 纯电动 / F 插混或燃料电池）；内置全国 31 省简称与 392 个地市字母代码表。",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "plate": {
                "description": "车牌号，如 鲁B12345（普通）、粤BD12345（新能源小型）、京A12345",
                "type": "string"
              }
            },
            "required": ["plate"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:a4a6336172410af18e56295de37ab3e6d4db121968e732b375b8c1bc2d5d755c"
        }
      ],
      "digest": "sha256:2cae24368d6292a5f657f31bd201873f09ef8f6b2819abf3243e1edd53fc6664"
    }
  }
