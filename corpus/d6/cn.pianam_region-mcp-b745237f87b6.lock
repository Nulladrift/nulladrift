      },
      "serverInfo": {
        "name": "region-mcp",
        "version": "4.1.3"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {}
        },
        "logging": {},
        "prompts": {
          "listChanged": false
