      "tools": [
        {
          "name": "cancel_booking_draft",
          "title": "Cancel an unpaid booking draft",
          "description": "Cancel a draft the customer has NOT paid for: frees the held time at once and the pay link stops working. A paid or confirmed session cannot be cancelled here (refunds and the 24-hour rule are handled by ElloMind on WhatsApp).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "poll_key": {
                "description": "the poll_key returned by create_booking_draft",
                "maxLength": 64,
                "type": "string"
              },
              "ref": {
                "description": "the booking ref, e.g. EM-XXXX",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["poll_key", "ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Cancel an unpaid booking draft"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:95a14ec55046dbd78fe4bff7092d3358f47e4e9c45d8bf2431238556c2076d5f"
        },
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Real open start times (IST) for a session type over a date range (YYYY-MM-DD, at most 14 days): `days` (all times) and `by_psychologist` (each psychologist's own times, with slug, name and role). Past times and times starting within 10 minutes are never listed. Times are not held until create_booking_draft. Use mode 'in_person' for the Kakkanad clinic (individual sessions, Teresa James). ElloMind matches clients to a psychologist: offer a specific person only when the customer asks for one (by name, or the same psychologist as before); pass psychologist to see only theirs. If this tool returns an error, never tell the customer they are fully booked.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "description": "start date YYYY-MM-DD",
                "maxLength": 10,
                "type": "string"
              },
              "mode": {
                "description": "default online",
                "enum": ["online", "in_person"],
                "type": "string"
              },
              "psychologist": {
                "description": "slug from by_psychologist (e.g. 'nithya-s'), only if the customer asked for that person",
                "maxLength": 64,
                "type": "string"
              },
              "session_type": {
                "enum": ["individual", "couples", "teen"],
                "type": "string"
              },
              "to": {
                "description": "end date YYYY-MM-DD",
                "maxLength": 10,
                "type": "string"
              }
            },
            "required": ["from", "session_type", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check availability"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5fc7a346784dca7deea9e6fd941c3da38fed44048cea8d4717544f2db7bf5a88"
        },
        {
          "name": "create_booking_draft",
          "title": "Create booking draft and pay link",
          "description": "Hold one time with one psychologist (for 30 minutes, and never later than 15 minutes before the session) and return a single-use pay link for the customer. Call check_availability first and use one of its times. psychologist (optional): the slug of the person the customer asked for (from by_psychologist); the time is then held for that person only, or refused with 'not free'. Without it ElloMind assigns someone free at that time. Either way the response names the psychologist (slug, name, role), and that is who the session is booked with. Collect the customer's name, phone (with country code) and email first. Couples: also partner_2 (their own name and email or phone; each partner signs their own consent form before the first joint session). Teen (13 to 17): the contact is the parent or guardian, who pays and signs the teen consent form; also give teen_name. Also required: lead_source (how the customer found ElloMind; ai_assistant if they are booking for themselves through you and did not say) and booked_by ('customer' when the customer books for themselves, otherwise your own name). The price is set by ElloMind; you cannot set an amount. Plans: plan4, plan8 or plan12 (see list_services). In person: individual single sessions only. Every problem with the details comes back at once. Bookings close 10 minutes before the session. Limits: at most 3 unpaid drafts per phone at a time (cancel_booking_draft frees one) and 8 new drafts per hour from one network.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "booked_by": {
                "description": "'customer' if the customer books for themselves; otherwise your name",
                "maxLength": 100,
                "type": "string"
              },
              "email": {
                "maxLength": 200,
                "type": "string"
              },
              "email_checked": {
                "description": "true only after the customer confirmed an unusual email domain",
                "type": "boolean"
              },
              "lead_detail": {
                "description": "required for referral (who referred them) and other",
                "maxLength": 200,
                "type": "string"
              },
              "lead_source": {
                "description": "how the customer found ElloMind",
                "enum": ["whatsapp", "instagram", "facebook", "google", "youtube", "website", "referral", "returning_client", "ai_assistant", "other"],
                "type": "string"
              },
              "mode": {
                "description": "default online; in_person = Kakkanad clinic",
                "enum": ["online", "in_person"],
                "type": "string"
              },
              "name": {
                "description": "the contact: the client, or for teen sessions the parent or guardian",
                "maxLength": 200,
                "type": "string"
              },
              "partner_2": {
                "description": "couples only: the second partner",
                "properties": {
                  "email": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "phone": {
                    "maxLength": 40,
                    "type": "string"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "phone": {
                "description": "with country code, e.g. +91 98xxxxxxxx",
                "maxLength": 40,
                "type": "string"
              },
              "plan_code": {
                "description": "'single' for one session; 'plan4', 'plan8' or 'plan12' for a plan (see list_services)",
                "enum": ["single", "plan4", "plan8", "plan12"],
                "type": "string"
              },
              "psychologist": {
                "description": "slug (e.g. 'nithya-s'), ONLY if the customer asked for that psychologist",
                "maxLength": 64,
                "type": "string"
              },
              "session_type": {
                "enum": ["individual", "couples", "teen"],
                "type": "string"
              },
              "slot_date": {
                "description": "YYYY-MM-DD from check_availability",
                "maxLength": 20,
                "type": "string"
              },
              "slot_time": {
                "description": "HH:MM 24h IST from check_availability",
                "maxLength": 20,
                "type": "string"
              },
              "source_ref": {
                "description": "an EM-XXXX ref the customer was given, if any",
                "maxLength": 120,
                "type": "string"
              },
              "teen_age": {
                "description": "teen only, if known: 13 to 17",
                "maximum": 120,
                "minimum": 0,
                "type": "integer"
              },
              "teen_name": {
                "description": "teen only: the young person's name",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["booked_by", "email", "lead_source", "name", "phone", "plan_code", "session_type", "slot_date", "slot_time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create booking draft and pay link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:e5fbae2f82905f7cc91634c0dccb7275f172f1515a4071bfb74d46e9d4b51b9b"
        },
        {
          "name": "get_booking_status",
          "title": "Get booking status",
          "description": "Read a booking's state to show the customer: draft (waiting for payment), confirmed (with the Meet link), paid (payment in, booking being completed), expired or cancelled; plus the psychologist, consent progress and whether the one free move has been used. It changes nothing. REQUIRES the poll_key from create_booking_draft; without it the answer is 'not found'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "poll_key": {
                "description": "the poll_key returned by create_booking_draft",
                "maxLength": 64,
                "type": "string"
              },
              "ref": {
                "description": "the booking ref, e.g. EM-XXXX",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["poll_key", "ref"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get booking status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3f23522516ac758e50338088d8485cb758457292e3270a6f4fbf7bbe1b9ffd77"
        },
        {
          "name": "list_services",
          "title": "List ElloMind services",
          "description": "List session types, prices and plans for booking therapy with ElloMind. Call before creating a booking so you use a valid session_type and plan_code. Plans: 4, 8 or 12 sessions at 10, 20 or 30% off, valid 6 months, paid upfront. In-person individual sessions (Kakkanad clinic, one at a time) are priced separately.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List ElloMind services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:db94d02e4cf58733d53c8276ff7b0809f5faac6933e17ecf1e6a5513f5397c3c"
        },
        {
          "name": "reschedule_booking",
          "title": "Move a confirmed session",
          "description": "Move a CONFIRMED session to another time with the same psychologist. Allowed once per session, at no charge, when the session is 24 hours or more away. A second change counts as a cancellation and anything inside 24 hours carries the full fee, so those go to ElloMind on WhatsApp. Check the new time with check_availability (same psychologist) first. The Meet link stays the same and everyone is emailed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "poll_key": {
                "description": "the poll_key returned by create_booking_draft",
                "maxLength": 64,
                "type": "string"
              },
              "ref": {
                "description": "the booking ref, e.g. EM-XXXX",
                "maxLength": 20,
                "type": "string"
              },
              "slot_date": {
                "description": "new date YYYY-MM-DD",
                "maxLength": 20,
                "type": "string"
              },
              "slot_time": {
                "description": "new start time HH:MM 24h IST",
                "maxLength": 20,
                "type": "string"
              }
            },
            "required": ["poll_key", "ref", "slot_date", "slot_time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Move a confirmed session"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:1972fc7a361e469f7729deb2bd988d0113cc0176a87221526dd76531763d470d"
        }
      ],
      "digest": "sha256:8a6cb688d156ad83886651645fa626812e7a77535201e3f92c478d83c670b37f"
    }
  }
}
