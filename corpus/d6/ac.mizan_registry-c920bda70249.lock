                "minimum": 0,
                "type": "integer"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "players": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bans": {
                      "additionalProperties": false,
                      "properties": {
                        "inForce": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "lists": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
