      "serverInfo": {
        "name": "mizan",
        "title": "Mizan",
        "version": "1.2.0",
        "websiteUrl": "https://mizan.ac"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Mizan reads the public ban lists of game communities and files each ban under the account it names. A ban is the claim of the list that made it: quote a record's `verdict.text` as it stands, credit each ban to its list, and never call a player a cheater or clean. No bans found means none on the lists Mizan reads, nothing more. `verdict.mizanBan` is true only for a ban by Mizan's own anti-cheat. Ban reasons are each community's own text. Checking several Steam accounts? Use one check_players call, not a loop of lookup_player.",
      "tools": [
        {
          "name": "check_players",
          "title": "Check up to 100 Steam accounts",
          "description": "Check up to 100 Steam accounts in one call, such as everyone on a game server: each account's bans across every list Mizan reads, whether a list banned it for cheating, and Steam's own VAC and game bans. Pass SteamIDs in any form or steamcommunity.com profile links; lines of a server's `status` output work too.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "players": {
                "description": "SteamIDs in any form (SteamID64, STEAM_0:0:11101, [U:1:22202]), steamcommunity.com profile links, or lines of `status` output.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 100,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["players"],
            "type": "object"
          },
