        {
          "name": "list_sources",
          "title": "List the ban lists Mizan reads",
          "description": "List the ban lists Mizan reads, largest first: each list's name, who issues its bans, the games it covers, its bans and how many are in force, and whether Mizan is still reading it. Filter by game key or by part of the name.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "game": {
                "description": "A game key, such as rust, garrysmod, cs2, csgo, tf2 or squad; registry_stats lists every one.",
                "pattern": "^[a-z0-9][a-z0-9_-]{0,63}$",
                "type": "string"
              },
              "limit": {
                "description": "Lists to return, largest first. Defaults to 25.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Part of a list's name, such as \"sourcebans\".",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "lists": {
                "description": "Every list Mizan reads.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "matched": {
                "description": "Lists matching the filters, before the limit.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "ok": {
                "const": true,
                "type": "boolean"
              },
              "readAt": {
                "description": "ISO 8601 time",
                "type": "string"
              },
              "sources": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "bans": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "games": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "inForce": {
                      "maximum": 9007199254740991,
                      "minimum": 0,
                      "type": "integer"
                    },
                    "key": {
                      "type": "string"
                    },
                    "kind": {
                      "description": "Who issues the list's bans: anti_cheat, staff, platform, community",
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "page": {
                      "type": ["string", "null"]
                    },
                    "site": {
                      "type": ["string", "null"]
                    },
                    "state": {
                      "enum": ["reading", "retrying", "stopped"],
                      "type": "string"
                    }
                  },
                  "required": ["bans", "games", "inForce", "key", "kind", "name", "page", "site", "state"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["lists", "matched", "ok", "readAt", "sources"],
            "type": "object"
          },
