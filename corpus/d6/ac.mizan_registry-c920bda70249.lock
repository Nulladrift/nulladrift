                          "name": {
                            "type": "string"
                          }
                        },
                        "required": ["antiCheat", "cheating", "conduct", "name"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": ["string", "null"]
                    },
                    "page": {
                      "type": "string"
