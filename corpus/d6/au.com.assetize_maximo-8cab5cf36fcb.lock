        {
          "name": "test_automation_script_evidence",
          "title": "Check a WORKORDER Automation Script against a Maximo/MAS lens (Automation Script Test Harness)",
          "description": "Statically check a WORKORDER Object launch point Automation Script (Jython or JavaScript) against one release lens's real MXAPIWODETAIL dictionary. Extracts every attribute the script references via mbo.getString/setValue/isNull/getInt/getDate/getBoolean, then reports which ones the named lens has evidence for. Static evidence only — it does not run the script. A missing attribute is reported NOT_ASSESSED, never claimed as a runtime failure; for a real pass/fail/skip verdict, run the CLI (mvn verify) or the browser runner at assetize.com.au/test-stubs/automation-scripts. Lenses: 761 (Maximo 7.6.1), mas811 (MAS 8.11), mas90 (MAS 9.0), mas91 (MAS 9.1), mas92 (MAS 9.2).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lens": {
                "description": "The target release lens.",
                "enum": ["761", "mas811", "mas90", "mas91", "mas92"],
                "type": "string"
              },
              "source": {
                "description": "The Automation Script source — Jython or JavaScript, a WORKORDER Object launch point. Up to 64 KiB.",
                "maxLength": 65536,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["lens", "source"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:afc7c75b7df71712601d290e2393573cc7eb3e1e2492c9b56f6b968dfff974bd"
        },
