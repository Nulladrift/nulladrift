      "tools": [
        {
          "name": "nodajimarket_create_checkout",
          "title": "Create a checkout link",
          "description": "Reserve stock for up to 10 products and return a Stripe Checkout link that a human opens in a browser to pay. The link expires in 30 minutes; the reservation is released if it is not paid. Shipping address, name and phone are entered on the Stripe page — do not collect them yourself. For Canada the card is charged in CAD at a fixed rate (returned as charged_amount_cents). This tool does not take payment; only the customer does, on that page. Pass a stable client_request_id so a retry returns the same link instead of reserving stock twice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agent": {
                "description": "Name of the calling agent, for the merchant's records",
                "maxLength": 40,
                "type": "string"
              },
              "client_request_id": {
                "description": "Stable id for idempotent retries",
                "maxLength": 120,
                "minLength": 4,
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "product_id": {
                      "maxLength": 128,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 5,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["product_id", "quantity"],
                  "type": "object"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "ship_to": {
                "description": "Destination country, ISO 3166-1 alpha-2 (CA, US, JP)",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["items", "ship_to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:59cd7f0b3f0530f91a5d8bea861a388da43b9a88b561bb4a83fa568590a441f1"
        },
        {
          "name": "nodajimarket_get_artist",
          "title": "Get a NodajiMarket artist",
          "description": "Profile of one artist by slug: names (English, Korean, aliases), tagline, story, career (education, exhibitions, awards, designations, collections — all as provided by the artist, not independently verified), portrait, seal image, certificate text, and their works with availability. Read-only.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "artist_slug": {
                "maxLength": 40,
                "minLength": 3,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["artist_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:2f05314cc07ce07e0783375987f18d65e3a45e95c8930129ea51fbc397313694"
        },
        {
          "name": "nodajimarket_get_landed_cost",
          "title": "Estimate delivered cost",
          "description": "Delivered (landed) cost for up to 10 products to one destination: items, shipping, duties estimate, tax and the DDP total in USD cents — the same numbers the store's own checkout charges. For Canada the card is charged in CAD at a fixed rate; charged.amountCents shows that. Returns supported:false with a message for destinations we do not ship to (South Korea, sanctioned countries).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "postal_code": {
                "description": "Destination postal code — for Canada it sets the provincial tax rate",
                "maxLength": 10,
                "minLength": 3,
                "type": "string"
              },
              "product_ids": {
                "items": {
                  "maxLength": 128,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "quantities": {
                "description": "Same length as product_ids; default 1 each",
                "items": {
                  "maximum": 5,
                  "minimum": 1,
                  "type": "integer"
                },
                "type": "array"
              },
              "ship_to": {
                "description": "Destination country, ISO 3166-1 alpha-2 (CA, US, JP)",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["product_ids", "ship_to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:598aa6b6821096c239630c3ea91702fa3f7a35dc9709024153b8342402ce0c96"
        },
        {
          "name": "nodajimarket_get_product",
          "title": "Get one NodajiMarket product",
          "description": "Full detail for one product: description (up to 600 chars), materials, dimensions, weight, images, variants, artist and text rights. Read-only — does not reserve or buy. Use the product id from nodajimarket_search_products.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "product_id": {
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["product_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5e7ba546356e621a02da13c0304cd7f29813410969a738b0aee2a2a9803f8c8b"
        },
        {
          "name": "nodajimarket_search_products",
          "title": "Search NodajiMarket products",
          "description": "Search NodajiMarket's curated catalogue of Korean handcrafted goods and artworks by named artists. Artworks marked coa ship with an artist-signed certificate of authenticity. Prices are in USD (integer cents); for the US and Canada the checkout total is DDP — duties and import taxes included, nothing more to pay on delivery; other destinations ship DAP (the buyer pays duties and taxes on delivery) — get_landed_cost returns incoterm per destination. Returns up to 20 products with price, artist, availability and lead time, plus next_cursor when there are more. Payment is completed by a human in a browser via a Stripe Checkout link (see nodajimarket_create_checkout); no tool here takes payment.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Exact category id, e.g. craft, ink_painting, calligraphy",
                "maxLength": 40,
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from a previous call",
                "maxLength": 400,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_usd": {
                "description": "Upper bound on item price in US dollars",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Free-text keywords (Korean or English): material, technique, artist, subject",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "ship_to": {
                "description": "Destination country, ISO 3166-1 alpha-2 (CA, US, JP)",
                "maxLength": 2,
                "minLength": 2,
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "required": ["query", "ship_to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:01398ab26856e173f3a35f5af5ce4927251dca665e5fd067885df2179b1fe7cf"
        }
