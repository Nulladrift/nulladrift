      "serverInfo": {
        "name": "nodajimarket",
        "title": "NodajiMarket",
        "version": "1.0.1",
        "websiteUrl": "https://nodajimarket.com",
        "icons": [
          {
            "src": "https://nodajimarket.com/nodajimarket.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
