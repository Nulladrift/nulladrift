                        "description": "Opens this offer on the provider's own site, through a FastGPU redirect that counts the click. When partner is true the link carries FastGPU's referral code (the provider pays FastGPU a referral; the price is the same). Give it to the user only after they choose this offer.",
                        "type": "string"
