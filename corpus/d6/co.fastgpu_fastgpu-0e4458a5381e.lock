            "readOnly": true
          },
          "digest": "sha256:fa7d0206068bd91c9ddb8d026c40eecb452fe44d38e8f18f31e1200376bfdcf5"
        },
        {
          "name": "list_gpu_prices",
          "title": "List cheapest GPU prices",
          "description": "One entry per GPU model with its cheapest live on-demand cloud rental price in USD per GPU-hour, the provider offering it, and how many providers rent it, from FastGPU's live price feed across marketplaces, neoclouds and hyperscalers (RunPod, Vast.ai, Lambda, AWS and more). Use it to compare GPU rental prices or to find where a named GPU is cheapest to rent. Each price is the provider's own per-GPU rate: cheapest_min_gpu_count says when it is only sold as a multi-GPU instance, and cheapest_billed_separately names what the provider bills on top of it (CPU, memory, storage), null when the rate includes CPU and memory. page_url links to the GPU's live price page with every offer. rent_url opens the cheapest offer on its provider's site through a FastGPU redirect that counts the click (cheapest_partner is true when that provider pays FastGPU a referral, at the same price); partner_offer is the cheapest offer of the card at a provider that pays FastGPU, with its own price and rent_url, when the cheapest is not already one (null otherwise). When the user wants to rent, share the rent_url of the offer they pick. Rental prices only: it does not rent, reserve or launch GPUs. No key required.",
          "inputSchema": {
            "properties": {
              "tier": {
                "description": "Return only one class of GPU (case-insensitive; combines with vendor). flagship: the current top training and inference accelerators (H100, H200, B200, GB200, MI300X, MI355X). datacenter: earlier or mid-range data-center and workstation cards (A100, L40S, L4, A10, RTX 6000 Ada, V100, MI210). prosumer: desktop consumer and workstation cards (RTX 5090, RTX 4090, RTX 3090, RTX A4000). entry: small inference cards (T4, A2, A16, P4). Omit for every tier.",
                "enum": ["flagship", "datacenter", "prosumer", "entry"],
                "type": "string"
              },
              "vendor": {
                "description": "Return only GPUs made by this vendor (case-insensitive). Combines with tier: both must match. Omit for every vendor.",
                "enum": ["NVIDIA", "AMD"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "gpus": {
                "items": {
                  "properties": {
                    "arch": {
                      "type": ["string", "null"]
                    },
                    "cheapest_billed_separately": {
                      "type": ["string", "null"]
                    },
                    "cheapest_min_gpu_count": {
                      "type": ["integer", "null"]
                    },
                    "cheapest_partner": {
                      "description": "True when the cheapest offer's provider pays FastGPU a referral for the customers it sends.",
                      "type": "boolean"
                    },
                    "cheapest_provider": {
                      "type": ["string", "null"]
                    },
                    "cheapest_usd_hr": {
                      "type": ["number", "null"]
                    },
                    "comparable_partner_offer": {
                      "description": "Only when no provider that pays FastGPU a referral rents this card at all: the cheapest rentable single-GPU offer of another card with as much memory or more (at most twice as much, the same vendor first) at a provider that does, with its own price, page_url and rent_url; null otherwise. It never replaces the cheapest.",
                      "properties": {
                        "billed_separately": {
                          "type": ["string", "null"]
                        },
                        "gpu": {
                          "type": "string"
                        },
                        "offer_type": {
                          "type": "string"
                        },
                        "page_url": {
                          "type": "string"
                        },
                        "provider": {
                          "type": "string"
                        },
                        "provider_slug": {
                          "type": "string"
                        },
                        "rent_url": {
                          "type": "string"
                        },
                        "usd_hr": {
                          "type": ["number", "null"]
                        },
                        "vendor": {
                          "type": "string"
                        },
                        "vram_gb": {
                          "type": "number"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "gpu": {
                      "type": "string"
                    },
                    "offer_count": {
                      "type": "integer"
                    },
                    "page_url": {
                      "description": "Absolute URL of this GPU's live price page, with every live offer.",
                      "type": "string"
                    },
                    "partner_offer": {
                      "description": "The cheapest rentable offer of this card at a provider that pays FastGPU a referral, at that provider's own price, when the cheapest offer is not already one; null otherwise. It never replaces the cheapest.",
                      "properties": {
                        "billed_separately": {
                          "type": ["string", "null"]
                        },
                        "min_gpu_count": {
                          "type": ["integer", "null"]
                        },
                        "offer_type": {
                          "type": "string"
                        },
                        "provider": {
                          "type": "string"
                        },
                        "provider_slug": {
                          "type": "string"
                        },
                        "rent_url": {
                          "type": "string"
                        },
                        "usd_hr": {
                          "type": ["number", "null"]
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "provider_count": {
                      "type": "integer"
                    },
                    "rent_url": {
                      "description": "Opens the cheapest offer on its provider's site through a FastGPU redirect that counts the click; it carries FastGPU's referral code when cheapest_partner is true (same price). Absent when the card has no verified price.",
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "tier": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "Site-relative path of this GPU's live price page, e.g. /gpus/h100-sxm.",
                      "type": "string"
                    },
                    "vendor": {
                      "type": ["string", "null"]
                    },
                    "vram_gb": {
                      "type": ["number", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "stale": {
                "type": "boolean"
              },
              "updated_at": {
                "type": ["string", "null"]
              }
            },
            "required": ["count", "gpus"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List cheapest GPU prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:68f498446264ce1c5b0ebeb7c3284ee82a0ecfa6ee868ab866ad4f532348ca2a"
        },
        {
          "name": "match_workload",
          "title": "Match a workload to the cheapest GPU",
          "description": "Ranks up to eight GPU configurations that can run a job at the lowest live price. Describe the job in query (an open-weight model to serve or fine-tune, a model size, or a GPU need) or with the structured fields. Each match gives the GPU count, the USD per hour for the whole configuration and a one-line reason; the answer also states the VRAM the job needs and, for reference, the on-demand price of the same job at the large cloud providers. Use it to decide where to run a workload; use list_gpu_prices for the price of a named GPU. Open-weight models only: a model offered only through its maker's API returns no matches and a note. Ranked on price and fit unless partner_rank is set; each match reports partner (whether its provider pays FastGPU a referral). Hard limits (budget_usd_hr, max_total_usd with duration_hours, max_quote_age_minutes) drop every configuration that breaks them; limits reports what was dropped. Read-only: it does not rent, reserve or launch GPUs. No key required.",
          "inputSchema": {
            "properties": {
              "active_params_b": {
                "description": "For a mixture-of-experts model: the parameters it runs per generated token, in billions (Qwen3-30B-A3B runs about 3). Used for tokens_per_sec and usd_per_million_tokens; the memory estimate still holds every expert. Omit it to use FastGPU's figure for a model it knows, or what the Hugging Face repo's own config.json states (workload.active_params_source says which).",
                "type": "number"
              },
              "budget_usd_hr": {
                "description": "Hard limit on the hourly price of the whole configuration, in USD. Configurations above it are not returned.",
                "type": "number"
              },
              "concurrency": {
                "description": "For a serving or fine-tuning job: requests (or sequences) processed at once, 1 to 2048 (default 1). Sizes the KV cache, and for serving the tokens_per_sec and usd_per_million_tokens estimate: more requests at once share each step's weight reads.",
                "type": "integer"
              },
              "context_tokens": {
                "description": "Tokens of context each request holds, prompt and output together, 512 to 1000000 (default 4096). Sizes the KV cache and the per-token estimate.",
                "type": "integer"
              },
              "duration_hours": {
                "description": "How long the job will run, in hours (fractions are fine). When sent, each match carries billed_hours and estimated_total_usd.",
                "type": "number"
              },
              "engram_placement": {
                "description": "For a model with Engram memory tables (DeepSeek-V4.1): gpu (default) holds them in GPU memory; host keeps them in the machine's RAM, as SGLang's --engram-config '{\"placement\":\"cpu\"}' does, so vram_required_gb leaves them out and workload.engram_gb is the RAM the machine needs for them. A token reads only a few of their rows, so the per-token estimate is the same either way.",
                "enum": ["gpu", "host"],
                "type": "string"
              },
              "gpu_count": {
                "description": "Exact positive GPU count. Overrides a count in query text. Returns no matches if no supported configuration fits; omit for automatic sizing.",
                "type": "integer"
              },
              "max_quote_age_minutes": {
                "description": "Hard limit on how old a price quote may be, in minutes. Configurations whose price was fetched from the provider longer ago are not returned.",
                "type": "number"
              },
              "max_total_usd": {
                "description": "Hard limit on estimated_total_usd, the GPU rental cost of the whole job, in USD. Needs duration_hours. Configurations above it are not returned.",
                "type": "number"
              },
              "min_gpu_memory_gb": {
                "description": "Memory each GPU card must have, in GB (e.g. 80 for 80GB-class cards such as the H100 or A100 80GB). Smaller cards are never returned. On its own it lists every card that size, cheapest first.",
                "type": "integer"
              },
              "model": {
                "description": "Open model name to size against, e.g. \"Llama 3 70B\", \"Qwen 72B\", \"Mixtral\".",
                "type": "string"
              },
              "params_b": {
                "description": "Model size in billions of parameters when no exact model is named.",
                "type": "number"
              },
              "partner_rank": {
                "description": "Set true to rank as fastgpu.co ranks its own Rent links: score = merit x (1 + partner_boost), where a provider that pays FastGPU a referral fee is lifted by 20% to 100%, graded on what one Rent click to it earns; each match then carries partner_boost. Off by default: without it no provider pays for placement.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "precision": {
                "description": "Numeric precision to size the model at.",
                "enum": ["fp16", "int8", "int4"],
                "type": "string"
              },
              "query": {
                "description": "Plain-language job, e.g. \"cheapest to serve Llama 3 70B\", \"2x H100 for fine-tuning\" or \"a GPU with 80GB of memory\". Provide this OR a structured spec below.",
                "type": "string"
              },
              "region": {
                "description": "Restrict to a data-residency region.",
                "enum": ["US", "EU", "ASIA"],
                "type": "string"
              },
              "reserved": {
                "description": "Set true to include reserved / committed-term capacity for a lower rate.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "signup_credit": {
                "description": "Set true to also get new_account_credit_match: the lowest-priced configuration that can run this job at a provider that gives new accounts a credit (confirmed on the provider's own page within 48 hours; FastGPU earns a referral there). It is returned beside matches and never changes them.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "spot": {
                "description": "Set true to include interruptible spot capacity for a cheaper rate.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "task": {
                "description": "What the job does.",
                "enum": ["inference", "finetune-lora", "finetune-full", "generate", "transcribe", "embed"],
                "type": "string"
              },
              "vram_gb": {
                "description": "Rough VRAM the job needs, in GB, if you already know it.",
                "type": "integer"
              },
              "weights_gb": {
                "description": "Measured size of the weights as stored, in GB: the file you will load (for example a GGUF Q4_K_M build, which holds more bits per parameter than its nominal 4). Replaces parameters times bytes per parameter in the memory estimate. Used for a model sized by its parameter count; the answer's workload.weights_gb is null when it was not (an image or speech model sized as a whole pipeline).",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "When this answer was computed (ISO 8601). Quote ages are measured against it.",
                "type": "string"
              },
              "count": {
                "type": "integer"
              },
              "error": {
                "description": "Present when the request was not valid; says what to send instead.",
                "type": "string"
              },
              "hero": {
                "properties": {
                  "hyperscaler_ceiling": {
                    "type": ["string", "null"]
                  },
                  "same_model": {
                    "type": ["boolean", "null"]
                  },
                  "savings_pct": {
                    "type": ["number", "null"]
                  }
                },
                "type": ["object", "null"]
              },
              "limits": {
                "description": "The hard limits this answer applied (null when one was not sent) and how many configurations each one left out.",
                "properties": {
                  "budget_usd_hr": {
                    "type": ["number", "null"]
                  },
                  "duration_hours": {
                    "type": ["number", "null"]
                  },
                  "excluded": {
                    "properties": {
                      "older_than_max_quote_age_minutes": {
                        "type": "integer"
                      },
                      "over_budget_usd_hr": {
                        "type": "integer"
                      },
                      "over_max_total_usd": {
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "max_quote_age_minutes": {
                    "type": ["number", "null"]
                  },
                  "max_total_usd": {
                    "type": ["number", "null"]
                  },
                  "nearest_excluded": {
                    "description": "When the limits leave no match: the cheapest configuration that can still run the job, and the limits it breaks.",
                    "properties": {
                      "billed_hours": {
                        "description": "Hours the provider bills for duration_hours: rounded up to whole hours on a per-hour meter and to whole minutes on a per-minute meter. Null when duration_hours was not sent.",
                        "type": ["number", "null"]
                      },
                      "billing_increment": {
                        "description": "How this provider's meter ticks for on-demand rental; varies means FastGPU has no verified figure.",
                        "enum": ["per-second", "per-minute", "per-hour", "varies"],
                        "type": "string"
                      },
                      "breaks": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "effective_usd_hr": {
                        "type": "number"
                      },
                      "estimated_total_usd": {
                        "description": "effective_usd_hr times billed_hours, rounded up to the cent. GPU rental only: storage, data transfer, CPU and memory billed separately, and provider minimums are not included. Null when duration_hours was not sent.",
                        "type": ["number", "null"]
                      },
                      "fetched_at": {
                        "description": "When this price was fetched from the provider (ISO 8601).",
                        "type": ["string", "null"]
                      },
                      "fits_single_card": {
                        "type": "boolean"
                      },
                      "gpu": {
                        "type": "string"
                      },
                      "gpu_count": {
                        "type": "integer"
                      },
                      "gpu_count_needed": {
                        "description": "How many of this card the whole job takes: gpu_count, or more when over_capacity (a multi-node cluster).",
                        "type": "integer"
                      },
                      "monthly_usd": {
                        "type": "number"
                      },
                      "new_account_credit": {
                        "description": "A credit the provider gives a NEW account opened through rent_url, shown only while FastGPU read it on the provider's own referral page within the last 48 hours; null when none is confirmed. usd is the credit, expires_days how long its unused part lasts (null when the provider states none), confirmed_at when FastGPU last read it there, terms_url the FastGPU page that quotes the provider's conditions and what FastGPU earns. It never changes the ranking or the price.",
                        "properties": {
                          "confirmed_at": {
                            "type": "string"
                          },
                          "expires_days": {
                            "type": ["integer", "null"]
                          },
                          "terms_url": {
                            "type": "string"
                          },
                          "usd": {
                            "type": "number"
                          }
                        },
                        "type": ["object", "null"]
                      },
                      "offer_type": {
                        "type": "string"
                      },
                      "over_budget": {
                        "type": "boolean"
                      },
                      "over_capacity": {
                        "description": "True when the job needs more cards than one node of this offer has: the configuration shown is that node and holds only part of the job, so it does not run the model by itself. gpu_count_needed says how many cards the whole job takes across nodes.",
                        "type": "boolean"
                      },
                      "page_url": {
                        "description": "Absolute URL of this GPU's live price page, with every live offer.",
                        "type": "string"
                      },
                      "partner": {
                        "type": "boolean"
                      },
                      "partner_boost": {
                        "description": "Only when partner_rank=true was sent: the lift this provider gets in that ranking, as a share (0 for a provider that pays no referral, 0.2 to 1 for one that does).",
                        "type": "number"
                      },
                      "paying_alt": {
                        "description": "Only on a match whose provider pays FastGPU no referral (partner false): the same setup (card and count) at the cheapest provider that does pay one, at that provider's own price, or null when none fits the job. A fact beside the match: it never changes the ranking or the match.",
                        "properties": {
                          "effective_usd_hr": {
                            "type": "number"
                          },
                          "gpu": {
                            "type": "string"
                          },
                          "gpu_count": {
                            "type": "integer"
