              },
              "updated_at": {
                "type": ["string", "null"]
              },
              "workload": {
                "description": "The run as sized: model, method, parameters, tokens, sequence, micro-batch, vram_required_gb, training_flops, mfu.",
                "type": "object"
              }
            },
            "type": "object"
