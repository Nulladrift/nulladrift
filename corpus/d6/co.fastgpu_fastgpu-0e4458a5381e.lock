      "instructions": "Compare live GPU cloud rental prices across the whole market and route a workload to the cheapest fit. Available tools: list_gpu_prices, match_workload, estimate_finetune_cost.",
      "tools": [
        {
          "name": "estimate_finetune_cost",
          "title": "Estimate what a fine-tune costs on every GPU",
          "description": "For a LoRA, QLoRA or full fine-tune of an open language model on a dataset: the GPU memory it needs, and for every GPU that can hold it, how many of that GPU, how long the run takes and what the whole job costs at that GPU's cheapest rentable live price, billed under its provider's meter, cheapest job first. Time = 8 (full) or 6 (LoRA) x active parameters x tokens / (GPUs x the card's dense 16-bit peak x mfu); mfu is an assumption the caller picks. Each row carries page_url (the GPU's live prices) and rent_url (opens the provider through a FastGPU redirect that counts the click; partner rows carry FastGPU's referral code at the same price; share it when the user wants to rent). own_it names the smallest machine a person could buy that holds the run. Use it to answer what a fine-tune costs and where it is cheapest to run. Read-only: it does not rent, reserve or launch GPUs. No key required.",
          "inputSchema": {
            "properties": {
              "batch": {
                "description": "Micro-batch per GPU (default 4); sizes activation memory.",
                "enum": ["1", "2", "4", "8", "16", "32"],
                "type": "integer"
              },
              "epochs": {
                "description": "Passes over the dataset (default 3), when tokens is not sent.",
                "type": "number"
              },
              "examples": {
                "description": "Training examples (default 10000), when tokens is not sent.",
                "type": "integer"
              },
              "method": {
                "description": "Fine-tuning method (default lora).",
                "enum": ["lora", "qlora", "full"],
                "type": "string"
              },
              "mfu": {
                "description": "Assumed utilization of the card's peak, in percent (default 40).",
                "enum": ["25", "40", "55"],
                "type": "integer"
              },
              "model": {
                "description": "Open model name or Hugging Face repo id, e.g. \"Llama 3.1 8B\" or \"Qwen/Qwen3-8B\".",
                "type": "string"
              },
              "params_b": {
                "description": "Model size in billions of parameters, when no model is named.",
                "type": "number"
              },
              "seq": {
                "description": "Sequence length in tokens (default 2048); sizes activation memory.",
                "enum": ["512", "1024", "2048", "4096", "8192", "16384", "32768"],
                "type": "integer"
              },
              "tokens": {
                "description": "Training tokens over the whole run. Or send examples, tokens_per_example and epochs instead.",
                "type": "number"
              },
              "tokens_per_example": {
                "description": "Tokens per example (default 1000), when tokens is not sent.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "error": {
                "description": "Present when the run cannot be priced (an unknown model, an invalid argument).",
                "type": "string"
              },
              "gpus": {
                "description": "Every GPU that can hold the run, cheapest whole job first.",
                "items": {
                  "properties": {
                    "billed_hours": {
                      "type": "number"
                    },
                    "gpu": {
                      "type": "string"
                    },
                    "gpu_count": {
                      "type": "integer"
                    },
                    "hours": {
                      "type": "number"
                    },
                    "offer_type": {
                      "type": "string"
                    },
                    "page_url": {
                      "type": "string"
                    },
                    "partner": {
                      "description": "The provider pays FastGPU a referral when the run is rented through rent_url, at the same price.",
                      "type": "boolean"
                    },
                    "paying_alt": {
                      "description": "Only on a row whose provider pays FastGPU no referral: the same GPU at the provider that does pay one, with its own hourly price, job total and rent_url, or null when none rents it for this run. A fact beside the row: it never changes the order.",
                      "properties": {
                        "gpu": {
                          "type": "string"
                        },
                        "gpu_count": {
                          "type": "integer"
                        },
                        "offer_type": {
                          "type": "string"
                        },
                        "page_url": {
                          "type": "string"
                        },
                        "provider": {
                          "type": "string"
                        },
                        "provider_label": {
                          "type": "string"
                        },
                        "rent_url": {
                          "type": "string"
                        },
                        "total_usd": {
                          "type": "number"
                        },
                        "usd_per_hr": {
                          "type": "number"
                        }
                      },
                      "type": ["object", "null"]
                    },
                    "pcie_multi_gpu": {
                      "type": "boolean"
                    },
                    "provider": {
                      "type": "string"
                    },
                    "provider_label": {
                      "type": "string"
                    },
                    "reliability": {
                      "type": ["number", "null"]
                    },
                    "rent_url": {
                      "type": "string"
                    },
                    "total_usd": {
                      "type": "number"
                    },
                    "training_tflops": {
                      "type": ["number", "null"]
                    },
                    "usd_per_gpu_hr": {
                      "type": "number"
                    },
                    "usd_per_hr": {
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "method_note": {
                "type": "string"
              },
              "method_url": {
                "type": "string"
              },
              "own_it": {
                "description": "The smallest machine a person can buy that holds the run, with its maker's price where stated; page_url compares every machine that fits.",
                "type": ["object", "null"]
              },
              "stale": {
