      "instructions": "Compare live GPU cloud rental prices across the whole market and route a workload to the cheapest fit. Available tools: list_gpu_prices, match_workload.",
      "tools": [
        {
          "name": "list_gpu_prices",
          "title": "List cheapest GPU prices",
          "description": "One entry per GPU model with its cheapest live on-demand cloud rental price in USD per GPU-hour, the provider offering it, and how many providers rent it, from FastGPU's live price feed across marketplaces, neoclouds and hyperscalers (RunPod, Vast.ai, Lambda, AWS and more). Use it to compare GPU rental prices or to find where a named GPU is cheapest to rent. Each price is the provider's own per-GPU rate: cheapest_min_gpu_count says when it is only sold as a multi-GPU instance, and cheapest_billed_separately names what the provider bills on top of it (CPU, memory, storage), null when the rate includes CPU and memory. page_url links to the GPU's live price page with every offer. Rental prices only: it does not rent, reserve or launch GPUs. No key required.",
          "inputSchema": {
            "properties": {
              "tier": {
                "description": "Return only one class of GPU (case-insensitive; combines with vendor). flagship: the current top training and inference accelerators (H100, H200, B200, GB200, MI300X, MI355X). datacenter: earlier or mid-range data-center and workstation cards (A100, L40S, L4, A10, RTX 6000 Ada, V100, MI210). prosumer: desktop consumer and workstation cards (RTX 5090, RTX 4090, RTX 3090, RTX A4000). entry: small inference cards (T4, A2, A16, P4). Omit for every tier.",
                "enum": ["flagship", "datacenter", "prosumer", "entry"],
                "type": "string"
              },
              "vendor": {
                "description": "Return only GPUs made by this vendor (case-insensitive). Combines with tier: both must match. Omit for every vendor.",
                "enum": ["NVIDIA", "AMD"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "gpus": {
                "items": {
                  "properties": {
                    "arch": {
                      "type": ["string", "null"]
                    },
                    "cheapest_billed_separately": {
                      "type": ["string", "null"]
                    },
                    "cheapest_min_gpu_count": {
                      "type": ["integer", "null"]
                    },
                    "cheapest_provider": {
                      "type": ["string", "null"]
                    },
                    "cheapest_usd_hr": {
                      "type": ["number", "null"]
                    },
                    "gpu": {
                      "type": "string"
                    },
                    "offer_count": {
                      "type": "integer"
                    },
                    "page_url": {
                      "description": "Absolute URL of this GPU's live price page, with every live offer.",
                      "type": "string"
                    },
                    "provider_count": {
                      "type": "integer"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "tier": {
                      "type": ["string", "null"]
                    },
                    "url": {
                      "description": "Site-relative path of this GPU's live price page, e.g. /gpus/h100-sxm.",
                      "type": "string"
                    },
                    "vendor": {
                      "type": ["string", "null"]
                    },
                    "vram_gb": {
                      "type": ["number", "null"]
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
