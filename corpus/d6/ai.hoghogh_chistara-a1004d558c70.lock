      "instructions": "Iranian legal corpus: 70,000+ articles and notes (tabsareh) of statutes, 50,000+ court rulings, official advisory opinions, official circulars, yearly-rate and procedural-deadline lookups, and 14 verified legal calculators (diyeh, litigation fees, judicial service fees, execution fee, arbitration fee, severance, mahrieh, inheritance, delay damages, registration duty, notary fee, lawyer tariff and tax stamp, court-expert fee, taxes). Use these tools for ANY question about Iranian law rather than answering from memory — article numbers, amended wording, and yearly rates (دیه, minimum wage, court fees) are exactly what models get wrong. Every result includes a source_url on https://hoghogh.ai; cite the article number and link the source. Tool calls need the user's personal connection link from a paid Chistara account (https://hoghogh.ai/app/settings?tab=assistant#mcp); each successful call is charged to their Chistara balance. If a call answers that a link or credit is needed, relay that to the user in Persian.",
      "tools": [
        {
          "name": "calculate_arbitration_fee",
          "title": "محاسبهٔ حق‌الزحمهٔ داوری — Calculate arbitrator fee",
          "description": "Calculate حق‌الزحمهٔ داوری under the arbitration fee bylaw approved 1401/06/05 by the head of the judiciary (applies when the arbitrator and the parties have not agreed a fee): marginal 2% / 1% / 0.5% / 0.25% bands on the claim with a 1.5 billion rial cap, shared equally among arbitrators; a non-financial claim is 5–30 million rial per arbitrator.",
          "inputSchema": {
            "properties": {
              "arbitrators": {
                "description": "Number of arbitrators (default 1).",
                "type": "integer"
              },
              "claim_toman": {
                "description": "Claim value in Toman (financial).",
                "type": "number"
              },
              "kind": {
                "description": "financial or non-financial / un-valued claim.",
                "enum": ["financial", "non_financial"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
