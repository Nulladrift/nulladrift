          },
          "digest": "sha256:21dca9cc2706c0c5b2d06385ea297b4204c08ea6646046be9b69f366c7b2c4ea"
        },
        {
          "name": "calculate_inheritance",
          "title": "محاسبهٔ سهم‌الارث — Calculate inheritance shares",
          "description": "Calculate Iranian inheritance shares (سهم‌الارث) of the spouse, parents and children under قانون مدنی arts. 861–949 (رد، نقص، the mother's حاجب), in exact fractions that always sum to the estate. Grandchildren and class-2/3 heirs (siblings, grandparents, uncles …) are refused with the governing articles, never estimated — do not compute those yourself.",
          "inputSchema": {
            "properties": {
              "brother_count": {
                "description": "Full or paternal brothers of the deceased (ماده ۸۹۲ ب).",
                "type": "integer"
              },
              "daughter_count": {
                "description": "Number of daughters.",
                "type": "integer"
              },
              "deceased_gender": {
                "description": "Gender of the deceased.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "has_father": {
                "description": "Father alive?",
                "type": "boolean"
              },
              "has_mother": {
                "description": "Mother alive?",
                "type": "boolean"
              },
              "has_spouse": {
                "description": "Surviving spouse?",
                "type": "boolean"
              },
              "sibling_count": {
                "description": "Deceased's siblings when their sex is unknown (for the mother's حاجب). Prefer brother_count / sister_count.",
                "type": "integer"
              },
              "sister_count": {
                "description": "Full or paternal sisters of the deceased (ماده ۸۹۲ ب).",
                "type": "integer"
              },
              "son_count": {
                "description": "Number of sons.",
                "type": "integer"
              },
              "total_assets_toman": {
                "description": "Total estate value in Toman.",
                "type": "number"
              },
              "wife_count": {
                "description": "Permanent wives of a male deceased, 1–4 (ماده ۹۴۲).",
                "type": "integer"
              }
            },
            "required": ["deceased_gender", "total_assets_toman"],
            "type": "object"
          },
