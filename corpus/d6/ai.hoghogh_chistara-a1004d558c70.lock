        },
        {
          "name": "calculate_diyeh",
          "title": "محاسبهٔ دیه — Calculate blood money (دیه)",
          "description": "Calculate دیه for a bodily injury using the CURRENT official rate and the fractions set by قانون مجازات اسلامی. ALWAYS use this instead of computing دیه yourself: the full-دیه rate changes every Persian year and the per-injury fractions are statutory. Returns the amount with the governing article and the official rate source.",
          "inputSchema": {
            "properties": {
              "count": {
                "description": "How many (fingers, teeth …). Default 1.",
                "type": "integer"
              },
              "death_date": {
                "description": "Jalali date of death when it differs from the act.",
                "type": "string"
              },
              "fraction": {
                "description": "دیه fraction between 0 and 1 — only when no injury_type fits.",
                "type": "number"
              },
              "gender": {
                "description": "Gender of the injured/deceased.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "incident_date": {
                "description": "Jalali date of the act, e.g. 1405/09/25 — the ماه حرام is derived from the official Hijri calendar (ماده ۵۵۵).",
                "type": "string"
              },
              "injury_type": {
                "description": "Injury key from the standard list (e.g. full = دیهٔ کامل, hand_one = یک دست, tooth_front = دندان جلویی). Pick the key, not free text.",
                "enum": ["full", "eye_one", "eye_both", "ear_one", "ear_both", "ear_lobe_one", "ear_lobe_both", "hand_one", "hand_both", "foot_one", "foot_both", "finger_thumb", "finger_other", "finger_phalanx", "finger_thumb_phalanx", "toe_phalanx", "toe_thumb_phalanx", "tooth_front", "tooth_molar", "nose_full", "nose_fracture", "kidney_one", "kidney_both", "rib_heart", "rib_each", "rib_other", "spleen", "skull_fracture", "spine_fracture", "spine_fracture_healed", "spinal_cord", "eyelid_upper", "eyelid_lower", "testicle_left", "testicle_right"],
                "type": "string"
              },
              "sacred_month": {
                "description": "Only when no date is known: the act AND the death were in a ماه حرام (تغلیظ — a death, injury_type=full, only; ماده ۵۵۷).",
                "type": "boolean"
              },
              "year": {
                "description": "Persian year (e.g. 1405). Defaults to the latest loaded rate.",
                "type": "integer"
              }
            },
            "required": [],
            "type": "object"
          },
