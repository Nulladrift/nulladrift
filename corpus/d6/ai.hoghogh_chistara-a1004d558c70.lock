        },
        {
          "name": "calculate_delay_penalty",
          "title": "محاسبهٔ خسارت تأخیر تأدیه — Calculate late-payment damages",
          "description": "Calculate خسارت تأخیر تأدیه under art. 522 ق.آ.د.م and unification ruling 850: (CBI index of the payment MONTH ÷ index of the due MONTH) × principal, from the Central Bank's official monthly table. When that table is not loaded the tool answers with the limitation and the official link instead of a number — never approximate it. Dates are Jalali.",
          "inputSchema": {
            "properties": {
              "end_month": {
                "description": "Jalali end month 1–12 (optional).",
                "type": "integer"
              },
              "end_year": {
                "description": "Jalali year of calculation/payment.",
                "type": "integer"
              },
              "principal": {
                "description": "Principal debt amount.",
                "type": "number"
              },
              "principal_unit": {
                "description": "Unit of the principal (default Toman).",
                "enum": ["toman", "rial"],
                "type": "string"
              },
              "start_month": {
                "description": "Jalali due month 1–12 (needed: ruling 850 reads that month's index).",
                "type": "integer"
              },
              "start_year": {
                "description": "Jalali year the debt fell due.",
                "type": "integer"
              }
            },
            "required": ["end_year", "principal", "start_year"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
