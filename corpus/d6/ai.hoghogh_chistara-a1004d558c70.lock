        {
          "name": "calculate_execution_fee",
          "title": "محاسبهٔ نیم‌عشر اجرایی — Calculate judgment execution fee",
          "description": "Calculate نیم‌عشر اجرایی (the state execution fee on a civil judgment): 5% of the judgment sum (Civil Judgments Enforcement Act art. 158), half on settlement and none if complied with within ten days of service of the writ (art. 160), 10% of three months' rent for an eviction (art. 159), the 1405 budget-table range for a non-financial judgment, and the Dispute Settlement Council's art. 27 exemptions for a settlement report.",
          "inputSchema": {
            "properties": {
              "amount_toman": {
                "description": "Judgment sum in Toman (money, shora_settlement).",
                "type": "number"
              },
              "kind": {
                "description": "money = financial judgment; eviction = lease eviction; non_financial = non-financial or un-valued; shora_settlement = Dispute Settlement Council settlement report.",
                "enum": ["money", "eviction", "non_financial", "shora_settlement"],
                "type": "string"
              },
              "monthly_rent_toman": {
                "description": "Monthly rent in Toman (eviction).",
                "type": "number"
              },
              "shora_timing": {
                "description": "Settlement report: before the execution order (exempt), within a month of the notice (half), later.",
                "enum": ["before_order", "within_month", "later"],
                "type": "string"
              },
              "timing": {
                "description": "Court judgment: complied after ten days of service of the writ (default), within ten days, or the parties settled (half).",
                "enum": ["after_ten_days", "within_ten_days", "settled"],
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b2fd1919b19e42182cc0a9a0d757ab74cd2179371b5d8db5d5e1f41ed6e18b3c"
        },
        {
          "name": "calculate_expert_fee",
          "title": "محاسبهٔ دستمزد کارشناسی رسمی — Calculate court expert fee",
          "description": "Calculate the official تعرفهٔ دستمزد کارشناسان رسمی دادگستری as replaced by the 1405 instrument (approved 1405/05/07, promulgated 1405/05/20; supersedes the 1398/12/25 tariff and its 1402 amendment). `valuation` is a marginal ladder on the ارزش موضوع کارشناسی (art. 11) with a hard per-expert cap (1,350,000,000 rial) and explicit percentage add-ons for a few named subject matters (art. 11 notes 3–4, art. 22(2)); `residual` is expert work with no specific tariff in this instrument (art. 9) — a RANGE of 20,000,000–100,000,000 rial set on the expert's proposal with the referring authority's agreement, and the tool returns only the floor and says so; `evidence` is the flat minimum for تأمین دلیل (art. 7, 20,000,000 rial). Dozens of OTHER specialties (arts. 13–55) carry their own separate tariff and are not modelled here. Never guess a court expert's statutory fee.",
          "inputSchema": {
            "properties": {
              "expert_count": {
                "description": "Number of same-specialty experts working the SAME subject jointly (valuation only). More than 1 applies a 30% reduction per expert, with the cap checked after the reduction (art. 56). Default 1 (no reduction). Do not use for a multi-specialty panel — price each specialty separately.",
                "type": "integer"
              },
              "kind": {
                "description": "valuation = art. 11 ladder (needs value_rial); residual = flat minimum, no specific tariff (art. 9); evidence = تأمین دلیل flat minimum (art. 7).",
                "enum": ["valuation", "residual", "evidence"],
                "type": "string"
              },
              "modifiers": {
                "description": "valuation only; usually at most one: contract_dispute = employer/contractor/consulting-engineer dispute or صورت‌وضعیت review over the whole contract value (+100%, art. 11 note 3); contract_dispute_partial = appraisal of only part of the contract, e.g. finding breach or delay (+50%, note 3); intangible_assets = valuation of intangible assets such as brands (+50%, art. 11 note 4 in the 1405 tariff); underground_mine = underground mineral reserves (+35%, art. 22(2)).",
                "items": {
                  "enum": ["contract_dispute", "contract_dispute_partial", "intangible_assets", "underground_mine"],
                  "type": "string"
                },
                "type": "array"
              },
              "travel_days_other_province": {
                "description": "Mission days outside the expert's own province (art. 6).",
                "type": "integer"
              },
              "travel_days_same_province": {
                "description": "Mission days within the expert's own province (art. 6 daily travel allowance) — added to any kind.",
                "type": "integer"
              },
              "value_rial": {
                "description": "Value of the subject matter under appraisal, in RIAL — valuation only. Never pass Toman.",
                "type": "number"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
