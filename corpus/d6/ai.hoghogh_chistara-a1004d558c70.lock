        {
          "name": "calculate_lawyer_fee",
          "title": "محاسبهٔ حق‌الوکاله — Calculate lawyer fee (bar tariff)",
          "description": "Calculate حق‌الوکاله from آیین‌نامهٔ تعرفهٔ حق‌الوکاله (1398/12/28): financial claims are a marginal ladder on the claim value (art. 9); family, non-financial, criminal and administrative matters are a min–max RANGE independent of value (arts. 13, 14, 20). `stage` is art. 21's share of the whole-case fee (60% first instance / 40% appeal). The tariff does not scale by winning or losing. Never guess a lawyer's statutory fee.",
          "inputSchema": {
            "properties": {
              "case_type": {
                "description": "civil = financial claim (art. 9); family = family/حسبی (art. 13a); non_financial (art. 13b); criminal (art. 14, needs criminal_grade); admin = دیوان عدالت اداری / تعزیرات (art. 20); board = non-judicial boards e.g. labour (art. 20).",
                "enum": ["civil", "family", "non_financial", "criminal", "admin", "board"],
                "type": "string"
              },
              "case_value_toman": {
                "description": "Claim value in Toman — civil only.",
                "type": "number"
              },
              "contract_fee_toman": {
                "description": "Fee written in the power of attorney, in Toman — for the 5% tax stamp (Direct Taxes Act art. 103), which is never below the tariff floor.",
                "type": "number"
              },
              "criminal_grade": {
                "description": "Criminal only: court (کیفری یک / دو) and offence grade.",
                "enum": ["k1_grade1", "k1_grade2_3", "k1_other", "k2_hodud_diyat_grade4_5", "k2_grade6", "k2_other"],
                "type": "string"
              },
              "final_at_first_instance": {
                "description": "Civil only: first-instance judgment is final as to value ⇒ flat 10% (art. 9 opening).",
                "type": "boolean"
              },
              "membership": {
                "description": "bar = Bar Association member (fund 50% + bar 25% of the stamp); center = مرکز وکلا member (5% of the fee) — bylaw art. 29.",
                "enum": ["bar", "center"],
                "type": "string"
              },
              "outcome": {
                "description": "How the case ends (default judgment). Settlement is paid in full (art. 23); art. 12 halves or quarters a fee for قرار رد / ابطال.",
                "enum": ["judgment", "settlement", "dismissed_no_merits", "rejected_after_defence", "voided_before_defence"],
                "type": "string"
              },
              "stage": {
                "description": "first = 60%, appeal = 40%, cassation = on the appeal tariff (arts. 16–17).",
                "enum": ["first", "appeal", "cassation"],
                "type": "string"
              }
            },
            "required": ["stage"],
            "type": "object"
          },
          "annotations": {
