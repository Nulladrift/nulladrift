        {
          "name": "calculate_notary_fee",
          "title": "محاسبهٔ حق‌التحریر دفترخانه — Calculate notary fee",
          "description": "Calculate حق‌التحریر (the notary office's fee) from the official 1405 tariff for دفاتر اسناد رسمی. Distinct from حق‌الثبت (use calculate_stamp_duty for that). Never estimate the tariff.",
          "inputSchema": {
            "properties": {
              "amount_toman": {
                "description": "Document amount in Toman (rate-based types only; for real estate this is ارزش معاملاتی, not market price).",
                "type": "number"
              },
              "doc_type": {
                "description": "Document type. Rate-based types (need amount_toman): immovable/sale, movable/vehicle, financial/mortgage/partnership, lease. Others are fixed-fee.",
                "enum": ["immovable", "sale", "movable", "vehicle", "financial", "mortgage", "partnership", "lease", "poa_sale", "poa_vehicle", "power_of_attorney", "undertaking", "mahrieh_release", "division", "student_undertaking", "endowment", "will", "will_ahdi", "settlement", "collateral_swap", "other_nonfinancial", "mortgage_release", "execution_writ", "signature_cert", "sana_signup"],
                "type": "string"
              },
              "obligor_count": {
                "description": "Number of obligors (optional; each beyond two adds a surcharge).",
                "type": "number"
              }
            },
            "required": ["doc_type"],
            "type": "object"
          },
