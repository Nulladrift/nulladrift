          "digest": "sha256:ca39bc68db05bca407e43b1e48b520003d90d070eebf4c5cd5460870aa19bd40"
        },
        {
          "name": "generate_custom_print",
          "title": "Generate custom print",
          "description": "Generate a CUSTOM t-shirt print from a text prompt (AI, takes 2-10 min). SPENDS THE ACCOUNT OWNER'S STUDIO CREDITS: tell them the cost and their balance and get a yes BEFORE calling this — never spend silently, and never spend to 'try something' on your own initiative. Credits are earned (20 free on signup, 20 with every tee bought), so a wasted one is a real loss to them. Free exception: preserve=true prints their own image as-is and costs nothing. IMPORTANT: first call get_studio_options and ask the human to pick placement + product (and optionally background); do NOT silently use defaults. Args: prompt (design description), product? (one of ['kids_basic_tshirt_boy', 'kids_basic_tshirt_girl', 'kids_oversize_tshirt_boy', 'kids_oversize_tshirt_girl', 'mens_basic_tshirt', 'mens_oversize_tshirt', 'womens_basic_tshirt', 'womens_oversize_tshirt']), background? (t-shirt background, one of ['washed-beige', 'washed-black', 'washed-blue', 'washed-brown', 'washed-gray', 'washed-green', 'washed-orange', 'washed-pink', 'washed-red', 'washed-yellow', 'watercolor-beige', 'watercolor-blue', 'watercolor-sky']), placement? (print size/position, one of ['portrait_extended', 'square_center', 'chest_small']), model? (nb2 default | gpt-image-2 — both 1 credit, different styles), image_url? (https link to the user's OWN image — used as style/subject reference), preserve? (true = print the user's image exactly as-is, no AI redraw — kids' drawings, own art; FREE, no credits; requires image_url). Returns print_id — poll get_studio_status until done.",
          "inputSchema": {
            "properties": {
              "background": {
                "description": "T-shirt background choice (see get_studio_options backgrounds).",
                "type": "string"
              },
              "image_url": {
                "description": "https link to the user's OWN image, used as style/subject reference.",
                "type": "string"
              },
              "model": {
                "description": "Generation engine: nb2 (default) or gpt-image-2 — both 1 credit.",
                "type": "string"
              },
              "placement": {
                "description": "Print size/position: portrait_extended (default), square_center or chest_small.",
                "type": "string"
              },
              "preserve": {
                "description": "true = print the image exactly as-is, no AI redraw (free); requires image_url.",
                "type": "boolean"
              },
              "product": {
                "description": "Studio product base from get_studio_options (default mens_oversize_tshirt).",
                "type": "string"
              },
              "prompt": {
                "description": "Text description of the design to generate.",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "balance_after": {
                "description": "Credits left after this generation.",
                "type": "number"
              },
              "balance_before": {
                "type": "number"
              },
              "cost_credits": {
                "description": "Credits spent on this generation.",
                "type": "number"
              },
              "detail": {
                "type": "string"
              },
              "error": {
                "description": "e.g. not enough Studio credits, daily limit reached, invalid product.",
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "print_id": {
                "description": "Generation id — poll get_studio_status with it.",
                "type": "string"
              },
              "signup_bonus": {
                "type": "number"
              },
              "status": {
                "type": "string"
              },
              "studio_account_created": {
                "description": "Present when a Studio account was auto-created for the user.",
                "type": "boolean"
              },
              "tell_user": {
                "description": "Say this to the account owner — what was spent from their balance and what is left.",
                "type": "string"
              },
              "topup_url": {
                "description": "Where the user can buy credits (present on 'not enough credits').",
                "type": "string"
              }
            },
            "type": "object"
          },
