        {
          "name": "search_products",
          "title": "Search catalog",
          "description": "Search the allover.art catalog; returns one card per design (good_id, code, price, url) plus the total match count. Use it for any 'find me a …' request — list_collections is for curated themed pages, get_product for one card's sizes and fabrics. Filters combine: query is free text ('cat', 'neon koi'); theme is a canonical theme (Cats, Anime, Skulls; comma-separate several); style should follow the shopper's saved fit from get_user_prefs (basic → tee, oversized → oversized); max_price is USD. Ranked by relevance with a query, by best-sellers without. No paging: you get the top `limit` (default 24, max 48), so narrow the filters to reach the rest. Adult-only designs are excluded; an unknown color or style returns an error listing the valid values.",
          "inputSchema": {
            "properties": {
              "color": {
                "description": "Main color of the print.",
                "enum": ["Black", "Grey", "White", "Navy", "Beige", "Turquoise", "Pink", "Brown", "Red", "Purple", "Olive", "Blue", "Green", "Yellow", "Orange", "Burgundy", "Multicolor"],
                "type": "string"
              },
              "limit": {
                "description": "Max cards to return (default 24, max 48).",
                "type": "integer"
              },
              "max_price": {
                "description": "Only items priced at or below this amount, USD.",
                "type": "number"
              },
              "query": {
                "description": "Free-text search, e.g. 'cat' or 'neon koi'.",
                "type": "string"
              },
              "section": {
                "description": "Catalog section.",
                "enum": ["mens", "womens", "kids"],
                "type": "string"
              },
              "style": {
                "description": "Garment cut: tee, oversized, sleeveless (men's oversized tee without sleeves), cropped (girls' cropped tee), bodysuit (baby bodysuit, 56-80 cm), long_sleeve, oversized_long_sleeve, hoodie (men's, women's and kids' French terry hoodie, on part of the designs) or oversized_hoodie (men's and women's French terry oversized hoodie, on part of the designs).",
                "enum": ["tee", "oversized", "sleeveless", "cropped", "bodysuit", "long_sleeve", "oversized_long_sleeve", "oversized_hoodie", "hoodie"],
                "type": "string"
