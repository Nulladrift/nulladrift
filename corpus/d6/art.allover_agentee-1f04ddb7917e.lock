        {
          "name": "apply_promo",
          "title": "Apply promo code",
          "description": "Validate a promo code the human gave you and attach it to the cart. Returns applied=true with the new subtotal, discount, shipping and total, or applied=false with a reason — an invalid or expired code, or a bundle price in the cart that beats it (codes don't stack with bundle pricing). Codes are case-insensitive and a cart holds one: a valid new code replaces the current one, a rejected one leaves it in place; remove_promo just drops it. Needs at least one item in the cart. Never guess or try codes the human didn't give. The code is re-checked in get_order_preview and prepare_order.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Promo code exactly as the human gave it (case-insensitive).",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "applied": {
                "type": "boolean"
              },
              "bundle": {
                "description": "Bundle price that beats the code (when applied=false for that reason).",
                "type": "string"
              },
              "code": {
                "description": "Normalized promo code (when applied).",
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "discount": {
                "type": "number"
              },
              "error": {
                "description": "Present when the cart is empty or code is missing.",
                "type": "string"
              },
              "reason": {
                "description": "Why the code was rejected (when applied=false).",
                "type": "string"
              },
              "shipping": {
                "type": "number"
              },
              "subtotal": {
                "type": "number"
              },
              "total": {
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Apply promo code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
