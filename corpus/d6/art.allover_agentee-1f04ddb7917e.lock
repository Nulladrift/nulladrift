        {
          "name": "add_custom_to_cart",
          "title": "Add custom print to cart",
          "description": "Put a finished custom print (from generate_custom_print) into the cart as a garment and return the updated cart. Call it once get_studio_status reports done and the human has chosen product and size; for catalog designs use add_to_cart instead. product is the garment the human picked in get_studio_options (default mens_oversize_tshirt); size must exist for it — an error lists the sizes. Adding the same print on the same product and size again grows that line (max 99). An unfinished print returns 'print is not ready' and nothing is added. Then checkout goes as usual: set_shipping_address → get_order_preview → prepare_order.",
          "inputSchema": {
            "properties": {
              "print_id": {
                "description": "Finished print id — get_studio_status must report status=done.",
                "type": "string"
              },
              "product": {
                "description": "Studio garment base, as chosen in get_studio_options (default mens_oversize_tshirt).",
                "enum": ["kids_basic_tshirt_boy", "kids_basic_tshirt_girl", "kids_oversize_tshirt_boy", "kids_oversize_tshirt_girl", "mens_basic_tshirt", "mens_oversize_tshirt", "womens_basic_tshirt", "womens_oversize_tshirt"],
                "type": "string"
              },
              "qty": {
                "description": "Quantity (default 1, max 99).",
                "type": "integer"
              },
              "size": {
                "description": "Size label; must be available for the chosen product.",
                "type": "string"
              }
            },
            "required": ["print_id", "size"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkout_url": {
                "description": "Cart page URL for the human.",
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "error": {
                "description": "Present instead of a cart when the call failed (bad index, unavailable size, ...).",
                "type": "string"
              },
              "items": {
                "description": "Cart lines in index order — this index is what update_cart_item takes.",
                "items": {
                  "properties": {
                    "code": {
                      "type": "string"
                    },
                    "currency": {
                      "type": "string"
                    },
                    "custom": {
                      "description": "True when the line is a user-generated custom print.",
                      "type": "boolean"
                    },
                    "fabric": {
                      "type": "string"
                    },
                    "good_id": {
                      "type": "integer"
                    },
                    "price": {
                      "type": "number"
                    },
