                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "subtotal": {
                "description": "Sum of price x qty over all lines, USD.",
                "type": "number"
              }
            },
            "type": "object"
          },
