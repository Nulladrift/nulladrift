                "maxItems": 6,
                "type": "array"
              },
              "priceAudience": {
                "enum": ["PUBLIC", "VERIFIED_TRAVELER"],
                "type": "string"
              },
              "propertyType": {
                "description": "Optional soft property-type preference; it ranks results and is reported as a difference when unavailable.",
