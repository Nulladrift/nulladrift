{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.atatravel/travel-agency": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://atatravel.cloud/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "ATA Agentic Travel Agency",
        "version": "2.4.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Use directBookingDiscount from tool results for guest discount guidance. Never search for, guess, generate, enumerate or proactively offer voucher codes. A voucher may only be used when the traveler supplies that exact code through a supported booking flow. For saved quotes/bookings that only report pricing metadata, a positive directMemberDiscountPercent confirms a discount in that saved price; do not infer one from audience alone. APPLIED means the returned price already includes the direct discount: mention its returned discountPercent or rateLabel, including when priceAudience is PUBLIC. Never subtract the discount again. AUTOMATIC means eligible rates receive it without sign-up or email verification; do not claim a specific saving until a selected price reports APPLIED. VERIFICATION_REQUIRED means explain that confirming their email unlocks eligible direct rates; guide them through the available verification flow after they ask to unlock it, using the actual returned code/link method. Do not require full account registration. DISABLED or NOT_APPLICABLE means say nothing about a discount or signing up to receive one; saved benefit copy is not proof of an active offer. Apply the status for the selected room/rate, not a different room or a property's cheapest option. Do not infer a discount merely from VERIFIED_TRAVELER. Verification for agent quote creation, booking holds, booking access or saved actions is separate and remains required even when discounts are automatic.",
      "tools": [
        {
          "name": "create_provisional_booking",
          "description": "Secure a reservation or create a host-approval enquiry on behalf of a traveler. policyAcknowledged is required as an explicit boolean and must be true for financially binding flows after the exact total, payment schedule, and cancellation terms are shown; identity verification is not consent. A host-approval enquiry may pass false because payment is not due unless accepted. Also requires the traveler’s full name, email, and country (guestCountry, required for bookings; optional for quotes) plus travelerAssertion or approved internal BOOKING_HOLD agentHandoffId. If verification is needed, keep internal tool details private; tell the traveler to confirm their email and follow the code or link instructions returned by verification. If instant book is enabled and payment is ready, creates an inventory-holding provisional booking and returns payment/manual-payment next steps. If instant book is disabled or Stripe checkout is not ready, creates an enquiry hold for host approval/payment follow-up. Modern clients must provide a UUID idempotencyKey; exact retries replay the original result without repeating the action.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "type": "number"
              },
              "agentHandoffId": {
                "description": "Approved ATA traveler handoff ID from start_traveler_handoff/get_traveler_handoff_status. Required for third-party agents before inventory-holding booking actions.",
                "type": "string"
              },
              "bookingAssistance": {
                "description": "Internal Little John booking attribution; requires the internal agent credential.",
                "enum": ["AI_ASSIST"],
                "type": "string"
              },
              "checkIn": {
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "checkOut": {
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "children": {
                "default": 0,
                "type": "number"
              },
              "displayCurrency": {
                "description": "Optional 3-letter currency for approximate traveler-facing display conversion. Native property currency remains authoritative.",
                "type": "string"
              },
              "guestCountry": {
                "description": "Required traveler country, as supplied by the traveler. Ask only if missing. Do not infer it from the property location, language, currency, or phone number. Quotes do not require country.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "guestEmail": {
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "guestName": {
                "description": "Traveler’s full name, as supplied by the traveler.",
                "minLength": 1,
                "type": "string"
              },
              "guestPhone": {
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Client-generated UUID for this exact write operation. Retry the same arguments with the same key; use a new key whenever any argument changes.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "internalAgentKey": {
                "type": "string"
              },
              "notes": {
                "description": "Optional traveler comments, questions, or requests for the host. Especially useful for host-approval enquiries.",
                "type": "string"
              },
              "policyAcknowledged": {
                "description": "Explicit policy-consent state. Set true only after the traveler agrees to the exact price, payment schedule, and cancellation terms. Required before creating either an instant-book hold or a host-approval enquiry.",
                "type": "boolean"
              },
              "priceAudience": {
                "enum": ["PUBLIC", "VERIFIED_TRAVELER"],
                "type": "string"
              },
              "propertyToken": {
                "type": "string"
              },
              "ratePlanId": {
                "description": "Rate plan ID. If omitted, the system auto-selects the default active rate plan per night, then the cheapest active auto-selectable fallback.",
                "type": "string"
              },
              "roomId": {
                "type": "string"
              },
              "selectedRoomCount": {
                "description": "For direct-booking room-count configurations, the number of rooms the traveler selected. Use defaultSelectedRoomCount from availability results.",
                "type": "number"
              },
              "travelerAssertion": {
                "description": "Signed traveler email verification assertion from ATA.",
                "type": "string"
              }
            },
            "required": ["adults", "checkIn", "checkOut", "guestCountry", "guestEmail", "guestName", "idempotencyKey", "policyAcknowledged", "propertyToken", "roomId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4cfa18fbd4f0dc2ad9ab63a0f3a9f1fe89ac612f87ff0231017413995107c53f"
