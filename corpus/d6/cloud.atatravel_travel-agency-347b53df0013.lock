        {
          "name": "start_traveler_handoff",
          "description": "Internal approval step for quote or booking tools. Before calling, read guestEmail back to the traveler and confirm it is correct; then set emailConfirmedByTraveler=true. If an email is sent, tell the traveler only to check their inbox and click the secure ATA link. Do not mention handoffs/tool details to the traveler. Modern clients must provide a UUID idempotencyKey; exact retries replay the original result without repeating the action.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "action": {
                "description": "Use BOOKING_HOLD before creating a reservation; BOOKING_READ grants only read access to an existing booking for questions.",
                "enum": ["QUOTE", "BOOKING_HOLD", "BOOKING_READ"],
                "type": "string"
              },
              "adults": {
                "type": "number"
              },
              "agentName": {
                "description": "Agent/application display name when known.",
                "type": "string"
              },
              "agentProvider": {
                "description": "Agent platform or provider name when known.",
                "type": "string"
              },
              "checkIn": {
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "checkOut": {
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "children": {
                "default": 0,
                "type": "number"
              },
              "confirmationCode": {
                "description": "Required for BOOKING_READ: the ATA confirmation code printed on the booking confirmation.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "emailConfirmedByTraveler": {
                "description": "Set true only after reading guestEmail back to the traveler and they confirm it is correct.",
                "type": "boolean"
              },
              "guestEmail": {
                "description": "Traveler-provided email address for the action-specific ATA verification link.",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "guestName": {
                "description": "Traveler name collected by the agent.",
                "type": "string"
              },
              "guestPhone": {
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Client-generated UUID for this exact write operation. Retry the same arguments with the same key; use a new key whenever any argument changes.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              },
              "intentSummary": {
                "description": "Short traveler-facing summary of what ATA is verifying, without mentioning internal handoff/tool details.",
                "type": "string"
              },
              "mcpSessionId": {
                "description": "Optional client-side MCP/session correlation ID.",
                "type": "string"
              },
              "propertyToken": {
                "type": "string"
              },
              "quoteHash": {
                "type": "string"
              },
              "quoteId": {
                "type": "string"
              },
              "ratePlanId": {
                "type": "string"
