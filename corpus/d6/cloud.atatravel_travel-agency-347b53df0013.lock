        {
          "name": "get_booking_details",
          "description": "Read an existing booking by its ATA confirmation code returned by a successful booking or supplied by the traveler. Never invent a code. Requires a current signed ATA traveler assertion, a verified legacy MCP session, or an approved BOOKING_READ handoff with matching booking email and code. For stateless third-party clients, use start_traveler_handoff with action BOOKING_READ and confirmationCode, then poll get_traveler_handoff_status. Returns booked stay, prices, payments and cancellation terms. Cannot modify, cancel, pay, or create inventory holds. Never use a confirmation code as holdId in get_reservation_status.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agentHandoffId": {
                "description": "Approved BOOKING_READ handoff for this confirmation code. No write scope is accepted.",
                "type": "string"
              },
              "confirmationCode": {
                "description": "ATA confirmation code from the booking email.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "propertyToken": {
                "description": "Known property public token; required to match a property-scoped connection.",
                "type": "string"
              },
              "travelerAssertion": {
                "description": "Current signed ATA traveler verification assertion; never a typed email or model claim.",
                "type": "string"
              }
            },
            "required": ["confirmationCode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
