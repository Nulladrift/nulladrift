        {
          "name": "search_network_availability",
          "description": "Find accommodations across the ATA Travel Network with real-time pricing. Use when dates are known. Supports filtering by amenities, views, property type, and free-text keyword to handle vague requests.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "adults": {
                "default": 1,
                "description": "Number of adults",
                "type": "number"
              },
              "amenities": {
                "description": "Filter by amenities on property or rooms. e.g. ['Pool', 'Gym', 'Pet Friendly', 'Spa']",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "budget": {
                "additionalProperties": false,
                "description": "Optional additional budget constraint. Clarify missing currency or basis before calling. Do not combine with legacy maxPrice/maxPriceCurrency.",
                "properties": {
                  "amount": {
                    "description": "Maximum amount in the explicitly supplied currency and basis.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  },
                  "basis": {
                    "description": "Required explicit basis. Per-night means a stay-average allowance, not a ceiling on each night. Per-person means every adult and child equally; clarify other interpretations.",
                    "enum": ["TOTAL_STAY", "PER_NIGHT", "PER_PERSON_STAY", "PER_PERSON_PER_NIGHT"],
                    "type": "string"
                  },
                  "currency": {
                    "description": "Required 3-letter budget currency. Never infer from location or displayCurrency.",
                    "pattern": "^[A-Za-z]{3}$",
                    "type": "string"
                  },
                  "scope": {
                    "default": "PRICED_STAY",
                    "description": "PRICED_STAY compares the accommodation total including configured taxes/fees. ALL_IN requires complete mandatory charges; currently ATA cannot verify completeness and will return labeled alternatives only.",
                    "enum": ["PRICED_STAY", "ALL_IN"],
                    "type": "string"
                  }
                },
                "required": ["amount", "basis", "currency"],
                "type": "object"
              },
              "checkIn": {
                "description": "Check-in date (YYYY-MM-DD)",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "checkOut": {
                "description": "Check-out date (YYYY-MM-DD)",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Number of children",
                "type": "number"
              },
              "displayCurrency": {
                "description": "Optional 3-letter currency for approximate traveler-facing display conversion. Native property currency remains authoritative.",
                "type": "string"
              },
              "internalAgentKey": {
                "type": "string"
              },
              "keyword": {
                "description": "Text matched against property name/description. Use for a required text match; use preferences for optional style preferences.",
                "type": "string"
              },
              "location": {
                "description": "Optional city, state, or country. Omit when the traveler knows dates but is open to ATA's current destinations.",
                "type": "string"
              },
              "maxPrice": {
                "description": "Maximum total price filter",
                "type": "number"
              },
              "maxPriceCurrency": {
                "description": "Currency for maxPrice when filtering across mixed property currencies. If omitted, maxPrice is compared to each property's native currency.",
                "type": "string"
              },
              "preferences": {
                "description": "Open-ended soft ranking signals. These do not exclude otherwise valid stays.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "priceAudience": {
                "enum": ["PUBLIC", "VERIFIED_TRAVELER"],
                "type": "string"
              },
              "propertyType": {
                "description": "e.g. 'Hotel', 'Apartment', 'Villa'",
                "type": "string"
              },
              "views": {
                "description": "Filter by room views. e.g. ['Ocean', 'Mountain', 'Garden', 'City']",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["checkIn", "checkOut"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
