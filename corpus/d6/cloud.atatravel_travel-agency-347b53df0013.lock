        {
          "name": "search_flexible_network_availability",
          "description": "Search participating ATA properties for availability and prices across a flexible date window. Defaults to a window 28–56 days from today, three nights, and two adults only when those values are missing; always return those defaults as explicit assumptions. Preferences are soft ranking signals, not a closed taxonomy.",
