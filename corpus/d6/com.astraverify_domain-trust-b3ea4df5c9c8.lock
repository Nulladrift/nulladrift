        {
          "name": "get_report",
          "title": "Domain Trust report (both scores)",
          "description": "Both AstraVerify scores for a domain, plus a shareable report link. Reach for this first on any broad question - \"is my domain set up right?\", \"check my domain\", \"what should I fix first?\" - and use the single-subject tools only once the person has narrowed it to email or to the website. Input: a bare domain like example.com. Returns the Email Security score, the Discoverability score, every open fix ranked critical then important then informational, and report_url. Work down that order. Some findings are marked as needing no action - a weak key the provider generates and the owner cannot replace, for instance - so do not present those as work. Unlike the other tools here, this one creates something: report_url is a snapshot of these findings saved to a new unlisted page at astraverify.com/r/..., and that page is what the person can send to whoever administers the domain. It opens later without rescanning, after the scan itself has aged out. Running the tool again on an unchanged scan returns the same page rather than a second one. Nothing is written anywhere the person owns. Set include_history to answer \"has this improved?\" or \"did my fix land?\": it adds the first and latest reading of each score, the move between them, and only the dates the score actually changed. A domain we have not watched before says so rather than reporting a flat line.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The domain to check, as the person gave it (no scheme, no path). Reserved names such as example.com are refused.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              },
              "include_history": {
                "description": "Also return how these scores have moved over time, and when",
                "type": "boolean"
              },
