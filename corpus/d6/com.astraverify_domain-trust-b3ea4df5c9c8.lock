        {
          "name": "fetch_as_crawler",
          "title": "Fetch the root page as a named crawler",
          "description": "Show exactly what one named crawler receives from the domain's root page. Use when the person asks \"what does Google see?\" or \"can ChatGPT read my site?\", and whenever check_discoverability reports a crawl-access problem. check_discoverability scores crawl access across all six crawlers; this returns the one raw response behind that score, which is what explains such a result rather than restating it. robots.txt can read perfectly while a CDN or firewall returns 403 to one crawler and 200 to another, and only a real fetch shows that. Inputs: domain (bare, like example.com) and agent, exactly one of googlebot, bingbot, oai-searchbot, perplexitybot, claudebot, gptbot. Call it once per crawler to compare them. Returns the HTTP status, the full redirect chain, response headers, content type, the text that crawler would index, and flags for an outright block or a bot-challenge page - which is how cloaking becomes visible. One live fetch of the root page, nothing else, and it changes nothing.",
          "inputSchema": {
            "properties": {
              "agent": {
                "enum": ["googlebot", "bingbot", "oai-searchbot", "perplexitybot", "claudebot", "gptbot"],
                "type": "string"
              },
              "domain": {
                "description": "The domain to check, as the person gave it (no scheme, no path). Reserved names such as example.com are refused.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["agent", "domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "agent": {
                "type": "string"
              },
              "blocked": {
                "description": "The response refused the crawler (403, 429 or similar)",
                "type": "boolean"
              },
              "chain": {
                "description": "Redirect hops",
                "items": {
                  "properties": {
                    "status": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "challenge": {
                "description": "A bot-challenge page rather than the site",
                "type": "boolean"
              },
              "content_type": {
                "type": ["string", "null"]
              },
              "domain": {
                "type": "string"
              },
              "error": {
                "type": ["string", "null"]
              },
              "extract": {
                "description": "The text this crawler would index; null when the fetch failed",
                "type": ["string", "null"]
              },
              "final_url": {
                "type": ["string", "null"]
              },
              "headers": {
                "additionalProperties": {
                  "type": "string"
                },
                "type": "object"
              },
              "label": {
                "description": "The crawler as its operator names it",
                "type": "string"
              },
              "ms": {
                "type": "integer"
              },
              "request_id": {
                "description": "req_... for this call. Quote it when reporting a problem with the result.",
                "type": "string"
              },
              "status": {
                "description": "HTTP status the crawler received",
                "type": ["integer", "null"]
              },
              "title": {
                "type": ["string", "null"]
              }
            },
            "required": ["agent", "domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Fetch the root page as a named crawler"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
