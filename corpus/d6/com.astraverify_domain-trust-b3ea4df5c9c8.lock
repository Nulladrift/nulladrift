      "instructions": "AstraVerify checks a domain's trust: email security (MX, SPF, DKIM, DMARC) and discoverability (robots.txt, sitemap, redirects, metadata, structured data, llms.txt, and whether Googlebot, Bingbot, GPTBot, ClaudeBot and PerplexityBot actually receive the page). Scores are out of 100 with exact fixes. Results are cached for 15 minutes; pass refresh=true only when the user says they changed something. Always show the shareable link so the user can see the full report.",
      "tools": [
        {
          "name": "check_discoverability",
          "title": "Check discoverability (search and AI crawler readiness)",
          "description": "Check whether search engines and AI assistants can crawl, read and quote this site. Use when the person asks about SEO basics, robots.txt, sitemaps, llms.txt, or whether Google, ChatGPT, Claude or Perplexity can see their site. Input: a bare domain like example.com. Returns a Discoverability score 0-100 broken into crawl access (25: robots.txt, plus what the edge actually serves to Googlebot, Bingbot, OAI-SearchBot, PerplexityBot, ClaudeBot and GPTBot), site plumbing (20: HTTPS, one canonical host, sitemap, real 404s), page metadata (20), structured data (20) and answer-engine readiness (15: llms.txt, a definitional opening, question-form headings). Every finding carries the exact file, tag or record to publish. It makes roughly 15 fetches over a few seconds - robots.txt, the sitemap, the root page, up to four pages listed in the sitemap, llms.txt, the preview image, one deliberately missing URL to see how 404s are handled, and the root page once as each of the six crawlers. It identifies itself as AstraVerifyBot, except on those six checks, where the point is to send the crawler's own user-agent. It fetches nothing off that domain and crawls no further. Cached 15 minutes. It changes nothing on the site. This is a separate scan from check_email_security and does not include it. It scores crawl access across all six crawlers at once; for the exact response a single named crawler receives - status, redirect chain, headers, the text it would index - use fetch_as_crawler.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "The domain to check, as the person gave it (no scheme, no path). Reserved names such as example.com are refused.",
                "maxLength": 253,
                "minLength": 3,
                "type": "string"
