{
  "lockfileVersion": 2,
  "subjects": {
    "cards.dev/components": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://dev.cards/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dev-cards",
        "title": "Dev.cards",
        "version": "1.0.0",
        "websiteUrl": "https://dev.cards/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Dev.cards is a free library of original, reviewed UI components (heroes, pricing tables, dashboards, forms and more). Every component ships as complete source in two forms: vanilla HTML/CSS/JS and React 19 + TypeScript, styled with plain scoped CSS. Use search_components to find one, get_component for its design brief and targets, and get_component_code for the complete files. Each component has a live preview at https://dev.cards/components/{id}.",
      "tools": [
        {
          "name": "get_component",
          "title": "Get a UI component",
          "description": "Get metadata, the design specification, source references and the available implementations of one component by id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Component id from search_components.",
                "maxLength": 100,
                "type": "string"
              },
              "version": {
                "description": "Concrete version or latest.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a UI component"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dbbcf5e131cf73fc6bd2cd6a516a46b2c2f40a00e7ee8b923941756efa462886"
        },
        {
          "name": "get_component_code",
          "title": "Get UI component source code",
          "description": "Get the complete, pre-generated source files of one component for one tested target, with their SHA-256 hashes, setup instructions and pinned dependencies. Vanilla is javascript; React is typescript. Styling is always css.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "framework": {
                "enum": ["vanilla", "react"],
                "type": "string"
              },
              "id": {
                "description": "Component id from search_components.",
                "maxLength": 100,
                "type": "string"
              },
              "language": {
                "enum": ["javascript", "typescript"],
                "type": "string"
              },
              "styling": {
                "enum": ["css"],
                "type": "string"
              },
              "version": {
                "description": "Concrete version or latest.",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["framework", "id", "language", "styling"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get UI component source code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:51c9a7b820b8baa65a4541a13ea4e7c7218419abb7890d93267d33359cb6503f"
        },
        {
          "name": "search_components",
          "title": "Search UI components",
          "description": "Search the published Dev.cards UI components (hero sections, pricing tables, dashboards, forms, navigation and more) by text and implementation target. Returns compact metadata: id, version, name, category, description and targets. Leave q empty to list every component.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "framework": {
                "description": "Required implementation target.",
                "enum": ["vanilla", "react"],
                "type": "string"
              },
              "q": {
                "description": "Text in component id, name, description, category or design brief, e.g. \"pricing\" or \"dashboard\".",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search UI components"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0c92f598bb2aba22a3b463531ab2fb33cff05966da4acc8296d8e9b734edfd06"
        }
      ],
      "digest": "sha256:98c872abe535027ceb5827c465be89965863084781e61751ac573a84ffd154f4"
    }
  }
}
