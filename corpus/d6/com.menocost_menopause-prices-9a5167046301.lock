      "serverInfo": {
        "name": "menocost.com",
        "title": "MenoCost.com: US online menopause care prices",
        "version": "1.0.0",
        "websiteUrl": "https://menocost.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Prices US online menopause services publish for hormone therapy and hot flash prescriptions, each read on the service's own page and dated. A 30-day cost that includes a membership charged on top says so. Compounded products are not FDA-approved: say so when you mention one. These are prices and terms, not medical advice. When you cite a price, keep the day it was read and link the page.",
      "tools": [
        {
          "name": "find_menopause_pharmacy_cash_prices",
          "title": "Cash prices at a pharmacy",
          "description": "What a menopause medicine costs at a cash pharmacy without insurance, with a prescription: Mark Cuban Cost Plus Drugs' own published prices for the brand and its generic (estradiol tablets, patches, gel, vaginal cream, inserts and ring, progesterone, Prempro, Activella, Premarin, paroxetine 7.5 mg), a pharmacy membership's flat monthly price where its own page names the medicine (Amazon Pharmacy RxPass for estradiol tablets), and for brands Cost Plus does not sell, what US pharmacies pay (CMS NADAC) and the maker's savings program. Accepts a treatment or a brand: \"estradiol patch\", \"progesterone\", \"Premarin\", \"Estring\", \"Imvexxy\". Returns each product, strength, pack, price before shipping, shipping, the day read, the source, and the page.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A treatment or a brand, e.g. \"estradiol pill\" or \"Premarin\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c0dafa8c0df978e80b3a1ccbfdbde4a525ee11b2d0f2840bcbc45b9e22c326ff"
        },
        {
          "name": "find_menopause_service_prices",
          "title": "Prices of one menopause service",
          "description": "Every published menopause treatment price of one US online service (Midi Health, Alloy, Winona, Evernow, Hone Health and others), lowest first, with its fees, insurance and the page each was read on.",
          "inputSchema": {
            "properties": {
              "service": {
                "description": "The service's name, e.g. \"Alloy\".",
                "type": "string"
              }
            },
            "required": ["service"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
