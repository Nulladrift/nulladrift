          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "tz": {
                "maxLength": 100,
                "type": "string"
              },
              "venues": {
                "items": {
                  "maxLength": 100,
