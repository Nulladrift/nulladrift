      "serverInfo": {
        "name": "itsninethere",
        "title": "ItsNineThere",
        "version": "1.0.0",
        "description": "Public read-only world clock and meeting planner. Every result links to itsninethere.com.",
        "websiteUrl": "https://itsninethere.com/apps/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "convert_time",
          "title": "Convert time",
          "description": "Convert a local time from one place to one or more places, including DST-safe dates.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "from_place": {
                "maxLength": 200,
                "type": "string"
              },
              "time": {
                "maxLength": 200,
                "type": "string"
              },
              "to_places": {
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["from_place", "time", "to_places"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "ambiguous": {
                "type": "boolean"
              },
              "source_time": {
                "type": "string"
              },
              "targets": {
                "items": {},
                "type": "array"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["ambiguous", "source_time", "targets", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c6b2a29e8f0ed1a4901a0d61c90b6c952635c987931ec3ddd1809354f7514f14"
        },
        {
          "name": "find_meeting_times",
          "title": "Find meeting times",
          "description": "Find shared working-hour windows across cities using the same availability logic as ItsNineThere team boards.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "days_ahead": {
                "maximum": 14,
                "minimum": 0,
                "type": "integer"
              },
              "duration_minutes": {
                "maximum": 480,
                "minimum": 15,
                "type": "integer"
              },
              "places": {
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 2,
                "type": "array"
              },
              "work_end": {
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "work_start": {
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              }
            },
            "required": ["places"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "best_slot": {
                "anyOf": [
                  {},
                  {
                    "type": "null"
                  }
                ]
              },
              "date": {
                "type": "string"
              },
              "next_shared_date": {
                "type": ["string", "null"]
              },
              "overlap_windows": {
                "items": {},
                "type": "array"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["best_slot", "date", "next_shared_date", "overlap_windows", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ada142059a1f0b3f8f953aa7e118824e0a1db226ee2c7329f6a61ee2cbd1ac95"
        },
        {
