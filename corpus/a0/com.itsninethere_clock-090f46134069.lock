          "title": "Get market hours",
          "description": "Stock exchange, forex session, futures and crypto market sessions with DST, holidays and early closes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "tz": {
                "maxLength": 100,
                "type": "string"
              },
              "venues": {
                "items": {
                  "maxLength": 100,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "answer_text": {
                "type": "string"
              },
              "date": {
                "type": "string"
              },
              "timezone": {
                "type": "string"
              },
              "venues": {
                "items": {},
                "type": "array"
              }
            },
            "required": ["date", "timezone", "venues"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
