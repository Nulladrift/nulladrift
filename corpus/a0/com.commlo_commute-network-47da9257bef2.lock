{
  "lockfileVersion": 2,
  "subjects": {
    "com.commlo/commute-network": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://public.commlo.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "commlo-commute-network",
        "title": "Commlo commute network",
        "version": "1.3.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Commlo gives the commute to downtown for residential addresses and rail stations in the US metro areas it covers: the drive (without traffic) or walk to a station, a station buffer and the scheduled train to a downtown terminal, for one service date. Ask about any US home address; an address outside coverage returns the covered areas. window_id works only where the region supports it; arrive_by and depart_after work everywhere. The address is one the user names (for example a home they are considering), never the device's location.",
      "tools": [
        {
          "name": "commute_lookup",
          "title": "Commute lookup",
          "description": "Commute to downtown from a residential address the user names (a home they are considering, never the device's location) on one service date: drive (without traffic) or walk to a rail station, a station buffer and the scheduled train. Any US home address; one outside coverage returns the covered areas. window_id only where supported. Up to 5 options, nearest first, with sources and methodology.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "One address selector. Exactly one of window_id, arrive_by, or depart_after. arrive_by and depart_after accept a clock time on the service date (H:MM, HH:MM, or HH:MM:SS, local time in the region of the address or station) or an RFC 3339 date-time with an offset (for example 09:00, 2026-11-12T09:00:00-06:00, or 2026-11-12T15:00:00Z). An omitted direction follows the window (outbound_pm and outbound_offpeak are outbound; other windows and requested times stay inbound). An outbound requested time searches every downtown terminal unless terminal_id is set.",
            "properties": {
              "address_id": {
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$",
                "type": "string"
              },
              "address_text": {
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "arrive_by": {
                "description": "A clock time on the service date (H:MM, HH:MM, or HH:MM:SS, local time in the region of the address or station) or an RFC 3339 date-time with an offset, for example 09:00, 2026-11-12T09:00:00-06:00, or 2026-11-12T15:00:00Z.",
                "minLength": 4,
                "type": "string"
              },
              "buffer_seconds": {
                "default": 300,
                "maximum": 1800,
                "minimum": 0,
                "type": "integer"
              },
              "components": {
                "additionalProperties": false,
                "properties": {
                  "building_designator": {
                    "anyOf": [
                      {
                        "maxLength": 32,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "building_value": {
                    "anyOf": [
                      {
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "floor": {
                    "anyOf": [
                      {
                        "maxLength": 32,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "house_number": {
                    "maxLength": 64,
                    "minLength": 1,
                    "type": "string"
                  },
                  "postal_city": {
                    "anyOf": [
                      {
                        "maxLength": 100,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "postal_code": {
                    "anyOf": [
                      {
                        "pattern": "^\\d{5}(?:-\\d{4})?$",
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "state": {
                    "enum": ["AK", "AL", "AR", "AS", "AZ", "CA", "CO", "CT", "DC", "DE", "FL", "GA", "GU", "HI", "IA", "ID", "IL", "IN", "KS", "KY", "LA", "MA", "MD", "ME", "MI", "MN", "MO", "MP", "MS", "MT", "NC", "ND", "NE", "NH", "NJ", "NM", "NV", "NY", "OH", "OK", "OR", "PA", "PR", "RI", "SC", "SD", "TN", "TX", "UT", "VA", "VI", "VT", "WA", "WI", "WV", "WY"],
                    "type": "string"
                  },
                  "street_name": {
                    "maxLength": 160,
                    "minLength": 1,
                    "type": "string"
                  },
                  "street_postdirectional": {
                    "anyOf": [
                      {
                        "maxLength": 16,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "street_predirectional": {
                    "anyOf": [
                      {
                        "maxLength": 16,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "street_suffix": {
                    "anyOf": [
                      {
                        "maxLength": 32,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "unit_designator": {
                    "anyOf": [
                      {
                        "maxLength": 32,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "unit_value": {
                    "anyOf": [
                      {
                        "maxLength": 64,
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  }
                },
                "required": ["building_designator", "building_value", "floor", "house_number", "postal_city", "postal_code", "state", "street_name", "street_postdirectional", "street_predirectional", "street_suffix", "unit_designator", "unit_value"],
                "type": "object"
              },
              "context": {
                "additionalProperties": false,
                "description": "Optional. Fill only with facts the user volunteered. No names, contact details or chat text.",
                "minProperties": 1,
                "properties": {
                  "intent": {
                    "description": "buy or rent, only if the user said so. Tailors the answer.",
                    "enum": ["buy", "rent"],
                    "type": "string"
                  },
                  "wants_agent_contact": {
                    "description": "True only if the user asked to be connected with a listing agent. Returns the agent's contact when listing contact is enabled.",
                    "type": "boolean"
                  }
                },
                "required": [],
                "type": "object"
              },
              "depart_after": {
                "description": "A clock time on the service date (H:MM, HH:MM, or HH:MM:SS, local time in the region of the address or station) or an RFC 3339 date-time with an offset, for example 09:00, 2026-11-12T09:00:00-06:00, or 2026-11-12T15:00:00Z.",
                "minLength": 4,
                "type": "string"
              },
              "direction": {
                "enum": ["inbound", "outbound"],
                "type": "string"
              },
              "options": {
                "default": 3,
                "description": "How many options to return, from 1 to 5, default 3. The nearest one or two stations are always included, so an answer can hold more options than requested.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "service_date": {
                "format": "date",
                "type": "string"
              },
              "terminal_id": {
                "pattern": "^[A-Z0-9][A-Z0-9_-]{0,63}$",
                "type": "string"
              },
              "window_id": {
                "enum": ["inbound_am", "outbound_pm", "inbound_offpeak", "outbound_offpeak", "weekend_daytime", "early_late"],
                "type": "string"
              }
            },
            "required": ["service_date"],
            "type": "object"
          },
          "outputSchema": {
