          "description": "The same dated commute as commute_lookup for up to 10 US home addresses in one call, for comparing homes. Returns one result per address in request order; an address that cannot be answered (including one outside coverage) gets its own error entry and the others still answer. Each address lists its nearest one or two stations; options adds more.",
