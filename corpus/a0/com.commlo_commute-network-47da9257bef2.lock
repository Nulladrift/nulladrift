        {
          "name": "station_info",
          "title": "Station info",
          "description": "Facts about one Metra station in the Chicago area on one service date, by station ID or name: its routes, the downtown terminals it serves and facility links when known.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Exactly one of station_id or name. At most one of window_id, arrive_by, or depart_after: it limits terminal_services to the downtown terminals served at that time. Without one, terminal_services is the weekday peak (inbound_am, or outbound_pm when direction is outbound) or, on a Saturday or Sunday service_date, weekend_daytime. arrive_by and depart_after accept a clock time on the service date (H:MM, HH:MM, or HH:MM:SS, Chicago local time) or an RFC 3339 date-time with an offset.",
            "properties": {
              "arrive_by": {
                "description": "A clock time on the service date (H:MM, HH:MM, or HH:MM:SS, local time in the region of the address or station) or an RFC 3339 date-time with an offset, for example 09:00, 2026-11-12T09:00:00-06:00, or 2026-11-12T15:00:00Z.",
                "minLength": 4,
                "type": "string"
              },
              "buffer_seconds": {
                "default": 300,
                "maximum": 1800,
                "minimum": 0,
                "type": "integer"
              },
              "context": {
                "additionalProperties": false,
                "description": "Optional. Fill only with facts the user volunteered. No names, contact details or chat text.",
                "minProperties": 1,
                "properties": {
                  "intent": {
                    "description": "buy or rent, only if the user said so. Tailors the answer.",
                    "enum": ["buy", "rent"],
                    "type": "string"
                  },
                  "wants_agent_contact": {
                    "description": "True only if the user asked to be connected with a listing agent. Returns the agent's contact when listing contact is enabled.",
                    "type": "boolean"
                  }
                },
                "required": [],
                "type": "object"
              },
              "depart_after": {
                "description": "A clock time on the service date (H:MM, HH:MM, or HH:MM:SS, local time in the region of the address or station) or an RFC 3339 date-time with an offset, for example 09:00, 2026-11-12T09:00:00-06:00, or 2026-11-12T15:00:00Z.",
                "minLength": 4,
                "type": "string"
              },
              "direction": {
                "enum": ["inbound", "outbound"],
                "type": "string"
              },
              "name": {
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "service_date": {
                "format": "date",
                "type": "string"
              },
              "station_id": {
