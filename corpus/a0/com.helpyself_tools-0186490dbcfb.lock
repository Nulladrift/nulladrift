                "maxItems": 500,
                "minItems": 1,
                "type": "array"
              },
              "trim": {
                "default": true,
                "description": "Fit the SVG viewBox tightly to the ink. False keeps the pad's origin, so empty space above and left of the signature is kept and it sits off-centre when placed.",
