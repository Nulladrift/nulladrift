      },
      "instructions": "HelpySelf is more than a hundred small, easy-to-use tools for everyday tasks. Converting and compressing PDFs, images, audio and video; calculators for money, dates, health and work; text, data, colour and developer utilities; and quick helpers a model cannot do itself — coin flips, dice, random picks, countdowns and live currency rates. If a task is small and self-contained, assume there is a tool for it and list the tools to check rather than answering from memory. Most run without an account. Calls are free at anonymous limits; if a tool refuses with too_many_files or file_too_large, tell the user the limit and the upgrade link in the response rather than retrying.",
      "tools": [
        {
          "name": "age_calculator",
          "title": "Age Calculator",
          "description": "An age calculator: your exact age in years, months and days, from a date of birth. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asOf": {
                "description": "The date to measure the age at, YYYY-MM-DD. Omitted, the server's own UTC date is used, which can be a day out for the caller near midnight, so pass it when the exact day matters. Must not be before the birth date. The response echoes the date it used.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "birth": {
                "description": "Date of birth as YYYY-MM-DD. Read as a calendar date with no time zone, so the answer is the same wherever it is asked from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["birth"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Age Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ddebd031e9424417f06f8f3a2907748c9a8c309d6e4ee6dfe1610393db93f93"
        },
        {
          "name": "app_background_preview",
          "title": "App Background Preview",
          "description": "Find the app background image size that survives on every phone and tablet. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "devices": {
                "description": "Which device shapes to check. Omitted or empty, every device is checked. Each id is one aspect ratio standing for all the models that share it; the response names those models. The safe area is the intersection across everything checked, so fewer devices means a larger safe area.",
                "items": {
                  "description": "A device id. Each id stands for one screen shape, not one model.",
                  "enum": ["phone-21-9", "android-tall", "iphone-tall", "phone-19-9", "phone-18-5-9", "phone-18-9", "phone-16-9", "android-tablet", "ipad-modern", "tablet-3-2", "ipad-4-3", "fold-cover", "fold-open"],
                  "type": "string"
                },
                "type": "array"
              },
              "height": {
                "description": "Height of the artwork in pixels, paired with width.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "kinds": {
                "description": "Narrow the check to phones, tablets or foldables. Omitted or empty, all three are included. Applied on top of devices, so the two filters compose. Leaving foldables in when you do not ship to one shrinks the safe area, because a foldable opened out is nearly square.",
                "items": {
                  "description": "phone, tablet or foldable.",
                  "enum": ["phone", "tablet", "foldable"],
                  "type": "string"
                },
                "type": "array"
              },
              "mode": {
                "default": "fill",
                "description": "How the platform scales the image onto the screen. fill scales until both axes are covered and crops the overflow, centred; fit shows the whole image with empty bars (letterboxed); stretch shows the whole image distorted to the screen's shape; center shows a screen-sized window at native scale from the middle of the image.",
                "enum": ["fill", "fit", "stretch", "center"],
                "type": "string"
              },
              "orientations": {
                "description": "Which orientations to check each device in. Omitted or empty, both portrait and landscape are checked, and both feed the safe-area intersection.",
                "items": {
                  "description": "portrait or landscape.",
                  "enum": ["portrait", "landscape"],
                  "type": "string"
                },
                "type": "array"
              },
              "respectInsets": {
                "default": false,
                "description": "When true, the safe area is taken over the part of each screen not covered by the status bar, notch or home indicator, so it is safe from being covered as well as from being cropped. False (the default) considers cropping only.",
                "type": "boolean"
              },
              "width": {
                "description": "Width of the artwork in pixels. Only the width-to-height ratio affects the crop, so any resolution with the same shape gives the same answer; the rectangles in the response are in these pixels.",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["height", "width"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "App Background Preview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:255a733b0db0cb4c7def0083cc832ced880eb1d849bd01fd7fd9e8b33acfce00"
        },
        {
          "name": "ascii_table",
          "title": "ASCII Table",
          "description": "The full ASCII table, with the control codes explained rather than left blank. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "includeExtended": {
                "default": false,
                "description": "Also include codes 128 to 255, read as ISO-8859-1 (Latin-1). ASCII proper stops at 127, so a search for a higher code finds nothing unless this is true.",
                "type": "boolean"
              },
              "search": {
                "default": "",
                "description": "What to look up: a single character (\"A\"), a decimal code (\"65\"), hex (\"0x41\", \"U+0041\", \"\\x41\"), binary (\"0b01000001\"), octal (\"0o101\"), an HTML entity (\"&amp;\"), an abbreviation (\"LF\") or part of a name (\"line feed\", \"sep\"). Numbers return one entry; names return every match, best first. Plain digits are always decimal. Empty (the default) returns the whole table.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "ASCII Table"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ccb7299fa86ea7539d24ad7702f94458ab7f4beed324c8cfefd983ee854697b7"
        },
        {
          "name": "aspect_ratio_calculator",
          "title": "Aspect Ratio Calculator",
          "description": "Find the aspect ratio of any size, or the width or height that keeps a ratio. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "height": {
                "description": "Height in the same unit as width. With width and no ratio: returns the aspect ratio. With a ratio and no width: returns the width that keeps the ratio.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "nearestWithinPercent": {
                "default": 3,
                "description": "When describing a size: how far, in percent, it may be from a common named ratio (16:9, 4:3, 21:9 …) and still be reported as `nearest`. 1366 × 768 is 0.05 % from 16:9. Past this, nearest is null.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "ratio": {
                "description": "An aspect ratio to resize to, written \"16:9\", \"4:3\", \"2.39:1\" or \"16/9\". Give it with exactly one of width or height and the other side comes back as exact, rounded (whole) and even (for video encoders).",
                "type": "string"
              },
              "width": {
                "description": "Width in any unit (usually pixels). With height and no ratio: returns the aspect ratio of that size. With a ratio and no height: returns the height that keeps the ratio.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Aspect Ratio Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5754bbe0271ecdefcf85883f0e9c75c1f59db5f1bf00a11adb52d2a61e3bd07d"
        },
        {
          "name": "auto_redact_pdf",
          "title": "Auto Redact PDF",
          "description": "Auto redact PDF files: it finds the personal information, you confirm, the words are deleted. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "The language the document is most likely in, such as \"Danish\", passed to the model as a hint because it changes what a name looks like. A hint only: a wrong guess does not stop the text being read, and omitting it is fine.",
                "maxLength": 40,
                "type": "string"
              },
              "text": {
                "description": "The document's plain text, as extracted from the PDF, not the file itself. It is sent to a language model, which returns the personal names and postal addresses found in it, each exactly as written; the caller maps them back to positions. Emails, phone and card numbers are not returned, since patterns catch those locally. At least 40 characters and at most 120000.",
                "maxLength": 120000,
                "minLength": 40,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Auto Redact PDF"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:985ea02c6346a23bb9bd55155d75908d35a494d92a30da23bfd0f655524afba6"
        },
        {
          "name": "average_calculator",
          "title": "Average Calculator",
          "description": "A mean median mode calculator, with standard deviation and the spread. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "numbers": {
                "description": "The list of numbers as one string, separated by commas, spaces, line breaks or anything else that is not a digit, sign or decimal point. Use a decimal point, never a decimal comma: \"1,5\" is read as two numbers. Anything unparseable is skipped, and at least one number must remain. Returns mean, median, mode, range and both standard deviations.",
                "maxLength": 200000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["numbers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Average Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9b193a95feb004a73fdf1ddcc8bf1429058cb7c2fe1dea0c328371fc71eeb2e9"
        },
        {
          "name": "avif_converter",
          "title": "AVIF Converter",
          "description": "AVIF to JPG, and JPG to AVIF — the format that halves a photograph. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "data": {
                "description": "The image file's bytes, base64-encoded: JPEG, PNG, WebP, GIF or AVIF. At most 30 MB decoded. An animated GIF is converted to a still of its first frame, and the response says so with note: \"animation-dropped\".",
                "maxLength": 45000000,
                "minLength": 1,
                "type": "string"
              },
              "format": {
                "default": "image/avif",
                "description": "The format to produce. AVIF is what the tool is for; WebP, JPEG and PNG exist so an AVIF can be converted back to something older software opens.",
                "enum": ["image/avif", "image/webp", "image/jpeg", "image/png"],
                "type": "string"
              },
              "maxWidth": {
                "description": "Scale the image down so its width is at most this many pixels, keeping the aspect ratio. Never enlarges. Omit to keep the original dimensions.",
                "maximum": 10000,
                "minimum": 16,
                "type": "integer"
              },
              "name": {
                "default": "image.jpg",
                "description": "The original filename. Only used to name the result: its extension is swapped for the output format's, so photo.jpg comes back as photo.avif.",
                "maxLength": 255,
                "type": "string"
              },
              "quality": {
                "default": 60,
                "description": "Encoder quality, 1 (smallest, roughest) to 100 (largest). Ignored for PNG, which is lossless. The default of 60 is deliberate: AVIF at 100 is often larger than the JPEG it replaces.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "default": "image/jpeg",
                "description": "The MIME type of the bytes in data. The image pipeline reads all of these; the actual format is taken from the bytes, so a wrong value here is not fatal.",
                "enum": ["image/jpeg", "image/png", "image/webp", "image/gif", "image/avif"],
                "type": "string"
              }
            },
            "required": ["data"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AVIF Converter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d780078f887256e9333c79b29dd87687f5b7daf850e6114845966db76b4df9fa"
        },
        {
          "name": "background_remover",
          "title": "Remove Background",
          "description": "Remove the background from an image — solid backgrounds go transparent, in your browser. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "colour": {
                "description": "The background colour to remove, as #rrggbb hex. Omit to sample it from the four corners of the image; the response reports the colour used and whether the corners agreed on it.",
                "maxLength": 9,
                "type": "string"
              },
              "data": {
                "description": "The image file's bytes, base64-encoded. This removes a flat, single-colour background such as a white product shot or a scan; it is not a subject cutout for photos with busy backgrounds.",
                "maxLength": 70000000,
                "minLength": 1,
                "type": "string"
              },
              "feather": {
                "default": 30,
                "description": "How soft the edge is, 0 to 100. It widens the band of partly transparent pixels around the tolerance threshold, as a percentage of tolerance; 0 gives a hard jagged cut.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "name": {
                "default": "image.png",
                "description": "The original filename. Used only to name the result, whose extension becomes .png because the output is always a PNG with transparency.",
                "maxLength": 255,
                "type": "string"
              },
              "reach": {
                "default": "edges",
                "description": "edges (the default) removes only background connected to the image border, so enclosed areas like the hole in a letter or a window behind someone stay. everywhere removes every pixel within tolerance wherever it is.",
                "enum": ["edges", "everywhere"],
                "type": "string"
              },
              "tolerance": {
                "default": 12,
                "description": "How far a pixel's colour may be from the background colour and still be removed, 0 to 100 as a share of the largest possible RGB distance. Raise it for uneven lighting or JPEG noise; too high eats into the subject.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "type": {
                "description": "The MIME type of the bytes in data: JPEG, PNG or WebP.",
                "enum": ["image/jpeg", "image/png", "image/webp"],
                "type": "string"
              }
            },
            "required": ["data", "type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Remove Background"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e4e8359f77add6b6e5ffef7293a90abf28bc019dd7452676bad460818383a209"
        },
        {
          "name": "barcode_generator",
          "title": "Barcode Generator",
          "description": "A barcode generator for EAN-13, UPC-A, EAN-8 and Code 128 — check digit included. A HelpySelf tool (helpyself.com).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "height": {
                "default": 80,
                "description": "Height of the bars in pixels. The printed number and the longer guard bars add to the total height of the SVG when showText is true.",
                "maximum": 400,
                "minimum": 20,
                "type": "integer"
              },
              "scale": {
                "default": 3,
                "description": "Width of the narrowest bar in pixels; every other width and the quiet zones are multiples of it, so this sets the overall size. 3 is about right for a screen.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "showText": {
                "default": true,
                "description": "Print the encoded value underneath the bars, as a retail barcode always does. False gives bars only.",
                "type": "boolean"
              },
              "symbology": {
                "default": "ean13",
                "description": "Which barcode standard to draw. ean13 (13 digits, the retail default worldwide), upca (12 digits, North American retail), ean8 (8 digits, small packaging), code128 (letters, digits and punctuation, for labels and logistics).",
                "enum": ["ean13", "upca", "ean8", "code128"],
                "type": "string"
              },
              "text": {
                "description": "What to encode. For ean13, upca and ean8 this is digits only: 12, 11 or 7 of them and the check digit is worked out, or one more and it is verified (a wrong one is refused rather than drawn). For code128 it is any printable ASCII up to 80 characters.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Barcode Generator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26d16e52f5f4452c2899787115f6f4e6b4d7285dcc9a7fc9b5852323522192d2"
        },
        {
          "name": "barcode_reader",
