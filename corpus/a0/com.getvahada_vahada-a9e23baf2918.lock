{
  "lockfileVersion": 2,
  "subjects": {
    "com.getvahada/vahada": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getvahada.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "com.getvahada/vahada",
        "title": "Vahada | Turkish drink prices",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Vahada holds real drink prices from bars in Turkey, read from venue menus. Call list_areas first if you are unsure an area is covered. All prices are standing menu prices in Turkish lira; happy-hour prices are returned separately with their hours and never as the headline figure.",
      "tools": [
        {
          "name": "cheapest_drinks",
          "title": "Cheapest drinks",
          "description": "Rank venues by the cheapest standing price for a drink category, optionally within one district or neighbourhood of a Turkish city. Use for questions like 'where is the cheapest beer in Kadıköy' or 'cheap cocktails in Beyoğlu'.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "District or neighbourhood name, e.g. 'Kadıköy' or 'Beyoğlu'. Omit for all of Turkey.",
                "type": "string"
              },
              "drink": {
                "description": "Which drink category to rank by.",
                "enum": ["beer", "wine", "cocktail"],
                "type": "string"
              },
              "limit": {
                "description": "How many venues to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["drink"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:599cca0f4e05654ae9b04452ea84a1eb446b9769a9843c2cf7da9985a56ad4c6"
        },
        {
          "name": "happy_hours_now",
          "title": "Happy hours running right now",
          "description": "Discounted drinks being served AT THIS MOMENT, with how long each has left. Turkey time. Use for 'is there a happy hour near me right now' or 'cheap drinks in Beyoğlu tonight'. Returns an empty list when nothing is running, which is a real answer rather than an error.",
          "inputSchema": {
            "properties": {
              "area": {
                "description": "District or neighbourhood, e.g. 'Kadıköy'. Omit for all of Turkey.",
                "type": "string"
              },
              "limit": {
                "description": "How many to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1d71eaf3d05393fa98615c5b1a12c8980910221476a01fcd0bf159e5998aba12"
        },
        {
          "name": "list_areas",
          "title": "Areas with price data",
          "description": "Which Turkish districts and neighbourhoods Vahada has enough priced venues to answer for, and how many venues each has. Call this first when unsure whether an area is covered.",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "Filter to one city, e.g. 'Istanbul'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:75d20b6355b0ac15b72143d764c622c6c45ffab5f20767406e590bec4b2aaff1"
        },
        {
          "name": "price_index",
          "title": "Bira Endeksi (drink price index)",
          "description": "The published Vahada Bira Endeksi: median drink prices for Turkey and for the covered districts, as frozen in a monthly edition. Use for 'what does a beer cost in Turkey'.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:380b69e127f1ad672f52600967b6ba44de8035b77d8b50c9a92a2b9900216a58"
        },
        {
          "name": "venue_prices",
          "title": "Venue prices",
          "description": "Every standing drink price for one venue, plus any happy hours with the days and times they run. Accepts a venue name or its Vahada slug.",
          "inputSchema": {
            "properties": {
              "venue": {
                "description": "Venue name or slug, e.g. 'Fıçı Pera'.",
                "type": "string"
              }
            },
            "required": ["venue"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:730ca52c69f2281e635fba442c82fb1e67e821dbe177a02d651a2a73de1286cc"
        },
        {
          "name": "venues_near",
          "title": "Venues near a point",
          "description": "Priced venues within a radius of a latitude/longitude, nearest first, with their cheapest drink in each category and the distance. Use when the user has shared a location or named a place you can geocode yourself.",
          "inputSchema": {
            "properties": {
              "latitude": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "description": "How many to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "longitude": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_km": {
                "description": "Search radius in km (default 2).",
                "maximum": 25,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["latitude", "longitude"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a0c88d237a2477e3c87c91dca7e9ccd707e3d138f5b784a865a2b60761cc3535"
        }
      ],
      "digest": "sha256:08ea23164a43db3fcc04909f20a92305fb477dd721d13dba4ca6b904027532d6"
    }
  }
}
