        {
          "name": "search_trip_plans",
          "title": "Find ready-made trip plans",
          "description": "Search Triptime AI's ready-made, day-by-day travel itineraries (520+ destinations worldwide) by city or country. Use this when the user asks for a trip plan or itinerary for a destination. Returns matching plans with the number of days, places and a link to open the plan on Triptime AI, plus a link to plan a custom trip.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Preferred trip length in days (optional).",
                "maximum": 21,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "description": "City, region or country in English, e.g. \"Rome\", \"Cappadocia\", \"Japan\" (write \"Lisbon\", not \"Lizbon\").",
                "type": "string"
              },
              "language": {
                "description": "Language for titles and links: the language the user writes in, when it is one of these (optional, default en).",
                "enum": ["en", "tr", "es", "de", "fr", "it", "pt", "ru"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
