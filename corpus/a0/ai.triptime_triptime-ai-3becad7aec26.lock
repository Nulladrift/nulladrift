      "serverInfo": {
        "name": "triptime-ai",
        "title": "Triptime AI",
        "version": "1.0.0",
        "websiteUrl": "https://www.triptime.ai"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Triptime AI is a travel planning service with more than 520 ready-made, day-by-day trip plans for cities, regions and countries around the world. Each plan lists the ordered stops of every day and has a page on triptime.ai where it opens on an editable map that can be shared, downloaded as a PDF or used offline. For destinations or trip lengths without a ready-made plan, Triptime AI starts a custom plan on triptime.ai. It only returns its own published plans: it does not book flights, hotels or tours, and it does not see the user's account or conversation. Plans and links are available in English, Turkish, Spanish, German, French, Italian, Portuguese and Russian.",
      "tools": [
        {
          "name": "get_trip_plan",
          "title": "Get a trip plan day by day",
          "description": "Get the day-by-day stops (places with coordinates) of a Triptime AI ready-made plan found with search_trip_plans. Shows a route card with a link to open the plan.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "Language for the card and links: the language the user writes in, when it is one of these (optional, default en).",
                "enum": ["en", "tr", "es", "de", "fr", "it", "pt", "ru"],
                "type": "string"
              },
              "plan_id": {
                "description": "The plan id from search_trip_plans.",
                "type": "string"
              }
            },
            "required": ["plan_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "labels": {
                "description": "Display labels for the trip card in the requested language.",
                "properties": {
                  "custom": {
                    "type": "string"
                  },
                  "dayN": {
                    "type": "string"
                  },
                  "daysN": {
                    "type": "string"
                  },
                  "lang": {
                    "type": "string"
                  },
                  "open": {
                    "type": "string"
                  },
                  "openShort": {
                    "type": "string"
                  },
                  "placesN": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "plan": {
                "properties": {
                  "city": {
                    "type": "string"
                  },
                  "country": {
                    "type": "string"
                  },
                  "days": {
                    "items": {
                      "properties": {
                        "day": {
                          "type": "integer"
                        },
                        "places": {
                          "items": {
                            "properties": {
                              "category": {
                                "type": "string"
                              },
                              "lat": {
                                "type": ["number", "null"]
                              },
                              "lng": {
                                "type": ["number", "null"]
                              },
                              "name": {
                                "type": "string"
                              }
                            },
                            "required": ["name"],
                            "type": "object"
                          },
                          "type": "array"
                        }
                      },
                      "required": ["day", "places"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "id": {
                    "type": "string"
                  },
                  "image": {
                    "type": "string"
                  },
                  "map_image": {
                    "type": "string"
                  },
                  "title": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["days", "id", "title", "url"],
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a trip plan day by day"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
