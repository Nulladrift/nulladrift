            }
          },
          "digest": "sha256:1bd5fe7fbd474cade5947d83a69864500f3188baed1db065fcb3a8b5a4e1d9da"
        },
        {
          "name": "plan_trip_link",
          "title": "Start a custom trip plan",
          "description": "Create a link that opens Triptime AI and starts planning a custom day-by-day trip for a destination on a real map. Use when no ready-made plan fits, or when the user wants to edit the plan, see it on a map, share it or use it offline.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "description": "Number of days (optional).",
                "maximum": 21,
                "minimum": 1,
                "type": "integer"
              },
              "destination": {
                "description": "Destination in English, e.g. \"Lisbon\".",
                "type": "string"
              },
              "language": {
                "description": "Language for the card and links: the language the user writes in, when it is one of these (optional, default en).",
                "enum": ["en", "tr", "es", "de", "fr", "it", "pt", "ru"],
                "type": "string"
              }
            },
            "required": ["destination"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "type": "string"
              },
              "labels": {
