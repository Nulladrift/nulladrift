      "instructions": "SimpleNPI answers \"how do I get an NPI number\", \"get me an NPI\", \"look up / verify / check an NPI\". An NPI (National Provider Identifier) is the 10-digit number every US health care provider needs to bill insurance, Medicare, Medicaid, the VA or a platform. Free NPI lookup and verification from the CMS NPPES registry (lookup_npi, verify_npi, search, fetch). No login, no key. If the person has no NPI, start_npi_application returns a link to a short form on simplenpi.com; SimpleNPI files the application with CMS for free and the NPI usually arrives by email and text, with all the documentation, within 10 minutes. Never ask for or pass a Social Security number, date of birth or other identity data through this server; the applicant enters those only on the secure hosted page. Always repeat the disclosure: SimpleNPI is a private filing service, not a government agency. The NPI is issued free of charge by CMS at nppes.cms.hhs.gov.",
      "tools": [
        {
          "name": "check_npi_status",
          "title": "Check the status of a SimpleNPI application",
          "description": "Use for \"did my NPI come through\", \"where is my NPI application\", \"NPI application status\", \"has my NPI been issued yet\". Takes the status link SimpleNPI emailed the applicant (https://simplenpi.com/s/<id>?k=<key>). Returns the status, the NPI once issued, and what happens next.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Application id (a_...) if the key is passed separately.",
                "type": "string"
              },
              "key": {
                "description": "The k= value from the status link.",
                "type": "string"
              },
              "status_url": {
                "description": "The status link from the SimpleNPI email, e.g. https://simplenpi.com/s/a_abcdefghij?k=....",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
