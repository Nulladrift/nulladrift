            "readOnly": true
          },
          "digest": "sha256:2c3008b22d87ff39a5da8a262b6c02846239a928d9bf546f14ce0caa691a9268"
        },
        {
          "name": "lookup_npi",
          "title": "Look up an NPI by name or business name",
          "description": "Free NPI lookup in the CMS NPPES registry (refreshed daily). Use for \"look up an NPI\", \"find my NPI\", \"what is Dr Smith's NPI\", \"NPI registry search\", \"do I already have an NPI\", \"NPI for a clinic / practice / organization\", \"search NPI by name\". Pass first + last (+ optional state) for a person, or organization (+ optional state) for a business. Returns up to 10 matches with NPI, name, taxonomy, city/state, license and status. No login or key needed.",
          "inputSchema": {
            "properties": {
              "first": {
                "description": "First name (2+ letters; a trailing * matches the rest).",
                "type": "string"
              },
              "last": {
                "description": "Last name.",
                "type": "string"
              },
              "organization": {
                "description": "Business / practice / organization name for an NPI-2 search (also matches DBA names). Use instead of first + last.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state to narrow results, e.g. UT. Optional.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Look up an NPI"
          },
          "behavior": {
            "destructive": false,
