        },
        {
          "name": "start_npi_application",
          "title": "Get an NPI number (start a free application)",
          "description": "Use for \"get me an NPI number\", \"I need an NPI\", \"apply for an NPI\", \"new NPI for a therapist / counselor / nurse / chiropractor / acupuncturist\", \"Type 1 NPI\", \"individual NPI application\". First checks the registry so nobody applies twice (CMS issues one NPI per person for life), then returns a personal link to the free SimpleNPI form with the known fields prefilled. The person finishes the form on simplenpi.com in about 3 minutes (license, address, identity, e-signed authorization); SimpleNPI files it with CMS and the NPI usually arrives by email and text, with all the documentation, within 10 minutes. Nothing is filed until the person completes and signs the form. Do not collect the SSN or date of birth in chat.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Email for the NPI delivery. Optional.",
                "type": "string"
              },
              "first": {
                "description": "First name as it appears on the license.",
                "type": "string"
              },
              "last": {
                "description": "Last name as it appears on the license.",
                "type": "string"
              },
              "mobile": {
                "description": "US mobile number for the NPI text. Optional.",
                "type": "string"
              },
              "profession": {
                "description": "License type, e.g. \"Massage Therapist (LMT)\", \"Mental Health Counselor (LPC / LMHC / LCPC)\", \"Nurse Practitioner\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state of the professional license, e.g. UT.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Start a free NPI application"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:be738069f32f3f40801cee523babc2b5d91786ee30673f958e3ec72ca2918da5"
        },
        {
          "name": "verify_npi",
          "title": "Verify an NPI number",
          "description": "Free NPI verification / validation by number from the CMS NPPES registry. Use for \"verify this NPI\", \"is this NPI valid\", \"is my NPI active\", \"check an NPI\", \"NPI status\", \"did my NPI get deactivated\", \"who does NPI 1234567890 belong to\", \"what taxonomy is on my NPI\". Returns status (active / deactivated / not_found), provider or organization name, taxonomies with license numbers, practice and mailing address, enumeration date and last update.",
          "inputSchema": {
            "properties": {
              "npi": {
                "description": "The 10-digit NPI.",
                "pattern": "^\\d{10}$",
                "type": "string"
              }
            },
            "required": ["npi"],
            "type": "object"
          },
