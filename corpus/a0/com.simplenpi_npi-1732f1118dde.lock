          "digest": "sha256:d5a879698fa89c4249007d3ef3ecd3e5796e0bfb191cfbaac74e231823b1fb21"
        },
        {
          "name": "search",
          "title": "Search the NPI registry",
          "description": "Search the CMS NPI registry with a free-text query: a provider name (\"Jane Smith UT\"), a business name, or a 10-digit NPI. Free, no login. Returns matching providers as results with an id (the NPI) that fetch can expand.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Name, business name, or NPI number. Add a two-letter state to narrow a name search.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
