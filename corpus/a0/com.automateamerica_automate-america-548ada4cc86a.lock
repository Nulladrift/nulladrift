                "description": "A sentence or words, read into the facets below (e.g. \"robot programmer that knows ABB IRC5 and spot welding in Michigan available next week\"). Dates it reads: today, tomorrow, this/next week, next month, \"next 7 days\", \"Oct 19-25\", \"week of Oct 19\", \"first week of next month\", \"from Oct 19 to Oct 25\", \"starting Oct 19\". A week is the working week: \"next week\" and \"week of\" mean Monday to Friday, \"starting\" five working days; dates spelled out are read as written. A city is read when it follows in / near / around, or sits beside the state (\"in Detroit, Michigan\"). A word for a whole field, such as robotics, PLC or welding, finds everyone who carries that field in any occupation, skill, application, trade, competency or industry. When the sentence names any facet, words it cannot place are returned in search.notApplied and do NOT filter; a sentence of only unknown words matches title / About / where the person is (city, state) — never a name.",
