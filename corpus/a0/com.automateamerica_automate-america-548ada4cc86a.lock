                "description": "The product's id (GET /products).",
                "minimum": 1,
                "type": "integer"
              },
              "text": {
                "description": "Your member's own words to the seller, 1 to 180 characters — never your own.",
                "maxLength": 180,
                "minLength": 1,
                "type": "string",
                "x-user-generated": true
              }
            },
            "type": "object"
          },
