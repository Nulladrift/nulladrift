              "jobId": {
                "description": "The posting id (an RFQ id for type=rfq).",
                "minimum": 1,
                "type": "integer"
              },
              "key": {
                "description": "One action key the applicant's actions list offers now.",
                "pattern": "^[a-z_]{2,20}$",
