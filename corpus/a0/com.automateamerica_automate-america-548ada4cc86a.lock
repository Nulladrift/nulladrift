                      "description": "A day inside the week (YYYY-MM-DD).",
                      "format": "date",
                      "type": "string"
                    },
                    "description": {
                      "description": "The day's work report — REQUIRED on every day with hours or travel (legacy's rule: \"Please fill <day> work report to proceed further.\"). At most 65535 bytes.",
                      "type": "string",
                      "x-user-generated": true
                    },
                    "doubletime": {
                      "description": "Double-time hours, only if your member names them.",
