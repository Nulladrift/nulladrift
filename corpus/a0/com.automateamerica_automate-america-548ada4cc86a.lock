            "additionalProperties": false,
            "properties": {
              "alertsOn": {
                "description": "true turns job alerts from saved searches on; false turns them all off.",
                "type": "boolean"
              },
              "defaultFrequency": {
                "description": "How often a NEW saved search alerts your member.",
                "enum": ["instant", "daily", "weekly"],
                "type": "string"
              },
              "maxPerDay": {
                "description": "The most job alerts your member gets in a day.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "quietHours": {
                "additionalProperties": false,
                "description": "No instant alerts between these times (e.g. 22:00 to 07:00); null clears them.",
                "properties": {
                  "end": {
                    "description": "HH:MM, 24-hour",
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  },
                  "start": {
                    "description": "HH:MM, 24-hour",
                    "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                    "type": "string"
                  }
                },
                "required": ["end", "start"],
                "type": ["object", "null"]
              }
