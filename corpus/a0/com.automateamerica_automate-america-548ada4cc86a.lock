                "maxLength": 200,
                "type": "string"
              },
              "state": {
                "description": "Where the work is: a US state name or code (\"Michigan\", \"MI\").",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "default": "all",
                "description": "all (default) · contract · direct_job · rfq",
                "enum": ["all", "contract", "direct_job", "rfq"],
                "type": "string"
