                "enum": ["apprenticeship", "blog", "certification", "contract_completed", "contract_ongoing", "job", "rfq", "school", "testimonial", "user_post"],
                "type": "string"
              }
            },
            "required": ["commentId", "id", "type"],
            "type": "object"
          },
          "annotations": {
