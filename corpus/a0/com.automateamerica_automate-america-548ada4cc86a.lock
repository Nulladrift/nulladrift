                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "category": {
                          "enum": ["Quotes must be submitted by", "Award date", "Kickoff meeting", "Design window", "Build", "Teardown", "Shipping", "Install", "Commissioning", "Dry run", "Buyoff", "Production support", "Training"],
                          "type": "string"
                        },
                        "date": {
                          "description": "YYYY-MM-DD (an estimate).",
                          "type": "string"
                        }
                      },
                      "required": ["category", "date"],
                      "type": "object"
                    },
                    "maxItems": 13,
                    "type": "array"
                  },
                  "netTermsDays": {
                    "description": "An hourly contract: the payment terms your member chose, in days (15, 30, 45, 60 or 90). Ask your member — never a default.",
                    "enum": [15, 30, 45, 60, 90],
                    "type": "integer"
                  },
                  "occupation": {
                    "description": "The headline occupation, by NAME (the site finds its catalogue entry; a name it does not know is kept as the title).",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "occupations": {
                    "description": "Every occupation the work needs; the first is the headline.",
                    "items": {
                      "maxLength": 120,
                      "type": "string"
                    },
                    "maxItems": 6,
                    "type": "array"
                  },
                  "positionsNeeded": {
                    "description": "An hourly contract only.",
                    "maximum": 50,
                    "minimum": 1,
                    "type": "integer"
                  },
                  "setting": {
                    "enum": ["On-site", "Hybrid", "Remote"],
                    "type": "string"
                  },
                  "startDate": {
                    "description": "YYYY-MM-DD or ASAP.",
                    "type": "string"
                  },
                  "terms": {
                    "additionalProperties": false,
                    "description": "A quote only: the commercial terms every bidder quotes against. Every field is public on the RFQ.",
                    "properties": {
                      "insuranceRequired": {
                        "description": "The insurance a bidder must carry.",
                        "maxLength": 255,
                        "type": "string",
                        "x-user-generated": true
                      },
                      "paymentTerms": {
                        "description": "What your member states about payment to the company they award (between them; Automate America is not a party).",
                        "maxLength": 255,
                        "type": "string",
                        "x-user-generated": true
                      },
                      "pricingModel": {
                        "enum": ["Firm fixed price", "Time and materials", "Not to exceed", "Unit rates", "Open to the bidder's proposal"],
                        "type": "string"
                      },
                      "warranty": {
                        "maxLength": 255,
                        "type": "string",
                        "x-user-generated": true
                      }
                    },
                    "type": "object"
                  },
                  "type": {
                    "description": "contract (an hourly contract) · direct_job · apprenticeship · rfq (a request for a quote).",
                    "enum": ["contract", "direct_job", "rfq", "apprenticeship"],
                    "type": "string"
                  }
                },
                "required": ["description", "setting", "type"],
                "type": "object"
              },
              "professionalId": {
                "description": "The professional's member id (from GET /professionals).",
                "minimum": 1,
                "type": "integer"
              },
              "service": {
                "default": "white_glove",
                "description": "An hourly contract only: white_glove (default — Automate America handles everything) or standard (the standard request your member finishes and pays for on the site). A direct job, apprenticeship or quote request is always the standard kind.",
                "enum": ["white_glove", "standard"],
                "type": "string"
              },
              "visibility": {
                "description": "Ask your member: private (only this professional sees it) or public (a posting any professional can apply to, and the professional is invited).",
