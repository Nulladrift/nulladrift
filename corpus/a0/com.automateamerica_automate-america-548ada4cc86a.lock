                "description": "Which contact: purchasing, on_site, accounts_payable, accounts_receivable, hr, marketing, alternate or purchasing_secondary.",
                "enum": ["purchasing", "on_site", "accounts_payable", "accounts_receivable", "hr", "marketing", "alternate", "purchasing_secondary"],
                "type": "string"
              }
            },
