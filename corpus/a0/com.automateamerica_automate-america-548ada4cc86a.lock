                "description": "Pays at least this public hourly rate, in US dollars (work that shows no rate is left out).",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "model": {
                "description": "A model / controller the work asks for, e.g. \"R-30iB\" (any brand). Comma list = any of them.",
                "maxLength": 200,
                "type": "string"
              },
              "near": {
                "description": "Search around a point: \"lat,lng\" (e.g. \"42.3314,-83.0458\") or a city (\"Detroit\", or \"Detroit, MI\" to pick the state), placed at the middle of where the members who list it are. Only work whose site is within `radius` miles (default 50) of it — the same distance /map-search uses. Work with no position is kept when its city is that city. A place no member lists matches nothing and is named in search.unresolved.",
                "maxLength": 200,
                "type": "string"
              },
              "occupation": {
                "description": "The kind of work, e.g. \"Robot Programmer\" (the shared occupation resolver, synonyms included).",
                "maxLength": 200,
                "type": "string"
              },
              "occupationId": {
                "description": "An exact occupation id. Comma list = any of them.",
                "maxLength": 200,
                "type": "string"
              },
              "q": {
                "description": "A sentence read into the keys below, e.g. \"robot programmer with Fanuc in Michigan\". Words it does not understand are listed back in search.unusedWords and must each appear in the text of the work itself (title, scope, work-request number, occupation, city, state, country; for an RFQ the searchable title, occupation, city, state, country), never in a poster or person name. A place word beside the conditions the sentence read (\"robot programmer Louisville\") keeps only the work in that place (search.understood.place).",
                "maxLength": 500,
