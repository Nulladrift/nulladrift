  "subjects": {
    "capital.cre/cre-capital": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cre.capital/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "cre-capital",
        "title": "CRE Capital: capital stack calculator",
        "version": "1.0.0",
        "websiteUrl": "https://cre.capital/developers/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CRE Capital (cre.capital) is a commercial real estate capital stack calculator. capital_stack runs the same model as the stack builder on the site: senior loan, mezzanine, preferred equity and common equity with an optional one-tier JV waterfall, returning attachment and detachment points, blended cost, coverage, debt yields and equity, LP and sponsor IRRs. Starting prices are the 10-year Treasury (U.S. Treasury daily par yield curve) plus Altus Group, CRE Debt Capital Markets Survey, Q2 2026 average lender quotes, published 2026-08-20; get_capital_costs returns them with what public mortgage REITs report earning in their 10-Qs for the quarter ended 2026-06-30. list_capital_providers returns the agency lender and mortgage REIT lists as the institutions publish them. Results are arithmetic on the inputs, not a quote, an appraisal, a projection, an offer of securities or investment advice. Every result carries its source links; cite them. The site is published by Janover Capital LLC, which takes senior and mezzanine debt requests through the site and does not raise or place preferred or JV equity.",
      "tools": [
        {
          "name": "capital_stack",
          "title": "Build a CRE capital stack",
          "description": "Runs the cre.capital stack builder on a deal: senior loan, mezzanine, preferred equity and the common equity left over, with an optional one-tier JV split. Returns each layer's amount, share of cost and attachment/detachment LTV and LTC, blended cost of capital, cost of debt and preferred, common equity IRR and multiple, unlevered IRR, senior and all-debt DSCR, coverage including pref current pay, debt yields, LP and sponsor IRRs, the exit and the yearly cash flows. Rates you leave out start from the current 10-year Treasury plus Altus Group Q2 2026 average quotes. Arithmetic on your inputs, not a quote or a projection.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "exit_cap_pct": {
                "default": 7,
                "description": "Exit cap rate in percent applied to the next year's NOI, e.g. 7. Default 7.",
                "maximum": 30,
                "minimum": 0.5,
                "type": "number"
              },
              "hold_years": {
                "default": 5,
                "description": "Hold period in whole years, 1 to 30. Default 5.",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "hurdle_pct": {
                "description": "Cumulative, non-compounded preferred return to the JV partners in percent. Default 6.",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "lp_share_pct": {
                "description": "LP share of the common equity in percent; 0 or 100 turns the JV split off. Default 90.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "mezz_amount": {
                "description": "Mezzanine loan amount in dollars (interest only). Default 0.",
                "maximum": 100000000000,
                "minimum": 0,
                "type": "number"
              },
              "mezz_rate_pct": {
                "description": "Mezzanine rate in percent. Default: 10-year Treasury + 759 bp (Altus Q2 2026, fixed mezzanine).",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "noi": {
                "description": "Year-one net operating income in dollars, e.g. 1400000.",
                "maximum": 100000000000,
                "minimum": 0,
                "type": "number"
              },
              "noi_growth_pct": {
                "default": 3,
                "description": "NOI growth per year in percent, e.g. 3. Default 3.",
                "maximum": 20,
                "minimum": -20,
                "type": "number"
              },
              "pref_amount": {
                "description": "Preferred equity amount in dollars. Default 0.",
                "maximum": 100000000000,
                "minimum": 0,
                "type": "number"
              },
              "pref_current_pct": {
                "description": "Part of the preferred return paid currently, in percent; the rest accrues to the exit. Default 8.",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "pref_rate_pct": {
                "description": "Preferred return in percent. Default 13.57 (Altus Q2 2026, fixed preferred equity).",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "promote_pct": {
                "description": "Promote to the sponsor above the preferred return, in percent of the remaining cash. Default 20.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "sale_cost_pct": {
                "description": "Sale costs in percent of the sale price. Default 2.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "senior_amort_years": {
                "default": 30,
                "description": "Senior amortization in years; 0 means interest only. Default 30.",
                "maximum": 40,
                "minimum": 0,
                "type": "integer"
              },
              "senior_amount": {
                "description": "Senior loan amount in dollars, e.g. 11000000. Use 0 for no senior loan.",
                "maximum": 100000000000,
                "minimum": 0,
                "type": "number"
              },
              "senior_rate_pct": {
                "description": "Senior loan rate in percent. Default: 10-year Treasury + 195 bp (Altus Q2 2026, 10-year fixed, LTV up to 65%).",
                "maximum": 30,
                "minimum": 0,
                "type": "number"
              },
              "total_cost": {
                "description": "Total cost in dollars: price plus closing costs plus capex, e.g. 20000000.",
                "maximum": 100000000000,
                "minimum": 0,
                "type": "number"
              },
              "value": {
                "description": "As-is value or price in dollars, used for the LTV figures. Defaults to total_cost.",
                "maximum": 100000000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["noi", "senior_amount", "total_cost"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build a CRE capital stack"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e19107a6b4006b12c160ea6bb1499c6f3bfda9e6384bd505d8d5e5e3e5c1151a"
        },
        {
          "name": "get_capital_costs",
          "title": "What each capital stack layer costs",
          "description": "What senior debt, mezzanine and preferred equity cost: Altus Group's Q2 2026 average lender quotes (fixed and floating, by LTV band, as spreads over the 5-year or 10-year Treasury or Term SOFR), the current 10-year Treasury with the implied all-in senior and mezzanine rates, and what public mortgage REITs report earning on each layer in their 10-Qs for the quarter ended June 30, 2026. Filter by layer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "layer": {
                "default": "all",
                "description": "Which layer to return. Default all.",
                "enum": ["all", "senior", "mezzanine", "preferred_equity"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "What each capital stack layer costs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:877efda96021e1ce06a33820bd09e5e27155eaea9acebdfa7f9f10228c93bfc3"
        },
        {
          "name": "list_capital_providers",
          "title": "Who provides each capital stack layer",
          "description": "Names of firms in the business of each layer, only as the institutions publish them: Fannie Mae DUS lenders and Freddie Mac Optigo lenders (senior agency multifamily debt) and public mortgage REITs that hold mezzanine loans or preferred equity per their 10-Qs. Filter by list or by part of a name. Being on a list does not mean a firm will quote a given deal.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "list": {
                "default": "all",
                "description": "Which published list. Default all.",
                "enum": ["all", "fannie_mae_dus", "freddie_mac_optigo", "mortgage_reits"],
                "type": "string"
              },
              "name": {
                "description": "Optional part of a firm name to look for, e.g. \"Walker\" or \"Arbor\".",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Who provides each capital stack layer"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:88adc3f804876ef6c4922467ff70ccb79ae4a2afcc914a129b0a037620f18d50"
        }
      ],
      "digest": "sha256:51bfb4e75b7617c608b078bb759b7ba8306021d50187a64f5104e83ed6c5ce57"
    }
  }
