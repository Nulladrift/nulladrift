{
  "lockfileVersion": 2,
  "subjects": {
    "com.osmanth/shop-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.osmanth.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "agent-shop-search",
        "title": "Osmanth Shop Search (beta)",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Requires a free API key (get one at https://api.osmanth.com/keys) sent as Authorization: Bearer <key>. Call search_products once per product type. Always show this disclosure near links: \"We may earn a commission when you buy through links on this page.\". Do not cache results or download images.",
      "tools": [
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search live products across Shopify merchants (Shopify Global Catalog) and major retailers (Channel3). Returns normalized products with title, price, currency, merchant, buy_url, image_url, ships_to and source. Always show the `disclosure` text to the user near the links. Do not cache results.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "default": "USD",
                "description": "ISO 4217 code. Results in other currencies are dropped.",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price in `currency` major units (e.g. 20 = $20.00).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "description": "One product type plus constraints, e.g. 'ceramic pour-over coffee set'.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "ship_to": {
                "default": "US",
                "description": "ISO 3166-1 alpha-2 destination country.",
                "pattern": "^[A-Z]{2}$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:48937a4381bfcb5d7575b87e14d75e76c4d7cbc527fc9d1629f90229a639ee99"
        }
      ],
      "digest": "sha256:541a608487271274dce469edc5b7cf0f7858c1a2740c5e20c63276e668e7a777"
    }
  }
}
