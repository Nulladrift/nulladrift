{
  "lockfileVersion": 2,
  "subjects": {
    "app.aiscoreboard/catalogue": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aiscoreboard.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "aiscoreboard",
        "title": "AIScoreboard",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only AI model and AI app catalogue. Every price has a source type and a check date: quote both and link the url. Unknown facts are left out, never guessed. Money never buys rank.",
      "tools": [
        {
          "name": "compare_models",
          "title": "Compare AI models",
          "description": "Two to four models side by side: prices (with source and date), context and status, plus the link to the comparison page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "models": {
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["models"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d88fd84cda65a18b82a64fb1ad50fa7a324390bd6bd481025915abd6b9d510e"
        },
        {
          "name": "get_model",
          "title": "Get one AI model",
          "description": "One model by short name, id or exact name: price with source and check date, context, open-weights flag, any announced retirement or price change, its recent price changes and comparison pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "model": {
                "description": "Short name from the model page URL (e.g. claude-opus-5-5), catalogue id, or exact name (e.g. \"Claude Opus 5.5\")",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d9b8e0aa30ec539fb35b1aa542bed69eed3f87868e94cc9cc86783f97656bad3"
        },
        {
          "name": "price_changes",
          "title": "Recent AI API price changes",
          "description": "Recorded API price rises, cuts and retirements, newest first, each with the date and whether it was a vendor-page or OpenRouter price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "model": {
                "type": "string"
              },
              "since": {
                "description": "YYYY-MM-DD",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7c8d376e7149c76767f59ec83b9f66bc83cfa3a21a9ea89977f2f54907e51d05"
        },
        {
          "name": "retirements",
          "title": "Model retirements and scheduled price changes",
          "description": "Announced model retirements and price changes (Sunset Watch), with suggested replacements and vendor sources. Upcoming by default.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "include": {
                "default": "upcoming",
                "enum": ["upcoming", "deprecated", "retired", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9ece913aebb4a277ec382febd52a1022931ed7d3a559c2f994ff66e3cacfaf4f"
        },
        {
          "name": "search_models",
          "title": "Search AI models",
          "description": "Find AI API models by name or provider, optionally only those with a verified price at or under a budget. Returns per-1M-token prices with their source and check date, context window and the profile URL. Sorted by blended price (3 input : 1 output) when a budget is given, else by name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "maxBlendedPrice": {
                "description": "Only models whose blended USD price per 1M tokens is at or below this",
                "type": "number"
              },
              "minContextTokens": {
                "type": "integer"
              },
              "provider": {
                "type": "string"
              },
              "query": {
                "description": "Words in the model or provider name, e.g. \"claude sonnet\" or \"gemini\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a360d6f8e9c423d1327faebe23b2c41da92fefbe9598def98dfdd057adcbfe6"
        },
        {
          "name": "search_tools",
          "title": "Search AI apps and tools",
          "description": "Find AI apps (coding assistants, app builders, chat, image, video...) by name, provider or job, with the vendor price note, check date and profile URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ab2e4fdb5d6eb0ae332dbaaca1ae80e951e628ccb4d36e5108bbb8cca321545d"
        }
      ],
      "digest": "sha256:afeb847351c5233e5decc474b3feb407e36235f5b816de53531a0abaff0e45bf"
    }
  }
}
