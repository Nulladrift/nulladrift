        {
          "name": "get_design",
          "title": "Get Design",
          "description": "Get a design's images: the 2D site plan and the front and back 3D views, plus a link to open it in Yarda. Pass the job_id from design_yard to wait for a design in progress (waits up to wait_s seconds, default 40; call again if it's still running), or a design_id from list_designs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "design_id": {
                "description": "A design_id from list_designs or a finished job",
                "type": "string"
              },
              "job_id": {
                "description": "The job_id design_yard returned",
                "type": "string"
              },
              "wait_s": {
                "description": "With job_id: seconds to wait for it to finish (0-45, default 40)",
                "maximum": 45,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "approval_status": {
                "description": "When review_required: the review's true state. Only the user's own approval changes awaiting_approval",
                "enum": ["preparing", "awaiting_approval", "approved", "used", "failed", "expired", "unavailable"],
                "type": "string"
              },
              "brief": {
                "additionalProperties": false,
                "description": "When review_required: the design brief frozen with the review",
                "properties": {
                  "back_features": {
                    "items": {
                      "type": "string"
                    },
