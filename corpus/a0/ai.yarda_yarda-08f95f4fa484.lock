        {
          "name": "find_property",
          "title": "Find Property",
          "description": "Look up a US property by address. Returns the normalized address, coordinates, and whether Street View covers it. May save a temporary property reference; repeated lookups may create new records. Use it before prepare_design_review for a preview-only flow, or before design_yard when generation is intended. The satellite image and outline are shown in the owner-bound property review before a design is made: design_yard's first result shows it in the chat (in the Yarda card where the chat app displays it), so do not tell the user Yarda will first send them a link. If `precise` is false, ask the user to confirm the house or give a more exact address (cul-de-sacs often geocode to the wrong house).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Full US street address with city and state",
                "maxLength": 300,
                "minLength": 5,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "type": "string"
              },
              "input_address": {
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lng": {
                "type": "number"
              },
              "location_type": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "place_id": {
                "type": ["string", "null"]
              },
              "precise": {
                "type": "boolean"
              },
              "property_ref": {
                "description": "Opaque locator for this exact lookup (C3): pass it back to design_yard so the review prepares against the same property. A locator, never a credential; it expires.",
                "type": ["string", "null"]
              },
              "satellite_image_url": {
                "type": ["string", "null"]
              },
              "street_view_available": {
                "type": "boolean"
              },
              "street_view_date": {
                "type": ["string", "null"]
              }
            },
            "required": ["address", "input_address", "lat", "lng", "message", "precise", "street_view_available"],
            "type": "object"
