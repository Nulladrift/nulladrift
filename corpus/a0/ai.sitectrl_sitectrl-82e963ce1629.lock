{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sitectrl/sitectrl": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.sitectrl.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "sitectrl",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "sitectrl builds and hosts real websites. create_site turns a plain-language description into a LIVE hosted site (1-3 min); edit_site changes it; write_site_files lets YOU author the code. Before editing files yourself call get_site_context (the site's notes, brand, pages and the parts every page must keep) and change pages with patch_site_file. Working contact/booking forms: POST to /_sc/form/submit with a hidden _form field — submissions reach the owner's dashboard + email (never mailto:). Sites also have a built-in data API (/_sc/data/<collection>: public_* readable by anyone, member_* needs a signed-in site member, bare names owner-only) and visitor accounts (/_sc/site-auth/register|login|logout|me) — use them for guestbooks, RSVPs, bookings, member areas; never invent your own storage or auth. search_domains finds real domains with prices; purchases hand the user a checkout link (the connector never spends money). get_analytics reads the site's private first-party traffic. Free tier: one site, no card.",
      "tools": [
        {
          "name": "add_component",
          "title": "Add a library component",
          "description": "Insert a component from the site's shared library into one or more existing pages, INSTEAD of hand-writing the markup yourself — the classes are already styled and themed to this site's colours. Choices: sc-page-title (the page's one <h1>), sc-gallery (cross-fading photo reel — needs 'images'), sc-info-tiles (title + picture + text sections — needs 'tiles'), sc-instructions (numbered/titled steps, optionally with a button each — needs 'tiles'), sc-event (one dated thing: a class, a session, an opening — needs 'title'), sc-btn (a link styled as a button — needs 'label'). NOT offered: sc-header/sc-footer (the site's own shell already emits those) or sc-hero (placed once, on the home page, by the site's own build). 'anchor' says where it goes: {\"type\": \"heading\", \"value\": \"<text on the page>\", \"position\": \"after\"} (default), {\"type\": \"id\", \"value\": \"<element id>\", \"position\": \"after\"}, {\"type\": \"main_end\"} (append at the end of the page), or {\"type\": \"replace\", \"value\": \"<class of an existing sc-* block>\"}. 'pages' is \"all\" or a list of paths from list_site_files. A page whose anchor doesn't match comes back in 'findings' with what's wrong and the fix — other pages in the same call still get the component. Follow with publish_site.",
          "inputSchema": {
            "properties": {
              "anchor": {
                "properties": {
                  "position": {
                    "description": "for heading/id anchors, default after",
                    "enum": ["before", "after"],
                    "type": "string"
                  },
                  "type": {
                    "enum": ["heading", "id", "main_end", "replace"],
                    "type": "string"
                  },
                  "value": {
                    "description": "heading text / element id / class to replace — not used for main_end",
                    "type": "string"
                  }
                },
                "required": ["type"],
                "type": "object"
              },
              "fields": {
                "description": "Component-specific content. sc-page-title: {text, eyebrow?}. sc-gallery: {images: [{src, alt}]}. sc-info-tiles: {tiles: [{title, img?, alt?, text}]}. sc-instructions: {title?, intro?, tiles: [{title?, body, img?, alt?, button?: [label, href]}]}. sc-event: {title, img?, meta?: [{label, value}], desc?, rsvp_href?, rsvp_label?}. sc-btn: {label, href}.",
                "type": "object"
              },
              "name": {
                "enum": ["sc-page-title", "sc-gallery", "sc-info-tiles", "sc-instructions", "sc-event", "sc-btn"],
                "type": "string"
              },
              "pages": {
                "description": "\"all\", or an array of page paths, e.g. [\"index.html\", \"about.html\"]",
                "oneOf": [
                  {
                    "enum": ["all"],
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  }
                ]
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["anchor", "fields", "name", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6134fd36b445ff3fd2f575c83e560268501ebb92ede22e8f655c8a5815b968db"
        },
        {
          "name": "create_site",
          "title": "Create a new site",
          "description": "Build a brand-new hosted website from a plain-language description. RETURNS IMMEDIATELY with status 'building' — the site takes about 2-3 minutes and is NOT ready when this returns. Tell the user where it will be (expected_url / live_url) and poll get_build_status — with the returned slug when signed in, with the returned claim_token for a guest build. NEVER call create_site a second time for the same site: each call builds another one. Works WITHOUT signing in: an unauthenticated call builds a guest site and returns a claim_url — the user signs up free (no card) at that link to keep it; unclaimed guest sites are deleted after 72 hours. Signed in, the site lands directly on the connected account (free tier: one site, no card).",
          "inputSchema": {
            "properties": {
              "contact_email": {
                "description": "Optional, guest builds only: the user's email — we send the site link and a reminder before the unclaimed site expires.",
                "type": "string"
              },
              "description": {
                "description": "What the site is for. MINIMUM 12 CHARACTERS — a bare 'bike shop' is rejected. Say what the business is, where it is, and what the site should include; the AI builds directly from this, so more detail means a better first result. Good: 'Oak Barrel Coffee, a small-batch roaster in Turlock CA — our story, three coffees with tasting notes and prices, and a contact form.' If the user was vague, ask them one question before calling this rather than sending two words.",
                "minLength": 12,
                "type": "string"
              },
              "site_name": {
                "description": "Short human name for the site, e.g. 'Whitney Apparel'.",
                "type": "string"
              },
              "template": {
                "description": "Optional override of the starting template. Omit it and the template is chosen from the description.",
                "enum": ["local-services", "restaurant", "shop", "portfolio", "classes", "community"],
                "type": "string"
              }
            },
            "required": ["description", "site_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:089726853a73add633d8c288b68dc908ea8e03d7ac63058216310ced611aa99d"
        },
        {
          "name": "edit_site",
          "title": "Edit site (AI developer)",
          "description": "Ask sitectrl's AI editor to change an existing site ('add a contact page', 'make the hero darker'). Edits land in the site's draft; the first build of a brand-new site goes straight live. Returns what changed plus the draft URL.",
          "inputSchema": {
            "properties": {
              "instruction": {
                "description": "The change to make, in plain language.",
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["instruction", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2421a1fdc0db67d9100e68c5f9dbf84348d05c232914424a9e958f09c762ca17"
        },
        {
