        },
        {
          "name": "search_domains",
          "title": "Search domains",
          "description": "Search real domain availability + prices (com/net/org/co/io/site and more). Available results include a purchase_url — hand it to the USER to complete checkout; the connector never spends money. Purchased domains connect to their sites in one click.",
          "inputSchema": {
