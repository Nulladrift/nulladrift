        {
          "name": "get_site_context",
          "title": "Get the site's editing context",
          "description": "CALL THIS BEFORE ANY WRITE. Returns what sitectrl's own editing agent knows about the site: its notes, brand tokens, page inventory, declared invariants, the platform-owned parts every page must keep (with the exact snippet and why), each HTML file's base_hash, and the edit rules (patch, never regenerate a whole file; writes land in the draft; publish_site goes live).",
          "inputSchema": {
            "properties": {
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
