        },
        {
          "name": "list_sites",
          "title": "List my sites",
          "description": "List the user's sitectrl sites with their live URLs and hosting platform.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aa9a8bc2ea24f00dddf865b375bb3c729278860eb5522a645136855b9c5f2d6c"
        },
        {
          "name": "patch_site_file",
          "title": "Edit part of a site file",
          "description": "Call get_site_context first. Change an existing draft file IN PLACE — the way to modify a page. Each edit is {find, replace} (swap exact text) or {after, insert} (add text right after an anchor); the anchor must appear exactly once in the current file, else nothing is written and you are told why. Edits apply in order. Prefer this to rewriting the page with write_site_files: whole-file rewrites from memory drop or duplicate things. Same checks as write_site_files (keep sc-track.js, data-sc-carry tags and the sc-badge block; no noindex / 'Disallow: /' on a site with its own domain). Optional base_hash (from read_site_file) refuses the edit if the file changed.",
          "inputSchema": {
            "properties": {
              "base_hash": {
                "type": "string"
              },
              "edits": {
                "items": {
                  "properties": {
                    "after": {
                      "type": "string"
                    },
                    "find": {
                      "type": "string"
                    },
                    "insert": {
                      "type": "string"
                    },
                    "replace": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "path": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["edits", "path", "slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ccb0811b2eb7b798e54da715bae6aea2c0144cff1f62b6c33dbb50ca88db9e3"
        },
