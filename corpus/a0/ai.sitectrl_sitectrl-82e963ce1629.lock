        },
        {
          "name": "get_build_status",
          "title": "Check a site build",
          "description": "Check whether a site started by create_site has finished. Signed in: pass the slug create_site returned (status building / built / failed). Guest build: pass the claim_token — works WITHOUT signing in. Poll this every 30-60 seconds rather than calling create_site again — a second create_site call builds a SECOND site.",
          "inputSchema": {
            "properties": {
              "claim_token": {
                "description": "Guest builds: the claim_token from create_site.",
                "type": "string"
              },
              "slug": {
                "description": "Signed in: the slug from create_site.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:03ed4edec301e1c72258ff4f57401b107dbc2bf46fd28c040a423f0a38782f9b"
        },
        {
          "name": "get_site",
          "title": "Get site details",
