        {
          "name": "find_clinics",
          "title": "Find clinics near a place",
          "description": "Clinics near a ZIP code or town, filtered by kind of care, way to pay (and a plan name), type of clinic, a language, and open now, today or on weekends. Clinics confirmed for the chosen payment come first, then by distance; claimed listings never rank higher. With open or language set, clinics that confirm them come ahead of clinics that don't say, and clinics whose hours show them closed are left out. Each clinic has its distance, address, phone, FindCare profile URL, the payment answer with its source, and today's hours. Up to 25 a call; pass next_cursor for more, up to 10 pages.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "care": {
                "default": "any",
                "description": "primary: checkups and sick visits. dental. mental: counseling and behavioral health. eye. surgery: outpatient surgery and procedures. family_planning: birth control, STI and pregnancy tests.",
                "enum": ["any", "primary", "dental", "mental", "eye", "surgery", "family_planning"],
                "type": "string"
              },
              "cursor": {
                "description": "next_cursor from the previous page of the same search.",
                "maxLength": 300,
                "type": "string"
              },
              "facility_type": {
                "enum": ["health_center", "surgery_center", "rural_health_clinic", "family_planning"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer text. Default: English, or Spanish when the client's locale is Spanish.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "language": {
                "description": "A language, such as \"Spanish\".",
                "maxLength": 40,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "near": {
                "description": "A 5-digit ZIP code or a town as \"City, ST\", for example \"Lilburn, GA\". Needed unless the client sends the user's approximate location.",
                "maxLength": 80,
                "type": "string"
              },
              "open": {
                "enum": ["now", "today", "weekend"],
                "type": "string"
              },
              "pays_with": {
                "description": "How the person pays. uninsured means no insurance.",
                "enum": ["medicaid", "medicare", "private", "uninsured"],
                "type": "string"
              },
              "plan": {
                "description": "An insurance company or plan name, such as \"Aetna\" or \"Peach State Health Plan\". Without pays_with it counts as private insurance.",
                "maxLength": 80,
                "type": "string"
              },
              "radius_miles": {
                "description": "How far to look. Default: the nearest 10, 25, 50 or 100 miles that hold at least five clinics.",
