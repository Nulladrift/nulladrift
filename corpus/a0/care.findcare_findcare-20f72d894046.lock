        {
          "name": "search",
          "title": "Search clinics",
          "description": "Search FindCare, a free directory of US clinics for people with Medicaid, Medicare or no insurance: community health centers, Medicare-certified surgery centers and rural health clinics, and Title X family planning clinics. Takes plain words, such as \"dentist that takes Medicaid near Lilburn, GA\" or \"sliding fee clinic 30047\", and reads a place (a 5-digit ZIP code, or a town with its state), a kind of care, a way to pay (Medicaid, Medicare, no insurance, or an insurance company), a type of clinic, a language and open hours. A clinic's name works too. Returns up to 10 clinics as id, title and FindCare profile URL, those confirmed for the payment first, then nearest; fetch gives each one's sourced facts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "Plain words: the kind of care, where (ZIP code or \"City, ST\"), and how the person pays.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
