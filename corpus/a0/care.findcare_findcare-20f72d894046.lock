      "serverInfo": {
        "name": "findcare",
        "title": "FindCare",
        "version": "1.0.0",
        "description": "Sourced facts on US clinics for people with Medicaid, Medicare or no insurance.",
        "websiteUrl": "https://findcare.care",
        "icons": [
          {
            "src": "https://findcare.care/static/website/img/favicon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
