      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FindCare (findcare.care) is a free directory of US outpatient clinics for people with Medicaid, Medicare or no insurance: community health centers (HRSA), Medicare-certified surgery centers and rural health clinics (CMS), and Title X family planning clinics. Each clinic record says whether it takes a way to pay and what care may cost, and every fact carries its source and date: a government record, a federal program rule, or the clinic's own website, quoted.\n\nFact statuses: program_rule (a federal rule every clinic of that type must follow, such as every health center taking Medicaid and charging less by income), record (a government record, such as a Medicare certification), site (the clinic's own website, quoted, with the page and the date it was read), organization (the website of the organization that runs the clinic, stated for all its locations), listing (Google's hours, only where the clinic's website gives none), and not_stated. A not_stated fact reads \"Not stated by the clinic. Call to ask:\" with the phone number; it means no source says either way.\n\nResults report what rules, records and clinics state. They are not eligibility decisions or medical advice. Clinic profiles are at https://findcare.care/providers/<slug>/, in Spanish under /es/, and answers come in English or Spanish. Each result carries an attribution line. Each user can read up to 1,500 clinic records a day. Nothing personal is stored.",
      "tools": [
        {
          "name": "check_coverage",
          "title": "Check whether a clinic takes a way to pay",
          "description": "Whether one clinic takes a way to pay, or a named plan, and where that comes from. answer is one of: program_rule_yes (a federal rule every clinic of its type must follow, such as every community health center taking Medicaid), record_yes (a government record, such as a Medicare certification), stated_yes or stated_no (the clinic's own website, quoted), organization_stated_yes (the website of the organization that runs the clinic, stated for all its locations, so this one is worth a call to confirm), or not_stated (no source says either way). Returns the quote, source URL, date read, phone and FindCare profile URL. A fact about the clinic, not a decision about anyone's eligibility.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The clinic: an id from search or find_clinics (FindCare ID or profile slug), a FindCare profile URL, a CMS certification number (CCN), an NPI, or an HRSA BPHC site number.",
                "maxLength": 300,
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer text. Default: English, or Spanish when the client's locale is Spanish.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "payer": {
                "description": "uninsured means no insurance.",
                "enum": ["medicaid", "medicare", "private", "uninsured"],
                "type": "string"
              },
              "plan": {
                "description": "An insurance company or plan name, for medicaid, medicare or private.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["id", "payer"],
