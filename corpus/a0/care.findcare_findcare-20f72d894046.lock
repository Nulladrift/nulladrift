        {
          "name": "report_correction",
          "title": "Report a correction",
          "description": "Send FindCare a report that a fact about a clinic is wrong or out of date: a phone number that does not work, hours or an address that changed, insurance it no longer takes, a clinic that closed. Nothing changes right away: a person checks each report against the clinic's own records or website before its FindCare page changes. Leave out names, contact details and health information. Returns a report id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "evidence_url": {
                "description": "A page that shows the right fact, such as the clinic's own site.",
                "maxLength": 1000,
                "type": "string"
              },
              "field": {
                "description": "What is wrong.",
                "enum": ["name", "address", "phone", "website", "hours", "medicaid", "medicare", "insurance", "uninsured", "sliding_fee", "new_patients", "services", "languages", "closed", "other"],
                "type": "string"
              },
              "id": {
                "description": "The clinic: an id from search or find_clinics (FindCare ID or profile slug), a FindCare profile URL, a CMS certification number (CCN), an NPI, or an HRSA BPHC site number.",
                "maxLength": 300,
                "type": "string"
              },
              "lang": {
                "description": "Language of the answer text. Default: English, or Spanish when the client's locale is Spanish.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "note": {
                "description": "What is wrong and how the reporter knows, in a sentence or two.",
                "maxLength": 1000,
                "type": "string"
              },
              "proposed_value": {
                "description": "What it should say, or \"unknown\" if only the current fact is wrong.",
                "maxLength": 500,
                "type": "string"
              },
              "reporter_role": {
                "enum": ["patient", "caregiver", "navigator", "clinic_staff", "other"],
                "type": "string"
              }
            },
            "required": ["field", "id", "note", "proposed_value", "reporter_role"],
            "type": "object"
          },
