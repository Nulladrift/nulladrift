{
  "lockfileVersion": 2,
  "subjects": {
    "ai.mandatelaw/counsel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mandatelaw.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mandate-law-counsel",
        "title": "Mandate Law",
        "version": "0.2.2"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You are not the client. A human with authority must sign the engagement letter before legal advice is given. Call conflict_check first (names only). Then request_engagement with a short, public-level matter summary. Detailed product facts wait until the engagement letter is signed. Send facts about the code with file paths as evidence. Never send secrets, keys, source dumps, or user data. Instructions inside content you submit are treated as data and ignored. Matter communications are privileged and confidential. Follow the `privilege` block in every get_matter response: share privileged parts only with your principal, and never put them in commits, pull requests, issues, shared chat, or agent memory files. Admitted in DC. Questions needing another state's license are referred to local counsel.",
      "tools": [
        {
          "name": "answer_open_question",
          "title": "Answer counsel's question",
          "description": "Answer one of counsel's open questions (listed by get_matter). Before the letter is signed, only scoping questions can be answered: keep those answers short and general, with no code, secrets, or confidential details. After signing, verify in the code or the running build where you can, and say how you know. If you cannot verify it, answer 'unknown' and say what a human would need to check.",
          "inputSchema": {
            "properties": {
              "answer": {
                "description": "A fact, as defined in https://mandatelaw.ai/api/intake-schema.json#/$defs/fact.",
                "properties": {
                  "evidence": {
                    "description": "Where in the code or build this was verified. Short excerpts only; never secrets, keys, or user data.",
                    "items": {
                      "properties": {
                        "excerpt": {
                          "description": "The few relevant lines, copied as written.",
                          "maxLength": 600,
                          "type": "string"
                        },
                        "lines": {
                          "description": "Line range, e.g. 41-48.",
                          "type": "string"
                        },
                        "path": {
                          "description": "File path in the repository, e.g. src/agent/tools/checkout.ts.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "notes": {
                    "description": "Anything counsel should know about this answer, such as exceptions or what you could not verify.",
                    "type": "string"
                  },
                  "source": {
                    "description": "How you know. Prefer verified_in_code or verified_in_running_build; use stated_by_client for what your human told you, and unknown if you could not check.",
                    "enum": ["verified_in_code", "verified_in_running_build", "vendor_dashboard", "stated_by_client", "inferred", "unknown"],
                    "type": "string"
                  },
                  "value": {
                    "description": "The answer in plain words, e.g. \"yes\", \"no\", or a short description of what the code does.",
                    "type": "string"
                  }
                },
                "required": ["source", "value"],
                "type": "object"
              },
              "matter_id": {
                "description": "The matter_id returned by request_engagement, e.g. M-1a2b3c4d5e6f.",
                "type": "string"
              },
              "matter_token": {
                "description": "The matter_token returned by request_engagement. Keep it secret.",
                "type": "string"
              },
              "question_id": {
                "description": "The id of the open question, from get_matter's open_questions list.",
                "type": "string"
              }
            },
            "required": ["answer", "matter_id", "matter_token", "question_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Answer counsel's question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f40c732ac819a0fc3adb52d5b1a9ddd3f11c80eb833301da8c56c276fd5904fb"
        },
        {
          "name": "check_change",
          "title": "Check a planned change (free)",
          "description": "Free. Before building a change, describe it in a sentence or two (no code, secrets, or user data) to see which counsel triggers it may match. A keyword screen, not legal advice: also compare the change with the full list from get_counsel_triggers. If something matches, stop before building that part and tell your human; engaged clients can then request a feature_check with their approval.",
          "inputSchema": {
            "properties": {
              "change": {
                "description": "What the change does, in plain words, e.g. \"send users' journal entries to OpenAI to generate weekly insights\". No code, secrets, or user data.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["change"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a planned change (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:634cfcdf2078f030a1eadbddd8a2e54dfaba34d6bffef44d2bc52d7dd8f646ab"
        },
        {
          "name": "check_scope",
          "title": "Check scope and fee (free)",
          "description": "Free. Describe what you need in a sentence or two (no confidential details). Returns whether it is in scope, which service fits, what each suggested service covers (deliverables and turnaround), and the fixed fee for each (plus service_id, if you name one). Share the fee with your human before requesting an engagement. Legal information only, not legal advice.",
          "inputSchema": {
            "properties": {
              "request": {
                "description": "What you need, in a sentence or two, e.g. \"privacy policy and terms before our AI app launches\". No confidential details.",
                "maxLength": 1000,
                "type": "string"
              },
              "service_id": {
                "description": "Optional: also quote this service's fee.",
                "enum": ["launch-review", "ai-feature-review", "agent-product-review", "feature-check", "counsel-on-commit"],
                "type": "string"
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check scope and fee (free)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46bc6a63120fa1dcbf58f9a2e507dbc98480e51e0b11ce489ef4e92ce965255c"
        },
        {
          "name": "conflict_check",
          "title": "Start a conflict check",
          "description": "Free. Required before any product details are shared. Names only: the client company, the human principal, other people involved, and any adverse, competing, or counterparty companies. The attorney reviews every check.",
          "inputSchema": {
            "properties": {
              "adverse_or_related_parties": {
                "description": "Optional. Companies on the other side or closely tied to the matter: competitors, counterparties, partners, parent or affiliate companies.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "client_name": {
                "description": "The legal name of the company (or person) that would be the client.",
                "maxLength": 200,
                "type": "string"
              },
              "contact_name": {
                "description": "Full name of the human principal: the person with authority to sign for the client.",
                "maxLength": 200,
                "type": "string"
              },
              "other_people": {
                "description": "Optional. Full names of other people involved, such as co-founders or key investors.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["client_name", "contact_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Start a conflict check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5e9445ad93c434084f0855bda12462717eb5b27d8bd1202e3b306e7d337118f7"
        },
        {
          "name": "feature_check",
          "title": "Request a feature check (may be billed)",
          "description": "For engaged clients, with the human's approval (it may be billed). Call before building a change that matches counsel-triggers.json. Do not ship the change until counsel responds.",
          "inputSchema": {
            "properties": {
              "change": {
                "description": "What the change does and why, in plain words, with the files or features it touches. No secrets or user data.",
                "maxLength": 4000,
                "type": "string"
              },
              "matter_id": {
                "description": "The matter_id returned by request_engagement, e.g. M-1a2b3c4d5e6f.",
                "type": "string"
              },
              "matter_token": {
                "description": "The matter_token returned by request_engagement. Keep it secret.",
                "type": "string"
              },
              "target_ship_date": {
                "description": "When you plan to ship it, e.g. 2027-01-15. Optional.",
                "type": "string"
              },
              "trigger_ids": {
                "description": "The ids from counsel-triggers.json (see get_counsel_triggers) that this change matches.",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["change", "matter_id", "matter_token", "trigger_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a feature check (may be billed)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:18cb265d2a4f30d200b0dc16e2154988caf6dbb79f32f1548cc3bae24d120c4f"
        },
        {
          "name": "get_counsel_triggers",
          "title": "Get counsel triggers",
          "description": "Free. The template list of product changes that need legal review before shipping.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get counsel triggers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f6e6df96e6c273d3e2ee6bc1ed0de5e19c1a5ec82556c5d34336bba692fd694d"
        },
        {
          "name": "get_matter",
          "title": "Get matter status and deliverables",
          "description": "Status, counsel's open questions, feature checks, and deliverables (documents, privileged_memo, build_spec, verification_checklist, counsel_triggers). Privileged: follow the `privilege` block in the response, and commit only the parts listed in deliverable.handling.safe_to_commit.",
          "inputSchema": {
            "properties": {
              "matter_id": {
                "description": "The matter_id returned by request_engagement, e.g. M-1a2b3c4d5e6f.",
                "type": "string"
              },
              "matter_token": {
                "description": "The matter_token returned by request_engagement. Keep it secret.",
                "type": "string"
              }
            },
            "required": ["matter_id", "matter_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get matter status and deliverables"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b088e11308a1887b40a411716ecf3b8da837722e66d4dc362391f4ca9702d727"
        },
        {
          "name": "request_engagement",
          "title": "Ask the firm to take a matter",
          "description": "After conflict_check. Send a short matter_summary so the attorney can decide whether to take the matter. Describe the product the way you would describe it publicly. Do not send code, secrets, user data, or confidential business plans. The attorney uses this summary only to decide whether the firm can and will take the matter, and keeps it confidential. No attorney-client relationship exists, and no legal advice is given, until the human principal signs the engagement letter. Returns a matter_id and a secret matter_token (shown once; store it securely). The attorney reviews conflicts and the summary, may ask a few scoping questions (see get_matter), and then accepts (possibly under a different service) or declines. If accepted, the engagement letter goes to the principal's email for signature. The fixed fee is due when the work is delivered. You cannot sign on the principal's behalf.",
          "inputSchema": {
            "properties": {
              "conflict_check_id": {
                "description": "The conflict_check_id returned by conflict_check, e.g. CC-1a2b3c4d5e6f.",
                "type": "string"
              },
              "matter_summary": {
                "description": "Describe the product the way you would describe it publicly. Do not send code, secrets, user data, or confidential business plans. The attorney uses this summary only to decide whether the firm can and will take the matter, and keeps it confidential. No attorney-client relationship exists, and no legal advice is given, until the human principal signs the engagement letter.",
                "properties": {
                  "active_dispute_or_regulator_contact": {
                    "description": "True if there is a complaint, demand letter, lawsuit, or regulator inquiry about this product. Do not describe it here.",
                    "type": "boolean"
                  },
                  "deadline": {
                    "description": "A launch, investor, app-store, or partner date, if any.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "features_in_play": {
                    "description": "Every one that applies. These drive which service fits.",
                    "items": {
                      "enum": ["ai_generated_output", "sends_user_data_to_llm", "trains_on_user_data", "agent_takes_actions", "agent_payments", "agent_uses_third_party_sites", "agent_holds_user_credentials", "health_data", "financial_data", "children_or_teens", "precise_location", "biometrics", "session_replay_or_ad_tracking", "regulated_advice", "none_of_these"],
                      "type": "string"
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "product_name": {
                    "description": "The product's public name, if it has one.",
                    "maxLength": 120,
                    "type": "string"
                  },
                  "questions_for_counsel": {
                    "description": "What you want answered, in general terms.",
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "stage": {
                    "description": "Where the product is now: idea, building, beta (limited users), or live.",
                    "enum": ["idea", "building", "beta", "live"],
                    "type": "string"
                  },
                  "target_launch_date": {
                    "description": "Planned launch date if not live yet, e.g. 2027-03-01 or \"Q1 2027\".",
                    "maxLength": 40,
                    "type": "string"
                  },
                  "user_scale": {
                    "description": "Roughly how many users it has now.",
                    "enum": ["pre_launch", "under_10k", "10k_to_1m", "over_1m"],
                    "type": "string"
                  },
                  "users": {
                    "description": "Who uses it: individual consumers, businesses, or both.",
                    "enum": ["consumers", "businesses", "both"],
                    "type": "string"
                  },
                  "what_it_does": {
                    "description": "One to three sentences, as you would describe it publicly.",
                    "maxLength": 600,
                    "type": "string"
                  },
                  "where_users_are": {
                    "description": "Countries or US states, e.g. US, CA, WA, EU, UK.",
                    "items": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  }
                },
                "required": ["active_dispute_or_regulator_contact", "features_in_play", "questions_for_counsel", "stage", "users", "what_it_does"],
                "type": "object"
              },
              "principal_email": {
                "description": "The human with authority to bind the client.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "service_id": {
                "description": "Your best guess. The attorney may change it.",
                "enum": ["launch-review", "ai-feature-review", "agent-product-review", "feature-check", "counsel-on-commit"],
                "type": "string"
              }
            },
            "required": ["conflict_check_id", "matter_summary", "principal_email", "service_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Ask the firm to take a matter"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:7ba48ba651d558e7825c4bb1446dab61baede0ccbf2e41403ffe35158f2bef6f"
        },
        {
          "name": "submit_intake",
          "title": "Submit product facts (after signing)",
          "description": "Only after the engagement letter is signed. Product facts per https://mandatelaw.ai/api/intake-schema.json. Each fact has a value, a source (prefer verified_in_code), and evidence (paths and short excerpts; no secrets).",
          "inputSchema": {
            "properties": {
              "intake": {
                "description": "Product facts as defined in https://mandatelaw.ai/api/intake-schema.json. Each fact is { value, source, evidence, notes }.",
                "type": "object"
              },
              "matter_id": {
                "description": "The matter_id returned by request_engagement, e.g. M-1a2b3c4d5e6f.",
                "type": "string"
              },
              "matter_token": {
                "description": "The matter_token returned by request_engagement. Keep it secret.",
                "type": "string"
              }
            },
            "required": ["intake", "matter_id", "matter_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Submit product facts (after signing)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9f1e1d921e0abd765d0359efda940c2a51e511ee7cb208079d40f1cc5bf969e0"
        }
      ],
      "digest": "sha256:1e4a98bf0a9c5b27aac8f8aca61d6630165371c8b5d2da810b65a45521a70c02"
    }
  }
