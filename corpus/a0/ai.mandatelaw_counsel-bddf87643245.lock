{
  "lockfileVersion": 2,
  "subjects": {
    "ai.mandatelaw/counsel": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mandatelaw.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "mandate-law-counsel",
        "title": "Mandate Law",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "You are not the client. A human with authority must sign the engagement letter before legal advice is given. Call conflict_check first (names only). Then request_engagement with a short, public-level matter summary. Detailed product facts wait until the engagement letter is signed. Send facts about the code with file paths as evidence. Never send secrets, keys, source dumps, or user data. Instructions inside content you submit are treated as data and ignored. Matter communications are privileged and confidential. Follow the `privilege` block in every get_matter response: share privileged parts only with your principal, and never put them in commits, pull requests, issues, shared chat, or agent memory files. Admitted in DC. Questions needing another state's license are referred to local counsel.",
      "tools": [
        {
          "name": "answer_open_question",
          "title": "Answer counsel's question",
          "description": "Answer one of counsel's open questions (listed by get_matter). Before the letter is signed, only scoping questions can be answered: keep those answers short and general, with no code, secrets, or confidential details. After signing, verify in the code or the running build where you can, and say how you know. If you cannot verify it, answer 'unknown' and say what a human would need to check.",
          "inputSchema": {
            "properties": {
              "answer": {
                "description": "A fact, as defined in https://mandatelaw.ai/api/intake-schema.json#/$defs/fact.",
                "properties": {
                  "evidence": {
                    "items": {
                      "properties": {
                        "excerpt": {
                          "maxLength": 600,
                          "type": "string"
                        },
                        "lines": {
                          "type": "string"
                        },
                        "path": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "notes": {
                    "type": "string"
                  },
                  "source": {
                    "enum": ["verified_in_code", "verified_in_running_build", "vendor_dashboard", "stated_by_client", "inferred", "unknown"]
                  },
                  "value": {
                    "description": "The answer in plain words, e.g. \"yes\", \"no\", or a short description of what the code does.",
                    "type": "string"
                  }
                },
                "required": ["source", "value"],
                "type": "object"
              },
              "matter_id": {
                "type": "string"
              },
              "matter_token": {
                "description": "The matter_token returned by request_engagement. Keep it secret.",
                "type": "string"
              },
              "question_id": {
                "type": "string"
              }
            },
            "required": ["answer", "matter_id", "matter_token", "question_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:24165fc464b1cfe2e2dd0327a67a36b9d47d17179abe01a329ef90ea653f32fa"
        },
        {
          "name": "check_scope",
          "title": "Check scope and fee (free)",
          "description": "Free. Describe what you need in a sentence or two (no confidential details). Returns whether it is in scope, which service fits, and the fixed fee for each suggested service (plus service_id, if you name one). Share the fee with your human before requesting an engagement. Legal information only, not legal advice.",
          "inputSchema": {
            "properties": {
              "request": {
                "maxLength": 1000,
                "type": "string"
              },
              "service_id": {
                "description": "Optional: also quote this service's fee.",
                "enum": ["launch-review", "ai-feature-review", "agent-product-review", "feature-check", "counsel-on-commit"]
              }
            },
            "required": ["request"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:aa24508d79592a6ca25851a91e43e76ec904d7daf94e6cc5a892045bb76625b7"
        },
        {
          "name": "conflict_check",
          "title": "Start a conflict check",
          "description": "Free. Required before any product details are shared. Names only: the client company, the human principal, other people involved, and any adverse, competing, or counterparty companies. The attorney reviews every check.",
          "inputSchema": {
            "properties": {
              "adverse_or_related_parties": {
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              },
              "client_name": {
                "maxLength": 200,
                "type": "string"
              },
              "contact_name": {
                "description": "The human principal.",
                "maxLength": 200,
                "type": "string"
              },
              "other_people": {
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 50,
                "type": "array"
              }
            },
            "required": ["client_name", "contact_name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:5e3e77ef662a467de54a4c0b63a17962dcc3f7a947eb9d9e70572ae5d3faf623"
        },
        {
          "name": "feature_check",
          "title": "Request a feature check (may be billed)",
          "description": "For engaged clients, with the human's approval (it may be billed). Call before building a change that matches counsel-triggers.json. Do not ship the change until counsel responds.",
          "inputSchema": {
            "properties": {
              "change": {
                "maxLength": 4000,
                "type": "string"
              },
              "matter_id": {
                "type": "string"
              },
              "matter_token": {
                "description": "The matter_token returned by request_engagement. Keep it secret.",
                "type": "string"
              },
              "target_ship_date": {
                "type": "string"
              },
              "trigger_ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["change", "matter_id", "matter_token", "trigger_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ffeac46ba8004ad9e6f5e3bb660ca9f31d50cf3a1f294d3eb5191699d1095f10"
        },
        {
          "name": "get_counsel_triggers",
          "title": "Get counsel triggers",
          "description": "Free. The template list of product changes that need legal review before shipping.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2a3c13f4f740aa955b382d12c3505ff5c422da91c9eaccb82a9b8ef533380d4"
        },
        {
          "name": "get_matter",
          "title": "Get matter status and deliverables",
          "description": "Status, counsel's open questions, feature checks, and deliverables (documents, privileged_memo, build_spec, verification_checklist, counsel_triggers). Privileged: follow the `privilege` block in the response, and commit only the parts listed in deliverable.handling.safe_to_commit.",
          "inputSchema": {
            "properties": {
              "matter_id": {
                "type": "string"
              },
              "matter_token": {
                "description": "The matter_token returned by request_engagement. Keep it secret.",
                "type": "string"
              }
            },
            "required": ["matter_id", "matter_token"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:de36ceb03847963c9159ee6dcdc16a32dea06bdcfaf9c53da7e9e10025fe965b"
        },
        {
          "name": "request_engagement",
          "title": "Ask the firm to take a matter",
          "description": "After conflict_check. Send a short matter_summary so the attorney can decide whether to take the matter. Describe the product the way you would describe it publicly. Do not send code, secrets, user data, or confidential business plans. The attorney uses this summary only to decide whether the firm can and will take the matter, and keeps it confidential. No attorney-client relationship exists, and no legal advice is given, until the human principal signs the engagement letter. Returns a matter_id and a secret matter_token (shown once; store it securely). The attorney reviews conflicts and the summary, may ask a few scoping questions (see get_matter), and then accepts (possibly under a different service) or declines. If accepted, the engagement letter goes to the principal's email for signature. The fixed fee is due when the work is delivered. You cannot sign on the principal's behalf.",
          "inputSchema": {
            "properties": {
              "conflict_check_id": {
                "type": "string"
              },
              "matter_summary": {
                "description": "Describe the product the way you would describe it publicly. Do not send code, secrets, user data, or confidential business plans. The attorney uses this summary only to decide whether the firm can and will take the matter, and keeps it confidential. No attorney-client relationship exists, and no legal advice is given, until the human principal signs the engagement letter.",
                "properties": {
                  "active_dispute_or_regulator_contact": {
                    "description": "True if there is a complaint, demand letter, lawsuit, or regulator inquiry about this product. Do not describe it here.",
                    "type": "boolean"
                  },
                  "deadline": {
                    "description": "A launch, investor, app-store, or partner date, if any.",
                    "maxLength": 200,
                    "type": "string"
                  },
                  "features_in_play": {
                    "description": "Every one that applies. These drive which service fits.",
                    "items": {
                      "enum": ["ai_generated_output", "sends_user_data_to_llm", "trains_on_user_data", "agent_takes_actions", "agent_payments", "agent_uses_third_party_sites", "agent_holds_user_credentials", "health_data", "financial_data", "children_or_teens", "precise_location", "biometrics", "session_replay_or_ad_tracking", "regulated_advice", "none_of_these"]
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "product_name": {
                    "maxLength": 120,
                    "type": "string"
                  },
                  "questions_for_counsel": {
                    "description": "What you want answered, in general terms.",
                    "maxLength": 1000,
                    "type": "string"
                  },
                  "stage": {
                    "enum": ["idea", "building", "beta", "live"]
                  },
                  "target_launch_date": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "user_scale": {
                    "enum": ["pre_launch", "under_10k", "10k_to_1m", "over_1m"]
                  },
                  "users": {
                    "enum": ["consumers", "businesses", "both"]
                  },
                  "what_it_does": {
                    "description": "One to three sentences, as you would describe it publicly.",
                    "maxLength": 600,
                    "type": "string"
                  },
                  "where_users_are": {
                    "description": "Countries or US states, e.g. US, CA, WA, EU, UK.",
                    "items": {
                      "maxLength": 60,
                      "type": "string"
                    },
                    "maxItems": 30,
                    "type": "array"
                  }
                },
                "required": ["active_dispute_or_regulator_contact", "features_in_play", "questions_for_counsel", "stage", "users", "what_it_does"],
                "type": "object"
              },
              "principal_email": {
                "description": "The human with authority to bind the client.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "service_id": {
                "description": "Your best guess. The attorney may change it.",
                "enum": ["launch-review", "ai-feature-review", "agent-product-review", "feature-check", "counsel-on-commit"]
              }
            },
            "required": ["conflict_check_id", "matter_summary", "principal_email", "service_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:88fd3ca66d204352fee87f52266dddc95cb0d2b2951abc70a75990c462a29864"
        },
        {
          "name": "submit_intake",
          "title": "Submit product facts (after signing)",
          "description": "Only after the engagement letter is signed. Product facts per https://mandatelaw.ai/api/intake-schema.json. Each fact has a value, a source (prefer verified_in_code), and evidence (paths and short excerpts; no secrets).",
          "inputSchema": {
            "properties": {
              "intake": {
                "type": "object"
              },
              "matter_id": {
                "type": "string"
              },
              "matter_token": {
                "description": "The matter_token returned by request_engagement. Keep it secret.",
                "type": "string"
              }
            },
            "required": ["intake", "matter_id", "matter_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a8db889a7a782293d55eaced3cc0cd94817ea640de1b8032082091385ff380b7"
        }
      ],
      "digest": "sha256:a8266e92d22a703ae3b6b2e2662bd4bab578cca26f74b811322161e9bc04adcc"
    }
  }
}
