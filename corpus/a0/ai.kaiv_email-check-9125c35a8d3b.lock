{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kaiv/email-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.kaiv.ai/api/bridge/mcp/email-check-b6ab5250"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "email-check",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "\"email-check\" is a governed MCP server hosted by Kaiva Bridge. Tools carry a JSON Schema for both input and, where the source documents one, output. Read inputSchema before calling rather than guessing argument names. Every tool here is read-only unless its annotations say otherwise — check readOnlyHint and destructiveHint before calling. A failed call returns isError with a machine-readable `error` code and a message saying whether to fix the arguments, wait, or stop retrying.",
      "tools": [
        {
          "name": "check_email_domain",
          "title": "Check Email Domain",
          "description": "Full email posture for a domain: can it receive mail, and can it be spoofed?\n\nRuns MX, SPF and DMARC lookups together and returns a plain-language verdict alongside the raw records: can_receive_mail, spoofable, and a list of specific findings. Use this as the default check before emailing an unfamiliar domain, when judging whether inbound mail claiming to be from a domain could be forged, or when auditing your own domains. Prefer this over the single-record tools unless you already know which record you need.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain to check, e.g. \"example.com\". A full email address is accepted and the domain is taken from it.",
                "example": "kaiv.ai",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "can_receive_mail": {
                "description": "False when the domain publishes no MX records.",
                "type": "boolean"
              },
              "checked_at": {
                "format": "date-time",
                "type": "string"
              },
              "dmarc": {
                "properties": {
                  "all_records": {
                    "description": "Present only when more than one DMARC record exists.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "found": {
                    "type": "boolean"
                  },
                  "meaning": {
                    "type": "string"
                  },
                  "multiple_records": {
                    "description": "RFC 7489 requires receivers to apply NO policy when more than one record exists.",
                    "type": "boolean"
                  },
                  "percent": {
                    "description": "The pct= tag; defaults to 100.",
                    "type": "integer"
                  },
                  "policy": {
                    "description": "\"ignored\" means duplicate records cancelled the policy out.",
                    "enum": ["none", "quarantine", "reject", "ignored", "unspecified"],
                    "type": "string"
                  },
                  "protects": {
                    "description": "False for p=none (monitoring only) and for duplicate records.",
                    "type": "boolean"
                  },
                  "record": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "domain": {
                "type": "string"
              },
              "findings": {
                "description": "One line per specific problem; empty when the domain is correctly configured.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "mx": {
                "properties": {
                  "found": {
                    "description": "Whether any MX record exists.",
                    "type": "boolean"
                  },
                  "hosts": {
                    "description": "MX hosts, lowest priority first.",
                    "items": {
                      "properties": {
                        "host": {
                          "description": "Mail exchanger hostname.",
                          "type": "string"
                        },
                        "priority": {
                          "description": "Lower is preferred.",
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "spf": {
                "properties": {
                  "found": {
                    "type": "boolean"
                  },
                  "meaning": {
                    "description": "What the qualifier means in practice.",
                    "type": "string"
                  },
                  "multiple_records": {
                    "description": "More than one SPF record: receivers treat this as permerror, so SPF effectively fails.",
                    "type": "boolean"
                  },
                  "qualifier": {
                    "description": "The qualifier on the `all` mechanism.",
                    "enum": ["fail", "softfail", "neutral", "pass", "unspecified"],
                    "type": "string"
                  },
                  "record": {
                    "description": "The raw SPF TXT record, or null when absent.",
                    "type": "string"
                  },
                  "strict": {
                    "description": "True only for `-all`, the one strict answer.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "spoofable": {
                "description": "True unless DMARC is present AND at an enforcing policy. Deliberately conservative: without enforcement a receiver has no instruction to reject forged mail, however good the SPF record is.",
                "type": "boolean"
              },
              "summary": {
                "description": "Plain-language verdict.",
                "type": "string"
              }
            },
            "required": ["can_receive_mail", "domain", "spoofable", "summary"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Check Email Domain"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4b4e616156e14ac433c63ac301d5fd5c6b81fa590f8f7b1da81a2e7ef930ef45"
        },
        {
          "name": "get_dmarc_record",
          "title": "Get Dmarc Record",
          "description": "DMARC record, policy, and whether it actually protects.\n\nReturns the DMARC TXT record at _dmarc.<domain>, its policy (none / quarantine / reject), the percentage it applies to, and whether that policy protects against spoofing. Also flags the case of MULTIPLE DMARC records, which RFC 7489 requires receivers to treat as no policy at all — a domain in that state is unprotected however strict its records look. A policy of \"none\" is monitoring only and does not stop forged mail. Use when assessing whether mail claiming to be from a domain can be trusted.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain to check, e.g. \"example.com\". A full email address is accepted and the domain is taken from it.",
                "example": "kaiv.ai",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "all_records": {
                "description": "Present only when more than one DMARC record exists.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "meaning": {
                "type": "string"
              },
              "multiple_records": {
                "description": "RFC 7489 requires receivers to apply NO policy when more than one record exists.",
                "type": "boolean"
              },
              "percent": {
                "description": "The pct= tag; defaults to 100.",
                "type": "integer"
              },
              "policy": {
                "description": "\"ignored\" means duplicate records cancelled the policy out.",
                "enum": ["none", "quarantine", "reject", "ignored", "unspecified"],
                "type": "string"
              },
              "protects": {
                "description": "False for p=none (monitoring only) and for duplicate records.",
                "type": "boolean"
              },
              "record": {
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Dmarc Record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d1c59ed500ca74163b0754a88092170f88fbb71cb9d6b65f592f088641fc5a02"
        },
        {
          "name": "get_mx_records",
          "title": "Get Mx Records",
          "description": "Mail exchanger records for a domain.\n\nReturns the MX hosts in priority order and whether any exist. A domain with no MX records cannot receive mail, so sending to it will bounce. Use when you only need deliverability and not spoofing posture; use check_email_domain for the full picture.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain to check, e.g. \"example.com\". A full email address is accepted and the domain is taken from it.",
                "example": "kaiv.ai",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "can_receive_mail": {
                "type": "boolean"
              },
              "domain": {
                "type": "string"
              },
              "found": {
                "description": "Whether any MX record exists.",
                "type": "boolean"
              },
              "hosts": {
                "description": "MX hosts, lowest priority first.",
                "items": {
                  "properties": {
                    "host": {
                      "description": "Mail exchanger hostname.",
                      "type": "string"
                    },
                    "priority": {
                      "description": "Lower is preferred.",
                      "type": "integer"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Mx Records"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b2c0388cf2dba8a3f4d312674d921ff4b91f5c9aaf0c5fef0af2f58553efec4d"
        },
        {
          "name": "get_spf_record",
          "title": "Get Spf Record",
          "description": "SPF record and how strict it is.\n\nReturns the SPF TXT record, the qualifier on its `all` mechanism (fail / softfail / neutral / pass) and what that means in practice, plus whether more than one SPF record exists — which receivers treat as an error, leaving the domain unprotected. Use when diagnosing why mail from a domain is being rejected or marked.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Domain to check, e.g. \"example.com\". A full email address is accepted and the domain is taken from it.",
                "example": "kaiv.ai",
                "type": "string",
                "x-in": "query"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "domain": {
                "type": "string"
              },
              "found": {
                "type": "boolean"
              },
              "meaning": {
                "description": "What the qualifier means in practice.",
                "type": "string"
              },
              "multiple_records": {
                "description": "More than one SPF record: receivers treat this as permerror, so SPF effectively fails.",
                "type": "boolean"
              },
              "qualifier": {
                "description": "The qualifier on the `all` mechanism.",
                "enum": ["fail", "softfail", "neutral", "pass", "unspecified"],
                "type": "string"
              },
              "record": {
                "description": "The raw SPF TXT record, or null when absent.",
                "type": "string"
              },
              "strict": {
                "description": "True only for `-all`, the one strict answer.",
                "type": "boolean"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Spf Record"
          },
          "behavior": {
