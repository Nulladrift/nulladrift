          },
          "digest": "sha256:d9534e3328ebd3ac17a67760242b7dec8a286d05db9570c94cf52a8b65646d7f"
        },
        {
          "name": "get_cost_decoder",
          "title": "Get cost decoder",
          "description": "The REAL all-in monthly cost per vendor for a decoder topic (slug from list_cost_decoders, e.g. 'ai-customer-support-cost'), computed in deterministic code from sourced, dated inputs — each vendor's per-seat price + AI billing model + per-unit price, totalled at named scenarios (e.g. 5 agents at 1,000 and 5,000 AI resolutions/mo) with the arithmetic shown. Quote-only inputs return a null total, never a fabricated number. Optionally pass agents + resolutions for a custom scenario. It answers 'what does <AI tool> actually cost'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "agents": {
                "description": "Optional: agents/seats for a custom scenario.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "resolutions": {
                "description": "Optional: AI resolutions/mo for a custom scenario.",
                "minimum": 0,
                "type": "number"
              },
              "topic": {
                "description": "Decoder slug from list_cost_decoders (e.g. 'ai-customer-support-cost').",
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be627f17f6c5935f6e5de82db1575b971cb7aac69472ba5c9d0fda9446dae713"
        },
        {
          "name": "get_independent_test_coverage",
          "title": "Get independent test coverage",
          "description": "The independent-testing provenance for ONE product (by category + slug) — a COUNT of evidence, never a quality score. Fields: outlets (independent outlets on record), labs (how many physically tested it and left >=1 measured value), metrics (distinct kinds of metric measured, with names), mentioned (outlets that only mentioned it), and `reading`, the same counts in words. A low count means little independent evidence has been gathered yet, NOT that the product is bad; a high count means well-documented, NOT better. Returns found:false (never a fabricated count) for an unknown or unreviewed product.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Product category slug (e.g. 'action-cameras', '3d-printers').",
                "type": "string"
              },
              "slug": {
                "description": "Product slug (e.g. 'dji-osmo-action-5-pro').",
                "type": "string"
              }
            },
            "required": ["category", "slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b9a873c5e21725c555a4c266e8bc9eb1aabe0bf31f51dc377fe754ca0eae3976"
        },
        {
          "name": "get_normalized_pricing",
          "title": "Get normalized pricing",
          "description": "Effective monthly cost per vendor in any theme at a chosen call volume, normalizing flat, per-minute and per-call billing to one comparable number. For non-telephony catalog themes (per-seat / flat plans with no call quota) this returns each plan's base monthly price — the meaningful figure there. Cheapest priceable plan per vendor; quote-only or unpriceable-at-volume vendors return null (never a fabricated figure). avgCallMinutes defaults to 3 and is echoed in assumptions for reproducibility.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "avgCallMinutes": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "callsPerMonth": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "section": {
                "description": "Theme slug to query (default \"ai-receptionists\"). A theme is any of the 275 pricing topics this index covers: the deep hub sections (e.g. ai-receptionists) plus the many catalog topics (e.g. vpn-services, web-hosting, password-managers). list_sections and list_coverage return the full slug list.",
                "type": "string"
              }
            },
            "required": ["callsPerMonth"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8bfc2165208eccec2c47b0b45828bb5bd57a5e402026a0e15befd7f00ad69c90"
        },
        {
          "name": "get_price_history",
          "title": "Get price history",
          "description": "The full dated price series for ONE product or vendor (by slug), plus derived stats: first-tracked date, current/low/high, number of recorded changes, net %, the largest single move, and the last change. A change is counted only between two consecutive price-scan readings of the same site; low, high and net % are measured over those readings, since comparableSince where a correction of ours or a change of the source the price is read off cut the series, and no move is counted across such a cut or from a figure our record wrote without a reading. It answers 'how much did X cost', 'did X's price drop' and price-trend questions from the recorded series. Returns found:false (never a fabricated series) for an unknown slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "description": "Limit to 'hw' (hardware product) or 'sw' (software vendor). Omit to match either; a slug is resolved across both.",
                "enum": ["hw", "sw"],
                "type": "string"
              },
              "slug": {
                "description": "Product or vendor slug (e.g. 'bambu-lab-a1', 'goodcall').",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f0281bf9abf7e49398b04406d0dedbb5b3bf1675ebd5722b46c7abe38d18353"
        },
