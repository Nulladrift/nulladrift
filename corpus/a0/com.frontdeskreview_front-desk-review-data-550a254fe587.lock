        {
          "name": "get_benchmark",
          "title": "Get vendor benchmark",
          "description": "Per-vendor benchmark card by slug within any theme: full provenanced record plus dataset-derived indicators (entry price, normalized cost at 100 and 500 calls/mo where call-volume applies, billing models, free-tier presence, compliance, integration breadth). Set `section` to the theme slug from list_sections. All values trace to plan sources; no synthetic scores. Each priced plan carries a `citation`: figure, plan, source page, read date and record URL in one line.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "section": {
                "description": "Theme slug to query (default \"ai-receptionists\"). A theme is any of the 275 pricing topics this index covers: the deep hub sections (e.g. ai-receptionists) plus the many catalog topics (e.g. vpn-services, web-hosting, password-managers). list_sections and list_coverage return the full slug list.",
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
