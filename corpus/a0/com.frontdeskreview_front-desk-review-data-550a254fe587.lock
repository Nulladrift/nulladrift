      "tools": [
        {
          "name": "compare",
          "title": "Compare vendors",
          "description": "Compare specific vendors side by side by slug within any theme (e.g. ['goodcall','rosie','smith-ai'] in ai-receptionists, or ['nordvpn','expressvpn'] in vpn-services). Set `section` to the theme slug from list_sections. Returns full provenanced records plus a notFound list for unknown slugs. Each priced plan carries a `citation`: figure, plan, source page, read date and record URL in one line.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "section": {
                "description": "Theme slug to query (default \"ai-receptionists\"). A theme is any of the 275 pricing topics this index covers: the deep hub sections (e.g. ai-receptionists) plus the many catalog topics (e.g. vpn-services, web-hosting, password-managers). list_sections and list_coverage return the full slug list.",
                "type": "string"
              },
              "slugs": {
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:777ce1d2a6c8bddcde04d63081178211b4c86eaa972632bb464ddcc52ba64f5e"
        },
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Compare specific products side by side by slug within a category (e.g. ['apple-iphone-16-pro','samsung-galaxy-s25-ultra'] in 'smartphones'). Returns full provenanced spec records plus a notFound list and the category's comparable specKeys, so an agent can line up the same attributes across products.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Product category slug from list_product_categories.",
                "type": "string"
              },
              "slugs": {
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["category", "slugs"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0b62f8b2a9fd261dec1915d5f9a430f7ed3bd638b824e3bdac171b109629f8fc"
        },
        {
          "name": "find_best",
          "title": "Find best (ranked)",
          "description": "For 'best <theme> for <use case>' and 'cheapest <theme>': returns the theme's vendors ranked by entry price (cheapest first, quote-only last), each with its verified compliance facts (HIPAA/SOC 2/GDPR), free-tier flag, best-for tags, the entry plan's source and its `citation` (figure, plan, source page, read date and record URL in one line). Conjunctive fact filters narrow it to what this index has actually CONFIRMED — requireHipaa / requireSoc2 / requireGdpr / requireFreeTier (e.g. 'best CRM for HIPAA' = section 'crm-software' + requireHipaa:true). Omit all filters to rank the whole theme by price. Set `section` to the theme slug from list_sections. Never infers a fact it has not verified.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "requireFreeTier": {
                "description": "Only vendors with a genuine $0 forever plan.",
                "type": "boolean"
              },
              "requireGdpr": {
                "description": "Only vendors with confirmed GDPR compliance.",
                "type": "boolean"
              },
              "requireHipaa": {
                "description": "Only vendors with confirmed HIPAA support (a BAA).",
                "type": "boolean"
              },
              "requireSoc2": {
                "description": "Only vendors with a confirmed SOC 2 attestation.",
                "type": "boolean"
              },
              "section": {
                "description": "Theme slug to query (default \"ai-receptionists\"). A theme is any of the 275 pricing topics this index covers: the deep hub sections (e.g. ai-receptionists) plus the many catalog topics (e.g. vpn-services, web-hosting, password-managers). list_sections and list_coverage return the full slug list.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b454221ab7258dbc92421347f295938846234129e275820522bd8b0294c76cc"
        },
        {
          "name": "find_products",
          "title": "Find products (ranked)",
          "description": "For 'best <category> under $N' and 'which <category> has the most <spec>': filters a category by maxPriceUsd and/or brand, then ranks by a field — 'priceUsd' (the price of record each product's page prints; default, cheapest first), 'releaseDate', or any of the category's spec keys (descending:true ranks biggest first, e.g. sortBy:'battery_mah' descending:true). Returns provenanced product records; products missing the sort value sort last. Never infers a spec it has not verified.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "Only products from this brand.",
                "type": "string"
              },
              "category": {
                "description": "Product category slug from list_product_categories.",
                "type": "string"
              },
              "descending": {
                "description": "Rank largest/newest first (default false = smallest/cheapest first).",
                "type": "boolean"
              },
              "maxPriceUsd": {
                "description": "Only products at or below this USD price.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "sortBy": {
                "description": "Field to rank by: 'priceUsd' (default), 'releaseDate', or a spec key from the category.",
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d176446cc95b7610fab3efc3fb128f60834a76135c056a961a8d6cb72a3dff1c"
        },
        {
          "name": "get_benchmark",
          "title": "Get vendor benchmark",
          "description": "Per-vendor benchmark card by slug within any theme: full provenanced record plus dataset-derived indicators (entry price, normalized cost at 100 and 500 calls/mo where call-volume applies, billing models, free-tier presence, compliance, integration breadth). Set `section` to the theme slug from list_sections. All values trace to plan sources; no synthetic scores. Each priced plan carries a `citation`: figure, plan, source page, read date and record URL in one line.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "section": {
                "description": "Theme slug to query (default \"ai-receptionists\"). A theme is any of the 275 pricing topics this index covers: the deep hub sections (e.g. ai-receptionists) plus the many catalog topics (e.g. vpn-services, web-hosting, password-managers). list_sections and list_coverage return the full slug list.",
                "type": "string"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
