          "title": "Search products",
          "description": "Search one product category by free-text query across product name, brand, and spec values (e.g. 'snapdragon 5000mah', 'oled 120hz'). Set `category` to a slug from list_product_categories. Returns full provenanced product records: each price is the price of record its product page prints, with that page's date (priceDate) and citation (priceCite); specs carry source url + accessedAt. Empty query returns all products in the category.",
