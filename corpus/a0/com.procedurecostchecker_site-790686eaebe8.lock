        {
          "name": "enquiry_describe",
          "title": "What you get: an ENQUIRY with a human (not a purchase, not a guaranteed quote)",
          "description": "Read first. States plainly what submit_enquiry does on Procedure Cost Checker: it starts an enquiry with human providers who quote directly. Nothing is bought, ordered or paid; no quote is guaranteed; it is free. Also returns who receives the details, the consent wording, and how the person confirms.",
