          "name": "enquiry_fields",
          "title": "The questions the enquiry asks",
          "description": "Every field of the Procedure Cost Checker enquiry: key, label, type, whether required, help text and the allowed options where there are any. Pass answers to submit_enquiry keyed by field key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
