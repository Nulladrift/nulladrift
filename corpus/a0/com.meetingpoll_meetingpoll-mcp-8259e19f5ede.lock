{
  "lockfileVersion": 2,
  "subjects": {
    "com.meetingpoll/meetingpoll-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.meetingpoll.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "MeetingPoll Connector",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "check_poll_status",
          "description": "Inspect a poll by ID or vanity slug to view poll mode, candidate schedule, response counts, and active state",
          "inputSchema": {
            "properties": {
              "poll_id": {
                "description": "Poll ID or vanity slug",
                "type": "string"
              }
            },
            "required": ["poll_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:141d4c8628cb16a0e577d5509ed6821a90059ce117c7293adf33c4293c747213"
        },
        {
          "name": "create_meeting_poll",
          "description": "Agentic tool to create a new meeting scheduling poll in Candidate Slots mode (slots) or Drag-to-Paint Availability Grid mode (grid), with candidate dates, time slots or earliest/latest range, duration/block size, and optional invitee emails",
          "inputSchema": {
            "properties": {
              "block_size": {
                "default": 30,
                "description": "Grid mode block size in minutes (15, 30, or 60)",
                "enum": [15, 30, 60],
                "type": "integer"
              },
              "creator_email": {
                "description": "Organizer email address",
                "type": "string"
              },
              "creator_timezone_offset": {
                "default": 0,
                "description": "Creator timezone offset in minutes (e.g. -120 for UTC+2)",
                "type": "integer"
              },
              "dates": {
                "description": "Candidate dates in YYYY-MM-DD format",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "description": {
                "description": "Optional meeting description, agenda, or context",
                "type": "string"
              },
              "duration": {
                "default": 30,
                "description": "Meeting duration in minutes (default: 30)",
                "type": "integer"
              },
              "earliest": {
                "default": "09:00",
                "description": "Grid mode earliest boundary time in HH:mm format",
                "type": "string"
              },
              "invitee_emails": {
                "description": "Optional list of invitee emails to auto-send invitations to",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "latest": {
                "default": "17:00",
                "description": "Grid mode latest boundary time in HH:mm format (up to 24:00)",
                "type": "string"
              },
              "poll_mode": {
                "default": "slots",
                "description": "Poll mode: \"slots\" for discrete candidate start times or \"grid\" for continuous drag-to-paint availability grid",
                "enum": ["slots", "grid"],
                "type": "string"
              },
              "time_slots": {
                "description": "Candidate start times in HH:mm format (optional in grid mode when earliest/latest are supplied)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Meeting or event title",
                "type": "string"
              }
            },
            "required": ["dates", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:79af5b7ed0a499c5d22389dba8ce40ff80aa986e34e7f5bc27a22ee11fb30f07"
        },
        {
          "name": "get_platform_pricing_and_plans",
          "description": "Retrieve MeetingPoll subscription plans, single-poll passes, organization quorum plans, and free features",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ed48da415401f9a08a75108c064254a15ac3568b01f2f0c5c2c5786d0a1c3da8"
        },
        {
          "name": "get_poll_consensus",
          "description": "Analyze vote distribution and calculate optimal meeting slot with percentage agreement, voter breakdown, and AI scheduling recommendations",
          "inputSchema": {
            "properties": {
              "poll_id": {
                "description": "Poll ID or vanity slug",
                "type": "string"
              }
            },
            "required": ["poll_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9dccdc2baa648e1edce4d8b5e6b30194acf36ec3a12f114464ac3d77e6122e0b"
        },
        {
          "name": "submit_participant_vote",
          "description": "Submit availability votes (with optional \"If Need Be\" backup slots and email receipt) for a participant on candidate meeting slots or grid blocks",
          "inputSchema": {
            "properties": {
              "available_slot_indices": {
                "description": "Array of 0-indexed candidate slot or grid block indices participant can attend",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "email": {
                "description": "Participant email address",
                "type": "string"
              },
              "maybe_slot_indices": {
                "description": "Optional array of 0-indexed \"If Need Be\" backup slot indices",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "name": {
                "description": "Participant display name",
                "type": "string"
              },
              "poll_id": {
                "description": "Poll ID or vanity slug",
                "type": "string"
              },
              "send_voter_receipt": {
                "default": false,
                "description": "When true and email is supplied, sends the voter an email copy of their selected availability and poll link",
                "type": "boolean"
              }
            },
            "required": ["available_slot_indices", "name", "poll_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:11a04bf38fb1bdd0cb99897b3676cc537068bf2e1b00bcc7bef33a30617350f7"
        }
      ],
      "digest": "sha256:8ef766b93fdd40aeea3416e66d8780cdaa9644461abfe630fc10be9b64db3708"
    }
  }
}
