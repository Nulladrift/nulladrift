{
  "lockfileVersion": 2,
  "subjects": {
    "com.meetingpoll/meetingpoll-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.meetingpoll.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "MeetingPoll Connector",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "create_meeting_poll",
          "description": "Agentic tool to create a new meeting scheduling poll with candidate dates, time slots, duration, and optional invitee emails",
          "inputSchema": {
            "properties": {
              "creator_email": {
                "description": "Organizer email address",
                "type": "string"
              },
              "creator_timezone_offset": {
                "default": 0,
                "description": "Creator timezone offset in minutes (e.g. -120 for UTC+2)",
                "type": "integer"
              },
              "dates": {
                "description": "Candidate dates in YYYY-MM-DD format",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "description": {
                "description": "Optional meeting description, agenda, or context",
                "type": "string"
              },
              "duration": {
                "default": 30,
                "description": "Meeting duration in minutes (default: 30)",
                "type": "integer"
              },
              "invitee_emails": {
                "description": "Optional list of invitee emails to auto-send invitations to",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "time_slots": {
                "description": "Candidate start times in HH:mm format",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "description": "Meeting or event title",
                "type": "string"
              }
            },
            "required": ["dates", "time_slots", "title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:80c5f7a5963258316a27361391807db7ef194d1acd6064d6542971e09c133c07"
        },
        {
          "name": "get_poll_consensus",
          "description": "Analyze vote distribution and calculate optimal meeting slot with percentage agreement, voter breakdown, and AI scheduling recommendations",
          "inputSchema": {
            "properties": {
              "poll_id": {
                "description": "Poll ID or vanity slug",
                "type": "string"
              }
            },
            "required": ["poll_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9dccdc2baa648e1edce4d8b5e6b30194acf36ec3a12f114464ac3d77e6122e0b"
        },
        {
          "name": "submit_participant_vote",
          "description": "Submit availability votes for a participant on candidate meeting slots",
          "inputSchema": {
            "properties": {
              "available_slot_indices": {
                "description": "Array of 0-indexed candidate slot indices participant can attend",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "email": {
                "description": "Participant email address",
                "type": "string"
              },
              "name": {
                "description": "Participant display name",
                "type": "string"
              },
              "poll_id": {
                "description": "Poll ID or vanity slug",
                "type": "string"
              }
            },
            "required": ["available_slot_indices", "name", "poll_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6fc26765e4129303cecb017d8961650d7e8794100ccd7737994856b9a0d265fa"
        }
      ],
      "digest": "sha256:9993f2bd6bca3b2a595a3fd0adb6b40e089b71b4ce15e5e9bd6a72824e31ab75"
    }
  }
}
