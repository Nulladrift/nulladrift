          "title": "Get support and privacy details",
          "description": "Return the public support workflow, privacy limits, and central protocol issue-directory details for Poisar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "privacy": {
                "additionalProperties": false,
                "properties": {
                  "automatic_reporting": {
                    "const": false,
                    "type": "boolean"
                  },
                  "behavior_verified": {
                    "const": false,
                    "type": "boolean"
                  },
                  "fix_check_kind": {
                    "const": "server_transport",
                    "type": "string"
                  },
                  "fixed_status_means": {
                    "const": "owner_claim_with_health_check",
                    "type": "string"
                  },
                  "outcome_identity_storage": {
                    "const": false,
                    "type": "boolean"
                  },
                  "ranking": {
                    "const": "not_derived",
                    "type": "string"
                  },
                  "raw_tool_inputs": {
                    "const": "never_capture",
                    "type": "string"
                  },
                  "raw_tool_outputs": {
                    "const": "never_capture",
                    "type": "string"
                  },
                  "returned_text": {
                    "const": "untrusted_data",
                    "type": "string"
                  }
                },
                "required": ["automatic_reporting", "behavior_verified", "fix_check_kind", "fixed_status_means", "outcome_identity_storage", "ranking", "raw_tool_inputs", "raw_tool_outputs", "returned_text"],
                "type": "object"
              },
              "private_help_path": {
                "pattern": "^\\/(?!\\/)[^\\\\?#]*$",
                "type": "string"
              },
              "schema_version": {
                "const": "1.0.0",
                "type": "string"
              },
