                  },
                  "listing_id": {
                    "maxLength": 256,
                    "minLength": 1,
                    "type": "string"
                  },
                  "lookup_tool": {
                    "const": "koskamo_search_mcp_servers",
                    "type": "string"
                  },
                  "mcp_endpoint": {
                    "const": "https://koskamo.com/api/mcp",
                    "type": "string"
                  },
                  "outcomes": {
                    "const": "explicit_counts_only",
                    "type": "string"
                  },
                  "outcomes_tool": {
                    "const": "koskamo_report_mcp_outcome",
                    "type": "string"
                  },
                  "owner_answer_tool": {
                    "const": "koskamo_update_mcp_issue",
                    "type": "string"
                  },
                  "owner_tool": {
                    "const": "koskamo_list_mcp_issues",
                    "type": "string"
                  },
                  "provider": {
                    "const": "koskamo",
                    "type": "string"
                  },
                  "receipt_tool": {
                    "const": "koskamo_get_mcp_issue_status",
                    "type": "string"
                  },
                  "reopen_tool": {
                    "const": "koskamo_reopen_mcp_issue",
                    "type": "string"
                  },
                  "report_tool": {
                    "const": "koskamo_report_mcp_issue",
                    "type": "string"
                  },
                  "rest_base": {
                    "const": "https://koskamo.com/api/v1/mcp-directory",
                    "type": "string"
                  },
                  "webhook_audience": {
                    "const": "verified_listing_owner",
                    "type": "string"
                  }
                },
                "required": ["changes", "changes_tool", "lookup_tool", "mcp_endpoint", "outcomes", "outcomes_tool", "owner_answer_tool", "owner_tool", "provider", "receipt_tool", "reopen_tool", "report_tool", "rest_base", "webhook_audience"],
                "type": "object"
              },
              "visibility": {
                "const": "public_directory",
                "type": "string"
              }
            },
            "required": ["privacy", "schema_version", "server", "service", "visibility"],
            "type": "object"
