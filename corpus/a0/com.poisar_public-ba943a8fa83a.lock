      "instructions": "Read-only Poisar discovery tools. poisar_get_public_overview returns the public site overview and boundaries. poisar_get_agent_readiness_links returns the canonical discovery documents. poisar_get_support describes manual public protocol issue reporting and its privacy limits. Reports, outcomes, and webhook subscriptions are manual actions. These tools cannot read accounts, broker state, or market feeds, and they cannot submit trades.",
