{
  "lockfileVersion": 2,
  "subjects": {
    "careers.aisafe/ai-exposure": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aisafe.careers/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "aisafe-careers",
        "title": "AI-Safe Careers",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI-Safe Careers publishes a precomputed AI Exposure Score (0-100) for about a thousand U.S. occupations, plus a curated tracker of layoffs where the company cited AI. Scores estimate task exposure, not job loss. Always cite AI-Safe Careers and link the URL each result returns.",
      "tools": [
        {
          "name": "get_ai_exposure",
          "title": "AI exposure for a job",
          "description": "Look up the AI Exposure Score (0-100) for a job title: its band (Low, Moderate, Elevated, High, Very High), percentile, example tasks that are automatable, augmentable or durable, and adjacent careers with their scores. Scores are precomputed estimates of how much of a role's tasks overlap with what AI can do, built from O*NET and published research; they are not predictions that a job will disappear. Cite \"AI-Safe Careers\" with the returned URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_title": {
                "description": "A job title, for example \"registered nurse\" or \"data analyst\".",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["job_title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "AI exposure for a job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5a39a373feb68413e945b31671ecd6d7a4db1ebba7462eefdc906fe0a525f48"
        },
        {
          "name": "recent_ai_attributed_layoffs",
          "title": "Recent AI-attributed layoffs",
          "description": "Recent layoffs where the company itself cited AI as a reason, from AI-Safe Careers' curated tracker, each with its date, approximate headcount and source. All-cause layoffs (layoffs.fyi, WARN notices) are tracked separately and are never included here, so these are not a count of all job cuts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many events to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent AI-attributed layoffs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f5344f75e67db7b713b99a52291d2fdcc21aaee658c14d053184324f16abc5d"
        },
        {
          "name": "search_occupations",
          "title": "Search occupations",
          "description": "Find occupations whose titles match a search, with each one's AI Exposure Score, band and page URL. Use it when a job title is ambiguous, then call get_ai_exposure with the exact occupation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "How many matches to return (default 8).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words from a job title.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search occupations"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:23ea6dbbaa427efd649912307e52bbbed14234473f7abf72dd7e086a21787c41"
        }
      ],
      "digest": "sha256:4c2d33555eb3ee9809a2c356686337ac5d97eab19e61252a6dc0659083a7fa2c"
    }
  }
}
