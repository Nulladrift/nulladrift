        {
          "name": "device_ledger_query",
          "title": "Qubit performance ledger",
          "description": "Query the ScienceShot QEP device ledger: published measurements of qubit coherence (T1, T2), single- and two-qubit gate fidelity, readout fidelity and gate time on superconducting, trapped-ion, neutral-atom, semiconductor-spin, defect-spin and photonic devices, one cited row per result. Filter by platform, metric, statistic and since_year. With a metric, rows come best first and comparable rows before the rest. Each row gives value, unit, SI value, date, source type, reference, link and the figure or table where the number was read; the answer adds the ledger release and the page to cite. Best, median, mean and single-device values are separate rows; Pauli-error and photonic rows are flagged not comparable.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Rows to return, 1 to 50 (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "metric": {
                "description": "Metric, e.g. f2q (two-qubit gate fidelity), t1, t2_echo, readout_fidelity.",
                "enum": ["t1", "t2_echo", "t2_ramsey", "t2_star", "t2_dd", "gate_time_1q", "gate_time_2q", "readout_time", "f1q", "f2q", "readout_fidelity", "spam_fidelity", "bell_state_fidelity", "qubit_frequency", "temperature"],
                "type": "string"
              },
              "platform": {
                "description": "Qubit platform.",
                "enum": ["superconducting", "trapped_ion", "neutral_atom", "spin", "defect", "photonic"],
                "type": "string"
              },
              "since_year": {
                "description": "Only results published in this year or later.",
                "maximum": 2100,
                "minimum": 2000,
                "type": "integer"
              },
              "statistic": {
                "description": "How the figure was summarised in the source.",
                "enum": ["best", "median", "mean", "single"],
                "type": "string"
              }
            },
            "type": "object"
          },
