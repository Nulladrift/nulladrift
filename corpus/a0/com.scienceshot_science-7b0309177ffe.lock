        {
          "name": "diffraction_grating",
          "title": "Diffraction grating calculator",
          "description": "Solves the signed reflection grating equation and ideal Rayleigh resolution from Hecht, Optics, 5th edition and the MKS Newport handbook. Returns allowed order bounds, angular dispersion, illuminated groove count, linewidth, Littrow angle and local approximate free spectral range; excludes slit and aberration limits.",
