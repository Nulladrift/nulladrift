{
  "lockfileVersion": 2,
  "subjects": {
    "com.guitarfretwork/fretwork": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.guitarfretwork.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fretwork",
        "title": "Fretwork Guitar Tools",
        "version": "1.0.1",
        "websiteUrl": "https://guitarfretwork.com/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Fretwork Guitar Tools help people learn and play guitar. Use identify_chord when someone describes a shape by its frets; get_chord_shapes to show how to play a named chord; transpose_chords and find_capo to change key; get_scale for scales on the fretboard; find_key to name a song's key; find_songs to suggest songs for the chords a learner knows; guitar_level_check then make_practice_plan to plan practice. All tools are read-only and work in standard tuning (E A D G B E), low E string first. Text chord and scale diagrams are monospace; each result includes a link to the matching free page on guitarfretwork.com.",
      "tools": [
        {
          "name": "find_capo",
          "title": "Find the capo position for a key",
          "description": "Works out where to put a capo. Give the key you want to sound in (for example to match a singer or a recording) and, optionally, the open-chord key you want to play shapes in. Returns the capo fret, or the easy options if no shape key is given.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "shape_key": {
                "description": "Optional. The key whose open chord shapes you want to play, e.g. \"G\" or \"Em\".",
                "type": "string"
              },
              "sounding_key": {
                "description": "The key the music should sound in, e.g. \"Bb\", \"F# minor\".",
                "type": "string"
              }
            },
            "required": ["sounding_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the capo position for a key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c83566942608c29caa8550fb7a50fb3448782ec58980320ffd8b1ba62a90c6c"
        },
        {
          "name": "find_key",
          "title": "Find the key of a song from its chords",
          "description": "Works out the most likely key of a song from its chord progression, gives each chord its Roman numeral, lists the other chords that belong to the key, and suggests which scale to solo with.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chords": {
                "description": "The chords in order, e.g. \"G D Em C\" or \"Am F C G\".",
                "type": "string"
              }
            },
            "required": ["chords"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find the key of a song from its chords"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d054d6ec44b402b10bf4a8d380dda35da9148c41679e968dd6d9e5129f8ea6b5"
        },
        {
          "name": "find_songs",
          "title": "Find songs to play with the chords you know",
          "description": "Finds songs a guitarist can play with the chords they already know, from Fretwork's free library of 87 public-domain folk, gospel, blues, campfire and Christmas songs. Each song has chords, key, time signature, level and a free play-along page. Can also list songs that need just one or two new chords.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chords_known": {
                "description": "Chords the player can already play, e.g. \"G C D Em\".",
                "type": "string"
              },
              "level": {
                "description": "Filter by level (default any).",
                "enum": ["any", "Easy", "Improver", "Harder"],
                "type": "string"
              },
              "max_new_chords": {
                "description": "Also include songs needing up to this many extra chords (default 0).",
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
              "time_signature": {
                "description": "Filter by time signature (default any).",
                "enum": ["any", "4/4", "3/4", "6/8"],
                "type": "string"
              }
            },
            "required": ["chords_known"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find songs to play with the chords you know"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:92b398b64b726cddf77037866c3050fae1fb0090bbf6c30869364d44ddfd229f"
        },
        {
          "name": "get_chord_shapes",
          "title": "Show how to play a guitar chord",
          "description": "Returns playable guitar shapes for a chord name (open position and movable barre shapes), with frets, fingering where known, the notes in the chord and a text chord diagram. Handles major, minor, 7, maj7, m7, sus2, sus4, add9, 6, m6, 9, dim, m7b5, dim7, aug, power chords and slash chords such as G/B.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "chord": {
                "description": "Chord name, for example \"F\", \"Bm\", \"F#m7\", \"Cadd9\", \"Bbmaj7\", \"G/B\", \"E5\".",
                "type": "string"
              }
            },
            "required": ["chord"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show how to play a guitar chord"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff7fb8a1b6547f97d71a9871e700374faf1bc2da89e06b2538f7853fbb0d5b0e"
        },
        {
          "name": "get_scale",
          "title": "Show a guitar scale on the fretboard",
          "description": "Gives the notes of a scale in any key and where they fall on the guitar fretboard (standard tuning), string by string, with root notes marked. Scales: major, natural minor, harmonic minor, melodic minor, the seven modes (dorian, phrygian, lydian, mixolydian, locrian), minor pentatonic, major pentatonic, blues and major blues.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_fret": {
                "description": "Lowest fret to show (default 0).",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "root": {
                "description": "Key note, e.g. \"A\", \"F#\", \"Bb\".",
                "type": "string"
              },
              "scale": {
                "description": "Scale type, e.g. \"minor pentatonic\", \"major\", \"blues\", \"dorian\".",
                "type": "string"
              },
              "to_fret": {
                "description": "Highest fret to show (default 12).",
                "maximum": 24,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["root", "scale"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Show a guitar scale on the fretboard"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7453b1248a6d11e7a0e74a5447a2c67206a05a0078bef6778a6a47c51238c8a"
        },
        {
          "name": "guitar_level_check",
          "title": "Check a guitarist's level",
          "description": "A quick self-assessment that places a guitarist on Fretwork's 10-stage learning path (Stage 0 Getting Started to Stage 9 Artistry) from yes/no answers to up to nine questions about what they can already play, and says what to learn next. The questions build on each other, so answers are read in order up to the first \"no\". Called with no answers, it returns the nine questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "barre_chords_and_16th_groove": {
                "description": "Can you play any major or minor barre chord and hold a 16th-note strumming groove?",
                "type": "boolean"
              },
              "bends_vibrato_full_solo": {
                "description": "Can you play a solo with in-tune bends, vibrato and clear phrases?",
                "type": "boolean"
              },
              "change_chords_in_time": {
                "description": "Can you change between basic open chords (like G, C, D, Em) in time and play a whole simple song?",
                "type": "boolean"
              },
              "four_chord_song_with_pattern": {
                "description": "Can you play a four-chord song start to finish with a strumming pattern?",
                "type": "boolean"
              },
              "keys_and_pentatonic_anywhere": {
                "description": "Can you name the chords in any key and solo with the pentatonic scale anywhere on the neck?",
                "type": "boolean"
              },
              "play_the_changes": {
                "description": "Can you solo over a progression and target the chord tones as the chords change?",
                "type": "boolean"
              },
              "riff_blues_and_short_solo": {
                "description": "Can you play a riff, a 12-bar blues and a short solo of your own?",
                "type": "boolean"
              },
              "transcribe_and_tension": {
                "description": "Can you transcribe a full solo and improvise with tension and release?",
                "type": "boolean"
              },
              "tune_and_clean_notes": {
                "description": "Can you tune the guitar and play a clean note on every string?",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a guitarist's level"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6cb57a121f0302aff93c05eb9d428a980adad4ca87263a9549d3c3cba3a807f5"
        },
        {
          "name": "identify_chord",
          "title": "Identify a guitar chord",
          "description": "Names the chord a guitarist is holding from the fret on each string (standard tuning), lists its notes and returns a chord diagram. Use when someone asks \"what chord is this?\" and gives frets like x32010, 3-2-0-0-0-3 or \"0 2 2 1 0 0\" (low E string first; x = muted string).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "frets": {
                "description": "Six frets from the low E string to the high e string. Use x for a muted string, 0 for open. Examples: \"x32010\", \"3 2 0 0 0 3\", \"8-10-10-9-8-8\".",
                "type": "string"
              }
            },
            "required": ["frets"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Identify a guitar chord"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df95738faaab8801fc73ed97be1a2ef99763bd25ad772be2ba49d9193e6ad335"
        },
        {
          "name": "make_practice_plan",
          "title": "Make a guitar practice plan",
          "description": "Builds a daily guitar practice routine and a 4-week focus plan sized to the player's level, the minutes they have each day and their goal (songs, strumming, fingerpicking, lead, barre chords, theory or general). Uses Fretwork's 10-stage curriculum, where stage 0 is for someone who has never played.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days_per_week": {
                "description": "Practice days per week (default 5).",
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "goal": {
                "description": "Main goal (default general).",
                "enum": ["general", "songs", "strumming", "fingerpicking", "lead", "barre_chords", "theory"],
                "type": "string"
              },
              "minutes_per_day": {
                "description": "Practice minutes per day (default 20).",
                "maximum": 120,
                "minimum": 10,
                "type": "integer"
              },
              "stage": {
                "description": "Fretwork stage 0–9 (0 = never played, 1 = first chords, 2 = rhythm & songs, 3 = riffs & first solos, 4 = barre chords, 5 = scales & keys, 6 = lead guitar, 7–9 = advanced).",
                "maximum": 9,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Make a guitar practice plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9c6603fb8a0193294fc0d26981435db9536999d28dbe85ee09de518b9bcec709"
        },
        {
          "name": "transpose_chords",
          "title": "Transpose guitar chords to a new key",
          "description": "Moves a song's chords to a new key. Accepts a chord list, a chord chart with lyrics (chord lines are transposed, lyric lines are kept), or inline [C] chords. Give either from_key and to_key, or a number of semitones. Also suggests capo positions that let the guitarist keep easy open shapes in the new key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from_key": {
                "description": "Current key, e.g. \"G\" or \"A minor\". Optional if semitones is given; if missing, the first chord is used.",
                "type": "string"
              },
              "semitones": {
                "description": "Semitones to move (+ up, - down). Used when to_key is not given.",
                "maximum": 11,
                "minimum": -11,
                "type": "integer"
              },
              "spelling": {
                "description": "Accidentals for the result. auto follows the target key.",
                "enum": ["auto", "sharps", "flats"],
                "type": "string"
              },
              "text": {
                "description": "The chords or chord chart, e.g. \"G D Em C\" or a chart with chord lines above lyrics.",
                "type": "string"
              },
              "to_key": {
                "description": "Target key, e.g. \"Bb\" or \"C minor\".",
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Transpose guitar chords to a new key"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6807cea71fffd194f7677eb9d9caaaf08f9b011987ab654cc06d0e36dbc60c04"
        }
      ],
      "digest": "sha256:154941341b1acadda21a8d12c5067a766d4961caf1b5f338897f9c33d4b9246e"
    }
  }
}
