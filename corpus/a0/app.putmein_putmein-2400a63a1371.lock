      "serverInfo": {
        "name": "putmein",
        "title": "Put Me In",
        "version": "1.0.0",
        "websiteUrl": "https://putmein.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Put Me In (https://putmein.app) turns photos into short AI meme videos: pick a template, add one photo per person, get a clip in which those people act out the meme. Use list_templates to see the templates (or to find one for a number of people, or for pets). For one template: how_to_make gives the steps and the photos it needs, recommend_settings the model, quality, aspect ratio, length and cast, get_example_prompts example prompts with the cast's names put in, get_faq its questions and answers (or the site's, with no template). Every answer carries the template's page: link it.",
      "tools": [
        {
          "name": "get_example_prompts",
          "title": "Example prompts for a template's scene",
          "description": "Example text prompts that describe one template's scene, for any image-to-video tool, with the cast's names filled in, plus prompt tips. Give names to put people in by name instead of 'the person in photo 1'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "names": {
                "description": "names for the people in photo 1, photo 2 …, in order",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 3,
                "type": "array"
              },
              "template": {
                "description": "The template, by its name or address name: tiny-desk, iphone-kupi-dance, gangnam-style-dance, bby-wow-dance, bad-times, bad-times-pet, stadium-entrance, rumpelstiltskin, burning-bridges, neon-dance, abcdefg-i-need-money, money-spread, toosie-slide, no-scrubs, you-tweaking-do-a-360, hotel-lobby, my-ride-is-here, ghostface, smalltown-boy, crazy-frog, zombie-couple, storm-dance, alors-on-danse, apt, topo-gigio, closed-on-sunday",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["template"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Example prompts for a template's scene"
          },
          "behavior": {
            "destructive": false,
