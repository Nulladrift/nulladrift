{
  "lockfileVersion": 2,
  "subjects": {
    "ai.peerfoundry/typedpull": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://typedpull.peerfoundry.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "typedpull",
        "version": "0.1.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "explain_extractor",
          "title": "Explain extractor",
          "description": "Show selectors, version, and hit count. This does not fetch the page.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "extractor_id": {
                "type": "string"
              },
              "json_schema": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "url": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:80a5ca94b56f3b592f9718bdf0f1ffe810e00f7d318b89d664bbade38161c8de"
        },
        {
          "name": "extract",
          "title": "Extract fields",
          "description": "Return fields from one public page. Call extractors.list for hosts, paths, and the sample schema. You can ask for title, heading, or both. If the page has no extractor, the error points to extractors.list. Call keys.create once. Pass caller_key on every later tools/call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "caller_key": {
                "description": "pf_ key from keys.create. Pass this on tools/call when Authorization and X-Caller-Key are not set. A header key wins if both are set.",
                "type": "string"
              },
              "json_schema": {
                "additionalProperties": {},
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "max_age_s": {
                "exclusiveMinimum": 0,
                "maximum": 86400,
                "type": "integer"
              },
              "url": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["json_schema", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d1e7b09ee1aa089a936fecd07cc84c7fe38349a140044a991bd05b9242401f15"
        },
        {
          "name": "extract_batch",
          "title": "Extract batch",
          "description": "Run up to 20 extract calls. Each item has its own status. Call extractors.list for the sample schema. Call keys.create once. Pass caller_key on every later tools/call.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "caller_key": {
                "description": "pf_ key from keys.create. Pass this on tools/call when Authorization and X-Caller-Key are not set. A header key wins if both are set.",
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "json_schema": {
                      "additionalProperties": {},
                      "propertyNames": {
                        "type": "string"
                      },
                      "type": "object"
                    },
                    "url": {
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["json_schema", "url"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9b23eb79406e05d88e10f313894f249279a5d5c69d63ec4c8a220685b88dd6d5"
        },
        {
          "name": "extractors.list",
          "title": "List extractors",
          "description": "List active pages, fields, and a sample schema. This does not fetch a page. No caller key is required.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4782807518af10e74c903267b829eb4e5069d7d0114ebda208a1223bf1c2dc4d"
        },
        {
          "name": "keys.create",
          "title": "Create caller key",
          "description": "Mint a pf_ caller key. The raw key is shown once. Pass this key on every later tools/call. Send it as the caller_key argument.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e7eadecb48db7b4400f339042577cac1b95dbe1e11c02d8ae979ff7029360d3e"
        }
      ],
      "resources": [
        {
          "uri": "peerfoundry://extractors",
          "name": "extractors",
          "title": "Active extractors",
          "description": "Active pages, fields, and a sample schema. Read only. No caller key.",
          "mimeType": "application/json",
          "digest": "sha256:5ee46db6aa04092f8aff3e4847b9b979aa5dd8f3457c073f2a7eb629d4207d7b"
        },
        {
          "uri": "peerfoundry://recipe",
          "name": "recipe",
          "title": "Start recipe",
          "description": "Call keys.create once. Pass caller_key on every later tools/call. Three steps only.",
          "mimeType": "text/plain",
          "digest": "sha256:727e8468d94aa73d567f4e19ef264b01e3f7d248a0cfd50403f408f782a5e316"
        }
      ],
      "digest": "sha256:0307b43a6eea12dcc6f51fc87cfc3de37a8a06841e0f6210a7d51c35ebcbfcb4"
    }
  }
}
