        {
          "name": "search_buyers",
          "title": "Search AI data buyers",
          "description": "Search DataWorth AI's directory of companies and programs that license a business's operating records (email, chat, files, CRM, code, CAD) to AI developers. Facts come from each company's own site; payouts are quoted in its own words and are not offers. Results are alphabetical (or by text relevance when a query is given), never by referral fee. Use this to list or compare buyers; to compare one company's facts with programs' eligibility rules, use check_fit.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accepts_closed": {
                "description": "true = only buyers whose pages say they take winding-down or closed companies.",
                "type": "boolean"
              },
              "data_type": {
                "description": "Kind of records the buyer says it licenses.",
                "enum": ["email", "chat", "documents", "crm", "code", "cad_engineering", "support_tickets", "calls", "finance_erp", "healthcare", "media", "agent_traces"],
                "type": "string"
              },
              "detail": {
                "description": "full (default) = every field with quotes and sources; summary = id, name, type, where, size rule and page only (smaller response; use get_buyer for one entry's full detail).",
                "enum": ["full", "summary"],
                "type": "string"
              },
              "industry": {
                "description": "Only buyers whose own pages name this industry. Many buyers take records from any industry; omit to see them.",
                "enum": ["legal", "accounting", "finance", "medical", "dental", "insurance", "staffing", "title-escrow", "property-management", "real-estate-brokerage", "software", "engineering", "manufacturing", "life-sciences", "games", "construction-trades", "auto-services", "agriculture", "warehouse-distribution", "restaurant", "commercial-cleaning", "other"],
                "type": "string"
              },
              "max_results": {
                "description": "Default 10.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text, e.g. 'source code', 'law firm', 'wind-down'.",
                "maxLength": 200,
                "type": "string"
              },
              "region": {
                "description": "outside_US = buyers whose pages say they take or estimate for non-US companies.",
                "enum": ["US", "outside_US"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AI data buyers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
