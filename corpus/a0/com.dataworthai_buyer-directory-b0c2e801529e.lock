        "name": "dataworth-ai-buyer-directory",
        "title": "DataWorth AI: AI data buyer directory",
        "version": "1.2.1",
        "websiteUrl": "https://dataworthai.com/ai-connector/"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "DataWorth AI's buyer directory lists companies and programs that license a business's operating records (email, chat, files, CRM, code, CAD) to AI developers.\nEvery fact comes from that company's own website on the date in last_verified; null means not published. Payouts are quoted in the company's own words and are not offers or predictions of what a company will receive.\ncheck_fit compares a company's basic facts with the published eligibility rules of every directory buyer that publishes clear rules, paid or not, ordered by fit and then alphabetically. Each row has its rule sources, a fee flag and its own next step (DataWorth AI's quiz for programs it works with, the buyer's own page for the rest). Results also include a disclaimer and a fee disclosure; these are part of the answer.\nMode (BizBuyData) is listed by name and link only; check_fit quotes Mode's own published wording.\nRead-only. Stores no personal data; counts tool calls per tool per day only.",
      "tools": [
        {
          "name": "check_fit",
          "title": "Check which buyers a company fits",
          "description": "Use when someone asks whether a specific company qualifies to license its records to AI data buyers. Compares the company's industry, size, years, country, status and number of business systems with the published eligibility rules of every buyer in DataWorth AI's directory that publishes clear rules (programs DataWorth AI works with and buyers it has no relationship with alike, using the same rules as DataWorth AI's quiz for the former). Returns one row per buyer, ordered by fit and then alphabetically: meets / does not meet / needs more info, reasons quoted from that buyer's own wording, its rule source URLs, whether DataWorth AI may earn a referral fee, and its next step (the buyer's own page, or DataWorth AI's quiz for programs it introduces). Also returns a disclaimer and a fee disclosure. Returns no amounts and is not an offer. Needs no names, emails or confidential data.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "country": {
                "description": "Where the company is based: US, CA, UK, AU, or any other country name (treated as OTHER).",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "employees": {
                "description": "Employees today (full-time).",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "industry": {
                "description": "legal, accounting, finance, medical, dental, insurance, staffing, title-escrow, property-management, real-estate-brokerage, software, engineering (incl. architecture/design), manufacturing (incl. machine shops), life-sciences (labs and research), games, construction-trades (construction, plumbing, HVAC, electrical), auto-services, agriculture (farms, nurseries, grounds), warehouse-distribution, restaurant (incl. commercial kitchens), commercial-cleaning, or other.",
                "enum": ["legal", "accounting", "finance", "medical", "dental", "insurance", "staffing", "title-escrow", "property-management", "real-estate-brokerage", "software", "engineering", "manufacturing", "life-sciences", "games", "construction-trades", "auto-services", "agriculture", "warehouse-distribution", "restaurant", "commercial-cleaning", "other"],
                "type": "string"
              },
              "peak_employees_ever": {
                "description": "Most people it has ever employed (used for Lunchbreak's '20+ staff at some point').",
                "maximum": 1000000,
                "minimum": 0,
                "type": "integer"
              },
              "status": {
                "description": "operating, winding_down, closed, or acquired.",
                "enum": ["operating", "winding_down", "closed", "acquired"],
                "type": "string"
              },
              "systems": {
                "description": "Alternative to systems_count: which systems it uses.",
                "items": {
                  "enum": ["email", "chat", "files", "crm", "practice", "billing", "projects", "tickets", "calls"],
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "systems_count": {
                "description": "How many business systems it uses (email, chat, file storage, CRM, practice/billing, projects, tickets, calls). Mode asks for 5+.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "years_operating": {
                "description": "Years the company has operated / has records for.",
                "maximum": 300,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["country", "employees", "industry", "status", "years_operating"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "buyers_checked": {
                "type": "number"
              },
              "disclaimer": {
                "type": "string"
              },
              "fee_disclosure": {
                "type": "string"
              },
              "input_used": {
                "additionalProperties": false,
                "properties": {
                  "country": {
                    "type": "string"
                  },
                  "employees": {
                    "type": "number"
                  },
                  "industry": {
                    "type": "string"
                  },
                  "peak_employees_ever": {
                    "description": "absent = not given",
                    "type": "number"
                  },
                  "status": {
                    "type": "string"
                  },
                  "systems_count": {
                    "description": "absent = not given",
                    "type": "number"
                  },
                  "years_operating": {
                    "type": "number"
                  }
                },
                "required": ["country", "employees", "industry", "status", "years_operating"],
                "type": "object"
              },
              "next_step": {
                "additionalProperties": false,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  },
                  "why": {
                    "type": "string"
                  }
                },
                "required": ["label", "url", "why"],
                "type": "object"
              },
              "not_scored": {
                "additionalProperties": false,
                "properties": {
                  "buyers": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "why": {
                    "type": "string"
                  }
                },
                "required": ["buyers", "why"],
                "type": "object"
              },
              "quiz_notes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "dataworth_may_earn_referral_fee": {
                      "type": "boolean"
                    },
                    "directory_page": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "missing": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "name": {
                      "type": "string"
                    },
                    "next_step": {
                      "additionalProperties": false,
                      "properties": {
                        "kind": {
                          "enum": ["quiz", "buyer_site"],
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "url": {
                          "type": "string"
                        }
                      },
                      "required": ["kind", "label", "url"],
                      "type": "object"
                    },
                    "reasons": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "result": {
                      "enum": ["meets_published_rules", "does_not_meet_published_rules", "needs_more_info"],
                      "type": "string"
                    },
                    "rule_sources": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "rules_checked": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "rules_last_verified": {
                      "type": "string"
                    }
                  },
                  "required": ["dataworth_may_earn_referral_fee", "id", "name", "next_step", "reasons", "result", "rule_sources", "rules_checked", "rules_last_verified"],
                  "type": "object"
                },
                "type": "array"
              },
              "rules_basis": {
                "additionalProperties": false,
                "properties": {
                  "mercor": {
                    "type": "string"
                  },
                  "method": {
                    "type": "string"
                  },
                  "mode": {
                    "type": "string"
                  },
                  "ordering": {
                    "type": "string"
                  }
                },
                "required": ["method", "mode", "ordering"],
                "type": "object"
              },
              "see_also": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "page": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["page", "slug", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "summary": {
                "type": "string"
              }
            },
            "required": ["buyers_checked", "disclaimer", "fee_disclosure", "input_used", "next_step", "quiz_notes", "results", "rules_basis", "see_also", "summary"],
            "type": "object"
          },
