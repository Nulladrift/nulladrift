        {
          "name": "helix_foundry_get_dashboard",
          "title": "Get a Foundry dashboard",
          "description": "Get one Foundry dashboard with its spec and revision. A spec is {\"v\": 1, \"tiles\": [...], \"layout\": {\"rows\": [[\"t1\", \"t2\"], [\"t3\"]]}}: at most 20 tiles, each in exactly one row of 1 to 3. A tile is {\"id\": \"t1\" (1 to 32 lowercase letters, digits, - or _, starting with a letter or digit), \"title\": 1 to 80 characters, \"ontology_id\", \"load\": {\"kind\": \"current\"} (whichever load is current when it is viewed) or {\"kind\": \"pinned\", \"load_id\"}, \"query\": a typed query, the query read of helix_foundry_read_graph (helix_foundry_read_guide gives its schema): at most 200 rows or 100 groups, \"visual\": {\"kind\": \"table\" | \"bar\" | \"line\" | \"figure\"} or {} to show it as its output suits}. An answer's visual (helix_foundry_ask's) is a tile already: its question's queries[].query with the visual's kind and title.",
