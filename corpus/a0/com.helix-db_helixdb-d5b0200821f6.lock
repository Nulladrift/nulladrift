        {
          "name": "helix_foundry_get_load",
          "title": "Get a Foundry load",
          "description": "Get one load of a Foundry ontology with its newest jobs (the load that writes it, and extracts that add documents to it): their status, phase, progress, error and spend. documents counts what it made of its documents, in all and by document set: how many a model read, how many its version does not read (not_read_by_version: stored and searchable, nothing in the graph), their fact writes, the reviews they left (left_for_review: counted as each document was written, so not the number still open) and names matched to no one record (names_unresolved, which overlaps the reviews). A job's progress counts a document as done whether or not it was read, so report documents' counts, not progress, when you say what a load read. documents can be absent though the load holds documents: its description says when. With wait, waits up to 25 s while it runs; call again until it ends.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "load_id": {
                "description": "The load's id, as helix_foundry_get_ontology or a create_load action returned it.",
                "type": "string"
              },
              "ontology_id": {
                "description": "Foundry ontology identifier.",
                "type": "string"
              },
              "wait": {
                "description": "Wait up to 25 s while it is writing or one of its jobs is queued or running, then return it either way; call again until it ends.",
                "type": "boolean"
              },
              "workspace_id": {
                "description": "Helix workspace identifier. May be empty when the caller has only one workspace (a service key always does).",
                "type": "string"
              }
            },
            "required": ["load_id", "ontology_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_trust": {
                "type": "string"
              },
              "documents": {
                "additionalProperties": false,
                "description": "What the load made of the documents it holds. Absent in three cases, which a caller can't tell apart from this result alone: the load holds no documents (its version was given no document sets, or they hold no text document or PDF); the caller reads the load through source grants, in whole or in part; or the load was made before Foundry recorded which documents a load holds. So absence does not say nothing was left unread: when the load's version has document_set_ids, say the counts are unavailable and count from helix_foundry_list_documents.",
                "properties": {
                  "duplicate": {
                    "description": "Documents whose text repeats another document's.",
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "facts_written": {
                    "description": "Fact writes by the documents: each document counts the facts it created and the stored facts it added its evidence to, so a fact two documents state counts twice. It is not the number of distinct facts in the graph.",
                    "type": "integer"
                  },
                  "failed": {
                    "description": "Documents whose extraction failed.",
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "left_for_review": {
