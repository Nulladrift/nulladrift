        {
          "name": "helix_foundry_get_version",
          "title": "Get an ontology version",
          "description": "Get one version of a Foundry ontology with its definition (such as a generation's draft before it is made current) and load_refusal: why create_load would refuse it, absent when it would load it. document_set_ids are the sets it was given; document_reads says which of them its routes read (read_set_ids) and which it only stores (unread_set_ids: searchable, nothing extracted into the graph). An agent bundle comes with its open questions (definition.questions; a default is the agent's suggestion, not a decision) and what the draft left out of its sources (definition.left_out, each with its reason; tables lists every synced table by the id the definition uses), each with, when the agent said, because: \"not_assessed\" (it ran out of budget before it looked; a new generation can pick it up), {\"user_asked\": {\"said\": the user's own words}} (the user asked to leave it out) or {\"documents_state\": {\"route\", \"item\"}} (documents already state it through the route extraction.<route>; item is a link or Type.prop), but not the agent's working draft: to act on an answer, or to read what it left out, generate again with that in the goal. A definition past 256 KiB is refused, with its load_refusal.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ontology_id": {
                "description": "Foundry ontology identifier.",
                "type": "string"
              },
              "version_id": {
                "description": "Ontology version identifier.",
                "type": "string"
              },
              "workspace_id": {
                "description": "Helix workspace identifier. May be empty when the caller has only one workspace (a service key always does).",
                "type": "string"
              }
            },
            "required": ["ontology_id", "version_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_trust": {
                "type": "string"
              },
              "version": {
                "additionalProperties": false,
                "properties": {
                  "created_at": {
                    "type": "string"
                  },
                  "current": {
                    "type": "boolean"
                  },
                  "definition": {
                    "description": "Untrusted ontology definition, in the shape format names. An agent bundle's questions are the draft's open questions: a question's default is the agent's suggestion, not a decision, so read what the draft does from its files and document_reads. Its left_out lists what the draft left out of the sources it was given, each {what, reason} and, when the agent said, because (helix_foundry_get_version gives its three shapes): what starts with a source's id, then names the field when it is one. A synced table's id is src_ and 16 hex digits, and its entry also has connector_id and table (the version's tables lists every one); a table file's is its document id, which helix_foundry_list_documents names; a document set's is the set's id, which helix_foundry_get_ontology names."
                  },
                  "document_reads": {
                    "additionalProperties": false,
                    "properties": {
                      "read_set_ids": {
                        "items": {
                          "type": "string"
                        },
                        "type": ["null", "array"]
                      },
                      "unread_set_ids": {
                        "items": {
                          "type": "string"
                        },
                        "type": ["null", "array"]
                      }
                    },
                    "required": ["read_set_ids", "unread_set_ids"],
                    "type": ["null", "object"]
                  },
                  "document_set_ids": {
                    "items": {
                      "type": "string"
                    },
                    "type": ["null", "array"]
                  },
                  "format": {
                    "type": "string"
                  },
                  "generation_id": {
                    "type": "string"
                  },
                  "id": {
                    "type": "string"
                  },
                  "load_refusal": {
                    "type": "string"
                  },
                  "source": {
                    "type": "string"
                  },
                  "tables": {
                    "description": "The synced tables its generation drafted from, each with the id (source_id, src_ and 16 hex digits) its definition names the table by, in mappings_toml and at the start of a left_out entry. Only helix_foundry_get_version returns it; absent for a version no generation drafted, one drafted from no synced table, and a caller who can't read its generation.",
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "connector_id": {
                          "type": "string"
                        },
                        "source_id": {
                          "type": "string"
                        },
