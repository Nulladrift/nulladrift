                          "maximum": 2147483647,
                          "minimum": -2147483648,
                          "type": ["null", "integer"]
                        },
                        "retrying": {
                          "description": "A reading read waiting to run again after a failure that was not the file's.",
                          "type": "boolean"
                        },
                        "rows": {
                          "description": "A table file's rows, once read.",
                          "type": ["null", "integer"]
                        },
                        "state": {
                          "description": "ready (ontologies can read it: text, or a file whose read succeeded), reading (being read, or waiting to be: a generation started now leaves it out, and a load holding a PDF waits and reads it once the read ends) or failed (it can't be read: error_code and error_message say why, and a load records a failed PDF with the same code; upload a fixed file, or fix a connection's at its source).",
