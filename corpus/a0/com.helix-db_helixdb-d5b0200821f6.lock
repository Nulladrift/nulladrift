          "title": "List Foundry documents",
          "description": "List the documents a Foundry ontology reads, with what extracting each into the current load made of it; or every document of one of the workspace's document sets. A document with source is a connector's, the text of one row of its table: it can't be renamed, moved or deleted, and new text at the source replaces it with a new document.",
