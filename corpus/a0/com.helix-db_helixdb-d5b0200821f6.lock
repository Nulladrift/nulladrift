              "ontology_id": {
                "description": "Foundry ontology identifier.",
                "type": "string"
              },
              "use_case_id": {
                "description": "The use case, as helix_foundry_create_use_case or helix_foundry_list_use_cases returned it.",
                "type": "string"
              },
              "workspace_id": {
                "description": "Helix workspace identifier. May be empty when the caller has only one workspace (a service key always does).",
                "type": "string"
              }
            },
            "required": ["ontology_id", "use_case_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "assessment": {
                "additionalProperties": false,
                "description": "Its assessment, once it finished: how much what it read made its answer. A run that made no call to the ontology has none: it isn't assessed.",
                "properties": {
                  "assessment": {
                    "description": "Untrusted, once done: the summary, the answer's claims (supported, unsupported or contradicted, with the calls' seqs that bear on them), the gaps the ontology had for the request, and suggested changes."
                  },
                  "error": {
                    "type": "string"
                  },
                  "left_out": {
                    "description": "The calls whose results were left out to fit the model.",
                    "items": {
                      "maximum": 2147483647,
                      "minimum": -2147483648,
                      "type": "integer"
                    },
                    "type": ["null", "array"]
                  },
                  "status": {
                    "type": "string"
                  },
                  "usd_micros": {
                    "type": "integer"
                  },
                  "verdict": {
                    "description": "Once done: essential, helpful, marginal, unused or misleading.",
                    "type": "string"
                  }
                },
                "required": ["status", "usd_micros"],
                "type": ["null", "object"]
              },
              "content_trust": {
                "type": "string"
              },
              "counts": {
                "additionalProperties": false,
                "properties": {
                  "accesses": {
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "pieces": {
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "questions": {
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "reads": {
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "results_omitted": {
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "sends": {
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "uploads": {
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  }
                },
                "type": ["null", "object"]
              },
              "finished_at": {
                "type": "string"
              },
              "from_workflow_run_id": {
                "description": "For a run Foundry started: the workflow run it records (helix_foundry_get_workflow_run's run_id; its use case's workflow names the workflow). Not a use_case_run_id: this run's own id is id.",
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "input": {
                "type": "string"
              },
              "next": {
                "type": "string"
              },
              "output": {
                "type": "string"
              },
              "started_at": {
                "type": "string"
              },
              "status": {
                "type": "string"
              },
              "use_case_id": {
                "type": "string"
              }
            },
            "required": ["content_trust", "counts", "id", "started_at", "status", "use_case_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
