        {
          "name": "helix_foundry_ask",
          "title": "Ask a Foundry ontology",
          "description": "Answer a question about a business from its Foundry ontology, with every claim citing the entities, facts, rows or document quotes it read: use it, in plain language, for questions about the user's customers, accounts, people, deals, documents or anything else their connected data holds. Waits up to 25 seconds; until the question is done, call helix_foundry_get_question. Each question counts against the workspace's hourly limit and monthly budget.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "client_token": {
                "description": "A unique string of at most 64 characters. The same token returns the same question instead of asking again, so a retry is safe.",
                "type": "string"
              },
              "focus": {
                "additionalProperties": false,
                "description": "The entity the question is about.",
                "properties": {
                  "id": {
                    "description": "Its id as reads return it: a keyed type's key encoding (such as sapp.example.com for the key app.example.com) or a named type's name. Give exactly one of id, key and name.",
                    "type": "string"
                  },
                  "key": {
                    "description": "Its key's plain values as the source holds them: the value alone for a key of one property (such as app.example.com or 42), or an object of each key property's value."
                  },
                  "name": {
                    "description": "A name in any spelling.",
                    "type": "string"
                  },
                  "type": {
                    "description": "The entity's type in the ontology; with key or name it may be left out, to find the entity among every type.",
                    "type": "string"
                  }
                },
                "type": ["null", "object"]
              },
              "load_id": {
                "description": "Load to ask; the ontology's current load when empty.",
                "type": "string"
              },
              "ontology_id": {
                "description": "Foundry ontology identifier.",
                "type": "string"
              },
              "question": {
                "description": "The question, in plain language.",
                "type": "string"
              },
              "thread_id": {
                "description": "A question's thread_id, to continue that conversation; empty starts a new one.",
                "type": "string"
              },
              "use_case_run_id": {
                "description": "An open run of a use case (helix_foundry_start_use_case_run) to record this call under; empty for none.",
                "type": "string"
              },
              "valid_at": {
                "description": "Answer as of this day, YYYY-MM-DD, not after today (UTC); empty for now. Entities are read as they were then and documents dated after it are left out; reads that can only show the load as it is now (queries, searches for entities) are refused, never answered as of now instead. A follow-up takes its thread's day; anyone who reads the load through grants can't ask as of a day.",
                "type": "string"
              },
              "workspace_id": {
                "description": "Helix workspace identifier. May be empty when the caller has only one workspace (a service key always does).",
                "type": "string"
              }
            },
            "required": ["client_token", "ontology_id", "question"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "attempts": {
                "maximum": 2147483647,
                "minimum": -2147483648,
                "type": "integer"
              },
              "content_trust": {
                "type": "string"
              },
              "created_at": {
                "type": "string"
              },
              "done": {
                "type": "boolean"
              },
              "error": {
                "type": "string"
              },
              "finished_at": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "load_id": {
                "type": "string"
              },
              "question": {
                "type": "string"
              },
              "result": {
                "description": "Untrusted answer: the ontology agent's AskResult, set once answered or cannot_answer. An integer past 2^53 comes as a string of its digits, which JSON numbers would round. Its queries come without their outputs: to see the rows one of the answer's visuals shows, read its query (queries[].query) again with helix_foundry_read_graph, as a query read on the question's load_id."
              },
              "status": {
                "type": "string"
              },
