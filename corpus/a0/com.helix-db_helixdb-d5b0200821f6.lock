        {
          "name": "helix_get_query_insights",
          "title": "Get query insights",
          "description": "Get per-query statistics for one database over a time window: how often each query ran and failed, its average and maximum latency, and what the query planner found. Latency percentiles are helix_get_query_latency's, and recommendations helix_list_query_recommendations's.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "database": {
                "description": "Database reference in cluster:<id> or tenant:<id> form.",
                "type": "string"
              },
              "end": {
                "description": "Exclusive RFC3339 end time. Supply together with start instead of period.",
                "type": "string"
              },
              "limit": {
                "description": "Maximum insights to return, from 1 through 20.",
                "type": "integer"
              },
              "period": {
                "description": "A period ending now. Or give start and end instead.",
                "enum": ["1h", "6h", "24h", "7d", "30d"],
                "type": "string"
              },
              "sort": {
                "description": "How to order the queries; last_seen when empty.",
                "enum": ["last_seen", "event_count", "failure_count", "average_latency", "maximum_latency"],
                "type": "string"
              },
              "start": {
                "description": "Inclusive RFC3339 start time. Supply together with end instead of period.",
