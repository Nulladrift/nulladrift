              },
              "kind": {
                "description": "The connector's kind: stripe, workos, posthog, github, linear, calcom, granola, slack, notion, google, databuddy, attio, postgres, mysql, s3 or events (an API source).",
                "type": "string"
              },
              "name": {
                "description": "A new connector's name when it signs in; the kind's display name when empty. Not with connector_id.",
                "type": "string"
              },
              "project_id": {
                "description": "A new PostHog connector's project id when it signs in, a number from its project settings; empty takes the account's one project. Not with connector_id.",
                "type": "string"
              },
