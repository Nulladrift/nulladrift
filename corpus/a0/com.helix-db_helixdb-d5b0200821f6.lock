              "next_page_token": {
                "type": "string"
              },
              "reviews": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "candidates": {
                      "description": "The entities the name may be, by their stored identity (a keyed type's entity_key, such as scus_1).",
                      "items": {
                        "type": "string"
                      },
                      "type": ["null", "array"]
                    },
                    "confidence": {
                      "type": ["null", "number"]
                    },
                    "doc_id": {
                      "type": "string"
                    },
                    "end": {
                      "type": ["null", "integer"]
                    },
                    "entities": {
                      "description": "The entities it concerns as the load holds them: its candidates and its property's entity, each by the identity candidates and entity_key name it by, with its stored name (untrusted).",
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "entity_key": {
                            "type": "string"
                          },
                          "name": {
                            "type": "string"
                          },
                          "norm_name": {
                            "type": "string"
                          },
                          "type": {
                            "type": "string"
                          }
                        },
                        "required": ["type"],
                        "type": "object"
                      },
                      "type": ["null", "array"]
                    },
                    "entity_key": {
                      "type": "string"
                    },
                    "link": {
                      "type": "string"
                    },
                    "norm_name": {
                      "description": "The name to resolve, normalized.",
                      "type": "string"
                    },
                    "prop": {
                      "type": "string"
                    },
                    "quote": {
                      "description": "The document's words it was read from: untrusted text.",
                      "type": "string"
                    },
                    "reason": {
                      "type": "string"
                    },
                    "review_key": {
                      "description": "settle_review's review_id.",
                      "type": "string"
                    },
                    "section": {
                      "type": ["null", "integer"]
                    },
                    "settle": {
                      "description": "What settle_review's decision is: resolve ({resolve: {entity_key}} naming one of candidates, or {resolve: {not_in_data: true}}), prop ({prop: {...}} with one of values, or another value of the property's type, or {prop: {null: true}}), release ({release: {statement_hash}} approves the statement, {reject: {statement_hash}} says it is wrong), stale (missing what settling reads: a new load writes it again) or none (no decision settles it).",
                      "type": "string"
                    },
                    "start": {
                      "type": ["null", "integer"]
                    },
                    "statement": {
                      "description": "The statement held back, as JSON text {subject: {type, name}, object: {type, name}, props}: untrusted.",
                      "type": "string"
                    },
                    "statement_hash": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "values": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "doc_id": {
                            "type": "string"
                          },
                          "quote": {
                            "type": "string"
                          },
                          "value": {
                            "description": "A value a document states, as JSON: settle with prop text for a string, integer (as a string of digits) or number as the property's type takes it, or boolean."
                          }
                        },
                        "required": ["value"],
                        "type": "object"
                      },
                      "type": ["null", "array"]
                    }
                  },
                  "required": ["reason", "review_key", "settle"],
