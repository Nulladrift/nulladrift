                      },
                      "status": {
                        "description": "queued, running, succeeded, failed, cancelled or skipped (never started: error says why).",
                        "type": "string"
                      },
                      "steps": {
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "error": {
                              "type": "string"
                            },
                            "node_id": {
                              "type": "string"
                            },
                            "output": {
                              "description": "Untrusted: what it gave (summary, answer, count, branch, result)."
                            },
                            "status": {
                              "type": "string"
                            }
                          },
                          "required": ["node_id", "status"],
                          "type": "object"
                        },
                        "type": ["null", "array"]
