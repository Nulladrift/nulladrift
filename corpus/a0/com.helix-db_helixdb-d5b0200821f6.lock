                        "error_message": {
                          "description": "For failed: why, and what to fix.",
                          "type": "string"
                        },
                        "kind": {
                          "description": "How ontologies read the document: text (Markdown, MDX and plain text, extracted through routes as they are, and WebVTT transcripts, extracted as their turns, a line each), table (a CSV, TSV, JSON, JSONL or Parquet file, read once at upload as a table of its own that mappings name by the document's id; it counts with synced tables toward the 50 tables a generation covers, and its cells are not extracted) or pdf (read once to its text, at upload or, for a Google Drive PDF, when its connection's sync writes it; loads extract that text through routes and generations read it as text).",
