                    "type": "string"
                  },
                  "failures": {
                    "maximum": 2147483647,
                    "minimum": -2147483648,
                    "type": "integer"
                  },
                  "id": {
                    "type": "string"
                  },
                  "last_run": {
                    "additionalProperties": false,
                    "properties": {
                      "created_at": {
                        "type": "string"
                      },
                      "error": {
                        "type": "string"
                      },
                      "finished_at": {
                        "type": "string"
                      },
                      "id": {
