        {
          "name": "helix_foundry_list_review_decisions",
          "title": "List review decisions",
          "description": "List the review decisions settled on a Foundry ontology: the overrides each load after them applies. An approval of a held claim (release), a chosen value (prop) and a resolve also apply to the current load at once (a resolve of a name that load already links another way only from the next load). A reject is a person's word that a held claim is wrong: it is sent to no load, its review stays in the graph and stays counted in left_for_review, and people no longer see it under Needs review or in the review queue. A decision made on a card of the site's review queue says how it was drawn (drawn). A withdraw is an approval a person took back from the current load, which may have written it: that load is sent it at once, and it is listed only while that load is current. applied says what became of each in the current load; of a withdraw, withdrawn means the claim is held for review again, and refused that what the approval wrote stays.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ontology_id": {
                "description": "Foundry ontology identifier.",
                "type": "string"
              },
              "page_token": {
                "description": "Opaque continuation token from the previous call.",
                "type": "string"
              },
              "workspace_id": {
                "description": "Helix workspace identifier. May be empty when the caller has only one workspace (a service key always does).",
                "type": "string"
              }
            },
            "required": ["ontology_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_trust": {
                "type": "string"
              },
              "decisions": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "applied": {
                      "additionalProperties": false,
                      "description": "What became of a release, a chosen value, a resolve or a withdraw in the ontology's current load; absent for one that load's list doesn't hold yet (a resolve of a name the load already linked another way waits for the next load), and for a reject. A resolve applies to the current load at once: one that chose an entity also links that name to it in every document of that load where the load would otherwise ask (an alias; a document's extraction names says what became of it there), and not in data applies to its own document only.",
                      "properties": {
                        "at": {
                          "description": "When a job said so.",
                          "type": "string"
                        },
                        "reason": {
                          "description": "Why it was refused, in the engine's word or the backend's (document_changed: the load holds the claim's document with other text than the claim was read in, so it can't write it; a new load reads the new text and writes it where its commit holds the same claim, and otherwise the claim must be found and approved again in that load's reviews); when unconfirmed, why no word came (job_failed, or of a withdraw not_replayed or document_failed).",
                          "type": "string"
                        },
                        "status": {
                          "description": "A release: pending, written, refused, missed or unconfirmed (its job failed before saying). A value: pending, applied or unconfirmed. A resolve: pending, written (reason not_asked: nothing in the load asked about the name any more), refused (reason: the engine's word, as an extraction name's reason, or not_named, or no_word: its job ended without word of its document, and the next load applies it) or unconfirmed. A withdraw: pending, withdrawn (the claim is held again), not_written (the load held nothing the approval wrote), refused (what the approval wrote stays) or unconfirmed (no word came: its job failed, and the ontology's next job sends it again; or, with not_replayed, its document's saved reading can't be reused, so no word can come while this load is current and the next load won't write the approval; or, with document_failed, the next approval or take-back in its document sends it again). Empty: the load read it when it was made and no job said what became of it.",
                          "type": "string"
                        },
                        "takes_back": {
                          "description": "Of a release: the current load may have written it, so removing the decision takes it back from that load rather than only dropping it.",
                          "type": "boolean"
                        }
                      },
                      "required": ["status"],
                      "type": ["null", "object"]
                    },
                    "claim_end": {
                      "maximum": 4294967295,
                      "minimum": 0,
                      "type": ["null", "integer"]
                    },
                    "claim_key": {
                      "type": "string"
                    },
                    "claim_section": {
                      "maximum": 4294967295,
                      "minimum": 0,
                      "type": ["null", "integer"]
                    },
                    "claim_start": {
                      "maximum": 4294967295,
                      "minimum": 0,
                      "type": ["null", "integer"]
                    },
                    "decided_at": {
                      "type": "string"
                    },
                    "decided_by_user_id": {
                      "type": "string"
                    },
                    "doc_id": {
                      "type": "string"
                    },
                    "drawn": {
                      "description": "ranked or random: how the review queue showed the card it was decided on; absent for a decision made elsewhere",
                      "type": "string"
                    },
                    "entity_key": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "norm_name": {
                      "type": "string"
                    },
                    "prop": {
                      "type": "string"
                    },
                    "statement_hash": {
                      "type": "string"
                    },
                    "type": {
                      "type": "string"
                    },
                    "value": {
                      "additionalProperties": true,
                      "type": "object"
                    }
                  },
                  "required": ["decided_at", "decided_by_user_id", "id", "kind", "type"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "next_page_token": {
                "type": "string"
              }
            },
            "required": ["content_trust", "decisions"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "visibility": ["model"]
            }
          },
          "digest": "sha256:71ff30c249c1f02cd37cd5d24449562d693ae4f6d33277b7a1754655af2ce2a2"
        },
        {
          "name": "helix_foundry_list_reviews",
          "title": "List an ontology's reviews",
          "description": "List the reviews a Foundry ontology's current load holds: what its documents state that it didn't write as it stands. A name it matched to no one record (settle resolve, with its candidates), a property its documents state differently (prop, with each value and its quote), or a statement it held back (release: approve or reject it by its statement_hash), each with the entities it concerns by name. 50 a page of one load, or the ones review_keys names. Settle one with the settle_review action. A review someone settled stays listed until a load writes the decision: helix_foundry_list_review_decisions lists those.",
