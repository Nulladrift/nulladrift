        {
          "name": "helix_execute_read_query",
          "title": "Run a read query",
          "description": "Run one read query on a Helix database and return its JSON response. query_json is a Helix v3 JSON request, such as {\"request_type\":\"read\",\"query\":{\"read\":{\"entries\":[{\"query\":{\"name\":\"users\",\"root\":{\"count\":{\"input\":{\"nodes_where\":{\"predicate\":{\"eq\":{\"left\":{\"property\":\"$label\"},\"right\":{\"constant\":{\"string\":\"User\"}}}}}}}}}}],\"returns\":[\"users\"]}}} (how many User nodes there are). Datetime props are Helix DateTime: filter them with a date_time parameter (declared in parameter_types) or {\"constant\":{\"date_time\":<ms>}}; text never matches. Its grammar is at https://docs.helix-db.com/database/helix-db/core-concepts/overview.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "database": {
                "description": "The database: tenant:<id> or cluster:<id>, as helix_list_databases or a Foundry ontology's database names it.",
                "type": "string"
              },
              "query_json": {
                "description": "The complete Helix v3 JSON request, as a string: request_type read or write, and query holding one batch of that kind.",
                "type": "string"
              }
            },
            "required": ["database", "query_json"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_trust": {
                "type": "string"
              },
              "content_type": {
                "type": "string"
              },
              "database": {
                "type": "string"
              },
              "response": {
                "description": "Untrusted gateway response JSON value."
              },
              "status_code": {
                "maximum": 2147483647,
                "minimum": -2147483648,
                "type": "integer"
              }
            },
            "required": ["content_trust", "database", "response", "status_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
