        {
          "name": "helix_foundry_complete_document_upload",
          "title": "Complete a document upload",
          "description": "After an upload_document action, once its bytes are PUT to the upload URL: check them and add the document to its document set, which every ontology whose current version reads the set then reads (reads says how). Completing twice is no error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "document_id": {
                "description": "The document upload_document created.",
                "type": "string"
              },
              "ontology_id": {
                "description": "Foundry ontology identifier.",
                "type": "string"
              },
              "use_case_run_id": {
                "description": "An open run of a use case (helix_foundry_start_use_case_run) to record this upload under; empty for none.",
                "type": "string"
              },
              "workspace_id": {
                "description": "Helix workspace identifier. May be empty when the caller has only one workspace (a service key always does).",
                "type": "string"
              }
            },
            "required": ["document_id", "ontology_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_trust": {
                "type": "string"
              },
              "document": {
                "additionalProperties": false,
                "properties": {
                  "created_at": {
                    "type": "string"
                  },
                  "extraction": {
                    "additionalProperties": false,
                    "properties": {
                      "carried": {
                        "description": "Entities linked by a name a person linked to that entity in another document, which the load carries to every document.",
                        "maximum": 2147483647,
                        "minimum": -2147483648,
                        "type": "integer"
                      },
                      "duplicate_of": {
                        "type": "string"
                      },
                      "entities": {
                        "maximum": 2147483647,
                        "minimum": -2147483648,
                        "type": "integer"
                      },
                      "error_code": {
                        "type": "string"
                      },
                      "facts": {
                        "maximum": 2147483647,
                        "minimum": -2147483648,
                        "type": "integer"
                      },
                      "finished_at": {
                        "type": "string"
                      },
                      "names": {
                        "description": "What the load did with each decision on a name that met the document: its own resolve decisions, and the names carried from other documents where the load would otherwise have asked a person.",
                        "items": {
                          "additionalProperties": false,
                          "properties": {
                            "decision": {
                              "description": "resolve (the document's own decision on the name) or alias (a name a person linked to an entity in another document, carried to this one).",
                              "type": "string"
                            },
                            "decision_id": {
                              "description": "The decision's id: of an alias, the resolve decision that linked the name.",
                              "type": "string"
                            },
                            "norm_name": {
                              "type": "string"
                            },
                            "outcome": {
                              "description": "written (applied in this load), not_asked (nothing in this load waited on it; it applies when the document is read again), not_named (the document doesn't name it) or refused (not applied; reason says why).",
                              "type": "string"
                            },
                            "reason": {
                              "description": "Why it was refused: absent (the entity chosen isn't in the load), bound (the document's name is already linked another way; it changes when the document is read again), collides (another name in the document is already that entity), differs (the load no longer matches what the document gave; it applies when the document is read again), too_large (too large to write in place; the next load applies it), two_rows (another entity goes by the name too, or people linked it to different entities), role_term (a role, like the Customer, not a name), shared (another party in the document goes by it too), identifier (the document gives an identifier that doesn't match the entity), other_identity (the names show a different legal company), not_replayed (the document was read by an older version, or sent again without its reading; the next load applies it). Another reason means not applied in this load.",
                              "type": "string"
                            },
                            "type": {
                              "type": "string"
                            }
