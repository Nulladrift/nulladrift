        {
          "name": "helix_foundry_read_guide",
          "title": "Describe Foundry graph reads",
          "description": "Describe the reads helix_foundry_read_graph takes: their kinds and JSON Schema.",
          "inputSchema": {
            "additionalProperties": false,
            "type": "object"
          },
          "outputSchema": {
