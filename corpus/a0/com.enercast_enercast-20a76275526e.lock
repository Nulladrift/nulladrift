              "project": {
                "description": "Project name or part of it",
                "type": "string"
              },
              "since": {
                "description": "Only rows on or after this date, YYYY-MM-DD (change date or milestone date)",
                "type": "string"
              },
              "tracker": {
                "description": "pipelines = New Pipelines tracker, storage = New Storage tracker",
                "enum": ["pipelines", "storage"],
                "type": "string"
              },
              "view": {
