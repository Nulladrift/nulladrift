                "enum": ["changes", "milestones"],
                "type": "string"
              }
            },
            "required": ["tracker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Project change log (Institutional)"
          },
          "behavior": {
