          },
          "digest": "sha256:f4f6766faeb355805274e3b9290fb7494353199dfd08dc97f327116444e9da1f"
        }
      ],
      "digest": "sha256:22fd09ba17ac5e4a41d78f73a958847498b0adf142cebc223bd6a6b62a854641"
    }
  }
