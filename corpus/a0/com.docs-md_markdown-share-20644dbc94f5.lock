{
  "lockfileVersion": 2,
  "subjects": {
    "com.docs-md/markdown-share": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docs-md.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "md-share",
        "title": "Docs MD",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Docs MD publishes markdown at a public link (https://docs-md.com/<id>) with no account.\nUse share_markdown when the user wants to send, publish, hand off or review a markdown document (plans, specs, reports, READMEs, agent handoffs). Default expiry is 30 days; use \"never\" only when asked for a permanent link.\nAlways give the user the URL and keep the edit token: it is the only way to update_share or delete_share later.\nUse read_share to fetch the markdown of any docs-md.com link someone gives you (for example a handoff from another agent).\nAnything shared is public to whoever has the link: never include passwords, API keys, card numbers or other people's personal data.",
      "tools": [
        {
          "name": "delete_share",
          "title": "Delete Shared Markdown",
          "description": "Permanently delete a share using its id and edit token.",
          "inputSchema": {
            "properties": {
              "edit_token": {
                "description": "Edit token returned when the share was created",
                "type": "string"
              },
              "id": {
                "description": "The share id (the URL path segment)",
                "type": "string"
              }
            },
            "required": ["edit_token", "id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7325bed8be356c5b61573c373733c4bbaeb5ce0a06579dd38aa76148d25bdea5"
        },
        {
          "name": "read_share",
          "title": "Read Shared Markdown",
          "description": "Fetch the raw markdown of a docs-md.com share. Accepts the share id or any docs-md.com share URL. Use it when someone gives you a docs-md.com link, for example a handoff written by another agent.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Share id (e.g. calm-river-Ab12C) or a docs-md.com share URL",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:9e444a64cd2ca957a5ce90072e2eb2e13e275d56e88f6c4539ea7a91250b60cc"
        },
        {
          "name": "share_markdown",
          "title": "Share Markdown",
          "description": "Publish markdown at a public docs-md.com link that renders it (tables, code, mermaid diagrams, table of contents). Use it to send a plan, spec, report, README or agent handoff to a person or another agent. Returns the URL, a raw-markdown URL and an edit token for later updates or deletion.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The markdown content to share (up to 120,000 characters)",
                "type": "string"
              },
              "expiry": {
                "description": "How long the link stays live (default 30d; \"never\" keeps it forever)",
                "enum": ["1d", "7d", "30d", "never"],
                "type": "string"
              },
              "filename": {
                "description": "Optional file name shown as the page title, e.g. \"HANDOFF.md\" or \"plan.md\"",
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe098424589c10e12220800a09fb0b60bda8e5885359d10d682f4fec2ab19181"
        },
        {
          "name": "update_share",
          "title": "Update Shared Markdown",
          "description": "Replace the content of an existing share using its id and edit token.",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The new markdown content",
                "type": "string"
              },
              "edit_token": {
                "description": "Edit token returned when the share was created",
                "type": "string"
              },
              "filename": {
                "description": "Optional new filename",
                "type": "string"
              },
              "id": {
                "description": "The share id (the URL path segment)",
                "type": "string"
              }
            },
            "required": ["content", "edit_token", "id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28f566f4b8121ce25831d7fdbb8a450c5cb5d52a93d9ed0eb47a7f27ff83d2cc"
        }
      ],
      "digest": "sha256:cf041d0c882c530e5720dfcaa663371e9212c51d5a826c063bdb380c6c2d337e"
    }
  }
}
