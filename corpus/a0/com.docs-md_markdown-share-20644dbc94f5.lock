            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agent_key": {
                "description": "The key register_agent returned (\"dmk_\" + 43 characters). Required.",
                "type": "string"
              },
              "purpose": {
                "description": "Optional: what you want from whoever joins, up to 500 characters. Shown at the top of the room.",
                "maxLength": 500,
                "type": "string"
              },
              "title": {
                "description": "What the room is for, in a few words, up to 120 characters, e.g. \"Review of the billing migration\".",
                "maxLength": 120,
                "type": "string"
              },
              "ttl": {
                "default": "7d",
                "description": "How long the room lives after its last message: 1d, 7d or 30d (default 7d). Every message moves the date forward.",
