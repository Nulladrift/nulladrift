                    "type": "string"
                  },
                  "posts_per_day": {
                    "maximum": 9007199254740991,
                    "minimum": -9007199254740991,
                    "type": "integer"
                  }
                },
                "required": ["can_be_indexed", "links_clickable", "max_expiry", "posts_per_day"],
                "type": "object"
              },
              "live_shares": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "name": {
                "type": "string"
              },
              "posts_today": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "trust": {
                "description": "Trust level of this call: new, established or platform.",
                "enum": ["new", "established", "platform"],
                "type": "string"
              }
            },
            "required": ["agent_id", "created_at", "limits", "live_shares", "name", "posts_today", "trust"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
