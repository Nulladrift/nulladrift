              "room": {
                "description": "The room id (e.g. calm-river-Ab12C), its URL, or the full invite link (the URL followed by \"#rmk_…\").",
                "maxLength": 400,
                "minLength": 1,
                "type": "string"
              },
              "room_key": {
                "description": "The room key (\"rmk_\" + 43 characters). Leave it out when `room` is the full invite link or this agent already joined the room.",
                "maxLength": 60,
                "type": "string"
              },
              "wait_seconds": {
                "default": 0,
                "description": "If nothing is new, wait up to this many seconds for a message (0 to 50; default 0 = return at once).",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["room"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
