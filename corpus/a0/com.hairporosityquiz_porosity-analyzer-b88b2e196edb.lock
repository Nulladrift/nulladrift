        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://hairporosityquiz.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.hairporosityquiz/porosity-analyzer",
        "title": "Hair Porosity & 1A-4C Hair Type Analyzer",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only deterministic hair porosity and 1A-4C hair-type calculator. Call list_hair_porosity_factors to inspect the 12 questions and valid option IDs, then call analyze_hair_porosity with user answers to compute a 0-100 porosity score, hair type, and 6-section care blueprint.",
      "tools": [
        {
          "name": "analyze_hair_porosity",
          "title": "Analyze Hair Porosity & 1A-4C Hair Type",
          "description": "Calculate deterministic Low/Medium/High hair porosity score (0-100), 1A-4C hair type classification, strand width, elasticity, scalp profile, and cuticle factor breakdown from quiz answers. Full 6-section routine blueprint is unlocked on hairporosityquiz.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "additionalProperties": false,
                "description": "Map of question IDs to option IDs (call list_hair_porosity_factors to inspect all valid IDs). Provide at least one factor; omitted factors use neutral midpoint defaults.",
                "minProperties": 1,
                "properties": {
                  "air_dry_time": {
                    "description": "Moisture Retention & Release (weight 1.5): How long does washed hair take to air-dry completely without heat? Options: slow_dry (4 hours or longer); moderate_dry (1.5 to 3.5 hours); fast_dry (Under 1.5 hours).",
                    "enum": ["slow_dry", "moderate_dry", "fast_dry"],
                    "type": "string"
                  },
                  "breakage_splits": {
                    "description": "Cuticle Friction & Ends (weight 1): How often do you experience tangling, rough feel, or split ends? Options: smooth_rare_splits (Smooth feel and rare tangles); moderate_ends (Minor tangles at ends between trims); rough_splits (Rough cuticle feel, frequent knots, or splits).",
                    "enum": ["smooth_rare_splits", "moderate_ends", "rough_splits"],
                    "type": "string"
                  },
                  "chemical_heat": {
                    "description": "Heat & Chemical History (weight 1.4): What heat or chemical treatments has your hair had in the past 12 months? Options: virgin_no_heat (None (virgin hair, rare or no heat)); mild_color_heat (Occasional heat or single-process dye); bleached_high_heat (Bleach, highlights, perm, or frequent high heat).",
                    "enum": ["virgin_no_heat", "mild_color_heat", "bleached_high_heat"],
                    "type": "string"
                  },
                  "conditioner_absorption": {
                    "description": "Conditioner Uptake (weight 1.2): In the shower, how does rinse-out conditioner behave on wet hair? Options: slippery_coat (Stays slippery on top and needs thorough rinsing); even_slip (Coats evenly and detangles in 1 to 2 minutes); vanishes_wants_more (Absorbs fast so strands still feel thirsty).",
                    "enum": ["slippery_coat", "even_slip", "vanishes_wants_more"],
                    "type": "string"
                  },
                  "curl_pattern": {
                    "description": "Natural Curl Pattern (1A-4C) (weight 0): When air-dried with zero styling product, what is your natural shape? Options: straight (Straight (1A-1C)); wavy (Wavy (2A-2C)); curly (Curly (3A-3C)); coily (Coily (4A-4C)).",
                    "enum": ["straight", "wavy", "curly", "coily"],
                    "type": "string"
                  },
                  "elasticity": {
                    "description": "Cortex Elasticity (weight 0): When you gently stretch a wet shed strand, how does it respond? Options: low_elasticity (Barely stretches and snaps quickly); balanced_elasticity (Stretches slightly and springs right back); high_stretch (Stretches far and stays limp or mushy).",
                    "enum": ["low_elasticity", "balanced_elasticity", "high_stretch"],
                    "type": "string"
                  },
                  "humidity_response": {
                    "description": "Humidity & Dew-Point Reaction (weight 1): How does your hair behave on humid or rainy days? Options: stays_sleek (Stays sleek or falls slightly flatter); mild_halo (Mild halo frizz or softened shape); swells_puffs (Swells fast, puffs up, or loses definition).",
                    "enum": ["stays_sleek", "mild_halo", "swells_puffs"],
                    "type": "string"
                  },
                  "mist_absorbency": {
                    "description": "Dry-Strand Mist Test (weight 1.2): When you mist dry hair with plain water, what happens within 2 minutes? Options: droplets_sit (Tiny droplets rest on top of the strands); softens_slowly (Dampens evenly and softens gradually); vanishes_fast (Absorbs immediately and dries back rough).",
                    "enum": ["droplets_sit", "softens_slowly", "vanishes_fast"],
                    "type": "string"
                  },
                  "product_buildup": {
                    "description": "Surface Buildup Behavior (weight 1.2): How does your hair react to leave-in creams, oils, or serums? Options: sits_on_top (Sits on top and feels coated or greasy); absorbs_steady (Absorbs smoothly without residue); drinks_fast (Drinks product fast and feels dry again).",
                    "enum": ["sits_on_top", "absorbs_steady", "drinks_fast"],
                    "type": "string"
                  },
                  "scalp_oiliness": {
                    "description": "Scalp Sebum Cadence (weight 0): How soon after washing does your scalp feel oily or need a wash? Options: oily_scalp (Within 24 to 36 hours); balanced_scalp (Days 2 to 4); dry_scalp (Day 5+ or rarely feels oily).",
                    "enum": ["oily_scalp", "balanced_scalp", "dry_scalp"],
                    "type": "string"
                  },
                  "strand_diameter": {
                    "description": "Strand Diameter (weight 0): Roll one shed strand between two fingers. How thick does it feel? Options: fine (Fine (hard to feel, thinner than thread)); medium_strand (Medium (similar to sewing thread)); coarse (Coarse (distinctly thicker or wiry)).",
                    "enum": ["fine", "medium_strand", "coarse"],
                    "type": "string"
                  },
                  "wetting_speed": {
                    "description": "Cuticle Water Resistance (weight 1.5): How fast does clean hair soak completely under running shower water? Options: beads_slow (Water beads up (60+ seconds to soak)); even_wetting (Wets evenly in 15 to 45 seconds); instant_soak (Soaks almost instantly (under 15 seconds)).",
                    "enum": ["beads_slow", "even_wetting", "instant_soak"],
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "includeRoutineBlueprint": {
                "default": false,
                "description": "Optional compatibility flag. Free MCP responses return the deterministic porosity assessment and an unlock link for the full 6-section routine blueprint.",
                "type": "boolean"
              }
            },
            "required": ["answers"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Analyze Hair Porosity & 1A-4C Hair Type"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8d3596666fb432d562ccf897b3d0034fb78a3561b7d1f4e6b923fe9c4630f243"
        },
