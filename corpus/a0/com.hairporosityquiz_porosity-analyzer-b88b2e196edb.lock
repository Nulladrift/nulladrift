          "name": "list_hair_porosity_factors",
          "title": "List Hair Porosity Assessment Factors",
          "description": "List all 12 deterministic hair porosity and 1A-4C hair-type assessment questions, valid option IDs, scoring weights, and Low/Medium/High porosity score thresholds.",
          "inputSchema": {
