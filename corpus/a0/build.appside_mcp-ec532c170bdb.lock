        },
        {
          "name": "submit_index_entry",
          "description": "Submit a web store to the Index for review; does not establish ownership or publish automatically. Pass token or an Authorization: Bearer header on HTTP /mcp. Never publish credentials.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entry": {
                "type": "object"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["entry"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
