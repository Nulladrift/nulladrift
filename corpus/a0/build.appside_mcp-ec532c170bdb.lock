          "digest": "sha256:80899c5fc39d62084c42d85645ec27f2b71b1003d75eac10d3d940d7604bc385"
        },
        {
          "name": "get_sdk_snippet",
          "description": "Get a repository SDK example and its documented verification status. Grant items only on verified backend delivery.",
