          },
          "digest": "sha256:b37eab23e82dd8e148b1ef652738bdaf0af86871e7436207803d50e081f13dab"
        },
        {
          "name": "submit_mcp_server",
          "description": "Submit an MCP server for connectivity checks. Domain proof is still required to claim ownership. Pass token or an Authorization: Bearer header on HTTP /mcp. Never publish credentials.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "server": {
                "type": "object"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["server"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6f622d7d6701a95562f2937b37e375c3cd888018618cf17ce6ddce6c946ce105"
        },
        {
          "name": "verify_app",
          "description": "Verify a pending registration after publishing the returned token at /.well-known/appside-verify.txt or in a meta name=\"appside-verify\" content=\"TOKEN\" tag on the submitted website. For itch.io, put the token anywhere in the public text of the exact submitted game page (edit its description). Store-only apps put the token in every submitted public store description. Success makes the catalog page searchable and indexable.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 100,
                "type": "string"
              },
              "token": {
                "description": "Optional Appside bearer token. Associates registrations with your account. Store securely; never log it.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
