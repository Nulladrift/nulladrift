        },
        {
          "name": "get_sdk_status",
          "description": "List all SDK download URLs, install instructions and scoped verification status, or select one platform.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "platform": {
                "enum": ["web", "ios", "android", "unity", "react-native", "flutter", "node", "python"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e67b0f4017a4f631a2d90de125f8e0a8a836dfe5773ce6369960a2acbf2fa9ed"
        },
        {
          "name": "register_app",
          "description": "List any app or game you built in the Appside public app catalog. No Appside store or account required. Supply plain-text metadata and your website or exact https://<account>.itch.io/<game> page (or App Store/Google Play listing for a store-only app). Returns an id and ownership token; publish the token then call verify_app. Nothing is public until verified; pending entries expire after 14 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "appStoreUrl": {
                "type": "string"
              },
              "category": {
                "enum": ["game", "productivity", "education", "entertainment", "health", "finance", "social", "other"],
                "type": "string"
              },
              "contactEmail": {
                "description": "Optional private contact, never shown publicly.",
                "maxLength": 254,
                "type": "string"
              },
              "description": {
                "maxLength": 300,
                "minLength": 25,
                "type": "string"
              },
              "name": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "platforms": {
                "items": {
                  "enum": ["web", "ios", "android", "windows", "macos", "linux"],
                  "type": "string"
                },
                "maxItems": 6,
                "minItems": 1,
                "type": "array",
                "uniqueItems": true
              },
              "playStoreUrl": {
                "type": "string"
              },
              "token": {
                "description": "Optional Appside bearer token. Associates registrations with your account. Store securely; never log it.",
                "type": "string"
              },
              "url": {
                "description": "HTTPS app website on a domain you control, or the exact game page on your own itch.io subdomain. Each itch game path is a separate identity. Omit only for store-only apps.",
                "type": "string"
              },
              "webBuildUrl": {
                "description": "HTTPS playable build on your verified hostname, an itch game page, or https://itch.io/embed-upload/<id>; itch game pages resolve to the browser upload at verification; click-to-load sandboxed Play.",
                "type": "string"
              }
            },
            "required": ["category", "description", "name", "platforms"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3a8c3749ca750afa37fe562500c78be101619d38abf26e5974c684198bc555df"
        },
        {
          "name": "search_apps",
          "description": "Search verified public apps and games by text, category or playable web build. Pending, expired and moderated listings are excluded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "enum": ["game", "productivity", "education", "entertainment", "health", "finance", "social", "other"],
                "type": "string"
              },
              "limit": {
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "minimum": 0,
                "type": "integer"
              },
              "playable": {
                "type": "boolean"
              },
              "query": {
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
