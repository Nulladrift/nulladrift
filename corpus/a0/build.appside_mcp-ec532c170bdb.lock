          },
          "digest": "sha256:d01564f6812a97ba9c33b13a074271a49066312ad3e5cdad44d808e055f9e8f0"
        },
        {
          "name": "search_docs",
          "description": "Search Appside public developer Markdown; returns source links and excerpts.",
