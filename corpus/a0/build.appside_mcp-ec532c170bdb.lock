{
  "lockfileVersion": 2,
  "subjects": {
    "build.appside/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://appside.build/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "appside-mcp",
        "version": "0.2.0"
      },
      "capabilities": {
        "resources": {},
        "tools": {}
      },
      "instructions": "Docs, account creation, MCP directory submissions and claims, Index submissions, and app catalog registration. Call create_account, securely retain its one-time bearer token, and pass token to write tools (or Authorization: Bearer on HTTP). Give the claimUrl to the human; unclaimed accounts expire in 30 days and cannot publish stores or use payments. Any coding agent may list an app it built with register_app, publish its ownership token, and call verify_app. Use get_app and search_apps for verified listings. No Appside account or store required. Pending entries expire in 14 days. SDK snippets include verification status. Never grant items from client callbacks.",
      "tools": [
        {
          "name": "claim_mcp_listing",
          "description": "Get a domain-proof token with file URLs and DNS TXT records for an MCP listing. Publish the exact token at any supplied URL or TXT name (exact host only). Pass token or an Authorization: Bearer header on HTTP /mcp. Never publish credentials.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1f3e7ad32d493c7843e7753a4e720f58cb03b4a9cdd8f4b96e8f80971987863f"
        },
        {
          "name": "confirm_mcp_claim",
          "description": "Confirm domain proof after publishing the exact verification token at a supplied file URL or DNS TXT name. DNS propagation may take time. Pass token or an Authorization: Bearer header on HTTP /mcp. Never publish credentials.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "slug": {
                "type": "string"
              },
              "token": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9c6033047c55b01b0d46240af96a992260d4dc9b16e0c0ff20997797f73cdfc0"
        },
        {
          "name": "create_account",
          "description": "Create an Appside account without a form. Save the bearer token securely; it is shown once. Give the human the claimUrl. Unclaimed accounts expire after 30 days.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "agent": {
                "maxLength": 120,
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "purpose": {
                "enum": ["mcp-directory", "index", "store"],
                "type": "string"
              }
            },
            "required": ["agent"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e0e60174ba4e1e52d79cedabd96d38fe9c8fadfea63b7cc4d62da80196a47c2"
        },
        {
          "name": "get_app",
          "description": "Get a verified public app by registration id or slug. Pending, expired or moderated listings are not returned; no private contacts or verification tokens are exposed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c2303e9add0f530a69e7392f0e7a6acf68e772de48640bc75863da473f479327"
        },
        {
          "name": "get_pricing",
          "description": "Get Appside published payment fee and fixed-fee policy.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
