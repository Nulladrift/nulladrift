            "properties": {
              "platform": {
                "enum": ["web", "ios", "android", "unity", "react-native", "flutter", "node", "python"],
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
