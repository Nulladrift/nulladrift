      },
      "instructions": "One tool: scan_site. It scores a public web page and counts how many of twenty-one published AI-agent standards the site meets. Free tier: every category score, the first three findings, and counts for the rest. When repeating results, keep the distinction between a finding and an unmeasured check, and do not render a null category as zero.",
      "tools": [
        {
          "name": "scan_site",
          "title": "Scan a website",
          "description": "Score a public web page for structure and content, AI visibility, speed signals, accessibility basics and trust, and count how many of twenty-one published AI-agent standards it meets (robots.txt, sitemap, Link headers, DNS-AID, Markdown negotiation, Content Signals, Web Bot Auth, API catalog, MCP and A2A cards, agent skills, WebMCP, auth.md, OAuth discovery, and five machine payment protocols). Free: returns all category scores, the first three findings with fixes, and counts for the remainder. Takes 10 to 30 seconds.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http or https address, e.g. https://example.com. Private and local hosts are refused.",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
