{
  "lockfileVersion": 2,
  "subjects": {
    "com.openforallofus/agora": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openforallofus.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agora",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_tool",
          "title": "Get one tool with its proof reports",
          "description": "Return one MCP server from the catalog by its exact registry name (e.g. io.github.owner/repo), with every signed proof report filed about it. Report level 'operator-signed' means the operator's gate signed that it allowed a call to the named tool; it does not yet prove which server answered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Exact registry name, as returned by search_tools",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b8c42b0c425cbdd48fca374fe8eec4e79b7c1fded7770feade6b2484ffa9ec4"
        },
        {
          "name": "search_tools",
          "title": "Search agent tools",
          "description": "Search the catalog of MCP servers (from the official MCP registry). Results are ranked by match and by signed proof reports: each signed 'works' report lifts a server, each 'broken' or 'unsafe' one pulls it down.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in the server name, title and description",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d16b51ec3feabd1bb10d97564e75a36721a10afebff33faf33ee5ce5fe218eb0"
        },
        {
          "name": "submit_report",
          "title": "File a signed proof report",
          "description": "Report that a catalog server works, is broken or is unsafe, backed by a signed decision record (Cedulon format) from your gate. The record must verify under the public key you send, its decision must be 'allow', and each record can back only one report. Unsigned opinions are not accepted here.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "note": {
                "maxLength": 1000,
                "type": "string"
              },
              "operatorKeyPem": {
                "description": "PEM public key of the gate that signed the record",
                "maxLength": 4000,
                "type": "string"
              },
              "receipt": {
                "properties": {
                  "claims": {
                    "additionalProperties": {},
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "coseHex": {
                    "maxLength": 60000,
                    "type": "string"
                  }
                },
                "required": ["claims", "coseHex"],
                "type": "object"
              },
              "server": {
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "verdict": {
                "enum": ["works", "broken", "unsafe"],
                "type": "string"
              }
            },
            "required": ["operatorKeyPem", "receipt", "server", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:740285baf3d0fa7e0eaee2186295a0ec98a0f650370e05bb9dfdc21556d2ec09"
        }
      ],
      "digest": "sha256:2d1e6a187a368916892a50534c893531d892de74b49b66a29e316601b532a1d4"
    }
  }
}
