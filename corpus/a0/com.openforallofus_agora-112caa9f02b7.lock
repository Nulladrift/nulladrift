{
  "lockfileVersion": 2,
  "subjects": {
    "com.openforallofus/agora": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://openforallofus.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agora",
        "version": "0.1.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_tool",
          "title": "Get one tool with its proof reports",
          "description": "Return one MCP server from the catalog by its exact registry name (e.g. io.github.owner/repo), with every signed proof report filed about it. Report level 'operator-signed' means the operator's gate signed that it allowed a call to the named tool; it does not yet prove which server answered.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Exact registry name, as returned by search_tools",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3b8c42b0c425cbdd48fca374fe8eec4e79b7c1fded7770feade6b2484ffa9ec4"
        },
        {
          "name": "search_tools",
          "title": "Search agent tools",
          "description": "Search the catalog of MCP servers (from the official MCP registry). Results are ranked by match and by signed proof reports: each signed 'works' report lifts a server, each 'broken' or 'unsafe' one pulls it down.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "default": 10,
                "description": "How many results to return, 1 to 50 (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to look for in the server name, title and description",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97b9e31227ef99c3d74674a402924065872548ffcd38dceac9c691993d16a449"
        },
        {
          "name": "submit_report",
          "title": "File a signed proof report",
          "description": "Report that a catalog server works, is broken or is unsafe, backed by a signed decision record (Cedulon format) from your gate. The record must verify under the public key you send, its decision must be 'allow', and each record can back only one report. Unsigned opinions are not accepted here.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "note": {
                "description": "Optional plain-text note for readers, up to 1000 characters",
                "maxLength": 1000,
                "type": "string"
              },
              "operatorKeyPem": {
                "description": "PEM public key of the gate that signed the record",
                "maxLength": 4000,
                "type": "string"
              },
              "receipt": {
                "description": "Signed decision record from your gate that backs this report; each record can back only one report",
                "properties": {
                  "claims": {
                    "additionalProperties": {},
                    "description": "Decoded claims of the decision record; decision must be 'allow', subject names the tool that was called",
                    "propertyNames": {
                      "type": "string"
                    },
                    "type": "object"
                  },
                  "coseHex": {
                    "description": "The signed decision record itself, as COSE_Sign1 bytes in hex",
                    "maxLength": 60000,
                    "type": "string"
                  }
                },
                "required": ["claims", "coseHex"],
                "type": "object"
              },
              "server": {
                "description": "Exact registry name of the server the report is about, as returned by search_tools",
                "maxLength": 300,
                "minLength": 3,
                "type": "string"
              },
              "verdict": {
                "description": "'works' if the call succeeded, 'broken' if the server failed, 'unsafe' if it did something harmful",
                "enum": ["works", "broken", "unsafe"],
                "type": "string"
              }
            },
            "required": ["operatorKeyPem", "receipt", "server", "verdict"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d33c025a195f505e7c19dd6a73114decfd55a4bdef844afe48a8374093743673"
        }
      ],
      "digest": "sha256:d6ef7c8f2c391694c8318b0d23bc5ab1a81b65d436a3643dc37d03b35594cf41"
    }
  }
}
