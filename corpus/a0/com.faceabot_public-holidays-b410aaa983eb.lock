{
  "lockfileVersion": 2,
  "subjects": {
    "com.faceabot/public-holidays": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/holidays"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-public-holidays",
        "title": "Faceabot Public Holidays",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Public Holidays: official public holidays of about 200 countries, free, no key.\npublic_holidays {\"country\":\"DE\",\"year\":2027} · next_public_holidays {\"country\":\"JP\"} · is_public_holiday {\"country\":\"BE\",\"date\":\"2026-11-11\"}.\nData: Nager.Date (open source); for legal or payroll decisions, check the government's calendar.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "is_public_holiday",
          "title": "Is this date a public holiday?",
          "description": "Says whether a date is a public holiday in a country (and whether nationwide or regional), with the holiday's name.\nUse when: deciding if offices, banks or schools are closed on a given day.\nExample: {\"country\":\"BE\",\"date\":\"2026-11-11\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country code or name",
                "examples": ["BE"],
                "type": "string"
              },
              "date": {
                "description": "Date YYYY-MM-DD (default: today, UTC)",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ed03d0eb7950179803b0e523c47fb74383c64b4ab2cd04d4d33a08465508677f"
        },
        {
          "name": "next_public_holidays",
          "title": "Next public holidays of a country",
          "description": "The next public holidays of a country from today, with how many days away.\nUse when: \"when is the next holiday in Japan?\", \"next long weekend in France\".\nExample: {\"country\":\"Japan\",\"limit\":3}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country code or name",
                "examples": ["JP"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:593a3ad3436d8797ca4a3f868eaed4910cab2686e456f9a828120ad3a4449102"
        },
        {
          "name": "public_holidays",
          "title": "Public holidays of a country for a year",
          "description": "Lists the official public holidays of a country for a year (about 200 countries): date, English and local name, nationwide or only some regions. Bank-only holidays are left out unless asked.\nUse when: \"public holidays in Germany 2027\", \"jours fériés en Belgique\", planning deliveries or meetings.\nExample: {\"country\":\"DE\",\"year\":2027}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country: 2-letter code (DE, JP, BR…) or name in English, French, German, Spanish, Italian, Dutch or Portuguese",
                "examples": ["DE"],
                "type": "string"
              },
              "include_bank_holidays": {
                "default": false,
                "description": "Also list bank-only and optional holidays",
                "type": "boolean"
              },
              "year": {
                "description": "Year (default: this year)",
                "maximum": 2075,
                "minimum": 1975,
                "type": "integer"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0d1e4cc58762a1b7b5f9cd39c0fda06e875d2c09080e7ea38825f7f07e81272e"
        }
      ],
      "digest": "sha256:34ce5d731963d41f7fdc74f12550f4e872d44eafa061c65e34f3ce36e0a60c4e"
    }
  }
}
