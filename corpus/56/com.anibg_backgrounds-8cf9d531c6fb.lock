      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AniBG is a free library of anime backgrounds without characters: places such as classrooms, streets, shrines and train stations, most drawn at day, sunset and night. Call search_backgrounds first, then give the user the `url` of a result: a 1920x1080 JPG that never changes and may be hotlinked; download_image is only for when you need to look at a picture. The images are free for personal and commercial projects without credit, but may not be resold on their own or used to train image models. When nothing fits: if this connection carries the user's AniBG API key, generate_background paints a new picture with their bought credits (2K costs 1, 4K costs 2); without a key, call studio_link and give the user the link, so they can make it themselves in Studio.",
      "tools": [
        {
          "name": "download_image",
          "title": "Look at a picture",
          "description": "Fetch one picture so you can see it: returns the image itself, plus its permanent links and alt text. Use it only when you need to look (to check a picture suits the user, or to describe it); to hand a picture over, give the user the url from search_backgrounds instead. size 1280 (WebP, usually 100 to 300 KB) is the default and enough to look at; 640 is smaller; 1920 is the full JPG of up to 1 MB and rarely needed. Example: {\"id\": \"bg-001\", \"time\": \"night\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Scene id, like bg-001.",
                "maxLength": 20,
                "pattern": "^[A-Za-z]+-[0-9]+$",
                "type": "string"
              },
              "size": {
                "default": 1280,
                "description": "Width in pixels: 640 or 1280 (WebP), 1920 (JPG).",
                "enum": [640, 1280, 1920],
                "type": "integer"
              },
              "time": {
                "description": "Time of day; the scene's first time (usually day) when absent. get_scene lists the times a scene has.",
                "enum": ["day", "sunset", "night", "rain", "snow"],
                "type": "string"
              }
            },
            "required": ["id"],
