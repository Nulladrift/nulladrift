        {
          "name": "generate_background",
          "title": "Paint a new background",
          "description": "Paint a new anime background (scenery without characters) with the user's AniBG credits, when search_backgrounds has nothing that fits and the user wants it made. Needs the user's AniBG API key on this connection (header Authorization: Bearer anibg_…); without one the tool says where the user gets it, and studio_link is the way instead. Spends bought credits only: 2K costs 1, 4K costs 2 (free sign-up credits are for Studio). Describe a new place with prompt, or start from a library scene (scene, scene_time) or an earlier picture of the user (job) to change its time of day, shape or size, with prompt for changes. Waits up to wait seconds; if the picture is not done by then, call get_generation with its id. Example: {\"prompt\": \"empty rooftop of a school at dusk, chain-link fence, water tank\", \"time\": \"sunset\"}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect": {
                "description": "Shape (default 16:9; 9:16 for phones).",
                "enum": ["16:9", "9:16", "1:1", "4:3"],
                "type": "string"
              },
              "job": {
                "description": "The id of an earlier picture of this account to start from.",
                "maxLength": 32,
                "pattern": "^[0-9a-f]{32}$",
                "type": "string"
              },
              "prompt": {
                "description": "What the place looks like, in plain words, without people. Required unless scene or job is given; with them, what to change.",
                "maxLength": 400,
                "type": "string"
              },
              "quality": {
                "description": "Size: 2k (1 credit, default) or 4k (2 credits).",
                "enum": ["2k", "4k"],
                "type": "string"
              },
              "scene": {
                "description": "A library scene id, like bg-014, to start from.",
                "maxLength": 20,
                "pattern": "^[A-Za-z]+-[0-9]+$",
                "type": "string"
              },
              "scene_time": {
                "description": "With scene: which of the scene's pictures to start from (default: time, if the scene has it).",
                "enum": ["day", "sunset", "night", "rain", "snow"],
                "type": "string"
              },
              "time": {
                "description": "Time of day or weather (default day).",
                "enum": ["day", "sunset", "night", "rain", "snow"],
                "type": "string"
              },
              "wait": {
                "default": 45,
                "description": "Seconds to wait for the picture before answering (0 to 55, default 45). Most take 20 to 60 seconds.",
                "maximum": 55,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
