        {
          "name": "search_backgrounds",
          "title": "Search backgrounds",
          "description": "Search the AniBG library of free anime backgrounds (scenery without characters). Use it first whenever someone wants an anime background, wallpaper or scene for a visual novel, stream, video call or desktop. Words for a place or a time inside q act as filters, in English, Japanese or Chinese (\"night classroom\", \"rainy shrine\", \"夜の教室\"). Returns up to limit scenes (default 5), each with the picture that answers the query: give the user its url, a permanent 1920x1080 JPG that may be hotlinked. When nothing fits, the result carries a Studio link for the user. Example: {\"q\": \"train station at sunset\", \"limit\": 3}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of titles, summaries, place names and texts, and of the page links (ja, zh); English where no translation exists.",
                "enum": ["en", "ja", "zh"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many results, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Skip this many results, for the next page.",
                "minimum": 0,
                "type": "integer"
              },
              "place": {
                "description": "Only scenes of this place.",
                "enum": ["classroom", "bedroom", "city-street", "rooftop", "cafe", "train-station", "shrine", "beach", "forest", "living-room", "convenience-store", "countryside", "school", "sky", "park", "house", "cherry-blossom", "library", "clubroom", "school-hallway", "gym-pool", "train-interior", "subway-station", "hot-spring", "festival", "family-restaurant", "office", "hospital", "fantasy-tavern", "magic-library", "castle", "ancient-ruins", "cyberpunk-alley", "sci-fi-bridge", "snowy-village"],
                "type": "string"
              },
              "q": {
                "description": "Free text: a place, a time of day, things in the picture (\"quiet cafe at night\", \"torii gate\").",
