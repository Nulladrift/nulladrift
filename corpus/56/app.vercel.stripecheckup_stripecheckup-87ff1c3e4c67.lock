      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_stripe_code",
          "description": "Paste Stripe integration source code (a webhook handler, a checkout-session-creation route, or both concatenated) and get back pattern-based findings for the most common integration bugs: missing webhook signature verification, missing customer.subscription.updated handling (the single most common bug -- dunning marks a subscription past_due/unpaid, not canceled, so a handler that only reacts to .deleted leaves non-paying customers with access forever), missing checkout metadata/client_reference_id, and premature customer creation. This is regex pattern matching over text, not a real parser -- treat a clean result as 'didn't find a problem', not a guarantee. Nothing pasted is stored.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Stripe webhook handler and/or checkout-session-creation source code",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3e2dca94900c44d201dc8661c3cd4e922ec272b05055ea40e19364bdbbd22ffd"
        }
      ],
