                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "tal_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Existing TAL to append the new leaf to. Parts already assigned to any leaf of this TAL are never taken (the territory drifts instead). Without it, a new TAL is created.",
                "title": "Tal Id"
              },
              "tal_label": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Display name for the new TAL when tal_id is omitted. Ignored when tal_id is given.",
                "title": "Tal Label"
              },
              "target": {
                "additionalProperties": false,
                "description": "What the territory grows toward. Fit is closest: |achieved - value| is minimized, so the result may land slightly under or over.",
                "if": {
                  "properties": {
                    "type": {
                      "const": "metric_sum"
                    }
                  }
                },
                "properties": {
                  "field": {
                    "description": "Required for metric_sum. Must be a column declared in metric_fields (or workload_fields) at ingest; otherwise UNDECLARED_FIELD.",
                    "minLength": 1,
                    "type": "string"
                  },
                  "type": {
                    "description": "location_count counts points in the point layer; metric_sum sums a declared numeric metric column.",
                    "enum": ["location_count", "metric_sum"],
                    "type": "string"
                  },
                  "value": {
                    "description": "Target count or target sum.",
                    "exclusiveMinimum": 0,
                    "type": "number"
                  }
                },
                "required": ["type", "value"],
                "then": {
                  "required": ["field"]
                },
                "type": "object"
              },
              "territory_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Display name for the new leaf. Defaults to the next free \"Territory N\" in the TAL. Must be unique within the TAL.",
                "title": "Territory Name"
