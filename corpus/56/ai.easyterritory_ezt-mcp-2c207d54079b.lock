                "description": "Attribute filter resolved via query_parts (e.g. {\"state_abbr\": \"TX\"}). Implies part_scope explicit. Mutually exclusive with part_ids. Inside an existing TAL's footprint: {\"in_tal\": {\"tal_id\": \"tal-1\"}} with no seed tal_id (in_tal of the seed's own tal_id is INVALID_REQUEST). White space (parts no TAL covers): add not_in_tal, e.g. {\"state_abbr\": \"TX\", \"not_in_tal\": {\"tal_id\": \"tal-1\"}}; a person-trimmed set is {\"selection_task_id\": \"psel_...\"} after get_part_selection reports committed."
              },
              "part_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Explicit eligible part set. Implies part_scope explicit. Mutually exclusive with part_filter.",
                "title": "Part Ids"
              },
              "part_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Part layer to grow over, e.g. us_zips (ezt://part-layers). Required unless tal_id names a TAL that already has one; must match that TAL's layer when both are given.",
                "title": "Part Layer"
              },
              "part_scope": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Growth reads only the seed's neighbourhood (rings outward from the seed part), so this is an allowlist switch, not a performance prerequisite. explicit: confine growth to part_ids or part_filter (e.g. state_abbr TX) when the user wants the territory bounded by that geography. bbox_intersect / point_matched are accepted for compatibility with auto_build and ignored — seed_build never joins the whole point layer to the bbox parts.",
                "title": "Part Scope"
              },
              "point_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Ingested point layer whose locations are counted or summed. Required when the TS has more than one point layer.",
                "title": "Point Layer"
              },
              "seed": {
                "additionalProperties": false,
                "description": "Where growth starts. For an address or POI, stage it as one row with request_account_upload, then geocode_address(upload_handle); a map click already gives coordinates.",
                "properties": {
                  "latitude": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
