                    },
                    "required": ["territory_label"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null
              },
              "part_layer": {
                "title": "Part Layer",
                "type": "string"
              },
              "prompt": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Human-facing selection instruction shown by the host/agent or MC.",
                "title": "Prompt"
              },
              "purpose": {
                "default": "generic",
                "title": "Purpose",
                "type": "string"
              },
              "realign_operation": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Realign Operation"
              },
              "remove_empty_territories": {
                "default": false,
                "title": "Remove Empty Territories",
                "type": "boolean"
              },
              "ts_handle": {
                "anyOf": [
                  {
                    "type": "string"
