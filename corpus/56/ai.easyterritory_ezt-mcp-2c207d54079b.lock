        {
          "name": "import_geojson",
          "title": "Import GeoJSON",
          "description": "Opens a GeoJSON FeatureCollection (points, or a territory file, plain or gzip/zip) as a Territory Solution; returns ts_handle and a summary. A file of any real size moves by reference, never inline: call with no file argument for an upload_url (give the user share_with_user, or POST it with curl_example), then poll import_geojson(upload_handle) every recommended_poll_delay_ms until upload_status=received. geojson_file takes a host file (download_url). Inline geojson / geojson_text / geojson_gzip take at most 256 KB; a larger one returns INLINE_PAYLOAD_TOO_LARGE with the upload_url call to make. Polygons without part_ids import as polygon areas with tal_kind=\"polygon\" (measured by point-in-polygon), or convert to parts with part_layer + overlay_policy=\"centroid_within\". For a Designer project, use import_designer_project.",
          "inputSchema": {
            "properties": {
              "geojson": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "GeoJSON FeatureCollection: point features and/or EZT-exported territory features carrying part_ids. Incoming properties.style (color / opacity / size / shape / weight) on features and point_layers[] / route_layers[] is kept as-is; only missing paint is filled, so a reopened export paints exactly as saved (ts-reference.schema.json#/$defs/style).",
                "title": "Geojson"
              },
              "geojson_file": {
                "anyOf": [
                  {
                    "oneOf": [
                      {
                        "minLength": 1,
                        "type": "string"
                      },
                      {
                        "additionalProperties": true,
                        "properties": {
                          "download_url": {
                            "type": "string"
                          },
                          "file_id": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    ]
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Host file parameter (openai/fileParams): an object with a temporary https download_url, or that URL as a string."
              },
              "geojson_gzip": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Base64 gzip or zip bytes of a GeoJSON FeatureCollection.",
                "title": "Geojson Gzip"
              },
              "geojson_text": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
