                ],
                "default": null,
                "description": "Requested session TTL in seconds. Server may cap at policy maximum.",
                "title": "Expiry Seconds"
              },
              "interaction_flags": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "allow_click_select": {
