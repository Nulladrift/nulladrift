        {
          "name": "points_in_territory",
          "title": "Points in Territory",
          "description": "Lists which account points from one point layer fall inside a territory polygon or a drive-time (isochrone) area. Per territory: point_count, metric_sums (metrics, else the layer's declared metric fields), and a sample of sample_size points (default 25, max 200; 500 across all territories) with label and metric fields, or only the fields you name. Counts and sums cover every inside point. The full list is never inline: it is in points_artifact, via download_url (GET with the API key) or share_with_user (one-hour key-less link for the user). Synchronous, read-only; needs map_session_id or ts_handle. territory_id names one leaf (id or unique display name), territory_ids several; omit both for every leaf in the TAL (tal_id, else the active or sole TAL). point_layer defaults to the sole layer with points; point_filter (e.g. {tier: 'Gold'}) filters before counting. A point counts in every containing polygon; overlaps lists shared points. Unknown ids return UNKNOWN_TAL_ID / UNKNOWN_TERRITORY_ID / UNKNOWN_POINT_LAYER with the available values.",
          "inputSchema": {
            "properties": {
              "fields": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Point properties to keep on sample points and in points_artifact. Omitted: the sample carries label plus the metric fields, and the artifact carries every property.",
                "title": "Fields"
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
              },
              "metrics": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Numeric point columns to sum per territory. Defaults to the layer's declared metric fields.",
                "title": "Metrics"
              },
              "point_filter": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "anyOf": [
                        {
                          "type": ["string", "number", "boolean"]
                        },
                        {
                          "items": {
                            "type": ["string", "number", "boolean"]
                          },
                          "minItems": 1,
                          "type": "array"
                        }
                      ]
                    },
                    "minProperties": 1,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional attribute filter (column -> value or list of values, matched case-insensitively, e.g. {\"tier\": \"Gold\"}) applied to the point layer before counting and listing."
              },
              "point_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Point layer id or exact unique label. Optional when the solution has one layer with points.",
                "title": "Point Layer"
              },
              "sample_size": {
                "default": 25,
                "description": "Points shown inline per territory; the server lowers it so at most 500 sample points come back across all territories. point_count and metric_sums always cover every inside point; points_artifact lists them all.",
                "title": "Sample Size",
                "type": "integer"
              },
              "tal_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Territory alignment to query. Defaults to the active TAL, or the sole TAL with leaf polygons.",
                "title": "Tal Id"
              },
              "territory_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "One leaf: its stable territory_id or exact unique display name. Mutually exclusive with territory_ids.",
