        {
          "name": "territory_merge",
          "title": "Merge Territories",
          "description": "Merges a pair of adjacent territories (N to N-1 territories). By default, territory_id_b is folded into territory_id_a (or renamed to new_territory_label) and the rest of the alignment rebalances with minimal disruption, e.g. when a rep leaves and neighbors absorb the territory. Set preserve_other_territories=true for an exact two-territory union that combines only territory_id_a and territory_id_b (optionally named new_territory_label) and leaves every other territory unchanged with no rebalance. Non-adjacent ids return NON_ADJACENT_TERRITORIES. Needs source_tal_id and the Territory Solution from map_session_id or ts_handle; workload rebalance needs dwell_time (CLARIFICATION_REQUIRED otherwise). Writes a new derived alignment. Returns a task.",
          "inputSchema": {
            "properties": {
              "balance_tolerance": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Accepted for compatibility. The power-diagram rebalance converges on its own internal tolerance, so this value no longer gates per-part moves.",
                "title": "Balance Tolerance"
              },
              "disruption_weight": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Incumbency stickiness for the warm-started power-diagram rebalance. 0 is a pure power re-solve (max balance, more churn); higher values keep more of the source alignment by requiring a neighbor territory to inflate further before it can claim a border part.",
                "title": "Disruption Weight"
              },
              "dwell_time": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Onsite (dwell) time per visit: {type: 'scalar', value: <number>, unit: 'minutes'|'hours'} or {type: 'field', field: '<column>', unit: 'minutes'|'hours'}.",
                    "properties": {
                      "field": {
                        "description": "Point column name holding per-account onsite time when type='field'.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": {
                        "description": "Dwell source: 'scalar' for a fixed per-visit duration or 'field' for an ingested point column.",
                        "enum": ["scalar", "field"],
                        "type": "string"
                      },
                      "unit": {
                        "default": "minutes",
                        "description": "Time unit for value or field ('minutes' or 'hours').",
                        "enum": ["minutes", "hours"],
                        "type": "string"
                      },
                      "value": {
                        "description": "Confirmed onsite duration per visit when type='scalar'.",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Dwell Time"
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
              },
              "new_tal_label": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Label for the derived TAL. Defaults to '<source label> (<operation>)'.",
                "title": "New Tal Label"
              },
              "new_territory_label": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional display label for the merged territory (defaults to territory_id_a's label).",
                "title": "New Territory Label"
              },
              "objective": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Balance objective: workload_bias + metric_bias + count_bias = 100, weighting workload (drive + dwell), one metric column, and account count. Workload: {workload_bias: 100}. Metric: {metric: '<column>', workload_bias: 0, metric_bias: 100}. Count: {workload_bias: 0, count_bias: 100}. Three-way: {metric: 'Score', workload_bias: 40, metric_bias: 40, count_bias: 20}. Only one metric column balances; combine several into one score column at ingest. Omitted on restructure tools: inherits the source TAL build_provenance objective.",
                    "properties": {
                      "count_bias": {
                        "description": "Weight (0..100) on account count (locations per territory). Default 0.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "metric": {
                        "description": "Point metric column name to balance (e.g. 'Revenue', 'Score'). Required when metric_bias > 0. Account count is count_bias, not a column.",
                        "type": "string"
                      },
                      "metric_bias": {
                        "description": "Weight (0..100) on the metric column.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "workload_bias": {
                        "description": "Weight (0..100) on workload (drive time + dwell).",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Objective"
              },
              "part_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Part layer (e.g. us_zips). Required only when not inferable from the source TAL.",
                "title": "Part Layer"
              },
              "point_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional point layer used to compute per-part workload/metric measures. When omitted, a uniform geography-only weighting is used.",
                "title": "Point Layer"
              },
              "preserve_other_territories": {
                "default": false,
                "description": "When true, performs an exact union of territory_id_a and territory_id_b without rebalancing any other territory in the alignment.",
                "title": "Preserve Other Territories",
                "type": "boolean"
              },
              "repair_policy": {
                "default": "default",
                "description": "Topology repair for dissolved territories. default fills interior holes in the dissolved geometry (no part is added or reassigned; repair_summary.changed_part_ids lists the territories' own parts). report_only detects holes and changes nothing (warning REPAIR_AVAILABLE). strict fails with REPAIR_REQUIRED when a hole is found.",
                "enum": ["default", "strict", "report_only"],
                "title": "Repair Policy",
                "type": "string"
              },
              "source_tal_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Source TAL. Optional for form-capable clients that can answer via elicitation.",
                "title": "Source Tal Id"
              },
              "territory_id_a": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "First territory (id or label). The merged territory keeps this identity unless new_territory_label is supplied.",
                "title": "Territory Id A"
              },
              "territory_id_b": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Second territory (id or label). Must be adjacent to territory_id_a.",
                "title": "Territory Id B"
              },
              "ts_handle": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Territory Solution reference (tsh_...) from a build, ingest_accounts, import_geojson, import_designer_project, or get_map_visualization; Territory Solutions are not accepted inline.",
                "title": "Ts Handle"
              },
              "visit_frequency_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Numeric visits-per-cycle column on the point layer. When omitted, inherits from source TAL build_provenance or point-layer metadata.",
                "title": "Visit Frequency Field"
              }
            },
            "title": "territory_mergeArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "description": "Present when ok is false.",
                "properties": {
                  "ask_user": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "code": {
                    "type": "string"
                  },
                  "details": {
                    "type": "object"
                  },
                  "do_this_next": {
                    "type": "object"
                  },
                  "message": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "ok": {
                "type": "boolean"
              },
              "result": {
                "description": "Present when ok is true. A submission returns the task reference (task_id, next_action, sleep_ms); the completed task result carries the remaining fields.",
                "properties": {
                  "balance_summary": {
                    "type": "object"
                  },
                  "disruption_summary": {
                    "type": "object"
                  },
                  "do_this_next": {
                    "type": "object"
                  },
                  "expires_at": {
                    "type": "string"
                  },
