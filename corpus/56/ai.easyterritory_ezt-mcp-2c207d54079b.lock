        {
          "name": "cluster_points",
          "title": "Cluster Points",
          "description": "Groups the points of one ingested layer into balanced clusters directly, with no ZIP or part layer and no territory alignment. Writes group_field (default group_id) on every point and colors the layer by it, replacing any prior color classification (size and shape channels stay). Needs build_mode (fixed_territory_count or fixed_workload_target), objective, and dwell_time, as in auto_build; a missing one returns CLARIFICATION_REQUIRED with the question. point_filter (e.g. {STATE: FL}) clusters a subset of the layer; unmatched points stay, ungrouped. Max 25,000 points after the filter. seed_point_layer, a second point layer such as technician homes, seeds the groups: with more seeds than groups the best-placed ones are used (seed_summary.unused lists the rest), with fewer the solver adds supplemental seeds in uncovered demand. seed_attraction 0-100 (default 70) is the pull of each seed on its group. Returns a task; the result lists groups with point_count, workload_hours, and point_ids.",
          "inputSchema": {
            "properties": {
              "build_mode": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Sizing mode: {mode: 'fixed_territory_count', territory_count: <int>} or {mode: 'fixed_workload_target', target_workload: <number>, workload_unit: 'hours'|'minutes'}.",
                    "properties": {
                      "mode": {
                        "description": "Sizing mode for clustering.",
                        "enum": ["fixed_territory_count", "fixed_workload_target"],
                        "type": "string"
                      },
                      "target_workload": {
                        "description": "Target workload per group when mode='fixed_workload_target'.",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "territory_count": {
                        "description": "Target number of groups when mode='fixed_territory_count'.",
                        "minimum": 1,
                        "type": "integer"
                      },
                      "workload_unit": {
                        "default": "hours",
                        "description": "Unit for target_workload ('hours' or 'minutes').",
                        "enum": ["minutes", "hours"],
                        "type": "string"
                      }
                    },
                    "required": ["mode"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Build Mode"
              },
              "dwell_time": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Onsite (dwell) time per visit: {type: 'scalar', value: <number>, unit: 'minutes'|'hours'} or {type: 'field', field: '<column>', unit: 'minutes'|'hours'}.",
                    "properties": {
                      "field": {
                        "description": "Point column name holding per-account onsite time when type='field'.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": {
                        "description": "Dwell source: 'scalar' for a fixed per-visit duration or 'field' for an ingested point column.",
                        "enum": ["scalar", "field"],
                        "type": "string"
                      },
                      "unit": {
                        "default": "minutes",
                        "description": "Time unit for value or field ('minutes' or 'hours').",
                        "enum": ["minutes", "hours"],
                        "type": "string"
                      },
                      "value": {
                        "description": "Confirmed onsite duration per visit when type='scalar'.",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Dwell Time"
              },
              "expected_revision": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Expected Revision"
              },
              "group_field": {
                "default": "group_id",
                "title": "Group Field",
                "type": "string"
              },
              "group_label_prefix": {
                "default": "Group",
                "title": "Group Label Prefix",
                "type": "string"
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
              },
              "metric_fields": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "field": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "label": {
                          "type": "string"
                        },
                        "role": {
                          "description": "Optional semantic role for workload columns. Agents should set visit_frequency or dwell_time when declaring canonical workload inputs.",
                          "type": "string"
                        },
                        "type": {
                          "enum": ["number", "integer", "string", "boolean"],
                          "type": "string"
                        },
                        "unit": {
                          "type": "string"
                        }
                      },
                      "required": ["field"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Metric columns to declare on the point layer (same shape as ingest_accounts metric_fields)."
              },
              "objective": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Balance objective: workload_bias + metric_bias + count_bias = 100, weighting workload (drive + dwell), one metric column, and account count. Workload: {workload_bias: 100}. Metric: {metric: '<column>', workload_bias: 0, metric_bias: 100}. Count: {workload_bias: 0, count_bias: 100}. Three-way: {metric: 'Score', workload_bias: 40, metric_bias: 40, count_bias: 20}. Only one metric column balances; combine several into one score column at ingest. Omitted on restructure tools: inherits the source TAL build_provenance objective.",
                    "properties": {
                      "count_bias": {
                        "description": "Weight (0..100) on account count (locations per territory). Default 0.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
                      },
                      "metric": {
                        "description": "Point metric column name to balance (e.g. 'Revenue', 'Score'). Required when metric_bias > 0. Account count is count_bias, not a column.",
                        "type": "string"
                      },
                      "metric_bias": {
                        "description": "Weight (0..100) on the metric column.",
                        "maximum": 100,
                        "minimum": 0,
                        "type": "integer"
