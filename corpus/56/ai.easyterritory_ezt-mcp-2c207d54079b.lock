        {
          "name": "analyze_network_coverage",
          "title": "Analyze Contractor Network Coverage",
          "description": "Finds coverage gaps in a contractor (vendor, service provider, technician, repair shop) network: counts the contractors that reach each demand point (customer, claim, store, ZIP center). Reads contractor_layer (ingested with layer_role=contractors) and demand_layer. coverage: {rule: drive_time, max_minutes} (straight-line travel model, no provider calls), {rule: drive_time, source: isochrone_tal, isochrone_tal_id} (isochrone_build areas around the contractors), or {rule: zip_list} (declared service ZIPs). One trade per call ('*' for all). Missing layers, coverage, or trade return CLARIFICATION_REQUIRED with the question. Writes new layers, never the source: <demand>_coverage (contractor_count, single_source, coverage_class red none / amber one / green 2+ / blue saturated, nearest contractor and minutes, capacity_ratio, gap score) and <demand>_gaps; gap_territory=true adds the all-gap ZIPs as one territory. Assigns nothing; dividing work is auto_build. Returns a task; the result has coverage_pct, gap and single-source counts, top_gaps, and per-contractor reach.",
          "inputSchema": {
            "properties": {
              "capacity_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Overrides the contractor layer's capacity_field. Enables capacity_ratio.",
                "title": "Capacity Field"
              },
              "contractor_filter": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "anyOf": [
                        {
                          "type": ["string", "number", "boolean"]
                        },
                        {
                          "items": {
                            "type": ["string", "number", "boolean"]
                          },
                          "minItems": 1,
                          "type": "array"
                        }
                      ]
                    },
                    "minProperties": 1,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Column -> value (or list of values), e.g. {\"tier\": \"Preferred\"}. The key tier maps to tier_field when the layer has no literal tier column."
              },
              "contractor_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Point layer of contractors. Defaults to the only layer ingested with layer_role=contractors; otherwise CLARIFICATION_REQUIRED (needs_contractor_layer).",
                "title": "Contractor Layer"
              },
              "coverage": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "isochrone_tal_id": {
                        "minLength": 1,
                        "type": "string"
                      },
                      "max_km": {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "max_minutes": {
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "part_layer": {
                        "default": "us_zips",
                        "description": "Part layer the demand points are placed in for zip_list and gap_territory.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "rule": {
                        "enum": ["drive_time", "zip_list"],
                        "type": "string"
                      },
                      "source": {
                        "default": "travel_model",
                        "enum": ["travel_model", "isochrone_tal"],
                        "type": "string"
                      }
                    },
                    "required": ["rule"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "What counts as covered. drive_time with source travel_model (default) needs max_minutes or max_km and uses the calibrated quadkey detour-factor model with CONSTITUTION speed-curve fallback (no provider calls). drive_time with source isochrone_tal needs isochrone_tal_id: a point is covered by a contractor when one of that contractor's isochrone_build polygons contains it (origin_id = contractor id); max_minutes, when given, drops wider time bands. zip_list uses each contractor's service_zip_field."
              },
              "demand_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Point layer of demand (customers, claims, stores, or ZIP centers). Defaults to the only other ingested layer.",
                "title": "Demand Layer"
              },
              "demand_metric": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Numeric demand column (e.g. request count). Defaults to 1 per point; non-numeric cells count as 0 with warning DEMAND_METRIC_MISSING.",
                "title": "Demand Metric"
              },
              "gap_territory": {
                "default": false,
                "description": "Also draw ZIPs whose demand is all uncovered as one territory in a new TAL.",
                "title": "Gap Territory",
                "type": "boolean"
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
              },
              "priority_weights": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "type": "number"
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "gap_priority weights; defaults demand 0.6, distance 0.4, single_source_factor 0.5. The formula is echoed in result.priority_formula.",
                "title": "Priority Weights"
              },
              "saturation_threshold": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Contractor count at which a point is saturated (blue).",
                "title": "Saturation Threshold"
              },
              "service_zip_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Overrides the contractor layer's service_zip_field (required for zip_list).",
                "title": "Service Zip Field"
              },
              "tier_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Overrides the contractor layer's tier_field.",
                "title": "Tier Field"
              },
              "trade": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "One trade per call, matched case-insensitively against the comma-separated trade_field values. '*' (or 'all') keeps every contractor. Required when the contractor layer has a trade_field (needs_trade).",
                "title": "Trade"
              },
              "trade_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Overrides the contractor layer's trade_field.",
                "title": "Trade Field"
              },
              "ts_handle": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Territory Solution reference (tsh_...) from a build, ingest_accounts, import_geojson, import_designer_project, or get_map_visualization; Territory Solutions are not accepted inline.",
                "title": "Ts Handle"
              }
            },
            "title": "analyze_network_coverageArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "error": {
                "description": "Present when ok is false.",
                "properties": {
                  "ask_user": {
                    "items": {
                      "type": "string"
                    },
