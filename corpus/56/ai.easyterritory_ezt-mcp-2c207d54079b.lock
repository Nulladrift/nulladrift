                "required": ["field"],
                "type": "object"
              }
            },
            "properties": {
              "accept_suboptimal_geocodes": {
                "default": true,
                "description": "When true (default for ingest), accept provider suboptimal geocodes (e.g. ZIP centroids) so address-only rows become points. Set false to require optimal/point-address matches only.",
                "title": "Accept Suboptimal Geocodes",
                "type": "boolean"
              },
              "accounts_handle": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Required. upload_handle (aup_...) from request_account_upload. Single-use: ingest claims it.",
                "title": "Accounts Handle"
              },
              "capacity_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Numeric contractor column holding capacity (e.g. jobs per month). Retained like a declared column.",
                "title": "Capacity Field"
              },
              "country_hint": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Country Hint"
              },
              "display_fields": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Declared columns shown in Map Component point callouts. Undeclared columns are discarded at ingest and later operations on them fail with UNDECLARED_FIELD.",
                "title": "Display Fields"
              },
              "dwell_time_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Canonical per-account dwell column on point features. Pair with workload_fields unit metadata when values are in hours.",
                "title": "Dwell Time Field"
              },
              "force_regeocode": {
                "default": false,
                "description": "Admin keys only (debug/testing); a customer key gets ADMIN_REQUIRED. Leave false. True geocodes rows that already have coordinates, billing each one.",
                "title": "Force Regeocode",
                "type": "boolean"
              },
              "grouping_fields": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Declared columns used to group accounts (e.g. account_build grouping_field candidates). Declared fields are the retention contract: the compact TS keeps only id, coordinates, label, and declared fields; undeclared columns are discarded at ingest.",
                "title": "Grouping Fields"
              },
              "id_field": {
                "default": "row_id",
                "description": "Unique business key column. Duplicated label/name columns fail with blocked_by=needs_unique_row_id. With the default row_id and no unique column, the server synthesizes row-1, row-2, … when that column is absent.",
                "title": "Id Field",
