                            "type": "string"
                          }
                        },
                        "required": ["operator"],
                        "type": "object"
                      },
                      "state_abbr": {
                        "type": ["string", "array"]
                      },
                      "text": {
                        "additionalProperties": false,
                        "properties": {
                          "case_sensitive": {
                            "default": false,
                            "type": "boolean"
                          },
                          "field": {
                            "description": "Safe text field to search. Defaults to the public part ID column.",
                            "type": "string"
