        {
          "name": "delete_territory",
          "title": "Delete Territory",
          "description": "Deletes one leaf territory from an alignment; its parts become unassigned. Needs tal_id, territory_id (the leaf id or its exact unique display name), and the Territory Solution from map_session_id or ts_handle. A territory that is already gone returns ok with already_absent=true and no task; otherwise returns a task and the open map repaints. Related: territory_merge hands a leaving rep's territory to its neighbors; delete_tal removes a whole alignment in one call.",
          "inputSchema": {
            "properties": {
              "expected_revision": {
                "anyOf": [
