                        "type": "boolean"
                      },
                      "allow_lasso_select": {
                        "default": true,
                        "description": "Enable the MC freehand lasso tool in select mode. Lasso adds every visibly overlapping part and preserves the existing selection for click fine-tuning.",
                        "type": "boolean"
