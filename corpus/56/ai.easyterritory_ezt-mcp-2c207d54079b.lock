                              "between": {
                                "items": {
                                  "type": "number"
                                },
                                "maxItems": 2,
                                "minItems": 2,
                                "type": "array"
                              },
                              "eq": {
                                "type": "number"
                              },
                              "gt": {
                                "type": "number"
                              },
                              "gte": {
                                "type": "number"
                              },
                              "lt": {
                                "type": "number"
                              },
                              "lte": {
                                "type": "number"
                              }
                            },
                            "type": "object"
