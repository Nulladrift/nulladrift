                "default": null,
                "title": "Expected Revision"
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
              },
              "missing_part_policy": {
                "default": "fail",
                "description": "Controls assigned part IDs that are absent from the selected polygon part layer. fail returns UNKNOWN_PART_ID. drop_with_warning omits them, lists them in invalid_parts, and proceeds with geometry-covered assignments.",
                "title": "Missing Part Policy",
                "type": "string"
              },
              "part_layer": {
                "title": "Part Layer",
                "type": "string"
              },
              "repair_policy": {
                "default": "default",
                "description": "Topology repair for dissolved territories. default fills interior holes in the dissolved geometry (no part is added or reassigned; repair_summary.changed_part_ids lists the territories' own parts). report_only detects holes and changes nothing (warning REPAIR_AVAILABLE). strict fails with REPAIR_REQUIRED when a hole is found.",
                "enum": ["default", "strict", "report_only"],
                "title": "Repair Policy",
                "type": "string"
              },
              "tal_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional caller-supplied TAL identifier. When omitted, the server derives a stable ID from tal_label. Supplied IDs must not collide with an existing TAL in the input TS.",
                "title": "Tal Id"
              },
              "tal_label": {
                "title": "Tal Label",
                "type": "string"
              },
              "ts_handle": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Territory Solution reference (tsh_...) from a build, ingest_accounts, import_geojson, import_designer_project, or get_map_visualization; Territory Solutions are not accepted inline.",
                "title": "Ts Handle"
              }
