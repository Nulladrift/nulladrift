                "type": "string"
              },
              "region_hint": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Region Hint"
              },
              "replace_existing": {
                "default": false,
                "description": "When true, replaces an existing point layer with the same point_layer id in place. Default false returns POINT_LAYER_EXISTS when the layer already exists.",
                "title": "Replace Existing",
                "type": "boolean"
              },
              "retry_bad_geocodes": {
                "default": false,
                "description": "Admin keys only (debug/testing); a customer key gets ADMIN_REQUIRED. Leave false. True re-asks the provider, billed, for the same address text whose cached verdict is no-match or suboptimal. A corrected address needs no flag: it is a new lookup.",
                "title": "Retry Bad Geocodes",
                "type": "boolean"
              },
              "search_fields": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Declared columns searchable in the Map Component. Undeclared columns are discarded at ingest and later operations on them fail with UNDECLARED_FIELD.",
                "title": "Search Fields"
              },
              "service_zip_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Contractor column listing served ZIPs, comma-separated, for coverage.rule=zip_list. Retained like a declared column.",
                "title": "Service Zip Field"
              },
              "tier_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Contractor column holding the network tier (e.g. Preferred). Retained like a declared column.",
                "title": "Tier Field"
              },
              "trade_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Contractor column naming the trade(s) served (e.g. HVAC; comma-separated for several). Retained like a declared column.",
                "title": "Trade Field"
              },
              "ts_handle": {
                "anyOf": [
                  {
                    "type": "string"
                  },
