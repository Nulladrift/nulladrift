        {
          "name": "auto_build",
          "title": "Auto-Build Territories",
          "description": "Partitions ingested account points into balanced sales territories with equal workload, metric, or count over a part layer (e.g. ZIPs) as a new alignment (TAL). Needs the user's choices: build_mode (fixed_territory_count + territory_count, fixed_workload_target + target_workload hours, or scoped_split), objective (workload_bias = drive + dwell, metric_bias = one column such as Revenue, count_bias = account count; sum 100), and dwell_time (a column or a stated scalar). A missing choice returns CLARIFICATION_REQUIRED with ask_user; a visit-frequency column also needs visit_frequency_field or ignore_visit_frequency. seed_point_layer seeds territories from provider points (any count). part_scope: bbox_intersect (default; can be national) or explicit with part_filter, e.g. {state_abbr: TX}; accounts outside stay unassigned (UNASSIGNED_ACCOUNTS). part_filter {in_tal: {tal_id}} keeps a TAL's parts; {not_in_tal: {tal_id}} its white space. With map_session_id the open map is the input. Returns a task; national builds take minutes. The result carries tal_id, ts_handle, and phase_timings_ms.",
          "inputSchema": {
            "properties": {
              "build_mode": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Sizing mode: {mode: 'fixed_territory_count', territory_count: <int>} or {mode: 'fixed_workload_target', target_workload: <number>, workload_unit: 'hours'|'minutes', optional cycle_unit: 'day'|'week'|'month'|'quarter'|'year'} or {mode: 'scoped_split', source_tal_id: '<tal_id>', source_territory_id: '<territory_id>', replacement_territory_count: <int>=2.., optional preserve_other_territories: true}.",
                    "properties": {
                      "cycle_unit": {
                        "description": "Optional schedule cycle unit for fixed_workload_target.",
                        "enum": ["day", "week", "month", "quarter", "year"],
                        "type": "string"
                      },
                      "mode": {
                        "description": "Sizing mode for the build.",
                        "enum": ["fixed_territory_count", "fixed_workload_target", "scoped_split"],
                        "type": "string"
                      },
                      "preserve_other_territories": {
                        "default": true,
                        "description": "Keep all other territories in source_tal_id unchanged when mode='scoped_split'.",
                        "type": "boolean"
                      },
                      "replacement_territory_count": {
                        "description": "Number of replacement territories (>=2) when mode='scoped_split'.",
                        "minimum": 2,
                        "type": "integer"
                      },
                      "source_tal_id": {
                        "description": "Source TAL id when mode='scoped_split'.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "source_territory_id": {
                        "description": "Source territory id or label to split when mode='scoped_split'.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "target_workload": {
                        "description": "Target workload per territory when mode='fixed_workload_target'.",
                        "exclusiveMinimum": 0,
                        "type": "number"
                      },
                      "territory_count": {
                        "description": "Target number of territories when mode='fixed_territory_count'.",
                        "minimum": 1,
                        "type": "integer"
                      },
                      "workload_unit": {
                        "default": "hours",
                        "description": "Unit for target_workload ('hours' or 'minutes').",
                        "enum": ["minutes", "hours"],
                        "type": "string"
                      }
                    },
                    "required": ["mode"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Build Mode"
              },
              "dwell_time": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Onsite (dwell) time per visit: {type: 'scalar', value: <number>, unit: 'minutes'|'hours'} or {type: 'field', field: '<column>', unit: 'minutes'|'hours'}.",
                    "properties": {
                      "field": {
                        "description": "Point column name holding per-account onsite time when type='field'.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": {
                        "description": "Dwell source: 'scalar' for a fixed per-visit duration or 'field' for an ingested point column.",
                        "enum": ["scalar", "field"],
                        "type": "string"
                      },
                      "unit": {
                        "default": "minutes",
                        "description": "Time unit for value or field ('minutes' or 'hours').",
                        "enum": ["minutes", "hours"],
                        "type": "string"
                      },
                      "value": {
                        "description": "Confirmed onsite duration per visit when type='scalar'.",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Dwell Time"
              },
              "expected_revision": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Expected Revision"
              },
              "ignore_visit_frequency": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
