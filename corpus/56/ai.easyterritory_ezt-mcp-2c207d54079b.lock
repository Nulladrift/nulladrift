                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Objective"
              },
              "point_filter": {
                "anyOf": [
                  {
                    "additionalProperties": {
                      "anyOf": [
                        {
                          "type": ["string", "number", "boolean"]
                        },
                        {
                          "items": {
                            "type": ["string", "number", "boolean"]
                          },
                          "minItems": 1,
                          "type": "array"
                        }
                      ]
                    },
                    "minProperties": 1,
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional property filter on the named point layer. Keys are point properties (equality or IN list). Multiple keys are AND. Example: {\"STATE\": \"FL\"}. Unmatched points stay on the layer ungrouped. part_filter and part_scope are not used here."
              },
              "point_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional point_id / row_id / account_id values to cluster. Unmatched points stay on the layer ungrouped.",
                "title": "Point Ids"
              },
              "point_layer": {
                "title": "Point Layer",
                "type": "string"
              },
              "seed_attraction": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "How hard each group centroid is held at its seed. 100 pins it at the seed; 0 seeds only the starting point and lets the solver drift to the workload centroid. Requires seed_point_layer.",
                "title": "Seed Attraction"
              },
              "seed_point_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Second ingested point layer whose locations seed the groups (technician homes, depots). Must differ from point_layer. More seeds than groups: the best-placed are used and the rest land in seed_summary.unused. Fewer: the solver adds supplemental seeds in uncovered demand.",
                "title": "Seed Point Layer"
              },
              "ts_handle": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Territory Solution reference (tsh_...) from a build, ingest_accounts, import_geojson, import_designer_project, or get_map_visualization; Territory Solutions are not accepted inline.",
                "title": "Ts Handle"
              },
              "visit_frequency_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Visit Frequency Field"
              }
            },
            "required": ["point_layer"],
            "title": "cluster_pointsArguments",
            "type": "object"
          },
