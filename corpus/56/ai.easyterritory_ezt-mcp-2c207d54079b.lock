        {
          "name": "calculate_route",
          "title": "Calculate Route",
          "description": "Sequences and drives a set of stops, e.g. a technician from home to the depot, then the day's calls, and back home: returns the order, road distance, drive time, per-leg timings, and geometry from TomTom or Azure Maps, and draws the path with numbered stops on the open map (map_session_id). Creates no territory and changes no assignment. route_type is the user's choice: circuit (returns to start), tour (ends at the required end stop), or open_tour (one way). stop_sets are visited in the order given and no stop moves between sets; order is optimize or as_given; group_by_field adds priority bands. Stops are inline coordinates or point-layer references (e.g. source.filter.territory_id); point_ids and stop_id are point_id values (visits: <account_id>#<n>). A new route_id adds a second route; recalculating an existing route_id replaces it, e.g. to drop a stop. dwell_time is stored for analyze_routes. Route drive time is a different measure from territory workload. No provider key returns ROUTING_NOT_CONFIGURED; past the monthly quota, PROVIDER_QUOTA_EXCEEDED. Returns a task.",
          "inputSchema": {
            "$defs": {
              "RepoShape1": {
                "description": "Several inline stops in one source.",
                "items": {
                  "$ref": "#/$defs/RepoShape3"
                },
                "type": "array"
              },
              "RepoShape2": {
                "additionalProperties": true,
                "description": "Property equality filter applied to the point layer, e.g. {\"territory_id\": \"<leaf id>\"} after auto_build or {\"bucket_id\": \"d01-b1\"} on <point_layer>_visits after schedule_visits (which also stamps schedule_day, schedule_date, and contractor_id). A display label such as T1 does not match. A list value matches any member.",
                "type": "object"
              },
              "RepoShape3": {
                "additionalProperties": true,
                "properties": {
                  "label": {
                    "type": "string"
                  },
                  "latitude": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
