        {
          "name": "ingest_accounts",
          "title": "Ingest Accounts",
          "description": "Account ingest: loads account rows (CRM records, a CSV, a spreadsheet) as point data on a named point layer of the Territory Solution, to add them to the map, geocoding rows without coordinates. Rows come only as accounts_handle from request_account_upload (a file, csv_text, or rows; 100,000-row cap); its suggested_ingest carries these args. latitude/lat and longitude/lon/lng pass through; other names need latitude_field/longitude_field, and unused coordinate-like columns return CLARIFICATION_REQUIRED (needs_coordinate_fields). id_field is a unique key (default row_id); duplicates return needs_unique_row_id. Only declared columns are kept: metric_fields, workload_fields, dwell_time_field, visit_frequency_field, grouping_fields, display_fields, search_fields; to load a contractor list, layer_role=contractors adds trade_field, tier_field, capacity_field, service_zip_field (analyze_network_coverage). Later use of an undeclared column returns UNDECLARED_FIELD. Over geocode quota fails it whole; a bad address bills once (fix it to retry). Returns a task with failed_rows and map_refresh.",
          "inputSchema": {
            "$defs": {
              "RepoShape1": {
                "additionalProperties": false,
                "properties": {
                  "field": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "label": {
                    "type": "string"
                  },
                  "role": {
                    "description": "Optional semantic role for workload columns. Agents should set visit_frequency or dwell_time when declaring canonical workload inputs.",
                    "type": "string"
                  },
                  "type": {
                    "enum": ["number", "integer", "string", "boolean"],
                    "type": "string"
                  },
                  "unit": {
                    "type": "string"
                  }
