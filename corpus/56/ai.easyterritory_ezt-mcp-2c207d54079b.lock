                                  "type": "string"
                                },
                                "end": {
                                  "$ref": "#/$defs/RepoShape3"
                                },
                                "label": {
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "latitude": {
                                  "maximum": 90,
                                  "minimum": -90,
                                  "type": "number"
                                },
                                "longitude": {
                                  "maximum": 180,
                                  "minimum": -180,
                                  "type": "number"
                                },
                                "pre_service_stops": {
                                  "$ref": "#/$defs/RepoShape2"
                                },
                                "route_type": {
                                  "default": "circuit",
                                  "enum": ["circuit", "tour", "open_tour"],
                                  "type": "string"
                                }
                              },
                              "required": ["latitude", "longitude"],
                              "type": "object"
                            }
                          ]
                        },
                        "minItems": 1,
