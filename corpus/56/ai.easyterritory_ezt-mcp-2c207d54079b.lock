        {
          "name": "direct_build",
          "title": "Build Territories from Assignments",
          "description": "Builds territories from known part-to-territory assignments (a ZIP-to-territory sheet or file, including a three-level region/district/territory hierarchy via territory_path) and adds them to the Territory Solution as a new alignment (TAL). Assignments come only as an assignments_handle (aup_...) from request_assignment_upload (the file, csv_text, or assignment rows). Sheets with Postal Code plus Territory/Region/Division columns are mapped automatically. Duplicate part_ids follow duplicate_part_policy (default keep_first). Returns a task; the result carries tal_id and ts_handle and paints the open map. Location points load with ingest_accounts; balanced partitions come from auto_build; grouping by a column is account_build.",
          "inputSchema": {
            "properties": {
              "assignments_handle": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Required. upload_handle (aup_...) from request_assignment_upload. Single-use: the build claims it.",
                "title": "Assignments Handle"
              },
              "duplicate_part_policy": {
                "default": "keep_first",
                "description": "When the same part_id maps to different territory_path values, keep_first (default) keeps the first row and skips the rest with a warning; keep_last keeps the last row; fail aborts with CLARIFICATION_REQUIRED.",
                "title": "Duplicate Part Policy",
                "type": "string"
              },
              "expected_revision": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
