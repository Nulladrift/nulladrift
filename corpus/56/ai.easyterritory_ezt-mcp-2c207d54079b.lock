                "default": null,
                "description": "RFC 3339 departure time, which shapes traffic-aware boundaries. There is no arrive_at: reachable range is forward-only.",
                "title": "Depart At"
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
              },
              "origins": {
                "description": "Centers to measure reachability from. Provider calls are origins x bands, so this is capped (default 25, TOO_MANY_ORIGINS).",
                "items": {
                  "additionalProperties": true,
                  "description": "Either inline coordinates or a reference to points already in the territory solution. Same shape as calculate_route's stopSource, minus the ordering fields.",
                  "properties": {
                    "filter": {
                      "additionalProperties": true,
                      "description": "Property equality filter applied to the point layer, e.g. {\"type\": \"branch\"}. A list value matches any member.",
                      "type": "object"
                    },
                    "label": {
                      "description": "Display name for an inline origin.",
                      "type": "string"
                    },
                    "label_field": {
                      "description": "Point property to use as the origin label, which seeds the territory name.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "latitude": {
                      "maximum": 90,
                      "minimum": -90,
                      "type": "number"
                    },
                    "longitude": {
                      "maximum": 180,
                      "minimum": -180,
                      "type": "number"
                    },
                    "origin_id": {
                      "description": "Stable identity for an inline origin. Echoed on every band territory and in the isochrone provenance block. Defaults to origin-1, origin-2, ...",
                      "minLength": 1,
                      "type": "string"
                    },
                    "point_ids": {
                      "description": "Specific point IDs from point_layer. Each resolved point becomes one origin.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "point_layer": {
                      "description": "Ingested point layer to draw origins from. Resolved against ts_handle / map_session_id.",
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "minItems": 1,
                "type": "array"
              },
              "route_type": {
                "default": "fastest",
                "title": "Route Type",
                "type": "string"
