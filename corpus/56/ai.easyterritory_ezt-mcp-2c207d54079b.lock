              "center": {
                "anyOf": [
                  {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Default camera center as GeoJSON/MapLibre [longitude, latitude]. Persists to map_config.center. An open MC jumps when this request includes center and/or zoom; later config_changed events without those fields leave the camera where it is.",
                "title": "Center"
              },
              "classification": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {
                      "bins": {
                        "minimum": 1,
                        "type": "integer"
                      },
                      "breaks": {
                        "items": {
                          "type": "number"
                        },
                        "type": "array"
                      },
                      "colors": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "labels": {
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
