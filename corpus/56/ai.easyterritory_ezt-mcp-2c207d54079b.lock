      },
      "instructions": "EasyTerritory MCP server for territory intelligence. ACCESS: discovery is open. Every tools/call and Tasks method needs Authorization: Bearer <EZT MCP API key> (ezt_...). Without one: HTTP 401, error.code=AUTH_REQUIRED — ask the user for their key; do not retry anonymously. Hosts that cannot set a header use OAuth; the user pastes that same ezt_ key once. Microsoft Copilot signs in with Entra: the first call can return ENTRA_LINK_REQUIRED — give the user share_with_user, then repeat the call; that sign-in also reads Dynamics 365 account views (list_dataverse_views, import_dataverse_view) and writes stamped point columns back to Dynamics accounts (publish_to_dataverse). EXECUTION: finish the goal, list every failure, or name the blocker. Listing tools or opening the map is not done. Fetch each async task result once. FAMILIES: auto_build balances ZIP/part territories; account_build groups by a column; direct_build applies known assignments; cluster_points groups points with no territory layer; seed_build grows one territory from one location; calculate_route orders one day's stops; isochrone_build draws a drive-time area; schedule_visits picks which day a visit happens; analyze_network_coverage finds where contractors cannot reach demand (no build); points_in_territory lists which points fall inside a territory or drive-time area. If discover_intent returns tier1_tool null, ask — do not guess auto_build. ORDER: list_part_layers (or ezt://part-layers), get_map_visualization, ensure_map_viewer until connected (one map_session_id), ingest_accounts (request_account_upload for a large CSV; pass map_session_id), the family tool, analyze with analysis_panel=single. Never build before ingest. Never compute before the viewer is connected when a person is in the loop. SHARED RULES: workload is drive time plus confirmed dwell — never a metric column such as Revenue. When the user says workload or workload-balanced, use workload_bias=100 and ask dwell only. A named state or region ('TX ZIPs only') is part_scope=explicit and part_filter={state_abbr: TX}, not bbox_intersect. Poll only the task_id from the immediately preceding submission — never an older job. When map_session_id is set on a build, cluster, or schedule call, omit ts and ts_handle; the open map is the Territory Solution. Follow each status next_action (on the status document and under _meta): sleep_and_poll means sleep sleep_ms then one status call; consume_result means fetch the result once; stop_error means stop. Never sleep on estimated_remaining_ms. CLARIFICATION: a tool that needs a user decision returns CLARIFICATION_REQUIRED with ask_user (the question to put to the user) and do_this_next (the call to make with the answer). Ask that question; do not invent the answer. When analyze returns workload_omitted, present the statistics first, then relay its ask_user sentence verbatim; re-run analyze with dwell_time only if the user answers. SEAT: get_guidance result.seat carries plan (standard|trial), key_expires_at, and quota_remaining; tell a trial user when the trial or an allowance is close to running out. DETAIL: routers and blocked_by errors inline the EMEP page. Index: ezt://guidance/emep. Call submit_feedback when blocked, partial, or a workaround was required. No secrets or PII.",
      "tools": [
        {
          "name": "account_build",
          "title": "Build Territories by Account Field",
          "description": "Builds territories that follow an account column, such as rep name or territory code from CRM: each part goes to the group holding most of its accounts (conflict_policy). Adds a new alignment (TAL). Needs an ingested point_layer, grouping_field, part_layer, and tal_label. Grouping values are labels, not balance metrics. part_scope: bbox_intersect (default; parts near the accounts) or explicit with part_filter, e.g. {state_abbr: TX}; in_tal: {tal_id} keeps only that TAL's parts, not_in_tal: {tal_id} only the parts it leaves uncovered. A declared visit-frequency column needs visit_frequency_field or ignore_visit_frequency (CLARIFICATION_REQUIRED otherwise). With map_session_id the open map is the input. Returns a task; the result carries tal_id and ts_handle. analyze reports the statistics.",
          "inputSchema": {
            "properties": {
              "conflict_policy": {
                "default": "plurality_account_count",
                "description": "When accounts in one part map to multiple grouping labels, assign the part to the label with the highest account count; ties break by deterministic label sort.",
                "title": "Conflict Policy",
                "type": "string"
              },
              "expected_revision": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Expected Revision"
              },
              "grouping_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Point feature property treated as a grouping label even when numeric.",
                "title": "Grouping Field"
              },
              "ignore_visit_frequency": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "When true, every account is one visit per cycle. Mutually exclusive with visit_frequency_field.",
                "title": "Ignore Visit Frequency"
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
              },
              "output_mode": {
                "default": "tal",
                "description": "tal is the default. assignments returns assignments_artifact plus an authenticated download_url and a key-less share_url; no ts_handle, tal_id, or map_refresh.",
                "enum": ["tal", "assignments"],
                "title": "Output Mode",
                "type": "string"
              },
              "part_filter": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "minProperties": 1,
                    "properties": {
                      "county_name": {
                        "type": ["string", "array"]
                      },
                      "in_tal": {
                        "additionalProperties": false,
                        "description": "Keep only the parts assigned to a leaf territory of tal_id: the TAL's whole footprint, however many separate regions it has. ANDed with the other predicates (alone it is exactly that footprint). The TAL must use the same part_layer and hold parts. query_parts needs ts_handle or map_session_id here; builds read the TAL from the build's own Territory Solution.",
                        "properties": {
                          "map_session_id": {
                            "description": "query_parts only: open map session whose Territory Solution holds the TAL.",
                            "minLength": 1,
                            "type": "string"
                          },
                          "tal_id": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "territory_ids": {
                            "description": "Narrow to these territory_id values (not display labels); a rollup includes every leaf below it. Unknown ids return UNKNOWN_TERRITORY_ID with available_territory_ids.",
                            "items": {
                              "minLength": 1,
                              "type": "string"
                            },
                            "minItems": 1,
                            "type": "array"
                          },
                          "ts_handle": {
                            "description": "query_parts only: Territory Solution reference (tsh_...) holding the TAL.",
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["tal_id"],
                        "type": "object"
                      },
                      "not_in_tal": {
                        "additionalProperties": false,
                        "description": "White space: drop every part assigned to a leaf territory of tal_id from whatever the other predicates select (the whole layer when alone). The TAL must use the same part_layer. query_parts needs ts_handle or map_session_id here; builds read the TAL from the build's own Territory Solution.",
                        "properties": {
                          "map_session_id": {
                            "description": "query_parts only: open map session whose Territory Solution holds the TAL.",
                            "minLength": 1,
                            "type": "string"
                          },
                          "tal_id": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "ts_handle": {
                            "description": "query_parts only: Territory Solution reference (tsh_...) holding the TAL.",
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["tal_id"],
                        "type": "object"
                      },
                      "part_layer": {
                        "type": "string"
                      },
                      "population": {
                        "oneOf": [
                          {
                            "type": "number"
                          },
                          {
                            "additionalProperties": false,
                            "minProperties": 1,
                            "properties": {
                              "between": {
                                "items": {
                                  "type": "number"
                                },
                                "maxItems": 2,
                                "minItems": 2,
                                "type": "array"
                              },
                              "eq": {
                                "type": "number"
                              },
                              "gt": {
                                "type": "number"
                              },
                              "gte": {
                                "type": "number"
                              },
                              "lt": {
                                "type": "number"
                              },
                              "lte": {
                                "type": "number"
                              }
                            },
                            "type": "object"
                          }
                        ]
                      },
                      "selection_task_id": {
                        "description": "Builds only (auto_build, account_build, seed_build): a committed request_part_selection task (psel_...) whose part_ids become the scope; it is the only key in that part_filter.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "spatial": {
                        "additionalProperties": false,
                        "oneOf": [
                          {
                            "required": ["bbox"]
                          },
                          {
                            "required": ["geometry"]
                          }
                        ],
                        "properties": {
                          "bbox": {
                            "description": "[min_lon, min_lat, max_lon, max_lat] in EPSG:4326.",
                            "items": {
                              "type": "number"
                            },
                            "maxItems": 4,
                            "minItems": 4,
                            "type": "array"
                          },
                          "geometry": {
                            "description": "GeoJSON Polygon or MultiPolygon in EPSG:4326.",
                            "type": "object"
                          },
                          "operator": {
                            "enum": ["intersects", "within", "contains"],
                            "type": "string"
                          }
                        },
                        "required": ["operator"],
                        "type": "object"
                      },
                      "state_abbr": {
                        "type": ["string", "array"]
                      },
                      "text": {
                        "additionalProperties": false,
                        "properties": {
                          "case_sensitive": {
                            "default": false,
                            "type": "boolean"
                          },
                          "field": {
                            "description": "Safe text field to search. Defaults to the public part ID column.",
                            "type": "string"
                          },
                          "mode": {
                            "default": "prefix",
                            "enum": ["prefix", "contains", "exact"],
                            "type": "string"
                          },
                          "value": {
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["value"],
                        "type": "object"
                      }
                    },
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Attribute filter resolved via query_parts (e.g. {\"state_abbr\": [\"FL\", \"GA\"]}). Implies part_scope explicit. Mutually exclusive with part_ids. An existing TAL's footprint (a new version over the same parts, all its regions): {\"in_tal\": {\"tal_id\": \"tal-1\"}}. White space (parts no TAL covers): add not_in_tal, e.g. {\"state_abbr\": \"TX\", \"not_in_tal\": {\"tal_id\": \"tal-1\"}}; a person-trimmed set is {\"selection_task_id\": \"psel_...\"} after get_part_selection reports committed."
              },
              "part_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Explicit part selection set. Implies part_scope explicit. Mutually exclusive with part_filter.",
                "title": "Part Ids"
              },
              "part_layer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Part Layer"
              },
              "part_scope": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Parts eligible for Account Build geography. Default bbox_intersect: all parts intersecting the account-point bounding box. point_matched: only parts containing at least one account (radial seeds only; no FCFS inflate). explicit: part_ids or part_filter (e.g. state_abbr FL). Scope fill uses FCFS adjacency inflate from cluster radial seeds, not national nearest-anchor fill.",
                "title": "Part Scope"
              },
              "point_layer": {
                "title": "Point Layer",
                "type": "string"
              },
              "repair_policy": {
                "default": "default",
                "description": "Topology repair for dissolved territories. default fills interior holes in the dissolved geometry (no part is added or reassigned; repair_summary.changed_part_ids lists the territories' own parts). report_only detects holes and changes nothing (warning REPAIR_AVAILABLE). strict fails with REPAIR_REQUIRED when a hole is found.",
                "enum": ["default", "strict", "report_only"],
                "title": "Repair Policy",
                "type": "string"
              },
              "tal_label": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Tal Label"
              },
              "ts_handle": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Territory Solution reference (tsh_...) from a build, ingest_accounts, import_geojson, import_designer_project, or get_map_visualization; Territory Solutions are not accepted inline.",
                "title": "Ts Handle"
              },
              "visit_frequency_field": {
                "anyOf": [
                  {
                    "type": "string"
                  },
