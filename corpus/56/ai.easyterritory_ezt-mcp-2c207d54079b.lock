        {
          "name": "analyze",
          "title": "Analyze Territories",
          "description": "Computes territory statistics for one or more alignments, i.e. how balanced the territories are and how alignments compare: account counts, declared metric totals (e.g. Revenue), workload hours, balance scores, and cross-TAL comparison; hypothetical_moves previews a realign. Input: map_session_id (the open map as it is now), ts_handle, or a completed build job_id (pass tal_ids when several TALs exist). metrics: omit for every declared column, or name them; workload and account_count are always available. Workload needs dwell (dwell_time, the build's recorded dwell, or the layer's dwell_time_field); without it the result has every other statistic, no workload, and workload_omitted.ask_user to put to the user. analysis_panel=single with map_session_id fills the map dock (analysis_panel.status=pushed). Territory account_count, metric_totals, workload_total (minutes), and the dock grid cover accounts_point_layer (build point_layer), never seed, contractor, or visit layers; point_counts_by_layer counts every layer. Drive-time alignments count accounts inside each polygon. Returns a task.",
          "inputSchema": {
            "properties": {
              "analysis_panel": {
                "anyOf": [
                  {
                    "description": "single fills the open map's analysis dock with this result (needs map_session_id). The dock shows one alignment at a time: with several tal_ids each TAL gets its own dock entry and the dock follows the map's active TAL. comparison_slot does the same and also returns cross_tal_comparison. none or omitted pushes nothing.",
                    "enum": ["none", "single", "comparison_slot"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Analysis Panel"
              },
              "compare_tals": {
                "default": false,
                "description": "When true and multiple tal_ids supplied, include a cross-TAL comparison section.",
                "title": "Compare Tals",
                "type": "boolean"
              },
              "dwell_time": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "description": "Onsite (dwell) time per visit: {type: 'scalar', value: <number>, unit: 'minutes'|'hours'} or {type: 'field', field: '<column>', unit: 'minutes'|'hours'}.",
                    "properties": {
                      "field": {
                        "description": "Point column name holding per-account onsite time when type='field'.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "type": {
                        "description": "Dwell source: 'scalar' for a fixed per-visit duration or 'field' for an ingested point column.",
                        "enum": ["scalar", "field"],
                        "type": "string"
                      },
                      "unit": {
                        "default": "minutes",
                        "description": "Time unit for value or field ('minutes' or 'hours').",
                        "enum": ["minutes", "hours"],
                        "type": "string"
                      },
                      "value": {
                        "description": "Confirmed onsite duration per visit when type='scalar'.",
                        "minimum": 0,
                        "type": "number"
                      }
                    },
                    "required": ["type"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Dwell Time"
              },
              "hypothetical_moves": {
                "anyOf": [
                  {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "from_territory_id": {
                          "type": "string"
                        },
                        "part_id": {
                          "minLength": 1,
                          "type": "string"
                        },
                        "to_territory_id": {
                          "minLength": 1,
                          "type": "string"
                        }
                      },
                      "required": ["part_id", "to_territory_id"],
                      "title": "Hypothetical Part-Move for Impact Analysis",
                      "type": "object"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Compute impact of these hypothetical part moves without persisting any change."
              },
              "job_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "task_id (same value as job_id) of a completed build or ingest task; its Territory Solution is the input.",
                "title": "Job Id"
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
              },
              "max_depth": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
