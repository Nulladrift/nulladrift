        {
          "name": "query_parts",
          "title": "Query Territory Parts",
          "description": "Returns attributes (no geometry) for parts of a part layer listed by list_part_layers or ezt://part-layers. Takes exactly one of filter (e.g. {state_abbr: TX}) or part_ids; neither or both returns INVALID_REQUEST. Paged with page_token. TAL membership (each needs map_session_id or ts_handle inside): filter.in_tal {tal_id, territory_ids?} keeps only the parts that TAL assigns (its whole footprint, however many separate regions; territory_ids narrows to those territories and everything under them); filter.not_in_tal {tal_id} drops that TAL's parts (white space), e.g. {state_abbr: TX, not_in_tal: {...}}. Both AND with other predicates. total_count is the set size. Build from it with the same part_filter.",
          "inputSchema": {
            "properties": {
              "filter": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "minProperties": 1,
                    "properties": {
                      "county_name": {
                        "type": ["string", "array"]
                      },
                      "in_tal": {
                        "additionalProperties": false,
                        "description": "Keep only the parts assigned to a leaf territory of tal_id: the TAL's whole footprint, however many separate regions it has. ANDed with the other predicates (alone it is exactly that footprint). The TAL must use the same part_layer and hold parts. query_parts needs ts_handle or map_session_id here; builds read the TAL from the build's own Territory Solution.",
                        "properties": {
                          "map_session_id": {
                            "description": "query_parts only: open map session whose Territory Solution holds the TAL.",
                            "minLength": 1,
                            "type": "string"
                          },
                          "tal_id": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "territory_ids": {
                            "description": "Narrow to these territory_id values (not display labels); a rollup includes every leaf below it. Unknown ids return UNKNOWN_TERRITORY_ID with available_territory_ids.",
                            "items": {
                              "minLength": 1,
                              "type": "string"
                            },
                            "minItems": 1,
                            "type": "array"
                          },
                          "ts_handle": {
                            "description": "query_parts only: Territory Solution reference (tsh_...) holding the TAL.",
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["tal_id"],
                        "type": "object"
                      },
                      "not_in_tal": {
                        "additionalProperties": false,
                        "description": "White space: drop every part assigned to a leaf territory of tal_id from whatever the other predicates select (the whole layer when alone). The TAL must use the same part_layer. query_parts needs ts_handle or map_session_id here; builds read the TAL from the build's own Territory Solution.",
                        "properties": {
                          "map_session_id": {
                            "description": "query_parts only: open map session whose Territory Solution holds the TAL.",
                            "minLength": 1,
                            "type": "string"
                          },
                          "tal_id": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "ts_handle": {
                            "description": "query_parts only: Territory Solution reference (tsh_...) holding the TAL.",
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": ["tal_id"],
                        "type": "object"
                      },
                      "part_layer": {
                        "type": "string"
                      },
                      "population": {
                        "oneOf": [
                          {
                            "type": "number"
                          },
                          {
                            "additionalProperties": false,
                            "minProperties": 1,
                            "properties": {
                              "between": {
                                "items": {
                                  "type": "number"
                                },
                                "maxItems": 2,
                                "minItems": 2,
                                "type": "array"
                              },
                              "eq": {
                                "type": "number"
                              },
                              "gt": {
                                "type": "number"
                              },
                              "gte": {
                                "type": "number"
                              },
                              "lt": {
                                "type": "number"
                              },
                              "lte": {
                                "type": "number"
                              }
                            },
                            "type": "object"
                          }
                        ]
                      },
                      "selection_task_id": {
                        "description": "Builds only (auto_build, account_build, seed_build): a committed request_part_selection task (psel_...) whose part_ids become the scope; it is the only key in that part_filter.",
                        "minLength": 1,
                        "type": "string"
                      },
                      "spatial": {
                        "additionalProperties": false,
                        "oneOf": [
                          {
                            "required": ["bbox"]
                          },
                          {
                            "required": ["geometry"]
                          }
                        ],
