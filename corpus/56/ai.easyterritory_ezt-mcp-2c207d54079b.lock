              },
              "initial_part_filter": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "minProperties": 1,
                    "properties": {
                      "county_name": {
                        "type": ["string", "array"]
                      },
                      "in_tal": {
                        "additionalProperties": false,
                        "description": "Keep only the parts assigned to a leaf territory of tal_id: the TAL's whole footprint, however many separate regions it has. ANDed with the other predicates (alone it is exactly that footprint). The TAL must use the same part_layer and hold parts. query_parts needs ts_handle or map_session_id here; builds read the TAL from the build's own Territory Solution.",
                        "properties": {
                          "map_session_id": {
                            "description": "query_parts only: open map session whose Territory Solution holds the TAL.",
                            "minLength": 1,
                            "type": "string"
                          },
                          "tal_id": {
                            "minLength": 1,
                            "type": "string"
                          },
                          "territory_ids": {
                            "description": "Narrow to these territory_id values (not display labels); a rollup includes every leaf below it. Unknown ids return UNKNOWN_TERRITORY_ID with available_territory_ids.",
                            "items": {
                              "minLength": 1,
                              "type": "string"
                            },
                            "minItems": 1,
                            "type": "array"
