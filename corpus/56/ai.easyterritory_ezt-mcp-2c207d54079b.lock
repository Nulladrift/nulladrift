                ],
                "default": null,
                "description": "Pre-selects the parts this filter matches (same shape as auto_build part_filter, e.g. {in_tal: {tal_id}} or {state_abbr: TX, not_in_tal: {tal_id}}). Resolved server-side, up to 50,000 parts; selection_task_id is rejected here."
              },
              "map_session_id": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Open map session (msess_...) from get_map_visualization. Its Territory Solution is the input; omit ts_handle when set.",
                "title": "Map Session Id"
