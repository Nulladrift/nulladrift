        {
          "name": "isochrone_build",
          "title": "Build Drive-Time Area",
          "description": "Draws the area reachable by driving from one or more origins within a time or distance budget (drive-time area, service area, catchment) and adds each area as a territory in a drive-time alignment. origins: inline {latitude, longitude} or a point-layer reference. bands: [{time_budget_seconds} or {distance_budget_meters}], one unit per call (MIXED_BUDGET_TYPES otherwise); one band gives one area per origin, several give nested areas. Limits: 25 origins, 5 bands, 6 hours, 500 km; travel_mode car or truck; depart_at supported. Areas are the provider polygons and may overlap; analyze counts accounts in every area containing them. realign/split/merge/rebalance return ISOCHRONE_TAL_NOT_EDITABLE. A band budget is not territory workload or route time. No provider key returns ISOCHRONE_NOT_CONFIGURED; the full call count is checked against the monthly quota first (PROVIDER_QUOTA_EXCEEDED). Returns a task.",
          "inputSchema": {
            "properties": {
              "avoid": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Road classes to keep out of the reachable area. Only values both providers document.",
                "title": "Avoid"
              },
              "bands": {
                "description": "Budgets to draw at each origin. One band gives one leaf per origin; several give a rollup per origin with one leaf per band. Capped (default 5, TOO_MANY_BANDS).",
                "items": {
                  "additionalProperties": false,
                  "description": "One reachable-range budget. Exactly one of time_budget_seconds or distance_budget_meters, and every band in a call must use the same one.",
                  "oneOf": [
                    {
                      "required": ["time_budget_seconds"]
                    },
                    {
                      "required": ["distance_budget_meters"]
                    }
                  ],
                  "properties": {
                    "band_id": {
                      "description": "Stable identity for the band. Defaults to a slug of the budget, e.g. 20min or 25km.",
                      "minLength": 1,
                      "type": "string"
                    },
                    "distance_budget_meters": {
                      "description": "Drive-distance budget. Capped at 500000m by the stricter provider.",
                      "exclusiveMinimum": 0,
                      "maximum": 500000,
                      "type": "number"
                    },
                    "label": {
                      "description": "Display suffix for this band's territories. Defaults to a readable budget, e.g. \"20 min\".",
                      "type": "string"
