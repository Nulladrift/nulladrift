        {
          "name": "schedule_visits",
          "title": "Schedule Visits",
          "description": "Schedules recurring visits: expands each cadence (e.g. every 7 days) across a horizon and packs visits into daily buckets under a technician-day cap. Decides which day each visit happens (auto_build and cluster_points divide accounts among people); creates no alignment. Needs point_layer (ingested with cadence declared, else UNDECLARED_FIELD), visit_frequency_field, dwell_time, and daily_capacity ({mode: not_to_exceed, hours: 8}); missing dwell or capacity returns CLARIFICATION_REQUIRED. Omitted max_buckets_per_day means one technician per day; when one does not fit, CLARIFICATION_REQUIRED carries capacity_plan. estimate_only=true returns capacity_plan. contractors (point_layer or list: start, pre_service_stops, route_type, end) anchors buckets; unanchored one-stop days warn SINGLE_STOP_DAYS. frequency_unit: interval_days or visits_per_horizon. bucket_workload_hours (drive plus dwell) is a different measure from territory workload and route_workload_hours. Returns a task. calculate_route on one bucket_id drives that day. Date limits: visit_constraints with horizon_start_date.",
          "inputSchema": {
            "$defs": {
              "RepoShape1": {
                "additionalProperties": false,
                "description": "Expands each matching point in point_layer into one contractor whose start is that point.",
                "properties": {
                  "end": {
                    "$ref": "#/$defs/RepoShape3"
                  },
                  "filter": {
                    "minProperties": 1,
                    "type": "object"
                  },
                  "label_field": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "point_ids": {
                    "items": {
                      "type": ["string", "integer"]
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "point_layer": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "pre_service_stops": {
                    "$ref": "#/$defs/RepoShape2"
                  },
                  "route_type": {
                    "default": "circuit",
                    "enum": ["circuit", "tour", "open_tour"],
                    "type": "string"
                  }
                },
                "required": ["point_layer"],
                "type": "object"
              },
              "RepoShape2": {
                "items": {
                  "$ref": "#/$defs/RepoShape3"
                },
                "type": "array"
              },
              "RepoShape3": {
                "description": "Stop location resolved from a point layer in the TS or inline WGS84 coordinates (T-214).",
                "oneOf": [
                  {
                    "$ref": "#/$defs/RepoShape6"
                  },
                  {
                    "$ref": "#/$defs/RepoShape4"
                  }
                ]
              },
              "RepoShape4": {
                "additionalProperties": false,
                "properties": {
                  "contractor_id": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "dwell_minutes": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "id": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "label": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "latitude": {
                    "maximum": 90,
                    "minimum": -90,
                    "type": "number"
                  },
                  "longitude": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "name": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "stop_id": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["latitude", "longitude"],
                "type": "object"
              },
              "RepoShape6": {
                "additionalProperties": false,
                "properties": {
                  "dwell_minutes": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "filter": {
                    "minProperties": 1,
                    "type": "object"
                  },
                  "label_field": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "point_ids": {
                    "items": {
                      "type": ["string", "integer"]
                    },
                    "minItems": 1,
                    "type": "array"
                  },
                  "point_layer": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["point_layer"],
                "type": "object"
              }
            },
            "properties": {
              "cadence_flexibility_pct": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Percent of an account's own cadence a single visit may drift so the number of work clusters stays comparable day to day. At the default 15 a 14-day account may slide two days and a 7-day account one; a 3-day account does not move. Set to 0 for strict cadence. A drift past this tolerance happens only to staff a day that would otherwise be short of work — an idle technician costs more than a visit arriving a day early — and every relaxed visit is reported in distribution_summary.cadence_relaxation and the visits layer's cadence_drift_days column.",
                "title": "Cadence Flexibility Pct"
              },
              "contractors": {
                "anyOf": [
