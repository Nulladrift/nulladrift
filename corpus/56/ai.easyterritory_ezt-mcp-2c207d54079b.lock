                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Stable caller id; finds the open map when map_session_id is omitted.",
                "title": "User Id"
              }
            },
            "required": ["part_layer"],
            "title": "request_part_selectionArguments",
            "type": "object"
          },
