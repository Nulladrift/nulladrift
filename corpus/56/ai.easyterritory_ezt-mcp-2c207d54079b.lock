        {
          "name": "workflow_advisor",
          "title": "Get Next Workflow Step",
          "description": "Returns the next tool call for a multi-step workflow, given where the workflow stands. Read-only state machine; executes nothing. intent_category: build_from_accounts | account_grouping | known_assignments | realign_existing | restructure | load_part_layer | route_stops | reachable_area | periodic_scheduling | coverage_gap_analysis | points_in_territory. state: viewer_connected, point_layer, part_layer, tal_present, analysis_fresh, plus selection/realign or restructure flags. inputs: the values known so far (part_layer, territory_count, tal_id, operation, route_type, origins, visit_frequency_field, ...); missing_inputs names the keys still needed. Returns next_tool with drafted next_args, missing_inputs (reported, never invented), blocked_by, remaining_steps, and the workflow guide inline as guidance. Order rules applied: map before compute, viewer connected before compute, ingest before build, analyze after an edit when a point layer exists. Calling it after each step with the updated state walks the whole workflow.",
          "inputSchema": {
            "properties": {
              "inputs": {
                "anyOf": [
                  {
                    "additionalProperties": true,
                    "properties": {
                      "analysis_requested": {
                        "description": "realign: opt into post-edit Analyze even without a declared point layer (AN-004).",
                        "type": "boolean"
                      },
