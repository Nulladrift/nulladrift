      "instructions": "Справочник Arcanika: значения карт Таро и Ленормана, каталоги колод и раскладов, расчёт Матрицы судьбы и Квадрата Пифагора по дате рождения, обзор продуктов. Разбор расклада, тексты сфер матрицы и толкование сна — платная часть сервиса: инструменты возвращают на них ссылку, а не содержание.",
