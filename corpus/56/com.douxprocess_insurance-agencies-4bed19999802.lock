{
  "lockfileVersion": 2,
  "subjects": {
    "com.douxprocess/insurance-agencies": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://douxprocess.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "getdoux-insurance",
        "title": "DouxProcess: find a licensed insurance agency",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DouxProcess connects a person who wants an insurance quote with a licensed agency that writes it in their state. find_agencies lists every matching agency for the person to choose from; request_quote sends their request, with their consent, to the agency they chose. Prices and coverage advice come from the agency. search_servers and get_server list other insurance MCP servers; build_my_server is for agencies that want to join.",
      "tools": [
        {
          "name": "build_my_server",
          "title": "Build an MCP server for my agency",
          "description": "How an insurance agency gets its own MCP server, free: the builder link and what it makes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build my server"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d99e20a92cdc7a9ffd65cfefa5c1a483b9d4299b9aa68583923b3009859f5085"
        },
        {
          "name": "find_agencies",
          "title": "Find a licensed insurance agency",
          "description": "Find licensed insurance agencies that write a line of insurance (general liability, workers' comp, commercial auto, bonds, property, home, auto, life, health and more) in a US state, for someone who wants an insurance quote. Returns every matching agency in the DouxProcess network, best match first, with license number, lines, states, phone, hours and online quote link, so the person can choose one.",
          "inputSchema": {
            "properties": {
              "line": {
                "description": "Line of insurance.",
                "enum": ["general-liability", "workers-comp", "commercial-auto", "bonds", "property", "professional", "cyber", "personal-auto", "home", "life", "health", "other"],
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state.",
                "type": "string"
              }
            },
            "required": ["line", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find agencies"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:672c291915b390c958d062dd7f9ff9219fbdcbac20abf513308b6b41f50eba75"
        },
        {
          "name": "get_server",
          "title": "One server, in full",
          "description": "Everything about one listed server: its tools from the last live check, its address and how to add it to Claude, ChatGPT, Gemini or Grok.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The slug from search_servers.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a server"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ccb4c24cd2e218324ffc4972fade436fac0d5f668552caa9af67d11cee2e5f2f"
        },
        {
          "name": "request_quote",
          "title": "Send a quote request to the agency the person chose",
          "description": "Send an insurance quote request to the one agency the person chose by name from find_agencies. Needs the person's name, an email or phone, the line, the state, what they need covered, and consent=true only when the person agreed to be contacted by that agency. Returns a reference number. A licensed agent at that agency replies; nothing is bound and no price is given. One agency per request, chosen by the person: never call this for every agency, all agencies or a batch of agencies, and never pick an agency for them. If they ask to send to all of them, do not call it; show the list and ask which one agency they want.",
          "inputSchema": {
            "properties": {
              "agency": {
                "description": "The agency value from find_agencies that the person chose.",
                "type": "string"
              },
              "business": {
                "type": "string"
              },
              "consent": {
                "description": "True only if the person agreed to be contacted by that agency.",
                "type": "boolean"
              },
              "details": {
                "description": "What they need covered, in their words.",
                "type": "string"
              },
              "email": {
                "type": "string"
              },
              "line": {
                "description": "Line of insurance.",
                "enum": ["general-liability", "workers-comp", "commercial-auto", "bonds", "property", "professional", "cyber", "personal-auto", "home", "life", "health", "other"],
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "phone": {
                "type": "string"
              },
              "state": {
                "type": "string"
              }
            },
            "required": ["agency", "consent", "details", "line", "name", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Request a quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a0cbc3cea96abb92bf0efc82759dbb01f617ab92e859965a4e12edcacd79b59"
        },
        {
          "name": "search_servers",
          "title": "Find insurance MCP servers",
          "description": "Search the free insurance MCP directory by line of insurance, US state, who it is for, or words. Each result says whether the server answered its last live check (every 30 minutes), its tool count and its address.",
          "inputSchema": {
            "properties": {
              "audience": {
                "enum": ["consumer", "agent"],
                "type": "string"
              },
              "line": {
                "enum": ["general-liability", "workers-comp", "commercial-auto", "bonds", "property", "professional", "cyber", "personal-auto", "home", "life", "health", "other"],
                "type": "string"
              },
              "live_only": {
                "description": "Only servers that answered the last check.",
                "type": "boolean"
              },
              "query": {
                "description": "Words to match in the name or summary.",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the directory"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c9054460a366474263628d84c875e182f55eba4599908fcbb7151eaa6a5f0df"
        }
      ],
      "digest": "sha256:40463e9716c8a1c36b77aa83120e2607615c934230f2a0669fad5ff5eb9f7c4d"
    }
  }
