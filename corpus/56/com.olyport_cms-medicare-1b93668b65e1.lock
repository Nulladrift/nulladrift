        {
          "name": "get_chronic_conditions",
          "description": "Get prevalence of chronic conditions among Medicare beneficiaries.\n\n    Returns state-level data on 21 chronic conditions including diabetes,\n    heart failure, COPD, depression, Alzheimer's, and more. Useful for\n    understanding disease burden by geography.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX').\n        condition: Chronic condition name to filter by (e.g. 'diabetes',\n            'heart failure', 'COPD', 'depression').\n        year: Year of data (e.g. 2022).\n        limit: Maximum number of records to return (default 50, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "condition": {
                "default": null,
                "title": "Condition",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_chronic_conditionsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_chronic_conditionsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64a7b3cd37b50bef045d3ca29f600cbec9741ff63d37622429abaf9a7cb352a6"
        },
