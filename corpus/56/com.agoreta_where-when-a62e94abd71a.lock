{
  "lockfileVersion": 2,
  "subjects": {
    "com.agoreta/where-when": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.agoreta.com/where-when/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agoreta-where-when",
        "title": "Agoreta: where and when",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only local facts for covered areas: which venues are open at a given place and time, opening hours of a venue (listed, or an estimate), public events, and how busy a place is by hour of the week (an estimate). Estimates are always marked basis=estimate; say so when you cite one. Call sources for coverage and licences. Opening hours are offered under ODbL-1.0 and require the attribution \"© OpenStreetMap contributors\".",
      "tools": [
        {
          "name": "events",
          "title": "Public events near a place",
          "description": "Lists public events near a point or in a city within a date range. Each event names its organiser or publisher and licence.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name within a covered area; used when lat/lon are not given (the part of the city with most venues is used as the centre).",
                "type": "string"
              },
              "from": {
                "description": "First day, YYYY-MM-DD (local). Default: today.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude (WGS 84).",
                "type": "number"
              },
              "limit": {
                "description": "Maximum number of events. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "lon": {
                "description": "Longitude (WGS 84).",
                "type": "number"
              },
              "radius_m": {
                "description": "Radius in metres. Default 3000 around coordinates, 10000 for a city.",
                "maximum": 50000,
                "minimum": 100,
                "type": "number"
              },
              "to": {
                "description": "Last day, YYYY-MM-DD. Default: from + 7 days; at most 60 days.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Public events near a place"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:da1f1db5e2d12b730ae44395700f57cd764772284dc293581a1bc58279636df4"
        },
        {
          "name": "open_now",
          "title": "Venues open at a place and time",
          "description": "Lists venues within a radius of a point that are open at the given moment (default: now). Hours are either listed or an estimate (basis=estimate).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "at": {
                "description": "Moment to evaluate, ISO 8601. Without an offset it is the local time of the place. Default: now.",
                "type": "string"
              },
              "category": {
                "description": "Venue category or parent category, e.g. cafe, restaurant, pub, gym, library. See sources for the list.",
                "type": "string"
              },
              "city": {
                "description": "City name within a covered area; used when lat/lon are not given (the part of the city with most venues is used as the centre).",
                "type": "string"
              },
              "include_closed": {
                "description": "Also return venues that are closed at that moment. Default false.",
                "type": "boolean"
              },
              "lat": {
                "description": "Latitude (WGS 84).",
                "type": "number"
              },
              "limit": {
                "description": "Maximum number of venues. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "lon": {
                "description": "Longitude (WGS 84).",
                "type": "number"
              },
              "radius_m": {
                "description": "Search radius in metres. Default 400.",
                "maximum": 1000,
                "minimum": 50,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Venues open at a place and time"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:67b8007927841647a8c38503229a3e5d121af575fab1e8694ba204d97c273fa7"
        },
        {
          "name": "opening_hours",
          "title": "Opening hours of a venue",
          "description": "Finds a venue by name (optionally near a point or in a city) and returns its regular weekly opening hours: listed, or an estimate (basis=estimate).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "at": {
                "description": "Moment to evaluate, ISO 8601. Without an offset it is the local time of the place. Default: now.",
                "type": "string"
              },
              "city": {
                "description": "City name within a covered area; used when lat/lon are not given (the part of the city with most venues is used as the centre).",
                "type": "string"
              },
              "lat": {
                "description": "Latitude (WGS 84).",
                "type": "number"
              },
              "lon": {
                "description": "Longitude (WGS 84).",
                "type": "number"
              },
              "name": {
                "description": "Venue name.",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Opening hours of a venue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:56fbe49620dc83bd81a032da7ce71536977f97bd1711b9220ea687f49e02e356"
        },
        {
          "name": "rhythm",
          "title": "When a place is busiest",
          "description": "Estimates how busy the surroundings of a point are by hour of a day of the week (index against the place's weekly average, level 1-5, people rounded to tens), the peak hours, and the busiest spots nearby. Always an estimate.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "at": {
                "description": "Moment to evaluate, ISO 8601. Without an offset it is the local time of the place. Default: now.",
                "type": "string"
              },
              "city": {
                "description": "City name within a covered area; used when lat/lon are not given (the part of the city with most venues is used as the centre).",
                "type": "string"
              },
              "day": {
                "description": "Day of the week. Default: the day of `at` (today).",
                "enum": ["mon", "tue", "wed", "thu", "fri", "sat", "sun"],
                "type": "string"
              },
              "hour": {
                "description": "Hour of the day (local). Default: the hour of `at` (now); with `day` alone the whole day is returned.",
                "maximum": 23,
                "minimum": 0,
                "type": "number"
              },
              "lat": {
                "description": "Latitude (WGS 84).",
                "type": "number"
              },
              "lon": {
                "description": "Longitude (WGS 84).",
                "type": "number"
              },
              "radius_m": {
                "description": "Radius for the busiest spots nearby. Default 1500.",
                "maximum": 3000,
                "minimum": 500,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "When a place is busiest"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0cb63256600a2d7d96a07da01a62d9dd301884aee1b8c54d9fa257cb4dacd5d8"
        },
        {
          "name": "sources",
          "title": "Coverage and licences",
          "description": "Returns the covered areas and categories, the date of the data, and the licences with the attribution to use when citing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Coverage and licences"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d3d191798d5c3d2bacee91d8d053dea3a1bde302950e23a6b4325452cfb2e1b3"
        }
      ],
      "digest": "sha256:58504de487a6eb32ad49beccaa1bcb4c4f7b2417378fdc451618cc1204bf5cbb"
    }
  }
}
