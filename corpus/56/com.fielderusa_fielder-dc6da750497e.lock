{
  "lockfileVersion": 2,
  "subjects": {
    "com.fielderusa/fielder": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.fielderusa.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fielder",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Fielder lists soccer fields for hourly rent in the US. Search with search_fields, then check open times with get_availability. Dates and times are in the field's local timezone. To book, give the renter the slot's booking_url: they sign in and pay on Fielder, and the operator approves before the card is charged.",
      "tools": [
        {
          "name": "get_availability",
          "title": "Get availability",
          "description": "Open start times with prices for one field over up to 14 days, each with a booking_url.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "date_from": {
                "description": "YYYY-MM-DD, in the field's local timezone",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "date_to": {
                "$ref": "#/properties/date_from",
                "description": "Defaults to date_from"
              },
              "duration": {
                "default": 60,
                "description": "Booking length in minutes",
                "maximum": 300,
                "minimum": 30,
                "multipleOf": 30,
                "type": "integer"
              },
              "field_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["date_from", "field_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:28c6b58ee3d838d8964753af59132ff62e8e646efc2443acc739aaeb50afcc87"
        },
        {
          "name": "get_field",
          "title": "Get field",
          "description": "Details for one field: address, surface, size, hourly prices, opening hours and operator.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "field_id": {
                "exclusiveMinimum": 0,
                "type": "integer"
              }
            },
            "required": ["field_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1f4d51dba7d3202759d93d874d51bf4e6e9607318202b02900004c86780ec516"
        },
        {
          "name": "search_fields",
          "title": "Search fields",
          "description": "Find rentable fields near a location. With a date, returns only fields with open slots that day (at start_time if given), each with a booking_url.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Used when lat/lng are not given",
                "maxLength": 100,
                "type": "string"
              },
              "date": {
                "description": "YYYY-MM-DD, in the field's local timezone",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "duration": {
                "default": 60,
                "description": "Booking length in minutes",
                "maximum": 300,
                "minimum": 30,
                "multipleOf": 30,
                "type": "integer"
              },
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius_miles": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "size": {
                "enum": ["5v5", "7v7", "9v9", "11v11"],
                "type": "string"
              },
              "start_time": {
                "description": "HH:mm, 24-hour",
                "pattern": "^([01]\\d|2[0-3]):[0-5]\\d$",
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code, e.g. TX",
                "maxLength": 50,
                "type": "string"
              },
              "surface": {
                "enum": ["Natural Grass", "Artificial Turf", "Indoor"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b97aa818d60ec72a3cba445f094b24e189f9b452598900a026748e206a404b4"
        }
      ],
      "digest": "sha256:8a99f3d7884e17d5716991ffea23f54da7af4aa83c05e25c8a135c1c9b8e2852"
    }
  }
}
