        {
          "name": "plan_money",
          "title": "Plan money for a target",
          "description": "Builds a money plan for Grand Theft Auto VI from the Sixfigs dataset: given the player's story chapter, a target amount and the minutes available, returns which methods to run, how many times, expected earnings, dollars per hour, unlock requirements and verified dates. Use this when the user wants to reach a specific amount of in-game money in a set time. Only methods unlocked by the given chapter, with a reported run time and not disputed, are planned; earnings use the lowest reported payout. The chapter also filters spoilers.",
