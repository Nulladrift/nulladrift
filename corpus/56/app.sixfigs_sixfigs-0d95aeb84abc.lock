            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "chapter": {
                "description": "Story chapter the player has reached. Also used as max_chapter for spoiler filtering.",
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "minutes": {
                "description": "Real-time minutes the player has available.",
                "exclusiveMinimum": 0,
                "maximum": 1440,
                "type": "number"
              },
              "target": {
                "description": "Target amount of in-game dollars.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000,
                "type": "number"
              }
            },
