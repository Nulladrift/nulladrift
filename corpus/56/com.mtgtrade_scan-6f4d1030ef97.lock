      "serverInfo": {
        "name": "mtg-trade-scan",
        "title": "MTG Trade Scan",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "3 pages gratuites par jour avec un compte, puis 0,01 €/page. Pack 5€ = 500 credits. Auth: Authorization Bearer mgt_…. REST: https://mtgtrade.com/openapi.json",
      "tools": [
        {
          "name": "get_free_key",
          "description": "Returns the URL where a signed-in MTG Trade account creates an API key with 3 free scan pages per day. Never creates a key itself.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:74e9222c7b1cfc63ab2dd4ee901c35526fd7c9dd684118f2a972beda2a55fd73"
        },
        {
          "name": "get_purchase",
          "description": "Poll a credit pack. Returns api_key once when paid.",
          "inputSchema": {
            "properties": {
              "purchase_id": {
                "type": "string"
              }
            },
            "required": ["purchase_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dfe0baec1b3b01f4cf9583c8bf769b86e6947f4570676efb1d561293ea849006"
        },
        {
          "name": "get_scan_job",
          "description": "Poll a scan job until processed or failed. Requires Bearer mgt_….",
          "inputSchema": {
            "properties": {
              "job_id": {
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fbbde89bbf84d7d843995103197c4a9800171f5df45db5e990abb53a4c3638e5"
        },
        {
          "name": "purchase_credits",
          "description": "Create a 5€ / 500-credit pack (Mollie checkout, or x402 if PAYMENT-SIGNATURE is sent). Poll get_purchase for the API key.",
          "inputSchema": {
            "properties": {
              "redirect_url": {
                "description": "Mollie redirect after payment",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d2dc0d07d0a06b9171ccc274c87198c6d3148c0da34693427bd609ba6d8f9a95"
        },
        {
          "name": "start_scan",
          "description": "Upload one binder photo (base64). Requires Authorization: Bearer mgt_…. 3 free pages per day with an account, then €0.01/page. Returns job_id.",
          "inputSchema": {
            "properties": {
              "idempotency_key": {
                "type": "string"
              },
              "image_base64": {
                "type": "string"
              },
              "mime": {
                "default": "image/jpeg",
                "type": "string"
              },
              "tcg_type": {
                "default": "mtg",
                "type": "string"
              }
            },
            "required": ["image_base64"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
