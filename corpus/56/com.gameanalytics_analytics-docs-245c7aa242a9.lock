{
  "lockfileVersion": 2,
  "subjects": {
    "com.gameanalytics/analytics-docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.docs.gameanalytics.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gameanalytics-docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "docs_fetch",
          "description": "Fetch the complete content of a documentation page. Use this after searching to get the full markdown content of a specific page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "The full URL of the page to fetch (e.g., \"https://docs.example.com/docs/getting-started\")",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:34c93d4f1b3232cf1177448097f006b8b1bb0bad5d43ff31543bc996210d05d0"
        },
        {
          "name": "docs_search",
          "description": "Search the documentation for relevant pages. Returns matching documents with URLs, snippets, and relevance scores. Use this to find information across all documentation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 16,
                "description": "Maximum number of results to return (1-20, default: 16)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The search query string",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3275f39315714529c2a4124dee0058ca60775c124085f5cbd0d56938e1ae9eea"
        }
      ],
      "digest": "sha256:07b98eb0ca97d9ec97a909256ba1066819ef7f67ac462c6f3b0c331bbf80b092"
    }
  }
}
