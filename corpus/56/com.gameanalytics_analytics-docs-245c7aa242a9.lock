{
  "lockfileVersion": 2,
  "subjects": {
    "com.gameanalytics/analytics-docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.docs.gameanalytics.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gameanalytics-docs",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "docs_fetch",
          "description": "Fetch the complete content of a documentation page. Use this after searching to get the full markdown content of a specific page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "url": {
                "description": "The full URL of the page to fetch (e.g., \"https://docs.example.com/docs/getting-started\")",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1059b8f06f9fc17cd61e95a9d0d9751821abbf56139a5ede391517e0d52065d7"
        },
        {
          "name": "docs_search",
          "description": "Search the documentation for relevant pages. Returns matching documents with URLs, snippets, and relevance scores. Use this to find information across all documentation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "default": 16,
                "description": "Maximum number of results to return (1-20, default: 16)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "The search query string",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7ed874249ece01f68311db4ec33505dc8edc75128d508efacd1307ade02add0a"
        }
      ],
      "digest": "sha256:b780577531a3593e0de9ad6af08598c2a39d567129b380ff9a481df4130c0d10"
    }
  }
}
