      "serverInfo": {
        "name": "cryptominium",
        "title": "Cryptominium",
        "version": "1.244.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Cryptominium measures what crypto positions could actually be sold for. Use exit_cost for \"can I sell X\" and liquidity questions about one token, exit_index for the market as a whole, coin_profile and powermap for what a coin is and who holds power over it, identify_address and explain_transaction for a public address or a transaction hash, what_is for what a crypto term means, and search for anything else. Measurements, not advice. Cryptominium does not recommend buying, selling or holding anything.",
      "tools": [
        {
          "name": "coin_profile",
          "title": "CM Profile: what is known about a coin, and what is not",
          "description": "The Cryptominium Profile (CM Profile) of a tracked coin, in four fixed groups: what Cryptominium has established (contracts matched, chains), what it has measured (the cost of selling on-chain and on exchange order books, with dates; price history), what it has written with sources (what the coin can do and through which company), and what it has not established. Use this when someone asks what is known about a coin, how well documented it is, or whether it depends on a company. Each line links to its evidence. Also returns this week's changes as short tags and the 7-day high, low and latest price, as the coin page chart marks them. A record, not a rating: it is not a view on whether to hold the coin.",
          "inputSchema": {
            "properties": {
              "token": {
                "description": "Ticker, name or contract address, e.g. \"USDC\", \"pepe\", \"0x8335…\".",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "CM Profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:82bbc71abee3ed88b01d0db668f5d6d6793d1510d55c1b6f390c92d517b8940d"
        },
        {
          "name": "exit_cost",
          "title": "What selling a token really returns",
          "description": "Cryptominium measures, every day, what a fixed-size sell of each tracked token actually returns versus its quoted price, by querying live DEX routing on Base, Ethereum and BNB Chain. Use this when someone asks whether a token can really be sold, how liquid it is, or what they would get for a position. Returns the latest measured exit friction (% lost to price impact), the dollars received, the date measured, and a citation — plus, where the token trades on Kraken or Coinbase, what the same sell loses against those order books, and this week's changes as short tags with the 7-day high, low and latest price. Not a price feed and not advice.",
          "inputSchema": {
            "properties": {
              "chain": {
                "description": "Optional: base, ethereum or binance-smart-chain.",
                "type": "string"
              },
              "token": {
                "description": "Ticker, name or contract address, e.g. \"AERO\", \"pepe\", \"0x9401…\".",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Exit cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:956556c18dcc9c30f24ae33770660314b76a546874f69ccdbb230671730e3102"
        },
        {
          "name": "exit_index",
          "title": "The monthly Exit-Friction Index",
          "description": "The Cryptominium Exit-Friction Index: each month, the median share of value lost when selling a fixed $100,000 position across every token with a live on-chain market, with quartiles and the share of tokens losing more than half. Use for questions about overall crypto market liquidity or how hard it is to exit altcoins. Optional month as YYYY-MM; defaults to the latest.",
          "inputSchema": {
            "properties": {
              "month": {
                "description": "YYYY-MM, optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Exit-Friction Index"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:5f5916c945630d1d093704da55ba699de293cda510097b102f899788d31bd307"
        },
        {
          "name": "explain_transaction",
          "title": "What a transaction did",
          "description": "Reads an EVM transaction hash on Base, Ethereum or BNB Chain from its receipt logs: whether it succeeded, what moved to and from whom (with token symbols and decimals), what it cost in fees, and any token approvals it granted or revoked, including unlimited ones. The hash is not stored.",
          "inputSchema": {
            "properties": {
              "hash": {
                "description": "0x followed by 64 hex characters.",
                "type": "string"
              }
            },
            "required": ["hash"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Explain transaction"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:78c56d270689433a7e525b2a466de0f197710534f0579358ab3a3aa7f022ce53"
        },
        {
          "name": "identify_address",
          "title": "What a crypto address is",
          "description": "Identifies a public address or ENS name without being told what it is: wallet or contract, which of seven EVM chains it has been active on (read: Base, Ethereum, BNB Chain; identified: Arbitrum, Polygon, Optimism, Avalanche), EIP-7702 delegation, the token if it is one Cryptominium tracks. Bitcoin addresses are checksum-verified and read; Solana accounts are identified (wallet, mint, token account, program). The address is not stored. A recovery phrase or private key is refused without being looked up.",
          "inputSchema": {
            "properties": {
              "address": {
                "description": "A public address or ENS name.",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Identify address"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f66e7ab7bfc9e38abf701e27d667b0f68bd067ee58a8260c0e61687e99e620cf"
        },
        {
          "name": "powermap",
          "title": "PowerMap: who holds power over a coin",
          "description": "Cryptominium's PowerMap: which company or group holds which of nine powers over a coin (freeze, pause, mint, redeem, custody, govern, validate, pay out, bridge), each repeating that party's own terms with a link and a date, plus on-chain readings of mint and freeze authority. Answers questions about a coin (\"USDC\"), a company (\"Circle\"), or a class of coins (\"which stablecoins can be frozen\"), and says what is not established. It records who can use a power, not whether they will.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "A coin, a company, or a question, e.g. \"USDC\", \"Circle\", \"which stablecoins can be frozen\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "PowerMap"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a06cb792632ce306a84916b17558cc9ad55a4f9194752578bea676d7da60da0d"
        },
        {
          "name": "search",
          "title": "Search Cryptominium",
          "description": "Cryptominium's crypto search: says what a query is (ticker, address, transaction, comparison, a question about selling a position, a directory category…) and returns the matching coins and Cryptominium pages. Use it to find the right Cryptominium page for a crypto question.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Anything crypto.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b32ede21f131e9ca70d96317599ef79dd215a4a7bb7801bc1a4cbc4ddcdf1fd0"
        },
        {
          "name": "what_is",
          "title": "What a crypto word means",
          "description": "Cryptominium's hand-written crypto library: what a crypto, blockchain, trading or crypto-technology term means in plain English, what it means in practice for someone holding or sending crypto, how it works, a common misconception, and the primary source it was checked against with the date. For ideas such as \"code is law\" or \"sound money\", the strongest case for and against, each sourced. Accepts a term (\"impermanent loss\"), a question (\"what is an NFT\"), two terms to contrast (\"proof of work vs proof of stake\") or a topic (\"defi terms\"). Written ahead of time, not generated.",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "A crypto term, a \"what is\" question, \"X vs Y\", or a topic.",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "What is"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f0f105ec365247415044305881cb2e146eb1d9b46bcebf4dc5cb71dcf65fe1e1"
        }
      ],
      "digest": "sha256:85baec9c383573bbb5eecea5bd9a54456f77b1bf0b9b18883477c60c279c4291"
    }
  }
