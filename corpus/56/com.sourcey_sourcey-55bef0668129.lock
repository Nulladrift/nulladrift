        {
          "name": "get_report",
          "title": "Get a Sourcey report",
          "description": "Get the State of Startup Credits or the State of Agent Readiness report: the figures of one Catalog release (offers by size, by how a startup reaches them and by their terms; report cards by grade, by step and by category), that release's names for every company, offer and report card the figures cite, the fact sheets the prose was written from, and the prose itself, every sentence judged against those fact sheets. Without a release, the current report, written at most once a day from the release current then; with one, the report as written from that release, kept for citing. Each answer carries the page it is read at.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "release_id": {
                "description": "The release a report was written from, to read it as cited; omit for the current report.",
                "pattern": "^sha256:[a-f0-9]{64}$",
                "type": "string"
              },
              "report": {
                "description": "Which report: startup-credits (what startup offers give, who can get them and what they ask in return) or agent-readiness (whether an agent can do a software job on its own, and where a person has to step in).",
                "enum": ["startup-credits", "agent-readiness"],
                "type": "string"
              }
            },
            "required": ["report"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "canonical_url": {
                "format": "uri",
                "type": "string"
