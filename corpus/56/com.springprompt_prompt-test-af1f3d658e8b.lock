        {
          "name": "load_prompts",
          "description": "Load prompts and their examples into the account for the person to review and run. Spends nothing. Returns a link to show them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "prompts": {
                "description": "Up to 40 prompts.",
                "items": {
                  "properties": {
                    "cases": {
                      "description": "Realistic inputs, up to 24: {values: {variable: text}, notes}.",
                      "items": {
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "checks": {
                      "description": "Yes/no statements a good answer meets.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "file": {
                      "description": "Where it is, like app/triage.py:42.",
                      "type": "string"
                    },
                    "model": {
                      "description": "The model it calls now, if known.",
                      "type": "string"
                    },
                    "name": {
                      "description": "A short name, like Support triage.",
                      "type": "string"
                    },
                    "prompt": {
                      "description": "The user prompt, with {{variables}}.",
                      "type": "string"
                    },
                    "system": {
                      "description": "The system prompt, if any.",
                      "type": "string"
                    }
                  },
                  "required": ["prompt"],
                  "type": "object"
                },
                "type": "array"
              }
