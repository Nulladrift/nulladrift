        },
        {
          "name": "score_answers",
          "description": "Score up to 50 answers with a trained judge: how likely the person it learned from is to call each one good, from 0 to 1. Spends a little credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "answers": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
