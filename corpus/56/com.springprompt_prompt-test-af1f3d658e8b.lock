            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9f15030bba9ad63ae2cf5ef6cd86718944dbbf73a8e9b7f961d15733fb95be5a"
        },
        {
          "name": "train_judge",
          "description": "Train a judge on a test's ratings. It's tested on answers it hasn't seen, and only kept if it beats always giving the commoner verdict. Spends a little credit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Whose opinions, like Maria's taste.",
                "type": "string"
              },
              "test_id": {
                "type": "string"
              }
            },
            "required": ["name", "test_id"],
