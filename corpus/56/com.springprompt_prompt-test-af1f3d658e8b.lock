        },
        {
          "name": "test_prompt",
          "description": "Start a test of one prompt across several models. Spends credit, never more than max_spend_usd by estimate. Returns at once with a test_id: call get_test for the results. Cases and checks are drafted if left out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cases": {
                "description": "Realistic inputs, up to 24.",
                "items": {
                  "properties": {
                    "notes": {
                      "description": "What a good answer does.",
                      "type": "string"
                    },
                    "values": {
                      "description": "A value for each variable.",
                      "type": "object"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "checks": {
                "description": "Yes/no statements a good answer meets.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "max_spend_usd": {
                "description": "Limit for this test. Default 1. Models are left out, dearest first, to fit.",
                "type": "number"
              },
              "models": {
                "description": "Model IDs from list_models, up to 6. Default: a starting mix.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "name": {
                "description": "A short name, like Support triage.",
                "type": "string"
              },
              "prompt": {
                "description": "The user prompt, with {{variables}}.",
                "type": "string"
              },
              "system": {
