          "description": "Find similar or alternative plugins to a given plugin (by NewVSTs slug or name), optionally filtered by format/OS/price.",
          "inputSchema": {
            "properties": {
              "format": {
                "description": "Required plugin format",
                "enum": ["VST3", "AU", "AAX", "CLAP", "VST2", "LV2", "Standalone"],
                "type": "string"
              },
              "free_only": {
                "description": "Only free plugins",
                "type": "boolean"
              },
              "limit": {
