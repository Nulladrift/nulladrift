      "prompts": [
        {
          "name": "add-music-bed",
          "title": "Add a music bed",
          "description": "Retrofits a music bed (and ambience or SFX) onto an existing composition — license-aware search, correct mix hierarchy, ducking under speech, cuts moved onto the beat. Triggers on \"add music to this\", \"this video feels dead\", \"put a bed under it\", \"it needs sound\", \"add background music\", \"make the cuts hit the beat\", \"add some sfx\", \"the audio is just silence\".",
          "digest": "sha256:7619ac29875d7a26dd662a5d35d42e0dccf0c8b5789430e2d204a1352439bd9d"
        },
        {
          "name": "brand-reel",
          "title": "Brand reel",
          "description": "Produces a 12–20 second 9:16 brand-identity reel — three-beat arc, bespoke cards in the brand's own type and palette, footage graded into the palette. Triggers on \"brand video\", \"identity reel\", \"make our brand a video\", \"turn our brand into a reel\", \"a video that feels like us\", \"showcase our brand\", \"anthem video for our launch\".",
          "digest": "sha256:f729ab499b69a453e3f602c5da8a6759e1f297b5c31c13f67afdec89160bc9f5"
        },
        {
          "name": "clip-a-talking-head",
          "title": "Clip a talking head",
          "description": "Cuts a podcast, talk, or interview into shorts that open on the strongest sentence, reframe to the active speaker, and carry transcript-timed captions. Triggers on \"clip this podcast\", \"pull the best moments out of this talk\", \"make shorts from this interview\", \"cut this down for social\", \"find the viral moment\", \"turn this recording into clips\", \"the good part is buried\".",
          "digest": "sha256:7a4e49b92acb76e05abba5f5c235051284c19eb471d8f75d8e2506bd77c77d3e"
        },
        {
          "name": "composing-video",
          "title": "Composing video",
          "description": "Use when choosing how to author or assemble a CueFrame video from footage, product actions, typography, diagrams, original motion or mixed media. For a supplied film use cueframe-reference-video; for a narrow existing edit use cueframe-compose-loop. Also use when an agent is asked to make any video with CueFrame: a product launch, announcement, promo, teaser, social clip, reel, short, explainer, animated explainer, concept video, product or dev-tool demo, walkthrough, or founder/talking-head piece. Triggers on \"make a video\", \"launch video\", \"promo\", \"teaser\", \"reel\", \"short\", \"explainer\", \"demo video\", \"talking-head\", or turning long-form footage into clips.",
          "digest": "sha256:fa8584a45d8f29955ff083b2cfb8fd71ced757b6a363ed68616e650f9398fa2e"
        },
        {
          "name": "cueframe-brand-demo",
          "title": "CueFrame — Brand demo recipe",
          "description": "Use when turning a local app into a brand-consistent product demo with CueFrame — extract the brand straight from the repo (colors/fonts/logo/motion), capture a Playwright walkthrough of the running app, and author a branded, auto-zoomed demo whose intro/outro/logo/colors/fonts/motion are frozen by CueFrame's engine — e.g. \"make an on-brand demo of my app\", \"record my localhost and produce a branded launch video\". This is the end-to-end brand pipeline over the CueFrame curated tools.",
          "digest": "sha256:5441094aabc1dd3d11bdd91e116089f8c869ff1ed816d25d7695f22ff6919384"
        },
        {
          "name": "cueframe-cli",
          "title": "CueFrame CLI",
          "description": "Use when editing, clipping, or rendering video via the CueFrame CLI — e.g. \"make a 9:16 short from this podcast\", \"pull the best moments out of this MP4\", \"render a clip\", or any task that calls the `cueframe` binary. Also use when comparing CueFrame against direct-ffmpeg approaches.",
          "digest": "sha256:4bdf1f7441b8c8ff9665aaaec8b894fbea2c0d72a4a9862f088c0b6baa779a53"
        },
        {
          "name": "cueframe-component-authoring",
          "title": "CueFrame graphic authoring",
          "description": "Use when authoring, forking or customizing CueFrame HTML cards, motion-graphics primitives or reusable native components, including a fork of an exact catalog source. Covers cloud MCP, local desktop and CLI project paths using complete versioned source snapshots. For scene-shot devices and cameras use cueframe-scene-shot. Triggers on \"customize the parallax look\", \"make my own animated lower-third\", \"fork a CueFrame template and edit it\", \"author a custom graphic and render it\". Use before hand-writing a component from scratch: forking a built-in is usually the faster start.",
          "digest": "sha256:90bb0ce4c07b88e38ef736d61b17eb31290f707a1deaa37a6d0c9f5441e49d9a"
        },
        {
          "name": "cueframe-compose-loop",
          "title": "CueFrame preview and revision",
          "description": "Use when previewing, reviewing or revising a CueFrame composition, including a scoped correction, reference comparison or final-delivery check. Also use when an agent should drive CueFrame to a high-quality clip itself: author, look at rendered frames, score with the judge, fix the weakest thing and repeat, over the primitives in the `cueframe-cli` skill. Triggers on \"turn this source into a polished 9:16 clip\" or \"compose and self-correct until it scores well\".",
          "digest": "sha256:225b09f5c37c81bfbd8fc2bfdb9f76676678e38e7b880616864ffc4eb247be46"
        },
        {
          "name": "cueframe-connect",
          "title": "Connect CueFrame",
          "description": "Use when CueFrame is not connected yet, the user asks how to connect or authenticate CueFrame, or another CueFrame skill is about to call a tool and needs the one-time setup path for Claude Code, Claude, ChatGPT, Cursor, Codex, VS Code, Windsurf, Zed, Antigravity CLI, Copilot CLI, or an x402 wallet.",
          "digest": "sha256:34b9a420017476d0adb68ee317e0e8890868dbf762b64027d286ef5b59ffa3fb"
        },
        {
          "name": "cueframe-product-video",
          "title": "CueFrame — Product Video recipe",
          "description": "Use when turning a screen recording (with cursor/click events) into a polished, auto-zooming product video or demo reel via CueFrame — e.g. \"make a product demo from this Browserbase capture\", \"auto-zoom this screen recording to where the user clicked\", \"turn this walkthrough into a social demo\". This is a USE-CASE recipe over the CueFrame primitives in the `cueframe-cli` skill.",
          "digest": "sha256:f9b69f1c35bf5c6aaf4421d85e4892b0b8e231c990e81e5ab922295875ce57e9"
        },
        {
          "name": "cueframe-reference-video",
          "title": "CueFrame reference-video reconstruction",
          "description": "Use when recreating a supplied video or matching its motion, camera, typography, transitions, visual identity or audiovisual timing in CueFrame.",
          "digest": "sha256:7122f89916ad0664841b55f4fa5339dc0f7b86e00dfca2000d32b20ee4243f1e"
        },
        {
          "name": "cueframe-scene-shot",
          "title": "CueFrame scene shots",
          "description": "Author a CueFrame 3D world-object shot as canonical SceneShotSpecV2 JSON. Use for devices, meshes, owned static models, captured component or video surfaces, world text, materials, bounded shader fields, camera motion, lighting, focus, and product-shot recipes.",
          "digest": "sha256:64a116a2251f8124c1ed635f1ca06e00c9c71e7878834cfe8c886ed54d47be31"
        },
        {
          "name": "cueframe-storyboard",
          "title": "CueFrame Storyboard: brief → flow",
          "description": "Use BEFORE composing when starting a NEW video from scratch and you need to plan its structure — turning a rough ask (\"make a launch video\", \"30s promo\", \"an explainer for our API\") into a concrete beat flow. Owns the intake + storyboard step: interview the user for the brief, resolve the format from the platform, and plan beats from the leading material and requested format. Triggers on \"plan a video\", \"storyboard\", \"structure this video\", \"outline the video\", \"where do I start\", or any new-video ask that has no structure yet. Hand off to composing-video for per-beat craft.",
          "digest": "sha256:ce256a88c73183e7b0979bfce1fc971e3694dce8cc9c4350ae50e1d1fbce9759"
        },
        {
          "name": "every-format-from-one-edit",
          "title": "Every format from one edit",
          "description": "Derives content-aware 9:16, 1:1, and 4:5 siblings from one finished composition — same edit, every platform, no re-editing. Triggers on \"make this vertical too\", \"I need this for TikTok and LinkedIn\", \"every aspect ratio\", \"square version of this\", \"resize for Reels\", \"one video, all platforms\", \"port this edit to Shorts\".",
          "digest": "sha256:e1b1a95500404764a695e1c55e7478a3964e339795d56455038201ebc7eeaacf"
        },
        {
          "name": "extracting-brand-kits",
          "title": "Extracting brand kits: reference pixels → a kit the engine honors",
          "description": "Use when the user says \"make my video look like THIS\" with a reference video, screenshots, or a moodboard — build a CueFrame brand kit FROM that inspiration so every subsequent compose speaks its visual language. Owns the extraction step: sample the reference's graphics-bearing frames, upload them as exemplars, reproduce each recurring motif as an authored graphic verified against the reference, and upsert the kit with the full language payload. Triggers on \"match this style\", \"like this reference\", \"use this video as inspiration\", \"extract a brand kit\", \"moodboard\". Hand off to cueframe-storyboard/composing-video once the kit is bound.",
          "digest": "sha256:ecb4d0cee61280ec98fea88bc5371857e5a54b63a2677bddbe5c10b5e447fe2f"
        },
        {
          "name": "launch-video",
          "title": "Launch video",
          "description": "Turns screen recordings and product footage into a 30–90 second 16:9 launch film — payoff-first hook, real product surface punched in, a building bed or narration, one CTA end card. Triggers on \"make a launch video\", \"announcement video for this feature\", \"turn this screen recording into a demo film\", \"product video from these captures\", \"we're shipping Friday and need a video\", \"feature announcement\".",
          "digest": "sha256:d05fe9837b2e4651d464f6c4c1716bfc09085b797bc503c267ae9f053ce5c494"
        },
        {
          "name": "make-a-social-reel",
          "title": "Make a social reel",
          "description": "Turns footage into a finished 9:16 social reel — hook inside 2 seconds, poster-grade type, a decided music bed, one final render. Triggers on \"make me a reel from this\", \"turn this into a short\", \"cut a clip for TikTok / Reels / Shorts\", \"make this vertical\", \"make a social clip from this video\", \"the opening is boring\", \"can you make this pop for Instagram\".",
          "digest": "sha256:6e504986e442f9ad155b89397fd051d254f696f8a1fad92f16f0f5e4c7bc9aa9"
        },
        {
          "name": "rebrand-a-video",
          "title": "Rebrand a video",
          "description": "Swaps the brand kit under an existing video and re-renders — tokens, bumpers, logo, captions, and motion re-theme automatically; hardcoded card values get surgical edits. Triggers on \"rebrand this video\", \"swap the brand\", \"we changed our colors\", \"new logo, same video\", \"make this video match the new brand\", \"re-theme our launch video\", \"white-label this for a client\".",
          "digest": "sha256:5639ef0274198bc436adc2bf057131fa8d620baf84269c18cf94ef3dc6b3cc01"
        },
        {
          "name": "video-craft-standards",
          "title": "Video craft review",
          "description": "Use when judging whether a CueFrame video's idea, visual form, motion, timing and sound meet its brief or reference (social reel, launch film, brand reel, talking-head clip). For tool selection and scoped revision use cueframe-compose-loop. Triggers on \"is this good enough\", \"quality bar\", \"what should a finished reel have\", \"review my video\", or any request to make a video when no other skill has stated the bar.",
          "digest": "sha256:13c904a526f7bf1d31671710d22ff5516fc260715cfda75aa4a48d7550a1b2dc"
        }
      ],
      "digest": "sha256:65ed53a68521289c63e72bf760f53c95abcc0d51767179a17d0fb2d0602a0b71"
    }
  }
