                "properties": {},
                "type": "object"
              },
              "retryable": {
                "description": "Whether re-attempting the SAME render can succeed (status `error`); null otherwise. true → call retry_render. false → deterministic (category authoring/internal); fix the composition first — retry_render alone reproduces it. Mirrors the render.failed webhook's `retryable`.",
                "type": ["boolean", "null"]
              },
              "status": {
                "enum": ["queued", "pending", "rendering", "complete", "error", "cancelled"],
                "type": "string"
