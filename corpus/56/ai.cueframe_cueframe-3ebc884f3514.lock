            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": {},
            "properties": {
              "category": {
                "description": "Failure taxonomy when status is `error`; null otherwise. `authoring` = deterministic defect in YOUR composition/request — fix it, retrying is futile; `transient` = temporary pipeline/infra failure — safe to retry_render; `internal` = unexpected server fault — retry once then escalate. Mirrors the render.failed webhook's `category`."
              },
              "completedAt": {
                "description": "ISO-8601 instant the render reached its terminal status (complete, error or cancelled); null while it runs. Pair with createdAt for the wall time.",
                "type": ["string", "null"]
              },
              "compositionId": {
                "description": "The composition this render froze at create time (the project's active one, or the compositionId the request named). Null on renders minted before this was recorded.",
                "type": ["string", "null"]
              },
              "createdAt": {
                "type": "string"
              },
              "engine": {
                "description": "The render engine the row was minted for. Null on rows minted before the engine was recorded."
              },
              "error": {
                "description": "Human-readable failure message. Pair with `errorCode` for a stable, machine-readable code an agent runner can branch on.",
                "type": ["string", "null"]
              },
              "errorCode": {
                "description": "Stable, machine-readable error code (e.g. `render_pipeline_unavailable`, `render_route_missing`, `render_pipeline_failed`). Null when status is not `error` or unavailable for an older render.",
                "type": ["string", "null"]
              },
              "errorDetails": {
                "description": "Structured failure context — `{ targetUrl?, upstreamStatus?, upstreamCode?, attemptedAt? }`. Surfaced so agent runners can distinguish operator-config issues from upstream-down vs route-missing without parsing `error`."
              },
              "format": {
                "description": "The resolved output format the render was encoded at (aspectRatio, fps, resolution): the frozen composition's, after any create-time scale override. Null on legacy rows."
