        {
          "name": "wait_job",
          "title": "Wait for Job",
          "description": "Wait for a long-running job and return the resolved result — a bounded long-poll. Includes template preparation (kind=\"template\", id=jobId), media import, render, compose, consult, suggestions and preview. If still running, call wait_job again with the same arguments; work continues server-side.",
          "inputSchema": {
            "$defs": {
              "__schema0": {
                "items": {
                  "$ref": "#/$defs/__schema1"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "__schema1": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "__schema2": {
                "type": "string"
              },
              "__schema3": {
                "maximum": 1800000,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "kind=\"media\": mediaItemId returned by import/generate/finalize/import_resource. kind=\"render\": renderId. kind=\"compose\": composeJobId. kind=\"consult\": consultJobId. kind=\"suggestions\": mediaItemId. Generic kinds use the jobId from the enqueue receipt.",
                "type": "string"
              },
              "imageIndices": {
                "$ref": "#/$defs/__schema0",
                "description": "Read these 1–4 original zero-based image artifact indices from this completed job, in this order. Does not render again. Same arguments repeat the same selection; omit for the first four."
              },
              "kind": {
                "description": "What to wait on, including template preparation (kind=\"template\").",
                "enum": ["media", "render", "compose", "suggestions", "verify", "preview_frame", "preview", "brand_kit_extract", "consult", "template"],
                "type": "string"
              },
              "projectId": {
                "$ref": "#/$defs/__schema2",
                "description": "Required when kind=\"render\", \"compose\", or \"consult\"."
              },
              "timeoutMs": {
                "$ref": "#/$defs/__schema3",
                "description": "Maximum wait in ms (default 30 min for render/compose, 5 min for suggestions)."
              }
            },
            "required": ["id", "kind"],
            "type": "object"
          },
