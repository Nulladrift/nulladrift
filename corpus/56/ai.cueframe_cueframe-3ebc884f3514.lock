              "listUsd": {
                "description": "A2 money stamp: the metered event's LIST price (USD), stamped at the success terminal (exports for deliverable renders, compose_capture for A8 previews). A plan allowance may zero the actual invoice line — this is the list price, never a Stripe charge. Absent while running, on failure, and for x402 orgs (on-chain receipts). Mirrors the get_usage ledger.",
                "type": "number"
              },
              "outputDurationSec": {
                "description": "The output's length in seconds (the composition timeline's, or the preview window's), as billed. Null on legacy rows.",
                "type": ["number", "null"]
              },
              "outputExpiresAt": {
                "type": ["string", "null"]
              },
              "outputUrl": {
                "type": ["string", "null"]
              },
              "preview": {
                "description": "The scoped preview window when this is a preview_clip render; null for a full deliverable."
