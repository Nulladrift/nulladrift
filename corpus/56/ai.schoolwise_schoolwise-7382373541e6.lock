      "instructions": "Answer school days off, early releases, lunch and coming events using find_school, get_school_days_off, get_school_lunch and get_school_events. Coverage is limited to schools with a Schoolwise school page. Use the school page as the source and full calendar. Dates follow the school's clock. Empty lists mean the page lists none. This server has no access to any family.",
