          "name": "find_school",
          "title": "Find covered schools",
          "description": "Find covered schools by name or town; a name can match several schools. Omit name to list every covered school (up to 50). Covered schools only: today, schools in Greenwich, Connecticut that have a Schoolwise school page. This school year only; events cover about the next two weeks, and lunch can be empty.",
