      "instructions": "Ippuku is a free, community-maintained map of drink vending machines, public toilets, smoking areas, trash cans, stamp stations and coin lockers in Japan. Use these tools for questions like \"Where can I smoke near Namba?\" or \"Toilet near Shinjuku station?\". If the user names one of Ippuku's areas, pass it as area to find_nearby_places; list_areas lists them. Otherwise pass the coordinates of the place the user means. Answer with the closest places, their distance and their link, and always show the data attribution. Smoking on the street is banned in many Japanese cities; designated smoking areas are the legal place to smoke.",
      "tools": [
        {
          "name": "find_nearby_places",
          "title": "Find nearby places",
          "description": "Find the closest vending machines, toilets, smoking areas, trash cans, stamp stations or coin lockers in Japan around a point or in one of Ippuku's areas, closest first, with distance, attributes and a link to the map. Use it whenever the user asks where the nearest such place is, for example \"Where can I smoke near Namba?\". Pass either area (see list_areas) or lat and lon, not both. If nothing is found, retry with a larger radius.",
