            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "area": {
                "description": "An area from GET /v1/areas, such as osaka/namba. Uses the area's center and radius. Pass either area or lat and lon, not both.",
                "enum": ["tokyo/shinjuku", "tokyo/shibuya", "tokyo/ikebukuro", "tokyo/tokyo-station", "tokyo/ginza", "tokyo/asakusa", "tokyo/ueno", "tokyo/akihabara", "tokyo/roppongi", "tokyo/shinagawa", "tokyo/odaiba", "osaka/namba", "osaka/umeda", "osaka/shinsaibashi", "osaka/tennoji", "osaka/shin-osaka", "kyoto/kyoto-station", "kyoto/gion", "kyoto/arashiyama", "yokohama/yokohama-station", "yokohama/minatomirai", "nara/nara-park", "kobe/sannomiya", "hiroshima/hiroshima-center", "fukuoka/hakata", "fukuoka/tenjin", "sapporo/sapporo-center", "nagoya/nagoya-station", "kanazawa/kanazawa-center", "takayama/takayama-old-town", "kamakura/kamakura-center", "nikko/nikko-center", "fujikawaguchiko/kawaguchiko", "sendai/sendai-station", "naha/kokusai-dori"],
                "type": "string"
              },
              "category": {
                "description": "Only places of this category. Without it, all categories.",
                "enum": ["vending_machine", "toilet", "smoking_area", "waste_basket", "stamp", "coin_locker"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude of the center, WGS84. Required with lon unless area is given.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of places, closest first.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "lon": {
                "description": "Longitude of the center, WGS84. Required with lat unless area is given.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "radius": {
                "description": "Search radius in meters. Default 1000, with area the area's radius (and at most that).",
                "maximum": 2000,
                "minimum": 10,
                "type": "integer"
              }
            },
            "type": "object"
          },
