        {
          "name": "find_am_stations",
          "description": "Find AM radio stations by city, ZIP code, callsign, frequency,\n    or state. Includes daytime and nighttime coverage data with\n    Longley-Rice terrain-aware propagation modeling.\n    Examples: 'KNX', '1010', 'New York', 'CA'.\n    Source: FCC CDBS (Consolidated Database System). US only.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What to find: callsign ('KNX'), frequency in kHz ('1010'), city ('New York'), or two-letter state code ('CA').",
                "title": "Query",
                "type": "string"
              },
              "radius_miles": {
                "default": 100,
                "description": "Search radius in miles when query resolves to a location. Default 100.",
                "title": "Radius Miles",
                "type": "integer"
              }
            },
            "required": ["query"],
            "title": "find_am_stationsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1a1c27dc7e346ca81fb668f759d83c9462784bf6967a9c933fad55549eee234b"
        },
        {
          "name": "find_fm_stations",
          "description": "Find FM radio stations by city name, ZIP code, callsign, frequency,\n    format/genre (e.g. 'country', 'rock', 'jazz'), or network name.\n    Examples: 'Nashville', '90210', 'WFMT', '101.1', 'country near Austin',\n    'NPR near Boston'. Returns station list with frequency, callsign,\n    city, format, and signal strength data.\n    Source: FCC LMS (Licensing and Management System) for station data;\n    Wikipedia for owner/brand and format enrichment. US only.",
          "inputSchema": {
            "properties": {
              "lat": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional latitude in decimal degrees (e.g. 40.7128 for NYC). If provided with lon, restricts results to within radius_miles.",
                "title": "Lat"
              },
              "lon": {
                "anyOf": [
                  {
                    "type": "number"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional longitude in decimal degrees (e.g. -74.0060 for NYC). Negative = West, positive = East.",
                "title": "Lon"
              },
              "query": {
                "description": "What to find: city ('Nashville'), ZIP ('90210'), callsign ('WFMT'), frequency ('101.1'), format/genre ('country'), or 'X near Y' like 'jazz near Boston'.",
                "title": "Query",
                "type": "string"
              },
              "radius_miles": {
                "default": 75,
                "description": "Search radius from the location in miles. Default 75.",
                "title": "Radius Miles",
                "type": "integer"
              }
            },
            "required": ["query"],
            "title": "find_fm_stationsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:abf11f272123332fc4e9d35d7a93549a656e93b17dd879889ca283fc7e45b18d"
        },
        {
          "name": "find_international_stations",
          "description": "Find radio stations in countries outside the USA.\n    Supported country codes: UK / GB (United Kingdom), EU (Europe — specify\n    country with query like 'Germany', 'France' or 'SE'), AU (Australia),\n    BR (Brazil), ZA (South Africa), CL (Chile), AR (Argentina),\n    TH (Thailand), MY (Malaysia), SG (Singapore), BN (Brunei),\n    VN (Vietnam), TW (Taiwan), RU (Russia), NZ (New Zealand),\n    JP (Japan), CA (Canada), ES (Spain), FR (France), DE (Germany).\n\n    Sources by country (official spectrum regulators where available):\n      France:    ANFR via data.gouv.fr (official open data)\n      UK:        Ofcom TxParams CSVs\n      Germany/EU: BNetzA (Bundesnetzagentur)\n      Australia: ACMA RRL spectra\n      Brazil:    ANATEL open data\n      Chile:     SUBTEL via datos.gob.cl\n      Japan:     MIC (Ministry of Internal Affairs and Communications)\n      Canada:    ISED baserad\n      South Africa: ICASA Terrestrial Broadcasting Frequency Plan\n      New Zealand: RSM PRISM database\n\n    Community-maintained sources (where official data is not openly\n    accessible):\n      Spain, Russia:                radiomap.eu\n      Argentina:                    worldradiomap.com\n      Vietnam, Taiwan, Thailand,\n      Brunei/Malaysia/Singapore:    asiawaves.net\n\n    Coverage depth varies by country — official-source countries (France,\n    UK, AU, BR, DE, JP, CA) are most complete. Optional query filters\n    results by station name, city, or frequency.",
          "inputSchema": {
            "properties": {
              "country_code": {
                "description": "ISO-3166 alpha-2 country code: 'UK' or 'GB' (United Kingdom), 'AU' (Australia), 'BR' (Brazil), 'ZA' (South Africa), 'CL' (Chile), 'AR' (Argentina), 'TH' (Thailand), 'MY' (Malaysia), 'SG' (Singapore), 'BN' (Brunei), 'VN' (Vietnam), 'TW' (Taiwan), 'RU' (Russia), 'NZ' (New Zealand). For European countries other than UK, use 'EU' and pass the country in the query parameter.",
                "title": "Country Code",
                "type": "string"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional. Filter results by station name, city, or frequency. For 'EU' country_code, REQUIRED — pass the country name or code (e.g. 'Germany' or 'SE').",
                "title": "Query"
              }
            },
            "required": ["country_code"],
            "title": "find_international_stationsArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
