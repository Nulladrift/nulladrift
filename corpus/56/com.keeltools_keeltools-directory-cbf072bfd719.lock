{
  "lockfileVersion": 2,
  "subjects": {
    "com.keeltools/keeltools-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://keeltools.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "keeltools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_entry",
          "title": "Get KeelTools entry details",
          "description": "Get structured details for one entry by type and slug: tagline, pricing model, features, use cases, pros, cons and FAQ. Use search_directory first to find the slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Entry slug, e.g. 'aider' or 'code-review-assistant'",
                "type": "string"
              },
              "type": {
                "description": "Entry type: tool, skill or prompt",
                "enum": ["tool", "skill", "prompt"],
                "type": "string"
              }
            },
            "required": ["slug", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5af1db2f56b23ad795bdd9baa476f70294bc0f77f4558f54703a9c80e1524b73"
        },
        {
          "name": "search_directory",
          "title": "Search KeelTools directory",
          "description": "Search the KeelTools directory of AI tools, Skills and prompts. Matches name, slug, aliases and taglines. Returns type, slug, name, tagline and page URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword to match against name, slug, aliases or tagline",
                "type": "string"
              },
              "type": {
                "description": "Filter by entry type: tool, skill or prompt",
                "enum": ["tool", "skill", "prompt"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6434f455f59805960e0aab9ca3b2b154b594dc1c2c71641198ac6baad9326bcc"
        }
      ],
      "digest": "sha256:b0f517e36f1894c0e9b4787680c629a347eb270b828f4d8b063e8d00ddad9e75"
    }
  }
}
