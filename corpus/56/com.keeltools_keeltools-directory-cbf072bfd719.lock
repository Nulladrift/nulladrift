{
  "lockfileVersion": 2,
  "subjects": {
    "com.keeltools/keeltools-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://keeltools.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "keeltools",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_entry",
          "title": "Get KeelTools entry details",
          "description": "Get structured details for one entry by type and slug: tagline, pricing model, features, use cases, pros, cons and FAQ. Use search_directory first to find the slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Entry slug, e.g. 'aider' or 'code-review-assistant'",
                "type": "string"
              },
              "type": {
                "description": "Entry type: tool, skill or prompt",
                "enum": ["tool", "skill", "prompt"],
                "type": "string"
              }
            },
            "required": ["slug", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28a2c9483f46c7acda16b8d52928671e7a9226b55579e6905d465be58b12023c"
        },
        {
          "name": "search_directory",
          "title": "Search KeelTools directory",
          "description": "Search the KeelTools directory of AI tools, Skills and prompts. Matches name, slug, aliases and taglines. Returns type, slug, name, tagline and page URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Keyword to match against name, slug, aliases or tagline",
                "type": "string"
              },
              "type": {
                "description": "Filter by entry type: tool, skill or prompt",
                "enum": ["tool", "skill", "prompt"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b0c3c150fdc112fc9bb673c6c453f72b7444dcb30f0ec762077be2e815ae7bfa"
        }
      ],
      "digest": "sha256:33327e178724a50d6426cbc8fd2d5fac832648ba8f5725702959e81359e3be2a"
    }
  }
}
