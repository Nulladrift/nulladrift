{
  "lockfileVersion": 2,
  "subjects": {
    "com.lookmybio/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.lookmybio.com/public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "lookmybio-public",
        "title": "lookmybio",
        "version": "1.25.0",
        "websiteUrl": "https://lookmybio.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "lookmybio hosts link-in-bio pages and blogs for creators. Use these tools to find a creator and read what their public page and blog show. Link people to the page URL in each result. Questions about how lookmybio itself works (features, plans and credits, billing, connecting accounts, fixing a problem) are answered with search_help, from the lookmybio help center and docs: answer from its results and show the person the sources you used.",
      "tools": [
        {
          "name": "find_creator",
          "title": "Find a creator",
          "description": "Find creators on lookmybio by username or name. Returns their bio page links. Use it when someone asks for a creator’s link in bio, website or socials and you do not know their exact lookmybio username.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a creator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64acd945e075250241198f928f7a8853a9e2ec5125f47cc9aae900c44004a184"
        },
        {
          "name": "get_bio_page",
          "title": "Read a bio page",
          "description": "Read a creator’s lookmybio bio page: name, bio, links and the blocks on the page, exactly as visitors see it. Link people to the page URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "username": {
                "description": "The creator’s lookmybio username, with or without @, or their page URL.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a bio page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e980915c31f420ae536f7fae6369e7ddb13cadd5439c644f4d4452369a51dfc9"
        },
        {
          "name": "get_blog_post",
          "title": "Read a blog post",
          "description": "Read one post from a creator’s lookmybio blog as plain text, by its slug (the last part of the post URL).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "username": {
                "description": "The creator’s lookmybio username, with or without @, or their page URL.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug", "username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a blog post"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b32f45f70b2a4bbce6212c0803b82d24d1e3c79eb1eae85be2813e486f3bba1b"
        },
        {
          "name": "list_blog_posts",
          "title": "List blog posts",
          "description": "List the published posts on a creator’s lookmybio blog, newest first, with links. Use get_blog_post to read one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "username": {
                "description": "The creator’s lookmybio username, with or without @, or their page URL.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List blog posts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6276784c22fd0f260bc4dcb50e3141f8e8b1e125b07f388be4f6ff58653cd36"
        },
        {
          "name": "search_help",
          "title": "Search lookmybio help",
          "description": "Search the lookmybio help center and docs for how lookmybio works: features, plans and credits, billing, connecting social accounts, scheduling, the bio page, AI Studio, connecting AI apps, and fixing problems. Use it before answering any question about how to do something in lookmybio, and answer from what it returns. Each result has its source: a docs url, or an app_url that opens the page in lookmybio. Show the person the sources you used.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "language": {
                "description": "The language of the docs to search: en or pt (Portuguese). Leave it out to follow the person.",
                "enum": ["en", "pt"],
                "type": "string"
              },
              "limit": {
                "description": "Sections to return; default 4.",
                "maximum": 8,
                "minimum": 1,
                "type": "integer"
              },
              "question": {
                "description": "The person’s question in their own words, in any language.",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search lookmybio help"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "ui": {
              "resourceUri": "ui://lookmybio/help-sources-v1.html"
            },
            "ui/resourceUri": "ui://lookmybio/help-sources-v1.html"
          },
          "digest": "sha256:3c1bf2662aeafc047ac65218a682f0d576a51b76b771b6548901906a6d5cfbe9"
        }
      ],
      "resources": [
        {
          "uri": "ui://lookmybio/help-sources-v1.html",
          "name": "help-sources",
          "title": "lookmybio help sources",
          "description": "The help center and docs sections an answer about lookmybio came from, with links.",
          "mimeType": "text/html;profile=mcp-app",
