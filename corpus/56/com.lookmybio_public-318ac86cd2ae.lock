{
  "lockfileVersion": 2,
  "subjects": {
    "com.lookmybio/public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.lookmybio.com/public"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "lookmybio-public",
        "title": "lookmybio",
        "version": "1.5.0",
        "websiteUrl": "https://lookmybio.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "lookmybio hosts link-in-bio pages and blogs for creators. Use these tools to find a creator and read what their public page and blog show. Link people to the page URL in each result.",
      "tools": [
        {
          "name": "find_creator",
          "title": "Find a creator",
          "description": "Find creators on lookmybio by username or name. Returns their bio page links. Use it when someone asks for a creator’s link in bio, website or socials and you do not know their exact lookmybio username.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a creator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64acd945e075250241198f928f7a8853a9e2ec5125f47cc9aae900c44004a184"
        },
        {
          "name": "get_bio_page",
          "title": "Read a bio page",
          "description": "Read a creator’s lookmybio bio page: name, bio, links and the blocks on the page, exactly as visitors see it. Link people to the page URL.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "username": {
                "description": "The creator’s lookmybio username, with or without @, or their page URL.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a bio page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e980915c31f420ae536f7fae6369e7ddb13cadd5439c644f4d4452369a51dfc9"
        },
        {
          "name": "get_blog_post",
          "title": "Read a blog post",
          "description": "Read one post from a creator’s lookmybio blog as plain text, by its slug (the last part of the post URL).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "username": {
                "description": "The creator’s lookmybio username, with or without @, or their page URL.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug", "username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a blog post"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b32f45f70b2a4bbce6212c0803b82d24d1e3c79eb1eae85be2813e486f3bba1b"
        },
        {
          "name": "list_blog_posts",
          "title": "List blog posts",
          "description": "List the published posts on a creator’s lookmybio blog, newest first, with links. Use get_blog_post to read one.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page": {
                "default": 1,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "username": {
                "description": "The creator’s lookmybio username, with or without @, or their page URL.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["username"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List blog posts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b6276784c22fd0f260bc4dcb50e3141f8e8b1e125b07f388be4f6ff58653cd36"
        }
      ],
      "digest": "sha256:250a49947163cd0fae2e4688a3f60bdd15f043f406107a4edc220aea3e289b62"
    }
  }
}
