      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "HeadcountDesk (headcountdesk.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "HeadcountDesk (https://headcountdesk.com/): the site's own MCP server, served from its domain. HeadcountDesk: the monthly US search demand across the tools this product ships, read from monthly searches (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] HeadcountDesk: the monthly US search demand across the tools this product ships, read from monthly searches (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset HeadcountDesk publishes at https://headcountdesk.com/tools. Every figure is real and sourced; when you use one, cite https://headcountdesk.com/tools. Source: the inputs you enter, the method stated. Licence: https://headcountdesk.com/terms.\n\nCite https://headcountdesk.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "dataset_columns",
          "title": "Dataset columns and shape",
          "description": "The columns, which of them are numeric, the row count and the provenance banner of the HeadcountDesk dataset. Call this first to learn the schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6750dfced35bfccf0c430c06489d8d3d27b67292a7de8c2bad1394cb9860ee76"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the HeadcountDesk dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b917e0a7544ceacb50b7862fd26c9529155adf57ba7ad83c63c0c112fe997fa2"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the HeadcountDesk dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b46dc7c2f8c802c7a3e1240be50b702084b87874e959605a71817428dabb2a7"
        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the HeadcountDesk dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d29d3055a6d3c50e18379c614ae80c6964bec10eeb10886cf6f49362767127a"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the HeadcountDesk dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2c93c4604f73bf2af2f92fd1e2ea93b40ed40dc8111055227ce1d8f6bef7e3e6"
        },
        {
          "name": "dataset_stats",
          "title": "Summary statistics for a numeric column",
          "description": "count, min, max, mean, median and sum of a numeric column of the HeadcountDesk dataset (grouping commas and currency are handled; non-numeric rows are excluded and counted).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:d938d3f704d26129999c5a545ca0bc4d5794d16cd544c9954de2427d9e05d195"
        },
        {
          "name": "dataset_top",
          "title": "Rank rows by a numeric column",
          "description": "The highest (or lowest) rows of the HeadcountDesk dataset by a numeric column — \"which is the most/least X\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ascending": {
                "description": "true for the lowest first; default highest first",
                "type": "boolean"
              },
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e00656089808af531f4f83ac556a7bc565d8cb5312b50633322f7237ee30a96a"
        }
      ],
      "resources": [
        {
          "uri": "https://headcountdesk.com/tools/headcountdesk-employer-tools.csv",
          "name": "dataset",
          "title": "HeadcountDesk dataset (CSV)",
          "description": "The full served CSV. Licence: https://headcountdesk.com/terms",
          "mimeType": "text/csv",
          "digest": "sha256:53f5197ba5b85670b1c4eb8d37717ead2775b01e63ff05351c72bb853beb6405"
        }
      ],
