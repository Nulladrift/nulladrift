      },
      "instructions": "Energética: Argentine oil & gas, energy and macro data from official sources, rebuilt daily.\n\nHow to work:\n- Start with describe_data (tables, periods, tool per table, warnings, last complete month). Prefer curated tools; execute_sql for the rest.\n- Entity filters take exact names; close ones are resolved (see notes), ambiguous ones fail with candidates. Join several with \"|\". resolve_entity finds names.\n- Names and values are in Spanish (NEUQUINA, formacion lowercase: 'vaca muerta').\n- Results: CSV plus structuredContent. max_rows (any tool): rows to return (default 200, capped by tier); meta.truncated = rows cut; meta.sql adapts to execute_sql; meta.definitions = rules applied.\n- In SQL, totals without wells: agg_produccion_mensual (1M rows), not produccion_mensual (18M).\n\nDomain rules:\n- produccion_mensual: one row per well and month; prod_petroleo_m3 (m³), prod_gas_miles_m3 (thousand m³). 1 m³ = 6.2898 bbl.\n- Producing well in a month: prod_petroleo_m3 > 0 or prod_gas_miles_m3 > 0. COUNT(DISTINCT idpozo) without that filter counts reporting wells, not producing ones.\n- Active well (by registry state, pozos.tipo_estado): Extracción Efectiva, En Inyección Efectiva, Otras Situación Activo.\n- IP30/IP90/IP180: production is monthly, so these are monthly proxies, not exact daily windows. For each well, its first months with prod_petroleo_m3 > 0: IP30 = oil of the first month / dias_activo; IP90 and IP180 = oil of the first 3 and 6 producing months / their dias_activo (m³/d; ×6.2898 for bbl/d). The well's formation, subtipo and tipo_pozo are those of that first month (shale oil: 'SHALE' and 'Petrolífero'). Precomputed in pozos_metricas.\n- GOR = prod_gas_miles_m3 × 1000 / prod_petroleo_m3 (m³/m³).\n- Water cut = 100 × water / (water + oil), as a ratio of sums over the group, not an average of wells.\n- BOE = oil m³ × 6.2898 + gas thousand m³ × 5.8858 (6,000 ft³ of gas = 1 BOE).\n- Year-on-year growth = BOE of the 12 months to the period end vs the previous 12 (entities under 1,000 BOE in the previous 12 are left out).\n- Last complete production month: the latest with ≥ 95 % of the reporting wells of the busiest of its 6 previous months. describe_data reports it; say it is an estimate.\n- reservas: Horizon: end of useful life. unidad mixes Mm3 (oil, thousand m³) and MMm3 (gas, million m³): never sum across units.\n- fracturas: empresa_informante = operator at the time of the job; pozos.empresa = current operator.\n- cammesa_generacion: Intraday power samples (MW) with gaps, not monthly energy. region 'Total SADI' is the system total: do not add regions.\n- balanza_comercial: periodo is an integer YYYYMM.",
