      "tools": [
        {
          "name": "calculate_output_params",
          "title": "Calculate lenticular print output parameters",
          "description": "Calculate technical print parameters for a specific lenticular print: print-ready pixel size, uncompressed file size, views per lens period with and without lens rotation, feasibility of a desired view count, and the recommended lens rotation angle. Use this tool when the user asks numerical print questions — how many pixels are needed, what resolution to use, how many views fit, or what rotation angle to use — providing print width and height plus printer DPI, lens LPI, or desired view count when known. The tool computes values from formulas rather than estimating. Scope: numerical print parameters only; it does not produce calibration charts or price quotes.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "heightIn": {
                "description": "Print height in inches",
                "maximum": 16,
                "minimum": 1,
                "type": "number"
              },
              "lpi": {
                "description": "Lenticular lens pitch in LPI, if known",
                "maximum": 160,
                "minimum": 20,
                "type": "number"
              },
              "resolution": {
                "default": 720,
                "description": "Printer resolution in DPI, default 720",
                "maximum": 2400,
                "minimum": 150,
                "type": "number"
              },
              "viewCount": {
                "description": "Desired number of view frames, if the user has one",
                "maximum": 1024,
                "minimum": 2,
                "type": "integer"
              },
              "widthIn": {
                "description": "Print width in inches",
                "maximum": 16,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["heightIn", "widthIn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:30d95117952502f57e3e2f206d74fc6aece77b33e0485c8d40f052c523a8f5c2"
        },
        {
          "name": "generate_pitch_test_chart",
          "title": "Generate a lenticular pitch test chart",
          "description": "Generate a printable LPI pitch-test chart to measure or calibrate the actual lens pitch of a lenticular sheet. Use this tool when the user has a nominal LPI and wants to verify the real value, calibrate a new lens sheet, or determine the correct lens pitch before interlacing. The chart contains an LPI sweep with alignment marks, intended to be printed at 100% scale and evaluated with the physical lens sheet. The tool outputs an image plus measurement instructions. Scope: physical lens calibration only; it does not compute print dimensions, view counts, or prices.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "heightIn": {
                "description": "Chart height in inches",
                "maximum": 12,
                "minimum": 1,
                "type": "number"
              },
              "lpi": {
                "default": 60,
                "description": "Target (nominal) lens LPI, the center of the sweep, default 60",
                "maximum": 160,
                "minimum": 20,
                "type": "number"
              },
              "resolution": {
                "default": 720,
                "description": "Printer resolution in DPI, default 720",
                "maximum": 1200,
                "minimum": 150,
                "type": "number"
              },
              "steps": {
                "default": 0.1,
                "description": "LPI step between adjacent blocks, default 0.1",
                "maximum": 2,
                "minimum": 0.05,
                "type": "number"
              },
              "widthIn": {
                "description": "Chart width in inches",
                "maximum": 12,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["heightIn", "widthIn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:957a32f528d1106f8dea590a3e4ca5573fff9fadc69eeafbc97ef77e44165591"
        },
        {
          "name": "get_print_quote",
          "title": "Get a 3D photo print price estimate",
          "description": "Estimate the price of a custom physical 3D2HOLO lenticular photo print when the user asks how much a print will cost. Use this tool when the user provides or asks about print dimensions and quantity. The quote includes the craft fee, lenticular grating/material fee, and shipping estimate, computed from current pricing rather than recalled from memory. Scope: physical print pricing only; the tool does not answer workflow, print-parameter, or calibration questions.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "Shipping destination country/region (optional). Shipments to foreign destinations outside mainland China, Hong Kong, Macau and Taiwan include a 100g packaging box weight in the shipping estimate; omit to estimate for a foreign destination.",
                "maxLength": 120,
                "type": "string"
              },
              "heightIn": {
                "description": "Print height in inches (0.1-11)",
                "maximum": 11,
                "minimum": 0.1,
                "type": "number"
              },
              "quantity": {
                "default": 1,
                "description": "Number of prints (1-2000); checkout caps it per size/destination by the PayPal $10k per-transaction limit",
                "maximum": 2000,
                "minimum": 1,
                "type": "integer"
              },
              "widthIn": {
                "description": "Print width in inches (0.1-16)",
                "maximum": 16,
                "minimum": 0.1,
                "type": "number"
              }
            },
            "required": ["heightIn", "widthIn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c75111f6f27bd5ccf2cde77f395081640ddee41207360903c7eecc934ae4a97e"
        },
        {
          "name": "get_product_info",
          "title": "Get 3D2HOLO product info and pricing",
          "description": "Get authoritative 3D2HOLO product information: supported workflows, input types, output formats, LPI range, resolution, and pricing. Use this tool when the user asks what 3D2HOLO supports or how much the service costs, instead of relying on remembered or assumed capabilities. Scope: general product and pricing overview; the tool does not compute specific print parameters, generate calibration charts, select workflows for a specific input, or quote a custom print.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6024afc10ec650f2439bdd901b10d0818ec538c5e8ef8920a25c13ea6ecf6ef2"
        },
        {
          "name": "get_workflow_guide",
          "title": "Choose the right 3D photo workflow",
          "description": "Recommend the right 3D2HOLO workflow when the user wants to turn existing visual content into a lenticular 3D photo and their source type is known: a single photo, multi-angle photos, a GLB/GLTF 3D model, a Sketchfab model, or AI-generated multi-view images. The tool returns the recommended workflow steps and where to start. Scope: workflow selection for a specific input type; the tool does not provide product overviews, print-parameter math, calibration charts, or price estimates.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "inputType": {
                "description": "What the user has",
                "enum": ["single_photo", "multi_angle_photos", "3d_model", "sketchfab_model", "ai_multi_view"],
                "type": "string"
              }
            },
            "required": ["inputType"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
