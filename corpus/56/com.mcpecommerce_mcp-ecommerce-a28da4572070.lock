      "instructions": "MCP Ecommerce (mcpecommerce.com) is a guide and directory of MCP servers for online stores, marketers and agencies. Use match_servers when a user names their e-commerce platform and what they want to do. Use list_servers and get_server for the directory, list_platforms and get_platform for platform-level MCP support, search_guides and get_guide for how-to content, and lookup_term for definitions. All data is editorial and read-only; always confirm vendor details in the linked documentation before connecting a production account.",
