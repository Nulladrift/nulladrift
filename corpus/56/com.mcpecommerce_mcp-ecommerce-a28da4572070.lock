        {
          "name": "match_servers",
          "title": "Match MCP servers to a store",
          "description": "The site's matchmaker. Given an e-commerce platform and optional goals, return the MCP servers that fit (official first, read-only first), with honest gaps where nothing exists yet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "goals": {
                "description": "What the user wants to do. Any of: store (Ask about my store data), ads (Analyze ad performance), analytics (Web analytics), email (Email, SMS and CRM), payments (Payments and finance), build (Build or customize the store), shoppers (Let AI shoppers find and buy), automate (Automate workflows), support (Customer support), seo (SEO and content), ship (Shipping and marketplaces). Omit to match every goal.",
                "items": {
                  "enum": ["store", "ads", "analytics", "email", "payments", "build", "shoppers", "automate", "support", "seo", "ship"],
                  "type": "string"
                },
                "type": "array"
              },
              "platform": {
                "description": "The store's platform: shopify, woocommerce, bigcommerce, magento-2, magento-1, prestashop, shopware, wix, squarespace or custom.",
                "enum": ["shopify", "woocommerce", "bigcommerce", "magento-2", "magento-1", "prestashop", "shopware", "wix", "squarespace", "custom"],
                "type": "string"
              }
            },
            "required": ["platform"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "gaps": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "goal": {
                      "type": "string"
                    },
                    "note": {
                      "type": "string"
                    }
                  },
                  "required": ["goal", "note"],
                  "type": "object"
                },
                "type": "array"
              },
              "goals": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "matches": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "access": {
                      "type": "string"
                    },
                    "caution": {
                      "type": "string"
                    },
                    "directoryUrl": {
                      "type": "string"
                    },
