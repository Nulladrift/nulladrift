        {
          "name": "list_servers",
          "title": "List MCP servers for e-commerce",
          "description": "Browse the directory of MCP servers relevant to online stores and agencies. Filter by category, access level, vendor-published only, or a free-text query. Returns summaries; use get_server for depth.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "access": {
                "description": "Limit to servers with this access level. Read-only is the safest starting point.",
                "enum": ["Read-only", "Read and write", "Varies by tool"],
                "type": "string"
              },
              "category": {
                "description": "Limit to one directory category, for example Advertising, Analytics, Email and CRM, Payments, Support and reviews, SEO or Agency operations.",
                "enum": ["Store platform", "Advertising", "Analytics", "Email and CRM", "Support and reviews", "Payments", "Shipping and inventory", "Marketplaces", "SEO", "Creative and content", "Automation", "Agency operations"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of servers to return, 1 to 60. Defaults to 60.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "official_only": {
                "description": "When true, return only servers published by the vendor itself and skip community projects.",
                "type": "boolean"
              },
              "query": {
                "description": "Free text matched against server name, vendor, summary and category, for example 'google ads' or 'helpdesk'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "count": {
                "type": "number"
              },
              "directoryUrl": {
                "type": "string"
              },
              "servers": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "access": {
                      "description": "Read-only, Read and write, or Varies by tool",
                      "type": "string"
                    },
                    "category": {
                      "type": "string"
                    },
                    "docsUrl": {
                      "type": "string"
                    },
                    "hosting": {
                      "type": "string"
                    },
                    "lastChecked": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "official": {
                      "description": "Published by the vendor itself",
                      "type": "boolean"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "status": {
                      "description": "GA, beta, preview, community or unverified",
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Directory page on mcpecommerce.com",
                      "type": "string"
                    },
                    "vendor": {
                      "type": "string"
                    }
                  },
                  "required": ["access", "category", "docsUrl", "hosting", "lastChecked", "name", "official", "slug", "status", "summary", "url", "vendor"],
                  "type": "object"
                },
                "type": "array"
