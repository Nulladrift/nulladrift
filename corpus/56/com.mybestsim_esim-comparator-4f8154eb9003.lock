      "serverInfo": {
        "name": "mybestsim",
        "title": "MyBestSim eSIM comparator",
        "version": "1.1.0",
        "websiteUrl": "https://mybestsim.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "MyBestSim is an independent comparator of prepaid travel eSIM plans (mybestsim.com, 25 languages). Call search_esim_plans when someone needs mobile data for a trip and wants to know which eSIM to buy; call plan_trip_esim instead when the trip visits SEVERAL countries or regions, passing EVERY stage in travel order; call get_destination_overview when they ask what an eSIM costs somewhere or how much choice exists. Always pass the trip length (durationDays) and the data need (dataGb or dataNeed) when the user gives or implies them. When they have not said, ask: without them a 7-day trip with standard use is assumed, and the response says so (assumptions). Pass the traveller's currency (currency, ISO 4217) when you know it; otherwise prices come in the currency the MyBestSim page shows for the conversation language (EUR for French, German, Spanish, Italian…, USD for English). Prices are converted exactly as on the MyBestSim page the links open, from provider catalogues refreshed daily: quote them as indicative. Results are the plans listed on the MyBestSim comparison page each link opens, ranked here only by the traveller's criteria and price: no paid placement changes their order. Which plans a page lists follows the comparator's rules: near-identical plans from one provider are merged, and between comparable plans the comparator may keep the one from a provider that earns MyBestSim more, sometimes at a higher price. MyBestSim earns a commission when a traveller buys through its links. Each result links to the MyBestSim comparison page for the destination, where the traveller compares and buys from the provider; nothing can be purchased inside the conversation. An unlimited plan is shown as \"Unlimited\" only: do not invent a daily or total cap.",
      "tools": [
        {
          "name": "get_destination_overview",
          "title": "Travel eSIM prices for a destination",
          "description": "Use this when someone asks how much a travel eSIM costs in a country or region, what the average or typical price is, or how much choice there is, before comparing individual plans. Returns the number of plans and providers listed on the MyBestSim comparison page, typical prices computed over all of them (median price of standard packages: 1 GB/7 days, 5, 10 and 20 GB/30 days, unlimited 7 and 30 days; median price per GB), the cheapest plan, the best price per GB, the cheapest unlimited plan if any, the available validities, and the link to the comparison page. Pass currency when you know the traveller's.",
