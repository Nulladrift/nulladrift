        {
          "name": "plan_trip_esim",
          "title": "Plan eSIMs for a multi-country trip",
          "description": "Use this when one trip visits SEVERAL countries or regions, e.g. \"Japan then China\", \"two weeks in France, Italy and Spain\", \"Thailand, Vietnam and Cambodia in March\". Pass EVERY stage in travel order, with the days spent in each when known (or totalDurationDays), and the data need. Compares, at the real total price, every way to cover the trip: (a) one eSIM for every stage (regional or worldwide plan; coverage is checked country by country against the MyBestSim catalogue, never guessed from a plan name), (b) one plan per stage, and combinations (a regional plan for some stages, other plans for the rest; several regional plans). A plan is only proposed for stages it covers, for their whole duration and data need. Recommends the cheapest total; prefers fewer eSIMs unless installing more saves at least $2 per extra eSIM, and says so. Gives the reason, the number of eSIMs, total price, data and validity, and links to the MyBestSim pages where the traveller buys. List the countries themselves as stages: a region stage (Europe, Asia…) only matches plans listed on that region page. Ask how long they stay and how much data they use when they have not said: without it a 7-day trip with standard use is assumed and reported in \"assumptions\". Prepaid travel eSIMs only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency to show prices in (ISO 4217, e.g. \"EUR\", \"GBP\", \"USD\"): pass the traveller's currency whenever you know it (their country, their words, prices they quoted). Default: the currency of the MyBestSim page in the conversation language (EUR for fr, de, es, it, nl, pt…; USD for en; GBP is never assumed). Prices are converted exactly as that page shows them.",
                "enum": ["USD", "EUR", "GBP", "CAD", "AUD", "JPY", "CNY", "KRW", "INR", "THB", "IDR", "MYR", "SGD", "PHP", "VND", "PKR", "BDT", "LKR", "AED", "SAR", "ILS", "TRY", "ZAR", "KES", "NGN", "EGP", "MAD", "BRL", "MXN", "COP", "CLP", "PEN", "NZD", "CHF", "SEK", "NOK", "DKK", "PLN", "CZK", "HUF", "RON", "BGN", "RUB"],
                "type": "string"
              },
              "dataGb": {
                "description": "Data for the WHOLE trip in GB, when the traveller gives a figure (spread over the stages by days). Unlimited plans always qualify.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "dataNeed": {
                "description": "Data appetite when no figure is given: light ≈ 0.3 GB/day, standard ≈ 0.7 GB/day, heavy ≈ 1.5 GB/day. Default standard. Ignored when dataGb is set.",
                "enum": ["light", "standard", "heavy"],
                "type": "string"
              },
              "features": {
                "description": "Features every proposed plan must include.",
                "items": {
                  "enum": ["fiveG", "hotspot", "calls", "sms"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "itinerary": {
                "description": "The stages of the trip in travel order (1 to 8). A stage is a country, a well-known city or one of the regions (Europe, Asia…).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "destination": {
                      "description": "Country, ISO 3166-1 alpha-2 code, well-known city or region of this stage, as the traveller named it. Never their home country.",
                      "maxLength": 80,
                      "minLength": 2,
                      "type": "string"
                    },
                    "durationDays": {
                      "description": "Days spent in this stage, when known.",
                      "maximum": 365,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["destination"],
                  "type": "object"
                },
                "maxItems": 8,
                "minItems": 1,
                "type": "array"
              },
              "language": {
