        {
          "name": "search_esim_plans",
          "title": "Compare travel eSIM plans",
          "description": "Use this when someone is choosing a travel eSIM or needs mobile data abroad for a given country or region, e.g. \"cheapest eSIM for Japan\", \"10 GB for two weeks in Europe\", \"unlimited data in the USA\". Returns a shortlist (up to 10, at most 2 per provider) from the MyBestSim comparator: data allowance, validity, price in the traveller's currency (pass currency; also USD and EUR), 5G/hotspot/calls/SMS, and the link to the full comparison page on mybestsim.com where the traveller buys from the provider. Pass durationDays and dataGb (or dataNeed) whenever the traveller mentions trip length or usage, and ask for them when unknown: without them a 7-day trip with standard use (0.7 GB/day) is assumed and reported in \"assumptions\"; with dataGb but no durationDays, plans valid for fewer than 7 days are excluded. For a trip through several countries or regions, call plan_trip_esim with every stage instead of searching each country. Prepaid travel eSIMs only: not home mobile contracts, physical SIM cards or a carrier's roaming pass.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "Currency to show prices in (ISO 4217, e.g. \"EUR\", \"GBP\", \"USD\"): pass the traveller's currency whenever you know it (their country, their words, prices they quoted). Default: the currency of the MyBestSim page in the conversation language (EUR for fr, de, es, it, nl, pt…; USD for en; GBP is never assumed). Prices are converted exactly as that page shows them.",
                "enum": ["USD", "EUR", "GBP", "CAD", "AUD", "JPY", "CNY", "KRW", "INR", "THB", "IDR", "MYR", "SGD", "PHP", "VND", "PKR", "BDT", "LKR", "AED", "SAR", "ILS", "TRY", "ZAR", "KES", "NGN", "EGP", "MAD", "BRL", "MXN", "COP", "CLP", "PEN", "NZD", "CHF", "SEK", "NOK", "DKK", "PLN", "CZK", "HUF", "RON", "BGN", "RUB"],
                "type": "string"
              },
              "dataGb": {
                "description": "Minimum data in GB, when the traveller gives a figure. Unlimited plans always qualify.",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "dataNeed": {
                "description": "Data appetite when no figure is given: light ≈ 0.3 GB/day (maps, messaging), standard ≈ 0.7 GB/day (social, some video), heavy ≈ 1.5 GB/day (streaming, hotspot). Multiplied by durationDays; without it a 7-day trip is assumed, and plans valid for fewer than 7 days are excluded. Ignored when dataGb is set.",
                "enum": ["light", "standard", "heavy"],
                "type": "string"
              },
              "destination": {
                "description": "Where the traveller is going, as they named it: a country in English or another common language (\"Japan\", \"Japon\"), an ISO 3166-1 alpha-2 code (\"JP\"), a well-known city (\"Tokyo\"), or one of the regions Europe, Asia, Africa, North America, South America, World, Balkans. Never the traveller's home country.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "durationDays": {
                "description": "Trip length in days: plans valid for fewer days are excluded. Default 7 (reported in assumptions).",
                "maximum": 365,
                "minimum": 1,
                "type": "integer"
              },
              "features": {
                "description": "Features every returned plan must include.",
                "items": {
                  "enum": ["fiveG", "hotspot", "calls", "sms"],
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
