            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:af7065a84809e22af8189da14a87d7da90cee9a051554523e6b96309a02897ac"
        },
        {
          "name": "estimate_portal_frame_steel",
          "title": "Estimate the steel of a portal frame building",
          "description": "Steel tonnage estimate for a single-span pitched portal frame building (span 15-30 m) before any design: total tonnes, kg per m2 of floor, a range, the weight by part (frames, gable posts, bracing, eave struts, purlins, side rails, plates and connections) and typical member sizes. Interpolated between complete finite-element designs and calibrated against published designs. Use for budgets, tenders and feasibility; a real design needs the actual loads and code.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bracing": {
                "description": "Optional: tube (default, tension and compression) or tension-only rods.",
                "enum": ["tube", "rod"],
                "type": "string"
              },
              "eave_height_m": {
                "description": "Eave height, m (5-11).",
                "maximum": 11,
                "minimum": 5,
                "type": "number"
              },
              "ground_snow_kN_m2": {
                "description": "Characteristic ground snow load sk, kN/m2 (0.5-2.0). Roof load = 0.8 sk.",
                "maximum": 2,
                "minimum": 0.5,
                "type": "number"
              },
              "length_m": {
                "description": "Building length, m. Frames are at 6 m.",
                "maximum": 300,
                "minimum": 12,
                "type": "number"
              },
              "span_m": {
                "description": "Clear span of the frames, m (15-30).",
                "maximum": 30,
                "minimum": 15,
                "type": "number"
              }
            },
            "required": ["eave_height_m", "ground_snow_kN_m2", "length_m", "span_m"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:849ff7e8a605d561e7ab5a2cc8fba7deda977abb0b8620c7ebacfe41bf9962be"
        },
        {
          "name": "estimate_steel_cost",
          "title": "Estimate the cost of a steel structure from its IFC model",
          "description": "Cost of fabricating and erecting a steel structure, worked out part by part from its IFC model: every part, hole, weld and lift is timed as a shop or site operation and priced at the region's employer labour cost, steel price and crane rate. Returns the cost floor (total, per tonne, per m2 of floor) with its breakdown, the published market band next to it and the gap, the process groups that drive the cost, the ten costliest parts with their IFC ids, a programme from shop drawings to erection in working days, upfront embodied carbon (modules A1-A5: steel production, fabrication, delivery, erection), and what an example design review (lighter sections, fewer plate fittings) would save in cost and carbon. Regions: UK, DE (Germany), US, AU, or own rates in any currency. Give the IFC as a public link (ifc_url, up to 30 MB) or as its text (ifc_text, up to 12 MB), or sample=true for a sample 18 x 30 m portal frame shed. It is the engine of Structomat's free Steel Cost Estimator page, which shows the same result with a 3D cost heat map when the same IFC is dropped on it. An estimate, not a quote. The IFC is read in memory and not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "carbon_route": {
                "description": "Steel route for embodied carbon: bof = blast furnace mix, eaf = electric arc (recycled). Default eaf for US, bof elsewhere.",
                "enum": ["bof", "eaf"],
                "type": "string"
              },
              "design_review": {
                "additionalProperties": false,
                "description": "Example design review: steel_saved_pct (default 10) and plate_fittings_removed_pct (default 25, smallest plates first).",
                "properties": {
                  "plate_fittings_removed_pct": {
                    "maximum": 80,
                    "minimum": 0,
                    "type": "number"
                  },
                  "steel_saved_pct": {
                    "maximum": 40,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "erection": {
                "description": "norms (default) = crew man-hours by section class; cycle = crane lift cycles per piece (reads low on single-storey sheds).",
                "enum": ["norms", "cycle"],
                "type": "string"
              },
              "erection_crew": {
                "description": "Erection crew size (default 5).",
                "maximum": 12,
                "minimum": 2,
                "type": "integer"
              },
              "floor_area_m2": {
                "description": "Gross floor area, m2. Default: the column grid found in the model.",
                "minimum": 1,
                "type": "number"
              },
              "ifc_text": {
                "description": "The IFC file content as text (STEP, starting with ISO-10303-21), up to 12 MB. Use instead of ifc_url.",
                "type": "string"
              },
              "ifc_url": {
                "description": "Public http(s) link to the IFC file (IFC2x3 or IFC4, up to 30 MB).",
                "type": "string"
              },
              "market_price_per_t": {
                "description": "region \"own\": the market price per tonne you see, to show the gap to the floor.",
                "minimum": 0,
                "type": "number"
              },
              "paint": {
                "description": "Shop blasting and painting (default true).",
                "type": "boolean"
              },
              "programme": {
                "additionalProperties": false,
                "description": "Programme inputs in working days: drawing_days (shop drawings + approval, default 10), lead_days (steel lead time, default 10), shop_crew (default 4).",
                "properties": {
                  "drawing_days": {
                    "maximum": 200,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "lead_days": {
                    "maximum": 200,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "shop_crew": {
                    "maximum": 200,
                    "minimum": 1,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "rates": {
                "additionalProperties": false,
                "description": "Optional overrides of the region's rates (required for region \"own\"): currency code, eur_rate = 1 EUR in that currency, shop_wage and site_wage = employer cost per hour worked (not a sell rate), steel_per_t, crane_per_day (with operator), overhead_pct, profit_pct.",
                "properties": {
                  "crane_per_day": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "currency": {
                    "type": "string"
                  },
                  "eur_rate": {
                    "minimum": 0.0001,
                    "type": "number"
                  },
                  "overhead_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "profit_pct": {
                    "maximum": 100,
                    "minimum": 0,
                    "type": "number"
                  },
                  "shop_wage": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "site_wage": {
                    "minimum": 0,
                    "type": "number"
                  },
                  "steel_per_t": {
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "region": {
                "description": "Labour, steel and crane rates and the market band: UK (GBP), DE (EUR), US (USD), AU (AUD), or own = your rates in \"rates\". Default UK.",
                "enum": ["UK", "DE", "US", "AU", "own"],
                "type": "string"
              },
              "sample": {
                "description": "true = use the sample building (18 x 30 m portal frame shed, 799 parts) instead of an IFC.",
                "type": "boolean"
              },
              "scrap_pct": {
                "description": "Material scrap, % (default 10).",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "shop": {
                "description": "mixed (default) = automated saw-drill line and plate cutting plus handling and marking; cnc = machine times only; manual = conventional shop.",
                "enum": ["mixed", "cnc", "manual"],
