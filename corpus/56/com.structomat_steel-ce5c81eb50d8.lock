        {
          "name": "check_connection",
          "title": "Check a standard steel connection (instant utilisation)",
          "description": "Instant utilisation (demand/capacity) of a standard steel connection under the given member-end forces, from capacities precomputed with finite-element connection analysis to AISC 360-16 LRFD (S275 steel, grade 8.8 bolts, C30/37 concrete). Returns the utilisation, the governing component (and the governing plate, weld or bolt group) and warnings. Call without \"template\" to list the templates and sizes. Forces are member-end forces at the analysis node, i.e. at the centreline of the supporting column or main beam (as a frame analysis gives them), not at its face; the capacities already include the offset. Only for a joint where no other member frames in: if anything else connects at the node, the result does not apply (ask for a connection design instead). For a first idea of a connection; a design for construction needs a checked calculation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "My_kNm": {
                "description": "Major-axis moment at the node, kNm (moment templates only). Positive = top flange of the beam in tension (hogging).",
                "type": "number"
              },
              "N_kN": {
                "description": "Member-end force at the node, kN: the force the loaded member applies to the connection, in member axes (x away from the node). Positive = tension (pulls away from the node).",
                "type": "number"
              },
              "Vy_kN": {
                "description": "Base plate only: horizontal shear along the column flanges, kN.",
                "type": "number"
              },
              "Vz_kN": {
                "description": "Beams: vertical shear the beam applies to the connection, kN, positive UPWARDS (gravity shear is negative). Base plate: horizontal shear along the column web.",
                "type": "number"
              },
              "members": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Section of each member by role, e.g. {\"column\": \"HEA300\", \"beam\": \"IPE330\"}.",
                "type": "object"
              },
              "other_members_at_node": {
                "description": "true if any other member (brace, second beam, etc.) connects at the same node.",
                "type": "boolean"
              },
              "template": {
                "description": "Connection template. Omit to list templates and sizes.",
                "enum": ["flush_end_plate_moment", "extended_end_plate_moment", "fin_plate_column_web", "beam_to_beam_end_plate", "pinned_base_plate"],
                "type": "string"
              }
            },
            "required": ["other_members_at_node"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f38b4fb079164d8d6a7a87eec2357a431eac9f5b6977d4c92bb2acb2d2b2d68e"
        },
