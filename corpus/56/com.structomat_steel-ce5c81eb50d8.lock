        {
          "name": "analyze_frame",
          "title": "Analyze a 3D steel frame (finite elements, returns the numbers)",
          "description": "Runs a 3D finite-element frame analysis and returns the numbers: equilibrium check, largest deflection along the members, largest joint displacement and sway in X and Y, every support reaction, the axial force, shears and moments of every member (the envelope with the governing combination when there are several), and natural periods with mass participation (modal analysis); linear or second order (P-Delta). The model is either a template (a pitched portal frame building, an open mono-pitch canopy, or a multi-storey frame, from a few dimensions, sections and loads) or a full model in JSON (nodes, members, sections, supports, loads, combinations). It is solved by the code of Structomat's free 3D frame analysis page, so the result also has a link that shows the same model and results in 3D (deflected shape, force diagrams, mode shapes). Use it to check a frame, compare sections or see how loads flow, and run it again with changed sections or loads. Elastic analysis only, not a code check: member buckling, connection design and code load combinations are not covered. The model is not stored.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "analysis": {
                "description": "Second order (default) or linear.",
                "enum": ["pdelta", "linear"],
                "type": "string"
              },
              "bases": {
                "description": "Column bases (default fixed).",
                "enum": ["fixed", "pinned"],
                "type": "string"
              },
              "bay_x_m": {
                "description": "storey: bay width in X, m.",
                "maximum": 15,
                "minimum": 2,
                "type": "number"
              },
              "bay_z_m": {
                "description": "storey: bay width in Y, m.",
                "maximum": 15,
                "minimum": 2,
                "type": "number"
              },
              "bays_x": {
                "description": "storey: bays in X.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "bays_z": {
                "description": "storey: bays in Y (the second horizontal direction; Z is vertical).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "beam_section": {
                "description": "Hot-rolled I-section for beams / rafters.",
                "enum": ["IPE 160", "IPE 180", "IPE 200", "IPE 220", "IPE 240", "IPE 270", "IPE 300", "IPE 330", "IPE 360", "IPE 400", "IPE 450", "IPE 500", "IPE 550", "IPE 600", "HEA 160", "HEA 180", "HEA 200", "HEA 220", "HEA 240", "HEA 260", "HEA 280", "HEA 300", "HEA 320", "HEA 340", "HEA 360", "HEA 400", "HEA 450", "HEA 500", "HEA 550", "HEA 600", "HEB 160", "HEB 180", "HEB 200", "HEB 220", "HEB 240", "HEB 260", "HEB 280", "HEB 300", "HEB 320", "HEB 340", "HEB 360", "HEB 400", "HEB 450", "HEB 500", "HEB 550", "HEB 600"],
                "type": "string"
              },
              "brace_section": {
                "description": "portal, mono: hollow section for the bracing (default CHS 139.7x5).",
                "enum": ["CHS 48.3x3.2", "CHS 60.3x3.2", "CHS 76.1x3.2", "CHS 88.9x3.2", "CHS 88.9x4", "CHS 114.3x4", "CHS 139.7x5", "CHS 168.3x5", "CHS 193.7x6.3", "CHS 219.1x6.3", "SHS 60x60x3", "SHS 70x70x3", "SHS 80x80x4", "SHS 100x100x4", "SHS 100x100x5", "SHS 120x120x5", "SHS 140x140x5", "SHS 150x150x6", "SHS 160x160x6", "SHS 200x200x8"],
                "type": "string"
              },
              "column_section": {
                "description": "Hot-rolled I-section for columns.",
                "enum": ["IPE 160", "IPE 180", "IPE 200", "IPE 220", "IPE 240", "IPE 270", "IPE 300", "IPE 330", "IPE 360", "IPE 400", "IPE 450", "IPE 500", "IPE 550", "IPE 600", "HEA 160", "HEA 180", "HEA 200", "HEA 220", "HEA 240", "HEA 260", "HEA 280", "HEA 300", "HEA 320", "HEA 340", "HEA 360", "HEA 400", "HEA 450", "HEA 500", "HEA 550", "HEA 600", "HEB 160", "HEB 180", "HEB 200", "HEB 220", "HEB 240", "HEB 260", "HEB 280", "HEB 300", "HEB 320", "HEB 340", "HEB 360", "HEB 400", "HEB 450", "HEB 500", "HEB 550", "HEB 600"],
                "type": "string"
              },
              "column_web": {
                "description": "Direction of the column webs: x (default) = strong axis resists sway in X, the frame direction; y = strong axis resists sway in Y.",
                "enum": ["x", "y"],
                "type": "string"
              },
              "combination_set": {
                "description": "single (default) = one combination with the factors given; en = a typical EN 1990 ultimate set (expression 6.10); asce = ASCE 7 LRFD basic combinations. en and asce are solved as an envelope.",
                "enum": ["single", "en", "asce"],
                "type": "string"
              },
              "dead_kN_m2": {
                "description": "Dead load on roof/floor, kN/m2 (self-weight of members is added).",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "eave_height_m": {
                "description": "portal: eave height, m.",
                "maximum": 20,
                "minimum": 2,
                "type": "number"
              },
              "factors": {
                "additionalProperties": false,
                "description": "Combination factors {\"G\":1.0,\"Q\":1.0,\"W\":1.0} (default all 1.0).",
                "properties": {
                  "G": {
                    "type": "number"
                  },
                  "Q": {
                    "type": "number"
                  },
                  "W": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "frame_spacing_m": {
                "description": "portal, mono: frame spacing, m.",
                "maximum": 15,
                "minimum": 2,
                "type": "number"
              },
              "frames": {
                "description": "portal, mono: number of frames.",
                "maximum": 30,
                "minimum": 2,
                "type": "integer"
              },
              "high_height_m": {
                "description": "mono: height of the high side, m.",
                "maximum": 15,
                "minimum": 2,
                "type": "number"
              },
              "leeward_kN_m2": {
                "description": "portal, storey: leeward suction, kN/m2 (not used for mono).",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "live_kN_m2": {
                "description": "Live or snow load, kN/m2.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "low_height_m": {
                "description": "mono: height of the low side, m.",
                "maximum": 15,
                "minimum": 2,
                "type": "number"
              },
              "modal": {
                "description": "Also run a modal analysis: natural periods, mode shapes and mass participation (default true).",
                "type": "boolean"
              },
              "modal_live_share": {
                "description": "Share of the live or snow load in the modal mass, psi (default 0.3); mass = self-weight + dead + psi x live.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "model": {
                "description": "Instead of a template: a full model, units kN and m, Z vertical. {\"up\":\"Z\", \"nodes\":{\"N1\":[x,y,z],...}, \"members\":[{\"id\":\"M1\",\"i\":\"N1\",\"j\":\"N2\",\"sec\":\"S1\",\"rot\":0,\"pinned\":false}], \"sections\":{\"S1\":{\"A\":m2,\"Iy\":m4 weak,\"Iz\":m4 strong,\"J\":m4}}, \"supports\":{\"N1\":\"fixed\"|\"pinned\"}, \"nodeLoads\":[{\"node\":\"N2\",\"case\":\"G\"|\"Q\"|\"W\",\"F\":[Fx,Fy,Fz]}], \"memberLoads\":[{\"member\":\"M1\",\"case\":\"G\",\"dir\":\"FX\"|\"FY\"|\"FZ\",\"w\":kN_per_m}], \"combos\":[{\"name\":\"ULS1\",\"factors\":{\"G\":1.35,\"Q\":1.5}}], \"selfWeight\":true, \"analysis\":\"pdelta\"|\"linear\", \"modal\":{\"modes\":12,\"G\":1,\"Q\":0.3}}. Load cases may have any name; several combinations are solved and shown with their envelope (a single \"combo\":{...} is still accepted). Gravity loads act in -FZ. A member load may vary from w to w2 between x1 and x2 (m from the i end). \"pinned\": true releases bending at both ends, \"i\" or \"j\" at one end. The modal mass may use any load case, e.g. {\"modes\":12,\"G\":1,\"S\":0.3}. A vertical member has its web (local axis 2) along X; \"rot\":90 turns it to Y. Without \"up\":\"Z\" the older format with Y vertical is read and converted. Steel E = 210 GPa.",
                "type": "object"
              },
              "ridge_rise_m": {
                "description": "portal: ridge rise above eave, m.",
                "maximum": 10,
                "minimum": 0,
                "type": "number"
              },
              "span_m": {
                "description": "portal (4-60) or mono (3-30): frame span, m.",
                "maximum": 60,
                "minimum": 3,
                "type": "number"
              },
              "storey_height_m": {
                "description": "storey: storey height, m.",
                "maximum": 8,
                "minimum": 2,
                "type": "number"
              },
              "storeys": {
                "description": "storey: number of storeys.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "template": {
                "description": "portal = pitched portal frame building; mono = open mono-pitch canopy; storey = multi-storey frame. Omit when sending model.",
                "enum": ["portal", "mono", "storey"],
                "type": "string"
              },
              "wind_direction": {
                "description": "portal, storey: x (default) = wind on the long wall / the face at X = 0; y = wind on the gable / the face at Y = 0; xy = both together in the same combination (conservative).",
                "enum": ["x", "y", "xy"],
                "type": "string"
              },
              "wind_kN_m2": {
                "description": "portal, storey: wind pressure on the windward face (see wind_direction); mono: net wind pressure on the roof, positive upward (uplift); kN/m2.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
