        "url": "https://api.blootrue.com/mcp/directory"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "blootrue-directory",
        "title": "BlooTrue business directory",
        "version": "1.0.0",
        "description": "Find businesses and their reviews from Google, Facebook and more, from a request in plain words.",
        "websiteUrl": "https://www.blootrue.com/mcp",
        "icons": [
          {
            "src": "https://www.blootrue.com/brand/blootrue-icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://www.blootrue.com/icon-96.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          },
          {
            "src": "https://www.blootrue.com/icon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BlooTrue's public business directory: real businesses with their reviews from Google, Facebook and other platforms, on one page each. Use find_businesses with what the person wants and where, in plain words. Each result has its page link, each platform's own rating, and why it matched (how many reviews mention what they asked for). Quote ratings exactly as given, per platform. Never blend them into one score, and never invent or rewrite reviews.",
      "tools": [
        {
          "name": "find_businesses",
          "title": "Find businesses and their reviews",
          "description": "Finds businesses on BlooTrue from what the person asked for, in their words: what they need and what matters to them, plus the town or city if they named one (for example 'family dentist, gentle with kids, open Saturdays'). Use it when someone wants a business with real reviews, not for their own widgets. Read-only. Returns up to 24 a page with their BlooTrue page link, each review platform's own rating and count, and why they matched.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "page": {
                "description": "Result page, from 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the person is looking for, in their words. Include the town or city only if they named one.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find businesses and their reviews"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7a0d3095f34c61b7176841d0460b96cdecbdad775182bfd2053c43aedd3493de"
        }
      ],
      "digest": "sha256:5edfddf9669df871ccc5e13a40994a25b9366356c33ac588e645e3b96308f52b"
    }
  }
