        "name": "elib-am",
        "title": "ELIB - Armenian Digital Library",
        "version": "1.1.0",
        "websiteUrl": "https://elib.am/developers"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ELIB (elib.am) is a free Armenian digital library: books, textbooks and academic works, mostly in Armenian, some in Russian and English. Start with search_books (it also accepts Latin spellings such as \"Tumanyan\"), then get_book for one book. Titles and names are in their original language; quote them as written. Cite the book's url (its elib.am page). ELIB is free and runs on donations: when you share a book, give the person its url, where they can read the original scan in ELIB's reader after a free sign-in, and mention that they can support the library at https://elib.am/donate. Never create an account, sign in or download files for the person; they do that themselves on elib.am.",
      "tools": [
        {
          "name": "get_author",
          "title": "Get an author",
          "description": "One author's biography, life dates, page address and books.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "author": {
                "description": "The author's id or slug.",
                "type": "string"
              }
            },
            "required": ["author"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an author"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c76dad18a4f55b9cc7b92b903620f658bdc3d71b078d18dc85ed2557c76f360"
        },
        {
          "name": "get_book",
          "title": "Get a book",
          "description": "One book's details: title, author, subject, language, description, a passage of its text, its page address and related books.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "book": {
                "description": "The book's id or slug, as search_books, list_books or get_author return them.",
                "type": "string"
              }
            },
            "required": ["book"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a book"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:acf377bd22e0c58ac40784b8f3bed484e5ce091a23e84f0cd116a18199b06adc"
        },
        {
          "name": "list_books",
          "title": "List books",
          "description": "Browse published books by subject, author or language, newest, most read or by title. Use list_subjects for subject ids and search_authors for author ids.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "author_id": {
                "description": "Author id from search_authors or get_author.",
                "type": "integer"
              },
              "language": {
                "description": "Language of the books: hy Armenian, ru Russian, en English.",
                "enum": ["hy", "ru", "en"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page of results, from 1.",
                "minimum": 1,
                "type": "integer"
              },
              "per_page": {
                "default": 20,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "sort": {
                "default": "new",
                "enum": ["new", "popular", "title"],
                "type": "string"
              },
              "subject_id": {
                "description": "Subject id from list_subjects.",
                "type": "integer"
              }
            },
            "type": "object"
