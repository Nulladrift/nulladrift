              },
              "service": {
                "description": "Which service it is about, if any",
                "enum": ["analyzer", "agents", "local", "visibility", "upkeep", "diagnostic", "takeover", "stabilization", "discovery", "portal", "implementation", "managed"],
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
