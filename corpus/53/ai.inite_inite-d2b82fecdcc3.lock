        {
          "name": "inite_slots",
          "title": "Free call times",
          "description": "The call times INITE's calendar has free, as ISO instants, with the call length and the host's time zone. Pass one of them to inite_book_call as starts_at.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Slots per page, default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "offset": {
                "description": "The nextOffset of the previous answer",
                "minimum": 0,
                "type": "number"
              },
              "time_zone": {
                "description": "IANA zone to show the times in, e.g. America/Sao_Paulo",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "durationMin": {
