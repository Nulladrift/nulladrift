        {
          "name": "inite_contact",
          "title": "Write to the INITE team",
          "description": "Send a message to the INITE team for a named person; the reply goes to their email. For a question that needs a conversation, inite_book_call is faster.",
          "inputSchema": {
            "properties": {
              "company": {
