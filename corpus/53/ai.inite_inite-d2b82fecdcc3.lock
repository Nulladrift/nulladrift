      "instructions": "INITE (inite.ai) over MCP. The open tools answer without an account. What needs the person is on each product's signed-in door, which signs them in with OAuth when connected (passkey, email link or password at auth.inite.ai; a new person registers there): https://inite.ai/api/mcp/atlas-owners for a tool's owner, https://inite.ai/api/mcp/analyzer-me for their audits, https://inite.ai/api/mcp/portal-me for their account. When the person wants something this server does not do, inite_connect names the INITE server that does and how to add it; answers whose next step is elsewhere carry it in their next field.\nportal: what INITE sells and its prices in the reader's currency, free call slots, booking a call, writing to the team, guides.",
      "tools": [
        {
          "name": "inite_book_call",
          "title": "Book a call with INITE",
          "description": "Book a call with the INITE team for a named person, with their consent and their own email. starts_at must be a slot from inite_slots; topic is a service id from inite_services (default: diagnostic). They get a calendar invite; the answer's booking_key moves (inite_move_call) or cancels (inite_cancel_call) it. Terms: free, no deposit, no fee to cancel or for a no-show; move up to 3 times, cancel any time before it starts.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Their company or site, if they gave one",
                "type": "string"
              },
              "email": {
                "description": "The person's own email; the confirmation and the calendar invite go there",
                "type": "string"
              },
              "lang": {
                "description": "The reader's language; sets the currency (pt quotes reais) and the copy. Default en.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              },
              "message": {
                "description": "What they want to talk about",
                "type": "string"
              },
              "name": {
                "description": "The person's name, as they want to be addressed",
                "type": "string"
              },
              "starts_at": {
                "description": "An ISO instant from inite_slots",
                "type": "string"
              },
              "time_zone": {
                "description": "IANA zone for the confirmation email",
                "type": "string"
              },
              "topic": {
                "description": "The service the call is about, an id from inite_services (default: diagnostic)",
                "enum": ["analyzer", "agents", "local", "visibility", "upkeep", "diagnostic", "takeover", "stabilization", "discovery", "portal", "implementation", "managed"],
                "type": "string"
              }
            },
            "required": ["email", "name", "starts_at"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "booked": {
                "type": "boolean"
              },
              "bookingKey": {
                "type": "string"
              },
              "startsAt": {
                "type": "string"
              }
            },
            "required": ["booked"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Book a call with INITE"
          },
