        {
          "name": "inite_services",
          "title": "What INITE sells, and for how much",
          "description": "INITE's services as a ladder, cheapest first: each step's id, name, price in the reader's currency and one line. `slug` gives one step in full, `full: true` all of them: what it delivers, how long it takes, the kind of price, the refund, and how it starts (a call with inite_book_call or a page to open).",
          "inputSchema": {
            "properties": {
              "full": {
                "description": "true: every step in full instead of the summary.",
                "type": "boolean"
              },
              "lang": {
                "description": "The reader's language; sets the currency (pt quotes reais) and the copy. Default en.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              },
              "slug": {
                "description": "One step in full, by the id the summary gives, e.g. \"local\".",
                "maxLength": 40,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "currency": {
                "type": "string"
              },
              "lang": {
                "type": "string"
              },
              "services": {
                "type": "array"
              },
              "summary": {
                "type": "boolean"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["services", "total"],
            "type": "object"
