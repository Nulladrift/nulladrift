              "lang": {
                "description": "The reader's language; sets the currency (pt quotes reais) and the copy. Default en.",
                "enum": ["en", "ru", "pt", "es"],
                "type": "string"
              },
              "message": {
                "description": "What they want to say or ask, in their words",
                "type": "string"
