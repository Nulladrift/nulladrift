      "prompts": [
        {
          "name": "check-package",
          "title": "Check a package's health",
          "description": "Check a package's health. For example: \"Is lodash 4.17.15 vulnerable?\"",
          "arguments": [
            {
              "name": "name",
              "description": "Public package name, such as \"lodash\", \"@types/node\" or \"requests\" The tool needs it.",
              "required": false
            },
            {
