{
  "lockfileVersion": 2,
  "subjects": {
    "app.openkrill/packages": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://packages.openkrill.app/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "packages",
        "title": "Package Health Check: Vulnerabilities and upkeep",
        "version": "1.1.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Package Health Check: Vulnerabilities and upkeep. Use check_package for one npm or PyPI package: pass the exact name, ecosystem (npm unless the user says Python or PyPI) and the version when the user gave one; without a version the latest is checked. Use check_package_json when the user pastes a package.json. Pass only the package.json text and never ask for source code, tokens or private package names. Quote the version that was checked. A severity of null means the advisory publishes no rating. Maintenance is release recency only, so say that a stable package with few releases can still be fine. When a package is deprecated or stale, suggest alternatives from the deprecation notice or your own knowledge, say that they are suggestions, and call check_package on each before recommending it. Ranges in a package.json are checked at their lowest version; say so. Use check_repo_health when the user asks whether the project behind a package is maintained, abandoned or trustworthy: pass the package name, or repo for a GitHub owner/repo. Report the verdict with its reasons, the last commit date and the Scorecard score and date, and say that a quiet repository can be finished rather than abandoned. This server allows 60 tool calls a minute per network and 5,000 a day for all callers together; the day count resets at 00:00 UTC. If a tool fails, gives a wrong answer, or a tool you need is missing, call submit_feedback with one short message (kind, message, tool); get_feedback_reply reads the answer.",
      "tools": [
        {
          "name": "check_package",
          "title": "Check a package's health",
          "description": "Use this when the user asks whether an npm or PyPI package is vulnerable, maintained, deprecated or safe to use, or what license it has: \"is lodash 4.17.15 vulnerable?\", \"is this npm package maintained?\", \"what license is this package?\", \"safer alternative to request\". Pass the public package name, ecosystem (npm or pypi) and a version if the user gave one; otherwise the latest is checked. Returns the known vulnerabilities of that version with severity and fixed version, the license, any deprecation notice, last release date, releases in the last year, weekly downloads (npm) and dependents. It does not pick alternatives: for a deprecated or stale package, suggest candidates and check each one with this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "ecosystem": "npm",
                "name": "lodash",
                "version": "4.17.15"
              }
            ],
            "properties": {
              "ecosystem": {
                "description": "npm for JavaScript packages (the default), pypi for Python packages",
                "enum": ["npm", "pypi"],
                "type": "string"
              },
              "name": {
                "description": "Public package name, such as \"lodash\", \"@types/node\" or \"requests\"",
                "maxLength": 214,
                "minLength": 1,
                "pattern": "^(@[A-Za-z0-9._~-]+/)?[A-Za-z0-9._~-]+$",
                "type": "string"
              },
              "version": {
                "description": "Exact version, such as \"4.17.15\". Omit to check the latest.",
                "maxLength": 64,
                "minLength": 1,
                "pattern": "^[0-9A-Za-z][0-9A-Za-z.+!_-]*$",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "dependents": {
                "description": "Packages that depend on the latest version, directly or indirectly",
                "type": ["integer", "null"]
              },
              "deprecated": {
                "description": "Deprecation or withdrawal notice for the checked version",
                "type": ["string", "null"]
              },
              "ecosystem": {
                "enum": ["npm", "pypi"],
                "type": "string"
              },
              "lastReleasedOn": {
                "description": "Date of the most recent release, YYYY-MM-DD",
                "type": ["string", "null"]
              },
              "latestVersion": {
                "type": "string"
              },
              "licenses": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "maintenance": {
                "description": "Release recency: active within a year, slow within two, stale beyond; deprecated when the latest version is",
                "enum": ["active", "slow", "stale", "deprecated", null],
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "releasesLastYear": {
                "type": ["integer", "null"]
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "not_found", "version_not_found", "unavailable"],
                "type": "string"
              },
              "unavailable": {
                "description": "Parts of the answer that could not be read right now",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "version": {
                "description": "The version that was checked",
                "type": "string"
              },
              "vulnerabilities": {
                "description": "Known advisories (OSV) that affect the checked version, most severe first, at most 15",
                "items": {
                  "properties": {
                    "cve": {
                      "type": ["string", "null"]
                    },
                    "fixedIn": {
                      "description": "Lowest version above the one checked that fixes it",
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Advisory id, such as GHSA-... or PYSEC-...",
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["critical", "high", "moderate", "low", null],
                      "type": ["string", "null"]
                    },
                    "summary": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "severity"],
                  "type": "object"
                },
                "type": "array"
              },
              "vulnerabilityCount": {
                "type": ["integer", "null"]
              },
              "weeklyDownloads": {
                "description": "npm only",
                "type": ["integer", "null"]
              }
            },
            "required": ["as_of", "ecosystem", "name", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Check a package's health",
            "openai/toolInvocation/invoking": "Check a package's health..."
          },
          "digest": "sha256:039e86256b91ab3aecc6d02ad3e138632359f41add66623091e5dd91d8676ff5"
        },
        {
          "name": "check_package_json",
          "title": "Check package.json for vulnerabilities",
          "description": "Use this when the user asks to check their package.json, or the dependencies of a project, for known vulnerabilities: \"check my package.json for known vulnerabilities\". Pass the text of the package.json; only the names and versions in dependencies, devDependencies and optionalDependencies are read, nothing else in the file is used or kept, and nothing is stored. Do not ask for source code or tokens. Checks up to 150 npm dependencies at the version each names (ranges at their lowest version) and returns the vulnerable ones, most severe first, with the fixed version. Dependencies without an exact version (tags, urls, workspaces) are listed as skipped.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "packageJson": "{\"name\":\"demo\",\"dependencies\":{\"lodash\":\"4.17.15\",\"left-pad\":\"^1.3.0\"},\"devDependencies\":{\"typescript\":\"~5.4.0\"}}"
              }
            ],
            "properties": {
              "packageJson": {
                "description": "The text of the user's package.json. Only its dependency names and versions are read.",
                "maxLength": 100000,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["packageJson"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "checked": {
                "description": "Dependencies looked up",
                "type": "integer"
              },
              "cleanCount": {
                "description": "Looked up with no known vulnerability",
                "type": "integer"
              },
              "message": {
                "type": "string"
              },
              "skipped": {
                "description": "Dependencies without an exact version, not looked up",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "spec": {
                      "type": "string"
                    }
                  },
                  "required": ["name", "spec"],
                  "type": "object"
                },
                "type": "array"
              },
              "skippedCount": {
                "type": "integer"
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "status": {
                "enum": ["ok", "invalid_input", "unavailable"],
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              },
              "vulnerablePackages": {
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "version": {
                      "description": "The version that was checked",
                      "type": "string"
                    },
                    "vulnerabilities": {
                      "description": "Most severe first, at most 5",
                      "items": {
                        "properties": {
                          "cve": {
                            "type": ["string", "null"]
                          },
                          "fixedIn": {
                            "description": "Lowest version above the one checked that fixes it",
                            "type": ["string", "null"]
                          },
                          "id": {
                            "description": "Advisory id, such as GHSA-... or PYSEC-...",
                            "type": "string"
                          },
                          "severity": {
                            "enum": ["critical", "high", "moderate", "low", null],
                            "type": ["string", "null"]
                          },
                          "summary": {
                            "type": ["string", "null"]
                          }
                        },
                        "required": ["id", "severity"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "vulnerabilityCount": {
                      "type": "integer"
                    }
                  },
                  "required": ["name", "version", "vulnerabilities", "vulnerabilityCount"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["as_of", "checked", "cleanCount", "skipped", "skippedCount", "source", "status", "truncated", "vulnerablePackages"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Check package.json for vulnerabilities",
            "openai/toolInvocation/invoking": "Check package.json for vulnerabilities..."
          },
          "digest": "sha256:8154821817bd8a667976b2fde63b966f4be03dd0f1e1cdf788ee9acd13c5a018"
        },
        {
          "name": "check_repo_health",
          "title": "Check a package's repository health",
          "description": "Use this when the user asks whether the project behind a package is maintained, abandoned or trustworthy: \"is the express repo still maintained?\", \"when was the last commit to left-pad?\", \"what is the OpenSSF Scorecard of requests?\". Pass the public package name and ecosystem (npm or pypi), or repo as a GitHub owner/repo. Returns the repository, the last commit date and days since, whether it is archived, stars, forks, open issues, the OpenSSF Scorecard score with its weakest checks, the npm maintainer count, and a verdict (healthy, watch, risky or unknown) with reasons. For known vulnerabilities of a version use check_package instead.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "ecosystem": "npm",
                "name": "express"
              }
            ],
            "properties": {
              "ecosystem": {
                "description": "npm (the default) or pypi; used with name",
                "enum": ["npm", "pypi"],
                "type": "string"
              },
              "name": {
                "description": "Public package name, such as \"express\" or \"requests\". Its latest release names the repository.",
                "maxLength": 214,
                "minLength": 1,
                "pattern": "^(@[A-Za-z0-9._~-]+/)?[A-Za-z0-9._~-]+$",
                "type": "string"
              },
              "repo": {
                "description": "A GitHub repository instead of a package: \"owner/repo\" or its github.com url",
                "maxLength": 200,
                "minLength": 3,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "archived": {
                "type": ["boolean", "null"]
              },
              "as_of": {
                "description": "ISO 8601 time the data was published by its source or fetched from it. A cached answer keeps the time of its fetch.",
                "type": "string"
              },
              "daysSinceLastCommit": {
                "type": ["integer", "null"]
              },
              "ecosystem": {
                "enum": ["npm", "pypi"],
                "type": "string"
              },
              "forks": {
                "type": ["integer", "null"]
              },
              "lastCommitOn": {
                "description": "Date of the newest commit on the default branch, YYYY-MM-DD",
                "type": ["string", "null"]
              },
              "license": {
                "type": ["string", "null"]
              },
              "message": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "npmMaintainers": {
                "description": "Accounts that may publish the package on npm",
                "type": ["integer", "null"]
              },
              "openIssues": {
                "type": ["integer", "null"]
              },
              "reasons": {
                "description": "Why, worst first",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "repository": {
                "type": "string"
              },
              "scorecard": {
                "properties": {
                  "date": {
                    "type": ["string", "null"]
                  },
                  "maintained": {
                    "description": "The Maintained check's finding: commits and issue activity in the last 90 days",
                    "type": ["string", "null"]
                  },
                  "score": {
                    "description": "OpenSSF Scorecard overall score, 0 to 10",
                    "type": "number"
                  },
                  "weakest": {
                    "description": "Up to 5 checks scoring below 5, lowest first",
                    "items": {
                      "properties": {
                        "check": {
                          "type": "string"
                        },
                        "reason": {
                          "type": "string"
                        },
                        "score": {
                          "type": "integer"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  }
                },
                "type": ["object", "null"]
              },
              "source": {
                "description": "Who the data comes from, to cite and to check it against.",
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "required": ["name", "url"],
                "type": "object"
              },
              "stars": {
                "type": ["integer", "null"]
              },
              "status": {
                "enum": ["ok", "invalid_input", "not_found", "no_repository", "unavailable"],
                "type": "string"
              },
              "unavailable": {
                "description": "Parts of the answer that could not be read right now",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "verdict": {
                "enum": ["healthy", "watch", "risky", "unknown"],
                "type": "string"
              },
              "version": {
                "description": "The latest release, whose metadata named the repository",
                "type": "string"
              }
            },
            "required": ["as_of", "notice", "source", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Done: Check a package's repository health",
            "openai/toolInvocation/invoking": "Check a package's repository health..."
          },
          "digest": "sha256:8930ab7a92e7256881eca9398e878331534067bcf32f116661549c4a133edbb0"
        },
