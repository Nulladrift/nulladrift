{
  "lockfileVersion": 2,
  "subjects": {
    "com.askedthrice/askedthrice": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.askedthrice.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "askedthrice",
        "version": "0.1.0",
        "description": "Measure whether a brand actually shows up when buyers ask AI assistants for a recommendation. Free, no signup.",
        "icons": [
          {
            "src": "data:image/svg+xml;base64,"
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_visibility_check",
          "title": "Get visibility check",
          "description": "Collect the result of a measurement started with start_visibility_check. Returns status running while the providers are still answering, so poll every 20 to 30 seconds. When ready it reports a verdict, how many of the buyer questions the brand won, which competitors were named instead, and which providers actually answered.",
          "inputSchema": {
            "properties": {
              "runId": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "description": "From start_visibility_check",
                "type": "string"
              }
            },
            "required": ["runId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get visibility check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0d4919a313823ba975b6d3e7daa9b380e80e6b97f59618d43b7adc8208de7d8f"
        },
        {
          "name": "start_visibility_check",
          "title": "Start visibility check",
          "description": "Closed: Asked Thrice no longer runs free measurements. Calling it returns status closed and the link to the paid scan at askedthrice.com, which needs an account. Measurements started before the change can still be read with get_visibility_check.",
          "inputSchema": {
            "properties": {
              "brand": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "description": "Brand name as customers write it",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "category": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "description": "What the business sells, in plain words",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "competitors": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "description": "Up to 5 real competitors, comma separated",
                "maxLength": 220,
                "type": "string"
              },
              "language": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "description": "Language the buyer questions are asked in",
                "enum": ["en", "es"],
                "type": "string"
              },
              "location": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "description": "Where the business competes, like 'Cordoba, Argentina'",
                "maxLength": 80,
                "type": "string"
              },
              "website": {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "description": "Domain, like yourbrand.com",
                "maxLength": 160,
                "type": "string"
              }
            },
            "required": ["brand", "category", "website"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Start visibility check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3ea084fe40a7ab34eae436f025e8f18c98c0aa682ce8604e8db1ad71aac16668"
        }
      ],
      "resources": [
        {
          "uri": "askedthrice://methodology",
          "name": "askedthrice-methodology",
          "title": "askedthrice methodology",
          "description": "How askedthrice measures brand visibility in AI answers",
          "mimeType": "text/plain",
          "digest": "sha256:567cb3f3944611ffe001b47cdd4dc1f23ec7dc2d2c097a4b099cc1364c91b350"
        }
      ],
      "digest": "sha256:9f93a79d04beb121c3d1cf3cce5d4706a43a6489f4e2984700f5790bdf41c860"
    }
  }
}
