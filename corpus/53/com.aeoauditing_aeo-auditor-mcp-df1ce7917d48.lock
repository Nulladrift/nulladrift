{
  "lockfileVersion": 2,
  "subjects": {
    "com.aeoauditing/aeo-auditor-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.aeoauditing.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aeo-auditor-mcp",
        "title": "AEO Auditor — AI Search & Agent Readiness Engine",
        "version": "2.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "audit_domain",
          "description": "Execute a live real-time Answer Engine Optimization (AEO), Generative Engine Optimization (GEO), JSON-LD Schema AST, and AI Agent Readiness (/llms.txt & /.well-known) diagnostic audit on any domain or URL, returning a Markdown scorecard, detected technical issues, and free copy-paste baseline fixes.",
          "inputSchema": {
            "properties": {
              "url": {
                "description": "Target domain or full URL to audit (e.g. \"stripe.com\" or \"https://stripe.com\").",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:30c20476feea3ef55982427160ac2c9d9f0b36b47bc2f4be26376d3d94fa34d5"
        },
        {
          "name": "create_fix_kit_checkout",
          "description": "Create an instant Stripe Checkout link to unlock the 24-Hour Single-Domain Deep AI Remediation Kit ($2 one-time), Pro 5-Domain Watchdog ($5/mo), or Agency 30-Domain Suite ($15/mo).",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Target website domain to unlock the AI Fix Kit for (e.g. \"yourcompany.com\").",
                "type": "string"
              },
              "tier": {
                "description": "Plan tier to purchase: \"single\" ($2 One-Time 24h Fix Kit), \"pro\" ($5/mo 5 Domains), or \"agency\" ($15/mo 30 Client Domains).",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:59c838f5e1a0298c53006730843e526d7d3b2d6ef807803bc6515f6dad31d05f"
        },
        {
          "name": "generate_remediation_kit",
          "description": "Generate ready-to-deploy AI Search & AEO remediation files (compliant /robots.txt, Cloudflare WAF skip rule, /llms.txt manifest, and linked Organization + WebSite JSON-LD @graph) for any domain, plus a direct link to unlock the deep /llms-full.txt corpus.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Target domain name to generate remediation files for (e.g. \"yourcompany.com\").",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:524d3f64a26946610c1d7eff36e49c32dd797e05dd8a63dbd1e94d5a5ffd58e3"
        },
        {
          "name": "get_domain_benchmark",
          "description": "Look up a domain AEO readiness benchmark score and 4-pillar breakdown, or query the industry leaderboard directory across SaaS, AI, FinTech, DevTools, and E-Commerce.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Optional industry category filter when listing leaderboard benchmarks (e.g. \"ai\", \"fintech\", \"developer_tools\", \"saas\", \"ecommerce\").",
                "type": "string"
              },
              "domain": {
                "description": "Optional domain name to retrieve benchmark profile (e.g. \"openai.com\"). Omit to list top leaderboard domains.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:02a81c2692b6566dea9fa1d65e71a77ccbf9e51a4ac16e9cd89e9551ba95fc92"
        },
        {
          "name": "validate_robots_txt",
          "description": "Validate a robots.txt file or live domain robots.txt against 10 AI search crawlers (GPTBot, ChatGPT-User, OAI-SearchBot, PerplexityBot, ClaudeBot, Google-Extended, Applebot-Extended) and generate a 100/100 compliant configuration.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Optional domain to fetch live /robots.txt from (e.g. \"example.com\").",
                "type": "string"
              },
              "robotsTxtContent": {
                "description": "Optional raw robots.txt content string to validate directly.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:59d1151252a47705dec2a02503120a280dce272ea6e551481aa87258ac12e68e"
        }
      ],
      "digest": "sha256:47bd6fef8a391aae2387d6cf0bb54b52a41483c37a445795d037db104d6e1d72"
    }
  }
