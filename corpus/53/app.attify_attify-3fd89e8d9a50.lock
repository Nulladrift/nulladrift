          "digest": "sha256:4e1e46b0b9a00b12b02f81543f0e333d05bd2eace3be37ad2bac74e5fd9e6726"
        },
        {
          "name": "compare_my_agents",
          "title": "Compare my AI agents",
          "description": "Your company's AI agents of one job type side by side for a month: each one's audited share of claims with its 95% interval, cost per audited outcome and main failure mode, and the pooled rate of other contributing companies where it can be shown (anonymous, each company a cluster). Differences inside the intervals are not distinguishable. Side by side comes with the Business plan. Needs sign-in to Attify; reads only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "job_type": {
                "description": "e.g. \"support-resolution\". Omit when all your agents do one job.",
                "type": "string"
              },
              "month": {
                "description": "YYYY-MM; omit for the latest.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
