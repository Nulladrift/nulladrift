          "title": "Request mobile mechanic (free callback)",
          "description": "Book mobile mechanic in the Corpus Christi area for a real person who asked for it, with their consent. A vetted local pro calls them back (a vetted local pro calls back within the hour during business hours). Free to the homeowner. Returns a reference and what happens next. Check the ZIP with check_service_area first if unsure.",
