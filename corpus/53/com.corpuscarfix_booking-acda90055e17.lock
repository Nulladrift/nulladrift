      "instructions": "Corpus Car Fix is a free referral service for mobile mechanic in Corpus Christi, Texas (Corpus Christi, Portland, Robstown, Calallen, Flour Bluff, Padre Island). Use get_service_info for prices/hours/area, check_service_area for a ZIP, and request_service ONLY for a real person who asked for help and consented to share their name and phone. A local pro calls them back. Phone/text (361) 310-5739.",
