      "instructions": "Parse and normalize messy free-text postal addresses into structured fields (house_number, road, unit, city, postcode, country) via hosted libpostal. Use parse_address for structured fields and expand_address for dedup variants. Requires Authorization: Bearer <api_key>. Get a free key at https://parseaddr.com. Not USPS/PAF deliverability validation and not email parsing.",
      "tools": [
        {
          "name": "expand_address",
          "description": "Expand/normalize an address into canonical variants for deduplication\n        and record matching (e.g. \"100 main st\" vs \"100 Main Street\").\n        ",
          "inputSchema": {
            "properties": {
              "address": {
                "title": "Address",
                "type": "string"
              }
            },
            "required": ["address"],
            "title": "expand_addressArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea90d6e936d137aa8844b52a2ccfc69d5063153d7f6d103e744a4eba18ce265d"
        },
        {
          "name": "parse_address",
          "description": "Parse a messy free-text postal address into structured fields\n        (house_number, road, unit, city, postcode, country, ...). Powered by libpostal.\n\n        Use when a developer needs to standardise or parse postal addresses and does\n        not want to self-host libpostal (a 2-4GB-RAM box + a fiddly C build).\n        ",
          "inputSchema": {
            "properties": {
              "address": {
                "title": "Address",
                "type": "string"
              }
            },
            "required": ["address"],
            "title": "parse_addressArguments",
            "type": "object"
          },
