{
  "lockfileVersion": 2,
  "subjects": {
    "com.npilayer/npilayer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://npilayer.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "npilayer",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "NPILayer exposes U.S. healthcare provider data from the public CMS NPPES dataset: lookup_npi, search_providers, and providers_near. An NPI record identifies a provider or organization; it does not indicate licensure, credentialing, network participation, insurance acceptance, or that a provider is currently practicing at a listed location. For deeper integration (authentication, rate limits, full endpoint reference), see https://npilayer.com/docs/.",
      "tools": [
        {
          "name": "lookup_npi",
          "title": "Look up an NPI",
          "description": "Look up a single U.S. healthcare provider or organization by its 10-digit National Provider Identifier (NPI), from CMS NPPES data. An NPI record identifies a provider; it does not indicate licensure, credentialing, network participation, or current practice status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "npi": {
                "description": "A 10-digit National Provider Identifier, e.g. \"1932586781\".",
                "pattern": "^[0-9]{10}$",
                "type": "string"
              }
            },
            "required": ["npi"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "properties": {
                  "deactivation_date": {
                    "type": ["string", "null"]
                  },
                  "entity_type": {
                    "enum": ["individual", "organization"],
                    "type": "string"
                  },
                  "enumeration_date": {
                    "type": ["string", "null"]
                  },
                  "last_updated": {
                    "type": ["string", "null"]
                  },
                  "name": {
                    "description": "Set for individuals only.",
                    "type": ["object", "null"]
                  },
                  "npi": {
                    "type": "string"
                  },
                  "organization_name": {
                    "description": "Set for organizations only.",
                    "type": ["string", "null"]
                  },
                  "practice_address": {
                    "type": ["object", "null"]
                  },
                  "primary_taxonomy": {
                    "type": ["object", "null"]
                  },
                  "status": {
                    "enum": ["active", "deactivated"],
                    "type": "string"
                  }
                },
                "type": ["object", "null"]
              },
              "meta": {
                "properties": {
                  "source": {
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["data", "meta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b719b84d6ebe0d758cc79317ca51b580cd2c87cca3887994930d2073aa636d68"
        },
        {
          "name": "providers_near",
          "title": "Find providers near a location",
          "description": "Find U.S. healthcare providers within a radius of a ZIP code or coordinate, from CMS NPPES data. Provide either \"zip\", or both \"lat\" and \"lng\". Distance is measured from each provider's primary practice location to the ZIP centroid (not an exact street address), since NPILayer's geography is ZIP-based.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "entity_type": {
                "description": "Restrict to individual providers or organizations, e.g. to exclude group practices from \"find a cardiologist\" results.",
                "enum": ["individual", "organization"],
                "type": "string"
              },
              "lat": {
                "description": "Latitude, used with \"lng\" instead of \"zip\".",
                "type": "number"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude, used with \"lat\" instead of \"zip\".",
                "type": "number"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "radius": {
                "default": 25,
                "description": "Radius in miles.",
                "type": "number"
              },
              "specialty": {
                "description": "A plain-language specialty, e.g. \"cardiology\".",
                "type": "string"
              },
              "taxonomy": {
                "description": "An exact NUCC taxonomy code, e.g. \"207RC0000X\".",
                "type": "string"
              },
              "zip": {
                "description": "A 5-digit ZIP code to search around.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "items": {
                  "properties": {
                    "city": {
                      "type": ["string", "null"]
                    },
                    "distance_miles": {
                      "type": "number"
                    },
                    "entity_type": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "npi": {
                      "type": "string"
                    },
                    "specialty": {
                      "type": ["string", "null"]
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "properties": {
                  "center": {
                    "type": "object"
                  },
                  "count": {
                    "type": "integer"
                  },
                  "limit": {
                    "type": "integer"
                  },
                  "page": {
                    "type": "integer"
                  },
                  "radius_miles": {
                    "type": "number"
                  }
                },
                "type": "object"
              }
            },
            "required": ["data", "meta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6c21ed9fb72f2f898117950541dfabb2de21ef0a17745d07b0141efb4ab9eec"
        },
        {
          "name": "search_providers",
          "title": "Search providers",
          "description": "Search U.S. healthcare providers and organizations by name, location, or specialty, from CMS NPPES data. Provide at least one filter; an empty search returns an arbitrary page of providers rather than a meaningful result.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "type": "string"
              },
              "entity_type": {
                "enum": ["individual", "organization"],
                "type": "string"
              },
              "first_name": {
                "type": "string"
              },
              "last_name": {
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Matches first name, last name, or organization name.",
                "type": "string"
              },
              "organization": {
                "type": "string"
              },
              "page": {
                "default": 1,
                "minimum": 1,
                "type": "integer"
              },
              "specialty": {
                "description": "A plain-language specialty, e.g. \"cardiology\".",
                "type": "string"
              },
              "state": {
                "description": "Two-letter state code, e.g. \"MI\".",
                "type": "string"
              },
              "taxonomy": {
                "description": "An exact NUCC taxonomy code, e.g. \"207RC0000X\".",
                "type": "string"
              },
              "zip": {
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "data": {
                "items": {
                  "properties": {
                    "city": {
                      "type": ["string", "null"]
                    },
                    "entity_type": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "npi": {
                      "type": "string"
                    },
                    "specialty": {
                      "type": ["string", "null"]
                    },
                    "state": {
                      "type": ["string", "null"]
                    },
                    "status": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "meta": {
                "properties": {
                  "count": {
                    "type": "integer"
                  },
                  "has_more": {
                    "type": "boolean"
                  },
                  "limit": {
                    "type": "integer"
                  },
                  "page": {
                    "type": "integer"
                  }
                },
                "type": "object"
              }
            },
            "required": ["data", "meta"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b4edb374784ce862dd4c3974b9eaf26b6aa08aefbaaae8196ae2bc62096ab9c"
        }
      ],
      "digest": "sha256:74864494385edf13a72bae41f85f0abebc6413cc5e2e89fd08d8f177dd87ea0e"
    }
  }
}
