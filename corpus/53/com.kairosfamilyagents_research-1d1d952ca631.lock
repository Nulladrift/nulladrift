          "name": "kairos_contract_check",
          "title": "Contract check (Base)",
          "description": "Contract check on Base: bytecode size, Sourcify verification, proxy detection (EIP-1967 incl. beacon, legacy OpenZeppelin, EIP-1822, EIP-1167 clones) with the implementation's verification, EIP-7702 delegated EOAs, and a neutral analysis. Reports what was or was not detected; never claims code cannot change. Read-only. Free for MCP clients up to 3 reports per client per day; beyond the quota the response lists the paid access options (x402 on the HTTP route, or a prepaid credit key) instead of a report. Never pays or signs anything itself. AI-generated data and analysis; not financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Contract address on Base",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              },
              "credit_key": {
                "description": "Optional prepaid credit key for use beyond the free daily quota.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
