          },
          "digest": "sha256:4226c5fc1ab2b8d15c5a65a0139682f25f217c1aba7fcfba3903b3eec7aa442f"
        },
        {
          "name": "kairos_wallet_activity",
          "title": "Wallet balances and activity (Base)",
          "description": "Wallet balances and activity on Base: EOA, EIP-7702 delegated EOA or contract, ETH balance, nonce, proxy implementation (EIP-1967, legacy OpenZeppelin, EIP-1822, EIP-1167), balances of 10 major Base tokens and USDC/WETH transfers in and out over the last 24 h (counts, amounts, latest transfer; marked partial if part of the scan failed). On-chain data only. Optional chain: base (default) or base-sepolia. Read-only. Free for MCP clients up to 3 reports per client per day; beyond the quota the response lists the paid access options (x402 on the HTTP route, or a prepaid credit key) instead of a report. Never pays or signs anything itself. AI-generated data and analysis; not financial advice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
