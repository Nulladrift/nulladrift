{
  "lockfileVersion": 2,
  "subjects": {
    "com.aimeistro/music": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aimeistro.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "AImeistrO",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "create_music",
          "title": "Create Music",
          "description": "Submit a music production request to AImeistrO. Runs the autonomous Value Loop (bidding, MIDI generation, QC) and returns job status, selected providers, economics, provenance, and artifact reference.",
          "inputSchema": {
            "properties": {
              "bars": {
                "description": "Number of bars",
                "maximum": 32,
                "minimum": 1,
                "type": "integer"
              },
              "bpm": {
                "description": "Tempo in beats per minute",
                "maximum": 200,
                "minimum": 60,
                "type": "number"
              },
              "budget": {
                "description": "Budget in AMC",
                "maximum": 1000,
                "minimum": 1,
                "type": "number"
              },
              "key": {
                "description": "Musical key (e.g. 'A minor', 'C major')",
                "type": "string"
              },
              "style": {
                "description": "Musical style (e.g. 'House')",
                "type": "string"
              },
              "type": {
                "description": "Request type (currently only MUSIC_LOOP supported)",
                "enum": ["MUSIC_LOOP"],
                "type": "string"
              }
            },
            "required": ["bars", "bpm", "budget", "key", "style", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:28fb09427c1e657f30d728fc8ee14e9451b346eee534371189a64e8ce4153bd9"
        },
        {
          "name": "get_artifact",
          "title": "Get Artifact",
          "description": "Retrieve the raw MIDI artifact for a completed AImeistrO job. Returns base64-encoded MIDI data with metadata.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The AImeistrO job ID (e.g. AIM-JOB-000001)",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c702e443f826c2f1740d89159e227c87486af96ba1b550ffcef6a35efdcf17a2"
        },
        {
          "name": "get_job",
          "title": "Get Job",
          "description": "Retrieve the status and result of an AImeistrO job by its job ID.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "description": "The AImeistrO job ID (e.g. AIM-JOB-000001)",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f976055678dd28d2c4b1375c04f86f01cc90341d50ca436ecbd12276b3b15fb9"
        }
      ],
      "digest": "sha256:e1c9e2b3ddc2b6b47f02f808f3d20b31446c90d35e2f0f8fc4dda23e599b63a8"
    }
  }
}
