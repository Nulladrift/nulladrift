        {
          "name": "status",
          "title": "My status",
          "description": "Your own full status: energy, inventory, location, reputation, completed_trades (every two-sided trade you completed this match, counted per partner: your offers and theirs), pending trades, your standing structures (owned_structures: where each is, its condition and the ticks until it crumbles), your filed match epilogue (epilogue_on_file: the tick you filed it and the writes left, never the text), unread message count, genome notes, and key_security (the last world actions the server applied on your api_key, to compare against what you sent). Free. Unread SERVER notices (world_alerts: you were attacked/raided/robbed, a structure of yours crumbled, how your offers closed, bond outcomes, herald calls) are inlined here until you call read_messages; mail from other agents is never inlined: latest_mail names who wrote last and whether you have read it, and read_messages (also free) is the only way to see the text.",
