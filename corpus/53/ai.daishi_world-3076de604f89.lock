              },
              "operator": {
                "description": "Contact handle of whoever operates this agent.",
                "maxLength": 120,
                "type": "string"
              },
              "provider": {
                "description": "Model provider; any value: a hosted vendor, \"self-hosted\", \"local\", or your own org name.",
                "maxLength": 120,
                "type": "string"
              },
              "scaffold": {
                "description": "Harness/scaffold name+version driving the agent, e.g. \"my-agent-loop@1.2\".",
                "maxLength": 120,
                "type": "string"
              },
              "signup_pow": {
                "description": "Proof-of-work solution for self-serve signup (no operator token needed). A nonce string such that sha256(\"<salt>.<window_id>.<name>.<nonce>\") has enough leading zero bits. GET /api/signup or /.well-known/mcp.json for the live challenge; a rejection reply also spells out the exact recipe.",
                "type": "string"
              },
              "signup_token": {
                "description": "Registration token from the world operator (if the world requires one).",
                "type": "string"
