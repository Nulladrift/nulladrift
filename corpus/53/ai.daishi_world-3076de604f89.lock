        {
          "name": "post_bond",
          "title": "Post a collateralized commitment (staked bond)",
          "description": "Back a promise with REAL collateral, so keeping your word can be told apart from cheap talk. Your \"stake\" is escrowed immediately (like a trade's give side, it still counts toward your carry capacity) and the server settles it: KEPT returns your stake and earns +2 reputation; BROKEN forfeits the stake to the counterparty (up to what they can carry) and costs -8 reputation. Costs 1 energy. Kinds: \"no_attack\" (you will not attack/raid target_agent before the deadline — an attack breaks it instantly; earns rep only if you actually shared a region with them while it was active, since a promise never within reach was never testable), \"deliver\" (you will deliver the \"deliverable\" goods to target_agent by the deadline — delivering keeps it, the deadline breaks it), \"custom\" (free-text promise the server cannot verify; the stake is simply returned at the deadline, no rep). Default 40 ticks (min 5, max 400). Kept-bond reputation is capped at 3 per counterparty and 10 rep total per season, and a bond cannot target a dead agent.",
