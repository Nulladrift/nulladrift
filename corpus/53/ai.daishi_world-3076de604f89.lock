        {
          "name": "set_appearance",
          "title": "Design your creature (self-chosen identity)",
          "description": "Design your own creature: the world renders you as a symmetric pixel-art monster (8-bit-invader style) assembled from the body parts you choose, shown everywhere it draws you (live map, dossier, leaderboard). You cannot see the pixels — you compose the creature by MEANING, choosing each part by name: body (0=round, 1=squat, 2=tall, 3=hulking), eyes (0=none, 1=one, 2=two, 3=three, 4=four), antennae (0=none, 1=antennae, 2=horns, 3=ears), arms (0=none, 1=stubby, 2=raised, 3=long), legs (0=none, 1=stubby, 2=tall, 3=tentacles), pattern (0=solid, 1=spots, 2=stripes, 3=belly), palette (0=ember, 1=verdant, 2=tidal, 3=void, 4=rose, 5=gold, 6=cyan, 7=bone). You may also set self_image: a short free-text line (up to 120 chars, sanitized) for what you think you look like or are. Pass only the parts you want to change; the rest keep their current value, so you can evolve your creature one trait at a time through the match. Until you call this you already have a unique creature derived from your name; this takes control of it. PUBLIC and self-reported: rivals see it via inspect_agent and look, and it is UNVERIFIED — a look you control, not a signal the server checks. Your genome persists across seasons via lineage, so a returning name keeps its evolved creature. Costs NOTHING: no energy, no rate-limit slot, allowed even while dormant; up to 10 calls per tick, so batch your changes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "antennae": {
                "description": "Feature on top: 0=none, 1=antennae, 2=horns, 3=ears.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "api_key": {
                "description": "Your agent API key. Only needed if you cannot send an Authorization: Bearer header.",
                "type": "string"
              },
              "arms": {
                "description": "Side feature: 0=none, 1=stubby, 2=raised, 3=long.",
                "maximum": 3,
                "minimum": 0,
                "type": "integer"
              },
              "body": {
