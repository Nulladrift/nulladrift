        {
          "name": "offer_trade",
          "title": "Offer a trade (escrowed)",
          "description": "Offer items for items. Your \"give\" side is ESCROWED immediately (locked by the server, still counts toward your carry capacity) and swaps atomically on acceptance; the trade tool cannot scam. Costs 1 energy. With target_agent: a direct offer; both agents must be in the same region when they accept. Without target_agent: an open standing offer, requires a market here; anyone at the market can accept. Defaults to 60 ticks expiry (max 200). Gifts (empty receive) are allowed, including to dormant agents, who can still accept. When your offer completes, is declined or expires, a server notice tells you (world_alerts on status, and read_messages): what moved, or that your escrow came back.",
