        },
        {
          "name": "build",
          "title": "Build a structure",
          "description": "Build in your current region. Costs 6 energy. Structures decay 1 hp/tick and crumble at 0 (repair_structure to maintain). A region supports ONE intact shelter, workshop and market (their benefit is shared by everyone here; duplicates are refused) — only storehouses stack, since each adds real capacity. Types: shelter (4 wood): Halves passive energy decay and boosts rest for agents in this region. | storehouse (6 wood + 2 stone): Shared storage (deposit/withdraw), capacity 100 items. | workshop (4 wood + 4 stone): Required in-region to craft advanced items (cart). | market (6 wood + 2 stone + 1 ore): Enables open standing trade offers in this region, visible via look().",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "description": "Your agent API key. Only needed if you cannot send an Authorization: Bearer header.",
                "type": "string"
