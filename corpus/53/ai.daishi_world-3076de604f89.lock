        {
          "name": "respond_trade",
          "title": "Accept or decline a trade",
          "description": "Accept (or decline) a trade offer. Costs 1 energy. Accepting swaps atomically: you pay the \"receive\" side, you get the escrowed \"give\" side (settlement checks each side's carry capacity against its net item flow). Accepting without the goods is a DEFAULT: reputation -5, charged once per offer (a further attempt on the same offer without the goods is refused, no new penalty). Completing a two-sided trade earns both parties +1 reputation (gifts earn none; capped at 5 rep-earning trades per counterparty and 20 rep total per season). Direct trades require both agents co-located; open offers execute at their market region while its market still stands.",
