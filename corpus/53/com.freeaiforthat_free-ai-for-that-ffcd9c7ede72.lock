      "serverInfo": {
        "name": "free-ai-for-that",
        "title": "Free AI For That",
        "version": "1.0.0",
        "websiteUrl": "https://freeaiforthat.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Free AI For That (freeaiforthat.com) lists AI tools that have a free plan, free credits or a free trial of 7 days or more, and checks each free offer against the vendor's own pricing page, with the date of the last check. The tools answer four kinds of question: which free AI tools fit a job, whether a tool is free and what its free plan includes, which free alternatives exist for a paid tool, and how free plans compare. Every result includes a link to the tool's page, where the dated source and the full free-plan details are. Paid listings, adult tools and AI-detector-bypass tools are left out of these answers.",
      "tools": [
        {
          "name": "check_free_plan",
          "title": "Is this AI tool free?",
          "description": "Check whether a specific AI tool is free and exactly what its free plan includes: limits, catches, how to get it free, the cheapest paid plan and when it was last checked. Accepts a tool name ('ChatGPT', 'Midjourney') or website ('canva.com'). If the tool isn't free, says why and suggests free alternatives. Each tool comes with a link to its Free AI For That page, which has the dated source and the full free-plan details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tool": {
                "description": "The tool's name or website.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["tool"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is this AI tool free?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:9d17c6a15fc7336e1c4935f62cc8d4186413d5be0bdac70ff68ccda86f1a0471"
        },
        {
          "name": "compare_free_plans",
          "title": "Compare free plans",
          "description": "Compare the free plans of 2 to 4 AI tools side by side: what's free, limits, catches, how to start and checked dates, plus a link to a side-by-side table. Each tool comes with a link to its Free AI For That page, which has the dated source and the full free-plan details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "tools": {
                "description": "Tool names or websites to compare.",
                "items": {
                  "maxLength": 200,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
