              }
            ]
          },
          "digest": "sha256:6d471c8a05890827675719170c3a7983a99c2071f1edb84a7a4ab2095b8bf988"
        },
        {
          "name": "find_free_ai_tools",
          "title": "Find free AI tools",
          "description": "Find free AI tools for a task or need, e.g. 'remove image background', 'transcribe meetings', 'free alternative to Canva'. Returns tools ranked by how generous their free option is, with what's free, the limits, the catch, how to start and the date the free plan was last checked. Each tool comes with a link to its Free AI For That page, which has the dated source and the full free-plan details.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "How many tools to return (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "no_signup": {
                "description": "Only tools you can use without creating an account.",
                "type": "boolean"
              },
              "query": {
                "description": "The job, need or tool to find free options for, in plain words.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
