        },
        {
          "name": "find_free_alternatives",
          "title": "Free alternatives to a tool",
          "description": "List free alternatives to a paid or popular AI tool (e.g. 'Midjourney', 'Grammarly', 'Adobe Photoshop'), ranked by free value, with each one's free plan details and checked date. Each tool comes with a link to its Free AI For That page, which has the dated source and the full free-plan details.",
          "inputSchema": {
