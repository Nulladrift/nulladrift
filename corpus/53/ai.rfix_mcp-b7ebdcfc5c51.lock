      "instructions": "RFIX MCP server-side mode helps agents plan RF scenarios, search the RFIX block catalog, and export launchable `.rfix.gz` projects. It does NOT generate IQ data and does NOT talk to rfix-api or rfix_python.\n\nWORKFLOW (follow this order):\n1. Call `rfix_plan_scenario(description=...)` — returns block schemas, composition rules, constraints, and a reference ReactFlow/editor-project example.\n2. COMPOSE YOUR OWN GRAPH: Use the reference graph as inspiration, but adapt it to the user's request. Add/remove nodes, adjust parameters, and change edges.\n3. Call `rfix_export_rfix_project(payload=<your composed graph/project>)` — writes a `.rfix.gz` project and returns launch metadata for desktop and web.\nThat is the happy path for server-side launch flows. Do NOT search the filesystem for RFIX examples.\n\nACCEPTED EXPORT INPUT SHAPES:\n- GCF/LLM output: `{reactFlowNodes, reactFlowEdges, gridGlobalSettings}`\n- Exported graph: `{nodes, connections, globalSettings}`\n- Editor/.rfix-style project JSON\n- Backend payloads are also accepted and will be reverse-transformed.\n\nCRITICAL RULES:\n- Use only parameter IDs listed in block schemas; invented executable fields are rejected.\n- RFIX graph frequencies are IQ/baseband offsets relative to project/receiver center, not absolute RF carriers. Keep RF carrier metadata in labels/notes unless a schema exposes it.\n- Modifier/channel blocks MUST connect to an upstream signal source. Never create isolated modifiers.\n- Signals cannot connect directly to other signals — use modifiers between them.\n- All edge endpoints and any table block references MUST point at existing node IDs.\n- three_d_emitter and three_d_sensor MUST be connected through a 3D channel (three_d_channel_los/rayleigh/rician).\n- `rfix_export_rfix_project` returns `launch_grant`, `desktop_deeplink`, `web_launch_url`, `web_embed_url`, and `download_desktop_url`. Read and report those exact values.",
      "tools": [
        {
          "name": "rfix_export_rfix_project",
          "description": "Convert RFIX JSON input into an importable `.rfix.gz` project file. `payload` may be an RFIX backend payload, GCF prompt graph output, exported graph data, or editor/.rfix-style project JSON. Project-shaped input is preserved where possible; backend payload input is reverse-transformed into a legacy flat project. In server-side mode this also publishes launch URLs for desktop and web.",
          "inputSchema": {
            "properties": {
              "artifact_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Artifact Name"
              },
              "payload": {
                "additionalProperties": true,
                "title": "Payload",
                "type": "object"
              }
            },
            "required": ["payload"],
            "title": "rfix_export_rfix_projectArguments",
            "type": "object"
          },
