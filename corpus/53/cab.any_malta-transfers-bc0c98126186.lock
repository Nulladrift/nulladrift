      "serverInfo": {
        "name": "any-cab",
        "title": "any.cab — Malta transfers",
        "version": "3.0.0",
        "websiteUrl": "https://any.cab"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "any.cab books private car transfers anywhere in Malta (not Gozo or Comino yet: for Gozo, quote to the Ċirkewwa ferry terminal), run through a licensed Maltese transport operator selected by any.cab, whose network covers over 50 local transport suppliers including Uber and Bolt. Available 24/7. Prices are fixed per trip and calculated from road distance: base + km × per-km rate, minimum €20 per trip, in EUR.\nOn the day: At Malta Airport your driver meets you in the arrivals hall, holding a board with your name. The driver waits up to 30 minutes from the time your flight lands, at no extra cost, and follows your flight for delays, so make sure the flight number in your booking is correct. The driver's details and contact number are emailed to the traveller before pickup. Under Maltese law a child counts as a passenger, so include children in the number of passengers. A booster seat or baby seat can be arranged on request: ask us at info@any.cab before you book.\nTypical flow: search_locations for each address (the airport can simply be \"MLA\") → get_quote with from, to, pickup_at (Malta local time) and pax → tell the user the price of each vehicle. get_rates returns the per-km rate card if you only need an estimate.\nQuotes are valid for 15 minutes. Return trips: quote each direction separately.\nTo book: create_booking with the chosen quote_id and the passenger's details, then give the user the payment_url. The booking is confirmed only after payment; check with get_booking.\nFor travel businesses: Travel agents, DMCs, hotels and booking platforms can request a trade account with any.cab: trade rates so you can add your own markup, and booking on account for approved partners. Email info@any.cab with your company name, website and expected monthly transfers; everything is arranged by email.",
      "tools": [
        {
          "name": "create_booking",
          "title": "Book a quoted transfer",
          "description": "Book a quote for the passenger. Returns booking_id and a payment_url for the traveller; nothing is charged until they pay there, and the booking is confirmed only after payment. Retrying with the same idempotency_key returns the same booking.",
          "inputSchema": {
            "properties": {
              "flight_number": {
                "description": "For airport pickups, e.g. FR1234",
                "type": "string"
              },
              "idempotency_key": {
                "description": "8-100 characters; reuse it when retrying the same booking",
                "type": "string"
              },
              "notes": {
                "description": "For the driver, max 500 characters",
                "type": "string"
              },
              "passenger": {
                "properties": {
                  "email": {
                    "type": "string"
                  },
                  "first_name": {
                    "type": "string"
                  },
                  "last_name": {
                    "type": "string"
                  },
                  "phone": {
                    "description": "With country code, e.g. +35699123456",
                    "type": "string"
                  }
                },
                "required": ["email", "first_name", "last_name", "phone"],
                "type": "object"
              },
              "quote_id": {
                "description": "quote_id from get_quote, unchanged",
                "type": "string"
              }
            },
            "required": ["passenger", "quote_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:17e6697faf7dfe54e8e3a8317dded6db603933a6fc57bc840cdf1bcafcefcec9"
        },
        {
          "name": "get_booking",
          "title": "Booking status",
          "description": "Status of a booking: awaiting_payment, paid, confirmed (with confirmation_code) or expired.",
          "inputSchema": {
            "properties": {
              "booking_id": {
                "type": "string"
              }
            },
            "required": ["booking_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1c845e1779ebf6eab834b615b490167d1596a4d010d62169dd287d6524032778"
        },
        {
          "name": "get_quote",
          "title": "Price a transfer",
          "description": "Fixed price for a private transfer between two places in Malta, for every vehicle that fits the group. Returns one offer per vehicle with price, max_pax, luggage, a price breakdown and a quote_id valid for 15 minutes.",
          "inputSchema": {
            "properties": {
              "from": {
                "anyOf": [
                  {
                    "enum": ["MLA"],
                    "type": "string"
                  },
                  {
                    "properties": {
                      "address": {
                        "type": "string"
                      },
                      "lat": {
                        "type": "number"
                      },
                      "lng": {
                        "type": "number"
                      },
                      "name": {
                        "description": "Readable place name for the driver",
                        "type": "string"
                      },
                      "town": {
                        "type": "string"
                      }
                    },
                    "required": ["lat", "lng", "name"],
                    "type": "object"
                  }
                ],
                "description": "Either the string \"MLA\" (Malta International Airport) or a place object from search_locations, passed as is."
              },
              "pax": {
                "description": "Number of passengers, including children. Only vehicles that fit the whole group are quoted.",
                "maximum": 53,
                "minimum": 1,
                "type": "integer"
              },
              "pickup_at": {
                "description": "Pickup time, Malta local, e.g. \"2026-11-25T10:00\" (or ISO 8601 with offset). At least 48 hours ahead.",
                "type": "string"
              },
              "to": {
                "anyOf": [
                  {
                    "enum": ["MLA"],
                    "type": "string"
                  },
                  {
                    "properties": {
                      "address": {
                        "type": "string"
                      },
                      "lat": {
                        "type": "number"
                      },
                      "lng": {
                        "type": "number"
                      },
                      "name": {
                        "description": "Readable place name for the driver",
                        "type": "string"
                      },
                      "town": {
                        "type": "string"
                      }
                    },
                    "required": ["lat", "lng", "name"],
                    "type": "object"
                  }
                ],
                "description": "Either the string \"MLA\" (Malta International Airport) or a place object from search_locations, passed as is."
              }
            },
            "required": ["from", "pax", "pickup_at", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7b44f136cb138254a55be4f03328240eb7b88d6b46f8191ed7c09889c86664bd"
        },
        {
          "name": "get_rates",
          "title": "Rate card",
          "description": "Per-km rate card for each vehicle on a date (EUR): base_cost, per_km, max_pax and luggage. price = base_cost + driving distance in km × per_km, minimum €20.00 per trip. Indicative only: an exact, bookable price depends on the driving distance of the trip.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Trip date YYYY-MM-DD (Malta). Defaults to today.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0750962087874de9ea56b95a5f0d790e4d55b2b0050e31bb13552bfe22a14119"
        },
        {
          "name": "search_locations",
          "title": "Find a place in Malta",
          "description": "Search hotels, addresses, towns and landmarks in Malta (Gozo and Comino are not served yet). Returns places with name, address and coordinates, in the same format a quote accepts for its from and to.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "e.g. \"Hilton St Julians\", \"Valletta\", \"Cirkewwa ferry\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
