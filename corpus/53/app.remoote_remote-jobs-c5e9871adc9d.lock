            "$defs": {
              "EmploymentType": {
                "enum": ["full-time", "part-time", "contract", "temporary", "internship"],
                "title": "EmploymentType",
                "type": "string"
              },
              "SeniorityLevel": {
                "enum": ["entry", "junior", "middle", "senior", "staff", "principal", "lead", "vp", "director", "executive", "manager"],
                "title": "SeniorityLevel",
                "type": "string"
              }
            },
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "maxLength": 100,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Country"
              },
              "employment_type": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/EmploymentType"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Employment Type"
              },
              "exclude_skills": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Exclude Skills"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "location_tag": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Location Tag"
              },
              "query": {
                "anyOf": [
                  {
                    "maxLength": 200,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Broad full-text keyword search across the whole job posting (title, description, skills).",
                "title": "Query"
              },
              "region": {
                "anyOf": [
                  {
                    "maxLength": 80,
                    "type": "string"
