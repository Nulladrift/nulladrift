                    "items": {
                      "$ref": "#/$defs/SeniorityLevel"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Seniority"
              },
              "skills": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Skills"
              }
            },
            "title": "AgentSalaryStatsRequest",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a32f26df43ceb7283dc8a7b939aed563cf2b9d0f9dddce5d4c129ef84e8647be"
        },
        {
          "name": "get_top_jobs",
          "description": "Return a capped public list of currently popular Remoote remote jobs.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              }
