              "seniority": {
                "anyOf": [
                  {
                    "items": {
                      "$ref": "#/$defs/SeniorityLevel"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Seniority"
              },
              "skills": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 20,
