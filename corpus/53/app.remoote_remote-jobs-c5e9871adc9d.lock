      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "remoote-agents",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Use Remoote public tools to search active remote jobs and return canonical Remoote URLs. Public tools do not expose raw employer apply URLs.",
      "tools": [
        {
          "name": "create_alert",
          "description": "Create a daily or weekly Remoote job alert for the authenticated user. Requires the alerts:write scope.",
          "inputSchema": {
            "$defs": {
              "AgentAlertCriteria": {
                "properties": {
                  "country": {
                    "anyOf": [
                      {
                        "maxLength": 100,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Country"
                  },
                  "employment_type": {
                    "anyOf": [
                      {
                        "items": {
                          "$ref": "#/$defs/EmploymentType"
                        },
                        "maxItems": 10,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Employment Type"
                  },
                  "exclude_skills": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Exclude Skills"
                  },
                  "query": {
                    "anyOf": [
                      {
                        "maxLength": 200,
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Query"
                  },
                  "salary_required": {
                    "anyOf": [
                      {
                        "type": "boolean"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Salary Required"
                  },
                  "seniority": {
                    "anyOf": [
                      {
                        "items": {
                          "$ref": "#/$defs/SeniorityLevel"
                        },
                        "maxItems": 10,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Seniority"
                  },
                  "skills": {
                    "anyOf": [
                      {
                        "items": {
                          "type": "string"
                        },
                        "maxItems": 20,
                        "type": "array"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Skills"
                  }
                },
                "title": "AgentAlertCriteria",
                "type": "object"
              },
              "EmploymentType": {
                "enum": ["full-time", "part-time", "contract", "temporary", "internship"],
                "title": "EmploymentType",
                "type": "string"
              },
              "SeniorityLevel": {
                "enum": ["entry", "junior", "middle", "senior", "staff", "principal", "lead", "vp", "director", "executive", "manager"],
                "title": "SeniorityLevel",
                "type": "string"
              }
            },
            "properties": {
              "criteria": {
                "$ref": "#/$defs/AgentAlertCriteria"
              },
              "frequency": {
                "default": "daily",
                "enum": ["daily", "weekly"],
                "title": "Frequency",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "name": {
                "anyOf": [
                  {
                    "maxLength": 120,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Name"
              }
            },
            "required": ["criteria"],
            "title": "AgentCreateAlertRequest",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c3120c0fa8a4e99acf536a017425ecccf16517df7917ae7329f99ec68fc1f28c"
        },
        {
          "name": "create_apply_intent",
          "description": "Create a user-confirmed Remoote apply redirect for an authenticated agent token. Requires the apply:intent scope and never returns raw employer apply URLs.",
          "inputSchema": {
            "properties": {
              "job_id": {
                "exclusiveMinimum": 0,
                "title": "Job Id",
                "type": "integer"
              }
            },
            "required": ["job_id"],
            "title": "AgentApplyIntentRequest",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6ef0efec4e2fac46f341e970e33700385684db19b4079f6b066e48226bb1bb7c"
        },
        {
