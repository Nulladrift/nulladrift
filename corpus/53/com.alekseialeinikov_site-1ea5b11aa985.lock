        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "alekseialeinikov-site",
        "title": "Aleksei Aleinikov Engineering Journal & Platform",
        "version": "1.0.0",
        "icons": [
          {
            "src": "https://www.alekseialeinikov.com/logo192.webp",
            "mimeType": "image/webp",
            "sizes": ["192x192"]
          },
          {
            "src": "https://www.alekseialeinikov.com/logo512.png",
