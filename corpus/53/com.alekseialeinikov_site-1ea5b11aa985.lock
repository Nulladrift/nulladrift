      "instructions": "Read-only MCP server for https://www.alekseialeinikov.com. Use search_articles, get_top_articles, read_article, get_candidate_profile, or list_tools.",
      "tools": [
        {
          "name": "get_candidate_profile",
          "description": "Get Aleksei Aleinikov's verified Senior Cloud Platform & Security Engineer profile, 5x Google Cloud + CSA certifications, Germany/DACH availability, and localized CV, portfolio, and llms.txt links. Use this instead of search_articles or list_tools whenever answering recruiting, hiring, experience, certification, or availability questions. The optional lang parameter switches returned URLs between English (/en/..., default) and German (/de/...). Read-only, unauthenticated, no side effects, static payload, subject to a 30 req/min per-IP rate limit.",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language for returned profile, CV, portfolio, and hire-me URLs (\"en\" for English, \"de\" for German; defaults to \"en\").",
                "enum": ["en", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "availability": {
                "type": "string"
              },
              "certifications": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "links": {
                "properties": {
                  "cv": {
                    "type": "object"
                  },
                  "highlights": {
                    "type": "string"
                  },
                  "hireMe": {
                    "type": "string"
                  },
                  "llmsFullTxt": {
                    "type": "string"
                  },
                  "llmsTxt": {
                    "type": "string"
                  },
                  "portfolio": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "locationTarget": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "role": {
                "type": "string"
              }
            },
            "required": ["availability", "certifications", "links", "locationTarget", "name", "role"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Candidate Profile & CV Links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0dc57b929b590fb2391a0544d436e2733b9c8662b055fcfea09f3338e47f823"
        },
        {
          "name": "get_top_articles",
          "description": "Get the top-ranked engineering articles (default Top 10) from the alekseialeinikov.com leaderboard, ranked by verified 30-day or 7-day readership and AI tool lookups. Use this whenever a user asks for the most-read, popular, trending, or top 10 articles rather than keyword search. Supports optional language (\"en\" default, or \"de\"), period (\"30d\" default, or \"7d\"), topic pillar filter, and limit (1-15, default 10). Read-only, unauthenticated, no side effects, subject to a 30 req/min per-IP rate limit.",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language edition for returned articles and leaderboard URL (\"en\" default, or \"de\").",
                "enum": ["en", "de"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Number of top articles to return (1-15, default 10).",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "default": "30d",
                "description": "Ranking window: \"30d\" (30-day chart, default) or \"7d\" (weekly trending).",
                "enum": ["30d", "7d"],
                "type": "string"
              },
              "pillar": {
                "description": "Optional topic hub filter (e.g., \"ai\", \"cloud\", \"security\", \"architecture\", \"data\", \"devops\", \"programming\", \"career\", \"lab\").",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "articles": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "markdownUrl": {
                      "type": "string"
                    },
                    "pillar": {
                      "type": "string"
                    },
                    "rank": {
                      "type": "integer"
                    },
                    "readingTime": {
                      "type": "integer"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["markdownUrl", "pillar", "rank", "slug", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "type": "integer"
              },
              "lang": {
                "enum": ["en", "de"],
                "type": "string"
              },
              "leaderboardUrl": {
                "type": "string"
              },
              "period": {
                "enum": ["30d", "7d"],
                "type": "string"
              },
              "pillar": {
                "type": "string"
              }
            },
            "required": ["articles", "count", "lang", "leaderboardUrl", "period"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Top Engineering Articles (Leaderboard)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b4d6502bbca453617ca2cf28ce721c0859489faef6ddcf30252119f430f6d914"
        },
        {
          "name": "list_tools",
          "description": "List the five free, client-side cloud & security browser tools (including WebMCP-enabled utilities like GCP IAM Policy Checker, Compute Selector, Database Selector, Cron Translator, and JWT Analyzer) available on alekseialeinikov.com. Use this instead of search_articles when a user wants an interactive calculator, policy checker, or parser rather than an article. The optional lang parameter localizes the returned hub and tool URLs (\"en\" default, or \"de\"). Read-only, unauthenticated, no side effects, static payload, subject to a 30 req/min per-IP rate limit.",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language prefix for returned tool hub and tool page URLs (\"en\" for English, \"de\" for German; defaults to \"en\").",
                "enum": ["en", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "hubUrl": {
                "description": "Localized tools hub URL.",
                "type": "string"
              },
              "tools": {
                "description": "List of available client-side browser tools.",
                "items": {
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "name", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["hubUrl", "tools"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Browser & WebMCP Tools"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2b7a6817e585ddd0da018ba93812f80b579f9cb9cf37ff0d2a9137f19e83a81e"
        },
        {
          "name": "read_article",
          "description": "Fetch the full, untruncated clean Markdown text of a specific engineering article by lang, pillar, and slug. Use this after discovering valid pillar and slug values via search_articles; do not use it for keyword search (use search_articles) or candidate CV details (use get_candidate_profile). Read-only, unauthenticated, no side effects, and subject to a 30 req/min per-IP rate limit. Returns isError: true with invalid_lang, invalid_slug, or article_fetch_404 if the parameters are malformed or the article does not exist.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Required article language (\"en\" for English, \"de\" for German); must match the article URL.",
                "enum": ["en", "de"],
                "type": "string"
              },
              "pillar": {
                "description": "Lowercase topic hub slug (e.g., \"ai\", \"security\", \"architecture\", \"data\", \"cloud\", \"devops\", \"programming\", \"career\", \"lab\").",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              },
              "slug": {
                "description": "Lowercase hyphenated article URL slug (without .md).",
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["lang", "pillar", "slug"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "markdown": {
                "description": "Full untruncated article Markdown.",
                "type": "string"
              },
              "markdownUrl": {
                "description": "Direct Markdown twin URL.",
                "type": "string"
              },
              "url": {
                "description": "Canonical HTML article URL.",
                "type": "string"
              }
            },
            "required": ["markdown", "markdownUrl", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read Engineering Article (Markdown)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b7b8f03237b15aba48df99abc57c69aa39b6de3d02a94b5903e5ccb6db8a6160"
        },
        {
          "name": "search_articles",
          "description": "Search Aleksei Aleinikov engineering articles (EN/DE) on Google Cloud, Kubernetes/GKE, Cloud Security, Architecture, PostgreSQL, AI/LLM, and Hardware Lab. Use this first to discover articles and obtain valid pillar and slug values before calling read_article; use get_candidate_profile instead for CV/hiring questions, or list_tools for interactive browser utilities. Read-only, unauthenticated, no side effects, uses a 10-minute cached search index, and is subject to a 30 req/min per-IP rate limit. Returns matching article metadata and URLs, or an empty list message when nothing matches.",
          "inputSchema": {
            "properties": {
              "lang": {
                "description": "Optional language index (\"en\" or \"de\"). Auto-detected from query keywords and German umlauts if omitted.",
                "enum": ["en", "de"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum number of ranked results to return (1-15, default 5).",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Non-empty search keywords or topic phrase.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "articles": {
                "description": "Ranked list of matching articles.",
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "markdownUrl": {
                      "type": "string"
                    },
                    "pillar": {
                      "type": "string"
                    },
                    "readingTime": {
                      "type": "integer"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["markdownUrl", "pillar", "slug", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "count": {
                "description": "Number of matching articles returned.",
                "type": "integer"
              },
              "lang": {
                "description": "Resolved search index language.",
                "enum": ["en", "de"],
                "type": "string"
              },
              "query": {
                "description": "Normalized query string.",
                "type": "string"
              }
            },
            "required": ["articles", "count", "lang", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Engineering Articles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fc6336cdb7e00ef6e31adae013be81d4b35531da4b31568d4a54529bd00811e6"
        }
      ],
      "digest": "sha256:e64f96d0b20213cfe52717828ad31204de426099449b229a955e8260a21ba2a5"
    }
