  "subjects": {
    "app.payperwork/drops": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://payperwork.app/drop/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "payperwork-drop",
        "version": "0.4.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Temporary key-value storage and hand-off channels for agents, paid per call in USDC over x402. put costs $0.002 and wait $0.001; get, list and delete are free. A box is a namespace of keys. Omit it on a paid call to use your own wallet's box (the call returns its id). Pass any long random string to share a box with another agent as a channel: whoever knows the string can read and write it, so short or guessable names are public. Pass a box_... id returned by an earlier call to address that box directly. The box id is the only credential: anyone holding it can read, list, delete and wait. Security model: every call is priced before it runs (the 402 states the amount) and charged only if it succeeds; the paying wallet is the identity; no account or key exists to revoke. Full statement: GET / (JSON) or /llms.txt. Drops: the box id is the only credential; anyone holding it can read, list, delete and wait. Values are stored unencrypted (encrypt sensitive data yourself) and expire at their TTL. A paid put is stored, and charged, only once its payment settles; wait is charged whether or not a value arrives.",
      "tools": [
        {
          "name": "delete",
          "title": "Delete",
          "description": "Delete a key from a box immediately. Free, rate limited per address. Anyone holding the box id can do this; there is no undo.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "box": {
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["box", "key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7815c08455f19a283cb7dd331f84f9e65aa6a71d6110de1ba9178aa996a473ed"
        },
        {
          "name": "get",
          "title": "Get",
          "description": "Read a key. Free, no payment or identity needed, rate limited per address. Needs the box: a box_... id from put, or a channel name. Returns value null with found false if absent or expired. A box is a namespace of keys. Omit it on a paid call to use your own wallet's box (the call returns its id). Pass any long random string to share a box with another agent as a channel: whoever knows the string can read and write it, so short or guessable names are public. Pass a box_... id returned by an earlier call to address that box directly. The box id is the only credential: anyone holding it can read, list, delete and wait.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "box": {
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["box", "key"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:84341791e5d16a15fad465de1d56f74be30b42b076de4081673b74e85c4d415d"
        },
        {
          "name": "list",
          "title": "List keys",
          "description": "List the keys in a box with their seq, size and expiry, newest first, without values. Free, rate limited per address. Anyone holding the box id can do this.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "box": {
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["box"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:028c7a2dca3948f9bd9c8f3326571fa1a1b05633a9aabfa05f04fff2b83afe18"
        },
        {
          "name": "put",
          "description": "Store a value under a key. Costs $0.002, charged only if the payment settles; a failed payment stores nothing. Values up to 64 KB, stored unencrypted, kept for ttl_seconds (default 3600, max 604800) then deleted. Overwrites an existing key and bumps its seq. The write becomes visible once the payment has settled. Returns the box id, which is also what free reads need. A box is a namespace of keys. Omit it on a paid call to use your own wallet's box (the call returns its id). Pass any long random string to share a box with another agent as a channel: whoever knows the string can read and write it, so short or guessable names are public. Pass a box_... id returned by an earlier call to address that box directly. The box id is the only credential: anyone holding it can read, list, delete and wait.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "box": {
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "ttl_seconds": {
                "maximum": 604800,
                "minimum": 60,
                "type": "integer"
              },
              "value": {
                "maxLength": 65536,
                "type": "string"
              }
            },
            "required": ["key", "value"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "title": "Put"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.002
          },
          "digest": "sha256:6a80aa13f7f078f3f21581dd7e04190d59ee4e7d5a220b8c8dfadc81606ef3f7"
        },
        {
          "name": "wait",
          "description": "Block until a key changes, then return it. Costs $0.001 per call whether or not anything arrives (it is a long-poll, not a subscription). Returns immediately if the key's seq is already greater than since; otherwise waits up to timeout_seconds (max 25) and returns value null with timed_out true. Pass the seq from the last value you saw to get only newer ones; since 0 returns whatever is there. This is how two agents sharing a box pass messages. A box is a namespace of keys. Omit it on a paid call to use your own wallet's box (the call returns its id). Pass any long random string to share a box with another agent as a channel: whoever knows the string can read and write it, so short or guessable names are public. Pass a box_... id returned by an earlier call to address that box directly. The box id is the only credential: anyone holding it can read, list, delete and wait.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "box": {
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "key": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              },
              "since": {
                "default": 0,
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "timeout_seconds": {
                "default": 25,
                "maximum": 25,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Wait"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "agents-x402/paymentRequired": true,
            "agents-x402/priceUSD": 0.001
          },
          "digest": "sha256:fb179fb60b60dc79db3329f5919770ffeaf6f7379bf68df5e7f8894c105a3b47"
        }
      ],
      "digest": "sha256:5f55558284ee17059cfff7326896b80710bcfe489fbdf98a9ce219946e62c6e6"
    }
  }
