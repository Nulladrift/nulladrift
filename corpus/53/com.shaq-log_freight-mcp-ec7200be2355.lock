        {
          "name": "search_freight_rates",
          "description": "Search real-time ocean freight rates (FCL & LCL) between two ports. Returns available rates with price and validity. Port names support aliases (e.g. 'Shenzhen' matches all Shenzhen terminals, 'LA' matches 'Los Angeles'). Example: search_freight_rates(origin='Shenzhen', destination='Los Angeles', container_type='40HC')",
          "inputSchema": {
            "properties": {
              "container_type": {
                "default": "",
                "title": "Container Type",
                "type": "string"
              },
              "destination": {
                "title": "Destination",
                "type": "string"
              },
              "origin": {
                "title": "Origin",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "title": "search_freight_ratesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "search_freight_ratesOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Search Ocean Freight Rates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
