            "readOnly": true
          },
          "digest": "sha256:1ce1610677e54715e7fdd91f23d2fa6b2077d9c08301dd1a2a4222118dcda681"
        },
        {
          "name": "cheapest_route",
          "description": "Find the lowest-priced destination ports in a country from one origin, across all carriers. Returns ranked destinations with the cheapest currently-valid rate, carrier and validity. Use this when the customer asks where it is cheapest to ship within a country. Example: cheapest_route(origin='Shenzhen', country='Mexico')",
          "inputSchema": {
            "properties": {
              "container_type": {
                "default": "",
                "title": "Container Type",
                "type": "string"
              },
              "country": {
                "title": "Country",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "origin": {
                "title": "Origin",
                "type": "string"
              }
            },
            "required": ["country", "origin"],
            "title": "cheapest_routeArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "cheapest_routeOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Cheapest Route Finder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d26870468241a7f6d4ab02f30fe0a7fe0b4fec394dc39ac5e478894b63ab8a86"
        },
        {
          "name": "create_booking",
          "description": "Submit a shipping booking request (FCL or LCL). REQUIRES pin parameter (contact SHAQ at info@shaq-logistics.com to get your pin). REQUIRES 7 mandatory fields: contact_name, contact_phone, contact_email, supplier_name, supplier_phone, supplier_email, po_number. If any mandatory field is missing, the tool returns an error listing which fields are needed. All bookings are created with 'pending_review' status. Example: create_booking(pin='shaq2026', origin_port='Shenzhen', destination_port='Los Angeles', container_type='40HC', container_count=1, contact_name='John', contact_email='john@example.com', contact_phone='+1234567890', supplier_name='ABC Factory', supplier_phone='+8613800001111', supplier_email='sales@abcfactory.com', po_number='PO-2026-0001', product_name='Electronics')",
          "inputSchema": {
            "properties": {
              "contact_email": {
                "title": "Contact Email",
                "type": "string"
              },
              "contact_name": {
                "title": "Contact Name",
                "type": "string"
              },
              "contact_phone": {
                "title": "Contact Phone",
                "type": "string"
              },
              "container_count": {
                "default": 1,
                "title": "Container Count",
                "type": "integer"
              },
              "container_type": {
                "default": "40GP",
                "title": "Container Type",
                "type": "string"
              },
              "destination_port": {
                "title": "Destination Port",
                "type": "string"
              },
              "freight_rate_usd": {
                "default": 0,
                "title": "Freight Rate Usd",
                "type": "number"
              },
              "hs_code": {
                "default": "",
                "title": "Hs Code",
                "type": "string"
              },
              "origin_port": {
                "title": "Origin Port",
                "type": "string"
              },
              "pin": {
                "title": "Pin",
                "type": "string"
              },
              "po_number": {
                "title": "Po Number",
                "type": "string"
              },
              "product_name": {
                "default": "",
                "title": "Product Name",
                "type": "string"
              },
              "remark": {
                "default": "",
                "title": "Remark",
                "type": "string"
              },
              "service_type": {
                "default": "FCL",
                "title": "Service Type",
                "type": "string"
              },
              "supplier_email": {
                "title": "Supplier Email",
                "type": "string"
              },
              "supplier_name": {
                "title": "Supplier Name",
                "type": "string"
              },
              "supplier_phone": {
                "title": "Supplier Phone",
                "type": "string"
              },
              "weight_per_container": {
                "default": "",
                "title": "Weight Per Container",
                "type": "string"
              }
            },
            "required": ["contact_email", "contact_name", "contact_phone", "destination_port", "origin_port", "pin", "po_number", "supplier_email", "supplier_name", "supplier_phone"],
            "title": "create_bookingArguments",
            "type": "object"
