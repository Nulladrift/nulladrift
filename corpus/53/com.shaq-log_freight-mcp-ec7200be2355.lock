      },
      "instructions": "SHAQ Logistics freight platform. Use search_freight_rates to get real-time ocean freight quotes (FCL/LCL). Use create_booking to place a shipping order (requires pin - contact SHAQ to get it). Use track_booking to check order status. Use list_ports to find valid port names. Use get_freight_index for market rate trends. Use get_sailing_schedule for upcoming vessel departures. Use get_port_fees for local port charges. Use get_customs_info for import requirements. Use rate_trends to answer whether rates on a lane are rising or falling. Use cheapest_route to find the lowest-priced destination ports in a country. All rates are in USD unless specified. Port names support aliases (e.g. 'Shenzhen' matches 'Shekou').",
      "tools": [
        {
          "name": "analyst_chat",
          "description": "Ask SHAQ Freight Analyst a natural-language question about ocean freight rates, routes, trends, container types, surcharges, or Incoterms. The analyst retrieves real-time SHAQ data and answers in the same language as the question. Example: analyst_chat(question='Is the rate from Shenzhen to Manzanillo rising or falling for a 40HC?')",
          "inputSchema": {
            "properties": {
              "question": {
                "title": "Question",
                "type": "string"
              }
            },
            "required": ["question"],
            "title": "analyst_chatArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "analyst_chatOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Freight Analyst Chat"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
