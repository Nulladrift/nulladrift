        {
          "name": "rate_trends",
          "description": "Get freight rate trend for a lane: are prices rising or falling? Compares currently-valid carrier tariff windows with recently-expired windows, plus market indices (SCFI). Use this when the customer asks whether rates are going up or down, or about market direction. Example: rate_trends(origin='Busan', destination='Altamira', weeks=4)",
          "inputSchema": {
            "properties": {
              "container_type": {
                "default": "",
                "title": "Container Type",
                "type": "string"
              },
              "destination": {
                "title": "Destination",
                "type": "string"
              },
              "origin": {
                "title": "Origin",
                "type": "string"
              },
              "weeks": {
                "default": 4,
                "title": "Weeks",
                "type": "integer"
              }
            },
            "required": ["destination", "origin"],
            "title": "rate_trendsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "rate_trendsOutput",
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Freight Rate Trends"
