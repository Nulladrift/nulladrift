          "digest": "sha256:52ea6e6af90681a0e72df381b7c45a9431de6b68d0a23b02491bbcc86e600ebb"
        },
        {
          "name": "search_freight_rates_batch",
          "description": "Search ocean freight rates for MULTIPLE routes in one call. Accepts natural-language queries: 'Shenzhen to Los Angeles 40HC', '盐田到长滩小柜', 'Shanghai to Hamburg reefer'. Understands Chinese jargon: 小柜=20GP, 大柜=40GP, 高柜=40HQ, 冷藏/冻柜=reefer. Returns a compact per-route summary (rate count, container types, lowest rates). Max 10 queries per call.",
          "inputSchema": {
            "properties": {
              "queries": {
                "items": {
                  "type": "string"
                },
                "title": "Queries",
                "type": "array"
              }
            },
            "required": ["queries"],
