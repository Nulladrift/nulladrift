          "description": "Get upcoming vessel sailing schedules between two ports. Returns vessel name, voyage number, ETD, ETA, transit time, and frequency. Use this when customers ask 'when is the next ship' or 'how long does it take'. Example: get_sailing_schedule(origin='Shenzhen', destination='Los Angeles')",
