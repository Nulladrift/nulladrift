        {
          "name": "run_ai_visibility",
          "title": "Do AI assistants cite us when buyers ask?",
          "description": "Use when the user asks whether their brand or website shows up in AI answers, or who AI assistants cite instead. Asks ChatGPT, Claude, Gemini and Perplexity the buyer's question live with web search on, three times each on the everyday model and once on the flagship model, and returns per platform: in how many askings the domain was cited and at what positions, whether that held every time, and whether the flagship model agrees. Also how many platforms cite it and the domains cited most instead (not the answers themselves). A platform that cites nothing is reported as not measured. Every result carries a run id, a date and a citation line. Calling this tool returns a quote, not the result: what the run measures, its price and a payment_url. The run happens only when you POST to payment_url, and a run that fails its controls refuses there with nothing charged. Price: $1.47 per run over x402 (USDC on Base, no account needed), or $1.80 over MPP (a Stripe shared payment token). Fixed price per run, not per answer. Charged in full when at least 3 of 4 platforms are measured (a platform counts when at least 2 of its 3 askings answer with sources); otherwise it refuses and nothing is charged. So a charged run can rest on fewer than all 16 answers; the result reports exactly how many, per platform. For a cheaper read without the flagship-model check, use run_ai_visibility_quick; for who owns a category's answers rather than one domain, use run_answer_share. A real sample of this run, free: https://cultmath.com/agent/samples/ai-visibility.json",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain to look for, e.g. example.com. Its subdomains count.",
                "type": "string"
              },
              "question": {
                "description": "The question a buyer would ask an AI assistant. No personal data.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["domain", "question"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "available": {
                "description": "false when the run is switched off; then nothing can be charged.",
                "type": "boolean"
              },
              "error": {
                "description": "Why the inputs were refused, with the expected usage. Nothing is charged.",
                "type": "string"
              },
              "instructions": {
                "description": "How to pay over MPP and x402, and how to ask for publication.",
                "type": "object"
              },
              "limits": {
                "description": "What the run cannot tell you, stated before you pay."
              },
              "next_step": {
                "description": "What to tell the user before paying.",
                "type": "string"
              },
              "note": {
                "description": "Why the run is unavailable, when it is.",
                "type": "string"
              },
              "payment_url": {
                "description": "POST here to run and pay. Not a checkout page.",
                "type": "string"
              },
