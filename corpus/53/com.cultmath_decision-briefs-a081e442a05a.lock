          "description": "Use when the user asks whether supply of a product has really diversified, how exposed US imports are to one country, or who gained share after tariffs or reshoring. Returns, for two years, the top-three partners' share of US imports of the HS code, the largest single source, a concentration index, and the partners that gained and lost the most share, from US Census Bureau trade data. Refuses before you are charged if the partner rows do not add up to the world total. Every result carries a run id, a date and a citation line. Calling this tool returns a quote, not the result: what the run measures, its price and a payment_url. The run happens only when you POST to payment_url, and a run that fails its controls refuses there with nothing charged. Price: $0.05 per run over x402 (USDC on Base, no account needed), or $0.50 over MPP (a Stripe shared payment token); charged only when the run comes back sound. For the duty actually paid on that product, by country, use run_effective_duty.",
