          "description": "Use when the user asks which brands or websites AI assistants rely on for their category, who they are competing with in AI answers, or whether any source dominates. Asks ChatGPT, Claude, Gemini and Perplexity 2-3 buyer questions live, each twice, and returns the most-cited domains as counts of answers, whether the category is owned, led, contested or fragmented, whether the leaders hold from one asking to the next, and, if given, where your domain stands. Not the answers themselves. Every result carries a run id, a date and a citation line. Calling this tool returns a quote, not the result: what the run measures, its price and a payment_url. The run happens only when you POST to payment_url, and a run that fails its controls refuses there with nothing charged. Price: $2.20 per run over x402 (USDC on Base, no account needed), or $2.54 over MPP (a Stripe shared payment token). Fixed price per run, not per answer. Charged in full when at least half the answers cite sources and at least 3 of 4 platforms do; otherwise it refuses and nothing is charged. So a charged run can rest on as few as 12 of 24 answers (fewer with two questions); the result reports exactly how many (controls.measurement). For a cheaper single pass, use run_answer_share_quick; for whether one domain is cited, use run_ai_visibility. A real sample of this run, free: https://cultmath.com/agent/samples/answer-share.json",
