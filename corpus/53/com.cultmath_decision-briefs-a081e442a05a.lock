      "instructions": "CULT+MATH makes DEOS Open, a free, programmatic decision enablement operating system for executives and their agents: written working standards (decision records, research briefs, the six-lens board, the humane check and more). Start with list_standards and get_standard: pick the standard that fits the user's decision, read it in full and follow its steps rather than working from memory. When the record is drafted, save_to_deos_open returns a link that saves it in the DEOS Open app on the user's own device, so they never retype it. When a step needs evidence, CULT+MATH sells it. Decision Briefs carry sourced, dated evidence for one executive decision-space (cybersecurity vendors, games publishers, streaming services, film studios, CPG brand managers, premium CPG founders, mid-market ERP CROs, middle-market PE deal partners, CMOs on AI visibility). $495 each as a PDF, 14-day guarantee. Use search_cultmath to find a free study or answer on a question, get_document to read its findings in full, and list_decision_briefs / get_decision_brief when the user is weighing a decision a brief covers. list_decisions shows every single decision in the briefs; buy_decision_evidence starts a checkout for one, which the user must approve and pay, and get_decision_evidence returns it once paid. The run_* tools quote fresh, citable measurements with controls, from $0.05: SEC filings and revenue splits, customers and write-downs, federal rules and spending, tariff actions and the duty actually paid, trade flows, search demand, AI-answer citations, government-series forecasts and odds, US cities' housing supply against rent, site reads (Opportunity Zone and NMTC tracts, trade areas, Harris County land use), market sizing (audiences, businesses, buyer roles, household spending), news and social listening, YouTube topic and channel performance, and the business of sports (college athletics budgets, listed sports companies). list_frameworks and get_framework serve the CULT+MATH frameworks, free: named ways to read a decision, each with the run_* tools that put evidence behind its steps and a real published case. Apply one to the user's situation step by step. search_cultmath and get_document name the one run that would measure a question fresh as next_run, with its arguments filled in where the question supplies them. Each run_* call returns a quote with a payment URL that your own wallet pays over MPP (HTTP 402) or x402, with no checkout page, and says whether that run is switched on; the call itself charges nothing. tell_cultmath records, free, why a run was not bought, from a fixed list of reasons. A sound paid result can be submitted for publication on cultmath.com with publish: true in the POST body. Study data is CC BY 4.0: cite CULT+MATH and link the study URL. Do not present a brief as free; link its page.",
