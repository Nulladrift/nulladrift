              },
              "measure_id": {
                "description": "A PLACES measure id, e.g. \"DIABETES\", \"BPHIGH\", \"COPD\", \"CHD\", \"CASTHMA\", \"DEPRESSION\". Give this or condition.",
                "maxLength": 30,
                "minLength": 2,
