          "description": "Use when the user is pricing, sourcing or sizing a refund claim and needs the tariff actually paid on a product, not the headline rate: \"what duty are we really paying on chips from Malaysia?\", \"how much did the tariff on this product rise this year?\". Returns duty as a share of value for all countries, the five largest sources and any countries you name, in two months, with the highest-paying source over $1M, with the change in points, from US Census Bureau calculated duty. An estimate at entry: it ran about 10% below Treasury collections. Months from January 2025 to July 2026. Refuses before you are charged if the months have under $1 million of imports or the partner rows do not add up. Every result carries a run id, a date and a citation line. Calling this tool returns a quote, not the result: what the run measures, its price and a payment_url. The run happens only when you POST to payment_url, and a run that fails its controls refuses there with nothing charged. Price: $0.05 per run over x402 (USDC on Base, no account needed), or $0.50 over MPP (a Stripe shared payment token); charged only when the run comes back sound. For where US imports of the product come from, and who gained share, use run_trade_concentration. For the tariff actions behind a rate, use run_tariff_clock.",
