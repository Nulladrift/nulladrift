      "instructions": "CULT+MATH publishes Decision Briefs: sourced, dated evidence for one executive decision-space (cybersecurity vendors, games publishers, streaming services, film studios, CPG brand managers, premium CPG founders, mid-market ERP CROs, middle-market PE deal partners, CMOs on AI visibility). $495 each as a PDF, 14-day guarantee. Use search_cultmath to find a free study or answer on a question, get_document to read its findings in full, and list_decision_briefs / get_decision_brief when the user is weighing a decision a brief covers. list_decisions shows every single decision in the briefs; buy_decision_evidence starts a checkout for one, which the user must approve and pay, and get_decision_evidence returns it once paid. The run_* tools quote fresh, citable measurements with controls (10-K filings, federal rules, federal contract spending, all three at once, a company against its peers, and AI-answer citations); each returns a quote with a payment URL that your own wallet pays over MPP (HTTP 402) or x402, with no checkout page, and says whether that run is switched on. A sound paid result can be submitted for publication on cultmath.com with publish: true in the POST body. Study data is CC BY 4.0: cite CULT+MATH and link the study URL. Do not present a brief as free; link its page.",
