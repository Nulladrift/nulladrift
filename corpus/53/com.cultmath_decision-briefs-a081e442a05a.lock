        {
          "name": "run_ai_visibility",
          "title": "Do AI assistants cite us when buyers ask?",
          "description": "Use when the user asks whether their brand or website shows up in AI answers, or who AI assistants cite instead. Asks ChatGPT, Claude, Gemini and Perplexity the buyer's question live with web search on, three times each on the everyday model and once on the flagship model, and returns per platform: in how many askings the domain was cited and at what positions, whether that held every time, and whether the flagship model agrees. Also how many platforms cite it and the domains cited most instead (not the answers themselves). A platform that cites nothing is reported as not measured. Safe to cite: its controls are checked first, it states its limits, and every result carries a run id, a date and a citation line. If a control fails it refuses and you are not charged. This tool charges nothing: it validates the request and returns a payment_url, the price and instructions. Pay by POSTing to payment_url over MPP (HTTP 402, a Stripe shared payment token from your wallet). Price: $1.47 per run over x402 (USDC on Base, no account needed), or $1.80 over MPP (a Stripe shared payment token). Fixed price per run, not per answer. Charged in full when at least 3 of 4 platforms are measured (a platform counts when at least 2 of its 3 askings answer with sources); otherwise it refuses and nothing is charged. So a charged run can rest on fewer than all 16 answers; the result reports exactly how many, per platform. To have a sound result considered for publication on cultmath.com, add publish: true and question (what you were asked) to the POST body, and credit_name to be credited; CULT+MATH reviews every submission first, and a published piece earns one free run. A real sample of this run, free: https://cultmath.com/agent/samples/ai-visibility.json",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "The domain to look for, e.g. example.com. Its subdomains count.",
                "type": "string"
              },
              "question": {
                "description": "The question a buyer would ask an AI assistant. No personal data.",
                "maxLength": 100,
                "minLength": 10,
                "type": "string"
              }
            },
            "required": ["domain", "question"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
