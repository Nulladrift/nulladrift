        },
        {
          "name": "search_optical_knowledge",
          "description": "Search public optical education in Portuguese or English. Returns source excerpts, not medical advice or customer records.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "pt",
                "enum": ["pt", "en"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
