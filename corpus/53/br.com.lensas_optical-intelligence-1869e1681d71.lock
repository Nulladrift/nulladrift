{
  "lockfileVersion": 2,
  "subjects": {
    "br.com.lensas/optical-intelligence": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://lensas.com.br/optical-api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "lensas-optical-intelligence",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "calculate_decentration",
          "description": "Symmetric boxing frame only: (A + bridge)/2 minus monocular PD, per eye, in mm. Positive nasal; negative temporal. No vertical or prescribed prism compensation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "a": {
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "bridge": {
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "default": "pt",
                "enum": ["pt", "en"],
                "type": "string"
              },
              "pdLeft": {
                "maximum": 80,
                "minimum": 1,
                "type": "number"
              },
              "pdRight": {
                "maximum": 80,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["a", "bridge", "pdLeft", "pdRight"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:500a0c752fdfbcf3d6477e706ab7fd5d9d9a17fa917cce21fb4563c511f5638b"
        },
        {
          "name": "calculate_prism",
          "description": "Educational Prentice approximation: absolute meridional power times displacement in cm. Returns magnitude only, no base direction or prescription recommendation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "displacementMm": {
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "default": "pt",
                "enum": ["pt", "en"],
                "type": "string"
              },
              "meridionalPower": {
                "maximum": 60,
                "minimum": -60,
                "type": "number"
              }
            },
            "required": ["displacementMm", "meridionalPower"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a71f397d611ff7390b9ade4bfb0d60727ff4cbe9f82df27fe60269177c46e9d8"
        },
        {
          "name": "get_optical_topic",
          "description": "Read a public optical topic by stable ID with references, related topics and limitations.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "enum": ["pupillary-distance", "centration", "decentration", "frame-geometry", "refractive-index", "lens-materials", "thickness-factors", "vertex-distance", "pantoscopic-tilt", "prescription-transposition", "prentice-rule", "remote-edging", "optical-store-management", "optical-visagism"],
                "type": "string"
              },
              "language": {
                "default": "pt",
                "enum": ["pt", "en"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:916ef19995c060d3109044f459d4370d0d16f3480f41da41bf57f4865d5f953a"
        },
        {
          "name": "search_optical_knowledge",
          "description": "Search public optical education in Portuguese or English. Returns source excerpts, not medical advice or customer records.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "language": {
                "default": "pt",
                "enum": ["pt", "en"],
                "type": "string"
              },
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "maxLength": 160,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1fd3b7c8831e078695dee2078f14da9758d981b087683d157244cdeb375c37a8"
        },
        {
          "name": "transpose_prescription",
          "description": "Transpose sphere/cylinder notation without changing the prescription. Dioptres and degrees; axis 0–180. Does not diagnose or generate prescriptions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "axis": {
                "maximum": 180,
                "minimum": 0,
                "type": "number"
              },
              "cylinder": {
                "maximum": 30,
                "minimum": -30,
                "type": "number"
              },
              "language": {
                "default": "pt",
                "enum": ["pt", "en"],
                "type": "string"
              },
              "sphere": {
                "maximum": 60,
                "minimum": -60,
                "type": "number"
              }
            },
            "required": ["axis", "cylinder", "sphere"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1ae16b816f9fc201d02b13ca16109386c8bf65d900f1b123e7651e8565217e0"
        }
      ],
      "digest": "sha256:45c08ca045a464d5f62530b4a54ad91a3dad52c5eab418c853f847e4ed8df264"
    }
  }
}
