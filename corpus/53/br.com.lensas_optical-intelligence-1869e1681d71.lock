          "description": "Transpose sphere/cylinder notation without changing the prescription. Dioptres and degrees; axis 0–180. Does not diagnose or generate prescriptions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
