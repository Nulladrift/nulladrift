          "name": "calculate_decentration",
          "description": "Symmetric boxing frame only: (A + bridge)/2 minus monocular PD, per eye, in mm. Positive nasal; negative temporal. No vertical or prescribed prism compensation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "a": {
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "bridge": {
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "default": "pt",
                "enum": ["pt", "en"],
                "type": "string"
              },
              "pdLeft": {
                "maximum": 80,
                "minimum": 1,
                "type": "number"
              },
              "pdRight": {
                "maximum": 80,
                "minimum": 1,
                "type": "number"
              }
            },
            "required": ["a", "bridge", "pdLeft", "pdRight"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
