          "digest": "sha256:0af5b952760cb07f63157203c421efe4ebda0f7f0624546e0a3482e06d7e5938"
        },
        {
          "name": "calculate_prism",
          "description": "Educational Prentice approximation: absolute meridional power times displacement in cm. Returns magnitude only, no base direction or prescription recommendation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "displacementMm": {
                "maximum": 50,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "default": "pt",
                "enum": ["pt", "en"],
                "type": "string"
              },
              "meridionalPower": {
                "maximum": 60,
                "minimum": -60,
                "type": "number"
              }
            },
            "required": ["displacementMm", "meridionalPower"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
