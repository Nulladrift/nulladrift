          "digest": "sha256:7124a9a994c23127f27d73fbac8191bf7b3bacf5e53bd45e27a32b91d0c671e2"
        },
        {
          "name": "sample_size",
          "title": "Sample Size",
          "description": "Calculate the survey sample size needed for a confidence level and margin. FREE.\n\nUses maximum variance (p=0.5) with a finite-population correction when\npopulation is given. Typical input {\"population\": 5000,\n\"confidence_pct\": 95, \"margin_pct\": 5} returns {\"required_sample\": 357,\n\"assumptions\": \"p=0.5 (max variance), random sampling\"}.\n\nUse before collecting data, to size a survey. Not for analyzing data\nalready collected (stats_describe, confidence_interval). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"confidence_pct must be 90, 95, or 99\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confidence_pct": {
                "default": 95,
                "description": "Confidence level; must be 90, 95, or 99.\nDefault 95.",
                "type": "number"
              },
              "margin_pct": {
                "default": 5,
                "description": "Acceptable margin of error percentage; above 0 and at\nmost 50. Default 5.",
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "number"
              },
              "population": {
                "default": 0,
                "description": "Total population size; 0 (default) means unknown or\nvery large.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Sample Size"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:3ac6cc89d852934dacb9b934422d814ae8ede56c4640e725d15050ca56b414a8"
        },
        {
          "name": "stats_describe",
          "title": "Stats Describe",
          "description": "Describe a numeric dataset: center, spread, quartiles, and outliers. FREE.\n\nTypical input {\"numbers\": [12, 15, 14, 90, 13]} returns {\"n\": 5,\n\"mean\": 28.8, \"median\": 14.0, \"std_dev\": ..., \"min\": 12, \"max\": 90,\n\"q1\": ..., \"q3\": ..., \"iqr_outliers\": [90], \"skew\": \"right (mean >\nmedian)\"}.\n\nUse as a first summary of one numeric dataset. Not for interval estimates\n(confidence_interval) and not for planning a study (sample_size). Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"no numbers\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "numbers": {
                "description": "The dataset as a list of numbers; at least 1 value.",
                "items": {
                  "type": "number"
                },
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["numbers"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Stats Describe"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
