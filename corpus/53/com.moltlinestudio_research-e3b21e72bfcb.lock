      },
      "instructions": "Moltline's Research Desk: 7 research/study persona-skill products (research navigation, thesis advising, note-taking, reading comprehension, exam prep). Free: list_products, get_free_skill, format_citation. Premium: get_full_product, get_full_skill.",
      "tools": [
        {
          "name": "confidence_interval",
          "title": "Confidence Interval",
          "description": "Compute a confidence interval for a mean (normal approximation). FREE.\n\nTypical input {\"mean\": 72.4, \"std_dev\": 8.1, \"n\": 64,\n\"confidence_pct\": 95} returns {\"mean\": 72.4, \"margin_of_error\":\n1.9845, \"interval\": [70.4155, 74.3845], \"note\": \"...\"}.\n\nUse on data already collected, for a mean. Normal approximation, so it is\nunreliable on very small or heavily skewed samples. Not for proportions or\ntwo-group comparisons - the data server's ab_test compares two\nproportions. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"confidence 90/95/99, n>=2, std_dev>=0\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confidence_pct": {
                "default": 95,
                "description": "Confidence level; must be 90, 95, or 99.\nDefault 95.",
                "type": "number"
              },
              "mean": {
                "description": "Sample mean.",
                "type": "number"
              },
              "n": {
                "description": "Sample size; at least 2.",
                "minimum": 2,
                "type": "integer"
              },
              "std_dev": {
                "description": "Sample standard deviation; 0 or greater.",
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["mean", "n", "std_dev"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Confidence Interval"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "fastmcp": {
              "tags": []
            }
          },
          "digest": "sha256:7efea55aa0c89048dc9761872000f0621ae9847ce2f96424de480775c04fa359"
        },
        {
          "name": "format_citation",
          "title": "Format Citation",
          "description": "Format a citation in APA 7, MLA 9, or Chicago author-date style. FREE.\n\nTypical input {\"style\": \"apa\", \"authors\": [\"Curie, Marie\"], \"year\":\n1911, \"title\": \"Radium and radioactivity\", \"container\": \"Century\nMagazine\"} returns {\"style\": \"apa\", \"citation\": \"Curie, M. (1911).\nRadium and radioactivity. Century Magazine.\", \"note\": \"...\"}.\n\nUse when the source details are already known and only the formatting is\nmissing. Not for finding or verifying a source. Errors: on invalid, missing, or malformed input this tool never raises a protocol error; it returns {\"error\": \"<what is wrong and how to fix it>\"} (for example {\"error\": \"style must be apa, mla, or chicago\"}). Every call is read-only and idempotent, so after correcting the input it is always safe to retry.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accessed": {
                "default": "",
                "description": "Optional access date for MLA web sources, e.g.\n\"12 Aug. 2026\".",
                "type": "string"
              },
              "authors": {
                "description": "Authors as \"Last, First\" strings in source order, at\nleast one, e.g. [\"Curie, Marie\"].",
                "items": {
                  "type": "string"
                },
                "minItems": 1,
                "type": "array"
              },
              "container": {
                "default": "",
                "description": "Optional journal, book, or site name.",
                "type": "string"
              },
              "publisher": {
                "default": "",
                "description": "Optional publisher name.",
                "type": "string"
              },
              "style": {
                "description": "Citation style: \"apa\", \"mla\", or \"chicago\"\n(case-insensitive).",
                "type": "string"
              },
              "title": {
                "description": "Title of the work being cited.",
                "type": "string"
              },
              "url": {
                "default": "",
                "description": "Optional URL of the source.",
                "type": "string"
              },
              "year": {
                "description": "Publication year, e.g. 2024.",
                "type": "integer"
              }
            },
            "required": ["authors", "style", "title", "year"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Format Citation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
