        {
          "name": "calcular_medidas_fetais",
          "title": "Medidas fetais complementares — ossos longos, cerebelo e bexiga",
          "description": "Medidas fetais complementares — ossos longos, cerebelo e bexiga. Percentil e escore Z de úmero, rádio, ulna, fêmur, tíbia, fíbula e pé (Chitty 2002), do diâmetro transverso do cerebelo (INTERGROWTH-21st) e do diâmetro longitudinal da bexiga (Fontanella 2021), numa única chamada; só a idade gestacional é obrigatória.\nFaixa de validade: Ossos longos e pé: 12+0 a 42+0 semanas. Cerebelo: 14+0 a 40+0 semanas; idade gestacional pelo cerebelo para diâmetros de 12 a 55 mm. Bexiga: 15+0 a 35+0 semanas. Medidas em mm; o percentil assume distribuição normal, como nos artigos.\nReferências: Chitty LS, Altman DG. BJOG 2002;109:919-929 — ossos longos e pé. Página: /calculadoras/avancadas/ossos-longos. Rodriguez-Sibaja MJ et al. (INTERGROWTH-21st). Ultrasound Obstet Gynecol 2021;57:614-623 — diâmetro transverso do cerebelo, Tabelas S1–S3. Página: /calculadoras/avancadas/cerebelo. Fontanella F et al. Ultrasound Obstet Gynecol 2021;58:875-881 — escore Z do diâmetro longitudinal da bexiga. Página: /calculadoras/avancadas/bexiga-fetal.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/ossos-longos\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/avancadas/ossos-longos/entenda https://fetologia.com/calculadoras/avancadas/cerebelo/entenda https://fetologia.com/calculadoras/avancadas/bexiga-fetal/entenda",
          "inputSchema": {
            "properties": {
              "bexiga_mm": {
                "description": "Diâmetro longitudinal da bexiga (cúpula ao colo vesical, corte sagital), em mm.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cerebelo_mm": {
                "description": "Diâmetro transverso do cerebelo, em mm.",
                "exclusiveMinimum": 0,
