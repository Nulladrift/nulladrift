        {
          "name": "calcular_doppler",
          "title": "Doppler obstétrico (artéria umbilical, ACM, CPR, ducto venoso e uterinas)",
          "description": "Doppler obstétrico (artéria umbilical, ACM, CPR, ducto venoso e uterinas). Percentil por idade gestacional e interpretação clínica curta do IP/PIV de um vaso do Doppler obstétrico, com sinais de alarme (diástole zero/reversa, onda \"a\" ausente/reversa).\nFaixa de validade: Artéria umbilical, ACM e CPR: 20 a 41 semanas. Ducto venoso: 11 a 14 semanas (Maiz) e 21 a 39 semanas (Kessler). Artérias uterinas: 11 a 41 semanas (IP médio das duas artérias). Fora da faixa, a resposta traz \"alerta_faixa\" e não classifica o valor.\nReferências: Ciobanu A et al. (Fetal Medicine Foundation). Ultrasound Obstet Gynecol 2019 — IP umbilical, IP da ACM e CPR (n=72.387). Kessler J et al. Ultrasound Obstet Gynecol 2006 — PIV do ducto venoso, 2º/3º trimestre (longitudinal). Maiz N et al. Ultrasound Obstet Gynecol 2008 — PIV do ducto venoso, 11 a 13+6 semanas (faixa 0,73–1,22). Gómez O et al. Ultrasound Obstet Gynecol 2008 — IP médio das artérias uterinas, 11 a 41 semanas.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/doppler\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/avancadas/doppler/entenda",
          "inputSchema": {
            "properties": {
              "diastole_reversa": {
                "description": "Para vaso=umbilical: marcar true se diástole reversa. Sobrepõe percentil — urgência clínica.",
                "type": "boolean"
              },
              "diastole_zero": {
                "description": "Para vaso=umbilical: marcar true se diástole zero. Sobrepõe percentil — gravidade máxima.",
                "type": "boolean"
              },
              "ig_dias": {
                "description": "Dias (0-6). Default 0.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "ig_semanas": {
                "description": "Semanas de IG.",
                "maximum": 42,
                "minimum": 11,
                "type": "integer"
              },
              "ip_medido": {
                "description": "Para vaso=umbilical (IP-AU), acm (IP-ACM), uterinas (IP médio das duas) ou cpr (CPR observada).",
                "type": "number"
              },
              "onda_a": {
                "description": "Para vaso=ducto_venoso: status da onda \"a\". \"ausente\" e \"reversa\" indicam descompensação cardíaca fetal.",
                "enum": ["presente", "ausente", "reversa"],
                "type": "string"
              },
              "piv_medido": {
                "description": "Para vaso=ducto_venoso: PIV (Pulsatility Index for Veins).",
                "type": "number"
              },
              "vaso": {
                "description": "Qual vaso analisar.",
                "enum": ["umbilical", "acm", "cpr", "ducto_venoso", "uterinas"],
                "type": "string"
              }
            },
            "required": ["ig_semanas", "vaso"],
            "type": "object"
          },
