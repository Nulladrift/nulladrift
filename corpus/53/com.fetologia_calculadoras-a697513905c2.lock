        {
          "name": "calcular_doppler_oftalmicas",
          "title": "Doppler das artérias oftálmicas maternas (z-score e percentil)",
          "description": "Doppler das artérias oftálmicas maternas (z-score e percentil). Escore Z, percentil e classificação dos 6 índices do Doppler da artéria oftálmica materna (IR, IP, PVS, P2, razão de picos e VDF), 20 a 41 semanas; vários índices por chamada.\nFaixa de validade: 20+0 a 41+0 semanas (em 41 semanas, apenas 41+0). Valores devem ser a média das duas artérias oftálmicas.\nReferências: Diniz ALD et al. J Ultrasound Med 2026;45:819-831 — curvas de referência do Doppler da artéria oftálmica em gestações de baixo risco. DeVore GR. J Ultrasound Med 2026 — método do escore Z.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/doppler-oftalmicas\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/avancadas/doppler-oftalmicas/entenda",
          "inputSchema": {
            "properties": {
              "edv_cm_s": {
                "description": "Velocidade Diastólica Final em cm/s.",
                "type": "number"
              },
              "ig_dias": {
                "description": "Dias (0-6). Default 0. Em 41 sem, apenas 41+0 é aceito.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
