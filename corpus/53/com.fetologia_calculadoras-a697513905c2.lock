          "title": "Velocidade de crescimento fetal entre duas biometrias",
          "description": "Velocidade de crescimento fetal entre duas biometrias. Projeta o peso do 1º exame ao longo do seu centil até a data do 2º e classifica o crescimento como lento, normal ou acelerado pelos limites específicos do intervalo (Hugh & Gardosi 2022).\nFaixa de validade: IG do 1º exame entre 24+0 e 43+6 semanas. Intervalo mínimo de 14 dias entre os exames. Os dois pesos devem usar a mesma fórmula (preferencialmente Hadlock).\nReferências: Hugh O, Gardosi J. Ultrasound Obstet Gynecol 2022;60:86-95 — velocidade de crescimento fetal e risco de óbito (n=102.138), doi:10.1002/uog.24860.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/velocidade-crescimento\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/avancadas/velocidade-crescimento/entenda",
