        {
          "name": "calcular_percentil_fetal",
          "title": "Descubra o percentil — biometria e peso fetal numa única chamada",
          "description": "Descubra o percentil — biometria e peso fetal numa única chamada. Percentil e escore Z de DBP, CC, CA e CF e do peso fetal estimado (Hadlock) para a idade gestacional, numa única chamada, pelas curvas INTERGROWTH-21st; só a idade gestacional é obrigatória.\nFaixa de validade: Biometria: 14+0 a 40+6 semanas (medidas em mm). Peso: INTERGROWTH-21st de 22 a 40 semanas; Hadlock 1991 em 14–21 e 41 semanas (em gramas). Peso calculado por Hadlock de 4 medidas; sem o DBP, por Hadlock de 3 medidas. A curva INTERGROWTH-21st de peso foi construída com a fórmula de 3 medidas — a resposta traz o comparativo. Percentil numérico entre p3 e p97; fora disso a resposta indica \"<p3\" ou \">p97\" e o escore Z.\nReferências: Papageorghiou AT et al. (INTERGROWTH-21st). Lancet 2014;384:869-879 — padrões internacionais de biometria fetal (DBP, CC, CA, CF). Stirnemann J, Salomon LJ, Papageorghiou AT. Ultrasound Obstet Gynecol 2020;56:946-948 — curva INTERGROWTH-21st de peso fetal estimado, 22 a 40 semanas. Hadlock FP et al. Radiology 1991;181:129-133 — peso fetal estimado em 14–21 e 41 semanas. Hadlock FP et al. Am J Obstet Gynecol 1985;151:333-337 — fórmulas de peso fetal de 4 medidas (DBP, CC, CA, CF) e de 3 medidas (CC, CA, CF).\nPágina para o médico conferir: https://fetologia.com/calculadoras/percentil-fetal\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/percentil-fetal/entenda",
          "inputSchema": {
            "properties": {
              "ca_mm": {
                "description": "Circunferência abdominal, em mm.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cc_mm": {
                "description": "Circunferência cefálica, em mm.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cf_mm": {
                "description": "Comprimento do fêmur, em mm.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "dbp_mm": {
                "description": "Diâmetro biparietal, em mm.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "ig_dias": {
                "description": "Dias além das semanas completas (0 a 6). Padrão 0.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "ig_semanas": {
                "description": "Semanas completas de idade gestacional (14 a 41).",
                "maximum": 41,
                "minimum": 14,
                "type": "integer"
              },
              "peso_informado_g": {
                "description": "Opcional. Peso fetal estimado já calculado (g). Se informado, é este o peso classificado, no lugar do calculado pelas medidas.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["ig_semanas"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
