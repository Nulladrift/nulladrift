      "instructions": "Calculadoras determinísticas (sem IA) de medicina fetal e obstetrícia do FetologIA, gratuitas. Use a ferramenta adequada em vez de calcular de cabeça: idade gestacional/DPP, Doppler obstétrico, anemia fetal (Mari) e CPR, percentil INTERGROWTH-21st, Doppler das artérias oftálmicas maternas, velocidade de crescimento, risco de pré-eclâmpsia FMF e de trissomias 21/18/13 FMF. Cada resultado traz referência bibliográfica, faixa de validade, aviso de uso assistivo e o link da página da calculadora — repasse ao usuário a referência e o link. Responda em português ao médico brasileiro. Ferramenta assistiva de cálculo determinístico para médicos. Não emite diagnóstico, não substitui o exame, a avaliação clínica nem o julgamento do profissional, que permanece integralmente responsável pela decisão. Não envie dados que identifiquem a paciente.",
      "tools": [
        {
          "name": "calcular_anemia_fetal",
          "title": "Anemia fetal (PVS-ACM, método de Mari) e razão cerebroplacentária",
          "description": "Anemia fetal (PVS-ACM, método de Mari) e razão cerebroplacentária. MoM da velocidade sistólica máxima da ACM pelo método de Mari, com limiares de anemia (1,50 MoM; 1,69 MoM pós-transfusão), e/ou razão cerebroplacentária com MoM e limiar p5 FMF.\nFaixa de validade: PVS-ACM (Mari): faixa ótima de 18 a 35 semanas; acima de 35 semanas aumentam os falso-positivos. CPR: 20 a 41 semanas.\nReferências: Mari G et al. N Engl J Med 2000 — diagnóstico não invasivo de anemia fetal pela PVS-ACM. Mari G et al. Obstet Gynecol 2002 — limiar 1,69 MoM em fetos pós-transfusão. Baschat AA, Gembruch U. Ultrasound Obstet Gynecol 2003 — mediana da razão cerebroplacentária. Ciobanu A et al. (Fetal Medicine Foundation). Ultrasound Obstet Gynecol 2019 — limiar p5 da CPR.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/anemia-fetal",
          "inputSchema": {
            "properties": {
              "ig_dias": {
                "description": "Dias adicionais (0-6). Default 0.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "ig_semanas": {
                "description": "Semanas de IG (componente inteiro, 11-41).",
                "maximum": 41,
                "minimum": 11,
                "type": "integer"
              },
              "ip_acm": {
                "description": "IP da artéria cerebral média. Obrigatório em modo \"cpr\" ou \"ambos\".",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "ip_au": {
                "description": "IP da artéria umbilical. Obrigatório em modo \"cpr\" ou \"ambos\".",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "modo": {
                "description": "anemia_pvs_acm=cálculo de MoM pela PVS-ACM (Mari); cpr=cálculo da razão cerebroplacentária; ambos=executa os dois e retorna combinado.",
                "enum": ["anemia_pvs_acm", "cpr", "ambos"],
                "type": "string"
              },
              "pos_transfusao": {
                "description": "Se true, aplica limiar 1.69 MoM (Mari Obstet Gynecol 2002) em vez de 1.50. Default false.",
                "type": "boolean"
              },
              "pvs_acm_cm_s": {
                "description": "PVS-ACM medida em cm/s. Obrigatório em modo \"anemia_pvs_acm\" ou \"ambos\".",
                "exclusiveMinimum": 0,
                "type": "number"
              }
