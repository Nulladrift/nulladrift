          },
          "digest": "sha256:7f76941338ff73a0603b617f7a48dbef4b6523f1093a84e9ec1d466bc388b55d"
        },
        {
          "name": "calcular_trissomias_fmf",
          "title": "Risco de trissomias 21, 18 e 13 no rastreio do 1º trimestre (algoritmo FMF)",
          "description": "Risco de trissomias 21, 18 e 13 no rastreio do 1º trimestre (algoritmo FMF). Risco de trissomias 21, 18 e 13 por idade materna e translucência nucal, com ducto venoso, osso nasal, tricúspide, PAPP-A, β-hCG livre e BCF opcionais, 11+0 a 13+6 semanas.\nFaixa de validade: 11+0 a 14+1 semanas (77 a 99 dias) e CCN de 45 a 84 mm. Translucência nucal obrigatória; marcadores adicionais são opcionais. Use β-hCG LIVRE, não β-hCG total.\nReferências: Snijders RJ et al. Lancet 1998 — rastreio de trissomia 21 por idade materna e translucência nucal (FMF). Nicolaides KH (Fetal Medicine Foundation) — rastreio combinado de 1º trimestre. Kagan KO et al. Ultrasound Obstet Gynecol 2009;33:259-264 — osso nasal no rastreio de 1º trimestre. Kagan KO et al. Ultrasound Obstet Gynecol 2009;33:18-22 — regurgitação tricúspide no rastreio de 1º trimestre. Maiz N et al. Ultrasound Obstet Gynecol 2009;33:512-517 — ducto venoso no rastreio de 1º trimestre.\nAviso: Modelo publicado pela Fetal Medicine Foundation (FMF). Ferramenta independente, sem vínculo com a FMF; não é a calculadora oficial. Os resultados ainda estão sendo comparados aos da calculadora oficial.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/cromossomopatias-fmf",
          "inputSchema": {
            "properties": {
              "concepcao": {
                "description": "Concepção. Na FIV a idade usada é a de quem forneceu os óvulos na coleta (+266 dias). Padrão: espontanea.",
                "enum": ["espontanea", "inducao", "fiv"],
                "type": "string"
              },
              "crl_mm": {
                "description": "Comprimento cabeça-nádega em mm (validity: 45-84 mm). Obrigatório.",
                "maximum": 84,
                "minimum": 45,
                "type": "number"
              },
              "data_coleta": {
                "description": "FIV: data da coleta dos óvulos (AAAA-MM-DD).",
                "format": "date",
                "type": "string"
              },
              "data_exame": {
                "description": "Data do exame (AAAA-MM-DD). Padrão: hoje.",
                "format": "date",
                "type": "string"
              },
              "data_nascimento": {
                "description": "Data de nascimento da gestante (AAAA-MM-DD). Preferível à idade: a calculadora oficial da FMF usa a idade decimal na data provável do parto.",
                "format": "date",
                "type": "string"
              },
              "dv_awave": {
                "description": "Onda A do ducto venoso categorizada (modelo clássico/brasileiro, Maiz 2009): present=presente normal, absent=ausente (achado de risco), reversed=reversa (achado de risco maior). Sobrepõe dvpi numérico quando ambos informados.",
                "enum": ["present", "absent", "reversed"],
                "type": "string"
              },
              "dvpi": {
                "description": "IP numérico do ducto venoso (modelo FMF moderno). Opcional. Se a onda A categorizada (dv_awave) também for informada, ela prevalece.",
                "type": "number"
              },
              "eth": {
                "description": "Etnia materna. Afeta DV-PI e osso nasal.",
                "enum": ["White", "Black", "S Asian", "E Asian", "Mixed"],
                "type": "string"
              },
              "fbhcg_mom": {
                "description": "β-hCG livre MoM (já corrigido pelo laboratório). Sobrepõe fbhcg_raw_pg_ml se ambos informados.",
                "type": "number"
              },
              "fbhcg_raw_pg_ml": {
                "description": "β-hCG livre (subunidade β livre) valor bruto em pg/mL. Convertido para MoM aproximado. NÃO use β-hCG total — não é compatível com o algoritmo FMF.",
                "type": "number"
              },
              "fhr": {
                "description": "Frequência cardíaca fetal em bpm. Opcional.",
                "maximum": 220,
                "minimum": 80,
                "type": "number"
              },
              "ga_dias": {
                "description": "Idade gestacional em dias (ex: 84 = 12+0 sem). Validity: 77-99 dias (11+0 a 14+1).",
                "maximum": 99,
                "minimum": 77,
                "type": "integer"
              },
              "idade_doadora": {
                "description": "FIV com doadora, sem data de nascimento: idade da doadora na coleta (anos).",
                "maximum": 60,
                "minimum": 12,
                "type": "number"
              },
              "ma": {
                "description": "Idade materna em anos completos. Use apenas se a data de nascimento não for conhecida (resultado aproximado).",
                "maximum": 60,
                "minimum": 12,
                "type": "number"
              },
              "nascimento_doadora": {
                "description": "FIV com doadora: data de nascimento da doadora (AAAA-MM-DD).",
                "format": "date",
                "type": "string"
              },
              "nb": {
                "description": "Osso nasal: present=presente (normal) ou absent=ausente (achado de risco). Opcional.",
                "enum": ["present", "absent"],
                "type": "string"
              },
              "nt_mm": {
                "description": "Translucência nucal em mm. Obrigatório.",
                "exclusiveMinimum": 0,
                "maximum": 15,
                "type": "number"
              },
              "origem_ovulos": {
                "description": "FIV: óvulos próprios ou de doadora. Padrão: propria.",
                "enum": ["propria", "doadora"],
                "type": "string"
              },
              "pappa_mom": {
                "description": "PAPP-A MoM (já corrigido pelo laboratório). Sobrepõe pappa_raw_mu_l se ambos informados.",
                "type": "number"
              },
              "pappa_raw_mu_l": {
                "description": "PAPP-A valor bruto em mU/L (= mIU/mL). Convertido para MoM aproximado via curvas Kagan 2008 + correção por peso. Use quando o laudo só dá o bruto sem MoM.",
                "type": "number"
              },
              "prev_t13": {
