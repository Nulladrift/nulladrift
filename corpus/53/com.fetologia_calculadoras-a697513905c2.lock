        {
          "name": "calcular_idade_gestacional",
          "title": "Idade gestacional, data provável do parto e concepção",
          "description": "Idade gestacional, data provável do parto e concepção. IG, DPP e concepção por DUM (Naegele), exame anterior de ultrassom, CCN (Robinson-Fleming corrigida), biometria (Hadlock 1984) ou FIV/ICSI, e comparação DUM × USG pela regra ACOG CO 700.\nFaixa de validade: CCN de 5 a 84 mm. Exame anterior: IG no exame entre 4+0 e 43+6 semanas; a data de referência não pode ser anterior ao exame. Biometria (Hadlock): idade calculada entre 12 e 42 semanas. Ciclo menstrual de 21 a 35 dias. FIV/ICSI: transferência em D3 ou D5.\nReferências: Regra de Naegele (DPP = DUM + 280 dias, ajustada pelo tamanho do ciclo). Exame anterior de ultrassom: IG do exame + dias decorridos; DPP = data do exame + (280 − IG no exame, em dias). Robinson HP, Fleming JE. Br J Obstet Gynaecol 1975 — fórmula do CCN com correção 1,037. Hadlock FP et al. Radiology 1984 — idade gestacional por DBP, CC, CA e CF (15 combinações). ACOG/AIUM/SMFM Committee Opinion 700 (2017) — Methods for estimating the due date.\nPágina para o médico conferir: https://fetologia.com/calculadoras/idade-gestacional\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/idade-gestacional/entenda",
          "inputSchema": {
            "properties": {
              "ca_cm": {
                "description": "LEGADO — CA em centímetros. Prefira ca_mm.",
                "type": "number"
              },
              "ca_mm": {
                "description": "CA (circunferência abdominal) em milímetros.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cc_cm": {
                "description": "LEGADO — CC em centímetros. Prefira cc_mm.",
                "type": "number"
              },
              "cc_mm": {
                "description": "CC (circunferência cefálica) em milímetros.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "ccn_mm": {
                "description": "Comprimento cabeça-nádega em milímetros (5-84 mm). Usado em modo \"ccn\" e \"comparar_dum_usg\" se método=ccn.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cf_cm": {
                "description": "LEGADO — CF em centímetros. Prefira cf_mm.",
                "type": "number"
              },
              "cf_mm": {
                "description": "CF (comprimento do fêmur) em milímetros.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "ciclo_dias": {
                "description": "Tamanho do ciclo em dias (default 28). Usado em modo \"dum\" e \"comparar_dum_usg\".",
                "maximum": 35,
                "minimum": 21,
                "type": "integer"
              },
              "data_referencia": {
                "description": "Data ISO (YYYY-MM-DD) para cálculo de IG hoje. Default: data atual.",
                "type": "string"
              },
              "data_transferencia": {
                "description": "Data ISO da transferência embrionária. Obrigatório em modo \"fiv\".",
                "type": "string"
              },
              "data_usg": {
                "description": "Data ISO (YYYY-MM-DD) do ultrassom. Obrigatório em modo \"ccn\", \"biometria\" e \"comparar_dum_usg\".",
                "type": "string"
              },
              "dbp_cm": {
                "description": "LEGADO — DBP em centímetros. Prefira dbp_mm; se os dois vierem, vale o de milímetros.",
                "type": "number"
              },
              "dbp_mm": {
                "description": "DBP (diâmetro biparietal) em milímetros. Usado em modo \"biometria\".",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "dia_transferencia": {
