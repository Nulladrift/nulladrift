        {
          "name": "calcular_intergrowth",
          "title": "Percentil e escore Z de biometria fetal e peso estimado (INTERGROWTH-21st)",
          "description": "Percentil e escore Z de biometria fetal e peso estimado (INTERGROWTH-21st). Percentil e escore Z de CA, DBP, CF, CC, DOF e peso fetal estimado pelas curvas INTERGROWTH-21st, com classificação clínica.\nFaixa de validade: Biometria: 14 a 41 semanas (medidas em mm). Peso fetal estimado: INTERGROWTH-21st de 22 a 40 semanas; Hadlock 1991 em 14–21 e 41 semanas (em gramas). A resposta informa em \"referencia_usada\" qual tabela foi aplicada.\nReferências: Papageorghiou AT et al. (INTERGROWTH-21st). Lancet 2014 — padrões internacionais de biometria fetal (CA, DBP, CF, CC, DOF). Stirnemann J et al. (INTERGROWTH-21st). Ultrasound Obstet Gynecol 2020 — peso fetal estimado, 22 a 40 semanas. Hadlock FP et al. Radiology 1991 — peso fetal estimado fora da faixa INTERGROWTH (14–21 e 41 semanas).\nPágina para o médico conferir: https://fetologia.com/calculadoras/percentil-fetal",
          "inputSchema": {
            "properties": {
              "idade_gestacional_dias": {
                "description": "Dias adicionais (0-6). Default 0 quando não informado.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "idade_gestacional_semanas": {
                "description": "Semanas completas de idade gestacional (componente inteiro de 14 a 41).",
                "maximum": 41,
                "minimum": 14,
                "type": "integer"
              },
              "parametro": {
                "description": "Parâmetro biométrico (siglas em inglês): AC=circunferência abdominal (CA); BPD=diâmetro biparietal (DBP); FL=comprimento do fêmur (CF); HC=circunferência cefálica (CC); OFD=diâmetro occipitofrontal (DOF); EFW=peso fetal estimado.",
                "enum": ["AC", "BPD", "FL", "HC", "OFD", "EFW"],
                "type": "string"
              },
              "valor_medido": {
                "description": "Medida em mm para parâmetros biométricos (AC, BPD, FL, HC, OFD), ou em gramas para EFW. Não aceita valores negativos nem zero.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["idade_gestacional_semanas", "parametro", "valor_medido"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ada28f5eec7292de475907bd370204db3cca14913250d73e576dad554aca5432"
        },
        {
          "name": "calcular_pe_fmf",
          "title": "Risco de pré-eclâmpsia pelo modelo de riscos competitivos da FMF (4 momentos)",
          "description": "Risco de pré-eclâmpsia pelo modelo de riscos competitivos da FMF (4 momentos). Risco individualizado de pré-eclâmpsia por fatores maternos e biomarcadores; escolhe o momento pela IG: 11–14, 19–24+6, 30–34+6 ou 35–37+6 semanas.\nFaixa de validade: Janelas: 11+0 a 14+1, 19+0 a 24+6, 30+0 a 34+6 e 35+0 a 37+6 semanas. Sem MAP o resultado usa só fatores maternos (\"risco_baseline\"). MoMs informados diretamente devem ser os corrigidos pelo software do laboratório.\nReferências: O'Gorman N et al. Ultrasound Obstet Gynecol 2017 — rastreio de pré-eclâmpsia no 1º trimestre (modelo de riscos competitivos). Tan MY et al. Ultrasound Obstet Gynecol 2018 — validação do rastreio de 1º trimestre. Wright D et al. Am J Obstet Gynecol 2019 — rastreio no 2º e 3º trimestres. Rolnik DL et al. N Engl J Med 2017 (ASPRE) — aspirina em gestantes de alto risco no 1º trimestre. Zeisler H et al. N Engl J Med 2016 — razão sFLT-1/PlGF na suspeita de pré-eclâmpsia.\nAviso: Reimplementação autoral, em código próprio, de algoritmo publicado pela Fetal Medicine Foundation (FMF), a partir de literatura pública. Não é a calculadora oficial nem é certificada pela FMF; para fins médico-legais ou de pesquisa, use a calculadora oficial. Concordância de aproximadamente 98% com a calculadora oficial em casos clínicos validados; pequenas divergências podem existir.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/pe-fmf-1trim",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Idade materna em anos.",
                "maximum": 60,
                "minimum": 12,
                "type": "number"
              },
              "ch": {
                "description": "Hipertensão crônica.",
                "type": "boolean"
              },
              "conception_method": {
                "description": "Método de concepção: spontaneous=espontânea (padrão), ovulation=indução de ovulação, ivf=FIV/ICSI.",
                "enum": ["spontaneous", "ovulation", "ivf"],
                "type": "string"
              },
              "db_type": {
                "description": "Diabetes mellitus tipo 1, tipo 2 ou ausente.",
                "enum": ["none", "type1", "type2"],
                "type": "string"
              },
              "efw_mom": {
                "description": "EFW MoM (peso fetal estimado em log10 MoM, do laudo, mid-trim apenas).",
                "type": "number"
              },
              "fhpe": {
                "description": "História familiar de PE.",
                "type": "boolean"
              },
              "glyfen_bruto": {
                "description": "Glycosylated Fibronectin bruto (apenas 36 sem, reagente Lumella).",
                "type": "number"
              },
              "glyfen_mom": {
                "description": "Glyfen MoM (manual). Sobrescreve glyfen_bruto.",
                "type": "number"
              },
              "height_cm": {
                "description": "Altura materna em cm.",
                "maximum": 220,
                "minimum": 120,
                "type": "number"
              },
              "ig_dias": {
                "description": "Idade gestacional em dias (ex.: 91 = 13+0). Janelas aceitas pelo algoritmo: 77–99, 133–174, 210–244 e 245–265 dias.",
                "maximum": 265,
                "minimum": 77,
                "type": "integer"
              },
              "interval_years": {
                "description": "Intervalo desde último parto em anos (se parity=multipnope).",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "map_mmhg": {
                "description": "Pressão arterial média em mmHg (auto-calcula o MoM). É arredondada para inteiro antes do cálculo, como na página da calculadora.",
                "type": "number"
              },
              "map_mom": {
                "description": "MAP MoM já corrigido do laboratório. Sobrescreve map_mmhg.",
                "type": "number"
              },
              "parity": {
                "description": "nullipara=nulípara; multipnope=multípara sem PE prévia; multippe=multípara COM PE prévia.",
                "enum": ["nullipara", "multipnope", "multippe"],
                "type": "string"
              },
              "plgf_mom": {
                "description": "PlGF MoM já corrigido. Sobrescreve plgf_pg_ml.",
                "type": "number"
              },
              "plgf_pg_ml": {
                "description": "PlGF bruto em pg/mL.",
                "type": "number"
              },
              "plgf_reagente": {
                "description": "Reagente PlGF do laboratório.",
                "enum": ["delfia", "kryptor", "roche"],
                "type": "string"
              },
              "prev_ga_weeks": {
                "description": "IG do parto prévio com PE em semanas (se parity=multippe).",
                "maximum": 44,
