        {
          "name": "calcular_intergrowth",
          "title": "Percentil e escore Z de biometria fetal e peso estimado (INTERGROWTH-21st)",
          "description": "Percentil e escore Z de biometria fetal e peso estimado (INTERGROWTH-21st). Percentil e escore Z de CA, DBP, CF, CC, DOF e peso fetal estimado pelas curvas INTERGROWTH-21st, com classificação clínica.\nFaixa de validade: Biometria: 14 a 41 semanas (medidas em mm). Peso fetal estimado: INTERGROWTH-21st de 22 a 40 semanas; Hadlock 1991 em 14–21 e 41 semanas (em gramas). A resposta informa em \"referencia_usada\" qual tabela foi aplicada.\nReferências: Papageorghiou AT et al. (INTERGROWTH-21st). Lancet 2014 — padrões internacionais de biometria fetal (CA, DBP, CF, CC, DOF). Stirnemann J et al. (INTERGROWTH-21st). Ultrasound Obstet Gynecol 2020 — peso fetal estimado, 22 a 40 semanas. Hadlock FP et al. Radiology 1991 — peso fetal estimado fora da faixa INTERGROWTH (14–21 e 41 semanas).\nPágina para o médico conferir: https://fetologia.com/calculadoras/percentil-fetal\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/percentil-fetal/entenda",
          "inputSchema": {
            "properties": {
              "idade_gestacional_dias": {
                "description": "Dias adicionais (0-6). Default 0 quando não informado.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "idade_gestacional_semanas": {
                "description": "Semanas completas de idade gestacional (componente inteiro de 14 a 41).",
                "maximum": 41,
                "minimum": 14,
                "type": "integer"
              },
              "parametro": {
                "description": "Parâmetro biométrico (siglas em inglês): AC=circunferência abdominal (CA); BPD=diâmetro biparietal (DBP); FL=comprimento do fêmur (CF); HC=circunferência cefálica (CC); OFD=diâmetro occipitofrontal (DOF); EFW=peso fetal estimado.",
                "enum": ["AC", "BPD", "FL", "HC", "OFD", "EFW"],
                "type": "string"
              },
              "valor_medido": {
                "description": "Medida em mm para parâmetros biométricos (AC, BPD, FL, HC, OFD), ou em gramas para EFW. Não aceita valores negativos nem zero.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
