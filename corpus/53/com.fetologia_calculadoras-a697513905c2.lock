        },
        {
          "name": "calcular_velocidade_crescimento",
          "title": "Velocidade de crescimento fetal entre duas biometrias",
          "description": "Velocidade de crescimento fetal entre duas biometrias. Projeta o peso do 1º exame ao longo do seu centil até a data do 2º e classifica o crescimento como lento, normal ou acelerado pelos limites específicos do intervalo (Hugh & Gardosi 2022).\nFaixa de validade: IG do 1º exame entre 24+0 e 43+6 semanas. Intervalo mínimo de 14 dias entre os exames. Os dois pesos devem usar a mesma fórmula (preferencialmente Hadlock).\nReferências: Hugh O, Gardosi J. Ultrasound Obstet Gynecol 2022;60:86-95 — velocidade de crescimento fetal e risco de óbito (n=102.138), doi:10.1002/uog.24860. Script oficial do Perinatal Institute (github.com/olihugh/EFWVelocity, 2023) — interpolação diária dos limites.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/velocidade-crescimento",
          "inputSchema": {
            "properties": {
              "efw1_g": {
                "description": "EFW do exame 1 em gramas (preferencialmente Hadlock).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "efw2_g": {
                "description": "EFW do exame 2 em gramas (mesma fórmula do exame 1).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "ig1_dias": {
                "description": "Dias no exame 1 (0-6). Default 0.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "ig1_semanas": {
                "description": "Semanas de IG no exame 1.",
                "maximum": 43,
                "minimum": 24,
                "type": "integer"
              },
              "ig2_dias": {
                "description": "Dias no exame 2 (0-6). Default 0.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "ig2_semanas": {
                "description": "Semanas de IG no exame 2.",
                "maximum": 45,
                "minimum": 24,
                "type": "integer"
              }
            },
            "required": ["efw1_g", "efw2_g", "ig1_semanas", "ig2_semanas"],
            "type": "object"
          },
