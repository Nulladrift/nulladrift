        {
          "name": "calcular_pe_fmf",
          "title": "Risco de pré-eclâmpsia pelo modelo de riscos competitivos da FMF (4 momentos)",
          "description": "Risco de pré-eclâmpsia pelo modelo de riscos competitivos da FMF (4 momentos). Risco individualizado de pré-eclâmpsia por fatores maternos e biomarcadores; escolhe o momento pela IG: 11–14, 19–24+6, 30–34+6 ou 35–37+6 semanas.\nFaixa de validade: Janelas: 11+0 a 14+1, 19+0 a 24+6, 30+0 a 34+6 e 35+0 a 37+6 semanas. 1º trimestre: sem PAM o resultado usa só fatores maternos (\"risco_baseline\"). Demais momentos: a PAM é obrigatória, como na calculadora oficial. A partir de 14+1 semanas é obrigatório o peso materno no 1º trimestre (weight_1tri_kg); no 2º trimestre o IP das uterinas exige a via (uta_via). Prazos exibidos como na calculadora oficial: 1º tri < 37 sem; 2º tri < 28, < 32 e < 36 sem; 32 sem < 36 sem e 2 semanas; 36 sem < 41+3 sem e 2 semanas. MoMs informados diretamente devem ser os corrigidos pelo software do laboratório.\nReferências: O'Gorman N et al. Ultrasound Obstet Gynecol 2017 — rastreio de pré-eclâmpsia no 1º trimestre (modelo de riscos competitivos). Tan MY et al. Ultrasound Obstet Gynecol 2018 — validação do rastreio de 1º trimestre. Wright D et al. Am J Obstet Gynecol 2019 — rastreio no 2º e 3º trimestres. Rolnik DL et al. N Engl J Med 2017 (ASPRE) — aspirina em gestantes de alto risco no 1º trimestre. Zeisler H et al. N Engl J Med 2016 — razão sFLT-1/PlGF na suspeita de pré-eclâmpsia.\nAviso: Modelo publicado pela Fetal Medicine Foundation (FMF). Ferramenta independente, sem vínculo com a FMF; não é a calculadora oficial. Mesmo resultado da calculadora oficial nos quatro momentos; com a idade em anos (sem data de nascimento) o resultado é aproximado.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/pe-fmf-1trim\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/avancadas/pe-fmf-1trim/entenda",
          "inputSchema": {
            "properties": {
              "age": {
                "description": "Idade materna em anos completos. Use apenas se a data de nascimento não for conhecida (no 1º trimestre o resultado fica aproximado).",
                "maximum": 60,
                "minimum": 12,
                "type": "number"
              },
              "ca_mm": {
                "description": "Circunferência abdominal fetal em mm (para o peso fetal por Hadlock de 3 medidas, 2º trimestre).",
                "minimum": 0,
                "type": "number"
              },
              "cc_mm": {
                "description": "Circunferência cefálica fetal em mm (idem).",
                "minimum": 0,
                "type": "number"
              },
              "cf_mm": {
                "description": "Comprimento do fêmur em mm (idem).",
                "minimum": 0,
                "type": "number"
              },
              "ch": {
                "description": "Hipertensão crônica.",
                "type": "boolean"
              },
              "conception_method": {
                "description": "Método de concepção: spontaneous=espontânea (padrão), ovulation=indução de ovulação, ivf=FIV/ICSI.",
                "enum": ["spontaneous", "ovulation", "ivf"],
                "type": "string"
              },
              "data_exame": {
                "description": "Data do exame (AAAA-MM-DD). Padrão: hoje. Usada com data_nascimento e data_parto_anterior.",
                "format": "date",
                "type": "string"
              },
              "data_nascimento": {
                "description": "Data de nascimento da gestante (AAAA-MM-DD). Preferível à idade: com ela o 1º trimestre fica idêntico à calculadora oficial da FMF (que usa a idade decimal na data provável do parto).",
                "format": "date",
                "type": "string"
              },
              "data_parto_anterior": {
                "description": "Data do último parto (AAAA-MM-DD), para toda multípara. Com ela o intervalo entre gestações é calculado como na calculadora oficial; sem ela, use interval_years.",
                "format": "date",
                "type": "string"
              },
              "db_type": {
                "description": "Diabetes mellitus tipo 1, tipo 2 ou ausente.",
                "enum": ["none", "type1", "type2"],
                "type": "string"
              },
              "dm2_medicacao": {
                "description": "Tratamento do diabetes tipo 2 (só altera o cálculo quando inclui insulina). Padrão: dieta.",
                "enum": ["dieta", "insulina", "insulina_metformina", "metformina"],
                "type": "string"
              },
              "efw_g": {
                "description": "Peso fetal estimado em gramas (2º trimestre, gestação única). Alternativa: ca_mm, cc_mm e cf_mm.",
                "maximum": 5000,
                "minimum": 50,
                "type": "number"
              },
              "fhpe": {
                "description": "Mãe da gestante teve pré-eclâmpsia.",
                "type": "boolean"
              },
              "glyfen_bruto": {
                "description": "Fibronectina glicosilada bruta (reagente Lumella; 1º trimestre e 36 semanas, gestação única).",
                "type": "number"
              },
              "glyfen_mom": {
                "description": "MoM da fibronectina glicosilada. Sobrescreve glyfen_bruto.",
                "type": "number"
              },
              "height_cm": {
                "description": "Altura materna em cm.",
                "maximum": 220,
                "minimum": 120,
                "type": "number"
              },
              "ig_dias": {
                "description": "Idade gestacional em dias (ex.: 91 = 13+0). Janelas aceitas pelo algoritmo: 77–99, 133–174, 210–244 e 245–265 dias.",
                "maximum": 265,
                "minimum": 77,
                "type": "integer"
              },
              "interval_years": {
                "description": "Intervalo entre o último parto e a gestação atual, em anos (toda multípara). Ignorado se data_parto_anterior for informada.",
                "maximum": 40,
                "minimum": 0,
                "type": "number"
              },
              "map_mmhg": {
                "description": "Pressão arterial média (PAM) em mmHg, sem arredondar (auto-calcula o MoM). Opcional.",
                "type": "number"
              },
              "map_mom": {
                "description": "MoM da PAM já corrigido do laboratório. Sobrescreve map_mmhg.",
                "type": "number"
              },
              "oa_ratio": {
                "description": "Razão de PSV da artéria oftálmica materna (média dos 2º picos ÷ média dos 1º picos dos dois olhos). Usada no 1º, 2º trimestre e 36 semanas.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "parity": {
                "description": "nullipara=nulípara; multipnope=multípara sem PE prévia; multippe=multípara COM PE prévia.",
                "enum": ["nullipara", "multipnope", "multippe"],
                "type": "string"
              },
              "plgf_mom": {
                "description": "PlGF MoM já corrigido. Sobrescreve plgf_pg_ml.",
                "type": "number"
              },
              "plgf_pg_ml": {
                "description": "PlGF bruto em pg/mL.",
                "type": "number"
              },
              "plgf_reagente": {
                "description": "Reagente PlGF do laboratório.",
                "enum": ["delfia", "kryptor", "roche"],
                "type": "string"
              },
              "prev_ga_days": {
                "description": "Dias adicionais da IG do último parto (0 a 6). Padrão 0.",
                "maximum": 6,
                "minimum": 0,
                "type": "integer"
              },
              "prev_ga_weeks": {
                "description": "IG do último parto (≥ 24 semanas), em semanas completas — para TODA multípara, com ou sem PE prévia.",
                "maximum": 44,
                "minimum": 20,
                "type": "number"
              },
              "race": {
                "description": "0=Branca/Caucasiana, 1=Negra/Afro, 2=Sul-asiática, 3=Leste-asiática, 4=Mista/Outra.",
                "enum": [0, 1, 2, 3, 4],
                "type": "integer"
              },
              "sflt_mom": {
                "description": "sFLT MoM já corrigido. Sobrescreve sflt_pg_ml.",
                "type": "number"
              },
              "sflt_pg_ml": {
                "description": "sFLT-1 bruto em pg/mL.",
                "type": "number"
              },
              "sflt_reagente": {
                "description": "Reagente sFLT-1 do laboratório.",
                "enum": ["kryptor", "roche"],
                "type": "string"
              },
              "sleaps": {
                "description": "LES ou síndrome antifosfolípide.",
                "type": "boolean"
              },
              "smoking": {
                "description": "Tabagista atual.",
                "type": "boolean"
              },
              "twins": {
                "description": "singleton=feto único; dc=gemelar dicoriônica; mc=gemelar monocoriônica.",
                "enum": ["singleton", "dc", "mc"],
                "type": "string"
              },
              "uta_mom": {
                "description": "MoM do IP das artérias uterinas já corrigido. Sobrescreve uta_pi.",
                "type": "number"
              },
              "uta_pi": {
                "description": "IP médio das uterinas (auto-calcula MoM). Opcional.",
                "type": "number"
              },
              "uta_via": {
                "description": "Via do Doppler das uterinas no 2º trimestre: ta=transabdominal, tv=transvaginal (necessária para o MoM das uterinas nesse momento).",
                "enum": ["ta", "tv"],
                "type": "string"
              },
              "weight_1tri_kg": {
                "description": "Peso materno no 1º trimestre (por volta de 12 semanas), em kg. Obrigatório a partir de 14+1 semanas: o modelo da FMF usa esse peso no risco basal.",
                "maximum": 250,
                "minimum": 30,
                "type": "number"
              },
              "weight_kg": {
                "description": "Peso materno em kg.",
                "maximum": 250,
                "minimum": 30,
