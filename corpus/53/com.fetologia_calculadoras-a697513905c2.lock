        {
          "name": "calcular_discordancia_gemelar",
          "title": "Discordância de peso entre gêmeos e critérios de RCF seletiva",
          "description": "Discordância de peso entre gêmeos e critérios de RCF seletiva. Discordância de peso fetal estimado entre gêmeos (limiar de 25%) e, com a corionicidade, os critérios de consenso Delphi de restrição de crescimento fetal seletiva.\nFaixa de validade: Pesos em gramas; percentis de 0 a 100, pela curva usada para gestação única. Critérios não informados ficam como \"não informado\"; a conclusão pode ser \"dados insuficientes\".\nReferências: Khalil A et al. Ultrasound Obstet Gynecol 2019;53:47-54 — consenso Delphi de RCF seletiva em gêmeos. Khalil A et al. ISUOG Practice Guidelines: role of ultrasound in twin pregnancy. Ultrasound Obstet Gynecol 2016;47:247-263.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/discordancia-gemelar\nMaterial de estudo (origem do método, técnica de medida, interpretação): https://fetologia.com/calculadoras/avancadas/discordancia-gemelar/entenda",
          "inputSchema": {
            "properties": {
              "ca_abaixo_p10": {
                "description": "Opcional, só monocoriônica. Circunferência abdominal de um gêmeo abaixo do p10.",
                "type": "boolean"
              },
              "corionicidade": {
                "description": "Opcional. Necessária para checar os critérios de RCF seletiva.",
                "enum": ["dicorionica", "monocorionica"],
                "type": "string"
              },
              "ip_au_menor_acima_p95": {
                "description": "Opcional. IP da artéria umbilical do menor acima do p95.",
