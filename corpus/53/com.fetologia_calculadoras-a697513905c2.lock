        {
          "name": "calcular_trissomias_fmf",
          "title": "Risco de trissomias 21, 18 e 13 no rastreio do 1º trimestre (algoritmo FMF)",
          "description": "Risco de trissomias 21, 18 e 13 no rastreio do 1º trimestre (algoritmo FMF). Risco de trissomias 21, 18 e 13 por idade materna e translucência nucal, com ducto venoso, osso nasal, tricúspide, PAPP-A, β-hCG livre e BCF opcionais, 11+0 a 13+6 semanas.\nFaixa de validade: 11+0 a 14+1 semanas (77 a 99 dias) e CCN de 45 a 84 mm. Translucência nucal obrigatória; marcadores adicionais são opcionais. Use β-hCG LIVRE, não β-hCG total.\nReferências: Snijders RJ et al. Lancet 1998 — rastreio de trissomia 21 por idade materna e translucência nucal (FMF). Nicolaides KH (Fetal Medicine Foundation) — rastreio combinado de 1º trimestre. Kagan KO et al. Ultrasound Obstet Gynecol 2008 — osso nasal no rastreio de 1º trimestre. Wright D et al. Ultrasound Obstet Gynecol 2008 — ducto venoso (IP) no rastreio de 1º trimestre. Maiz N et al. Ultrasound Obstet Gynecol 2009 — regurgitação tricúspide no rastreio de 1º trimestre.\nAviso: Reimplementação autoral, em código próprio, de algoritmo publicado pela Fetal Medicine Foundation (FMF), a partir de literatura pública. Não é a calculadora oficial nem é certificada pela FMF; para fins médico-legais ou de pesquisa, use a calculadora oficial. A concordância numérica com a calculadora oficial online ainda está em validação.\nPágina para o médico conferir: https://fetologia.com/calculadoras/avancadas/cromossomopatias-fmf",
          "inputSchema": {
            "properties": {
              "crl_mm": {
                "description": "Comprimento cabeça-nádega em mm (validity: 45-84 mm). Obrigatório.",
                "maximum": 84,
                "minimum": 45,
                "type": "number"
              },
              "dv_awave": {
                "description": "Onda A do ducto venoso categorizada (modelo clássico/brasileiro, Maiz 2009): present=presente normal, absent=ausente (achado de risco), reversed=reversa (achado de risco maior). Sobrepõe dvpi numérico quando ambos informados.",
                "enum": ["present", "absent", "reversed"],
                "type": "string"
              },
              "dvpi": {
                "description": "IP numérico do ducto venoso (modelo FMF moderno). Opcional. Se a onda A categorizada (dv_awave) também for informada, ela prevalece.",
                "type": "number"
              },
              "eth": {
                "description": "Etnia materna. Afeta DV-PI e osso nasal.",
                "enum": ["White", "Black", "S Asian", "E Asian", "Mixed"],
                "type": "string"
              },
              "fbhcg_mom": {
                "description": "β-hCG livre MoM (já corrigido pelo laboratório). Sobrepõe fbhcg_raw_pg_ml se ambos informados.",
                "type": "number"
              },
              "fbhcg_raw_pg_ml": {
                "description": "β-hCG livre (subunidade β livre) valor bruto em pg/mL. Convertido para MoM aproximado. NÃO use β-hCG total — não é compatível com o algoritmo FMF.",
                "type": "number"
              },
              "fhr": {
                "description": "Frequência cardíaca fetal em bpm. Opcional.",
                "maximum": 220,
                "minimum": 80,
                "type": "number"
              },
              "ga_dias": {
                "description": "Idade gestacional em dias (ex: 84 = 12+0 sem). Validity: 77-99 dias (11+0 a 14+1).",
                "maximum": 99,
                "minimum": 77,
                "type": "integer"
              },
              "ma": {
                "description": "Idade materna em anos decimais (ex: 32.5). Clampada a [15, 50] internamente.",
                "maximum": 60,
                "minimum": 12,
                "type": "number"
              },
              "nb": {
                "description": "Osso nasal: present=presente (normal) ou absent=ausente (achado de risco). Opcional.",
                "enum": ["present", "absent"],
                "type": "string"
              },
              "nt_mm": {
                "description": "Translucência nucal em mm. Obrigatório.",
                "exclusiveMinimum": 0,
                "maximum": 15,
                "type": "number"
              },
              "pappa_mom": {
                "description": "PAPP-A MoM (já corrigido pelo laboratório). Sobrepõe pappa_raw_mu_l se ambos informados.",
                "type": "number"
              },
              "pappa_raw_mu_l": {
                "description": "PAPP-A valor bruto em mU/L (= mIU/mL). Convertido para MoM aproximado via curvas Kagan 2008 + correção por peso. Use quando o laudo só dá o bruto sem MoM.",
                "type": "number"
              },
              "prev_t13": {
                "description": "Gestações prévias afetadas com T13 (default 0). Eleva o prior de T13.",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "prev_t18": {
                "description": "Gestações prévias afetadas com T18 (default 0). Eleva o prior de T18.",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "prev_t21": {
                "description": "Gestações prévias afetadas com T21 (default 0). Eleva o prior de T21.",
                "maximum": 5,
                "minimum": 0,
                "type": "integer"
              },
              "smoker": {
                "description": "Fumante? Afeta osso nasal e tricúspide.",
                "type": "boolean"
              },
              "tr": {
                "description": "Regurgitação tricúspide: absent=ausente (normal) ou present=presente (achado de risco). Opcional.",
                "enum": ["absent", "present"],
                "type": "string"
              },
              "wt_kg": {
                "description": "Peso materno em kg. Default 70 se não informado.",
                "maximum": 250,
                "minimum": 30,
                "type": "number"
              }
            },
            "required": ["crl_mm", "ga_dias", "ma", "nt_mm"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
