                "type": "number"
              },
              "pwv_m_s": {
                "description": "PWV (pulse wave velocity) em m/s (apenas 36 sem).",
                "type": "number"
              },
              "pwv_mom": {
                "description": "PWV MoM (manual). Sobrescreve pwv_m_s.",
