        {
          "name": "calcular_idade_gestacional",
          "title": "Idade gestacional, data provável do parto e concepção",
          "description": "Idade gestacional, data provável do parto e concepção. IG, DPP e concepção por DUM (Naegele), CCN (Robinson-Fleming corrigida), biometria (Hadlock 1984) ou FIV/ICSI, e comparação DUM × USG pela regra ACOG CO 700.\nFaixa de validade: CCN de 5 a 84 mm. Biometria (Hadlock): idade calculada entre 12 e 42 semanas. Ciclo menstrual de 21 a 35 dias. FIV/ICSI: transferência em D3 ou D5.\nReferências: Regra de Naegele (DPP = DUM + 280 dias, ajustada pelo tamanho do ciclo). Robinson HP, Fleming JE. Br J Obstet Gynaecol 1975 — fórmula do CCN com correção 1,037. Hadlock FP et al. Radiology 1984 — idade gestacional por DBP, CC, CA e CF (15 combinações). ACOG/AIUM/SMFM Committee Opinion 700 (2017) — Methods for estimating the due date.\nPágina para o médico conferir: https://fetologia.com/calculadoras/idade-gestacional",
          "inputSchema": {
            "properties": {
              "ca_cm": {
                "description": "CA (Circunferência Abdominal) em cm.",
                "type": "number"
              },
              "cc_cm": {
                "description": "CC (Circunferência Cefálica) em cm.",
                "type": "number"
              },
              "ccn_mm": {
                "description": "Comprimento cabeça-nádega em milímetros (5-84 mm). Usado em modo \"ccn\" e \"comparar_dum_usg\" se método=ccn.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "cf_cm": {
                "description": "CF (Comprimento do Fêmur) em cm.",
                "type": "number"
              },
              "ciclo_dias": {
                "description": "Tamanho do ciclo em dias (default 28). Usado em modo \"dum\" e \"comparar_dum_usg\".",
                "maximum": 35,
                "minimum": 21,
                "type": "integer"
              },
              "data_referencia": {
                "description": "Data ISO (YYYY-MM-DD) para cálculo de IG hoje. Default: data atual.",
                "type": "string"
              },
              "data_transferencia": {
                "description": "Data ISO da transferência embrionária. Obrigatório em modo \"fiv\".",
                "type": "string"
              },
              "data_usg": {
                "description": "Data ISO (YYYY-MM-DD) do ultrassom. Obrigatório em modo \"ccn\", \"biometria\" e \"comparar_dum_usg\".",
                "type": "string"
              },
              "dbp_cm": {
                "description": "DBP (Diâmetro Biparietal) em cm. Usado em modo \"biometria\".",
                "type": "number"
              },
              "dia_transferencia": {
                "description": "Dia do desenvolvimento embrionário no transfer (3=clivagem, 5=blastocisto). Usado em modo \"fiv\".",
                "enum": [3, 5],
                "type": "integer"
              },
              "dum": {
                "description": "Data ISO (YYYY-MM-DD) da última menstruação. Obrigatório em modo \"dum\" e \"comparar_dum_usg\".",
                "type": "string"
              },
              "modo": {
                "description": "dum=cálculo por última menstruação (Naegele); ccn=por comprimento cabeça-nádega no 1º trim (Robinson-Fleming); biometria=Hadlock 1984 no 2º/3º trim; fiv=FIV/ICSI a partir de data de transferência; comparar_dum_usg=compara DUM com medida USG aplicando regra ACOG CO 700.",
                "enum": ["dum", "ccn", "biometria", "fiv", "comparar_dum_usg"],
                "type": "string"
              },
              "usg_metodo": {
                "description": "Em modo \"comparar_dum_usg\": qual método USG usar para comparação contra DUM.",
                "enum": ["ccn", "biometria"],
                "type": "string"
              }
            },
            "required": ["modo"],
            "type": "object"
          },
