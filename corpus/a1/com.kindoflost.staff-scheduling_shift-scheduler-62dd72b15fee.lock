      "serverInfo": {
        "name": "kindoflost-shift-scheduler",
        "title": "Kind of Lost — Staff Shift Scheduler",
        "version": "1.0.1",
        "websiteUrl": "https://staff-scheduling.kindoflost.com/mcp-server"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Builds optimized 24/7 staff rosters (nurses, guards, firefighters, plant crews, help desks...) with a real mixed-integer solver, not a heuristic. Hard rules (availability, skills, minimum rest between shifts, max consecutive days/nights, no day shift right after a night, max hours) are never broken; unfilled posts are allowed but penalised and reported. Typical flow: list_shift_examples -> get_shift_example to see the input shape -> edit it to the user's situation -> build_shift_roster -> if it returns status 'running', call get_shift_roster_result with the job_id. Limits: 60 people, 42 days, 12 shifts, 12 demand types. If unsure the tool fits, call check_request first. Send ONE build_shift_roster call at a time, never several in parallel: the solver runs one roster at a time and parallel calls just queue or get 'busy'. Free, no sign-up; web version at https://staff-scheduling.kindoflost.com/shift-schedule",
      "tools": [
        {
          "name": "build_shift_roster",
          "title": "Build an optimized shift roster",
          "description": "Solve a staff rostering problem to optimality with a MILP solver and return who works which shift each day, coverage, unfilled posts, hours per person and warnings. Solves take 5-60 s. Pass either `example` (to solve a built-in example as-is) or the roster input fields. If the result has status 'running', call get_shift_roster_result with its job_id. If it has status 'too_large', shorten the horizon or reduce people/shift types and retry. If it has status 'busy', wait the retry_after_seconds it gives and call again -- one call at a time, never in parallel. Safe defaults (e.g. the next 7 days when `days` is omitted) are listed in the result's `assumptions`; tell the user about them. Roster input. Minimal example: {\"days\": [\"2026-10-05\", \"2026-10-06\"], \"shifts\": [{\"shift\": \"Day\", \"start\": \"07:00\", \"end\": \"19:00\"}, {\"shift\": \"Night\", \"start\": \"19:00\", \"end\": \"07:00\", \"night\": \"yes\"}], \"demands\": [{\"name\": \"RN\", \"penalty\": 500}], \"people\": [{\"name\": \"Ana\", \"cost\": 40, \"max_hw\": 48}, ...], \"grids\": {\"RN\": {\"2026-10-05|Day\": 2, \"2026-10-05|Night\": 1}}, \"parameters\": {\"MinRestHours\": 11}}. Call get_shift_example for complete, realistic inputs.",
          "inputSchema": {
            "properties": {
              "days": {
                "description": "OPTIONAL. Day labels in order: ISO dates ('2026-10-05') or weekday names ('Mon'). Dates or weekdays enable weekend rules. Omit it to plan the next 7 days (ISO dates starting tomorrow); the default used is reported in the result's `assumptions`.",
                "items": {
                  "type": "string"
                },
                "maxItems": 42,
                "minItems": 1,
                "type": "array"
              },
              "demands": {
                "description": "Posts to fill (roles). Headcount per day/shift goes in grids.",
                "items": {
                  "properties": {
                    "concurrent": {
                      "description": "true = the same person may cover this and another demand at once.",
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "penalty": {
                      "description": "Cost of leaving ONE post unfilled for one shift. Must be well above one person's pay for a shift or the solver will prefer gaps. Omitted = 10 x the highest hourly cost x the longest shift.",
                      "type": "number"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "example": {
                "description": "Solve this built-in example instead of passing the fields below.",
                "enum": ["hospital-ward", "three-shift-plant", "security-site", "fire-station", "support-desk"],
                "type": "string"
              },
              "goal": {
                "description": "One sentence, in the user's own words, of what they are trying to do (e.g. 'a 4-week nurse rota for 12 nurses on 12-hour shifts'). Optional; helps improve the tool.",
                "maxLength": 300,
                "type": "string"
              },
              "grids": {
                "additionalProperties": {
                  "type": "object"
                },
                "description": "Optional per-day/shift cells, keyed by a demand name or a person name, each an object keyed 'DAY|SHIFT'. Demand grid value = headcount required (demand with no grid = 1 on every shift). Person grid value: 'a' or 1 = available, 'f' = must work, 0 or missing = UNAVAILABLE (person with no grid = available everywhere).",
                "type": "object"
              },
              "parameters": {
                "description": "Optional rules. MinRestHours (11), MaxConsecutiveDays (6), MaxConsecutiveNights (4), ForbidDayAfterNight ('yes'), NightStartsAfter ('18:00'), MinBlockDays (1), WeekendFairnessPenalty (0), EquityPenalty (0) = even out total hours, NightEquityPenalty (0) = even out total nights (try 20), NightDifferential (1.0), WeekendDifferential (1.0), TimeLimitSeconds (max 60 here), GapPercent (2).",
                "type": "object"
              },
              "people": {
                "items": {
                  "properties": {
                    "cost": {
                      "description": "Cost per hour (default 1).",
                      "type": "number"
                    },
                    "max_dw": {
                      "description": "Max days worked over the WHOLE roster.",
                      "type": "number"
                    },
                    "max_hd": {
                      "description": "Max hours per day (default 24).",
                      "type": "number"
                    },
                    "max_hw": {
                      "description": "Max hours over the WHOLE roster (hard). Not per week: for a 28-day roster at 40h/week use 160.",
                      "type": "number"
                    },
                    "min_dw": {
                      "description": "Min days worked over the WHOLE roster.",
                      "type": "number"
                    },
                    "min_hd": {
                      "description": "Min hours per worked day.",
                      "type": "number"
                    },
                    "min_hw": {
                      "description": "Min hours over the WHOLE roster (soft).",
                      "type": "number"
                    },
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "shifts": {
                "description": "Shift types. A shift may cross midnight (end < start).",
                "items": {
                  "properties": {
                    "end": {
                      "description": "HH:MM",
                      "type": "string"
                    },
                    "night": {
                      "description": "'yes' = counts as a night shift. Omitted = decided from NightStartsAfter.",
                      "type": ["string", "boolean"]
                    },
                    "shift": {
                      "description": "Shift name, e.g. 'Day'.",
                      "type": "string"
                    },
                    "start": {
                      "description": "HH:MM",
                      "type": "string"
                    }
                  },
                  "required": ["end", "shift", "start"],
                  "type": "object"
                },
                "maxItems": 12,
                "minItems": 1,
                "type": "array"
              },
              "skills": {
                "description": "Who can cover which demand. Omitted = everyone can cover every demand.",
                "items": {
                  "properties": {
                    "demand": {
                      "type": "string"
                    },
                    "person": {
                      "type": "string"
                    },
                    "rate": {
                      "description": "Posts covered per person (default 1).",
                      "type": "number"
                    }
                  },
                  "required": ["demand", "person"],
                  "type": "object"
                },
                "type": "array"
              },
              "wait_seconds": {
                "description": "How long to wait for the solve inside this call (default 25).",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build an optimized shift roster"
          },
          "behavior": {
            "destructive": false,
