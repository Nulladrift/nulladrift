        {
          "name": "get_advertiser_ads_dossier",
          "title": "Get Competitor Brand & Advertiser Commercial Ad Dossier",
          "description": "Fetch a unified competitor advertiser dossier across Meta Ad Library and Google Ads Transparency by domain (e.g. \"monday.com\") or brand name. Returns verified advertiser status, approx Google active ads count, format breakdown, top CTAs, top destination landing pages, longest running creative days, and active ads. Cost: 2 Credits / ad returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "advertiser": {
                "description": "Brand or company name (optional if domain is provided).",
                "type": "string"
              },
              "country": {
                "default": "US",
                "description": "2-letter ISO country code (default \"US\").",
                "type": "string"
              },
              "domain": {
                "description": "Target competitor domain (e.g. \"monday.com\", \"shopify.com\", \"notion.so\").",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Max ads to include (1–50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "default": "all",
                "description": "Ad platform filter: all, social, or search.",
                "enum": ["all", "social", "search"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "0 on success, -1 on error.",
                "type": "integer"
              },
              "data": {
                "description": "Unified Meta + Google advertiser creative dossier.",
                "properties": {
                  "ads": {
                    "description": "Sampled active commercial creatives across Meta and Google.",
                    "items": {
                      "description": "Normalized commercial ad creative returned from Meta Ad Library or Google Ads Transparency.",
                      "properties": {
                        "active_days": {
                          "description": "Days the creative has been running (longevity / winner signal).",
                          "type": "integer"
                        },
                        "ad_id": {
                          "description": "Unique platform-prefixed ad creative identifier.",
                          "type": "string"
                        },
                        "advertiser_domain": {
                          "description": "Normalized destination root domain.",
                          "type": "string"
                        },
                        "advertiser_name": {
                          "description": "Advertiser page or verified brand name.",
                          "type": "string"
                        },
                        "body_text": {
                          "description": "Ad hook / primary body copy.",
                          "type": "string"
                        },
                        "creative_format": {
                          "description": "Creative media format (video, image, carousel, text, dco).",
                          "type": "string"
                        },
                        "cta_text": {
                          "description": "Call-to-action button label.",
                          "type": "string"
                        },
                        "headline": {
                          "description": "Primary ad headline text.",
                          "type": "string"
                        },
                        "is_active": {
                          "description": "Whether the ad is currently active.",
                          "type": "boolean"
                        },
                        "landing_page_url": {
                          "description": "Destination landing page URL.",
                          "type": "string"
                        },
                        "platform": {
                          "description": "Source ad network (\"meta\" or \"google\").",
                          "type": "string"
                        },
                        "preview_url": {
                          "description": "Image thumbnail or creative preview URL.",
                          "type": "string"
                        },
                        "video_hd_url": {
                          "description": "Direct HD MP4 video creative URL when available.",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "advertiser": {
                    "description": "Brand-level summary metrics including verified status, active Google ad count, top CTAs, and longest running days.",
                    "properties": {
                      "approx_google_ads_count": {
                        "description": "Approximate active Google Ads creative count.",
                        "type": "integer"
                      },
                      "brand_name": {
                        "description": "Verified advertiser or page display name.",
                        "type": "string"
                      },
                      "domain": {
                        "description": "Normalized brand domain.",
                        "type": "string"
                      },
                      "longest_running_days": {
                        "description": "Longest running active creative duration in days.",
                        "type": "integer"
                      },
                      "platforms_detected": {
                        "description": "Detected active ad rails.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array"
                      },
                      "verified": {
                        "description": "Whether verified on Google Ads Transparency.",
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  }
                },
                "required": ["ads", "advertiser"],
                "type": "object"
              },
              "provider": {
                "description": "Gateway origin URL.",
                "type": "string"
              },
              "status": {
                "description": "Response status (\"ok\" or \"error\").",
                "type": "string"
