      },
      "instructions": "Search active commercial Meta (Facebook/Instagram) and Google Ads Transparency creatives, competitor brand dossiers, hook copy, CTAs, and live landing page tracking pixel audits. Handshake and tools/list are free; pass x-api-key (ad_live_...) for tools/call. Claim 3,000 Free Credits ($0.30) on sign-up — No Card Required at https://adslibraryapi.com/signup.",
      "tools": [
        {
          "name": "audit_ad_landing_page",
          "title": "Audit Ad Destination Landing Page Headline, Offer, CTAs & Tracking Pixels",
          "description": "Inspect any commercial ad landing page URL in real time: extracts above-the-fold H1 headline, offer structure (pricing mentions, free trial, demo CTA, discounts, no-credit-card claims), primary CTAs, redirect hops, and 12 tracking pixels (meta_pixel, gtag, gtm, tiktok_pixel, linkedin_insight, hubspot, klaviyo, segment, hotjar, clarity). Cost: 10 Credits / audit.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public HTTP/HTTPS ad destination URL (e.g. \"https://monday.com\").",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "code": {
                "description": "0 on success, -1 on error.",
                "type": "integer"
              },
              "data": {
                "description": "Live landing page funnel teardown and tracking pixel inspection.",
                "properties": {
                  "ctas": {
                    "description": "Detected primary CTA button/link labels.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "final_url": {
                    "description": "Final resolved URL after redirects.",
                    "type": "string"
                  },
                  "headline": {
                    "description": "Primary above-the-fold H1 headline.",
                    "type": "string"
                  },
                  "http_status": {
                    "description": "HTTP status code returned by the landing page.",
                    "type": "integer"
                  },
                  "offer_signals": {
                    "description": "Detected commercial offer signals (free_trial, discount, demo, guarantee).",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "subheadlines": {
                    "description": "Extracted H2/H3 value proposition headings.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "title": {
                    "description": "HTML document title.",
                    "type": "string"
                  },
                  "tracking_pixels": {
                    "additionalProperties": true,
                    "description": "Boolean flags and list of detected ad/analytics tracking pixels (meta_pixel, gtag, gtm, tiktok_pixel, linkedin_insight, hubspot, klaviyo, etc.).",
                    "type": "object"
                  },
                  "url": {
                    "description": "Requested destination URL.",
                    "type": "string"
                  }
                },
                "required": ["http_status", "tracking_pixels", "url"],
                "type": "object"
              },
              "provider": {
                "description": "Gateway origin URL.",
                "type": "string"
              },
              "status": {
                "description": "Response status (\"ok\" or \"error\").",
                "type": "string"
              }
            },
            "required": ["code", "data", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
