{
  "lockfileVersion": 2,
  "subjects": {
    "com.getzeroslide/singapore-companies": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://getzeroslide.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "getzeroslide",
        "title": "GetZeroslide Singapore company register",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Facts about Singapore companies from the official ACRA open data. Use search_companies to find a UEN, then lookup_uen for details.",
      "tools": [
        {
          "name": "lookup_uen",
          "description": "Look up one Singapore company by its UEN (Unique Entity Number). Returns name, status, type, registration date, industry, address, officer count and former names from ACRA.",
          "inputSchema": {
            "properties": {
              "uen": {
                "description": "UEN, e.g. 201912345K",
                "type": "string"
              }
            },
            "required": ["uen"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e4a909a75c8af79351ca2623d4233c83f1fc37b0038012c70fc4543876932b6a"
        },
        {
          "name": "new_companies",
          "description": "List companies registered in Singapore in the last N days before the latest data date, optionally for one SSIC code.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 30,
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 50,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "ssic": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20e1ef70c84c1aa332faf5027d1b6b0e062f1b7642dcc20f5555bda5bd693b6c"
        },
        {
          "name": "search_companies",
          "description": "Search Singapore companies by current or former name. Optional filters: SSIC industry code, postal code, live only.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "live_only": {
                "default": true,
                "type": "boolean"
              },
              "postal": {
                "description": "6-digit postal code",
                "type": "string"
              },
              "query": {
                "description": "Company name or part of it",
                "type": "string"
              },
              "ssic": {
                "description": "SSIC code, e.g. 62011",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5d12c2a95b68e83bf6125bccd77ac490c8279358072094655f088c99304dc9c9"
        }
      ],
      "digest": "sha256:16841aaf309e261c77fe9e09d152355ddc44016d07cf74c6c1f0ffc7cd4541dc"
    }
  }
}
