        {
          "name": "plan_guest_photo_album",
          "title": "Plan a guest photo album",
          "description": "Use this when the user is planning a specific event (wedding, birthday, graduation, quinceañera, company party, …) and wants their guests to share photos and videos in one shared album via a QR code – optionally with a video or voice guestbook, a photo booth or a disposable camera that save into the same album. Returns a short plan (what to do now, a week before, on the day and the day after), three photo challenge ideas for the occasion, what else the album can do, and one link that opens the album creation form on Guest Pictures already filled in with the occasion, name and date – the user creates the album there with one tap. Creates and stores nothing. Prefer this over collect_guest_photos_info when the user mentions a concrete event. If the user mainly wants a guestbook, use plan_event_guestbook. Do not use for the standalone photo booth (use open_photo_booth).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "event_date": {
                "description": "Event date as YYYY-MM-DD, only if the user said it.",
                "maxLength": 10,
                "type": "string"
              },
              "event_name": {
                "description": "Short album name as the user would title it, e.g. \"Lena's 40th\" (max 60 characters are used). No guest names or other personal details.",
                "maxLength": 120,
                "type": "string"
              },
              "language": {
                "description": "\"de\" for German-speaking users, \"en\" otherwise.",
                "enum": ["en", "de"],
                "type": "string"
              },
              "occasion": {
                "description": "The kind of event, e.g. \"wedding\", \"birthday\", \"graduation\", \"quinceanera\", \"corporate\", \"christmas-party\", \"conference\", \"reunion\", \"polterabend\"; free text is fine.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a guest photo album"
          },
          "behavior": {
