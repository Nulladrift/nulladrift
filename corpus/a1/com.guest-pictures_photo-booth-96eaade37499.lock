        {
          "name": "plan_event_guestbook",
          "title": "Plan a video or voice guestbook",
          "description": "Use this when the user wants a video guestbook, a voice guestbook, a phone or voicemail guestbook (like a retro guestbook phone) or video messages from guests for a wedding, birthday or any event, without any equipment. Guests scan a QR code and record in their phone's browser: video messages up to 60 seconds, or voice messages on a retro phone screen with an optional selfie. Returns how it works, setup tips for the day and one link that opens the album creation form on Guest Pictures already filled in with the occasion, name and date. Creates and stores nothing. Do not use when the user only wants guests' photos (use plan_guest_photo_album) or a photo booth (use open_photo_booth).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "event_date": {
                "description": "Event date as YYYY-MM-DD, only if the user said it.",
                "maxLength": 10,
                "type": "string"
              },
              "event_name": {
                "description": "Short album name as the user would title it, e.g. \"Mia & Leo's wedding\" (max 60 characters are used). No guest names or other personal details.",
                "maxLength": 120,
                "type": "string"
              },
              "kind": {
                "description": "\"video\" for video messages, \"voice\" for an audio / phone guestbook, \"both\" if the user wants both or didn't say. Defaults to \"both\".",
                "enum": ["video", "voice", "both"],
                "type": "string"
              },
              "language": {
                "description": "\"de\" for German-speaking users, \"en\" otherwise.",
                "enum": ["en", "de"],
                "type": "string"
              },
              "occasion": {
                "description": "The kind of event, e.g. \"wedding\", \"birthday\", \"anniversary\", \"graduation\", \"corporate\"; free text is fine.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan a video or voice guestbook"
          },
          "behavior": {
