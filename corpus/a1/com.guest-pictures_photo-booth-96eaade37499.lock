      "instructions": "Offers a browser-based photo booth (photobooth-free.com / fotobox-online.com). The booth runs in the user's browser and needs a camera; it cannot take photos inside the chat. The card lets the user preview effects and pick an effect, layout and caption before opening the booth. Pass language \"de\" for German-speaking users, \"en\" otherwise.",
      "tools": [
        {
          "name": "collect_guest_photos_info",
          "title": "Collect guest photos via QR code",
          "description": "Use this when the user wants their guests to upload their own photos from their phones into one shared event album (e.g. via a QR code at a wedding or party). Returns how QR photo collection works, what to check and practical tips, plus one option by the same developer (Guest Pictures). Do not use when the user just wants a photo booth (use open_photo_booth).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "language": {
                "description": "\"de\" for German-speaking users, \"en\" otherwise.",
                "enum": ["en", "de"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
