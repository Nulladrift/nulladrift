        {
          "name": "open_photo_booth",
          "title": "Open photo booth",
          "description": "Use this when the user wants a photo booth, selfie booth or \"Fotobox\" for a party, wedding, birthday, office party or any event, or wants to take fun group photos with effects on a phone, tablet or laptop. Shows a card with example images of all effects where the user picks an effect, a collage layout and an optional caption, then opens the browser photo booth with those settings in a new tab (no signup, no app; photos stay on the device). Also returns how it works and effect suggestions for the occasion. The booth cannot take photos inside the chat. Do not use for editing existing photos or for collecting photos from guests (use collect_guest_photos_info for that).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "caption": {
                "description": "Short caption for the bottom of the collage if the user gave one, e.g. names and date (\"Emma & Noah · 12.06.\"). Max 40 characters are used.",
                "maxLength": 80,
                "type": "string"
              },
              "effect": {
                "description": "Effect the user asked for, if any. It is preselected in the card and the booth link.",
                "enum": ["none", "mix", "challenge", "digicam", "classic", "polaroid", "big-head", "meme", "mugshot", "magazine", "instagram", "breaking-news", "vintage-film", "halloween", "christmas"],
                "type": "string"
              },
              "language": {
                "description": "Language of the booth: \"de\" for German-speaking users, \"en\" otherwise. Match the language of the conversation.",
                "enum": ["en", "de"],
                "type": "string"
              },
              "layout": {
                "description": "Collage layout the user asked for, if any: \"square\" (2×2), \"column\" (photo strip), \"postcard\", \"instant\" (instant-photo frame) or \"feed\" (social post). Defaults to \"square\".",
                "enum": ["square", "column", "postcard", "instant", "feed"],
                "type": "string"
              },
              "occasion": {
                "description": "Occasion in a few words, e.g. \"wedding\", \"birthday\", \"office party\", \"Halloween\". Used only to suggest effects.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "boothUrl": {
                "type": "string"
              },
              "brand": {
                "type": "string"
              },
              "caption": {
                "type": "string"
              },
              "captionMax": {
                "type": "number"
              },
              "effect": {
                "anyOf": [
                  {
                    "enum": ["none", "mix", "challenge", "digicam", "classic", "polaroid", "big-head", "meme", "mugshot", "magazine", "instagram", "breaking-news", "vintage-film", "halloween", "christmas"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "effectLabel": {
                "type": ["string", "null"]
              },
              "effects": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "type": "string"
                    },
                    "id": {
                      "enum": ["none", "mix", "challenge", "digicam", "classic", "polaroid", "big-head", "meme", "mugshot", "magazine", "instagram", "breaking-news", "vintage-film", "halloween", "christmas"],
                      "type": "string"
                    },
                    "image": {
                      "type": ["string", "null"]
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["description", "id", "image", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "language": {
                "enum": ["en", "de"],
                "type": "string"
              },
              "layout": {
                "enum": ["square", "column", "postcard", "instant", "feed"],
                "type": "string"
              },
              "layouts": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "enum": ["square", "column", "postcard", "instant", "feed"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "steps": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "suggestedEffects": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "enum": ["none", "mix", "challenge", "digicam", "classic", "polaroid", "big-head", "meme", "mugshot", "magazine", "instagram", "breaking-news", "vintage-film", "halloween", "christmas"],
                      "type": "string"
                    },
                    "label": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "label"],
                  "type": "object"
                },
                "type": "array"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["boothUrl", "brand", "caption", "captionMax", "effect", "effectLabel", "effects", "language", "layout", "layouts", "steps", "suggestedEffects", "url"],
            "type": "object"
          },
