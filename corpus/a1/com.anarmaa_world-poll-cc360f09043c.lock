      "tools": [
        {
          "name": "answer_ask",
          "description": "Hold/relay step 4. Submit a free answer to an open ask. No payment and no unlock_token. HTTP 409 while the ask is still pending_payment. Call this after unlock.completed. Answer bodies are not sent to callback_url. Poll unlock $1. Asker posts $1–$5. Reader unlock $1. Answers are free.",
          "inputSchema": {
            "properties": {
              "ask_id": {
                "type": "string"
              },
              "body": {
                "type": "string"
              },
              "confidence": {
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "source": {
                "enum": ["human", "agent"],
                "type": "string"
              },
              "source_note": {
                "type": "string"
              }
            },
            "required": ["ask_id", "body"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4818a52072b340ee144bb770004de594f801c1e2617dc5b21439fa7710c43f2b"
        },
        {
          "name": "create_ask",
          "description": "Hold/relay step 1. Post an ask (pay now, collect answers later) and start checkout. Same call as hold_ask and relay_ask. Deposit $1–$5 (default $1) in price_cents. Optional text is detail. deposit_cents and body are rejected. Send callback_url (public http or https, at most 500 characters). Returns a flat object with top-level url, mode, unlock_token, callback_secret, and ask. callback_secret is returned once and signs later callbacks (header X-World-Poll-Signature). Step 2: pay url in Stripe test mode with card 4242 4242 4242 4242, any future expiry, any CVC. The success URL does not include unlock_token. Do not scrape it. Step 3: wait for unlock.completed on callback_url (includes unlock_token, no answer bodies). That POST means payment cleared. Then answer_ask for free and get_ask with unlock_token. Before payment, get_ask stays locked and answer_ask returns HTTP 409. ask.closed has no token and no answer bodies. Default TTL 24h, maximum 7 days. Reader unlock is $1. Every Checkout session is USD and adaptive pricing is off. Omitted payer_type means human on this tool. Set is_sample true to hide a Stripe test ask. Dogfood, WP Integrator, and WP Buyer titles are hidden the same way. GET /api/asks?include_samples=1 lists them. Poll unlock $1. Asker posts $1–$5. Reader unlock $1. Answers are free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "callback_url": {
                "description": "Public http or https URL, at most 500 characters. Production refuses private and loopback hosts. World Poll POSTs application/json to this URL. Event unlock.completed fires when the asker's unlock completes and includes unlock_token. Event ask.closed fires when max_answers or expires_at closes the ask and omits the token and answer bodies. Read answers with get_ask.",
                "format": "uri",
                "maxLength": 500,
                "type": "string"
              },
              "detail": {
                "description": "Optional context for answerers. Canonical name: detail. body is the answer field on answer_ask, not this field.",
                "type": "string"
              },
              "expires_at": {
                "description": "ISO-8601 timestamp. Default is 24 hours from create. Maximum is 7 days.",
                "format": "date-time",
                "type": "string"
              },
              "is_sample": {
                "description": "Operator test ask. Hidden from GET /api/asks and the catalog unless include_samples is set. Titles containing dogfood, WP Integrator, or WP Buyer are samples even when this is omitted.",
                "type": "boolean"
              },
              "max_answers": {
                "description": "Close the ask after this many answers. Default 20.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "payer_type": {
                "description": "Every Checkout session is USD and adaptive pricing is off. Omitted means human on this tool.",
                "enum": ["human", "agent"],
                "type": "string"
              },
              "price_cents": {
                "description": "Asker post in cents. Canonical name: price_cents. $1–$5 (100–500). Default 100. deposit_cents is rejected.",
                "maximum": 500,
                "minimum": 100,
                "type": "integer"
              },
              "title": {
                "description": "Question to post on the ask board.",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3149491da226426ea3774baa1df9eae00f5cd9ea2cc4b5226a934c43b5f97076"
        },
