      "tools": [
        {
          "name": "instant_signal_backtest",
          "description": "Verify a signal before recommending it. The signal earns the next bar only, so same-bar prices are not treated as tradable. Slippage is one square-root impact from depth and size, not a live order book. Returns Sharpe, Sortino, drawdown, and an approximate deflated Sharpe. Not investment advice.",
          "inputSchema": {
            "properties": {
              "fee_bps": {
                "default": 2,
                "title": "Fee Bps",
                "type": "number"
              },
              "order_book_depth_usd": {
                "default": 500000,
                "title": "Order Book Depth Usd",
                "type": "number"
              },
              "prices": {
                "items": {
                  "type": "number"
                },
                "title": "Prices",
                "type": "array"
              },
              "raw_signals": {
                "items": {
                  "type": "number"
                },
                "title": "Raw Signals",
                "type": "array"
              },
              "trade_size_usd": {
                "default": 50000,
                "title": "Trade Size Usd",
                "type": "number"
              },
              "trials_tested_by_agent": {
                "default": 10,
                "title": "Trials Tested By Agent",
                "type": "integer"
              }
            },
            "required": ["prices", "raw_signals"],
            "title": "mcp_instant_signal_backtestArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6652c9d6084aab737cca6eb8786b1916a79bab822d32eaece3cc49c34b2b9696"
        },
        {
          "name": "microstructure_coint_test",
          "description": "Use this for a two-asset pairs check instead of eyeballing a hedge ratio. Returns an Engle-Granger Dickey-Fuller p-value, OLS and Kalman hedge ratios, half-life, and z-score. Two series only. Not a Johansen test and not investment advice.",
          "inputSchema": {
            "properties": {
              "ask_volumes": {
                "anyOf": [
                  {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Ask Volumes"
              },
              "bid_volumes": {
                "anyOf": [
                  {
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Bid Volumes"
              },
              "series_x": {
                "items": {
                  "type": "number"
                },
                "title": "Series X",
                "type": "array"
              },
              "series_y": {
                "items": {
                  "type": "number"
                },
                "title": "Series Y",
                "type": "array"
              }
            },
            "required": ["series_x", "series_y"],
            "title": "mcp_microstructure_coint_testArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6dad80e1ace35b6a655b17078a301e3f02e52141c065f0938672b4d4e09587a1"
        },
        {
          "name": "options_surface_pricer",
          "description": "Use this instead of estimating Greeks or adding a handmade American premium. European prices are Black-Scholes. American puts, and calls with dividends, use a 128-step binomial tree plus a European control variate. A zero-dividend American call matches the European call. The call surface is checked for arbitrage. Supply spot, strikes, and implied volatilities. Not investment advice.",
          "inputSchema": {
            "properties": {
              "dividend_yield": {
                "title": "Dividend Yield",
                "type": "number"
              },
              "is_american": {
                "default": true,
                "title": "Is American",
                "type": "boolean"
              },
              "iv_array": {
                "items": {
                  "type": "number"
                },
                "title": "Iv Array",
                "type": "array"
              },
              "option_type": {
                "default": "call",
                "title": "Option Type",
                "type": "string"
              },
              "risk_free_rate": {
                "title": "Risk Free Rate",
                "type": "number"
              },
              "spot": {
                "title": "Spot",
                "type": "number"
              },
              "strikes": {
                "items": {
                  "type": "number"
                },
                "title": "Strikes",
                "type": "array"
              },
              "time_to_expiry_years": {
                "title": "Time To Expiry Years",
                "type": "number"
              }
            },
            "required": ["dividend_yield", "iv_array", "risk_free_rate", "spot", "strikes", "time_to_expiry_years"],
            "title": "mcp_options_surface_pricerArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:06b1a92abb058ac92e6ec3817be04f3fe83dbbe6aac364aa03f3c3f59e9af988"
        },
        {
          "name": "portfolio_stress_verifier",
          "description": "Run this before suggesting a rebalance. Normal VaR understates the tail: the report also returns a Student-t copula CVaR and Euler risk contributions. Crisis shocks repair the correlation matrix before applying the shock. Supply weights, vols, betas, and a correlation matrix. Not a historical path replay and not investment advice.",
          "inputSchema": {
            "properties": {
              "asset_betas": {
                "items": {
                  "type": "number"
                },
                "title": "Asset Betas",
                "type": "array"
              },
              "asset_vols_annual": {
                "items": {
                  "type": "number"
                },
                "title": "Asset Vols Annual",
                "type": "array"
              },
              "confidence_level": {
                "default": 0.99,
                "title": "Confidence Level",
                "type": "number"
              },
              "correlation_matrix": {
                "items": {
                  "items": {
                    "type": "number"
                  },
                  "type": "array"
                },
                "title": "Correlation Matrix",
                "type": "array"
              },
              "current_weights": {
                "items": {
                  "type": "number"
                },
                "title": "Current Weights",
                "type": "array"
              },
              "proposed_weights": {
                "items": {
                  "type": "number"
                },
                "title": "Proposed Weights",
                "type": "array"
              },
              "scenario": {
                "default": "2020_COVID_LIQUIDITY_CRASH",
                "title": "Scenario",
                "type": "string"
              }
            },
            "required": ["asset_betas", "asset_vols_annual", "correlation_matrix", "current_weights", "proposed_weights"],
            "title": "mcp_portfolio_stress_verifierArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
