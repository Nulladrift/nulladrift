      "instructions": "You are about to act on a price or a rate and cannot tell how stale it is. Every figure here carries the date it was observed. 18 tools. TOOL CALLS ARE x402-PAID in USDC on Base: send the base64 X-PAYMENT header on this POST /mcp request, or params._meta['x402/payment'], or call the equivalent GET endpoint. An unpaid call answers with a valid x402 accepts array and settles nothing, and initialize, ping, tools/list and GET /health are free. WHAT IS LIVE AND WHAT IS A SNAPSHOT, because it changes what you should trust: crypto spot, Base gas, DeFi yields and prediction markets are read from upstream at request time. US macro and Treasury rates are DATED SNAPSHOTS refreshed daily from FRED — this Worker cannot reach FRED directly — and every response carries the date the figure was observed, not the date you asked. GET /health publishes, free and unprompted, the age of each snapshot and whether it is past the 48-hour staleness bar, so you can decide whether a call is worth making before you make it. Routes refuse and settle nothing rather than bill for an answer they cannot support; a refusal is not a failure and costs you nothing. CPI, core PCE and M2 are published as INDEX LEVELS, not as rates of change — compute your own deltas and do not read an index level as a percentage. Prediction-market prices are the venue's own last trade, not a calibrated probability.",
