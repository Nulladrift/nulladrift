        "name": "autogrok-desk",
        "title": "AUTOGROK Desk",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "AUTOGROK Desk micro-jobs. Listing tools is free; each job tool costs a fixed USDC price via x402 on Base (or prepaid pack credits via header X-Entitlement-Key). brief is async: call brief_status (free) with the returned id.",
      "tools": [
        {
          "name": "brief",
          "title": "Brief ($0.25)",
          "description": "Research brief with cited sources on any topic, written to order (not instant). Returns a job id and due time right away; the finished brief (title, summary, markdown body, source links, word count) is ready within 24 hours, usually the same day, at GET /v1/jobs/:id, which is free. About 500 words by default (50-1500 via max_words), with at least 3 cited public web sources. Price: $0.25 USDC per call (x402 on Base) or 1 prepaid pack credit. Failed calls aren't charged when you pay per call with x402: if the job errors, the USDC payment is never settled. With pack credits (X-Entitlement-Key), a call that fails gives its credit back.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "max_words": {
                "description": "Target length (50–1500 words, default 500)",
                "maximum": 1500,
                "minimum": 50,
                "type": "integer"
              },
              "topic": {
                "description": "What the brief should cover",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "autogrok/price": "$0.25",
            "autogrok/sku": "brief"
          },
          "digest": "sha256:6f499bd8519582cbaa12784f88d7f756ab93b308522e2f349fdde165234ecb40"
        },
        {
          "name": "brief_status",
          "title": "Brief status (free)",
          "description": "Free. Check a brief ordered with the brief or deep_brief tool. Delivered within 24h (usually same day): ~500 words by default (50–1500), at least 3 cited source links. Returns status, dueBy, and result {title, summary, body_markdown, sources, word_count} when done.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Job id returned by brief",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:520b360548f3c30635e091b0bdb79d4369e89c1bac165433062a85d04a857ef3"
        },
        {
          "name": "deep_brief",
          "title": "Deep brief ($9.00)",
          "description": "In-depth research report with cited sources, for decisions that need more than a quick note. About 1,500 words (1,200-2,000) with an executive summary, key findings and analysis, at least 8 cited public sources, and an operator check before delivery. Returns a job id and due time right away; the report is ready within 24 hours at GET /v1/jobs/:id, which is free. Free sample: /samples/brief-x402-bazaar-discovery.md Price: $9.00 USDC per call (x402 on Base) or 1 prepaid pack credit. Failed calls aren't charged when you pay per call with x402: if the job errors, the USDC payment is never settled. With pack credits (X-Entitlement-Key), a call that fails gives its credit back.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "focus": {
                "description": "Optional angle, audience, or questions to answer",
                "maxLength": 2000,
                "type": "string"
              },
              "topic": {
                "description": "What the deep brief should cover",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "autogrok/price": "$9.00",
            "autogrok/sku": "deep-brief"
          },
          "digest": "sha256:ea9f65f8a45389beb607bc70c55b8985622f7d2442a75de1fe3eeeb54d85e54a"
        },
        {
          "name": "json_shape",
          "title": "JSON shape ($0.15)",
          "description": "Turn messy text into structured JSON. Parses a JSON blob or key: value lines (up to 50,000 characters) into an object using the field names given in schema_hint, and returns notes on what matched. Rule-based parsing with no LLM, so results are fast and predictable. Useful for normalizing tool output, logs or form dumps before further processing. Not for free-form language understanding or writing. Price: $0.15 USDC per call (x402 on Base) or 1 prepaid pack credit. Failed calls aren't charged when you pay per call with x402: if the job errors, the USDC payment is never settled. With pack credits (X-Entitlement-Key), a call that fails gives its credit back.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "schema_hint": {
                "description": "Free-text hint of desired field names / shape",
                "maxLength": 2000,
                "minLength": 1,
                "type": "string"
              },
              "text": {
                "description": "Raw text or JSON to reshape (≤50k chars)",
                "maxLength": 50000,
                "type": "string"
              }
            },
            "required": ["schema_hint", "text"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "autogrok/price": "$0.15",
            "autogrok/sku": "json-shape"
          },
          "digest": "sha256:df8cf33b0baa66902f55780d3d6d0cfd64298391102b5ab2259f27293b73cbd8"
        },
        {
          "name": "page_extract",
          "title": "Page extract ($0.05)",
          "description": "Extract the readable text of a web page as clean markdown. Fetches one public http(s) HTML page and returns its main content as markdown, plus title, meta description, byline and a short excerpt, with menus and page clutter removed. Useful for summarizing, quoting, or feeding a page to an LLM or RAG index without a browser. Not for logged-in, paywalled or non-HTML URLs (such as PDFs); private hosts are refused. Price: $0.05 USDC per call (x402 on Base) or 1 prepaid pack credit. Failed calls aren't charged when you pay per call with x402: if the job errors, the USDC payment is never settled. With pack credits (X-Entitlement-Key), a call that fails gives its credit back.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "Public http(s) HTML page URL",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "autogrok/price": "$0.05",
            "autogrok/sku": "page-extract"
          },
          "digest": "sha256:65101db420308f19493709572f58db8803d01711bc60cade5b60705c91b85455"
        },
        {
          "name": "support_request",
          "title": "Ask a person for help (free)",
          "description": "Open a support ticket with the people behind AUTOGROK Desk (payment or receipt, a failed job, credits, anything else). Send X-Entitlement-Key on the connection or include an email. Returns a ticket id like HELP-XXXX. No automatic reply is sent; a person answers, usually within 1 business day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Where to reply. Defaults to the pack's checkout email.",
                "format": "email",
                "maxLength": 254,
                "type": "string"
              },
              "message": {
                "description": "What happened, in a few sentences. Include a job id if you have one.",
                "maxLength": 2000,
                "minLength": 3,
                "type": "string"
              },
              "topic": {
                "description": "payment = payment or receipt; job = a job failed or looks wrong; credits = credits or balance; other",
                "enum": ["payment", "job", "credits", "other"],
                "type": "string"
              }
            },
            "required": ["message", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5fbb84c65fce4dbd8808b7517ca60f65f081a1974974b3aff3f2893495451d80"
        },
        {
          "name": "tip_remaining",
          "title": "Tip what's left (free to call)",
          "description": "When you're done with a pack, tip everything left on it (unused credits at the price paid + pack balance) to AUTOGROK Desk. No new charge; it clears the pack to zero and can't be undone. Needs header X-Entitlement-Key. Call with confirm=false (or omit) to see the amount; then confirm=true with expect_usd set to that amount.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "confirm": {
                "description": "Must be true to tip. Omit or false to preview the amount only.",
                "type": "boolean"
              },
              "expect_usd": {
                "description": "The total you previewed, e.g. \"0.45\". The tip is refused if the total changed.",
                "maxLength": 16,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e3f3fa13813894189bbfd0db0ba68f6c4d2ce7352bd27e1845cb560c1730f83b"
        },
        {
          "name": "url_probe",
          "title": "URL probe ($0.03)",
          "description": "Check if a URL is up. Sends a HEAD request (GET fallback that reads at most 8 KB) to a public http(s) URL and returns the HTTP status code, ok true/false, final URL after redirects, content type, content length and response time in ms. A cheap uptime, health or broken-link check before a heavier fetch. Public hosts only; private, local and logged-in URLs are refused. Price: $0.03 USDC per call (x402 on Base) or 1 prepaid pack credit. Failed calls aren't charged when you pay per call with x402: if the job errors, the USDC payment is never settled. With pack credits (X-Entitlement-Key), a call that fails gives its credit back.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "method": {
                "description": "Prefer HEAD (default); GET peeks at most 8KB",
                "enum": ["HEAD", "GET"],
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL to probe",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "autogrok/price": "$0.03",
            "autogrok/sku": "url-probe"
          },
          "digest": "sha256:6c9c05359647425ee00768ede55c623e4c5995ba305283c889822c1c9360c38b"
        },
        {
          "name": "watch_once",
          "title": "Watch once ($0.10)",
          "description": "Detect whether a web page has changed since the last check. Fetches a public URL, normalizes its main text and returns a sha256 hash, changed true/false against the previous_hash sent in (null on the first check), word count and fetch time. A one-shot change monitor for price, policy or docs pages. Each call is a single check; there are no webhooks or stored subscriptions. Price: $0.10 USDC per call (x402 on Base) or 1 prepaid pack credit. Failed calls aren't charged when you pay per call with x402: if the job errors, the USDC payment is never settled. With pack credits (X-Entitlement-Key), a call that fails gives its credit back.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "previous_hash": {
                "description": "sha256 from a previous watch-once call, to detect change",
                "maxLength": 128,
                "minLength": 1,
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL to fingerprint",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "autogrok/price": "$0.10",
            "autogrok/sku": "watch-once"
          },
          "digest": "sha256:97838881a381f5cddfc9d47f3c7564e2b1ae8e6a931053cb81c0a75b07147c3d"
        }
      ],
