{
  "lockfileVersion": 2,
  "subjects": {
    "cc.flowfeed/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.flowfeed.cc/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "flowfeed",
        "title": "FlowFeed MCP",
        "version": "2.3.0",
        "websiteUrl": "https://flowfeed.cc",
        "icons": [
          {
            "src": "https://flowfeed.cc/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://flowfeed.cc/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          },
          {
            "src": "https://flowfeed.cc/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "FlowFeed gives real-time macro and market news. For one instrument ('what is going on with EUR/USD / gold / BTC') call get_market_brief first: it returns the latest news, the upcoming calendar and official releases for that asset in one call. Use get_latest_news for 'what just happened / what moved X', search_news for a topic, get_economic_calendar for scheduled releases (CPI, NFP, central banks) and get_official_releases for central bank and statistics agency publications, and get_market_prices for the current price and % change of an asset (delayed quotes). Every item has its source, the source's publish time and a link to the original: cite them. Headlines only, never invent figures. Items carry a relevance score (0-100) for a macro trader; low-relevance noise is filtered out by default. Economic data headlines include a `data` object (indicator, actual, forecast, previous, surprise): quote those numbers. All times are UTC unless you pass a timezone; convert to the user's time zone when you answer. If a result is empty, widen the window (since_minutes / since_hours) once before concluding nothing happened. Asset filters accept natural names (gold, oil, bitcoin, euro, EUR/USD, S&P 500).",
      "tools": [
        {
          "name": "get_economic_calendar",
          "title": "Economic calendar",
          "description": "Scheduled economic releases for the current week, Monday to Sunday (CPI, nonfarm payrolls, GDP, PMIs, retail sales, central bank rate decisions) with forecast and previous values, and the actual value once published. Use it for 'what is on the calendar', 'when is CPI', 'high-impact USD events this week'. For what was just released and how markets reacted use get_latest_news. Returns events sorted by time (UTC) with currency, impact, forecast, previous, actual and, once released, surprise (above / below forecast / in line), plus week_covered. Read-only.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Optional currency filter: USD, EUR, GBP, JPY, AUD, CAD, CHF, NZD, CNY.",
                "type": "string"
              },
              "days_ahead": {
                "description": "Only events within this many days from now (0 = rest of today in UTC). Default: the rest of the week.",
                "maximum": 7,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "default": 40,
                "description": "Maximum number of events (1-100, default 40).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "min_impact": {
                "default": "medium",
                "description": "Only events at or above this impact. Default medium.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "timezone": {
                "description": "Optional IANA time zone for the output, e.g. Europe/Paris, America/New_York, Asia/Bangkok. Adds a local_time to each item.",
                "type": "string"
              },
              "upcoming_only": {
                "default": true,
                "description": "true (default) = only events that have not happened yet; false = the whole week including published results.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Economic calendar"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4cc5c6a3a72a790be7181742a078b5f77b99f57df10ff2e68c68071ac6ca93cc"
        },
        {
          "name": "get_latest_news",
          "title": "Latest market news",
          "description": "Real-time feed: the newest macro and market headlines from all sources (central banks, statistics agencies, Bloomberg, Financial Times, CNBC, Yahoo Finance, MarketWatch, Investing.com, FXStreet, investingLive, Seeking Alpha, BBC, The Economist, OilPrice.com, CoinDesk, The Block, Cointelegraph, Decrypt, ZeroHedge, and the Telegram channels of FinancialJuice, Market Feed, Tree News, Wu Blockchain, Watcher.Guru and Walter Bloomberg), merged so one story = one event. Use it for 'what is happening now' or 'what moved EUR/USD / gold / oil / BTC in the last hour'. For a past story or a named person use search_news; for the primary text published by a central bank or statistics agency use get_official_releases; for scheduled releases use get_economic_calendar. Returns events newest first, each with title, sources, publish time (UTC), arrival time, latency_seconds, link, category, impact (low/medium/high), assets, relevance (0-100) and, for data releases, data {indicator, actual, forecast, previous, surprise}. Low-relevance noise is hidden unless include_noise is true. Read-only.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Optional asset or currency filter: USD, EUR, GBP, JPY, AUD, CAD, CHF, NZD, CNY, EURUSD, GBPUSD, USDJPY, XAU (gold), OIL, NATGAS, BTC, ETH, US10Y, SPX. Natural names work too (gold, crude, bitcoin, EUR/USD, S&P 500).",
                "type": "string"
              },
              "category": {
                "description": "Optional topic filter.",
                "enum": ["macro", "markets", "crypto", "equities", "geopolitics"],
                "type": "string"
              },
              "include_noise": {
                "default": false,
                "description": "Also return low-relevance items (personal finance, small-cap stock moves). Off by default.",
                "type": "boolean"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of events to return (1-50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_impact": {
                "description": "Only items at or above this impact.",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "since_minutes": {
                "default": 60,
                "description": "Look-back window in minutes, 5 to 1440 (24 h). Default 60.",
                "maximum": 1440,
                "minimum": 5,
                "type": "integer"
              },
              "timezone": {
                "description": "Optional IANA time zone for the output, e.g. Europe/Paris, America/New_York, Asia/Bangkok. Adds a local_time to each item.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Latest market news"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:630ff1cf557338f686d116c52ea6e001f097795cc34068cffa35431479de16b3"
        },
        {
          "name": "get_market_brief",
          "title": "Market brief for one asset",
          "description": "One-call briefing for a single instrument or currency: the most important news of the last hours for that asset, the upcoming high and medium impact releases for its currencies (next 48 hours, with forecast and previous), recent data surprises and the latest central bank publications that concern it. Use it FIRST when the user asks about one market ('what is going on with EUR/USD', 'anything on gold today', 'should I watch out for USD/JPY this week'); use get_latest_news for the whole market and search_news for a named topic. Returns sections: news (ranked by impact then time), upcoming_events, data_surprises, official_releases, plus a one-line summary of counts. Read-only.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "The instrument or currency: EURUSD, GBPUSD, USDJPY, XAU (gold), OIL, BTC, US10Y, SPX, or a currency such as USD or EUR. Natural names work (gold, EUR/USD, bitcoin).",
                "type": "string"
              },
              "hours": {
                "default": 12,
                "description": "How far back to look for news, in hours (1-72). Default 12.",
                "maximum": 72,
                "minimum": 1,
                "type": "integer"
              },
              "timezone": {
                "description": "Optional IANA time zone for the output, e.g. Europe/Paris, America/New_York, Asia/Bangkok. Adds a local_time to each item.",
                "type": "string"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market brief for one asset"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:277f944d729a5121853cfe22d9c97f2d96a635b39d68f157c227a16730e4e45e"
        },
        {
          "name": "get_market_prices",
          "title": "Market prices",
          "description": "Current price and change of the main markets: FX pairs (EUR/USD, GBP/USD, USD/JPY, DXY...), gold, silver, oil (WTI, Brent), natural gas, copper, Bitcoin, Ether, US Treasury yields (3M, 5Y, 10Y, 30Y), stock indices (S&P 500, Nasdaq, Dow, DAX, CAC 40, FTSE 100, Nikkei, Hang Seng) and the VIX. Use it to say where a market trades and how much it moved (24 h, 7 days, 1 month) next to the news that explains it. Quotes are delayed (usually by up to 15 minutes, from Yahoo Finance) and carry their as_of time: never present them as tick-by-tick prices. Returns one row per instrument with price, change24h, change7d, change1m (in %) and as_of (UTC). Read-only.",
          "inputSchema": {
            "properties": {
              "assets": {
                "description": "Instruments to price, e.g. [\"EURUSD\", \"gold\", \"BTC\", \"US10Y\", \"SPX\"]. Natural names work. Leave empty to use class, or to get a market overview.",
                "items": {
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "class": {
                "description": "Optional: every instrument of one class.",
                "enum": ["forex", "stocks", "commodities", "crypto", "rates"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Market prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4a32326ecef33f24df98c11e584a64d92eae20c9c9361135b9da56304ba86176"
        },
        {
          "name": "get_official_releases",
          "title": "Official releases",
          "description": "Primary-source publications only, straight from the issuer's official feed: Federal Reserve (FOMC statements, minutes, speeches), ECB, Bank of England, Bank of Japan, Bank of Canada, Swiss National Bank, Reserve Bank of Australia, Reserve Bank of New Zealand, BLS (CPI, employment situation, PPI), BEA (GDP, PCE) and SEC. Use it for 'what did the Fed/ECB publish', 'latest FOMC statement', 'did BLS release CPI'. Unlike get_latest_news it never includes media coverage or Telegram reposts, and it looks back up to 30 days. Returns items newest first with source, title, publish time (UTC), link and impact; institutional housekeeping (awards, consultations, enforcement notices) is hidden unless min_impact is low. Read-only.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 15,
                "description": "Maximum number of publications (1-50, default 15).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_impact": {
                "default": "medium",
                "description": "Default hides institutional housekeeping (awards, consultations, enforcement notices).",
                "enum": ["low", "medium", "high"],
                "type": "string"
              },
              "since_hours": {
                "default": 168,
                "description": "Look-back window in hours (1-720, i.e. up to 30 days). Default 168 (7 days).",
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "source": {
                "description": "Optional: fed, ecb, boe, boj, boc, snb, rba, rbnz, bls, bea, sec.",
                "enum": ["fed", "ecb", "boe", "boj", "bls", "bea", "sec", "boc", "snb", "rba", "rbnz"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Official releases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:40b29318fe68ea0f15d0921f8068bae058c06a7b96621006fce12f5e0edbc3ab"
        },
        {
          "name": "search_news",
          "title": "Search news",
          "description": "Keyword search over the stored headline archive of the last 7 days (168 hours). Use it when the user names a person, institution, company or theme ('Powell', 'Lagarde', 'tariffs', 'Nvidia earnings', 'Strait of Hormuz') or asks about something that happened earlier than the last few hours. For the live feed use get_latest_news instead. Matching is whole-word and case-insensitive; common market terms are expanded to their synonyms (fed = FOMC, Federal Reserve, Powell; nfp = nonfarm payrolls; btc = bitcoin; also ecb, boe, boj, cpi, gold, oil). Near-duplicate headlines are merged and low-relevance noise is dropped. Returns matching events newest first with title, sources, publish time (UTC), link, category, impact, assets and relevance. Headlines only, never full article bodies. Read-only.",
          "inputSchema": {
            "properties": {
              "asset": {
                "description": "Optional asset or currency filter: USD, EUR, GBP, JPY, AUD, CAD, CHF, NZD, CNY, EURUSD, GBPUSD, USDJPY, XAU (gold), OIL, NATGAS, BTC, ETH, US10Y, SPX. Natural names work too (gold, crude, bitcoin, EUR/USD, S&P 500).",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of results (1-50, default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "One or more words to find in headlines, e.g. 'Powell', 'rate cut', 'gold'. All words must match.",
                "minLength": 2,
                "type": "string"
              },
              "since_hours": {
                "default": 24,
                "description": "How far back to search, in hours (1-168). Default 24; use 168 for the whole week.",
                "maximum": 168,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search news"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:956e794fa40b0d5ce823c0586a3c3fa3506fd21255eadcc4bf54e2ac74cbfac6"
        }
      ],
      "prompts": [
        {
          "name": "central_bank_watch",
