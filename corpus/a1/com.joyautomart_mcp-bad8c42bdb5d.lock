        {
          "name": "get_buying_guide",
          "title": "Bangladesh buying terms",
          "description": "Read shared Bangladesh retail-parts payment and delivery terms before explaining a purchase; get_part supplies item eligibility and prepare_part_handoff prepares the enquiry.\n\n- No inputs: the same retail policy applies across items. Reuse it across a shortlist, then refresh before relaying fees; a buyer's address, basket or identity cannot personalize this call.\n- Select the returned delivery zone using the buyer's area. Retail terms do not establish vehicle, auction or trade-credit terms; route car enquiries through prepare_vehicle_handoff.\n- Money objects distinguish BDT from paisa; vat_bps is in basis points. If live_terms_unavailable is true, obtain human confirmation instead of inventing fees. This anonymous read accepts no quote or payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "error": {
                "additionalProperties": false,
