                "description": "One-based source vehicle page; use returned next_page with unchanged filters. This is not a page of guaranteed auction matches.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 10,
                "description": "Public vehicle listings inspected per source page. Auction links can be fewer than this value, including zero.",
                "maximum": 20,
