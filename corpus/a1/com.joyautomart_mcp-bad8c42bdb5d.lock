                    "type": "string"
                  },
                  "make": {
                    "type": ["string", "null"]
                  },
                  "mileage_km": {
                    "type": ["number", "null"]
                  },
                  "model": {
                    "type": ["string", "null"]
                  },
                  "price_bdt": {
                    "type": ["number", "null"]
                  },
                  "status": {
                    "type": ["string", "null"]
