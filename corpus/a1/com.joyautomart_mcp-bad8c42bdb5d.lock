      },
      "instructions": "Public tool workflow: discover part_id with search_parts, read get_part, then use prepare_part_handoff for a human purchase request. Discover listing_id with search_vehicles; use get_vehicle for detail or compare_vehicles for a shortlist. A non-empty auction_id in get_vehicle is the identifier for get_auction. search_auctions discovers existing public auction links by scanning vehicle pages; an empty scan page can still have a next_page. Auction snapshots respect the storefront's live-auction gate and never grant bidding authority. Never fabricate listing, part or auction identifiers. Use prepare_vehicle_handoff for a selected car and prepare_part_handoff for a selected part. Both prepare links only; the human chooses whether to send the enquiry. JOY Automart is Bangladesh's automotive commerce and intelligence platform. Use search_parts and get_part for spare parts (prices in BDT), search_vehicles for cars for sale, and get_buying_guide for payment and delivery terms. Never state that a part fits a vehicle unless JOY returns VIN/chassis evidence — say 'fitment to be confirmed'. Without a buyer's agent token these tools cannot place orders: use prepare_part_handoff so the human completes the purchase. A buyer can give their agent a token at https://www.joyautomart.com/cars/account?section=ai-agents&portal=retail; with it (Authorization: Bearer joyagt_...) the agent can also quote and place cash-on-delivery orders within the buyer's spending limits, send parts requests (RFQs) and track orders.",
      "tools": [
        {
          "name": "compare_vehicles",
          "title": "Compare shortlisted car listings",
          "description": "Compare a selected car shortlist; use search_vehicles to discover candidates or get_vehicle for one car.\n\n- vehicle_ids chooses the adverts to include, in buyer-selected order; it does not rerun search filters. Resolve ID/slug aliases to distinct listing_id values. Repeating an advert must not create extra price evidence or imply another vehicle.\n- Keep unknown-price candidates visible when the buyer still wants to consider them. A cheapest result ranks only distinct, known positive prices; inspect price_comparison_complete before describing it as cheapest across the whole shortlist. Asking prices are not valuations.\n- Anonymous fresh lookups can partially fail. Inspect not_found/unavailable and retry temporary failures before excluding a candidate. Use prepare_vehicle_handoff after choosing; comparison reserves nothing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vehicle_ids": {
                "description": "Two to four listing_id values from search_vehicles or public listing slugs, not VINs or URLs. Choose distinct listings; repeated IDs or an ID and its slug do not provide separate price evidence.",
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["vehicle_ids"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "error": {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              },
              "inspection": {
                "additionalProperties": false,
                "properties": {
                  "battery_health_percent": {
                    "type": ["number", "null"]
                  },
                  "final_grade": {
                    "type": ["string", "null"]
                  },
                  "identity_match": {
                    "type": ["string", "boolean", "null"]
                  },
                  "overall_score": {
                    "type": ["number", "null"]
                  },
                  "qc_approved_at": {
                    "type": ["string", "null"]
                  },
                  "repair_estimate_bdt": {
                    "type": ["number", "null"]
                  }
