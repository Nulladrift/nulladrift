        {
          "name": "prepare_part_handoff",
          "title": "Prepare a human parts enquiry",
          "description": "Prepare a human parts enquiry after search_parts and get_part; use prepare_vehicle_handoff for whole cars and get_buying_guide for retail terms.\n\n- part_id fixes the selected item; quantity expresses the buyer's request, even below its minimum. Explain any gap rather than changing the request. Quantity times asking price excludes unconfirmed fees and is not an accepted quote.\n- vehicle supplies buyer-provided fitment context; collect missing fields identified by get_part. note qualifies that request but cannot clear fitment restrictions or change eligibility. Never invent vehicle identity.\n- A fresh anonymous lookup prepares links only. Text is embedded in the link, so omit unnecessary personal details. The human reviews and decides whether to send; JOY confirms fitment, stock and price. Nothing opens, reserves, orders or charges.",
