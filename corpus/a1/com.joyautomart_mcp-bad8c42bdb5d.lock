                "required": ["battery_health_percent", "final_grade", "identity_match", "overall_score", "qc_approved_at", "repair_estimate_bdt"],
                "type": "object"
              },
              "vehicle_detail": {
                "additionalProperties": false,
                "properties": {
                  "auction_id": {
                    "type": ["string", "null"]
