          "title": "Search car parts",
          "description": "Find spare-part candidates; use search_vehicles for whole cars and get_part to inspect a selected result.\n\n- Combine query/category for the item with make/chassis for its vehicle. Narrow ambiguous item text before relaxing known vehicle identity; a catalogue match never certifies fitment.\n- Choose stocked supply or RFQ sourcing deliberately. max_price_bdt limits the item's asking price, not the full purchase budget; check minimum quantity and delivery terms separately. Catalogue-only results need human confirmation.\n- page_size controls review batch size, not total supply. Keep it and the filters fixed while advancing page. Empty results are valid; an uninterpretable Bangla query returns an error. Anonymous searches reserve no stock.",
