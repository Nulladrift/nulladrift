        {
          "name": "get_vehicle",
          "title": "Get car details",
          "description": "Inspect one car listing's specifications, asking price and inspection evidence after search_vehicles; use compare_vehicles for a shortlist.\n\n- vehicle_id chooses an advertisement. Use the returned canonical listing_id to join its detail, comparison and enquiry; matching make/model or an ID/slug pair is not evidence of another independent offer.\n- A non-empty auction_id selects a separate event for get_auction; no link means auction status is unknown. Use prepare_vehicle_handoff after selecting the car, rather than treating inspection evidence as a warranty.\n- This anonymous lookup refreshes the advert. Missing facts remain unknown; a missing listing requires a new search. Seller contacts and auction reserve prices stay private, and no car is reserved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "vehicle_id": {
                "description": "listing_id returned by search_vehicles, or slug from a public JOY listing URL. Use only the ID/slug (letters/digits, dots, underscores, hyphens; starts with a letter/digit), not the URL, VIN or registration number.",
