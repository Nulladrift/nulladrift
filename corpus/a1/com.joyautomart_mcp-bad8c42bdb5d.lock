        {
          "name": "get_auction",
          "title": "Read public car auction status",
          "description": "Read one car auction's current public bid state; search_auctions discovers events and get_vehicle provides the linked car's facts.\n\n- auction_id binds every bid and deadline to one sale event. Keep that event's listing link beside the result; a bid from another event or the car's retail asking price cannot fill a missing auction value.\n- A saved event may have ended. Check status/end_at and refresh before answering a live-bid question; use minimum_next_bid only when returned.\n- Anonymous snapshots can fail for feature gating, rate limits or unknown events. Report the error; reserve prices and bidder identities stay private. Bidding requires a verified dealer and a human decision outside this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "auction_id": {
                "description": "Copy auction_id from search_auctions or an auction-linked get_vehicle result, or use a known public auction ID supplied by the buyer. Supply the event identifier alone, not a listing_id or URL; never invent one.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["auction_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "error": {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              }
            },
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "auction_id": {
                    "pattern": "^[A-Za-z0-9_-]{1,64}$",
                    "type": "string"
                  },
                  "bid_count": {
                    "type": ["integer", "null"]
                  },
                  "bid_increment": {
                    "type": ["number", "null"]
                  },
                  "currency": {
                    "const": "BDT",
                    "type": "string"
                  },
                  "current_bid": {
                    "type": ["number", "null"]
                  },
                  "end_at": {
                    "type": ["string", "null"]
                  },
                  "extension_count": {
                    "type": ["integer", "null"]
                  },
                  "minimum_next_bid": {
                    "type": "number"
                  },
                  "note": {
                    "type": "string"
                  },
                  "start_price": {
                    "type": ["number", "null"]
                  },
                  "status": {
                    "type": ["string", "null"]
                  },
                  "title": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["auction_id", "bid_count", "bid_increment", "currency", "current_bid", "end_at", "extension_count", "note", "start_price", "status", "title"],
                "type": "object"
              },
              {
                "$ref": "#/$defs/error"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
