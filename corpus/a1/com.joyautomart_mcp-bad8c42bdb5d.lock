        {
          "name": "get_part",
          "title": "Get part details",
          "description": "Inspect one spare part's price, supply and fitment evidence after search_parts; use prepare_part_handoff for a human enquiry.\n\n- part_id selects one catalogue record, not the OEM-number group. If several records share an OEM reference, select the buyer's intended record before lookup; never combine one record's price with another's stock or fitment.\n- A found record can remain unsellable. Read its minimum quantity and required fitment fields before proposing a purchase; missing price or stock means unknown, not zero. An OEM match does not certify fitment.\n- This anonymous lookup refreshes the selected record without reserving supply. If it is missing, search again and reconfirm any replacement with the buyer; a failed lookup does not prove the OEM part unavailable everywhere.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
