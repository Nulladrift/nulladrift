        {
          "name": "search_auctions",
          "title": "Discover car auction links",
          "description": "Find auction-event links attached to public cars; use search_vehicles for car specifications and asking prices, or get_auction for one event's bid state.\n\n- Filter the linked car, not the auction title: make='Toyota' with query='Premio' targets that model's vehicle adverts. Unpriced cars remain eligible because an auction need not have a retail asking price.\n- page_size is a source-scan batch: inspecting 20 adverts can yield zero auction links. Keep batch size and filters fixed; follow next_page even after an empty items page. At the source limit, narrow the car filters instead of claiming an exhaustive search.\n- Results are links, not retail offers or bid snapshots. Source counts describe cars scanned; get_auction checks ended or gated events. Anonymous discovery exposes no private lots and places no bid.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "make": {
                "description": "Case-insensitive manufacturer prefix, e.g. Toyota; intersects the vehicle query. Omit for all makes.",
