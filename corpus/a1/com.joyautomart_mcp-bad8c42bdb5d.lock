        {
          "name": "search_vehicles",
          "title": "Search cars for sale",
          "description": "Research retail cars for sale; use get_vehicle for one listing, compare_vehicles for a shortlist or search_auctions to discover auction-event links.\n\n- Combine the buyer's make/model, fuel, model-year range and budget into one shortlist. verified_only narrows evidence quality, not mechanical warranty; year_desc ranks model year while latest prioritizes verified/newly listed adverts.\n- Decide whether POA cars belong in the shortlist. include_unpriced cannot override min_price_bdt/max_price_bdt; omit both price bounds to retain unknown-price candidates. Asking prices are neither bids nor valuations.\n- page_size sets the review batch; hold it, sort and filters fixed while advancing page. Anonymous live reads may return no matches. Use the selected listing's detail before enquiry; no seller is contacted or car reserved.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fuel_type": {
                "description": "Case-insensitive prefix of a public listing's fuel label, e.g. hybrid. Copy a known label where possible; omit to include all fuel types.",
                "maxLength": 40,
                "type": "string"
              },
              "include_unpriced": {
                "default": false,
                "description": "True includes price-on-application or otherwise unpriced listings; false (default) excludes them. A missing asking price is unknown, never zero.",
                "type": "boolean"
              },
              "make": {
                "description": "Case-insensitive manufacturer prefix, e.g. Toyota. Combine with query='Premio' for that model; omit to include all makes.",
                "maxLength": 60,
                "type": "string"
              },
              "max_price_bdt": {
                "description": "Inclusive maximum stated asking price in Bangladesh taka, e.g. 3000000 means ৳30 lakh. Omit for no maximum; no less than min_price_bdt.",
                "minimum": 0,
                "type": "number"
              },
              "max_year": {
                "description": "Inclusive latest model year, 1950 through 2100. Omit for no upper-year filter; supply a value no less than min_year.",
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              },
              "min_price_bdt": {
                "description": "Inclusive minimum stated asking price in Bangladesh taka, e.g. 2000000 means ৳20 lakh. Omit for no minimum; no greater than max_price_bdt.",
                "minimum": 0,
                "type": "number"
              },
              "min_year": {
                "description": "Inclusive earliest model year, 1950 through 2100. Omit for no lower-year filter; supply a value no greater than max_year.",
                "maximum": 2100,
                "minimum": 1950,
                "type": "integer"
              },
              "page": {
                "default": 1,
                "description": "One-based results page, 1 through 500; defaults to 1. Keep filters and sort unchanged when paging.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
