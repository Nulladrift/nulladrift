      "instructions": "CON records every Solana launch and checks memecoins against devs, wallets and flags on record. Information only, not financial advice. A rating is a probability, not a promise.",
      "tools": [
        {
          "name": "check_coin",
          "title": "Check a Solana coin",
          "description": "CON's public coin check for one Solana token (mint address): risk class, the dev wallet's earlier coins and exits, wallet rings, holder concentration, contract rights and findings, read against CON's record of every Solana launch since Oct 2026. Same data as centralonet.com/scan, no account.",
          "inputSchema": {
            "properties": {
              "mint": {
                "description": "Solana token mint address (base58, 32 to 44 characters)",
                "type": "string"
              }
            },
            "required": ["mint"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
