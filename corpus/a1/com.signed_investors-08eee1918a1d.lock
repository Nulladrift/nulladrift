        "name": "signed-investors",
        "title": "Signed Investors",
        "version": "1.0.0",
        "description": "The public angel investor directory on Signed, readable without an account: search and browse investors with public profiles by keyword, sector, and check size, read any investor's profile — what they invest in, the checks they write, the companies they've backed, whether they take pitches — and see who follows whom. Read-only.",
        "websiteUrl": "https://mcp.signed.com/investors",
        "icons": [
          {
            "src": "https://mcp.signed.com/icon.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "logging": {},
        "prompts": {},
        "resources": {},
