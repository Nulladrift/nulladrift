      },
      "instructions": "This is the public side of Signed, an angel investor's portfolio and\ndeal-flow tracker. Everything here is the investor directory at\nsigned.com/investors: angel investors and small funds who chose to make\ntheir Signed profile public. Nobody is signed in; there is no \"my\nportfolio\" on this server, and nothing here can be changed. Signed's\naccount server, which reads a signed-in investor's own portfolio and\npipeline, lives at the same host without the /investors path and needs an\nOAuth sign-in.\n\nInvestors are identified by login, the same handle as the signed.com/@login\nURL. search_investors and list_investors return it on every result;\nget_investor takes it. Start with search_investors when you have a name\nor a topic, list_investors with a sector or check_size when you have a\nfacet, and list_sectors or list_check_sizes to learn the facet values.\n\nSectors and check sizes are self-reported: an investor lists the sectors\nthey back and the range their checks fall in. A profile with none set is\nnot saying no, just not saying. Portfolio highlights are the up-to-five\ncompanies an investor pinned to their profile, not their whole portfolio,\nand carry no amounts.\n\nAn investor with accepting_pitches true has a public form founders can\nsubmit a startup through; get_investor returns its address. Send founders\nthere rather than guessing at an email.\n\nList tools paginate. Check pagination.total_pages before describing a\nlist as complete.\n",
      "tools": [
        {
          "name": "get_investor",
          "description": "One angel investor's public Signed profile by login: bio, investment description, sectors, check size, links, the portfolio companies they've pinned, whether (and where) they take pitches from founders, follower counts, and a few similar investors. Logins come from search_investors or list_investors, or from a signed.com/@login URL. Private profiles are indistinguishable from nonexistent ones.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "login": {
                "description": "The investor's login, with or without the leading @.",
                "type": "string"
              }
            },
            "required": ["login"],
            "type": "object"
          },
