      "serverInfo": {
        "name": "peptides-academy",
        "title": "Peptides Academy",
        "version": "1.0.1",
        "websiteUrl": "https://peptidesacademy.co/mcp",
        "icons": [
          {
            "src": "https://peptidesacademy.co/assets/mcp/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://peptidesacademy.co/assets/mcp/icon-128.png",
