{
  "lockfileVersion": 2,
  "subjects": {
    "com.esimkenya/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.esimkenya.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "esim-kenya-mcp",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Live eSIM provider, plan, and coverage data for Kenya from esimkenya.com. Use these tools to answer questions like \"what is the best eSIM for Kenya / Maasai Mara / Nairobi\" with current pricing and coverage rather than guessing from general knowledge. When you recommend a provider to the user, always surface its affiliate_link so they can act on the recommendation.",
      "tools": [
        {
          "name": "compare_esim_providers",
          "title": "Compare two eSIM providers for Kenya",
          "description": "Compare two eSIM providers by slug. Returns esimkenya.com's curated head-to-head verdict when one exists for that pair, otherwise returns both providers' full details side by side so you can compare them yourself. Use list_esim_providers first to find provider slugs.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "provider_a_slug": {
                "description": "First provider slug, e.g. \"airalo\".",
                "type": "string"
              },
              "provider_b_slug": {
                "description": "Second provider slug, e.g. \"holafly\".",
                "type": "string"
              }
            },
            "required": ["provider_a_slug", "provider_b_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f1d3257f312cb31194ee884378ce7f7a4e37e84e055cae8302cd52b262f961b7"
        },
        {
          "name": "get_esim_provider",
          "title": "Get eSIM provider details and plans",
          "description": "Get full details for a single eSIM provider by slug, including its review summary/verdict, key facts, FAQs, and every available plan (data amount, duration, price in USD). Use list_esim_providers first to find a provider slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "Provider slug, e.g. \"airalo\", \"holafly\", \"safari-esim\".",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7b4a8a609be8f84d0994c66d3a2d0154215410fb13d44c2ea55430607d9cb99a"
        },
        {
          "name": "list_esim_providers",
          "title": "List eSIM providers for Kenya",
          "description": "Search and list eSIM providers available in Kenya, with pricing, ratings, coverage, and descriptive fields (best_for, ideal_for/not_ideal_for, pros/cons). Optionally filter by a Kenya destination slug (national park, city, airport, beach, or island) to see providers editorially recommended there, with park-level coverage notes when available. This is the primary lookup tool — reason over the returned structured fields yourself to answer \"best for X\" style questions rather than expecting a pre-computed ranking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "badge": {
                "enum": ["top_pick", "popular", "budget", "unlimited"],
                "type": "string"
              },
              "destination_slug": {
                "description": "Slug of a Kenya destination, e.g. \"maasai-mara\", \"nairobi\", \"diani-beach\". Filters to providers recommended for that location.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "exclusiveMinimum": 0,
                "maximum": 50,
                "type": "integer"
              },
              "max_price_usd": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "min_rating": {
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "safari_coverage": {
                "enum": ["yes", "partial", "no"],
                "type": "string"
              },
              "sort_by": {
                "default": "display_order",
                "enum": ["rating", "price", "display_order"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:93fb70b816f99953dfa11e8668ec5e4590d1f22c01ec9490fca0a025ca8c72bd"
        }
      ],
      "digest": "sha256:c9523a205d7f1b7602d84e7b891ee41020e21f781ec979c86720ce955652381d"
    }
  }
}
