{
  "lockfileVersion": 2,
  "subjects": {
    "com.memecub/memecub": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://memecub.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "memecub",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "generate_meme",
          "title": "Generate a custom meme with AI",
          "description": "Draws a new meme with AI and saves it to the caller's private library. Requires an API key and costs 500 credits per image (refunded if it fails or is refused), so search_memes first and generate only when nothing in the library fits or the user explicitly asks for a custom meme. Give a short caption and/or describe the picture; pass ref (an id from search_memes) to make a version of an existing meme's character. Refuses recognizable real people, sexual, violent or political content. Its file metadata marks it as AI-generated; it is a derivative work, not cleared for commercial use.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "description": "What the character does or looks like, e.g. 'cat slumped at a desk at 3am'",
                "maxLength": 200,
                "type": "string"
              },
              "caption": {
                "description": "Text drawn on the meme, up to 30 characters, in the language of the user",
                "maxLength": 30,
                "type": "string"
              },
              "locale": {
                "description": "Language of the label and messages; defaults to the caption's language",
                "enum": ["en", "zh"],
                "type": "string"
              },
              "ref": {
                "description": "id of a memecub meme whose character to reuse",
                "maxLength": 40,
                "type": "string"
              },
              "style": {
                "description": "panda = 熊猫头 face meme, photo, 3d, anime, sticker; omitted = chosen from the request",
                "enum": ["panda", "photo", "3d", "anime", "sticker"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:25f36a85dbde92482f634c7d0eabf385846cb4551bbce1309740eb37572396ae"
        },
        {
          "name": "get_meme",
          "title": "Get meme details",
          "description": "Full details for one image by id: license, source, author, credit line, tags.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a45e8eff683170885949a6435af0b3ad3561390800a112ba9d288f74eeca7730"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "Library categories with image counts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b7bc52d674208a524e4a6d76aab739d49303f3e022322a924e5e73d389258584"
        },
        {
          "name": "match_article",
          "title": "Place memes into an article",
          "description": "Reads an article and returns where reaction images fit best, with a chosen image and alternatives for each spot, plus the article with images inserted as Markdown. Requires an API key and costs 20 credits per image placed. If you can read the article yourself, calling search_memes per spot (1 credit each) is much cheaper.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "commercial_only": {
                "default": false,
                "description": "Only images cleared for commercial use",
                "type": "boolean"
              },
              "count": {
                "default": 4,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "include_profanity": {
                "default": false,
                "type": "boolean"
              },
              "no_credit": {
                "default": false,
                "description": "Only commercially usable images that need no attribution",
                "type": "boolean"
              },
              "text": {
                "maxLength": 40000,
                "minLength": 40,
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:434664846a2a97fb73c207718225a1fb4cc09a0f6da0f5d7e10f9f39c26ed4c5"
        },
        {
          "name": "search_memes",
          "title": "Search memes",
          "description": "Search memecub: Chinese 表情包 / 斗图 and English reaction memes and meme templates collected from the web (commercial_use=false), plus openly licensed emoji, art and photos (commercial_use=true). Search for the reaction you want in 1-3 words; Chinese queries find Chinese 表情包, English queries find English memes. Every result says whether it is cleared for commercial use and has a Markdown snippet that already includes any required credit line. Authenticated callers also get their private library.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "commercial_only": {
                "default": false,
                "description": "Only images cleared for commercial use. Web-collected memes have commercial_use=false.",
                "type": "boolean"
              },
              "include_profanity": {
                "default": false,
                "description": "Also return memes whose captions contain swearing (common in 斗图). Off by default.",
                "type": "boolean"
              },
              "kind": {
                "description": "meme = meme or 表情包 image, gif = animated meme, upload = the caller's own uploads",
                "enum": ["meme", "gif", "emoji", "artwork", "photo", "upload"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "min_size": {
                "description": "Skip images smaller than this many pixels on either side; 150 suits articles",
                "maximum": 2000,
                "minimum": 0,
                "type": "integer"
              },
              "no_credit": {
                "default": false,
                "description": "Only commercially usable images that need no attribution",
                "type": "boolean"
              },
              "private_only": {
                "default": false,
                "description": "Only the caller's private library",
                "type": "boolean"
              },
              "query": {
                "description": "Reaction or concept, e.g. 'facepalm', 'mind blown', '无语', '摸鱼'",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:951a86a523495de3a9e0c3fc3c377a1de1fed2a2a5b4dce5fbca8c6cb16c4a20"
        }
      ],
      "digest": "sha256:379ded349f3454658149809d3c4d31da8e2623ff3e92ae72d90d044474176db7"
    }
  }
}
