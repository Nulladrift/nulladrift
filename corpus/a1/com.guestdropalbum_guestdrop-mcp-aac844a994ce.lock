            "readOnly": true
          },
          "digest": "sha256:70de1295520f50273a30f8aabfbb1810a8feb533d22127a79de3e991cfe1fc33"
        },
        {
          "name": "get_pricing_and_packages",
          "title": "Get Pricing And Packages",
          "description": "Get all live GuestDrop event pass packages, pricing in ZAR (R) and USD ($), durations, photo upload limits, and feature comparisons (QR codes, live TV slideshows, photo scavenger hunt, audio notes, zero app download required). When to use: Call this tool when you specifically need to execute 'get_pricing_and_packages' on GuestDrop Event Photo Album (guestdropalbum.com). Do NOT use this tool when another specialized tool fits better (use 'calculate_event_cost' or 'recommend_scavenger_quests' or 'create_event_checkout' for their respective operations). Parameters: currency (optional). Behavior & Side Effects: Strictly read-only, idempotent query with zero state mutation; public unauthenticated access allowed; rate-limited to 60 requests/min per IP. Returns: Structured JSON object containing status, matched records or computed metrics, and canonical action URLs.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Preferred currency filter (ZAR, USD, or all). Defaults to all.",
                "enum": ["ZAR", "USD", "all"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Pricing And Packages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
