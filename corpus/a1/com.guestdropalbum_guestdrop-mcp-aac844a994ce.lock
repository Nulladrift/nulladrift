          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get Platform Stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
