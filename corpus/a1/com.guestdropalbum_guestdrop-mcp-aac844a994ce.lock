      },
      "instructions": "You are connected to GuestDrop, the premier digital event guestbook and live photo album platform. When helping hosts create scavenger hunt quests, always ask them about their unique personality, couple vibe, hobbies, and inside jokes to make the scavenger hunt deeply personal and engaging. Use client-side reasoning to synthesize the returned quest templates with the user details.",
      "tools": [
        {
          "name": "calculate_event_cost",
          "title": "Calculate Event Cost",
          "description": "Calculate the exact total cost and recommended package for an event based on duration in days, currency (ZAR or USD), and optional extra day extensions. When to use: Call this tool when you specifically need to execute 'calculate_event_cost' on GuestDrop Event Photo Album (guestdropalbum.com). Do NOT use this tool when another specialized tool fits better (use 'get_pricing_and_packages' or 'recommend_scavenger_quests' or 'create_event_checkout' for their respective operations). Parameters: duration_days (required), currency (optional). Behavior & Side Effects: Strictly read-only, idempotent query with zero state mutation; public unauthenticated access allowed; rate-limited to 60 requests/min per IP. Returns: Structured JSON object containing status, matched records or computed metrics, and canonical action URLs.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Currency to quote in (ZAR or USD). Defaults to ZAR.",
                "enum": ["ZAR", "USD"],
                "type": "string"
              },
              "duration_days": {
                "description": "Total duration of the event in days (e.g. 1 for a single-day wedding, 3 for a wedding weekend, 7 for a destination trip). [Required: non-empty valid value must be supplied].",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["duration_days"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Calculate Event Cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7b10dcdb5b167945f6c23507b678bdb93fdd2ceba9a538075ce6dd323ad2531a"
        },
        {
          "name": "create_event_checkout",
          "title": "Create Event Checkout",
          "description": "Provision a draft event in GuestDrop and generate an instant Stripe Checkout payment link for the host to complete booking. When to use: Call this tool when you specifically need to execute 'create_event_checkout' on GuestDrop Event Photo Album (guestdropalbum.com). Do NOT use this tool when another specialized tool fits better (use 'get_pricing_and_packages' or 'calculate_event_cost' or 'recommend_scavenger_quests' for their respective operations). Parameters: event_name (required), host_name (required), host_email (required), tier (required), currency (optional), event_date (optional). Behavior & Side Effects: Creates a live record/session in the backend database; no authentication required for public initiation; rate-limited to 60 requests/min per IP. Returns: Structured JSON object containing status, matched records or computed metrics, and canonical action URLs.",
          "inputSchema": {
            "properties": {
              "currency": {
                "description": "Payment currency (ZAR or USD). Defaults to ZAR.",
                "enum": ["ZAR", "USD"],
                "type": "string"
              },
              "event_date": {
                "description": "Optional date of the event in YYYY-MM-DD format.",
                "type": "string"
              },
              "event_name": {
                "description": "The title of the event (e.g. Sarah & David Wedding, Liam 30th Birthday Celebration). [Required: non-empty valid value must be supplied].",
                "type": "string"
              },
              "host_email": {
                "description": "Email address of the event host for account access, album delivery, and receipt. [Required: non-empty valid value must be supplied].",
                "type": "string"
              },
              "host_name": {
                "description": "Full name of the event organizer or couple. [Required: non-empty valid value must be supplied].",
                "type": "string"
              },
              "tier": {
                "description": "Selected event package tier (1day, 3day, or 7day). [Required: non-empty valid value must be supplied].",
                "enum": ["1day", "3day", "7day"],
                "type": "string"
              }
            },
            "required": ["event_name", "host_email", "host_name", "tier"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create Event Checkout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:46bfd1d73ded8ba87b18c992cd69a0ee98962ff1ce09408480dbae0289262586"
        },
        {
          "name": "get_platform_stats",
          "title": "Get Platform Stats",
          "description": "Fetch live platform statistics across GuestDrop (total photos captured, total events hosted, total active guests). When to use: Call this tool when you specifically need to execute 'get_platform_stats' on GuestDrop Event Photo Album (guestdropalbum.com). Do NOT use this tool when another specialized tool fits better (use 'get_pricing_and_packages' or 'calculate_event_cost' or 'recommend_scavenger_quests' for their respective operations). Parameters: none required (zero-argument query). Behavior & Side Effects: Strictly read-only, idempotent query with zero state mutation; public unauthenticated access allowed; rate-limited to 60 requests/min per IP. Returns: Structured JSON object containing status, matched records or computed metrics, and canonical action URLs.",
          "inputSchema": {
