        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://aether-layer.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "aether-layer-agent-service-gateway",
        "version": "0.3.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Main tool: validate_vat (EU VAT number: local format/checksum for 27 member states + XI, then a live VIES check; never reports invalid because VIES is down). tools/list needs no key; tools/call needs an API key. Free key: POST https://aether-layer.com/api/v0/keys with body {} (no email); the key is shown once. Send it as Authorization: Bearer <key> or X-Api-Key. Free quota: 20 validate_vat calls per day (Europe/Rome); over quota the tools return payment_required. Docs: https://aether-layer.com/en/vat-api",
      "tools": [
        {
          "name": "agent_readiness_check",
          "title": "Agent Readiness Check",
          "description": "Deterministically grade an MCP tool catalog or a third-party x402 endpoint. Provide exactly one of: mcp_url (public https MCP server; initialize + tools/list), x402_url (public https resource; the gateway requests it WITHOUT an X-PAYMENT header and reads the 402), or tools (a JSON tool manifest). Never pays or signs a payment. No LLM is used. Requires an API key in Authorization: Bearer or X-Api-Key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "mcp_url": {
                "description": "Public https URL of a remote MCP server (Streamable HTTP).",
                "format": "uri",
                "type": "string"
              },
              "tools": {
                "description": "Tool manifest, as returned by tools/list.",
                "items": {
                  "properties": {
                    "annotations": {
                      "properties": {
                        "destructiveHint": {
                          "type": "boolean"
                        },
                        "idempotentHint": {
                          "type": "boolean"
                        },
                        "openWorldHint": {
                          "type": "boolean"
                        },
                        "readOnlyHint": {
                          "type": "boolean"
                        },
                        "title": {
                          "type": "string"
                        }
                      },
                      "type": "object"
                    },
                    "description": {
                      "type": "string"
                    },
                    "inputSchema": {},
                    "name": {
                      "type": "string"
                    }
                  },
                  "required": ["name"],
                  "type": "object"
                },
                "type": "array"
              },
              "x402_url": {
                "description": "Public https URL of a third-party x402 resource. The gateway never sends X-PAYMENT.",
                "format": "uri",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d93d93663cc0f23fea8de6c0a0a1d975ebf4197a505d1e44453c3d4c35ffe188"
        },
        {
          "name": "validate_vat",
          "title": "Validate an EU VAT number",
          "description": "Validate an EU VAT number (27 member states + XI Northern Ireland). Normalizes the input, checks the national format and checksum locally, then queries VIES (European Commission) live with limited retries. status: valid | invalid (local checksum/format failed, or VIES answered valid=false) | unverified_ms_down (the member state system is down) | unverified. Results are cached across instances to respect VIES rules: valid/invalid 24 h, unverified 10 min; checked_at = time of the original VIES check, cache_age_s = its age in seconds. Never returns invalid because VIES is unavailable. The VIES name/address are never returned: pass your own name and/or address to get name_match / address_match booleans, computed locally (not sent to VIES; null when VIES has no data). Requires an API key in Authorization: Bearer or X-Api-Key. Controllo automatico: regole locali di formato e checksum più una consultazione live del VIES (Commissione europea). Non è un'attestazione fiscale né una consulenza legale; i dati VIES provengono dalle banche dati degli Stati membri. Conserva una tua traccia della consultazione VIES. / Automated check: local format/checksum rules plus a live query of VIES (European Commission). Not a tax attestation and not legal advice; VIES data come from the member states' databases. Keep your own record of the VIES consultation. / Automatische Prüfung: lokale Format- und Prüfziffernregeln plus eine Live-Abfrage von VIES (Europäische Kommission). Keine steuerliche Bescheinigung und keine Rechtsberatung; die VIES-Daten stammen aus den Datenbanken der Mitgliedstaaten. Bewahren Sie einen eigenen Nachweis der VIES-Abfrage auf.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "address": {
                "description": "Optional address to compare with the VIES record (local match, not sent to VIES, not stored). Returns address_match.",
                "maxLength": 200,
                "type": "string"
              },
              "client": {
                "description": "Optional integration id <name>/<version>, e.g. shopware-plugin/0.1. Adoption metric only.",
                "maxLength": 48,
                "type": "string"
              },
              "country": {
                "description": "Optional ISO prefix when vat_id has none (e.g. IT).",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "name": {
                "description": "Optional company name to compare with the VIES record (local match, not sent to VIES, not stored). Returns name_match.",
                "maxLength": 200,
                "type": "string"
              },
              "vat_id": {
                "description": "VAT number with country prefix, e.g. IT00905811006, DE143454214, EL094014201 (GR accepted), XI…; spaces, dots and dashes are ignored.",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["vat_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cf42fda6e3c6a65fbef4270fbca30efda5341372246e2cb6047eba55cb6c89a6"
        }
      ],
      "digest": "sha256:a3c48ca46609204bc2531865fb0382c64c78b40dcf21652acd85d8544a719822"
    }
  }
