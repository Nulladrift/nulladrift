{
  "lockfileVersion": 2,
  "subjects": {
    "com.funciara/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.funciara.com/mcp/docs"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "com.funciara/docs",
        "title": "Funciara.com guides",
        "version": "1.0.0",
        "websiteUrl": "https://funciara.com",
        "icons": [
          {
            "src": "https://funciara.com/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only access to the published guides of Funciara.com, a private Romanian intermediary for land-registry documents (not affiliated with ANCPI). The guides are written in Romanian. Call search_docs with a topic to find guides, then read_doc with a slug to read one as markdown. To prepare an order, use the main server at https://api.funciara.com/mcp instead.",
      "tools": [
        {
          "name": "read_doc",
          "title": "Read a guide",
          "description": "Read one published guide as markdown, by its slug from search_docs. Use it after search_docs; it does not search.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The guide slug, for example the last part of https://funciara.com/ghid/<slug>.",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "markdown": {
                "type": "string"
              },
              "slug": {
                "type": "string"
              },
              "truncated": {
                "type": "boolean"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["markdown", "slug", "truncated", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7fbe8598bfb4e99a7d2f6127dc6320aa2f3a0736a9f5bbb9e300f1283ff9a0f0"
        },
        {
          "name": "search_docs",
          "title": "Search the guides",
          "description": "Search the published Funciara.com guides by topic and get their slugs, titles and short summaries. Use it to find which guide answers a question; use read_doc to read one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Most results to return, 1 to 10. Default 5.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, in Romanian or English keywords, for example \"extras carte funciara pret\".",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "slug": {
                      "type": "string"
                    },
                    "summary": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["slug", "summary", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["results"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:edd1463716d2702b4f0cb6e8a42163e9a12ba923a5732c7f7e8fd56cd93ca505"
        }
      ],
      "digest": "sha256:5dfe594aa9028de107c08bc40d28202dc37ae4c85ebdea40fcba1a1158dd6284"
    }
  }
}
