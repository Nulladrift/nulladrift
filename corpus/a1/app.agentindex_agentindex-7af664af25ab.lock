{
  "lockfileVersion": 2,
  "subjects": {
    "app.agentindex/agentindex": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentindex.app/api/mcp/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "AgentIndex",
        "title": "AgentIndex",
        "version": "1.1.0",
        "websiteUrl": "https://agentindex.app"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AgentIndex is a curated directory of open-source AI agents, MCP servers and AI developer tools: GitHub repositories with 100+ stars, each enriched with a summary, features, use cases and an install command, and ranked by rank_score (0-100). Typical flow: search_tools (or get_trending / list_categories to browse) returns short records with an id; pass that id to get_tool_detail for the full record. All tools are read-only except submit_tool, which queues a GitHub repository for human review.",
      "tools": [
        {
          "name": "get_tool_detail",
          "title": "Get tool details",
          "description": "Get the full AgentIndex record for one tool when you already have its id (from search_tools, get_trending or an AgentIndex URL such as agentindex.app/en/tool/<id>/). Returns name, description, long intro, summary, features, use cases, pros and cons, when to choose or skip it, compatibility, install command, license, stars, last update date, tags, rank_score, website and GitHub URL. Fields that were never filled in are omitted. Returns an isError result if no tool has that id; use search_tools to find the right id.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Tool id exactly as returned by search_tools or get_trending, usually \"<github-owner>-<repo>\", e.g. \"hangwin-mcp-chrome\".",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ai_tags": {
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "category": {
                "type": ["string", "null"]
              },
              "choose_if": {
                "description": "When to pick this tool"
              },
              "compatibility": {
                "description": "Compatible clients and platforms"
              },
              "cons": {
                "description": "Weaknesses"
              },
              "description": {
                "type": ["string", "null"]
              },
              "features": {
                "description": "Feature list"
              },
              "github_url": {
                "type": ["string", "null"]
              },
              "id": {
                "description": "Tool id for get_tool_detail",
                "type": "string"
              },
              "install_command": {
                "type": ["string", "null"]
              },
              "intro_long": {
                "description": "Longer introduction"
              },
              "last_updated": {
                "type": ["string", "null"]
              },
              "license": {
                "type": ["string", "null"]
              },
              "name": {
                "type": "string"
              },
              "pros": {
                "description": "Strengths"
              },
              "rank_score": {
                "description": "AgentIndex rank, 0-100",
                "type": ["number", "null"]
              },
              "skip_if": {
                "description": "When to pick something else"
              },
              "stars": {
                "description": "GitHub stars, e.g. \"12.3k\"",
                "type": ["string", "number", "null"]
              },
              "summary": {
                "description": "Short summary, { en, zh } or a string"
              },
              "tags": {
                "items": {
                  "type": "string"
                },
                "type": ["array", "null"]
              },
              "use_cases": {
                "description": "Use case list"
              },
              "website": {
                "type": ["string", "null"]
              }
            },
            "required": ["id", "name"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3e8652260a0e393ff061c119087faaca83c53acc44168258442cc2cdc3376fb"
        },
        {
          "name": "get_trending",
          "title": "Get top-ranked tools",
          "description": "Get the highest-ranked tools across the whole AgentIndex directory, for questions like \"what are the best/most popular open-source AI tools right now\". Ranking is by rank_score (0-100), which combines GitHub stars, how recently the repository was updated and the quality of its documentation; it is not a weekly-growth chart. Use search_tools instead when the user needs a specific kind of tool. Returns an array of {id, name, category, description, stars, rank_score, ai_tags, website, github_url}.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "description": "Number of tools to return (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "tools": {
                "items": {
                  "properties": {
                    "ai_tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": ["string", "null"]
                    },
                    "github_url": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Tool id for get_tool_detail",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rank_score": {
                      "description": "AgentIndex rank, 0-100",
                      "type": ["number", "null"]
                    },
                    "stars": {
                      "description": "GitHub stars, e.g. \"12.3k\"",
                      "type": ["string", "number", "null"]
                    },
                    "website": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["tools"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ac7a84f8bfdc6520f00fe6118906ce2127b43b113119b8c70a64f303e58d460"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "List every category in the AgentIndex directory with the number of tools in it, largest first. Call this before using the category filter of search_tools to get valid names, or to give the user an overview of the directory. Returns an array of {category, count}. Takes no arguments.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "categories": {
                "items": {
                  "properties": {
                    "category": {
                      "type": "string"
                    },
                    "count": {
                      "type": "integer"
                    }
                  },
                  "required": ["category", "count"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["categories"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9dc290a5f66acd564f922f1032c8e274486e37cc6b3ee0c6faa9fffacd1e03c1"
        },
        {
          "name": "search_tools",
          "title": "Search tools",
          "description": "Find AI agents, MCP servers and AI developer tools in the AgentIndex directory by keyword and/or category. Use this when the user describes a need (\"MCP server for Postgres\", \"browser automation agent\"); use get_trending instead to browse the best tools without a query. Every keyword must appear (case-insensitive) in the name, description, tags or category. Results are ordered by rank_score, highest first. Returns an array of {id, name, category, description, stars, website, github_url, tags, rank_score}; an empty array means no match, so retry with fewer or broader keywords. Pass an id to get_tool_detail for features, use cases and the install command.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Exact category name from list_categories (case-insensitive), e.g. \"Browser Automation\" or \"RAG / Knowledge Base\". Omit to search all categories.",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results (1-50, default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Space-separated keywords, all of which must match, e.g. \"postgres mcp\" or \"browser automation\". Omit to list the top tools of a category.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "tools": {
                "items": {
                  "properties": {
                    "category": {
                      "type": ["string", "null"]
                    },
                    "description": {
                      "type": ["string", "null"]
                    },
                    "github_url": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "description": "Tool id for get_tool_detail",
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "rank_score": {
                      "description": "AgentIndex rank, 0-100",
                      "type": ["number", "null"]
                    },
                    "stars": {
                      "description": "GitHub stars, e.g. \"12.3k\"",
                      "type": ["string", "number", "null"]
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": ["array", "null"]
                    },
                    "website": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["id", "name"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["tools"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4263a1e7ac85bbd140f195fee9351119376ef7aa9067ed05e94df4e53036f304"
        },
        {
          "name": "submit_tool",
          "title": "Submit a tool",
          "description": "Suggest a GitHub repository (an AI agent, MCP server or AI developer tool) for listing on AgentIndex. No login or API key needed. The submission is queued for human review, usually within 1-3 days; it does not appear in search results immediately. Tools are listed only if the repository is public and has at least 100 stars. Check with search_tools first that the tool is not already listed. Returns {success, message, github_url}, or an isError result if the URL is not a GitHub repository URL or the submission service is unavailable.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Optional address that receives an email when the review is done. Only send it if the user provided it.",
                "format": "email",
                "type": "string"
              },
              "github_url": {
                "description": "Repository URL in the form https://github.com/<owner>/<repo>, e.g. https://github.com/modelcontextprotocol/servers.",
                "pattern": "^https://github\\.com/[^/\\s]+/[^/\\s]+/?$",
                "type": "string"
              }
            },
            "required": ["github_url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "github_url": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "success": {
                "type": "boolean"
              }
            },
            "required": ["message", "success"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fb89050cc730327e2dfb84826ca801b575042dc2b9c590f90135ead612957892"
        }
      ],
      "digest": "sha256:0844a4df94b4207aad6650d810ac7ce3061e6b980a36d5b05d37873419800380"
    }
  }
}
