      "instructions": "Everything here returns **synthesized story events** — one entry per real-world story, each\nwith a generated headline, one-liner, abstract, key actors, industry / event-type labels,\ncorroboration counts, and source links. It is not a flat article list, and there is no\nper-article search.\n\n## Pick the tool by what is being asked\n\n| The request | The tool |\n|---|---|\n| a topic, a filter, or \"what's happening\" | `news` |\n| a named company, person, place, or organisation | `news` with `subject=` |\n| more detail on a story already seen | `get_story` |\n| \"is this true?\" / \"how widely reported?\" | `check_coverage` |\n| how much budget is left | `check_limits` |\n\nFor a name, use `subject=` rather than putting it in `q`. It quotes the name so it matches\nas a phrase and widens the window to 30 days, which is the difference between finding a\ncompany and finding nothing: `q=\"Bank of America\"` unquoted ANDs three common words and\nreturns \"India Now Asia's Least Preferred Stock Market\" first, and `q=\"Monzo\"` over the\ndefault 24 hours returns nothing at all. `subject` and `q` combine, so\n`subject=\"Tesla\", q=\"recall OR lawsuit\"` reads as expected.\n\nLeave `sort` alone unless the user asked for an ordering. The API then picks `relevance`\nwhen there is a query and `newsrooms` when there is not — forcing `newsrooms` on a keyword\nsearch ranks by story size instead of match quality.\n\n`check_coverage` answers a different question from all of them: it reports how many\nINDEPENDENT newsrooms carried a claim, separately from how many domains reprinted it. Reach\nfor it whenever the user is asking whether something is real rather than what happened.\n\nNothing is required. A bare `news()` call returns the most-corroborated stories of the\nlast 24 hours, so never refuse for lack of parameters — call it and refine after.\n\nAuthentication is configured on the connection (an `x-api-key` or `Authorization: Bearer`\nheader, the MCP URL's `?apiKey=…`, or env `NEWSMCP_API_KEY`) — never ask the user for a key.\nUse `check_health` only to verify the API is up — it returns no news.\n\nSome tools rewrite a query before sending it, because the index removes function words when\nit is built but the query still requires every word given — so `q=\"what is happening with\nDisney\"` matches nothing. Any `Note:` line in a result explains what was adjusted or\nnarrowed. **Relay those notes**; never present a narrowed result as complete.\n\n## Limits — know these before you plan a sequence of calls\n\n|                            | Keyless    | With a key            |\n|----------------------------|------------|-----------------------|\n| `from_` lookback           | 7 days     | per plan (14 days free_tier)|\n| Calls per hour             | 20         | per plan (50 free_tier)    |\n| `limit` (stories per call) | 20         | per plan (50 free_tier)    |\n| Requests in flight at once | 1          | 1                     |\n\n**Call `check_limits` rather than trusting that table.** Every keyed number is per-plan\nconfig that changes without a release.`check_limits` reports the live ceilings\n*and* how much of the hourly budget is left, and costs nothing: it is exempt from metering,\nso checking never consumes a call, a slot or a credit. Use it before planning a batch of\ncalls, and after any limit error instead of guessing what was hit.\n\n**Call one at a time.** A keyed caller gets exactly ONE request in flight; a second before\nthe first returns is refused with a 429. So never fan out: \"compare banking, energy and\nsemiconductors\" is three calls in sequence, or better, one call with\n`sector=\"banking,energy_utilities,semiconductors\"`.\n\n**Budget your calls.** The hourly count is the scarce resource, and every page is one call.\nSet the filters you\nneed on the first attempt instead of probing one at a time. Keyless callers share the\n20/hour budget per network address, so it may already be partly spent by someone else.\n\n**Over-limit behaves differently per tier.** Keyless: the call still succeeds, narrowed to\nthe allowance, with a note in the response saying what was adjusted — relay that note\nrather than presenting a narrowed result as complete. With a key: the call is rejected with\na validation error naming the parameter and its maximum.\n\n## CRITICAL: `response_format` (default `markdown` — looks good out of the box)\n\nHosts only see `content[0].text`. Default is **`markdown`** (readable digest of every story\nreturned). Omit the param when the user does not ask for a format. When the user *does* ask,\nyou MUST pass the matching value:\n\n| User says | Pass |\n|---|---|\n| no format / \"find news\" / \"what happened\" | omit or `response_format=\"markdown\"` |\n| \"text\", \"plain text\", \"as text\" | `response_format=\"text\"` |\n| \"markdown\", \"as markdown\", \"md\", \"formatted digest\" | `response_format=\"markdown\"` |\n| \"json\", \"as json\", \"raw json\", \"full payload\", \"full response\" | `response_format=\"json\"` |\n\nNever answer that you cannot produce text/markdown/JSON without first calling with the matching\n`response_format`. Do not post-process one format into another when the tool can return it.\n\n## Query syntax (`q` parameter)\n\n`q` is **optional** — omit it entirely for a filter-only digest (e.g. \"top banking stories\ntoday\" is `sector=\"banking\"` with no `q`). When you do pass one:\n\n- `q` is matched against the story's headline, one-liner, abstract, and actor names — not\n  against full article bodies. Keep it to the words that would appear in a headline.\n- **Always quote multi-word phrases.** The API auto-inserts `AND` between bare, unquoted,\n  space-separated words, so `q=\"AI OR artificial intelligence\"` is parsed as\n  `AI OR artificial AND intelligence` and is rejected with a `422`. Write\n  `q='AI OR \"artificial intelligence\"'`, or parenthesize each side.\n- Exact phrase: wrap it in literal double-quote characters, e.g. `q='\"Tim Cook\"'`. Without\n  quotes, `q='Tim Cook'` means `Tim AND Cook`.\n- Boolean: `AND`, `OR`, `NOT`, with parentheses to control evaluation order, e.g.\n  `(bitcoin OR cryptocurrency) AND (investment OR trading)`.\n- Prefix shorthand: `+term` to require, `-term` to exclude.\n- Wildcards: `*` (any length) and `?` (single character); neither may lead a term\n  (`*intelligence` is invalid, `technolog*` is fine).\n- `NEAR()` and `MULTIPLE()` are **not** supported here.\n- Forbidden characters, never valid anywhere in `q`: `[ ] / \\ : ^`.\n- On a `422`, fix the quoting/parentheses and retry. If results look wrong: too broad → add\n  `AND` terms or `NOT` exclusions; too few → widen `from_`, drop a filter, or use `OR`.\n\nGood: `\"renewable energy\" OR solar` · `AI OR \"artificial intelligence\"` ·\n`(OpenAI OR Anthropic) AND model` · `\"Tim Cook\"` · `Tesla NOT \"Elon Musk\"`\nBad (422): `renewable energy OR solar` · `AI OR artificial intelligence`\n\n## How to set each news field\n\nMap the user's request into these parameters (omit optional ones you do not need):\n\n- **q**: query built with the rules above, or omitted for a filter-only digest.\n- **event_id**: fetch ONE story by an id from an earlier result. Every other filter is\n  ignored. A story folded into a more complete one answers `404` naming its replacement id —\n  fetch that id instead.\n- **event_type**: what KIND of event it is, as an exact `family.leaf` value, comma-separated\n  for OR (`deals.merger_acquisition,funding.venture_funding_round`). A bare family (`deals`)\n  is invalid and unknown values are rejected by name — the tool's own parameter description\n  carries all 59 leaves across 21 families, so read it rather than guessing. `unclassifiable`\n  is itself a valid value.\n- **content_type**: article form — `news_report`, `press_release`, `explainer`, `commentary`,\n  `analysis`, `opinion`, `interview`, `human_interest`, `service_info`, `obituary`.\n  Comma-separated for OR.\n- **sector**: industry, comma-separated for OR, e.g. `banking,semiconductors`.\n- **min_articles** / **min_sources** / **min_newsrooms**: three coverage floors, loosest to\n  strictest. `min_articles` counts every article including duplicates (a rough size floor);\n  `min_sources` counts distinct publisher domains with mirrors included (breadth of pickup);\n  `min_newsrooms` counts outlets that reported *independently* — the strongest \"is this\n  real\" filter, and the one to use when the user wants to exclude a story one outlet ran and\n  everyone else reprinted. `min_newsrooms=3` for \"well-corroborated only\".\n- **min_confidence**: labeling-confidence floor 0–1; unscored stories are excluded.\n- **from_** / **to_**: window over when the story BEGAN, not article publish dates. ISO 8601\n  (`2026-07-01T00:00:00`) or natural language (`3 days ago`). Default: last 24 hours — widen\n  `from_` first when a story that should exist comes back empty.\n- **enriched_only**: `true` (default) hides brand-new stories with no headline/summary yet.\n- **sort**: `newsrooms` (default, most corroborated), `trending` (corroboration weighted by\n  recency — use for \"what's big right now\"), `relevance` (best match, REQUIRES `q`),\n  `last_seen`, `first_seen`, `size`, `source_count`, `confidence`. **order**: `desc` (default)\n  or `asc`.\n- **limit**: how many stories to return, capped per tier. A flat ceiling, not a page\n  size — there is no paging past it, so this is the most a single call can surface.\n- **verbosity**: affects ONLY the source-link list — headline, summary, actors, and labels\n  are always present. `compact` (none), `standard` (default, up to 3), `full` (all,\n  uncapped). Prefer `standard`; `full` on a large `limit` returns a very long digest.\n- **response_format**: see the table above.\n\nFilters combine with **AND** — `sector=banking` plus `min_newsrooms=3` means banking\nstories with at least 3 independent outlets. `event_type`, `content_type`, and `sector`\neach take several comma-separated values combined with **OR**.\n\n## Worked examples\n\n| The user says | The call |\n|---|---|\n| \"what's trending in funding rounds right now\" | `event_type=\"funding.venture_funding_round\", sort=\"trending\"` |\n| \"quick summary of what's happening with Acme Corp\" | `q='\"Acme Corp\"'` |\n| \"well-corroborated cybersecurity stories, 3+ independent outlets\" | `event_type=\"security.cyberattack\", min_newsrooms=3` |\n| \"banking news, only confidently-labeled\" | `sector=\"banking\", min_confidence=0.7` |\n| \"just the analysis pieces on the merger, not straight news\" | `q=\"merger\", content_type=\"analysis\"` |\n| \"top 20 stories today\" | `limit=20` |\n| \"show me every source link\" | `verbosity=\"full\"` |\n| \"pull that story up again\" | `event_id=\"evt_…\"` from the earlier result |\n| \"what happened last week in semiconductors\" | `sector=\"semiconductors\", from_=\"7 days ago\"` |\n\n## When a call comes back empty or wrong\n\nLoosen one thing at a time, in this order:\n\n1. **Widen `from_`.** The default window is only 24 hours and it bounds when the story\n   *started*, so an ongoing story that began earlier is invisible. This is the single most\n   common cause of \"but I know that story exists\".\n2. **Lower a floor** — `min_newsrooms`, `min_sources`, `min_articles`, `min_confidence`.\n3. **Pass `enriched_only=False`** if the story broke minutes ago.\n4. **Drop a label filter.** `event_type` / `content_type` / `sector` are exact-match; a\n   story can be labeled differently than expected.\n5. Only then simplify `q` — or drop it and rely on filters.\n\n## What each error means and what to do\n\n- **429 with `retry_after_seconds` — the hourly budget is spent.** Further calls are blocked\n  until the window resets. **Do not retry in a loop and do not keep calling with different\n  parameters** — every attempt is refused and, keyless, counts against the same shared\n  budget. `check_limits` will confirm the wait without spending anything. Tell the user how\n  long it is and that a key (or a higher plan) raises the ceiling; only retry if the wait is\n  short and they ask.\n- **429 without it (\"Max API Requests Concurrency Reached\") — you called in parallel.** The\n  cap is one request in flight, and nothing was spent from the hourly budget. Wait for the\n  previous call to finish and retry this one; do not treat it as a quota problem.\n- **499 plan_limit.** A value is beyond this caller's plan and the message names the field\n  and its maximum. Re-issue once with that value clamped. If the message does not name a\n  number, `check_limits` will.\n- **400 invalid_filter_value.** An `event_type`/`content_type`/`sector` value is not in the\n  taxonomy. The message lists every accepted value — pick the closest one from that list and\n  retry once. Never retry unchanged.\n- **422 validation error.** It names the parameter and the allowed maximum — usually `limit`\n  or a `from_` beyond the plan's history. Re-issue the call ONCE with that value clamped to\n  the stated maximum; never retry unchanged. `from_` later than `to_` lands here too.\n- **404 on `event_id`.** If it names a replacement id, the story was folded into a larger\n  one — fetch that id. Otherwise the id never existed: search again for a current one.\n- **408 timeout.** Retry once, then narrow the window or lower `limit`.\n- **503 service_overloaded.** The backing search index is overloaded, not a bad request.\n  Retry once after a few seconds; if it repeats, stop and report the outage rather than\n  looping.\n- **A notice in a successful response.** Keyless narrowing happened. Say so.\n\nDo not invent unsupported operators, and do not put filters inside `q` that belong in a\ndedicated field (put the industry in `sector`, not in `q`).",
      "tools": [
        {
          "name": "check_coverage",
          "description": "Judge how widely and how independently a claim has been reported.\n\nAnswers \"is this real?\" rather than returning a list. Reports the number of\nINDEPENDENT newsrooms — outlets that reported it themselves — separately\nfrom the number of domains that carried it, which includes syndication. A\nstory on 200 domains from 3 newsrooms is one story reprinted, not 200\nconfirmations.\n\nBecause upstream clustering splits a story across languages, this totals the\nlikely variants of the same story and presents that total as an upper bound,\nlisting what was combined so the caller can check it is really one story.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "claim": {
                "description": "The claim or headline to check, phrased in the words a headline would use. Matched literally against headlines and summaries, not by meaning, so \"atomic arsenal\" will not find stories about nuclear weapons.",
                "type": "string"
              },
              "days_back": {
                "default": 14,
                "description": "How far back to look, in days. Defaults to 14. Clamped down to whatever the caller's plan allows, with a note saying so.",
                "minimum": 1,
                "type": "integer"
              },
              "response_format": {
                "default": "markdown",
                "description": "markdown (default), text, or json. Pass the format the user asked for rather than reformatting afterwards.",
                "enum": ["text", "markdown", "json"],
                "type": "string"
              }
            },
            "required": ["claim"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "description": "Corroboration verdict for a claim.",
            "properties": {
              "anchor_newsrooms": {
                "description": "Independent newsrooms for the best-corroborated matching story.",
                "type": "integer"
              },
              "combined_newsrooms_upper_bound": {
                "description": "Sum across clustered variants of the same story — an upper bound, not a confirmed count.",
                "type": "integer"
              },
              "matched": {
                "description": "Whether any story matched the claim text in the window.",
                "type": "boolean"
              },
              "notes": {
                "description": "Query-normalization and plan-clamping notes to relay verbatim.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total_matching_stories": {
                "type": "integer"
              },
              "variants": {
                "description": "Anchor story first, then its likely variants.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "abstract": {
                      "type": ["string", "null"]
                    },
                    "content_type": {
                      "type": ["string", "null"]
                    },
                    "entities": {
                      "description": "Key actors named in the story.",
                      "items": {
                        "additionalProperties": true,
                        "properties": {
                          "name": {
                            "type": "string"
                          }
                        },
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "event_id": {
                      "description": "Stable id, e.g. evt_...",
                      "type": "string"
                    },
                    "event_type": {
                      "description": "family.leaf taxonomy value, e.g. deals.merger_acquisition.",
                      "type": ["string", "null"]
                    },
                    "first_seen": {
                      "description": "ISO 8601 UTC.",
                      "type": ["string", "null"]
                    },
                    "headline": {
                      "type": ["string", "null"]
                    },
                    "language_count": {
                      "type": ["integer", "null"]
                    },
                    "last_seen": {
                      "description": "ISO 8601 UTC.",
                      "type": ["string", "null"]
                    },
                    "newsrooms": {
                      "description": "Independent newsrooms — the corroboration signal.",
                      "type": ["integer", "null"]
                    },
                    "one_liner": {
                      "type": ["string", "null"]
                    },
                    "reports": {
                      "type": ["integer", "null"]
                    },
                    "sector": {
                      "type": ["string", "null"]
                    },
                    "size": {
                      "description": "Article count.",
                      "type": ["integer", "null"]
                    },
                    "source_count": {
                      "description": "Publisher domains, mirrors included.",
                      "type": ["integer", "null"]
                    },
                    "sources": {
                      "description": "Source article URLs — a sample or the full list per verbosity.",
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              }
