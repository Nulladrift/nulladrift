        {
          "name": "pause_resume_applications",
          "title": "Pause or resume AIApply applications",
          "description": "Use this when the connected user asks to stop or restart AIApply applying for them. action=\"pause\" stops all automatic applying and is destructive: call it without confirmed, show the user what will stop, ask them, then call again with confirmed=true. action=\"resume\" restarts applying and spends credits, so confirm it the same way. To stop applications to particular roles only, this is the wrong tool — that is a preference change the user makes in AIApply. Needs an AIApply account: if the user has not signed in, calling it asks them to sign in or create one. It also needs a permission the user grants; if it was not granted, calling it asks the user to allow it.",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "pause stops all automatic applying; resume restarts it.",
                "enum": ["pause", "resume"],
                "type": "string"
              },
              "confirmed": {
                "description": "True only after the user has explicitly agreed to this change.",
                "type": "boolean"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "applied": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "True only when the queue changed."
              },
              "error": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "True when the change could not be made."
              },
              "message": {
                "type": "string"
              },
              "previous_status": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The status it held before."
              },
              "queue_status": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The status the queue now holds."
              },
              "reason": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Why nothing changed, when nothing did."
              },
              "user_message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Show this to the user rather than message."
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Pause or resume AIApply applications"
