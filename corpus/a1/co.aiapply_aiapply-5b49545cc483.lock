                "type": "string"
              },
              "experience_level": {
                "enum": ["experience_level_intern", "experience_level_entry", "experience_level_junior", "experience_level_mid", "experience_level_senior", "experience_level_director", "experience_level_executive"],
                "type": "string"
              },
              "job_titles": {
                "description": "1 to 5 roles to apply for.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "work_mode": {
                "description": "in_person_hybrid for on-site or hybrid, full_remote for remote.",
