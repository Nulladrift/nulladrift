                "description": "True when a cover letter exists but was withheld for carrying contact details, credentials, health information or embedded instructions.",
                "type": "boolean"
              },
              "job": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null when no such application belongs to the account.",
                "properties": {
                  "company": {
                    "type": "string"
                  },
                  "job_id": {
                    "type": "string"
                  },
                  "listing_url": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
