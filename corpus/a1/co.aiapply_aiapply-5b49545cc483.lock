              }
            ]
          },
          "digest": "sha256:d030e65522592bde3c475873a3b1d0b1208f7fa118b8ad76e85593f26832af5f"
        },
        {
          "name": "get_credits_summary",
          "title": "Get AIApply credits and plan",
          "description": "Use this before queuing or sending work to check the connected user can still pay for it, or when they ask how many applications they have left. Reports the credit balance, whether auto-apply is active, the plan slug and the configured daily cap. The balance is what remains; the daily cap is not — nothing here says how many applications already went out today. It does not report prices, renewal dates or payment details, so send the user to AIApply for anything about billing itself. Needs an AIApply account: if the user has not signed in, calling it asks them to sign in or create one.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "auto_apply_active": {
                "description": "False when the subscription does not entitle applying.",
                "type": "boolean"
              },
              "billing_state": {
                "description": "known, no_billing_record, or unreadable.",
                "type": "string"
              },
              "credits": {
                "properties": {
                  "balance": {
                    "anyOf": [
                      {
                        "type": "integer"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Null when the balance could not be read, which is not the same as knowing it is zero — and not a reason to assume it is positive."
                  },
                  "balance_state": {
                    "description": "known or unreadable. A genuine zero reads as unreadable too, because the upstream answers a failed lookup with zero. On unreadable, do not start work that spends credits: say the balance could not be read and let the user check AIApply.",
                    "type": "string"
                  }
                },
                "required": ["balance_state"],
                "type": "object"
              },
              "daily_application_limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The configured daily cap, not how much of it is left. Nothing here reports how many went out today, and multiplying it out to a weekly or monthly figure is never valid. Null when no queue exists."
              },
              "message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Present when the billing state needs explaining. Follow it."
              },
              "plan_slug": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Null when no plan could be read."
              }
            },
            "required": ["billing_state", "credits"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get AIApply credits and plan"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:use"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:13be99f377614bc958c375e1c66e6980006c9716ceb8961162bafd52dc7b9808"
        },
        {
          "name": "get_setup_status",
          "title": "Get AIApply setup status",
          "description": "Use this when the connected user wants AIApply to apply for them, and again whenever they come back to it: it says what is still missing — their resume, their confirmed job preferences, or applying being active on the account — and next_step names the one thing to do now. Follow message. setup.suggested holds the values read from their resume, for the user to confirm. Needs an AIApply account: if the user has not signed in, calling it asks them to sign in or create one.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "applying_active": {
                "description": "Whether applying is active on this account.",
                "type": "boolean"
              },
              "can_search": {
                "description": "Whether AIApply searches for and queues jobs for this user.",
                "type": "boolean"
              },
              "links": {
                "properties": {
                  "dashboard_url": {
                    "type": "string"
                  },
                  "finish_setup_url": {
                    "type": "string"
                  }
                },
                "required": ["dashboard_url", "finish_setup_url"],
                "type": "object"
              },
              "message": {
                "type": "string"
              },
              "next_step": {
                "enum": ["add_resume", "confirm_setup", "choose_jobs", "applying_inactive", "finish_on_website", "applying"],
                "type": "string"
              },
              "resume": {
                "properties": {
                  "added": {
                    "type": "boolean"
                  },
                  "source": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "file or text."
                  }
                },
                "required": ["added"],
                "type": "object"
              },
              "search_only": {
                "anyOf": [
                  {
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "A period in which AIApply searches for jobs for this account without applying to them, if one was set up.",
                "properties": {
                  "ends_at": {
                    "type": "string"
                  },
                  "running": {
                    "type": "boolean"
                  }
                },
                "required": ["ends_at", "running"]
              },
              "setup": {
                "properties": {
                  "saved": {
                    "type": "boolean"
                  },
                  "submitted": {
                    "type": "boolean"
                  },
                  "suggested": {
                    "anyOf": [
                      {
                        "type": "object"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "description": "Values read from the resume. Show every one; ask about each field in ask_the_user."
                  }
                },
                "required": ["saved", "submitted"],
                "type": "object"
              }
            },
            "required": ["applying_active", "can_search", "links", "message", "next_step", "resume", "setup"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get AIApply setup status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:use"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:0f6513800f8e1bf4b3acaf08e9f01dfbfd54359e093d87d5facbffaf15c73e8d"
        },
