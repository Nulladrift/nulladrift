        {
          "name": "apply_to_job",
          "title": "Apply to a job from AIApply search",
          "description": "Use this when the connected user wants AIApply to apply to a job they picked from search_jobs. AIApply adds it to their queue already approved, so it does not wait for anyone: it will be applied for and that spends a credit. This is the only point the user is asked, so call it without confirmed, show them the job, ask them, then call again with confirmed=true. Adding the same job twice is refused rather than repeated. If the account is not set up yet, it says so: call get_setup_status first. Needs an AIApply account: if the user has not signed in, calling it asks them to sign in or create one. It also needs a permission the user grants; if it was not granted, calling it asks the user to allow it. A job_id from search_jobs stays valid after either.",
          "inputSchema": {
            "properties": {
              "confirmed": {
                "description": "True only after the user has explicitly agreed to apply for this job.",
                "type": "boolean"
              },
              "search_job_id": {
                "description": "The job_id from search_jobs. Not the job_id from list_review_jobs.",
                "type": "string"
              }
            },
            "required": ["search_job_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "applies_after": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "applying_active when the job waits in the queue until applying is active on the account."
              },
              "dashboard_url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The AIApply dashboard, where the user manages Auto Apply."
              },
              "error": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "True when the job could not be added."
              },
              "message": {
                "type": "string"
              },
              "queued": {
                "anyOf": [
                  {
                    "type": "boolean"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "True only when the job was added."
              },
              "reason": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Why nothing was added, when nothing was."
              },
              "updates_offer": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Present once, when the account is first ready: something you may offer the user. Act on it only if they agree."
              },
              "user_message": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Show this to the user rather than message."
              }
            },
            "required": ["message"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Apply to a job from AIApply search"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:use", "mcp:queue"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:05239b25e05ade97be52840fd73e037c378acdaa2f321929dd83ef2d22a806aa"
        },
        {
          "name": "get_auto_apply_preferences",
          "title": "Get AIApply job preferences",
          "description": "Use this when the connected user asks about current AIApply job preferences or before suggesting a change. Read target roles, locations, work types, experience, salary, exclusions, daily limit, and application mode without modifying them. Nothing here can change them: to change one, call open_auto_apply_preferences for the page the user changes it on. Needs an AIApply account: if the user has not signed in, calling it asks them to sign in or create one.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "preferences": {
                "type": "object"
              },
              "view": {
                "enum": ["preferences"],
                "type": "string"
              }
            },
            "required": ["preferences", "view"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get AIApply job preferences"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:use"],
