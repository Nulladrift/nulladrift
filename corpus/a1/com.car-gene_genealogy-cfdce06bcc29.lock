  "subjects": {
    "com.car-gene/genealogy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.car-gene.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "CarGene",
        "version": "0.4.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Japanese car genealogy with sources. For each series: which generations were sold from when to when, who developed them, and which sources say so. For a generation, also its specifications (engine output and torque, catalog grades) and the aftermarket parts that a published fitment table lists as fitting it. Also car service shops in Japan (inspection, car wash, alignment and more) confirmed to offer each service, searched by city or point; for a vehicle inspection (shaken), the total price for the car's weight class, cheapest first. Also used cars that dealers list on car-gene.com, with the total payment. Read-only. Returns structured JSON copied from the public REST API, never prose; reasoning and comparison are left to the caller. Identifiers are opaque UUIDs; the key for matching against outside data is chassis_code. An empty list means 'not researched yet', never 'none'. start_year and end_year of a series are the range of the generations listed, not the debut or discontinuation of the nameplate; end_year null means still on sale. Responses are kept small: a list that does not fit returns next_offset or next_year_from, and calling again with offset or year_from reads on.",
      "tools": [
        {
          "name": "check_part_fitment",
          "title": "Check aftermarket part fitment",
          "description": "Use this when the user asks whether an aftermarket part (wheel, coilover, muffler, brake pad, intake and so on) fits a specific car generation, or which parts are confirmed to fit it. Pass the model_id of that generation from search_vehicles. Returns {model, url, total, parts, next_offset}. parts lists only the products that a published fitment table, such as the maker's own, names as fit or conditional for this generation; products not tied to any vehicle and fitment guessed from bolt pattern or size are never included, and a size is left out at any position where the table notes it sticks out of the fender or needs bodywork. Each part has name, manufacturer, part_number, part_key, description, official_url and variants: the sizes or versions that fit, each with specification, status (fit or conditional), conditions (for conditional, the notes of the fitment table as written, such as positions, tires, production period or remarks; tell the user about them), list_price_yen (the maker's list price in yen, tax included, for one unit as the maker sells it, and the unit differs by part: one wheel for wheels, so a car takes four; the whole car's kit for suspension such as coilovers; one axle, left and right, for brake calipers and brake pads; for other parts the item as the maker lists it; null when not listed), wheel dimensions when the part is a wheel, and other attributes. url is this generation's page on car-gene.com to show the user; it is null when the generation has no confirmed fitment. The response has no seller prices and no purchase links. Narrow with part_key and query. Parts are cut to fit the response size; when next_offset is not null, call again with offset set to it. An empty parts list means nothing matched among the confirmed fitments; the part may not be researched yet for this generation, so never say it does not fit. Do not use this for the history, specs or developers of a car (use get_vehicle), or to find a garage that installs parts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "model_id": {
                "description": "Generation (model) id, a UUID from search_vehicles (matched_models, or models of get_vehicle). A series id is not accepted: fitment is per generation.",
                "type": "string"
              },
              "offset": {
                "description": "Where to start in the list; pass next_offset from the previous response. Omit to start from the beginning.",
                "minimum": 0,
                "type": "integer"
              },
              "part_key": {
                "description": "Only parts of this kind. For example wheel (ホイール), suspension (車高調・サスペンション), muffler (マフラー), brake (ブレーキパッド), brake_caliper (ブレーキキャリパー), intake (エアクリーナー・吸気), rear_spoiler (リアスポイラー). Omit for all kinds.",
                "enum": ["front_bumper", "front_grille", "front_spoiler", "headlight", "fog_lamp", "drl", "front_turn_signal", "hood", "front_emblem", "front_fender", "rear_fender", "front_door", "rear_door", "door_mirror", "door_handle", "side_skirt", "side_turn_signal", "side_glass", "quarter_glass", "rear_bumper", "tail_light", "rear_fog_lamp", "rear_turn_signal", "trunk_lid", "rear_spoiler", "diffuser", "muffler", "rear_emblem", "roof", "roof_antenna", "sunroof", "roof_molding", "windshield", "rear_glass", "wheel", "tire", "brake", "brake_disc", "brake_caliper", "suspension", "undercover", "engine", "intake", "turbocharger", "intercooler", "radiator", "transmission", "differential", "body_shell", "body_color", "dashboard", "meter_panel", "instrument_cluster", "display", "navigation", "audio", "steering_wheel", "steering_switch", "steering_column", "hud", "center_console", "shift_lever", "shift_boot", "parking_brake", "drink_holder", "armrest", "cup_holder", "storage", "front_seat", "driver_seat", "passenger_seat", "rear_seat", "headrest", "seat_belt", "seat_rail", "door_trim", "door_armrest", "inner_door_handle", "power_window_switch", "speaker", "door_pocket", "ac_panel", "ac_vent", "heater", "defroster", "accelerator_pedal", "brake_pedal", "clutch_pedal", "footrest", "floor_mat", "roof_lining", "room_lamp", "sun_visor", "room_mirror", "assist_grip", "trunk", "trunk_mat", "tonneau_cover", "luggage_board"],
                "type": "string"
              },
              "query": {
                "description": "Part number, product name or maker name, such as TE37, RAYS or a part number. Width, case and hyphens are normalized away; words separated by spaces must all match. Omit to list everything confirmed.",
                "type": "string"
              }
            },
            "required": ["model_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
