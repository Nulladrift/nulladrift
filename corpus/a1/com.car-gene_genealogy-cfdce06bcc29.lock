          "digest": "sha256:fd7234cc23501dc092be69dbaa1da162a5d3832df536538cc297c515994abfe7"
        },
        {
          "name": "get_vehicle",
          "title": "Get a series with its generations",
          "description": "Get one series with the list of its generations (models) and the cited sources, and with a model_id also that generation in detail. Returns {series, maker, models, sources}, plus model when a model_id is given. Each entry in models has id, name, chassis_code, start_year, end_year (null = still on sale), description, source_url and its public page url; the list is always the whole series. model is the named generation with drivetrains, displacements (engine displacement in cc, one row per engine), and engineers (each with role_name, source_url citing the person's own career, and link_source_url citing that person's work on this very generation; a null link_source_url means not researched yet, so do not read source_url as evidence for this generation). sources are the cited references for the descriptions (url, title, publisher, accessed_on, and model_id: null for the series overview, otherwise the generation whose description it supports); a generation's own sources come only with its model_id. For power, torque, weight, dimensions or prices, use get_vehicle_specs. For the engineers of several generations, call once per model_id. An empty drivetrains, displacements, engineers, or sources list means not researched yet, never none. Unknown ids are an error, not an empty result.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Pass exactly one of series_id or model_id.",
            "properties": {
              "model_id": {
                "description": "Generation (model) id (a UUID from search_vehicles). Takes precedence over series_id when both are given.",
                "type": "string"
              },
              "series_id": {
                "description": "Series id (a UUID from search_vehicles).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
