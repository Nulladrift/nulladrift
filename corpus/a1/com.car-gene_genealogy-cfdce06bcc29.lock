        {
          "name": "get_vehicle_relationships",
          "title": "Get relationships between generations",
          "description": "Get the relationships between generations (succession, sibling, derivation, spiritual successor). A series_id returns the relations of the whole series; a model_id returns only the relations that have that generation at either end. Returns {series_id, url, total, relations, next_offset}, plus model_id when given: each relation has kind and kind_name, kind_directed, from_model and to_model (each with id, name, chassis_code, start_year, end_year, series_name and public page url), and where the source requires one, source_url with the verbatim source_excerpt; rationale is filled for spiritual successors. When kind_directed is false the two ends are interchangeable, so treat the relation as belonging to both generations. Relations are cut to fit the response size; when next_offset is not null, call again with offset set to it. An empty relations list means not researched yet, never that the car has no relatives.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Pass exactly one of series_id or model_id.",
            "properties": {
              "model_id": {
                "description": "Generation (model) id (a UUID from search_vehicles). Takes precedence over series_id when both are given.",
                "type": "string"
              },
              "offset": {
                "description": "Where to start in the list; pass next_offset from the previous response. Omit to start from the beginning.",
                "minimum": 0,
                "type": "integer"
              },
              "series_id": {
                "description": "Series id (a UUID from search_vehicles).",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
