        {
          "name": "get_sales_figures",
          "title": "Get sales figures",
          "description": "Get the sales figures of a series. Without region_code it returns the overview {series_id, url, region_totals, lifetime, coverage, regions}; with region_code it returns that region year by year {series_id, url, region_code, region_totals, coverage, cells, figures, next_year_from}. region_totals sum years within one country only, so never add across countries or add a parent region to its children. lifetime rows are cumulative or per-generation totals that must not be added to the grid. With a model_id, region_totals and lifetime are those of that generation; otherwise region_totals are the series totals and lifetime is the whole series. coverage rows are the blanks that were checked and found empty, with the reason; a region with coverage rows and no figures was researched, not skipped. regions lists the region codes that have figures or checked blanks, with the first and last year; pass one of them as region_code, since any other code is an error. cells are the grid a figure may be summed into, one per series, country, calendar year and metric; a null units on a cell means the sources disagree, never zero sold. figures are the rows as published, each with units, the source's own wording, the period, source_url and a verbatim source_excerpt; match them to cells by region_code, year and metric. A model_id narrows figures to that generation, while cells stay series-wide because allocating a year to a generation needs the whole series. Years are cut to fit the response size, never splitting a year; when next_year_from is not null, call again with year_from set to it. An empty list means not researched yet, never zero.",
          "inputSchema": {
            "additionalProperties": false,
            "description": "Pass exactly one of series_id or model_id.",
            "properties": {
              "model_id": {
                "description": "Generation (model) id (a UUID from search_vehicles). Takes precedence over series_id when both are given.",
                "type": "string"
              },
              "region_code": {
                "description": "A region code from regions in the overview, such as JP (upper case, as listed). Omit to get the overview.",
                "type": "string"
              },
              "series_id": {
                "description": "Series id (a UUID from search_vehicles).",
                "type": "string"
              },
              "year_from": {
                "description": "First calendar year to return for region_code; pass next_year_from from the previous response. Omit to start from the earliest year.",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
