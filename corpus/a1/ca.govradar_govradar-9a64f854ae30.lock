          "digest": "sha256:67f4e5b14bae6a0cc3359599c46918b16f351e2f0b5044eccc85967c10172e46"
        },
        {
          "name": "search_releases",
          "title": "Search government releases",
          "description": "Keyword search over Canadian government news releases from the last 7 days. Every word must appear in the headline or summary. Returns up to 5 matches, newest first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "jurisdiction": {
                "description": "Limit to one government, e.g. \"federal\", \"alberta\", \"ontario\". Omit for all of Canada.",
                "enum": ["federal", "alberta", "british_columbia", "saskatchewan", "manitoba", "ontario", "quebec", "new_brunswick", "nova_scotia", "prince_edward_island", "newfoundland_labrador", "yukon", "northwest_territories", "nunavut"],
                "type": "string"
              },
              "query": {
                "description": "Keywords, e.g. \"housing funding\" or \"wildfire\".",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "topic": {
                "description": "Limit to one policy topic, e.g. \"healthcare\", \"energy\". Call list_jurisdictions_and_topics for every id.",
                "enum": ["agriculture", "healthcare", "pharmacy", "education", "national_defence", "emergency_disaster", "liquor", "food", "energy", "environment", "economy", "housing", "immigration", "indigenous", "transportation", "justice", "cabinet_shuffle", "government_operations", "consultation", "labour", "technology", "arts_culture", "children_families", "seniors", "natural_resources", "international_relations", "municipal_affairs", "science_research", "trade_investment", "sports_recreation", "accessibility_disability"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
