      "serverInfo": {
        "name": "govradar",
        "title": "Government Radar",
        "version": "1.0.0",
        "websiteUrl": "https://www.govradar.ca"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Government Radar indexes official news releases from the Government of Canada and the provinces. This free version covers the last 7 days with up to 5 results per request; each result includes the official release link.",
      "tools": [
        {
          "name": "latest_releases",
          "title": "Latest government releases",
          "description": "Newest Canadian government news releases (federal, provincial, territorial) from the last 7 days, newest first, up to 5. Optionally filter by jurisdiction and topic.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "jurisdiction": {
                "description": "Limit to one government, e.g. \"federal\", \"alberta\", \"ontario\". Omit for all of Canada.",
                "enum": ["federal", "alberta", "british_columbia", "saskatchewan", "manitoba", "ontario", "quebec", "new_brunswick", "nova_scotia", "prince_edward_island", "newfoundland_labrador", "yukon", "northwest_territories", "nunavut"],
                "type": "string"
              },
              "topic": {
                "description": "Limit to one policy topic, e.g. \"healthcare\", \"energy\". Call list_jurisdictions_and_topics for every id.",
                "enum": ["agriculture", "healthcare", "pharmacy", "education", "national_defence", "emergency_disaster", "liquor", "food", "energy", "environment", "economy", "housing", "immigration", "indigenous", "transportation", "justice", "cabinet_shuffle", "government_operations", "consultation", "labour", "technology", "arts_culture", "children_families", "seniors", "natural_resources", "international_relations", "municipal_affairs", "science_research", "trade_investment", "sports_recreation", "accessibility_disability"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Latest government releases"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e78e79ddf8e8fc6724f00b54a4490cdedb109663c1e8418890b1472901585e79"
        },
        {
          "name": "list_jurisdictions_and_topics",
          "title": "List jurisdictions and topics",
          "description": "Lists the jurisdiction ids and policy topic ids Government Radar can filter releases by.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
