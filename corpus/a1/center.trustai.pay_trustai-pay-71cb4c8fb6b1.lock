{
  "lockfileVersion": 2,
  "subjects": {
    "center.trustai.pay/trustai-pay": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pay.trustai.center/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "trustai-pay",
        "title": "trustai.center pay",
        "version": "1.5.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Pay-per-use LLM inference for agents, paid in USDC/USDT. Use create_topup to get a tai_ key and deposit address, verify_topup after paying, then chat_completion. list_price_changes shows models that just got cheaper.",
      "tools": [
        {
          "name": "chat_completion",
          "description": "Run a chat completion billed to a tai_ key's credits.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "max_tokens": {
                "type": "number"
              },
              "messages": {
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "model": {
                "type": "string"
              }
            },
            "required": ["messages", "model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c73470985aefe5e353ba0c2bebca28bd03da8c55947cd1014f0285ffb29d3fb7"
        },
        {
          "name": "claim_topup",
          "description": "Credit a stablecoin transfer to our address that has no matching order (or a non-exact amount). Requires the sending wallet's signature of 'trustai.center claim <chain>:<tx_hash>'. Max 7 days old, each tx once. Omit api_key to get a new key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "chain": {
                "enum": ["base", "solana", "bsc"],
                "type": "string"
              },
              "signature": {
                "type": "string"
              },
              "tx_hash": {
                "type": "string"
              }
            },
            "required": ["chain", "tx_hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1260367c16d44737797cb228124e5b3041f96813371cfe04fa44a8a3e447994c"
        },
        {
          "name": "create_topup",
          "description": "Create a stablecoin top-up order. Returns the deposit address, chain and the exact amount to send. Omit api_key to create a new key (returned once).",
          "inputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "chain": {
                "default": "base",
                "enum": ["base", "solana", "bsc"],
                "type": "string"
              },
              "pack": {
                "description": "Credits in USD (1 = starter pack)",
                "enum": [1, 3, 10, 25],
                "type": "number"
              },
              "promo": {
                "type": "string"
              }
            },
            "required": ["pack"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3ae07c31a5ca383e33133e42f4125b58dffc978c4266c3474e7668848b89a814"
        },
        {
          "name": "get_balance",
          "description": "Get the credit balance, spend cap and amount spent for a tai_ API key.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "description": "tai_ key (optional if sent as Authorization: Bearer header)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8f5460e04910298477dae6ec6c0b7045e44b63f66487088c32aff7e0465a10dc"
        },
        {
          "name": "get_stats",
          "description": "Public platform stats from our database (tokens and requests in the last 24h, keys created, top models). Real numbers only.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24a3dfb37e66d03ca6edd4ccc1c532136a6ca30744a3550010fcbb232e01f167"
        },
        {
          "name": "get_usage",
          "description": "Usage and audit log for a tai_ key: recent charges (model, tokens, cost), top-ups, last-24h totals, balance and limits.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "limit": {
                "default": 50,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a751aa19c7f221f5404ccccf91d453111a13a0b058b539030e2eb7dd989f919d"
        },
        {
          "name": "list_models",
          "description": "List servable text chat models with USD prices (pricing.vs_list vs maker list price). Pass include=discovery to also see image/video models (servable:false). Filter by modality, max output price, text search; sort by popularity or price.",
          "inputSchema": {
            "properties": {
              "include": {
                "description": "Also list image/video/other models that are not servable here (servable:false)",
                "enum": ["discovery"],
                "type": "string"
              },
              "limit": {
                "default": 50,
                "type": "number"
              },
              "max_price": {
                "description": "Max USD per 1M output tokens (or per unit for media)",
                "type": "number"
              },
              "modality": {
                "enum": ["text", "image", "video", "audio", "embedding", "rerank", "other"],
                "type": "string"
              },
              "q": {
                "type": "string"
              },
              "sort": {
                "enum": ["popularity", "price", "price_desc", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e01f864c8614bed6b853e037f859e4db75c945b2cfb05c3f69bd31e0d481ffa"
        },
        {
          "name": "list_price_changes",
          "description": "Price-change feed: models whose price went down/up, or that were added/removed, since a date (default last 7 days), diffed between daily catalog syncs. Use type=price_down to find models that just got cheaper. No key needed.",
          "inputSchema": {
            "properties": {
              "days": {
                "default": 7,
                "description": "1-90",
                "type": "number"
              },
              "limit": {
                "default": 100,
                "type": "number"
              },
              "modality": {
                "type": "string"
              },
              "q": {
                "description": "substring of model id",
                "type": "string"
              },
              "servable": {
                "description": "only models callable now via chat completions",
                "type": "boolean"
              },
              "since": {
                "description": "ISO date or date-time (default: now - days)",
                "type": "string"
              },
              "type": {
                "description": "comma-separated: price_down, price_up, price_changed, added, removed",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:400174ef48c18533d7b80a70db160ba739297f198441db9858ba6167d6ad6055"
        },
        {
          "name": "list_trending",
          "description": "Featured trending models with prices (ranked by recent tokens served when available, otherwise a curated ranking; see ranking field).",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 10,
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9d62bd106e0245dc7b4aec35a05cc6431efb6f1a90d25c3b9b4c9fea6167b6c"
        },
        {
          "name": "quote",
          "description": "Price check before paying: worst-case USD cost and exact x402 amount for a model + max_tokens (+ optional messages or input_tokens), with up to 3 cheaper trending alternatives. No key needed, never charges.",
          "inputSchema": {
            "properties": {
              "input_tokens": {
                "type": "number"
              },
              "max_tokens": {
                "type": "number"
              },
              "messages": {
                "items": {
                  "properties": {
                    "content": {
                      "type": "string"
                    },
                    "role": {
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "type": "array"
              },
              "model": {
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3ce3a50382c29b1f3b3efe3e3d909bc8d75bbaeb8eda6693b7da760b4b926cae"
        },
        {
          "name": "set_cap",
          "description": "Set spend controls on a tai_ key: total spend cap, daily limit (UTC day) and per-request max, in USD. Omit a field to keep it, pass null to remove it.",
          "inputSchema": {
            "properties": {
              "api_key": {
                "type": "string"
              },
              "daily_limit_usd": {
                "type": ["number", "null"]
              },
              "per_request_max_usd": {
                "type": ["number", "null"]
              },
              "spend_cap_usd": {
                "type": ["number", "null"]
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8d0216e4949d0e67f0d22126ffa037e45a893d3aedaf9fdd6d4e4d96656798e4"
        },
        {
          "name": "verify_topup",
          "description": "Confirm a top-up after sending funds, by order id and transaction hash/signature. Credits the amount received (tolerance -0.5% or $0.01; other amounts need the sender's signature).",
          "inputSchema": {
            "properties": {
              "order_id": {
                "type": "string"
              },
              "signature": {
                "type": "string"
              },
              "tx_hash": {
                "type": "string"
              }
            },
            "required": ["order_id", "tx_hash"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e0e354c6385d7405efa5cbe9df723b368553e7561e64c9271f4ff8225a53d69"
        }
      ],
      "digest": "sha256:3dcbeb07bcc8df501c8a9a05a0201b115aa6216dc6115365887ee63c6393f0ec"
    }
  }
}
