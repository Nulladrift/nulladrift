          },
          "digest": "sha256:1c1440e91f5c90996e43fc3a04d4e1731a8b9b5e7700db0fe199d715eca46004"
        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the Huddlevo dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3babe40dbcbc3a59c9c6bbb3489fd9bfe1892c5e38d564c3ea314d4dbe2a75c1"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Huddlevo dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
