      "instructions": "Sixteen years of API research plus a governance compute layer, as tools, prompts, and resources. LIGHTER ENDPOINTS: this endpoint lists all 82 tools. If you only need one kind of work, connect to a task-scoped toolset instead — same tools, same auth, a fraction of the context: https://mcp.apievangelist.com/mcp/research (31 tools: sixteen years of API research — posts, papers, videos, conversations, areas, tags, building blocks, tools, services, solutions, timeline, feeds); https://mcp.apievangelist.com/mcp/governance (43 tools: the governance compute layer — validate, coverage, scorecard, waivers, diff, PII classification, overlays, certify, forge MCP tools, agent descriptors, pipeline audit, estate rollups — plus rule authoring (validate, test and explain rulesets, JSONPath, agent-skill linting) and estate adoption (baselines, federation, code-first, fixes, style guide to ruleset, org default ruleset)); https://mcp.apievangelist.com/mcp/insights (20 tools: company insights, dimensions, peers, gaps, whitespace and signals; entity demand; measured standards adoption and coalitions). Call get_overview first, or pick a guided prompt: where_can_ae_help / catch_up / learn_a_topic / find_the_paper to research; governance_baseline / classify_exposure / version_change_review to check an API free; author_a_rule to write governance rules that work; fix_these_diagnostics / write_ruleset_from_style_guide to fix findings and turn a style guide into rules; make_my_api_agent_ready / forge_mcp_server to make one agent-ready; govern_my_estate / make_internal_apis_agent_safe / pipeline_audit / certify_and_prove to govern at scale. Reading and checking are free; generating artifacts, certifying, auditing, and estate rollups are Pro — prompts list everything and upsell on use. See https://developer.apievangelist.com/plans/.",
