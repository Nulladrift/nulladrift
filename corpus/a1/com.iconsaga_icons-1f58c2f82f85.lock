{
  "lockfileVersion": 2,
  "subjects": {
    "com.iconsaga/icons": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://iconsaga.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "iconsaga",
        "title": "IconSaga",
        "version": "1.3.11",
        "websiteUrl": "https://iconsaga.com/mcp",
        "icons": [
          {
            "src": "https://iconsaga.com/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://iconsaga.com/brand/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "IconSaga: minimal pictogram icons in three styles (line, solid, duo) and two colours (primary + accent). Use search_icons to find icons: one search per icon you need, naming the thing it shows in 1-3 words in the user's language (English, Thai, Spanish, Portuguese, French, German, Japanese, Chinese, Korean, Indonesian or mixed), with lang when you know it; a whole request also works, but short words find more. Then get_icon to get the SVG in the colours, stroke weight and style you need. Every icon has a stable id and a version; free use needs the credit line in each result. Building a website: get_icon returns a React component (code \"tsx\", the default) or HTML (code \"html\") to save in the project, e.g. src/components/icons; its main colour is currentColor and the accent is the CSS variable --icon-accent. To swap the icons of a project, match_icons takes their names (arrow-right, circle-check, shopping-cart) and returns ours. Without an account you can try it: 30 tool calls a day (a free account: 1,000 a month). When a result says a limit is reached, pass its message on to the user and stop calling until the time it gives.",
      "tools": [
        {
          "name": "get_icon",
          "title": "Get icon SVG",
          "description": "SVG of one icon in a style, two colours and a stroke weight, and code to save in a project: code \"tsx\" (default) is a React component (size, className and title props; main colour currentColor so text colour classes work; accent from the CSS variable --icon-accent), \"html\" an inline SVG snippet, \"svg\" the file only. format \"svg\" is a still icon (1-2 filled paths, works in PowerPoint, Figma, web); \"anim-svg\" plays its motion in browsers with no player or script.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accent": {
                "description": "Accent colour for the duo style, hex like #FFB020",
                "type": "string"
              },
              "code": {
                "description": "tsx (default): a React component · html: an inline SVG snippet · svg: the SVG file only",
                "enum": ["tsx", "html", "svg"],
                "type": "string"
              },
              "format": {
                "description": "Default svg",
                "enum": ["svg", "anim-svg"],
                "type": "string"
              },
              "id": {
                "description": "Icon id from search_icons (old ids still work)",
                "type": "string"
              },
              "lang": {
                "description": "Language of the label and licence link (as in search_icons). Default en",
                "type": "string"
              },
              "mode": {
                "description": "anim-svg only: loop (default), once, or hover",
                "enum": ["loop", "once", "hover"],
                "type": "string"
              },
              "primary": {
                "description": "Main colour, hex like #1E2A4A, or \"currentColor\"",
                "type": "string"
              },
              "size": {
                "description": "width and height attributes. Default 24",
                "maximum": 2048,
                "minimum": 8,
                "type": "integer"
              },
              "style": {
                "description": "Default line",
                "enum": ["line", "solid", "duo"],
                "type": "string"
              },
              "weight": {
                "anyOf": [
                  {
                    "maximum": 2.5,
                    "minimum": 0.5,
                    "type": "number"
                  },
                  {
                    "enum": ["auto"],
                    "type": "string"
                  }
                ],
                "description": "Stroke weight for line and duo, 0.5-2.5. Default auto: by size when you give one (24 px = 1.75, 48 = 1.25, 128+ = 0.75), else 1.25"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d2269dca8ebf7b8764e6b11e0bfc1579e09f7069a7bbbe2cd00385261ac4c9c"
        },
        {
          "name": "list_sets",
          "title": "List icon sets",
          "description": "All icon sets with how many icons each has.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the set names (as in search_icons). Default en",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4b668b73d0a489354675b69cbbfabccb0996f5090c83dd09d37ab18e809002fd"
        },
        {
          "name": "match_icons",
          "title": "Match icon names",
          "description": "Many icon names at once, as a project's UI icon set writes them (arrow-right, circle-check, shopping-cart, trash-2, HomeIcon), each with the closest IconSaga icon: to swap the icons of a whole project in one call. match is \"name\" (a known name), \"search\" (found by meaning) or \"none\". Then get_icon for the code of each.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the labels (as in search_icons). Default en",
                "type": "string"
              },
              "names": {
                "description": "Up to 60 icon names",
                "items": {
                  "type": "string"
                },
                "maxItems": 60,
                "minItems": 1,
                "type": "array"
              },
              "style": {
                "description": "Only icons available in this style",
                "enum": ["line", "solid", "duo"],
                "type": "string"
              }
            },
            "required": ["names"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:21968286ac4e19246faf9e1887136c10b2b06ede4aec7897112cf6d754558eea"
        },
        {
          "name": "search_icons",
          "title": "Search icons",
          "description": "Search IconSaga icons by meaning, in the user's own language (English, Thai, Spanish, Portuguese, French, German, Japanese, Chinese, Korean, Indonesian or mixed). Best: one search per icon, the thing it shows in 1-3 words (\"refund\", \"ลูกศรซ้าย\", \"地図のピン\"). A whole request also works: words that only ask (\"find me an icon for\", \"please\", ช่วยหา…หน่อย) are left out. Also takes an icon name as UI icon sets write it (arrow-right, circle-check, shopping-cart, trash-2, HomeIcon) and returns the matching icon first. Several things in one query (\"calendar clock schedule\"): when no icon has every word, the icons that have the most of the words come first (relaxed \"any-words\"; each result lists the words it matched in \"matched\", and \"unmatched\" the words no icon has). Returns icon ids, labels, versions, styles and licence per icon.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the labels in the answer, and of the names ranked first: en, th, es, pt-BR, fr, de, ja, zh-Hans, ko or id (regions and names such as pt, zh-CN, ja-JP or \"Japanese\" also work). Default: the language of the query. Give it when you know the user's language",
                "type": "string"
              },
              "limit": {
                "description": "Default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What the icon should show, e.g. \"invoice\", \"ลูกศรซ้าย\", \"carrito de compras\", \"地図のピン\", \"home บ้าน\"",
                "type": "string"
              },
              "set": {
                "description": "Only icons of this set (see list_sets)",
                "type": "string"
              },
              "style": {
                "description": "Only icons available in this style",
                "enum": ["line", "solid", "duo"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3a9e4f4192b3a4679b659de21139dce23755d43849719e4c6112b61f07316363"
        }
      ],
      "prompts": [
        {
          "name": "icons_for_slide",
          "title": "Icons for a slide",
          "description": "Find matching IconSaga icons for one slide, ready to paste",
          "arguments": [
            {
              "name": "topic",
              "description": "What the slide is about, e.g. \"our 3-step onboarding: sign up, set up, launch\"",
              "required": true
            },
            {
              "name": "colors",
              "description": "Brand colors, e.g. \"navy #1E2A4A and orange #FFB020\" (optional)",
              "required": false
            }
          ],
          "digest": "sha256:e8090e9291015ad13cd008c248c9aed7ae426136b0c85d398723c56c2bd54c61"
        },
        {
          "name": "icons_for_website",
          "title": "Icons for a website section",
          "description": "Add matching IconSaga icons to a section of a website",
          "arguments": [
            {
              "name": "section",
              "description": "The section and its points, e.g. \"the features section: fast, secure, 24/7 support\"",
              "required": true
            },
            {
              "name": "colors",
              "description": "Brand colors (optional)",
              "required": false
            }
          ],
          "digest": "sha256:cf05a8e4a470ba3914a70a00bb5f6a72644c01704ebaf5f4b35b5911f37a2e25"
        },
        {
          "name": "swap_project_icons",
          "title": "Swap a project's icons",
          "description": "Replace the icons a project uses with matching IconSaga icons",
          "digest": "sha256:aadc7ad9f9b04c8cb8854144d9c372e0a10bee7b516b9a578863fe2f0ba48d59"
        }
      ],
      "digest": "sha256:5b9a14d7c3501c98a80b65934f3d072f85c981a855bb5129d5fba56c06376062"
    }
  }
}
