        {
          "name": "create_chat_completion",
          "title": "Ask an AI model",
          "description": "Generate a reply from an AI model. Use when the app needs generated text. Before: a model id from list_ai_models and enough project balance. Returns the reply message, the tokens used (usage) and the amount charged: charge_usd_micro (millionths of a USD; charge_usd_minor, in cents, on the per-cent billing). Spends money: billed per token to the project balance at the price shown by get_pricing; the key's spending limit applies. Scope: ai:inference. Cost: paid, reserved on the prepaid balance before the call (released if it fails); prices: get_pricing. Short balance or limit: next_action top_up_balance or raise_app_spend_limit.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "idempotency_key": "chat-summary-0001",
                "max_tokens": 200,
                "messages": [
                  {
                    "content": "Summarize this order in one sentence.",
                    "role": "user"
                  }
                ],
                "model": "gpt-oss-20b"
              },
              {
                "idempotency_key": "chat-capital-0001",
                "max_tokens": 16,
                "messages": [
                  {
                    "content": "Answer in one word.",
                    "role": "system"
                  },
                  {
                    "content": "Capital of Kenya?",
                    "role": "user"
                  }
                ],
                "model": "gpt-oss-120b"
              }
            ],
            "properties": {
              "idempotency_key": {
                "description": "Unique per request; reuse it on retry to get the same reply without paying twice.",
                "pattern": "^[\\x21-\\x7e]{8,200}$",
                "type": "string"
              },
              "max_tokens": {
                "description": "Most tokens to generate (1 to 8192).",
                "maximum": 8192,
                "minimum": 1,
                "type": "integer"
              },
              "messages": {
                "description": "The conversation so far, oldest first (1 to 256 messages).",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "content": {
                      "description": "Text of the message.",
                      "maxLength": 65536,
                      "type": "string"
                    },
                    "role": {
                      "description": "Who wrote the message.",
                      "enum": ["system", "user", "assistant"],
                      "type": "string"
                    }
                  },
                  "required": ["content", "role"],
                  "type": "object"
                },
                "maxItems": 256,
                "minItems": 1,
                "type": "array"
              },
              "model": {
                "description": "A model id exactly as list_ai_models returns it.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$",
                "type": "string"
              },
              "seed": {
                "description": "Same seed and input for a repeatable reply.",
                "maximum": 2147483647,
                "minimum": 0,
                "type": "integer"
              },
              "stop": {
                "description": "Up to 4 strings that end the reply.",
                "items": {
                  "maxLength": 64,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 1,
                "type": "array"
              },
              "temperature": {
                "description": "Randomness, 0 to 2. Lower is more focused.",
                "maximum": 2,
                "minimum": 0,
                "type": "number"
              },
              "top_p": {
                "description": "Nucleus sampling, 0 to 1. Change this or temperature.",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["idempotency_key", "messages", "model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Ask an AI model"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:169361035cf926cbf5303985a804153ff5769f97d7cfaf789cf42985df2080af"
        },
        {
          "name": "create_database",
          "title": "Create a hosted database",
          "description": "Create a hosted PostgreSQL database in one step. Use when the app needs a database. Before: list_databases (needs database read access). With an app connected by OAuth, a person approves the database first (action backend.create). Returns the database and, this once, its connection url: store it as an environment secret, never print it. Scope: database:create ; the project balance must cover 24 hours. Cost: paid, billed per hour from the prepaid balance; the balance must cover 24 hours at creation (else next_action top_up_balance).",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "idempotency_key": "db-acme-0001",
                "name": "acme-app"
              }
            ],
            "properties": {
              "idempotency_key": {
                "description": "Unique per request. Reuse it on retry.",
                "pattern": "^[\\x21-\\x7e]{8,200}$",
                "type": "string"
              },
              "name": {
                "description": "Database name: 3 to 40 lowercase letters, digits and hyphens.",
                "pattern": "^[a-z][a-z0-9-]{1,38}[a-z0-9]$",
                "type": "string"
              }
            },
            "required": ["idempotency_key", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a hosted database"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:bffe3fb3734e086d81b9c0d705da3914e440235461a201b743b95de728cfc4f9"
        },
        {
          "name": "deploy_archive",
          "title": "Deploy files or an archive",
          "description": "Deploy a static site to a preview from its files or a ZIP or tar archive. Use when the user has a static site (an index.html) and no connected repository. Before: a key (test or live) and the site files with index.html at the root. Returns the deploy (djy_...), its preview address and preview_access_token when wait.outcome is ready; otherwise call advance_deploy until ready or failed. Test or live keys: the preview is made in the key's project. Scope: deploy:create. Cost: free (previews are not charged). Works with a test or a live connection; production is a promotion approved by a person.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "files": {
                  "index.html": "<!doctype html><title>Acme</title><h1>Hello</h1>",
                  "styles/site.css": "h1 { color: #333; }"
                },
                "idempotency_key": "deploy-archive-site-0001"
              },
              {
                "archive_base64": "UEsDBBQAAAAIAAAAIQA6Lk0VLAAAADAAAAAKAAAAaW5kZXguaHRtbLNRTMlPLqksSFXIKMnNsbMpySzJSbVzTM5NtdGHsG0yDO08UnNy8m30gSwAUEsBAhQDFAAAAAgAAAAhADouTRUsAAAAMAAAAAoAAAAAAAAAAAAAAKSBAAAAAGluZGV4Lmh0bWxQSwUGAAAAAAEAAQA4AAAAVAAAAAAA",
                "expires_at": "2026-11-18T00:00:00Z",
                "idempotency_key": "deploy-archive-site-0002"
              }
            ],
            "properties": {
              "archive_base64": {
                "description": "A ZIP or tar archive of the site, base64-encoded, with index.html at its root. For files that are not text.",
                "maxLength": 524288,
                "minLength": 4,
                "pattern": "^[A-Za-z0-9+/]+={0,2}$",
                "type": "string"
              },
              "expires_at": {
                "description": "ISO 8601 end of the preview, at most 7 days ahead. Omit for 00:00 UTC in 4 days.",
                "format": "date-time",
                "maxLength": 32,
                "type": "string"
              },
              "files": {
                "additionalProperties": {
                  "maxLength": 524288,
                  "type": "string"
                },
                "description": "The site's text files by relative path (index.html at the root is required). Give files or archive_base64, not both.",
                "maxProperties": 512,
                "type": "object"
              },
              "idempotency_key": {
                "description": "Unique per deploy (16-128 chars). Reuse it on retry.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$",
                "type": "string"
              }
            },
            "required": ["idempotency_key"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Deploy files or an archive"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7df66789a9399a3a5a8f14d41950dd6a834a3cadbd1ce37f73523b062d3beff8"
        },
        {
          "name": "galon_actions",
          "title": "List Galon API actions",
          "description": "List the actions of the Galon API, for every solution, with their risk and permission. Use when no other tool does what the person asks. Before: nothing; filter with service or query. Returns actions: id, description, solution, method, path, permission, allowed and missing_permission (for this key or connection), risk (read, write, spend, destructive, public, production), approval (required or none for this connection), cost and params; with action: its body schema; then galon_call. Cost: free.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "service": "storage"
              },
              {
                "query": "logs"
              },
              {
                "action": "deploy_function"
              }
            ],
            "properties": {
              "action": {
                "description": "One action id: that action in full, with the JSON schema of its body and parameters.",
                "pattern": "^[a-z][a-z0-9_]{1,63}$",
                "type": "string"
              },
              "query": {
                "description": "Words to find in the action id, description or path.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "service": {
                "description": "Only the actions of this solution.",
                "enum": ["mail", "mail_pro", "domains", "deploy", "functions", "storage", "backend", "compute", "search", "geo", "ai", "platform"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List Galon API actions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:232a130128fe955264764ddc3aa54d511130b930dea77b7613f573e6552d3436"
        },
        {
          "name": "galon_call",
          "title": "Run a Galon API action",
          "description": "Run one action listed by galon_actions, with the permissions, limits and logs of an HTTP call. Use when galon_actions lists the action and no other tool does it. Before: galon_actions (id and params). With an app connected by OAuth, a spend, destructive, public or production action needs a person: the refusal approval_required carries the request_approval to send. Returns the JSON of the action, or its named error (a missing permission is refused as over HTTP). Cost: the cost of the action it runs (its cost in galon_actions; prices: get_pricing); a paid action reserves its price on the prepaid balance first.",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "action": "list_deploys"
              },
              {
                "action": "get_build_logs",
                "params": {
                  "journey_id": "djy_0123456789abcdef0123456789abcdef"
                }
              },
              {
                "action": "upload_function_source",
                "params": {
                  "body_text": "export default { fetch() { return new Response('ok') } }",
                  "content_type": "application/javascript"
                }
              },
              {
                "action": "delete_object",
                "idempotency_key": "delete-obj-0123456789",
                "params": {
                  "object_id": "obj_0123456789abcdef0123456789abcdef"
                }
              }
            ],
            "properties": {
              "action": {
                "description": "Action id from galon_actions.",
                "pattern": "^[a-z][a-z0-9_]{1,63}$",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Unique per intent. Reuse it on retry.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$",
                "type": "string"
              },
              "params": {
                "description": "One field per path or query parameter, named as in galon_actions; body: the JSON body. For an action whose params.raw_body lists content types (a function source, a site archive): body_text (text) or body_base64 (bytes), with content_type.",
                "maxProperties": 30,
                "type": "object"
              }
            },
            "required": ["action"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Run a Galon API action"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:92a4766e9c8f212d8fcb14f1b210cf5ed4ca242a6195a9e5bc30c1664c8e7154"
