          "description": "Use when the user asks how much revenue, MRR or ARR an AI agent, AI startup or AI tool makes, or wants real examples of AI businesses in a niche (support, coding, voice, sales, automation...). Returns AI-agent businesses with sourced, dated revenue (start here). Example: {\"query\":\"coding\",\"limit\":3} -> 3 coding agents with their sourced revenue. Use it to find or filter businesses (keyword, category, tier, verified_only) when you have no slug; for a pure top-N use leaderboard, for one full record get_business. Each brief: slug, name, category, tier, one_liner, annualized_revenue_usd, basis, confidence, verification_label (\"reported, not payment-verified\" unless processor-verified), url_profile; + total + next page (offset/cursor, limit max 50). Empty query = all, highest revenue first. Cost: free (100 calls/day without a key).",
