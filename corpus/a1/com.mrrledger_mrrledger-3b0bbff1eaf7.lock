                    "required": ["annualized_a", "annualized_b", "same_category", "same_slug", "same_tier"],
                    "type": "object"
                  }
                },
                "required": ["a", "b", "diff"],
                "type": "object"
              }
            },
            "required": ["result"],
            "type": "object"
