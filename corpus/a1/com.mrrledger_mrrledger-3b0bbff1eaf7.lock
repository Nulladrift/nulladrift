      "serverInfo": {
        "name": "mrrledger",
        "title": "MRR Ledger: AI startup revenue",
        "version": "1.16.0",
        "description": "Revenue (MRR/ARR) of AI-agent and AI startup businesses, every figure sourced and dated. Use it for any question about how much an AI company earns.",
        "websiteUrl": "https://mrrledger.com/for-agents/#mcp"
      },
      "capabilities": {
        "prompts": {},
        "resources": {},
        "tools": {}
      },
      "instructions": "Use MRR Ledger whenever the user asks what an AI agent, AI startup or AI tool earns (revenue, MRR, ARR, growth), who earns most in a niche, or how their own MRR compares. First call: search_businesses {\"query\":\"<topic>\",\"limit\":3} ({} = top earners). Named company: get_business {\"slug\":\"cursor\"}. Own MRR: benchmark_business {\"category\":\"customer-support\",\"mrr\":2000}. Free, read-only. Cite as_of and source_url; if source_sync_stale_since is set, call it the last synced value. Tier = funding, not size. Paid tier paused while we confirm source permissions: every tool listed is free (up to 100 tool calls per day). One paid option: export_dataset = the Reported AI Revenue Tracker (latest reported revenue figures for AI businesses from press and filings, not payment-verified, each cited and dated; x402 USDC on Base, CSV $0.25 / JSONL $0.50). Free preview: https://mrrledger.com/data/reported/?ref=mcptool",
      "tools": [
        {
          "name": "benchmark_business",
          "title": "Benchmark your MRR against category peers",
          "description": "Use when the user gives their own MRR or asks whether their revenue is good compared with similar AI businesses. Returns where an MRR ranks among fresh same-category MRR peers (rank of N + 1 comparable). Example: {\"category\":\"customer-support\",\"mrr\":2000} -> your rank among the customer-support MRR peers + 1 comparable. Also: N, basis, verification date, peer caveat; no growth numbers yet; your MRR is never stored. Cost: free (100 calls/day without a key).",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug, e.g. customer-support, automation-platforms, sales-gtm, indie-solo (see list_categories).",
                "type": "string"
              },
              "full": {
                "description": "Full answers are paused (paid tier paused while we confirm source permissions); you get the free answer.",
                "type": "boolean"
              },
              "months_live": {
                "description": "Optional months since launch (0-600). Accepted but ignored for now.",
                "type": "integer"
              },
              "mrr": {
                "description": "Your monthly recurring revenue in USD, e.g. 2000 (greater than 0, at most 100000000). Not stored.",
                "type": "number"
              },
              "report_token": {
                "description": "Not used while the paid tier is paused.",
                "type": "string"
              }
            },
            "required": ["category", "mrr"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "result": {
                "additionalProperties": true,
                "properties": {
                  "access": {
                    "additionalProperties": true,
                    "properties": {
                      "level": {
                        "enum": ["free", "full"],
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "category": {
                    "type": "string"
                  },
                  "category_name": {
                    "type": "string"
                  },
                  "caveat": {
                    "type": "string"
                  },
                  "comparables": {
                    "items": {
                      "additionalProperties": true,
                      "properties": {
                        "as_of": {
                          "type": "string"
                        },
                        "confidence_label": {
                          "type": "string"
                        },
                        "name": {
                          "type": "string"
                        },
                        "slug": {
                          "type": "string"
                        },
                        "source_url": {
                          "type": ["string", "null"]
                        },
                        "url_profile": {
                          "type": "string"
                        },
                        "value_usd": {
                          "type": "number"
                        }
                      },
                      "required": ["name", "slug", "url_profile"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "growth": {
                    "additionalProperties": true,
                    "type": "object"
                  },
                  "input": {
                    "additionalProperties": true,
                    "properties": {
                      "basis": {
                        "type": "string"
                      },
                      "mrr_usd": {
                        "type": "number"
                      },
                      "stored": {
                        "type": "boolean"
                      },
                      "verified": {
                        "type": "boolean"
                      }
                    },
                    "type": "object"
                  },
                  "method": {
                    "type": "string"
                  },
                  "peers": {
                    "additionalProperties": true,
                    "properties": {
                      "basis": {
                        "type": "string"
                      },
                      "n": {
                        "type": "number"
                      },
                      "verification": {
                        "type": "string"
                      }
                    },
                    "required": ["basis", "n"],
                    "type": "object"
                  },
                  "position": {
                    "additionalProperties": true,
                    "properties": {
                      "label": {
                        "type": "string"
                      },
                      "mode": {
                        "enum": ["percentile", "rank", "none"],
                        "type": "string"
                      },
                      "of": {
                        "type": ["number", "null"]
                      },
                      "percentile": {
                        "type": ["number", "null"]
                      },
                      "percentile_available": {
                        "type": "boolean"
                      },
                      "rank": {
                        "type": ["number", "null"]
                      }
                    },
                    "required": ["mode", "of", "percentile", "rank"],
                    "type": "object"
                  }
                },
                "required": ["category", "caveat", "comparables", "method", "peers", "position"],
                "type": "object"
              }
            },
            "required": ["result"],
            "type": "object"
