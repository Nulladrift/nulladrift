        {
          "name": "report_coupon_result",
          "title": "Report whether a coupon code worked",
          "description": "Records whether a coupon code or no-code deal worked at checkout, as the shopper confirmed or as seen with checkout tools they authorized; not a lookup. Community mode only, which is off until the shopper says Yes. Stores the store (domain) and code, or an offer_id for a no-code deal, plus the outcome (codes: worked or rejected; no-code deals: worked, didnt_work or not_found) and an optional reason; no amounts, carts, totals or personal data. McClipFace can't verify consent, only the caller's statement of it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code tried. Required for a code report; a no-code deal has no code and is identified by offer_id.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "eligibility": {
                "default": "unknown",
                "description": "eligible: the store said the code itself is invalid or expired; ineligible: the cart, product or account didn't qualify, or it can't stack with another promotion; unknown: can't tell. Only an eligible rejection counts against a code.",
                "enum": ["eligible", "ineligible", "unknown"],
                "type": "string"
              },
              "merchant": {
                "description": "Store name or domain, e.g. \"Tommy John\". Required with code; optional with offer_id.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "offer_id": {
                "description": "Offer id of a listed offer. Required for no-code deal reports; for codes, used instead of merchant and code when set.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "outcome": {
                "description": "Codes: worked (checkout accepted it and the total went down), rejected or failed (the store refused it), link_broken (the offer link ended on an error page or never reached the store; never counts against the code). No-code deals: worked, didnt_work (didn't apply at checkout) or not_found (not on the store page or account). A code McClipFace didn't list: merchant and code with worked or rejected and no offer_id (kept for review; once reported working it is offered to other shoppers, for a store we don't list with merchant as its domain). store_not_covered: merchant only, when the store has no match in McClipFace. Every outcome is sent only in Community mode; Private mode, or no mode chosen yet, sends nothing.",
                "enum": ["worked", "rejected", "failed", "link_broken", "didnt_work", "not_found", "store_not_covered"],
                "type": "string"
              },
              "reason": {
                "description": "Optional short note (at most 200 characters), e.g. why a deal didn't apply.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["outcome"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclosure": {
                "type": "string"
              },
              "offer_id": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["disclosure", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Report whether a coupon code worked"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
