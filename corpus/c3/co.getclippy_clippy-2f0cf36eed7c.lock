                "description": "Optional: the random install ID (a UUID) from the McClipFace skill, if it has one; never derived from the shopper. Only counted, as a monthly-salted hash, for monthly active installs; never stored as sent or linked to the store, codes or reports. Leave it out if there is none.",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "ISO 4217 code, uppercase (default USD). Only offers in this currency are returned (USD leaves out non-US stores).",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "merchant": {
                "description": "Store name or domain, e.g. \"DHgate\" or \"dhgate.com\".",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "target_url": {
                "description": "Optional: a product page on the matched store's own website that the shopper picked (http or https; never a cart, checkout, account or order page), used only to return a shopping link to that page in deep_link. Any query string or fragment is removed before use; the address isn't logged, stored, cached or counted by us, and for some stores it's passed to the store's affiliate network only to build the link. Leave it out for a plain store lookup.",
