            "additionalProperties": false,
            "properties": {
              "categories": {
                "description": "Shopping categories, e.g. [\"skincare\", \"smart home\"].",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "category": {
                "description": "Optional: the product's category in McClipFace's taxonomy, so results stay in it inferred from what the shopper means, never from a keyword (honey for the pantry: grocery; honey face wash: beauty); omit when unsure. One of: 3d-printing, asian-fashion, audio, auto, baby-gear, bags, beauty, bedding, building-sets, bullion, camera-lenses, cameras, camping-hiking, cat-supplies, christmas-decor, cleaning, computer-components, computers, cycling, dog-supplies, drones, easter-decor, education, electronics, eyewear, fashion, fitness-gear, footwear, fourth-of-july-decor, fragrance, furniture, games-puzzles, gaming, garden, gifts-food, golf, grocery, grooming, haircare, halloween-decor, headphones-earbuds, health, holiday-decor, home, home-decor, home-improvement, household-essentials, j-beauty, japanese-fashion, jewelry, k-beauty, kids-clothing, kitchen, korean-fashion, makeup, marketplace, microphones-studio, networking, office-supplies, oral-care, otc-medicine, outdoor-play, outerwear, party-supplies, personal-care, pets, phones, photo-editing, photo-printing, photography, printers, skincare, smart-home, software, speakers-home-audio, sports-outdoors, thanksgiving-decor, toys, toys-kids, travel, turntables-hifi, tvs-home-theater, valentines-decor, video-gear, wearables. A close name is mapped to the nearest one; an unknown one is ignored.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
