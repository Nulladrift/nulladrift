                "maxItems": 10,
                "type": "array"
              },
              "limit": {
                "default": 10,
                "description": "Number of deals, 1-20 (default 10); one store's deals, 1-100 (default 25).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "preferred": {
                "additionalProperties": false,
                "description": "Optional product facts used to rank eligible results.",
                "properties": {
                  "attribute": {
                    "enum": ["waterproof", "wireless", "refillable", "fragrance-free"],
                    "type": "string"
                  },
                  "availability": {
                    "enum": ["in_stock"],
                    "type": "string"
                  },
                  "brand": {
                    "maxLength": 60,
                    "minLength": 1,
                    "type": "string"
                  },
                  "historical_low_days": {
                    "enum": [30, 60, 90],
                    "type": "integer"
                  },
                  "max_price": {
                    "description": "Maximum listed item price in the requested currency, before taxes and shipping.",
