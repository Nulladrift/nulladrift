                "maxLength": 40,
                "type": "string"
              },
              "client_install_id": {
                "description": "Optional: the random install ID (a UUID) from the McClipFace skill; not derived from the shopper. Only counted, as a monthly-salted hash, for monthly active installs; never stored as sent or linked to the store, codes or reports.",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "client_platform": {
                "description": "Required: the app the AI is running in, as one lowercase word, e.g. chatgpt, claude, grok. A lookup without it is rejected with platform_required.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "ISO 4217 code, uppercase (default USD). Only offers in this currency are returned (USD leaves out non-US stores).",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "intent": {
                "description": "Optional shopper stage: more_info (the shopper asked about one item), buy_myself or buy_for_me (the shopper is ready to open a pick). Every offer with a tracked route carries its link with or without it.",
                "enum": ["more_info", "buy_myself", "buy_for_me"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Optional: how many offers to return, best first (default 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "merchant": {
                "description": "Store name or domain, e.g. \"DHgate\" or \"dhgate.com\".",
