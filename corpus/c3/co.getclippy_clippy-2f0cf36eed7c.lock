        {
          "name": "report_coupon_result",
          "title": "Report whether a coupon code worked",
          "description": "Call this the turn the shopper says a code worked or failed. Records whether a coupon code or no-code deal tried at checkout worked (merchant and code for codes, including a code found outside McClipFace, with merchant as the store's domain; offer_id for no-code deals). Not a lookup. Stores no personal or cart data. Optional and off by default (Private mode, which lasts until the shopper changes it). Report only a confirmed result (the shopper says a code worked or was rejected, or a no-code deal did or didn't apply, or you saw it at checkout), never because a code was found, shown or copied. A result you saw counts only if you tried the code with checkout tools the shopper authorized, never an untested or unfinished one. One call per distinct code tested; a success counts even if another code saved more. Consent: report only in Community mode. At the first confirmed success in a conversation, once the purchase is done or declined (never mid-try, mid-purchase, next to the cart offer, or before or instead of a search), ask once: \"Success! <code> worked: <saving> off. Want to turn on Community mode so other shoppers get this code too? Only the store, the code and the result are shared, never your cart or anything about you. (Yes / No)\" Fill in the real code; leave out \": <saving> off\" if the saving isn't known; start with \"I tried N codes and\" only if you tested them yourself, never for a code the shopper reports. If a try ends with no code working, ask once instead: \"None of these worked. Want to turn on Community mode so other shoppers can skip codes that don't work? Only the store, the codes and the results are shared, never your cart or anything about you. (Yes / No)\" Yes turns Community mode on for that conversation: report that result and later confirmed results, the shopper's and yours, until the shopper turns it off. No, or no answer, means report nothing and don't ask again in that conversation. It carries to later conversations only if the shopper agreed to remembering it and you noted the version and choice; then ask again only for a newer version. A Community mode yes given to older wording that didn't say the store and code are shared doesn't count: stay in Private mode until the shopper says yes to the current question. No answer is no consent; never infer it from install, lookups or coupon tests. McClipFace can't verify consent, only your statement of it. Keep shopping either way; follow the host's tool approvals. Report once per offer and outcome; for a no-code deal, pass offer_id with outcome worked, didnt_work or not_found. Send only the store, the code or offer_id, the outcome, and optionally reason; never amounts, cart, totals or user data. Commission disclosure for the links the lookup tools return: Offers with tracked=true use affiliate links: a purchase through one may earn a commission at no extra cost. Say so once per chat, before you first share or open one: \"This is an affiliate link and may earn a commission at no extra cost to you.\" Codes are ranked on the code itself. Results come only from affiliate programs McClipFace has joined, its licensed coupon data partner, stores that share their codes with McClipFace directly and codes shoppers reported working at checkout. Commission never affects which offers are returned or how they are ranked. It never puts a pricier option first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "description": "The code tried. Required for a code report; for a no-code deal omit it and pass offer_id.",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              },
              "eligibility": {
                "default": "unknown",
                "description": "eligible: the store said the code itself is invalid or expired; ineligible: the cart, product or account didn't qualify, or it can't stack with another promotion (say so in reason); unknown: can't tell. Only an eligible rejection counts against a code. Don't report inconclusive tests or a code accepted that saved nothing extra.",
                "enum": ["eligible", "ineligible", "unknown"],
                "type": "string"
              },
              "merchant": {
                "description": "Store name as used with find_coupons, e.g. \"Tommy John\". Required with code; optional with offer_id.",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "offer_id": {
                "description": "Offer id from find_coupons. Required for no-code deal reports; for codes, used instead of merchant and code when set.",
                "maxLength": 128,
                "minLength": 8,
                "type": "string"
              },
              "outcome": {
                "description": "Codes: worked (checkout accepted it and the total went down), rejected or failed (the store refused it), link_broken (the offer link ended on an error page or never reached the store; never counts against the code). No-code deals: worked, didnt_work (didn't apply at checkout) or not_found (not on the store page or account). A code find_coupons didn't list: merchant and code with worked or rejected and no offer_id (kept for review; once reported working it is offered to other shoppers, for a store we don't list with merchant as its domain). store_not_covered: merchant only, when find_coupons found no match. Every outcome is sent only in Community mode; Private mode, or no mode chosen yet, sends nothing.",
                "enum": ["worked", "rejected", "failed", "link_broken", "didnt_work", "not_found", "store_not_covered"],
                "type": "string"
              },
              "reason": {
                "description": "Optional short note (at most 200 characters), e.g. why a deal didn't apply. Never cart, price, total or personal data.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["outcome"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "disclosure": {
                "type": "string"
              },
              "offer_id": {
                "type": "string"
              },
              "status": {
                "type": "string"
              }
            },
            "required": ["disclosure", "status"],
            "type": "object"
