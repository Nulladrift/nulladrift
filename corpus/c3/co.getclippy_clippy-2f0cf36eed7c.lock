                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "client": {
                "description": "Optional: your app or partner name (a short label, no key), used only to count clicks.",
                "maxLength": 40,
                "type": "string"
              },
              "client_platform": {
                "description": "Required: the app the AI is running in, as one lowercase word, e.g. chatgpt, claude, grok. A lookup without it is rejected with platform_required.",
                "maxLength": 32,
                "minLength": 1,
                "type": "string"
              },
              "currency": {
                "default": "USD",
                "description": "ISO 4217 code, uppercase (default USD). Only offers in this currency are returned (USD leaves out non-US stores).",
                "pattern": "^[A-Z]{3}$",
                "type": "string"
              },
              "exclude_categories": {
                "description": "Categories to leave out.",
                "items": {
                  "maxLength": 60,
