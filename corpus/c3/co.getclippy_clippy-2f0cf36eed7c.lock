      "serverInfo": {
        "name": "clippy-mc-clipface",
        "title": "McClipFace coupon lookup",
        "version": "4.0.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": false
        },
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
