        },
        {
          "name": "submit_request",
          "title": "Submit a request for the visitor",
          "description": "Send a request to Rayon Insurance on the visitor's behalf: a contract review, quotes for a company running robots, a broker placement, an integrator checklist, a marketplace seller requirement, or Rayon Ops servicing. It files the same request as the form on the site and a person replies by email within two business days. It does not bind cover or produce a quote. Only call it after the visitor has seen what will be sent and asked you to send it. Documents cannot be attached here; the reply says where to email them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The company's legal name. Required for contract_review.",
                "maxLength": 200,
                "type": "string"
              },
              "email": {
                "description": "The visitor's work email. The reply goes here.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "kind": {
                "description": "operators: A company running robots wants its insurance and robot contracts reviewed, with quotes for any gap. brokers: A retail broker wants a placement partner for a client deploying robots. integrators: A robotics integrator wants the customer-side insurance checklist for its SOW. sellers: A marketplace seller needs to meet a seller agreement's insurance requirement. contract_review: Send a contract (RaaS agreement, SOW, site-access agreement) to be read against the company's insurance. agency_servicing: A commercial insurance brokerage wants help with servicing work (Rayon Ops).",
                "enum": ["operators", "brokers", "integrators", "sellers", "contract_review", "agency_servicing"],
                "type": "string"
              },
              "message": {
                "description": "What the visitor needs, in their words: the contract, robots, site, deadline or question.",
                "maxLength": 1000,
                "type": "string"
              },
              "name": {
                "description": "The visitor's full name.",
                "maxLength": 120,
                "type": "string"
              },
              "phone": {
                "description": "Optional phone number.",
                "maxLength": 40,
                "type": "string"
              },
              "visitor_confirmed": {
                "const": true,
                "description": "Must be true. Set it only after the visitor has seen what will be sent, agreed to be contacted by Rayon Insurance and to its privacy notice (https://rayoninsure.com/privacy), and asked you to send it.",
                "type": "boolean"
              }
            },
            "required": ["email", "kind", "name", "visitor_confirmed"],
            "type": "object"
