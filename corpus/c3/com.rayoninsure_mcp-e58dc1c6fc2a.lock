        {
          "name": "search_insurance_guides",
          "title": "Search insurance guides",
          "description": "Search Rayon's library of plain-English insurance guides: robot deployments, RaaS agreements, additional insured status, ISO generative AI exclusions (CG 40 47, CG 40 48, CG 35 08), marketplace seller requirements and certificates. Returns titles, one-line answers and links. An empty query lists every guide. General information, not advice on a specific policy.",
