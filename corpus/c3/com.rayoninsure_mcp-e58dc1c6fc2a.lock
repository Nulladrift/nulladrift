      "serverInfo": {
        "name": "com.rayoninsure/mcp",
        "title": "Rayon Insurance",
        "version": "1.0.0",
        "description": "Act for a visitor with Rayon Insurance: firm details, request forms, and submitting a contract review or quote request.",
        "websiteUrl": "https://rayoninsure.com"
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
