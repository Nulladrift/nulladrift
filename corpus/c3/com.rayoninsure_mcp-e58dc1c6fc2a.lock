      "resources": [
        {
          "uri": "https://rayoninsure.com/library/30-days-notice-of-cancellation-certificate-holder.md",
          "name": "30-days-notice-of-cancellation-certificate-holder",
          "title": "Why can’t the certificate promise 30 days’ notice of cancellation to the certificate holder?",
          "description": "Because the certificate does not create the obligation. Since ACORD’s 2009 revision, the ACORD 25 says only that notice of cancellation “will be delivered in accordance with the policy provisions”, and the standard cancellation condition promises notice to the first named insured alone. A certificate holder is entitled to notice only if an endorsement on the policy names it, or a state law requires it.",
          "mimeType": "text/markdown",
          "digest": "sha256:fecd3cb20b79295b45b2ffe28aefe3870461381c5a6f86d2ea95b22dd999086c"
        },
        {
          "uri": "https://rayoninsure.com/library/3pl-insurance-requirements-warehouse-robots.md",
          "name": "3pl-insurance-requirements-warehouse-robots",
          "title": "What insurance does a 3PL need, and what changes when you add warehouse robots?",
          "description": "A 3PL's program is usually built around warehouse legal liability for customers' goods, plus general liability, workers' compensation, auto or motor carrier cover if it moves freight, cargo, and an umbrella. Adding AMRs or cobots under a robotics-as-a-service (RaaS) contract does not replace any of that. It adds leased equipment you may have to insure, an indemnity you may have to fund, and downtime your property policy may not respond to.",
          "mimeType": "text/markdown",
          "digest": "sha256:17606f85abde81c2f53d9f6ced0d3392eccb37bf83e173ff91bda2b63a121916"
        },
        {
          "uri": "https://rayoninsure.com/library/acord-175-policy-change-acord-35-lost-policy-release.md",
          "name": "acord-175-policy-change-acord-35-lost-policy-release",
          "title": "ACORD 175 or ACORD 35: which form for a policy change, and which for a cancellation or lost policy release?",
          "description": "ACORD 175, Commercial Policy Change Request, asks the insurer to add, change or delete something on a commercial policy from a stated effective date. ACORD 35, Cancellation Request / Policy Release, asks the insurer to cancel, and its policy release section is the signed statement used when the policy is not being returned. The named insured signs the ACORD 35, and the ACORD 175 says any deletion or reduction in coverage requires the insured’s signature.",
          "mimeType": "text/markdown",
          "digest": "sha256:ceec0b1bfafc1fb1e4aaf51ed7e9d6511bf3230fbc50c7ae6c34517cb12b713e"
        },
        {
          "uri": "https://rayoninsure.com/library/acord-25-description-of-operations-box.md",
          "name": "acord-25-description-of-operations-box",
          "title": "What can an agency put in the Description of Operations box on an ACORD 25?",
          "description": "Facts that identify the job, and references to what the policy already says: a project name or number, a location, and the exact title, form number and edition date of an endorsement that is on the policy. Wording typed in the box does not change coverage. The ACORD 25 states that it does not amend, extend or alter the policies, and that a statement on the certificate does not confer rights in place of an endorsement.",
          "mimeType": "text/markdown",
          "digest": "sha256:0352a7c57b4e6859caea4c54bcb7ca30538d50abadf8cf8bfa5c113a7941e992"
        },
        {
          "uri": "https://rayoninsure.com/library/acord-25-vs-27-vs-28-vs-855.md",
          "name": "acord-25-vs-27-vs-28-vs-855",
          "title": "ACORD 25, 27, 28 or 855: which form answers which request?",
          "description": "ACORD 25 is the certificate for liability coverage. ACORD 27 and ACORD 28 are evidence of property insurance issued to a party with an interest in the property, such as a mortgagee or loss payee, and ACORD 28 is the more detailed commercial form. ACORD 855 NY is an addendum attached to an ACORD 25 that answers thirteen coverage questions on New York construction work.",
          "mimeType": "text/markdown",
          "digest": "sha256:3bbc87153125d12555a4cefca538d99b5fb57f493ce1f21ad7588be2636f2c46"
        },
        {
          "uri": "https://rayoninsure.com/library/additional-insured-robot-vendor-integrator.md",
          "name": "additional-insured-robot-vendor-integrator",
          "title": "When should a robot vendor, integrator or operator be an additional insured, and on which form?",
          "description": "On a robot deployment, additional insured requests usually run three ways. The operator wants to be added to the integrator's policy for the install and the finished cell, the RaaS vendor wants to be added to the operator's policy for its leased equipment, and resellers want to be added to the robot maker's policy as a vendor. Each request maps to a different ISO endorsement (CG 20 10, CG 20 37, CG 20 26, CG 20 34 or CG 20 15), and each covers less than the name suggests. A certificate showing \"ADDL INSD: Y\" proves none of it. Only the endorsement does.",
          "mimeType": "text/markdown",
          "digest": "sha256:689b3453a387360d5884946ea3e6ca8ca80b27828cc994ce23ed3ebe3a425071"
        },
        {
          "uri": "https://rayoninsure.com/library/agency-management-system-vs-crm.md",
          "name": "agency-management-system-vs-crm",
          "title": "Agency management system or CRM: which one is the system of record for what?",
          "description": "The agency management system is the system of record for policies, billing and commissions, documents and carrier downloads. A CRM is the record of prospects, pipeline and conversations. Service requests sit between the two, so before adding a second system an agency should decide where a request lives and which system wins when the two disagree.",
          "mimeType": "text/markdown",
          "digest": "sha256:6dd2e2acf9a5d1aea45408ebf01c26e53a71c203f7e3aab45b50cbb3cf3ffa1a"
        },
        {
          "uri": "https://rayoninsure.com/library/amazon-seller-insurance-requirements.md",
          "name": "amazon-seller-insurance-requirements",
          "title": "What insurance does Amazon require sellers to carry?",
          "description": "Within 30 days of exceeding USD 10,000 in gross proceeds in a month on Amazon.com, you must carry commercial general, umbrella or excess liability insurance of at least USD 1 million per occurrence and in aggregate, written on an occurrence basis, naming \"Amazon.com Services LLC and its affiliates and assignees\" as additional insureds. From November 2, 2026, sellers with products in Amazon's enhanced-safety categories need the same cover whatever their sales. We checked Amazon's own Seller Central pages on October 22, 2026.",
          "mimeType": "text/markdown",
          "digest": "sha256:243140597df3d00fae441dbc132b8cd4f446084c48a3fd41cd96ec9d094dfcbf"
        },
        {
          "uri": "https://rayoninsure.com/library/battery-energy-storage-bess-contractor-insurance-questions.md",
          "name": "battery-energy-storage-bess-contractor-insurance-questions",
          "title": "We are installing a battery energy storage system. What will insurers and owners ask about our insurance?",
          "description": "Expect four groups of questions: whether the system is installed to NFPA 855, whether it has UL 9540A fire test data, who insures the batteries in transit, in storage and during installation, and whether your liability policies respond to fire, gas and pollution from a battery failure. The published guidance is written for project owners. A contractor meets it through the subcontract and its own renewal.",
          "mimeType": "text/markdown",
          "digest": "sha256:1ac8517a63341666091309f4d8cffd5305cd9a728cf783a42a7b131878a65362"
        },
        {
          "uri": "https://rayoninsure.com/library/blanket-additional-insured-cg-20-33-cg-20-38-certificates.md",
          "name": "blanket-additional-insured-cg-20-33-cg-20-38-certificates",
          "title": "Can we show additional insured status on a certificate when the policy has a blanket endorsement such as CG 20 33 or CG 20 38?",
          "description": "Only when a written contract that requires the status exists, because that contract is what triggers a blanket endorsement. CG 20 33 covers a party the insured has agreed in writing, in a contract with that party, to add, and CG 20 38 also reaches other parties that same contract requires. Have the endorsement and the contract on file first, and check the state’s certificate rules: Texas lets a certificate say the policy contains a blanket endorsement but not name the holder as an additional insured.",
          "mimeType": "text/markdown",
          "digest": "sha256:1873bb7d7ab7337d3d5024f1dec6b543a8117616ea5944dae00497e16868c4f0"
        },
        {
          "uri": "https://rayoninsure.com/library/builders-risk-rework-leg-2-leg-3.md",
          "name": "builders-risk-rework-leg-2-leg-3",
          "title": "A miswired panel causes a fire. What pays for the fire, and what pays for the rewiring?",
          "description": "Builder’s risk pays for the fire damage that follows. The cost of correcting the defective work itself is excluded. How much is carved out depends on which defects clause the policy carries: LEG 2/96 excludes what it would have cost to fix the defect before the damage happened, while LEG 3/06 excludes only the cost of improving the original work.",
          "mimeType": "text/markdown",
          "digest": "sha256:28823f2843c7a314c7bbb5abe230a3007c5692e9affa63e81e7f5feebf8312a7"
        },
        {
          "uri": "https://rayoninsure.com/library/certificate-holder-vs-additional-insured.md",
          "name": "certificate-holder-vs-additional-insured",
          "title": "Certificate holder or additional insured: what is the difference?",
          "description": "A certificate holder has been sent proof that a policy exists and has no rights under it. An additional insured is covered by the policy, which takes an endorsement. Ticking the additional insured box on a certificate does not create that status; the endorsement does.",
          "mimeType": "text/markdown",
          "digest": "sha256:68fb71453787f2b03edc1f070a5fac856e4643bfbe8afab8cb7463cd5dca09ce"
        },
        {
          "uri": "https://rayoninsure.com/library/cg-20-10-11-85-additional-insured-edition-dates.md",
          "name": "cg-20-10-11-85-additional-insured-edition-dates",
          "title": "Why does the contract ask for CG 20 10 11 85, and how do the later editions differ?",
          "description": "Because the 11 85 edition is the broadest. It covers the additional insured for liability “arising out of” your work, which includes completed work and is not tied to your fault. Later editions limited the form to ongoing operations, then to injury “caused, in whole or in part, by” your acts or omissions, and from 04 13 capped the coverage and limits at what the contract requires and the law permits.",
          "mimeType": "text/markdown",
          "digest": "sha256:66167a70076118b49fe0f214f71ea8027560c9644205342d3de64344b8e93a6e"
        },
        {
          "uri": "https://rayoninsure.com/library/cg-20-10-vs-cg-20-37-additional-insured.md",
          "name": "cg-20-10-vs-cg-20-37-additional-insured",
          "title": "What is the difference between CG 20 10 and CG 20 37, and which additional insured endorsement does a subcontract need?",
          "description": "Usually both. CG 20 10 makes the owner or general contractor an additional insured for your ongoing work, and that status ends when the work is complete. CG 20 37 carries it into completed operations, which is when most defect claims arrive. A subcontract that asks for “ongoing and completed operations” is asking for the pair.",
          "mimeType": "text/markdown",
          "digest": "sha256:2fb7e195a61da3ae6a4c88bc2fd07c984c2c98de908825e1a130b8c7c2347562"
        },
        {
          "uri": "https://rayoninsure.com/library/cg-40-47-generative-ai-exclusion-contractors.md",
          "name": "cg-40-47-generative-ai-exclusion-contractors",
          "title": "What does the generative AI exclusion CG 40 47 remove from a contractor’s policy?",
          "description": "CG 40 47 removes bodily injury, property damage, and personal and advertising injury “arising out of” generative artificial intelligence from a general liability policy. It has no exception for work a person reviewed. It is an optional endorsement in ISO’s January 2026 edition, so whether it is on your policy depends on your insurer.",
          "mimeType": "text/markdown",
          "digest": "sha256:89b35d084c6e2ef224992e3e52b4a07c398f9bdc62bf93e885117db7fd70c2bc"
        },
        {
          "uri": "https://rayoninsure.com/library/cg-40-47-generative-ai-exclusion-robots.md",
          "name": "cg-40-47-generative-ai-exclusion-robots",
          "title": "Does the CG 40 47 generative AI exclusion apply to a client's robots?",
          "description": "Not to robots as such. CG 40 47, CG 40 48 and CG 35 08 exclude injury or damage \"arising out of\" generative artificial intelligence, defined as a machine-based learning system or model trained on data that can create content or responses. A robot running programmed motions is generally outside that definition; a robot whose movements come from a learned model, and any policy carrying a broader carrier-written AI exclusion, is where to look closely.",
          "mimeType": "text/markdown",
          "digest": "sha256:c5c515d1c33b38cc249fedb336d739e64546c825883253c475c0c01bc39bbe48"
        },
        {
          "uri": "https://rayoninsure.com/library/commercial-renewal-calendar-120-90-60-30.md",
          "name": "commercial-renewal-calendar-120-90-60-30",
          "title": "When should an agency start a commercial renewal, and what happens at 120, 90, 60 and 30 days?",
          "description": "Start 120 days before expiration and have the insurer’s intentions confirmed by 60. In California and New York an insurer may send a notice of nonrenewal or conditional renewal as early as 120 days out and must send it at least 60 days out; Texas also sets 60 days and Florida 45. The day-counts differ by state and by line, so confirm the rule for each policy.",
          "mimeType": "text/markdown",
          "digest": "sha256:113e90e2d3a02c65862d041a0eb26b1e875ed5371c242f9174bcdcbb64944674"
        },
        {
          "uri": "https://rayoninsure.com/library/commissioning-test-fails-no-damage-who-pays.md",
          "name": "commissioning-test-fails-no-damage-who-pays",
          "title": "Who pays when a commissioning test fails and nothing is physically damaged?",
          "description": "Only contractor professional liability. Builder’s risk and general liability both need physical loss or damage before they respond, and builder’s risk excludes liquidated damages even when a covered event caused the delay. A design or commissioning error that leaves a hall short of specification is a pure financial loss.",
          "mimeType": "text/markdown",
          "digest": "sha256:2e8e4c64191460370521eae6c9852b508e225446f71d410d771ac37723cd49c0"
        },
        {
          "uri": "https://rayoninsure.com/library/experience-mod-prequalification-contractors.md",
          "name": "experience-mod-prequalification-contractors",
          "title": "Our experience mod is above the prequalification cut-off. What can be fixed, and how fast?",
          "description": "Errors in the data can be corrected within one rating cycle, but the claims history itself takes years to roll off. The experience mod compares your actual losses with what is expected for a firm of your size and class over about three policy years, so a bad year stays in the calculation for three ratings.",
          "mimeType": "text/markdown",
          "digest": "sha256:a2339c93f547461251eb2c6c98f97ea902dc68436eb90cdb24ba9150ddca5e3d"
        },
        {
          "uri": "https://rayoninsure.com/library/four-checks-before-sending-a-certificate-of-insurance.md",
          "name": "four-checks-before-sending-a-certificate-of-insurance",
          "title": "What should an agency check before sending a certificate of insurance?",
          "description": "Four things: that the certificate belongs to your agency and a policy you hold, that the finished document reads back the same as the policy record, that it does not contradict itself, and that every statement of coverage points to the endorsement that grants it. A certificate that fails any one should not be sent.",
          "mimeType": "text/markdown",
          "digest": "sha256:beb38772549a65ed84afe853974fc7e96d16faeeb894a2ba43a3d652190a0a3f"
        },
        {
          "uri": "https://rayoninsure.com/library/general-liability-pollution-exclusion-refrigerant-glycol-diesel.md",
          "name": "general-liability-pollution-exclusion-refrigerant-glycol-diesel",
          "title": "A chiller loses its refrigerant, a glycol loop drains or a fuel line leaks diesel. Does our general liability policy pay?",
          "description": "Often not. Exclusion f of the general liability form CG 00 01 removes injury and damage from the release of pollutants that a contractor brings to a site where it is working, and it removes clean-up costs that a regulator orders. A total pollution exclusion such as CG 21 49 or CG 21 55 takes away the narrow exceptions as well. Contractors pollution liability is the separate policy written for these releases.",
          "mimeType": "text/markdown",
          "digest": "sha256:285b00298a0543a436080110c3f13fb639c4d64fd2f6c561884daf627a484c2f"
        },
        {
          "uri": "https://rayoninsure.com/library/general-liability-wrap-up-exclusion-cg-21-54.md",
          "name": "general-liability-wrap-up-exclusion-cg-21-54",
          "title": "What does the CG 21 54 wrap-up exclusion remove from a subcontractor’s own general liability on a wrapped site?",
          "description": "Often not. Once you are enrolled in an owner- or contractor-controlled insurance program, endorsement CG 21 54 on your own policy excludes your work at that project. The 01 96 edition applies whether or not the wrap-up has adequate limits or stays in effect, so the gaps are off-site work and anything that happens after the wrap’s cover ends.",
          "mimeType": "text/markdown",
          "digest": "sha256:1fcf405e57f933bd8110ebef7d577638cc4b36f9bd2d70c1ec70d8f4f042b6a5"
        },
        {
          "uri": "https://rayoninsure.com/library/installation-floater-vs-builders-risk-equipment.md",
          "name": "installation-floater-vs-builders-risk-equipment",
          "title": "Who insures switchgear, chillers and generators before they are installed and accepted?",
          "description": "It depends on the project’s builder’s risk policy and on your subcontract, and the two do not always meet. Builder’s risk is written around the project site, and cover for transit and off-site storage varies by policy. An installation floater is the contractor’s own inland marine policy for property it will install, covering it in transit, in storage and during installation until it is accepted or put to use.",
          "mimeType": "text/markdown",
          "digest": "sha256:b64a0845cae4a014dc387771b24eb538f2a7c16c93d37d924579f454063d01a6"
        },
        {
          "uri": "https://rayoninsure.com/library/insurance-by-trade-data-center-contractors.md",
          "name": "insurance-by-trade-data-center-contractors",
          "title": "Which insurance problem is specific to each trade on a data-center job?",
          "description": "Each trade’s largest exposure sits in a different policy. Electrical and structural trades are driven by workers compensation. Mechanical trades meet pollution and delegated design. Commissioning and controls meet the limits of general liability, which needs injury or physical damage. Fire protection is a completed-operations problem, fiber is a care-and-custody problem, and site work is an equipment and pollution problem.",
          "mimeType": "text/markdown",
          "digest": "sha256:1c85dd84e8f280c85d1c842b8203ca83a3b60d590d8c70b6383a4a47412269fe"
        },
        {
          "uri": "https://rayoninsure.com/library/iso-10218-iso-3691-4-r15-08-what-underwriters-ask.md",
          "name": "iso-10218-iso-3691-4-r15-08-what-underwriters-ask",
          "title": "ISO 10218, ISO 3691-4 and R15.08: what will an underwriter ask about the robots?",
          "description": "ISO 10218 covers industrial robot arms and the cells built around them. ISO 3691-4 covers driverless industrial trucks, including autonomous mobile robots. ANSI/A3 R15.06 and R15.08 are the US standards for the same two families, and each now has a part written for the user. An insurance policy does not require any of them, and we know of no published rating plan that credits compliance. What an underwriter or loss-control rep will want is the paperwork they produce: which standard applies, the integrator's risk assessment, and evidence that the site still runs the way that assessment assumed.",
          "mimeType": "text/markdown",
          "digest": "sha256:fe1aceadfd35917c7ff75776bf2ff8793872893162ff4c76de61c0b3c38dec0a"
        },
        {
          "uri": "https://rayoninsure.com/library/leased-robot-injures-employee-who-is-liable.md",
          "name": "leased-robot-injures-employee-who-is-liable",
          "title": "If a leased robot injures one of your workers, who is liable?",
          "description": "Your workers compensation policy pays the injured employee. In Illinois, workers comp is the employee's only remedy against you as the employer, though each state's statute has its own exceptions. The employee can still sue the robot's manufacturer, integrator or RaaS vendor. That company can then try to bring you back into the case through a contribution claim or through the indemnity clause you signed. How much of that comes back to you depends on state law and on the contract.",
          "mimeType": "text/markdown",
          "digest": "sha256:f433e5f5964eafcc7a168bd5a4bfdfa1125daa90f2acadcff563968ce2440272"
        },
        {
          "uri": "https://rayoninsure.com/llms.txt",
          "name": "llms-txt",
          "title": "Rayon site index",
          "description": "What Rayon does, when to use it and when not to, and every page and guide.",
          "mimeType": "text/markdown",
          "digest": "sha256:2b1fc0ac31debc5f7ebe198ea2d09c3e130b2212f54436ec6882af46e666c30f"
        },
        {
          "uri": "https://rayoninsure.com/library/loss-runs-who-can-request-how-long.md",
          "name": "loss-runs-who-can-request-how-long",
          "title": "What is a loss run, who can request one and how long does the insurer have to send it?",
          "description": "A loss run is the insurer’s report of the claims made under a policy, and the insured, or in some states the insured’s agent or broker, can request it. The deadline is set state by state: Florida and Oregon give the insurer 15 calendar days, New York 10 days, and California 10 business days in the situations its statute lists. Other states have their own rules or none, so check the state that governs the policy.",
          "mimeType": "text/markdown",
          "digest": "sha256:6bf5de3f411c204df6b6ac83de833dbd75604fffdacd21db59a6e52443e7cad3"
        },
        {
          "uri": "https://rayoninsure.com/library/ocip-vs-ccip-what-subcontractor-still-carries.md",
          "name": "ocip-vs-ccip-what-subcontractor-still-carries",
          "title": "We are enrolled in an OCIP or CCIP. Which insurance do we still have to carry ourselves?",
          "description": "Nearly everything that is not on-site liability. A wrap-up typically provides general liability and excess for enrolled contractors at the project site, and sometimes workers compensation and builder’s risk. Automobile liability, off-site operations, professional liability and your own tools and equipment stay with you, and pollution liability is included in some programs and not in others.",
          "mimeType": "text/markdown",
          "digest": "sha256:05bee485169e94f1cddeaee08497d6d7da6db54a241365713a1e9b5a3eb575e1"
        },
        {
          "uri": "https://rayoninsure.com/library/per-project-aggregate-cg-25-03.md",
          "name": "per-project-aggregate-cg-25-03",
          "title": "Why does the subcontract ask for a per-project aggregate, and what does CG 25 03 do?",
          "description": "CG 25 03 gives each designated construction project its own general aggregate limit, equal to the general aggregate shown in your declarations. Without it, one annual aggregate is shared by every job you work, so claims on another project can use up the limit this project is relying on. The endorsement covers ongoing operations only and does not raise the each-occurrence limit.",
          "mimeType": "text/markdown",
          "digest": "sha256:57cfc47607f55637c9261222004b0cfdcc9ae4acc9b98ba0fd4aa332e6a93e41"
        },
        {
          "uri": "https://rayoninsure.com/library/placing-cover-client-deploying-robots-broker-guide.md",
          "name": "placing-cover-client-deploying-robots-broker-guide",
          "title": "How does a broker place insurance for a client deploying robots in a warehouse?",
          "description": "Start with the contract, not the robot. The RaaS agreement or integrator statement of work sets the indemnities, the insurance requirements and who carries the risk of damage to the equipment, and those terms decide what changes on the GL, workers comp, property and business interruption policies. Read the contract, then read each line against it.",
          "mimeType": "text/markdown",
          "digest": "sha256:78ef1f695f86d3a75c7d05c3219d9fa96ff96b0f11efef7a76a03e46d97612c0"
        },
        {
          "uri": "https://rayoninsure.com/library/primary-and-noncontributory-cg-20-01.md",
          "name": "primary-and-noncontributory-cg-20-01",
          "title": "The subcontract says our insurance must be “primary and noncontributory”. What does that take?",
          "description": "It takes two pieces of wording. “Primary” is already in the Other Insurance condition of the standard general liability form CG 00 01. “Noncontributory” comes from endorsement CG 20 01, which says your insurer will not seek contribution from an additional insured’s own policy, provided that party is a named insured on that policy and you agreed to this in a written contract.",
          "mimeType": "text/markdown",
          "digest": "sha256:2bc7b3bfdc0f0037860c9db503cb14b0e4ac56d364e8ebc1af6e562c03c0f567"
        },
        {
          "uri": "https://rayoninsure.com/library/robot-software-failure-business-interruption.md",
          "name": "robot-software-failure-business-interruption",
          "title": "Does business interruption insurance cover a robot software failure?",
          "description": "Usually not on its own. The standard ISO business income form pays only when operations stop because of direct physical loss of or damage to property, and it limits loss from corrupted electronic data to a small additional coverage. A robot fleet that stops because of a software fault, with nothing broken, tends to fall between property, equipment breakdown and cyber cover, and the RaaS contract's service credits rarely make up the difference.",
          "mimeType": "text/markdown",
          "digest": "sha256:bec7b1072604a4605f80b9a0d9d410bb085e0066d96aa22d05e9ff8354e97425"
        },
        {
          "uri": "https://rayoninsure.com/library/robotics-as-a-service-raas-contract-insurance-clauses.md",
          "name": "robotics-as-a-service-raas-contract-insurance-clauses",
          "title": "What insurance clauses should a robotics-as-a-service (RaaS) contract have, and which shift risk onto the operator?",
          "description": "Seven clauses do most of the work: indemnity, limitation of liability, insurance requirements, additional insured, waiver of subrogation, loss of or damage to the robots, and uptime with service credits. In two published sets of vendor terms reviewed here, liability is capped at twelve months of fees while the customer's indemnity to the vendor sits outside that cap. Read them together, not one at a time.",
          "mimeType": "text/markdown",
          "digest": "sha256:43285387c103f2bdab784adc4b2758881bca90f823594ab255814a9fe72c035f"
        },
        {
          "uri": "https://rayoninsure.com/library/waiver-of-subrogation-cg-24-04-wc-00-03-13.md",
          "name": "waiver-of-subrogation-cg-24-04-wc-00-03-13",
          "title": "The contract requires a waiver of subrogation on general liability and workers compensation. Which endorsements, and is it allowed in every state?",
          "description": "On general liability the waiver is ISO endorsement CG 24 04, and on workers compensation it is NCCI endorsement WC 00 03 13. Each stops your insurer from recovering what it paid from the party named in the endorsement. The workers compensation waiver is not available everywhere: Kentucky and New Hampshire prohibit requiring it, and Missouri restricts it in construction contracts.",
          "mimeType": "text/markdown",
          "digest": "sha256:f0a3663763a80466d3622a29130438b41fb11821e0e8a556cbcb8b0295a3f6bb"
        },
        {
          "uri": "https://rayoninsure.com/library/what-a-servicing-ticket-needs.md",
          "name": "what-a-servicing-ticket-needs",
          "title": "What does a servicing request need before it counts as tracked work?",
          "description": "Nine things: who asked, which account, what type of request it is, one owner, a due date, a status, what is missing, the source document and who approved the result. An email holds some of these by accident. A ticket holds all of them on purpose, so anyone in the agency can see what is open, who has it and what it is waiting for.",
          "mimeType": "text/markdown",
          "digest": "sha256:a354554cc92e94f331e790ce4d21e0e2a4c2b916f7da5decab443cc056e13033"
        },
        {
          "uri": "https://rayoninsure.com/library/why-certificate-of-insurance-rejected.md",
          "name": "why-certificate-of-insurance-rejected",
          "title": "Why did the compliance vendor reject our certificate of insurance?",
          "description": "Usually because the certificate shows something the contract requires as missing, or the policy does not actually grant what was asked. The most common causes are missing completed-operations additional insured status, a holder or additional insured name that does not match the contract, a missing waiver of subrogation, limits below the requirement, and wording the insurer will not put on the form.",
          "mimeType": "text/markdown",
          "digest": "sha256:10189287d79e1d9f0a954b718db87f1fee07e1d70c1f7d7e29691f9e1be1bbfb"
        },
        {
          "uri": "https://rayoninsure.com/library/your-work-exclusion-subcontractor-exception-cg-22-94.md",
          "name": "your-work-exclusion-subcontractor-exception-cg-22-94",
          "title": "We sub out part of our scope. What does the “your work” exclusion, and endorsement CG 22 94, mean for us?",
          "description": "Exclusion l of CG 00 01 removes property damage to your own completed work, but it does not apply if the damaged work, or the work that caused the damage, was performed for you by a subcontractor. Endorsement CG 22 94 deletes that exception. With it on your policy, damage to your completed work is excluded whether your own crew or your sub did the work.",
          "mimeType": "text/markdown",
          "digest": "sha256:47a9a4d1d94c25549db4779e004b18492fb422025249f3dd8089b4f41adc2fef"
        }
      ],
      "digest": "sha256:84f5c2ff9206cacfc4252d00b1fa24e52b77291fdd9337068f9f16bc56d24e14"
    }
  }
