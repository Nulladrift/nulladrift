        {
          "name": "create_feed",
          "title": "Create a subscription calendar",
          "description": "Creates a subscription calendar from user-reviewed structured events and optionally activates it. Intended for an explicit request to save a schedule. The caller supplies the events; source-document extraction and automatic monitoring are not performed. Existing account feed and creation allowances apply. Identical retries retain the original request_id and payload. publication.status reports calendar-file preparation, not subscription access. distribution_ready reports subscription availability at the returned revision; availability may change afterward. Scope is limited to the connected account’s Smart Calendars AI feeds. No mailbox access, source-document retrieval, automatic source monitoring, scheduled PDF checks or document refresh is provided. Structured schedule content is supplied explicitly by the caller. Result links: subscription_open_url is the exact HTTPS handoff to the default calendar app via webcal; subscription_options_url provides Apple/default, Google, Outlook and copy-link choices; subscription_url is the copyable HTTPS calendar-file fallback; manage_url opens the feed dashboard. URL hosts, paths and tokens identify the returned resource and are not interchangeable. A filtered_subscription has its own links for that selection; top-level links remain unfiltered. Subscription access requires distribution_ready=true. Opening a link does not confirm a subscription; confirmation occurs in the user’s calendar app.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "activate": {
                "default": true,
                "description": "Whether to activate the new calendar immediately, subject to the account active-feed allowance; defaults to true. False creates a saved inactive preview without subscription access.",
                "type": "boolean"
              },
              "description": {
                "description": "A short description of this calendar, not the conversation or user profile.",
                "maxLength": 20000,
                "type": ["string", "null"]
              },
              "events": {
                "description": "One to 250 reviewed schedule entries. Each entry contains event fields and may include a source-stable external_key; the caller supplies this content.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "event": {
                      "additionalProperties": false,
                      "description": "Structured calendar fields for one event from the reviewed schedule.",
                      "properties": {
                        "assignee": {
                          "description": "Optional event assignee explicitly named in the schedule; not the connected account identity, email address or a user profile.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "description": {
                          "description": "Event notes the user intends to publish with this calendar. Chat history, credentials, health records and unrelated personal context are outside this field’s scope.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "end_date": {
                          "description": "Inclusive last calendar date, YYYY-MM-DD. A bounded multi-day range represents one event unless the user requests separate events.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "end_time": {
                          "description": "Local event end time in HH:mm format, on end_date when supplied or start_date otherwise. All-day events have no clock time.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "facet_actors": {
                          "description": "Source-grounded participants or organizers (people, teams or organizations), not an invented audience such as everyone at a school. Source-derived labels use the existing facet vocabulary, spelling and language. Unchanged fields retain their tags.",
                          "items": {
                            "type": "string"
                          },
                          "maxItems": 50,
                          "type": ["array", "null"]
                        },
                        "facet_topic": {
                          "description": "Source-grounded stable category, not the full event title. Source-derived labels use the existing facet vocabulary, spelling and language. Unchanged fields retain their tags.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "facet_venue": {
                          "description": "Source-grounded venue name. Source-derived labels use the existing facet vocabulary, spelling and language. Unchanged fields retain their tags.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "is_all_day": {
                          "description": "True for an all-day calendar event with dates and no clock times; false for a timed event with a local start time and optional end time.",
                          "type": "boolean"
                        },
                        "location": {
                          "description": "The event venue explicitly supplied in the schedule or requested correction, not the user’s current, home or device location. User geolocation is outside this field’s scope.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "recurrence": {
                          "additionalProperties": false,
                          "description": "Recurrence configuration, or null for a non-recurring event. An object represents repetition explicitly stated in the source or established by separately listed regular occurrences. A single bounded multi-day range is one occurrence with start_date/end_date. Recurrence objects require all schema fields with valid values; empty or partial objects are invalid.",
                          "properties": {
                            "endDate": {
                              "description": "End date for recurrence in YYYY-MM-DD format, or null if no end date",
                              "type": ["string", "null"]
                            },
                            "frequency": {
                              "description": "Base recurrence frequency",
                              "enum": ["daily", "weekly", "monthly", "yearly"],
                              "type": "string"
                            },
                            "interval": {
                              "description": "Interval between recurrences (e.g., 2 for every 2 weeks)",
                              "maximum": 999,
                              "minimum": 1,
                              "type": "integer"
                            },
                            "monthlyType": {
                              "description": "Type of monthly recurrence: by date or by weekday pattern",
                              "enum": ["dayOfMonth", "dayOfWeek"],
                              "type": "string"
                            },
                            "occurrenceCount": {
                              "description": "Number of occurrences before ending, or null if no occurrence limit",
                              "minimum": 1,
                              "type": ["integer", "null"]
                            },
                            "selectedDaysOfMonth": {
                              "description": "Selected days of month (1-31, -1 for last day, -2 for second-last)",
                              "items": {
                                "type": "integer"
                              },
                              "type": "array"
                            },
                            "selectedMonths": {
                              "description": "Selected months for yearly recurrence (1-12)",
                              "items": {
                                "maximum": 12,
                                "minimum": 1,
                                "type": "integer"
                              },
                              "type": "array"
                            },
                            "selectedWeekdays": {
                              "description": "Selected weekdays for weekly recurrence",
                              "items": {
                                "enum": ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                                "type": "string"
                              },
                              "type": "array"
                            },
                            "weekdayCategory": {
                              "description": "Category or specific weekday for monthly/yearly patterns",
                              "enum": ["day", "weekday", "weekend", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"],
                              "type": "string"
                            },
                            "weekdayOrdinal": {
                              "description": "Ordinal position of weekday in month",
                              "enum": ["first", "second", "third", "fourth", "fifth", "last", "secondLast"],
                              "type": "string"
                            }
                          },
                          "required": ["endDate", "frequency", "interval", "monthlyType", "occurrenceCount", "selectedDaysOfMonth", "selectedMonths", "selectedWeekdays", "weekdayCategory", "weekdayOrdinal"],
                          "type": ["object", "null"]
                        },
                        "start_date": {
                          "description": "Event start date in YYYY-MM-DD format, using the event timezone for timed events.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "start_time": {
                          "description": "Local event start time in HH:mm format. All-day events have no clock time.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "timezone": {
                          "description": "IANA timezone for the event local dates and times, for example Europe/Berlin or UTC.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        },
                        "title": {
                          "description": "Event title from the supplied schedule.",
                          "maxLength": 20000,
                          "type": ["string", "null"]
                        }
                      },
                      "required": ["is_all_day", "start_date", "title"],
                      "type": "object"
                    },
                    "external_key": {
                      "description": "Source-stable, namespaced event identity, for example school-a:session-104, retained when a title or date changes. A duplicate add does not update the event; updates address the existing event_id.",
                      "maxLength": 255,
                      "minLength": 3,
                      "pattern": "^[A-Za-z0-9._-]{1,64}:[^\\s\\u0000-\\u001f]{1,190}$",
                      "type": "string"
                    }
                  },
                  "required": ["event"],
                  "type": "object"
                },
                "maxItems": 250,
                "minItems": 1,
                "type": "array"
              },
              "request_id": {
                "description": "Opaque, non-personal idempotency key for this operation. Identical retries retain the same key and payload to prevent duplicate changes. User identifiers, chat/session IDs, telemetry and personal data are outside this field’s scope.",
                "maxLength": 160,
                "minLength": 1,
                "pattern": "^[A-Za-z0-9:_.-]+$",
                "type": "string"
              },
              "title": {
                "description": "Calendar title for the reviewed schedule.",
                "maxLength": 20000,
                "type": "string"
              }
            },
            "required": ["events", "request_id", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a subscription calendar"
