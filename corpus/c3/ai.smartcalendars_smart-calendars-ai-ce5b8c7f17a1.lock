        {
          "name": "get_feed",
          "title": "Read calendar events",
          "description": "Reads events and the current revision of a selected feed for a requested schedule lookup or revision. include_facets=true provides known facet values for label selection. Facets describe the entire published active feed, independent of read filters or pagination. Nonempty filters also return filtered_subscription with canonical filters, matching_event_count and unmatched_filter_values. Its nested URLs address that selection; top-level subscription URLs remain unfiltered. Event IDs, external keys, dates, removal state and pagination narrow only the read, never the subscription. Filtering changes no events and creates no cloned feed. A complete unfiltered read is a prerequisite for assessing cancellations from a revised schedule; omission from a filtered or paginated result is not evidence of deletion. Scope is limited to the connected account’s Smart Calendars AI feeds. No mailbox access, source-document retrieval, automatic source monitoring, scheduled PDF checks or document refresh is provided. Structured schedule content is supplied explicitly by the caller. Result links: subscription_open_url is the exact HTTPS handoff to the default calendar app via webcal; subscription_options_url provides Apple/default, Google, Outlook and copy-link choices; subscription_url is the copyable HTTPS calendar-file fallback; manage_url opens the feed dashboard. URL hosts, paths and tokens identify the returned resource and are not interchangeable. A filtered_subscription has its own links for that selection; top-level links remain unfiltered. Subscription access requires distribution_ready=true. Opening a link does not confirm a subscription; confirmation occurs in the user’s calendar app. Filter privacy: filters select events, not who can access them; anyone with the link can remove the filters and read the full published calendar.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "event_ids": {
                "description": "Optional selection of up to 250 existing event IDs. Omitted or empty means no event-ID restriction. This narrows only the read.",
                "items": {
                  "format": "uuid",
                  "type": "string"
                },
                "maxItems": 250,
                "type": "array"
              },
              "external_keys": {
                "description": "Optional selection of up to 250 source-stable external keys. Omitted or empty means no external-key restriction. Combined with other read filters.",
                "items": {
                  "type": "string"
                },
                "maxItems": 250,
                "type": "array"
              },
              "feed_id": {
                "description": "Identity of the selected calendar returned in feed results.",
                "format": "uuid",
                "type": "string"
              },
              "filters": {
                "additionalProperties": false,
                "description": "Values identify known labels from available_facets; include_facets=true provides that vocabulary. Values are trimmed and case-insensitive; format accepts attendance-mode aliases. Values within a field use OR; different fields use AND. Unknown values never broaden the selection. Filtering cannot infer missing metadata.",
                "properties": {
                  "attendance_mode": {
                    "description": "Alias for format.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "city": {
                    "description": "An existing event-city facet selected from available_facets.city, not the user’s current city or residence. User geolocation is outside this field’s scope.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "country": {
                    "description": "An existing event-country facet selected from available_facets.country, not the user’s nationality or residence. User geolocation is outside this field’s scope.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "format": {
                    "description": "Existing attendance-mode labels from available_facets.format, such as online or in-person; accepted aliases are normalized by the server.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "organizer": {
                    "description": "Alias for person.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "person": {
                    "description": "An event participant or organizer from available_facets.person, not an account or profile lookup.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "source": {
                    "description": "Child-feed/source identifier from available_facets.source, not a source URL.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "topic": {
                    "description": "Existing topic or category labels from available_facets.topic.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  },
                  "venue": {
                    "description": "An event venue selected from available_facets.venue, not a user-location lookup.",
                    "items": {
                      "maxLength": 1000,
                      "minLength": 1,
                      "type": "string"
                    },
                    "maxItems": 20,
                    "minItems": 1,
                    "type": "array"
                  }
                },
                "required": [],
                "type": "object"
              },
              "from": {
                "description": "Inclusive lower date bound in YYYY-MM-DD format. Events whose date span overlaps the requested range can match; omission leaves the lower bound open.",
                "type": "string"
              },
              "include_facets": {
                "default": false,
                "description": "Includes available_facets ({value,label,count} entries), facet_coverage ({tagged_events,fallback_events,missing_events}), facets_truncated and facet_scope=published_active_events. Coverage distinguishes explicit tags, fallbacks and missing values; title/location fallbacks do not infer classifications or audiences. Nonempty filters also include these results. Canonical fields: person, venue, topic, city, country, format, source.",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum events returned on this page, from 1 to 250; defaults to 100.",
                "maximum": 250,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Number of matching results skipped before this page; defaults to 0. The response next_offset identifies the next page when present.",
                "minimum": 0,
                "type": "integer"
              },
              "removal_state": {
                "description": "Event cancellation state to return: active excludes canceled events, removed returns canceled events, and all includes both. Defaults to active.",
                "enum": ["active", "removed", "all"],
                "type": "string"
              },
              "to": {
                "description": "Inclusive upper date bound in YYYY-MM-DD format. Events whose date span overlaps the requested range can match; omission leaves the upper bound open.",
                "type": "string"
              }
            },
            "required": ["feed_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read calendar events"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["feeds:read"],
                "type": "oauth2"
              }
