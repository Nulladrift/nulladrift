                "description": "True only for explicit user authorization of the current quoted credit deduction and resulting balance. Preview approval alone, a recovered receipt or an automation default does not authorize credit spending.",
                "type": "boolean"
              },
              "dry_run": {
                "default": false,
                "description": "True previews and validates the exact proposed changes without changing calendar events, advancing the revision or spending credits. The preview returns before/after changes, any billing quote and a preview_receipt. False saves the same proposal using its valid preview_receipt. The receipt proves preview integrity, not user approval; preview approval and any required credit authorization remain separate prerequisites. Defaults to false.",
                "type": "boolean"
              },
              "expected_revision": {
                "description": "Last read feed revision; prevents overwriting concurrent edits.",
                "minimum": 0,
                "type": "integer"
              },
              "feed_id": {
                "description": "Identity of the selected calendar, as returned in feed results.",
                "format": "uuid",
                "type": "string"
              },
