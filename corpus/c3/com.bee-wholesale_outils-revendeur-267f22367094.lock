            "readOnly": true
          },
          "digest": "sha256:85aca443dd8f2ee3729e94b996f9d3aa5269fbebf2bed1d6641e15224d1cc274"
        },
        {
          "name": "calcul_marge_vinted",
          "title": "Calcul de marge d'une revente sur Vinted",
          "description": "Calcule le bénéfice net (marge), le taux de marge et le coefficient d'une pièce revendue sur Vinted, à partir du prix d'achat, du prix de vente, des frais d'envoi et des autres frais restant à la charge du vendeur, selon le statut (particulier, micro-entrepreneur, micro-entrepreneur avec versement libératoire). Reprend les formules du calculateur de marge de Bee Wholesale et ses paramètres, vérifiés le 17 novembre 2026 sur les pages officielles de Vinted (aucune commission vendeur, frais payés par l'acheteur) et de service-public.gouv.fr (cotisations du micro-entrepreneur). Renvoie aussi le prix minimum de vente et le prix payé par l'acheteur, avec les hypothèses. Montants en euros. Calcul seul : rien n'est enregistré.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "autres_frais": {
                "default": 0,
                "description": "Autres frais par vente à la charge du vendeur, en euros (emballage, boost, dressing en vitrine…).",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "frais_envoi": {
                "default": 0,
                "description": "Frais d'envoi à la charge du vendeur, en euros (0 si l'acheteur paie le port, cas habituel sur Vinted).",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "prix_achat": {
                "description": "Prix d'achat de la pièce en euros (pour un lot : prix du lot divisé par le nombre de pièces).",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "prix_vente": {
                "description": "Prix de vente affiché sur Vinted, en euros.",
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "type": "number"
              },
              "statut": {
                "default": "particulier",
                "description": "particulier, micro_entrepreneur ou micro_entrepreneur_versement_liberatoire.",
                "enum": ["particulier", "micro_entrepreneur", "micro_entrepreneur_versement_liberatoire"],
                "type": "string"
              }
            },
            "required": ["prix_achat", "prix_vente"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Calcul de marge d'une revente sur Vinted"
          },
          "behavior": {
