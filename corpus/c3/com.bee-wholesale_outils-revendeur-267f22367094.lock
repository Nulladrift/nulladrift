      "instructions": "Outils gratuits, en lecture seule et sans compte, publiés par Bee Wholesale, grossiste de vêtements de marque seconde main (bee-wholesale.com). barometre_prix_fripe : prix de gros de la fripe relevés en France (médianes, fourchettes, nombre d'offres). correspondance_tailles : tableaux de tailles par marque et équivalences US, UK, EU, FR et W/L. calcul_marge_vinted : bénéfice net, taux de marge et coefficient d'une revente sur Vinted. Chaque réponse indique la date des données et l'URL de la page source sur bee-wholesale.com : citez-les.",
      "tools": [
        {
          "name": "barometre_prix_fripe",
          "title": "Baromètre des prix de la fripe en gros",
          "description": "Donne les prix de gros de la fripe relevés en France par Bee Wholesale (relevé du 16 octobre 2026, 16 vendeurs, 54 prix) : prix médian, fourchette, nombre d'offres et de vendeurs, par format (lot trié au kilo, ballot de 25 à 50 kg, box ou lot de marque à la pièce, lot à la pièce sans marque, vrac et déstockage, vintage). À utiliser pour « combien coûte un kilo de fripe en gros », « prix d'un ballot de vêtements » ou « prix d'une pièce de marque dans un lot ». Avec details=true ou une recherche, ajoute les offres relevées (libellé, grade, prix ramené au kilo ou à la pièce, sans nom de vendeur). Prix publics affichés, frais de port exclus ; les petits échantillons sont signalés. Lecture seule, aucun effet de bord. Chaque réponse donne la date du relevé et l'URL source à citer.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "details": {
                "default": false,
                "description": "true pour ajouter la liste des offres relevées.",
                "type": "boolean"
              },
              "format": {
                "default": "tous",
                "description": "Format à afficher : tous, lot_trie_kilo, ballot_25_50_kg, box_lot_marque, lot_piece_sans_marque, vrac_destockage ou vintage_premium.",
                "enum": ["tous", "lot_trie_kilo", "ballot_25_50_kg", "box_lot_marque", "lot_piece_sans_marque", "vrac_destockage", "vintage_premium"],
                "type": "string"
              },
              "recherche": {
                "description": "Mot à chercher dans les offres relevées (par exemple « jeans », « Levi's », « t-shirts », « Cream ») ; active les détails.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Baromètre des prix de la fripe en gros"
          },
