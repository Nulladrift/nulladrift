              "commune": {
                "description": "Municipality: name, postcode or identifier. / Commune : nom, numéro postal ou identifiant.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "langue": {
                "default": "fr",
                "description": "Language of labels and of the answer (fr, de, it, en). / Langue des libellés et de la réponse.",
                "enum": ["fr", "de", "it", "en"],
                "type": "string"
              },
              "rayon_km": {
                "default": 10,
                "description": "Radius in km. / Rayon en kilomètres.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
