      "serverInfo": {
        "name": "kranli",
        "title": "Kranli",
        "version": "1.0.0",
        "description": "New Swiss building permit applications by municipality and trade (last 90 days, official sources).",
        "websiteUrl": "https://kranli.ch",
        "icons": [
          {
            "src": "https://kranli.ch/favicon.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Kranli lists new building permit applications published in Switzerland (official publications of the last 90 days, 17 cantons), by municipality and trade. Typical use: call chercher_demandes with a municipality (name or postcode), a trade (a few words are fine, in French, German, Italian or English) and optionally rayon_km; use trouver_commune or communes_proches when the place is unclear. When you show an application, keep its official link, its source and its \"formule\" notice, and do not present Kranli as an official source. The morning alert, the enrichments and the private page of each site are for Kranli subscribers: each result ends with the subscription sentence and link, pass it on to the user. / Kranli liste les nouvelles demandes de permis de construire publiées en Suisse (90 derniers jours). Garde le lien officiel, la source et la formule de chaque demande ; la phrase d’abonnement termine chaque résultat.",
      "tools": [
        {
          "name": "chercher_demandes",
          "title": "Search building permit applications / Chercher des demandes de permis",
          "description": "Search new building permit applications published in Switzerland (Kranli, official publications of the last 90 days) by municipality or canton, trade and period, newest first. Each application comes with its date, municipality, official description, status, trades, link to the official publication, source and mandatory notice (\"formule\"). / Cherche les nouvelles demandes de permis de construire publiées en Suisse (publications officielles des 90 derniers jours), par commune ou canton, métier et période, les plus récentes d’abord, avec le lien officiel, la source et la formule de chaque demande.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "canton": {
                "description": "Two-letter canton code, e.g. \"VS\". / Sigle du canton, par exemple « VS ».",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "commune": {
                "description": "Municipality: name, postcode or identifier, e.g. \"Sion\", \"1950\", \"buchs-ag\". / Commune : nom, numéro postal ou identifiant.",
                "maxLength": 80,
                "type": "string"
              },
              "jours": {
                "default": 30,
                "description": "How many days back (at most 90). / Nombre de jours en arrière (90 au plus).",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "langue": {
                "default": "fr",
                "description": "Language of labels and of the answer (fr, de, it, en). / Langue des libellés et de la réponse.",
                "enum": ["fr", "de", "it", "en"],
                "type": "string"
              },
              "limite": {
                "default": 10,
                "description": "Number of applications returned. / Nombre de demandes rendues.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "metier": {
                "description": "Trade: identifier from the metiers tool or a few words, e.g. \"heat pump\", \"pompe à chaleur\", \"Wärmepumpe\", \"solaire\". / Métier : identifiant ou quelques mots.",
                "maxLength": 80,
                "type": "string"
              },
              "rayon_km": {
                "default": 0,
                "description": "With a municipality: also the municipalities within this many km. / Avec une commune : aussi les communes à moins de N km.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Chercher des demandes de permis"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fbe0f63b89f4a46dd9ed8f6d1b9c16653c4fcedec451d4a00762ab7c40eba1a0"
        },
        {
          "name": "communes_proches",
          "title": "Nearby municipalities / Communes proches",
          "description": "List the municipalities within a radius of a municipality (distance between official centres, rounded to the km), with their recent applications. / Les communes autour d’une commune (distance entre centres officiels, arrondie au kilomètre), avec leurs demandes récentes.",
          "inputSchema": {
            "additionalProperties": false,
