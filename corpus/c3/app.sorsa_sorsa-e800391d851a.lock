        {
          "name": "request_ungate_check",
          "description": "Request an ungate check for one or more gated ASINs. For each ASIN this\n    confirms it's gated (via the eligibility check) and, if so, QUEUES a job that\n    the user's Sorsa browser extension works through — it opens the Seller Central\n    approval request in their own logged-in session and reports the outcome.\n\n    Returns per-ASIN results, each one of: 'not_gated', 'already_approved',\n    'checking' (eligibility still resolving — re-call shortly), 'recent_attempt',\n    'queue_full', or 'queued' with a `job_id` (and the brand's auto-approval rate\n    when known). Jobs run STRICTLY ONE AT A TIME, ~daily-capped, and carry over\n    across days — so a long list is fine; it just drains serially.\n\n    The user needs their Amazon (SP-API) connected AND the Sorsa extension\n    installed and online. After queuing, poll get_ungate_status(job_id) after a\n    short wait (jobs are processed serially, each can take tens of seconds to a\n    few minutes). Tell the user if their extension is offline (the response\n    includes `extension_online`).",
          "inputSchema": {
            "properties": {
