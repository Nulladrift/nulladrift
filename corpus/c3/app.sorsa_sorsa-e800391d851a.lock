      "instructions": "Sorsa: Amazon FBA arbitrage tooling. Analyse ASINs (pricing, sales, fees, profit), resolve barcodes/titles to ASINs, and read the user's deal feeds, price alerts, OA deals and repricer (read-only). Product analysis tools cost the user monthly credits (cache hits are free) — check get_credits if the user asks about limits.",
      "tools": [
        {
          "name": "add_purchase",
          "description": "Add an item the user has BOUGHT to their Items Purchased list (the\n    next step after sourcing). Returns the created item incl. its `id` —\n    use that id with generate_sku and create_listing. cost is per unit;\n    sourced_from is the retailer/site they bought from.\n\n    projected_sale_price: default this to the product's 90-day average price\n    (from analyse_product) and tell the user what you've set — don't guess a\n    price. It's what create_listing will list at unless changed.",
          "inputSchema": {
            "properties": {
              "asin": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
