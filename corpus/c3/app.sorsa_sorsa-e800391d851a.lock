        {
          "name": "calculate_profit",
          "description": "Calculate Amazon FBA profit and ROI for given sell/cost prices using the\n    full fee engine (tiered referral fees, digital services tax, VAT on fees).\n    Call for what-if questions like 'what would I make selling at £24.99 if I\n    buy at £12?'. Prices are in the marketplace currency.",
          "inputSchema": {
            "properties": {
              "category": {
                "default": "",
                "title": "Category",
                "type": "string"
              },
              "cost_price": {
                "title": "Cost Price",
                "type": "number"
              },
              "domain": {
                "default": "GB",
                "title": "Domain",
                "type": "string"
              },
              "pick_and_pack_fee": {
                "default": 0,
                "title": "Pick And Pack Fee",
                "type": "number"
              },
              "referral_fee_pct": {
                "default": 15,
                "title": "Referral Fee Pct",
                "type": "number"
              },
              "sell_price": {
                "title": "Sell Price",
                "type": "number"
              }
            },
            "required": ["cost_price", "sell_price"],
            "title": "calculate_profitArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8b2cb9973b151878e96599248b5d1f119aefb4e0ffc56552d97e16e80160fc00"
        },
        {
          "name": "check_eligibility",
          "description": "Check whether the user is allowed to sell (ungated for) one or more\n    ASINs on their Amazon account. Call for 'am I ungated for this?' or 'can I\n    sell these ASINs?'. Returns per-ASIN {state, gated, apply_link}. Uncached\n    ASINs are queued for a fresh check, so re-call shortly for any still\n    pending. Requires a connected Amazon account.",
          "inputSchema": {
            "properties": {
              "asins": {
                "items": {
                  "type": "string"
                },
                "title": "Asins",
                "type": "array"
              },
              "condition": {
                "default": "new_new",
                "title": "Condition",
                "type": "string"
              }
            },
            "required": ["asins"],
            "title": "check_eligibilityArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0359780a072ef9319ac596cf8356b80becb126bb218e5ce20ee38f1308c7dff3"
        },
        {
          "name": "configure_prep_sheet",
          "description": "Configure the prep sheet. `enabled` turns auto-push to the user's own\n    Google Sheet on/off: every new purchase (web app, MCP add_purchase, or the\n    Discord 🛒 button) is appended as a row to `tab_name` (default 'Prep\n    Sheet'). `columns` is the user's prep centre's column headers IN ORDER —\n    free text, exactly as they appear on the sheet. Known headers are\n    synonym-matched to purchase fields (Date, Item/Title, ASIN, SKU, Qty,\n    Cost, Total Cost, Sale Price, Profit, ROI, Store/Company, Sourced From,\n    Sales Rank, Monthly Sales, Notes, Image URL); unknown headers (e.g.\n    'Order Number') become empty columns the prep centre fills in. This is the\n    SAME column config as the Items Purchased page's Prep Sheet Settings and\n    the daily DM CSV, so changing it here changes all three. Omitted arguments\n    keep their current values. The push also needs their Google Sheet\n    connected (get_sheet_status) with an 'append_row' action in their Apps\n    Script — if the response shows sheet_connected false, tell them to connect\n    it in Sorsa Settings first.",
          "inputSchema": {
            "properties": {
              "columns": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Columns"
              },
              "enabled": {
                "anyOf": [
