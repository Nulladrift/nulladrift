        {
          "name": "analyse_product",
          "description": "Quick analysis of an Amazon product by ASIN: title, brand, current/90-day\n    pricing, sales rank and estimated monthly sales, FBA fees and profit basics.\n    Call this first whenever the user asks about a specific ASIN. Costs the user\n    1 analyse credit unless cached. Domain is the Amazon marketplace: GB, US,\n    DE, FR, ES or IT.",
          "inputSchema": {
            "properties": {
              "asin": {
                "title": "Asin",
                "type": "string"
              },
              "domain": {
                "default": "GB",
                "title": "Domain",
                "type": "string"
              }
            },
            "required": ["asin"],
            "title": "analyse_productArguments",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
