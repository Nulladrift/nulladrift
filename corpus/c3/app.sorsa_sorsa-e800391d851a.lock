            "readOnly": false
          },
          "digest": "sha256:2de8ae2e833ae43c5ebb10e214a743123502abc004c3c0f4648b35a18b7dab7b"
        },
        {
          "name": "analyse_product_full",
          "description": "Full analysis of an Amazon product by ASIN — everything in analyse_product\n    plus seller/stock breakdown, buy-box history and variations. Slower and\n    heavier than analyse_product; use when the user wants seller-level or\n    historical detail in one shot. Costs 1 analyse credit unless the ASIN was\n    analysed in the last 24 hours.",
          "inputSchema": {
            "properties": {
              "asin": {
                "title": "Asin",
                "type": "string"
              },
              "domain": {
                "default": "GB",
