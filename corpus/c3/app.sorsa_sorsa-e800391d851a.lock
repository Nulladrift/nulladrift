        {
          "name": "create_finder_monitor",
          "description": "Create a LIVE Keepa Product Finder monitor from the same filters as\n    find_products. It runs on the user's OWN Keepa key and sends a Discord\n    alert to `webhook_url` whenever a NEW product starts matching the filters —\n    the saved/recurring version of find_products.\n\n    REQUIRED: a `name` for the monitor and a Discord `webhook_url` (https://…) —\n    ALWAYS ask the user for their webhook URL; never invent one. The user must\n    also have their Keepa key connected (call get_keepa_key_status first).\n\n    Provide at least one filter (same semantics/units as find_products). This\n    creates a real, active monitor that will start pinging the webhook — confirm\n    with the user before creating it. Set active=False to create it paused.",
