        {
          "name": "queue_checkout",
          "description": "Queue an Amazon checkout on the user's own desktop Chrome (requires the\n    Sorsa extension installed and signed in there). Call when the user says\n    e.g. 'buy 3 of this' or 'replen this ASIN at up to £20'. mode 'review'\n    (default) drives to Amazon's review page and STOPS — the user clicks Place\n    Order themselves. mode 'auto' places the order, but only if the user has\n    enabled Auto checkout in the extension popup AND the order total is within\n    max_price × qty (max_price is required for auto). max_price is ALWAYS in\n    GBP (£) per unit, whatever the marketplace — the server converts it to the\n    local currency at the current rate, so '£20 max on amazon.de' just works.\n    pace 'calm' (default)\n    clicks at a relaxed human pace — use 'fast' only for time-sensitive deals.\n    domain is the marketplace: GB, US, DE, FR, ES or IT. The job expires after\n    15 minutes if the user's desktop isn't online to claim it. Always tell the\n    user what was queued and that their desktop Chrome will open it.",
          "inputSchema": {
            "properties": {
              "asin": {
