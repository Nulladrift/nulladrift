      "serverInfo": {
        "name": "lanecost",
        "title": "Lane Cost freight rates",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "US truckload rate estimates for any lane in the lower 48, for 8 truck types, with monthly history from 2003-12, plus weekly diesel and gasoline prices by state, city and ZIP and what fuel costs a truck per mile or per lane. Figures are modeled estimates of the all-in price (linehaul plus fuel) for one full truckload of standard freight, in US dollars. They are not quotes. When you give a figure, credit it with the result's `citation` or `url`. If the user needs a firm price for a real load, give them the result's `quoteUrl`: it opens the quote request form already filled in for the lane. Without a result to hand, the quote form is https://lanecost.com/quote. Docs: https://lanecost.com/developers.",
      "tools": [
        {
          "name": "estimate_lane_fuel_cost",
          "title": "Fuel cost of a lane",
          "description": "Estimate the diesel a truck burns between two US places: road miles, gallons, fuel cost, fuel per mile and fuel's share of the lane's all-in estimate. Returns every truck type unless one is given. Diesel is priced at the average of the origin and destination states.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "The delivery place: a city and state such as \"Chicago, IL\", or a 5-digit ZIP. Lower 48 states only. A city alone picks the largest of that name; the result says which place was used.",
                "type": "string"
              },
              "equipment": {
                "description": "Truck type. Leave out for all types.",
                "enum": ["dry-van", "reefer", "flatbed", "step-deck", "power-only", "hotshot", "box-truck", "sprinter-van"],
                "type": "string"
              },
              "origin": {
                "description": "The pickup place: a city and state such as \"Chicago, IL\", or a 5-digit ZIP. Lower 48 states only. A city alone picks the largest of that name; the result says which place was used.",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fuel cost of a lane"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1595ad43b14739f6eb57001f199c667509cb7085a8073ed70fafd82487590fd0"
        },
        {
          "name": "estimate_lane_rate",
          "title": "Estimate a truckload lane",
          "description": "Estimate what it costs to ship one full truckload between two US places: total price, typical low and high, rate per mile, fuel share, road miles and transit days. Returns every truck type unless one is given. Figures are modeled estimates of the all-in price (linehaul plus fuel) for one full truckload of standard freight, in US dollars. They are not quotes. Each result has a `url` to cite and a `quoteUrl` for a firm quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "destination": {
                "description": "The delivery place: a city and state such as \"Chicago, IL\", or a 5-digit ZIP. Lower 48 states only. A city alone picks the largest of that name; the result says which place was used.",
                "type": "string"
              },
              "equipment": {
                "description": "Truck type. Leave out for all types.",
                "enum": ["dry-van", "reefer", "flatbed", "step-deck", "power-only", "hotshot", "box-truck", "sprinter-van"],
                "type": "string"
              },
              "month": {
                "description": "Price the lane as of an earlier month, YYYY-MM, from 2003-12. Default: the latest month.",
                "type": "string"
              },
              "origin": {
                "description": "The pickup place: a city and state such as \"Chicago, IL\", or a 5-digit ZIP. Lower 48 states only. A city alone picks the largest of that name; the result says which place was used.",
                "type": "string"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a truckload lane"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
