{
  "lockfileVersion": 2,
  "subjects": {
    "com.fitinview/barcode-pro": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://barcode.fitinview.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "barcode-pro",
        "title": "Barcode Pro: barcodes and QR codes",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Barcode Pro makes print-ready barcodes and QR codes: EAN-13, EAN-8, UPC-A, ITF-14, Code 128, Code 39 and QR. generate_barcode returns the SVG (vector, for print and packaging) and a PNG preview. For EAN/UPC/ITF-14 you may give the number without its last digit; the check digit is added. check_barcode_number validates a GS1 number or computes its check digit. Real retail EAN/UPC numbers must be licensed from GS1; the tool only draws the number it is given. Free, no sign-in. Website: https://barcode.fitinview.com",
      "tools": [
        {
          "name": "check_barcode_number",
          "title": "Check or complete an EAN/UPC number",
          "description": "For EAN13, EAN8, UPC or ITF14: give the full number to check its check digit, or the number without the last digit to get the check digit and the full number.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "enum": ["EAN13", "EAN8", "UPC", "ITF14"],
                "type": "string"
              },
              "number": {
                "pattern": "^[0-9 -]+$",
                "type": "string"
              }
            },
            "required": ["format", "number"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:44357ef588de233f6931a25c21c52d1f65a34d4b27f7ca5b55f20e0441c68173"
        },
        {
          "name": "generate_barcode",
          "title": "Make a barcode or QR code",
          "description": "Draw a barcode or QR code and return it as SVG (for print) and as a PNG preview. format: EAN13, EAN8, UPC (UPC-A), ITF14, CODE128, CODE39 or QR. value: the digits or text (QR: any text or URL up to 256 characters). Colours as #rrggbb; keep the bars dark on a light background so scanners can read it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bg": {
                "default": "#ffffff",
                "description": "Background colour",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "fg": {
                "default": "#0a0a0b",
                "description": "Bar colour",
                "pattern": "^#[0-9a-fA-F]{6}$",
                "type": "string"
              },
              "format": {
                "enum": ["EAN13", "EAN8", "UPC", "ITF14", "CODE128", "CODE39", "QR"],
                "type": "string"
              },
              "height": {
                "default": 100,
                "description": "Bar height (1D barcodes)",
                "maximum": 200,
                "minimum": 40,
                "type": "integer"
              },
              "png_width": {
                "default": 600,
                "description": "Width of the PNG preview in pixels",
                "maximum": 2000,
                "minimum": 200,
                "type": "integer"
              },
              "text": {
                "default": true,
                "description": "Print the number under 1D barcodes",
                "type": "boolean"
              },
              "value": {
                "maxLength": 256,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["format", "value"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4bfaede2cbd60eab953ec358dfc9c38096ac941fe611e3f97648ba67c48782dd"
        }
      ],
      "digest": "sha256:55813cf49d0583fe56be45826e22838bf57854693c7d42f50ab99efa1d389afd"
    }
  }
}
