        {
          "name": "get_episode",
          "title": "Episode details",
          "description": "Get one published episode by id: description, duration, listen_url, audio_url, show_url, chapters with links that start playback at each chapter, and optionally the speaker-labeled transcript. Use it after search_catalog or latest_episodes when someone wants to know what an episode covers, jump to a part, or quote it. An unknown or unpublished id returns a tool error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "episode_id": {
                "description": "Episode id from search_catalog or latest_episodes.",
                "type": "string"
              },
              "include_transcript": {
                "default": false,
                "description": "Also return the transcript. Leave off unless you need to quote or summarize it.",
                "type": "boolean"
              },
              "max_transcript_chars": {
                "default": 12000,
                "description": "Cut the transcript at this many characters; transcript.truncated says whether it was cut.",
                "maximum": 60000,
                "minimum": 1000,
                "type": "integer"
              }
            },
            "required": ["episode_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "artwork_url": {
                "description": "Episode or show artwork.",
                "type": ["string", "null"]
              },
              "audio_url": {
                "description": "Direct MP3 URL, for players or downloads.",
                "type": ["string", "null"]
              },
              "chapters": {
                "description": "Chapters in order; empty when the episode has none.",
                "items": {
                  "properties": {
                    "listen_url": {
                      "description": "Listen page that starts playback at this chapter.",
                      "type": ["string", "null"]
                    },
                    "start": {
                      "description": "Chapter start as m:ss or h:mm:ss.",
                      "type": "string"
                    },
                    "start_seconds": {
                      "description": "Chapter start in seconds.",
                      "type": "number"
                    },
                    "title": {
                      "description": "Chapter title.",
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["start", "start_seconds"],
                  "type": "object"
                },
                "type": "array"
              },
              "description": {
                "description": "Short public summary.",
                "type": ["string", "null"]
              },
              "duration": {
                "description": "Length as m:ss or h:mm:ss.",
                "type": ["string", "null"]
              },
              "duration_seconds": {
                "description": "Length in seconds.",
                "type": ["number", "null"]
              },
              "episode_id": {
                "description": "Pass to get_episode for chapters and transcript.",
                "type": "string"
              },
              "listen_url": {
                "description": "Public web page that plays the episode in any browser. Give this to a person.",
                "type": ["string", "null"]
              },
              "published_at": {
                "description": "ISO 8601 publish time.",
                "type": ["string", "null"]
              },
              "show_name": {
                "description": "Show the episode belongs to.",
                "type": ["string", "null"]
              },
              "show_url": {
                "description": "Public page for the episode's show.",
                "type": ["string", "null"]
              },
              "title": {
                "description": "Episode title.",
                "type": ["string", "null"]
              },
              "transcript": {
                "description": "Present only when include_transcript is true; null if the episode has no public transcript.",
                "properties": {
                  "speaker_count": {
                    "description": "Distinct speakers.",
                    "type": ["integer", "null"]
                  },
                  "text": {
                    "description": "Transcript as 'Speaker: line' paragraphs.",
                    "type": "string"
                  },
                  "truncated": {
                    "description": "True when text was cut at max_transcript_chars.",
                    "type": "boolean"
                  },
                  "word_count": {
                    "description": "Words in the full transcript.",
                    "type": ["integer", "null"]
                  }
                },
                "required": ["text", "truncated"],
                "type": ["object", "null"]
              }
            },
            "required": ["chapters", "episode_id", "listen_url", "title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Episode details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
