{
  "lockfileVersion": 2,
  "subjects": {
    "com.nomyparts/open-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nomyparts-open-data.nomyparts.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "NomyParts open data",
        "title": "NomyParts open data",
        "version": "1.0.0",
        "websiteUrl": "https://www.nomyparts.com/developers/",
        "icons": [
          {
            "src": "https://www.nomyparts.com/brand/icon-512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only catalog of components for professional drones and eVTOL aircraft: products, manufacturers, specifications with units and the source of each value. Cite the profile URL of every product you use. Attribution: \"Source: NomyParts, <profile URL>\".",
      "tools": [
        {
          "name": "compare_products",
          "title": "Compare products",
          "description": "Compare two to five products side by side, specification by specification: returns each product and, for every specification they state, the value of each one with its unit.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Ids of the products to compare side by side, as returned by search_components (2 to 5; any further ids are ignored).",
                "items": {
                  "description": "A product id, as returned by search_components.",
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:474ac815e2649d3cdaec572fea2f80e10765b952e9661ecca6f9fbd1ac9bc0dc"
        },
        {
          "name": "get_company",
          "title": "Get company",
          "description": "The record of one manufacturer: description, country, website, certifications and the list of its products with their ids and profile URLs.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Manufacturer id (manufacturerId of a product).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3c982248f6969406f9e284b4a290be5b2d6807ed1964dda923d750f3d6ffd597"
        },
        {
          "name": "get_product",
          "title": "Get product",
          "description": "The full record of one product: manufacturer, category, every specification with its unit and the source page of each value, the date each was checked, and its profile URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product id, as returned by search_components.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5f759bb821b9c035df9283c6ef54d08533707d35b479c7212f16f5229272aae3"
        },
        {
          "name": "list_categories",
          "title": "List categories",
          "description": "The categories and subcategories of the catalog (ids and names, to use as filters in search_components), with the number of products of each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ec835bed4caacd67ed46ab4fde20b0eda9378f2129b64c7f80a67a73de8715bd"
        },
        {
          "name": "search_components",
          "title": "Search components",
          "description": "Search the catalog of components by text, category, subcategory, manufacturer and specification filters. Returns the total number of matches and, for each of the first results, the product id, name, manufacturer, category, key specifications and the URL of its profile.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id or name (see list_categories).",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of results to return (1 to 25, default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "Manufacturer id or part of its name.",
                "type": "string"
              },
              "query": {
                "description": "Words to look for (name, manufacturer, type).",
                "type": "string"
              },
              "specs": {
                "additionalProperties": true,
                "description": "Specification filters by specification id: a number range {\"min\": 10, \"max\": 50} (in the SI unit when the specification has one) or a text that must be contained.",
                "type": "object"
              },
              "subcategory": {
                "description": "Subcategory id or name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4aa8dd169ff3dceacba3efbd0772550958298db54eebd4b880510375a24e332a"
        }
      ],
      "digest": "sha256:8312df7f204a0b30aaeaf421f01734c34c905f4166e93680fe4d3ec428df91ec"
    }
  }
}
