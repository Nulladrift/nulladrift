{
  "lockfileVersion": 2,
  "subjects": {
    "com.nomyparts/open-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://nomyparts-open-data.nomyparts.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "NomyParts open data",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only catalog of components for professional drones and eVTOL aircraft: products, manufacturers, specifications with units and the source of each value. Cite the profile URL of every product you use. Attribution: \"Source: NomyParts, <profile URL>\".",
      "tools": [
        {
          "name": "compare_products",
          "description": "Compare two to five products side by side, specification by specification.",
          "inputSchema": {
            "properties": {
              "ids": {
                "items": {
                  "type": "string"
                },
                "maxItems": 5,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d7cb207e9a9892ad9d2985db9de2fd6f9e126fc6f979cd94855b21b5b93f6ddc"
        },
        {
          "name": "get_company",
          "description": "A manufacturer: description, country, website, certifications and its products.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Manufacturer id (manufacturerId of a product).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:70da8324e3c7dfb65de42421a8cc1cd97e4a9ced92fdb69ed08bab5df151d3ac"
        },
        {
          "name": "get_product",
          "description": "The full record of a product: manufacturer, category, every specification with its unit and the source page of each value, and its profile URL.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Product id, as returned by search_components.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8dba02b99f0f20a75ea4a0a745efe1a66131c06f5d0c0161f6cc60685050c4f7"
        },
        {
          "name": "list_categories",
          "description": "The categories and subcategories of the catalog, with the number of products of each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66f3a12a4457fda1d7b291adefe1a3b3e055717f0b8b01396c893794150a5f1c"
        },
        {
          "name": "search_components",
          "description": "Search the catalog of components by text, category, subcategory, manufacturer and specification filters. Returns matching products with the URL of their profile.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category id or name (see list_categories).",
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "manufacturer": {
                "description": "Manufacturer id or part of its name.",
                "type": "string"
              },
              "query": {
                "description": "Words to look for (name, manufacturer, type).",
                "type": "string"
              },
              "specs": {
                "additionalProperties": true,
                "description": "Specification filters by specification id: a number range {\"min\": 10, \"max\": 50} (in the SI unit when the specification has one) or a text that must be contained.",
                "type": "object"
              },
              "subcategory": {
                "description": "Subcategory id or name.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a2df3a33ce177460db5127c6d9b6147e8edb71b9b5e7beb9976880140996cb6c"
        }
      ],
      "digest": "sha256:141dcad9e89c25866bcaa039d1dd7debab551bde297d9bf52628e7e5621f45c3"
    }
  }
}
