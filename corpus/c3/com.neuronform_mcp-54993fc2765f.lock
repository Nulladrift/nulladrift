        {
          "name": "render_design",
          "title": "Render design",
          "description": "Renders a design as an image, returns its summary, and opens the interactive 3D viewer where the host supports it. The default overview shows four 3D views from the north, east, south, and west beside the top view with north up and a scale bar, so proportions and relief read from every side; view top or oblique with a direction gives one larger view, resolution high doubles the size. A repeated render of the same design and options is answered from the cache.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "design": {
                "description": "Complete design (MapRequest) as create_design returns it; the full JSON schema is the resource neuronform://schema/design and get_design_guide explains every section.",
                "type": "object"
              },
              "direction": {
                "description": "Compass direction the camera of view oblique looks from, 35° above the horizon; default sw. Only with view oblique.",
                "enum": ["n", "ne", "e", "se", "s", "sw", "w", "nw"],
                "type": "string"
              },
              "lang": {
                "description": "Language of the summaries and error messages; default en.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "resolution": {
                "description": "standard (default) or high, which doubles the width and the height of the image.",
                "enum": ["standard", "high"],
                "type": "string"
              },
              "view": {
                "description": "Image layout: overview (default, 1600 × 800 px: four 3D views and the top view), top (800 × 800 px top view with north up and scale bar), or oblique (800 × 800 px 3D view from direction).",
                "enum": ["overview", "top", "oblique"],
                "type": "string"
              }
            },
            "required": ["design"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
