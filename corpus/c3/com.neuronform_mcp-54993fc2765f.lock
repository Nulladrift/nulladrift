      "serverInfo": {
        "name": "NeuronForm",
        "title": "NeuronForm 3D map models",
        "version": "0.1.0"
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/ui": {
            "mimeTypes": ["text/html;profile=mcp-app"]
          }
        },
        "resources": {},
        "tools": {}
      },
      "instructions": "NeuronForm turns OpenStreetMap data into 3D-printable map models.\n1. Find the place with search_places, then call create_design with a brief (place or lat/lon, width, shape, tiles, colors, relief, frame, label); it returns a complete design JSON.\n2. Change the design directly: edit_tiles adds or removes tiles by compass direction, find_map_elements returns ready-to-insert roads, buildings with the placement of a custom house that replaces them, areas, and ground regions, list_templates offers gallery designs, and get_design_guide explains every field, custom houses in topic custom_houses.\n3. Check changes with validate_design; it names every refused field with a hint.\n4. Show the design with render_design: an image with a 3D and a top view and, where the host supports it, an interactive viewer.\n5. Give the user the link of share_design; it opens exactly this design in the NeuronForm configurator, where export and purchase need a NeuronForm account.\nAgents have the limits of anonymous visitors (up to 3 tiles) and never export or buy.",
      "tools": [
        {
          "name": "create_design",
          "title": "Create design from brief",
          "description": "Compiles a short brief into a complete design with the configurator defaults; the centre given by place or lat and lon is the centre of tile 0. Invalid values fall back to their defaults with a notice naming the brief field. Change the result with edit_design.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "brief": {
                "additionalProperties": false,
                "description": "Design brief; place or lat and lon is required.",
                "properties": {
                  "colors": {
                    "anyOf": [
                      {
                        "enum": ["single", "two", "four"],
                        "type": "string"
                      },
                      {
                        "additionalProperties": {
                          "pattern": "^#?[0-9A-Fa-f]{6}$",
                          "type": "string"
                        },
                        "properties": {
                          "template": {
                            "enum": ["single", "two", "four"],
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    ],
                    "description": "Colours: a template, or an object with an optional template and colours RRGGBB by group (ground: terrain, paved areas, sand and rock; green: vegetation, agriculture; water: water areas, sea, waterways; traffic: roads, paths, railways), by layer kind (terrain, paved_areas, bare_ground, vegetation, agriculture, water_areas, sea, waterways, major_roads, local_roads, paths, railways, buildings), frame, or label. Groups apply before layer kinds; every distinct colour is one filament."
                  },
                  "exaggeration": {
                    "description": "Vertical relief exaggeration, 0.1 to 10; default 1.",
                    "type": "number"
                  },
                  "frame": {
                    "enum": ["none", "integrated", "separate"],
                    "type": "string"
                  },
                  "label": {
                    "description": "Edge label text on the first tile, up to 64 characters.",
                    "type": "string"
                  },
                  "lang": {
                    "enum": ["de", "en"],
                    "type": "string"
                  },
                  "lat": {
                    "maximum": 85.05,
                    "minimum": -85.05,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "model_width": {
                    "description": "Printed width of one tile in mm, 50 to 300; default 200.",
                    "type": "number"
                  },
                  "place": {
                    "description": "Place or address; with lat and lon it only names the place.",
                    "type": "string"
                  },
                  "relief": {
                    "description": "true prints real relief, false prints flat; default automatic.",
                    "type": "boolean"
                  },
                  "rotation": {
                    "description": "Clockwise rotation in degrees.",
                    "type": "number"
                  },
                  "shape": {
                    "enum": ["hexagon", "circle", "square", "rectangle", "polygon"],
                    "type": "string"
                  },
                  "sides": {
                    "description": "Sides of the shape polygon.",
                    "maximum": 12,
                    "minimum": 3,
                    "type": "integer"
                  },
                  "tiles": {
                    "description": "Tile count, arranged compactly; at most 3 for agents.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "width": {
                    "description": "Map width in metres, 100 to 30000; default 1500.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "lang": {
                "description": "Language of the summaries and error messages; default en.",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "required": ["brief"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create design from brief"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9974d438bb1d12529e80af424b445d4318aa65595817e50c5ea0e9f9714874d3"
        },
        {
          "name": "edit_design",
          "title": "Edit design",
          "description": "Changes a design and returns the complete changed design, validated against the rules and the limits of anonymous use. changes takes brief fields (an absent field keeps the design: width, rotation, model_width, exaggeration, relief, frame, colors, label, tiles, shape, or place or lat and lon to move the centre of tile 0); patch takes JSON Patch operations for every other field, applied after changes. The service stores no design: send the complete design every time and continue with the returned one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "changes": {
                "additionalProperties": false,
                "description": "Brief fields to change. tiles arranges a new compact layout, label replaces the text of the first edge label or adds one, colors without template keeps the other colours.",
                "properties": {
                  "colors": {
                    "anyOf": [
                      {
                        "enum": ["single", "two", "four"],
                        "type": "string"
                      },
                      {
                        "additionalProperties": {
                          "pattern": "^#?[0-9A-Fa-f]{6}$",
                          "type": "string"
                        },
                        "properties": {
                          "template": {
                            "enum": ["single", "two", "four"],
                            "type": "string"
                          }
                        },
                        "type": "object"
                      }
                    ],
                    "description": "Colours: a template, or an object with an optional template and colours RRGGBB by group (ground: terrain, paved areas, sand and rock; green: vegetation, agriculture; water: water areas, sea, waterways; traffic: roads, paths, railways), by layer kind (terrain, paved_areas, bare_ground, vegetation, agriculture, water_areas, sea, waterways, major_roads, local_roads, paths, railways, buildings), frame, or label. Groups apply before layer kinds; every distinct colour is one filament."
                  },
                  "exaggeration": {
                    "description": "Vertical relief exaggeration, 0.1 to 10; default 1.",
                    "type": "number"
                  },
                  "frame": {
                    "enum": ["none", "integrated", "separate"],
                    "type": "string"
                  },
                  "label": {
                    "description": "Edge label text on the first tile, up to 64 characters.",
                    "type": "string"
                  },
                  "lang": {
                    "enum": ["de", "en"],
                    "type": "string"
                  },
                  "lat": {
                    "maximum": 85.05,
                    "minimum": -85.05,
                    "type": "number"
                  },
                  "lon": {
                    "maximum": 180,
                    "minimum": -180,
                    "type": "number"
                  },
                  "model_width": {
                    "description": "Printed width of one tile in mm, 50 to 300; default 200.",
                    "type": "number"
                  },
                  "place": {
                    "description": "Place or address; with lat and lon it only names the place.",
                    "type": "string"
                  },
                  "relief": {
                    "description": "true prints real relief, false prints flat; default automatic.",
                    "type": "boolean"
                  },
                  "rotation": {
                    "description": "Clockwise rotation in degrees.",
                    "type": "number"
                  },
                  "shape": {
                    "enum": ["hexagon", "circle", "square", "rectangle", "polygon"],
                    "type": "string"
                  },
                  "sides": {
                    "description": "Sides of the shape polygon.",
                    "maximum": 12,
                    "minimum": 3,
                    "type": "integer"
                  },
                  "tiles": {
                    "description": "Tile count, arranged compactly; at most 3 for agents.",
                    "minimum": 1,
                    "type": "integer"
                  },
                  "width": {
                    "description": "Map width in metres, 100 to 30000; default 1500.",
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "design": {
                "description": "Complete design (MapRequest) as create_design returns it; the full JSON schema is the resource neuronform://schema/design and get_design_guide explains every section.",
                "type": "object"
              },
              "lang": {
                "description": "Language of the summaries and error messages; default en.",
                "enum": ["de", "en"],
                "type": "string"
              },
              "patch": {
                "description": "JSON Patch operations (RFC 6902 add, replace, remove) on the design JSON, applied after changes, such as {\"op\": \"replace\", \"path\": \"/terrain/vertical_exaggeration\", \"value\": 2.5} or {\"op\": \"add\", \"path\": \"/customizations/decorations/-\", \"value\": {...}}.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "op": {
                      "enum": ["add", "replace", "remove"],
                      "type": "string"
                    },
                    "path": {
                      "description": "JSON Pointer into the design; - as last token appends to an array.",
                      "type": "string"
                    },
                    "value": {
                      "description": "New value of add and replace."
                    }
                  },
                  "required": ["op", "path"],
                  "type": "object"
                },
                "maxItems": 100,
                "type": "array"
              }
            },
            "required": ["design"],
            "type": "object"
          },
