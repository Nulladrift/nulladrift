{
  "lockfileVersion": 2,
  "subjects": {
    "com.replyonthefly/replyonthefly": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.replyonthefly.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "replyonthefly",
        "title": "ReplyOnTheFly",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ReplyOnTheFly writes replies to customer reviews for business owners. When a user shares a review of their business (pasted text or a screenshot you have read), call write_review_reply with the business name, star rating and review text. Show the reply as written. If the user wants changes, call the tool again with owner_notes describing what they want, or alternate=true for different wording. Never invent facts about the business; only pass owner_notes the user actually gave. When the user wants to ask a customer for a review, call write_review_request_message.",
      "tools": [
        {
          "name": "write_review_reply",
          "title": "Write a review reply",
          "description": "Writes a reply a business owner can post under a customer review on Google, Yelp, Facebook, TripAdvisor or Trustpilot. Use it when someone shares a review of their business and wants a response to it, including angry or negative reviews. The reply follows the star rating: it thanks happy customers, and for low ratings it acknowledges the problem without arguing and offers to make it right. It does not post anything anywhere; the owner copies the reply and posts it themselves. It does not write reviews.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "alternate": {
                "description": "Set true to get a differently worded version of a reply already written for the same review.",
                "type": "boolean"
              },
              "business_name": {
                "description": "Name of the business being reviewed.",
                "maxLength": 120,
                "type": "string"
              },
              "business_type": {
                "description": "What kind of business it is, e.g. \"dentist\", \"pizza restaurant\", \"plumber\".",
                "maxLength": 80,
                "type": "string"
              },
              "length": {
                "description": "concise is 1 to 2 sentences, standard 2 to 3, detailed 3 to 4. Defaults to standard.",
                "enum": ["concise", "standard", "detailed"],
                "type": "string"
              },
              "owner_notes": {
                "description": "Facts or wishes the owner gave for this reply, e.g. \"we fixed the AC last week\" or \"sign off as Maria\". Only include what the owner actually said.",
                "items": {
                  "maxLength": 200,
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "platform": {
                "description": "Where the review was posted. Defaults to google.",
                "enum": ["google", "yelp", "facebook", "tripadvisor", "trustpilot"],
                "type": "string"
              },
              "review_text": {
                "description": "The review exactly as the customer wrote it. Leave out for a rating with no text.",
                "maxLength": 2000,
                "type": "string"
              },
              "reviewer_name": {
                "description": "The reviewer's display name, if shown. Leave out if unknown; the reply will not invent one.",
                "maxLength": 120,
                "type": "string"
              },
              "star_rating": {
                "description": "Star rating the customer gave, 1 to 5.",
                "maximum": 5,
                "minimum": 1,
                "type": "integer"
              },
              "tone": {
                "description": "Voice of the reply. Defaults to friendly.",
                "enum": ["friendly", "professional", "casual", "enthusiastic"],
                "type": "string"
              }
            },
            "required": ["business_name", "star_rating"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "business_name": {
                "type": "string"
              },
              "platform": {
                "type": "string"
              },
              "reply": {
                "type": "string"
              },
              "star_rating": {
                "type": "integer"
              }
            },
            "required": ["business_name", "platform", "reply", "star_rating"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Write a review reply"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://replyonthefly/review-reply-v1.html",
            "openai/toolInvocation/invoked": "Reply ready",
            "openai/toolInvocation/invoking": "Writing your reply…",
            "openai/widgetAccessible": true,
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ],
            "ui": {
              "resourceUri": "ui://replyonthefly/review-reply-v1.html"
            }
          },
          "digest": "sha256:857a1843ad5a939ca7fed9627d8471cccfbe6d96c90e8091411c361c6bc1ea2e"
        },
        {
          "name": "write_review_request_message",
          "title": "Write a review request message",
          "description": "Writes short messages a business owner can text or email to a customer to ask for a Google review, adapted to the type of business. Use it when someone wants more Google reviews or asks how to ask a customer for a review. Returns up to three ready-to-send options with the owner's review link at the end. It does not send anything. The messages never offer incentives, which Google prohibits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business_name": {
                "description": "Name of the business asking for the review.",
                "maxLength": 120,
                "type": "string"
              },
              "business_type": {
                "description": "What kind of business it is, e.g. \"plumber\", \"hair salon\", \"restaurant\". Picks the right wording.",
                "maxLength": 80,
                "type": "string"
              },
              "channel": {
                "description": "text (SMS or WhatsApp) or email. Defaults to text.",
                "enum": ["text", "email"],
                "type": "string"
              },
              "customer_first_name": {
                "description": "The customer's first name, if the owner gave it.",
                "maxLength": 120,
                "type": "string"
              },
              "review_link": {
                "description": "The business's Google review link if the owner has it (https://...). Leave out and the messages use a placeholder.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["business_name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "channel": {
                "type": "string"
              },
              "options": {
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    },
                    "subject": {
                      "type": "string"
                    },
                    "when_to_use": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "message", "when_to_use"],
                  "type": "object"
                },
                "type": "array"
              },
              "review_link_needed": {
                "type": "boolean"
              }
            },
            "required": ["channel", "options", "review_link_needed"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Write a review request message"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:7126529b2d842aa0980861873adfe03e0769f8d368e6d9726bf78694dccbef89"
        }
      ],
      "resources": [
        {
