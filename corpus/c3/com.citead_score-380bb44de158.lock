        {
          "name": "score_url",
          "description": "Fetch a public web page and compute its GEO score with Citead. Returns the overall score (0 to 100), the score of each criterion (semantic richness, AI citability, freshness, content organization, authority and citations, and naturalness, which does not count in the score), the main fixes to apply, and a citead.com link that shows the analysis again. The GEO score (0 to 100) measures how easy the content is for a language model to understand, reuse and cite: information density, quotable sentences, self-contained paragraphs, sourced and dated facts, clear structure, freshness. Naturalness is returned as a criterion but does not count in the score. It is computed by deterministic rules, without a language model: the same content always gets the same score. It does not guarantee that an AI assistant will cite the page. Free, no API key. Citead does not store the page content or its score; it keeps only daily counts of outcomes, the domain name of sites that block its fetcher (45 days) and per-IP rate-limit counters. The details_url page does not publish the result to the public leaderboard. Pages behind a login or rendered only by JavaScript may not be fetchable: use score_text with the page text instead.",
