      },
      "instructions": "Free GEO scoring by Citead (citead.com), no API key. score_url fetches a public page and scores it; score_text scores text you pass inline (markdown, plain text or HTML). The GEO score (0 to 100) measures how easy the content is for a language model to understand, reuse and cite: information density, quotable sentences, self-contained paragraphs, sourced and dated facts, clear structure, freshness. Naturalness is returned as a criterion but does not count in the score. It is computed by deterministic rules, without a language model: the same content always gets the same score. It does not guarantee that an AI assistant will cite the page. Limits per IP address: 5 scores per minute, 20 per hour, 50 per day. Always give the user the details_url from the result.",
      "tools": [
        {
          "name": "score_text",
          "description": "Compute the GEO score of a text with Citead: an article draft, a page copy, markdown, plain text or HTML. Returns the overall score (0 to 100), the score of each criterion (semantic richness, AI citability, freshness, content organization, authority and citations, and naturalness, which does not count in the score), the main fixes to apply, and a link to Citead's free live editor. The GEO score (0 to 100) measures how easy the content is for a language model to understand, reuse and cite: information density, quotable sentences, self-contained paragraphs, sourced and dated facts, clear structure, freshness. Naturalness is returned as a criterion but does not count in the score. It is computed by deterministic rules, without a language model: the same content always gets the same score. It does not guarantee that an AI assistant will cite the page. Free, no API key, the text is not stored. Texts under 300 words get a capped score (at most 65).",
          "inputSchema": {
            "properties": {
              "content": {
                "description": "The text to score: markdown, plain text or HTML.",
                "maxLength": 200000,
                "minLength": 1,
                "title": "Content",
                "type": "string"
              },
              "language": {
                "anyOf": [
                  {
                    "enum": ["en", "fr"],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Language of the text. Omit to detect it. Only English and French have dedicated rules; other languages use the English ones.",
                "title": "Language"
              },
              "title": {
                "anyOf": [
                  {
                    "maxLength": 300,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Page title. Defaults to the first heading.",
                "title": "Title"
              }
            },
            "required": ["content"],
            "title": "score_textArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "Criterion": {
                "properties": {
                  "id": {
                    "title": "Id",
                    "type": "string"
                  },
                  "name": {
                    "title": "Name",
                    "type": "string"
                  },
                  "score": {
                    "description": "0 to 100, higher is better.",
                    "title": "Score",
                    "type": "number"
                  }
                },
                "required": ["id", "name", "score"],
                "title": "Criterion",
                "type": "object"
              },
              "Fix": {
                "properties": {
                  "fix": {
                    "title": "Fix",
                    "type": "string"
                  },
                  "location": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ],
                    "default": null,
                    "title": "Location"
                  },
                  "priority": {
                    "description": "high, medium or low.",
                    "title": "Priority",
                    "type": "string"
                  },
                  "problem": {
                    "title": "Problem",
                    "type": "string"
                  }
                },
                "required": ["fix", "priority", "problem"],
                "title": "Fix",
                "type": "object"
              },
              "RemainingQuota": {
                "properties": {
                  "day": {
                    "title": "Day",
                    "type": "integer"
                  },
                  "hour": {
                    "title": "Hour",
                    "type": "integer"
                  },
                  "minute": {
                    "title": "Minute",
                    "type": "integer"
                  }
                },
                "required": ["day", "hour", "minute"],
                "title": "RemainingQuota",
                "type": "object"
              }
            },
            "properties": {
              "criteria": {
                "description": "Score of each criterion, 0 to 100, in this order: semantic richness, AI citability, freshness, content organization, authority and citations, and naturalness, which does not count in the score. The overall score is computed from sub-signals of the first five, with caps for very short content, so it is not their plain average.",
                "items": {
                  "$ref": "#/$defs/Criterion"
                },
                "title": "Criteria",
                "type": "array"
              },
              "details_url": {
                "description": "Citead page that shows this analysis again, without publishing it to the public leaderboard. Give it to the user.",
                "title": "Details Url",
                "type": "string"
              },
              "geo_score": {
                "description": "Overall GEO score, 0 to 100.",
                "title": "Geo Score",
                "type": "number"
              },
              "remaining_quota": {
                "$ref": "#/$defs/RemainingQuota",
                "description": "Free scores left for this IP address in the current windows."
              },
              "score_meaning": {
                "title": "Score Meaning",
                "type": "string"
              },
              "title": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Title"
              },
              "top_fixes": {
                "description": "Main corrections, most important first.",
                "items": {
                  "$ref": "#/$defs/Fix"
                },
                "title": "Top Fixes",
                "type": "array"
              },
              "url": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Url"
              },
              "word_count": {
                "title": "Word Count",
                "type": "integer"
              }
            },
            "required": ["criteria", "details_url", "geo_score", "remaining_quota", "score_meaning", "top_fixes", "word_count"],
            "title": "GeoScoreResult",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "GEO score of a text"
          },
