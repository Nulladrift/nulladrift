{
  "lockfileVersion": 2,
  "subjects": {
    "com.iberiapath/dnv-spain": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://iberiapath.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "iberiapath",
        "title": "Iberia Path: Digital Nomad Visa Spain",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Инструменты для проверки проходимости на визу цифрового кочевника Испании и поиска присяжных переводчиков. Данные: iberiapath.com",
      "tools": [
        {
          "name": "check_dnv_eligibility",
          "description": "Проверяет проходимость кейса на визу цифрового кочевника (Digital Nomad Visa) в Испании по официальным правилам UGE: порог дохода с учётом семьи, стаж отношений с работодателем, маршрут подачи. Возвращает вердикт, требуемый порог и рекомендации.",
          "inputSchema": {
            "properties": {
              "children": {
                "default": 0,
                "description": "Сколько детей едет",
                "type": "integer"
              },
              "employment": {
                "description": "Тип занятости: contractor = ИП/фрилансер с заказчиками, employee = наёмный сотрудник, company = владелец компании",
                "enum": ["contractor", "employee", "company"],
                "type": "string"
              },
              "income_monthly_eur": {
                "description": "Ежемесячный доход в евро",
                "type": "number"
              },
              "location": {
                "description": "Где заявитель находится сейчас",
                "enum": ["spain", "russia", "other"],
                "type": "string"
              },
              "partner": {
                "description": "Едет ли супруг/партнёр",
                "type": "boolean"
              },
              "tenure_months": {
                "description": "Сколько месяцев длятся отношения с текущим работодателем или основным заказчиком",
                "type": "number"
              }
            },
            "required": ["employment", "income_monthly_eur", "location", "tenure_months"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f34f5bb41c77d7c55a4fee5cb5790765675f167955dcd81fa126cd5be66fcd4"
        },
        {
          "name": "estimate_spain_taxes",
          "description": "Оценивает налоги в Испании за 2026 год: IRPF по общему режиму (государственная и региональная шкалы всех 17 автономий плюс Страна Басков и Наварра, личные и семейные минимумы, региональные вычеты), режим Бекхэма (24%), вариант нерезидента IRNR и взносы (Seguridad Social или RETA для autónomo). Возвращает налог, взносы, чистый доход в год и в месяц, рекомендуемый режим и полный разбор.",
          "inputSchema": {
            "properties": {
              "arrival_year": {
                "description": "Год переезда в Испанию (для проверки режима Бекхэма); не указывать, если живёт давно",
                "type": "integer"
              },
              "autonomo_expenses_eur_year": {
                "default": 0,
                "description": "Расходы деятельности autónomo за год",
                "type": "number"
              },
              "autonomo_first_two_years": {
                "default": false,
                "description": "Первые два года деятельности autónomo (скидка 20%)",
                "type": "boolean"
              },
              "children_ages": {
                "default": [],
                "description": "Возраст каждого ребёнка на иждивении",
                "items": {
                  "type": "integer"
                },
                "type": "array"
              },
              "employment": {
                "description": "employee_foreign = наёмный с работодателем за пределами Испании (без испанских взносов), employee_spain = наёмный с испанским работодателем, autonomo = самозанятый",
                "enum": ["employee_foreign", "employee_spain", "autonomo"],
                "type": "string"
              },
              "gross_income_eur_year": {
                "description": "Доход брутто за год в евро (для autónomo: ingresos)",
                "type": "number"
              },
              "joint_declaration": {
                "default": false,
                "description": "Совместная декларация",
                "type": "boolean"
              },
              "partner": {
                "default": false,
                "description": "Есть супруг или партнёр",
                "type": "boolean"
              },
              "partner_income_eur_year": {
                "default": 0,
                "description": "Доход партнёра за год",
                "type": "number"
              },
              "region": {
                "description": "Регион проживания",
                "enum": ["madrid", "cataluna", "valencia", "andalucia", "galicia", "castilla_y_leon", "castilla_la_mancha", "extremadura", "murcia", "aragon", "asturias", "cantabria", "la_rioja", "baleares", "canarias", "ceuta", "melilla", "bizkaia", "gipuzkoa", "alava", "navarra"],
                "type": "string"
              },
              "rent_paid_eur_year": {
                "default": 0,
                "description": "Аренда жилья за год (для региональных вычетов)",
                "type": "number"
              }
            },
            "required": ["employment", "gross_income_eur_year", "region"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a8723954c0fea4238936af5f8ee161a383ba894bf85ab2325cd24c9a02edf07d"
        },
        {
          "name": "find_sworn_translators",
          "description": "Ищет присяжных переводчиков (traductores jurados) из официального реестра МИД Испании по языку и провинции. Только такие переводы принимаются UGE и консульствами.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Язык документа по-русски (например: Русский, Украинский, Английский) или по-испански заглавными (RUSO, INGLES)",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Сколько вернуть (максимум 20)",
                "type": "integer"
              },
              "province": {
                "description": "Провинция Испании (необязательно), например MADRID или BARCELONA",
                "type": "string"
              }
            },
            "required": ["language"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:328be86daf4461deccfd8a983b9e9c585bf1970bb616ad068e220679d9c8316e"
        },
        {
          "name": "get_dnv_facts",
          "description": "Возвращает актуальные требования визы цифрового кочевника Испании: пороги дохода, сроки, маршруты подачи, правила апостиля.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4515349b3b0dd6b635cf2eeceff515fc8f4cda2b9f4c0719cc4c7c12d39633ad"
        }
      ],
      "digest": "sha256:05b26c28297dfbe625a5e1c0112b9377abef6a243a397ffdfa5faa6698935b41"
    }
  }
