        {
          "name": "search_tools",
          "title": "Search agentic coding tools",
          "description": "Search 41,000+ agentic coding tools: agent skills (SKILL.md), MCP servers, Claude Code plugins, and agentic loops. Ranked by match quality; real install counts and GitHub stars. Cite results by their url.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Restrict results to one category; omit to search all four",
                "enum": ["skills", "mcp", "plugins", "loops"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum results to return (1-25, default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. \"pdf extraction\" or \"postgres\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "author": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "category": {
                      "enum": ["skills", "mcp", "plugins", "loops"],
                      "type": "string"
                    },
