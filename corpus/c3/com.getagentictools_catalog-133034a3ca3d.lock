        {
          "name": "get_tool",
          "title": "Get tool detail",
          "description": "Full detail for one tool by category and id (as returned by search_tools). Includes description, install command, repo, license, and — for skills — capabilities and prerequisites extracted from the SKILL.md itself.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "The tool's category, e.g. \"skills\"",
                "enum": ["skills", "mcp", "plugins", "loops"],
                "type": "string"
              },
              "id": {
                "description": "The tool id, e.g. \"mattpocock-skills-tdd\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["category", "id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
