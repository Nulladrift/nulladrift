                  "type": "number"
                },
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "topOnePctShare": {
                "description": "Percent of all stars held by the top 1% of starred tools",
                "type": "number"
              },
              "total": {
                "type": "number"
              },
              "totalStars": {
                "type": "number"
              },
              "unlicensed": {
                "type": "number"
