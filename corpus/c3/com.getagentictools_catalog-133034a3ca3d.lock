        {
          "name": "whats_new",
          "title": "Recently updated tools",
          "description": "Recently updated tools, ranked by their real upstream push date (never by our re-crawl date). Coverage note: not every source exposes push dates yet.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Restrict to one category; omit for all four",
                "enum": ["skills", "mcp", "plugins", "loops"],
                "type": "string"
              },
              "days": {
                "default": 7,
                "description": "Look-back window in days (1-90, default 7)",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "limit": {
                "default": 15,
                "description": "Maximum results to return (1-50, default 15)",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "coverage": {
                "description": "Honest note about entries without harvested push dates",
                "type": "string"
              },
              "days": {
                "type": "number"
              },
              "results": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "author": {
                      "anyOf": [
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "category": {
                      "enum": ["skills", "mcp", "plugins", "loops"],
                      "type": "string"
                    },
                    "downloads": {
                      "type": "number"
                    },
                    "id": {
                      "type": "string"
                    },
                    "install": {
                      "type": "string"
                    },
                    "lastUpdated": {
                      "type": "string"
                    },
                    "stars": {
                      "type": "number"
                    },
                    "tagline": {
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["author", "category", "downloads", "id", "stars", "tagline", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Tools with an upstream push inside the window",
                "type": "number"
              }
            },
            "required": ["coverage", "days", "results", "total"],
            "type": "object"
          },
