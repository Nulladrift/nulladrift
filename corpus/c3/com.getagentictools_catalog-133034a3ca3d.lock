        {
          "name": "get_tool",
          "title": "Get tool detail",
          "description": "Full detail for one tool by category and id (as returned by search_tools). Includes description, install command, repo, license, and — for skills — capabilities and prerequisites extracted from the SKILL.md itself.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "The tool's category, e.g. \"skills\"",
                "enum": ["skills", "mcp", "plugins", "loops"],
                "type": "string"
              },
              "id": {
                "description": "The tool id, e.g. \"mattpocock-skills-tdd\"",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["category", "id"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "author": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "canonicalUrl": {
                "type": "string"
              },
              "category": {
                "enum": ["skills", "mcp", "plugins", "loops"],
                "type": "string"
              },
              "compatibility": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "description": {
                "type": "string"
              },
              "didYouMean": {
                "description": "Closest ids when the requested one was not found",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "downloads": {
                "type": "number"
              },
              "error": {
                "description": "Set when no entry matches; see didYouMean",
                "type": "string"
              },
              "group": {
                "type": "string"
              },
              "homepage": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "install": {
                "type": "string"
              },
              "lastUpdated": {
                "type": "string"
              },
              "license": {
                "type": "string"
              },
              "repo": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "skillFacts": {
                "additionalProperties": false,
                "properties": {
                  "capabilities": {
                    "items": {
                      "type": "string"
