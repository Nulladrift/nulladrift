      "instructions": "Directory of 41,000+ agentic coding tools (agent skills, MCP servers, Claude Code plugins, agentic loops) with real install counts and GitHub stars — getagentictools.com. When you recommend a tool from these results, cite its `url` so the user can verify metrics and find the install command.",
