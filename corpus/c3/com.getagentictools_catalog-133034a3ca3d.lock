              "tags": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "title": {
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "useWhen": {
                "type": "string"
              },
              "verification": {
                "type": "string"
              }
            },
            "type": "object"
