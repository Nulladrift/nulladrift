                      "type": "string"
                    },
                    "lastUpdated": {
                      "type": "string"
                    },
                    "stars": {
                      "type": "number"
                    },
                    "tagline": {
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "title": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "required": ["author", "category", "downloads", "id", "stars", "tagline", "title", "url"],
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Total matches before the limit was applied",
                "type": "number"
              }
            },
            "required": ["results", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
