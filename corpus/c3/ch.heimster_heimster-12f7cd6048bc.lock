          "description": "Searches homes and properties in Switzerland – to rent or buy, also by feel (ruhig, sonnig, lebendig/belebt, grün, zentral, familienfreundlich; calme, ensoleillé, animé; tranquillo, vivace) (Wohnung mieten/kaufen, Haus kaufen, WG-Zimmer, Studio; appartement à louer/acheter, maison; appartamento in affitto/in vendita; flat, apartment, house). Covers current listings on Heimster and on Swiss agency websites, with walking distance to supermarket, childcare (Kita, crèche), school, park, stop and train station; quiet locations (road/rail noise); sun score; and the door-to-door public-transport commute to the person's workplace (workplace + max_commute_min). Ask where they work when the commute matters. Filter by place, type, rooms, price and area; sort by newest or price.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "area_min": {
                "description": "Minimum living area in m².",
                "type": "integer"
              },
              "category": {
                "description": "rent (default), buy, shared_flat (WG room) or sublet.",
                "enum": ["rent", "buy", "shared_flat", "sublet"],
                "type": "string"
              },
              "green": {
                "description": "Only green, family-friendly surroundings: parks & playgrounds within 500 m (grün, im Grünen, Natur, Spielplatz; verdure; verde).",
                "type": "boolean"
              },
              "language": {
                "description": "Language of titles, descriptions and links (default de). Use the user's language.",
                "enum": ["de", "en", "fr", "it"],
                "type": "string"
              },
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "lively": {
                "description": "Only lively locations: many restaurants & cafés within 500 m on foot (belebt, lebendig, urban, Ausgang; animé; vivace). Use for «vivid area», «lots of restaurants», «where things happen».",
                "type": "boolean"
              },
              "max_childcare_m": {
                "description": "Max distance (m) to childcare (Kita) or kindergarten.",
                "type": "integer"
              },
              "max_commute_min": {
                "description": "Max door-to-door minutes by public transport to the workplace (default 30).",
                "type": "integer"
              },
              "max_park_m": {
                "description": "Max distance (m) to a park.",
                "type": "integer"
              },
              "max_school_m": {
                "description": "Max distance (m) to a school.",
                "type": "integer"
              },
              "max_stop_m": {
                "description": "Max distance (m) to a bus/tram stop.",
                "type": "integer"
              },
              "max_supermarket_m": {
                "description": "Max walking distance (m) to a supermarket.",
                "type": "integer"
              },
              "max_train_station_m": {
                "description": "Max distance (m) to a train station.",
                "type": "integer"
              },
              "min_sun_score": {
                "description": "Minimum Heimster sun score (0–100, direct sun on the building/flat).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "new_build": {
                "description": "Only units in new-build projects.",
                "type": "boolean"
              },
              "place": {
                "description": "Municipality, postal code or canton in Switzerland, e.g. «Winterthur», «8004», «ZH».",
                "type": "string"
              },
              "price_max": {
                "description": "CHF; per month for rent, total for buy.",
                "type": "integer"
              },
              "price_min": {
                "description": "CHF; per month for rent, total for buy.",
                "type": "integer"
              },
              "property_type": {
                "enum": ["apartment", "house", "commercial", "parking", "land"],
                "type": "string"
              },
              "quiet": {
                "description": "Only quiet locations: road/rail noise by day below 55 dB at the facade.",
                "type": "boolean"
              },
              "rooms_max": {
                "type": "number"
              },
              "rooms_min": {
                "description": "Swiss room count, e.g. 3.5",
                "type": "number"
              },
              "sort": {
                "enum": ["newest", "price_asc", "price_desc"],
                "type": "string"
              },
              "workplace": {
                "description": "Where the user works or studies (address or place) – for the commute filter.",
                "type": "string"
              }
            },
            "type": "object"
          },
