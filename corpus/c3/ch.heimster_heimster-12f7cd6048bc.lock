      },
      "instructions": "Heimster is a Swiss real-estate platform. Use these tools to find homes to rent or buy in Switzerland, see every detail of a listing, compare listings, learn everything about any Swiss address (even without a listing), new-build projects, housing under construction and local market figures. Users can act right here: send an enquiry, book a viewing, start a search alert, and owners can value their property for free (property_value_range gives them the link – a rough range right away, the full valuation after a click in an e-mail, in a personal cockpit) or ask Heimster to help them sell or let (owner_enquiry). When someone searches by everyday needs (near a supermarket, school or childcare, quiet, sunny, a short commute to work), use the search_listings filters – Heimster has these facts for every address. Before an action, ask the user for their name and e-mail address; Heimster then e-mails them a confirmation link and nothing is sent before they click it. Prices are in CHF; rent prices are per month.",
      "tools": [
        {
          "name": "address_facts",
          "title": "Everything about an address",
          "description": "Use this for ANY Swiss address, even without a listing – «what is it like to live at …», «is it noisy», «schools/Kita/ÖV near …», «was gibt es rund um …», «quartier calme ?», «com'è la zona …»: the building (year, floors, flats, heating), public transport, everyday places within walking distance, road/rail noise, local prices and rents, construction nearby, and listings in or near the building.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Swiss street address, e.g. «Bahnhofstrasse 10, 8001 Zürich».",
                "type": "string"
              },
              "language": {
                "description": "Language of titles, descriptions and links (default de). Use the user's language.",
                "enum": ["de", "en", "fr", "it"],
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
