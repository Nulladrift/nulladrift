{
  "lockfileVersion": 2,
  "subjects": {
    "com.curbslot/curbslot-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://curbslot.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "curbslot-mcp",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Use check_geo_clustered_slots to verify 18-minute geo-clustered availability for a mobile detailer, check_vehicle_tier_pricing to run the 201-model US/AU SUV/truck auto-pricing, get_neighbor_fill_candidates to inspect afternoon gap-fill candidates, and create_quick_demo_shop to provision a live branded sandbox preview.",
      "tools": [
        {
          "name": "check_geo_clustered_slots",
          "title": "Check Geo-Clustered Slots",
          "description": "Check real-time 18-minute route-locked geo-clustered booking availability and exact SUV/truck-adjusted pricing for any CurbSlot mobile auto detailer. Blocks cross-town hauls and suggests nearby or next open dates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Customer driveway address or neighborhood name (e.g. \"Arcadia, Phoenix, AZ\" or \"Queen Creek, AZ\").",
                "type": "string"
              },
              "date_local": {
                "description": "Target local date in YYYY-MM-DD format (defaults to tomorrow if omitted).",
                "type": "string"
              },
              "lat": {
                "description": "Optional latitude coordinate for exact driveway routing.",
                "type": "number"
              },
              "lng": {
                "description": "Optional longitude coordinate for exact driveway routing.",
                "type": "number"
              },
              "service_id": {
                "description": "Optional service ID from the shop menu (defaults to the shop flagship full detail).",
                "type": "string"
              },
              "shop_slug": {
                "description": "CurbSlot shop slug (e.g. \"apex-scottsdale\", \"biscayne-gloss\", \"harbour-shine\", or any slug created via create_quick_demo_shop).",
                "type": "string"
              },
              "vehicle_model": {
                "description": "Optional vehicle year/make/model (e.g. \"2024 Ford F-150\", \"Chevy Suburban\") for automatic 4-tier sizing & labor pricing.",
                "type": "string"
              }
            },
            "required": ["date_local", "shop_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Geo-Clustered Slots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f3bdb757c67f4e6d7647fc735366306b9aab303c96ba64314f183da245b42d76"
        },
        {
          "name": "check_vehicle_tier_pricing",
          "title": "Check Vehicle Tier Pricing",
          "description": "Run CurbSlot's 201-model US & Australian SUV/truck auto-pricing to return the exact detailing tier (1-4), default price delta, duration delta, and whether an under-selected tier (e.g. Sedan for an F-150 or Suburban) is auto-upgraded.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "selected_tier": {
                "description": "Optional customer-selected tier (1=Coupe/Sedan, 2=2-Row SUV/Small Truck, 3=3-Row SUV/Half-Ton Truck, 4=XL SUV/HD Truck/Van). Defaults to 1.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "vehicle_model": {
                "description": "Free-text vehicle description (e.g. \"2024 Ford F-150\", \"Chevy Suburban\", \"2024 Toyota HiLux\", \"Honda Civic\").",
                "type": "string"
              }
            },
            "required": ["vehicle_model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check Vehicle Tier Pricing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:35c5a6830065a22bc50c8bfeddf7f33544c39981b5cf66c62e2065450b3b1c84"
        },
        {
          "name": "create_quick_demo_shop",
          "title": "Create Quick Demo Shop",
          "description": "Spin up a live, branded CurbSlot sandbox preview (https://curbslot.com/demo/<slug>) seeded with services, a 9:00 AM anchor job, and nearby past clients in 1 call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Metro city (e.g. \"Scottsdale\", \"Phoenix\", \"Miami\", \"Tampa\", \"Austin\", \"Dallas\", \"Houston\", \"San Diego\", \"Los Angeles\", \"Sydney\", \"Melbourne\", \"Brisbane\").",
                "type": "string"
              },
              "deposit_dollars": {
                "description": "Upfront no-show protection deposit in dollars (default: 50).",
                "maximum": 250,
                "minimum": 0,
                "type": "number"
              },
              "max_cluster_mins": {
                "description": "Maximum inter-job drive time in minutes (default: 18).",
                "maximum": 45,
                "minimum": 8,
                "type": "number"
              },
              "name": {
                "description": "Mobile detailing business name (e.g. \"Sunbelt Ceramic Mobile Detailing\").",
                "type": "string"
              }
            },
            "required": ["city", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create Quick Demo Shop"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4c572aedbfdb37ee7e1d58321946c06742bc4b001b494e6e4d0546d2fea4ca3a"
        },
        {
          "name": "get_neighbor_fill_candidates",
          "title": "Get Neighbor Route-Fill Candidates",
          "description": "Inspect a detailer's clustered route for today and retrieve nearby past clients within the shop's drive-time cluster to fill an afternoon gap with 1-tap Neighbor Route-Fill SMS links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "shop_slug": {
                "description": "CurbSlot shop slug (e.g. \"apex-scottsdale\", \"biscayne-gloss\", \"harbour-shine\").",
                "type": "string"
              }
            },
            "required": ["shop_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Neighbor Route-Fill Candidates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff6e78aec08a3267ae4118837237dcb4c9809c70b6c3bc842601533cf7acaefa"
        }
      ],
      "digest": "sha256:b3446cb29865b08b339562572f302f5210fa4aefcfd68ed788a9facd79fc0382"
    }
  }
}
