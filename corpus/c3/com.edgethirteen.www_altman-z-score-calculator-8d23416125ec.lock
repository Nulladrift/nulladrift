          "name": "compute_altman_z_score",
          "description": "Compute the Altman Z-Score (public-company, non-financial-services version) for a US-listed ticker -- a quick bankruptcy-risk / financial-distress screen from five balance-sheet ratios. Looks up working capital, total assets, retained earnings, EBIT, market cap, total liabilities, and revenue from SEC EDGAR + market data automatically -- just pass a ticker. Returns the score and which zone it falls in: safe (>2.99), grey (1.81-2.99), or distress (<1.81).",
          "inputSchema": {
            "properties": {
              "ticker": {
                "description": "A US-listed ticker symbol, e.g. GE",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
