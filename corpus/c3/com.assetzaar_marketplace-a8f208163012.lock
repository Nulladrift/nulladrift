{
  "lockfileVersion": 2,
  "subjects": {
    "com.assetzaar/marketplace": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://assetzaar.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "assetzaar",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "check_purchase",
          "description": "Check whether a purchase started with the `purchase` tool has been approved and paid. Returns status: pending | paid | expired. Once paid, the entitlement is granted and install returns the source or signed download URL.",
          "inputSchema": {
            "properties": {
              "purchase_id": {
                "description": "The purchase_id returned by the purchase tool.",
                "type": "string"
              }
            },
            "required": ["purchase_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29f8f9f501458fedfada33ec3417d0bd1b32697e10c15646caaa3840686d2938"
        },
        {
          "name": "get_component",
          "description": "Get a component by slug. Free components return installable source. With an agent key (Authorization: Bearer azr_…), paid components the account owns and Pro components covered by an active membership return source too. Otherwise returns how to buy (see the `purchase` tool).",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The component slug",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:29ee7aec01736aaa391b119f7cf5840bf566837cc28e71eb8c945093396e24aa"
        },
        {
          "name": "inspect",
          "description": "Get the full machine-readable manifest for one product by slug — type, version, author (verified?), license, price, dependencies, security-scan status, compatibility and install command — so you can evaluate it before installing.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The product slug.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a96f88ca49d906bbc69e0a10f3aeb3d070ce69c7c1485db3c8520d532fb47554"
        },
        {
          "name": "install",
          "description": "Install any agent-installable Assetzaar product by slug. Free products return source or a short-lived signed download URL. Paid products require an agent key plus ownership; Pro products require an agent key plus active membership. For paid products, call purchase/check_purchase first.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The product slug to install.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:659e73652f657979fab12c7aa2e4649033e59de66a4a9d81d28d8d517a3a1331"
        },
        {
          "name": "purchase",
          "description": "Start a purchase of a paid Assetzaar product for the connected account. Requires an agent key (Authorization: Bearer azr_…, created at assetzaar.com/account/agent-keys). Returns a Stripe approval URL — the HUMAN must open it and approve payment; the agent can never charge anyone by itself. After approval, call check_purchase, then install.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The product slug to buy.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2a57c67967fd2bc485eef40b8e80433e6c3b7fd7064a3a5df84facf520a27c9f"
        },
        {
          "name": "search",
          "description": "Search the whole Assetzaar marketplace (agent skills, UI components, production modules, SaaS kits, automations and services). Returns machine-readable manifests with type, price, security-scan status, compatibility and install command. Use this to find a product to build with.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results (1-25, default 10).",
                "type": "number"
              },
              "query": {
                "description": "What to search for (name, summary, technology).",
                "type": "string"
              },
              "type": {
                "description": "Optional filter: components | agent-skill | saas-kit | landing | automation | service.",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fdcdf4f14f010ca17310cea7339a85fef33b89cbb4aa6e2693130a478899acab"
        },
        {
          "name": "search_components",
          "description": "Search Assetzaar's marketplace for UI components by name, category or technology. Returns matches with slugs and install commands.",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "What to search for",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4e8ad1317f494beff9cdf68a1b924c90d810032cbd1b614b72244e437dfb3118"
        }
      ],
      "digest": "sha256:c0d52d31949bf78683be4f39af7a8138fd43d342be40557db28422a317c4bb91"
    }
  }
}
