                  "basis": {
                    "type": "string"
                  },
                  "delta_vs_runner_up_yr": {
                    "type": ["number", "null"]
                  },
                  "est_annual_fee_usd": {
                    "items": {
                      "type": ["number", "null"]
                    },
                    "maxItems": 3,
                    "minItems": 3,
                    "type": "array"
                  },
