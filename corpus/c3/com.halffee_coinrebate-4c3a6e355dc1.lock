                  }
                },
                "required": ["country", "mode"],
                "type": "object"
              },
              "confidence": {
                "enum": ["high", "medium", "low"],
                "type": "string"
              },
              "data_basis": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "as_of": {
                      "type": "string"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "source": {
                      "enum": ["live", "partial", "fallback"],
                      "type": "string"
                    }
