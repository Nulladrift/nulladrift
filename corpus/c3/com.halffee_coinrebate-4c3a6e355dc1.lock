      "serverInfo": {
        "name": "coinrebate",
        "version": "2.5.2",
        "description": "Crypto exchange fee optimization and rebate data. Supports compliance filtering by country."
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "CoinRebate is a read-only reference for crypto exchange trading fees, referral discounts, which exchanges are available in a country, and CoinRebate's published articles. It gives no investment advice and cannot place orders, sign in to exchange accounts or move funds. When a user asks for any of those, do not call CoinRebate tools; tell them those actions happen on the exchange itself. Referral benefits apply only to new accounts registered through CoinRebate links or referral codes, under each exchange's rules.",
      "tools": [
        {
          "name": "calculate_trading_cost",
          "description": "Do not call this tool for investment advice (what or how much to buy), placing orders, signing in to exchange accounts or moving funds; CoinRebate cannot do those, so answer such requests without calling it. Estimate the taker-fee cost of a trading volume on one exchange, with and without the CoinRebate referral discount, using the benchmark taker fee from CoinRebate's published fee table. Returns the fee on that volume, the difference, a yearly figure that assumes the volume is monthly, and the date of the fee-table entry used. Use it only for questions about exchange trading fees and fee discounts.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "ISO 3166-1 alpha-2 country code for compliance filtering",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "exchange": {
                "description": "Exchange name (binance, okx, bybit, bitget, gate, hyperliquid)",
                "type": "string"
              },
              "type": {
                "description": "Trade type: spot or futures",
                "enum": ["spot", "futures"],
                "type": "string"
              },
              "volume": {
                "description": "Trade volume in USD",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["exchange", "type", "volume"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "result": {
                "anyOf": [
                  {
                    "additionalProperties": false,
                    "properties": {
                      "cost_after_rebate_usd": {
                        "type": "number"
                      },
                      "exchange": {
                        "type": "string"
                      },
                      "exchange_name": {
                        "type": "string"
                      },
                      "fee_discount": {
                        "type": "string"
                      },
                      "fee_table_updated": {
                        "type": ["string", "null"]
                      },
                      "referral_code": {
                        "type": "string"
                      },
                      "savings_usd": {
                        "type": "number"
                      },
                      "signup_url": {
                        "type": "string"
                      },
                      "standard_cost_usd": {
                        "type": "number"
                      },
                      "standard_taker_fee": {
                        "type": "number"
                      },
                      "taker_fee_after_rebate": {
                        "type": "number"
                      },
                      "type": {
                        "enum": ["spot", "futures"],
                        "type": "string"
                      },
                      "volume_usd": {
                        "type": "number"
                      }
                    },
                    "required": ["cost_after_rebate_usd", "exchange", "exchange_name", "fee_discount", "fee_table_updated", "referral_code", "savings_usd", "signup_url", "standard_cost_usd", "standard_taker_fee", "taker_fee_after_rebate", "type", "volume_usd"],
                    "type": "object"
                  },
                  {
                    "type": "null"
                  }
                ]
              }
            },
            "required": ["result"],
            "type": "object"
          },
