          "description": "List which documents exist for one Fortitude21 product and how to request them.\nUse when: the user asks for a certificate, test report, mill certificate, food-contact declaration, specification sheet or drawing. Instead: check_product_requirements for the scope of a UN status and what a quotation needs; get_product_details for specifications.\nInputs: sku is read as in get_product_details; the part number of one size returns the documents for its whole product.\nBehaviour: it requests nothing itself; following request_url is the buyer's step. hosted is usually empty, because documents are issued against a specific design and production run. Each document says when it applies: a UN certificate only where the design carries one, a mill certificate for a stainless grade, a food-contact declaration where the product is specified for food or drinking water. An unknown sku returns ok:false with example ids.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
