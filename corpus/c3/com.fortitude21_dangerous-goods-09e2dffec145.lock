          "description": "Get the published commercial terms for one Fortitude21 product: pricing type, currency, minimum order, quantity bands with any approved indicative unit price, validity, Incoterms and lead time.\nUse when: the user asks about price, minimum order or lead time for a known product. Instead: create_quote_request for an actual quotation; search_products with pricing_type to find products by pricing model.\nInputs: sku is read as in get_product_details. Without quantity it returns every band. With quantity it also returns the band that covers it; below the minimum order no unit price is given and assumed says so; a quantity in the top band returns a quotation band rather than a price. A quantity under 1 returns ok:false.\nBehaviour: any price is indicative, never a quotation: binding is always false, and prices exclude freight, duty and taxes. Products priced on request return no number. An unknown sku returns ok:false with example ids.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
