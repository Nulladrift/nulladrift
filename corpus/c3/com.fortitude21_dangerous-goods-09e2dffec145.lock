      "instructions": "Fortitude21 publishes two tool sets here. Six free dangerous goods packaging tools: UN number to permitted containers, UN mark decoding, IBC inspection dates, the ADR 1,000-point small-load test, bund sizing and jerry can quantities. And eight catalogue tools over Fortitude21's own range of jerry cans, pails, tins, drums, spill pallets, closures and handling equipment: search, details, compare, pricing, categories, documents, a requirements check and a quotation request. Results carry `cite` (credit and link) and `publisher`. Any price is indicative and never a quotation, and create_quote_request sends an enquiry for a person to price rather than placing an order.",
      "tools": [
        {
          "name": "adr_1000_points",
          "title": "ADR 1.1.3.6 small-load points",
          "description": "Total the ADR 1.1.3.6 points for a road load of dangerous goods and say whether it stays within the small-load exemption, and what still applies if it does.\nUse when: the user asks whether a vehicle load needs full ADR. Instead: un_number_packaging for container rules; bund_size for storage.\nInputs: one line per substance and package size, so the same UN number in two package sizes is two lines. packing_group matters only where a UN number has entries in more than one transport category, such as UN 1263 paint; without it those lines are refused with the entries to choose from. Points are quantity_per_package times packages times the category multiplier: 50 for category 1, 3 for category 2, 1 for category 3 and 0 for category 4. A category 0 substance needs full ADR at any quantity.\nBehaviour: covers 92 UN numbers. If any line cannot be read, the whole load is refused with a reason per line and never totalled without it. An exempt load still carries duties, listed in still_required. Unknown arguments are ignored and named in assumed.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
          "inputSchema": {
            "properties": {
              "lines": {
                "description": "One item per substance carried",
                "items": {
                  "properties": {
                    "packages": {
                      "default": 1,
                      "description": "Number of packages of this size",
                      "type": "integer"
                    },
                    "packing_group": {
                      "description": "Packing group from section 14 of the safety data sheet. Required where the UN number has entries in more than one transport category, such as 1263 paint; the refusal lists them",
                      "enum": ["I", "II", "III"],
                      "type": "string"
                    },
                    "quantity_per_package": {
                      "description": "Litres (liquids) or kg (solids) in each package, e.g. 20 for a 20 L jerrican",
                      "type": "number"
                    },
                    "un": {
                      "description": "UN number, e.g. \"1203\"",
                      "type": "string"
                    }
                  },
                  "required": ["quantity_per_package", "un"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["lines"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "assumed": {
                "description": "Each value the tool inferred or defaulted, in words, so it can be checked with the user",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cite": {
                "description": "Credit line with a link, for quoting the answer",
                "type": "string"
              },
              "docs": {
                "description": "Documentation for this tool",
                "type": "string"
              },
              "error": {
                "description": "When ok is false: what is missing or could not be read, and what to send instead",
                "type": "string"
              },
              "exempt": {
                "description": "true when the load stays within ADR 1.1.3.6"
              },
              "issues": {
                "description": "When ok is false: the reason for each unreadable line"
              },
              "limit": {
                "description": "The limit that applies"
              },
              "lines": {
                "description": "Each line with UN number, name, packing group, transport category, quantity, unit, multiplier and points"
              },
              "ok": {
                "description": "true with an answer. false when the tool needs one more input or cannot answer; error then says what to send",
                "type": "boolean"
              },
              "publisher": {
                "description": "Who publishes the tool, the Fortitude21 products that fit, with links, and quote_url, a link to ask for a quotation"
              },
              "room": {
                "description": "Points or quantity left before the limit"
              },
              "still_required": {
                "description": "What applies even when exempt"
              },
              "test": {
                "description": "Which test applies: points across categories, or the quantity limit of one category"
              },
              "tool": {
                "description": "Link to the same answer on the interactive tool page"
              },
              "transport_category": {
                "description": "The category that decides the limit"
              },
              "used": {
                "description": "Points or quantity used"
              },
              "verdict": {
                "description": "The answer in one sentence"
              }
            },
            "type": "object"
          },
