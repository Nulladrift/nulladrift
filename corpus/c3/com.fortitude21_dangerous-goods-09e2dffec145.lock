        {
          "name": "un_number_packaging",
          "title": "UN number to permitted UN packaging",
          "description": "Find which UN-approved packagings may carry a dangerous liquid under ADR 2025 Table A and its packing instructions.\nUse when: the user has a UN number from section 14 of a safety data sheet, or a substance name, and asks what it can travel in and how large. Instead: decode_un_packaging_mark to read a mark already on a container; adr_1000_points to test a vehicle load.\nInputs: send un or name. If both arrive, un wins and name is not read. name is a case-insensitive substring search over proper shipping names and common names and needs at least 3 characters, so a broad word such as \"acid\" returns up to 20 candidates to choose from. Where one candidate is the everyday meaning (petrol: UN 1203, paint: UN 1263), that entry is answered and the other matches are listed in assumed.\nBehaviour: covers 157 liquids for road transport under ADR; sea (IMDG Code) and air (IATA) rules can differ. An uncovered number returns ok:false with covered_un_numbers, and a name with no match returns ok:false asking for the number. A number with several Table A rows (packing groups or variants) returns each as its own entry, so choose by the packing group on the safety data sheet. Unknown arguments are ignored and named in assumed.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
          "inputSchema": {
            "properties": {
              "name": {
                "description": "Substance name, e.g. \"acetone\"",
                "type": "string"
              },
              "un": {
                "description": "Four digits, with or without a \"UN\" prefix, e.g. \"1203\" or \"UN 1203\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "assumed": {
                "description": "Each value the tool inferred or defaulted, in words, so it can be checked with the user",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "candidates": {
                "description": "When ok is false for a name with several matches: the UN numbers to choose from"
              },
              "cite": {
                "description": "Credit line with a link, for quoting the answer",
                "type": "string"
              },
              "covered_un_numbers": {
                "description": "When ok is false for an uncovered number: the 157 numbers covered"
              },
              "docs": {
                "description": "Documentation for this tool",
                "type": "string"
              },
              "entries": {
                "description": "One per ADR Table A entry: proper_shipping_name, class, packing_group, limited_quantity, packing_instructions, un_mark_level, containers (type, codes, allowed, largest_litres) and special_packing_provisions"
              },
              "error": {
