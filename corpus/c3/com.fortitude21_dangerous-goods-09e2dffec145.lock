        {
          "name": "check_product_requirements",
          "title": "Check what a Fortitude21 product needs cleared",
          "description": "Report what Fortitude21 publishes about one product's certification: the exact scope of any UN status, its cautions, the documents that exist and what a quotation still needs.\nUse when: about to quote or ship a specific product. Instead: un_number_packaging, adr_1000_points, bund_size or decode_un_packaging_mark for the regulations themselves; the response names them.\nInputs: only sku is required, read as in get_product_details. destination_market and intended_contents only shorten information_still_needed, since each one left out is listed there; neither is checked against any rule. To learn whether the contents are dangerous goods, call un_number_packaging with their UN number.\nBehaviour: it states what the publisher says, not what a market requires, and does not confirm that Fortitude21 holds a certificate: UN approval is granted per design type and plant. An unknown sku returns ok:false.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
          "inputSchema": {
            "properties": {
              "destination_market": {
                "description": "Country or market the goods are going to, e.g. \"Australia\"",
