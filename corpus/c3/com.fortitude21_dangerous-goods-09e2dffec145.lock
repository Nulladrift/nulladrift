        {
          "name": "decode_un_packaging_mark",
          "title": "Decode a UN packaging mark",
          "description": "Decode a UN packaging mark part by part: packaging code, performance level, density or gross mass, test pressure, year, state and maker, for packagings, IBCs, large packagings, salvage and reconditioned marks.\nUse when: the user has read a mark off a drum, jerrican, box or IBC. Instead: un_number_packaging to find which codes a substance may use; ibc_inspection_dates for an IBC's test dates.\nInputs: mark alone decodes. Adding un also checks, against ADR 2025 Table A, whether that container may carry that substance, using the density limit printed in the mark. A bare code such as 3H1 decodes to its meaning only. If the user has not read the mark, ask for it rather than describing the container.\nBehaviour: text it cannot read as a mark returns ok:false, and only the first 120 characters are read. If un is not one of the 157 covered numbers, the mark still decodes and check carries the error. Unknown arguments are ignored and named in assumed.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
          "inputSchema": {
            "properties": {
              "mark": {
                "description": "The mark as printed, parts separated by slashes, e.g. \"UN 3H1/Y1.9/150/26/D/BAM 12345\" or an IBC mark \"31HA1/Y/03 22/D/BAM 12345/10800/1200\"",
                "type": "string"
              },
              "un": {
                "description": "Optional UN number (four digits) to check the container against, e.g. \"1203\"",
                "type": "string"
              }
            },
            "required": ["mark"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "assumed": {
                "description": "Each value the tool inferred or defaulted, in words, so it can be checked with the user",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "check": {
                "description": "With un: whether the container may carry that substance, and why"
              },
