        {
          "name": "search_products",
          "title": "Search Fortitude21 products",
          "description": "Search the Fortitude21 catalogue of liquid containment: jerry cans, pails, tins, drums, spill pallets, closures and handling equipment in steel, stainless, aluminium, tinplate and UN-rated HDPE.\nUse when: finding products that fit a need. Then: get_product_details for one record, compare_products for two to six, get_product_pricing for terms, create_quote_request to ask for a price.\nInputs: q and every filter combine with AND, so each one narrows the result. q expands synonyms, such as bund for spill pallet, and words no product mentions are named in query.terms_no_product_mentions so they can be dropped. category also takes the exact category name. application matches words in the product's listed uses. certification=UN matches any product with a UN status that is not excluded; a design code must appear in that status. sort defaults to relevance with q and to name without.\nBehaviour: a product with no recorded value for a filtered attribute is left out rather than assumed to match, so an empty result means nothing meets every condition: drop a filter and search again. An unknown category, pricing_type or sort returns ok:false listing the valid values. Results are summaries; get_product_details has the full record.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
          "inputSchema": {
            "properties": {
              "application": {
                "description": "Intended use, e.g. \"defence\", \"agriculture\", \"marine\"",
                "type": "string"
              },
              "capacity_max": {
                "description": "Maximum capacity in litres",
                "type": "number"
              },
              "capacity_min": {
                "description": "Minimum capacity in litres, e.g. 20",
                "type": "number"
              },
              "category": {
                "description": "Category slug from get_product_categories, e.g. spill-containment",
                "type": "string"
              },
              "certification": {
                "description": "UN for any UN-rated design, or a design code such as 3H1 or 3A1",
                "type": "string"
              },
              "limit": {
                "description": "Results per page, 1 to 100. Default 20",
                "type": "integer"
              },
              "material": {
                "description": "hdpe, polypropylene, polyethylene, stainless, steel, galvanised, aluminium, tinplate, plastic or metal. Resolved to the material family, so hdpe does not return polypropylene",
                "type": "string"
              },
              "page": {
                "description": "Page number, from 1",
                "type": "integer"
              },
              "pricing_type": {
                "description": "Filter by pricing model. Most products are PRICE_ON_REQUEST",
                "enum": ["PUBLIC_PRICE", "STARTING_FROM", "PRICE_ON_REQUEST", "CONTRACT_PRICE"],
                "type": "string"
              },
              "q": {
                "description": "Free text, e.g. \"20 litre steel fuel can\" or \"spill pallet for 4 drums\". Leave out to list by filters alone",
                "type": "string"
              },
              "sort": {
                "description": "Order of results. relevance (default) needs q",
                "enum": ["relevance", "capacity", "capacity_desc", "price", "name"],
                "type": "string"
              }
