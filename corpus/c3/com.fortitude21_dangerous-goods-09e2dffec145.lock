        {
          "name": "ibc_inspection_dates",
          "title": "IBC test and inspection due dates",
          "description": "Work out when an IBC (intermediate bulk container) is due for its leakproofness test and its 2.5-year and 5-year inspections, the last month it may be filled and, for plastic and composite IBCs, the end of its five-year life.\nUse when: the user asks whether an IBC is in date or may still be filled. Instead: decode_un_packaging_mark to read the rest of an IBC mark; bund_size to size spill containment under IBCs.\nInputs: mark alone is enough, since the code and month of manufacture are read from it. Otherwise send made, plus code if known; without code a composite 31HA1 tote is assumed. leak and insp move the due dates on from the last test; without them every date counts from manufacture. bottle restarts the five-year life of a remanufactured composite. A full date is read only when its day cannot be mistaken for the month. regime=us has no five-year life.\nBehaviour: dates are judged against the current month, so the same IBC moves from ok to soon to overdue as time passes. Every default is listed in assumed; an unreadable date or code returns ok:false.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
          "inputSchema": {
            "properties": {
              "bottle": {
                "description": "Month the inner receptacle was replaced, for remanufactured composite IBCs",
                "type": "string"
              },
              "code": {
                "description": "IBC code when no mark is given, e.g. 31HA1 (composite), 31H1 (rigid plastic), 31A (steel)",
                "type": "string"
              },
              "insp": {
                "description": "Month of the last inspection, same formats. Usually the same month as leak",
                "type": "string"
              },
              "leak": {
                "description": "Month of the last leakproofness test, same formats",
                "type": "string"
              },
              "made": {
                "description": "Month of manufacture, e.g. \"03/2022\", \"2022-03\" or \"March 2022\"",
                "type": "string"
              },
              "mark": {
                "description": "The IBC UN mark from the plate; the code and month of manufacture are read from it, e.g. \"31HA1/Y/03 22/D/BAM 12345/10800/1200\"",
                "type": "string"
              },
              "regime": {
                "description": "un: UN Model Regulations and ADR (default). us: 49 CFR 180.352",
                "enum": ["un", "us"],
                "type": "string"
              },
              "repair": {
                "description": "Month of the last repair, if any",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "assumed": {
