        {
          "name": "bund_size",
          "title": "Bund and spill pallet sizing",
          "description": "Work out the minimum sump capacity for a bund or spill pallet under the containment rule where the containers are stored, and name the rule.\nUse when: sizing a spill pallet, bund or drip tray. Instead: ibc_inspection_dates for IBC tests; un_number_packaging for container approval.\nInputs: count only the containers stored together over one bund; size separate stores in separate calls. Give at least one count: drums, ibcs, small and other add up, and small and other each need their size. liquid and mode=tray can change which rule applies. With no region the rule for England is used; a country without its own rule gets the common 110% and 25% rule; both are noted in assumed.\nBehaviour: the rule comes labelled as law, code, guidance or practice, so say which when advising. A region it cannot read returns ok:false with the 16 region codes, and a count without its size returns ok:false naming the size. Unknown arguments are ignored and named in assumed.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
          "inputSchema": {
            "properties": {
              "drums": {
                "description": "Number of 205-litre drums",
                "type": "integer"
              },
              "ibcs": {
                "description": "Number of 1,000-litre IBCs",
                "type": "integer"
              },
              "liquid": {
                "description": "oil (fuel, diesel, petrol; the default), flam (flammable liquids), other (chemicals), or waste (US only)",
                "type": "string"
              },
              "mode": {
                "description": "bund (default) for a bund or spill pallet, tray for a drip tray",
                "enum": ["bund", "tray"],
                "type": "string"
              },
              "other": {
                "description": "Number of other containers; needs otherSize",
                "type": "integer"
              },
              "otherSize": {
                "description": "Litres in each other container, e.g. 500",
                "type": "number"
              },
              "region": {
                "description": "A region code (gb-eng, gb-wls, gb-sct, gb-nir, ie, de, fr, nl, es, us, ca, au, nz, sg, jp, world), a country name or a US state such as \"Texas\"",
                "type": "string"
              },
              "small": {
                "description": "Number of smaller containers; needs smallSize",
                "type": "integer"
              },
              "smallSize": {
                "description": "Litres in each smaller container, e.g. 25",
                "type": "number"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "assumed": {
                "description": "Each value the tool inferred or defaulted, in words, so it can be checked with the user",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "cite": {
                "description": "Credit line with a link, for quoting the answer",
                "type": "string"
              },
              "docs": {
                "description": "Documentation for this tool",
                "type": "string"
              },
              "error": {
                "description": "When ok is false: what is missing or could not be read, and what to send instead",
                "type": "string"
              },
              "governs": {
                "description": "largest or total: which test set the figure"
              },
              "in_scope": {
                "description": "Whether the rule applies to this store"
              },
              "liquid": {
                "description": "The liquid class applied"
              },
              "minimum_capacity_l": {
                "description": "The minimum sump capacity in litres"
              },
              "notes": {
                "description": "Exclusions and points to check"
              },
              "ok": {
                "description": "true with an answer. false when the tool needs one more input or cannot answer; error then says what to send",
                "type": "boolean"
              },
              "pallets_that_pass": {
                "description": "Fortitude21 spill pallets with a sump at least this large"
              },
              "publisher": {
                "description": "Who publishes the tool, the Fortitude21 products that fit, with links, and quote_url, a link to ask for a quotation"
