        {
          "name": "create_quote_request",
          "title": "Send a Fortitude21 quotation request",
          "description": "Send a quotation request for one or more Fortitude21 products to a person who prices it, and get a reference back.\nUse when: the buyer wants a quotation and has agreed to share their contact details. Instead: get_product_pricing for indicative terms without contacting anyone.\nInputs: consent must be true and means the buyer agreed, not the agent. A quantity under the minimum order is recorded, not refused. Without a destination (delivery_destination or country) or incoterms the request is still sent, and the gaps come back in missing_information. A required_date not written as YYYY-MM-DD refuses the request.\nBehaviour: writes and is not idempotent. Each call stores an enquiry and emails it to Fortitude21's sales team, who reply by email, usually within one working day, so two calls send two requests. It never creates an order or accepts a price. An unknown sku or missing consent refuses the whole request.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Buying company name",
                "type": "string"
              },
              "consent": {
                "description": "Must be true. Confirms the buyer agreed to their company and contact details being sent to Fortitude21",
                "type": "boolean"
              },
              "contact_name": {
                "description": "Person to reply to",
                "type": "string"
              },
              "country": {
                "description": "Buyer country",
                "type": "string"
              },
              "delivery_destination": {
                "description": "Port or city the goods ship to",
                "type": "string"
              },
              "email": {
                "description": "Business email address for the reply",
                "type": "string"
              },
              "incoterms": {
                "description": "Preferred Incoterm, e.g. FOB, CIF, DDP",
                "type": "string"
              },
              "lines": {
                "description": "One entry per product",
                "items": {
                  "properties": {
                    "certification": {
                      "description": "Certification the destination market requires",
                      "type": "string"
                    },
                    "quantity": {
                      "description": "Whole number of units required. Below the minimum order is recorded, not refused",
                      "type": "integer"
                    },
                    "sku": {
                      "description": "An F21 part number or product slug",
                      "type": "string"
                    },
                    "specification": {
                      "description": "Colour, branding, closure, gauge, anything specified",
                      "type": "string"
                    }
                  },
                  "required": ["quantity", "sku"],
                  "type": "object"
                },
                "type": "array"
              },
              "notes": {
                "description": "Anything else the quotation should account for",
                "type": "string"
              },
