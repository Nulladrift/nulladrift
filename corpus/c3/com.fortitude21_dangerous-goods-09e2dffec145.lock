          "description": "Compare two to six Fortitude21 products on the attributes they publish.\nUse when: the user is choosing between products already found with search_products. Instead: get_product_details for one product in full.\nInputs: each entry in skus may be a slug, a product part number or the part number of one size, mixed freely; a size stands for its whole product. Products come back in the order given.\nBehaviour: rows every product has a value for go in comparable; rows some products lack go in partial, naming them, so a blank is never read as a worse figure. It does not rank or recommend: which product suits depends on the contents, the destination market and the order. Fewer than two skus or more than six returns ok:false, and an unknown one returns ok:false with not_found.\nConstraints: no authentication, key or headers. At most 10 requests per 10 seconds per IP address; above that HTTP 429, so space out repeated calls.",
