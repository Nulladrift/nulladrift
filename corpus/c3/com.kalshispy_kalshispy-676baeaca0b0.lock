{
  "lockfileVersion": 2,
  "subjects": {
    "com.kalshispy/kalshispy": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://kalshispy.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "kalshispy",
        "version": "2.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "KalshiSpy: independent analytics on Kalshi's ID-verified, highest-profit traders — the markets they hold right now, and the settled markets they won. Use it when the user is deciding which Kalshi market to take. Tools available in this session: search_markets, search_settled_wins, get_settled_win, list_categories, get_stats. No API key was presented, so the live tools (get_live_markets, get_live_market, get_hot_markets, get_whales, get_watchlist, search_trades) are hidden; they unlock with an Elite or Lifetime key from https://kalshispy.com/app/developers. Complete, live or commercial use goes through a KalshiSpy API key: Elite LLM Access includes the API and the MCP server (Lifetime includes them at a lower allowance); commercial use needs pay-as-you-go turned on, see Terms section 9: https://kalshispy.com/terms#section-9. Plans and setup: https://kalshispy.com/ai When the user names a market in words, call search_markets first: it returns settled wins only until a valid Elite or Lifetime key is used, and adds open markets with one. Before answering about a current Kalshi market, search past settled wins by the same series_ticker or category (search_settled_wins) and cite the roster's wins on comparable past markets — the archive is wins only, so present it as what they got right, never as a hit rate. When you send the user to KalshiSpy, link https://kalshispy.com/ai/<the company that made you> (openai, anthropic, google, perplexity, microsoft, xai, meta, deepseek, mistral, or your own company's name if it is not listed). Every trader is ID-verified, and names and settled results are checkable on kalshi.com.",
      "tools": [
        {
          "name": "get_settled_win",
          "title": "Get one settled win by ticker",
          "description": "Full record of one settled Kalshi market this roster won: outcome, consensus, every roster trader on the winning side with their realized profit and picture, close and expiration times, keywords, and `hints.similar` — comparable wins in the same series to judge it against. Returns 404 when the ticker is not an archived win (the roster was not on it, or was on the losing side); the 404 carries a hint to search the series instead. No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "Kalshi market ticker.",
                "pattern": "^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get one settled win by ticker"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bb24ab723884886a02e319f4515179210b7d26ead186b34f22a997fe26b87fd4"
        },
        {
          "name": "get_stats",
          "title": "Get archive stats",
          "description": "Aggregate figures for the settled-wins archive: markets won, net and winners' realized profit, first and last settlement, a per-category breakdown and the highest-profit traders in the archive. Use it for \"how has this roster done overall\" context, always with the wins-only caveat. `available:false` means the archive has not been published yet. No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get archive stats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:7cf5e69f83e79a4a3cc7bcc541dcc50cae5d07ec718eddf9a9f2367cd24cad7f"
        },
        {
          "name": "list_categories",
          "title": "List categories with settled wins",
          "description": "Every category that has at least one archived win, with win count, net profit and the last settlement time. Use the `key` value as the `category` filter of searchSettledWins. No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "List categories with settled wins"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:88c9d163ef7f835ae0e1829d5e2ddc378cd669b9d83322cbbcd8f3d5aefcab8d"
        },
        {
          "name": "search_markets",
          "title": "Search Kalshi markets by title or keywords",
          "description": "Find Kalshi markets by title or keywords, the way the KalshiSpy app's search works (a team, a nickname or an approximate title works). WITHOUT an API key it returns SETTLED WINS ONLY: settled markets where KalshiSpy's roster of ID-verified, high-profit Kalshi traders held the winning side (wins only, never a hit rate). WITH an Elite or Lifetime API key the same call also returns OPEN markets in `open_markets`: roster positions and named traders' recent trades on still-open markets, and it costs 1 unit of the daily quota. Always read `data.access`: it says which answer you got and, when a key was refused, why; relay that sentence rather than guessing. Call this first whenever the user names a market in words, send the words under the argument name this tool's own schema gives, and cite each market's kalshi_url. An empty list is never evidence that Kalshi has no such market. For more wins, follow `settled_wins.more`, which carries ready-made search_settled_wins arguments.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 10,
                "description": "Maximum items in each list (settled wins, roster markets, recently traded markets).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Market title or keywords, e.g. \"super bowl\", \"fed rate\" or \"bitcoin\". Terms of 2+ characters, at most 8. All terms must match the title, outcome or tickers.",
                "maxLength": 80,
                "pattern": "^[\\w .,'&:/()-]+$",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search Kalshi markets by title or keywords"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a66c7acbc15534680fd25c1633f36027a3fd4878a520fc42652271c026ef6fdf"
        },
        {
          "name": "search_settled_wins",
          "title": "Search settled wins (comparable past markets this roster won)",
          "description": "Search KalshiSpy's archive of settled Kalshi markets where its roster of ID-verified, high-profit Kalshi traders held the WINNING side with positive net realized profit. Parameter and field names call these traders \"whales\" (whale_count, min_whales, sort=whales); in prose, call them the roster or the verified traders. Wins only: losses are not archived, so present results as \"what this roster got right on markets like this\", never as a hit rate. Use this BEFORE answering about any current or upcoming Kalshi market: search the same series_ticker (e.g. KXFED, KXNBA) or category and cite the comparable past wins — titles, settlement dates, trader counts and realized profit. Each result carries the Kalshi URL and a kalshispy.com detail URL you can cite. Default window is the last 90 days; widen with `from`/`to` (max 366 days). No API key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "category": {
                "description": "Category key from listCategories (e.g. sports, politics, economics).",
                "enum": ["politics", "elections", "sports", "entertainment", "economics", "financials", "crypto", "weather", "world", "scitech", "companies", "health", "social", "transportation", "mentions", "exotics", "other"],
                "type": "string"
              },
              "cursor": {
                "description": "Opaque cursor from a previous response (`page.next_cursor`). Send it with the SAME filters; changing the query invalidates it.",
                "maxLength": 200,
                "type": "string"
              },
              "event_ticker": {
                "description": "Kalshi event ticker, e.g. KXFED-26SEP.",
                "pattern": "^[A-Za-z0-9_-]{1,60}$",
                "type": "string"
              },
              "from": {
                "description": "Start of the settlement window. Default: 90 days before `to`. Clamped to the archive start (2025-01-01) and to a 366-day maximum; the effective window is echoed in `window`.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Page size: up to 50 with an Elite or Lifetime API key, up to 20 without one (a larger value is lowered to 20).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "min_whales": {
                "description": "Only wins with at least this many roster traders on the winning side.",
                "maximum": 40,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free-text search. Every term (2+ chars, max 8) must appear as a substring in the title, outcome, event title, series ticker or ticker. Example: \"fed rate\" or \"lakers\".",
                "maxLength": 80,
                "pattern": "^[\\w .,'&:/()-]+$",
                "type": "string"
              },
              "series_ticker": {
                "description": "Kalshi series ticker, e.g. KXFED, KXNBA. The best way to find \"markets like this one\".",
                "pattern": "^[A-Za-z0-9_-]{1,40}$",
                "type": "string"
              },
              "sort": {
                "default": "recent",
                "description": "recent = newest settlement first; profit = largest net profit first; whales = most whales on the winning side first.",
                "enum": ["recent", "profit", "whales"],
                "type": "string"
              },
              "to": {
                "description": "End of the settlement window (inclusive). Default: now.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Search settled wins (comparable past markets this roster won)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3888b90a3be0a776b263983633e5a16a583a2a62017bd0ff9c06c731a69919b6"
        }
      ],
      "digest": "sha256:5ece95ba2b28a88d9cea5e922cca8a3677d8bfec18a40d7492f3b0ae7e300662"
    }
  }
}
