{
  "lockfileVersion": 2,
  "subjects": {
    "com.nclexdrill/agent-toolbox": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agent-toolbox-mcp.nclexdrill.workers.dev/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "agent-toolbox",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "date_math",
          "description": "Date utilities: now (current UTC time), add (add a duration to a date), diff (difference between two dates), weekday (day name for a date).",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "ISO date for add/weekday",
                "type": "string"
              },
              "date1": {
                "type": "string"
              },
              "date2": {
                "type": "string"
              },
              "operation": {
                "default": "now",
                "enum": ["now", "add", "diff", "weekday"],
                "type": "string"
              },
              "unit": {
                "default": "day",
                "description": "millisecond/second/minute/hour/day/week",
                "type": "string"
              },
              "value": {
                "description": "Amount for add",
                "type": "number"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:99b19ff3ca0814d42cb472663c1a8f5fef3be0adafe9418623ac066ed9fe2546"
        },
        {
          "name": "encode_text",
          "description": "Encode text as base64, base64url, url-encoding, or hex.",
          "inputSchema": {
            "properties": {
              "format": {
                "default": "base64",
                "enum": ["base64", "base64url", "url", "hex"],
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e0fa468f687a6a7a35a07f4dde2f4ac1dbd5aaa76c89da228b0d3caee4f13e06"
        },
        {
          "name": "fetch_page_text",
          "description": "Fetch a web page (http/https) and return its cleaned readable text, truncated to max_chars.",
          "inputSchema": {
            "properties": {
              "max_chars": {
                "default": 12000,
                "description": "Max characters to return (default 12000, max 50000)",
                "type": "integer"
              },
              "url": {
                "description": "Full http(s) URL to fetch",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ea305a8a19edb1adbfb8b8b4e3a1c19a5b3dd2a9af87544ab2ad05d29221f2a1"
        },
        {
          "name": "get_terms",
          "description": "Read the AgentToolbox Terms of Use (as-is, liability-capped). Call this before relying on any tool in production.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:832e3b7f0d847002526a9e814e53060beb9fd6c219092795ee1f26c4b9733b18"
        },
        {
          "name": "hash_text",
          "description": "Compute a cryptographic hash of text (sha-256, sha-384, or sha-512), returned as hex.",
          "inputSchema": {
            "properties": {
              "algorithm": {
                "default": "sha-256",
                "enum": ["sha-256", "sha-384", "sha-512"],
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:697dfdd349e905ed7a3a4acf60f36395cbe1eb1bcc53a400449a67b95b2b69c8"
        },
        {
          "name": "html_to_text",
          "description": "Strip HTML tags/scripts/styles and return clean readable text.",
          "inputSchema": {
            "properties": {
              "html": {
                "type": "string"
              },
              "max_chars": {
                "default": 12000,
                "type": "integer"
              }
            },
            "required": ["html"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:83f49dcd9bf03366bc9fa6dc965d12f9c3275814bca22d60a7c24f9420106d25"
        },
        {
          "name": "json_format",
          "description": "Validate JSON and reformat it: pretty (indented), minify, or custom indent width.",
          "inputSchema": {
            "properties": {
              "json": {
                "type": "string"
              },
              "style": {
                "default": "pretty",
                "description": "'pretty', 'minify', or an indent number",
                "type": "string"
              }
            },
            "required": ["json"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:548b58ec99db4a38a211f02ccd58ef772d38e2e6d4795b3ccfd1ce41448872ad"
        },
        {
          "name": "markdown_to_html",
          "description": "Convert Markdown to HTML (headings, bold, italic, code, links, lists, quotes).",
          "inputSchema": {
            "properties": {
              "markdown": {
                "type": "string"
              }
            },
            "required": ["markdown"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e07bd0ca261ce2428892b24fc11ac746f66812741e0ab493d510918f79cc2d62"
        },
        {
          "name": "random_token",
          "description": "Generate a cryptographically random token string (for ids, passwords, nonces).",
          "inputSchema": {
            "properties": {
              "charset": {
                "default": "alphanumeric",
                "description": "alphanumeric, hex, urlsafe, numeric, ascii, or a custom character string",
                "type": "string"
              },
              "length": {
                "default": 32,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c21f986aeb370afee2ae2df6648f9e45d845b2eeff4b874412634997e7aba57f"
        },
        {
          "name": "summarize_text",
          "description": "Extractive summary: returns the N most representative sentences of a text, in original order.",
          "inputSchema": {
            "properties": {
              "sentences": {
                "default": 3,
                "description": "Number of sentences (default 3, max 10)",
                "type": "integer"
              },
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:61a136310ee1b1c59eac688b5fae9a98404a6a4b5bbcc3a72c870b68792855ca"
        },
        {
          "name": "text_stats",
          "description": "Text statistics: character/word/sentence counts, reading time, and Flesch reading-ease score.",
          "inputSchema": {
            "properties": {
              "text": {
                "type": "string"
              }
            },
            "required": ["text"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8a2e96413552bda3d5587fb362f13aa54d95e91bc8baf4f2d7e1c638db3a3a41"
        },
        {
          "name": "unit_convert",
          "description": "Convert between units: length (mm/cm/m/km/in/ft/yd/mi), weight (mg/g/kg/oz/lb), temperature (c/f/k), data (b/kb/mb/gb/tb).",
          "inputSchema": {
            "properties": {
              "from": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "value": {
                "type": "number"
              }
            },
            "required": ["from", "to", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c9fb7c6a4bac4d36c739ab127115acef4893d2cc6bfdc95144f868a24935a608"
        },
        {
          "name": "uuid_generate",
          "description": "Generate cryptographically random UUID v4 values.",
          "inputSchema": {
            "properties": {
              "count": {
                "default": 1,
                "description": "How many (1-100, default 1)",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:24190526abc903c15d45198b13b0a0f2aca3b0dbee97a76e16c743d4fabd9d71"
        }
      ],
      "digest": "sha256:74fd4bbd3a5c239c7ee2f03e849a81608d4720088c9188f32feb23272dbf933b"
    }
  }
