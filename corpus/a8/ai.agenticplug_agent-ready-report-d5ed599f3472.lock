{
  "lockfileVersion": 2,
  "subjects": {
    "ai.agenticplug/agent-ready-report": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://scan.agenticplug.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "agent-ready-report",
        "title": "Agent Ready Report by agenticplug.ai",
        "version": "1.0.0",
        "websiteUrl": "https://agenticplug.ai/agent-ready-report"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server scans a public website and reports how ready it is for AI agents and AI search.\n\nWhen presenting a scan:\n- Lead with the tallies (e.g. \"3 of 16 agent-readiness checks passing\"). Never describe the result as a \"level\" or grade.\n- \"Couldn't check\" means the scanner got no answer (the site blocked it, timed out or errored). It is not a failure; say so.\n- Checks marked \"emerging standard\" are new; missing them is common, even for large companies.\n- Agentic commerce is only scored for sites that sell online. If the owner says their site sells online but the report says it doesn't, scan again with sells_online \"yes\".\n- The report is a diagnostic. Explain what each finding means using the report's own explanations.\n- Keep the report's attribution line and its disclaimer.\n\nUse explain_check for more detail on any single check, or with no check_id to list every check.",
      "tools": [
        {
          "name": "explain_check",
          "title": "Explain an agent-readiness check",
          "description": "Explain one agent-readiness check in depth: what it is, why it matters for AI agents and AI search, exactly how the scanner tests it, what counts as a pass, and the official sources. Call with no check_id to list every check.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "check_id": {
                "description": "The check's id, as shown in a scan report (e.g. \"dnsAid\", \"aiCrawlerAccess\"). Omit to list all checks.",
                "enum": ["robotsTxt", "sitemap", "linkHeaders", "dnsAid", "markdownNegotiation", "robotsTxtAiRules", "contentSignals", "apiCatalog", "oauthDiscovery", "oauthProtectedResource", "authMd", "mcpServerCard", "a2aAgentCard", "agentSkills", "webMcp", "ard", "webBotAuth", "x402", "mpp", "ucp", "acp", "ap2", "https", "aiCrawlerAccess", "indexable", "contentWithoutJs", "headingStructure", "titleAndDescription", "canonical", "structuredData", "entitySchema", "pageTypeSchema", "language", "responseTime", "llmsTxt"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain an agent-readiness check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:84da6c66687b0916aa25895db80b7925a943b98b8486ae588a2b014268284428"
        },
        {
          "name": "scan_website",
          "title": "Scan a website for agent readiness",
          "description": "Scan a public website and report how ready it is for AI agents and AI search: which checks pass, which are missing, and what each check is, in plain English and technically. Covers 35 checks in three groups: agent readiness (robots.txt and AI crawler rules, sitemap, Link headers, DNS-AID, markdown for agents, Content Signals, API catalog, OAuth discovery, auth.md, MCP server card, A2A agent card, agent skills, WebMCP, ARD), agentic commerce (x402, MPP, UCP, ACP, AP2; scored only for sites that sell online), and AI search foundations (HTTPS, AI crawler access, indexability, content without JavaScript, heading structure, title and description, canonical URL, structured data, business identity markup, language, response time). Use when someone asks whether their website is ready for AI agents, AI search, ChatGPT, Claude, Perplexity, Muse or agentic commerce. A scan takes 5 to 30 seconds.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "detail": {
                "default": "standard",
                "description": "\"standard\": findings with plain-English and technical explanations. \"full\": adds pass criteria, request-by-request evidence and source links.",
                "enum": ["standard", "full"],
                "type": "string"
              },
              "sells_online": {
                "default": "auto",
                "description": "Whether the site sells online. \"auto\" detects it from the homepage; use \"yes\" or \"no\" when the owner has said.",
                "enum": ["auto", "yes", "no"],
                "type": "string"
              },
              "url": {
                "description": "The website to scan, e.g. \"example.com\" or \"https://www.example.com\".",
                "maxLength": 2048,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Scan a website for agent readiness"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ff5edc147000f1db11a75a2d890e6c7a1db4d72f9311ae1d2b4886aa66c746f8"
        }
      ],
      "digest": "sha256:c588a22d1170c97734ee712d21fb2678ad177fb8a090d5f353ffc7149044fe21"
    }
  }
}
