      "serverInfo": {
        "name": "casa-kimball",
        "title": "Casa Kimball",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Casa Kimball is a private oceanfront villa near Cabrera on the north coast of the Dominican Republic, rented whole to one group at a time: eight bedrooms, an infinity pool, a private chef and full staff, for up to 20 adults and children (children under 4 don't count).\n\nStart with get_house_info (topic \"overview\") for the facts, nightly rates and terms. To plan a stay, use find_open_dates or check_availability, then get_quote for the exact itemized price. When the guest wants the dates, request_hold sets them aside for 2 hours and emails the guest a link: the guest reads the terms and accepts there, and only then are the dates held (for 72 hours, with an invoice). You can't accept the terms for the guest. Nothing is ever charged by these tools; payment is by wire transfer after the house confirms the stay with the guest.\n\nFor weddings, events, or anything the tools don't cover, send_inquiry passes a message to the house.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check dates",
          "description": "Whether the whole villa is free for exact dates, counting the turnover days around other stays, the 7-day booking lead time, and the season's minimum stay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD. Arrival is from 2pm.",
                "format": "date",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD. Departure is by noon.",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["check_in", "check_out"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d34213c1836b7ad6bad1b2d00438ee56b9a2a9ccb60458ad673e34d9c3f6235"
        },
        {
          "name": "find_open_dates",
          "title": "Find open dates",
          "description": "Open stretches on the calendar, long enough for a stay. Each window gives the first possible arrival, the last possible departure, and how many nights fit between them. Turnover days around other stays are already excluded, and arrivals open 7 days out.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "from": {
                "description": "Look from this date, YYYY-MM-DD; default today.",
                "format": "date",
                "type": "string"
              },
              "months": {
                "default": 3,
                "description": "How many months to look across.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "nights": {
                "description": "Only windows with room for at least this many nights; default the minimum stay.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": null,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find open dates"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2c21f49a5a87cca92855fd8ea32ab6186485a06c172903c556caadcfd88dd775"
        },
        {
          "name": "get_house_info",
          "title": "About the house",
          "description": "Facts about Casa Kimball. \"overview\" has the essentials in one page: who it sleeps, the nightly rates by season, what every stay adds, payment and cancellation terms, and arrival times. The others go deeper: house (the place itself), rooms, dining (the chef and meals), activities, arrival (airports and transfers), spa, events (weddings and celebrations), faq.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "topic": {
                "default": "overview",
                "enum": ["overview", "house", "rooms", "dining", "activities", "arrival", "spa", "events", "faq"],
                "type": "string"
              }
            },
            "required": null,
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "About the house"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:086abc096ed11fd8ce5532ec201ee4d685e37a28e24bcaec373cd4c6062dd153"
        },
        {
          "name": "get_quote",
          "title": "Price a stay",
          "description": "The exact itemized price of a stay, from the same engine as the booking page: the nightly rental by season, the meal plan, the 12% gratuity, the refundable security deposit, and any add-ons. Also says whether the dates are open, lists the add-ons, and gives a link that opens the booking page on this stay.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add_ons": {
                "description": "Optional add-on codes from get_quote's add_ons_available (boat tour, spa, bonfire, ...); priced for the whole party.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "adults": {
                "description": "Adults (12 and up).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD. Arrival is from 2pm.",
                "format": "date",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD. Departure is by noon.",
                "format": "date",
                "type": "string"
              },
              "children": {
                "description": "Children aged 4 to 11. Adults and children together may not exceed 20.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "toddlers": {
                "description": "Children under 4: free, and not counted toward the 20.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["adults", "check_in", "check_out"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Price a stay"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0205a1c5189ea77f61ea6e8a6c8dd1a09281628eb0ec73e42945d300bdab3c50"
        },
        {
          "name": "request_hold",
          "title": "Hold dates for the guest",
          "description": "Sets the dates aside for 2 hours and emails the guest a link. The guest opens it, reads the payment and cancellation terms, and accepts; only then are the dates held, for 72 hours, and the itemized invoice sent. Nothing is charged. Use the guest's own name and email address, with their permission, after get_quote: the email goes to them, and the house will reply there. One open request per email address at a time.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add_ons": {
                "description": "Optional add-on codes from get_quote's add_ons_available (boat tour, spa, bonfire, ...); priced for the whole party.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "adults": {
                "description": "Adults (12 and up).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "check_in": {
                "description": "Arrival date, YYYY-MM-DD. Arrival is from 2pm.",
                "format": "date",
                "type": "string"
              },
              "check_out": {
                "description": "Departure date, YYYY-MM-DD. Departure is by noon.",
                "format": "date",
                "type": "string"
              },
              "children": {
                "description": "Children aged 4 to 11. Adults and children together may not exceed 20.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "email": {
                "description": "The guest's email address; the confirmation link goes here.",
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "message": {
                "description": "Optional note for the house: the occasion, arrival plans, what the group loves.",
                "maxLength": 4000,
                "type": "string"
              },
              "name": {
                "description": "The guest's full name.",
                "maxLength": 200,
                "type": "string"
              },
              "phone": {
                "description": "Optional phone number, with country code.",
                "maxLength": 40,
                "type": "string"
              },
              "toddlers": {
                "description": "Children under 4: free, and not counted toward the 20.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["adults", "check_in", "check_out", "email", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Hold dates for the guest"
          },
          "behavior": {
            "destructive": true,
