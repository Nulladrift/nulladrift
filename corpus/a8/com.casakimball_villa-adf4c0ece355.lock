          },
          "digest": "sha256:dae93411d2d5ef53be0654b0c6852a8a14c887c96ad1115e53db66014d6938fa"
        },
        {
          "name": "send_inquiry",
          "title": "Message the house",
          "description": "Passes a message to the house team, who reply to the guest by email. For weddings and events, long stays, larger groups, or any question the other tools don't answer. Use the guest's own name and email address, with their permission.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Optional arrival date the guest has in mind.",
                "format": "date",
                "type": "string"
              },
              "check_out": {
                "description": "Optional departure date.",
                "format": "date",
                "type": "string"
              },
              "email": {
                "description": "Where the house should reply.",
                "format": "email",
                "maxLength": 320,
                "type": "string"
              },
              "guests": {
                "description": "Optional head count, including day guests for an event.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "message": {
                "description": "The question or request, in the guest's words where possible.",
                "maxLength": 4000,
                "type": "string"
              },
              "name": {
                "description": "The guest's full name.",
                "maxLength": 200,
                "type": "string"
              }
