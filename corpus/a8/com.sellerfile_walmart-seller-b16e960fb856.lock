{
  "lockfileVersion": 2,
  "subjects": {
    "com.sellerfile/walmart-seller": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.sellerfile.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sellerfile",
        "title": "SellerFile",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "SellerFile reports a Walmart Marketplace seller's sales, fees, advertising and profit. explain_seller_metric needs no sign-in; the report tools read the signed-in seller's stores and never change anything.",
      "tools": [
        {
          "name": "explain_seller_metric",
          "title": "Explain a seller metric",
          "description": "Explains a metric SellerFile reports for Walmart Marketplace sellers (Sales, Net revenue, Gross profit, ACOS, ROAS and others): what it means and how it is calculated. No sign-in needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "metric": {
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["metric"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Explain a seller metric"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:bfcf0a5200883f60d6efd8e29d85d112678f12048e2cb14bc956ad3a8c478490"
        },
        {
          "name": "get_product_profit",
          "title": "Profit by product",
          "description": "Per-SKU sales, units, ad spend and profit of the signed-in seller's Walmart stores for a period, sorted by sales, units, profit or ad spend, 10 rows by default and at most 25. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compare": {
                "enum": ["none", "previous_period", "last_year"],
                "type": "string"
              },
              "end_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "period": {
                "enum": ["today", "yesterday", "last_7_days", "last_14_days", "last_30_days", "this_month", "last_month", "this_year", "last_year"],
                "type": "string"
              },
              "sort": {
                "enum": ["sales", "units", "profit", "ad_spend"],
                "type": "string"
              },
              "start_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "timezone": {
                "maxLength": 64,
                "pattern": "^[A-Za-z][A-Za-z0-9_+-]*(\\/[A-Za-z0-9_+-]+){0,2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Profit by product"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["sellerfile.read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:3296626c96513aaa9896baa782ee8da0aca9143d722b07f14440d0ee4f9a55f3"
        },
        {
          "name": "get_profit_summary",
          "title": "Profit summary",
          "description": "Headline metrics (Sales, units, orders, ad spend, gross profit and more) and the P&L section totals of the signed-in seller's Walmart stores for a period (default yesterday, in the seller's timezone), optionally compared with the previous period or last year. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "compare": {
                "enum": ["none", "previous_period", "last_year"],
                "type": "string"
              },
              "end_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "period": {
                "enum": ["today", "yesterday", "last_7_days", "last_14_days", "last_30_days", "this_month", "last_month", "this_year", "last_year"],
                "type": "string"
              },
              "start_date": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "timezone": {
                "maxLength": 64,
                "pattern": "^[A-Za-z][A-Za-z0-9_+-]*(\\/[A-Za-z0-9_+-]+){0,2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Profit summary"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["sellerfile.read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:87fa4009481a26b06725bf6d9930e93ecc37ea0f69fcd167e1d293271cd3e5c7"
        },
        {
          "name": "get_report_result",
          "title": "Get a report that was still calculating",
          "description": "Returns the result of a get_profit_summary or get_product_profit call that answered with status running, by its report_id. Results are kept about 15 minutes and returned once.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "report_id": {
                "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$",
                "type": "string"
              }
            },
            "required": ["report_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a report that was still calculating"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["sellerfile.read"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:149ad688d9bf00363ec8e888093312fb37c27605b55be30d198df3c751bcebe4"
        }
      ],
      "digest": "sha256:fa047974984a0ab198b7b44bde25a5667d2796d80dd1d94dd01d4dcbbfe45757"
    }
  }
}
