{
  "lockfileVersion": 2,
  "subjects": {
    "com.bringmethat/bringmethat": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.bringmethat.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "bringmethat",
        "title": "BringMeThat",
        "version": "1.0.0",
        "description": "Order delivery or pickup from US restaurants. Pay on bringmethat.com.",
        "websiteUrl": "https://www.bringmethat.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BringMeThat lets people order delivery or pickup from US restaurants. The customer pays on bringmethat.com checkout; a BringMeThat agent then places the order with the restaurant. Canonical MCP endpoint: https://mcp.bringmethat.com/mcp. To order: ask where the customer is (ZIP, city, or street address) and what they want; call search_restaurants; call get_menu and help them choose, asking about any required options; then call create_checkout_link and give them checkout_url. They review and pay on bringmethat.com. Never ask for or accept payment details. Quote prices exactly as the tools return them. Checkout is the item total plus a 10% markup, the restaurant's own service fee (none for partner restaurants; there is no flat service fee), tax, a $7 delivery fee ($0 for pickup) unless a Habitat or MealMe delivery quote replaces it, and an optional tip. Premium ($9.95/month or $96/year) waives the markup and the service fee, but not delivery, tax, or tip. The card is authorized for that total plus $15 when the total is over $30, otherwise plus 45%. Only the final amount is charged. If ordering_open is false, online ordering is closed; tell the customer to check back later. If a result has team_on_shift false, relay its notice (the team is paged and an unplaced order is canceled after 20 minutes) before they pay.",
      "tools": [
        {
          "name": "create_checkout_link",
          "title": "Create checkout link",
          "description": "Build a bringmethat.com checkout link for the customer's items. Opening checkout_url fills their cart and opens bringmethat.com checkout, where they review the total and pay. Does not charge a card and does not place the order. Validates items and required options first and returns prices, or the problems to fix with the customer. Checkout is the item total plus a 10% markup, the restaurant's own service fee (none for partner restaurants; there is no flat service fee), tax, a $7 delivery fee ($0 for pickup) unless a Habitat or MealMe delivery quote replaces it, and an optional tip. Premium ($9.95/month or $96/year) waives the markup and the service fee, but not delivery, tax, or tip. The card is authorized for that total plus $15 when the total is over $30, otherwise plus 45%. Only the final amount is charged.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "delivery_address": {
                "description": "Street address for delivery, e.g. '2415 N Ashland Ave, Chicago, IL 60614'. Prefills checkout.",
                "type": "string"
              },
              "fulfillment": {
                "enum": ["delivery", "pickup"],
                "type": "string"
              },
              "items": {
                "items": {
                  "properties": {
                    "item_id": {
                      "description": "item_id from get_menu, e.g. '0.2.0.5'.",
                      "type": "string"
                    },
                    "options": {
                      "description": "Choices for the item's option groups. Use group_index and option names exactly as get_menu lists them. Required groups must be filled.",
                      "items": {
                        "properties": {
                          "choices": {
                            "items": {
                              "type": "string"
                            },
                            "minItems": 1,
                            "type": "array"
                          },
                          "group_index": {
                            "minimum": 0,
                            "type": "integer"
                          }
                        },
                        "required": ["choices", "group_index"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "quantity": {
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "special_instructions": {
                      "maxLength": 200,
                      "type": "string"
                    }
                  },
                  "required": ["item_id", "quantity"],
                  "type": "object"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "restaurant_id": {
                "type": "integer"
              }
            },
            "required": ["fulfillment", "items", "restaurant_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create checkout link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:96d1ff07c62ebdb2556f634bcf2682059530eb75f7e3e3364d1280fdb29d28a4"
        },
        {
          "name": "get_menu",
          "title": "Get a menu",
          "description": "Get a restaurant's BringMeThat menu: sections, items with item_id, descriptions, prices, and option groups (including which ones are required). Prices are item prices; checkout adds the fees create_checkout_link describes. Use restaurant_id from search_restaurants. Large menus can be narrowed with section or search.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "restaurant_id": {
                "type": "integer"
              },
              "search": {
                "description": "Only items whose name or description contains this, e.g. 'vegetarian'.",
                "type": "string"
              },
              "section": {
                "description": "Only sections whose name contains this, e.g. 'noodles'.",
                "type": "string"
              }
            },
            "required": ["restaurant_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a menu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4f2a488254d3277e138acee64ff12a3546ddf77d3c4713a85312707dcd9a5ce"
        },
        {
          "name": "get_order_status",
          "title": "Check an order",
          "description": "Read the status of a BringMeThat order. Does not change the order. Needs the order number (starts with R) and the email used at checkout; details are returned only when both match.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "type": "string"
              },
              "order_number": {
                "description": "e.g. R123456789",
                "type": "string"
              }
            },
            "required": ["email", "order_number"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check an order"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e88819192423465c87dfe726defa5add3fa87873c804ccd121e463dfe1bab6ec"
        },
        {
          "name": "get_premium_signup_link",
          "title": "Premium signup link",
          "description": "Get the link where a customer can join BringMeThat Premium ($9.95/month or $96/year), which removes the 10% markup and the restaurant service fee from every order. Returns the signup URL, prices and what is included. Does not charge a card and does not start a subscription; the customer signs up and pays on bringmethat.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Premium signup link"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:df5891dfb1432e5b4dd59e9405060f54d101fbb23db8b8788539ef6f5852d094"
        },
        {
          "name": "search_restaurants",
          "title": "Find restaurants",
          "description": "Find restaurants on BringMeThat that deliver to, or offer pickup near, a US location. Returns restaurant_id, cuisines, distance when a street address is given, Yelp rating when one is on file, and the restaurant page URL. Ask for a ZIP code, city and state, or street address before calling if you do not already have it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fulfillment": {
                "default": "delivery",
                "enum": ["delivery", "pickup"],
                "type": "string"
              },
              "limit": {
                "default": 8,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "ZIP code, 'City, ST', or a full US street address (best: gives distances).",
                "type": "string"
              },
              "query": {
                "description": "Cuisine, dish or restaurant name, e.g. 'thai', 'pizza', 'pad see ew'. Omit for everything nearby.",
                "type": "string"
              }
            },
            "required": ["location"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find restaurants"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4afb5b3ab38cb3276ad7e66e574b9b20e6ef0b5fd1400244d636cf8e33fad66"
        }
      ],
      "digest": "sha256:83485fe7cdeb8a50d2eda2e5e38ee78bb7d6cd0c4ce2f1d23cff301103fefee3"
    }
  }
}
