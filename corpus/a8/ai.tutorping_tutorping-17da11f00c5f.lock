{
  "lockfileVersion": 2,
  "subjects": {
    "ai.tutorping/tutorping": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://tutorping.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "tutorping",
        "version": "1.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "TutorPing connects students with independent tutors. Anyone can search tutors, check availability, and book sessions; if no listed tutor fits, request_tutor asks TutorPing to find one (reply by email within 1 business day). For help right now, search results include free TutorPing AI Tutors (a chat link); they are AI, not people, so say so. Tutors who connect with their API key can also see student leads TutorPing found for them, get reply drafts, and manage bookings.",
      "tools": [
        {
          "name": "ask_tutorping",
          "title": "Ask TutorPing a question",
          "description": "Ask anything about TutorPing, finding a tutor, or finding tutoring students that the other tools don't cover, in plain words. Returns which TutorPing tool or page fits, plus contact details. Do not include personal information.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "askedFor": {
                "description": "Who the question is for",
                "enum": ["student-or-parent", "tutor", "tutoring-business", "other"],
                "type": "string"
              },
              "question": {
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:91a11f2466b1692295542b06addf052fd485b7e6c2a4318ce4a8a6d3eda86c8b"
        },
        {
          "name": "get_tutor",
          "title": "Get tutor profile",
          "description": "Full public profile for one TutorPing tutor (by slug from search_tutors).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1212b97a6a0b532f8cb59b4638bee85526f49d07316609a11f70d527e32ca919"
        },
        {
          "name": "get_tutor_availability",
          "title": "Get a tutor's open slots",
          "description": "Open session times for a tutor, in the tutor's timezone. Use before request_booking.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "default": 14,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5c688b3c542eec0ef8271111b034a48947e096b604e87314bb4e085e1153cdf7"
        },
        {
          "name": "how_to_get_leads",
          "title": "How TutorPing works for tutors",
          "description": "Explains how a tutor gets student leads from TutorPing and connects their own AI assistant.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:365ec8c392ccc2d19c583122033e4d578a519c9d4e7d9581a7d6bc8d93ebfd70"
        },
        {
          "name": "request_booking",
          "title": "Book a session with a tutor",
          "description": "Book a student into one of a tutor's open slots (from get_tutor_availability). The tutor and the student both get a confirmation email. Confirm the time, name, and email with the user before calling.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "date": {
                "description": "YYYY-MM-DD",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "slug": {
                "maxLength": 80,
                "type": "string"
              },
              "studentEmail": {
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "studentName": {
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "subject": {
                "maxLength": 100,
                "type": "string"
              },
              "time": {
                "description": "HH:MM, 24h, tutor's timezone — must match an open slot",
                "pattern": "^\\d{2}:\\d{2}$",
                "type": "string"
              },
              "type": {
                "default": "session",
                "description": "\"trial\" only if the tutor offers a free trial",
                "enum": ["session", "trial"],
                "type": "string"
              }
            },
            "required": ["date", "slug", "studentEmail", "studentName", "time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e8154b5898076e74332a87c783d5927df1cf24704ac05cb259f9fa48c02960cf"
        },
        {
          "name": "request_tutor",
          "title": "Ask TutorPing to find a tutor",
          "description": "Submit a request for TutorPing to match a student with a tutor, when search_tutors finds no fit or the user prefers to be matched. TutorPing replies by email within 1 business day with tutor options. Collect what the student needs, then confirm the details AND get the user's explicit agreement that TutorPing may share the request and contact details with matching tutors before calling. Ask only for a first name, never a child's full name.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "budgetPerHour": {
                "description": "USD per hour",
                "exclusiveMinimum": 0,
                "maximum": 1000,
                "type": "number"
              },
              "consent": {
                "const": true,
                "description": "The user agreed TutorPing may share this request and contact details with matching tutors",
                "type": "boolean"
              },
              "email": {
                "description": "Where TutorPing should send tutor options",
                "format": "email",
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "level": {
                "description": "e.g. \"11th grade\", \"college\", \"adult beginner\"",
                "maxLength": 60,
                "type": "string"
              },
              "location": {
                "description": "City or area for in-person; omit if online only",
                "maxLength": 120,
                "type": "string"
              },
              "notes": {
                "description": "Goals, current scores, anything a tutor should know",
                "maxLength": 1000,
                "type": "string"
              },
              "online": {
                "description": "true if online sessions are fine",
                "type": "boolean"
              },
              "phone": {
                "maxLength": 40,
                "type": "string"
              },
              "schedule": {
                "description": "e.g. \"weekday evenings, test on Dec 6\"",
                "maxLength": 200,
                "type": "string"
              },
              "studentFirstName": {
                "maxLength": 60,
                "type": "string"
              },
              "subject": {
                "description": "e.g. \"SAT math\", \"AP Chemistry\", \"piano\"",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "tutorRef": {
                "description": "tutorRef of a profile from search_tutors the user liked; TutorPing asks that tutor first",
                "pattern": "^tp-[0-9a-f]{8}$",
                "type": "string"
              }
            },
            "required": ["consent", "email", "subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ac03aa11505335a203c4be7d76fcd1aa8874156017b7b1842cb96e75975c101f"
        },
        {
          "name": "search_tutors",
          "title": "Search tutors",
          "description": "Find independent tutors on TutorPing by subject, student level, and location. Returns tutors with a public page (subject, level, location, rate, reviews, page link, whether they can be booked directly), how many matching tutors TutorPing has in total with their profiles minus names (request_tutor matches the student with one, optionally a chosen tutorRef), and free TutorPing AI Tutors for the subject (clearly AI, not people; a chat link for help right now). Use for students or parents looking for a tutor (SAT/ACT, math, science, languages, music, and more). If no listed tutor fits, use request_tutor and TutorPing will match one. Always tell the user that an AI tutor is AI.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "level": {
                "description": "e.g. \"high school\", \"college\"",
                "maxLength": 40,
                "type": "string"
              },
              "location": {
                "description": "City or area, e.g. \"NYC\". Omit for online tutors anywhere.",
                "maxLength": 80,
                "type": "string"
              },
              "maxHourlyRate": {
                "description": "USD per hour",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "subject": {
                "description": "e.g. \"SAT\", \"chemistry\", \"piano\"",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:185a439f82a6b5cf3e0d5c431468cab85118c48890c86fedd3e269d943623455"
        },
        {
          "name": "tutoring_demand",
          "title": "Tutoring demand",
          "description": "How many people online recently asked for a tutor in a subject (from Reddit and other communities TutorPing monitors), in total. Useful for tutors deciding whether there is demand for their subject. The requests themselves are only shared with TutorPing tutors.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "days": {
                "default": 7,
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "subject": {
                "description": "e.g. \"SAT\", \"organic chemistry\", \"piano\"",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["subject"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c23bf54b49df5d14eb95b5b562dbd3848686d4d31cea1de2ca40e3c8f81aed05"
        }
      ],
      "digest": "sha256:d4ea7d6a0d9ab7e6b63c6221c1d95ef8d89da7966301d6abc0d4da65fbc16b58"
    }
  }
}
