{
  "lockfileVersion": 2,
  "subjects": {
    "com.checkedcare/records": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://checkedcare.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "checkedcare",
        "title": "CheckedCare",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Call find_facility first to identify the facility. When more than one result could be the facility the user means, ask the user which one before calling get_facility_record. When the user gives a license number, get_facility_record can be called with it directly. These tools cover licensed child care facilities in the states listed on checkedcare.com, not individual people.",
      "tools": [
        {
          "name": "find_facility",
          "title": "Find a child care facility",
          "description": "Use this when the user names a child care center, preschool or family child care home (by name, license number, or name and city) in a covered US state and wants its official state licensing or inspection record. Returns up to 10 matching facilities with street, ZIP and license number so the right one can be confirmed, plus a record_key for get_facility_record. Do not use it for general child care advice, to rank or recommend facilities, or for information about individual people.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Optional city name to narrow the results to.",
                "maxLength": 100,
                "type": "string"
              },
              "query": {
                "description": "Facility name, part of a name, or the agency license number, as the user typed it.",
                "maxLength": 200,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code (for example TX) of the state whose records to read. If the state is not covered, the tool returns an error naming the covered states.",
                "type": "string"
              }
            },
            "required": ["query", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a child care facility"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f66072f6b3369566f85ec1f4c5d4549c373f3b98ba5c93fb314f160b51ce4d0a"
        },
        {
          "name": "get_facility_record",
          "title": "Get a facility's official record",
          "description": "Use this when one specific facility is identified (a record_key slug from find_facility, or a license number the user gave) and the user wants its license status, published inspection counts or the agency's inspection findings. Returns the record with verbatim findings, the status-as-of date, the agency's official record link and the CheckedCare page URL. Do not use it to grade, rank or compare facilities, or to look up staff, children or any other individual.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "license_number": {
                "description": "The agency license or operation number, exactly as published.",
                "maxLength": 200,
                "type": "string"
              },
              "slug": {
                "description": "record_key.slug from a find_facility result.",
                "maxLength": 200,
                "type": "string"
              },
              "state": {
                "description": "Two-letter US state code (for example TX) of the state whose records to read. If the state is not covered, the tool returns an error naming the covered states.",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a facility's official record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0a7d31515ca97d323c0678830f39314f01f30b6a74c4d5d792946d39f4f92c5"
        }
      ],
      "digest": "sha256:0ee68b389b9471a07d801773977700d29104a61653f2d6ec69646bd4e348626e"
    }
  }
}
