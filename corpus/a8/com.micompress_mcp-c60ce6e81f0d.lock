{
  "lockfileVersion": 2,
  "subjects": {
    "com.micompress/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://micompress.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "micompress",
        "title": "MiCompress",
        "version": "1.0.0",
        "websiteUrl": "https://micompress.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MiCompress compresses images, PDFs, video, audio, Office documents and archives. This hosted server cannot read files on the user's computer: give compress_file_from_url a public http(s) link to the file (a direct download link, or a Google Drive / Dropbox share link). It returns a download link to the smaller file, valid for 24 hours. If a result says the job is still processing, call get_compression_result with its job_id after a short wait.",
      "tools": [
        {
          "name": "compress_file_from_url",
          "title": "Compress a file from a URL",
          "description": "Download a file from a public URL, compress it on micompress.com and return a download link to the smaller file (valid 24 hours) with the size before and after. Works for images (JPG, PNG, WebP, GIF, HEIC, RAW…), PDF, video, audio, Office documents, EPUB and archives. Accepts direct links and Google Drive / Dropbox share links. Calls the MiCompress compression service; documentation: https://micompress.com/mcp-server",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "filename": {
                "description": "Name to give the file, with extension (e.g. \"report.pdf\"). Only needed when the URL does not reveal the file type.",
                "maxLength": 200,
                "type": "string"
              },
              "max_width": {
                "description": "Images only: also resize down to this width in pixels.",
                "exclusiveMinimum": 0,
                "maximum": 20000,
                "type": "integer"
              },
              "preset": {
                "description": "lossless keeps quality identical; recommended (default) balances size and quality; extreme gives the smallest file.",
                "enum": ["lossless", "recommended", "extreme"],
                "type": "string"
              },
              "url": {
                "description": "Public http(s) URL of the file to compress.",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Compress a file from a URL"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef956f63163e661658f15d0b255392bd54f7a5f36720618cf45c1393cfdc1a50"
        },
        {
          "name": "get_compression_result",
          "title": "Get compression result",
          "description": "Get the result of a compression started by compress_file_from_url, by the job_id it returned (kept for 2 hours). Use it when that call reported the job as still processing; returns the download link once it is done.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "job_id": {
                "description": "The job_id returned by compress_file_from_url.",
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get compression result"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:929a94806fa9039e6bdd06320b84df40444bc7916f2f3fdd94dd0a0b1221d5b5"
        },
        {
          "name": "list_supported_formats",
          "title": "List supported formats",
          "description": "List the file extensions MiCompress can compress, grouped by category, with the size limit for this connection.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List supported formats"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9ec0f8053bf8cdddb0c6887abf972d32c8e660290dc16b6faa9cab518c35c8e"
        }
      ],
      "digest": "sha256:17e223f24f2e8ca459e8df2f575be032c787e303bbc00dc4080cf9b8e689b065"
    }
  }
}
