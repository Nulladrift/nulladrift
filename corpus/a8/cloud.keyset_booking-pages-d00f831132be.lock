{
  "lockfileVersion": 2,
  "subjects": {
    "cloud.keyset/booking-pages": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.keyset.cloud/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "keyset",
        "title": "Keyset booking pages",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Find holiday apartments that take direct bookings through Keyset, read a booking page and check prices for dates. Prices and availability are checked again when the guest books. You cannot book or pay: give the guest the bookingUrl of the offer they choose; they enter their details and pay on the booking page. A page with onlineBooking false does not take online bookings yet: name its prices as information only, promise no booking and send the guest to the host through hostContact. When bookingStatus is closed the host has not opened bookings yet: say so, name the date in opensOn when there is one, and do not suggest the page is broken. A page with bookingRequests true takes booking requests: the guest sends one through the bookingUrl, nothing is reserved or paid until the host accepts within 48 hours.",
      "tools": [
        {
          "name": "find_booking_pages",
          "title": "Find booking pages",
          "description": "Lists booking pages of holiday apartments whose hosts let AI assistants find them: name, place and the bookingPageId the other tools take. Give a few words of the name or the place to narrow the list (at most 20).",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Words of the name or the place.",
                "maxLength": 80,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b330535524a539ef1b399a8632e4e88b3307346f656cf6a8a7d599b1f66e7a7"
        },
        {
          "name": "get_booking_page",
          "title": "Read a booking page",
          "description": "Reads one booking page: description, place, check-in and check-out times, the host, the cancellation terms and each apartment with how many it sleeps and its lowest nightly price. Amounts are decimal strings. onlineBooking says whether guests can book on the page now; when false, it carries the host contact instead, and bookingRequests says whether guests can send a booking request there.",
          "inputSchema": {
            "properties": {
              "bookingPageId": {
                "description": "From find_booking_pages.",
                "type": "string"
              },
              "language": {
                "description": "Language of the texts; German by default.",
                "enum": ["de", "en"],
                "type": "string"
              }
            },
            "required": ["bookingPageId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc9b5160c3f4b511777393a7e6823e96210327ab14207d80f5775547fd3e61ab"
        },
        {
          "name": "search_availability",
          "title": "Check prices for dates",
          "description": "Which apartments of a booking page are free for the dates and guests, with the full price and a bookingUrl that opens the booking step for that apartment and stay. Dates are local, check-out exclusive. The result is advisory: the booking page checks again when the guest books. Where the page does not take online bookings yet (onlineBooking false) there is no bookingUrl and the guest asks the host through hostContact, unless the page takes booking requests (bookingRequests true): then the bookingUrl opens the request step.",
          "inputSchema": {
            "properties": {
              "adults": {
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "bookingPageId": {
                "description": "From find_booking_pages.",
                "type": "string"
              },
              "checkIn": {
                "description": "Arrival day, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "checkOut": {
                "description": "Departure day, YYYY-MM-DD.",
                "format": "date",
                "type": "string"
              },
              "childAges": {
                "description": "One age per child, when known; some hosts price children by age.",
                "items": {
                  "maximum": 17,
                  "minimum": 0,
                  "type": "integer"
                },
                "type": "array"
              },
              "children": {
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["adults", "bookingPageId", "checkIn", "checkOut"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0cf1f8213b5094ba7c4d9dd4ce4b149917096ff33129daadec2e00eba8140074"
        }
      ],
      "digest": "sha256:888d082db578e1a312177641a6ef9dc2d99fb3c547124ebeab4bfa4aa46abf57"
    }
  }
}
