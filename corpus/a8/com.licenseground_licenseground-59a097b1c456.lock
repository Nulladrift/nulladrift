        },
        {
          "name": "get_registry_status",
          "description": "\n    Check the system health, cache performance statistics, and multi-state registry connectivity.\n\n    Returns:\n        JSON object with cache hit/miss counts, total records cached, and connector status for CA, FL, TX, NY, MA, IL, AZ.\n    ",
          "inputSchema": {
