      "instructions": "Official machine-readable regulatory ground truth verification for AI agents. Verifies professional trade licenses, active board standing, disciplinary citations, workers' compensation insurance, and surety bonds across California (CSLB), Florida (DBPR), Texas (TDLR), New York (NYC DOB), Massachusetts (CSL), Illinois (Chicago DOB), and Arizona (ROC), as well as Federal SAM.gov debarment and OSHA safety violation audits.",
      "tools": [
        {
          "name": "audit_osha_safety",
          "description": "\n    Audit contractor worksite safety history against the OSHA inspection and enforcement database.\n    Evaluates willful safety violations, repeat fall protection citations, and cumulative penalties.\n\n    Args:\n        entity_name: Official business or entity name to evaluate.\n    ",
          "inputSchema": {
            "properties": {
              "entity_name": {
                "title": "Entity Name",
                "type": "string"
              }
            },
            "required": ["entity_name"],
            "title": "audit_osha_safetyArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "additionalProperties": true,
                "title": "Result",
                "type": "object"
              }
            },
            "required": ["result"],
            "title": "audit_osha_safetyOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:68235abb138883e8e1c278862f354144c49f582568e70ca59631800d606c4470"
        },
        {
          "name": "check_compliance_risk",
          "description": "\n    Perform an automated compliance and liability risk assessment for autonomous onboarding, hiring, or payments.\n\n    Args:\n        state: Two-letter US state code ('CA', 'FL', or 'TX'). Required.\n        entity_name: Company name or DBA to assess.\n        license_number: State license number to assess.\n        trade: Trade category: 'roofing', 'hvac', 'electrical', 'plumbing', 'general_contractor', or 'any'.\n        require_workers_comp: If true, fails compliance if no verified workers' comp policy is active on file.\n        require_surety_bond: If true, fails compliance if contractor bond is inactive or missing.\n        max_disciplinary_actions: Maximum allowed board citations or disciplinary orders (default 0).\n        min_confidence_score: Minimum entity name match confidence threshold (0.0 to 1.0, default 0.85).\n\n    Returns:\n        JSON with 'can_hire' boolean, 'risk_level' ('LOW', 'MEDIUM', 'HIGH', 'CRITICAL'),\n        'risk_score' (0.0 to 100.0), specific 'flags', and the full underlying verification result.\n    ",
          "inputSchema": {
            "properties": {
              "entity_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Entity Name"
              },
              "license_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "License Number"
              },
              "max_disciplinary_actions": {
                "default": 0,
                "title": "Max Disciplinary Actions",
                "type": "integer"
              },
              "min_confidence_score": {
                "default": 0.85,
                "title": "Min Confidence Score",
                "type": "number"
              },
              "require_surety_bond": {
                "default": true,
                "title": "Require Surety Bond",
                "type": "boolean"
              },
              "require_workers_comp": {
                "default": true,
                "title": "Require Workers Comp",
                "type": "boolean"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "trade": {
                "default": "any",
                "title": "Trade",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "check_compliance_riskArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "additionalProperties": true,
                "title": "Result",
                "type": "object"
              }
            },
            "required": ["result"],
            "title": "check_compliance_riskOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a214507e4b55d694ae0fc60f7e9e8b1723c4a86f5b826bfa5d6e19d11342e66f"
        },
        {
          "name": "check_federal_debarment",
          "description": "\n    Check if a contractor is actively debarred or suspended on the federal SAM.gov Excluded Parties List System (EPLS).\n    Crucial for public contracts, infrastructure, and enterprise B2B compliance.\n\n    Args:\n        entity_name: Official business or entity name to evaluate against federal sanctions.\n    ",
          "inputSchema": {
            "properties": {
              "entity_name": {
                "title": "Entity Name",
                "type": "string"
              }
            },
            "required": ["entity_name"],
            "title": "check_federal_debarmentArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "additionalProperties": true,
                "title": "Result",
                "type": "object"
              }
            },
            "required": ["result"],
            "title": "check_federal_debarmentOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
