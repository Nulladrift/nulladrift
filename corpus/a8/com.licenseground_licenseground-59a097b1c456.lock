          "digest": "sha256:bd82acd90edb8ed13af71829439d25600935264be800c0357d3f3355a0ca526a"
        },
        {
          "name": "search_contractors",
          "description": "\n    Discover active, verified trade contractors in California, Florida, or Texas by trade classification and location.\n\n    Args:\n        state: Two-letter US state code ('CA', 'FL', or 'TX'). Required.\n        trade: Trade category ('roofing', 'hvac', 'electrical', 'plumbing', 'general_contractor'). Required.\n        city: Optional city to filter contractors by location.\n        limit: Maximum number of contractors to return (1 to 50, default 10).\n\n    Returns:\n        JSON list of verified contractors with active licenses, phone numbers, and addresses.\n    ",
          "inputSchema": {
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "City"
              },
              "limit": {
                "default": 10,
                "title": "Limit",
                "type": "integer"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "trade": {
                "title": "Trade",
                "type": "string"
              }
            },
            "required": ["state", "trade"],
            "title": "search_contractorsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "additionalProperties": true,
                "title": "Result",
                "type": "object"
              }
            },
            "required": ["result"],
            "title": "search_contractorsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e9081f4c699e0e2fe3a45e30e9ff5012127ec535e6aa7acb0c377e59514f85f"
        },
        {
          "name": "verify_license",
          "description": "\n    Verify an entity's trade contractor license against the official state licensing board (CSLB, DBPR, or TDLR).\n\n    Args:\n        state: Two-letter US state code ('CA', 'FL', or 'TX'). Required.\n        entity_name: The company name, DBA, or contractor name to verify (e.g. 'Apex Roofing LLC').\n        license_number: The official state license or certificate ID (e.g. '1058291', 'CCC1330999', 'TACLA29188C').\n        trade: Trade category: 'roofing', 'hvac', 'electrical', 'plumbing', 'general_contractor', or 'any'. Default is 'any'.\n        city: Optional city to filter geographic disambiguation.\n\n    Returns:\n        Deterministic, machine-actionable JSON containing verification status, canonical name,\n        active standing, disciplinary action count, workers' compensation status, bond status, and confidence score.\n    ",
          "inputSchema": {
            "properties": {
              "city": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "City"
              },
              "entity_name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Entity Name"
              },
              "license_number": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "License Number"
              },
              "state": {
                "title": "State",
                "type": "string"
              },
              "trade": {
                "default": "any",
                "title": "Trade",
                "type": "string"
              }
            },
            "required": ["state"],
            "title": "verify_licenseArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "additionalProperties": true,
                "title": "Result",
                "type": "object"
              }
            },
