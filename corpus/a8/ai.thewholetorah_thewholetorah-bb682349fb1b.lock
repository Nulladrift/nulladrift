      "instructions": "Torah lessons in six languages with audio, from TheWholeTorah.ai. Answers and excerpts are grounded in this site's own lessons and the classical texts they teach. Always keep the links when quoting, so readers can reach the full lesson. Closed on Shabbat.",
      "tools": [
        {
          "name": "ask",
          "title": "Ask a grounded Torah question",
          "description": "Ask a question and get an answer grounded ONLY in TheWholeTorah.ai's own lessons and sources, with citations. It will say when it does not know rather than guess. Prefer this for 'what does X say about Y' questions.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Answer language: en, he, es, fr, ru, yi. Default en.",
                "type": "string"
              },
              "question": {
                "description": "The question, in any language.",
                "type": "string"
              }
            },
            "required": ["question"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Ask a grounded Torah question"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f3f67dc957b60b1a3e5f5ac5e64d02e143126536e305eee67aa382d555a8a9bd"
        },
        {
          "name": "get_audio",
          "title": "Get lesson audio",
          "description": "Narration links for a lesson by slug: one MP3 URL per language that has a published recording, so the lesson can be listened to, not just read.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "The lesson slug (from search_lessons or get_daily).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get lesson audio"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:034179a86617031dcc6c29d1b0d781b9961c98fb98ed9d8b538d3dcbba853c77"
        },
        {
          "name": "get_daily",
          "title": "Today's Hayom Yom",
          "description": "The Hayom Yom entry for a civil date (default: today in Jerusalem). Hayom Yom is the Rebbe's calendar of daily Chassidus teachings, one short entry per Hebrew calendar day. Note: the Jewish day begins at nightfall, so after dark the next day's entry applies.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "Civil date, YYYY-MM-DD. Default: today in Jerusalem.",
                "type": "string"
              },
              "language": {
                "description": "Entry language: en, he, es, fr, ru, yi. Default en.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Today's Hayom Yom"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:72c286bd8bd226fa49ea9272d07171c61048b142d44b51b421aa37c45cd0fd37"
        },
        {
          "name": "get_in_depth",
          "title": "Get an In Depth maamar or concept card",
          "description": "One Chassidut In Depth maamar (book + maamar slug, from list_in_depth): its parts, its concept cards, and its Lessons and Candy (short essential ideas, each with a link) when it has them. With a concept key, that card: what the term means, what it does in this maamar, and the deeper point. With lesson: n, that Lesson (written to be narrated). Each as an excerpt with a link to the page.",
          "inputSchema": {
            "properties": {
              "book": {
                "description": "The book key, e.g. 5659.",
                "type": "string"
              },
              "concept": {
                "description": "Optional: a concept key, e.g. tzimtzum.",
                "type": "string"
              },
              "language": {
                "description": "he or en (other languages get English). Default en.",
                "type": "string"
              },
              "lesson": {
                "description": "Optional: a lesson number from the maamar's list, e.g. 1 (Hebrew).",
                "type": "number"
              },
              "maamar": {
                "description": "The maamar slug, e.g. pakadeta.",
                "type": "string"
              }
            },
            "required": ["book", "maamar"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true,
            "title": "Get an In Depth maamar or concept card"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:856c3705a2385e5964272664d471fd2d0c92d4d1fa0fad0f8165f10426943866"
        },
