          "name": "get_topic",
          "title": "Get a topic",
          "description": "One topic by slug (or an alias such as 'bitul'): its name and description, the Chassidut In Depth concept cards that teach it (each with its link), the closest passages in Sefer HaMaamarim (book, page, a short excerpt), and its most central lessons with links.",
          "inputSchema": {
            "properties": {
              "language": {
