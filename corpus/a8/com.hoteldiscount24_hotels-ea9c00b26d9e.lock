ouse", "pets-allowed", "picnic-area", "playground", "pool", "pool-towels", "pool-view", "port-shuttle", "private-bathroom", "private-check-in", "private-entrance", "radio", "reception", "restaurant", "river-view", "room-connecting", "room-dining-area", "room-fan", "room-onsen", "room-pillow-menu", "room-pool", "room-sauna", "room-service", "room-shared-bathroom", "room-view", "room-whirlpool", "safe", "safe-deposit-box", "sailing", "sauna", "sea-view", "security-staff", "shared-kitchen", "sheikh-zayed-view", "shoe-shine", "shop", "shopping-shuttle", "shower", "shuttle", "ski", "ski-rental", "ski-school", "ski-shuttle", "ski-storage", "slippers", "smoking", "snack-bar", "snorkelling", "snowmobile-rental", "solarium", "soundproofing", "spa", "squash", "street-view", "sunrise-view", "sunset-view", "table-tennis", "taxi-service", "telephone", "tennis", "tent-room", "terrace", "theatre", "ticket-service", "toiletries", "towels", "train-station-shuttle", "treehouse", "trouser-press", "tv", "vending-machine", "vip-amenities", "wake-up-service", "wardrobe", "washbasin", "water-fun", "water-sports", "water-view", "whirlpool", "wifi", "windsurfing", "wine-cellar", "yoga"],
                  "type": "string"
