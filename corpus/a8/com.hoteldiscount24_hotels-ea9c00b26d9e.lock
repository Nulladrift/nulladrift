            "readOnly": true
          },
          "digest": "sha256:4772a5df84440e6730ec6a72c2ac5e5ed45b9abb36d9cd6cef4122482296ee76"
        },
        {
          "name": "search_hotels",
          "title": "Hotels with specific amenities",
          "description": "Use when the user wants hotels at a place with specific features (pool, sauna, pets allowed …). All given amenities must match, as stated by the hotels; with few or no results, try fewer amenities. Returns up to 10 hotels with links, ordered by star rating — no prices (see get_price_guide) and no ratings. A notice field carries a condition the user should know (e.g. pets are decided case by case). Halal, kosher, wheelchair access, non-smoking and cribs are not search filters — check them per hotel with get_hotel_facts.",
          "inputSchema": {
            "additionalProperties": false,
