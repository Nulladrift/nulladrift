{
  "lockfileVersion": 2,
  "subjects": {
    "com.hoteldiscount24/hotels": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.hoteldiscount24.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "hoteldiscount24",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Hotel amenities as stated by the hotels, and typical nightly price ranges, for destinations worldwide (answers in German, English or Turkish). find_place turns a city or region name into a place_id; search_hotels lists hotels there with given amenities; get_hotel_facts returns the amenity profile of one hotel (by URL, or by name plus place_id); get_price_guide returns a typical price range. Every result carries a hoteldiscount24.com link; live prices, availability and booking are not part of this connector — they are on hoteldiscount24.com.",
      "tools": [
        {
          "name": "find_place",
          "title": "Find a destination",
          "description": "Use when a city, region or island name has to be turned into a place_id (needed by search_hotels, get_hotel_facts and get_price_guide): returns up to 5 matching places with place_id and country. A misspelled name returns the likely places; the match field says whether a place is exact, partial or fuzzy. If several fit, choose by country or ask the user.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "The user's language: de, en or tr (default en).",
                "enum": ["de", "en", "tr"],
                "type": "string"
              },
              "query": {
                "description": "City, region or island name, in any language.",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "note": {
                "type": "string"
              },
              "places": {
                "items": {
                  "properties": {
                    "country_code": {
                      "type": "string"
                    },
                    "kind": {
                      "type": "string"
                    },
                    "match": {
                      "enum": ["exact", "partial", "fuzzy"],
                      "type": "string"
                    },
                    "name": {
                      "type": "string"
                    },
                    "place_id": {
                      "type": "integer"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "response_date": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "website": {
                "type": "string"
              }
            },
            "required": ["places"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a destination"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:16d65130ec812c8be26c14789e747a8eacdbd7efe1b766a64a935ddc9ba325c5"
        },
        {
          "name": "get_hotel_facts",
          "title": "Amenity profile of a hotel",
          "description": "Use when the user asks what one specific hotel offers (e.g. does it allow pets, is there a sauna, halal food). Returns its amenities as stated by the hotel, with section and origin; extra_charge marks a stated surcharge (no mark means no information, not free). Identify the hotel by its hoteldiscount24.com URL (e.g. from search_hotels), or by name plus place_id; other_matches lists similar names at that place.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "hotel": {
                "description": "hoteldiscount24.com hotel URL or slug.",
                "maxLength": 300,
                "type": "string"
              },
              "language": {
                "description": "The user's language: de, en or tr (default en).",
                "enum": ["de", "en", "tr"],
                "type": "string"
              },
              "name": {
                "description": "Hotel name, if no URL is known (needs place_id).",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "place_id": {
                "description": "place_id from find_place.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "amenities": {
                "type": "array"
              },
              "city": {
                "type": "string"
              },
              "country_code": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "notice": {
                "type": "string"
              },
              "other_matches": {
                "type": "array"
              },
              "response_date": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "stars": {
                "description": "Star category as listed by the hotel.",
                "type": ["integer", "null"]
              },
              "summary": {
                "type": "string"
              },
              "url": {
                "type": "string"
              },
              "website": {
                "type": "string"
              }
            },
            "required": ["amenities", "name", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Amenity profile of a hotel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d3ef3997cbb457786e2a421694e6e4c123fb2b435a9014eb76210a820042cdb"
        },
        {
          "name": "get_price_guide",
          "title": "Typical nightly price range",
          "description": "Use for budget questions (what does a night cost in …): typical price range per night (2 adults) at a place, measured from recent searches, with date. For orientation only — current prices for specific dates are on hoteldiscount24.com. has_price_data=false means no reliable data for this place and month.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "The user's language: de, en or tr (default en).",
                "enum": ["de", "en", "tr"],
                "type": "string"
              },
              "month": {
                "description": "Travel month YYYY-MM (default: current month).",
                "pattern": "^[0-9]{4}-[0-9]{2}$",
                "type": "string"
              },
              "place_id": {
                "description": "place_id from find_place.",
                "type": "integer"
              },
              "stars": {
                "description": "Star category (default any).",
                "enum": ["any", "1", "2", "3", "4", "5"],
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "has_price_data": {
                "type": "boolean"
              },
              "month": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "place": {
                "properties": {
                  "country_code": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "place_id": {
                    "type": "integer"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "response_date": {
                "type": "string"
              },
              "sentence": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "typical_eur": {
                "type": "integer"
              },
              "typical_high_eur": {
                "type": "integer"
              },
              "typical_low_eur": {
                "type": "integer"
              },
              "website": {
                "type": "string"
              }
            },
            "required": ["has_price_data", "place"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Typical nightly price range"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:69baecbf599e6f3cce1f60641fc8c4d31bb3f2f124a9a517a38381b3e14f8fc2"
        },
        {
          "name": "get_travel_knowledge",
          "title": "Checked travel knowledge for a destination",
          "description": "Use when the user asks about the destination itself rather than a hotel, e.g. the best time to travel or the climate per season: hoteldiscount24's checked travel knowledge for the place, the same text Mercan uses in its chat. has_knowledge=false means there is no checked text for this place and topic — say so, do not guess.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "language": {
                "description": "The user's language: de, en or tr (default en).",
                "enum": ["de", "en", "tr"],
                "type": "string"
              },
              "place_id": {
                "description": "place_id from find_place.",
                "type": "integer"
              },
              "topic": {
                "description": "Topic: anreise = Getting there & around; ausfluege = Day trips & activities; einkaufen = Shopping & markets; essen = Food & drink; feste = Festivals & events; gut_zu_wissen = Good to know; kunst_kultur = Art & culture; nachtleben = Nightlife & going out; reisezeit = Best time to travel & climate; stadtteile = Neighbourhoods & where to stay; strand = Beaches & swimming; wintersport = Winter sports.",
                "enum": ["anreise", "ausfluege", "einkaufen", "essen", "feste", "gut_zu_wissen", "kunst_kultur", "nachtleben", "reisezeit", "stadtteile", "strand", "wintersport"],
                "type": "string"
              }
            },
            "required": ["place_id", "topic"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "has_knowledge": {
                "type": "boolean"
              },
              "note": {
                "type": "string"
              },
              "place": {
                "properties": {
                  "country_code": {
                    "type": "string"
                  },
                  "name": {
                    "type": "string"
                  },
                  "place_id": {
                    "type": "integer"
                  },
                  "url": {
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "response_date": {
                "type": "string"
              },
              "scope": {
                "enum": ["place", "region_or_country"],
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "topic": {
                "type": "string"
              },
              "website": {
                "type": "string"
              }
            },
            "required": ["has_knowledge", "place", "topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Checked travel knowledge for a destination"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
