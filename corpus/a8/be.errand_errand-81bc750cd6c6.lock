{
  "lockfileVersion": 2,
  "subjects": {
    "be.errand/errand": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://errand.be/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "errand",
        "version": "0.2.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Errand is a physical-world execution layer for AI agents in Seoul (Gangnam beta). Use it when a user needs eyes, hands, or physical presence at a real place: on-site verification, store/shelf/price/open-hours checks, photos, queue checks or holding, and pickups. Do not use Errand for purely digital tasks. Safe flow: list_capabilities → check_coverage → quote → present total_charge_krw and obtain explicit user confirmation → dispatch → poll get_status → get_result. Rewards are KRW; dispatch escrows reward plus platform fee, and failure/expiry/pre-acceptance cancellation refunds in full. Never call errand_dispatch when quote.can_dispatch is false. Account caps are pre-approved boundaries; a cap violation means the owner must raise it, not that you should retry.",
      "tools": [
        {
          "name": "errand_cancel",
          "title": "Cancel Human Dispatch",
          "description": "Cancel a real-world human dispatch while it is still open and refund the escrow in full. Fails once a worker has accepted and may already be traveling.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dispatch_id": {
                "description": "Id returned by errand_dispatch.",
                "type": "string"
              }
            },
            "required": ["dispatch_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:a24041c9d11769b6b5e79886433a37b0f3d0f5fe342cc8579f0f2b8bd6cf1b4d"
        },
        {
          "name": "errand_check_coverage",
          "title": "Check Local Human Coverage",
          "description": "Check whether a nearby human can be dispatched to a physical location before spending. Returns reachable_workers (switched on, seen within 24h — these get the push) and online_workers (app open this minute). Use for on-site or store checks, photos, queues, pickups, and other real-world tasks when you need current human availability.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "type": "number"
              },
              "lng": {
                "type": "number"
              },
              "radius_m": {
                "description": "Default 3000.",
                "maximum": 10000,
                "minimum": 100,
                "type": "integer"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c6eb06a2a1022b3e1950c7c51b15371defe0e8911f94bb401423e7ebbf4d8ee"
        },
        {
          "name": "errand_dispatch",
          "title": "Dispatch Human to Physical Location",
          "description": "Send a nearby real human to a physical location for on-site verification, store/shelf/price checks, photos, queue checks or holding, or a pickup. This spends money and creates a real-world action: call errand_quote first, present its exact total_charge_krw, and obtain explicit user confirmation. The worker travels to the site, completes the instructions, and submits GPS/time-verified in-app evidence. Completed tasks pay the worker; failed, expired, or pre-acceptance cancelled tasks refund escrow.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address_hint": {
                "description": "Human-readable place name/address shown to the worker.",
                "type": "string"
              },
              "expires_in_minutes": {
                "maximum": 1440,
                "minimum": 10,
                "type": "integer"
              },
              "instructions": {
                "description": "Exactly what the worker should do on site, in the worker's language.",
                "type": "string"
              },
              "lat": {
                "type": "number"
              },
              "lng": {
                "type": "number"
              },
              "radius_m": {
                "description": "Dispatch radius for worker matching.",
                "maximum": 10000,
                "minimum": 100,
                "type": "integer"
              },
              "report_fields": {
                "description": "Structured values the worker must report from the site (e.g. how many people are waiting). Returned in the result and included in the webhook.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "key": {
                      "pattern": "^[a-z][a-z0-9_]{0,39}$",
                      "type": "string"
                    },
                    "label": {
                      "description": "Worker-facing prompt in Korean, e.g. \"현재 대기 인원\".",
                      "type": "string"
                    },
                    "placeholder": {
                      "description": "Example answer shown in the empty field, e.g. \"약 40\".",
                      "type": "string"
                    },
                    "type": {
                      "enum": ["text", "number"],
                      "type": "string"
                    },
                    "unit": {
                      "description": "Unit shown beside the label, e.g. \"명\" or \"분\". Set it whenever the answer is a quantity: without it a worker asked for \"예상 대기 시간\" may reply \"11\" and you cannot tell minutes from people.",
                      "type": "string"
                    }
                  },
                  "required": ["key", "label", "type"],
                  "type": "object"
                },
                "maxItems": 5,
                "type": "array"
              },
              "reward_krw": {
                "maximum": 200000,
                "minimum": 1000,
                "type": "integer"
              },
              "task_type": {
                "enum": ["verify", "photograph", "pickup", "queue", "check"],
                "type": "string"
              },
              "title": {
                "description": "Short worker-facing title, e.g. \"성수동 XYZ 팝업 대기줄 확인\".",
                "type": "string"
              },
              "validation_criteria": {
                "description": "What the photos must show for the evidence to pass, e.g. \"매장 입구와 대기줄 전체가 한 프레임에 보여야 함\".",
                "type": "string"
              },
              "webhook_url": {
                "description": "HTTPS URL that receives mission.completed / mission.failed / mission.cancelled / mission.expired events, so you do not have to poll. Payload is advisory — confirm via errand_get_result.",
                "type": "string"
              }
            },
            "required": ["expires_in_minutes", "instructions", "lat", "lng", "radius_m", "reward_krw", "task_type", "title", "validation_criteria"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de870c10a7c3bae9097032d3cf87db66431f51b7deb9cbc5049763098c58d685"
        },
        {
          "name": "errand_get_result",
          "title": "Get Verified On-Site Result",
          "description": "Retrieve the verified on-site result from a human task: pass/fail verdict, score and feedback, signed photo URLs, structured answers, and evidence provenance including GPS distance, capture time, and server checks. Also returns share_url: a read-only result page (valid 30 days, no login) you can send to the person who asked for the check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dispatch_id": {
                "description": "Id returned by errand_dispatch.",
                "type": "string"
              }
            },
            "required": ["dispatch_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f99e2a90a7a40e0e89ed3e8a583c9bbdd8a1571702d41ccf781a0c56ed4917e6"
        },
        {
          "name": "errand_get_status",
          "title": "Get Human Task Status",
          "description": "Track a previously dispatched local human task: open · accepted · arrived · submitted · completed · failed · cancelled · expired, plus its event timeline. Use after errand_dispatch while the person is traveling or working on site.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dispatch_id": {
                "description": "Id returned by errand_dispatch.",
                "type": "string"
              }
            },
            "required": ["dispatch_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4c52fa30c90d9598b53307d0dcff0d156e2dc0c523e3740fc166fa190ceccf2e"
        },
        {
          "name": "errand_list_capabilities",
          "title": "Errand Capabilities",
          "description": "Use before a local-human or physical-world task to see what Errand can do for this account: supported on-site task types (check, verify, photograph, queue, pickup), spend caps, allowed area, KRW balance, and pricing. Read-only.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8245367009119ad198e775b889af06c669ae1770da8a1971a63ed3b5a49365b6"
        },
        {
          "name": "errand_quote",
          "title": "Quote Real-World Human Task",
          "description": "Get the exact read-only quote for sending a human to a real-world location for a check, verification, photo, queue task, or pickup. Validates account caps, live worker coverage, and balance; returns reward_krw, platform_fee_krw, and exact total_charge_krw. Present that total to the user and obtain explicit confirmation before errand_dispatch.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "type": "number"
              },
              "lng": {
                "type": "number"
              },
              "radius_m": {
                "description": "Default 3000.",
                "maximum": 10000,
                "minimum": 100,
                "type": "integer"
              },
              "reward_krw": {
                "maximum": 200000,
                "minimum": 1000,
                "type": "integer"
              },
              "task_type": {
                "enum": ["verify", "photograph", "pickup", "queue", "check"],
                "type": "string"
              }
            },
            "required": ["lat", "lng", "reward_krw", "task_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:772ad52ba08aad8f79bf977e35f19107e9b55682706d8ac03e378595913ee6bb"
        }
      ],
      "digest": "sha256:52e47aed2af29b7a7d5e2df8cdf69cf21121766ea06ae42f7b697c6dc236a7d7"
    }
  }
}
