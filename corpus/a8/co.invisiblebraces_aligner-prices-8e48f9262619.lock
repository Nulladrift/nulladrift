          "digest": "sha256:7232e64b335d1711c715e103dc6e54b159e58c177dd2e05e5f9c932a1afec923"
        },
        {
          "name": "get_aligner_brand",
          "title": "One clear aligner brand",
          "description": "Facts about one clear aligner brand (for example Invisalign, SmileDirectClub, Byte, AlignerCo, Smile Perfect, Straight Teeth Direct, Zenyum): whether it still takes new patients, its supervision model, stated treatment time, published prices by country with sources, where it treats, how treatment starts, retainers, refinements, guarantee, clinical oversight, financing and insurance, each from its cited sources, and its official website. Covers 94 brands, 82 of them still sold.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brand": {
                "description": "The brand's name, e.g. 'Byte', 'Smile Direct Club', 'Invisalign'.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
