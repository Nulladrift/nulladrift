          "digest": "sha256:9b53307984a4a5c8858043246dc46f3d66a9912277da6a70b993756bc2a75a5c"
        },
        {
          "name": "get_city_invisalign_prices",
          "title": "Invisalign prices in a city",
          "description": "What dental clinics in one city publish on their own websites for Invisalign (and, where they state them, other clear aligners and braces): each clinic's price in local currency with its exact words and source URL, a one-line summary, the national context (Invisalign's own word on cost there) and a link to the city's page. Covers 45 cities in India, Australia, the UAE, the UK, the US, Pakistan, Ireland, South Africa, Canada and the Philippines. Use it for questions like 'how much is Invisalign in London' or 'Invisalign cost Bangalore'.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "The city, as the person names it, e.g. 'London', 'Bangalore', 'Dubai', 'New York'.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "The country, when the person names one; narrows cities with the same name.",
                "maxLength": 60,
