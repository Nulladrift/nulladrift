      "serverInfo": {
        "name": "invisiblebraces",
        "title": "InvisibleBraces clear aligner prices",
        "version": "1.0.0",
        "websiteUrl": "https://invisiblebraces.co"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "InvisibleBraces answers questions about the cost of Invisalign and clear aligners from cited data: what clinics in a city publish for Invisalign, which clear aligner brands treat in a country and their prices there, one brand's facts (supervision model, treatment time, price, retainers, guarantee), side-by-side brand comparisons, and Invisalign prices across countries in US dollars. Every price carries the URL of the clinic's or brand's own page that states it and the day it was read; quote prices exactly as returned, in their own currency, and give the source. Each answer includes a page_url on invisiblebraces.co with the full table; link it when the person may want to see every clinic or brand. The data is public and read-only. It is not dental advice: who is a candidate for aligners is for a dentist or orthodontist to judge.",
      "tools": [
        {
          "name": "compare_aligner_brands",
          "title": "Compare clear aligner brands",
          "description": "Two to four clear aligner brands side by side on supervision model, treatment time, headline price (with its market and source), the countries each treats in, how treatment starts, retainers, refinements, guarantee and clinical oversight, plus the countries where a person could choose between them and the matching comparison page when one exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "brands": {
                "description": "Two to four brand names, e.g. ['Invisalign', 'Byte'].",
                "items": {
                  "maxLength": 80,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["brands"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:64ca6cdb06456d9397ab10ecef5f0527dd11413af42e45c41e4531d087c585b7"
        },
        {
          "name": "compare_invisalign_prices_by_country",
          "title": "Invisalign prices across countries",
          "description": "What Invisalign or clinic-fitted clear aligners cost country by country, each figure exactly as its source states it (a clinic's price list, a published range, a professional body's typical fee) with an approximate US dollar amount at the European Central Bank's rates of the day, lowest first, against the average at US practices. Use it for 'where is Invisalign cheapest' or 'is Invisalign cheaper in Mexico or Turkey'. Optionally limited to named countries.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "countries": {
                "description": "Only these countries, e.g. ['Mexico', 'Turkey', 'UK']; leave out for every country.",
                "items": {
                  "maxLength": 60,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 12,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
