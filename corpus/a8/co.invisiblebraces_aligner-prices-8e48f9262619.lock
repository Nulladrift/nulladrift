        },
        {
          "name": "list_aligner_brands_in_country",
          "title": "Clear aligner brands in a country",
          "description": "The clear aligner brands that take new patients in one country, with each brand's published prices for that country (in its currency, with source URL and the day each was read) and its supervision model (at-home remote review, hybrid, dentist-led, or in-office systems such as Invisalign fitted by a practice), lowest stated price first, plus the cities in that country with clinic price pages. Covers the US and 27 other countries, including the UK, Ireland, Canada, Australia, New Zealand, India, Pakistan, the UAE, Saudi Arabia, Singapore, Malaysia, the Philippines, South Africa, Mexico and Turkey.",
          "inputSchema": {
