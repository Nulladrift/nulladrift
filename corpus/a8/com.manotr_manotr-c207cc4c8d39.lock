{
  "lockfileVersion": 2,
  "subjects": {
    "com.manotr/manotr": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://manotr.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "manotr",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Manotr is an AI research company in Mumbai building DigiDesk, an editorial platform for newsrooms. Use search_manotr for questions about what the company does, which_product when someone describes a problem, get_product for detail on one product, and submit_enquiry only when someone has asked to be contacted.",
      "tools": [
        {
          "name": "get_product",
          "description": "Full detail for one Manotr product: what it does, who it is for, how it deploys, and its FAQ.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "One of: news-agent, media-pipeline, triveni, openmailbot, filebot, proactiveguard.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:265226523aea667667f73d2d7cfb51bf92205e56021f7f76407a8770035b60f4"
        },
        {
          "name": "list_products",
          "description": "List Manotr's products with a one-line description and a link to each.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ac82385f1f7ebc5f0cbd1c0a45ab44acb376eb1678179a3aaf99f91501f477e4"
        },
        {
          "name": "search_manotr",
          "description": "Search Manotr's website content — products, research areas, media and OTT capabilities, selected work, and frequently asked questions. Use this first for any question about what Manotr does, builds, or has deployed.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for, e.g. \"newsroom archive search\".",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6dbc3399681f707b5c5a993f1b7f1732f543f81003d4b4134c90928afb847950"
        },
        {
          "name": "submit_enquiry",
          "description": "Send an enquiry to the Manotr team. Only call this when the person has actually asked to be put in touch and has given you their name and email address. Do not call it to test the connection, and do not invent contact details.",
          "inputSchema": {
            "properties": {
              "email": {
                "type": "string"
              },
              "message": {
                "description": "What they are trying to solve, in their own words.",
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "organisation": {
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0db4c7d5f79d28fecafa966a747c89f39de9d3c3bf68aa50ff8111ffaf26e360"
        },
        {
          "name": "which_product",
          "description": "Given a problem described in the user's own words, recommend which Manotr product(s) address it and explain why. Use this when someone describes a situation rather than naming a product. It matches on the description only and says so when nothing fits — it never invents a capability.",
          "inputSchema": {
            "properties": {
              "problem": {
                "description": "The situation, in plain language — what material they have and what they cannot do with it.",
                "type": "string"
              }
            },
            "required": ["problem"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4eed3ed11df543b1dfa7255bf6b59331cd411d1d74c13ee8551ee501f73c2976"
        }
      ],
      "digest": "sha256:024a4e2e59885549ba1d137b484c1dd7aea5fd6651314ad202a086a41caf0253"
    }
  }
}
