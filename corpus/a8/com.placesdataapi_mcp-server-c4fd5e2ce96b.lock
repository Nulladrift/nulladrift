{
  "lockfileVersion": 2,
  "subjects": {
    "com.placesdataapi/mcp-server": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.placesdataapi.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "placesdataapi-mcp-server",
        "title": "PlacesData API — Local Business Places, Reviews & Contact Enrichment MCP Server",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Query 200M+ local business places, E.164 phone numbers, verified customer reviews, storefront photos, coordinates, and public contact emails. Handshake and tools/list are free; pass x-api-key (PLACESDATAAPI_KEY) for tools/call. Claim $1.20 (12,000 free credits, no card required) at https://placesdataapi.com/signup.",
      "tools": [
        {
          "name": "geocode_reverse",
          "title": "Reverse Geocode GPS Coordinates to Address & Place ID",
          "description": "Convert raw GPS latitude and longitude coordinates into structured street addresses, Plus Codes, neighborhoods, and Google Place IDs. Cost: 5 Credits / call.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Optional ISO 639-1 language code.",
                "type": "string"
              },
              "lat": {
                "description": "Latitude (-90 to 90).",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "description": "Longitude (-180 to 180).",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:2353f7af5e4c0103daba6aedb9399cc52e77bb5ff6bc00eac0f5e9827f57875f"
        },
        {
          "name": "leads_enrich",
          "title": "Enrich Business Website Domain with B2B Emails & Social Links",
          "description": "Crawl a local business website domain in real time to extract public B2B email addresses, phone numbers, and LinkedIn, Instagram, Facebook, X/Twitter, YouTube, and TikTok profile URLs. Cost: 20 Credits when emails or social links are found (0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "Business domain or website URL, e.g. \"austindentalspa.com\" or \"https://houndstoothcoffee.com\".",
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d4a41cf4b61cfdf37e99f54041440e16e791413b3eda9a2098983c1b7d26572c"
        },
        {
          "name": "places_autocomplete",
          "title": "Google Maps Place & Address Autocomplete",
          "description": "Real-time typeahead place and street address predictions with optional coordinate and country biasing. Cost: 5 Credits / call (0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Optional ISO 639-1 language code.",
                "type": "string"
              },
              "lat": {
                "description": "Optional latitude bias.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "lng": {
                "description": "Optional longitude bias.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "q": {
                "description": "Partial place name or street address input.",
                "type": "string"
              },
              "region": {
                "default": "us",
                "description": "Optional ISO 3166-1 alpha-2 country code.",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c84379523179ba8daf5953d0bedcc0dce5ffaa103a15233ceb3e0aeb33edc4be"
        },
        {
          "name": "places_details",
          "title": "Get Full Google Business Profile Details",
          "description": "Retrieve the complete Google Business Profile by place_id, cid, or hex google_id including 1–5 star rating distribution, E.164 phone, website, categories, weekly work hours, and coordinates. Cost: 20 Credits / place (+20 if enrich_contacts=true and contacts found).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "enrich_contacts": {
                "default": false,
                "description": "If true, also crawls the business website domain for B2B emails and social links.",
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "ISO 639-1 language code.",
                "type": "string"
              },
              "place_id": {
                "description": "Google Maps Place ID (e.g. \"ChIJ...\"), numeric CID, or hex feature ID (\"0x...:0x...\").",
                "type": "string"
              },
              "region": {
                "default": "us",
                "description": "ISO 3166-1 alpha-2 country code.",
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bd0b45b5ced74492749697e8391be110a2107b5e6a82d1398613a2cb32b6cdf4"
        },
        {
          "name": "places_nearby",
          "title": "Discover Nearby Businesses by GPS Coordinates",
          "description": "Discover Google Maps businesses inside a geographic viewport around exact GPS coordinates (lat, lng, zoom). Cost: 5 Credits / place returned (0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lat": {
                "description": "Latitude (-90 to 90), e.g. 30.2672.",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 20,
                "description": "Maximum places to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "description": "Longitude (-180 to 180), e.g. -97.7431.",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "q": {
                "description": "Optional category or keyword filter, e.g. \"plumber\" or \"coffee\".",
                "type": "string"
              },
              "zoom": {
                "default": 14,
                "description": "Map zoom level (3–21, default 14).",
                "maximum": 21,
                "minimum": 3,
                "type": "number"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4458386e2da5174f663a8fb0d537f64477669e0bee45868da4199ce98fb11e9f"
        },
        {
          "name": "places_photos",
          "title": "Fetch Business Storefront, Interior & Menu Photos",
          "description": "Retrieve high-resolution storefront, interior, and menu photo URLs and dimensions for any Google Maps place. Cost: 2 Credits / photo returned (0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 20,
                "description": "Maximum photos to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "place_id": {
                "description": "Google Maps Place ID (\"ChIJ...\"), CID, or hex feature ID.",
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:bddd104eac73a3394f4d63107c1f1bba4f66bf4c69a1b0b6af6ae543153ad8f1"
        },
        {
          "name": "places_reviews",
          "title": "Extract Verified Google Maps Customer Reviews",
          "description": "Extract verified customer reviews for any Google Maps business sorted by newest, most_relevant, highest_rating, or lowest_rating, including reviewer profile, star rating, text, owner reply, and review photos. Cost: 2 Credits / review returned ($0.08–$0.20/1K reviews; 0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "ISO 639-1 language code.",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Number of reviews to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset (>= 0).",
                "minimum": 0,
                "type": "integer"
              },
              "place_id": {
                "description": "Google Maps Place ID (\"ChIJ...\"), CID, or hex feature ID.",
                "type": "string"
              },
              "sort": {
                "default": "newest",
                "description": "Review sort order.",
                "enum": ["newest", "most_relevant", "highest_rating", "lowest_rating"],
                "type": "string"
              }
            },
            "required": ["place_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:100b4869df50b6234805e62d0aac162864b6b5dbbb3a3055fb60af22f598a5e1"
        },
        {
          "name": "places_search",
          "title": "Search Google Maps Local Businesses",
          "description": "Search Google Maps local businesses in real time by natural-language query (e.g. \"HVAC contractors in Austin, TX\") and return ratings, review counts, E.164 phone numbers, website domains, street addresses, opening hours, Place IDs, CIDs, and GPS coordinates. Cost: 5 Credits / place returned ($0.20–$0.50/1K places; 0 Credits if empty).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "enrich_contacts": {
                "default": false,
                "description": "Set true to crawl returned business websites in real time for public B2B emails and social profiles.",
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "ISO 639-1 language code (e.g. \"en\", \"es\", \"de\").",
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum number of places to return (1–100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "description": "Pagination offset (>= 0).",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Natural-language search query, e.g. \"Specialty coffee roasters in Austin, TX\" or \"Dental clinics in Miami, FL\".",
                "type": "string"
              },
              "region": {
                "default": "us",
                "description": "ISO 3166-1 alpha-2 country/region bias (e.g. \"us\", \"gb\", \"ca\").",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:961177fd1fc0c9b3fb9883bf71ad8c34b6aef824c3848dbb4430b36c2fc39433"
        }
      ],
      "digest": "sha256:5cf48643a17ab7500d53a23463e54ccdfc171b06fc0b70753cc65575284d426a"
    }
  }
}
