      "instructions": "Use these tools for questions about how the Open Creator Graph works, not about a particular Creator (the records server at /mcp answers those). search_docs finds the passage; fetch_doc reads the page.",
      "tools": [
        {
          "name": "fetch_doc",
          "title": "Read a documentation page",
          "description": "Read one documentation page in full, as Markdown. `path` is a path search_docs returned, or one of /llms.txt, /llms-full.txt, /license.txt, /faqs/, /for-ai-and-search/, /how-we-source/, /editorial-policy/, /about-this-record/, /why-the-graph-exists/, /for-creators/, /for-agencies/, /changelog/.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
