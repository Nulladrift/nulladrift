      "instructions": "GiftRoam sends gift baskets, flowers and treats to 190+ countries; a local partner in the destination country assembles and delivers. Typical flow: search_gifts (country required) → get_gift_details → optionally check_delivery when there is a deadline → create_checkout → show the summary, get the user's explicit OK, then share the checkout link (30-minute expiry). After payment the buyer receives an order token; get_order_status accepts only that token — never guess or enumerate tokens. Ask for the destination country before searching and pass ISO-3166 alpha-2 codes (FR, not France); resolve relative dates to YYYY-MM-DD; search_gifts query is product keywords only (destination and occasion have their own fields); use check_delivery whenever the user has a deadline; reuse the same idempotency_key when retrying create_checkout. This is a guest connection: list_my_orders needs the signed-in endpoint (/mcp/account); everything else works as a guest. Never collect the recipient's name, address, phone or email in the conversation — the checkout page does that. Never promise a delivery date the tools did not confirm. Prices are final and include delivery; taxes are shown at payment.",
      "tools": [
        {
          "name": "check_delivery",
          "title": "Check delivery feasibility",
          "description": "Is delivery to a country (optionally a city, by a date, for a specific gift) feasible? Returns earliest/latest estimate and warnings (PO box, hotel, holiday window) with a suggested action.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "Destination city (used for warnings only; never store addresses in chat).",
                "maxLength": 80,
                "type": "string"
              },
              "country": {
                "description": "Destination country, ISO-3166 alpha-2.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "date_needed": {
                "description": "YYYY-MM-DD the gift must arrive by.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "gift_id": {
                "description": "Optional gift_id to use that gift's delivery window.",
                "type": "string"
              },
              "locale": {
                "description": "Language of the conversation with the user (e.g. he-IL, fr-FR). Localizes content and messages; prices and availability are unaffected.",
                "maxLength": 12,
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "business_days": {
                "properties": {
                  "max": {
                    "type": "number"
                  },
                  "min": {
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "display_text": {
                "description": "Human-readable one-line summary of the result",
                "type": "string"
              },
              "earliest": {
                "description": "ISO date of the earliest estimated delivery",
                "type": "string"
              },
              "error": {
                "description": "Present only when the call failed",
                "properties": {
                  "code": {
                    "type": "string"
                  },
                  "message": {
                    "type": "string"
                  },
                  "next_step": {
                    "type": ["string", "null"]
                  }
                },
                "type": "object"
              },
              "feasible": {
                "type": "boolean"
              },
              "latest": {
                "description": "ISO date of the latest estimated delivery",
                "type": "string"
              },
              "locale": {
                "description": "BCP-47 locale the texts are localized to",
                "type": "string"
              },
              "suggested_action": {
                "type": ["string", "null"]
              },
              "warnings": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check delivery feasibility"
          },
          "behavior": {
