      "instructions": "Tools to convert and edit documents with Clic'n Done PDF (PDF to Word that keeps the layout, merge, split, compress, OCR, redaction, PDF/A and more). Give each file as a public http(s) URL, or for small files as base64 with its name. Each tool returns a link to download the result; it is kept for about an hour and deleted ten minutes after the first download. If a job takes longer than the call, use job_status with its id. Free plan limits apply unless the request carries an API key (Authorization: Bearer).",
      "tools": [
        {
          "name": "add_page_numbers",
          "title": "Add page numbers to a PDF",
          "description": "Number the pages of your PDFs: at the bottom or top, on one side or in the centre, and from the page and number you choose. Returns a link to download the result (kept about an hour). Credits on paid plans: 5 per file.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "files": {
                "description": "Input files (.pdf). Each one is a public http(s) URL, or an object with `url`, or with `name` and `content_base64` (small files only: up to 20 MB in total).",
                "items": {
                  "anyOf": [
                    {
                      "description": "public http(s) URL of the file",
                      "type": "string"
                    },
                    {
                      "additionalProperties": false,
                      "properties": {
                        "content_base64": {
                          "description": "the file itself, base64-encoded",
                          "type": "string"
                        },
                        "name": {
                          "description": "file name with its extension, e.g. report.pdf",
                          "type": "string"
                        },
                        "url": {
                          "description": "public http(s) URL of the file",
                          "type": "string"
                        }
                      },
                      "type": "object"
                    }
                  ]
                },
                "minItems": 1,
                "type": "array"
              },
              "first": {
                "default": 1,
                "description": "Start numbering on page",
                "maximum": 100000,
                "minimum": 1,
                "type": "integer"
              },
              "format": {
                "default": "n",
                "description": "Format Values: 'n' = 1, 2, 3…; 'n-de-t' = 1 / 10; 'pagina' = Page 1 of 10",
                "enum": ["n", "n-de-t", "pagina"],
                "type": "string"
              },
              "lang": {
                "default": "es",
                "description": "Language. Language of the texts the tool adds. Values: 'es' = Spanish; 'en' = English",
                "enum": ["es", "en"],
                "type": "string"
              },
              "position": {
                "default": "abajo-centro",
                "description": "Position Values: 'abajo-centro' = Bottom centre; 'abajo-derecha' = Bottom right; 'abajo-izquierda' = Bottom left; 'arriba-centro' = Top centre; 'arriba-derecha' = Top right; 'arriba-izquierda' = Top left",
                "enum": ["abajo-centro", "abajo-derecha", "abajo-izquierda", "arriba-centro", "arriba-derecha", "arriba-izquierda"],
                "type": "string"
              },
              "start": {
                "default": 1,
                "description": "First number",
                "maximum": 100000,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Add page numbers to a PDF"
