{
  "lockfileVersion": 2,
  "subjects": {
    "com.eventmatey.mcp/event-discovery": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.eventmatey.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "eventmatey-event-discovery",
        "version": "1.0.18"
      },
      "capabilities": {
        "logging": {},
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_event_details",
          "description": "Get fuller public details for one discoverable EventMatey event, including the canonical hosted booking URL.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "event_id": {
                "description": "EventMatey event UUID",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$",
                "type": "string"
              }
            },
            "required": ["event_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4a10256f45a1ff1ffad3c8132d391b1ae4207d007f4960e3dd2d00fb79892a33"
        },
        {
          "name": "search_events_by_keyword",
          "description": "Search public EventMatey events by keyword, optional UK location text, date range, categories, and price range. Returns only published and bookable events that the organiser has enabled for AI discovery.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categories": {
                "description": "Optional category or tag filters",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "end_date": {
                "description": "Optional inclusive end date in YYYY-MM-DD format",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "keyword": {
                "description": "Keyword or phrase to search for, such as baking class or live music",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of events to return",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location_text": {
                "description": "Optional UK location hint such as Bristol, Manchester, or London",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "max_price_gbp": {
                "description": "Optional maximum price in GBP",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "min_price_gbp": {
                "description": "Optional minimum price in GBP",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "start_date": {
                "description": "Optional inclusive start date in YYYY-MM-DD format",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              }
            },
            "required": ["keyword"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8632e3b556e4d20f6116c556a59b54b8e797b2baa28bdd71210341df2d8310e1"
        },
        {
          "name": "search_events_nearby",
          "description": "Search EventMatey events by location. The current v1 implementation uses location_text plus date/category/price filters. Latitude/longitude and radius are accepted for forward compatibility but are not yet used for true distance search.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "categories": {
                "description": "Optional category or tag filters",
                "items": {
                  "maxLength": 40,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "type": "array"
              },
              "end_date": {
                "description": "Optional inclusive end date in YYYY-MM-DD format",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              },
              "latitude": {
                "description": "Optional latitude for future geo-capable search",
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "Maximum number of events to return",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "location_text": {
                "description": "Use this for the current v1 location search, such as Bristol or Leeds",
                "maxLength": 160,
                "minLength": 1,
                "type": "string"
              },
              "longitude": {
                "description": "Optional longitude for future geo-capable search",
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "max_price_gbp": {
                "description": "Optional maximum price in GBP",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "min_price_gbp": {
                "description": "Optional minimum price in GBP",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "radius_km": {
                "description": "Optional search radius in kilometres for future geo-capable search",
                "maximum": 250,
                "minimum": 1,
                "type": "number"
              },
              "start_date": {
                "description": "Optional inclusive start date in YYYY-MM-DD format",
                "format": "date",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:8c185206eab6795eba24d8a045eb79caa5bc6cc6409c87aa295ccbeec15b2c75"
        }
      ],
      "digest": "sha256:60142cdb79d785fbeca76277527f5ae05f916c96525290adf4af47d2b18a05ab"
    }
  }
}
