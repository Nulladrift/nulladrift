          },
          "digest": "sha256:ee1b0de565c003df30b7c78a7209816b521b13c789bcf2d32742c508a0f62758"
        },
        {
          "name": "get_object",
          "description": "Fetch a single object by its id from a collection. Returns the full object as a flat map of fields, decorated with a `url` field where the collection has a public URL pattern configured. This tool does not search or filter — use query_collection for paginated lists or search_collection for free-text search.\n\nAvailable collections and filterable properties:\n- articles — id (id, sortable), title (text), author (select), summary (textarea), date (date, sortable), draft (toggle), updated (datetime, sortable)\n- comparisons — competitor (text), competitorUrl (url), heading (text), lede (textarea), reviewed (date, sortable), draft (toggle), sort (number, sortable), id (id, sortable)\n- extension — id (id, sortable), name (text), extensionId (text), soldAs (text), summary (textarea), category (select), price (number, sortable), currency (select), minEdition (select), minVersion (text), bundled (toggle), beta (toggle), docsUrl (url), productUrl (url), draft (toggle), owner (select), featured (toggle), approved (datetime, sortable), submitted (datetime, sortable), weight (range, sortable)\n- guides — heading (text), lede (textarea), reviewed (date, sortable), draft (toggle), sort (number, sortable), id (id, sortable), kind (select), product (select)\n- releases — id (id, sortable), version (text), title (text), date (date, sortable), draft (toggle), urgent (toggle), fullnotesurl (url), announce (toggle)\n- showcase — name (text), url (url), industry (select), id (id, sortable), owner (select), draft (toggle), featured (toggle), approved (datetime, sortable), submitted (datetime, sortable), weight (range, sortable)\n- starters — id (id, sortable), name (text), job (text), siteName (text), summary (textarea), status (select), package (text), buildCommand (text), coreStarter (select), minEdition (select), minVersion (text), demoUrl (url), repoUrl (url), featured (toggle), draft (toggle), updated (datetime, sortable)\n- streams — id (id, sortable), title (text), date (date, sortable), summary (textarea), release (select), draft (toggle)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Collection id. Use list_collections to discover available collections.",
                "examples": ["blog", "products"],
                "type": "string"
              },
              "format": {
                "default": "markdown",
                "description": "Rendered format for content fields. Accepted now for forward-compat; full conversion ships with the Tiptap→markdown converter in a later release.",
                "enum": ["markdown", "html", "text"],
                "type": "string"
              },
              "id": {
                "description": "Object id (slug). Get candidate ids from query_collection or search_collection output.",
                "examples": ["hello-world", "fall-collection-2025"],
                "type": "string"
              },
              "locale": {
                "default": "",
                "description": "BCP 47 locale tag. Accepted for forward-compat with the 3.6 i18n release — has no effect today.",
                "type": "string"
              }
            },
            "required": ["collection", "id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "id": {
                "description": "Object id (slug).",
                "type": "string"
              },
              "url": {
                "description": "Public URL for this object when the collection has a URL pattern configured.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Object"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fad34c43ac52bba8b44bdc1a7c6a0b4187a369f9f4ae21fa4776adfeb1e15372"
        },
