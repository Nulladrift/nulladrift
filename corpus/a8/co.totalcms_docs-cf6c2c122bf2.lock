      "serverInfo": {
        "name": "Total CMS",
        "version": "3.6.9",
        "description": "Total CMS site exposed as an MCP server."
      },
      "capabilities": {
        "completions": {},
        "logging": {},
        "prompts": {
          "listChanged": true
        },
