      },
      "instructions": "Total CMS site exposed over the Model Context Protocol. Content is collections of objects shaped by schemas, stored as files; there is no database. Vocabulary: collection (not table), object (not row), schema (not model), Site Builder page (not template). Discover before you act: list_collections returns every collection with its filterable fields; describe_collection and get_schema give the shape and each property's help text. Read with query_collection, get_object and search_collection, or the resources tcms://{collection}/ and tcms://{collection}/{id}. Drafts are hidden from anonymous callers. search and fetch exist for ChatGPT and deep-research clients. Site Builder templates are readable, never writable, over MCP. Look things up instead of guessing — this install serves its own documentation, matched to its version: docs_search then docs_get for prose, docs_lookup(kind, name) for exact Twig signatures, field types, schema options and CLI commands. The tcms_* prompts walk the common jobs: research a question, model a collection, write content, build a page, write Twig, audit SEO, troubleshoot MCP. This connection can only read. Writing and the admin tools (schemas, collections, cache) need an API key or an OAuth token; tell the user so rather than trying.",
      "tools": [
        {
          "name": "describe_collection",
          "description": "Describe one collection in detail. Returns the collection metadata plus a properties array — each entry is a property with its type, description, and indexed/filterable/sortable flags. Call list_collections first to find a collection id, then describe_collection to see what is queryable inside it. `indexed: true` means the property appears in query_collection / search_collection results (and may be filterable/sortable). `indexed: false` means the property exists on objects but is not returned by query/search — retrieve it through get_object instead.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Collection id (slug-form). Use list_collections to discover available collections.",
                "examples": ["blog", "products", "team"],
                "type": "string"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "access": {
                "description": "Persona that can query this collection.",
                "enum": ["admin", "apikey", "authenticated", "public"],
                "type": "string"
              },
              "description": {
                "description": "Collection-level mcp.description, falling back to the schema description.",
                "type": ["string", "null"]
              },
              "id": {
                "type": "string"
              },
              "ownership": {
                "description": "Set when the collection limits the caller to their own objects, or has fields only the site sets: what the caller sees and may change.",
                "type": ["string", "null"]
              },
              "properties": {
                "description": "One entry per exposed property (mcp.expose:false fields are stripped). Per-property mcp.description is surfaced here when set.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "description": {
                      "description": "Resolved property description — mcp.description → help → label.",
                      "type": ["string", "null"]
                    },
                    "filterable": {
                      "type": "boolean"
                    },
                    "indexed": {
                      "description": "True when the property appears in query/search results. False = available via get_object only.",
                      "type": "boolean"
                    },
                    "name": {
                      "type": "string"
                    },
                    "sortable": {
                      "type": "boolean"
                    },
                    "type": {
                      "description": "Schema field type (text, number, date, toggle, etc.).",
                      "type": "string"
                    }
                  },
                  "required": ["filterable", "indexed", "name", "sortable", "type"],
                  "type": "object"
                },
                "type": "array"
              },
              "total_objects": {
                "type": "integer"
              },
              "url_pattern": {
                "description": "URL template for objects, e.g. \"/blog/{id}\". Empty string when no pattern is configured.",
                "type": "string"
              }
            },
            "required": ["access", "id", "properties", "total_objects"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe Collection"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f0fbf7fb2dadf563a96b18c2c848e3407b0d519efb257075861dbef0a511e8c"
        },
        {
          "name": "describe_view",
          "description": "Describe one data view in detail. Returns metadata (id, name, description, last_built, access, total_items) plus output_shape — the list of keys present on the first cached item, sampled so agents can compose effective query_view / get_view calls. Admin callers also receive the view's Twig definition for dev visibility. Use list_views to discover view ids first.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "View id. Use list_views to discover available views.",
                "examples": ["recent-posts", "monthly-sales-summary"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "access": {
                "enum": ["admin", "apikey", "authenticated", "public"],
                "type": "string"
              },
              "definition": {
                "description": "Twig source for the view. Admin persona only — absent for public callers.",
                "type": "string"
              },
              "description": {
                "type": "string"
              },
              "id": {
                "type": "string"
              },
              "last_built": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "output_shape": {
                "description": "Keys present on the first cached item. Empty when the view has never been built or produced no items.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "total_items": {
                "type": "integer"
              }
            },
            "required": ["access", "id", "name", "output_shape", "total_items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Describe Data View"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81f7459c81f3788eac779e38c13f5133b764b0a34f3a5539b1530f92cf2cb78d"
        },
