                "type": "string"
              }
            },
            "required": ["collection", "query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Matched objects, each a flat field map decorated with a `url`. Field set varies by collection.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "id": {
                      "description": "Object id (slug).",
                      "type": "string"
                    },
                    "url": {
                      "description": "Public URL when the collection has a URL pattern.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "limit": {
                "description": "Applied result cap.",
                "type": "integer"
              },
