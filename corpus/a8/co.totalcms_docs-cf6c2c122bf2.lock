        {
          "name": "search_collections",
          "description": "Full-text search across every collection you can see, in one call. Returns matching items each decorated with `collection` (which collection the hit came from) and `url`. Pair `collection` + `id` to fetch the full record via get_object. Call list_collections for the available collections and describe_collection on any one for its full property list; properties not flagged filterable there exist on objects but are not searched here (use get_object for the full record). For a single-collection search use search_collection instead — same query syntax, scoped tighter. Drafts are auto-hidden from anonymous callers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "markdown",
                "description": "Output format for styledtext properties on the matched items. markdown is friendliest for AI consumption.",
                "enum": ["markdown", "html", "text"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum items returned in aggregate across all collections. Capped at 50 for MCP response-size budgets.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "",
                "description": "BCP 47 locale tag. Accepted for forward-compat with the 3.6 i18n release — has no effect today.",
                "type": "string"
              },
              "query": {
                "description": "Search terms. AND-semantics by default; use `or` between terms for OR; wrap phrases in double quotes.",
                "examples": ["rust performance", "\"static analysis\"", "php or python"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Matched objects across collections, each a flat field map decorated with `collection` (the source collection id) and `url`. Field set varies by collection.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "collection": {
                      "description": "Collection the hit came from. Pair with id for get_object.",
                      "type": "string"
                    },
                    "id": {
                      "description": "Object id (slug).",
                      "type": "string"
                    },
                    "url": {
                      "description": "Public URL when the collection has a URL pattern.",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "limit": {
                "description": "Applied aggregate result cap.",
                "type": "integer"
              },
              "query": {
                "description": "The query that was run.",
                "type": "string"
              },
              "total": {
                "description": "Number of items returned in aggregate.",
                "type": "integer"
              }
            },
            "required": ["items", "limit", "query", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Across Collections"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
