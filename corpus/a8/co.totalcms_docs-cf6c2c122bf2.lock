        {
          "name": "docs_lookup",
          "description": "Look up a specific Total CMS reference entry: Twig functions/filters, field types, REST API endpoints, schema configuration keys, CLI commands, extension API, or builder API. Omit `name` to list all entries of a kind.",
          "inputSchema": {
            "properties": {
              "kind": {
                "enum": ["twig_function", "twig_filter", "field_type", "api_endpoint", "schema_config", "cli_command", "extension_api", "builder_api"],
                "type": "string"
              },
              "name": {
                "description": "Entry name (function name, field type, \"GET /api/collections\", command name…). Omit to list the kind.",
                "type": "string"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "outputSchema": {
            "oneOf": [
              {
                "additionalProperties": false,
                "properties": {
                  "error": {
                    "type": "string"
                  }
                },
                "required": ["error"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "type": "string"
                  },
                  "names": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "total": {
                    "type": "integer"
                  }
                },
                "required": ["kind", "names", "total"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "entry": {
                    "description": "The matched reference entry. Shape varies by kind — see this method's docblock."
                  },
                  "kind": {
                    "type": "string"
                  },
                  "match": {
                    "description": "Present only for extension_api/builder_api item-level matches — the matched identity string.",
                    "type": "string"
                  },
                  "topic": {
                    "description": "Present only for extension_api/builder_api item-level matches — the topic key the match was found under.",
                    "type": "string"
                  }
                },
                "required": ["entry", "kind"],
                "type": "object"
              },
              {
                "additionalProperties": false,
                "properties": {
                  "candidates": {
                    "items": {
                      "description": "Either a raw reference entry (listed kinds) or {topic, match, entry} (keyed kinds) — see this method's docblock."
                    },
                    "type": "array"
                  },
                  "hint": {
                    "type": "string"
                  },
                  "kind": {
                    "type": "string"
                  }
                },
                "required": ["candidates", "hint", "kind"],
                "type": "object"
              }
            ],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Look Up Reference Entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5e786a650a068d1fee9f942237c45300cc77f2cbdf9c93430b16272319973b90"
        },
