          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "uri": {
                "description": "A tcms:// resource URI identifying one object. Format: tcms://{collection}/{id}.",
                "examples": ["tcms://blog/hello-world", "tcms://products/fall-collection-2025"],
                "type": "string"
              }
            },
            "required": ["uri"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "id": {
                "description": "Object id (slug).",
                "type": "string"
              },
              "url": {
                "description": "Public URL for this object when the collection has a URL pattern configured.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Resource"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7c756180491aab4e2e72d23878023b4fbf1c2bc4d4c41b8d5bc1f52991aa4f12"
