        {
          "name": "query_collection",
          "description": "Query a collection for paginated content. Returns the matching items plus pagination metadata (total, limit, offset, has_more); each item is decorated with a public `url` field where one is configured. Use REST-style `include` / `exclude` filter strings (comma-separated field:value pairs; AND-semantics for include, OR-semantics for exclude) and `sort` (e.g. `date:desc`). Only properties listed in the catalog below are queryable — other schema properties exist on objects but are not filterable here; use get_object if you need the full record or describe_collection to see every property. This tool does not free-text search content — use search_collection for that. It does not fetch a single object by id — use get_object.\n\nAvailable collections and filterable properties:\n- articles — id (id, sortable), title (text), author (select), summary (textarea), date (date, sortable), draft (toggle), updated (datetime, sortable)\n- comparisons — competitor (text), competitorUrl (url), heading (text), lede (textarea), reviewed (date, sortable), draft (toggle), sort (number, sortable), id (id, sortable)\n- extension — id (id, sortable), name (text), extensionId (text), soldAs (text), summary (textarea), category (select), price (number, sortable), currency (select), minEdition (select), minVersion (text), bundled (toggle), beta (toggle), docsUrl (url), productUrl (url), draft (toggle), owner (select), featured (toggle), approved (datetime, sortable), submitted (datetime, sortable), weight (range, sortable)\n- guides — heading (text), lede (textarea), reviewed (date, sortable), draft (toggle), sort (number, sortable), id (id, sortable), kind (select), product (select)\n- releases — id (id, sortable), version (text), title (text), date (date, sortable), draft (toggle), urgent (toggle), fullnotesurl (url), announce (toggle)\n- showcase — name (text), url (url), industry (select), id (id, sortable), owner (select), draft (toggle), featured (toggle), approved (datetime, sortable), submitted (datetime, sortable), weight (range, sortable)\n- starters — id (id, sortable), name (text), job (text), siteName (text), summary (textarea), status (select), package (text), buildCommand (text), coreStarter (select), minEdition (select), minVersion (text), demoUrl (url), repoUrl (url), featured (toggle), draft (toggle), updated (datetime, sortable)\n- streams — id (id, sortable), title (text), date (date, sortable), summary (textarea), release (select), draft (toggle)",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "collection": {
                "description": "Collection id (slug-form). Use list_collections to discover available collections.",
                "examples": ["blog", "products", "team"],
                "type": "string"
              },
              "exclude": {
                "default": "",
                "description": "Comma-separated field:value pairs that exclude items (OR). Drafts the caller may not see are removed before this filter runs, whatever it says.",
                "examples": ["draft:true", "status:archived,featured:false"],
                "type": "string"
              },
              "format": {
                "default": "markdown",
                "description": "Rendered format for content fields. Accepted now for forward-compat; full conversion ships with the Tiptap→markdown converter in a later release.",
                "enum": ["markdown", "html", "text"],
                "type": "string"
              },
              "include": {
                "default": "",
                "description": "Comma-separated field:value pairs items must ALL match. Wildcards \"*foo*\", \"foo*\", \"*foo\" supported.",
                "examples": ["featured:true", "category:tech,published:true"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "Maximum items to return. Capped at 50 (vs. REST's 100) to fit MCP response-size budgets.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "default": "",
                "description": "BCP 47 locale tag. Accepted for forward-compat with the 3.6 i18n release — has no effect today.",
                "type": "string"
              },
              "offset": {
                "default": 0,
                "description": "Number of items to skip — combine with limit for pagination.",
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "default": "",
                "description": "Sort rule \"field:direction\"; multiple rules comma-separated. Only fields marked sortable in the catalog will sort.",
                "examples": ["date:desc", "title:asc"],
                "type": "string"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "has_more": {
                "description": "True when total > offset + count(items); call again with offset += limit to paginate.",
                "type": "boolean"
              },
              "items": {
                "description": "Matching objects in sort order. Field set varies by collection — call describe_collection for the schema.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Public URL for this object when the collection has a URL pattern configured.",
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              },
              "limit": {
                "description": "Cap applied to this response — server may have lowered the requested limit.",
                "type": "integer"
              },
              "offset": {
                "type": "integer"
              },
              "total": {
                "description": "Total matching items (post-persona-filter).",
                "type": "integer"
              }
            },
            "required": ["has_more", "items", "limit", "offset", "total"],
            "type": "object"
          },
          "annotations": {
