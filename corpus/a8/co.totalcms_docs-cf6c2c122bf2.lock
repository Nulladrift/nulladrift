        {
          "name": "get_view",
          "description": "Fetch a data view's full cached result by id. Output is freeform — each item's field set depends on the view's Twig definition. Call describe_view first to learn the expected shape. Capped at 50 items; larger views return the first 50 plus a hint to call query_view for pagination. For per-item paginated access use query_view directly.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "format": {
                "default": "markdown",
                "description": "Forward-compat with collection tools. View data is freeform so this has no effect today.",
                "enum": ["markdown", "html", "text"],
                "type": "string"
              },
              "id": {
                "description": "View id. Use list_views to discover available views.",
                "examples": ["recent-posts", "monthly-sales-summary"],
                "type": "string"
              },
              "locale": {
                "default": "",
                "description": "BCP 47 locale tag — forward-compat for the 3.6 i18n release. No effect today.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "properties": {
              "hint": {
                "description": "Present only when truncated — points the agent at query_view.",
                "type": "string"
              },
              "items": {
                "description": "Items produced by the view, capped at 50. Field set varies by view — call describe_view for the expected shape.",
                "items": {
                  "additionalProperties": true,
                  "type": "object"
                },
                "type": "array"
              },
              "total": {
                "description": "Total cached items in the view (pre-cap).",
                "type": "integer"
              },
              "truncated": {
                "description": "True when total > 50; pair with query_view for full pagination.",
                "type": "boolean"
              }
            },
            "required": ["items", "total", "truncated"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get Data View"
