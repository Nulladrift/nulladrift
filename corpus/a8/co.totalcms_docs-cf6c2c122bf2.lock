        {
          "name": "find_comparison",
          "description": "Find the head-to-head comparison page for a competitor by name (case-insensitive partial match). Returns the full page content including the feature table.\n\nParameters:\n- competitor (string, required): Competitor name, e.g. \"Kirby\" or \"Craft\".\n\nReturns: paginated comparisons objects with url per item.",
          "inputSchema": {
            "properties": {
              "competitor": {
                "description": "Competitor name, e.g. \"Kirby\" or \"Craft\".",
                "type": "string"
              }
            },
            "required": ["competitor"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "has_more": {
                "description": "True when total > offset + count(items); call again with offset += limit to paginate.",
                "type": "boolean"
              },
              "items": {
                "description": "Matching comparisons objects, each decorated with a `url` field where the collection has a public URL pattern configured. Field set varies by collection — call describe_collection for the schema.",
                "items": {
                  "additionalProperties": true,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "url": {
                      "description": "Public URL for this object when the collection has a URL pattern configured.",
                      "type": "string"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "type": "array"
              },
              "limit": {
                "description": "Cap applied to this response — server may have lowered the requested limit.",
                "type": "integer"
              },
              "offset": {
                "type": "integer"
              },
              "total": {
                "description": "Total matching items (post-persona-filter).",
                "type": "integer"
              }
            },
            "required": ["has_more", "items", "limit", "offset", "total"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find Comparison"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
