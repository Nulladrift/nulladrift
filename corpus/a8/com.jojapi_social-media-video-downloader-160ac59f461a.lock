        {
          "name": "get_twitter_v3_post_details",
          "title": "Get Tweet Details",
          "description": "Supply tweetId or url. tweetId takes precedence. Returns full text, author and engagement metadata, and ordered photo/video/GIF attachments. Each video also has a renderableAudios item whose renderConfig produces an M4A of its audio: the HLS audio rendition when the playlist has one, otherwise the audio of the medium-quality MP4. Text-only tweets succeed with contents=[] and metadata.post.isTextOnly=true. Deleted or private tweets return an error. The former prototype postId parameter is replaced by tweetId. Group: Twitter-Tweet. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Preferred page language, passed in the page URL, Accept-Language header and media request headers. Defaults to en. Does not translate tweet text.",
                "title": "lang",
                "type": "string"
              },
              "tweetId": {
                "default": "2116307188155400526",
                "description": "Numeric tweet ID. Required unless url is supplied.",
                "example": "2116307188155400526",
                "title": "tweetId",
                "type": "string"
              },
              "url": {
                "default": "https://x.com/jack/status/20",
                "description": "An http(s) X/Twitter status URL or t.co short link. Photo/video suffixes and query strings are supported. Required unless tweetId is supplied.",
                "example": "https://x.com/jack/status/20",
                "title": "url",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1cdc36664660535ae25c085b558600427d64a3079dad02ef9676cf9d810359f9"
        },
