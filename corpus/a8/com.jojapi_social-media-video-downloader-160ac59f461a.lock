        {
          "name": "get_pinterest_v3_pin_details",
          "title": "Get Pin Details",
          "description": "Retrieves every image size and video stream of a Pinterest pin, with one contents entry per story page block and carousel slot (plus the pin's own video), along with its title, creator and metadata. Video lists are deduplicated by URL. Each video includes a renderableAudios item (an M4A of its audio). With renderableFormats, each quality of the video's HLS playlist can also be rendered to MP4 (renderableVideos). Group: Pinterest-Pin. Billing per call: 1 Credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "pinId": {
                "description": "The numeric Pinterest pin ID, as in pinterest.com/pin/{pinId}/. Either pinId or url is required; pinId takes precedence when both are sent.",
                "example": "1234567890123456789",
                "title": "pinId",
                "type": "string"
              },
              "renderableFormats": {
                "description": "A comma-separated list of video qualities to generate server-rendered MP4 links for, taken from the video's HLS playlist and labelled by height (e.g. 360p, 540p, 720p, 1080p), or one of: highres, midres, lowres, all, all_highres. Pins without an HLS playlist return an error item per requested format.",
                "example": "720p,highres",
                "title": "renderableFormats",
                "type": "string"
              },
              "url": {
                "description": "A Pinterest pin URL (pinterest.com/pin/{pinId}/, a regional domain such as in.pinterest.com or pinterest.co.uk, or a pin.it short link). Either pinId or url is required.",
                "example": "https://pin.it/abc123XYZ",
                "title": "url",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9af8835fe9c6ff8c17fbfd0b67cab8d0cb3d79421be3f8299b6ec94df1583aaa"
        },
