{
  "lockfileVersion": 2,
  "subjects": {
    "com.pegproof/pegproof": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pegproof.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pegproof",
        "title": "pegproof",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "pegproof states what the chain shows about stock tokens on Robinhood Chain: whether an address is a token in Robinhood's list, another issuer's listed token or a known look-alike (check_address, free), the addresses behind a ticker or company name (find_token, free), and supply, issuance, incident and past-state data paid per call with x402. It reports observations, not advice.",
      "tools": [
        {
          "name": "check_address",
          "title": "Check a stock token address",
          "description": "Check a contract address on Robinhood Chain before buying, holding or accepting it: a token in Robinhood's list, a known look-alike, or unknown. Free, and about identity only: for a listed token's supply, multiplier and integrity flags, use get_token_summary. A look-alike answer names the token it imitates; another issuer's listed token is unknown with issuer_list. Same answer as GET https://pegproof.com/v1/address/{address}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The contract address, 0x followed by 40 hex digits, either case.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:6d1be545b3bbbb9ccef97ce432fc0408b3dbed9d4a4f203752e21018c28696e9"
        },
        {
          "name": "find_token",
          "title": "Find a stock token by ticker or name",
          "description": "Find the contract address of a stock token on Robinhood Chain by ticker or company name, before an agent buys it. Free. Use it when you have a name, not an address; to check an address you already have, use check_address. Returns Robinhood's tokens with the look-alikes pegproof knows of, then other issuers' listed tokens (pegproof does not check their supply). At most 10 matches: total counts them all and truncated says when the list was cut.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A ticker (NVDA) or a company name (Nvidia).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:522ad9a5a41520f870eb370db2b512b7062759d551ef43a71927366fdabc5b1b"
        },
        {
          "name": "get_token_snapshot",
          "title": "Get a token's state at a past block",
          "description": "Get a Robinhood stock token's state at a past block: total supply, treasury balance and multiplier from the newest confirmed snapshot at or before it. Use it to check a historical position, report or trade against what was on-chain then. Pass a ticker or contract address and block=<number>. On-chain observations reconstructed from chain event logs, not financial advice. For the current state, use get_token_summary. Costs $0.01 per call, paid with x402 (USDC on Base or Arbitrum One).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "block": {
                "description": "A Robinhood Chain block number; the newest snapshot at or before it is returned.",
                "minimum": 0,
                "type": "integer"
              },
              "token": {
                "description": "A ticker (NVDA) or a contract address (0x followed by 40 hex digits).",
                "type": "string"
              }
            },
            "required": ["block", "token"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c862e65e448689cf4b93e493ff024c484d44c7ebda0231a530d878b3affb3ec4"
        },
        {
          "name": "get_token_summary",
          "title": "Get a token's current state",
          "description": "Get a Robinhood stock token's current on-chain state: total supply, treasury balance, multiplier, ledger coverage, open integrity flags and the look-alikes pegproof knows of. Pass a ticker (NVDA) or a contract address on Robinhood Chain (4663); for a known look-alike address, the answer names the token it imitates. On-chain observations reconstructed from chain event logs, not financial advice. To only tell a listed contract from a look-alike, check_address answers for free. Costs $0.002 per call, paid with x402 (USDC on Base or Arbitrum One).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "token": {
                "description": "A ticker (NVDA) or a contract address (0x followed by 40 hex digits).",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0905edb3aa163db782e8dfcbcc81c3ebd98745551aaf35ecd208fefee235ebf0"
        },
        {
          "name": "list_incidents",
          "title": "List integrity incidents",
          "description": "List integrity incidents across all of Robinhood's stock tokens, newest first: one call to monitor them all. An incident is a token whose supply or treasury balance diverged from its full mint/burn ledger, or a ledger rebaseline, with its type, status and block window. type=integrity (default), operational (collector errors) or all. On-chain observations and reconciliation findings, not financial advice. For one token's open integrity flags, get_token_summary costs less. Costs $0.005 per call, paid with x402 (USDC on Base or Arbitrum One).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Page size, 1-100 (default 20). Not refused when outside: above 100 is cut to 100, below 1 becomes 1, as on the HTTP routes.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "integrity (default), operational or all.",
                "enum": ["integrity", "operational", "all"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:e111400e91d91d87f845d67f72a11d30cce675fe565fb2b07b90f6ea6b772451"
        },
        {
          "name": "list_token_events",
          "title": "List a token's supply events",
          "description": "List the events that created or destroyed a Robinhood stock token's supply: every mint, burn, issue, redeem and transfer, newest first. Pass a ticker (NVDA) or a contract address on Robinhood Chain (4663); page through with the opaque cursor (keyset on block and log index). On-chain observations reconstructed from chain event logs, not financial advice. For the current totals use get_token_summary; for the totals at a past block, get_token_snapshot. Costs $0.005 per call, paid with x402 (USDC on Base or Arbitrum One).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The previous page's data.next_cursor; omit for the first page.",
                "type": "string"
              },
              "limit": {
                "description": "Page size, 1-100 (default 20). Not refused when outside: above 100 is cut to 100, below 1 becomes 1, as on the HTTP routes.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "token": {
                "description": "A ticker (NVDA) or a contract address (0x followed by 40 hex digits).",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:349733a177b47d966651793616784a7bb0dc64ce22ca67916001e48ca5873a02"
        }
      ],
      "digest": "sha256:b746e6607ded4b3f47de925c90780037cfc883155f51fa2cc4191b5da6741a1f"
    }
  }
}
