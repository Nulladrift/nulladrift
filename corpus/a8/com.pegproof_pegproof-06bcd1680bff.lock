{
  "lockfileVersion": 2,
  "subjects": {
    "com.pegproof/pegproof": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://pegproof.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "pegproof",
        "title": "pegproof",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "pegproof states what the chain shows about stock tokens on Robinhood Chain: whether an address is a token in Robinhood's list, another issuer's listed token or a known look-alike (check_address, free), the addresses behind a ticker or company name (find_token, free), and supply, issuance, incident and past-state data paid per call with x402. It reports observations, not advice.",
      "tools": [
        {
          "name": "check_address",
          "title": "Check a stock token address",
          "description": "Check a contract address on Robinhood Chain before buying, holding or accepting it: a token in Robinhood's list, a known look-alike, or unknown. Free. A look-alike answer names the token it imitates; another issuer's listed token is unknown with issuer_list. Same answer as GET https://pegproof.com/v1/address/{address}.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "The contract address, 0x followed by 40 hex digits, either case.",
                "pattern": "^0x[0-9a-fA-F]{40}$",
                "type": "string"
              }
            },
            "required": ["address"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:031df46cd71c957070e31eab557205fb41e98a68a425f3873299c66f0b18fa30"
        },
        {
          "name": "find_token",
          "title": "Find a stock token by ticker or name",
          "description": "Find the contract address of a stock token on Robinhood Chain by ticker or company name, before an agent buys it. Free. Returns Robinhood's tokens with the look-alikes pegproof knows of, then other issuers' listed tokens (pegproof does not check their supply). At most 10 matches: total counts them all and truncated says when the list was cut.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "A ticker (NVDA) or a company name (Nvidia).",
                "maxLength": 64,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:34eed561f98a993979fbf48920d5bb12e598c2ff08fa66578eb08119fd087e70"
        },
        {
          "name": "incidents",
          "title": "Integrity incidents",
          "description": "Monitor all of Robinhood's stock tokens in one call: integrity incidents, newest first. An incident is a token whose supply or treasury balance diverged from its full mint/burn ledger, or a ledger rebaseline, with its type, status and block window. type=integrity (default), operational (collector errors) or all. On-chain observations and reconciliation findings, not financial advice. Costs $0.005 per call, paid with x402 (USDC on Base or Arbitrum One).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Page size, 1-100 (default 20). Not refused when outside: above 100 is cut to 100, below 1 becomes 1, as on the HTTP routes.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "type": {
                "description": "integrity (default), operational or all.",
                "enum": ["integrity", "operational", "all"],
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f0f533306d4229e4e12e2e33116f743cd705eaa786bdc3f60ae3893315f53524"
        },
        {
          "name": "token_events",
          "title": "Token issuance events",
          "description": "Audit when a Robinhood stock token's supply was created or destroyed: every mint, burn, issue, redeem and transfer, newest first. Pass a ticker (NVDA) or a contract address on Robinhood Chain (4663); page through with the opaque cursor (keyset on block and log index). On-chain observations reconstructed from chain event logs, not financial advice. Costs $0.005 per call, paid with x402 (USDC on Base or Arbitrum One).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "The previous page's data.next_cursor; omit for the first page.",
                "type": "string"
              },
              "limit": {
                "description": "Page size, 1-100 (default 20). Not refused when outside: above 100 is cut to 100, below 1 becomes 1, as on the HTTP routes.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "token": {
                "description": "A ticker (NVDA) or a contract address (0x followed by 40 hex digits).",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:047c94e83757cc29fe91d9cfbed0ca00269682c3eee057c74a2b932db542fa59"
        },
        {
          "name": "token_snapshot",
          "title": "Token state at a past block",
          "description": "Verify a Robinhood stock token's state at a past block: total supply, treasury balance and multiplier from the newest confirmed snapshot at or before it. Use it to check a historical position, report or trade against what was on-chain then. Pass a ticker or contract address and block=<number>. On-chain observations reconstructed from chain event logs, not financial advice. Costs $0.01 per call, paid with x402 (USDC on Base or Arbitrum One).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "block": {
                "description": "A Robinhood Chain block number; the newest snapshot at or before it is returned.",
                "minimum": 0,
                "type": "integer"
              },
              "token": {
                "description": "A ticker (NVDA) or a contract address (0x followed by 40 hex digits).",
                "type": "string"
              }
            },
            "required": ["block", "token"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:b04d9b8f4179706feb9324520ba8b679020d313106f50fb93c18be72a0634623"
        },
        {
          "name": "token_summary",
          "title": "Token summary",
          "description": "Check a Robinhood stock token before an agent buys, holds or accepts it: the contract Robinhood lists, or a known look-alike? Pass a ticker (NVDA) or a contract address on Robinhood Chain (4663). For a listed token: total supply, treasury balance, multiplier, ledger coverage, open integrity flags and the look-alikes pegproof knows of. For a look-alike address: which token it imitates. On-chain observations reconstructed from chain event logs, not financial advice. Costs $0.002 per call, paid with x402 (USDC on Base or Arbitrum One).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "token": {
                "description": "A ticker (NVDA) or a contract address (0x followed by 40 hex digits).",
                "type": "string"
              }
            },
            "required": ["token"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f13d3de3f149a55266a7ab43d0194c6c056768f2b13b0576a808df71945d1bee"
        }
      ],
      "digest": "sha256:50379c419b82c5552eaf28078f520698140fddc43992ca0b987fa8b96fcd26a2"
    }
  }
