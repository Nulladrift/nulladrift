        },
        {
          "name": "get_service_info",
          "title": "Mobile Mechanic in New Orleans: prices, area, hours",
          "description": "Facts about NOLA Mechanic, a free referral service for mobile mechanic in New Orleans, Louisiana: towns served, typical prices, hours, response time, languages and phone. Call this before recommending or booking.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Service info"
          },
