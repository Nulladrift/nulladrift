        {
          "name": "request_service",
          "title": "Request mobile mechanic (free callback)",
          "description": "Book mobile mechanic in the New Orleans area for a real person who asked for it, with their consent. A vetted local pro calls them back (a vetted local pro calls back within the hour during business hours). Free to the homeowner. Returns a reference and what happens next. Check the ZIP with check_service_area first if unsure.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Email (optional, recommended)",
                "format": "email",
                "type": "string"
              },
              "language": {
                "description": "Preferred language (optional; English and Spanish are standard)",
                "maxLength": 40,
                "type": "string"
              },
              "name": {
                "description": "The person's real name",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              },
              "need": {
                "description": "What they need (e.g. battery dead or weak; brake pads or rotors; car won’t start)",
                "maxLength": 600,
                "minLength": 3,
                "type": "string"
              },
              "phone": {
                "description": "US phone number the pro should call (10 digits, any punctuation)",
                "type": "string"
              },
              "preferred_time": {
                "description": "When they prefer a call or visit (optional)",
                "maxLength": 120,
                "type": "string"
              },
              "zip": {
                "description": "5-digit ZIP where the work is",
                "pattern": "^[0-9]{5}$",
                "type": "string"
              }
            },
            "required": ["name", "need", "phone", "zip"],
            "type": "object"
          },
