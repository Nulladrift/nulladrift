        {
          "name": "vessel_track",
          "title": "Ship history (account)",
          "description": "Where a ship has been between two times (UTC, ISO 8601), from the AIS Trail archive. Needs an AIS Trail account: sign in when the MCP client asks, or send an API key as the HTTP header 'Authorization: Bearer ap_live_…' (keys at https://aistrail.com). Resolution: raw (up to 24 h per call), 1m (up to 7 days) or 1h (up to 366 days); at most 200 points per call, as rows of [time, lat, lon, speed_kn, course_deg]. The plan's history depth, credits (as on the track endpoint: 1 per vessel-day) and rate limit apply, and the 24-hour delay on recent data on plans without live data. sources_through gives, per source, the time up to which the archive holds its data; pending_days lists days in the range a source has not delivered yet, so no points on those days does not mean the ship was absent.",
