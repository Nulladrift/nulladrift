        {
          "name": "get_vessel",
          "title": "Ship details and position",
          "description": "Everything known about one ship now: identity (name, IMO, call sign, flag, type, size), last position, speed, course, heading, navigational status, destination (port codes decoded) and ETA as given by the crew, how long ago it was heard, its track over the last 40 minutes, and the data sources to credit. flag (ISO code) and flag_country come from the MMSI: the flag of the radio licence, usually but not always the registry flag. dwt_estimate is an estimate from the AIS dimensions (tonnes, size class such as Panamax or VLCC, hull, draught used), not a registry value; null for tugs, pleasure craft and other types where deadweight does not apply. For archive records and sanctions flags, use lookup_vessels (account).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "mmsi": {
                "description": "9-digit MMSI",
                "maximum": 999999999,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["mmsi"],
            "type": "object"
          },
          "annotations": {
