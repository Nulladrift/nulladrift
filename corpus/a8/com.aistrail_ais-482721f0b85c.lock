        {
          "name": "expected_arrivals",
          "title": "Ships expected at a port (account)",
          "description": "Ships that have not arrived yet at one port, from the port's own records: estimated arrival and departure (UTC), berth and declared previous port, from 6 hours ago to 14 days ahead, in arrival order. Available for Finnish ports; elsewhere the list is empty. Get the port_id from find_port. Needs an AIS Trail account (sign in when the MCP client asks, or send an API key as the HTTP header 'Authorization: Bearer ap_live_…') and a plan with live data (Pro or Business); at most 200 ships per call, 1 credit per ship returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
