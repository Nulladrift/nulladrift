      "serverInfo": {
        "name": "aistrail-ais",
        "title": "AIS Trail",
        "version": "1.7.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "AIS Trail: ship positions from AIS. Live tools (no key) cover ships heard in the last hour in Finnish waters and the northern Baltic (Fintraffic / Digitraffic, Class A only), in Norwegian waters (BarentsWatch, shore stations and Norwegian satellites) and around AIS Trail's volunteer receiving stations, plus last known positions up to 7 days for ships out of receiver range. vessel_track returns history (since October 2026 for Finnish waters and the northern Baltic, up to 12 months for Danish waters, the Kattegat, the Skagerrak, Norwegian waters and U.S. waters, up to 24 months there on the Business plan) and needs an AIS Trail account: the user signs in when the MCP client asks, or the client sends an API key as the HTTP header 'Authorization: Bearer ap_live_…'. vessel_port_calls and port_calls return port calls (arrival, departure, draught, previous and next port) from the same archive, plus port calls from the port's own records at Taiwan's international ports (no draught) and at Finnish ports (with the berth and the reported arrival and departure), and need the same account. expected_arrivals lists ships expected at a Finnish port from the port's records (estimated arrival and departure, berth; Pro and Business plans). vessel_events returns a ship's events (port and anchorage arrivals and departures, stops, identity changes and, when asked, AIS gaps, encounters, flag changes and position jumps); lookup_vessels returns archive records of up to 20 ships with sanctions flags (OFAC, UK, EU) by IMO number. These six tools need the same account and use the plan's credits as the REST API does. find_port finds port ids without one. Positions are what ships broadcast; times are UTC. Always credit the sources listed in each result's attribution. Private vessels (pleasure craft, sailing vessels and Class B transponders without a valid IMO number) are never listed or looked up individually; area and nearby results report how many were left out (private_vessels). Not for navigation. AIS data can be missing, delayed or wrong; do not use it for navigation, collision avoidance, search and rescue or any other safety-of-life purpose.",
      "tools": [
        {
          "name": "data_status",
          "title": "Coverage and freshness",
          "description": "How many ships are live now (live_ships_private: how many of them are private vessels, counted only), how many are known from the last 7 days, the date range of the history archive per source with available_until (the latest time vessel_track can return for that source on plans without live data), and the service status: ok or degraded, with reason codes in reasons.",
