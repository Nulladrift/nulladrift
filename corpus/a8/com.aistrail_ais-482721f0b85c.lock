                "description": "Port id from find_port",
                "maximum": 99999999,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "description": "End, e.g. 2026-09-02T00:00:00Z",
                "maxLength": 40,
                "type": "string"
              }
            },
            "required": ["from", "port_id", "to"],
            "type": "object"
