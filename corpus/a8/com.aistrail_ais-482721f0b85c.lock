            "readOnly": true
          },
          "digest": "sha256:919193a69f91afded9cee49d1e191bd92de3a72b94567719e6cef569a266cd7a"
        },
        {
          "name": "port_calls",
          "title": "Port arrivals and departures (account)",
          "description": "Ships that called at one port between two times (UTC, ISO 8601), from the AIS Trail archive: ship (with its flag from the MMSI), arrival, departure, draught on arrival and departure, cargo estimate, previous and next port. Get the port_id from find_port. event: any (in port at any time in the range, default), arrival or departure. The sanctions column gives the codes of the sanctions lists (OFAC, UK, EU) that name the ship's IMO number; informational only, not a compliance determination. Needs an AIS Trail account: sign in when the MCP client asks, or send an API key as the HTTP header 'Authorization: Bearer ap_live_…'. At most 100 port calls per call and at most 366 days; the plan's rules and credits (1 per port call returned) apply as for vessel_port_calls.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "event": {
                "default": "any",
                "description": "any: in port at any time in the range; arrival: arrived in the range; departure: departed in the range",
                "enum": ["any", "arrival", "departure"],
                "type": "string"
              },
              "from": {
                "description": "Start, e.g. 2026-09-01T00:00:00Z",
                "maxLength": 40,
                "type": "string"
              },
