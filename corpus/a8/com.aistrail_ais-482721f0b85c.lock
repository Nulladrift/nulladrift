        },
        {
          "name": "lookup_vessels",
          "title": "Ship records and sanctions (account)",
          "description": "Records of up to 20 ships at once from the AIS Trail archive, by mmsi and/or imo (lists): identity and particulars (name, IMO, call sign, type, flag from the MMSI, length, beam, estimated deadweight, first and last seen) and sanctions flags by IMO number from three official lists: OFAC SDN, UK Sanctions List and EU Regulation 833/2014 Annex XLII (list, programmes, date listed). An IMO number resolves to the MMSI that reported it last; ships not in the plan's sources come back with found false. Sanctions flags are informational, not a compliance determination: only ships a list names by IMO number are matched, ownership-based sanctions are not covered. Needs an AIS Trail account: sign in when the MCP client asks, or send an API key as the HTTP header 'Authorization: Bearer ap_live_…'. Credits: 1 per ship returned (none for ships not found); the plan's sources and 24-hour delay (on plans without live data) apply.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "imo": {
                "description": "7-digit IMO numbers; mmsi and imo together at most 20",
                "items": {
                  "maximum": 9999999,
                  "minimum": 1000000,
                  "type": "integer"
                },
                "maxItems": 20,
                "type": "array"
              },
              "mmsi": {
                "description": "9-digit MMSIs",
                "items": {
                  "maximum": 999999999,
                  "minimum": 100000000,
                  "type": "integer"
                },
                "maxItems": 20,
                "type": "array"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Ship records and sanctions (account)"
