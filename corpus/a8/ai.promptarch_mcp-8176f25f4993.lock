{
  "lockfileVersion": 2,
  "subjects": {
    "ai.promptarch/mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.promptarch.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "PromptArch",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "promptarch_enhance_prompt",
          "description": "Enhance a raw prompt with PromptArch's Prompt Enhancer: PromptArch asks 1-3 targeted clarifying questions, then rewrites the prompt from the person's answers, optimized for target_model. If this client supports MCP elicitation, the questions appear to the person as a form inside this call. Otherwise call once with just `prompt` to get the questions (free), ask the person, and call again with `questions` and `answers`. Never answer the questions yourself. The enhancement costs 5 credits; questions are free. Requires a PromptArch API key configured as an Authorization: Bearer pk_... header on this MCP server.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "answers": {
                "additionalProperties": {
                  "maxLength": 2000,
                  "type": "string"
                },
                "description": "Second call only: the person's own answers, keyed by question id (e.g. {\"q1\": \"...\"}).",
                "propertyNames": {
                  "maxLength": 20,
                  "type": "string"
                },
                "type": "object"
              },
              "prompt": {
                "description": "The raw prompt to enhance.",
                "maxLength": 10000,
                "minLength": 10,
                "type": "string"
              },
              "questions": {
                "description": "Second call only: the questions JSON exactly as this tool returned it.",
                "items": {
                  "properties": {
                    "id": {
                      "maxLength": 20,
                      "type": "string"
                    },
                    "question": {
                      "maxLength": 500,
                      "type": "string"
                    }
                  },
                  "required": ["id", "question"],
                  "type": "object"
                },
                "maxItems": 5,
                "minItems": 1,
                "type": "array"
              },
              "target_model": {
                "description": "The model the enhanced prompt is for (e.g. Claude Opus 5.5, GPT-5). Default: generic, no model-specific optimization.",
                "maxLength": 100,
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5e1149968727e9b8e4b3c563d46f8b4313970ffb63f5c50b35829be81485d9b3"
        },
        {
          "name": "promptarch_generate_artifact",
          "description": "Generate an AI agent context artifact (e.g. context_pack, claude_md) from a project description. Requires a PromptArch API key configured as an Authorization: Bearer pk_... header on this MCP server. Consumes credits.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "artifact": {
                "description": "Artifact id. See promptarch_list_artifact_types. Other Studio artifact types need artifact-specific inputs this tool does not accept.",
                "enum": ["context_pack", "claude_md", "agents_md", "cursor_rule"],
                "type": "string"
              },
              "coding_conventions": {
                "description": "Conventions, invariants, house rules. Max 1900 chars.",
                "maxLength": 1900,
                "type": "string"
              },
              "commands": {
                "maxLength": 1900,
                "type": "string"
              },
              "project_description": {
                "maxLength": 1900,
                "type": "string"
              },
              "project_name": {
                "maxLength": 1900,
                "type": "string"
              },
              "repo_structure": {
                "description": "Directory tree or structure summary. Max 1900 chars: summarize a large repo rather than pasting a full tree.",
                "maxLength": 1900,
                "type": "string"
              },
              "target_model": {
                "description": "Target model family (default Claude).",
                "maxLength": 100,
                "type": "string"
              },
              "tech_stack": {
                "maxLength": 1900,
                "type": "string"
              }
            },
            "required": ["artifact", "project_description", "project_name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:cdebb92292cf489e3a5af216a4e225afe0ac2e79db2c73a24b65c03d19d6fc22"
        },
        {
          "name": "promptarch_lint_artifact",
          "description": "Lint an AI agent context file (CLAUDE.md, .claude/rules/ files, AGENTS.md, Cursor rules, Copilot instructions, memory files) with PromptArch's deterministic linter: ~30 research-backed rule families covering current-model anti-patterns (tool-forcing, reasoning-echo, sycophancy triggers, contradictions), per-tool size budgets, secrets/dangerous commands, and hidden-Unicode injection (\"Rules File Backdoor\"). Returns grade, 0-100 score, and line-anchored findings. Free: no account or credits needed.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "content": {
                "description": "The full file content to lint.",
                "type": "string"
              },
              "filename": {
                "description": "Filename hint for format detection (e.g. CLAUDE.md).",
                "type": "string"
              },
              "format": {
                "description": "Override format auto-detection.",
                "enum": ["claude_md", "claude_code_rule", "agents_md", "cursor_mdc", "copilot_instructions", "memory_file"],
                "type": "string"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3c8382355a413c957c2c81a4dfd2bdfa68ab3cb9f34355a44ff5b160070cf9eb"
        },
        {
          "name": "promptarch_list_artifact_types",
          "description": "List the artifact types promptarch_generate_artifact can produce from a project description.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:33029e3c9b56e0ef176bcfd76164233844e841796ba6ac66f5b7b1d3c77c0491"
        }
      ],
      "digest": "sha256:8f7cc8539e6bbd8f3358519b8aacb540937b552be30e81716e7b30ce4b29301d"
    }
  }
}
