{
  "lockfileVersion": 2,
  "subjects": {
    "com.dmayachting/esther": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.dmayachting.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "esther-mcp",
        "title": "Esther - DMA Yachting",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "You are connected to Esther, DMA Yachting's yacht-matching service for charter clients. Ask what the client wants (destination, dates, guests, budget, yacht style, must-have toys), then call search_yachts. Show boats by name with their specs. Never claim a price or availability is confirmed: prices are indicative weekly rates and a DMA broker confirms everything. Searching is free for one search; after that the client verifies an email (4 searches a day) and then a phone (10 a day, plus live availability). Never ask for or store payment details. Nobody phones the client; brokers reply by email.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Check live availability of one yacht for a date range. Requires a verified phone number.",
          "inputSchema": {
            "properties": {
              "from": {
                "description": "Start date, YYYY-MM-DD",
                "type": "string"
              },
              "id": {
                "description": "Yacht id from search results",
                "type": "string"
              },
              "until": {
                "description": "End date, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["from", "id", "until"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:dd8bc7b0d5e555de3245d28e529c394364c03844da1ddddc013a91ddbe6f69b3"
        },
        {
          "name": "confirm_email",
          "title": "Confirm email",
          "description": "Confirm the email code the client received.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Code from the email",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:54b2efb945cf8079f04bf4801251d87491f300dfd1240b42ac354acf0241ddb6"
        },
        {
          "name": "confirm_phone",
          "title": "Confirm phone",
          "description": "Confirm the code the client received by text message.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "Code from the text message",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:87eaed4808c67c5e26b6417966ac9db538e80716a35f28963019db2f675508e7"
        },
        {
          "name": "delete_my_data",
          "title": "Delete my data",
          "description": "Erase everything stored about the client. Only call when the client explicitly asks, with confirm set to true.",
          "inputSchema": {
            "properties": {
              "confirm": {
                "description": "Must be true",
                "type": "boolean"
              }
            },
            "required": ["confirm"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e897b2c6528f719fa9938e4f4b27e5a7b4972f377f00ed8f1b347dd5403677d2"
        },
        {
          "name": "request_proposal",
          "title": "Request a proposal",
          "description": "Ask a DMA broker to prepare a proposal for the chosen yachts. The broker follows up by email. Requires a verified email.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "Yacht ids the client is interested in",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "note": {
                "description": "What the client wants the broker to know: dates, preferences, questions",
                "type": "string"
              }
            },
            "required": ["ids", "note"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:eb998c5eed099d57719b5d5d235def98c2de56df76ff926edfd7ba403f5babcf"
        },
        {
          "name": "search_yachts",
          "title": "Search yachts",
          "description": "Find charter yachts matching the client's brief. All fields are optional; pass what the client has told you. Returns up to a handful of boats with indicative weekly prices. The first search is free; further searches need a verified email (4 per day) or phone (10 per day).",
          "inputSchema": {
            "properties": {
              "budget_max_week": {
                "description": "Maximum budget per week",
                "type": "integer"
              },
              "cabins": {
                "description": "Minimum number of cabins",
                "type": "integer"
              },
              "crewed": {
                "description": "Crewed charter or bareboat",
                "enum": ["crewed", "bareboat", "any"],
                "type": "string"
              },
              "currency": {
                "description": "Currency of the budget",
                "enum": ["EUR", "USD"],
                "type": "string"
              },
              "dates": {
                "description": "Charter dates",
                "properties": {
                  "from": {
                    "description": "Start date, YYYY-MM-DD",
                    "type": "string"
                  },
                  "until": {
                    "description": "End date, YYYY-MM-DD",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "guests": {
                "description": "Number of guests",
                "type": "integer"
              },
              "length_max_m": {
                "description": "Maximum length in metres",
                "type": "number"
              },
              "length_min_m": {
                "description": "Minimum length in metres",
                "type": "number"
              },
              "region": {
                "description": "Cruising area or destination, e.g. Greece, Croatia, BVI, Caribbean",
                "type": "string"
              },
              "text": {
                "description": "Any other free-text wishes",
                "type": "string"
              },
              "toys": {
                "description": "Must-have water toys and amenities, e.g. jacuzzi, seabob",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "type": {
                "description": "Yacht style",
                "enum": ["motor", "sail", "catamaran", "gulet", "any"],
                "type": "string"
              },
              "year_min": {
                "description": "Oldest acceptable build or refit year",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c2c3b723a1e61d55ced503318b55b90f09da06f00cd1ce92265ae5b104bbe867"
        },
        {
          "name": "verify_email",
          "title": "Verify email",
          "description": "Send a 6-digit code to the client's email address. Verifying an email raises the daily search limit to 4.",
          "inputSchema": {
            "properties": {
              "email": {
                "description": "Client email address",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4b37eeb0d60d6e02ae050f2c922d89166a71ceb3f98a84db142955b99af31d3e"
        },
        {
          "name": "verify_phone",
          "title": "Verify phone",
          "description": "Send a code by text message to the client's phone. Requires a verified email first. Raises the daily search limit to 10 and enables live availability.",
          "inputSchema": {
            "properties": {
              "phone": {
                "description": "Phone number in E.164 format, e.g. +14155550123",
                "type": "string"
              }
            },
            "required": ["phone"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:43669469f9a7cd1675ce28835eed552343fc6caea27588b06c5e687a35969ad3"
        },
        {
          "name": "yacht_details",
          "title": "Yacht details",
          "description": "Full details for one yacht from a previous search: more photos, description, highlights and toys.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "Yacht id from search results (e_ followed by 12 hex characters)",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62f5943ed4e7fb207efbdedb4efc198b1258b5058fc9fd80b81df8b3fb4d79c1"
        }
      ],
      "digest": "sha256:62db32a7150cf3dcbc4b780dd63e027166b15638fcc2364330661bd173a76348"
    }
  }
}
