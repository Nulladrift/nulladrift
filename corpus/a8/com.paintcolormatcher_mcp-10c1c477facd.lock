            "readOnly": true
          },
          "digest": "sha256:cf0411c1e908e26880e85b6c5578325dfcb49657f1118047f2516cdc5fcf645d"
        },
        {
          "name": "simulate_kelvin_lighting_undertone_shift",
          "title": "2700K–5000K LED Bulb Color Temperature Undertone Shift Guide",
          "description": "Predict how warm 2700K incandescent/LED, 3000K soft white, 3500K neutral, and 5000K daylight bulbs shift warm greige, green-gray, violet-gray, and creamy white undertones.",
          "inputSchema": {
            "properties": {
              "kelvin": {
                "description": "LED bulb correlated color temperature in Kelvin (e.g. 2700, 3000, 3500, 4000, 5000)",
                "type": "number"
              },
              "undertone": {
                "description": "Base undertone family of the paint swatch",
                "enum": ["warm-yellow-cream", "greige-taupe", "green-gray", "blue-violet-gray", "crisp-neutral-white"],
                "type": "string"
              }
            },
            "required": ["kelvin", "undertone"],
            "type": "object"
          },
          "annotations": {
