          "digest": "sha256:865b13523bc3c241b8f81972aad09520e287f1237151ed1fa602f243fe9ddb5b"
        },
        {
          "name": "match_hex_to_paint_colors",
          "title": "HEX to Paint Color CIEDE2000 Matcher (11,249 Swatches)",
          "description": "Convert any HEX color code into the closest official Sherwin-Williams, Benjamin Moore, and Behr paint colors using scientific CIEDE2000 (ΔE00) color difference, LRV, and undertone classification.",
          "inputSchema": {
            "properties": {
              "brand": {
                "description": "Filter by paint brand or search across all 3 major brands (default: \"all\")",
                "enum": ["all", "sherwin-williams", "benjamin-moore", "behr"],
                "type": "string"
              },
              "hex": {
                "description": "6-digit HEX color code (e.g. \"#EAE6DF\" or \"7A8B8B\")",
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of matches to return (1 to 15, default: 6)",
                "type": "number"
              }
            },
            "required": ["hex"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "HEX to Paint Color Matcher"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0fc08f6fddf90f812ac8678ca53c984055a50363b63b2e50a14c5eb03ee0a89"
        },
        {
          "name": "recommend_paint_sheen_finish",
          "title": "Architectural Paint Sheen & Finish Selector (Flat to Semi-Gloss)",
          "description": "Recommend optimal paint sheen (Flat/Matte, Eggshell, Satin, Semi-Gloss, Cabinet Urethane Enamel) based on room humidity, traffic scrubbability, and drywall imperfection hiding.",
          "inputSchema": {
            "properties": {
              "surfaceOrRoom": {
                "description": "Target architectural surface or room type",
                "enum": ["ceiling", "living-bedroom", "kitchen-bathroom", "hallway-kids", "trim-doors-cabinets", "exterior-siding"],
                "type": "string"
              }
            },
            "required": ["surfaceOrRoom"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Paint Sheen Selector"
          },
          "behavior": {
            "destructive": false,
