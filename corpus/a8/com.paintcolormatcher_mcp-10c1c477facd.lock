      "serverInfo": {
        "name": "com.paintcolormatcher/mcp",
        "title": "PaintColorMatcher Scientific CIEDE2000 Engine",
        "version": "1.0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Query 11,249 official Sherwin-Williams, Benjamin Moore, and Behr paint colors with CIEDE2000 ΔE00 accuracy, LRV room exposure, and trim coordination. Source: https://paintcolormatcher.com",
      "tools": [
        {
          "name": "analyze_paint_lrv_and_room_exposure",
          "title": "Paint LRV (Light Reflectance Value) & Compass Room Exposure Advisor",
          "description": "Evaluate how a paint color LRV (0–100) behaves in North-facing, South-facing, East-facing, West-facing, or windowless rooms and HOA exterior LRV restrictions.",
          "inputSchema": {
            "properties": {
              "lrv": {
                "description": "Paint Light Reflectance Value from 0 to 100 (e.g. 60 for Agreeable Gray, 83 for Alabaster)",
                "type": "number"
              },
              "roomExposure": {
                "description": "Primary natural light compass exposure or exterior application",
                "enum": ["north", "south", "east", "west", "exterior"],
                "type": "string"
              }
            },
            "required": ["lrv", "roomExposure"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Paint LRV & Room Exposure Advisor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4645d9c76f96c1beedd454a79f2ab2cd783379e839fe2dc7ec06d965b136aef5"
        },
        {
          "name": "calculate_ciede2000_swatch_distance",
          "title": "Scientific CIEDE2000 (ΔE00) Color Difference Calculator",
          "description": "Compute exact CIE L*a*b* coordinates, Light Reflectance Value (LRV), and perceptual CIEDE2000 (ΔE00) distance between any two HEX colors with commercial paint-matching tolerance grading.",
          "inputSchema": {
            "properties": {
              "hexA": {
                "description": "First 6-digit HEX color (e.g. \"#D1CBC1\")",
                "type": "string"
              },
              "hexB": {
                "description": "Second 6-digit HEX color (e.g. \"#CFC9BF\")",
                "type": "string"
              }
            },
            "required": ["hexA", "hexB"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "CIEDE2000 Color Distance Calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7142827144b576b6a0102d4c27d396c0ffd215426a7a8f005dda98801e111ba2"
        },
        {
          "name": "calculate_room_paint_gallons_estimator",
          "title": "Interior Wall & Trim Paint Gallon Coverage Estimator",
          "description": "Calculate exact gallons and quarts of wall paint and primer needed after subtracting doors and windows at 350–400 sq ft per gallon.",
          "inputSchema": {
            "properties": {
              "ceilingHeightFeet": {
                "description": "Ceiling height in feet (default: 8 or 9)",
                "type": "number"
              },
              "coats": {
                "description": "Number of finish coats (default: 2)",
                "type": "number"
              },
              "doorsCount": {
                "description": "Number of standard doors (21 sq ft each, default: 2)",
                "type": "number"
              },
              "wallPerimeterFeet": {
                "description": "Total room perimeter in feet (e.g. 52 for a 12x14 ft room)",
                "type": "number"
              },
              "windowsCount": {
                "description": "Number of standard windows (15 sq ft each, default: 2)",
                "type": "number"
              }
            },
            "required": ["ceilingHeightFeet", "wallPerimeterFeet"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Room Paint Gallon Estimator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3d0ae7daf85425471a9a6038cf4839dfd3d56e4aee699b673f97efbc1ea97ef6"
        },
        {
          "name": "find_cross_brand_paint_equivalent",
          "title": "Cross-Brand Paint Color Equivalent & Dupe Finder",
          "description": "Find the closest cross-brand paint color equivalents (dupes) across Sherwin-Williams, Benjamin Moore, and Behr by paint name or code (e.g. \"SW 7029\", \"Agreeable Gray\", \"OC-65\", \"Chantilly Lace\").",
          "inputSchema": {
            "properties": {
              "query": {
                "description": "Paint color name or manufacturer code (e.g. \"Agreeable Gray\", \"SW 7029\", \"HC-172\", \"Swiss Coffee\")",
                "type": "string"
              },
              "target_brand": {
                "description": "Target brand to match into (default: \"all\")",
                "enum": ["all", "sherwin-williams", "benjamin-moore", "behr"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cross-Brand Paint Dupe Finder"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4cc563ec2018cb070b74d9231b220b82e7342498c0061d7443d522d02c6c65d7"
        },
        {
          "name": "generate_coordinating_trim_and_accent_palette",
          "title": "Coordinating White Trim, Ceiling & Accent Palette Builder",
          "description": "Generate designer-tested coordinating trim white, ceiling flat white, and contrasting accent colors matched to a main wall HEX or paint swatch.",
          "inputSchema": {
            "properties": {
              "wallHex": {
                "description": "Main wall 6-digit HEX color (e.g. \"#D1CBC1\")",
                "type": "string"
              }
            },
            "required": ["wallHex"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Trim & Accent Palette Builder"
          },
          "behavior": {
            "destructive": false,
