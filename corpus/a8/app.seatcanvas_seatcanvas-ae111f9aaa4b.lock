{
  "lockfileVersion": 2,
  "subjects": {
    "app.seatcanvas/seatcanvas": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.seatcanvas.app/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "seatcanvas",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "seatcanvas_create_plan",
          "title": "Create a prefilled seating plan",
          "description": "Returns a link to a SeatCanvas plan prefilled with a table layout for the given guest count and event type (optional venue dimensions). Opening the link seeds the canvas; nothing is saved until the user signs in. Read-only; deterministic.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "event_type": {
                "description": "Event type: 'wedding' (adds a head table), 'quinceanera', 'corporate', or 'other'.",
                "enum": ["wedding", "quinceanera", "corporate", "other"],
                "type": "string"
              },
              "guest_count": {
                "description": "Number of guests to seat (positive integer).",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "locale": {
                "default": "en",
                "description": "Language for the prefilled plan: 'en' (default) or 'es'.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "table_type": {
                "default": "round-8",
                "description": "Table shape + seats: 'round-8', 'round-10', 'rect-8', or 'rect-10'. Default 'round-8'.",
                "enum": ["round-8", "round-10", "rect-8", "rect-10"],
                "type": "string"
              },
              "unit_system": {
                "description": "Unit for venue dimensions: 'metric' (meters) or 'imperial' (feet).",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "venue_h": {
                "description": "Optional venue height/depth in the chosen unit_system; omit to auto-size.",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "venue_w": {
                "description": "Optional venue width in the chosen unit_system; omit to auto-size a venue to fit the guests.",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["event_type", "guest_count", "unit_system"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "guest_count": {
                "description": "Guest count the plan was built for.",
                "type": "number"
              },
              "planner_url": {
                "description": "Prefilled SeatCanvas planner URL.",
                "type": "string"
              },
              "table_count": {
                "description": "Number of tables in the seeded plan (includes the head table for weddings).",
                "type": "number"
              }
            },
            "required": ["guest_count", "planner_url", "table_count"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b52537a6e890c7f72a92d7102b5b2cf2a348a94b0384022150875a9f60d88f2e"
        },
        {
          "name": "seatcanvas_estimate_capacity",
          "title": "Estimate venue seating capacity",
          "description": "Estimates how many guests a venue of the given width and height can seat at a chosen table type, and returns a link to a prefilled SeatCanvas plan. Read-only; deterministic.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "event_type": {
                "default": "other",
                "description": "Event type: 'wedding' (adds a head table), 'quinceanera', 'corporate', or 'other'. Default 'other'.",
                "enum": ["wedding", "quinceanera", "corporate", "other"],
                "type": "string"
              },
              "locale": {
                "default": "en",
                "description": "Language for the prefilled plan: 'en' (default) or 'es'.",
                "enum": ["en", "es"],
                "type": "string"
              },
              "table_type": {
                "default": "round-8",
                "description": "Table shape + seats: 'round-8', 'round-10', 'rect-8', or 'rect-10'. Default 'round-8'.",
                "enum": ["round-8", "round-10", "rect-8", "rect-10"],
                "type": "string"
              },
              "unit_system": {
                "description": "Unit for venue dimensions: 'metric' (meters) or 'imperial' (feet).",
                "enum": ["metric", "imperial"],
                "type": "string"
              },
              "venue_h": {
                "description": "Venue height/depth in the chosen unit_system (meters or feet).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "venue_w": {
                "description": "Venue width in the chosen unit_system (meters or feet).",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["unit_system", "venue_h", "venue_w"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "planner_url": {
                "description": "Prefilled SeatCanvas planner URL.",
                "type": "string"
              },
              "preview_guest_count": {
                "description": "Guest count used to seed the preview canvas (always >= 1).",
                "type": "number"
              },
              "raw_capacity": {
                "description": "Honest estimated seating capacity for the venue (may be 0).",
                "type": "number"
              }
            },
            "required": ["planner_url", "preview_guest_count", "raw_capacity"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a685e01a824d565c99c79e78ee94991749007537c8a580568191b3be5a4d6199"
        },
        {
          "name": "seatcanvas_get_pricing",
          "title": "Get SeatCanvas pricing",
          "description": "Returns SeatCanvas pricing: the free-tier seated-guest limit and the one-time Event Pass price. Read-only; no inputs required beyond an optional response locale.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "locale": {
                "default": "en",
                "description": "Response language: 'en' (default) or 'es'.",
                "enum": ["en", "es"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "currency": {
                "description": "ISO currency code for the price, e.g. USD.",
                "type": "string"
              },
              "event_pass_price": {
                "description": "One-time Event Pass price (string, from the canonical source).",
                "type": "string"
              },
              "free_guest_limit": {
                "description": "Max seated guests on the free tier.",
                "type": "number"
              }
            },
            "required": ["currency", "event_pass_price", "free_guest_limit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:70261ecdd06a6fba69ee500968d35c210e1137f6a9208f7941801dbf8edb39e7"
        }
      ],
      "digest": "sha256:2d82a216b9ecf58c32301616d5ca7f28f688b997b9b82d00cae8bd6ff7fe94f0"
    }
  }
}
