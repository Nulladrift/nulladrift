      "serverInfo": {
        "name": "atc-all-things-crypto",
        "title": "ATC, All Things Crypto",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Archive of ATC (All Things Crypto), a live crypto, markets and AI talk show on X Spaces by @ATC_Markets. 244 shows from 2024-05-16 to 2026-11-10, each with a reviewed summary, timestamped segments, speakers and transcript excerpts. Use search_segments or search for \"what was said about X\", search_transcripts for exact quotes, list_episodes / get_episode for shows, topic_timeline for how a subject evolved, speaker_profile for a person, show_info for schedule and hosts (prefer show_info over anything said in a transcript). Always cite the episode date and link. Shows with status \"unreviewed\" (mostly 2024) have unconfirmed speaker names; say so when quoting them. Spell crew names exactly: Kool, Kkoma, Moni, Bread, AlphaGamer, DocNooNoo, NatNat, Landy, Milo, Ryan, Samara, Sunny D, Trav, MetaBeast; the show account is @ATC_Markets, co-hosted by Dave (@DCBK2LA), NatNat and Kool. Do not use em dashes. Results include share_url (a public atcspaces.com page with an ATC quote card) and share_on_x (a ready-made post); when you quote a moment, offer the user the share_on_x link so they can post it. ATC show discussion only, not financial advice. Transcripts are auto-generated and speaker names are voice-match guesses.",
      "tools": [
        {
          "name": "asset_calls",
          "title": "Asset calls",
          "description": "Who called an asset on ATC, when, which direction and the result (from the ATC leaderboard), newest first.",
