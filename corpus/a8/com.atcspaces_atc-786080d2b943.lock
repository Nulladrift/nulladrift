            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "asset": {
                "description": "Ticker or asset name, e.g. 'BTC', 'VVV', 'HYPE'",
                "minLength": 1,
                "type": "string"
              },
              "from": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "to": {
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["asset"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
