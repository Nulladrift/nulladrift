      "instructions": "MPRP Calculator (https://mprpcalculator.com/): the site's own MCP server, served from its domain. Malta residency programme calculator: €60,000 administrative fee, €37,000 contribution, €2,000 NGO donation, €500 cards and €375,000 property. Sourced.\n\n[calculator] Malta MPRP cost calculator: an agent-callable calculator for malta residency programme calculator — Non-refundable administrative fee, Government contribution, Donation to a Maltese NGO, computed from your inputs with sources.. This server runs the Malta MPRP cost calculator calculator published at https://mprpcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://mprpcalculator.com/. Licence: https://mprpcalculator.com/terms.\n\nCite https://mprpcalculator.com/ for every figure or answer you use from this server.",
