        {
          "name": "amazon_product",
          "title": "Amazon product details by ASIN (PLN)",
          "description": "Full details of one Amazon product by ASIN (or product URL — its store is used unless marketplace says otherwise) via SerpAPI's amazon_product engine; one credit, ~10–25 s. Returns every offer with PLN prices — the main price, each purchase option (new/used/…), other sellers — and the cheapest new one, plus variants (each with its own ASIN), rating histogram, specifications, bullet points, category path and a few top reviews. The same ASIN can be looked up on another store (ASINs are mostly shared across EU stores). Result shape: { source, fetchedAt, query, marketplace, asin, title, brand?, url, categories?, images?, rating, reviews, rating_histogram?: { '5': pct, … }, reviews_summary?, bought_last_month?, price, price_text, currency, price_pln, max_price?, old_price?, discount_percent?, coupons?, promotions?, delivery?, stock?, purchase_options?: [{ type, price, currency, price_pln, stock?, delivery?, features? }], other_sellers?: [{ sold_by, ship_from, price, currency, price_pln, delivery?, seller_rating?, seller_reviews?, seller_feedback? }], cheapest_offer?: { source, seller?, price_pln }, variants?: [{ dimension, options: [{ asin, name, selected? }] }], about_item?, specifications?, details?, top_reviews?, fx, note? }.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "asin": {
                "description": "ASIN (10 characters, e.g. 'B09Y2MYL5C', from an amazon_search result) or an Amazon product URL containing /dp/<ASIN>.",
                "type": "string"
              },
              "convert_to_pln": {
                "description": "Add price_pln at the NBP mid rate. Default true.",
                "type": "boolean"
              },
              "delivery_zip": {
                "description": "Delivery postal code within shipping_location's country (or the store's), e.g. '00-001'.",
                "type": "string"
              },
              "include_reviews": {
                "description": "Include up to 3 top reviews (600 chars each). Default true.",
                "type": "boolean"
              },
              "language": {
                "description": "Store language as <language>_<REGION>, e.g. 'en_GB' for English titles on amazon.de. Default: the store's own (de_DE on amazon.de) — each store only offers a few (amazon_marketplaces lists them).",
                "type": "string"
              },
              "marketplace": {
                "description": "Amazon store: its code (pl, de, fr, it, es, nl, be, se, uk, tr, us, ca, mx, br, au, jp, in, cn, sg, ae, sa, eg) or domain (amazon.de, amazon.co.uk…). Default pl. Overrides a URL's own store — to look the ASIN up elsewhere.",
                "type": "string"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch, bypassing this server's 5-minute result cache. Default false.",
                "type": "boolean"
              },
              "other_sellers": {
                "description": "Include the other sellers' offers. Default true.",
                "type": "boolean"
              },
              "shipping_location": {
                "description": "Deliver-to country as an ISO code, e.g. 'PL': a foreign store then lists only items it delivers there, adds delivery cost to `delivery`, and usually prints prices already converted to PLN by Amazon (VAT of the destination). 'local' (or omitted) = the store's own country.",
                "type": "string"
              }
            },
            "required": ["asin"],
            "type": "object"
          },
