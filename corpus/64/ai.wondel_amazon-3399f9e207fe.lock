        {
          "name": "amazon_search",
          "title": "Search an Amazon store (prices in PLN)",
          "description": "Search one Amazon store (22 countries; default amazon.pl) via SerpAPI, with every price also in PLN at the official NBP mid rate. Costs one SerpAPI credit per call (a repeat within 5 minutes is cached and free). Refine with sort, page, min_price/max_price (store currency; enforced on the displayed price), brand, category_node, min_rating/min_reviews (applied to the returned page), include_sponsored, and any refinement Amazon offers on that page via `rh`: the result's `filters` lists each option's rh (Prime, 4★ & up, New condition, sold by Amazon, deals, features…) — pass them comma-separated. A store printing PLN itself (shipping_location 'PL' on a foreign store) is taken as-is. Use amazon_compare for several stores at once and amazon_product for one ASIN's offers, sellers and specs. Result shape: { source, fetchedAt, query, marketplace: { code, domain, country, currency, language }, search_url, total_results (Amazon's own count, before this page's post-filters), query_displayed?, page, next_page, count, products: [...], filters?: { <group>: [{ name, rh }] }, categories?: [{ name, node }], related_searches?, fx: [{ currency, rate, table, table_no, effective_date, source: 'NBP' }], note? } — the list key is `products`. Each product: { position, asin, title, brand?, url (https://www.<store>/dp/<ASIN>), image?, price (number, in `currency`), price_text (as displayed), currency (ISO, read from the displayed price), price_pln, old_price?, discount_percent?, rating, reviews, bought_last_month?, prime? (only stores that mark it), sponsored, badges?, delivery?, stock?, coupon?, offers?, more_buying_choices?, variants?: [{ asin, title }], purchase_options? }. price_pln is null when there is no price or no NBP rate (the note says why). A search Amazon answers with nothing is count: 0 plus a note on what to relax — a successful result, not an error.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "One brand name as Amazon spells it, e.g. 'Sony' (Amazon's brand filter).",
                "type": "string"
              },
              "category_node": {
                "description": "Amazon browse-node id (digits) to search within — from a result's `categories`, or node=… in an Amazon category URL. Ids differ per store. Without a query this browses the category.",
                "type": "string"
              },
              "convert_to_pln": {
                "description": "Add price_pln at the NBP mid rate. Default true.",
                "type": "boolean"
              },
              "delivery_zip": {
                "description": "Delivery postal code within shipping_location's country (or the store's), e.g. '00-001'.",
                "type": "string"
              },
              "exclude_autocorrected": {
                "description": "Drop results Amazon adds from an auto-corrected spelling of the query. Default false.",
                "type": "boolean"
              },
              "include_filters": {
                "description": "Return the page's refinement `filters` (name + rh per option). Default true.",
                "type": "boolean"
              },
              "include_sponsored": {
                "description": "Keep sponsored slots (marked sponsored: true). Default false — ads repeat and distort ranking.",
                "type": "boolean"
              },
              "language": {
                "description": "Store language as <language>_<REGION>, e.g. 'en_GB' for English titles on amazon.de. Default: the store's own (de_DE on amazon.de) — each store only offers a few (amazon_marketplaces lists them).",
                "type": "string"
              },
              "limit": {
                "description": "Max products returned (1–60). Default 20.",
                "maximum": 60,
                "minimum": 1,
                "type": "integer"
              },
              "marketplace": {
                "description": "Amazon store: its code (pl, de, fr, it, es, nl, be, se, uk, tr, us, ca, mx, br, au, jp, in, cn, sg, ae, sa, eg) or domain (amazon.de, amazon.co.uk…). Default pl.",
                "type": "string"
              },
              "max_price": {
                "description": "Highest price in the store's currency, applied like min_price.",
                "minimum": 0,
                "type": "number"
              },
              "min_price": {
                "description": "Lowest price in the STORE's currency (EUR on amazon.de). Sent to Amazon, then enforced on the displayed price: out-of-range products and products without a price are dropped (the note counts them).",
                "minimum": 0,
                "type": "number"
              },
              "min_rating": {
                "description": "Keep products rated at least this (0–5), filtered on the returned page.",
                "maximum": 5,
                "minimum": 0,
                "type": "number"
              },
              "min_reviews": {
                "description": "Keep products with at least this many ratings, filtered on the returned page.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch, bypassing this server's 5-minute result cache. Default false.",
                "type": "boolean"
              },
              "page": {
                "description": "Result page, 1–20. Default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What you'd type in Amazon's search box, e.g. 'sony wh-1000xm5'. Required unless category_node is set.",
                "type": "string"
              },
              "rh": {
                "description": "Amazon refinements, comma-separated key:value pairs exactly as a previous result's `filters` list them (e.g. 'p_n_condition-type:776949031,p_72:419117031'). Ids are store-specific.",
                "type": "string"
              },
              "shipping_location": {
                "description": "Deliver-to country as an ISO code, e.g. 'PL': a foreign store then lists only items it delivers there, adds delivery cost to `delivery`, and usually prints prices already converted to PLN by Amazon (VAT of the destination). 'local' (or omitted) = the store's own country.",
                "type": "string"
              },
              "sort": {
                "description": "Amazon's sort: relevance (default, Amazon's 'Featured'), price_asc, price_desc, rating (avg. customer review), newest, bestsellers. The price sorts are re-applied to the returned page by displayed price (Amazon sorts by its offer prices), with products that show no price listed last.",
                "enum": ["relevance", "price_asc", "price_desc", "rating", "newest", "bestsellers"],
                "type": "string"
              }
            },
            "type": "object"
          },
