      },
      "instructions": "Gilroy Motor (Comercial Gilroy SpA, Chile) vende online dos motos eléctricas —Thunder 3000 W y Chopper 1500 W— y packs de dos, en pesos chilenos, con inscripción, placa patente, SOAP y permiso de circulación incluidos. Requieren licencia Clase C. Últimas unidades, sin reposición: el stock se informa solo como disponible/agotado. Flujo: list_models → get_terms (envío por comuna, pago, garantía 6 meses, derecho a retracto de 10 días) → create_checkout_link, que deja la moto en el carrito para que la persona pague; nunca indiques pagar por otro canal que no sea el sitio o la transferencia que el sitio muestra. Empresa 100 % online: no hay test drive ni showroom.",
      "tools": [
        {
          "name": "create_checkout_link",
          "title": "Armar el enlace de compra",
          "description": "Arma un enlace que deja la moto o pack elegido (en el color elegido) en el carrito de gilroymotor.cl, listo para que la PERSONA pague con tarjeta (Flow) o transferencia. No compra, no paga y no reserva. Recibe un option_id del catálogo, o modelo + color.",
          "inputSchema": {
            "properties": {
              "color": {
                "description": "p. ej. negra, blanca, gris, roja, amarilla",
                "type": "string"
              },
              "model": {
                "type": "string"
              },
              "option_id": {
                "type": "integer"
              }
            },
            "type": "object"
          },
