{
  "lockfileVersion": 2,
  "subjects": {
    "com.mactechsolutionsllc.www/federal-market": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.mactechsolutionsllc.com/api/mcp/market"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "mactech-federal-market",
        "version": "1.2.0"
      },
      "capabilities": {
        "prompts": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "MacTech Solutions federal-market server: live SAM.gov contract opportunities and entity registrations, plus USASpending award data. The SAM.gov tools (search_opportunities, lookup_entity) run only on the caller's own free SAM.gov API key, passed as the X-Sam-Api-Key header in the MCP client config or as the sam_api_key tool argument; there is no shared server key, and a call without a key returns an error explaining how to get one (sam.gov, profile, request a public API key). The key is never logged or stored. USASpending tools (search_awards, get_award, find_agency, find_naics, spending_by_category) are keyless. Use find_agency/find_naics to resolve names to codes before searching.",
      "tools": [
        {
          "name": "find_agency",
          "title": "Find a federal agency by name",
          "description": "Resolve a federal agency name fragment to its official awarding-agency names (toptier and subtier) as USAspending knows them - use before search_awards or spending_by_category when unsure of the exact agency name. Keyless.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Agency name fragment, e.g. \"navy\" or \"DISA\"",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:ff239d9753f43d467283bb98239e24b09121097fa8c765af6862a9b8736b20c8"
        },
        {
          "name": "find_naics",
          "title": "Find NAICS codes",
          "description": "Resolve an industry description to NAICS codes (or look up what a NAICS code means). Use before search_opportunities/search_awards to get the right code. Keyless.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "description": "Industry description (\"cybersecurity services\") or a NAICS code (\"541512\")",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:8d483ff996f781bf96f0ab1df338e2ea8249e7a1b78cf16bcbca983ecae5674a"
        },
        {
          "name": "get_award",
          "title": "Get one federal award (USASpending)",
          "description": "Get full detail for one federal award from USAspending.gov by its generated award id (from search_awards results, e.g. \"CONT_AWD_...\") - description, obligations, period of performance, awarding/funding agencies, recipient, and place of performance. Keyless.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "award_id": {
                "description": "generated_internal_id / generated_unique_award_id from search_awards",
                "type": "string"
              }
            },
            "required": ["award_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:aa62bd883fb6c75f590c237fcee1d2407266b2974f6b348d6a7ad548d2e2ab09"
        },
        {
          "name": "lookup_entity",
          "title": "Look up a SAM.gov registered entity",
          "description": "Look up a federal contractor registration in SAM.gov by Unique Entity ID (UEI) or legal business name: registration status, CAGE code, physical address, business types (SDVOSB, 8(a), HUBZone, etc.), and NAICS codes. Call this to vet a teaming partner, check a competitor, or confirm an entity is award-eligible. Public registration sections only. Requires the caller's own free SAM.gov API key (X-Sam-Api-Key header or sam_api_key argument).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "name": {
                "description": "Legal business name (partial match allowed) - used when no UEI given",
                "type": "string"
              },
              "sam_api_key": {
                "description": "Your own free SAM.gov API key. Required unless it is already set as the X-Sam-Api-Key header on the MCP connection; this server has no shared SAM.gov key. Get one free at sam.gov: sign in, open your profile (Account Details), request a public API key. Docs: https://open.gsa.gov/api/get-opportunities-public-api/. Never logged or stored.",
                "type": "string"
              },
              "uei": {
                "description": "12-character Unique Entity ID",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:40792ad93d9d317ddd72af604b7cfeab16b2692fd21b7d6e9a462caa6489a85d"
        },
        {
          "name": "search_awards",
          "title": "Search federal contract awards (USASpending)",
          "description": "Search actual federal contract awards on USAspending.gov - who won what, from which agency, for how much. Filter by keywords, NAICS, PSC, recipient name, agency, date range, and award amount. Keyless and unlimited. Call this for competitive intelligence (\"who holds contracts in this space\"), incumbent research, or agency spending patterns.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agency_name": {
                "description": "Awarding toptier agency name, e.g. \"Department of Defense\"",
                "type": "string"
              },
              "end_date": {
                "description": "YYYY-MM-DD (default: today)",
                "type": "string"
              },
              "keywords": {
                "description": "Keyword filters",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_amount": {
                "type": "number"
              },
              "min_amount": {
                "type": "number"
              },
              "naics_codes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "psc_codes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "recipient": {
                "description": "Recipient (contractor) name search",
                "type": "string"
              },
              "start_date": {
                "description": "YYYY-MM-DD (default: 1 year ago)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a26c55e0fdec735fd9d9823be1a06b3969d2dbf4f9021db02c04eba698522381"
        },
        {
          "name": "search_opportunities",
          "title": "Search SAM.gov contract opportunities",
          "description": "Search active federal contract opportunities on SAM.gov: solicitations, presolicitations, sources sought, RFIs, and award notices - filterable by keywords, NAICS, set-aside (SDVOSB, 8(a), HUBZone, WOSB, small business), notice type, agency, and posted-date range (max 1 year). Call this when the user wants to find federal bidding opportunities or market intelligence on what agencies are buying. Requires the caller's own free SAM.gov API key (X-Sam-Api-Key header or sam_api_key argument); without one it returns an error explaining how to get and pass a key.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agency": {
                "description": "Department/agency name filter",
                "type": "string"
              },
              "keywords": {
                "description": "Free-text keywords, e.g. \"CMMC compliance\"",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "naics_codes": {
                "description": "NAICS codes, e.g. [\"541512\"]",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "notice_type": {
                "description": "o=solicitation, p=presolicitation, r=sources sought, k=combined synopsis, g=surplus, s=special notice, a=award notice, i=intent to bundle, u=J&A",
                "items": {
                  "enum": ["o", "p", "r", "k", "g", "s", "a", "i", "u"],
                  "type": "string"
                },
                "type": "array"
              },
              "posted_from": {
                "description": "YYYY-MM-DD (default: 90 days ago; SAM allows at most a 1-year window)",
                "type": "string"
              },
              "posted_to": {
                "description": "YYYY-MM-DD (default: today)",
                "type": "string"
              },
              "sam_api_key": {
                "description": "Your own free SAM.gov API key. Required unless it is already set as the X-Sam-Api-Key header on the MCP connection; this server has no shared SAM.gov key. Get one free at sam.gov: sign in, open your profile (Account Details), request a public API key. Docs: https://open.gsa.gov/api/get-opportunities-public-api/. Never logged or stored.",
                "type": "string"
              },
              "set_aside": {
                "description": "Set-aside codes: SDVOSBC/SDVOSBS (SDVOSB), VSA/VSS (VOSB), SBA/SBP (small business), 8A/8AN, HZC/HZS (HUBZone), WOSB/EDWOSB",
                "items": {
                  "enum": ["SDVOSBC", "SDVOSBS", "VSA", "VSS", "SBA", "SBP", "8A", "8AN", "HZC", "HZS", "WOSB", "EDWOSB"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:25929a84f298a53cdfb0560128b4117b1a0ad5e59b25d05bb855e1454d286bed"
        },
        {
          "name": "spending_by_category",
          "title": "Federal spending rollups",
          "description": "Aggregate federal contract spending by NAICS, PSC, recipient, or awarding agency over a date range, optionally filtered by keywords/NAICS/agency - market sizing in one call (\"top contractors in NAICS 541512 last year\", \"which agencies buy the most cybersecurity\"). Keyless.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "agency_name": {
                "type": "string"
              },
              "category": {
                "enum": ["naics", "psc", "recipient", "awarding_agency"],
                "type": "string"
              },
              "end_date": {
                "description": "YYYY-MM-DD (default: today)",
                "type": "string"
              },
              "keywords": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "limit": {
                "description": "Top N (default 10)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "naics_codes": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "start_date": {
                "description": "YYYY-MM-DD (default: 1 year ago)",
                "type": "string"
              }
            },
            "required": ["category"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:298f8eb0f3e0a1f45bc22d84286395bf8a306ab2954d0a0e558e11376c338bf7"
        }
      ],
      "prompts": [
        {
          "name": "bid_decision",
          "title": "Work a federal opportunity to a bid/no-bid",
          "description": "Turn a capability description into a grounded bid/no-bid: who buys it, who holds it now, and whether you are eligible.",
          "arguments": [
            {
              "name": "capability",
              "description": "What the company actually sells, in plain terms.",
              "required": true
            },
            {
              "name": "agency",
              "description": "Optional agency to focus on.",
              "required": false
            }
          ],
          "digest": "sha256:09e8c7c04b914b1cbba609cb86af7c0bdc53b3f9450571131a8a990f41615654"
        }
      ],
      "digest": "sha256:f1652bf1f85fbc5d4f00ffda088ce4591fc345f8fb090372f604182ca1c16721"
    }
  }
}
