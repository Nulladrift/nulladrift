      "tools": [
        {
          "name": "fv_get_sample_scene",
          "title": "Open a sample model's 3D scene",
          "description": "Opens one of Field-Viewer's three synthetic sample models (e.g. woning_lindehof) read-only: signed 3D artefact URLs valid for 24 h, plus its name and audience. Use listSamples for the slugs. Public, no side effects.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "The language of `name` and `audience` (nl, en or fr); the request's Accept-Language, else Dutch, when omitted.",
                "enum": ["nl", "en", "fr"],
                "type": "string"
              },
              "slug": {
                "description": "The sample to open, e.g. `woning_lindehof` (as `listSamples` returns it).",
                "pattern": "^[a-z0-9_]{1,64}$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "empty": {
                "type": "boolean"
              },
              "models": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "artifacts": {
                      "additionalProperties": false,
                      "properties": {
                        "elementsUrl": {
                          "type": "string"
                        },
                        "expiresAt": {
                          "format": "date-time",
                          "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                          "type": "string"
                        },
                        "geometryBytes": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "geometryUrl": {
                          "type": "string"
                        },
                        "layersUrl": {
                          "type": "string"
                        },
                        "manifestUrl": {
                          "type": "string"
                        },
                        "openingsUrl": {
                          "type": "string"
                        },
                        "spatialTreeUrl": {
                          "type": "string"
                        }
                      },
                      "required": ["expiresAt", "geometryBytes", "geometryUrl", "manifestUrl"],
                      "type": "object"
                    },
                    "modelId": {
                      "description": "A mdl identifier (TypeID, conventions C5).",
                      "examples": ["mdl_01m8eyc0ccfxmtkx68vxk3ceym"],
                      "pattern": "^mdl_[01234567][0123456789abcdefghjkmnpqrstvwxyz]{25}$",
                      "type": "string"
                    },
                    "name": {
                      "description": "Model display name (1-80 chars after trimming, BR-8).",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "publishedAt": {
                      "format": "date-time",
                      "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                      "type": "string"
                    },
                    "versionId": {
                      "description": "A ver identifier (TypeID, conventions C5).",
                      "examples": ["ver_01m8eyc0ccf4nv6rc2bks6198k"],
                      "pattern": "^ver_[01234567][0123456789abcdefghjkmnpqrstvwxyz]{25}$",
                      "type": "string"
                    },
                    "versionNumber": {
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    }
                  },
                  "required": ["artifacts", "modelId", "name", "publishedAt", "versionId", "versionNumber"],
                  "type": "object"
                },
                "type": "array"
              },
              "sample": {
                "additionalProperties": false,
                "properties": {
                  "audience": {
                    "description": "One line on who it is for, in the asked language (e.g. timber frame).",
                    "type": "string"
                  },
                  "name": {
                    "description": "The sample's name.",
                    "type": "string"
                  },
                  "slug": {
                    "description": "The sample's id, e.g. `woning_lindehof` (the demo project it is).",
                    "enum": ["landhuis_hulstveld", "landhuis_hulstveld_hsb", "woning_lindehof", "villa_berkenhaag", "hal_noorderkempen", "paneelset_werkplaats"],
                    "type": "string"
                  },
                  "thumbnailUrl": {
                    "description": "A signed URL of the model's card image (WebP), valid for 24 hours; absent when the model has none.",
                    "type": "string"
                  }
                },
                "required": ["audience", "name", "slug"],
                "type": "object"
              },
              "truncated": {
                "type": "boolean"
              }
            },
            "required": ["empty", "models", "sample"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4bb08ded59bebe0ebb87bc2564a7ecf14d3e3e831e202a9803244ce5b126408"
        },
        {
          "name": "fv_get_service_status",
          "title": "Get the API service status",
          "description": "Reports whether the Field-Viewer API is reachable and which build is serving traffic. Use it as a first, unauthenticated call to confirm the API is up, or to read the current buildId for support and debugging. Do not use it to check a specific resource's health or as a substitute for authentication. Takes no arguments. Returns status (always \"ok\" when this call succeeds), buildId (the deployed build identifier) and reportedAt (RFC 3339 UTC timestamp of this check). Read-only, no side effects; callable by anyone without credentials (capability: public). Also callable by an anonymous try-it session (anonymousAccess).",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "buildId": {
                "description": "The build identifier currently serving this request (foundation A16).",
                "type": "string"
              },
              "reportedAt": {
                "description": "RFC 3339 UTC timestamp of this check.",
                "type": "string"
              },
              "status": {
                "const": "ok",
                "description": "Always \"ok\" when this call succeeds.",
                "type": "string"
              }
            },
            "required": ["buildId", "reportedAt", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1aa8f7014e369e93f397a57fb2fab0699c0bd4cc20c3f9338661d29f218db97e"
        },
        {
          "name": "fv_list_plans",
          "title": "List Field-Viewer's plans",
          "description": "Lists Field-Viewer's plans (free, team, enterprise) with their limits, features and the Team price (EUR cents, excl. VAT, monthly and yearly), the Team trial length (trial.days, no card) and grace days after a failed payment (graceDays): what each plan allows and costs, whether it takes DXF/DWG drawings (features.cadDrawings) and how long its content is kept (limits.retentionDays, null: no expiry), and so what an upgrade adds when a limit is reached (entitlement.limit_reached) or a feature is not included (entitlement.feature_unavailable). With organizationId (owner/admin): that organisation's own price. Public, no side effects.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "includeInternal": {
                "description": "`true` also returns the plans that are not offered publicly (`internal`, `tryout`). Platform admins only.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "includeTryout": {
                "description": "`true` also returns the `tryout` row (the limits of a tryout without an account), as the try page reads its size cap. Open to anyone.",
                "enum": ["true", "false"],
                "type": "string"
              },
              "organizationId": {
                "description": "Returns this organisation's own price (its discount applied) instead of the list price. Owners and admins of the organisation only.",
                "examples": ["org_01m8eyc0hxeedaw3ynjwhznrbk"],
                "pattern": "^org_[01234567][0123456789abcdefghjkmnpqrstvwxyz]{25}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "asOf": {
                "description": "When this answer was made.",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                "type": "string"
              },
              "data": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "customisable": {
                      "const": true,
                      "description": "Present on a plan whose limits and price are agreed per organisation (`enterprise`).",
                      "type": "boolean"
                    },
                    "features": {
                      "additionalProperties": false,
                      "properties": {
                        "auditLogExport": {
                          "description": "Whether the activity log can be exported as CSV (`requestAuditLogExport`).",
                          "type": "boolean"
                        },
                        "autoDimensions": {
                          "type": "boolean"
                        },
                        "cadDrawings": {
                          "description": "Whether the plan takes DXF and DWG drawings next to PDF, in this environment: the CAD drawings flag for this plan (its default, or the plan's rollout group). The API's upload rules read the same value. An organisation in a rollout cohort can differ from its plan.",
                          "type": "boolean"
                        },
                        "sso": {
                          "description": "Reserved for single sign-on. Not in use yet.",
                          "type": "boolean"
                        },
                        "workstationMode": {
                          "type": "boolean"
                        }
                      },
                      "required": ["auditLogExport", "autoDimensions", "cadDrawings", "sso", "workstationMode"],
                      "type": "object"
                    },
                    "graceDays": {
                      "description": "Only on a priced plan (`team`): how many days the plan is kept after a failed payment, before the organisation returns to the free plan.",
                      "exclusiveMinimum": 0,
                      "maximum": 9007199254740991,
                      "type": "integer"
                    },
                    "hiddenLimits": {
                      "description": "Keys in `limits` that are not a difference between plans and are not to be shown: the server holds no one to them (`maxModelsPerProject`: a project has one 3D model, with revisions; `processingMinutesPerMonth`: not counted). They stay in `limits` for older readers.",
                      "items": {
                        "enum": ["seats", "guests", "workstations", "projects", "storageBytes", "maxModelFileBytes", "maxModelsPerProject", "processingMinutesPerMonth", "apiTokens", "maxDocumentFileBytes", "maxDocumentsPerProject"],
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "id": {
                      "enum": ["free", "team", "enterprise", "internal", "tryout"],
                      "type": "string"
                    },
                    "limits": {
                      "additionalProperties": false,
                      "properties": {
                        "apiTokens": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "guests": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxDocumentFileBytes": {
                          "description": "Largest single drawing file (PDF, DXF, DWG), in bytes. The format's own ceiling still applies on top.",
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxDocumentsPerProject": {
                          "description": "Most drawings (documents) in one project. Absent: no limit.",
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxModelFileBytes": {
                          "description": "Largest single model file, in bytes, for direct upload and URL import. Never above 1 GiB (BR-10).",
                          "maximum": 1073741824,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "maxModelsPerProject": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "processingMinutesPerMonth": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "projects": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "retentionDays": {
                          "anyOf": [
                            {
                              "exclusiveMinimum": 0,
                              "maximum": 9007199254740991,
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "How many days content on this plan is kept before it is deleted, counted from its creation: `7` on `tryout`, `null` on every plan whose content does not expire."
                        },
                        "seats": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "storageBytes": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        },
                        "workstations": {
                          "maximum": 9007199254740991,
                          "minimum": 0,
                          "type": "integer"
                        }
                      },
                      "required": ["apiTokens", "guests", "maxDocumentFileBytes", "maxModelFileBytes", "maxModelsPerProject", "processingMinutesPerMonth", "projects", "retentionDays", "seats", "storageBytes", "workstations"],
                      "type": "object"
                    },
                    "name": {
                      "additionalProperties": false,
                      "description": "The plan's name in Dutch, English and French.",
                      "properties": {
                        "en": {
                          "type": "string"
                        },
                        "fr": {
                          "type": "string"
                        },
                        "nl": {
                          "type": "string"
                        }
                      },
                      "required": ["en", "fr", "nl"],
                      "type": "object"
                    },
                    "price": {
                      "additionalProperties": false,
                      "description": "Only on a plan with a published price (`team`): EUR cents, excl. VAT, per month and per year.",
                      "properties": {
                        "currency": {
                          "const": "EUR",
                          "type": "string"
                        },
                        "current": {
                          "additionalProperties": false,
                          "description": "What this caller pays now, excl. VAT: the list price, or the list price after its organisation's discount.",
                          "properties": {
                            "monthlyCents": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            },
                            "yearlyCents": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            }
                          },
                          "required": ["monthlyCents", "yearlyCents"],
                          "type": "object"
                        },
                        "discount": {
                          "additionalProperties": false,
                          "description": "The discount behind `current`; never sent to an anonymous caller.",
                          "properties": {
                            "endsAt": {
                              "format": "date-time",
                              "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$",
                              "type": "string"
                            },
                            "id": {
                              "type": "string"
                            },
                            "name": {
                              "type": "string"
                            }
                          },
                          "required": ["id", "name"],
                          "type": "object"
                        },
                        "list": {
                          "additionalProperties": false,
                          "description": "The list price, excl. VAT.",
                          "properties": {
                            "monthlyCents": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            },
                            "yearlyCents": {
                              "maximum": 9007199254740991,
                              "minimum": 0,
                              "type": "integer"
                            }
                          },
                          "required": ["monthlyCents", "yearlyCents"],
                          "type": "object"
                        },
                        "revision": {
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        }
                      },
                      "required": ["currency", "current", "list", "revision"],
                      "type": "object"
                    },
                    "trial": {
                      "additionalProperties": false,
                      "description": "Only on a priced plan that can be tried (`team`): the trial an owner starts once per organisation.",
                      "properties": {
                        "days": {
                          "description": "How long the trial runs, in days. No card needed.",
                          "exclusiveMinimum": 0,
                          "maximum": 9007199254740991,
                          "type": "integer"
                        }
                      },
                      "required": ["days"],
                      "type": "object"
                    }
                  },
                  "required": ["features", "hiddenLimits", "id", "limits", "name"],
                  "type": "object"
                },
                "type": "array"
              },
              "revision": {
                "description": "Changes whenever anything in this answer changes (the REST ETag). Opaque, not a counter.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["asOf", "data", "revision"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
