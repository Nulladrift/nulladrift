                "default": "",
                "description": "Optional description of the entity.",
                "type": "string"
              },
              "entity_type": {
                "default": "",
                "description": "Optional entity type: 'company' (default) or 'person'.",
                "type": "string"
              },
              "external_entity_id": {
                "anyOf": [
                  {
                    "type": "string"
