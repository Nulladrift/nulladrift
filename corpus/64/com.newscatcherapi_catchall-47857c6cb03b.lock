        {
          "name": "create_monitor",
          "title": "Create Monitor",
          "description": "Create a recurring monitor from a completed job.\n\nMonitors re-run a job's query on a schedule. Use the explore -> refine -> automate\npattern: submit a job, refine until results match, then create a monitor.\n\nThe schedule is defined in natural language (e.g., 'every day at 9 AM EST').\nAlways include a timezone (in the schedule text or via the `timezone` arg).\nAPI-enforced constraints apply:\n- If `backfill=true`, reference job end_date must be within the last 7 days\n- If `backfill=false`, reference job age does not matter\n- Minimum schedule frequency depends on your plan\n\nWebhooks are now centralized: register them with `create_webhook`, then pass\ntheir IDs here via `webhook_ids` (there is no inline webhook config anymore).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "default": "",
                "description": "CatchAll API key. Optional if provided via x-api-key header or CATCHALL_API_KEY env var.",
                "type": "string"
              },
              "backfill": {
                "default": true,
                "description": "Optional gap-fill toggle before first run (default true).",
                "type": "boolean"
              },
              "limit": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional max records per run (minimum 10). If omitted, API uses plan default."
              },
              "project_id": {
                "default": "",
                "description": "Optional project ID to associate this monitor with.",
                "type": "string"
              },
              "reference_job_id": {
                "description": "ID of a completed job to use as the template",
                "type": "string"
              },
              "schedule": {
                "description": "Natural language schedule (e.g., 'every day at 9 AM EST', 'every Monday at 8 AM UTC', 'every 48 hours')",
                "type": "string"
              },
              "timezone": {
                "default": "",
                "description": "Optional IANA timezone for the schedule (e.g. 'America/New_York').\nDefaults to UTC. A timezone written into the schedule text overrides this.",
                "type": "string"
              },
              "webhook_ids": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional list of webhook IDs to notify on each run completion (max 5)."
              }
            },
            "required": ["reference_job_id", "schedule"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "type": "string"
              }
            },
            "required": ["result"],
            "type": "object",
