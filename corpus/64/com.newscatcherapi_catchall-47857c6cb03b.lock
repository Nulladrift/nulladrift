          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "api_key": {
                "default": "",
                "description": "CatchAll API key. Optional if provided via x-api-key header or CATCHALL_API_KEY env var.",
                "type": "string"
              },
              "job_id": {
                "description": "The job ID to continue processing",
                "type": "string"
