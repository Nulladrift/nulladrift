        "url": "https://dcblueprint.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "dcblueprint",
        "title": "DC Blueprint data-centre intelligence",
        "version": "1.0.0",
        "websiteUrl": "https://dcblueprint.com/connector"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "DC Blueprint is an independent European data-centre intelligence site. These tools return dated figures from its trackers: data-centre projects by market, grid connection restrictions, data-centre rules by country and the live grid. Quote the date with every figure and link the page given at the end of each answer. business_case_figures needs the user's personal key and costs credits; ask it for the market and figure the user's question needs, not for every market. When it says the key is missing or the credits are used, tell the user what it says. market_projects, the whole list of a market's tracked projects, needs the same key; the market overview already gives the first three for free.",
      "tools": [
        {
          "name": "business_case_figures",
          "title": "Data-centre business-case figures for one market",
          "description": "The inputs of a colocation data-centre business case for one European market: construction cost per MW, colocation prices per kW-month, electricity price, staff cost, guarding, property tax, exit yield, grid wait, permitting and grid charges, with low and high. Needs a personal DC Blueprint key (Authorization: Bearer) from an account with a DC Blueprint licence or trial. Ask for one market for the project at hand: every figure costs 5 credits, one figure (the \"figure\" argument) 1; the same answer again in the calendar month costs nothing. It is not a way to copy the catalogue market by market. Markets: Amsterdam, Athens, Barcelona, Berlin, Copenhagen, Dublin, Frankfurt, Helsinki, Lisbon, London, Madrid, Milan, Oslo, Paris, Stockholm, Vienna, Warsaw, Zurich. Figures: Construction cost, Colocation price, retail, Colocation price, wholesale, Colocation price, large deals, Electricity price, Cost of a site employee, Guarding and monitoring, Property tax, Exit yield, Wait for a grid connection, Permitting, Grid connection charge, Customer substation.",
          "inputSchema": {
            "properties": {
              "figure": {
                "description": "Optional: one figure only, e.g. \"Construction cost\" or \"Exit yield\" (1 credit). Leave it out for every figure of the market.",
                "type": "string"
              },
              "market": {
                "description": "A business-case market, e.g. \"Frankfurt\", \"Milan\".",
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Business-case figures"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a95b3bf00d6c9be26e087a3b3edb558778c71cf5d3efbfb1119750b1a25ce334"
        },
        {
          "name": "data_centre_market_overview",
          "title": "Data-centre market overview (Europe)",
          "description": "Dated overview of a European data-centre market: how many data-centre projects of 500 kW or more our pipeline tracker lists and how many are permitted or being built, the facility power by stage (IT load and MVA converted, marked ≈), who develops the most of them, whether new grid connections are paused, rationed or conditional in that country, the grid carbon intensity and power price this hour, how many operating data-centre sites we track there (at least), its first three tracked projects, and how many data-centre rules apply. Use for questions like \"data centres in Germany\", \"Frankfurt data centre market\", \"who is building data centres in Spain\". Metros: London, Frankfurt, Paris, Amsterdam, Dublin, Milan, Madrid, Central Scotland, Zaragoza, Zurich, Helsinki, Athens, Berlin, Lille, Lyon, Rhineland, Rome, Warsaw, Barcelona, Lisbon, Stockholm, Bristol, Copenhagen, Oslo. Countries: United Kingdom, Germany, Italy, Spain, France, Finland, Netherlands, Norway, Ireland, Poland, Sweden, Greece, Switzerland, Denmark, Portugal, Belgium, Czechia, Romania, Croatia, Estonia, Austria, Lithuania, Hungary, Latvia.",
          "inputSchema": {
            "properties": {
              "market": {
                "description": "A country or metro name, e.g. \"Frankfurt\", \"Ireland\", \"the Netherlands\".",
                "type": "string"
              }
            },
            "required": ["market"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Data-centre market overview"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:836a7b14013ab23469fc908b3f59e77414b0653ea2488222988d1d568a9f6815"
        },
        {
          "name": "data_centre_rules",
          "title": "Data-centre rules and deadlines by country",
          "description": "The national and EU rules for building and running a data centre in one European country (energy efficiency reporting, waste heat, permitting, grid), each with its status, who it applies to and the next date that matters, plus upcoming deadlines. Countries: Germany, France, Ireland, Netherlands, Italy, Spain, Sweden, Finland, Denmark, Poland, United Kingdom, Belgium, Czechia, Portugal, Switzerland, Norway, Greece, Austria, Hungary, Croatia, Lithuania, Latvia, Estonia, Romania, Bulgaria, Slovakia, Slovenia, Cyprus, Malta, Luxembourg, United States.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "A European country, e.g. \"Germany\".",
                "type": "string"
              }
            },
            "required": ["country"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
