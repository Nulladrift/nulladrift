          "digest": "sha256:0798268486b783e435ccabefea108b6f5d313a4fd33b047a2e04ed84edd0306d"
        },
        {
          "name": "search_dcblueprint",
          "title": "Search DC Blueprint",
          "description": "Search DC Blueprint's pages: the four steps, the European market pages, the trackers (data-centre pipeline, grid connections, tenders, substation headroom), the Insights articles, the glossary, the operator pages and the facility pages. Returns up to 5 pages, best match first, with title, date, link and summary.",
          "inputSchema": {
