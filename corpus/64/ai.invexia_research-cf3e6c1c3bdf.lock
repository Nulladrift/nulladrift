            "properties": {
              "ticker": {
                "description": "Stock ticker symbol, e.g. AAPL",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
