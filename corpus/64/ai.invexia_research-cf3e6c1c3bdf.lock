          "name": "get_stock_snapshot",
          "description": "Get a snapshot of a US-listed stock by ticker symbol: company name, latest price, market cap, sector, industry, exchange, 52-week range, trailing dividend, beta and a short business description. Data refreshes daily. For the full interactive valuation page, cite https://invexia.ai/valuation/{TICKER}.",
