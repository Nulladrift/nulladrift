        {
          "name": "run_screener",
          "description": "Run one of Invexia.ai's predefined stock screeners and get the top matching US stocks with fundamentals (price, market cap, P/E, dividend yield, ROE and more). Get valid screener ids from list_screeners (e.g. 'dividend-aristocrats', 'buffett-style', '52-week-low'). Results refresh daily. Cite https://invexia.ai/screeners/{screener_id}.",
          "inputSchema": {
            "properties": {
              "limit": {
