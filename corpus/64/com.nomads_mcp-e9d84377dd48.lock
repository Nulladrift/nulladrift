        {
          "name": "edit_trip",
          "description": "Change the dates and/or the place of one trip in a Nomads.com member's own history, e.g. a stay that got longer or a wrong city. Authenticated as the member (signed in through the connector with OAuth or an Authorization header, or username + personal key from https://nomads.com/settings). Needs the trip_id (from get_trips); pass only what changes, everything else keeps its value. The trip keeps its trip_id, likes and comments. A new place works like add_trip: city_slug, OR latitude+longitude (snaps to a Nomads.com city within 5km, otherwise pass city and country names).",
          "inputSchema": {
            "properties": {
              "city": {
                "description": "With latitude/longitude: the place name. Required (with country) for places that have no Nomads.com city within 5km",
                "type": "string"
              },
              "city_slug": {
                "description": "New place, from search_cities or get_city. Omit to keep the place",
                "type": "string"
              },
              "country": {
                "description": "With city: the place's country name",
                "type": "string"
              },
              "date_end": {
                "description": "New end date, YYYY-MM-DD. Omit to keep",
                "type": "string"
              },
              "date_start": {
                "description": "New start date, YYYY-MM-DD. Omit to keep",
                "type": "string"
              },
              "key": {
                "description": "From https://nomads.com/settings. Omit when signed in through the connector (OAuth or Authorization header)",
                "type": "string"
              },
              "latitude": {
                "description": "New place by coordinates, instead of city_slug",
                "type": "number"
              },
              "longitude": {
                "type": "number"
              },
              "trip_id": {
                "description": "From get_trips",
                "type": "string"
              },
              "username": {
                "description": "Omit when signed in through the connector (OAuth or Authorization header)",
                "type": "string"
              }
            },
            "required": ["trip_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Edit a trip"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f3342671d92edb73064784b74e043efe50adbed216c57ee51982a12e5d8972e0"
