        {
          "name": "get_trips",
          "description": "Get a Nomads.com member's own trip history (past and upcoming stays: city, country, dates), newest first, 200 by default; use from_date/to_date for a period and limit for more. Authenticated as the member: signed in through the connector (OAuth sign-in or an Authorization header) if set up, otherwise pass the member's username and their personal key from https://nomads.com/settings - this is private data, not for looking up other people.",
          "inputSchema": {
            "properties": {
              "from_date": {
                "description": "Only trips that end on or after this date, YYYY-MM-DD",
                "type": "string"
              },
              "key": {
                "description": "From https://nomads.com/settings. Omit when signed in through the connector (OAuth or Authorization header)",
                "type": "string"
              },
              "limit": {
                "description": "How many trips, newest first: 1 to 1000, default 200",
                "type": "integer"
              },
              "to_date": {
                "description": "Only trips that start on or before this date, YYYY-MM-DD",
                "type": "string"
              },
              "username": {
                "description": "Omit when signed in through the connector (OAuth or Authorization header)",
                "type": "string"
              }
            },
            "required": [],
