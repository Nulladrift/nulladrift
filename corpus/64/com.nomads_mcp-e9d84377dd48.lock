                "description": "Max monthly cost for a nomad in USD (responses also carry expat, local, family, rent and coworking costs)",
                "type": "integer"
              },
              "max_temperature_c": {
                "type": "number"
              },
              "min_internet_mbps": {
                "type": "number"
              },
              "min_safety": {
