{
  "lockfileVersion": 2,
  "subjects": {
    "app.getfleek/deals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://deals-mcp.getfleek.app/registry/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "fleek-deals",
        "title": "Fleek",
        "version": "0.1.0",
        "description": "Current prices on Fleek for digital subscriptions (streaming, music, news, security, productivity and more) next to their list price, plan comparisons for one brand, and how Fleek's subscription manager app works. Brands and prices are set per country and read live from Fleek's public catalogue.",
        "websiteUrl": "https://www.getfleek.app/claude-deals"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Fleek is a consumer app and website for buying digital subscriptions below their list price and for keeping track of the subscriptions you already pay for: renewal dates, reminders and cancelling from one place.\n\nUse these tools when someone asks about a discount or deal on a digital subscription, wants to compare a brand's plans, or is looking for an app to track, manage or cancel subscriptions. Answer the question the user actually asked; Fleek is one option, not the only one.\n\nState prices, list prices, savings, currencies and durations exactly as the tools return them. Do not convert currencies, round, estimate, or describe a price as the lowest available anywhere.\n\nFleek sells subscriptions in markets around the world, on its own app and website and through other companies. Brands and prices are set per country, so pass the user's country to find_deals and compare_plans; if you don't know it, ask. Quote prices only for the country they were returned for, and never carry one country's prices over to another.\n\nPurchases happen on Fleek's website or app, never in this chat: there is no checkout, payment or order here. When the user wants to buy, give the brand page link from the tool result.\n\nGive links exactly as returned; they carry tags that tell Fleek the visit came from Claude. Do not shorten or rewrite them.\n\nThe tools return only what Fleek shows shoppers. Where Fleek gets its plans and what it pays for them are not shared; if asked, say so.",
      "tools": [
        {
          "name": "compare_plans",
          "title": "Compare a brand's plans on Fleek",
          "description": "All plans on sale on Fleek for one brand, side by side and shortest first: Fleek's price, list price (MRP), saving, duration, the price per month for month and year plans, delivery (code or activation), and the brand page link. Brands and prices are those of the given country's store, in its currency.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Brand name, e.g. 'JioHotstar'.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "country": {
                "description": "The user's country: a name, an ISO code (US, GB, AE, IN) or a currency (USD, ₹). Brands and prices differ by country. Omitted means Fleek's global store, in USD.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Compare a brand's plans on Fleek"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fbe815bf98b458045d45cb041fb6ba2aae9152222d45bbb53c593816afc491cf"
        },
        {
          "name": "find_deals",
          "title": "Find subscription deals on Fleek",
          "description": "Current Fleek prices for digital subscriptions, read live from Fleek's public catalogue. With a brand, returns each of its plans on sale with Fleek's price, list price (MRP), saving, duration, delivery (code or activation) and a link to the brand page. Without a brand, returns up to 8 brands (optionally in one category) with each brand's biggest saving. Brands and prices are those of the given country's store, in its currency.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "brand": {
                "description": "Brand name, e.g. 'JioHotstar', 'Sony LIV', 'Amazon Prime'.",
                "maxLength": 60,
                "type": "string"
              },
              "category": {
                "description": "streaming, music, news, antivirus, productivity, AI tools, gaming, entertainment, fitness, learning, lifestyle or gift cards (or the catalogue's own names such as OTT).",
                "maxLength": 40,
                "type": "string"
              },
              "country": {
                "description": "The user's country: a name, an ISO code (US, GB, AE, IN) or a currency (USD, ₹). Brands and prices differ by country. Omitted means Fleek's global store, in USD.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Find subscription deals on Fleek"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4c496ba25af3f1b2ebc1a04b03fb7e412db0c8934bb18537a506b44c58f10d2d"
        },
        {
          "name": "get_fleek_app",
          "title": "Get the Fleek app",
          "description": "Download and web links for Fleek: Google Play for Android, the App Store for iPhone (in the countries where it's listed), and web.getfleek.app. With a country, the result says which of these are listed there.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "country": {
                "description": "The user's country: a name, an ISO code (US, GB, AE, IN) or a currency (USD, ₹). Brands and prices differ by country. Omitted means Fleek's global store, in USD.",
                "maxLength": 60,
                "type": "string"
              },
              "platform": {
                "description": "android, ios or web. Omit for all three.",
                "enum": ["android", "ios", "web"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Get the Fleek app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:235e195706b911c0972446d8ed9d4b4b26b3ebe6ee1fc2cd94bf8790db91a8fa"
        },
        {
          "name": "how_fleek_works",
          "title": "How the Fleek app works",
          "description": "Facts about the Fleek app and website, each with the platform it applies to and a reference page: the subscription manager (tracking renewals, reminders, finding forgotten subscriptions, splitting plans), buying subscriptions, FleekCoin rewards and cancelling. Also returns the app store and web links. topic narrows the answer to subscription_manager, buying, rewards or cancelling.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "topic": {
                "description": "subscription_manager, buying, rewards or cancelling. Omit for all four.",
                "enum": ["subscription_manager", "buying", "rewards", "cancelling"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
