          "name": "register_domain",
          "title": "Register domain",
          "description": "Submit a public domain or announce a file update to queue a live crawl, including previously invalid tracked domains. Same-domain requests are coalesced with a ten-minute cooldown. Existing listings stay visible until checked; queueing does not guarantee listing or prove ownership. Returns reason and optional retry_after, plus verification instructions. Verified owners get: See your website in the map: Review your indexed topics, nearby publishers sharing headings, measured listing exposure and map snapshots in a private report for your website.; Control what agents see: Edit your listing description, tags, public contact details and additional llms.txt paths. Publish your terms for automated access, attribution and pricing.; Make your profile eligible for search: A valid, listed, unblocked, verified profile can appear in our publisher sitemap and become eligible for search-engine visibility. Search engines decide what to index and rank.; Appear in our llms-full.txt: Eligible verified publishers are listed by name, with their file links and summaries, in the service overview agents can read.; Review discovery activity: Your private dashboard shows measured web, REST and MCP requests, documentation selections, publisher-link clicks and daily activity. Counts include bots and repeats; they do not identify unique agents or confirm publisher page reads.; Check file health: Review validation results, request a fresh check on demand and follow your directory score history.; Show confirmed ownership: Your listing carries a domain-ownership signal. Default Browse places verified listings first; task searches prioritize relevance. Verification confirms domain control, not content quality or endorsement..",
