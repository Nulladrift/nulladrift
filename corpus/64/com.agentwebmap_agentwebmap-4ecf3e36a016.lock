                "type": "string"
              },
              "capability": {
                "description": "Filter to sites explicitly publishing an MCP endpoint link. Publisher declaration alone does not prove availability.",
                "enum": ["mcp"],
                "type": "string"
              },
              "category": {
                "description": "Filter by inferred topic ID from list_categories. Topics describe publisher metadata, not capabilities or correctness.",
                "enum": ["ai-ml", "developer-tools", "infrastructure", "data-analytics", "cybersecurity", "finance-payments", "ecommerce", "productivity", "marketing", "education", "healthcare", "media", "design", "gaming", "travel", "community", "legal", "recruiting-careers", "industrial-manufacturing", "real-estate", "arts-culture", "sports-fitness", "food-dining", "automotive", "government-public-services", "science-research", "ai-agents-mcp", "apis-sdks", "databases", "auth-identity", "devops-observability", "no-code-automation", "communications", "crypto-web3", "saas-business-software", "open-source", "documentation-reference", "fashion-beauty", "home-garden", "consumer-electronics", "pets", "insurance", "telecom", "logistics-shipping", "energy-utilities", "construction-architecture", "agriculture", "nonprofit", "events", "personal-blog", "entertainment", "local-business"],
