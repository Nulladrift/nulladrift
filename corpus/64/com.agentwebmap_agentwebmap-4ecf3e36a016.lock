          "name": "resolve",
          "title": "Resolve",
          "description": "Start here to find documentation for a domain or development task. Returns specific page URLs with publisher excerpts, matching evidence, owner-stated terms, freshness and alternatives. A named publisher stays scoped to its valid documentation or known replacement. No usable publisher or insufficient relevance returns no_match with best=null. Strong requires page-purpose evidence and publisher fit, not ownership verification. Weak matches are fallback candidates: refine the query or search elsewhere. Use max_age to mark stale root checks, the registered check_llms_txt tool for live validation, and detail=full for owner metadata. The first 100 distinct publishers per UTC day need no key; register a named integration and purpose for 5,000/day shared across the account.",
