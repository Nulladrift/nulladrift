          "description": "Generate a personalized LinkedIn connection request note based on the prospect's profile and your business context. Max length depends on sender tier: 200 chars for free accounts, 300 for paid. Before using this for real outreach, call library_context_get(skill_slug='craft-outreach', include_examples=true) and apply the returned Outreach template plus Brand context.",
