        {
          "name": "zevari_reparent_account",
          "description": "Operator-only account separation: re-own one user's MOVE-class data/knowledge (leads, lists, signals, research, content) from one org/LinkedIn-account scope to another via the owner-lane reparent step. Campaigns + provider/execution/audit are intentionally RETAINED with the separating operator (the beneficiary recreates outreach). Workflow: run with dry_run=true first to preview table_counts, stage an account_reparent confirmation, then re-call with dry_run=false and the confirmation_id to apply. The subscription org pointer moves atomically inside the function on a cross-org separation; reconcile Stripe afterward with zevari_transfer_billing_ownership. To roll back, re-run with from/to swapped under the same idempotency_key.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_id": {
                "type": "string"
              },
              "dry_run": {
                "type": "boolean"
              },
              "from_linkedin_account_id": {
                "type": "string"
              },
              "from_org_id": {
                "description": "Source org_id that currently owns the target's data/knowledge.",
                "type": "string"
              },
              "idempotency_key": {
                "description": "Stable key for this reparent operation. Re-applying the same key is a no-op. To roll back, re-run with from/to scopes swapped under this same key.",
                "type": "string"
              },
              "target_user_id": {
                "description": "Zevari user_id of the account being separated/moved.",
                "type": "string"
              },
              "to_linkedin_account_id": {
                "type": "string"
              },
              "to_org_id": {
                "description": "Destination org_id that should own the target's data/knowledge after the move.",
                "type": "string"
              }
            },
            "required": ["from_org_id", "idempotency_key", "target_user_id", "to_org_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f82ec38bd7912ac90f8187287ed5abc9d1b811f114f58d728b8a0ffe32e51b9c"
        },
        {
          "name": "zevari_transfer_billing_ownership",
          "description": "Operator-only account separation, billing reconcile step. The subscription/org pointer already moved atomically inside the reparent step, so this tool does NOT do a second cross-org write. It reads the reparent reconcile view for drift on the target and returns the exact Stripe instructions — metadata.org_id AND the identity carriers metadata.user_id/metadata.owner_user_id per expected_stripe_identity (stale identity carriers make every later subscription webhook fail billing_identity_mismatch) — to be applied only through the operator billing tool. reconciled=true when the reconcile view returns zero drift rows.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "idempotency_key": {
                "description": "REQUIRED: the same idempotency_key used for the zevari_reparent_account apply step. Used to confirm an applied reparent operation into to_org_id exists before reporting reconciliation, so the tool never returns a false reconciled=true when no operation ran.",
                "type": "string"
              },
              "target_user_id": {
                "description": "Zevari user_id whose billing/org pointer is being reconciled.",
                "type": "string"
              },
              "to_org_id": {
                "description": "Destination org_id the subscription metadata should point at.",
                "type": "string"
              }
            },
            "required": ["idempotency_key", "target_user_id", "to_org_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aad9491bde3cd5d5ae8bc1f48f5a96d6c39dbef10c69e8576b3e0c74c8037cb5"
        }
