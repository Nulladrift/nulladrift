        {
          "name": "actions_chat_update_confirmation",
          "description": "Revise a pending single-action confirmation before approval. Provide a complete replacement_payload using the same executing tool schema. The server re-normalizes the payload, recomputes hashes/risk/approval channels, increments revision, rotates any chat approval phrase, and invalidates prior approval phrases. Bulk confirmations and campaign_v2_enroll confirmations are not editable through this tool; change one lead's message in a waiting campaign_v2_enroll batch with campaigns_v2_update_lead_message.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_id": {
                "description": "The pac_* confirmation id to revise.",
                "type": "string"
              },
              "content_policy_override": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "enum": ["literal", "token", "rule"],
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["kind", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "expected_revision": {
                "type": "number"
              },
              "replacement_payload": {
                "additionalProperties": {
                  "additionalProperties": true
                },
                "description": "The COMPLETE replacement payload for the original action_type. Start from actions_get_confirmation_preview.preview_payload, apply the user's requested edits, and include every required field.",
                "type": "object"
              },
              "user_edit_summary": {
                "type": "string"
              }
            },
            "required": ["confirmation_id", "replacement_payload"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1c1a3f23f19673f8492a004f4b6175017c06536fe20af78f28796d45d3bb842e"
        },
        {
          "name": "actions_dry_run",
          "description": "Preview exactly what an action would do WITHOUT doing it and without staging anything. Returns the canonical payload and its hash, the resolved lead context, a current safety evaluation, and any gates that would block or warn. Creates no confirmation, no receipt, no audit intent and no queue row, and performs NO LinkedIn or email WRITE — nothing is sent, invited, posted or changed. Note it may perform read-only provider lookups while resolving a recipient (the same ones staging performs), so this is not a zero-network preview. Use it to check a payload, show the user what would be sent, or find out whether an action would be blocked before committing to an approval. IMPORTANT: the safety numbers are an evaluation, NOT a reservation (evaluation.authoritative is always false) — capacity can be consumed by another action between this preview and the send, so never describe the result as guaranteed. It reports would_block_on_safety (null = could not determine) and gates_not_evaluated — a false there means no safety-budget denial, NOT that the action would succeed, since execution applies further gates this preview cannot run. To actually perform the action, stage it with actions_request_confirmation afterwards.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_type": {
                "description": "The action family to preview. Same allowlist as actions_request_confirmation.",
                "enum": ["linkedin_send_message", "linkedin_send_inmail", "linkedin_send_connection_request", "linkedin_cancel_invitation", "linkedin_respond_invitation", "linkedin_create_post", "linkedin_comment_on_post", "linkedin_react_to_post", "linkedin_react_post_comment", "email_send_message", "campaign_activate", "campaign_update_target_set", "campaign_update_step_config", "bulk_delete", "bulk_export", "agents_enrich_email_batch", "account_reparent"],
                "type": "string"
              },
              "content_policy_override": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "enum": ["literal", "token", "rule"],
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["kind", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "payload": {
                "additionalProperties": {
                  "additionalProperties": true
                },
                "description": "The COMPLETE action payload you would stage, in the same shape actions_request_confirmation expects. It is validated and canonicalized by the same code, so a payload rejected here would be rejected there for the same reason.",
                "type": "object"
              }
            },
            "required": ["action_type", "payload"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:52a6d1b1fed3dd99c1a9e9ba17048c79d6803524854f637dd65b512a4dd4cc50"
        },
        {
          "name": "actions_get_confirmation_preview",
          "description": "Fetch the canonical server-staged preview for a pending confirmation, including risk_class, operating context, approval channels, browser approval URL, and any chat approval phrase. Show this preview to the user before asking them to approve or reject.",
