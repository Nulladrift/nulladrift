      },
      "instructions": "AI SDR Kit by Zevari, the SDR harness for your AI. Your AI is the brain; Zevari teaches it how to run outbound. Free without an account: `get_outbound_sop` (the operating procedure) and `get_sequence_playbook` (lead routing and every sequence). The other tools (the AI Sales Director, automations, LinkedIn and email sending) need a Zevari account: add https://mcp.zevari.ai/mcp as a connector and sign in.",
      "tools": [
        {
          "name": "actions_chat_approve_confirmation",
          "description": "Approve a low/medium-risk pending confirmation from chat after the user replies with the exact approval phrase returned by actions_request_confirmation or actions_get_confirmation_preview. High-risk, tainted, paid, expired, stale, or account-mismatched confirmations are denied and must use the browser approval URL.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "approval_phrase": {
                "description": "The exact approval_phrase the user replied with, e.g. 'Approve Zevari action pac_... code 123456'.",
                "type": "string"
              },
              "confirmation_id": {
                "description": "The pac_* confirmation id to approve.",
                "type": "string"
              },
              "user_confirmation_text": {
                "type": "string"
              }
            },
            "required": ["approval_phrase", "confirmation_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:62447dd276964ea31fdfdc3cff28d7ab586974c33a0b97e85b46426e52485c6f"
        },
        {
          "name": "actions_chat_reject_confirmation",
          "description": "Reject a pending confirmation from chat after the user replies with the exact reject phrase returned by actions_get_confirmation_preview.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "confirmation_id": {
                "description": "The pac_* confirmation id to reject.",
                "type": "string"
              },
