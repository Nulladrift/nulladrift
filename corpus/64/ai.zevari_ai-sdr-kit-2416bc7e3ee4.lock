            "readOnly": false
          },
          "digest": "sha256:6f04ccb307a394a993c860fdcadc93950a7124730cb11696736db03fa5c83702"
        },
        {
          "name": "actions_get_receipt",
          "description": "Fetch one durable action receipt by its rcpt_* id: lifecycle status (queued/executing/succeeded/failed/deferred/rejected/cancelled/outcome_unknown), every linked identifier (confirmation, request, audit intent/outcome, LinkedIn object ids), the safety snapshot, and the hydrated lead_context. Linked sends add action_id, action_status (queued/started/sent/failed/cancelled/outcome_unknown), not_before, next_try_after for queued actions, and a customer-safe reason. Queued means next try after that time, not guaranteed delivery then. Existing receipt status values are unchanged. Receipts are returned in every LinkedIn write response as action.receipt_id. An outcome_unknown status means the LinkedIn response was lost — the action may have landed; do NOT retry it automatically. Planned campaign steps carry written_by (who composed the words: your_ai, zevari, or together) and sent_by: zevari. Zevari delivers every campaign message; delivery is not authorship.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "receipt_id": {
                "description": "The rcpt_* receipt id from a write response's action.receipt_id or a recent_activity item.",
                "type": "string"
              }
            },
            "required": ["receipt_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:204657d6accd470af43756d5e8e0b1f8f673845c0e2f5333dcbcacb96adc188d"
        },
        {
          "name": "actions_list_for_lead",
          "description": "Page through the action history for one saved lead (newest first, default 50 per page, max 100). Items carry receipt ids/status where receipt linkage exists (receipt era), plus campaign ids, request/confirmation/audit ids, LinkedIn object ids, safety decision, and normalized error codes. Linked sends add live action_id, action_status (queued/started/sent/failed/cancelled/outcome_unknown), not_before, next_try_after for queued actions, and a customer-safe reason. Queued means next try after that time, not guaranteed delivery then. Existing history status values are unchanged. Never automatically retry outcome_unknown. The first call freezes an as_of snapshot and optional from/to bounds; pass the returned next_cursor to continue the SAME frozen result set (do not pass from/to again). Continues seamlessly from lead_context.recent_activity.next_cursor. Planned campaign steps carry written_by (who composed the words: your_ai, zevari, or together) and sent_by: zevari. Zevari delivers every campaign message; delivery is not authorship.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "lead_id": {
                "description": "The saved lead's lead_id (from lead_context.lead.lead_id or leads_* tools).",
                "type": "string"
              },
              "limit": {
                "type": "number"
              },
              "to": {
                "type": "string"
              }
            },
            "required": ["lead_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e02bbb03364997b68a811180feb0ea823c481f07c863d67210d876ddf4cf4c7"
        },
        {
          "name": "actions_request_bulk_confirmation",
          "description": "Stage multiple destructive actions under one approval URL. PREFER THIS over actions_request_confirmation when you have ≥2 outbound write actions to stage in this turn — the user reviews and approves all items in one click instead of opening N separate links. Allowlisted child action_types: linkedin_send_message, linkedin_send_inmail, linkedin_send_connection_request, linkedin_comment_on_post, linkedin_react_to_post, linkedin_create_post. Server returns one approval_url plus per-item ids; each child is later executed by the corresponding tool with both confirmation_id and bulk_item_id.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "description": "Ordered list of child actions to bundle under one approval URL. Server assigns item_ids; AI-supplied ids are ignored.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "action_type": {
                      "description": "Child action_type. Must be in the v1 bulk allowlist.",
                      "enum": ["linkedin_send_message", "linkedin_send_inmail", "linkedin_send_connection_request", "linkedin_comment_on_post", "linkedin_react_to_post", "linkedin_create_post"],
                      "type": "string"
                    },
                    "content_policy_override": {
                      "items": {
                        "additionalProperties": false,
                        "properties": {
                          "kind": {
                            "enum": ["literal", "token", "rule"],
                            "type": "string"
                          },
                          "value": {
                            "type": "string"
                          }
                        },
                        "required": ["kind", "value"],
                        "type": "object"
                      },
                      "type": "array"
                    },
                    "payload": {
                      "additionalProperties": {
                        "additionalProperties": true
                      },
                      "description": "Per-item payload using the underlying tool's input schema. linkedin_send_connection_request accepts identifier, provider aliases, saved lead IDs, public identifiers, and profile URLs; Zevari canonicalizes each child before approval. Comment/reaction postId values are resolved to the post's social_id before approval.",
                      "type": "object"
                    }
                  },
                  "required": ["action_type", "payload"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1e5d6d436e93fec0f005f70b03ab99b48904e4bf5197641a50fbc83c268a88f5"
        },
        {
          "name": "actions_request_confirmation",
          "description": "Stage an approval-gated destructive or sensitive action for user approval. Call before single outbound LinkedIn/email writes, campaign activation, and the allowlisted actions in action_type. Personalized campaign enrollment is not staged here: call campaigns.addTargets with personalized_steps instead (it stages campaign_enroll_personalized_targets internally and returns the retry when approval is needed). Do NOT use for entity-persistence tools (targets_save, profile_update, content_save, etc.) — call those directly. Approval: eligible low/medium-risk actions return chat_approval.approval_phrase (show it, then call actions_chat_approve_confirmation) plus approval_url as browser fallback. Bulk: for 2+ outbound LinkedIn actions in one turn use actions_request_bulk_confirmation (one URL covers all). Errors: campaign_activate stages only for draft or paused campaigns; active, processing, terminal, or archived campaigns return CAMPAIGN_INVALID_STATUS_TRANSITION before any confirmation is created or Autopilot is evaluated (terminal recovery: create a new campaign).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "action_type": {
                "description": "The exact allowlisted action family this confirmation gates. Valid values are LinkedIn/email sends/InMails/posts/comments/reactions, campaign_activate, campaign_update_target_set, campaign_update_step_config, bulk_delete, bulk_export, and agents_enrich_email_batch. For campaign activation, use 'campaign_activate' with payload={campaign_id: <id>}. Personalized enrollment must use campaigns.addTargets, which stages its receipt-bound confirmation internally. Entity saves such as targets_save are not valid action_types and do not need confirmation.",
                "enum": ["linkedin_send_message", "linkedin_send_inmail", "linkedin_send_connection_request", "linkedin_cancel_invitation", "linkedin_respond_invitation", "linkedin_create_post", "linkedin_comment_on_post", "linkedin_react_to_post", "linkedin_react_post_comment", "email_send_message", "campaign_activate", "campaign_update_target_set", "campaign_update_step_config", "bulk_delete", "bulk_export", "agents_enrich_email_batch", "account_reparent"],
                "type": "string"
              },
              "content_policy_override": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "kind": {
                      "enum": ["literal", "token", "rule"],
                      "type": "string"
                    },
                    "value": {
                      "type": "string"
                    }
                  },
                  "required": ["kind", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "cost_estimate_cents": {
                "type": "number"
              },
              "payload": {
                "additionalProperties": {
                  "additionalProperties": true
                },
                "description": "The COMPLETE action payload. LinkedIn writes are validated at stage time; connection requests accept saved lead/provider/public/profile URL aliases and are stored as canonical provider-ID payloads, while linkedin_comment_on_post/linkedin_react_to_post postId values are resolved to the post's social_id before approval. After approval, execution uses this stored approved payload as the source of truth.",
                "type": "object"
              }
            },
            "required": ["action_type", "payload"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
