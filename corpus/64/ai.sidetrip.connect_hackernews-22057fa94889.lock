{
  "lockfileVersion": 2,
  "subjects": {
    "ai.sidetrip.connect/hackernews": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://demo-hackernews.sidetrip.ai/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "hackernews",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only Hacker News via the official Firebase API and Algolia search. No API key. Lists and comment trees are capped. This server does not post, vote, or log in.",
      "tools": [
        {
          "name": "get_item_with_comments",
          "description": "Fetch one Hacker News item and a short comment tree from the official Firebase API. depth is 0 to 2 (default 2). Each level keeps at most 4 comments (default 3). Text is plain and truncated.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "depth": {
                "description": "Comment depth. 0 returns the item only. Default 2, maximum 2.",
                "maximum": 2,
                "minimum": 0,
                "type": "integer"
              },
              "id": {
                "description": "Numeric Hacker News item id.",
                "maximum": 100000000,
                "minimum": 1,
                "type": "integer"
              },
              "replies": {
                "description": "Comments kept at each level. Default 3, maximum 4.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:d06929733ed11f3dafcbd614d24c6df1158b6827281c96109e4e0b84c91e8b68"
        },
        {
          "name": "get_user",
          "description": "Read a Hacker News profile from the official Firebase API, plus at most 5 recent submissions. The about text is plain and truncated.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Hacker News username, such as pg.",
                "pattern": "^[A-Za-z0-9_-]{1,32}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:11cebc7aac06bcbcb4d9695244677c38613dd5c713af87ed8d998953d6a70630"
        },
        {
          "name": "search_stories",
          "description": "Search Hacker News with the keyless Algolia API. kind is story (default), comment, show_hn, ask_hn, or poll. Returns at most 15 hits (default 8).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "Result type. Defaults to story.",
                "enum": ["story", "comment", "show_hn", "ask_hn", "poll"],
                "type": "string"
              },
              "limit": {
                "description": "How many hits to return. Default 8, maximum 15.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to search for.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:1be1e34f8c48bcdf965d945ed8b2e0206fcd5a9c4caad5bfe83892841eb1cd1b"
        },
        {
          "name": "show_or_ask_hn",
          "description": "Read the current Show HN or Ask HN list from the official Firebase API. kind is show or ask. Returns at most 15 stories (default 8).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "kind": {
                "description": "show reads Show HN. ask reads Ask HN.",
                "enum": ["show", "ask"],
                "type": "string"
              },
              "limit": {
                "description": "How many stories to return. Default 8, maximum 15.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["kind"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c3fca727aa008c420cf69d22cd5de913d39c223c6a6cf64a8467af8bdf71c15e"
        },
        {
          "name": "top_stories",
          "description": "Read the Hacker News front page from the official Firebase API. feed is top (default), new, or best. Returns at most 15 stories (default 8) with id, title, author, score, time, url, and comment count.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "feed": {
                "description": "Which front page to read. Defaults to top.",
                "enum": ["top", "new", "best"],
                "type": "string"
              },
              "limit": {
                "description": "How many stories to return. Default 8, maximum 15.",
                "maximum": 15,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:fc631a93a5c28546b812829fbf6ad6ad454b2c67043e8e5bcf03654da2d85b25"
        }
      ],
      "digest": "sha256:6c8894c3ad0669239451578e69d1bf0169cb00171426c5ee1ae80dccefd9b05d"
    }
  }
}
