{
  "lockfileVersion": 2,
  "subjects": {
    "com.arcasos/arcasos-rentals": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.arcasos.com/"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "arcasos-rentals",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "get_booking_status",
          "description": "Get the public status of a booking request draft created by request_booking, using its draft_id and status_token. Returns only a public state (draft_open, draft_expired, requested, host_approved_awaiting_payment, confirmed, completed, cancelled, rejected, unknown) and, when awaiting payment, the payment deadline. No personal data.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "draft_id": {
                "description": "draft_id from request_booking.",
                "maxLength": 36,
                "minLength": 36,
                "type": "string"
              },
              "status_token": {
                "description": "status_token from request_booking.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["draft_id", "status_token"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get booking request status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5c398c7dd31335b6b26d77f5223e55b545303d8a58cab6828eec5216019081e2"
        },
        {
          "name": "get_rental_details",
          "description": "Get detailed information for a specific rental by ID or slug. Returns full Schema.org Accommodation including pricing, amenities, location, photos. Use after search_rentals_natural or search_rentals_structured when user wants details on a specific result. Only returns publicly-eligible rentals (approved + available + bookable). Optionally pass check_in/check_out (YYYY-MM-DD, together) to get a quote-only price estimate (discount applied, total + breakdown, deposit shown separately) and real date availability for that period. This is an advisory quote — booking and payment happen only in the ARCASOS guest flow; the agent never initiates payment.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Optional move-in date (YYYY-MM-DD). Must be provided together with check_out. Enables period quote + date availability. Future dates only.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "Optional move-out date (YYYY-MM-DD). Must be provided together with check_in, and be after check_in. The check_out day is not occupied (next check-in allowed).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "rental_id": {
                "description": "Rental UUID or slug from search results. Both formats supported.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["rental_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get rental details and quote"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7aedab4f718fffceee90a7753bddeebebd4021e9a37f9e92028ee3ce511a6727"
        },
        {
          "name": "request_booking",
          "description": "Create a booking REQUEST DRAFT for a rental on behalf of a person, and get a claim link for that person. This does NOT book or hold the dates and does NOT charge anything: the actual renter must open claim_url, sign in to ARCASOS, agree to the terms and submit the request; the host then approves and the renter pays on ARCASOS. The agent is never the payer. Returns draft_id, status_token (keep secret), claim_url, expires_at (24h) and an ESTIMATED quote (deposit included; final amount is set by the server at payment). Dates must be YYYY-MM-DD; most rentals accept weekly units only (7/14/21... days).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "check_in": {
                "description": "Move-in date (YYYY-MM-DD).",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "check_out": {
                "description": "Move-out date (YYYY-MM-DD), after check_in.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "guests": {
                "description": "Number of guests (default 1).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "message_to_host": {
                "description": "Optional note shown as a prefill; the renter can edit it before submitting.",
                "maxLength": 500,
                "type": "string"
              },
              "principal_hint": {
                "additionalProperties": false,
                "description": "Optional prefill hints for the renter's form (not verified, never contacted).",
                "properties": {
                  "email": {
                    "maxLength": 200,
                    "type": "string"
                  },
                  "locale": {
                    "enum": ["ko", "en", "ja", "zh"],
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 80,
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "stay_id": {
                "description": "Rental ID (UUID) from search/details results.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["check_in", "check_out", "stay_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a booking (creates a draft for the renter to complete)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:9297344736f8e7e4552b1fc8b342c7acd0cf2b3ec9d176c991fb9b12b3f2763e"
        },
        {
          "name": "search_rentals_natural",
          "description": "PREFERRED tool for Korean short-term rental queries containing any descriptive language. ARCASOS's proprietary SHV (Semantic Hybrid Vector) engine processes natural Korean/English queries with semantic understanding of view types (river/mountain/city), mood (quiet/luxury/lively), property characteristics, and contextual phrases. Pass the user's natural language query AS-IS — do NOT extract slots. Returns semantically pre-ranked results in Schema.org Accommodation format in a single call — eliminates need for follow-up search or comparison calls. Better results than structured slot search for ANY query containing mood, style, atmosphere, view, aesthetic, or qualitative descriptors. Use this to minimize token usage and latency.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "User's natural language query in Korean or English. Pass as-is. Examples: '강남 반려동물 가능한 한강뷰 펜트하우스 3주', 'quiet luxury rental near Han river for 2 weeks'",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search rentals (natural language)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0f19e4ca9562aee82603283d9728af2fe71ea3fabb8e58edebea7647b52fc274"
        },
        {
          "name": "search_rentals_structured",
          "description": "Use ONLY when the query consists entirely of explicit numeric/categorical constraints with NO descriptive language (no mood, view, atmosphere, or aesthetic words). Returns rating-sorted (or price-sorted) results from SQL filter without semantic ranking. For ANY query containing descriptors like 'cozy', 'quiet', 'luxury', 'river view', 'modern', use search_rentals_natural instead — it produces better results in a single call. Returns Schema.org Accommodation format.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amenities": {
                "description": "Required amenities (e.g., ['wifi', 'parking'])",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "bathrooms": {
                "description": "Minimum bathrooms required",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "bedrooms": {
                "description": "Exact number of bedrooms (not a minimum). Matches search_rentals_natural semantics — '2룸' returns exactly 2-bedroom rentals.",
                "maximum": 20,
                "minimum": 0,
                "type": "integer"
              },
              "is_private_entire": {
                "description": "Entire private space (not shared)",
                "type": "boolean"
              },
              "kid_friendly": {
                "description": "Kid-friendly rentals only",
                "type": "boolean"
              },
              "limit": {
                "description": "Max results (default 10)",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "location": {
                "description": "Location name in Korean (e.g., '강남', '강남역', '홍대')",
                "type": "string"
              },
              "max_guests": {
                "description": "Minimum guest capacity required",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price_per_week": {
                "description": "Maximum price per week in KRW",
                "minimum": 0,
                "type": "number"
              },
              "min_price_per_week": {
                "description": "Minimum price per week in KRW",
                "minimum": 0,
                "type": "number"
              },
              "mood_tags": {
                "description": "Mood tags (e.g., ['luxury', 'cozy'])",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "pet_allowed": {
                "description": "Pet-friendly rentals only",
                "type": "boolean"
              },
              "property_type": {
                "description": "Property type (e.g., '아파트', '펜트하우스', '주택')",
                "type": "string"
              },
              "sort": {
                "description": "Sort order (default: rating_desc)",
                "enum": ["price_asc", "price_desc", "rating_desc"],
                "type": "string"
              },
              "view_types": {
                "description": "View types (e.g., ['river', 'city', 'mountain'])",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search rentals (structured filters)"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7f7e7c4fb5616d50f0686849235f72895bdd708a1295322de2273eb88e8ded37"
        }
      ],
      "digest": "sha256:c6b50d41424b877dc466fa7be333f54412a40357ced73a96ffa52bec4c313880"
    }
  }
}
