{
  "lockfileVersion": 2,
  "subjects": {
    "com.bravodm/bravodm": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bravodm.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "bravodm",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BravoDM public data for creator brand deals: price a deal with the published pricing model, look up a brand's public creator program, or read published niche rate benchmarks. Read-only; no account or sign-in is involved.",
      "tools": [
        {
          "name": "lookup_brand_program",
          "title": "Look up a brand creator program",
          "description": "Look up one brand's public creator program: how creators apply or pitch, the program summary, what the brand sells, and the link to its BravoDM program page. Covers only the brands with public program pages at bravodm.com/brands, from the same catalog records those pages render. Pass a brand name or its BravoDM slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "brand": {
                "description": "Brand name (for example Caraway) or slug (caraway).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["brand"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e2f8a10aeed6a38928762102e937664b162465041e49ad72aba5e054f9f2648d"
        },
        {
          "name": "price_deal",
          "title": "Price a brand deal",
          "description": "Price a creator brand deal with BravoDM's published pricing model, the same model the free calculator at bravodm.com/tools/pricing-calculator runs. Two deal kinds: a posted deal (the creator posts on their own account; pass the follower band, niche, deliverable quantities, and the usage and exclusivity terms), and a content-only UGC deal (pass mode \"ugc\" and a ugc_tier; the creator films and the brand posts, so the price follows the creator's experience tier and never a follower count, and only the ugcVideo quantity prices). Returns the line-by-line price and the three numbers BravoDM publishes for a package: the floor, your number, and the strong ask, in USD.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "carousel": {
                "description": "Quantity of carousel deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "engagement": {
                "description": "Engagement level key: lower (Lower than most), average (About average), above (Above average), way-above (Way above average). Defaults to average.",
                "enum": ["lower", "average", "above", "way-above"],
                "type": "string"
              },
              "exclusivity": {
                "description": "Exclusivity term key: none (No exclusivity), 30d (30 days), 90d (90 days). Defaults to none.",
                "enum": ["none", "30d", "90d"],
                "type": "string"
              },
              "feedPost": {
                "description": "Quantity of feedPost deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "follower_band": {
                "description": "Follower band key from the pricing model: under-5k (Under 5k), 5k-10k (5k to 10k), 10k-25k (10k to 25k), 25k-50k (25k to 50k), 50k-100k (50k to 100k), 100k-250k (100k to 250k), 250k-500k (250k to 500k), 500k-1m (500k to 1M), 1m-plus (1M+). Required for a posted deal. A content-only UGC deal (mode \"ugc\") prices on ugc_tier instead and ignores it.",
                "enum": ["under-5k", "5k-10k", "10k-25k", "25k-50k", "50k-100k", "100k-250k", "250k-500k", "500k-1m", "1m-plus"],
                "type": "string"
              },
              "live": {
                "description": "Quantity of live deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "mode": {
                "description": "Deal kind. \"posted\" (the default) prices a deal the creator posts, off the follower band. \"ugc\" prices a content-only deal the brand posts, off the ugc_tier experience tier. Passing ugc_tier without a mode also selects the UGC path.",
                "enum": ["posted", "ugc"],
                "type": "string"
              },
              "niche": {
                "description": "Pricing model niche key: beauty (Beauty and skincare), fashion (Fashion), fitness (Health and fitness), food (Food and drink), travel (Travel), parenting (Parenting and family), finance (Finance and business), tech (Tech and software), lifestyle (Lifestyle), entertainment (Comedy and entertainment), gaming (Gaming), other (Other).",
                "enum": ["beauty", "fashion", "fitness", "food", "travel", "parenting", "finance", "tech", "lifestyle", "entertainment", "gaming", "other"],
                "type": "string"
              },
              "package_discount": {
                "description": "True to apply the model's 10 percent package discount on the content subtotal.",
                "type": "boolean"
              },
              "platform": {
                "description": "Platform the deal runs on: instagram, tiktok, or youtube.",
                "enum": ["instagram", "tiktok", "youtube"],
                "type": "string"
              },
              "shortVideo": {
                "description": "Quantity of shortVideo deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "storyFrame": {
                "description": "Quantity of storyFrame deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "storySet": {
                "description": "Quantity of storySet deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "typical_views": {
                "description": "Typical views per video. Only used for YouTube pricing, where it can raise the dedicated video rate above the band base.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "ugcVideo": {
                "description": "Quantity of ugcVideo deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "ugc_tier": {
                "description": "UGC experience tier key (pricing model v1.1): first-deals (First deals: New to paid UGC work, building a portfolio), steady (Steady brand work: Regular paid UGC work for brands), proven (Proven performer: A track record brands ask for by name). Only read for a content-only UGC deal (mode \"ugc\"); defaults to first-deals, the calculator's own default.",
                "enum": ["first-deals", "steady", "proven"],
                "type": "string"
              },
              "usage": {
                "description": "Usage rights term key: none (No usage rights), 30d (30 days), 90d (90 days), 180d (180 days), 12mo (12 months), forever (Forever). Defaults to none.",
                "enum": ["none", "30d", "90d", "180d", "12mo", "forever"],
                "type": "string"
              },
              "whitelisting": {
                "description": "True when the brand may run the content from its own handle (whitelisting, also called Spark or partnership ads). Raises the usage line.",
                "type": "boolean"
              },
              "ytDedicated": {
                "description": "Quantity of ytDedicated deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "ytIntegration": {
                "description": "Quantity of ytIntegration deliverables.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["niche", "platform"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ab19606a6e0b3f5d45cb104d7c53a79b55a9b08ae7fc48d54f2bb7363fecbf86"
        },
        {
          "name": "rate_benchmarks",
          "title": "Niche rate benchmarks",
          "description": "Read the published rate table for one niche: for a creator at 25,000 followers, the floor, your number, and strong ask for one Reel, one feed post, and one Story set, plus what 90 days of usage adds on one Reel. The UGC video is priced differently: the brand posts it, so its rate follows the creator's experience tier, not followers. Its row carries the steady brand work tier and the response includes all three tiers, the figures the UGC rates guide leads with. Figures come from the same tables published at bravodm.com/rates. Pass a niche or category key such as beauty, kitchen, fitness, or tech_gadgets.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "niche": {
                "description": "Niche or category key: a published table key (fashion, food, kitchen, cleaning, home, diy, tech_gadgets, apps_software, beauty, fitness, pets, family, wellness, travel, general_products) or a pricing model niche key (finance, tech, parenting, entertainment, gaming, lifestyle, other).",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["niche"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:b1cd23e730dfdd706316ad87aed73363526136fe52d36b5ad35f47d3ebb7f192"
        }
      ],
      "digest": "sha256:bbb6fe3a197ee80fa7fa7831fc74652d349a244dcd032c54db389b12264d0c01"
    }
  }
}
