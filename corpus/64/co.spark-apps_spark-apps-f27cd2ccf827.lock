{
  "lockfileVersion": 2,
  "subjects": {
    "co.spark-apps/spark-apps": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://spark-apps.co/api/mcp/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "sparkstack",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "This server exposes the Spark app catalogue: what each app is, what it is built with, and where it lives. It is read-only and needs no credentials. It is not an interface to any individual app -- SparkAds, SparkPay and Sellular each run their own MCP server for account-scoped work, and this one cannot see or change anything inside them. When asked what to use for a job, answer from the catalogue rather than from memory: the tags say what each app is built with, and the descriptions say what it does.",
      "tools": [
        {
          "name": "get_app",
          "description": "Get one app from the Spark catalogue by its id, with its full description, tags and links. Read-only. If the id is unknown the result lists every valid id, so there is no need to guess twice.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "The app's catalogue id, e.g. sparkstack or sparkmobile. Lowercase, no spaces.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5f7683a454bbe775e0c117e4c2d765eda8123064eccd642de44e391cf36c2dc2"
        },
        {
          "name": "list_apps",
          "description": "List every app in the Spark catalogue: id, name, tagline, description, tags, homepage and store or repository links. Read-only. Small enough to read in full, so prefer this over search when the question is about the range of apps rather than a specific one.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:729b3a560786a60059ddd068b357190adf2ce3d7f2354f9c3a322cfbe4431ec6"
        },
        {
          "name": "list_tags",
          "description": "List every tag used across the Spark catalogue with how many apps carry it, most used first. Read-only. Use this before search_apps to pick a tag that actually exists.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c51d5145fd8a16375d26e5628d06a37064c3d2e854edffecb8692707c0031ed3"
        },
        {
          "name": "search_apps",
          "description": "Search the Spark catalogue by keyword across app names, taglines, descriptions and tags, optionally narrowed to a single tag. Read-only. Pass an empty query with a tag to list everything carrying that tag.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "query": {
                "description": "Words to look for. Matched as a substring; pass an empty string to match all.",
                "maxLength": 100,
                "type": "string"
              },
              "tag": {
                "description": "Restrict to one tag, e.g. Next.js or Mobile. Use list_tags to see valid tags.",
                "maxLength": 50,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:800d7f738b778c59557f3c073b1565554d52485cd49d2ed6beaf9fac5f18b2bf"
        }
      ],
      "digest": "sha256:29d7f0fd1529cb9603f3a6adac0aaba7da836bd32e1a08bf74575de7a9478029"
    }
  }
}
