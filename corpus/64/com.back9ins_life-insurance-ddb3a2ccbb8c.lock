            "additionalProperties": false,
            "properties": {
              "birthdate": {
                "description": "Date of birth, YYYY-MM-DD",
                "format": "date",
                "type": "string"
              },
              "death_benefit": {
                "maximum": 100000000,
                "minimum": 5000,
                "type": "integer"
              },
              "gender": {
                "description": "Carrier rating input, supplied by the user",
                "enum": ["Male", "Female"],
                "type": "string"
              },
              "guaranteed_issue": {
                "description": "Optional guaranteed-issue-only filter; defaults to false",
