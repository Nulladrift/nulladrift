{
  "lockfileVersion": 2,
  "subjects": {
    "com.foodeist/restaurants": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://foodeist.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "foodeist",
        "title": "Foodeist restaurant guide",
        "version": "1.0.0",
        "websiteUrl": "https://foodeist.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Foodeist (foodeist.com) is a restaurant guide covering about 3.7 million restaurants worldwide, with the richest data (reviews, menus, hours) in the US. Ratings combine Google, Tripadvisor and Yelp reviews; \"foodeist_score\" and \"city_rank\" are Foodeist's own ranking within a city. Typical flow: top_restaurants (city + optional cuisine) or restaurants_nearby (coordinates) to get candidates, then get_restaurant / get_menu for details. search_restaurants finds a place by name. Cities can be passed as a name (\"Austin, TX\", \"Paris\") or a slug from find_cities. Always link the \"url\" field when you mention a restaurant, and say ratings come from Foodeist. Hours and menus are collected from public sources and may be out of date; suggest calling ahead for important plans.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch restaurant document",
          "description": "Full text profile of one restaurant (details, hours, review summary, menu highlights) by the id that search returned.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Restaurant id from search (a slug).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Fetch restaurant document"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ba7e36e85cfa1ad6383335ee4e7aaa175291123edcb51d37d0d384cdf7ae6c26"
        },
        {
          "name": "find_cities",
          "title": "Find cities",
          "description": "Look up cities Foodeist covers by name. Use it to disambiguate (\"Portland\" → Oregon or Maine) and get the slug for other tools.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "description": "How many results (default 5, max 10).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "City name or its beginning.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d9500dfca3fa4b004db5d395d2ab559d1df2d7e36f35c2957504e5a18dbaf92d"
        },
        {
          "name": "get_menu",
          "title": "Restaurant menu",
          "description": "Menu of one restaurant: sections, dishes, prices, descriptions. Filter by a section or dish keyword to keep it short.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "max_items": {
                "default": 120,
                "maximum": 400,
                "minimum": 1,
                "type": "integer"
              },
              "restaurant": {
                "description": "Restaurant slug, numeric id, or foodeist.com/place/... URL, as returned by the other tools.",
                "type": "string"
              },
              "search": {
                "description": "Only sections or dishes containing this text, e.g. \"vegan\", \"burger\", \"dessert\".",
                "type": "string"
              }
            },
            "required": ["restaurant"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Restaurant menu"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:892fe1fc8f49050be6399b254a73152541dacc32e640d5a82a72bfc43c803ef5"
        },
        {
          "name": "get_restaurant",
          "title": "Restaurant details",
          "description": "Everything Foodeist knows about one restaurant: address, phone, website, ratings by source, price level, cuisines, weekly hours and open-now, delivery services, description, what reviewers praise and complain about, menu sections.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "restaurant": {
                "description": "Restaurant slug, numeric id, or foodeist.com/place/... URL, as returned by the other tools.",
                "type": "string"
              }
            },
            "required": ["restaurant"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Restaurant details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ad75fba33c7bb6a0df97ec2a209053b82e423e066cef8d07310919ba7e1549fd"
        },
        {
          "name": "restaurants_nearby",
          "title": "Restaurants near a point",
          "description": "Restaurants around coordinates, best first (or nearest first). Use when the user gives a location, address you can geocode, or \"near me\" with coordinates.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cuisine": {
                "description": "Cuisine or dish type, e.g. \"pizza\", \"sushi\", \"mexican\", \"steakhouse\", \"vegan\", \"coffee\".",
                "type": "string"
              },
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "description": "How many results (default 10, max 30).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "open_now": {
                "description": "Only places open right now (by their local time).",
                "type": "boolean"
              },
              "radius_m": {
                "default": 1500,
                "description": "Search radius in meters (default 1500, max 10000).",
                "maximum": 10000,
                "minimum": 100,
                "type": "integer"
              },
              "sort": {
                "default": "best",
                "enum": ["best", "distance"],
                "type": "string"
              }
            },
            "required": ["lat", "lng"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Restaurants near a point"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:727368df99b54f7ab26a30e71e83d5619fddb5cf5ef550627edcf791612a8604"
        },
        {
          "name": "search",
          "title": "Search Foodeist",
          "description": "Free-text search over Foodeist restaurants. Understands \"<cuisine or name> in <city>\" (\"best tacos in Austin\", \"Joe's Pizza in New York\") and plain restaurant names. Returns ids to pass to fetch. Prefer top_restaurants / search_restaurants when you can fill their fields.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What the user is looking for.",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Foodeist"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:19035224d44cecce9b9cbe9bfe213e5ff020867b610860ac93a0980275c1387a"
        },
        {
          "name": "search_restaurants",
          "title": "Search restaurants by name",
          "description": "Find restaurants by (part of) their name, optionally inside one city. Use for \"is X any good\", \"what time does X close\".",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name (\"Austin, TX\", \"London\", \"Paris, France\") or a city slug from find_cities (\"austin-tx\").",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "How many results (default 5, max 20).",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Restaurant name, e.g. \"Franklin Barbecue\".",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search restaurants by name"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a6029e7dea5a311a49c95a946b8e5c16db2105a307f13561711e2ed673c2a1e0"
        },
        {
          "name": "top_restaurants",
          "title": "Top restaurants in a city",
          "description": "Best-ranked restaurants in a city by the Foodeist ranking, optionally only one cuisine. Answers \"best X in Y\" questions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "City name (\"Austin, TX\", \"London\", \"Paris, France\") or a city slug from find_cities (\"austin-tx\").",
                "type": "string"
              },
              "cuisine": {
                "description": "Cuisine or dish type, e.g. \"pizza\", \"sushi\", \"mexican\", \"steakhouse\", \"vegan\", \"coffee\".",
                "type": "string"
              },
              "limit": {
                "default": 10,
                "description": "How many results (default 10, max 30).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Top restaurants in a city"
          },
          "behavior": {
