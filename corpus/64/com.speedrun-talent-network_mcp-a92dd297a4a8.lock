          },
          "digest": "sha256:143242e35c7df5ac07397a13de9c180ca596d539658cefaab75480cb0a1af71c"
        },
        {
          "name": "list_companies",
          "title": "List hiring companies",
          "description": "List every portfolio company with at least one live open role, most open roles first (paginated, 100 per page). Prefer list_collections for browsing by industry/hub/signal; use this for a raw roster.",
          "inputSchema": {
