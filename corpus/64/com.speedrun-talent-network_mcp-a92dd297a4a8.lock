            "readOnly": true
          },
          "digest": "sha256:c6fe954ed63347641380229f5c18265a37b64d558cd72a4c2f3a4b7ed1246272"
        },
        {
          "name": "get_company",
          "title": "Get a hiring company",
          "description": "Fetch one company profile by slug (from job.company_slug or a https://speedrun-talent-network.com/companies/... URL): name, portfolio tier, cohort, location, industries, one-line blurb, every live open role with canonical urls, and, while company facets are enabled, company.labels (stage, size band, business model, industry as LinkedIn's industry name, frontier-lab / big-tech / AI-native / hardware flags as display strings; null when the company has no classification yet). Use search_jobs or list_collections to discover companies; use this for the full picture of one employer.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "Company slug, e.g. \"anthropic\" in /companies/anthropic.",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a hiring company"
          },
          "behavior": {
            "destructive": false,
