      "tools": [
        {
          "name": "express_interest",
          "title": "Express interest in a role",
          "description": "Get the canonical apply info for one live role, plus a join_url where the candidate can join the a16z speedrun talent network by entering their own details on the site. Takes only a job id: it records no personal data, attaches nothing to any profile, and submits nothing anywhere. apply.kind 'onsite' means the candidate applies on the returned job url; 'external' means the url hands off to the company's own careers page. Relay both the apply url and the join_url to the candidate; they act on each themselves. Safe to retry.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "agent_client_id": {
                "description": "Identifier for the calling agent/integration, e.g. \"claude-code\". Attribution only.",
                "maxLength": 64,
                "type": "string"
              },
              "job_id": {
                "description": "Job UUID, 8-hex id prefix, or canonical job slug (same ids as get_job/search_jobs).",
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["job_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Express interest in a role"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7118446a37e81352405d264a39d33700f86600e717dcae22b04c8e2eeb2aef32"
        },
        {
          "name": "get_collection",
          "title": "Get a collection with ranked members",
          "description": "Fetch one published collection by slug with its ranked member companies: name, tier, cohort, open-role count, location, stage, investors, and which functions/cities they're hiring in. Members are paginated (100 per page). Follow up with get_company or search_jobs (company filter) for a specific member's roles.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "page": {
                "description": "0-based member page, 100 per page.",
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "slug": {
                "description": "Collection slug from list_collections, e.g. \"ai-infra\" or \"new-york\".",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a collection with ranked members"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
