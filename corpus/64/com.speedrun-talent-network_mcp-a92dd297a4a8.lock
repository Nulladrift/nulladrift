        },
        {
          "name": "get_hiring_stats",
          "title": "Live hiring aggregates",
          "description": "Aggregate hiring data across the whole board, recomputed live: open-role and hiring-company counts, demand mix by function, posted pay-band midpoints by function (p25/median/p75, annual USD), remote share, top hiring locations, and the speedrun vs a16z portfolio split. Use this to answer \"what do a16z portfolio startups pay\" or \"how many startup jobs are open\" — the human-readable version lives at https://speedrun-talent-network.com/network.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Live hiring aggregates"
