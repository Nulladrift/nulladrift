        {
          "name": "join_network",
          "title": "Join the talent network",
          "description": "Add a candidate to the a16z speedrun talent network, with their consent. Requires full_name, email, and linkedin_url; every other field strengthens the profile. Idempotent and always safe to retry: an existing profile is never modified, and the response is identical whether or not the email was already in the network (membership is never disclosed). On success, relay the returned message and finish_url to the candidate so they can add a resume. Never call this without the candidate's explicit go-ahead.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "accomplishments": {
                "description": "The thing they are proudest of having built or shipped.",
                "maxLength": 2000,
                "type": "string"
              },
              "agent_client_id": {
                "description": "Identifier for the calling agent/integration, e.g. \"claude-code\" or \"career-ops\". Used for attribution only.",
                "maxLength": 64,
                "type": "string"
              },
              "craft": {
                "description": "Primary craft, e.g. engineering, design, product, research, sales, marketing, operations.",
                "maxLength": 100,
                "type": "string"
              },
              "current_company": {
                "description": "Current employer.",
                "maxLength": 200,
                "type": "string"
              },
              "currently_building": {
                "description": "What they are building or working on now.",
                "maxLength": 2000,
                "type": "string"
              },
              "email": {
                "description": "Candidate's email address.",
                "maxLength": 200,
                "minLength": 5,
                "type": "string"
              },
              "full_name": {
                "description": "Candidate's full name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "graduation_date": {
                "description": "Expected graduation, if a student.",
                "maxLength": 50,
                "type": "string"
              },
              "is_founding": {
                "description": "True if they want founding-team roles.",
                "type": "boolean"
              },
              "is_student": {
                "description": "True if they are currently a student.",
                "type": "boolean"
              },
              "linkedin_url": {
                "description": "LinkedIn profile URL, e.g. https://linkedin.com/in/handle.",
                "maxLength": 300,
                "minLength": 5,
                "type": "string"
              },
              "polarity": {
                "description": "A strongly held opinion about how they like to work.",
                "maxLength": 2000,
                "type": "string"
              },
              "portfolio_links": {
                "description": "Portfolio / GitHub / personal site URLs, comma-separated.",
                "maxLength": 2000,
                "type": "string"
              },
              "region": {
                "description": "Where they are based, e.g. \"SF Bay Area\" or \"NYC\".",
                "maxLength": 200,
                "type": "string"
              },
              "work_arrangements": {
                "description": "Work arrangements they are open to, comma-separated, e.g. \"In person, Hybrid, Remote\".",
                "maxLength": 300,
                "type": "string"
              },
              "work_links": {
                "description": "Links to work samples, comma-separated.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["email", "full_name", "linkedin_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Join the talent network"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:4ea8db51cafb478a9eca46216e51eaebf299674a6ac1f88bdfbdcc9e9e3e9b24"
        },
        {
          "name": "list_collections",
          "title": "List curated collections",
