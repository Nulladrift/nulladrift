        {
          "name": "search_jobs",
          "title": "Search open roles",
          "description": "Search live open roles across the a16z speedrun talent network jobs board (speedrun portfolio + the wider a16z portfolio; data syncs continuously from each company's own job board). Full-text search plus facet filters, with live facet counts in every response — read the facets to discover valid filter values. Results are paginated (50 per page, 0-based page). Every job carries a canonical url on https://speedrun-talent-network.com; link users there to view or apply. By default results cover the portfolio only; pass scope='speedrun' to narrow to speedrun portfolio companies only, or scope='everywhere' to also include the wider startup universe when that scope is live (the response then reports beyond_portfolio, the count of extra matches past the scope boundary: universe roles in portfolio scope, roles beyond speedrun within the a16z portfolio in speedrun scope; in everywhere scope it counts the universe-tier roles already included in the results — never add it to total). Mirrors GET https://speedrun-talent-network.com/api/v1/jobs exactly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "ai": {
                "description": "true = only roles classified as AI-native (the day job is building with or on models). facets.aiRole counts them under the other filters; unlabelled roles never match (facets.aiUnspecified). Ignored while classified crafts are disabled.",
                "type": "boolean"
              },
              "bigtech": {
                "description": "true = only roles at big tech companies (facets.bigTech counts them). Ignored while company facets are disabled.",
                "type": "boolean"
              },
              "cohort": {
                "description": "speedrun cohort tag(s), comma-separated, e.g. SR007.",
                "type": "string"
              },
              "comp": {
                "description": "Minimum annual compensation in USD: matches roles whose posted pay band reaches this number. Only roles with posted comp match unless comp_any is true.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "comp_any": {
                "description": "true = alongside comp/comp_max, ALSO include roles without posted comp (hidden by default; facets.compHidden counts them).",
                "type": "boolean"
              },
              "comp_max": {
                "description": "Maximum annual compensation in USD: matches roles whose posted pay band starts at or below this number. Combine with comp for a range.",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "company": {
                "description": "Exact company key (as returned in job.company).",
                "type": "string"
              },
              "emp": {
                "description": "Employment type, comma-separated. Values: FullTime, PartTime, Intern, Contract, Temporary.",
                "type": "string"
              },
              "eng": {
                "description": "Classified engagement type, comma-separated: full_time, part_time, contract, internship, cofounder, advisor, plus _ for roles with no engagement label (facets.engUnspecified counts them). Live counts in facets.eng. Prefer this over emp (the raw ATS field, ~half empty) for part-time / contract / internship asks. Ignored while classified crafts are disabled.",
                "type": "string"
              },
              "fn": {
                "description": "Function filter, comma-separated. Values: engineering, research, product, design, sales, marketing, operations, other; while classified crafts are enabled also data, growth, customer, finance, legal, people, business_development, strategy, executive, hardware_manufacturing (read facets.fn for the live set).",
                "type": "string"
              },
              "founding": {
                "description": "true = only roles classified as founding roles (founding team, first hires). facets.founding counts them under the other filters; unlabelled roles never match (facets.foundingUnspecified). Ignored while classified crafts are disabled.",
                "type": "boolean"
              },
              "industry": {
                "description": "Company industry filter, comma-separated slugs of LinkedIn industry names (e.g. computer_software, financial_services, hospital_health_care = Hospital & Health Care); read facets.industry in any response for the live top-24 vocabulary. Ignored while company facets are disabled.",
                "type": "string"
              },
              "lab": {
                "description": "true = only roles at frontier AI labs (facets.frontierLab counts them). Ignored while company facets are disabled.",
                "type": "boolean"
              },
              "loc": {
                "description": "Location filter: comma-separated city names (see facets.loc in any response for the live vocabulary), plus the special value \"remote\".",
                "type": "string"
              },
              "lvl": {
                "description": "Classified level filter, comma-separated, ladder order: intern, new_grad, junior, mid, senior, staff_principal, lead_manager, director, vp, c_level, founder, plus _ for roles with no level label (facets.lvlUnspecified counts them). Live counts in facets.lvl. Ignored while classified crafts are disabled.",
                "type": "string"
              },
              "metro": {
                "description": "Metro filter, comma-separated keys (max 5): sf, nyc, la, sv, dc, chi, sea, bos, aus, lon, oc, dal, atl, tor, sd. Expands to each metro's cities server-side; ORs with loc/remote. Live counts in facets.metro.",
                "type": "string"
              },
              "page": {
                "description": "0-based page number, 50 jobs per page.",
                "maximum": 200,
                "minimum": 0,
                "type": "integer"
              },
              "portfolio": {
                "description": "Portfolio tier, comma-separated: speedrun (the a16z speedrun accelerator portfolio) and/or a16z (the wider a16z portfolio).",
                "type": "string"
              },
              "posted": {
                "description": "Posted-date preset: published in the past day, week or month. Live counts in facets.posted.",
                "enum": ["24h", "7d", "30d"],
                "type": "string"
              },
              "q": {
                "description": "Free-text query over title, company, and location. Synonyms expand (ml, ai, swe, pm, gtm, nyc, sf, la).",
                "maxLength": 120,
                "type": "string"
              },
              "remote": {
                "description": "true = only roles open to remote candidates (alias of wp=remote).",
                "type": "boolean"
              },
              "scope": {
                "description": "'speedrun' narrows the search to a16z speedrun portfolio companies only; 'everywhere' widens it past the a16z portfolio into the broader startup universe. Server-gated: while the scope machinery is dark this is inert.",
                "enum": ["speedrun", "portfolio", "everywhere"],
                "type": "string"
              },
              "sen": {
                "description": "Seniority filter, comma-separated. Values: founding, exec, staff, senior, junior, intern, plus _ for roles with no stated level (facets.senUnspecified counts them). Remapped onto lvl while the classified level ladder is enabled.",
                "type": "string"
              },
              "size": {
                "description": "Company size filter, comma-separated employee bands: 1_10, 11_50, 51_200, 201_500, 501_1000, 1001_5000, 5000_plus. Live counts in facets.size; facets.sizeUnspecified counts roles at companies with no size label. Ignored while company facets are disabled.",
                "type": "string"
              },
              "sort": {
                "description": "rel = relevance (default when q is set), new = newest first (default otherwise), comp = highest posted comp first.",
                "enum": ["rel", "new", "comp"],
                "type": "string"
              },
              "spec": {
                "description": "Specialty filter, comma-separated slugs; meaningful with exactly ONE fn value (specialties are scoped to a craft). Read facets.spec in a one-craft response for the live vocabulary. Ignored while classified crafts are disabled.",
                "type": "string"
              },
              "stage": {
                "description": "Company stage filter, comma-separated; read facets.stage for the live vocabulary (e.g. seed, series_a, series_b, growth). While company facets are enabled the stage is the roster stage with a classified stage filling gaps, and facets.stageUnspecified counts roles at companies with no stage.",
                "type": "string"
              },
              "stealth": {
                "description": "'only' = unannounced (stealth) roles only; 'hide' = exclude them.",
                "enum": ["only", "hide"],
                "type": "string"
              },
              "wp": {
                "description": "Workplace filter, comma-separated (OR within the group): remote, hybrid, onsite. Live counts in facets.workplace.",
                "type": "string"
              },
              "yoe": {
                "description": "Classified minimum-experience band, comma-separated, band order: 0 (none required), under_1, 1_2, 3_5, 6_9, 10_14, 15_plus, plus _ for roles with no experience label (facets.yoeUnspecified counts them). Live counts in facets.yoe. Ignored while classified crafts are disabled.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search open roles"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
