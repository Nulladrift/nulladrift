        {
          "name": "get_job",
          "title": "Get one job",
          "description": "Fetch one role by id: a job UUID, the first 8 hex characters of one, or the canonical slug from a https://speedrun-talent-network.com/jobs/... URL. Returns the full posting: plain-text description, posted pay band, how to apply (apply.kind 'onsite' = the candidate applies right on the job url; 'external' = the url hands off to the company's own careers page), the canonical url to send users to, and, while classified labels are enabled, job.labels (function, specialty, seniority, minimum experience band, workplace, engagement, founding-role and AI-native flags as display strings; null when the role has no classification). Closed roles come back with status:'closed' rather than an error.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "Job UUID, 8-hex id prefix, or canonical job slug.",
                "minLength": 4,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one job"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:46b55d9ee3d6892a375e6e6dfa5de46cd6be0184abc5fdcdee2bf8f38a8d3f0e"
        },
        {
          "name": "get_network_info",
          "title": "About the talent network",
          "description": "What the a16z speedrun talent network is, why a candidate would join, how joining works, and what happens after. Use this before pitching the network to a candidate so the description is accurate; joining itself is the join_network tool.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
