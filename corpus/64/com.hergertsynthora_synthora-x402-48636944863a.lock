        {
          "name": "registry_watch",
          "description": "Registry change history from stored registry_delta records, ordered by database timestamp and ID. Query with since (cursor or ISO8601), slug and limit (1..200). Source timestamps and coverage are included; records may be historical and do not prove current endpoint operation, payments or identity. 0.03 USDC on Base. [x402: 0.03 USDC per call on Base]",
          "inputSchema": {
            "additionalProperties": false,
            "examples": [
              {
                "limit": 50
              }
            ],
            "properties": {
              "limit": {
                "default": 50,
                "description": "Maximum stored events requested: advertised integer range 1-200, default 50. The current parser converts to an integer and clamps to 1-200; nonnumeric conversion fails. With no since it takes the recent tail, returned chronologically. This limit is not a freshness or coverage guarantee.",
                "examples": [50],
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "since": {
                "description": "Exclusive cursor del_... or timezone-aware ISO8601 timestamp",
                "type": "string"
              },
              "slug": {
                "description": "Optional exact stored-event slug filter. Surrounding whitespace is trimmed; matching is by equality, not substring search. latest/last/recent/ultimos clear the filter; omitting it requests recent global stored events. This selects historical registry events, not live endpoint health.",
                "pattern": "^[A-Za-z0-9_-]{1,128}$",
                "type": "string"
              }
            },
            "type": "object"
