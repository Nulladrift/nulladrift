{
  "lockfileVersion": 2,
  "subjects": {
    "com.movingpolygons/maps-public": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.movingpolygons.com/mcp/public"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "moving-polygons-public",
        "title": "Moving Polygons (published maps)",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Moving Polygons (movingpolygons.com) publishes animated maps of how borders, territories and other regions change over time: empires, wars, nations, provinces, epidemics, sea ice. These read-only tools find published maps and return their timelines as text.\n\nUse search_maps when the user asks for a map, timeline or visual of a historical period, war, empire or region. Give the user the map's url (it plays in the browser and can be embedded with the iframe code from get_public_map). To make or edit maps in their own account, the user connects the signed-in server at https://www.movingpolygons.com/mcp.",
      "tools": [
        {
          "name": "get_public_map",
          "title": "Get a published map",
          "description": "One published map as Markdown: description and sources, the timeline of keyframes (date and caption), layers, events, and the iframe code to embed the interactive map. Pass its URL, or the handle and slug.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "slug": {
                "description": "The last part of the map's URL, e.g. the-ottoman-empire-12991923",
                "type": "string"
              },
              "url": {
                "description": "e.g. https://www.movingpolygons.com/map/chrisjager/the-ottoman-empire-12991923",
                "type": "string"
              },
              "username": {
                "description": "The map owner's handle, e.g. chrisjager (with slug, instead of url)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a6c9d735b96c66153ae143579ccc9989b1d6676aa777663bdc72739c12041406"
        },
        {
          "name": "search_maps",
          "title": "Search published maps",
          "description": "Find published animated maps on Moving Polygons (history, wars, empires, borders, epidemics, sea ice…) by words in their title or description and/or a year they cover. Returns links to the interactive map, its text version and its article.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "limit": {
                "description": "Default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match, e.g. 'Ottoman', 'Holy Roman Empire', 'Ukraine war'",
                "type": "string"
              },
              "year": {
                "description": "Only maps whose timeline includes this year; negative for BC (-44 = 44 BC)",
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:89db9c22ab8fbdc749b314ad8835baa668a92c39f6e99916e9932f53a009f610"
        }
      ],
      "digest": "sha256:18dee7bd2aa2bf87bd7b141e15b047962b1405482c52d455e5d5f187538625c3"
    }
  }
}
