      "instructions": "Launchator (https://launchator.com) is a launch directory for SaaS, AI and indie products.\n\nAnyone can search it: search_products, get_product, alternatives_to, list_categories.\n\nFounders can launch their own product with an access token from https://launchator.com/agents:\n1. submit_product with the homepage URL, or the product's own page if the site has several products. It drafts a listing (name, headline, description, category, tags) in about 30 seconds.\n2. Show the draft to the user and apply their changes with update_listing. If hasScreenshot is false, ask them to upload a screenshot at the editInBrowser link.\n3. get_badge_snippet returns the link the site must carry. Add it to the site footer (any page template that renders on the listed page), commit and deploy.\n4. verify_backlink checks the live page and publishes the listing. If it says the founder must confirm their email, ask them to click the link we emailed, then call publish.\n5. Once live, check_ai_ready scores how well AI assistants can read the site and returns fixes you can apply in the codebase.\nListings are free; the link must be a normal followed link on the listed page.",
