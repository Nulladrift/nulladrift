        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search Launchator's directory of SaaS, AI and indie products by what they do (e.g. 'invoicing for freelancers', 'screen recorder'). Returns the best matches with links.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
