                  "enum": ["history", "architecture", "art", "museums", "religious_sites", "archaeology", "nature", "views", "food", "local_life", "shopping", "relaxing", "royalty", "military", "music", "literature", "science", "performing_arts", "memorials"],
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Language of names and descriptions: en, es, fr, de, tr or zh.",
                "enum": ["en", "es", "fr", "de", "tr", "zh"],
                "type": "string"
              },
              "lat": {
                "maximum": 90,
                "minimum": -90,
                "type": "number"
              },
              "limit": {
                "default": 10,
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "lng": {
                "maximum": 180,
                "minimum": -180,
                "type": "number"
              },
              "pace": {
                "default": "normal",
                "description": "Walking pace: relaxed (3.5 km/h), normal (4.5 km/h) or brisk (5.5 km/h).",
                "enum": ["relaxed", "normal", "brisk"],
                "type": "string"
              },
              "radius_km": {
                "default": 2,
                "maximum": 50,
                "minimum": 0.1,
                "type": "number"
              }
