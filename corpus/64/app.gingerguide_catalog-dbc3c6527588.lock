      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "gingerguide",
        "title": "Gingerguide: European city walking tours",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Gingerguide is a catalog of self-guided audio walking tours for European cities: researched descriptions, coordinates and visit times for each sight, in English, Spanish, French, German, Turkish and Chinese. Use it for questions about what to see in a covered city, sights near a location, sights matching interests or historical periods, walking routes for a time budget, multi-day city itineraries, day trips from a base city, comparing cities, and practical visit facts (best time, getting there, free sights, booking, closing days) for some cities. Call get_catalog_overview for coverage and the allowed filter values. Opening hours and ticket prices are not in this catalog.",
      "tools": [
        {
          "name": "compare_cities",
          "title": "Compare cities",
          "description": "Compare two to four covered cities side by side, e.g. \"Porto or Lisbon?\" or \"Seville vs Granada for Moorish history\". Gives each city's sight count, days needed, strongest interests and historical periods, share of indoor sights and headline sights, says which city is stronger for each interest or period, and the distance between them. Based on the sight catalog only: not prices, weather, nightlife or beaches.",
          "inputSchema": {
            "properties": {
              "city_ids": {
                "description": "Two to four city ids or names, e.g. [\"porto\",\"lisbon\"].",
                "items": {
                  "type": "string"
                },
                "maxItems": 4,
                "minItems": 2,
                "type": "array"
              },
              "interests": {
                "description": "Traveler interests to favour, e.g. [\"history\",\"architecture\"].",
                "items": {
                  "enum": ["history", "architecture", "art", "museums", "religious_sites", "archaeology", "nature", "views", "food", "local_life", "shopping", "relaxing", "royalty", "military", "music", "literature", "science", "performing_arts", "memorials"],
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Language of names and descriptions: en, es, fr, de, tr or zh.",
                "enum": ["en", "es", "fr", "de", "tr", "zh"],
                "type": "string"
              },
              "periods": {
                "description": "Historical periods to favour, e.g. [\"byzantine\"] or [\"roman\",\"renaissance\"].",
                "items": {
                  "enum": ["prehistoric", "ancient_greek", "etruscan", "roman", "byzantine", "medieval", "gothic", "moorish_islamic", "ottoman", "renaissance", "baroque", "georgian_neoclassical", "nineteenth_century", "art_nouveau", "twentieth_century_modern", "world_war_ii", "cold_war", "asuka_nara", "heian", "kamakura", "muromachi", "azuchi_momoyama", "edo", "meiji"],
                  "type": "string"
                },
                "type": "array"
              },
              "trip_days": {
                "description": "Days available; the answer says how much of each city fits.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["city_ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Compare cities"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8bf10d21688fa382d7e5b2ac036ed4d41ac882f2ff9703e86780403a5c690ba"
        },
        {
          "name": "find_day_trips",
          "title": "Find day trips",
          "description": "Day trips from a base city to other covered cities and towns nearby, e.g. \"day trips from Florence\" or \"a day trip from Munich for castles\". Ranks destinations by distance, fit with the traveler's interests and periods, and fame, and lists what to see there in one day. Distances are straight-line; travel times are not included because trains, mountains and ferries change them a lot. Only covered cities are listed.",
          "inputSchema": {
            "properties": {
              "city_id": {
                "description": "Base city id, e.g. \"florence\".",
                "type": "string"
              },
              "hours_on_site": {
                "default": 5,
                "description": "Hours to spend at the destination; sets how many highlights are listed.",
                "maximum": 10,
                "minimum": 2,
                "type": "number"
              },
              "interests": {
                "description": "Traveler interests to favour, e.g. [\"history\",\"architecture\"].",
                "items": {
                  "enum": ["history", "architecture", "art", "museums", "religious_sites", "archaeology", "nature", "views", "food", "local_life", "shopping", "relaxing", "royalty", "military", "music", "literature", "science", "performing_arts", "memorials"],
                  "type": "string"
                },
                "type": "array"
              },
              "language": {
                "default": "en",
                "description": "Language of names and descriptions: en, es, fr, de, tr or zh.",
                "enum": ["en", "es", "fr", "de", "tr", "zh"],
                "type": "string"
              },
              "limit": {
                "default": 6,
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "max_distance_km": {
                "default": 250,
                "description": "Furthest straight-line distance to consider. Default 250.",
                "maximum": 400,
                "minimum": 10,
                "type": "integer"
              },
              "periods": {
                "description": "Historical periods to favour, e.g. [\"byzantine\"] or [\"roman\",\"renaissance\"].",
                "items": {
                  "enum": ["prehistoric", "ancient_greek", "etruscan", "roman", "byzantine", "medieval", "gothic", "moorish_islamic", "ottoman", "renaissance", "baroque", "georgian_neoclassical", "nineteenth_century", "art_nouveau", "twentieth_century_modern", "world_war_ii", "cold_war", "asuka_nara", "heian", "kamakura", "muromachi", "azuchi_momoyama", "edo", "meiji"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["city_id"],
            "type": "object"
          },
          "annotations": {
