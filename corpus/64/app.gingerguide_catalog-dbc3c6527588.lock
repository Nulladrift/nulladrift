        {
          "name": "find_nearby_attractions",
          "title": "Find nearby attractions",
          "description": "Sights closest to a latitude/longitude (for example the traveler's hotel or current position), sorted by walking time, optionally filtered by interests or category. If nothing is within the radius, returns the nearest covered city.",
          "inputSchema": {
            "properties": {
              "categories": {
                "items": {
                  "enum": ["historic", "religious", "park", "museum", "landmark", "bridge", "palace", "market", "university", "village", "distillery", "ruins", "garden", "castle", "nature", "monument", "square", "theater"],
                  "type": "string"
                },
                "type": "array"
              },
              "interests": {
                "description": "Traveler interests to favour, e.g. [\"history\",\"architecture\"].",
