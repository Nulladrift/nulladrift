        {
          "name": "plan_trip_itinerary",
          "title": "Plan trip itinerary",
          "description": "Multi-day plan for one city: each day covers one or two walkable areas (with a public-transport hop between them), ordered as walking routes, plus sights that did not fit. Example: \"three days in Vienna for art and music lovers\".",
          "inputSchema": {
            "properties": {
              "city_id": {
                "description": "Gingerguide city id, e.g. \"rome\" or \"istanbul\" (from search_cities).",
                "type": "string"
              },
              "days": {
                "default": 2,
                "maximum": 7,
                "minimum": 1,
                "type": "integer"
              },
              "hours_per_day": {
                "default": 6,
                "maximum": 12,
                "minimum": 2,
                "type": "number"
              },
              "interests": {
                "description": "Traveler interests to favour, e.g. [\"history\",\"architecture\"].",
                "items": {
                  "enum": ["history", "architecture", "art", "museums", "religious_sites", "archaeology", "nature", "views", "food", "local_life", "shopping", "relaxing", "royalty", "military", "music", "literature", "science", "performing_arts", "memorials"],
                  "type": "string"
