          "description": "Build an ordered self-guided walking route in one city that fits a time budget, e.g. \"a two-hour historical walk in Rome\". Picks sights by interests, periods and style, orders them to keep walking short, and returns each stop with walking minutes, suggested time on site, clock times and a Google Maps walking link.",
          "inputSchema": {
            "properties": {
              "city_id": {
                "description": "Gingerguide city id, e.g. \"rome\" or \"istanbul\" (from search_cities).",
                "type": "string"
              },
              "duration_minutes": {
                "default": 180,
                "maximum": 720,
                "minimum": 30,
                "type": "integer"
              },
              "exclude_ids": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "interests": {
                "description": "Traveler interests to favour, e.g. [\"history\",\"architecture\"].",
                "items": {
                  "enum": ["history", "architecture", "art", "museums", "religious_sites", "archaeology", "nature", "views", "food", "local_life", "shopping", "relaxing", "royalty", "military", "music", "literature", "science", "performing_arts", "memorials"],
