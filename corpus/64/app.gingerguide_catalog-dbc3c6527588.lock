                "type": "string"
              },
              "periods": {
                "description": "Historical periods to favour, e.g. [\"byzantine\"] or [\"roman\",\"renaissance\"].",
                "items": {
                  "enum": ["prehistoric", "ancient_greek", "etruscan", "roman", "byzantine", "medieval", "gothic", "moorish_islamic", "ottoman", "renaissance", "baroque", "georgian_neoclassical", "nineteenth_century", "art_nouveau", "twentieth_century_modern", "world_war_ii", "cold_war", "asuka_nara", "heian", "kamakura", "muromachi", "azuchi_momoyama", "edo", "meiji"],
                  "type": "string"
                },
                "type": "array"
