{
  "lockfileVersion": 2,
  "subjects": {
    "com.qrforprint/qrforprint": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qrforprint.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "qrforprint",
        "title": "qrforprint",
        "version": "1.0.0",
        "websiteUrl": "https://qrforprint.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "qrforprint makes QR codes for print. preview_qr_code draws a static code without an account and returns a link to the qrforprint editor for styling and print file downloads. list_my_codes, create_dynamic_link_code and update_code_destination work on the user's qrforprint account after sign-in. A dynamic link code prints a short link whose destination can be changed later; photo, PDF and voice note codes are created and changed on qrforprint.com.",
      "tools": [
        {
          "name": "create_dynamic_link_code",
          "title": "Create a dynamic link QR code",
          "description": "Creates a dynamic QR code in the signed-in qrforprint account. The code holds a short qrforprint link that forwards to the given web address, so the destination can be changed later without reprinting, and scans are counted. Free accounts can have 3 dynamic codes. Returns the short link, the QR image and a link to style and download it on qrforprint.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "destination_url": {
                "description": "The web address the code opens, starting with http:// or https://.",
                "maxLength": 2048,
                "type": "string"
              },
              "name": {
                "description": "A name to find the code by later, such as 'Table menu'.",
                "maxLength": 120,
                "type": "string"
              }
            },
            "required": ["destination_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create a dynamic link QR code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:bf386b16f4c38bcf9df131745e79d318076aa601430e00626ec2a33a34c84c57"
        },
        {
          "name": "list_my_codes",
          "title": "List my QR codes",
          "description": "Lists the QR codes saved in the signed-in qrforprint account, newest first, 50 per page: name, type, static or dynamic, short link, destination, total scans for dynamic codes, creation date, whether the code is disabled, and a link to edit it on qrforprint.com.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "page": {
                "description": "Page number, starting at 1.",
                "maximum": 1000,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List my QR codes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f26e4bb8081c7c7dd7205c2765f480b23fbaa9f269e2adfa9935252c919300c4"
        },
        {
          "name": "preview_qr_code",
          "title": "Preview a QR code",
          "description": "Draws a black and white preview of a static QR code for a web address, plain text, email, phone call, text message, WiFi network or contact card. Returns the PNG image and a link that opens the same content in the qrforprint editor, where it can be styled and downloaded as PNG, SVG, PDF or EPS. Nothing is saved and no account is needed. A static code cannot be changed after it is printed.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "type email: the recipient address.",
                "maxLength": 320,
                "type": "string"
              },
              "emailBody": {
                "description": "type email: optional message body.",
                "maxLength": 2000,
                "type": "string"
              },
              "emailSubject": {
                "description": "type email: optional subject.",
                "maxLength": 300,
                "type": "string"
              },
              "firstName": {
                "description": "type vcard: first name.",
                "maxLength": 100,
                "type": "string"
              },
              "lastName": {
                "description": "type vcard: last name.",
                "maxLength": 100,
                "type": "string"
              },
              "org": {
                "description": "type vcard: company.",
                "maxLength": 200,
                "type": "string"
              },
              "phone": {
                "description": "type phone: the number to call, international format such as +14155550123.",
                "maxLength": 40,
                "type": "string"
              },
              "smsBody": {
                "description": "type sms: optional message text.",
                "maxLength": 1000,
                "type": "string"
              },
              "smsPhone": {
                "description": "type sms: the number the text message goes to.",
                "maxLength": 40,
                "type": "string"
              },
              "text": {
                "description": "type text: the plain text to encode.",
                "maxLength": 3000,
                "type": "string"
              },
              "title": {
                "description": "type vcard: job title.",
                "maxLength": 200,
                "type": "string"
              },
              "type": {
                "description": "What the code holds: url, text, email, phone, sms, wifi or vcard (contact card).",
                "enum": ["url", "text", "email", "phone", "sms", "wifi", "vcard"],
                "type": "string"
              },
              "url": {
                "description": "type url: the web address, starting with http:// or https://.",
                "maxLength": 2048,
                "type": "string"
              },
              "vcardEmail": {
                "description": "type vcard: email address.",
                "maxLength": 320,
                "type": "string"
              },
              "vcardPhone": {
                "description": "type vcard: phone number.",
                "maxLength": 40,
                "type": "string"
              },
              "vcardUrl": {
                "description": "type vcard: website.",
                "maxLength": 2048,
                "type": "string"
              },
              "wifiEncryption": {
                "description": "type wifi: WPA (default), WEP, or nopass for an open network.",
                "enum": ["WPA", "WEP", "nopass"],
                "type": "string"
              },
              "wifiHidden": {
                "description": "type wifi: true if the network name is hidden.",
                "type": "boolean"
              },
              "wifiPassword": {
                "description": "type wifi: the network password.",
                "maxLength": 128,
                "type": "string"
              },
              "wifiSsid": {
                "description": "type wifi: the network name (SSID).",
                "maxLength": 64,
                "type": "string"
              }
            },
            "required": ["type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Preview a QR code"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:606a1c93fa04c00b60676430f45b94a992567d03b2ed88ac55b691fb30e4c43d"
        },
        {
          "name": "update_code_destination",
          "title": "Change where a QR code goes",
          "description": "Changes the web address a dynamic link QR code in the signed-in qrforprint account forwards to. Printed copies keep working and open the new address from the next scan. Accepts the code ID or its short link. Static codes, disabled codes and photo, PDF or voice note codes cannot be changed with this tool.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "code": {
                "description": "The code ID or its short link, as shown by list_my_codes.",
                "maxLength": 300,
                "type": "string"
              },
              "destination_url": {
                "description": "The new web address, starting with http:// or https://.",
                "maxLength": 2048,
                "type": "string"
              }
            },
            "required": ["code", "destination_url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Change where a QR code goes"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:05a7960f31ca7f854f6cc5d6ee071d725da2547f76bd228636a485236b18df17"
        }
      ],
      "digest": "sha256:5a641b2457c99db0456b73c22fe5f99e221a8d06c51b14ace7057e6029b1eb0a"
    }
  }
}
