        {
          "name": "get_dasha",
          "title": "Daśā Periods",
          "description": "Return a dasha (planetary period) timeline as a nested tree anchored on a date — past, present and future in ONE call. Works for BOTH planetary (graha) and sign (rasi) dasha systems; name the 'system' and the tool routes it automatically (default: vimsottari, anchored today, depth 3).\n\nEvery period node has the same shape: 'level' (maha/antar/pratyantar/sookshma), 'ruler' (planet for graha, sign for rasi), 'start', 'end' (YYYY-MM-DD) and 'relation' (past/current/future). The result carries 'dasha_type' ('graha'/'rasi'), 'system', 'as_of', 'depth', a ready-made 'current' summary (with a 'path' and 'current_period_ends'), the full 'maha_timeline', and the expanded 'current_maha' → 'current_antar' → 'current_pratyantar' branches (rasi systems have two levels, no pratyantar; level 4 'sookshma' is graha-only). To drill into a SPECIFIC period regardless of date, pass 'maha' (and optionally 'antar') as a ruler name — it returns under 'selected_maha'/'selected_antar'.\n\nThe full list of supported graha and rasi systems is the 'system' enum below. Set 'as_of_date' (YYYY-MM-DD, separate from birth 'date') to anchor on another time. Data only — no interpretation.",
          "inputSchema": {
            "properties": {
              "antar": {
                "description": "Optional ruler name of an antar to expand inside the maha named in 'maha' (graha systems). Returned under 'selected_antar'. Requires 'maha' to be set.",
                "type": "string"
              },
              "as_of_date": {
                "description": "Anchor date as YYYY-MM-DD. The tree is centred on the period active at this date. Defaults to today. (This is separate from the birth 'date'.)",
                "type": "string"
              },
              "date": {
                "description": "Birth date in YYYY-MM-DD format, e.g. 1985-06-15",
                "type": "string"
              },
              "depth": {
                "description": "How many levels to expand for the active branch: 1=maha, 2=+antar, 3=+pratyantar, 4=+sookshma. Defaults to 3 for graha systems and 2 for rasi. Level 4 (sookshma) applies to graha systems only.",
                "maximum": 4,
                "minimum": 1,
                "type": "integer"
              },
              "gender": {
                "description": "Optional. A few classical yogas are defined by gender -- Mahabhagya's rule is gender x day/night x odd/even signs. Supply it when known; when omitted those yogas are left out of the result rather than computed against an assumed gender.",
                "enum": ["male", "female"],
                "type": "string"
              },
              "latitude": {
                "description": "Birth-place latitude in decimal degrees, e.g. 13.0827",
                "type": "number"
              },
              "longitude": {
                "description": "Birth-place longitude in decimal degrees, e.g. 80.2707",
                "type": "number"
              },
              "maha": {
                "description": "Optional ruler name (planet for graha, sign for rasi) to expand a SPECIFIC maha regardless of date, e.g. 'Saturn'. Returned under 'selected_maha'. If the ruler occurs more than once, the occurrence nearest 'as_of_date' is used.",
                "type": "string"
              },
              "place": {
                "description": "Optional birth-place name (cosmetic only).",
                "type": "string"
              },
              "system": {
                "description": "Dasha system to use — any planetary (graha) or sign (rasi) system. Send EXACTLY one enum token. Defaults to 'vimsottari'.",
                "enum": ["vimsottari", "ashtottari", "yogini", "shodasottari", "dwadasottari", "panchottari", "satabdika", "chaturaaseeti_sama", "shashtisama", "shattrimsa_sama", "dwisatpathi", "kaala", "buddhi_gathi", "naisargika", "aayu", "tara", "karaka", "tithi_ashtottari", "tithi_yogini", "karana_chaturaaseeti_sama", "saptharishi_nakshathra", "rasi_bhukthi_vimsottari", "yoga_vimsottari", "ashtaka_varga_planet", "ashtaka_varga_sign", "ashtaka_varga_pinda", "moola_graha", "rashmi", "narayana", "chara", "kendraadhi_rasi", "sudasa", "drig", "nirayana", "shoola", "kendraadhi_karaka", "lagnamsaka", "padhanadhamsa", "mandooka", "sthira", "tara_lagna", "brahma", "varnada", "yogardha", "navamsa", "paryaaya", "trikona", "kalachakra", "chakra", "sandhya_panchaka", "chathurvidha_utthara", "karaka_kendraadhi", "lagna_kendraadhi", "niryaana", "raashiyanka"],
