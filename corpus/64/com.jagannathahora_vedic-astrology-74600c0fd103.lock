        {
          "name": "get_ashtakavarga",
          "title": "Aṣṭakavarga",
          "description": "Return the Ashtakavarga bindu (benefic point) scores for the chart, labelled by planet and sign. 'binna_ashtaka_varga' (BAV) maps each of the Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn and the Ascendant to its bindu count in every sign (Aries..Pisces, 0-8 each). 'samudhaya_ashtaka_varga' (SAV) is the combined total per sign across the seven planets (sums to 337); higher SAV signs are stronger. 'sodhita_ashtaka_varga' (SoAV) is that same BAV after Trikona and Ekaadhipatya sodhana — the reduced grid the pindas are actually computed from — keyed by planet Sun..Saturn (7 rows; the Ascendant has no reduced row). 'raasi_pindas', 'graha_pindas' and 'sodhya_pindas' give per-planet pinda totals (sodhya = raasi + graha), keyed by planet Sun..Saturn. Data only — no interpretation is added. (The detailed prastara contributor grid is not included.)",
