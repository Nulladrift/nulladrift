                        "description": "true/omitted: buyable only; false: also unavailable.",
                        "type": "boolean"
                      },
                      "categories": {
                        "description": "OR. Category path slugs, e.g. drink/coffee; a path matches its subcategories.",
                        "items": {
                          "pattern": "^[a-z0-9-]+(/[a-z0-9-]+)*$",
                          "type": "string"
                        },
                        "maxItems": 50,
                        "minItems": 1,
                        "type": "array"
                      },
