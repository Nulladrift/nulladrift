        {
          "name": "search_catalog",
          "title": "Search products",
          "description": "Search everyday products from independent brands on Loyaltie. Put the product words from the person's request in catalog.query, a short phrase such as \"hot sauce\" (every word must match a product, so never a whole sentence); put the rest of their task in context.intent and hard requirements in filters; never add words or narrow beyond what they asked. context is soft (ranks, never removes); filters are hard: price {min,max} in USD cents, ships_from [{country, region}] for the maker's state (e.g. NC), ships_to {country: \"US\", region} for the US state the order ships to (makers with no state list are kept, including one with no shipping set up; another country returns nothing, which does not rule out delivery there; the cart confirms), categories, shops, occasion, regular_delivery, available (default buyable only). Check messages: a filter that could not be applied is reported there. Amounts are minor units (cents). view \"full\" adds offers, the Agent Context and all images.",
