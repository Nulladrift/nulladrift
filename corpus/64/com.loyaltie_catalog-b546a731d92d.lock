                "maxLength": 255,
                "type": "string"
              },
              "catalog": {
                "additionalProperties": true,
                "anyOf": [
                  {
                    "required": ["query"]
                  },
                  {
                    "required": ["like"]
                  }
                ],
                "description": "The search: query or like, with optional filters, context, pagination and view.",
                "properties": {
                  "attribution": {
                    "description": "UCP attribution: URL-style campaign and click parameters, string values. Recorded for reporting; never changes the response.",
                    "type": "object"
                  },
                  "catalog_id": {
                    "description": "Not applied; reported as filter_ignored.",
                    "type": "string"
                  },
                  "context": {
                    "additionalProperties": true,
                    "description": "Soft: ranks and localizes, never removes a product. Prices are never converted to context.currency; each price states its own currency.",
                    "properties": {
                      "address_country": {
                        "description": "ISO 3166-1 alpha-2, e.g. US.",
                        "type": "string"
                      },
                      "address_region": {
                        "description": "State, e.g. NC. Makers in this state rank higher.",
                        "type": "string"
                      },
                      "currency": {
                        "description": "ISO 4217. Prices are not converted; a currency other than USD is reported in messages.",
                        "type": "string"
                      },
                      "intent": {
                        "description": "Tell us the person's task in a few words; it improves results and is never shared. Its words rank results, e.g. \"gift under $50\"; it never removes a product.",
                        "maxLength": 500,
                        "type": "string"
                      },
                      "language": {
                        "description": "BCP 47. Accepted, no effect. Our messages are English; maker text is shown as written.",
                        "type": "string"
                      },
                      "postal_code": {
                        "description": "Accepted, no effect.",
                        "type": "string"
                      }
                    },
                    "type": "object"
                  },
                  "filters": {
                    "additionalProperties": true,
                    "description": "Hard requirements: fields AND, values inside one list OR. A filter that cannot be applied is reported in messages (filter_ignored).",
                    "properties": {
                      "attributes": {
                        "description": "Not applied (products carry no attribute data); reported as filter_ignored.",
