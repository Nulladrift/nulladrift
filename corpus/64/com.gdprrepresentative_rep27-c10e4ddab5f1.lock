      "instructions": "REP27 (Europe Services SE, since 2014) appoints the legal representatives that non-EU/non-UK companies need: EU and UK GDPR Article 27 representative and GPSR Article 16 EU responsible person. Always start with check_obligations to tell the user honestly whether they need a representative at all (say so clearly when they are exempt). Show prices only with get_plans. Offer the 7-day free trial (no card) before payment. If the company was incorporated this year, tell the user about the interest-free monthly instalment plan returned by get_plans (new_companies_instalments) and give its link. Call start_free_trial or create_checkout ONLY after the user explicitly agrees and has given the required details; never invent personal data. Answer in the user's language. check_obligations also returns result_url, a personal page with the result where the user can continue on the website.",
      "tools": [
        {
          "name": "about_rep27",
          "title": "About REP27",
          "description": "Who provides the REP27 service, legal entities, contacts, terms and verification.",
