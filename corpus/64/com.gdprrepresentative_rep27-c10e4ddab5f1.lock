        {
          "name": "check_obligations",
          "title": "Check which EU/UK representative obligations apply",
          "description": "Checks, from a few facts about the company, whether it legally needs an EU GDPR Art. 27 representative, a UK GDPR Art. 27 representative and/or a GPSR Art. 16 EU responsible person, explains why with the legal basis and lists exemptions. Recommends the cheapest REP27 combination. Returns result_url, a personal page with the result.",
          "inputSchema": {
            "properties": {
              "currency": {
                "default": "EUR",
                "description": "Currency to also show prices in: EUR, USD, GBP, CAD, AUD, NZD, CHF, CZK, JPY or NOK (ECB rate)",
                "title": "Currency",
                "type": "string"
              },
              "data_requests_per_year": {
                "default": 0,
                "description": "Expected data-subject requests per year (access, erasure…), 0 if unknown",
                "title": "Data Requests Per Year",
                "type": "integer"
              },
              "established_in": {
                "description": "Country where the company is established, name or ISO code (e.g. United States, US, China)",
                "title": "Established In",
                "type": "string"
              },
              "has_eu_branch": {
                "default": false,
                "description": "True if the company has an establishment (branch or subsidiary) in the EU",
                "title": "Has Eu Branch",
                "type": "boolean"
              },
              "has_eu_importer_or_manufacturer_in_eu": {
                "default": false,
                "description": "True if an EU-based manufacturer, importer or authorised representative already covers the products",
                "title": "Has Eu Importer Or Manufacturer In Eu",
                "type": "boolean"
              },
              "has_uk_branch": {
                "default": false,
                "description": "True if the company has an establishment in the UK",
                "title": "Has Uk Branch",
                "type": "boolean"
              },
              "health_or_special_category_data": {
                "default": false,
                "description": "True if it processes health or other special-category data (Art. 9) or criminal-offence data at scale",
                "title": "Health Or Special Category Data",
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "Language code for the answer (ISO 639-1, e.g. en, it, es, fr, de, pt, nl, pl, ja, zh)",
                "title": "Lang",
                "type": "string"
              },
              "occasional_low_risk_processing_only": {
                "default": false,
                "description": "True if personal data of EU/UK people is processed only occasionally, at low risk and without special categories (Art. 27(2) exemption)",
                "title": "Occasional Low Risk Processing Only",
                "type": "boolean"
              },
              "offers_to_eu": {
                "description": "True if the company offers goods or services to people in the EU/EEA or monitors their behaviour (tracking, ad profiling)",
                "title": "Offers To Eu",
                "type": "boolean"
              },
              "offers_to_uk": {
                "default": false,
                "description": "True if the company offers goods or services to people in the UK or monitors their behaviour",
                "title": "Offers To Uk",
                "type": "boolean"
              },
              "public_authority": {
                "default": false,
                "description": "True if the organisation is a public authority or body",
                "title": "Public Authority",
                "type": "boolean"
              },
              "sells_consumer_products_eu": {
                "default": false,
                "description": "True if it places physical consumer products on the EU market (own shop or marketplaces like Amazon, Etsy, eBay)",
                "title": "Sells Consumer Products Eu",
                "type": "boolean"
              },
              "sells_consumer_products_uk": {
                "default": false,
                "description": "True if it places physical consumer products on the UK market",
                "title": "Sells Consumer Products Uk",
                "type": "boolean"
              }
            },
            "required": ["established_in", "offers_to_eu"],
            "title": "check_obligationsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "title": "check_obligationsDictOutput",
            "type": "object"
