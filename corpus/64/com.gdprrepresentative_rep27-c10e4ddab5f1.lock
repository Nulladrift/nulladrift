        {
          "name": "create_checkout",
          "title": "Create secure checkout",
          "description": "Creates the secure Mollie checkout for the chosen REP27 plan with the buyer's company, country, contact name and email, and returns the payment link. Payment happens on Mollie's page, never in the chat.",
          "inputSchema": {
            "properties": {
              "billing": {
                "default": "yearly",
                "description": "yearly, or monthly only for GPSR responsible-person plans",
                "enum": ["yearly", "monthly"],
                "title": "Billing",
                "type": "string"
              },
              "company": {
                "description": "Legal name of the buying company",
                "title": "Company",
                "type": "string"
              },
              "country": {
                "description": "Country where the company is established",
                "title": "Country",
                "type": "string"
              },
              "currency": {
                "default": "EUR",
                "description": "Currency to pay in: EUR, USD, GBP, CAD, AUD, NZD, CHF, CZK, JPY or NOK (ECB rate)",
                "title": "Currency",
                "type": "string"
              },
              "email": {
                "description": "Email of the buyer contact, as given by the user",
                "title": "Email",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language code for the answer (ISO 639-1, e.g. en, it, es, fr, de, pt, nl, pl, ja, zh)",
                "title": "Lang",
                "type": "string"
              },
              "name": {
                "description": "Full name of the buyer contact, as given by the user",
                "title": "Name",
                "type": "string"
              },
              "phone": {
                "default": "",
                "description": "Contact phone (optional)",
                "title": "Phone",
                "type": "string"
              },
              "plan": {
                "description": "Plan key as returned by get_plans: base, standard, multi (gdpr) or rp-solo, rp-brand, rp-house (gpsr)",
                "title": "Plan",
                "type": "string"
              },
              "service": {
                "description": "gdpr = GDPR Art. 27 representative, gpsr = GPSR Art. 16 EU responsible person",
                "enum": ["gdpr", "gpsr"],
                "title": "Service",
                "type": "string"
              },
              "territory": {
                "default": "eu",
                "description": "Territory for the GDPR representative: eu, uk or both",
                "enum": ["eu", "uk", "both"],
                "title": "Territory",
                "type": "string"
              },
              "vat": {
                "default": "",
                "description": "EU VAT number if the company has one (reverse charge, no VAT)",
                "title": "Vat",
                "type": "string"
              },
              "website": {
                "default": "",
                "description": "Company website (optional)",
                "title": "Website",
                "type": "string"
              }
            },
            "required": ["company", "country", "email", "name", "plan", "service"],
            "title": "create_checkoutArguments",
            "type": "object"
