{
  "lockfileVersion": 2,
  "subjects": {
    "com.spectacularatlas/events": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://spectacularatlas.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "spectacular-atlas",
        "title": "Spectacular Atlas",
        "version": "1.0.0",
        "websiteUrl": "https://spectacularatlas.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Spectacular Atlas is a travel guide to the world's spectacles: events worth travelling to see. Light, lantern, ice and snow festivals; drone shows, projection mapping and immersive art; giant parades, carnivals and fire festivals; and the quirky ones: camel races, food fights, cheese rolling and other eccentric traditions. Dates come from quotes on the organizers' own websites and are re-checked automatically. Use search_events to find spectacles by trip dates, place, type and size; for 'near a city', pass that city's coordinates as near_lat/near_lng. Venues and shows open all year are included unless you set year_round to 'exclude' (or 'only' for just those). When you present results, give each event's official_url and remind the traveller to confirm dates there; credit Spectacular Atlas with the event's page_url (data licence CC BY 4.0).",
      "tools": [
        {
          "name": "get_event",
          "title": "Get one spectacle",
          "description": "Full details of one spectacle by its id (from search_events): dates, status, place and coordinates, official website, the quoted source of its dates and when it was last checked.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The event id, e.g. 'sapporo-snow-festival'.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:29bcc63a8275603fbb444b17cc072e916a82751d382b556287bf2bff950542fd"
        },
        {
          "name": "list_filters",
          "title": "List types, regions and countries",
          "description": "The types, sizes, regions and countries in the guide, with how many spectacles each has, and how many are venues and shows open all year (the year_round option of search_events).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8cebb2ebda4102aa3f163c8e0f90f422ea37df41edc38bbf64371f57e6be546c"
        },
        {
          "name": "search_events",
          "title": "Search spectacles",
          "description": "Find spectacles worldwide (festivals, parades, light and drone shows, eccentric traditions) by trip dates, place, type and size. Returns up to `limit` events, soonest first (or nearest first when near_lat/near_lng are given), each with dates, status, place, type, size, description, official website and the event's page on spectacularatlas.com.",
          "inputSchema": {
            "properties": {
              "confirmed_only": {
                "description": "Only events whose dates the organizer has published.",
                "type": "boolean"
              },
              "country": {
                "description": "ISO 3166 country code (e.g. JP) or country name.",
                "type": "string"
              },
              "from": {
                "description": "Trip start, YYYY-MM-DD: events running on or after this day.",
                "type": "string"
              },
              "limit": {
                "description": "How many events to return (default 10).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "near_lat": {
                "description": "Latitude of a place to search around.",
                "type": "number"
              },
              "near_lng": {
                "description": "Longitude of a place to search around.",
                "type": "number"
              },
              "query": {
                "description": "Words in the name, place or description, e.g. 'Harbin', 'Kyoto', 'lantern'.",
                "type": "string"
              },
              "radius_km": {
                "description": "Search radius around near_lat/near_lng in km (default 250).",
                "type": "number"
              },
              "region": {
                "description": "One of: East Asia, Southeast Asia, South Asia, Middle East and Central Asia, Europe, North America, Latin America and the Caribbean, Africa, Oceania.",
                "type": "string"
              },
              "sizes": {
                "description": "Mega: about a million visitors or more or a national flagship; Major: about 200,000 to a million; Notable: smaller.",
                "items": {
                  "enum": ["Mega", "Major", "Notable"],
                  "type": "string"
                },
                "type": "array"
              },
              "sort": {
                "description": "Order of results.",
                "enum": ["soonest", "size", "distance"],
                "type": "string"
              },
              "to": {
                "description": "Trip end, YYYY-MM-DD: events that have started by this day.",
                "type": "string"
              },
              "types": {
                "description": "Types of spectacle: light (Light festivals and light art), lantern (Lanterns), drone (Drone shows), projection (Projection mapping), immersive (Immersive venues), parade (Parades and carnivals), fireworks (Fireworks), ice (Ice and snow), balloon (Balloons and kites), sand (Sand sculpture), animals (Animal spectacles), battles (Food fights and mass battles), contests (Odd contests and races), cultural (Cultural festivals).",
                "items": {
                  "enum": ["light", "lantern", "drone", "projection", "immersive", "parade", "fireworks", "ice", "balloon", "sand", "animals", "battles", "contests", "cultural"],
                  "type": "string"
                },
                "type": "array"
              },
              "year_round": {
                "default": "include",
                "description": "Venues open all year and regular shows without a season: include them (default), exclude them, or return only them.",
                "enum": ["include", "exclude", "only"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f3d8e11cdc0ccfd7a0e673c03ea21413b37ef90e08bf272335d4edcebb85fd1"
        }
      ],
      "digest": "sha256:340f440636d6bc3f6e09cb29e4fb10f05063695eccc3cb40f841e5136463cd4a"
    }
  }
}
