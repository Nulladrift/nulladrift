{
  "lockfileVersion": 2,
  "subjects": {
    "ai.wondel/google-search": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.wondel.ai/google-search/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Google Search",
        "title": "Google Search MCP",
        "version": "1.0.0",
        "description": "Fast Google web search: organic results and related questions, no ads.",
        "websiteUrl": "https://mcps.wondel.ai/servers/google-search/",
        "icons": [
          {
            "src": "https://mcps.wondel.ai/favicon.svg",
            "mimeType": "image/svg+xml"
          },
          {
            "src": "https://mcps.wondel.ai/logo-96-inverse.png",
            "mimeType": "image/png",
            "sizes": ["96x96"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Data from Google Search (https://www.google.com) for this one query. Attribute it to that source, keep the original links and do not present it as Wondel.ai's; all rights stay with the source operator. Have the user verify prices and availability at the source. For the user's personal use, not bulk extraction or redistribution. Unofficial, as-is. Terms: https://mcp.wondel.ai/legal.txt; contact: support@wondel.ai.",
      "tools": [
        {
          "name": "google_search",
          "title": "Search Google (SerpAPI)",
          "description": "Fast Google web search via SerpAPI's google_light engine. Returns organic_results, related_questions and related_searches (lighter and faster than the full Google engine; no ads, inline images or other rich elements). Paginate with start (+10 results per page: 0, 10, 20, …). Localize with location or uule (mutually exclusive), gl/hl for country/language, and lr to restrict result languages.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "device": {
                "description": "Device to emulate for the search: 'desktop' (default), 'tablet' or 'mobile'.",
                "enum": ["desktop", "tablet", "mobile"],
                "type": "string"
              },
              "filter": {
                "description": "'Similar Results' and 'Omitted Results' filter: 1 = on (default), 0 = off (show all).",
                "maximum": 1,
                "minimum": 0,
                "type": "integer"
              },
              "gl": {
                "description": "Country code for the search, e.g. 'us', 'uk', 'de'.",
                "maxLength": 2,
                "minLength": 2,
                "type": "string"
              },
              "google_domain": {
                "description": "Google domain to use, e.g. 'google.com', 'google.co.uk', 'google.de'. Default google.com.",
                "type": "string"
              },
              "hl": {
                "description": "Language code, e.g. 'en', 'es', 'fr'.",
                "type": "string"
              },
              "location": {
                "description": "Geographic location to originate the search from, e.g. 'Austin, Texas, United States'. Mutually exclusive with uule.",
                "type": "string"
              },
              "lr": {
                "description": "Restrict results to one or more languages, e.g. 'lang_en' or 'lang_en|lang_fr'.",
                "type": "string"
              },
              "nfpr": {
                "description": "Exclude auto-corrected (spelling-fix) results: 1 = exclude (use the exact query), 0 = allow (default).",
                "maximum": 1,
                "minimum": 0,
                "type": "integer"
              },
              "no_cache": {
                "description": "Force a fresh SerpAPI fetch and bypass this server's result cache. Default false.",
                "type": "boolean"
              },
              "q": {
                "description": "Search query / keywords (required). Supports standard Google operators (site:, intitle:, quotes, …).",
                "type": "string"
              },
              "safe": {
                "description": "SafeSearch level: 'active' to filter explicit results, 'off' to disable.",
                "enum": ["active", "off"],
                "type": "string"
              },
              "start": {
                "description": "Result offset for pagination (0-based): 0 = page 1, 10 = page 2, 20 = page 3, … (+10 per page).",
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "uule": {
                "description": "Google-encoded location string (uule); advanced alternative to location. Mutually exclusive with location.",
                "type": "string"
              },
              "zero_trace": {
                "description": "Enterprise-only ZeroTrace mode: don't store search params/metadata on SerpAPI. Default false.",
                "type": "boolean"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:35c685b26f7abced6e7e240724d99929b24bf9972fca277fa6f17a14380b8ce2"
        }
      ],
      "digest": "sha256:8613d85f995580ea754109e40e7466de27c7d0432cada1814713936b94734ba0"
    }
  }
}
