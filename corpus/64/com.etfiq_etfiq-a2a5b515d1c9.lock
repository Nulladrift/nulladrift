      "instructions": "Independent data on US listed ETFs, recomputed nightly from public filings and prices. Every answer carries the source and as-of date of each number and a ready citation string: use it. These tools refuse rather than return a near match: a refusal from a fund tool means ETFIQ does not publish that fund, and a refusal from build_portfolio says which construction choice to change. build_portfolio takes choices about the portfolio only, never about the person, and every answer from it carries a not-advice line to show with it.\n\nAGENT QUICK-START. Read-only research data: ETFIQ places no orders and gives no advice, and nothing here is a trade to make. Scout: etf_movers (flows and returns, dated), etf_news_today (launches, closures, filings), etf_flows, etf_rankings. Analyst: etf_search then etf_profile, etf_holdings, etf_scorecard, etf_benchmark, etf_promise, etf_return_of_capital, etf_trading_cost, etf_committee, etf_compare. Strategist: etf_screen, etf_theme, strategy_list then strategy_signals and strategy_record (a tracked record, hypothetical). Risk officer: etf_risk_check on a list of tickers (overlap, concentration, leverage, premium, liquidity, closure), etf_overlap. Strategy Tracker: strategy_signals for holdings and the tracked blotter only. Every number carries its date (as_of, lag_days): quote the date with the number. A number ETFIQ does not publish comes back as a refusal or under not_published, never as zero: do not fill it in. Rate limit: 60 calls a minute per caller, up to 4 calls in one batch; a 429 or 503 carries Retry-After. A tool that returns an error names what to change: read its reason and tried fields before retrying.",
      "tools": [
        {
          "name": "build_portfolio",
          "description": "Builds a custom portfolio of US listed ETFs from the user's construction choices and shows the rule applied. Weights form (rule version 2): weights, the user's own percent per asset class, adding to exactly 100; cheapest fund per class by default (defaults.line names them). Band form (version 1): band, include and funds set the weights. Funds file N-PORT, hold at least $100 million and have three years of prices; each fee comes with its date. Refusals carry a kind: weights-total, unknown-class, or person (any argument about the person, such as age, income or risk tolerance; weights and bands are choices about the portfolio). Whether a portfolio suits someone is not answered. returns are hypothetical, monthly-reset, only over windows every fund covers (returns.common.sentence says where history starts). compare_to_benchmark takes compare.arguments. Every answer carries not_advice.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "band": {
                "description": "Version 1: the stock-share band the portfolio should sit in.",
                "enum": ["conservative", "moderately-conservative", "moderate", "moderately-aggressive", "aggressive"],
                "type": "string"
              },
              "criterion": {
                "default": "cheapest",
                "description": "How a fund is chosen inside each asset class or sleeve: lowest fee, or most net assets. Default cheapest.",
                "enum": ["cheapest", "largest"],
                "type": "string"
              },
              "feeCeiling": {
                "description": "The most any one fund may charge, in percent a year (0.25 is 0.25%).",
                "exclusiveMinimum": 0,
                "maximum": 3,
                "type": "number"
              },
              "funds": {
                "description": "How many funds: 2 to 12 with a band; with weights, at least one per asset class (the default).",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "include": {
                "additionalProperties": false,
                "description": "Version 1: which sleeves the portfolio holds besides stocks and bonds. All four are required with a band.",
                "properties": {
                  "alternatives": {
                    "description": "True to hold an alternatives sleeve (5% of the bond share).",
                    "type": "boolean"
                  },
                  "commodities": {
                    "description": "True to hold a commodities sleeve (5% of the bond share).",
                    "type": "boolean"
                  },
