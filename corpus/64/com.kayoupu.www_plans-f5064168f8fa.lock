{
  "lockfileVersion": 2,
  "subjects": {
    "com.kayoupu.www/plans": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.kayoupu.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kayoupu-plans",
        "title": "卡有谱套餐查询",
        "version": "1.0.0",
        "websiteUrl": "https://www.kayoupu.com/developers/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "查询卡有谱收录的中国大陆流量卡。仅查询公开在售资料，不代表全市场或运营商官方结果。保留来源、渠道资料日期和未知条件；checked_at 是来源记录的资料获取时间，不是独立核验时间。地区匹配只是已知发货范围初筛，不保证可办、信号或全年总费用。部分办理链接可能带来推广收入。",
      "tools": [
        {
          "name": "compare_plans",
          "title": "对比套餐条件",
          "description": "对比两到三款不同 slug 的在售套餐，包括月租、通用及定向流量、通话和已知办理条件。未知项不推断为免费或无限制，不比较信号质量。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slugs": {
                "description": "从 search_plans 获取的 2–3 个不同套餐 slug。",
                "items": {
                  "maxLength": 128,
                  "minLength": 1,
                  "pattern": "^[a-z0-9-]+$",
                  "type": "string"
                },
                "maxItems": 3,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["slugs"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:cfda3c4afb650edd7ccc2e9615c6aa40fad0453bcd593a3208bc40a2b1f873ac"
        },
        {
          "name": "get_plan",
          "title": "查询套餐详情",
          "description": "用 search_plans 返回的 slug 读取在售套餐。保留首充、优惠、合约等已知条款、未知项和渠道资料日期；不提交申请。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "slug": {
                "description": "search_plans 返回的套餐 slug。",
                "maxLength": 128,
                "minLength": 1,
                "pattern": "^[a-z0-9-]+$",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:385b3760d006fb3f9f2a9d917b306d7610b97679f30c69301dec3010a52b4262"
        },
        {
          "name": "search_plans",
          "title": "筛选流量卡",
          "description": "按收货省份、运营商、预算、通用流量和通话筛选本站在售套餐，返回条件、资料日期和详情链接。默认按月租升序，不保证可办或全市场最优。",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "default": 5,
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "max_monthly_fee": {
                "description": "标注月租上限，单位元。不是首月或全年总费用。",
                "maximum": 10000,
                "minimum": 0,
                "type": "number"
              },
              "min_general_data_gb": {
                "description": "每月最低通用流量，单位 GB，不含定向流量。",
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "min_voice_minutes": {
                "maximum": 100000,
                "minimum": 0,
                "type": "number"
              },
              "nationwide": {
                "default": false,
                "description": "仅查渠道明确标注全国发货的套餐，具体禁发地址仍需确认。",
                "type": "boolean"
              },
              "offset": {
                "default": 0,
                "maximum": 10000,
                "minimum": 0,
                "type": "integer"
              },
              "operator": {
                "enum": ["移动", "联通", "电信", "广电"],
                "type": "string"
              },
              "province": {
                "description": "收货省份简称，例如广东。只保留渠道明确标注可发的套餐，具体地址仍需确认。",
                "enum": ["北京", "上海", "天津", "重庆", "广东", "浙江", "江苏", "福建", "四川", "山东", "湖南", "湖北", "安徽", "河南", "河北", "江西", "陕西", "山西", "广西", "海南", "云南", "贵州", "辽宁", "吉林", "黑龙江", "内蒙古", "甘肃", "宁夏", "青海", "新疆", "西藏"],
                "type": "string"
              },
              "query": {
                "description": "套餐名称、运营商或发货条件关键词。",
                "maxLength": 80,
                "type": "string"
              },
              "sort": {
                "default": "monthly_fee_asc",
                "enum": ["monthly_fee_asc", "general_data_desc", "voice_minutes_desc"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b5e3f4a2717ca739e7ba4754a4714eb4475b3de68c62f69e48bce7675ddf3c6d"
        }
      ],
      "digest": "sha256:e24e325114a52101186bb027a6cbc254a8360faa502f8662be18ce642cbbee02"
    }
  }
}
