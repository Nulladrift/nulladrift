        },
        {
          "name": "send_inquiry",
          "title": "Send an inquiry",
          "description": "Send a project inquiry to SigmaJunction on the user's behalf. Only use when the user has asked to contact SigmaJunction, and confirm the name, email and message with them first. A partner replies by email within one business day.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "company": {
                "description": "The user's company, if they gave one",
                "type": "string"
              },
              "email": {
                "description": "Where SigmaJunction should reply",
                "format": "email",
                "type": "string"
              },
              "message": {
                "description": "What the user wants to build or solve, in their own words",
                "type": "string"
              },
              "name": {
                "description": "The user's full name",
                "type": "string"
              },
              "topic": {
                "description": "Area of interest, e.g. Custom software, AI, Automation, Dedicated team, Partnership",
                "type": "string"
              }
            },
            "required": ["email", "message", "name"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "description": "What happens next, or why it failed",
                "type": "string"
              },
              "sent": {
                "description": "Whether the request was accepted",
                "type": "boolean"
              }
            },
            "required": ["message", "sent"],
            "type": "object"
          },
