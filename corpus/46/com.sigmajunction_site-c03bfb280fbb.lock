        {
          "name": "read_page",
          "title": "Read a page",
          "description": "Any page of sigmajunction.com as Markdown, by path (\"/pricing\", \"/de/work\") or by full URL on sigmajunction.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "path": {
                "description": "Site path such as /pricing or /de/work, or a full https://sigmajunction.com URL",
                "type": "string"
              }
