          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "locale": {
                "description": "Language of the returned links and texts: en (default), de, sr, fr, es or it.",
                "enum": ["en", "de", "sr", "fr", "es", "it"],
                "type": "string"
              },
              "query": {
                "description": "Words to look for in titles, summaries and categories, e.g. \"partner\" or \"Rust\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
