        {
          "name": "request_partner_checklist",
          "title": "Email the partner checklist",
          "description": "Email the user SigmaJunction's two-page checklist for choosing a software development partner (PDF). Only use when the user asked for it and gave their email address. Newsletter sign-up only if the user explicitly wants it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "Where to send the download link",
                "format": "email",
                "type": "string"
              },
              "locale": {
                "description": "Language of the returned links and texts: en (default), de, sr, fr, es or it.",
                "enum": ["en", "de", "sr", "fr", "es", "it"],
                "type": "string"
              },
              "newsletter": {
                "default": false,
                "description": "Also subscribe the user to the newsletter - only if they asked",
                "type": "boolean"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "description": "What happens next, or why it failed",
                "type": "string"
              },
              "sent": {
                "description": "Whether the request was accepted",
                "type": "boolean"
              }
            },
            "required": ["message", "sent"],
            "type": "object"
          },
