{
  "lockfileVersion": 2,
  "subjects": {
    "ai.bondren/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://docs.bondren.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "bondren-docs",
        "version": "0.1.0"
      },
      "capabilities": {
        "logging": {},
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Bondren's read-only documentation server. Every document is public docs\ncontent grounded in an immutable corpus. Use search_docs to find ranked\nsections for a query, then get_doc to read a page or section's Markdown.\nSearch results are paginated: pass page_info.next_cursor as cursor and stop\nonly when page_info.has_more is false.\nTool results and page resources include effective availability, maturity,\ncanonical URL, content hash, and last-reviewed metadata. Maturity is one of\nga, preview, or planned; planned sections are excluded from search unless\ninclude_planned is true. No tool mutates anything — there are no\ncreate/update/delete tools.",
      "tools": [
        {
          "name": "get_doc",
          "title": "Read a Bondren documentation page",
          "description": "Read the canonical Markdown of one docs page by id, or a single section when an anchor is supplied. Returns the page/section URL, content hash, maturity, effective availability, and last-reviewed date alongside the markdown. Unknown page ids or anchors return a clean not-found error.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "anchor": {
                "description": "optional heading anchor to read one section instead of the whole page",
                "type": "string"
              },
              "page_id": {
                "description": "the docs page id (as returned by search_docs); required",
                "type": "string"
              }
            },
            "required": ["page_id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "anchor": {
                "description": "the section anchor read, empty when the whole page was returned",
                "type": "string"
              },
              "availability": {
                "description": "effective availability: public, invite-only, or planned",
                "type": "string"
              },
              "content_revision": {
                "description": "immutable content revision of the corpus backing this document",
                "type": "string"
              },
              "hash": {
                "description": "content hash of the returned markdown",
                "type": "string"
              },
              "last_reviewed": {
                "description": "ISO date the page was last reviewed",
                "type": "string"
              },
              "markdown": {
                "description": "the canonical Markdown of the page (or the section text when anchor is set)",
                "type": "string"
              },
              "markdown_url": {
                "description": "canonical Markdown URL of the page",
                "type": "string"
              },
              "maturity": {
                "description": "content maturity: ga, preview, or planned",
                "type": "string"
              },
              "page_id": {
                "description": "the page id that was read",
                "type": "string"
              },
              "title": {
                "description": "page or section title",
                "type": "string"
              },
              "url": {
                "description": "canonical URL of the page or section",
                "type": "string"
              }
            },
            "required": ["availability", "content_revision", "markdown", "page_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7d2c949f0a5b45777201a06decfd18e18b03ed5ee80125bd5e506de916ee068c"
        },
        {
          "name": "search_docs",
          "title": "Search Bondren documentation",
          "description": "Search the Bondren public docs corpus for ranked sections matching a query. Limit defaults to 5, and the ranked result set is the top 10 matching sections. Returns GA and preview results by default; planned content is excluded unless include_planned is true. Each item carries its canonical URL, content hash, maturity, effective availability, and last-reviewed date. Pass page_info.next_cursor as cursor; stop only when page_info.has_more is false.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "Opaque continuation cursor returned by the previous page.",
                "maxLength": 32768,
                "type": "string"
              },
              "include_planned": {
                "description": "include maturity=planned sections (excluded by default); optional",
                "type": "boolean"
              },
              "limit": {
                "description": "Maximum number of items to return (1-100).",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "the user's docs question or keywords (up to 2048 bytes); required",
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "content_revision": {
                "description": "immutable content revision of the corpus backing this result",
                "type": "string"
              },
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "anchor": {
                      "description": "heading anchor on the page",
                      "type": "string"
                    },
                    "audience": {
                      "description": "intended audience tags",
                      "items": {
                        "type": "string"
                      },
                      "type": ["null", "array"]
                    },
                    "availability": {
                      "description": "effective availability: public, invite-only, or planned",
                      "type": "string"
                    },
                    "hash": {
                      "description": "content hash of this section",
                      "type": "string"
                    },
                    "heading": {
                      "description": "section heading text",
                      "type": "string"
                    },
                    "id": {
                      "description": "stable chunk id",
                      "type": "string"
                    },
                    "last_reviewed": {
                      "description": "ISO date the page was last reviewed",
                      "type": "string"
                    },
                    "markdown_url": {
                      "description": "canonical Markdown URL of the page",
                      "type": "string"
                    },
                    "maturity": {
                      "description": "content maturity: ga, preview, or planned",
                      "type": "string"
                    },
                    "page_id": {
                      "description": "parent page id",
                      "type": "string"
                    },
                    "score": {
                      "description": "relevance score (higher is better)",
                      "type": "number"
                    },
                    "section": {
                      "description": "logical section label",
                      "type": "string"
                    },
                    "title": {
                      "description": "page title",
                      "type": "string"
                    },
                    "url": {
                      "description": "canonical URL of this section",
                      "type": "string"
                    }
                  },
                  "required": ["availability", "id", "page_id", "score"],
                  "type": "object"
                },
                "type": ["null", "array"]
              },
              "page_info": {
                "additionalProperties": false,
                "properties": {
                  "has_more": {
                    "type": "boolean"
                  },
                  "next_cursor": {
                    "type": ["null", "string"]
                  }
                },
                "required": ["has_more", "next_cursor"],
                "type": "object"
              },
              "query": {
                "description": "the normalized query these items answer",
                "type": "string"
              }
            },
            "required": ["content_revision", "items", "page_info", "query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b837c43924b0e7c55b8bd114c85cb91c08cf5e37a0d4247e4366b259fcaaf1e"
        }
      ],
      "resources": [
        {
          "uri": "bondren-docs://map",
          "name": "docs-map",
          "title": "Docs map",
          "description": "The full Bondren docs content map: schema version, content revision, and every page's metadata (id, title, effective availability, maturity, canonical/markdown URLs, hash, last-reviewed date). Use this to enumerate the docs surface.",
          "mimeType": "application/json",
          "digest": "sha256:72a855c2d0dbc6b7586f00d84f3381748fee545503ca22304a12587c7a04776b"
        },
        {
          "uri": "bondren-docs://openapi",
          "name": "openapi",
          "title": "OpenAPI document",
          "description": "The raw Bondren OpenAPI document (application/yaml) bundled with this docs revision.",
          "mimeType": "application/yaml",
          "digest": "sha256:7d021f4e07dd4895d41aca608a234a6095b4b51e869382e04f962047f8834e48"
        }
      ],
      "resourceTemplates": [
        {
          "uriTemplate": "bondren-docs://pages/{+id}",
          "name": "page",
          "title": "Docs page",
          "description": "The canonical Markdown (text/markdown) of one docs page by id, with its content revision, effective availability, maturity, canonical URL, content hash, and last-reviewed date in resource metadata. Unknown ids return ResourceNotFoundError.",
          "mimeType": "text/markdown",
          "digest": "sha256:a59364d0f27f43c9261920ebe4e5752ba118c9d0c21f12bdc514e45578d1ee1b"
        }
      ],
      "digest": "sha256:e0c5f6e6aaa4c3b43ab0e9657a8041416fd4e9f5d9f8c81ae7c82a1eb454f0eb"
    }
  }
}
