  "subjects": {
    "com.faceabot/exchange-rates": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://faceabot.com/tools-mcp/exchange-rates"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "faceabot-exchange-rates",
        "title": "Faceabot Exchange Rates",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Faceabot Exchange Rates: official central-bank rates (European Central Bank, Bank of Russia, National Bank of Ukraine, National Bank of Poland), about 150 currencies, free, no key.\nexchange_rate {\"from\":\"USD\",\"to\":\"RUB\",\"amount\":100} (\"date\":\"YYYY-MM-DD\" for a past date) · list_currencies {}.\nEach result names its bank and date; for information, not a bank's rate. Cite the bank.\nPart of Faceabot (https://faceabot.com): any other tool: solve_need at https://faceabot.com/api/mcp.",
      "tools": [
        {
          "name": "exchange_rate",
          "title": "Currency exchange rate and conversion (central banks, ~150 currencies)",
          "description": "Converts an amount between currencies with official central-bank rates: European Central Bank, Bank of Russia, National Bank of Ukraine, National Bank of Poland. About 150 currencies: USD, EUR, JPY, GBP, CNY, INR, RUB, UAH, NGN, ARS, EGP, AED, SAR, PKR, VND, KES, TRY, BRL, KZT… Each result names its bank and date. Today or any past date since 2002.\nUse when: you need an exchange rate or to convert a price (\"100 USD in RUB\", \"euro to yen today\", \"naira to dollar\").\nNot for: crypto prices, or the exact rate a bank will charge.\nExample: {\"from\":\"USD\",\"to\":\"RUB\",\"amount\":100}",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amount": {
                "default": 1,
                "description": "Amount in the 'from' currency",
                "minimum": 0,
                "type": "number"
              },
              "date": {
                "description": "Optional past date YYYY-MM-DD (since 2002; default: latest rates). Weekend or holiday: the last rate in force before it.",
                "type": "string"
              },
              "from": {
                "description": "Currency to convert from: 3-letter ISO code (USD, EUR, RUB, JPY…) or a common name (\"yen\", \"ruble\", \"naira\")",
                "examples": ["USD"],
                "type": "string"
              },
              "to": {
                "description": "Currency to convert to, or a list of up to 15 currencies",
                "examples": ["EUR"],
                "oneOf": [
                  {
                    "type": "string"
                  },
                  {
                    "items": {
                      "type": "string"
                    },
                    "maxItems": 15,
                    "type": "array"
                  }
                ]
              }
            },
            "required": ["from", "to"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0f5cd0791aa7c797751ef78d26327f8f88050e3c6b428772aea3032a10fa6c9d"
        },
        {
          "name": "list_currencies",
          "title": "Currencies covered (about 150, from 4 central banks)",
          "description": "Lists every currency covered, with the central banks that publish it and the date of their latest rates.\nUse when: you need to know whether a currency is covered.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
