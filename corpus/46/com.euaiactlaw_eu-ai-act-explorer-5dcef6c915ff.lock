        {
          "name": "search_text",
          "description": "Full-text search over articles, recitals and annexes of the EU AI Act. Returns ranked matches with snippets.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Max results to return (default 5, hard cap 25)",
                "type": "integer"
              },
              "query": {
                "type": "string"
              },
              "scope": {
                "description": "Defaults to all",
                "enum": ["articles", "recitals", "annexes", "all"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "query": {
                "type": "string"
              },
              "results": {
                "items": {
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "permalink": {
                      "type": "string"
                    },
                    "snippet": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "permalink", "snippet"],
                  "type": "object"
                },
                "type": "array"
              },
              "scope": {
                "type": "string"
              },
              "total_matches": {
                "type": "integer"
              }
            },
            "required": ["query", "results", "total_matches"],
            "type": "object"
          },
