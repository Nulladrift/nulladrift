        {
          "name": "get_obligations",
          "description": "List the obligations for a role under the EU AI Act, optionally filtered by risk tier.",
          "inputSchema": {
            "properties": {
              "fields": {
                "description": "compact omits provision_text",
                "enum": ["full", "compact"],
                "type": "string"
              },
              "limit": {
                "description": "Max obligations to return (default all, hard cap 25 per call)",
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many obligations (for paging)",
                "type": "integer"
              },
              "risk_tier": {
                "description": "Filter by risk tier; \"all\" = no filter. Synonyms accepted.",
                "enum": ["unacceptable", "prohibited", "high", "high-risk", "high_risk", "transparency", "limited", "minimal", "all"],
                "type": "string"
              },
              "role": {
                "enum": ["provider", "deployer", "importer", "distributor", "notified_body", "authority"],
                "type": "string"
              }
            },
            "required": ["role"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "count": {
                "type": "integer"
              },
              "obligations": {
                "items": {
                  "properties": {
                    "actor": {
                      "type": "string"
                    },
                    "applies_from": {
                      "type": "string"
                    },
                    "clause": {
                      "type": "string"
                    },
                    "guidance_note": {
                      "type": "string"
                    },
                    "id": {
                      "type": "string"
                    },
                    "matrix_permalink": {
                      "type": "string"
                    },
                    "official_title": {
                      "type": "string"
                    },
                    "permalink": {
                      "type": "string"
                    },
                    "provision_text": {
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["applies_from", "clause", "id", "permalink", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "risk_tier": {
                "type": "string"
              },
              "role": {
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "total": {
                "type": "integer"
              }
            },
            "required": ["count", "obligations", "role"],
            "type": "object"
          },
