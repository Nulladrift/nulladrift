        {
          "name": "get_article",
          "description": "Get the full amended text of one article of the EU AI Act, including lettered numbers such as \"60a\", or of one paragraph or point by clause reference such as \"5(1)(ba)\", \"6(1a)\" or \"Article 22(3)(a)\" (lettered paragraphs like 1a are distinct from point (a) of paragraph 1). Every answer carries a citation: clause, official article heading and the euaiactlaw.com paragraph permalink.",
          "inputSchema": {
            "properties": {
              "number": {
                "description": "Article number, e.g. \"6\", \"25\", \"60a\", or a clause reference, e.g. \"5(1)(ba)\", \"6(1a)\", \"3(14a)\"",
                "type": "string"
              }
            },
            "required": ["number"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "citation": {
                "description": "Clause-level citation: clause (e.g. \"Article 5(1)(ba)\"), the article's official heading, and the euaiactlaw.com paragraph permalink (#/article/N/<anchor>).",
                "properties": {
                  "anchor": {
                    "type": ["string", "null"]
                  },
                  "annex": {
                    "type": "string"
                  },
                  "article": {
                    "type": "string"
                  },
                  "clause": {
                    "type": "string"
                  },
                  "official_title": {
                    "type": "string"
                  },
                  "paragraph": {
                    "type": ["string", "null"]
                  },
                  "permalink": {
                    "type": "string"
                  },
                  "point": {
                    "type": ["string", "null"]
                  },
                  "recital": {
                    "type": "integer"
                  },
                  "subpoint": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["clause", "official_title", "permalink"],
                "type": "object"
              },
              "date_basis": {
                "description": "Article 113 provision setting that date, where one does",
                "type": "string"
              },
              "date_note": {
                "description": "Qualifications of the date: dates by system type, provisions of the article that apply from another date, or an editorial note where the date is uncertain",
                "type": "string"
              },
              "effective_date": {
                "description": "Date from which the article applies (or, where date_note says so, the date shown as an editorial indication)",
                "type": "string"
              },
              "eurlex": {
                "type": "string"
              },
              "number": {
                "type": "string"
              },
              "paragraphs": {
                "items": {
