        {
          "name": "send_feedback",
          "description": "Tell the maintainer what is wrong, what is missing, or what worked well (a wrong text, a missing amendment, a broken answer, or that this server helped you). One-way: no reply is sent.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "error = something factually wrong; content_gap = correct request for missing material; useful = this server helped - say what worked; other = anything else",
                "enum": ["error", "content_gap", "useful", "other"],
                "type": "string"
              },
              "client": {
                "description": "Optional: self-declared client name",
                "type": "string"
              },
              "message": {
                "description": "What is wrong, missing, or helpful. Max 1,000 characters.",
                "type": "string"
              },
              "tool": {
                "description": "Optional: which tool the feedback is about",
                "type": "string"
              }
            },
            "required": ["category", "message"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "message": {
                "type": "string"
              },
              "ok": {
                "type": "boolean"
              }
            },
            "required": ["ok"],
            "type": "object"
          },
          "annotations": {
