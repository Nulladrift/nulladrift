          "inputSchema": {
            "properties": {
              "date": {
                "description": "ISO date, e.g. \"2027-06-01\". Defaults to today.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "phases": {
                "items": {
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "description": {
                      "type": "string"
                    },
                    "in_force": {
                      "type": "boolean"
                    }
                  },
                  "required": ["date", "in_force"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["as_of", "phases"],
