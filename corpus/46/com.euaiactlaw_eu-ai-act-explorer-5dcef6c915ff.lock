                    },
                    "permalink": {
                      "type": "string"
                    },
                    "point": {
                      "type": ["string", "null"]
                    },
                    "recital": {
                      "type": "integer"
                    },
                    "subpoint": {
                      "type": ["string", "null"]
                    }
                  },
                  "required": ["clause", "official_title", "permalink"],
                  "type": "object"
                },
                "type": "array"
              },
              "permalink": {
                "type": "string"
              },
              "text": {
                "type": "string"
              },
              "title": {
                "type": "string"
              }
            },
