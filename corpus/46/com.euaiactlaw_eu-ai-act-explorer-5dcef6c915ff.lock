{
  "lockfileVersion": 2,
  "subjects": {
    "com.euaiactlaw/eu-ai-act-explorer": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.euaiactlaw.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "eu-ai-act-explorer",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only EU AI Act reference. Every answer cites the Official Journal source and is not legal advice.",
      "tools": [
        {
          "name": "assess_compliance",
          "description": "Run the EU AI Act compliance assessment: given the entity's answers (same decision tree as the interactive checker on euaiactlaw.com), returns the applicable roles, risk classification, full obligation list with legal basis and deadlines, and notes (e.g. Annex I Section B reduced regime, with a precautionary Article 5 note instead of a prohibited-practice classification where an Article 5 practice is indicated for such a system, open-source GPAI exception, Art 6(4) documentation and Art 49(2) registration for an Annex III system assessed as not high-risk, distributor obligations under Art 24). Each listed item has kind \"obligation\" or \"note\" (informational, not counted in obligation_count). Pass answers keyed by step id (E1, E2, S1, R1-R5, HR1-HR6, ...); E1 (roles) is required. Multi-select steps take arrays of option ids; single-choice steps take one option id.",
          "inputSchema": {
            "properties": {
              "E1": {
                "description": "What is your role in relation to the AI system? Options: provider = Provider; deployer = Deployer; distributor = Distributor; importer = Importer; product_manufacturer = Product Manufacturer; auth_rep = Authorised Representative. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["provider", "deployer", "distributor", "importer", "product_manufacturer", "auth_rep"],
                  "type": "string"
                },
                "type": "array"
              },
              "E2": {
                "description": "Do you or any downstream entity make any of these modifications? Options: rename = Putting a different name or trademark on the system; repurpose = Modifying the intended purpose of a system already in operation; substantial_mod = Performing a substantial modification (Article 3(23)) to the system; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["rename", "repurpose", "substantial_mod", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "E3": {
                "description": "Does your product integrate an AI system and meet either criterion? Options: ai_with_product = AI system placed on the market together with the product under manufacturer name/trademark; ai_after_product = AI system put into service under manufacturer name/trademark after product placed on market; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["ai_with_product", "ai_after_product", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "HR1": {
                "description": "Does your AI system fall within any Annex I, Section B categories? Options: aviation_security = Civil aviation security; motor_type_approval = Motor vehicles type approval; machinery = Machinery; vehicles_two_three = Two/three-wheel vehicles and quadricycles; agri_vehicles = Agricultural and forestry vehicles; marine = Marine equipment; rail = Interoperability of rail systems; motor_vehicles = Motor vehicles and their trailers; civil_aviation = Civil aviation; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["aviation_security", "motor_type_approval", "machinery", "vehicles_two_three", "agri_vehicles", "marine", "rail", "motor_vehicles", "civil_aviation", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "HR1B": {
                "description": "Is your product required to undergo third-party conformity assessment under the applicable EU laws? Options: yes = Yes — third-party conformity assessment is required; no = No — internal check, self-assessment or no third-party assessment required. Omit keys that do not apply to your scenario.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "HR2": {
                "description": "Does your AI system fall within any Annex I, Section A categories? Options: toys = Toys; recreational = Recreational craft & personal watercraft; lifts = Lifts and safety components of lifts; atex = Equipment for potentially explosive atmospheres; radio = Radio equipment; pressure = Pressure equipment; cableway = Cableway installations; ppe = Personal protective equipment; gas = Appliances burning gaseous fuels; medical = Medical devices; ivd = In vitro diagnostic medical devices; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["toys", "recreational", "lifts", "atex", "radio", "pressure", "cableway", "ppe", "gas", "medical", "ivd", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "HR3": {
                "description": "Is your product required to undergo third-party conformity assessment under the applicable EU laws? Options: yes = Yes — third-party conformity assessment is required; no = No — manufacturer self-declaration or no third-party assessment required. Omit keys that do not apply to your scenario.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "HR4": {
                "description": "Does your AI system fall within any Annex III high-risk categories? Options: biometrics = Biometrics; critical_infra = Critical infrastructure; education = Educational and vocational training; employment = Employment, workers management, self-employment access; essential_services = Access to essential private/public services and benefits; law_enforcement = Law enforcement; migration = Migration, asylum, border control; justice = Administration of justice and democratic processes; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["biometrics", "critical_infra", "education", "employment", "essential_services", "law_enforcement", "migration", "justice", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "HR5": {
                "description": "Does your AI system pose a significant risk of harm to health, safety, or fundamental rights? Options: yes = Yes — poses significant risk (or system performs profiling of natural persons); no = No — meets one of the Art 6(3) derogation conditions. Omit keys that do not apply to your scenario.",
                "enum": ["yes", "no"],
                "type": "string"
              },
              "HR6": {
                "description": "Does your product include an AI system as a \"safety component\" AND fall within Annex I, Section A categories? Options: toys = Toys; recreational = Recreational craft & personal watercraft; lifts = Lifts and safety components of lifts; atex = Equipment for potentially explosive atmospheres; radio = Radio equipment; pressure = Pressure equipment; cableway = Cableway installations; ppe = Personal protective equipment; gas = Appliances burning gaseous fuels; medical = Medical devices; ivd = In vitro diagnostic medical devices; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["toys", "recreational", "lifts", "atex", "radio", "pressure", "cableway", "ppe", "gas", "medical", "ivd", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "R1": {
                "description": "Does your AI model meet any systemic risk criteria? (GPAI only) Options: high_flops = High impact capabilities (presumed where cumulative training compute exceeds 10²⁵ FLOPs); commission_decision = Commission has decided the model has high capabilities or impact (Annex XIII criteria); none = None of the above (or this is not a GPAI model). Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["high_flops", "commission_decision", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "R2": {
                "description": "Does your system or use-case fall within any exclusion category? Options: military = The AI system is placed on the market, put into service or used exclusively for military, defence or national security purposes; third_country_law = We are a public authority of a third country or an international organisation, using the AI system in the framework of international cooperation or agreements for law enforcement and judicial cooperation with the Union or one or more Member States, with adequate safeguards for fundamental rights and freedoms; research = Research, testing or development activity regarding the AI system or model before it is placed on the market or put into service; scientific_research = The AI system or AI model is specifically developed and put into service for the sole purpose of scientific research and development; open_source = The AI system is released under a free and open-source licence; personal_use = I am a natural person using the AI system in the course of a purely personal non-professional activity; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["military", "third_country_law", "research", "scientific_research", "open_source", "personal_use", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "R3": {
                "description": "Does your system perform any prohibited AI practices? Options: subliminal = Subliminal techniques, manipulation, or deception; vulnerable_exploit = Exploiting vulnerabilities of specific groups; biometric_categorisation_prohibited = Biometric categorisation to infer sensitive attributes; social_scoring = Social scoring — evaluating or classifying persons based on social behaviour; predictive_policing = Predictive policing based solely on profiling or personality traits; facial_scraping = Untargeted scraping of facial images from internet/CCTV to expand databases; emotion_recognition_prohibited = Emotion recognition in workplace or educational institutions; realtime_rbi = Real-time remote biometric identification in publicly accessible spaces for law enforcement; nonconsensual_intimate = Generating or manipulating non-consensual intimate material or child sexual abuse material; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["subliminal", "vulnerable_exploit", "biometric_categorisation_prohibited", "social_scoring", "predictive_policing", "facial_scraping", "emotion_recognition_prohibited", "realtime_rbi", "nonconsensual_intimate", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "R4": {
                "description": "Does your system perform any transparency-triggering functions? Options: deepfake = Generating or manipulating image/audio/video constituting a deep fake; public_interest_text = Generating or manipulating text published for matters of public interest (e.g., news); emotion_biometric = Emotion recognition or biometric categorisation (non-prohibited); natural_persons = Interacting directly with natural persons (e.g., chatbot); synthetic_content = Generating synthetic audio, image, video, or text content; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["deepfake", "public_interest_text", "emotion_biometric", "natural_persons", "synthetic_content", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "R5": {
                "description": "As deployer of this Annex III high-risk AI system, which of the following apply? Options: public_body = We are a body governed by public law; public_services = We are a private entity providing public services; creditworthiness = The system evaluates the creditworthiness of natural persons or establishes their credit score (Annex III, point 5(b)); life_health_insurance = The system is used for risk assessment and pricing in relation to natural persons in life and health insurance (Annex III, point 5(c)); none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["public_body", "public_services", "creditworthiness", "life_health_insurance", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "S1": {
                "description": "Do you meet any of the following criteria for EU AI Act applicability? Options: placing_eu = I am placing on the market or putting into service AI systems in the EU; gpai_eu = I am placing on the market General Purpose AI (GPAI) models in the EU; established_eu = I am established or located within the EU; importer_eu = I am an importer placing on the EU market a system bearing a non-EU entity name; distributor_eu = I am a distributor making an AI system available on the EU market; output_eu = My AI system's output is used in the EU; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["placing_eu", "gpai_eu", "established_eu", "importer_eu", "distributor_eu", "output_eu", "none"],
                  "type": "string"
                },
                "type": "array"
              },
              "S2": {
                "description": "Does your AI system reach the EU in any of the following ways? Options: placing_eu = The AI system is placed on the market or put into service in the EU; output_eu = The AI system's output is used in the EU; deployer_eu = I deploy (use) the AI system under my authority as an EU-established deployer; none = None of the above. Omit keys that do not apply to your scenario.",
                "items": {
                  "enum": ["placing_eu", "output_eu", "deployer_eu", "none"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["E1"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "art5_practices_indicated": {
                "description": "Option ids answered at step R3 (Article 5 practices indicated by the user); a raw answer list, not a legal finding: see statuses.prohibited (false on Annex I Section B and fully excluded routes)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "checker_link": {
                "type": "string"
              },
              "groups": {
                "type": "array"
              },
              "note_count": {
                "description": "Number of listed items with kind \"note\" (informational: classification statements, conditional or optional rules, Article 111 notes, the precautionary Article 5 note on Annex I Section B routes)",
                "type": "integer"
              },
              "obligation_count": {
                "description": "Number of listed items with kind \"obligation\"; informational notes are not counted",
                "type": "integer"
              },
              "obligations": {
                "description": "Every listed item: group, title, basis, deadline, desc, applies_from (where present: the date from which the item applies; for Article 111 notes, the cut-off date it refers to), kind (\"obligation\" or \"note\") and citations",
                "type": "array"
              },
              "route": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              },
              "statuses": {
                "additionalProperties": {
                  "type": "boolean"
                },
                "description": "Boolean flags from the assessment. prohibited and prohibitedPractices are the prohibited-practice finding: false on Annex I Section B routes, where art5Indicated and secBArt5Note mark an indicated Article 5 practice without a finding, and false on routes fully excluded under Article 2(3), 2(4) or 2(6) (fullyExcluded, militaryExclusion, thirdCountryExclusion, scientificResearchExclusion), where the result is the exclusion alone and no classification or obligation status is set. Other exclusion statuses: openSourceExclusion (Article 2(12) applies to the AI system; Chapter V obligations of a general-purpose AI model provider remain), personalUseExclusion (Article 2(10) applied: no deployer obligations), researchExclusion (Article 2(8): obligations, if any, apply to placing on the market or putting into service, several of them before then); art25Conditional (a modification answered at E2 on a high-risk route: the Article 25 role change is conditional on who made it and no provider obligation is counted for it), aiLiteracyConditional (Article 4 shown as a conditional note, not counted, where Article 2(12) is not applied only because of the provider's Article 6(3) assessment and the provider role is not answered); transparencyTriggers and hasTransparency are true when at least one Article 50 trigger was answered (an indication: Article 50 obligations are listed only where they apply)",
                "type": "object"
              },
              "terminal": {
                "type": "string"
              },
              "transparency_triggers": {
                "description": "Option ids answered at step R4 (Article 50 transparency triggers)",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["obligation_count", "obligations", "statuses", "terminal"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:45ce0979809e9d1492eef4deb62752e3cd09426682e5e8f24d236dbc0ab8627a"
        },
