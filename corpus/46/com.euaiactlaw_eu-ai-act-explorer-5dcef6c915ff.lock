        {
          "name": "get_deadlines",
          "description": "Show which EU AI Act application dates (Article 113) have been reached as of a given date: which phases apply and which do not yet apply. The Regulation itself entered into force on 1 August 2024; this tool reports dates of application, not entry into force.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "ISO date, e.g. \"2027-06-01\". Defaults to today.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "as_of": {
                "type": "string"
              },
              "phases": {
                "items": {
                  "properties": {
                    "applies": {
                      "description": "True when the date has been reached on as_of, i.e. the phase applies",
                      "type": "boolean"
