        {
          "name": "get_definition",
          "description": "Get the Article 3 definition of a term used in the EU AI Act.",
          "inputSchema": {
            "properties": {
              "term": {
                "description": "The defined term, e.g. \"provider\", \"high-risk AI system\"",
                "type": "string"
              }
            },
            "required": ["term"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "citation": {
                "description": "Clause-level citation: clause (e.g. \"Article 5(1)(ba)\"), the article's official heading, and the euaiactlaw.com paragraph permalink (#/article/N/<anchor>).",
                "properties": {
                  "anchor": {
                    "type": ["string", "null"]
                  },
                  "annex": {
                    "type": "string"
                  },
                  "article": {
                    "type": "string"
                  },
                  "clause": {
                    "type": "string"
                  },
                  "official_title": {
                    "type": "string"
                  },
                  "paragraph": {
                    "type": ["string", "null"]
                  },
                  "permalink": {
                    "type": "string"
                  },
                  "point": {
                    "type": ["string", "null"]
                  },
                  "recital": {
                    "type": "integer"
                  },
                  "subpoint": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["clause", "official_title", "permalink"],
                "type": "object"
              },
              "permalink": {
                "type": "string"
              },
              "reference": {
                "type": "string"
              },
              "term": {
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            },
