{
  "lockfileVersion": 2,
  "subjects": {
    "com.profullstack/w3bs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://w3bs.org/mcp"
