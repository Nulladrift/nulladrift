        "name": "braindrops",
        "title": "BrainDrops",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "BrainDrops is an AI art platform (since 2021) with 35 collections on Ethereum. Use search_braindrops to find work, get_piece for a piece (with its owner and permanent Arweave/IPFS copies), get_collection for background, list_collectors / get_collector for collector profiles, get_wallet for any address, get_holders and get_traits for a collection, get_stats for platform totals. Token IDs are projectId × 1,000,000 + edition number.",
      "tools": [
        {
          "name": "get_archive_info",
          "title": "How BrainDrops is preserved",
          "description": "Explain how BrainDrops art is permanently preserved (Ethereum, Arweave, IPFS pinning, offline archives) and how to verify a copy.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0895c2d85cedf08fda5495451bb305311a5cb0ef79c5b8833b582ce173e65261"
        },
        {
          "name": "get_collection",
          "title": "Get a BrainDrops collection",
          "description": "Get one BrainDrops collection: artist, size, release date, background, facts, token ID range, OpenSea link and Arweave archive manifests.",
          "inputSchema": {
            "properties": {
              "collection": {
                "description": "Collection name, slug or project ID",
                "type": "string"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6bab0e93d71cbfe991e12f610ec2163bb0bf76688df8d4e58ad7d16f2fd05671"
        },
        {
          "name": "get_collector",
          "title": "Get a BrainDrops collector profile",
          "description": "Get one collector profile (braindrops.art/collector/{slug}) with every BrainDrops piece it holds, counts per collection and set badges. Wallet addresses are included only if the collector shows them publicly.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Profile address, usually the 𝕏 handle, e.g. \"justintrimble\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e3fe5bfbba15e7bcdb2f79e04335e6cdc43893ecc0b46c15e7d721a760521e21"
        },
        {
          "name": "get_holders",
          "title": "Holders of a collection",
          "description": "Rank who holds a BrainDrops collection, grouping wallets that belong to one collector profile.",
          "inputSchema": {
            "properties": {
              "collection": {
                "description": "Collection name, slug or project ID",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["collection"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
