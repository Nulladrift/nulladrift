          },
          "digest": "sha256:d8b025af73cd869ef18830e5262ebc328c6a082e2beb09187301e19b7780b2cf"
        },
        {
          "name": "get_piece",
          "title": "Get a BrainDrops piece",
          "description": "Get one BrainDrops piece: name, artist, collection, traits, images, and every permanent copy (Ethereum token, Arweave metadata, Arweave HD image, IPFS original). Give token_id, or collection + number.",
          "inputSchema": {
            "properties": {
              "collection": {
                "description": "Collection name or slug, e.g. \"podGANs\"",
                "type": "string"
              },
              "number": {
                "description": "Edition number within the collection, e.g. 6",
                "minimum": 0,
                "type": "integer"
              },
              "token_id": {
                "description": "Token ID, e.g. 2000006 (projectId × 1,000,000 + number)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
