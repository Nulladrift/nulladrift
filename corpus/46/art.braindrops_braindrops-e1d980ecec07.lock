        {
          "name": "list_collectors",
          "title": "List BrainDrops collectors",
          "description": "The BrainDrops collector leaderboard: collector profiles with how many pieces and collections they hold, set badges (complete set, Day One) and per-collection counts. Filter by collection or name; sort by pieces, collections, newest or name.",
          "inputSchema": {
            "properties": {
              "collection": {
                "description": "Only collectors holding this collection (slug or name)",
                "type": "string"
              },
              "limit": {
                "default": 25,
                "maximum": 200,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "default": 0,
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Filter by name, 𝕏 handle or profile address",
                "type": "string"
              },
              "sort": {
                "default": "pieces",
                "enum": ["pieces", "collections", "newest", "name"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
