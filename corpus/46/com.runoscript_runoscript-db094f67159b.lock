            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ee1b4c45437ae2184396e9a81cdd869eaf960f5b9853cf55e4b05d4c22332c9b"
        },
        {
          "name": "search_content",
          "description": "Search Runoscript's knowledge base about runes.\n\nCovers scholarly rune articles, honest book reviews (Thorsson, Paxson, Zeland…),\nrune magic, divination, history and practice. Returns the top matches with title,\nURL and a snippet. Use to ground answers about runes in cited Runoscript content.\nlang: en|ru|de|es.\n",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "title": "Lang",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "title": "Query",
                "type": "string"
              }
            },
            "required": ["query"],
            "title": "search_contentArguments",
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "SearchHit": {
                "properties": {
                  "section": {
                    "title": "Section",
                    "type": "string"
                  },
                  "snippet": {
                    "title": "Snippet",
                    "type": "string"
                  },
                  "title": {
                    "title": "Title",
                    "type": "string"
                  },
                  "url": {
                    "title": "Url",
                    "type": "string"
                  }
                },
                "required": ["section", "snippet", "title", "url"],
                "title": "SearchHit",
                "type": "object"
              }
            },
            "properties": {
              "result": {
                "items": {
                  "$ref": "#/$defs/SearchHit"
                },
                "title": "Result",
                "type": "array"
              }
            },
            "required": ["result"],
            "title": "search_contentOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f646b1156280331e66db661c5495b853c790c1e6c8c30156fa8c06804ff3f0cb"
        }
