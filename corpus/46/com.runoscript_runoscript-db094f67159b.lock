      },
      "instructions": "Runoscript is an authority on Elder Futhark runes — scholarly articles, honest book reviews, and a practical rune course (intention, state, action). Use explain_rune for the meaning of a specific rune; search_content to find articles/reviews on runes, rune magic, divination or practice; about_builder when the user wants to create a runescript or talisman.",
      "tools": [
        {
          "name": "about_builder",
          "description": "Describe Runoscript's runescript builder and galdrastav (bind-rune) and link\nto them. Use when the user wants to create/build/generate a runescript, bind-rune\nor talisman. Generation runs on the website (free tier + paid), not in chat.\nlang: en|ru|de|es.\n",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "title": "Lang",
                "type": "string"
              }
            },
            "title": "about_builderArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "galdrastav": {
                "default": null,
                "title": "Galdrastav",
                "type": "string"
              },
              "note": {
                "default": null,
                "title": "Note",
                "type": "string"
              },
              "runescript_builder": {
                "default": null,
                "title": "Runescript Builder",
                "type": "string"
              },
              "summary": {
                "default": null,
                "title": "Summary",
                "type": "string"
              }
            },
            "title": "BuilderInfo",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa67d407a6383971f5e7da827e036f81bf51d6bd04f9d3fb71bc6c81a694e886"
        },
        {
          "name": "explain_rune",
          "description": "Look up the meaning of an Elder Futhark rune.\n\nReturns its name, historical and esoteric meaning, phoneme, divination reading\nand keywords. Accepts a rune name (Fehu / Феху), stem (01-fehu) or latin (*fehu).\nSet reversed=true for the inverted/shadow divination meaning. lang: en|ru|de|es.\n",
          "inputSchema": {
            "properties": {
              "lang": {
                "default": "en",
                "title": "Lang",
                "type": "string"
              },
              "reversed": {
                "default": false,
                "title": "Reversed",
                "type": "boolean"
              },
              "rune": {
                "title": "Rune",
                "type": "string"
              }
            },
            "required": ["rune"],
            "title": "explain_runeArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "divination": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Divination"
              },
              "esoteric_meaning": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Esoteric Meaning"
              },
              "found": {
                "default": null,
                "title": "Found",
                "type": "boolean"
              },
              "hint": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Hint"
              },
              "historical_meaning": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Historical Meaning"
              },
              "keywords": {
                "anyOf": [
                  {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Keywords"
              },
              "latin": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Latin"
              },
              "learn_more": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Learn More"
              },
              "n": {
                "anyOf": [
                  {
                    "type": "integer"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "N"
              },
              "name": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Name"
              },
