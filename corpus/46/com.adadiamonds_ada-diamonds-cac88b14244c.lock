      "serverInfo": {
        "name": "ada-diamonds",
        "title": "Ada Diamonds",
        "version": "1.0.0",
        "description": "Shop Ada Diamonds: search live lab grown diamond inventory, engagement ring settings, and fine jewelry, quote a complete ring, find a showroom, and request a jeweler consultation. No credential needed for the catalog.",
        "websiteUrl": "https://www.adadiamonds.com/",
        "icons": [
          {
            "src": "https://www.adadiamonds.com/logo512.png",
            "mimeType": "image/png",
            "sizes": ["512x512"]
          },
          {
            "src": "https://www.adadiamonds.com/logo192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Ada Diamonds is a lab grown diamond jeweler: custom engagement rings, loose lab diamonds, wedding bands, and fine jewelry, made to order in New York City.\n\nPricing model: an engagement ring is a SETTING plus a LOOSE DIAMOND, priced separately. To quote a complete ring, call search_engagement_rings and search_diamonds and add them together. Setting prices never include the center stone.\n\nRead the ada://catalog/* resources once for inventory shape (available shapes, carat ranges, price bands) before running searches; it will save you several calls. Diamond inventory changes continuously, so re-check before quoting a specific stone.\n\nAll prices are US dollars. Everything except request_consultation is public and needs no credential.",
      "tools": [
        {
          "name": "create_checkout_link",
          "title": "Create a hosted checkout link",
          "description": "Assemble a cart and get a Stripe-hosted checkout URL the customer opens to pay; no card data passes through the agent. Item ids come from the search tools (`diamond:<report>`, `setting:<slug>`, `jewelry:<slug>`); a complete ring is one setting plus one diamond. Needs the shipping address (prices tax and shipping into the link). Expires after 24 hours. No credential needed. Without a production credential this tool runs in the sandbox: the link is simulated and no Stripe session is created. Pass `env: \"production\"` when the customer actually wants to buy — that returns a live, payable link.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "buyer_email": {
                "description": "Buyer email for the receipt; Stripe collects it on the payment page when omitted",
                "type": "string"
              },
              "buyer_name": {
                "description": "Buyer full name",
                "type": "string"
              },
              "context": {
                "description": "Explain in 15-25 words, in third person, why this tool is called and how it supports the user's goal. For analytics only. You MUST describe only the abstract purpose of the tool call. NEVER include, repeat, paraphrase, or infer personal, sensitive, or identifying information from the user request or tool results, including names, emails, phone numbers, IPs, IDs, or credentials. You MUST generalize specific entities into roles such as \"a user\", \"the customer\", or \"an account\". Example: \"Retrieving a customer's recent orders to investigate a billing issue and help support determine the appropriate resolution.\"",
                "type": "string"
              },
              "conversation_id": {
                "description": "Pass the exact conversation_id from the server's previous response, unchanged. The server provides it on the first call — never invent one, and do not issue parallel tool calls until you have it. Keep passing the same conversation_id for the rest of the conversation, including after later user messages or on a different task; do not reset it when the user starts a new request.",
                "type": "string"
              },
              "env": {
                "description": "sandbox returns a simulated link and creates no Stripe session; production mints a live, payable Stripe Checkout link. Defaults to sandbox for anonymous callers and to the credential's environment otherwise. A sandbox credential is always sandbox.",
                "enum": ["production", "sandbox"],
                "type": "string"
              },
              "items": {
                "description": "Items to buy; a complete ring is one setting plus one diamond",
                "items": {
                  "properties": {
                    "id": {
                      "description": "Catalog item id: `diamond:<report number>`, `setting:<slug>`, or `jewelry:<slug>` (from search_diamonds / search_engagement_rings / search_jewelry results)",
                      "type": "string"
                    },
                    "quantity": {
                      "default": 1,
                      "description": "Quantity, 1-10 (diamonds are always 1)",
                      "maximum": 10,
                      "minimum": 1,
                      "type": "integer"
                    }
                  },
                  "required": ["id"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "llm_model": {
                "description": "The exact model identifier you (the assistant) are running as, taken from your system prompt or environment (e.g. \"claude-opus-4-8\", \"gpt-5.2\"). Used for analytics only. If you do not know your model identifier with certainty, pass \"unknown\" — never guess.",
                "type": "string"
              },
              "shipping_address": {
                "description": "Where the order ships; used to price tax and shipping into the link",
                "properties": {
                  "city": {
                    "description": "City",
                    "type": "string"
                  },
                  "country": {
                    "description": "Two-letter country code, e.g. US",
                    "type": "string"
                  },
                  "line_one": {
                    "description": "Street address, line 1",
                    "type": "string"
                  },
                  "line_two": {
                    "description": "Street address, line 2",
                    "type": "string"
                  },
                  "name": {
                    "description": "Recipient name",
                    "type": "string"
                  },
                  "phone_number": {
                    "description": "Recipient phone number",
                    "type": "string"
                  },
                  "postal_code": {
                    "description": "Postal code",
                    "type": "string"
                  },
                  "state": {
                    "description": "State or region code, e.g. NY",
                    "type": "string"
                  }
                },
                "required": ["city", "country", "line_one", "postal_code", "state"],
                "type": "object"
              }
            },
            "required": ["context", "items", "llm_model", "shipping_address"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "expires_at": {
                "description": "ISO timestamp the link stops working",
                "type": ["string", "null"]
              },
              "message": {
                "description": "Human-readable outcome, including the link when ready",
                "type": "string"
              },
              "problems": {
                "description": "What blocks the link when status is needs_input",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "sandbox": {
                "description": "True when the link is simulated (sandbox): nothing is payable and no Stripe session was created. False means the link is live and payable.",
                "type": "boolean"
              },
              "shipping_usd": {
                "description": "Shipping in US dollars (0 = free insured FedEx)",
                "type": "number"
              },
              "status": {
                "description": "ready when a payable link was created; needs_input lists what is missing",
                "enum": ["ready", "needs_input", "failed"],
                "type": "string"
              },
              "subtotal_usd": {
                "description": "Items subtotal in US dollars",
                "type": "number"
              },
              "tax_usd": {
                "description": "Sales tax in US dollars for the given address",
                "type": "number"
              },
              "total_usd": {
                "description": "Total the buyer pays in US dollars",
                "type": "number"
              },
              "url": {
                "description": "The Stripe-hosted checkout URL, when ready",
                "type": ["string", "null"]
              }
            },
            "required": ["expires_at", "message", "problems", "sandbox", "shipping_usd", "status", "subtotal_usd", "tax_usd", "total_usd", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b9bec523e752e21729cdf93be481e8567d8179e9257f4f6ebc1bac025a17464d"
