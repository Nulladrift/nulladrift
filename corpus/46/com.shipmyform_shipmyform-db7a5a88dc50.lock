            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "config": {
                "additionalProperties": {},
                "description": "Field values keyed by the config field names",
                "propertyNames": {
                  "type": "string"
                },
                "type": "object"
              },
              "formId": {
                "description": "Form id, e.g. frm_abc123",
                "type": "string"
              },
              "type": {
                "description": "Connector type from list_connector_types, e.g. 'slack'",
                "type": "string"
              }
            },
            "required": ["config", "formId", "type"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6d9d6206ab5a328059c40c7eddfc4080c5d40a5e2a5bb848018928b58f426de1"
        },
        {
          "name": "create_api_key",
