                "enum": ["full", "wiring", "readonly", "triage"],
                "type": "string"
              },
              "scopes": {
                "description": "Explicit scopes, instead of a preset. Ignored where it would exceed the calling key's own scopes.",
                "items": {
                  "enum": ["forms:read", "forms:write", "forms:delete", "submissions:read", "submissions:write", "submissions:delete", "account:manage"],
                  "type": "string"
