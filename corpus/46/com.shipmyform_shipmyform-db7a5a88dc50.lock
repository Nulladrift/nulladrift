{
  "lockfileVersion": 2,
  "subjects": {
    "com.shipmyform/shipmyform": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://shipmyform.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "shipmyform",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "ShipMyForm is an AI-native form backend: forms POST to https://shipmyform.com/f/<formId>; submissions are spam-filtered, stored, and routed to email, Slack, Sheets, Notion, webhooks and more. Everything the dashboard does is a tool here. No account yet? Ask the user for their email and call sign_up (never invent an address), keep the returned API key, reconnect with it, then verify_account with the emailed code. Then create_form → get_form_snippet to wire a site, add_connector to route submissions, publish_hosted_page for a standalone page. Free plans can do all of that; reading, classifying (label_submissions) and exporting submissions needs a paid plan, which start_upgrade sets up. Keys are scoped: get_account shows what yours may do, and a tool refusing with a scope error means you need a key the user creates — you cannot widen your own. When you only need to wire a form up, ask for preset 'wiring' at sign_up so you never hold access to the user's submissions. Docs: https://shipmyform.com/docs/mcp",
      "tools": [
        {
          "name": "add_connector",
          "title": "Add a connector",
          "description": "Route a form's submissions somewhere: email, webhook, Slack, Discord, Airtable, HubSpot, Telegram and more. Get the config fields from list_connector_types. OAuth connectors (Google Sheets, Notion) must be added in the dashboard.",
