{
  "lockfileVersion": 2,
  "subjects": {
    "com.bee-directory/newsletter-sponsorship": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://bee-directory.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "BeeDirectory",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "BeeDirectory is a newsletter sponsorship directory. Use search_newsletters to find newsletters for a brand's audience and budget, get_newsletter for details, and always give the user the listing URL. Numbers come with their source: say when a number is unverified or an estimate.",
      "tools": [
        {
          "name": "get_newsletter",
          "title": "Get a newsletter's sponsorship details",
          "description": "Get one BeeDirectory listing by id or name: audience and open rate with their source, sponsorship price per send, rate card, price per 1,000 subscribers, sponsor page, frequency and how to contact the creator.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "id": {
                "description": "BeeDirectory listing id (from search results)",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "name": {
                "description": "Newsletter name, e.g. 'Build What Matters'",
                "maxLength": 100,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a newsletter's sponsorship details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b96fc8634050c21ab1e9c0dbffc9df41cae3aba79d6a736d4073f1f569a02b37"
        },
        {
          "name": "list_niches",
          "title": "List newsletter niches",
          "description": "List BeeDirectory niches with how many newsletters each has (and how many have sourced numbers), plus the typical sponsorship price per 1,000 subscribers.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List newsletter niches"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e2fdccf144d1d9b2eaf65eb8a8c1791e7ba636b858126a74f7545b4f9b9bfdb8"
        },
        {
          "name": "search_newsletters",
          "title": "Search newsletters to sponsor",
          "description": "Search BeeDirectory for newsletters to sponsor. Returns newsletters whose numbers have a source (verified via the beehiiv API or a public page, or published by the owner), with subscribers, open rate, sponsorship price per send, price per 1,000 subscribers, rate card and the listing URL. Verified newsletters come first.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "description": "Number of results (default 10, max 20)",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "maxPricePerSend": {
                "description": "Budget per send in USD",
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "maxSubscribers": {
                "exclusiveMinimum": 0,
                "maximum": 9007199254740991,
                "type": "integer"
              },
              "minSubscribers": {
                "maximum": 9007199254740991,
                "minimum": 0,
                "type": "integer"
              },
              "niche": {
                "description": "Niche id (see list_niches), e.g. 'ai', 'marketing', 'personal-development'",
                "enum": ["ai", "saas", "marketing", "finance", "creator-economy", "business", "health", "news", "tech", "lifestyle", "personal-development", "other"],
                "type": "string"
              },
              "query": {
                "description": "Keywords matched against name and description, e.g. 'productivity' or 'devtools'",
                "maxLength": 100,
                "type": "string"
              },
              "verifiedOnly": {
                "description": "Only newsletters whose audience is verified",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search newsletters to sponsor"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca8fc6ad3d089caf79e80a05ddc742272badfc61e7cda8fd0ff0e8c2ad7e41ac"
        }
      ],
      "digest": "sha256:3cbd1c4c9adb98365457993ae6a268b6499d91783747dd8aa95708a891065f31"
    }
  }
}
