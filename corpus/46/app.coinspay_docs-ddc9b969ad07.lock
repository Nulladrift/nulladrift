      "instructions": "Documentation of the CoinsPay API: accept crypto payments with invoices and a hosted payment page, receiving addresses, payouts and signed webhooks. Start with search_docs for a question, or list_docs for the table of contents, then get_doc for a whole section. Sections are in English by default; pass lang \"ru\" for Russian. The quickstart section shows the first invoice, the test-mode section shows how to try everything without money.",
      "tools": [
        {
          "name": "get_doc",
          "title": "Read a CoinsPay docs section",
          "description": "One section of the CoinsPay API docs in Markdown: a guide, a group of methods with parameters, fields and errors, the webhook events or the objects.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "description": "Language of the docs: \"en\" (default) or \"ru\".",
                "enum": ["en", "ru"],
                "type": "string"
              },
              "section": {
                "description": "Section id from list_docs or search_docs.",
                "enum": ["quickstart", "sdk", "mcp", "api-key", "test-mode", "formats", "errors", "idempotency", "pagination", "limits", "webhooks", "states", "invoices", "addresses", "deposits", "payouts", "shop", "chains", "events", "objects"],
                "type": "string"
              }
            },
            "required": ["section"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
