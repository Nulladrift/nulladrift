      "serverInfo": {
        "name": "usedby",
        "title": "usedby",
        "version": "1.12.0",
        "description": "Which companies publicly use which AI and software tools, each line with its public source.",
        "websiteUrl": "https://www.usedby.ai/developers"
      },
      "capabilities": {
        "tools": {
