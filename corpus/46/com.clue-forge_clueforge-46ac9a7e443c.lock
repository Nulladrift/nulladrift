{
  "lockfileVersion": 2,
  "subjects": {
    "com.clue-forge/clueforge": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://clue-forge.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "clueforge",
        "title": "Clueforge",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Clueforge turns a solution word plus clue/answer pairs into a printable crossword (\"Kreuzworträtsel\") with a hidden solution word.\nWorkflow: ask the user for the occasion, the solution word (e.g. a name) and a few personal facts; write 8–14 clues yourself; call create_crossword; always show the returned link.\nEvery letter of the solution word must appear in a different answer. Creating, editing and previewing the puzzle online is free; the print-ready PDF + HTML download costs a one-time 4.99 EUR on the site.",
      "tools": [
        {
          "name": "create_crossword",
          "title": "Create crossword",
          "description": "Builds a crossword puzzle with a hidden solution word from clue/answer pairs you write, and returns a text preview plus a clue-forge.com link where the user can view, edit and download it as a print-ready PDF/HTML. Use it for personalised puzzles (birthday, wedding, couples, Valentine's Day, Christmas, classroom, team events) or general-knowledge puzzles. Rules: answers are single words, 2–15 letters, no spaces; each letter of solution_word must occur in a different answer (add clues if a letter is missing); the answer must not appear in its clue; do not use the solution word itself as an answer. Write clues in the language given by \"language\". Always show the returned link to the user.",
          "inputSchema": {
            "properties": {
              "clues": {
                "description": "Clue/answer pairs. Use at least as many pairs as the solution word has letters; 8–14 works best.",
                "items": {
                  "properties": {
                    "answer": {
                      "description": "Single-word answer. Accents and umlauts are converted automatically.",
                      "type": "string"
                    },
                    "clue": {
                      "description": "The question shown to the solver.",
                      "type": "string"
                    }
                  },
                  "required": ["answer", "clue"],
                  "type": "object"
                },
                "maxItems": 40,
                "minItems": 5,
                "type": "array"
              },
              "language": {
                "description": "Language of the clues and of the Clueforge interface. Defaults to \"en\".",
                "enum": ["en", "de", "fr", "es", "it", "pt", "nl", "pl"],
                "type": "string"
              },
              "occasion": {
                "description": "Selects the matching theme in the editor. Defaults to \"general\".",
                "enum": ["couple", "wedding", "birthday", "valentines", "christmas", "general"],
                "type": "string"
              },
              "solution_word": {
                "description": "Hidden word revealed by the highlighted letters, e.g. a name like \"ANNA\" or \"LOVE\". 2–20 letters.",
                "type": "string"
              }
            },
            "required": ["clues", "solution_word"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "grid": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "link": {
                "type": "string"
              },
              "placed_words": {
                "type": "integer"
              },
              "solution_word": {
                "type": "string"
              },
              "unplaced_words": {
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["grid", "link", "placed_words", "solution_word", "unplaced_words"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Create crossword"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bbf0475dd03f89c4caff23cc01815ae39569afbb04029b1206507e85c2dae8d6"
        }
      ],
      "digest": "sha256:e4483873f505307e5dffbc8d66a8686de4292f46cd6e4ff8ad87d4b0386bcb00"
    }
  }
}
