      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Crosodo is the launch OS for home food businesses. Use these tools to look up US cottage-food law by state or county, list purchasable products, create a Stripe Checkout link (never charges), or verify a Crosodo Certified credential. Cottage food laws change. This summary is generated from Crosodo's hand-maintained dataset — it is not legal advice. Verify with your county before selling.",
      "tools": [
        {
          "name": "get_my_dashboard",
          "title": "My Crosodo dashboard summary",
          "description": "The signed-in baker's dashboard at a glance: bakery place/level, access (Cottage Pro / Unlimited Pass), sales + expense totals with recent sales, saved recipe names, and permit workspaces with progress. Requires OAuth sign-in (crosodo:read). Start here to know whose dashboard you are acting on.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0e8e59ed4052d8ead928a588c583a30a94308f7c2c0cf5ca99041db0864bffd7"
        },
        {
          "name": "get_permit_checklist",
          "title": "My permit checklist",
          "description": "The signed-in baker's county permit checklist (active Permits workspace, or fips) with each step's requirement, official URL, and done flag. Requires OAuth sign-in (crosodo:read).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "fips": {
                "description": "5-digit county/city FIPS (default: active workspace)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:96af64321f376708752fe2c5a3881c994ef7a84a8a64eacf00c3311d75ac7b3f"
        },
        {
          "name": "list_products",
          "title": "List Crosodo products",
          "description": "The Menu Frame catalog: free state-law report ($0) plus agent checkout SKUs. The public site sells Cottage Pro ($15 one time, lifetime access) at /cottage-pro. Notes the reusable 50%-off promotion code. Does not create a checkout session.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:873488e2e85f2b2b094b65398d673a7016feabbb981384b52f0395e76f1c6d95"
        },
        {
          "name": "log_expense",
          "title": "Log a dashboard expense",
          "description": "Add one expense to the signed-in baker's Financials tab. Cottage Pro from the first entry (same rule as the dashboard). Amounts are the baker's own numbers. Requires OAuth sign-in (crosodo:write).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amountUsd": {
                "description": "Expense amount in USD, e.g. 18.25",
                "type": "number"
              },
              "category": {
                "description": "ingredients | packaging | fees_permits | equipment | market_fees | transport | utilities | marketing | other",
                "type": "string"
              },
              "note": {
                "description": "Optional short note",
                "type": "string"
              },
              "spentOn": {
                "description": "Expense date, YYYY-MM-DD",
                "type": "string"
              },
              "vendor": {
                "description": "Optional vendor name",
                "type": "string"
              }
            },
            "required": ["amountUsd", "spentOn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:96024261f1d18ebe26b4e2c2e08a208b41973bd68657dd5823404046d880c779"
        },
        {
          "name": "log_sale",
          "title": "Log a dashboard sale",
          "description": "Add one sale to the signed-in baker's sales log (same record the Financials tab creates). Free for every signed-in user. Requires OAuth sign-in (crosodo:write).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "amountUsd": {
                "description": "Sale amount in USD, e.g. 42.50",
                "type": "number"
              },
              "channel": {
                "description": "Where the sale happened (default other)",
                "enum": ["market", "pickup", "delivery", "online", "event", "other"],
                "type": "string"
              },
              "note": {
                "description": "Optional short note (max 140 chars)",
                "type": "string"
              },
              "soldOn": {
                "description": "Sale date, YYYY-MM-DD",
                "type": "string"
              }
            },
            "required": ["amountUsd", "soldOn"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:ede33a8654ca66e078f4a43d0362c2956fcfecad03fd13c41faa9ef7273d164f"
        },
        {
          "name": "lookup_county",
          "title": "Lookup county cottage-food requirements",
          "description": "County-level cottage-food requirements for a US state + county from Crosodo's structured county dataset (contacts, verification status, local URLs, state summaries). Unknown states or counties return an error — never invented data. Cottage food laws change. This summary is generated from Crosodo's hand-maintained dataset — it is not legal advice. Verify with your county before selling.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "County name or slug (lancaster or Lancaster County)",
                "type": "string"
              },
              "state": {
                "description": "2-letter USPS abbrev (PA) or state slug (pennsylvania)",
                "type": "string"
              }
            },
            "required": ["county", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a21a10a66dc73df3e0a67a8ab5be43533d73be21afd366eb97e8da6301f620a0"
        },
        {
          "name": "lookup_state_law",
          "title": "Lookup state cottage-food law",
          "description": "Cottage-food / home-bakery requirements for a US state from Crosodo's hand-maintained dataset: sales cap, registration, allowed products, statute, and agency links. Accepts a 2-letter abbrev (VA) or slug (virginia). Unknown states return an error — never invented data. Cottage food laws change. This summary is generated from Crosodo's hand-maintained dataset — it is not legal advice. Verify with your county before selling.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "state": {
                "description": "2-letter USPS abbrev (VA) or state slug (virginia)",
                "type": "string"
              }
            },
            "required": ["state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:41d30e64597f0d2c8d7297c7d8c876b4556d22f3da48e146b5c8fd68577c84cd"
        },
        {
          "name": "save_recipe",
          "title": "Save a dashboard recipe",
          "description": "Save (or update, with id) a recipe in the signed-in baker's Foods Recipes library. Ingredient costs are the baker's own package costs — never invent prices. First saved recipe is free; the library beyond that is Cottage Pro (same rule as the dashboard). Requires OAuth sign-in (crosodo:write).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "allergens": {
                "description": "Allergen names as the baker states them",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "batchYield": {
                "description": "Units per batch, e.g. 12",
                "type": "number"
              },
              "food": {
                "description": "can-i-sell food slug, e.g. cookies",
                "type": "string"
              },
              "id": {
                "description": "Existing recipe id to update (from get_my_dashboard or a previous save)",
                "type": "string"
              },
              "ingredients": {
                "description": "Ingredients with the baker's entered package costs",
                "items": {
                  "properties": {
                    "name": {
                      "type": "string"
                    },
                    "packageCost": {
                      "description": "USD paid for the package",
                      "type": "number"
                    },
                    "packageQty": {
                      "description": "Quantity in the package",
                      "type": "number"
                    },
                    "unit": {
                      "type": "string"
                    },
                    "usedQty": {
                      "description": "Quantity used per batch, same unit",
                      "type": "number"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "name": {
                "description": "Recipe name, e.g. Sourdough sandwich loaf",
                "type": "string"
              },
              "notes": {
                "type": "string"
              },
              "yieldUnit": {
                "description": "e.g. servings, loaves",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:eb4d933489febb3324592995c2d01a06ee11ba3deaa00fb18093fc28882456a8"
        },
        {
          "name": "set_permit_step",
          "title": "Mark a permit step done/undone",
          "description": "Check or uncheck one step on the signed-in baker's permit checklist (same check mark the Permits tab toggles). Get step ids from get_permit_checklist. Requires a Permit Guide purchase or full-library access, same as the dashboard. OAuth sign-in (crosodo:write).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "done": {
                "description": "true = done, false = not done",
                "type": "boolean"
              },
              "fips": {
                "description": "5-digit county/city FIPS (default: active workspace)",
                "type": "string"
              },
              "stepId": {
                "description": "Step id from get_permit_checklist",
                "type": "string"
              }
            },
            "required": ["done", "stepId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:11d2d29665fac2e3ac61076d0337a20e74f8b7fffe60f298b1d77e06f2c60744"
        },
        {
          "name": "start_checkout",
          "title": "Start Stripe Checkout",
          "description": "Creates a Stripe Checkout session server-side and returns { checkoutUrl, product, sessionId }. Hand the URL to the user; payment completes on Stripe's hosted page. This never charges. product: permit_guide | certified_exam | unlimited_pass. permit_guide and unlimited_pass are county-specific (state + county required). Pass idempotencyKey so agent retries cannot double-create sessions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "Required for permit_guide and unlimited_pass (name or slug)",
                "type": "string"
              },
              "email": {
                "description": "Buyer email, prefilled at Stripe Checkout",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Client-generated key; retries with the same key reuse the Stripe session",
                "type": "string"
              },
              "product": {
                "description": "Purchasable product id from list_products",
                "enum": ["permit_guide", "certified_exam", "unlimited_pass"],
                "type": "string"
              },
              "state": {
                "description": "Required for permit_guide and unlimited_pass (2-letter abbrev or slug)",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e1804e651708af4ef57ed2ffd47dde766123589ce592e71667c3ca7d14cb95c5"
        },
        {
          "name": "verify_certification",
          "title": "Verify Crosodo Certified credential",
          "description": "Public lookup of a Crosodo Certified credential (format CC-{ST}-{YY}-{XXXX}, for example CC-VA-26-1042; that ID only illustrates the format and is not a real credential, so looking it up returns Credential not found). Returns public fields only (holder display name, dates, status). Unknown, expired, or revoked credentials return an error. No auth.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "certId": {
                "description": "Credential ID in the format CC-{ST}-{YY}-{XXXX} (e.g. CC-VA-26-1042, format example only, not a real credential)",
                "type": "string"
              }
            },
            "required": ["certId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0193421757f835f403d97b69aaee93074c6734aa36b294f24605e4a462e9e958"
        }
      ],
      "digest": "sha256:41844f79cf2799d244dc230beb7b6cff90619d11b2b5645dbec9484b91776efd"
    }
  }
