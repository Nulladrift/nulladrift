      },
      "instructions": "Crosodo is the launch OS and municipal permit connector for US home food businesses. Public tools (no sign-in): look up US cottage-food law by state or county, inspect any county's 4-Box municipal permit checklist (Food/Health, Zoning, Business License, Sales Tax), check food legality across 51 jurisdictions, preview state-compliant labels with Big-9 allergen detection, list purchasable products, create a Stripe Checkout link (never charges), or verify a Crosodo Certified credential. Account tools (OAuth sign-in; scope crosodo:read for reads, crosodo:write for writes): dashboard summary, setup bakery business & ladder rung, save labels, claim a /p/handle storefront, sales/expenses, recipes, and permit checklist. Cottage food laws change. This summary is generated from Crosodo's hand-maintained dataset — it is not legal advice. Verify with your county before selling.",
      "tools": [
        {
          "name": "check_food_legality",
          "title": "Check if a food can be sold from home in a US state",
          "description": "Checks Crosodo's 43-food × 51-jurisdiction 'Can I Sell This?' dataset for a specific food and US state: returns verdict (yes | conditional | no), state statute citation, food-safety rationale (pH / water activity), and whether Rung 3 (Inspected Kitchen) is required. No auth required. Cottage food laws change. This summary is generated from Crosodo's hand-maintained dataset — it is not legal advice. Verify with your county before selling.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "food": {
                "description": "Food name or slug, e.g. 'sourdough-bread', 'cookies', 'cream cheese frosting', 'cheesecake'",
                "type": "string"
              },
              "state": {
                "description": "2-letter USPS state abbrev (e.g. VA, TX, CA) or state name/slug",
                "type": "string"
              }
            },
            "required": ["food", "state"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:f92912a45b02f7db93332d2a9576935a13c36b10e158665bd1c0357aa3f43116"
        },
        {
          "name": "configure_storefront_profile",
          "title": "Claim or update public baker storefront (/p/handle)",
          "description": "Claims or updates the signed-in baker's public Crosodo storefront page at crosodo.com/p/{handle} (minimum 10 characters). Preserves the live approved snapshot while edits await moderation so the baker's URL never goes offline. Requires OAuth sign-in (crosodo:write).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "bio": {
                "description": "About your bakery, bake days, and pickup/market schedule",
                "type": "string"
              },
              "businessName": {
                "description": "Display bakery name",
                "type": "string"
              },
              "handle": {
                "description": "Public URL handle (10-40 lowercase letters, numbers, or hyphens), e.g. 'hearth-and-crumb'",
                "type": "string"
              },
              "headline": {
                "description": "Short tagline, e.g. 'Naturally leavened sourdough in Fairfax, VA'",
                "type": "string"
              },
              "socialLinks": {
                "description": "Social accounts included in the profile review payload (published only after approval)",
                "items": {
                  "properties": {
                    "platform": {
                      "description": "instagram | facebook | tiktok | youtube | pinterest | x | etsy | website | other",
                      "type": "string"
                    },
                    "value": {
                      "description": "Handle or URL",
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "website": {
                "description": "Optional order form or website URL",
                "type": "string"
              }
            },
            "required": ["handle"],
            "type": "object"
          },
