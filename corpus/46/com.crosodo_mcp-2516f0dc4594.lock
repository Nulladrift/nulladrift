        {
          "name": "start_checkout",
          "title": "Start Stripe Checkout",
          "description": "Creates a Stripe Checkout session server-side and returns { checkoutUrl, product, sessionId }. Hand the URL to the user; payment completes on Stripe's hosted page. This never charges. product: cottage_pro | county_packet | label_calc_pack | certified_exam. county_packet is county-specific (state + county required); label_calc_pack needs state. permit_guide and unlimited_pass are retired — checkout returns an error pointing at Cottage Pro / the $9 kit / the $9 pack. Pass idempotencyKey so agent retries cannot double-create sessions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "county": {
                "description": "Required for county_packet (name or slug)",
                "type": "string"
              },
              "email": {
                "description": "Buyer email, prefilled at Stripe Checkout",
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Client-generated key; retries with the same key reuse the Stripe session",
                "type": "string"
              },
              "product": {
                "description": "Purchasable product id from list_products. permit_guide and unlimited_pass are retired and cannot be checked out.",
                "enum": ["cottage_pro", "county_packet", "label_calc_pack", "certified_exam", "permit_guide", "unlimited_pass"],
                "type": "string"
              },
              "state": {
                "description": "Required for county_packet (2-letter abbrev or slug)",
                "type": "string"
              }
            },
            "required": ["product"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
