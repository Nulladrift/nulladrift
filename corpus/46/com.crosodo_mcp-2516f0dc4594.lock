        {
          "name": "generate_compliant_label",
          "title": "Generate state-compliant cottage food label & Canva copy",
          "description": "Sorts recipe ingredients by descending weight (when gram/oz/lb weights are supplied), detects FDA Big-9 allergens, attaches the verbatim state cottage-food disclaimer from Crosodo's state labeling matrix, and returns print/Canva-ready label copy. Works anonymously for previewing; pass save: true when signed in (crosodo:write) to save the draft to the baker's dashboard Labels library (first saved label free; more require Cottage Pro). Cottage food laws change. This summary is generated from Crosodo's hand-maintained dataset — it is not legal advice. Verify with your county before selling.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "address": {
                "description": "Street address or state registration ID printed on the label",
                "type": "string"
              },
              "allergens": {
                "description": "Optional explicit allergens to merge with auto-detected FDA Big-9 allergens",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "businessName": {
                "description": "Bakery or producer name printed on the label",
                "type": "string"
              },
              "canvaTemplateUrl": {
                "description": "Optional Canva design URL to link to the saved draft",
                "type": "string"
              },
              "fips": {
                "description": "Optional 5-digit county FIPS for county-level label notes",
                "type": "string"
              },
              "food": {
                "description": "Optional can-i-sell food slug",
                "type": "string"
              },
              "ingredients": {
                "description": "Comma-separated ingredients (include weights like '500g bread flour, 375g water, 10g salt' to auto-sort descending)",
                "type": "string"
              },
              "netWeight": {
                "description": "Package net weight, e.g. '24 oz (680 g)'",
                "type": "string"
              },
              "productName": {
                "description": "Product name on the package, e.g. Country Sourdough Loaf",
                "type": "string"
              },
              "save": {
                "description": "Set true to save this label draft to the signed-in baker's dashboard",
                "type": "boolean"
              },
              "state": {
                "description": "2-letter USPS state abbrev (e.g. VA, TX, CA) or state name",
                "type": "string"
              }
            },
            "required": ["ingredients", "productName", "state"],
            "type": "object"
          },
