      "serverInfo": {
        "name": "paradise-closets",
        "title": "Paradise Closets",
        "version": "1.0.0",
        "websiteUrl": "https://pclosets.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Paradise Closets designs custom closets (walk-in and reach-in) built to the customer's own measurements and ships them anywhere in the US, ready to assemble (DIY install; Paradise Closets does not install). Use closet_price_estimate for a ballpark price (the same formula as pclosets.com/quote), how_to_measure before asking for dimensions, and request_quote only when the customer wants to be contacted and has agreed to share their name, ZIP and an email or phone.",
      "tools": [
        {
          "name": "business_info",
          "title": "About Paradise Closets",
          "description": "Who Paradise Closets is: custom closets built to the customer's measurements, shipped anywhere in the US, DIY install (no installation service), and how to contact them.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f550783d8dd2c3d571e278680da4570b4a56bcad51ff83edc55e58d97682d6e2"
        },
        {
          "name": "closet_price_estimate",
          "title": "Custom closet price estimate",
          "description": "Ballpark price range for a custom reach-in or walk-in closet, using the same formula as the estimator on pclosets.com/quote. Give the ship-to zip_code to add a live freight estimate (LTL carrier quote, residential delivery with liftgate) and a total; otherwise shipping is quoted with the order. Final price is confirmed after a designer reviews the measurements.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "closet_type": {
                "description": "Reach-in (one wall) or walk-in (up to three walls)",
                "enum": ["reach-in", "walk-in"],
                "type": "string"
              },
              "depth_inches": {
                "default": 14,
                "description": "Unit depth in inches: 14 (standard), 16 or 22",
                "enum": [14, 16, 22],
                "type": "integer"
              },
              "drawers": {
                "default": 0,
                "description": "Number of drawers",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "finish": {
                "default": "white",
                "enum": ["white", "wood_grain"],
                "type": "string"
              },
              "package": {
                "default": "premium",
                "description": "Premium: dovetail drawers with soft-close, plus crown and base molding. Standard: standard drawers, no crown or base molding.",
                "enum": ["premium", "standard"],
                "type": "string"
              },
              "special_color": {
                "default": false,
                "description": "Special color (specialty matte colors, priced from the supplier's specialty level)",
                "type": "boolean"
              },
              "wall_a_inches": {
                "description": "Walk-in: wall A width in inches",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "wall_b_inches": {
                "description": "Walk-in: wall B width in inches",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "wall_c_inches": {
                "description": "Walk-in: wall C width in inches",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "width_inches": {
                "description": "Reach-in: back wall width in inches",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "zip_code": {
                "description": "Optional ship-to US ZIP code (e.g. 08701) for a live freight estimate",
                "type": "string"
              }
            },
            "required": ["closet_type"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3724fd2159b1aa7e40bb2280d02c1b53be7022afbcdefc2e8af3e18c506ae74c"
        },
        {
          "name": "how_to_measure",
          "title": "How to measure a closet",
          "description": "Step-by-step guidance for measuring a closet before getting an estimate or requesting a quote.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6c0284431f300b114e725fc1e0152af55e02c42e27db97c918ec2db790835ee2"
        },
        {
          "name": "request_quote",
          "title": "Request a free closet quote",
          "description": "Send the customer's closet details to Paradise Closets so a designer contacts them with a quote (same as the form on pclosets.com/quote). Only call this when the customer asked to be contacted and agreed to share their details. Requires name, US ZIP, an email or phone, closet type and dimensions.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ceiling_height_inches": {
                "description": "Ceiling height in inches (default 96)",
                "maximum": 180,
                "minimum": 48,
                "type": "number"
              },
              "closet_type": {
                "description": "Reach-in (one wall) or walk-in (up to three walls)",
                "enum": ["reach-in", "walk-in"],
                "type": "string"
              },
              "depth_inches": {
                "default": 14,
                "description": "Unit depth in inches: 14 (standard), 16 or 22",
                "enum": [14, 16, 22],
                "type": "integer"
              },
              "drawers": {
                "default": 0,
                "description": "Number of drawers",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "email": {
                "description": "Customer email (email or phone is required)",
                "format": "email",
                "type": "string"
              },
              "finish": {
                "default": "white",
                "enum": ["white", "wood_grain"],
                "type": "string"
              },
              "name": {
                "description": "Customer's full name",
                "maxLength": 100,
                "minLength": 2,
                "type": "string"
              },
              "notes": {
                "description": "Anything else: doors, windows, style, timing",
                "maxLength": 1000,
                "type": "string"
              },
              "package": {
                "default": "premium",
                "description": "Premium: dovetail drawers with soft-close, plus crown and base molding. Standard: standard drawers, no crown or base molding.",
                "enum": ["premium", "standard"],
                "type": "string"
              },
              "phone": {
                "description": "Customer phone, 10+ digits (email or phone is required)",
                "type": "string"
              },
              "special_color": {
                "default": false,
                "description": "Special color (specialty matte colors, priced from the supplier's specialty level)",
                "type": "boolean"
              },
              "wall_a_inches": {
                "description": "Walk-in: wall A width in inches",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "wall_b_inches": {
                "description": "Walk-in: wall B width in inches",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "wall_c_inches": {
                "description": "Walk-in: wall C width in inches",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "width_inches": {
                "description": "Reach-in: back wall width in inches",
                "maximum": 600,
                "minimum": 0,
                "type": "number"
              },
              "zip_code": {
                "description": "US ZIP code where the closet ships",
                "pattern": "^\\d{5}(-\\d{4})?$",
                "type": "string"
              }
            },
            "required": ["closet_type", "name", "zip_code"],
            "type": "object"
          },
