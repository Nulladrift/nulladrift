{
  "lockfileVersion": 2,
  "subjects": {
    "care.fysio/discovery": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://fysio.care/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "fysio-care",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Read-only discovery of Swedish MSK clinics on fysio.care: search clinics, list their bookable services, check free appointment times. Booking itself is completed by the patient via the bookingUrl links — this server cannot create appointments.",
      "tools": [
        {
          "name": "get_available_slots",
          "title": "Get available slots",
          "description": "Free appointment slots for one bookable service variant at one clinic, up to 14 days ahead. Each slot carries a FHIR Slot resource and a bookingUrl where the PATIENT completes the booking themselves on the web (this server never books).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clinic_slug": {
                "description": "The clinic slug from search_clinics (the URL segment, e.g. \"mickes-klinik-lund\").",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "days": {
                "default": 14,
                "description": "Window length in days.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              },
              "from_date": {
                "description": "Window start (YYYY-MM-DD, clinic runs Europe/Stockholm). Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "service_variant_id": {
                "description": "A bookable service variant id from list_clinic_services.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["clinic_slug", "service_variant_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get available slots"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e0e4daf1d2c8a164841360a528218f61de21c85ff88680dd9e73de441324f441"
        },
        {
          "name": "get_next_available_date",
          "title": "Get next available date",
          "description": "Earliest free slot for a service variant, scanning up to 90 days ahead. Use when get_available_slots comes back empty.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clinic_slug": {
                "description": "The clinic slug from search_clinics (the URL segment, e.g. \"mickes-klinik-lund\").",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              },
              "service_variant_id": {
                "description": "A bookable service variant id from list_clinic_services.",
                "format": "uuid",
                "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$",
                "type": "string"
              }
            },
            "required": ["clinic_slug", "service_variant_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get next available date"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8aa300915b4d870fc1f0a49a42a34b70cfd8f2806d75d4c0ec95cfd45496023"
        },
        {
          "name": "list_clinic_services",
          "title": "List clinic services",
          "description": "List the bookable services of one clinic, with duration, price (SEK) and a FHIR HealthcareService per bookable variant. The variant id is what get_available_slots takes.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "clinic_slug": {
                "description": "The clinic slug from search_clinics (the URL segment, e.g. \"mickes-klinik-lund\").",
                "maxLength": 100,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["clinic_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List clinic services"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97e20c3bb5368ef306b447064ab1aa8f7f77c14848cc360532b37833ae374189"
        },
        {
          "name": "search_clinics",
          "title": "Search clinics",
          "description": "Search the public directory of Swedish MSK clinics (fysioterapi, naprapati, kiropraktik m.fl.) on fysio.care. Returns published clinics with FHIR Organization resources. Use list_clinic_services next to see what a clinic offers.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "city": {
                "description": "Exact city name, e.g. \"Lund\".",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "friskvard": {
                "description": "Only clinics where friskvårdsbidrag can actually be spent.",
                "type": "boolean"
              },
              "limit": {
                "default": 10,
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "modality": {
                "description": "Only clinics offering this treatment modality.",
                "enum": ["fysioterapeut", "naprapat", "kiropraktor", "osteopat", "manuell_terapeut", "idrottsterapeut"],
                "type": "string"
              },
              "query": {
                "description": "Case-insensitive clinic-name substring.",
                "maxLength": 50,
                "minLength": 2,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search clinics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:66a45b98fe16eb9a09e0f27b8cfe344ba3c7798f688d6c98994745148f9cb65a"
        }
      ],
      "digest": "sha256:25ba626fff92f565d8115a7cec9d5d0d2f8b529dce79698b2703e66603cc5e42"
    }
  }
}
