        {
          "name": "job_trends",
          "title": "Job posting trends over time",
          "description": "How a slice of the market has changed OVER TIME — use this for \"is X growing/shrinking\",\n    \"hiring trend\", \"more or fewer than last year\". aggregate_jobs describes a slice as it stands\n    today; this one shows its history.\n\n    Takes the same filters as aggregate_jobs, plus ``bucket`` (\"day\"/\"week\"/\"month\"),\n    ``since_days`` (at most 730), and ``measure``. Returns a ``series``, oldest first, each period carrying\n    ``postings`` (roles dated to it, duplicates collapsed) and ``still_open`` (how many are live\n    now — the rest have since closed).\n\n    ``measure=\"posted\"`` (default) uses the employer's stated date: the market signal, but\n    nullable, so check ``without_date`` — it counts roles the clock cannot place, and when it\n    rivals the series totals the trend describes a minority of the slice.\n\n    ``measure=\"first_seen\"`` uses when we first crawled the row. Complete, but it measures OUR\n    coverage: a backfill or a newly onboarded board appears as a spike of hundreds of thousands\n    that is not a hiring event. Use it to audit ingestion, not to infer demand.\n\n    Either way, periods before ``earliest`` are empty because we hold no data that far back, not\n    because hiring stopped — never report that as a decline.\n\n    CRITICAL for \"posted\": only compare periods at or after ``crawl_started``. Earlier ones are\n    left-censored — the first crawl could only capture roles still live when it ran, so anything\n    posted before that and already closed was never seen. Those buckets undercount severely (their\n    ``still_open`` sits near 100%, the giveaway), and reading across the boundary turns the\n    crawler's start date into a fake hiring boom.\n    ",
