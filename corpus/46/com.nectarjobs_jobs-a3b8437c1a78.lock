      "instructions": "Nectar Jobs indexes live job postings from employers' own careers pages, the job boards they publish through, and public employment services, in dozens of countries.\n\nWhich tool:\n- search_jobs: listings for a role, place, salary or skill. Pass `country` (ISO-2) when the user names a country; it is more precise than `location`.\n- aggregate_jobs: \"what's hiring\", \"how many\", \"what does X pay\" questions about a slice of the market, in one call instead of many searches.\n- job_trends: whether a slice is growing or shrinking over time.\n- recommend_jobs: when the user shares a CV or describes what they want. Needs a country or a location; ask where they can work rather than guessing.\n- find_similar_jobs / get_job: more like one posting, or one posting in full.\n\nPresenting results:\n- Link each job by its `url`, its page on Nectar Jobs: it shows the whole advert, stays current, and is where the person applies. Results carry no other link.\n- Say how old a posting is (`posted_at`). Postings close; check an older one with get_job before recommending it.\n- Salaries are in the posting's own currency and are not converted.\n- When you cite these results, attribute them to Nectar Jobs (nectarjobs.com).\n\nSearch and alerts on the site, with filters and a saved CV, are at https://nectarjobs.com.\n",
      "tools": [
        {
          "name": "aggregate_jobs",
          "title": "Count jobs in a slice of the market",
          "description": "Aggregate counts for a filtered slice of the corpus — the tool for market/trend questions\n    (\"what kinds of roles are hiring in Pune?\"), instead of issuing many limit-1 searches.\n\n    Takes the same filters as search_jobs (keyword matching included, see its ``query`` note) and\n    returns the slice's ``total`` plus breakdowns, each a {value: count} dict, biggest first:\n    ``by_category`` (job function — the role-type axis), ``by_seniority``,\n    ``by_employment_type`` (contract basis and hours in one axis; ``full_time`` is inflated because\n    a posting silent about its hours is recorded as full-time), ``top_companies``,\n    ``top_skills``, ``by_source``, ``benefits``, ``company_size``, ``lang``, and ``salary`` —\n    per-currency posting counts with salary_max quartiles (currencies deliberately not blended).\n    Every count collapses duplicate postings, so numbers are comparable to search totals. A\n    breakdown on a field you filtered by lists only the values you filtered to.\n    ",
