        {
          "name": "recommend_jobs",
          "title": "Match jobs to a CV",
          "description": "Rank jobs by how well they match a résumé or free-text description of what\n    the candidate wants. Returns the best-matching jobs first.\n\n    ``country`` (ISO-2, e.g. GB) or ``location`` (a city or region) is REQUIRED — ask the seeker\n    where they can work rather than guessing. Semantic ranking over every country returns the\n    nearest postings on earth, most of which the person cannot take.\n\n    ``resume_text``: only about the first 400 words shape the ranking; anything after them is not\n    read. For a longer CV, send what defines the person's next role first: the role they want,\n    their headline, their recent roles and their key skills, not the whole document in order.\n\n    Ranking is purely semantic; the filters are hard. ``seniority`` (intern, junior, senior,\n    staff, principal, manager, director) filters to exactly that tag — many postings carry none,\n    so only pass it when the seeker insists.",
