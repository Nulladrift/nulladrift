        {
          "name": "search_jobs",
          "title": "Search jobs",
          "description": "Search live job postings: use when the user asks what jobs are open for a role, a place,\n    a salary or a skill. Each job carries ``url``, its page on Nectar Jobs, where the person applies.\n\n    Args:\n        query: keyword or natural-language query. Words that name an occupation (\"manager\",\n            \"software engineer\") are matched against the TITLE; other words match the whole\n            document (title, company, description), so a generic word's ``total`` overcounts —\n            to compare role-type volumes, use aggregate_jobs instead.\n        location: city or country substring over the posting's location text (matches broadly:\n            \"New York\" includes the whole state). For a whole country, prefer ``country``.\n        remote: filter to remote (true) or on-site (false) roles.\n        salary_min: only roles whose salary range reaches this amount (raw number — currencies\n            are not converted, so only meaningful combined with a single-currency market).\n        company: company name substring.\n        source: restrict to one source/board; get_stats lists the live sources and their sizes.\n        seniority: one of intern, junior, senior, staff, principal, manager, director.\n        category: job function from the site taxonomy (Engineering, \"Data & ML\", Product, Design,\n            Sales, Marketing, \"Customer Support\", Operations, \"Finance & Accounting\",\n            \"People & HR\", Legal, \"IT & Security\", …) — aggregate_jobs reports the live values.\n        country: 2-letter ISO code (\"US\", \"IN\") — matches the derived country, more precise than\n            a ``location`` substring.\n        employment_type: contract or hours — permanent, fixed_term, contract, freelance, temporary,\n            casual, seasonal, internship, apprenticeship, graduate, working_student, volunteer,\n            self_employed, full_time, part_time, job_share, shift, term_time. Contract basis and\n            schedule are one filter; a posting carries one of each. Note that a posting which says\n            nothing about its hours is recorded as ``full_time``, so that value is the least\n            informative of the set.\n        posted_since_days: only jobs posted within this many days.\n        mode: \"hybrid\" (default, best), \"semantic\" (meaning-based), or \"keyword\" (exact).\n        sort: \"relevance\" (default), \"date\" (newest first), or \"salary\" (highest first).\n        page: 1-based page number, for paging past ``limit`` results.\n        limit: max results per page (1-100).\n    Returns a dict with ``total``, a ``jobs`` list (duplicates collapsed) and ``attribution``;\n    when nothing matched, a ``hint`` names the filter most worth loosening.\n    ",
