{
  "lockfileVersion": 2,
  "subjects": {
    "com.opointo/opointo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opointo.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "opointo",
        "title": "OpointO: the AI-powered, cross-platform app designer; your coding agent builds the native Expo app",
        "version": "0.4.0",
        "icons": [
          {
            "src": "https://opointo.com/icons/icon-48.png",
            "mimeType": "image/png",
            "sizes": ["48x48"]
          },
          {
            "src": "https://opointo.com/icons/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {}
        },
        "resources": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "opointo designs a mobile app with the person and turns it into a React Native / Expo project: Liquid Glass on iOS 26, Material 3 Expressive on Android. Use these tools when someone wants to build an iOS or Android app or add screens or components. To start, call propose_app with {\"idea\":\"<what the app is for>\"}: it returns a link where the person sees and changes the app, or the kinds to ask about. For one component in code, call find_component, then get_component. Both are free, no account. With a subscription: emit_app, add_screen, install_component, update_components, verify_app.",
      "tools": [
        {
          "name": "add_screen",
          "title": "Add a screen to an app",
          "description": "Needs a subscription. Adds one screen designed in the Architect to a React Native / Expo app. With the project's .opointo/files.json it returns the screen file, the route that mounts it and the one line to register it, and never rewrites existing files. Without it, a self-contained screen file for any Expo app.",
          "inputSchema": {
            "properties": {
              "appId": {
                "description": "the share code from \"Send app to agent\"",
                "type": "string"
              },
              "componentName": {
                "description": "only to add a second copy of a screen; omit for the export's name",
                "type": "string"
              },
              "manifest": {
                "description": "the parsed .opointo/files.json",
                "type": "object"
              },
              "screen": {
                "description": "the new screen's name in that design",
                "type": "string"
              },
              "tab": {
                "description": "nest it in this tab's stack; omit to place it where the design does",
                "type": "string"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Add a screen to an app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:81ab26a90a2ba417a0e0e7265404d593b737bc2a1993464275c70dae2e3b3b9c"
        },
        {
          "name": "check_snippet",
          "title": "Check code for blank-render bugs",
          "description": "Scans React Native TSX that uses these components for the mistakes that render a blank screen with no error: animated opacity on glass, the flex: 1 collapse, a clipped lens, a conditionally mounted surface. A read-only text scan, not a guarantee; verify_app checks a whole emitted project.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "the TSX to check",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check code for blank-render bugs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1d9fb41becbb0df82a9ae101a210dd7f27617a794a5d15d9f060df734ff3fe9a"
        },
        {
          "name": "emit_app",
          "title": "Build an app from a design",
          "description": "Needs a subscription. Generates the code of a working Expo / React Native app from a design in the Architect: navigation, providers, tab bar, screens and the components they use. Returns a recipe for the current project: every file with its target path, one install line and ordered steps with a check each. Pass `step` for one step in full, which does not count against the daily allowance.",
          "inputSchema": {
            "properties": {
              "appId": {
                "description": "the Architect's \"Send app to agent\" share code, e.g. \"34ca4babb2\"",
                "type": "string"
              },
              "override": {
                "description": "emit even with screens flagged not ready; ask the customer first",
                "type": "boolean"
              },
              "page": {
                "description": "for step write or review; each page names the next",
                "type": "number"
              },
              "step": {
                "description": "a step id from the recipe, or \"review\" for the screen list",
                "type": "string"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build an app from a design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f32cdec49bf1a1b93e06ed49dfeed0f504220d5c9c6ab8ef6aadd70e9045b793"
        },
        {
          "name": "find_component",
          "title": "Find a component",
          "description": "Finds the React Native / Expo component for a mobile app's need in plain words, such as a button, a tab bar or a bottom sheet: Liquid Glass on iOS 26, Material 3 Expressive on Android. Ranked, and says when this catalog ships nothing on purpose because the phone's own control is the right choice. Omit `need` to list every component and its purpose.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["controls", "chrome", "surfaces"],
                "type": "string"
              },
              "need": {
                "description": "e.g. \"a progress bar for an upload\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a component"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f52ea7b651f0ece0768701efb142c79fa862d4a74788f3878825b0be76acf43b"
        },
        {
          "name": "get_app_setup",
          "title": "Get the app setup",
          "description": "How a React Native / Expo app is set up so these components work and follow its theme, one topic at a time: the app-root providers in the order that works, the theme hooks and token scales, the rules that hold across the whole catalog, or propose_app's two formats, plan and design. An app built by emit_app has the first three wired.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "rules only",
                "enum": ["ios", "android"],
                "type": "string"
              },
              "topic": {
                "enum": ["providers", "theme", "rules", "plan", "design"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the app setup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f0ac21a7af3d7ee9e83f7368ab9537fc9be1ce698ae7b74233ccb30396cc5efd"
        },
        {
          "name": "get_component",
          "title": "Get a component",
          "description": "Everything needed to write a correct React Native call site for one component: props with types, defaults and allowed values, a minimal example call, what draws on iOS and on Android, the providers it needs at the app root, its dependencies, and the runtime rules that stop it rendering blank.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "only the rules that hold there",
                "enum": ["ios", "android"],
                "type": "string"
              },
              "slug": {
                "description": "e.g. \"button\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a component"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:04abcfea5fda0035fca4ce2657cca91323353d3780f78ef10a20a314c6a4aef5"
        },
        {
          "name": "install_component",
          "title": "Install a component",
          "description": "Needs a subscription, except for the free foundation components. Adds one React Native component to an existing Expo project: the files it and its dependencies need in install order with exact target paths, the single expo install line, the providers it needs and its runtime rules. A backend recipe's id, such as \"supabase\", adds that integration: its files and the per-app wiring an export writes.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "e.g. \"button\", or a recipe id such as \"supabase\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Install a component"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2815380ed644a50cb152b6b13cb686e10f6f68882300d6e56dbf03353273b87d"
        },
        {
          "name": "propose_app",
          "title": "Propose an app design",
          "description": "Designs a mobile app for iOS and Android with the person, the free step before a build. Send one sentence as idea to create a new app, or a short plan or a full design as app, and get back a link that opens it in the Architect as a new, unsaved design: the person sees every screen, changes it and hands it back for emit_app. The link and its code last 7 days. format: true returns the format; dryRun checks without making a link; into sends it to the design the person has open.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "A short plan, e.g. {\"version\":1,\"opening\":\"tabs\",\"tabs\":[{\"template\":\"list\",\"name\":\"Walks\"},{\"template\":\"settings\",\"name\":\"Settings\"}]}, or a full design. With format: true, a plan's format (its templates) or, without a plan, the full design's.",
                "type": "object"
              },
              "dryRun": {
                "description": "check the design and report, without making a link",
                "type": "boolean"
              },
              "format": {
                "description": "true for the format; \"photos\" for sample photos",
                "type": ["boolean", "string"]
              },
              "idea": {
                "description": "what the app is for, in the person's words",
                "type": ["string", "object"]
              },
              "into": {
                "description": "the design code in the person's line",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Propose an app design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:01d1c85586f6a7fa93c16560c030cb1583a5a9bf8eea52342c26cc5f1bc016bf"
        },
        {
          "name": "propose_screen",
          "title": "Propose a screen design",
          "description": "Designs a single screen of a mobile app with the person: send one screen in the design format add_screen builds from and get back a link that opens it in the Architect for the person to change. The link and its code last 7 days. dryRun checks without making a link; format: true returns the format. A whole app is propose_app's.",
          "inputSchema": {
            "properties": {
              "composition": {
                "description": "One screen: { name, screen: { content: { children: [node] }, chrome: { header?, headerItems?, floating: [] }, overlays: [] } }. A node is { id, slug, props }: slug is \"wireframe:<block>\" or a component from find_component.",
                "type": "object"
              },
              "dryRun": {
                "description": "check the screen and report, without making a link",
                "type": "boolean"
              },
              "format": {
                "description": "true for the format",
                "type": "boolean"
              },
              "into": {
                "description": "the design code in the person's line",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Propose a screen design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:42c6d36dbfe6e87c1585dca8979905bc4d7304a8621afdddc736815847c30135"
        },
        {
          "name": "update_components",
          "title": "Update supplied components",
          "description": "Needs a subscription. Updates the React Native components opointo supplied: from the project's .opointo/files.json it returns only the files that changed since export, so it works months later with no share code. Never touches the customer's own screens, and flags the rare change that needs a code edit rather than a copy.",
          "inputSchema": {
            "properties": {
              "acceptSplit": {
                "description": "only once the customer agreed: the paths split-customer-edited blockers name",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "current": {
                "description": "only when a split-unverified blocker asks: each named file's hash, from its command",
                "items": {
                  "properties": {
                    "missing": {
                      "type": "boolean"
                    },
                    "path": {
                      "type": "string"
                    },
                    "sha": {
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "type": "array"
              },
              "manifest": {
                "description": "the parsed .opointo/files.json (the object or its files array)",
                "type": "object"
              },
              "page": {
                "description": "only when the answer's page.next asks for it",
                "type": "number"
              }
            },
            "required": ["manifest"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Update supplied components"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:17daa055609218edc37428c0731e907ee9351ded5594b322bd3a1289c3cd38ce"
        },
        {
          "name": "verify_app",
          "title": "Verify an emitted app",
          "description": "Needs a subscription. Checks an emitted Expo app before a build: missing files, altered verbatim files, absent packages, expo-router's config merge, whether installed Xcode can build it, and whether a change needs a native rebuild.",
          "inputSchema": {
            "properties": {
              "appId": {
                "description": "`appId` in .opointo/files.json; the check line carries it",
                "type": "string"
              },
              "check": {
                "description": "the one line `node .opointo/check.mjs verify` prints",
                "type": "string"
              },
              "config": {
                "description": "release, connect: the lines those commands print",
                "type": "object"
              },
              "files": {
                "description": "only for an export without that command: [{ path, bytes }]",
                "type": "array"
              },
              "toolchain": {
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify an emitted app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ef3755ffeae096d4d342189c066024b6d0481b527ca681945e813aa8dacbbb11"
        }
      ],
