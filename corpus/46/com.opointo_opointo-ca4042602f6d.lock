{
  "lockfileVersion": 2,
  "subjects": {
    "com.opointo/opointo": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opointo.com/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18"]
      },
      "serverInfo": {
        "name": "opointo",
        "title": "OpointO: the AI-powered, cross-platform app designer; your coding agent builds the native Expo app",
        "version": "0.4.0",
        "icons": [
          {
            "src": "https://opointo.com/icons/icon-48.png",
            "mimeType": "image/png",
            "sizes": ["48x48"]
          },
          {
            "src": "https://opointo.com/icons/icon-192.png",
            "mimeType": "image/png",
            "sizes": ["192x192"]
          }
        ]
      },
      "capabilities": {
        "extensions": {
          "io.modelcontextprotocol/skills": {}
        },
        "resources": {},
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "opointo turns an app designed in its Architect into a real React Native / Expo project, native on both platforms: Liquid Glass on iOS 26, Material 3 Expressive on Android. Free with no account: find_component, get_component, get_app_setup and check_snippet, for using the components without a blank screen, and propose_app and propose_screen, for designing with the person. With a subscription, emit_app, add_screen, install_component, update_components and verify_app write and check the code; a paid call asks the person to sign in, or takes a licence key or agent token as a Bearer header.",
      "tools": [
        {
          "name": "add_screen",
          "title": "Add a screen to an app",
          "description": "Needs a subscription. Adds one screen designed in the Architect to a project. With the project's .opointo/files.json it returns the screen file, the route that mounts it and the one line to register it, and never rewrites existing files. Without it, a self-contained screen file for any Expo app.",
          "inputSchema": {
            "properties": {
              "appId": {
                "description": "the share code from \"Send app to agent\"",
                "type": "string"
              },
              "componentName": {
                "description": "only to add a second copy of a screen; omit for the export's name",
                "type": "string"
              },
              "manifest": {
                "description": "the parsed .opointo/files.json",
                "type": "object"
              },
              "screen": {
                "description": "the new screen's name in that design",
                "type": "string"
              },
              "tab": {
                "description": "nest it in this tab's stack; omit to place it where the design does",
                "type": "string"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Add a screen to an app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:41804d83fb7e4a2663c06c3a45c42dbb4142d7e50b628f6ee983fc6bdca62a55"
        },
        {
          "name": "check_snippet",
          "title": "Check code for blank-render bugs",
          "description": "Scans TSX that uses these components for the mistakes that render nothing with no error: animated opacity on glass, the flex: 1 collapse, a clipped lens, a conditionally mounted surface. A read-only text scan, not a guarantee; verify_app checks a whole emitted project.",
          "inputSchema": {
            "properties": {
              "code": {
                "description": "the TSX to check",
                "type": "string"
              }
            },
            "required": ["code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check code for blank-render bugs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f8d0fc9dce04a8f768bbe7cbb36dbcba6e26c782cbe140351ad7ae097c200abf"
        },
        {
          "name": "emit_app",
          "title": "Build an app from a design",
          "description": "Needs a subscription. Turns a design from the Architect into a working Expo app: navigation, providers, tab bar, screens and the components they use. Returns a recipe for the current project: every file with its target path, one install line and ordered steps with a check each. Pass `step` for one step in full, which does not count against the daily allowance.",
          "inputSchema": {
            "properties": {
              "appId": {
                "description": "the Architect's \"Send app to agent\" share code, e.g. \"34ca4babb2\"",
                "type": "string"
              },
              "override": {
                "description": "emit even with screens flagged not ready; ask the customer first",
                "type": "boolean"
              },
              "page": {
                "description": "for step write or review; each page names the next",
                "type": "number"
              },
              "step": {
                "description": "a step id from the recipe, or \"review\" for the screen list",
                "type": "string"
              }
            },
            "required": ["appId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Build an app from a design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ed2af52a42f20750de4cf74068ad2ccec3a39270d3705e9d3ea11d91971d52e4"
        },
        {
          "name": "find_component",
          "title": "Find a component",
          "description": "Finds the component for a UI need described in plain words, ranked, and says when this catalog ships nothing on purpose because the phone's own control is the right choice. Omit `need` to list every component with its purpose and whether it renders the real system control.",
          "inputSchema": {
            "properties": {
              "category": {
                "enum": ["controls", "chrome", "surfaces"],
                "type": "string"
              },
              "need": {
                "description": "e.g. \"a progress bar for an upload\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a component"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd04dbe4cd424fdf906cb9c9ab07b52e97d64a8d69197aab4a9f63a03fa99005"
        },
        {
          "name": "get_app_setup",
          "title": "Get the app setup",
          "description": "How an app is set up so these components work and follow its theme, one topic at a time: the app-root providers in the order that works, the theme hooks and token scales, or the rules that hold across the whole catalog. An app built by emit_app already has all three wired.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "rules only",
                "enum": ["ios", "android"],
                "type": "string"
              },
              "topic": {
                "enum": ["providers", "theme", "rules"],
                "type": "string"
              }
            },
            "required": ["topic"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get the app setup"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:94ddb72761b47cecf2e55dd007d20a212e67482200dfd4d7f4ac7d06dc5a87a0"
        },
        {
          "name": "get_component",
          "title": "Get a component",
          "description": "Everything needed to write a correct call site for one component: props with types, defaults and allowed values, what draws on iOS and on Android, the providers it needs at the app root, its dependencies, and the runtime rules that stop it rendering blank.",
          "inputSchema": {
            "properties": {
              "platform": {
                "description": "only the rules that hold there",
                "enum": ["ios", "android"],
                "type": "string"
              },
              "slug": {
                "description": "e.g. \"button\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a component"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:426316715128d2875f91e25fe1626d24012a890232e082b3ff98f3ab964e4885"
        },
        {
          "name": "install_component",
          "title": "Install a component",
          "description": "Needs a subscription, except for the free foundation components. Adds one component to an existing project: the files it and its dependencies need in install order with exact target paths, the single expo install line, the providers it needs and its runtime rules. A backend recipe's id, such as \"supabase\", adds that integration: its files and the per-app wiring an export writes.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "e.g. \"button\", or a recipe id such as \"supabase\"",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Install a component"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:64a70dc152689cb6f250204598c04e870ac87bbfd4b23914ac7ff79af9b87fff"
        },
        {
          "name": "propose_app",
          "title": "Propose an app design",
          "description": "Your agent can design an app with you: send an app in opointo's design format (the AppSpec emit_app builds from) and get back a link that opens it in the Architect as a new, unsaved design. The person sees every screen, changes what they like, and hands it back for emit_app. into: the code in the person's line; it lands in their open design. dryRun checks without making a link; format: true returns the format and every block, \"photos\" the sample photos, or with app: { version: 1 } a short plan's.",
          "inputSchema": {
            "properties": {
              "app": {
                "description": "The design: { name, tabs: [{ screenId, label }], screens: [{ id, name, composition: { screen: { content: { children: [node] }, chrome: { header?, headerItems?, floating: [] }, overlays: [] } } }], onboardingScreenIds: [], pushed: [{ screenId, fromScreenId, presentation }], theme? }. A node is { id, slug, props }: slug is \"wireframe:<block>\" such as \"wireframe:list-row\" (a list whose rows open one screen is one row block with repeats: \"true\" and its sample rows in rows: [{ title, ... }]) or a component from find_component, and a content node opens a screen with navigate: { to, presentation } beside its props. A top bar is header: { id, slug: \"header\", props: {} }, titled by the screen's name; a sheet has none. entryScreenId is only for a splash screen before the tabs. Titles and composition metadata are set by the builder.",
                "type": "object"
              },
              "dryRun": {
                "description": "check the design and report, without making a link",
                "type": "boolean"
              },
              "format": {
                "type": ["boolean", "string"]
              },
              "into": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Propose an app design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:f2aad019f6980a4fb201a9b0c3b2422d689eaa074ab9815ef6187cb7ef957452"
        },
        {
          "name": "propose_screen",
          "title": "Propose a screen design",
          "description": "Your agent can design a single screen with you: send one screen in opointo's design format (the Composition add_screen builds from) and get back a link that opens it in the Architect as a new, unsaved design the person can change. into: as propose_app's. dryRun checks without making a link; format: true returns the format. For a whole app, use propose_app.",
          "inputSchema": {
            "properties": {
              "composition": {
                "description": "One screen: { name, screen: { content: { children: [node] }, chrome: { header?, headerItems?, floating: [] }, overlays: [] } }. A node is { id, slug, props }: slug is \"wireframe:<block>\" or a component from find_component.",
                "type": "object"
              },
              "dryRun": {
                "description": "check the screen and report, without making a link",
                "type": "boolean"
              },
              "format": {
                "type": "boolean"
              },
              "into": {
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Propose a screen design"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:95c658e14ee99d700ef049b53786bcdd9dafc2587cdbe4c7edacde7afa540902"
        },
        {
          "name": "update_components",
          "title": "Update supplied components",
          "description": "Needs a subscription. Reads the project's .opointo/files.json and returns only the opointo-supplied files that changed since export, so it works months later with no share code. Never touches the customer's own screens, and flags the rare change that needs a code edit rather than a copy.",
          "inputSchema": {
            "properties": {
              "acceptSplit": {
                "description": "only once the customer agreed: the paths split-customer-edited blockers name",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "current": {
                "description": "only when a split-unverified blocker asks: each named file's hash, from its command",
                "items": {
                  "properties": {
                    "missing": {
                      "type": "boolean"
                    },
                    "path": {
                      "type": "string"
                    },
                    "sha": {
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "type": "array"
              },
              "manifest": {
                "description": "the parsed .opointo/files.json (the object or its files array)",
                "type": "object"
              },
              "page": {
                "description": "only when the answer's page.next asks for it",
                "type": "number"
              }
            },
            "required": ["manifest"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Update supplied components"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dabba2f7ca55d91c85e2dc3d7b0cb00ebe686989c233bb070f97497fe22116e1"
        },
        {
          "name": "verify_app",
          "title": "Verify an emitted app",
          "description": "Needs a subscription. Checks an emitted app before a build: missing files, altered verbatim files, absent packages, expo-router's config merge, whether installed Xcode can build it, and whether a change needs a native rebuild.",
          "inputSchema": {
            "properties": {
              "appId": {
                "description": "emit_app's share code; `appId` in .opointo/files.json",
                "type": "string"
              },
              "config": {
                "properties": {
                  "androidMinSdkVersion": {
                    "type": "number"
                  },
                  "connect": {
                    "type": "string"
                  },
                  "icon": {
                    "description": "app.json",
                    "type": "string"
                  },
                  "iosDeploymentTarget": {
                    "type": "string"
                  },
                  "main": {
                    "description": "package.json \"main\"",
                    "type": "string"
                  },
                  "moduleSuffixes": {
                    "description": "tsconfig compilerOptions",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "monochromeImage": {
                    "description": "app.json android.adaptiveIcon",
                    "type": "string"
                  },
                  "nativeModulesDir": {
                    "description": "package.json expo.autolinking",
                    "type": "string"
                  },
                  "permissions": {
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "plugins": {
                    "description": "app.json",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "privacyPolicyUrl": {
                    "type": "string"
                  },
                  "release": {
                    "type": "string"
                  },
                  "scheme": {
                    "description": "app.json",
                    "type": "string"
                  },
                  "sources": {
                    "type": "string"
                  },
                  "supportsTablet": {
                    "description": "app.json ios",
                    "type": "boolean"
                  },
                  "userInterfaceStyle": {
                    "description": "app.json",
                    "type": "string"
                  }
                },
                "type": "object"
              },
              "dependencies": {
                "description": "package.json keys",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "files": {
                "description": "each file written, hidden .opointo/files.json included: { path, bytes }, from the project root",
                "items": {
                  "properties": {
                    "bytes": {
                      "description": "bytes on disk as `wc -c` reports, not characters",
                      "type": "number"
                    },
                    "path": {
                      "type": "string"
                    },
                    "sha": {
                      "description": "optional; replaces the byte check",
                      "type": "string"
                    }
                  },
                  "required": ["path"],
                  "type": "object"
                },
                "type": "array"
              },
              "toolchain": {
                "properties": {
                  "enableSceneSupport": {
                    "type": "boolean"
                  },
                  "expoBuildProperties": {
                    "description": "INSTALLED expo-build-properties version",
                    "type": "string"
                  },
                  "expoSdk": {
                    "description": "INSTALLED expo version, e.g. \"58.0.19\"",
                    "type": "string"
                  },
                  "lastBuildFingerprint": {
                    "type": "string"
                  },
                  "nativeFingerprint": {
                    "type": "string"
                  },
                  "xcode": {
                    "description": "`xcodebuild -version`; omit without Xcode",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": ["files"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Verify an emitted app"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:639cb80f51a5f1f015c04e0b89de018304a4b538521c357b7d5cb09518885289"
        }
      ],
