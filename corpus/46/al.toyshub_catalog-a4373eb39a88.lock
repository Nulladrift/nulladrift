{
  "lockfileVersion": 2,
  "subjects": {
    "al.toyshub/catalog": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://toyshub.al/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26", "2024-11-05"]
      },
      "serverInfo": {
        "name": "toyshub.al",
        "title": "Toys Hub",
        "version": "2.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Catalogue of Toys Hub (https://toyshub.al). Prices are in ALL. Use search_products to find items (filter by age, category or price), get_product for details, get_store_info for delivery, payment and returns, and create_cart_link to give the shopper a checkout link. Pass lang \"sq\" for Albanian or \"en\" for English. Nothing here places an order; the shopper confirms on the store site.",
      "tools": [
        {
          "name": "check_availability",
          "title": "Check availability",
          "description": "Whether a product can be ordered now in the wanted quantity.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "quantity": {
                "default": 1,
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2bdf58936cdba577f1afe0a8c5a0926ab3cebfc483c2bb8ecde0d1febf37b0aa"
        },
        {
          "name": "create_cart_link",
          "title": "Checkout link",
          "description": "Make a link that opens Toys Hub's checkout with these products already in the cart. Give it to the shopper; they confirm and pay on the store's site. Nothing is ordered or stored by this tool.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "items": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "quantity": {
                      "default": 1,
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "slug": {
                      "type": "string"
                    }
                  },
                  "required": ["slug"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "lang": {
                "default": "en",
                "description": "Language of names, descriptions and links: \"sq\" Albanian, \"en\" English.",
                "enum": ["sq", "en"],
                "type": "string"
              }
            },
            "required": ["items"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "checkoutUrl": {
                "type": "string"
              },
              "currency": {
                "type": "string"
              },
              "items": {
                "type": "array"
              },
              "skipped": {
                "type": "array"
              },
              "total": {
                "type": "number"
              }
            },
            "required": ["checkoutUrl", "items"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f1cc8ed0c0b6df0375bd34e5a11d992acfb7a8c5007b6432d27a8d94d673dc23"
        },
        {
          "name": "get_product",
          "title": "Product details",
          "description": "Everything about one product: description, price, availability, age range, brand, photos, rating, delivery and payment facts, and a buy-now link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of names, descriptions and links: \"sq\" Albanian, \"en\" English.",
                "enum": ["sq", "en"],
                "type": "string"
              },
              "slug": {
                "description": "Product slug (from search_products).",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a5dab5ce089dd19573433afaaab7872b8ae94591a4cd4635f7b8d9bc23cde5bc"
        },
        {
          "name": "get_shipping_quote",
          "title": "Delivery cost",
          "description": "Delivery cost and time for a city, and whether the order qualifies for free delivery.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "city": {
                "description": "Delivery city, e.g. Tirana or Prishtina.",
                "type": "string"
              },
              "order_total": {
                "description": "Value of the products, in the store currency.",
                "minimum": 0,
                "type": "number"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d0ab709aec588be225ef63ca4c6f63fa433a7e603fd246a99d4385a433f9341e"
        },
        {
          "name": "get_store_info",
          "title": "Store information",
          "description": "Who the store is and how buying works: delivery countries, cost and time, payment methods, returns, currency, languages and contact.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of names, descriptions and links: \"sq\" Albanian, \"en\" English.",
                "enum": ["sq", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c4f4921bc3c7a082a98af2a1321d81f175152a9f2c290baabaaf84ca2d4d123e"
        },
        {
          "name": "list_categories",
          "title": "Categories",
          "description": "All product categories with their slug, name, product count and page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of names, descriptions and links: \"sq\" Albanian, \"en\" English.",
                "enum": ["sq", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a9cbd394570294de6840be71b0679859d2fd88fbfe9beeb95447f0784f96f9d6"
        },
        {
          "name": "search_products",
          "title": "Search products",
          "description": "Search Toys Hub's catalogue by words, category, age and price. Returns name, price, availability, photo, product page and a buy-now link for each match.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "age": {
                "description": "Child's age in years; returns products suitable for that age.",
                "maximum": 18,
                "minimum": 0,
                "type": "integer"
              },
              "category": {
                "description": "Category slug from list_categories.",
                "type": "string"
              },
              "in_stock_only": {
                "default": false,
                "type": "boolean"
              },
              "lang": {
                "default": "en",
                "description": "Language of names, descriptions and links: \"sq\" Albanian, \"en\" English.",
                "enum": ["sq", "en"],
                "type": "string"
              },
              "limit": {
                "default": 10,
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Highest price, in the store currency.",
                "minimum": 0,
                "type": "number"
              },
              "query": {
                "description": "Words to look for in names and descriptions (Albanian or English). Empty lists popular products.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "products": {
                "items": {
                  "properties": {
                    "ageRange": {
                      "type": ["string", "null"]
                    },
                    "availability": {
                      "type": "string"
                    },
                    "buyUrl": {
                      "type": "string"
                    },
                    "category": {
                      "type": ["string", "null"]
                    },
                    "currency": {
                      "type": "string"
                    },
                    "image": {
                      "type": ["string", "null"]
                    },
                    "name": {
                      "type": "string"
                    },
                    "price": {
                      "type": "number"
                    },
                    "slug": {
                      "type": "string"
                    },
                    "url": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "resultCount": {
                "type": "integer"
              }
            },
            "required": ["products", "resultCount"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:26b4a5376ed8db8e3b31cb8ca2d64c828ec691db661de9b29e1ed4d17e6730ec"
        }
      ],
      "digest": "sha256:aa367da3dc3760514ae11e6dcb156dfdfb181173bf7386a2fe97012feb7edbd4"
    }
  }
}
