        {
          "name": "get_mortgage_data",
          "description": "Get Home Mortgage Disclosure Act (HMDA) loan-level data.\n\n    Returns mortgage application and origination records reported by\n    financial institutions under HMDA. At least one geographic filter\n    (state or county_fips) is recommended to limit results.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX').\n        county_fips: Five-digit county FIPS code (e.g. '06037' for LA County).\n        year: Data year (e.g. 2022). Defaults to 2022 if not specified.\n        action_taken: Loan action code: '1' (originated), '2' (approved not\n            accepted), '3' (denied), '4' (withdrawn), '5' (incomplete).\n        loan_type: Loan type code: '1' (conventional), '2' (FHA-insured),\n            '3' (VA-guaranteed), '4' (USDA/RHS).\n        limit: Maximum number of records to return (default 100, max 1000).\n    ",
          "inputSchema": {
            "properties": {
              "action_taken": {
                "default": null,
                "title": "Action Taken",
                "type": "string"
              },
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "limit": {
                "default": 100,
                "title": "Limit",
                "type": "integer"
              },
              "loan_type": {
                "default": null,
                "title": "Loan Type",
                "type": "string"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_mortgage_dataArguments",
            "type": "object"
          },
