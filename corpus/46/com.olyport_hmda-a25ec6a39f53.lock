        {
          "name": "get_aggregate_stats",
          "description": "Get aggregate mortgage lending statistics for a geographic area.\n\n    Returns summary statistics including total applications, originations,\n    denials, and loan amounts. Useful for understanding overall lending\n    activity in a state or county.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX').\n        county_fips: Five-digit county FIPS code (e.g. '06037' for LA County).\n        year: Data year (e.g. 2022). Defaults to 2022 if not specified.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              },
              "year": {
                "default": null,
                "title": "Year",
                "type": "integer"
              }
            },
            "title": "get_aggregate_statsArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_aggregate_statsOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b3e17e09862164313b0eb579c1969cc7981d9260c681bcd9ed33b45737d1b353"
        },
