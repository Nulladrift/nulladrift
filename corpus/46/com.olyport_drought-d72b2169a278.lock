      "tools": [
        {
          "name": "get_current_drought",
          "description": "Get current drought conditions from the US Drought Monitor.\n\n    Returns the percentage of area at each drought intensity level:\n    - None: No drought\n    - D0: Abnormally Dry\n    - D1: Moderate Drought\n    - D2: Severe Drought\n    - D3: Extreme Drought\n    - D4: Exceptional Drought\n\n    Provide either a state abbreviation for statewide data or a county FIPS code\n    for county-level detail. Omit both for national data.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX').\n        county_fips: Five-digit county FIPS code (e.g. '06037' for Los Angeles County).\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              }
            },
            "title": "get_current_droughtArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_current_droughtOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e6fc0a9860af61ae3e6c87d145d4120a3be31ee6d33052d8a67faafa6196efa8"
        },
        {
          "name": "get_drought_history",
          "description": "Get historical drought conditions over time from the US Drought Monitor.\n\n    Returns weekly drought severity percentages for the specified area and date range.\n    The Drought Monitor is updated every Tuesday, so data points are weekly.\n\n    Args:\n        state: Two-letter US state abbreviation (e.g. 'CA', 'TX').\n        county_fips: Five-digit county FIPS code (e.g. '06037' for Los Angeles County).\n        start_date: Start date in YYYY-MM-DD format. Defaults to one year ago.\n        end_date: End date in YYYY-MM-DD format. Defaults to today.\n    ",
          "inputSchema": {
            "properties": {
              "county_fips": {
                "default": null,
                "title": "County Fips",
                "type": "string"
              },
              "end_date": {
                "default": null,
                "title": "End Date",
                "type": "string"
              },
              "start_date": {
                "default": null,
                "title": "Start Date",
                "type": "string"
              },
              "state": {
                "default": null,
                "title": "State",
                "type": "string"
              }
            },
            "title": "get_drought_historyArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_drought_historyOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:38b61bbb0b9c9aacafbed250b7ea3dbec9932b1111c3a9e02698ff7a6b81ad91"
        },
        {
          "name": "get_drought_summary",
          "description": "Get a national drought summary with total affected area percentages.\n\n    Returns the current national overview showing what percentage of the US\n    is experiencing each drought level (D0 through D4), plus the total area\n    affected by any drought condition. Useful for getting a quick picture of\n    drought conditions across the entire country.\n    ",
          "inputSchema": {
            "properties": {},
            "title": "get_drought_summaryArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "title": "Result",
                "type": "string"
              }
            },
            "required": ["result"],
            "title": "get_drought_summaryOutput",
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2aa858b37ce895d5efc31741b4482b5643328fcbad557f72e5ae1b4c89b9395e"
        }
      ],
