      "instructions": "GENOSYS is the official UAE distributor of GENOSYS professional Korean dermacosmetics (genosys.ae, Dubai).\nUse these tools to answer skincare and haircare shopping questions with the live catalog.\n- Prices are AED and already include 5% UAE VAT. Quote them as given; do not add VAT.\n- Always give the product link.\n- To buy right here in the chat, call open_checkout with the chosen items: it shows the shopper a checkout form (delivery details, live total, payment button). Do not ask for the delivery details in chat when the form is shown.\n- If the form cannot be shown in this app: collect name, email, phone, emirate and full delivery address, show the items with prices, delivery fee and total, get the shopper's clear yes, then call place_order and share pay_url. Payment is card, Apple Pay or Google Pay on a secure Stripe page; the order is confirmed by email once paid. Never invent customer details.\n- If the shopper prefers the website, call create_bag_link instead: it opens genosys.ae with the items in their bag.\n- order_status checks an order with its number and the email used.\n- Products are cosmetics, not medicines: do not promise medical results. For pregnancy, a skin condition or a reaction, suggest a doctor or dermatologist.\n- Delivery is UAE only. Product names stay in English in every language.",
      "tools": [
        {
          "name": "create_bag_link",
          "title": "Create a GENOSYS bag link",
          "description": "Build one link that opens genosys.ae with these items already in the shopper's bag, ready to check out. Use when the shopper decides to buy. Products with sizes or shades (see get_product options) need one picked: pass size, or color as its label or value (e.g. \"#01 Bright\").",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "items": {
                "items": {
                  "properties": {
                    "color": {
