        {
          "name": "recommend_routine",
          "title": "Recommend a GENOSYS routine",
          "description": "Ranked product picks for a shopper's skin type and concerns, the same scoring as the skin quiz on genosys.ae. Use when someone describes their skin and asks what to use.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "age_group": {
                "enum": ["teen", "young-adult", "adult", "mature"],
                "type": "string"
              },
              "at_home_only": {
                "description": "True (default) leaves out professional clinic-only products.",
                "type": "boolean"
              },
              "concerns": {
                "description": "e.g. [\"hydration\",\"anti-aging\"]. Tags: hydration, anti-aging, sensitivity, pore-care, brightening, acne-blemishes, eye-care, hair, hair-loss.",
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 6,
                "type": "array"
              },
              "limit": {
                "description": "Default 6.",
                "maximum": 12,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of descriptions and links: en (default), ru or ar. Product names stay in English.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              },
              "skin_type": {
                "enum": ["dry", "oily", "combination", "normal", "sensitive"],
                "type": "string"
              }
            },
            "type": "object"
