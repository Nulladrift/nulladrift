        {
          "name": "search_products",
          "title": "Search GENOSYS products",
          "description": "Search the live GENOSYS UAE catalog (Korean professional skincare, haircare, devices, beauty boxes). Use for any \"what do you have for...\" question. Accepts plain language in English, Russian or Arabic, plus optional filters. Returns name, price in AED (VAT included), size, stock, concerns and the product link.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Category filter, e.g. Serum, Cream, Mask, Cleanser, Toner/Mist, Sun, Cushion BB, Eye care, Scalp/Hair, Beauty Boxes, Device, Microneedling, PRO Solution. Call list_categories for the full list.",
                "maxLength": 60,
                "type": "string"
              },
              "concern": {
                "description": "Skin concern, e.g. hydration, anti-aging, sensitivity, pore-care, brightening, acne-blemishes, eye-care, hair-loss, sun-protection.",
                "maxLength": 60,
                "type": "string"
              },
              "in_stock_only": {
                "type": "boolean"
              },
              "limit": {
                "description": "Default 8.",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of descriptions and links: en (default), ru or ar. Product names stay in English.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              },
              "max_price_aed": {
                "description": "Only products at or below this price (AED, VAT included).",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "query": {
                "description": "What the shopper wants, e.g. \"serum for dry skin\", \"SPF cushion\", \"hair loss shampoo\".",
                "maxLength": 200,
                "type": "string"
              },
              "skin_type": {
                "enum": ["dry", "oily", "combination", "normal", "sensitive", "mature"],
                "type": "string"
              }
            },
            "type": "object"
          },
