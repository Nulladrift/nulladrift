        {
          "name": "place_order",
          "title": "Place a GENOSYS order",
          "description": "Create a GENOSYS UAE order from this chat and get a secure Stripe payment link (card, Apple Pay, Google Pay). Call only after the shopper has confirmed the items, the total and their delivery details. The order is confirmed by email once paid; unpaid orders are not shipped. Delivery is UAE only. Prices are retail AED including VAT.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "customer": {
                "properties": {
                  "address": {
                    "description": "Building or villa, street, area, and apartment number.",
                    "maxLength": 500,
                    "minLength": 8,
                    "type": "string"
                  },
                  "email": {
                    "description": "Receipt and order updates go here. If it matches a GENOSYS account, the order appears in that account.",
                    "format": "email",
                    "maxLength": 200,
                    "pattern": "^(?!\\.)(?!.*\\.\\.)([A-Za-z0-9_'+\\-\\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "emirate": {
                    "enum": ["Dubai", "Abu Dhabi", "Sharjah", "Ajman", "Ras Al Khaimah", "Fujairah", "Umm Al Quwain"],
                    "type": "string"
                  },
                  "name": {
                    "description": "Full name of the person receiving the order.",
                    "maxLength": 100,
                    "minLength": 2,
                    "type": "string"
                  },
                  "phone": {
                    "description": "For the courier: UAE number or one with its country code.",
                    "maxLength": 30,
                    "minLength": 7,
                    "type": "string"
                  }
                },
                "required": ["address", "email", "emirate", "name", "phone"],
                "type": "object"
              },
              "items": {
                "items": {
                  "properties": {
                    "color": {
                      "description": "Shade label or value, e.g. \"#01 Bright\".",
                      "maxLength": 60,
                      "type": "string"
                    },
                    "product_id": {
                      "description": "Id from search_products / get_product.",
                      "maxLength": 64,
                      "minLength": 1,
                      "type": "string"
                    },
                    "quantity": {
                      "maximum": 20,
                      "minimum": 1,
                      "type": "integer"
                    },
                    "size": {
                      "maxLength": 40,
                      "type": "string"
                    }
                  },
                  "required": ["product_id"],
                  "type": "object"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "locale": {
                "description": "Language of descriptions and links: en (default), ru or ar. Product names stay in English.",
                "enum": ["en", "ru", "ar"],
                "type": "string"
              },
              "notes": {
                "description": "Delivery notes, e.g. preferred time.",
                "maxLength": 1000,
                "type": "string"
              }
            },
            "required": ["customer", "items"],
            "type": "object"
          },
