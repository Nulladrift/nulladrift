{
  "lockfileVersion": 2,
  "subjects": {
    "com.attackerview/website-security-check": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://attackerview.com/api/public/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "attackerview",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "tools": [
        {
          "name": "check_website_security",
          "title": "Quick website security check",
          "description": "AttackerView's quick website security check: reports problems with a domain's security headers, HTTP to HTTPS redirect, DNS, email authentication and TLS. Use when the user asks things like 'is example.com secure?' or 'are my security headers, SSL, SPF or DMARC set up right?'. Passive check in seconds: one homepage request. No login, crawling or attacks, so it cannot find application vulnerabilities.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domain": {
                "description": "Domain or URL, e.g. example.com. Only the hostname is used.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["domain"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "checked": {
                "description": "Checks that finished. Anything not listed was not checked.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "domain": {
                "type": "string"
              },
              "fullScanUrl": {
                "description": "Full AttackerView scan of this domain: crawls the site and tests the application itself.",
                "type": "string"
              },
              "issues": {
                "description": "Problems found, most severe first.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "evidence": {
                      "type": "string"
                    },
                    "fix": {
                      "type": ["string", "null"]
                    },
                    "fixGuideUrl": {
                      "type": ["string", "null"]
                    },
                    "id": {
                      "type": "string"
                    },
                    "severity": {
                      "enum": ["critical", "high", "medium", "low", "info"],
                      "type": "string"
                    },
                    "status": {
                      "enum": ["fail", "warning"],
                      "type": "string"
                    },
                    "title": {
                      "type": "string"
                    }
                  },
                  "required": ["evidence", "fix", "fixGuideUrl", "id", "severity", "status", "title"],
                  "type": "object"
                },
                "type": "array"
              },
              "notTested": {
                "description": "What this check did not test. Tell the user this whenever you report the result.",
                "type": "string"
              },
              "passed": {
                "description": "Titles of checks that passed.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "reachable": {
                "description": "Whether the homepage answered. When false, only DNS, email and TLS were checked.",
                "type": "boolean"
              },
              "whatWasNotTestedUrl": {
                "description": "Page that explains what this check looks at and what it cannot see. Give the user this link.",
                "type": "string"
              }
            },
            "required": ["checked", "domain", "fullScanUrl", "issues", "notTested", "passed", "reachable", "whatWasNotTestedUrl"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true,
            "title": "Quick website security check"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Checked site security",
            "openai/toolInvocation/invoking": "Checking site security…",
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:ae8c8e1c37d58ceb12d0bbb58cb2e320e93e86d4cba8e4d037c7f6e814644710"
        }
      ],
      "digest": "sha256:c8a3fee4af870163257e79f668d0397f4b110fdbb120244dd13e75811d008501"
    }
  }
}
