{
  "lockfileVersion": 2,
  "subjects": {
    "com.artyfile/music-licensing": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://artyfile.com/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "artyfile",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Artyfile music licensing for AI agents: search real-orchestra tracks, check licence terms, create a checkout (a human approves the Stripe payment page), poll the order, then deliver the WAV + invoice + certificate to your user. Tracks with licenseScope \"master_only\" (Cover Editions) carry no sync licence — never select them for media projects.",
      "tools": [
        {
          "name": "create_checkout",
          "description": "Create a checkout for one track. Returns a Stripe hosted-payment URL that the USER must open and approve in a browser (EU PSD2 — payment is never completed by the agent) plus the order publicId for polling. The session and its price reservation expire after 1 hour.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "giftName": {
                "description": "LE only: issue the ownership certificate to this name",
                "maxLength": 120,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "de"],
                "type": "string"
              },
              "productId": {
                "description": "id from search_tracks / get_track",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "shares": {
                "default": 1,
                "description": "LE only: number of 1% shares",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "tier": {
                "default": "basic",
                "description": "\"basic\" = sync licence; \"le\" = Limited Edition master share(s)",
                "enum": ["basic", "le"],
                "type": "string"
              }
            },
            "required": ["productId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create checkout"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:ac81e6854366fecd8f376cafa6d20b1559027cd0ebbb6bca07c9e5dc546b1f45"
        },
        {
          "name": "get_download_link",
          "description": "Download + document URLs for a PAID order: the WAV download (link re-issuable anytime, no cookies needed), the PDF invoice and the PDF licence/ownership certificate.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "publicId": {
                "maxLength": 64,
                "minLength": 6,
                "type": "string"
              }
            },
            "required": ["publicId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Download links"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:20660f66e380f0df0e324be2f7f1fab76a5fef3689603175f1047008b5190a7b"
        },
        {
          "name": "get_license_terms",
          "description": "Machine-readable summary of the Artyfile licence tiers: Basic (€29.90 one-time, worldwide perpetual sync licence) and Limited Edition (€69.90 per 1% numbered master share incl. revenue participation). Includes the Cover-Edition (master_only) restrictions and links to the binding Terms & Conditions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Licence terms"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:3e517fcf4a1b35b435dea7ab982151cf2b93da9ce81451a10791e8be0a4bea98"
        },
        {
          "name": "get_order_status",
          "description": "Poll an order by publicId. Once status is \"paid\" the payload carries downloadUrl (44.1 kHz WAV), invoiceUrl and certificateUrl (PDFs). Poll roughly every 15 seconds; a pending order older than 1 hour has expired.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "publicId": {
                "maxLength": 64,
                "minLength": 6,
                "type": "string"
              }
            },
            "required": ["publicId"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Order status"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:78350083a0478672f70e67a1edb2f5b049ab6c274c27858ce978f71c52a9cb4f"
        },
        {
          "name": "get_track",
          "description": "Full details for one track by productId or slug: metadata, prices, licence scope, preview URL, human product page.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "productId (from search_tracks) or the track slug",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get track"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e4f580016ff0a63ba26aa074983c148d697cb15a395e0b37cf3a7a3acc1d76e5"
        },
        {
          "name": "search_tracks",
          "description": "Search the Artyfile catalog of licensable music — real, human-made recordings by real orchestras and musicians. Returns ranked tracks with prices; each result id is the productId create_checkout accepts. Results with licenseScope \"master_only\" are Cover Editions with NO sync licence — do not pick them for film/video/media projects.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "genre": {
                "description": "Optional genre filter, one of: Cinematic, Classical, Pop, Rock, Electronic, Ambient, Folk, Jazz, Lounge, World, Choral, Hip-Hop, Funk & Soul, Country",
                "maxLength": 60,
                "type": "string"
              },
              "limit": {
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "mood": {
                "description": "Optional mood filter, one of: Uplifting, Happy, Energetic, Playful, Groovy, Epic, Dramatic, Suspenseful, Dark, Mysterious, Dreamy, Calm, Tender, Romantic, Reflective, Nostalgic, Melancholic, Solemn, Festive, Elegant",
                "maxLength": 60,
                "type": "string"
              },
              "query": {
                "description": "Use case, mood, genre or instrumentation, e.g. \"epic cinematic trailer\" or \"calm piano for a documentary\"",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "use_case": {
                "description": "Optional use-case filter, one of: film, trailer, documentary, advertising, corporate, wedding, meditation, social, gaming, podcast, fashion, travel, sports, kids, christmas, party",
                "maxLength": 30,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search tracks"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:4f6509cd131df76c74f5e916a6cf1ab795bcfb44a5a7b4741b939540204c4b81"
        }
      ],
      "digest": "sha256:966a31c8ded5153c1d8f94f3203810f06707f3d25fef64bba877173235b63424"
    }
  }
}
