      "serverInfo": {
        "name": "whichagent-beauty",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "availability",
          "title": "Get Barbershop Availability Handoff",
          "description": "Returns a normalized availability handoff for a source-linked Orange County, CA barbershop, including availability class live, booking-site, or none; it does not guarantee a slot. Use when: the user has selected a barbershop and wants its provider handoff to check a service and, optionally, an appointment date. Do not use when: the user needs a guaranteed live appointment slot or price, beauty services beyond barbershops, results outside Orange County, payment, or a completed booking; availability only returns a class and provider handoff.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "appointment_date": {
                "description": "Optional desired appointment date in YYYY-MM-DD format."
              },
              "business_id": {
                "description": "Required stable business ID returned by search."
              },
              "service": {
                "description": "Optional published service requested, such as haircut or beard trim."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:0d7ddeaa9a6b624651b105b9aadaf0c133fce9b976382b6f717979f640dcad51"
        },
        {
          "name": "book",
          "title": "Get Barbershop Booking Handoff",
          "description": "Returns a normalized booking handoff link for a source-linked Orange County, CA barbershop; it never creates or confirms an appointment. Use when: the user has selected a barbershop and wants its official booking or contact handoff for a service and, optionally, an appointment date. Do not use when: the user needs WhichAgent to create or confirm an appointment, take payment, guarantee a live slot or price, find beauty categories beyond barbershops, or serve locations outside Orange County.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "appointment_date": {
                "description": "Optional desired appointment date in YYYY-MM-DD format."
              },
              "business_id": {
                "description": "Required stable business ID returned by search."
              },
              "service": {
                "description": "Optional published service requested, such as haircut or beard trim."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a79e9586c48cd42609d8292168579b1cea8c0d31662917a95923c19eec549791"
        },
        {
          "name": "compare",
          "title": "Compare Barbershops",
          "description": "Returns a normalized, source-linked comparison of selected Orange County, CA barbershops. Use when: the user wants to compare two or more search results on city, published services, availability class, or published handoff capabilities. Do not use when: the user needs beauty categories beyond barbershops, results outside Orange County, guaranteed real-time slots or prices, payment, or a completed booking.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "business_ids": {
                "description": "Required array or comma-separated list of at least two stable business IDs returned by search."
              },
              "criteria": {
                "description": "Optional array or comma-separated list of comparison fields: city, services, availability_class, capabilities."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:4fcf1d633475d131e65c73c2c88e55594094060519540adea872485aab109012"
        },
        {
          "name": "details",
          "title": "Get Barbershop Details",
          "description": "Returns a normalized, source-linked business record for one Orange County, CA barbershop. Use when: the user wants published services, contact information, availability class, or source links for a barbershop selected from search. Do not use when: the user needs beauty categories beyond the published barbershop subcategory, a business outside Orange County, a guaranteed live appointment slot or price, payment, or a completed booking.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "business_id": {
                "description": "Required stable business ID returned by search, for example crowns-barbershop."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:c8b40ecfa418a1bc43c3bc6981b00049e94fb1093ec25b9da516c3e93c34a8e0"
        },
        {
          "name": "search",
          "title": "Search Orange County Barbershops",
          "description": "Returns normalized, source-linked business records for Orange County, CA barbershops. Use when: the user wants to find or compare local Orange County barbershops with constraints such as city, published service, or availability class. Do not use when: the user needs beauty categories beyond the published barbershop subcategory, results outside Orange County, guaranteed real-time appointment slots or prices, payment, or a completed booking.",
          "inputSchema": {
            "additionalProperties": true,
            "properties": {
              "availability_class": {
                "description": "Optional availability class: live, booking-site, or none."
              },
              "city": {
                "description": "Optional Orange County city name, such as Irvine, Orange, or Santa Ana."
              },
              "service": {
                "description": "Optional published barbershop service, such as haircut, beard trim, or fade."
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3d6cad1ebdf2af8d9141ade2920a271f19252001aa498c83f6af1ee00916a853"
        }
      ],
      "digest": "sha256:e51c43ecb36c034fac05a4c15e0e4de77c83879c005ec4aa0e695c939ece8862"
    }
  }
