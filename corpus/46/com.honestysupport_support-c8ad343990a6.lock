      "serverInfo": {
        "name": "Honesty Support",
        "version": "0.1.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Diagnose an IT problem, then get_support_pricing and get_technician_availability. Offer times to the customer. Call book_technician only after they explicitly confirm, then create_support_checkout. Never invent prices or payment status.",
      "tools": [
        {
          "name": "book_technician",
          "description": "Reserve a previously selected time only when customer_confirmed is true and the session is waiting for that confirmation. Requires the agent bearer token. Does not mark the visit paid. Calling this with customer_confirmed false is rejected.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "customer_confirmed": {
                "description": "True only after the customer explicitly agrees to the price and time.",
                "type": "boolean"
              },
              "email": {
                "default": null,
                "type": ["string", "null"]
              },
              "idempotency_key": {
                "default": null,
                "type": ["string", "null"]
              },
              "name": {
                "default": null,
                "type": ["string", "null"]
              },
              "session_id": {
                "type": "string"
              }
            },
            "required": ["customer_confirmed", "session_id"],
            "type": "object"
          },
          "outputSchema": {
            "$defs": {
              "BookingStatus": {
                "properties": {
                  "consultation_id": {
                    "format": "int64",
                    "type": "integer"
                  },
                  "paid": {
                    "type": "boolean"
                  },
                  "public_token": {
                    "type": "string"
                  },
                  "start_utc": {
                    "type": "string"
                  },
                  "status": {
                    "type": "string"
                  },
                  "ticket_id": {
                    "type": ["string", "null"]
                  }
                },
                "required": ["consultation_id", "paid", "public_token", "start_utc", "status"],
                "type": "object"
              },
              "PriceQuote": {
                "properties": {
                  "currency": {
                    "type": "string"
                  },
                  "duration_label": {
                    "type": "string"
                  },
                  "minutes": {
                    "format": "int32",
                    "type": "integer"
                  },
                  "price_cents": {
                    "format": "int64",
                    "type": "integer"
                  },
                  "price_label": {
                    "type": "string"
                  },
                  "source": {
                    "type": "string"
                  }
                },
                "required": ["currency", "duration_label", "minutes", "price_cents", "price_label", "source"],
                "type": "object"
              },
              "SessionState": {
                "enum": ["AI_TRIAGE", "AI_TROUBLESHOOTING", "HUMAN_REQUESTED", "AWAITING_TIME_SELECTION", "AWAITING_CUSTOMER_CONFIRMATION", "AWAITING_PAYMENT", "BOOKED", "TECHNICIAN_ASSIGNED", "SESSION_READY", "IN_PROGRESS", "COMPLETED", "CANCELLED"],
