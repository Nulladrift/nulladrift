                  "start_utc": {
                    "type": "string"
                  }
                },
                "required": ["label", "minutes", "start_utc"],
                "type": "object"
              },
              "TriageResult": {
                "properties": {
                  "agents_pay_crypto_for_human_requests": {
                    "default": true,
                    "description": "Always true. An agent that asks for a human pays that task in crypto.",
                    "type": "boolean"
                  },
                  "asked_os": {
                    "default": false,
                    "type": "boolean"
                  },
                  "category": {
                    "type": "string"
                  },
