                  "offered_slots": {
                    "default": [],
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "operating_system": {
                    "type": "string"
                  },
                  "remote_support_possible": {
                    "type": "boolean"
                  },
