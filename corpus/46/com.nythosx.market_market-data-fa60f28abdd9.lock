{
  "lockfileVersion": 2,
  "subjects": {
    "com.nythosx.market/market-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://market.nythosx.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "nythosx-market-data",
        "version": "1.1.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Derived market analytics paid per call in USDC via x402: get_trade_plan (bias, regime, levels, setup and odds of target before stop in one call), signal bias, levels, regime, probabilities and webhook price triggers. Free: get_track_record (check accuracy first), get_free_snapshot (BTC, ETH), list_symbols, get_trigger_status, disarm_price_trigger (cancel before it fires). Informational analytics generated by rules and statistics, not investment advice. Past accuracy does not guarantee future results. You are responsible for your own decisions.",
      "tools": [
        {
          "name": "arm_price_trigger",
          "description": "Arm a price trigger with webhook delivery. Arms a single-fire price trigger. NythosX checks the price every minute and POSTs a JSON event to your HTTPS webhook on the first crossing: {event:\"trigger.fired\", id, symbol, direction, price, fired_price, fired_at}, signed with HMAC-SHA256 (header X-NythosX-Signature: sha256=<hex> over the raw body, key = returned secret). Retries up to 5 times (8s timeout per attempt, until your endpoint returns 2xx); after 5 failed attempts delivery is marked failed — check status free with get_trigger_status (REST: GET /api/v1/triggers/status?id=) to see delivery_attempts/last_error. Expires after ttl_hours (default 168, max 720); cancel any time before it fires, free, with disarm_price_trigger (REST: POST /api/v1/triggers/cancel with {id, secret}) — the arm fee is not refunded, it paid for the monitoring already done. Costs $0.02 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "direction": {
                "enum": ["above", "below"],
                "type": "string"
              },
              "price": {
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "symbol": {
                "description": "Instrument symbol",
                "enum": ["BTC", "SOL", "ETH", "BNB", "LTC", "ADA", "XRP", "XDC", "NVDA", "MSFT", "AMZN", "AAPL", "USDPHP"],
                "type": "string"
              },
              "ttl_hours": {
                "maximum": 720,
                "minimum": 1,
                "type": "integer"
              },
              "webhook_url": {
                "description": "Public HTTPS URL that receives the signed trigger.fired event",
                "format": "uri",
                "type": "string"
              }
            },
            "required": ["direction", "price", "symbol", "webhook_url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:c2621bbdd5a22705278edbf9aa668cbfe8a69055bd33a6a5e915576a5a4b50bf"
        },
        {
          "name": "disarm_price_trigger",
          "description": "Cancel a trigger armed with arm_price_trigger, before it fires (free). Requires both id and secret — the same token returned once at arm time and used to verify the webhook's HMAC signature — as proof of ownership. The $0.02 arm fee is not refunded; it paid for the monitoring already done. Returns 404 for an unknown id/secret pair, 409 if the trigger already fired or was already cancelled.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "type": "string"
              },
              "secret": {
                "type": "string"
              }
            },
            "required": ["id", "secret"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:e2fa5e7e2d90061a67e13ea39056f8d7fcf967ca07ca01149b9e25db620cacc2"
        },
        {
          "name": "get_free_snapshot",
          "description": "Market regime (trend, volatility, RSI, ATR%) and nearest support/resistance for BTC and ETH only, refreshed every 15 minutes (free). Returns {price, regime, nearestSupport, nearestResistance}. Pick this over the paid siblings when you just need a quick read on BTC/ETH; use get_signal_bias ($0.01) for a trade direction, get_trade_plan ($0.03) for full setup levels and odds, or get_market_regime/get_support_resistance ($0.005 each) for other symbols or deeper history.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "enum": ["BTC", "ETH"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6719a0f12c7580b7534b5fd16f6b3acb7cd822409f4c8ad7d3950a82f0296020"
        },
        {
          "name": "get_market_regime",
          "description": "Trend and volatility regime. Market regime from the last 24 hours of hourly candles (cached 5 minutes): trend (up / down / range, EMA50 vs EMA200), volatility bucket (low / normal / high / extreme by ATR%), RSI, EMAs. Use this for risk sizing or entry timing (e.g. avoid new entries while volatility is 'extreme') alongside get_signal_bias for direction and get_support_resistance for levels — on its own it gives context, not a trade direction. symbol uses the same trend/volatility thresholds for every instrument, so regime readings are directly comparable across symbols (e.g. BTC 'high' and SOL 'high' mean the same ATR% bucket). Costs $0.005 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Instrument symbol",
                "enum": ["BTC", "SOL", "ETH", "BNB", "LTC", "ADA", "XRP", "XDC", "NVDA", "MSFT", "AMZN", "AAPL", "USDPHP"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5ce89983bab4aca75be14c0b5eddf3fe53cbf34552c749bd478be076a9496a76"
        },
        {
          "name": "get_signal_bias",
          "description": "Signal bias with setup levels and invalidation. Rules-based bias (bullish/lean_bullish/neutral/lean_bearish/bearish) with score, confidence, setup, weighted factors, invalidation. tf sets candle size and lookback (5m=1H to 1w=1Y): shorter is faster but noisier, longer is slower but higher-conviction. Accuracy free at /api/v1/track-record. Quick direction + one setup; get_trade_plan ($0.03) adds target-before-stop odds, get_market_regime ($0.005) is trend/volatility only. Costs $0.01 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Instrument symbol",
                "enum": ["BTC", "SOL", "ETH", "BNB", "LTC", "ADA", "XRP", "XDC", "NVDA", "MSFT", "AMZN", "AAPL", "USDPHP"],
                "type": "string"
              },
              "tf": {
                "default": "4h",
                "description": "Candle timeframe",
                "enum": ["5m", "1h", "4h", "1d", "1w"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:6e42f78e86f6a9d323afe8d0c51d9a8422928b86064acb47f0df6d4cb4833beb"
        },
        {
          "name": "get_support_resistance",
          "description": "Support and resistance map. Up to five support and five resistance levels from clustered daily swing pivots, high-volume nodes and round numbers, each with kind, strength (1-5) and touch count, plus the nearest level on each side. Computed from the last 30 daily candles (cached 15 minutes). Use nearestSupport/nearestResistance as stop-loss/take-profit anchors for a position already open; higher strength and touch count mean a more reliable level. Costs $0.005 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Instrument symbol",
                "enum": ["BTC", "SOL", "ETH", "BNB", "LTC", "ADA", "XRP", "XDC", "NVDA", "MSFT", "AMZN", "AAPL", "USDPHP"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:58816519c174706b2113b9a9e5a99248b4ecbdcceea9b042d85b4d4598abd622"
        },
        {
          "name": "get_target_probability",
          "description": "Probability of reaching a target price. Probability that the price closes beyond a target within 1, 7 and 30 days, and the approximate probability of touching it, from 14-day ATR volatility (normal approximation; touch ~ 2x close-beyond by the reflection principle). symbol must be one of the supported list (see list_symbols) and target must be a positive number, or the call returns 400 and is not charged; if volatility can't be computed from recent candles it returns 502 and is not charged. Costs $0.005 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Instrument symbol",
                "enum": ["BTC", "SOL", "ETH", "BNB", "LTC", "ADA", "XRP", "XDC", "NVDA", "MSFT", "AMZN", "AAPL", "USDPHP"],
                "type": "string"
              },
              "target": {
                "description": "Target price in the quote currency",
                "exclusiveMinimum": 0,
                "type": "number"
              }
            },
            "required": ["symbol", "target"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:7d4873453146b8cbb811e05fe7b47143da6d36562a297ef1579f2a3843195647"
        },
        {
          "name": "get_track_record",
          "description": "Graded accuracy of every published signal bias: hit rate by confidence, bias and symbol, Wilson intervals, Brier score, independent samples (free, cached 15 min, one full report per call — no pagination). Omit symbol for the all-symbols report; pass it to filter to one instrument. Check this before paying for get_signal_bias, to see whether its track record supports trusting the call. Returns 404 if nothing has been graded yet for that filter.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Instrument symbol",
                "enum": ["BTC", "SOL", "ETH", "BNB", "LTC", "ADA", "XRP", "XDC", "NVDA", "MSFT", "AMZN", "AAPL", "USDPHP"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:50fe8264da24581feb2d3ffdd9639ef776d9e0f54e0f44079a4bee32a6300669"
        },
        {
          "name": "get_trade_plan",
          "description": "Complete trade setup in one call. Bundles signal bias, regime, levels, setup (entry, stop, target, R:R), odds of target-before-stop and of touching target within 7 days, time-to-target, invalidation, and track record. tf sets candle size and lookback (5m=1H to 1w=1Y); shorter is faster but noisier. Neutral bias returns odds of hitting resistance before support. For one piece only, call get_signal_bias ($0.01) or get_market_regime ($0.005) — cheaper. Costs $0.03 USDC per call (x402).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "symbol": {
                "description": "Instrument symbol",
                "enum": ["BTC", "SOL", "ETH", "BNB", "LTC", "ADA", "XRP", "XDC", "NVDA", "MSFT", "AMZN", "AAPL", "USDPHP"],
                "type": "string"
              },
              "tf": {
                "default": "4h",
                "description": "Candle timeframe",
                "enum": ["5m", "1h", "4h", "1d", "1w"],
                "type": "string"
              }
            },
            "required": ["symbol"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:dfc54972b245cf63baf2c8b9983b4a67e67d0da570a32d11f2a02a654464cf0d"
        },
        {
          "name": "get_trigger_status",
          "description": "Status of a trigger armed with arm_price_trigger (free). Returns {id, status, symbol, direction, price, created_at, expires_at, fired_at, fired_price, delivered_at, cancelled_at, delivery_attempts, last_error}, where status is one of armed, fired_delivering, delivered, delivery_failed (after 5 webhook attempts), expired or cancelled (via disarm_price_trigger). Returns 404 if id is unknown or its payment never settled.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Trigger id returned by arm_price_trigger, format trg_<24 hex chars>",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a66eed904b38aace7351c997c1efa94c2b0d6401e510ca74a0f2912b9eaca3a3"
        },
        {
          "name": "list_symbols",
          "description": "List supported symbols, timeframes, the per-call USDC price of each paid tool (not asset prices — call get_signal_bias etc. for those), and the payment network (free, read-only, no auth required, no extra rate limit). Returns {symbols, timeframes, network, networks, asset, free: [tool names], tools: [{name, price}], docs}.",
