      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Finds the best split of a worker's yearly retirement saving between Roth and traditional accounts (401(k), Roth 401(k), IRA / backdoor Roth, HSA, brokerage), including employer match, with a real linear-programming optimizer over the US federal tax brackets: it also plans Roth conversions and withdrawals through retirement and compares the optimal mix with 'always traditional' and 'always Roth'. Typical flow: get_contribution_example to see the input shape (kind 'single' or 'married') -> fill in the user's age, salary, retirement age, spending, balances and plan features -> optimize_retirement_contributions -> tell the user this year's dollars per account and the comparison. Money is in today's dollars (the return is a REAL, after-inflation return). Limits: ages 18-80, plan horizon up to 90 years (end age up to 110), salary up to $5,000,000; one or two earners, US federal tax plus an optional flat state rate; no pensions, rental or business income. Results are optimal for the stated assumptions only (return, future tax rate): not tax advice. If unsure the tool fits, call check_request first. Free, no sign-up; web version at https://roth-vs-traditional-calculator.kindoflost.com",
      "tools": [
        {
          "name": "check_request",
          "title": "Check if a request fits",
          "description": "Say in plain words what the user wants (e.g. 'I'm self-employed with a solo 401k and a pension'). Returns whether this optimizer can do it and, if not, the closest thing it can do. Fast, no solve.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "description": {
                "description": "The user's question in a sentence or two.",
                "maxLength": 2000,
                "type": "string"
              }
            },
            "required": ["description"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check if a request fits"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1deb15fff10f4742e0d24a75007040a6377d71ec5e602347cc5bdd91fcf4b3fd"
        },
        {
          "name": "get_contribution_example",
          "title": "Get an example contribution input",
          "description": "Return a complete example input for optimize_retirement_contributions with a one-line explanation of every field. No solve. Edit it to the user's situation. kind 'single' (default) or 'married' (two earners, kids, HSA, two-tier match).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "enum": ["single", "married"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get an example contribution input"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4126a66c334e05032e42990177bb0e888326b206d1d1e331667d350e10905a59"
        },
        {
          "name": "optimize_retirement_contributions",
          "title": "Optimize Roth vs traditional contributions",
          "description": "Find the best yearly split of retirement savings between traditional and Roth 401(k), IRA/backdoor Roth, HSA and brokerage, including employer match, Roth conversions and retirement withdrawals. Returns this year's dollars per account, how the optimal mix compares with always-traditional and always-Roth, Roth share, lifetime totals, the first working years and retirement milestones. Runs in a few seconds (a few more with exact_income_limits). All money in today's dollars. Optimal for the stated assumptions; not tax advice. Call get_contribution_example first if unsure of the shape.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "accounts": {
                "additionalProperties": false,
                "description": "Which accounts the user can use. Defaults: 401(k) and Roth 401(k) available, IRA allowed, no HSA, no match.",
                "properties": {
                  "has_401k": {
                    "description": "Employer 401(k) available. Default true.",
                    "type": "boolean"
                  },
                  "has_roth_401k": {
                    "description": "Plan offers a Roth 401(k) option. Default true.",
                    "type": "boolean"
                  },
                  "hsa": {
                    "description": "HSA-eligible health plan coverage. Default none.",
                    "enum": ["none", "self", "family"],
                    "type": "string"
                  },
                  "ira": {
                    "description": "May contribute to an IRA / Roth IRA. Default true.",
                    "type": "boolean"
                  },
                  "match": {
                    "description": "Your employer match tiers, richest first.",
                    "items": {
                      "additionalProperties": false,
                      "description": "One employer-match tier: 'employer adds match_pct cents per dollar you put in, on the next of_first_pct_of_pay percent of pay'.",
                      "properties": {
                        "match_pct": {
                          "description": "Employer match rate in whole percent (100 = dollar for dollar, 50 = 50 cents per dollar).",
                          "maximum": 300,
                          "minimum": 0,
                          "type": "number"
                        },
                        "of_first_pct_of_pay": {
                          "description": "WIDTH of this tier in whole percent of pay (not cumulative). '100% of the first 3% then 50% of the next 2%' = [{100,3},{50,2}].",
                          "maximum": 100,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["match_pct", "of_first_pct_of_pay"],
                      "type": "object"
                    },
                    "maxItems": 4,
                    "type": "array"
                  },
                  "spouse_has_401k": {
                    "description": "Default true.",
                    "type": "boolean"
                  },
                  "spouse_has_roth_401k": {
                    "description": "Default true.",
                    "type": "boolean"
                  },
                  "spouse_match": {
                    "description": "Spouse's employer match tiers.",
                    "items": {
                      "additionalProperties": false,
                      "description": "One employer-match tier: 'employer adds match_pct cents per dollar you put in, on the next of_first_pct_of_pay percent of pay'.",
                      "properties": {
                        "match_pct": {
                          "description": "Employer match rate in whole percent (100 = dollar for dollar, 50 = 50 cents per dollar).",
                          "maximum": 300,
                          "minimum": 0,
                          "type": "number"
                        },
                        "of_first_pct_of_pay": {
                          "description": "WIDTH of this tier in whole percent of pay (not cumulative). '100% of the first 3% then 50% of the next 2%' = [{100,3},{50,2}].",
                          "maximum": 100,
                          "minimum": 0,
                          "type": "number"
                        }
                      },
                      "required": ["match_pct", "of_first_pct_of_pay"],
                      "type": "object"
                    },
                    "maxItems": 4,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "age": {
                "description": "Your age this year. The plan starts now.",
                "maximum": 80,
                "minimum": 18,
                "type": "integer"
              },
              "assumptions": {
                "additionalProperties": false,
                "description": "Modeling assumptions; the defaults are reported back.",
                "properties": {
                  "backdoor_roth": {
                    "description": "Roth IRA open at any income via backdoor. Default true.",
                    "type": "boolean"
                  },
                  "exact_income_limits": {
                    "description": "Model exact Roth IRA / deduction income phase-outs (slower MILP, a few seconds). Default false.",
                    "type": "boolean"
                  },
                  "real_return_pct": {
                    "description": "Investment return above inflation, whole percent. Default 5.",
                    "maximum": 15,
                    "minimum": -5,
                    "type": "number"
                  },
                  "retirement_tax_rate_pct": {
                    "description": "Income tax rate applied to leftover traditional money at the end of the plan. Default 22.",
                    "maximum": 60,
                    "minimum": 0,
                    "type": "number"
                  },
                  "state_tax_pct": {
                    "description": "Flat state income tax rate, whole percent. Default 0.",
                    "maximum": 20,
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "balances": {
                "additionalProperties": false,
                "description": "Current household balances, dollars. Omitted = 0.",
                "properties": {
                  "brokerage": {
                    "description": "Taxable brokerage and cash.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "brokerage_gain": {
                    "description": "Unrealized long-term gain inside the brokerage balance (cannot exceed it).",
                    "minimum": 0,
                    "type": "number"
                  },
                  "roth": {
                    "description": "Roth 401(k)/IRA balance.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "traditional": {
                    "description": "Traditional 401(k)/IRA balance.",
                    "minimum": 0,
                    "type": "number"
                  }
                },
                "type": "object"
              },
              "children_birth_years": {
                "description": "Birth years of dependent children (child tax credit, head of household).",
                "items": {
                  "type": "integer"
                },
                "maxItems": 10,
                "type": "array"
              },
              "end_age": {
                "description": "Plan until this age (default 92; horizon at most 90 years).",
                "maximum": 110,
                "type": "integer"
              },
              "filing": {
                "description": "Tax filing status. Default 'single'. 'married' = one joint return; fill in the spouse_* fields.",
                "enum": ["single", "married"],
                "type": "string"
              },
              "real_raise_pct": {
                "description": "Yearly raise above inflation, whole percent (1 = 1%). Default 1.",
                "maximum": 10,
                "minimum": -5,
                "type": "number"
              },
              "retire_age": {
                "description": "Age you stop working. Must be above 'age'.",
                "type": "integer"
              },
              "salary": {
                "description": "Your gross pay this year, in dollars.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "social_security": {
                "additionalProperties": false,
                "description": "Expected Social Security (household). Omitted = none modeled.",
                "properties": {
                  "annual": {
                    "description": "Yearly benefit in today's dollars.",
                    "minimum": 0,
                    "type": "number"
                  },
                  "start_age": {
                    "description": "Age benefits start. Default 67.",
                    "maximum": 70,
                    "minimum": 62,
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "spending_in_retirement": {
                "description": "Yearly spending after retiring, today's dollars (before income tax).",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "spending_while_working": {
                "description": "Yearly living costs while still working, today's dollars. Default = spending_in_retirement.",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              },
              "spouse_retire_age": {
                "description": "Married only: the age YOU will be when your spouse stops working (all ages on this server are the primary earner's). Default = retire_age.",
                "type": "integer"
              },
              "spouse_salary": {
                "description": "Married only: spouse's gross pay this year (0 or omitted = spouse does not work).",
                "maximum": 5000000,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["age", "retire_age", "salary", "spending_in_retirement"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Optimize Roth vs traditional contributions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:b78a7caa251bae7e060aee73b62c3d2ebc184a7d7ad145a644d979335b3ed5eb"
        }
      ],
