      "capabilities": {
        "tools": {}
      },
      "instructions": "Expatriator is an AI immigration consultant and case manager (https://expatriator.com). These public tools cover curated immigration knowledge (gotchas with workarounds), Spanish procedure guides, and live Madrid appointment availability. For personalized case management, users chat with @expatriator_bot on Telegram.",
      "tools": [
        {
          "name": "check_madrid_padron_availability",
          "description": "Live check of Madrid Ayuntamiento padrón (empadronamiento) appointment availability via the official portal. Returns open offices and timeslots when available.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57a4fedd0d6118a97b5976d7b399267ff0b3f4ca94b5471e98402ae5983bbb9f"
        },
        {
          "name": "get_procedure_guide",
          "description": "Get a step-by-step guide for a Spanish procedure (booking portals, documents needed, common problems). Use list_procedure_guides for valid codes.",
          "inputSchema": {
            "properties": {
              "language": {
                "description": "Guide language (default en)",
                "enum": ["en", "es"],
                "type": "string"
              },
              "procedure": {
                "description": "Procedure code, e.g. padron",
                "type": "string"
              }
            },
            "required": ["procedure"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7d297d9e7c6571b9edd2d6a5e55a69fcb7854e8d65cc5e4bd7bea78211e0e126"
        },
        {
          "name": "list_procedure_guides",
          "description": "List the step-by-step Spanish procedure guides Expatriator can provide (procedure code, name, provinces covered).",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6cda120a33f9837ba8af8c3ea938155df4d5183ab535a06bc69b9bd6b20c0bf8"
        },
        {
          "name": "search_immigration_knowledge",
          "description": "Search Expatriator's curated immigration knowledge base of gotchas — \"the official guidance says X but reality is Y\" — with severity levels and workarounds. Covers Spain (deepest), Portugal, and general immigration pitfalls.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "ISO country code filter, e.g. ES, PT",
                "type": "string"
              },
              "limit": {
                "description": "Max results (default 5, max 20)",
                "type": "number"
              },
              "procedure": {
                "description": "Procedure filter, e.g. nationality, tie_renewal, nie, padron",
                "type": "string"
              },
              "query": {
                "description": "Natural-language search query",
                "type": "string"
              },
              "severity": {
                "description": "Minimum severity to return",
                "enum": ["blocker", "critical", "warning", "info"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
