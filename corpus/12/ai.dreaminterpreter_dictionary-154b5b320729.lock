      "instructions": "The dream dictionary of Dream Interpreter AI (dreaminterpreter.ai), in English: what dream symbols mean, and which symbols come up in real dreams people wrote on the site, counted by the dreamer's country. All of it is public and read-only, and no sign-in is needed. Symbols are single dictionary entries such as \"snake\", \"teeth falling out\" or \"house\"; a dream usually touches several, and each can be looked up on its own.",
      "tools": [
        {
          "name": "common_dream_symbols",
          "title": "Common dream symbols",
          "description": "The symbols that come up most often in dreams written in English on Dream Interpreter AI, most common first, each with the start of its meaning and its page.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
