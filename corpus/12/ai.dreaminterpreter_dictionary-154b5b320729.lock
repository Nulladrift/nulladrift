        {
          "name": "dreams_by_country",
          "title": "Dreams by country",
          "description": "What people in a country dream about, from real dreams on Dream Interpreter AI: the country's standout symbol (much more common there than in the rest of the world) and its most common symbol, with how many dreams were counted. Without a country, every country with enough dreams.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
