        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "RemoteHunt",
        "version": "1.30.0",
        "websiteUrl": "https://remotehunt.app",
        "icons": [
          {
            "src": "https://remotehunt.app/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
