          "listChanged": false,
          "subscribe": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "RemoteHunt finds remote jobs that can hire people in a given country. Use search_remote_jobs with a job title and the country the person lives in; can_job_hire_me to check one RemoteHunt job against a country; get_job for one job's details. Answers come from RemoteHunt's public job pages. Each job has a link to its page on RemoteHunt.",
      "tools": [
        {
          "name": "can_job_hire_me",
          "title": "Can this job hire me?",
          "description": "Check whether one RemoteHunt job can hire a person who lives in a given country, from where the posting says it hires. Takes a RemoteHunt job link (remotehunt.app/job/...).",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Country the person lives in: a name or an ISO code.",
                "maxLength": 60,
                "title": "Country",
                "type": "string"
              },
              "job": {
                "description": "A RemoteHunt job link or its slug.",
                "maxLength": 500,
                "title": "Job",
                "type": "string"
              }
            },
            "required": ["country", "job"],
            "title": "can_job_hire_meArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Can this job hire me?"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://remotehunt/job-cards.html",
            "ui": {
              "resourceUri": "ui://remotehunt/job-cards.html"
            },
            "ui/resourceUri": "ui://remotehunt/job-cards.html"
          },
          "digest": "sha256:9e19689d5f54b25b3a9494c87f092925afa58fd07eb9b678cf010aad5ea673bf"
        },
        {
          "name": "get_job",
          "title": "Get job details",
          "description": "Details of one RemoteHunt job: title, company, stated pay, where it can hire, level, must-have skills, a short excerpt of the posting and the link to apply. Takes a RemoteHunt job link (remotehunt.app/job/...).",
          "inputSchema": {
            "properties": {
              "job": {
                "description": "A RemoteHunt job link or its slug.",
                "maxLength": 500,
                "title": "Job",
                "type": "string"
              }
            },
            "required": ["job"],
            "title": "get_jobArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get job details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/outputTemplate": "ui://remotehunt/job-cards.html",
            "ui": {
              "resourceUri": "ui://remotehunt/job-cards.html"
            },
            "ui/resourceUri": "ui://remotehunt/job-cards.html"
          },
          "digest": "sha256:73f9e6649828fd759bb3a4e80e9783f27cfe0a39c1e60563874777739eebed20"
        },
        {
          "name": "search_remote_jobs",
          "title": "Search remote jobs",
          "description": "Find open remote jobs on RemoteHunt for a job title or profession. With the country the person lives in, only jobs whose postings say they can hire there are returned. Returns up to 10 jobs with title, company, posting age, stated pay, where each job can hire, and a link to its RemoteHunt page.",
          "inputSchema": {
            "properties": {
              "country": {
                "anyOf": [
                  {
                    "maxLength": 60,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Country the person lives in: a name or an ISO code, e.g. \"Brazil\" or \"BR\".",
                "title": "Country"
              },
              "level": {
                "anyOf": [
                  {
                    "maxLength": 20,
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional level: junior, mid, senior or lead.",
                "title": "Level"
              },
              "limit": {
                "default": 5,
                "description": "How many jobs to return, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "title": "Limit",
                "type": "integer"
              },
              "role": {
                "description": "Job title or profession, e.g. \"product designer\" or \"data analyst\".",
                "maxLength": 100,
                "title": "Role",
                "type": "string"
              }
            },
            "required": ["role"],
            "title": "search_remote_jobsArguments",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search remote jobs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
