      "serverInfo": {
        "name": "dragonseye",
        "version": "1.5.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Dragons Eye: pay-per-call ransomware and threat intel. indicator_check ($0.01) tells you whether a domain or IPv4 is listed as attacker infrastructure in ThreatCluster's 30-day high-confidence IOC feed (indicator_batch_check: 100 for $0.25). cve_intel ($0.03) returns KEV, ransomware use, EPSS, public exploits, an AI-generated ATT&CK attack flow and D3FEND defenses for one CVE (cve_batch_intel: 50 for $0.50; former free cve_status is retired and returns directions only). group_intel ($0.05) profiles one ransomware gang. The former free coverage tool is retired and returns directions only. Existing paid products answer specific queries, not the former inventory; paid CVE detail does not replace every former status-only result. Uncached items fail and are not charged. Leak-site claims: use validate_query and pricing (both free) first. lookup_victim searches one company or domain, batch_exposure_check checks up to 25 vendor domains at once, bulk_vendor_check returns raw claims for up to 100 vendor domains or names ($0.50), vendor_risk_report builds a full risk report for up to 100 vendor domains or names, watch_status (free) reads a watch created with HTTP POST /v1/watch ($0.30, 25 vendors, 30 days, webhook on new claims), recent_claims lists the newest claims (optionally per group), group_profile describes one group. Every result is an unverified claim from a criminal leak site, not a confirmed breach; found=false is not proof of absence. Do not use results to contact, shame or harm alleged victims. Read-only; x402 USDC on Base in _meta['x402/payment']; failed or invalid calls are not charged.",
      "tools": [
        {
          "name": "batch_exposure_check",
          "description": "Check up to 25 vendor or supplier domains in one call for ransomware leak-site claims, for third-party-risk reviews. Returns one result per domain (found, claim count, claims with group, dates and sources). Domains only; use lookup_victim for company names. At most 15 claim records are read per batch, so a domain with many matches is marked partial. Every result is an unverified claim from a criminal leak site, not a confirmed breach; found=false is not proof of absence. Read-only; one flat price. Costs $0.05 USDC per call via x402 (payment goes in _meta[\"x402/payment\"]); invalid input or an upstream failure returns an error and is not charged.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "domains": {
                "description": "Vendor/supplier domains to check, 1-25, e.g. [\"acme.com\", \"example.org\"]",
                "items": {
                  "maxLength": 260,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 25,
                "minItems": 1,
                "type": "array"
              }
            },
            "required": ["domains"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
