        {
          "name": "cve_intel",
          "description": "Everything an agent needs to prioritize one CVE: CVSS, affected vendors/products, vendor advisories, CISA KEV status and known ransomware use, EPSS, recorded public exploit repositories, an AI-generated attack flow with ATT&CK technique ids (flagged as AI-generated) and suggested MITRE D3FEND countermeasures. CVEs not cached yet return an error (queued, not charged). The former free cve_status tool is retired and returns directions only; some former status-only CVEs have no paid detail. Costs $0.03 USDC per call via x402 (payment goes in _meta[\"x402/payment\"]); invalid input or an upstream failure returns an error and is not charged.",
