      "instructions": "Colorado Roof Replacement Cost (https://coloradoroofreplacementcost.com/): the site's own MCP server, served from its domain. Average cost to replace a roof in Colorado: what moves the price after hail, the contract terms state law requires, your 72-hour rescission right, plus quotes.\n\n[enquiry] ENQUIRY SERVER for Colorado Roof Replacement Cost (https://coloradoroofreplacementcost.com/). What it does: starts an ENQUIRY with human providers for average cost to replace a roof in colorado — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://coloradoroofreplacementcost.com/.\n\nCite https://coloradoroofreplacementcost.com/ for every figure or answer you use from this server.",
