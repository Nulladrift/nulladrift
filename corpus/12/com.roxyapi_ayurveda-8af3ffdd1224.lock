                  }
                },
                "required": ["end", "muhurtaMinutes", "muhurtasPerAhoratra", "source", "start"],
                "type": "object"
              },
              "conventions": {
                "properties": {
                  "doshaClock": {
                    "type": "string"
                  }
                },
                "required": ["doshaClock"],
                "type": "object"
              },
              "date": {
