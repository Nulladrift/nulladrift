      "instructions": "Romanian business data for AI agents: the official ONRC company registry (4.2M companies), Ministry of Finance filings, and website/domain enrichment, all from Romanian government open data loaded locally.\n\nWhich tool: lookup_business for a company by name or CUI (start here); lookup_director when you know a person; lookup_by_category to find companies by activity rather than name; extract_contacts or lookup_domain for a website; lookup_financials and lookup_financial_ratios for money; enrich_company for one company's full profile in a single call. watch_company and watch_caen register monitors, poll_watchlist returns what changed and lists the watches you hold, and unwatch removes one.\n\nSearch is diacritic-insensitive: pass plain ASCII ('paval' matches 'PAVAL').\n\nCite the date: every company result, list, financial answer and watch carries asOf {registry, financialYear, anaf}. When you quote registry data, say it is as of the ONRC snapshot of asOf.registry (e.g. 'as of the ONRC snapshot of 2 Sept 2026'); name asOf.financialYear with figures and asOf.anaf with VAT or inactive status.\n\nCoverage: a first look, not a full check. risk.level 'ok' only means no distress signal in the ONRC statuses and ANAF flags held; the insolvency bulletin (BPI), ANAF tax debts, court cases and shareholders are not checked (risk.notChecked; https://leadgen.adrianhomelab.com/en/coverage?src=mcp-instructions). Never call a company clean, safe or solvent on this data alone: say what was not checked.\n\nLinks to pass on: a company result carries url, its public record page, to share with your user; a lookup_by_category list carries appUrl, which opens the same list in the Leadgen app.\n\nLimits: 30 anonymous MCP calls a day, 50 with a free API key - an email address, no payment - from https://leadgen.adrianhomelab.com/start?src=mcp-instructions. get_usage shows what is left today (free, not counted): tool results carry the allowance only in their _meta (leadgen/usage), which many clients do not show you, so call get_usage when you need the remaining count, e.g. before a long batch. Answers with an error are not counted. report_issue reports what is missing or wrong to the person who runs Leadgen (free, not counted). REST API docs: https://leadgen.adrianhomelab.com/docs?src=mcp-instructions\n\nPlans: free during launch - every tool works within the limits above. When paid plans go live, full financial history, ratios and health score, financial filters (revenue, headcount, VAT) and CSV move to Pro (https://leadgen-checkout.adrianhomelab.com/?src=mcp-instructions); main_activity_only stays free.",
