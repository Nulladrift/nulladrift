        {
          "name": "check_vat",
          "title": "Check a VAT number against EU VIES",
          "description": "Check a Romanian VAT number against the EU's VIES register in real time: is it a valid VAT number today, under which name and address, and does that name agree with the company registry. Use it before invoicing a new supplier or when a buyer asks whether the VAT number on file is still live.",
          "inputSchema": {
            "properties": {
              "cui": {
                "description": "Romanian tax identification number (CUI), e.g. '2816464'; 'RO' and leading zeros are accepted.",
                "title": "Cui",
                "type": "string"
              }
            },
            "required": ["cui"],
            "title": "check_vatArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Live VIES validity plus a registry name cross-check.",
            "properties": {
              "address": {
                "description": "The address the EU holds.",
                "type": ["string", "null"]
              },
              "cached": {
                "description": "True when answered from the short-lived cache.",
                "type": ["boolean", "null"]
              },
              "checked": {
                "description": "False when VIES could not be reached.",
                "type": ["boolean", "null"]
              },
              "checkedAt": {
                "description": "When VIES answered.",
                "type": ["string", "null"]
              },
              "error": {
                "description": "Set only when there is no answer (empty_query, invalid_cui, data_unavailable, plan_required ...); such a call is not counted.",
                "type": ["string", "null"]
              },
              "message": {
                "description": "A sentence for the caller.",
                "type": ["string", "null"]
              },
              "name": {
                "description": "The name the EU holds for this number.",
                "type": ["string", "null"]
              },
              "nameMismatch": {
                "description": "True when the two names clearly disagree.",
                "type": ["boolean", "null"]
              },
              "reason": {
                "description": "Why the check did not run.",
                "type": ["string", "null"]
              },
              "registryName": {
                "description": "The name in the ONRC registry.",
                "type": ["string", "null"]
              },
              "source": {
                "description": "EU VIES.",
                "type": ["string", "null"]
              },
              "valid": {
                "description": "True when VIES says the number is a live VAT number.",
                "type": ["boolean", "null"]
              },
              "vatNumber": {
                "description": "The number as queried, e.g. RO14399840.",
                "type": ["string", "null"]
              },
              "warning": {
                "description": "Present only on a mismatch.",
                "type": ["string", "null"]
