        {
          "name": "find_company_by_domain",
          "title": "Find the company behind a website",
          "description": "Find the Romanian company behind a website domain (dedeman.ro). Uses the registry's website field, else reads the site's home and legal/contact pages for the CUI or registration number it shows (matchedOn: registry_website, site_cui). Without one, it says so and offers name candidates from the page title or the domain name, each with a confidence (at most 0.7, never a match). One lookup.",
          "inputSchema": {
            "properties": {
              "compact": {
                "default": false,
                "description": "Optional: true keeps a short preset per row (name, CUI, county, city, legal form, risk level and what it did not check, phone, website, latest revenue and headcount, record url).",
                "title": "Compact",
                "type": "boolean"
              },
              "domain": {
                "description": "The website's domain ('dedeman.ro'); a URL or a www. host is reduced to it. Public domains only.",
                "title": "Domain",
                "type": "string"
              },
              "fields": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Optional: keep only these company fields in each row, comma-separated (companyName,cui,county,risk; dotted paths such as risk.level work). Without it the full record is returned.",
                "title": "Fields"
              }
            },
            "required": ["domain"],
            "title": "find_company_by_domainArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "The company behind a website domain, or why none was found.",
            "properties": {
              "asOf": {
                "description": "What to cite: registry (ONRC snapshot date), financialYear (fiscal year of the figures), anaf (day of the ANAF data), snapshot, published, source.",
                "type": ["object", "null"]
              },
              "attribution": {
                "description": "The credit line to keep when redistributing the data (CC BY 4.0).",
                "type": ["string", "null"]
              },
              "candidates": {
                "description": "When not found (also when the site cannot be read): up to 3 companies whose name matches the page title or the domain name, each with a confidence (at most 0.7).",
                "type": ["array", "null"]
              },
              "domain": {
                "description": "The normalised domain.",
                "type": ["string", "null"]
              },
              "error": {
                "description": "Set only when there is no answer (empty_query, invalid_cui, data_unavailable, plan_required ...); such a call is not counted.",
                "type": ["string", "null"]
              },
              "fields": {
                "description": "The company fields kept when fields or compact trimmed the rows.",
                "items": {
