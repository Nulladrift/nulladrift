        {
          "name": "company_contracts",
          "title": "Public contracts won or awarded",
          "description": "Public procurement contracts from SEAP, Romania's electronic procurement system: what a company won from public authorities, or what it awarded as a contracting authority. Each contract carries the contracting authority, CPV code, contract number, date and value in RON, plus a per-year summary and the top counterparties. Source: ANAP reports published by ADR on data.gov.ro (CC-BY 4.0), loaded quarterly.",
          "inputSchema": {
            "properties": {
              "cui": {
                "description": "Romanian tax identification number (CUI), e.g. '2816464'; 'RO' and leading zeros are accepted.",
                "title": "Cui",
                "type": "string"
              },
              "limit": {
                "default": 50,
                "description": "Contracts to return, newest first (1-200).",
                "title": "Limit",
                "type": "integer"
              },
              "role": {
                "default": "supplier",
                "description": "'supplier' = contracts the company won; 'authority' = contracts it awarded; 'both'.",
                "title": "Role",
                "type": "string"
              },
              "since": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only contracts dated on or after this date (YYYY-MM-DD).",
                "title": "Since"
              },
              "until": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Only contracts dated on or before this date (YYYY-MM-DD).",
                "title": "Until"
              }
            },
            "required": ["cui"],
            "title": "company_contractsArguments",
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "description": "Public procurement contracts from SEAP: won by the firm, or awarded by it.",
            "properties": {
              "asOf": {
                "description": "The publisher's date for the newest workbook loaded (quarterly).",
                "type": ["string", "null"]
              },
              "attribution": {
                "description": "The credit line to keep when redistributing the data (CC BY 4.0).",
                "type": ["string", "null"]
              },
              "contracts": {
                "description": "contractNo, contractDate, valueRon, cpv, cpvName, lot, authority{name,cui}, winner{name,cui}, newest first.",
                "type": ["array", "null"]
              },
              "cui": {
                "description": "The company's CUI.",
                "type": ["string", "null"]
              },
              "error": {
                "description": "Set only when there is no answer (empty_query, invalid_cui, data_unavailable, plan_required ...); such a call is not counted.",
                "type": ["string", "null"]
              },
              "found": {
                "description": "Whether any contract is on record.",
                "type": ["boolean", "null"]
              },
              "lots": {
                "description": "Lot rows on record, which is more than total when a framework contract has lots.",
                "type": ["integer", "null"]
              },
              "message": {
                "description": "A sentence for the caller.",
                "type": ["string", "null"]
              },
              "role": {
                "description": "What was queried: supplier, authority or both.",
                "type": ["string", "null"]
              },
              "sharedContracts": {
                "description": "Contracts on which other winners are also named (their whole value is in sharedValueRon, not counted as this firm's own).",
                "type": ["integer", "null"]
              },
              "sharedValueRon": {
                "description": "Sum of the shared awards' whole values (RON).",
                "type": ["number", "null"]
              },
              "source": {
                "description": "Data source: onrc (registry) or mfp (Ministry of Finance filings).",
                "type": ["string", "null"]
              },
              "top": {
                "description": "Top 10 counterparties: the authorities a supplier won from, or the winners an authority awarded to (name, cui, contracts, valueRon of the sole awards like totalValueRon, sharedContracts, sharedValueRon at whole value).",
                "type": ["array", "null"]
              },
              "total": {
                "description": "Distinct contracts on record (a framework contract repeats its value on every lot row, so it counts once).",
                "type": ["integer", "null"]
              },
              "totalValueRon": {
                "description": "Sum of the values of contracts this firm won alone (RON). A framework's whole value is not attributed to each of its winners: those are counted in sharedValueRon.",
                "type": ["number", "null"]
              },
              "unpricedContracts": {
                "description": "Contracts published with no value (0 or empty): counted in total, adding nothing to the values.",
                "type": ["integer", "null"]
              },
              "years": {
                "description": "Per year, newest first: contracts, valueRon (sole awards), unpriced (published with no value) and shared (whole value not attributed).",
                "type": ["array", "null"]
              }
            },
            "type": "object"
          },
