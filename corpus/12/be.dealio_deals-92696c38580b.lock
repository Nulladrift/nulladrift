        {
          "name": "publish_card",
          "title": "Publish a promotion",
          "description": "One promotion ready to publish elsewhere: the card as a picture (PNG, the same card the site's share button makes: store, photo, title, what you pay, regular price, label, end date; square by default, or 4:5 feed, 9:16 story, 1200x630 link preview; four designs: a shelf tag, b till receipt, d large photo, f 'Vandaag €x goedkoper' with the price large), a short link dealio.be/l/<code> that counts the click and sends the reader straight to the store's page, the store's page itself, the dealio link and a caption. Use the id from search_deals or get_deal.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "the promotion id (search_deals / get_deal)",
                "type": "string"
              },
              "size": {
                "description": "1080x1080 square (default), 1080x1350 feed, 1080x1920 story, 1200x630 link preview",
                "enum": ["1080x1080", "1080x1350", "1080x1920", "1200x630"],
                "type": "string"
              },
              "style": {
                "description": "a shelf tag, b till receipt, d large photo, f 'how much do you save today' (only with a saving). Default: the promotion's own.",
                "enum": ["a", "b", "d", "f"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One promotion as a card to share"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c2b881d3abf6d7bccb1563c0eb5b3d28f1bf3a57e7cca067fa8b9637bee4804a"
        },
        {
          "name": "search_deals",
          "description": "Search the current promotions at Belgian retailers by product, brand or store, with optional filters. Returns the best matches (biggest per-item discount first unless sorted otherwise), each with price, discount, validity and a link to open it.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Category slug or name: voeding, drank, verzorging, huishouden, baby, dier, elektronica, huis-tuin, mode, speelgoed, sport.",
                "type": "string"
              },
              "ends_within_days": {
                "description": "Only promotions that end within this many days.",
                "maximum": 60,
                "minimum": 0,
                "type": "integer"
              },
              "limit": {
                "description": "Results to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "max_price": {
                "description": "Maximum price per item in euro.",
                "type": "number"
              },
              "min_discount": {
                "description": "Minimum discount per item, in percent.",
                "maximum": 99,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many results (for the next page).",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Words from the product, brand or kind of promotion, e.g. 'koffiecapsules', 'Philips', '1+1 gratis'. Optional.",
                "type": "string"
              },
              "sort": {
                "description": "Default: relevance when there is a query, else discount.",
                "enum": ["relevance", "discount", "price", "ends"],
                "type": "string"
              },
              "store": {
                "description": "Store name or slug, e.g. 'bol', 'Colruyt', 'albertheijn'. See list_stores. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search Belgian deals"
