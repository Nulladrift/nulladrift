        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Promotions from 50+ Belgian retailers (supermarkets, drugstores, DIY, electronics, toys, pets, fashion), every discount worked out per item. Queries in Dutch work best (e.g. 'wasmiddel', 'airfryer', 'hondenvoer'). Every result has a `link` on dealio.be that opens the promotion: always give the user that link, it is the only way to the promotion (the tools give no links to the stores, except publish_card). To publish or share one promotion elsewhere (a social post, a message), call publish_card with its id: it returns the promotion as a square picture, a short link dealio.be/l/<code> that counts clicks and sends the reader to the store, the store's own page and a caption. Prices are what the stores showed when the data was refreshed (see `updated`); the store has the last word. Every store is fetched once a day, in the morning (the first from 05:00 Belgian time), and the data is updated as each store finishes; when a fetch fails, the store's previous promotions stay: list_stores says per store when it was last fetched. Quote prices as given: price per item, with the regular price when known. When you present several promotions, also give the link that opens them together on one page (dealio.be/lijst/…): search_deals and get_meal_ideas end with one for the promotions they list; list_link makes one for your own pick across searches, with a title. For 'which one should I buy' questions about a kind of appliance, call get_buying_guide first (researched buying guides: models compared, what each feature does and when you need it, tests and buyer ratings, every statement with its source), then get_model for one model. Name the sources the guide gives and link the guide's page. For 'what can I cook with this week's promotions' questions, call get_meal_ideas: dishes whose main ingredients are in promotion at the food stores the user shops at, on the day they shop, with the promotions and their links (ideas for a shopping list, not recipes). For 'what is the news about <store>' or 'any recalls / price news' questions, call get_news: Belgian consumer news of the last days (prices, promotions, stores, recalls, tests) summarised by dealio with the source and its article; filter by store or theme. For 'which actions run at <store>', 'is there 1+1 / cashback / geen btw / gratis levering / a voucher somewhere' questions, call get_campaigns: the store-wide campaigns (winkelacties) read from the stores' own sites, a percentage on a whole range or brand, multi-buy, cashback, free delivery, vouchers, loyalty-card deals, sales and announced ones, each with its terms and the promotions on dealio that fall under it. search_deals is for one product's price; get_campaigns for an action over a range, a brand, the basket or the whole store.",
      "tools": [
        {
          "name": "get_buying_guide",
          "description": "A researched buying guide (koopwijzer) for a kind of product, e.g. 'airfryer': the models compared (key specs, today's lowest promotion), what each feature does, when you need it and when not, and general facts, every statement with its source. Use it for 'best <product>' and 'which <product> should I buy' questions ('beste airfryer', 'welke wasmachine kopen'): it does not crown a winner, it gives the cited test and buyer scores with their sources. Without a type: the list of guides.",
          "inputSchema": {
            "properties": {
              "type": {
                "description": "Kind of product, Dutch or English, e.g. 'airfryer', 'heteluchtfriteuse'. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a buying guide"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:99587aebfbdb73483229fd08115ddf43f2b191da909ad8cca08d4b281bac4c07"
        },
        {
          "name": "get_campaigns",
          "description": "The store campaigns (winkelacties) running at Belgian retailers, as read from the stores' own sites (dealio.be/acties/): a percentage on a whole range, brand or store, multi-buy (1+1, 2e halve prijs), cashback from the maker, a voucher, a gift, free delivery, loyalty-card deals, sales, no VAT, and announced ones. Not one product's price (that is search_deals). Each with store, kind, the advantage in a few words, what it applies to, condition, code, validity, whether it works on products or on the whole basket, dealio's link, and the promotions on dealio that fall under it (with their links). Filter by store, kind or words.",
          "inputSchema": {
            "properties": {
              "kind": {
                "description": "Only this kind: btw (no VAT), procent (a percentage on a range), meerkoop (1+1, 2e halve prijs), kortingsbon (voucher), cadeau (gift), cashback, levering (delivery), klantenkaart (loyalty card), solden (sales), inruil (trade-in), aangekondigd (announced, not yet running), andere. Optional.",
                "enum": ["btw", "procent", "meerkoop", "kortingsbon", "cadeau", "cashback", "levering", "klantenkaart", "solden", "inruil", "aangekondigd", "andere"],
                "type": "string"
              },
              "limit": {
                "description": "Campaigns to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many campaigns (for the next page).",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to find in the campaign's title, what it applies to, its condition or code (Dutch), e.g. 'verf', 'Nivea', 'speelgoed'. Optional.",
                "type": "string"
              },
              "reach": {
                "description": "product: the advantage is on certain products (a brand, a range, a category); mandje: on the basket, the order or the whole store. Optional.",
                "enum": ["product", "mandje"],
                "type": "string"
              },
              "store": {
                "description": "Store name or slug, e.g. 'Kruidvat', 'gamma'. See list_stores. Optional.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Store campaigns"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3576e71b2296c3fa6728c89d3ef7ecd6c7e96411f821932719d0e50f035189b4"
        },
        {
          "name": "get_deal",
          "description": "One promotion in full, by the id a search result gave.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The `id` of a search result.",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one deal"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:57e72d84e7d8cc7639da1fe571698ef527031ef74d9a01c08c056a4161841824"
        },
        {
          "name": "get_meal_ideas",
          "description": "Meal ideas from the promotions (kookinspiratie): the dishes whose main ingredients are all in promotion at the given Belgian food store(s) on the day the user shops, with those promotions (price, deal, until when, link), the side ingredients that are in promotion too, and what else is needed that is not. Dish ideas for a shopping list, not recipes. Without stores: per food store how many dishes its promotions make today.",
          "inputSchema": {
            "properties": {
              "day": {
                "description": "The shopping day: an ISO date (YYYY-MM-DD), 'today', 'tomorrow' or a weekday ('zaterdag', 'saturday'). Within the next 7 days. Default: today.",
                "type": "string"
              },
              "limit": {
                "description": "Dishes to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "moment": {
                "description": "Kind of dish. Default: hoofdgerecht (main course).",
                "enum": ["hoofdgerecht", "soep", "lunch", "ontbijt", "dessert", "aperitief"],
                "type": "string"
              },
              "offset": {
                "description": "Skip this many dishes (for the next page).",
                "minimum": 0,
                "type": "integer"
              },
              "stores": {
                "description": "One or more food stores, comma separated, by name or slug, e.g. 'Aldi', 'aldi, lidl', 'Delhaize'. Optional.",
                "type": "string"
              },
              "vegetarian": {
                "description": "Only vegetarian dishes, and only promotions without meat or fish. Default false.",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Meal ideas from the promotions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Gerechten gevonden",
            "openai/toolInvocation/invoking": "Gerechten zoeken op dealio…",
            "ui": {
              "resourceUri": "ui://dealio/cards"
            }
          },
          "digest": "sha256:c4624677597a14b353a48afae856133db703e8692b03e9de245973e87db32ab7"
        },
        {
          "name": "get_model",
          "description": "One model from a buying guide in full: the maker's specs, what tests and buyers say (score, summary, pros, cons, source), facts, and today's promotions for it with their links.",
          "inputSchema": {
            "properties": {
              "model": {
                "description": "Model code or name, e.g. 'NA352', 'Philips NA555/00', 'MAF462B1', or the id get_buying_guide gave.",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
