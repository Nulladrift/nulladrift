          },
          "digest": "sha256:ce3c30893a0d9ed8ad357c1cb9dc0ac6be80fa34af786fb4c6cce86dec1f5470"
        },
        {
          "name": "get_news",
          "description": "Belgian consumer news for people who want to save (dealio.be/nieuws/): prices, promotions, store openings and incidents, product recalls (FAVV), tests (Test-Aankoop), taxes and energy, summarised by dealio in two or three sentences with our own headline, the source and the link to its article, newest first. Filter by store (name or slug) or theme. Each item has dealio's link (the item on the news page) and the store pages it names.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "Items to return (default 10).",
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Skip this many items (for the next page).",
                "minimum": 0,
                "type": "integer"
              },
              "q": {
                "description": "Words to find in the headline or summary (Dutch). Optional.",
                "type": "string"
              },
              "store": {
                "description": "Only news that names this store, by name or slug, e.g. 'Delhaize', 'aldi'. Optional.",
                "type": "string"
              },
              "theme": {
                "description": "Only this theme. Optional.",
                "enum": ["prijzen", "promoties", "winkels", "terugroeping", "test", "belasting-energie", "besparen", "koopjes", "andere"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Consumer news"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6b255c3ebb3c0e0461dfb7a2e14042dbb8872c0f413a2b48c3ef4245f5020fc5"
        },
        {
          "name": "list_link",
          "description": "One link that opens several promotions together on one page of dealio.be (dealio.be/lijst/…), in the order given, with an optional title: for the promotions you propose to the user after one or more searches, so they need not open them one by one. Use the ids from search_deals, get_deal or get_meal_ideas (2 to 30). Unknown ids are reported and left out.",
          "inputSchema": {
            "properties": {
              "ids": {
                "description": "The promotion ids, in the order to show them.",
                "items": {
                  "type": "string"
                },
                "maxItems": 30,
                "minItems": 1,
                "type": "array"
              },
              "title": {
                "description": "A short title for the page, e.g. 'Coca-Cola per liter' or 'Boodschappen voor zaterdag'. Optional.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["ids"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "One link for several promotions"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "openai/toolInvocation/invoked": "Kortingen gevonden",
            "openai/toolInvocation/invoking": "Kortingen zoeken op dealio…",
            "ui": {
