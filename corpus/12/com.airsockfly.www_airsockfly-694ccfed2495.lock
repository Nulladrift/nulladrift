      "serverInfo": {
        "name": "airsockfly",
        "title": "Airsockfly",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Airsockfly is a travel marketplace for flights, hotels, tours, car rental, airport parking and travel insurance, serving customers in Poland. Typical flow: resolve places with suggest_places, call a search tool, present a few offers with their url, then refresh the chosen one with get_offer before booking. Account tools need the user's agent token sent as the Authorization: Bearer header. create_booking reserves an offer and returns an order; start_payment only returns a Stripe checkout URL that the user opens and pays personally, so never say a payment was made. Ask the user before create_booking, start_payment, cancel_booking, redeem_reward and delete_price_alert. Tools that are irreversible require confirm set to true, which you may send only after the user explicitly agreed. Prices are integers in grosze, that is 1/100 PLN, unless a currency field says otherwise. Dates are YYYY-MM-DD and times are local wall-clock times at the place of service. Data and messages come in the language from the x-locale header, pl or en.",
      "tools": [
        {
          "name": "accept_price_change",
          "title": "Accept price change",
          "description": "Accept the changed price of an order after create_booking returned price_changed, and continue to payment.",
          "inputSchema": {
            "properties": {
              "idempotencyKey": {
                "description": "Unique key of 8 to 100 characters that you generate once per attempt. Repeating it never creates a duplicate.",
                "maxLength": 100,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "orderId": {
                "description": "Order identifier from list_bookings or create_booking.",
                "pattern": "^[a-f0-9]{24}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Accept price change"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:d82429c44bd75677efcd5ab4c93970a5154f2b0f27759e7733743b41ad93bea4"
        },
        {
          "name": "cancel_booking",
          "title": "Cancel booking",
          "description": "Cancel a booking. This is irreversible: call preview_cancellation, tell the user the penalty and refund, and set confirm to true only after the user explicitly agreed.",
          "inputSchema": {
            "properties": {
              "bookingId": {
                "description": "Identifier of one booking inside an order, from get_booking.",
                "pattern": "^[a-f0-9]{24}$",
                "type": "string"
              },
              "confirm": {
                "const": true,
                "description": "Must be true. Set it only after the user explicitly confirmed this action.",
                "type": "boolean"
              },
              "reason": {
                "description": "Short reason given by the user.",
                "maxLength": 500,
                "minLength": 1,
                "type": "string"
              },
              "vertical": {
                "description": "Service type.",
                "enum": ["flight", "hotel", "tour", "car", "insurance", "parking"],
                "type": "string"
              }
            },
            "required": ["bookingId", "confirm", "vertical"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Cancel booking"
          },
          "behavior": {
            "destructive": true,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:20b3173dc6376fe7290a4e8b8acbe4f5359f85f75c3a90cfd8bcf7fc8e7d2865"
        },
        {
          "name": "create_booking",
          "title": "Create booking",
          "description": "Reserve an offer for the user: re-prices the offer, holds availability and creates an order awaiting payment. Ask the user to confirm the offer, travellers and contact details first. When the result is price_changed, show the new price and call accept_price_change only if the user agrees.",
          "inputSchema": {
            "properties": {
              "contact": {
                "description": "Contact details for booking confirmations.",
                "properties": {
                  "email": {
                    "description": "E-mail address for confirmations.",
                    "format": "email",
                    "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                    "type": "string"
                  },
                  "phone": {
                    "description": "Phone number without the country prefix.",
                    "maxLength": 20,
                    "minLength": 1,
                    "type": "string"
                  },
                  "phonePrefix": {
                    "description": "International dialling prefix, for example +48. Defaults to +48.",
                    "pattern": "^\\+\\d{1,4}$",
                    "type": "string"
                  }
                },
                "required": ["email", "phone"],
                "type": "object"
              },
              "couponCode": {
                "description": "Discount code.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "currency": {
                "description": "Charge currency as an ISO 4217 code. Defaults to PLN.",
                "pattern": "^[A-Za-z]{3}$",
                "type": "string"
              },
              "driverLicenseYears": {
                "description": "Years the main driver has held a driving licence.",
                "maximum": 80,
                "minimum": 0,
                "type": "integer"
              },
              "endDate": {
                "description": "End date of the service, YYYY-MM-DD, when the offer does not fix it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "externalId": {
                "description": "Offer identifier (externalId) returned by a search tool.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
              },
              "idempotencyKey": {
                "description": "Unique key of 8 to 100 characters that you generate once per attempt. Repeating it never creates a duplicate.",
                "maxLength": 100,
                "minLength": 8,
                "pattern": "^[A-Za-z0-9_-]+$",
                "type": "string"
              },
              "insuranceAddon": {
                "description": "Optional travel insurance variant added to the booking.",
                "enum": ["basic", "comfort", "premium"],
                "type": "string"
              },
              "startDate": {
                "description": "Start date of the service, YYYY-MM-DD, when the offer does not fix it.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "travellers": {
                "description": "People travelling or insured. The first one is the lead traveller and the main driver.",
                "items": {
                  "properties": {
                    "birthDate": {
                      "description": "Date of birth, YYYY-MM-DD.",
                      "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                      "type": "string"
                    },
                    "citizenship": {
                      "description": "Citizenship as a two-letter ISO country code.",
                      "pattern": "^[A-Za-z]{2}$",
                      "type": "string"
                    },
                    "firstName": {
                      "description": "First name as in the travel document.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    },
                    "gender": {
                      "description": "Gender as in the travel document. Airlines require it for flight bookings.",
                      "enum": ["m", "f"],
                      "type": "string"
                    },
                    "lastName": {
                      "description": "Last name as in the travel document.",
                      "maxLength": 80,
                      "minLength": 1,
                      "type": "string"
                    }
                  },
                  "required": ["birthDate", "firstName", "lastName"],
                  "type": "object"
                },
                "maxItems": 9,
                "minItems": 1,
                "type": "array"
              },
              "vehiclePlate": {
                "description": "Vehicle registration number. Required for parking.",
                "pattern": "^[A-Za-z0-9 -]{2,14}$",
                "type": "string"
              },
              "vertical": {
                "description": "Service type.",
                "enum": ["flight", "hotel", "tour", "car", "insurance", "parking"],
                "type": "string"
              }
            },
            "required": ["contact", "externalId", "idempotencyKey", "travellers", "vertical"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create booking"
