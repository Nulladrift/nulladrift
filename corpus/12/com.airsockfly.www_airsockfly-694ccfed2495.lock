              "subtitle": {
                "description": "Optional second line shown with the alert.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "thresholdGrosze": {
                "description": "Notify when the price drops to this amount or lower, in grosze (1/100 PLN).",
                "maximum": 100000000,
                "minimum": 100,
                "type": "integer"
              },
              "title": {
                "description": "Alert name shown to the user.",
                "maxLength": 140,
                "minLength": 1,
                "type": "string"
              },
              "vertical": {
                "description": "Service type.",
                "enum": ["flight", "hotel", "tour", "car", "insurance", "parking"],
                "type": "string"
              }
            },
            "required": ["externalId", "thresholdGrosze", "title", "vertical"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Create price alert"
          },
          "behavior": {
            "destructive": false,
