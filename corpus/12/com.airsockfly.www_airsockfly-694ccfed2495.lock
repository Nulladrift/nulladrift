          "description": "Create a price alert for an offer. The user is notified when the price drops to the threshold.",
          "inputSchema": {
            "properties": {
              "externalId": {
                "description": "Offer identifier (externalId) returned by a search tool.",
                "maxLength": 512,
                "minLength": 1,
                "type": "string"
