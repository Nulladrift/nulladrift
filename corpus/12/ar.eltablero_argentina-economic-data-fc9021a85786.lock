                                  "type": "number"
                                },
                                "from": {
                                  "description": "Value at that date",
                                  "type": "number"
                                },
                                "kind": {
                                  "description": "pct: percent change; pp: difference in percentage points",
                                  "enum": ["pct", "pp"],
                                  "type": "string"
                                },
                                "since": {
                                  "description": "Date of the comparison point",
                                  "type": "string"
                                }
                              },
                              "required": ["change", "from", "kind", "since"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "vs. 30 days earlier, or the previous month for monthly series"
                        },
                        "week": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "change": {
                                  "type": "number"
                                },
                                "from": {
                                  "description": "Value at that date",
                                  "type": "number"
                                },
                                "kind": {
                                  "description": "pct: percent change; pp: difference in percentage points",
                                  "enum": ["pct", "pp"],
                                  "type": "string"
                                },
                                "since": {
                                  "description": "Date of the comparison point",
                                  "type": "string"
                                }
                              },
                              "required": ["change", "from", "kind", "since"],
                              "type": "object"
                            },
                            {
                              "type": "null"
