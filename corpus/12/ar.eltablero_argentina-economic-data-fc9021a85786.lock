        {
          "name": "search_series",
          "title": "Search Argentine economic series",
          "description": "Find Argentine economic time series by keywords and get their keys. Call this first whenever you don't already know a series key, then pass the key to get_series (history) or get_projection (forecast). Covers BCRA (exchange rates, reserves, interest rates, monetary aggregates, UVA, CER), INDEC via datos.gob.ar (inflation, activity, wages, trade, employment, poverty) and derived series (real rate, FX gap). Matches every word, ignoring accents and case; series names are in Spanish, so Spanish keywords work best (\"inflacion\", \"dolar\", \"reservas\", \"badlar\", \"salarios\"). Returns up to 15 matches with key, name, category, source and page URL; an empty list means no match, not an error. Read-only, no side effects, no authentication. Rate limited to 60 calls per minute per IP. Data updates at most once per business day.",
