{
  "lockfileVersion": 2,
  "subjects": {
    "ar.eltablero/argentina-economic-data": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://eltablero.ar/api/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "eltablero",
        "version": "1.2.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "El Tablero (https://eltablero.ar) is an independent Argentine site, not a government agency, that publishes economic statistics built on official data from BCRA, INDEC and datos.gob.ar: exchange rates, inflation, interest rates, reserves, monetary aggregates, activity, wages, trade, plus projections with backtested, calibrated bands and the BCRA market-expectations consensus (REM). Typical flow: search_series to get a key, then get_series for history or get_projection for the future; get_snapshot (today's headline indicators, including parallel dollars and country risk), adjust_for_inflation (bring an amount in pesos from one month to another by IPC, CER or UVA), get_weekly_summary and get_release_calendar need no key. Series names and summary sentences are in Spanish; answer the user in their own language. Cite \"El Tablero (eltablero.ar)\" plus the original source given in each response. Projections are statistical references, never forecasts or investment advice. Docs: https://eltablero.ar/docs and https://eltablero.ar/llms.txt",
      "tools": [
        {
          "name": "adjust_for_inflation",
          "title": "Adjust an amount in pesos for inflation",
          "description": "Bring an amount in Argentine pesos from one month to another using an official index: \"ipc\" (default) composes INDEC's monthly inflation month by month, the way contracts indexed \"por IPC\" are updated; \"cer\" and \"uva\" divide the BCRA index of one month by the other (the way inflation-adjusted loans and deposits work). Use it for \"how much is X pesos from <month> worth today\", \"what would a rent of X from <month> be now\" or \"how much was today's X worth back in <month>\" (pass a \"from\" later than \"to\"). Only \"ipc\" can go past the last published month: up to 12 months ahead are completed with El Tablero's projection of monthly inflation, and the response says exactly which months are published and which are projected, with 80% and 95% ranges for the adjusted amount. Read-only, no side effects, no authentication. Rate limited to 60 calls per minute per IP. Data updates at most once per business day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "amount": {
                "description": "Amount in pesos at the month given in from.",
                "exclusiveMinimum": 0,
                "maximum": 1000000000000000,
                "type": "number"
              },
              "from": {
                "description": "Month of the amount, YYYY-MM.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              },
              "index": {
                "description": "\"ipc\" (default), \"cer\" or \"uva\".",
                "enum": ["ipc", "cer", "uva"],
                "type": "string"
              },
              "to": {
                "description": "Target month, YYYY-MM. Defaults to the last published month of the index. Earlier than from inverts the adjustment.",
                "pattern": "^\\d{4}-\\d{2}$",
                "type": "string"
              }
            },
            "required": ["amount", "from"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "adjusted_amount": {
                "type": "number"
              },
              "amount": {
                "type": "number"
              },
              "attribution": {
                "type": "string"
              },
              "bands": {
                "additionalProperties": false,
                "description": "Only when some months are projected",
                "properties": {
                  "adjusted_amount_80": {
                    "items": false,
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  "adjusted_amount_95": {
                    "items": false,
                    "maxItems": 2,
                    "minItems": 2,
                    "prefixItems": [
                      {
                        "type": "number"
                      },
                      {
                        "type": "number"
                      }
                    ],
                    "type": "array"
                  },
                  "note": {
                    "type": "string"
                  }
                },
                "required": ["adjusted_amount_80", "adjusted_amount_95", "note"],
                "type": "object"
              },
              "change_pct": {
                "description": "Cumulative change of the index between from and to",
                "type": "number"
              },
              "disclaimer": {
                "type": "string"
              },
              "factor": {
                "type": "number"
              },
              "from": {
                "description": "YYYY-MM",
                "type": "string"
              },
              "index": {
                "enum": ["ipc", "cer", "uva"],
                "type": "string"
              },
              "index_name": {
                "type": "string"
              },
              "index_values": {
                "additionalProperties": false,
                "description": "CER and UVA only: the index values used",
                "properties": {
                  "from": {
                    "additionalProperties": false,
                    "properties": {
                      "date": {
                        "type": "string"
                      },
                      "value": {
                        "type": "number"
                      }
                    },
                    "required": ["date", "value"],
                    "type": "object"
                  },
                  "to": {
                    "additionalProperties": false,
                    "properties": {
                      "date": {
                        "type": "string"
                      },
                      "value": {
                        "type": "number"
                      }
                    },
                    "required": ["date", "value"],
                    "type": "object"
                  }
                },
                "required": ["from", "to"],
                "type": "object"
              },
              "key": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "projected_months": {
                "maximum": 9007199254740991,
                "minimum": -9007199254740991,
                "type": "integer"
              },
              "published_through": {
                "description": "Last month of the index that is published; later months are projected",
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "steps": {
                "description": "IPC only: the monthly inflation composed, month by month",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "change_pct": {
                      "description": "Monthly inflation applied for that month",
                      "type": "number"
                    },
                    "month": {
                      "description": "YYYY-MM",
                      "type": "string"
                    },
                    "status": {
                      "enum": ["published", "projected"],
                      "type": "string"
                    }
                  },
                  "required": ["change_pct", "month", "status"],
                  "type": "object"
                },
                "type": "array"
              },
              "to": {
                "description": "YYYY-MM",
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["adjusted_amount", "amount", "attribution", "change_pct", "factor", "from", "index", "index_name", "key", "note", "projected_months", "published_through", "source", "to", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:5b9c106ecb35b4ff6f40785eb9d92441e5af0057e6564a367fd53def141bff7f"
        },
        {
          "name": "get_projection",
          "title": "Get a statistical projection",
          "description": "Project a series forward: point values with 80% and 95% bands, the models combined (ETS, ARIMA, Theta, chosen by walk-forward backtest), backtest errors and, when the series has one, the BCRA market-expectations survey (REM) median for the same months. Use it for \"what's next\" questions about inflation, exchange rates, interest rates or reserves; use get_series for past values. It is a statistical reference, not a forecast or advice: say so when you quote it. Needs a key from search_series. Series with too little history return an error. Read-only, no side effects, no authentication. Rate limited to 60 calls per minute per IP. Data updates at most once per business day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "horizon": {
                "description": "How far ahead: calendar days for daily series (default 30, up to 183), periods for the rest (default 12 months, 8 quarters).",
                "maximum": 183,
                "minimum": 1,
                "type": "integer"
              },
              "key": {
                "description": "Series key as returned by search_series, e.g. \"bcra:27\".",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "backtest": {
                "additionalProperties": false,
                "properties": {
                  "coverage95": {
                    "type": "number"
                  },
                  "mae": {
                    "type": "number"
                  },
                  "mae_by_step": {
                    "description": "Mean absolute error at each step ahead (index 0 = one step)",
                    "items": {
                      "type": "number"
                    },
                    "type": "array"
                  },
                  "mape": {
                    "type": ["number", "null"]
                  },
                  "n": {
                    "type": "number"
                  },
                  "origins": {
                    "additionalProperties": false,
                    "description": "Last known data point at the first and last backtest origin",
                    "properties": {
                      "from": {
                        "type": "string"
                      },
                      "to": {
                        "type": "string"
                      }
                    },
                    "required": ["from", "to"],
                    "type": "object"
                  },
                  "rmse": {
                    "type": "number"
                  }
                },
                "required": ["coverage95", "mae", "mape", "n", "rmse"],
                "type": "object"
              },
              "bands": {
                "additionalProperties": false,
                "properties": {
                  "method": {
                    "type": "string"
                  },
                  "origins": {
                    "type": "number"
                  }
                },
                "required": ["method", "origins"],
                "type": "object"
              },
              "benchmark": {
                "additionalProperties": false,
                "properties": {
                  "method": {
                    "type": "string"
                  },
                  "rmse": {
                    "type": "number"
                  }
                },
                "required": ["method", "rmse"],
                "type": "object"
              },
              "consensus": {
                "additionalProperties": false,
                "properties": {
                  "description": {
                    "type": "string"
                  },
                  "participants": {
                    "type": "number"
                  },
                  "points": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "date": {
                          "type": "string"
                        },
                        "median": {
                          "type": "number"
                        },
                        "p25": {
                          "type": "number"
                        },
                        "p75": {
                          "type": "number"
                        },
                        "top10": {
                          "type": "number"
                        }
                      },
                      "required": ["date", "median"],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "survey_date": {
                    "type": "string"
                  },
                  "track_record": {
                    "additionalProperties": false,
                    "description": "Past mean absolute error of the survey and of this model on the same forecast origins and target months, by months ahead of the last published data point (index 0 = one month)",
                    "properties": {
                      "consensus_mae": {
                        "items": {
                          "type": "number"
                        },
                        "type": "array"
                      },
                      "model_mae": {
                        "items": {
                          "type": "number"
                        },
                        "type": "array"
                      },
                      "note": {
                        "type": "string"
                      },
                      "origins": {
                        "additionalProperties": false,
                        "properties": {
                          "from": {
                            "type": "string"
                          },
                          "to": {
                            "type": "string"
                          }
                        },
                        "required": ["from", "to"],
                        "type": "object"
                      },
                      "samples": {
                        "items": {
                          "type": "number"
                        },
                        "type": "array"
                      }
                    },
                    "required": ["consensus_mae", "model_mae", "note", "origins", "samples"],
                    "type": "object"
                  }
                },
                "required": ["description", "points", "survey_date"],
                "type": "object"
              },
              "disclaimer": {
                "type": "string"
              },
              "engine": {
                "description": "lote: daily batch models; sitio: computed on request",
                "enum": ["lote", "sitio"],
                "type": "string"
              },
              "horizon": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "band_80": {
                      "items": false,
                      "maxItems": 2,
                      "minItems": 2,
                      "prefixItems": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "number"
                        }
                      ],
                      "type": "array"
                    },
                    "band_95": {
                      "items": false,
                      "maxItems": 2,
                      "minItems": 2,
                      "prefixItems": [
                        {
                          "type": "number"
                        },
                        {
                          "type": "number"
                        }
                      ],
                      "type": "array"
                    },
                    "date": {
                      "type": "string"
                    },
                    "value": {
                      "type": "number"
                    }
                  },
                  "required": ["band_80", "band_95", "date", "value"],
                  "type": "object"
                },
                "type": "array"
              },
              "key": {
                "type": "string"
              },
              "members": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "method": {
                      "type": "string"
                    },
                    "weight": {
                      "type": "number"
                    }
                  },
                  "required": ["method", "weight"],
                  "type": "object"
                },
                "type": "array"
              },
              "method": {
                "type": "string"
              },
              "name": {
                "type": "string"
              },
              "unit": {
                "type": "string"
              }
            },
            "required": ["attribution", "backtest", "bands", "benchmark", "disclaimer", "engine", "horizon", "key", "method", "name", "unit"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1b54bcb916052a2f6828299218308548f9b3e460ccb7ebb25bca02cd6c79ccbd"
        },
        {
          "name": "get_release_calendar",
          "title": "Get the official release calendar",
          "description": "List the scheduled INDEC releases (CPI inflation, EMAE activity, wages, trade, industry, construction, employment, poverty) between two dates, each with date, time in Argentina, report name, period covered and the series keys it updates. Use it to answer \"when is the next inflation figure out\" or to know whether a value is about to change. Defaults to the next 60 days from today. Only INDEC for now. Read-only, no side effects, no authentication. Rate limited to 60 calls per minute per IP. Data updates at most once per business day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "First day to include, YYYY-MM-DD, Argentina time. Defaults to today.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "to": {
                "description": "Last day to include, YYYY-MM-DD. Defaults to 60 days after from.",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "from": {
                "type": "string"
              },
              "releases": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "type": "string"
                    },
                    "period": {
                      "type": "string"
                    },
                    "report": {
                      "type": "string"
                    },
                    "series": {
                      "items": {
                        "type": "string"
                      },
                      "type": "array"
                    },
                    "source": {
                      "type": "string"
                    },
                    "time": {
                      "type": "string"
                    }
                  },
                  "required": ["date", "period", "report", "series", "source", "time"],
                  "type": "object"
                },
                "type": "array"
              },
              "time_zone": {
                "type": "string"
              },
              "to": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["attribution", "from", "releases", "time_zone", "to", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ca679bc7deacd34dab73c1d872ecda6cdaa7d22bc0d81a50fdc85c16806b5f31"
        },
        {
          "name": "get_series",
          "title": "Get a series' history",
          "description": "Return the historical values of one series with its metadata (name, unit, frequency, source, page URL, last date and value). Use it for past and current values; use get_projection for future ones. Needs a key from search_series; well-known keys: bcra:27 monthly inflation, bcra:28 annual inflation, bcra:4 retail USD rate, bcra:5 wholesale USD rate, bcra:1 reserves, bcra:7 BADLAR rate, bcra:44 TAMAR rate, bcra:31 UVA, bcra:30 CER. Without range or from it returns the last year for daily series and the last five years for the rest. At most 500 points, the most recent ones; a note says how many older points were left out. An unknown key returns an error that asks to search first. Read-only, no side effects, no authentication. Rate limited to 60 calls per minute per IP. Data updates at most once per business day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "from": {
                "description": "Start date as YYYY-MM or YYYY-MM-DD; rounded down to the first day of that month. Takes precedence over range.",
                "pattern": "^\\d{4}-\\d{2}(-\\d{2})?$",
                "type": "string"
              },
              "key": {
                "description": "Series key with its source prefix, as returned by search_series: \"bcra:27\", \"datos:143.3_NO_PR_2004_A_31\", \"derivada:brecha_blue\".",
                "maxLength": 120,
                "minLength": 3,
                "type": "string"
              },
              "range": {
                "description": "Time window ending at the last available value: 1m, 3m, 6m, 1y, 5y or max (full history). Ignored if from is given.",
                "enum": ["1m", "3m", "6m", "1y", "5y", "max"],
                "type": "string"
              }
            },
            "required": ["key"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "string"
              },
              "category": {
                "type": "string"
              },
              "frequency": {
                "description": "D daily, M monthly, T quarterly, S semiannual, A annual",
                "type": "string"
              },
              "key": {
                "type": "string"
              },
              "last_date": {
                "type": "string"
              },
              "last_value": {
                "type": "number"
              },
              "name": {
                "type": "string"
              },
              "note": {
                "type": "string"
              },
              "points": {
                "description": "[date YYYY-MM-DD, value], oldest first",
                "items": {
                  "items": false,
                  "maxItems": 2,
                  "minItems": 2,
                  "prefixItems": [
                    {
                      "type": "string"
                    },
                    {
                      "type": "number"
                    }
                  ],
                  "type": "array"
                },
                "type": "array"
              },
              "source": {
                "type": "string"
              },
              "unit": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["attribution", "category", "frequency", "key", "last_date", "last_value", "name", "points", "source", "unit", "url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d6b0ac11e91cf961e84592996bcfccb4e0922f7c3aa9e7d79a8cfce1570d45dd"
        },
        {
          "name": "get_snapshot",
          "title": "Get today's headline indicators",
          "description": "Return the current value of Argentina's headline indicators in one call: USD retail and wholesale (BCRA), blue, MEP and CCL dollars, the blue FX gap, country risk (EMBI), monthly and annual inflation, BADLAR and TAMAR rates and international reserves. Each comes with its date, source, page URL and the change versus 7 days, 30 days (previous month for monthly series) and one year earlier. Use it for \"how is the economy doing today\" or to compare now against a week, a month or a year ago; use get_series for history, get_projection for the future and get_weekly_summary for the narrative of a closed week. Indicators whose source does not answer are listed under \"missing\" instead of failing the call. Read-only, no side effects, no authentication. Rate limited to 60 calls per minute per IP. Data updates at most once per business day.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "as_of": {
                "description": "Date in Argentina when the snapshot was built",
                "type": "string"
              },
              "attribution": {
                "type": "string"
              },
              "indicators": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "changes": {
                      "additionalProperties": false,
                      "properties": {
                        "month": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
