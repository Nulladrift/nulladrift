        },
        {
          "name": "find_alternatives",
          "title": "Find alternatives",
          "description": "Find alternatives to an AI infrastructure product listed on Infrabase.ai. Products doing the same primary job rank first, then products sharing a secondary job, then the rest of its categories. Returns the anchor product, the alternatives in that order and the total count. Data is hand-verified. CC-BY-4.0. Each result includes an infrabase_url for attribution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "eu_only": {
                "description": "Only alternatives headquartered in Europe",
                "type": "boolean"
              },
              "limit": {
                "description": "Alternatives to return, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "slug": {
                "description": "Infrabase product slug as returned by search_tools, e.g. replicate. A product name or domain such as \"Together AI\" or \"fal.ai\" also works.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find alternatives"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:bc11e66a1647973e7b5b43c4464c63348783526753a91b5ee374e7c8e1ead0b6"
        },
        {
          "name": "get_tool",
          "title": "Get tool details",
          "description": "Get the full Infrabase.ai record for one AI infrastructure product: description, jobs, pricing model and starting price, free trial, open source and licence, hosting, compliance (GDPR, SOC 2, HIPAA), HQ country, icon, a screenshot of its site and links. Data is hand-verified. CC-BY-4.0. Each result includes an infrabase_url for attribution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "slug": {
                "description": "Infrabase product slug as returned by search_tools, e.g. replicate. A product name or domain such as \"Together AI\" or \"fal.ai\" also works.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get tool details"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7474af43dcd10af24b8da05cb561a3fc870dc69a3fa9ecb0d0cf887f8c3df190"
        },
        {
          "name": "list_european_providers",
          "title": "List European providers",
          "description": "List AI infrastructure providers headquartered in Europe, for data residency and sovereignty questions. Optionally narrow by category or job; results come in pages, with the total and the next offset. Data is hand-verified. CC-BY-4.0. Each result includes an infrabase_url for attribution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Directory category to browse, e.g. inference-apis",
                "enum": ["agents", "audio", "fine-tuning", "frameworks-stacks", "inference-apis", "media-generation", "observability-analytics", "prompt-engineering", "vector-databases"],
                "type": "string"
              },
              "job": {
                "description": "What the product does for a developer, e.g. gpu-compute, hosted-inference-api",
                "enum": ["agent-framework", "agent-memory", "agent-payments", "agent-platform", "ai-browser-automation", "ai-search", "decision-model", "embedding-api", "fine-tuning-platform", "gpu-compute", "hosted-inference-api", "image-generation-api", "inference-engine", "llm-evaluation", "llm-gateway", "llm-guardrails", "llm-observability", "llm-orchestration-framework", "llm-router", "local-inference-runtime", "model-hub", "model-lab-api", "music-generation-api", "prompt-management", "rag-framework", "serverless-gpu-platform", "speech-to-text", "text-to-speech", "vector-database", "video-generation-api", "voice-agent-platform", "workflow-builder"],
                "type": "string"
              },
              "limit": {
                "description": "Providers to return, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Providers to skip, for paging",
                "minimum": 0,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List European providers"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7610588cd4c8ab1251b3ac126dd1ff99d8329620d83be6e62e99a6018f893ddb"
        },
        {
          "name": "list_models",
          "title": "List models with verified prices",
          "description": "List every AI model with verified per-provider pricing on Infrabase.ai: its slug, how many providers have a verified price and the cheapest one. The slug is accepted by model_prices, which returns the full price table. Data is hand-verified. CC-BY-4.0. Each result includes an infrabase_url for attribution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List models with verified prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ae435a55e80bbf9d25baf157709329af660b04e6a55d6c4858734882ac904261"
        },
        {
          "name": "model_prices",
          "title": "Model prices by provider",
          "description": "Verified per-token prices for an AI model across hosting providers, ranked cheapest first by blended cost (3:1 input to output). Each row has input, output and cached prices per 1M tokens in the provider's own currency, the source pricing page and the date it was verified. CC-BY-4.0. Each result includes an infrabase_url for attribution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "eu_only": {
                "description": "Only providers headquartered in Europe",
                "type": "boolean"
              },
              "model": {
                "description": "Model slug from list_models, e.g. gpt-oss-120b. The model name also works.",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Model prices by provider"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1fe1fa654cc3ce1a285334d61ef5a50188e233b6050fc84ea38b9c4cf8c48e82"
        },
        {
          "name": "request_featured_listing",
          "title": "Request a featured listing",
          "description": "Sends a featured-listing request for a product to Infrabase.ai. Call it only after the user has confirmed. It sends their email address to Infrabase; a person replies by email. Calling it charges nothing.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "email": {
                "description": "Email address Infrabase.ai replies to",
                "type": "string"
              },
              "message": {
                "description": "Optional note from the requester about the listing",
                "type": "string"
              },
              "product": {
                "description": "Slug of an existing Infrabase.ai listing",
                "type": "string"
              },
              "product_name": {
                "description": "Name of a product not yet listed",
                "type": "string"
              },
              "product_url": {
                "description": "URL of a product not yet listed",
                "type": "string"
              }
            },
            "required": ["email"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Request a featured listing"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0d5bdb3ed96d2507f091f877d60ffb56edd22459a24f6e1489d1cb53c73fee0d"
        },
        {
          "name": "search_tools",
          "title": "Search AI infrastructure tools",
          "description": "Search Infrabase.ai, a hand-verified directory of AI infrastructure products: inference APIs, GPU clouds, vector databases, agent frameworks, observability, gateways and more. Filter by free text, category, job (what the product does) or European headquarters. Returns each product's name, slug, tagline, jobs, pricing model, HQ country, icon and links, plus the total match count. Each result's slug is accepted by get_tool and find_alternatives. CC-BY-4.0. Each result includes an infrabase_url for attribution.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "category": {
                "description": "Directory category to browse, e.g. vector-databases",
                "enum": ["agents", "audio", "fine-tuning", "frameworks-stacks", "inference-apis", "media-generation", "observability-analytics", "prompt-engineering", "vector-databases"],
                "type": "string"
              },
              "eu_only": {
                "description": "Only companies headquartered in Europe",
                "type": "boolean"
              },
              "gdpr": {
                "description": "true: only products that state GDPR compliance",
                "type": "boolean"
              },
              "job": {
                "description": "What the product does for a developer, e.g. vector-database, llm-gateway, speech-to-text. Matches primary and secondary jobs.",
                "enum": ["agent-framework", "agent-memory", "agent-payments", "agent-platform", "ai-browser-automation", "ai-search", "decision-model", "embedding-api", "fine-tuning-platform", "gpu-compute", "hosted-inference-api", "image-generation-api", "inference-engine", "llm-evaluation", "llm-gateway", "llm-guardrails", "llm-observability", "llm-orchestration-framework", "llm-router", "local-inference-runtime", "model-hub", "model-lab-api", "music-generation-api", "prompt-management", "rag-framework", "serverless-gpu-platform", "speech-to-text", "text-to-speech", "vector-database", "video-generation-api", "voice-agent-platform", "workflow-builder"],
                "type": "string"
              },
              "limit": {
                "description": "Results to return, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Results to skip, for paging",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Free text search across name, tagline, description and jobs",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search AI infrastructure tools"
          },
