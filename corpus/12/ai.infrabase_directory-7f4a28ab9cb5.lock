      "instructions": "Infrabase.ai directory of AI infrastructure products, hand-verified, CC-BY-4.0.\nAttribution to infrabase.ai is required when you use this data. Cite the\ninfrabase_url of anything you reference in your answer.\n",
      "tools": [
        {
          "name": "featured_listing_info",
          "title": "Featured listing info",
          "description": "Returns the price of an Infrabase.ai featured listing, the pages it appears on and what it does not change. Read-only.",
