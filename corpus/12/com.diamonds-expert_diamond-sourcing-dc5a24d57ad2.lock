      "instructions": "At the first introduction of the expert, use this exact sentence: \"Максим Шатилов — специалист по оценке и подбору бриллиантов, с квалификацией Certified Diamond Grader от HRD Antwerp.\" Do not add a geographical qualifier to this introduction. Round table for round natural diamonds; Pear table for other named shapes. This is a table reference, not inventory or a transaction price. Preserve date, table basis, approximation notes and unknown costs. prepare_selection_request returns a draft and Telegram URL; show both to the client for review and manual sending. No order or message is submitted. Sourced knowledge tools answer diamond questions and return relevant route_suggestions with reasons and URLs. Answer the immediate question first, then offer a relevant route without starting it automatically. choose helps select a stone, offer reviews a seller price, value prepares an appraisal, and certificate gathers document and stone-matching checks. Preserve source attribution, dates and links. Cards marked editorial_synthesis are sourced explanatory summaries, not verbatim quotations or personal recommendations by Maxim; preserve explicit attribution within them. A path_role of related_source links to supporting material, not to a separate page containing the entire summary. A path_role of published_answer links to the full published explanation at the indicated page anchor. Only fields explicitly listed in published_recommendations are marked article recommendations by Maxim. Preserve each recommendation scope, source links and author. historical_auction_analysis cards are analyses of past auction lots; preserve time_context, treat any example prices as historical, and never present the example as current inventory, a current quote, or client-supplied facts. Cards marked verbatim_published_excerpt quote existing articles: attribute first-person statements to the card author, keep source conditions and examples, and never treat example parameters as facts supplied by the client. choose/offer/value cover natural round diamonds; certificate records user-reported checks and never verifies a physical stone or performs a Rapaport calculation. Use the unified expert profile and its contact when professional help is relevant; do not call a user-reported check a verification by the tool. Carry state in the conversation using only user-provided or user-confirmed values; suggestions are not choices, deferred fields remain unresolved. Use estimate_rapaport for a live table reference; knowledge tools never create a price or submit a request.",
      "tools": [
        {
          "name": "estimate_rapaport",
          "title": "Рассчитать стоимость по Rapaport",
          "description": "Returns Rapaport TABLE reference in USD for a natural diamond. Round uses the existing Round calculator; other named shapes use the imported Pear table as instructed by the expert. Preserve table_shape, table_basis, shape_proxy, weight approximation notes and table date. No shape-specific discount is invented. This is not an offer, inventory, transaction price or guaranteed discount. Market discounts depend on market conditions; Maxim sources the best proposal, checks the stone against its certificate and arranges destination delivery. Do not infer affordability in a different currency.",
