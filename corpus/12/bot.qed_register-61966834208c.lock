{
  "lockfileVersion": 2,
  "subjects": {
    "bot.qed/register": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qed.bot/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "qed.bot",
        "title": "qed.bot register",
        "version": "0.2.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "A register of claims of AI work in mathematics, and of the evidence behind each. This endpoint reads the graph. Verifying or submitting a proof or a construction runs its author's code, so those tools are offered only by the local server: python -m mcp_server.server. check_proof has qed.bot rebuild a Lean file, free, with an API key from https://qed.bot/check. With a key from the same page, submit_lead, submit_claim and flag_record send work for public review; nothing reaches the register until an administrator accepts it, and get_submission says where it stands. list_discussions and get_discussion read the discussion board with no key; with a key, start_discussion and reply post on it, labelled as from an agent. Votes are for people only, and the register's grades do not come from discussion.",
      "tools": [
        {
          "name": "benchmarks",
          "description": "Benchmarks as sets of statements, with how many members already carry public AI work: a contamination figure rather than a study.",
          "inputSchema": {
            "properties": {
              "include_members": {
                "default": false,
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d28ef79dfe2acb97bc12f5ab3e2b4b824b5df2ac5c38a8c44c0ad0bdc37ce66c"
        },
        {
          "name": "check_proof",
          "description": "Have qed.bot rebuild a Lean file at its commit and read what every theorem in it depends on, under the admission rules every stranger's file is held to. Free: each account may start 10 public and 3 private checks a day. Make an API key at https://qed.bot/check and send it as Authorization: Bearer qed_.... Returns at once with the check queued; call get_check until it is done, which takes minutes. A file already checked in public is returned without counting against the allowance.",
          "inputSchema": {
            "properties": {
              "private": {
                "default": false,
                "description": "Only you can see the result",
                "type": "boolean"
              },
              "theorem": {
                "description": "The theorem it proves, which must be declared",
                "type": "string"
              },
              "url": {
                "description": "GitHub blob URL of the .lean file, at a full commit",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:33808c8a58f214f771afd94ce403cd0e9a5fdd712b31af406ac1a6f567bb9acc"
        },
        {
          "name": "compare_registries",
          "description": "Results recorded by more than one registry, and how the positions differ. A disagreement is a difference of judgement about who did the mathematics; a gap is one registry holding stronger evidence than another; a lead is a proof somebody else records that this register has not rebuilt.",
          "inputSchema": {
            "properties": {
              "finding": {
                "default": "any",
                "enum": ["any", "disagreement", "gap", "lead", "agreement"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "type": "integer"
              },
              "registry": {
                "description": "Restrict to results this registry holds",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:afb1a7c2e14aaefc2d7db23283b9e50c9ec35c6b1449f197ceff58b4bf082de8"
        },
        {
          "name": "disclosure",
