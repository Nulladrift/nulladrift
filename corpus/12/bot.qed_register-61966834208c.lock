        {
          "name": "flag_record",
          "description": "Ask for a correction to a record: say what is wrong, with sources. Sent as a correction. Needs an API key, free from https://qed.bot/check, sent as Authorization: Bearer qed_.... It goes to review: nothing in the register changes until an administrator accepts it in public, and grades are never bought. Returns the submission's id; poll get_submission with it.",
          "inputSchema": {
            "properties": {
