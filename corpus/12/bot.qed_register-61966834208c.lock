{
  "lockfileVersion": 2,
  "subjects": {
    "bot.qed/register": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://qed.bot/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "qed.bot",
        "title": "qed.bot register",
        "version": "0.2.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "A register of claims of AI work in mathematics, and of the evidence behind each. This endpoint reads the graph. Verifying or submitting a proof or a construction runs its author's code, so those tools are offered only by the local server: python -m mcp_server.server. check_proof has qed.bot rebuild a Lean file for credits, with an API key from https://qed.bot/check.",
      "tools": [
        {
          "name": "benchmarks",
          "description": "Benchmarks as sets of statements, with how many members already carry public AI work: a contamination figure rather than a study.",
          "inputSchema": {
            "properties": {
              "include_members": {
                "default": false,
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d28ef79dfe2acb97bc12f5ab3e2b4b824b5df2ac5c38a8c44c0ad0bdc37ce66c"
        },
        {
          "name": "check_proof",
          "description": "Have qed.bot rebuild a Lean file at its commit and read what every theorem in it depends on, under the admission rules every stranger's file is held to. Costs one credit, or two for a private check; buy credits and make an API key at https://qed.bot/check, and send it as Authorization: Bearer qed_.... Returns at once with the check queued; call get_check until it is done, which takes minutes. A file already checked in public is returned free, and a check that stops on qed.bot's side is refunded.",
          "inputSchema": {
            "properties": {
              "private": {
                "default": false,
                "description": "Only you can see the result (2 credits)",
                "type": "boolean"
              },
              "theorem": {
                "description": "The theorem it proves, which must be declared",
                "type": "string"
              },
              "url": {
                "description": "GitHub blob URL of the .lean file, at a full commit",
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9a0bd407e3a4e5ee76dcfd613f7dd43808c720fc31895ed170349343c2192121"
        },
        {
          "name": "compare_registries",
          "description": "Results recorded by more than one registry, and how the positions differ. A disagreement is a difference of judgement about who did the mathematics; a gap is one registry holding stronger evidence than another; a lead is a proof somebody else records that this register has not rebuilt.",
          "inputSchema": {
            "properties": {
              "finding": {
                "default": "any",
                "enum": ["any", "disagreement", "gap", "lead", "agreement"],
                "type": "string"
              },
              "limit": {
                "default": 25,
                "type": "integer"
              },
              "registry": {
                "description": "Restrict to results this registry holds",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:afb1a7c2e14aaefc2d7db23283b9e50c9ec35c6b1449f197ceff58b4bf082de8"
        },
        {
          "name": "disclosure",
          "description": "Announcements of results, graded for how much of what they claim can be inspected: whether each result is named, written up, and published with a checkable artifact.",
          "inputSchema": {
            "properties": {
              "org": {
                "description": "Restrict to one organisation",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:3c7fd8f36c150e4cb31ae9fbd21758f3370eebd5b3c588e861911eb55abc1284"
        },
        {
          "name": "get_check",
          "description": "A paid check's status and verdict, by the id check_proof returned. Needs the same API key for a private check.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "The check's id",
                "type": "integer"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:d04c2981dc657a5184787fc5c92405860b6f3a0b7a5fa7cee89e0b713b7fa35e"
        },
        {
          "name": "get_formalisation",
          "description": "One declaration in full: its sources, related formalisations, main results, the results held here it joins and on what key, Palomar's registrations of it, and any contradiction between what it declares and what a rebuild found.",
          "inputSchema": {
            "properties": {
              "id": {
                "description": "owner/repo for a root declaration, owner/repo/path, or its GitHub URL",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:fb46fc478c2828b29170bec88c5d42772fcd4d684234a7cbcca05f6c32926c8a"
        },
        {
          "name": "get_statement",
