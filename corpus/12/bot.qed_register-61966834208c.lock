          "inputSchema": {
            "properties": {
              "org": {
                "description": "Restrict to one organisation",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
