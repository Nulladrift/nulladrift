        {
          "name": "list_systems",
          "description": "Track record per AI system, computed from recorded claims. Not a benchmark: which statements attract attention has little to do with how hard they are.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 25,
                "type": "integer"
              },
              "name": {
                "description": "Restrict to one system",
