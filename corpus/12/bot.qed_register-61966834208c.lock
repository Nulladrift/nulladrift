        {
          "name": "submit_claim",
          "description": "Add a claim of AI work to a record the register holds, with the systems and people behind it, when it was done, what it achieved and its sources. A Lean proof linked at its commit is queued for qed.bot's checker. Autonomy is recorded as declared until an administrator grades it from the sources. Needs an API key, free from https://qed.bot/check, sent as Authorization: Bearer qed_.... It goes to review: nothing in the register changes until an administrator accepts it in public, and grades are never bought. Returns the submission's id; poll get_submission with it.",
          "inputSchema": {
            "properties": {
              "date": {
                "description": "When the work was done, YYYY-MM-DD",
                "type": "string"
              },
              "details": {
                "description": "Optional details, 20 to 5000 characters",
                "type": "string"
