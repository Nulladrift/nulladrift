        {
          "name": "search_formalisations",
          "description": "Every formalization.yaml the register has read, with what each declares about its own axioms, unproved goals, assumed literature, automation and review, and who has checked it: this register, Palomar, or nobody independent of its authors.",
          "inputSchema": {
            "properties": {
              "checked_by": {
                "description": "Who checked it; none for declarations nobody independent has checked",
                "enum": ["Palomar", "qed.bot", "none"],
                "type": "string"
              },
              "flag": {
                "enum": ["alignment", "axioms", "comparator", "contradicted", "divergences", "literature", "original", "unproved"],
                "type": "string"
              },
              "held_only": {
                "description": "Only declarations joined to a result held here",
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "type": "integer"
              },
              "method": {
                "enum": ["autonomous", "agent", "copilot", "manual", "other"],
                "type": "string"
              },
              "query": {
                "description": "Text to match in name, repository, path, authors or models",
                "type": "string"
              },
              "review": {
                "enum": ["peer-reviewed", "author-verified", "agent-reviewed", "self-assessed", "unchecked", "other", "not stated"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
