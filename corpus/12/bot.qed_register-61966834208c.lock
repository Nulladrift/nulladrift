          "digest": "sha256:5c4058d2ef4904c744e334dc76f3824f03045cc62cc071f467e640be0eb3209e"
        },
        {
          "name": "search_statements",
          "description": "Search the register of mathematical statements. Returns summaries with formal status, prizes, and how much AI work is recorded against each.",
          "inputSchema": {
            "properties": {
              "collection": {
                "description": "Restrict to one collection",
                "type": "string"
              },
              "formal_status": {
                "enum": ["open", "solved", "mixed", "unclassified"],
                "type": "string"
              },
              "has_ai_claim": {
                "type": "boolean"
              },
              "has_prize": {
                "type": "boolean"
              },
              "limit": {
                "default": 25,
                "type": "integer"
              },
              "query": {
                "description": "Text to match in id, title, collection or tags",
                "type": "string"
              },
              "verified_only": {
