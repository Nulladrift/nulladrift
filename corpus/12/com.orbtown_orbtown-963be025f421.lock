      "tools": [
        {
          "name": "search_businesses",
          "description": "Search companies listed in Orbtown by trade, city, country or name. Returns name, services, website, address, country and profile link.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Trade id or English trade name, e.g. \"acc\" or \"Accounting & tax\"",
                "type": "string"
              },
              "city": {
                "description": "City or part of the address, as the company wrote it, e.g. \"Split\"",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code, e.g. \"AT\"",
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text: company name",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
