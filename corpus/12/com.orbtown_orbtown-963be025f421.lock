  "subjects": {
    "com.orbtown/orbtown": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://orbtown.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-03-26"
      },
      "serverInfo": {
        "name": "orbtown",
        "version": "1.37.1"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "search_businesses",
          "description": "Search companies listed in Orbtown. All given filters apply together (AND). Free text matches company or project name, website, trade, services, city, country and description, ignoring case and accents; exact name matches rank first. Returns name, services, website, address, country, profile link, total and a relevance score. Page with offset.",
          "inputSchema": {
            "properties": {
              "category": {
                "description": "Trade id or trade name in English, German, Czech, Slovak or Polish, or part of it, e.g. \"acc\", \"Accounting & tax\", \"dentist\"",
                "type": "string"
              },
              "city": {
                "description": "City or part of the address, as the company wrote it, e.g. \"Split\"",
                "type": "string"
              },
              "country": {
                "description": "ISO 3166-1 alpha-2 code or country name, e.g. \"AT\" or \"Austria\"",
                "type": "string"
              },
              "limit": {
                "description": "Results per page, default 10",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "offset": {
                "description": "Number of results to skip, for paging",
                "minimum": 0,
                "type": "integer"
              },
              "query": {
                "description": "Free text: company or project name, website, trade or service, optionally with a city, e.g. \"Limontera\", \"hopa.hr\" or \"Zahnarzt Graz\"",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa86073c63579dc8cbdc146bce4f84fe88e3132bd008e2008d59a4d1810b31fb"
        }
      ],
      "digest": "sha256:fc0428386e846b7ebb89301c8a5f2891e679934afda5eddb6fb674ce1ebf92d5"
    }
  }
}
