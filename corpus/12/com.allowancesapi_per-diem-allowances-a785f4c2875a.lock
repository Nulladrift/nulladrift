      "instructions": "U.S. government travel per diem and overseas allowances from the official GSA, DTMO and State Department (DSSR) tables, in USD per day.\n\nChoosing a source. GSA tools: per diem inside the continental U.S. for civilian federal travel, by state and city or ZIP. DTMO tools: Department of Defense rates; OCONUS covers foreign countries plus Alaska, Hawaii and U.S. territories, CONUS covers the states. Use DTMO for military, DoD and defense-contractor travel. DSSR tools: State Department rates for civilian U.S. government employees abroad: per diem, COLA, hardship, danger pay, LQA, TQSA, education. If the traveller's agency is unknown, use GSA for CONUS and DSSR abroad, and say which source you used. FedRooms lists worldwide participating hotels, without prices. FEMA tools answer a different question: whether a lodging property is on FEMA's Hotel and Motel National Master List (Fire Safety Act compliance), by FEMA ID, ZIP, state and city, or a free-text search; they return no rates.\n\nFinding a location. search_perdiem (DSSR) and search_dtmo_perdiem (DTMO) take a city or country name of at least three characters. Other tools need an ISO alpha-2 country code or a US-XX state code; get_countries and the locations tools resolve names.\n\nDates. Omit date for today's rates. A date returns the rates in force on that day; DTMO also accepts a fiscal year (Oct 1 to Sep 30). Each result row carries its own effective_date and season; the top-level effective_date is the publication period. Historical dates depend on the plan; a 403 states the restriction. Plan and quota errors are final: relay them, do not retry.\n\nmaximum_perdiem is lodging plus meals and incidentals. Rate results include verification_url, a link to the official government table for that location and date; give it to the user to confirm the figures (verification_url=false omits it).\n\nTool calls need an account sign-in or an X-API-Key header; free Sandbox keys: https://www.allowancesapi.com/register",
      "tools": [
        {
          "name": "calculate_mileage_reimbursement",
          "title": "Mileage reimbursement calculator",
          "description": "Calculate mileage reimbursement with the official GSA rate in effect on the travel date (today if omitted). Provide a distance in miles and the vehicle type: automobile, airplane, motorcycle or moving. For automobile travel, say whether a government-furnished automobile was available, which selects the reduced rate. Returns the rate category, rate and effective date, and the amount rounded to the cent. Use get_mileage for the rates alone.",
          "inputSchema": {
            "properties": {
              "date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Travel date used to select the effective rate. Accepts YYYY-MM-DD or YYYYMMDD; defaults to today. Plan limits: Sandbox and Google add-on accounts may query dates within 30 days of today, Pro the current and previous US fiscal year, Business any date.",
                "example": "2026-07-11",
                "title": "Date"
              },
              "distance": {
                "description": "One-way or total travel distance in miles, from 0.001 through 100,000.",
                "example": 125.5,
                "exclusiveMinimum": 0,
                "maximum": 100000,
                "multipleOf": 0.001,
                "title": "Distance",
                "type": "number"
              },
              "government_vehicle_available": {
                "default": false,
                "description": "Optional for automobile calculations and defaults to false. Use true when a government-furnished automobile is authorized and available; false selects the standard privately owned automobile rate.",
                "example": false,
                "title": "Government Vehicle Available",
                "type": "boolean"
              },
              "vehicle_type": {
                "description": "Vehicle or travel category used to select the applicable GSA mileage rate.",
                "enum": ["automobile", "airplane", "motorcycle", "moving"],
                "example": "automobile",
                "title": "MileageCalculatorVehicleType",
                "type": "string"
              }
            },
            "required": ["distance", "vehicle_type"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Mileage reimbursement calculator"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:tools"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:1e1752763ea9c885c9fb5a67d5ba0ae4541d6dcfa4e18854216f5a7a58abefa5"
        },
        {
          "name": "calculate_trip_per_diem",
          "title": "GSA trip per diem calculator",
          "description": "Estimates GSA CONUS per diem for a multi-stop trip: a day-by-day breakdown and totals of payable lodging and M&IE. Each stop has inclusive arrival and departure dates and a GSA destination ID or ZIP code, optionally the actual nightly lodging cost and meals to deduct. Applies the rate in effect each day, 75% M&IE on first and last days, the official meal deductions and the lodging cap (excess reported as overage). Not for Department of Defense or foreign travel.",
          "inputSchema": {
            "properties": {
              "deductible_meals": {
                "description": "Sparse caller-determined meal deductions, keyed by trip date.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "Inclusive trip date on which meals are deducted.",
                      "format": "date",
                      "title": "Date",
                      "type": "string"
                    },
                    "meals": {
                      "description": "Non-empty unique breakfast/lunch/dinner deductions for the date.",
                      "items": {
                        "enum": ["breakfast", "lunch", "dinner"],
                        "title": "GSATripMeal",
                        "type": "string"
                      },
                      "minItems": 1,
                      "title": "Meals",
                      "type": "array"
                    }
                  },
                  "required": ["date", "meals"],
                  "title": "GSATripDeductibleMealsRequest",
                  "type": "object"
                },
                "title": "Deductible Meals",
                "type": "array"
              },
              "stops": {
                "description": "Ordered, contiguous TDY-locality stops for the trip.",
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "arrival_date": {
                      "description": "First calendar date owned by this stop.",
                      "format": "date",
                      "title": "Arrival Date",
                      "type": "string"
                    },
                    "departure_date": {
                      "description": "Shared boundary/return date; the arriving next stop owns a transition date.",
                      "format": "date",
                      "title": "Departure Date",
                      "type": "string"
                    },
                    "location": {
                      "additionalProperties": false,
                      "description": "TDY locality for the stop; not merely the hotel location.",
                      "properties": {
                        "destination_id": {
                          "anyOf": [
                            {
                              "minimum": 0,
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "GSA destination identifier. Destination 0 is Standard CONUS.",
                          "examples": [123],
                          "title": "Destination Id"
                        },
                        "zipcode": {
                          "anyOf": [
                            {
                              "type": "string"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Five-digit US ZIP or ZIP+4. ZIP+4 is normalized to five digits.",
                          "examples": ["20001", "20001-1234"],
                          "title": "Zipcode"
                        }
                      },
                      "title": "GSATripLocationRequest",
                      "type": "object"
                    },
                    "lodging_cost_per_night": {
                      "anyOf": [
                        {
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "number"
                        },
                        {
                          "type": "string"
                        },
                        {
                          "type": "null"
                        }
                      ],
                      "description": "Optional actual room cost applied to every lodging night in this stop. Must be a JSON number with no more than two decimal places.",
                      "examples": [250],
                      "title": "Lodging Cost Per Night"
                    }
                  },
                  "required": ["arrival_date", "departure_date", "location"],
                  "title": "GSATripStopRequest",
                  "type": "object"
                },
                "maxItems": 50,
                "minItems": 1,
                "title": "Stops",
                "type": "array"
              },
              "verification_url": {
                "default": true,
                "description": "Included by default: a link to the official government table for the returned location and date, for the user to confirm the figures. Pass false to omit it.",
                "title": "Verification Url",
                "type": "boolean"
              }
            },
            "required": ["stops"],
            "type": "object"
          },
