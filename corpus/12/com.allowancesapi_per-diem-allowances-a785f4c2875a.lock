        {
          "name": "get_city_pairs",
          "title": "City Pair contract airfares",
          "description": "Returns GSA City Pair Program contract airfares between two codes (see get_city_pair_locations) on `date`, today by default: every matching award with airline, service and one-way USD fares by category (YCA, CA, business and others; null means not offered), valid in either direction. Government contract prices, not live availability; domestic fares exclude passenger and security fees. Other fiscal years depend on the plan; there is no fallback to another date.",
          "inputSchema": {
            "properties": {
              "date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The day the rates must be in force, YYYY-MM-DD; today when omitted. Plan limits: Sandbox and Google add-on accounts may query dates within 30 days of today, Pro the current and previous US fiscal year, Business any date.",
                "title": "Date"
              },
              "destination": {
                "description": "Three-letter airport or international city code; case-insensitive. No city-name expansion.",
                "examples": ["ABE", "LON"],
                "title": "Destination",
                "type": "string"
              },
              "origin": {
                "description": "Three-letter airport or international city code; case-insensitive. No city-name expansion.",
                "examples": ["ABE", "LON"],
                "title": "Origin",
                "type": "string"
              },
              "verification_url": {
                "default": true,
                "description": "Included by default: a link to the official government table for the returned location and date, for the user to confirm the figures. Pass false to omit it.",
                "title": "Verification URL",
                "type": "boolean"
              }
            },
            "required": ["destination", "origin"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "City Pair contract airfares"
          },
          "behavior": {
            "destructive": false,
