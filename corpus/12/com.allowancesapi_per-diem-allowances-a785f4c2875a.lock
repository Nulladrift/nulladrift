          "digest": "sha256:fa4cd3045f79e58c19d2f997b1fcff9c86a1bee0243824925e10dca6196fc965"
        },
        {
          "name": "get_allowances",
          "title": "DSSR allowances by country",
          "description": "Returns State Department (DSSR) allowance rates for every post in a country: cost-of-living (COLA),\nhardship differential, living quarters (LQA), danger pay and education allowances, plus each post's per\ndiem, in force today or on `date`. `type` limits the result to some allowances. For one post use\nget_allowances_by_location or get_allowances_by_postcode; for Department of Defense rates use the DTMO\ntools.\nPosts the State Department removed return no allowances after their last listing.",
          "inputSchema": {
            "properties": {
              "country_iso_code": {
                "description": "ISO 3166-1 alpha-2 country code, e.g. PG for Papua New Guinea; ZZ stands for 'Other Foreign Localities', not a country. Resolve a country name to its code with get_countries (q=name).",
                "examples": ["BE", "JP", "KE"],
                "title": "Country Iso Code",
                "type": "string"
              },
              "date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The day the rates must be in force, YYYY-MM-DD; today when omitted. Plan limits: Sandbox and Google add-on accounts may query dates within 30 days of today, Pro the current and previous US fiscal year, Business any date.",
                "title": "Date"
              },
              "type": {
                "description": "Filter returned allowances. Unknown values are ignored.<br/>If not specified, all allowances are returned.<br/>Canonical values: cola, hardship, lqa, danger_pay, education, perdiem.<br/>Aliases accepted: cost_of_living, cost-of-living, danger, danger-pay, livingquarters.",
                "enum": ["cola", "hardship", "lqa", "danger_pay", "education"],
                "items": {
                  "type": "string"
                },
                "title": "Allowance type",
                "type": "array"
              },
              "verification_url": {
                "default": true,
                "description": "Included by default: a link to the official government table for the returned location and date, for the user to confirm the figures. Pass false to omit it.",
                "title": "Verification URL",
                "type": "boolean"
              }
            },
            "required": ["country_iso_code"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "DSSR allowances by country"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp:tools"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:9f3bc5714a8fcf0b8eced5e8f0f5d6cc9f9b671fcf1f34240bbe7c82b09acc93"
        },
