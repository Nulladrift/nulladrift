        {
          "name": "cola_calculator_by_postcode",
          "title": "DSSR COLA calculator",
          "description": "Calculates the DSSR cost-of-living allowance (COLA) for a post: the COLA rate in percent and the annual and biweekly USD amounts for the given base salary and family size, today or on `date`. The post is identified by its five-digit DSSR post code (see get_dssr_locations_by_country). Use get_allowances for the COLA rate alone.",
          "inputSchema": {
            "properties": {
              "base_salary": {
                "description": "Basic annual salary, excluding U.S. locality pay; including Overseas Comparability Pay.",
                "minimum": 1000,
                "title": "Base Salary",
                "type": "integer"
              },
              "date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The day the rates must be in force, YYYY-MM-DD; today when omitted. Plan limits: Sandbox and Google add-on accounts may query dates within 30 days of today, Pro the current and previous US fiscal year, Business any date.",
                "title": "Date"
              },
              "family_size": {
                "description": "The number of family members, including the FS/DoS employee/contractor",
                "minimum": 1,
                "title": "Family Size",
                "type": "integer"
              },
              "postcode": {
                "description": "5-digit DSSR post code (no zero-padding)",
                "maximum": 99999,
                "minimum": 10000,
                "title": "DSSR post code",
                "type": "integer"
              }
            },
            "required": ["base_salary", "family_size", "postcode"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "DSSR COLA calculator"
          },
          "behavior": {
