        {
          "name": "get_city_pair_locations",
          "title": "City Pair airport and city codes",
          "description": "Returns the airport or metropolitan codes GSA uses in City Pair airfare awards for the fiscal year of `date` (today by default), with city, state and country. GSA decides whether a city uses airport codes (DCA, IAD) or a metro code (WAS), so resolve codes here before get_city_pairs. `q` (3+ characters) matches a code exactly or a city or country name by substring. Fiscal years other than the current one depend on the plan.",
          "inputSchema": {
            "properties": {
              "date": {
                "anyOf": [
                  {
                    "format": "date",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "The day the rates must be in force, YYYY-MM-DD; today when omitted. Plan limits: Sandbox and Google add-on accounts may query dates within 30 days of today, Pro the current and previous US fiscal year, Business any date.",
                "title": "Date"
              },
              "q": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "description": "Match a code exactly or a city/country name by substring; case-insensitive. Omit to list every code of the fiscal year.",
