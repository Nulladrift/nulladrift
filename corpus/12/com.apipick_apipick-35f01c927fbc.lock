        {
          "name": "lei_lookup",
          "description": "Resolve a legal entity through the GLEIF Legal Entity Identifier registry. Look up a known LEI code, or search by legal name to find one. Returns the official legal name, registered and headquarters addresses, jurisdiction, legal form, registration status, national company-register number, and BIC codes — plus optional parent/subsidiary ownership links. Use for counterparty KYC, entity resolution, and corporate-structure research. Provide either lei or name. Costs 3 credit(s) per call.",
          "inputSchema": {
            "properties": {
              "country": {
                "description": "Optional ISO 3166-1 alpha-2 country code to narrow a name search, e.g. 'US'.",
                "type": "string"
              },
              "include_relationships": {
                "default": false,
                "description": "When looking up by `lei`, also return the direct parent, ultimate parent, and direct-subsidiary count.",
                "type": "boolean"
              },
              "lei": {
                "description": "A 20-character LEI code (ISO 17442), e.g. 'HWUPKR0MPOU8FGXBT394'. Mutually exclusive with `name`.",
                "type": "string"
              },
              "limit": {
                "default": 5,
                "description": "Maximum records to return for a name search.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "name": {
                "description": "Legal entity name to search for, e.g. 'Tesla, Inc.'. Mutually exclusive with `lei`.",
                "type": "string"
              }
            },
