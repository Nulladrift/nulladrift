        {
          "name": "scan_dependencies",
          "description": "Check a list of open-source dependencies for known vulnerabilities using OSV.dev. For each package version, returns matching advisories with CVE aliases, a computed CVSS base score, severity rating, CWE ids, and the versions that fix the issue — plus a rollup by severity. Use it to audit a lockfile, gate a release, or answer 'is this version safe to install'. Costs 5 credit(s) per call regardless of package count.",
          "inputSchema": {
            "properties": {
              "packages": {
                "description": "The dependencies to check, as exact installed versions.",
                "items": {
                  "properties": {
                    "ecosystem": {
                      "description": "Package ecosystem. Supported: Alpine, Android, CRAN, ConanCenter, Debian, GitHub Actions, Go, Hex, Linux, Maven, NuGet, Packagist, Pub, PyPI, RubyGems, SwiftURL, Ubuntu, crates.io, npm. Common aliases (npm/pip/cargo/go/maven) are accepted.",
                      "type": "string"
