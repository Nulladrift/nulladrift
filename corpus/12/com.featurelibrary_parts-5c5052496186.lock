{
  "lockfileVersion": 2,
  "subjects": {
    "com.featurelibrary/parts": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://featurelibrary.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "feature-store",
        "title": "Feature Library",
        "version": "0.2.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": false
        },
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "The Feature Library: measured web parts with guides and pitfalls. Read the rules first (get_brief) and follow them in order. Plan with get_kit and find_parts (free), and read the playbooks it names with get_playbook; read a part’s card with get_part before using it; get_recipe wires several parts; install(id) returns a part’s files marked with your licence. Finish with check(). Licensed tools need a licence token as a bearer header.",
      "tools": [
        {
          "name": "check",
          "title": "Check versions, licences and the checklist",
          "description": "Free. The rules version (its hash) and the catalogue version, the checks to run on the build before calling it done, the runnable checks (get_check) that prove the ones a checklist can’t, and, with a licence token, the account’s licences and the parts it owns. Pass evidence (what the checks returned, area by area) and it says whether the build may be called done, and what is missing.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "decisions": {
                "description": "Optional: the library defaults this build broke, as design decisions: [{ rule, chose, why }]. The person’s wishes win over defaults; say why for each.",
                "items": {
                  "properties": {
                    "chose": {
                      "type": "string"
                    },
                    "rule": {
                      "type": "string"
                    },
                    "why": {
                      "type": "string"
                    }
                  },
                  "type": "object"
                },
                "type": "array"
              },
              "evidence": {
                "description": "Optional, before calling a build done: { layout: [layoutProbe.steps/toggle results], rings: [layoutProbe.rings results], motion: { reducedMotion: true, how }, performance: { msPerUpdate, target }, placement: { widths: [1440, 375] } }. Only layout, rings and motion (they protect people) can fail a build; the rest is worth a look.",
                "type": "object"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f3528b1333424ccd5ed7a0403f3cc6688c4c672d00924cf09e7d3df4958f234"
        },
        {
          "name": "check_look",
          "title": "Check a build’s touch on a look",
          "description": "Free. Runs the library’s own checker on how a build uses a look: each override is one of the look’s knobs, of its kind and in range; each switch is one of its options; and text contrast holds (WCAG AA) in each mode at the dials’ extremes with the overrides applied. Returns ok, the problems in sentences, the label the build may use (\"In Splash\", \"Splash, tuned\"; none for inspired) and, for a tuned build that passes, the stylesheet to load after the look’s.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "dials": {
                "additionalProperties": {
                  "type": "number"
                },
                "description": "Optional: { liveliness, fidelity, density }, each 0 to 100; the look’s own for any left out.",
                "type": "object"
              },
              "level": {
                "description": "Optional: tuned when overrides are given, otherwise exact.",
                "enum": ["exact", "tuned", "inspired"],
                "type": "string"
              },
              "look": {
                "description": "The look id, e.g. splash.",
                "type": "string"
              },
              "mode": {
                "description": "Optional: check one mode; every mode the look has when left out.",
                "enum": ["light", "dark"],
                "type": "string"
              },
              "overrides": {
                "description": "Optional: knob values, { \"--accent\": \"#0f6e66\" } for every mode, or per mode { \"light\": {…}, \"dark\": {…} }.",
                "type": "object"
              },
              "switches": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Optional: switch values by attribute, e.g. { \"data-splash-drips\": \"liquid\" }.",
                "type": "object"
              }
            },
            "required": ["look"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:49b08223ca8d65a84b0d64361cbe91942d6fce4022d9d5526e155555c5126f2a"
        },
        {
          "name": "find_parts",
          "title": "Find parts for a job",
          "description": "Free. Ranks the library’s parts for a job described in words, with why each fits and what it costs on the target platform (median ms a frame at 1920×1080 on a measured machine and tier). Strong matches for the job come first (each part says match: strong or loose), then looser ones; within each, parts that fit the platform and budget lead, then those over the budget (overBudget), then those that need WebGPU on a platform without it (blocked). For an interface job, 3D, simulation and effects parts rank lower. Each part says what it runs in (runsIn): raw WebGPU passes, a three.js scene, a 2D canvas or the DOM; a three.js part needs a three.js app, so check it against your renderer before installing. When the words name a look or ask for one, the matching looks come back too. Search by the job, not by a name.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "budget": {
                "description": "Ms a frame the part may cost on that platform (the worse of GPU and CPU).",
                "type": "number"
              },
              "job": {
                "description": "What the part has to do, e.g. \"date range filter for a dashboard\" or \"grass that bends round a walker\".",
                "type": "string"
              },
              "kit": {
                "description": "Optional: a kit id (e.g. dashboard) to search only its parts and those of the kits it is built on.",
                "type": "string"
              },
              "limit": {
                "description": "At most this many parts (default 10).",
                "maximum": 30,
                "minimum": 1,
                "type": "integer"
              },
              "platform": {
                "description": "The target: desktop (the reference laptop, the default), laptop (integrated GPU), phone, a machine id from a part’s costs, or \"no-webgpu\" for browsers without it.",
                "type": "string"
              }
            },
            "required": ["job"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2d4ebea9d881b7911454fb51bac38c54186baa22b31e9e42e9e209ebec92f028"
        },
        {
          "name": "get_brief",
          "title": "Get the rules",
          "description": "Free. The agent protocol (rules.md) to follow, in order, when building with the library’s parts. Also the resource feature-store://rules.md.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:826c896aeecb36f7e0e4ddbb08b3d319c5d94322df1b39bf68a3bae2b06158a1"
        },
        {
          "name": "get_check",
          "title": "Get a runnable check",
          "description": "Free. Scripts you run on your own build, in its page, for what a checklist can’t prove: layout-probe measures that nothing moves when the view changes state (column edges, row tops, controls that come and go) and that every focus ring shows whole. Without an id, the list with what each proves and how to run it; with an id, the script itself as text. Run them at every width you claim and pass the results to check({ evidence }).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Optional: the check id, e.g. layout-probe.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:f4b16b20928af1a21d8eff9c0fec6a6883824f71686b880582ef786606afa4c4"
        },
        {
          "name": "get_kit",
          "title": "Get a kit for a kind of build",
          "description": "Free. A tested set of parts for a kind of build (by kit id, or matched to the purpose in words), built on the foundations, with a tone applied when given: the parts with why, role, stack, needs and costs, the optional candidates, the glue you build yourself, what the library lacks, the tone’s settings and per-part knobs, and the looks that fit, at the level asked for (exact, tuned or inspired: what may change, what must stay); and the page shapes the purpose calls for (starting points for the page as a whole), or, when none fits, how to compose one.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "level": {
                "description": "How closely the build follows a look: exact (the look as shipped; the dials and switches only, the default), tuned (also the look’s knobs, in range, then check_look) or inspired (your own look carrying its character; never its name).",
                "enum": ["exact", "tuned", "inspired"],
                "type": "string"
              },
              "platform": {
                "description": "Optional target platform for the costs shown, as for find_parts.",
                "type": "string"
              },
              "purpose": {
                "description": "A kit id, or the kind of build in words, e.g. \"a calm dashboard for finance\".",
                "type": "string"
              },
              "tone": {
                "description": "Optional tone id from the catalogue (e.g. strict, refined, playful).",
                "type": "string"
              }
            },
            "required": ["purpose"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:97a0d9b24050c3710870d187f789c9e656bf4ab7c61cc6382a688ce29b0ce3c6"
        },
        {
          "name": "get_part",
          "title": "Get a part’s card",
          "description": "The free card always (summary, role, needs, costs, public API signatures, pitfall titles, pairs-with). With a licence token that owns the part: the licensed card too, with every pitfall in full, the guide, documented signatures, the module’s files and the changelog. Read every pitfall before building with it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The part id (an old id resolves to the renamed part).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:61ff1b431ef41d31c1e6f7ac469efe1557649d1b10e7a78e4017d595f3df52a5"
        },
        {
          "name": "get_playbook",
          "title": "Read a playbook",
          "description": "Free. The library’s playbooks: how parts are placed, moved, made accessible and kept fast, with the reason for every rule and a checklist. Without an id, the list (title, summary, the parts each covers); with an id, the playbook in full as markdown. get_kit and get_recipe name the playbooks that cover their parts: read those (playbooks) before wiring the parts; the ones under playbooksIfUsed only when the build uses that part or does that work.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Optional: the playbook id, e.g. placement or accessibility.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e9f0ee1f62db1a1a86855801196b916cb66ebbf0d4592cda72056eaa40f639a0"
        },
        {
          "name": "get_recipe",
          "title": "Get a recipe for a build",
          "description": "Licensed (needs a licence token). The wiring for a scenario: the kit that fits, the steps in order (tier, install, tokens, wiring between the parts, glue, what to build yourself, tone, checks), and for each part you own its pitfalls in full and its guide. Parts you don’t own are listed with their titles, to buy or replace.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "level": {
                "description": "How closely the build follows a look: exact (the look as shipped; the dials and switches only, the default), tuned (also the look’s knobs, in range, then check_look) or inspired (your own look carrying its character; never its name).",
                "enum": ["exact", "tuned", "inspired"],
                "type": "string"
              },
              "platform": {
                "description": "Optional target platform, as for find_parts.",
                "type": "string"
              },
              "scenario": {
                "description": "The build in words, or a kit id.",
                "type": "string"
              },
              "tone": {
                "description": "Optional tone id.",
                "type": "string"
              }
            },
            "required": ["scenario"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:255660b4a11ab3fdd9c6c651e3415a795a98a3047f7972621b66adce88e180ff"
        },
        {
          "name": "get_shape",
          "title": "Get a page shape",
          "description": "Free. The page shapes: starting points for a whole page by kind (app workspace, dashboard, product reveal, service landing, story, personal homepage, event, shop, game), each with its reader’s job, reading path, first screen, header, structure, phone, motion, what fits and what not to do. Without an id, the list; with an id, the shape in full; with \"compose\", the method for a page no shape fits, with a worked example. A shape is where to start, never a template: pick one or compose, and name it in your notes.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Optional: a shape id, or \"compose\".",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e07b14938b0129ec4425e5796bc5db24e98c3aa966c5218db72903f4aee94131"
        },
        {
          "name": "install",
          "title": "Install a part",
          "description": "Licensed (needs a licence token that owns the part). Returns the part’s module/ files, each marked with the licence and this fetch, as resources to write unchanged into a folder of their own; plus NOTICE.md where there is one and the licence. Pin a version to be sure of what you get. Also takes a look id (e.g. splash, with a whole-library licence): the look’s stylesheet, its backdrop where it has one, the shared dials and the plain tokens, and the order to load them in.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The part id, or a look id.",
                "type": "string"
              },
              "path": {
                "description": "Optional: one file of it, as listed in files (e.g. module/charts.ts): returned as plain text, marked, with its SHA-256. For clients that cannot show the files as resources, or a reply too large to read at once.",
                "type": "string"
              },
              "version": {
                "description": "Optional: the version to install (only the current one is served).",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:399d91033d1fda7de2339bdeb15eb382c273f3dd9fb0d7b331df3ab568c27dd6"
        }
      ],
      "resources": [
        {
          "uri": "feature-store://rules.md",
          "name": "rules",
          "title": "Building with the Feature Library",
