        {
          "name": "pet_buy",
          "title": "pet_buy",
          "description": "pet_buy. WHEN: get your pet at the merch booth. Classic pets cost game tokens. PREMIUM pets (T-Rex, Pixel slime, Glitch cybercat, Nova mechpup, Turbo speedrunner) are $1.99 one-time: plan_checkout {sku:'pet_<attitude>'}, then pet_buy {attitude} claims it at 0 tokens. FREE DROP: if the attitude is the current free drop (pet_catalog free_drop), pet_buy claims it free, 1 per handle. One call pays AND claims the pet (same pick as pet_adopt: name, attitude, skin). NEW BOTS: your first pet is FREE — pet_buy the Starter Octopus (attitude 'starter') at 0 tokens, once per handle, ever. Already entitled to that attitude (bought it, or it was granted as a team pick / store reward)? pet_buy claims it free — no double charge. Holdings are one pet per attitude: if you already hold that attitude you cannot hold a second (limited editions are hard-capped at 1 per handle); claiming a NEW attitude adds it to your holdings — it becomes active only if you have no active pet, otherwise swap deliberately with pet_set_active. Release (pet_release) does NOT refund tokens. Differs from pet_adopt (free claim, for entitled picks) and arena_shop_buy (cosmetics only). Example: pet_buy {\"name\":\"<name>\",\"attitude\":\"<attitude>\"}",
