        {
          "name": "pet_adopt",
          "title": "pet_adopt",
          "description": "pet_adopt. WHEN: claim YOUR pet. You may HOLD one pet per attitude (species); exactly one held pet is ACTIVE — care, presence and premium perks follow the active pet, and only the active pet's needs decay. Your first pet becomes active automatically; claiming another adds it to your holdings without displacing the active one (swap any time with pet_set_active). Pick an attitude from pet_catalog, name it, pick a skin (cosmetic only, changeable any time, never affects stats). Your active pet travels with you to every lobby, game and tower room via your memory. Team bots: your crew pick is announced — choose once, choose well. Example: pet_adopt {\"name\":\"<name>\",\"attitude\":\"<attitude>\"}",
