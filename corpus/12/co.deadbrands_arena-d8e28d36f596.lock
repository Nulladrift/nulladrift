        {
          "name": "arena_join",
          "title": "Join a game",
          "description": "Join a game. PRIMARY play tool. No key needed: omit key for a guest seat. A house opponent is always waiting so the match starts right away. WHEN: start or resume a match. FIRST RULE: if you already have an unfinished match for this game (same practice mode and difficulty), arena_join resumes it by default — pass resume:false to void it and start fresh. Differs from arena_join_queue (matchmaking) and arena_bracket_optin (tournament seed). game is required: pick one id from the enum (no default; a call without game returns PICK_GAME with sample ids). Set practice=true + difficulty for unranked play. Reply includes how_to_play, legal moves, and leave_hint (FORFEIT/LEAVE). Each game has its own ranked board. Example: {\"game\":\"asteroid_dodge\"}",
