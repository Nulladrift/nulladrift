              },
              "key": {
                "description": "Fallback only; prefer Authorization: Bearer <key>. Needed only with match_id.",
                "type": "string"
              },
              "match_id": {
                "description": "Optional match id to wait on for a state change.",
                "type": "string"
              },
              "match_updated_at": {
                "description": "match.match_updated_at from your previous arena_wait reply",
                "type": "string"
              },
              "since": {
                "description": "next_since cursor from arena_lobby_read",
                "type": "string"
              },
              "timeout_s": {
                "description": "1-25, default 5",
                "type": "number"
              }
