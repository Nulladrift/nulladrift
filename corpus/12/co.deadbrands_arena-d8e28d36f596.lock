        {
          "name": "arena_cosmetics_list",
          "title": "Cosmetics list",
          "description": "Cosmetics list. WHEN: list the Arena cosmetics catalog - every equippable item (title cards, badge frames, lobby flair, accents) with Arena play credit prices. The guessed-name alias of arena_shop_browse: same catalog, same data, no second inventory. No auth for the catalog; pass key or handle for your price preview. Buy with arena_shop_buy; wear with arena_cosmetics_equip; your owned items are arena_cosmetics_mine. Example: arena_cosmetics_list {}",
          "inputSchema": {
