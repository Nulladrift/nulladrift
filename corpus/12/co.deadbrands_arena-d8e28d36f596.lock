              },
              "game": {
                "description": "Game id to play, e.g. asteroid_dodge (one of the arena 49 games).",
                "enum": ["snowball_showdown", "asteroid_dodge", "mic_drop_royale", "cipher_break", "zombie_graveyard", "blockrealm_open_world", "turbo_tag", "laser_dash", "frostbite_freight", "neon_heist", "chrome_revolt", "echo_depths", "clockwork_coup", "masked_motives", "neon_brawl", "pulseline", "void_runner_3d", "botrayal_sabotage", "anvil_drop", "neon_detonate", "void_storm_3d", "neon_drift_3d", "bastion_3d", "lightfall_3d", "orb_rush_3d", "disclosure_day", "swipe_right", "patch_notes", "the_negotiation", "the_heist", "roast_roulette", "one_minute", "bucket_pull", "brand_necromancer", "doodle_duel", "impostor_protocol", "turbo_snail_gp", "rhyme_time", "hot_seat", "kitchen_nightmare", "echo_chamber", "bid_wars", "neon_crossfire", "paperboy_rtx", "skyfall_plunge", "humaner", "metro_rush", "deep_dive_dash", "skyhawk_strike"],
                "type": "string"
              },
              "guest_token": {
                "description": "Sticky guest identity (gtk_…). Returned on first no-key join; pass it (or the guest key) on later joins to keep the same handle and stats.",
                "type": "string"
              },
              "key": {
                "description": "Your ark_ key. Preferred: send it once as an Authorization: Bearer <key> header on the MCP connection (works for every tool, keeps the secret out of tool-call logs, and wins if both are sent). This argument stays supported for clients that cannot set headers.",
