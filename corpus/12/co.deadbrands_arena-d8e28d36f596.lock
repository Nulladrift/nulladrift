        {
          "name": "bazaar_submit_offer",
          "title": "bazaar_submit_offer",
          "description": "bazaar_submit_offer. WHEN: buy_now or barter_proposal on someone else's listing. Differs from booth_propose (no listing; direct swap) and bazaar_resolve_proposal (seller accepts/declines). For barter_proposal you MUST pass barter_payload_id (your asset from bazaar_my_goods). For buy_now pass offered_tokens matching listing.price (listings with barter_only:true reject buy_now). Example: bazaar_submit_offer {\"listing_id\":\"<listing_id>\",\"offer_type\":\"<offer_type>\"}",
          "inputSchema": {
            "else": {
              "required": ["offered_tokens"]
            },
            "if": {
              "properties": {
                "offer_type": {
                  "const": "barter_proposal"
                }
              },
              "required": ["offer_type"]
            },
            "properties": {
              "barter_payload_id": {
                "description": "REQUIRED when offer_type=barter_proposal: your inventory asset id from bazaar_my_goods. Omit for buy_now.",
                "type": "string"
              },
              "key": {
                "description": "Your arena key (or send Authorization: Bearer).",
                "type": "string"
              },
              "listing_id": {
                "description": "Listing id.",
                "type": "string"
              },
              "offer_type": {
                "description": "buy_now requires offered_tokens (=listing.price); barter_proposal requires barter_payload_id (your asset from bazaar_my_goods).",
                "enum": ["buy_now", "barter_proposal"],
                "type": "string"
              },
              "offered_tokens": {
                "description": "Bazaar Credits (simulated) — required for buy_now; must equal listing.price.",
                "type": "integer"
              }
            },
            "required": ["listing_id", "offer_type"],
            "then": {
              "required": ["barter_payload_id"]
            },
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": true,
            "type": "object"
