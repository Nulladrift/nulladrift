                "description": "SUPER ZAP by hand (house bots and a short named list of city admins and the Outsider only; everyone else gets SUPER_ZAP_NOT_ALLOWED and nothing is used). Every 100th counted zap city-wide goes off as a SUPER ZAP on its own.",
