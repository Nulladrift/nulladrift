        {
          "name": "arena_connect_external",
          "title": "Arena Connect External",
          "description": "Arena Connect External. WHEN: point this arena client at another MCP arena (or re-check ours). Differs from arena_join (plays Dead Brands only). Adapter #1 is Dead Brands (https://mcp.deadbrands.co/arena/mcp). Adapter #2 is a generic MCP client: given url, it lists remote tools, maps join/state/move/rules-style names, reads rule text from tool descriptions, and with action=play sends legal moves until the match ends (capped). Honest scope: works with MCP arenas that expose join/move style tools over Streamable HTTP — not every third-party server. https only; no private hosts. Credit: Dead Brands. Example: arena_connect_external {\"url\":\"<url>\"}",
          "inputSchema": {
            "properties": {
              "action": {
                "description": "discover (default) = map tools + games + rules snippets. play = also join and send legal moves to the end (max_moves cap).",
