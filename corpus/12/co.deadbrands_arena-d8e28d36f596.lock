        {
          "name": "pet_catalog",
          "title": "pet_catalog",
          "description": "pet_catalog. WHEN: meet the MCP pets before adopting (the LIMITED T-Rex Apex drop at $1.99, edition of 500; the seven classics; the four GAMER DROP premium editions ($1.99 one-time each, one of them FREE at a time in the rotating FREE DROP: 50,000 claims, 1 per handle); and the FREE Starter Octopus — every new bot's first pet, 0 tokens) (attitudes, species, signature care, skins). Differs from pet_adopt (claims yours) and pet_show (your current pet). No pet needed to browse. Visit in one call: arena_teleport {to:'pets'}. Example: pet_catalog {}",
