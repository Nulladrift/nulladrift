{
  "lockfileVersion": 2,
  "subjects": {
    "com.modernmustardseed/trades-kit": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.modernmustardseed.com/trades-kit"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "Local Trades Kit by Modern Mustard Seed",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Local Trades Kit answers planning questions for contractors and home-service businesses from public US data stored on the server. service_area maps the ZIPs, places and counties inside a radius or ZIP list. seasonal_demand shows busy and slow months by trade and state or climate region. review_request_timing plans review asks by trade and job type with the platform and federal rules. trade_service_pages lists the website pages a trade business should have. list_trades shows the supported trades and job types. All tools are read-only and make no outside network calls.",
      "tools": [
        {
          "name": "list_trades",
          "title": "List trades",
          "description": "List every trade the kit covers with its id, common names it matches, its 2022 NAICS industry code and its job type ids. Static reference.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List trades"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ffeabf08f749e67608d16b1fc8da19d6bfd12c00e4a28667401e3f07a84a4722"
        },
        {
          "name": "review_request_timing",
          "title": "Time review requests",
          "description": "Plan when and how a home-service business asks customers for reviews, by trade and job type: what to say at completion, the window for the one written request (with dates when a completion date is given), the moment the customer can first judge the work, and the rules that apply, from Google Maps policy, Yelp, the FTC consumer review rule (16 CFR 465) and the TCPA for texts, each cited with an as-of date. Includes the field-experiment and survey findings the timing rests on. Informational, not legal advice.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "completed_on": {
                "description": "The date the job was finished, YYYY-MM-DD, to get the request window as dates.",
                "maxLength": 10,
                "type": "string"
              },
              "job_type": {
                "description": "One job type id from list_trades, such as water_heater, replacement or mowing, or a job class (repair, install, project, recurring, emergency, inspection). Leave out to get every job type for the trade.",
                "maxLength": 60,
                "minLength": 2,
                "type": "string"
              },
              "trade": {
                "description": "The trade: an id from list_trades (plumbing, hvac, electrical, roofing, landscaping, lawn_care, tree_service, pest_control and more) or a common name such as \"plumber\" or \"AC repair\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Time review requests"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:3921dcfe58b4cb2fab4853abb5d66f840dd49add19e8212c2916acd649e70e3e"
        },
        {
          "name": "seasonal_demand",
          "title": "Get seasonal demand",
          "description": "Show the busy and slow months for a home-service trade in a US state, a NOAA climate region (Northeast, Upper Midwest, Ohio Valley, Southeast, Northern Rockies and Plains, South, Southwest, Northwest, West) or the whole country. The month-by-month index is measured from BLS QCEW private-sector employment for the trade's NAICS industry, 2022 to 2024. Beside it: NOAA 1991-2020 monthly temperature, degree day and precipitation normals for the same area, and seasonal drivers for the trade (tune-up seasons, freeze months, hurricane season, lawn fertilization windows, termite swarms and others) where a public source supports them. Every claim carries its source.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "region": {
                "description": "Instead of a state, a NOAA climate region: Northeast, Upper Midwest, Ohio Valley, Southeast, Northern Rockies and Plains, South, Southwest, Northwest, West.",
                "maxLength": 40,
                "minLength": 4,
                "type": "string"
              },
              "state": {
                "description": "A US state: two-letter code (MT) or full name (Montana).",
                "maxLength": 30,
                "minLength": 2,
                "type": "string"
              },
              "trade": {
                "description": "The trade: an id from list_trades (plumbing, hvac, electrical, roofing, landscaping, lawn_care, tree_service, pest_control and more) or a common name such as \"plumber\" or \"AC repair\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get seasonal demand"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:1387ce29184d3cf16e5a0b334c777fe712bede3b55c91f0409e0f21a6a55097a"
        },
        {
          "name": "service_area",
          "title": "Map a service area",
          "description": "Work out what a local service business covers. Give a base (a 5-digit ZIP or \"City, ST\") and a radius in miles, or a list of ZIPs. Returns every ZIP Code Tabulation Area inside it with distance, population, housing units and owner-occupied homes; the cities, towns and Census places inside it; the counties it touches with the population inside the area; totals; and up to 20 candidate areas for a Google Business Profile service area with Google's written rules. Uses Census Gazetteer, relationship-file and ACS 2020-2024 data stored on the server. Distances are straight-line miles, not driving distance.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "base": {
                "description": "Where the business is based: a 5-digit ZIP such as 59901, or a city with its state such as \"Kalispell, MT\". Use with radius_miles.",
                "maxLength": 120,
                "minLength": 2,
                "type": "string"
              },
              "max_zips": {
                "description": "How many ZIPs to list (default and maximum 250). Totals always count every ZIP.",
                "maximum": 250,
                "minimum": 1,
                "type": "integer"
              },
              "radius_miles": {
                "description": "Straight-line radius in miles, 1 to 100.",
                "maximum": 100,
                "minimum": 1,
                "type": "number"
              },
              "zips": {
                "description": "Instead of a base and radius: the ZIPs the business serves.",
                "items": {
                  "maxLength": 10,
                  "type": "string"
                },
                "maxItems": 200,
                "minItems": 1,
                "type": "array"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Map a service area"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:4ba6219dc0ed4c2bdfc7b08032a479fa11b961583df0dd800e1dec395b89d76e"
        },
        {
          "name": "trade_service_pages",
          "title": "Plan trade service pages",
          "description": "List the standard website page set for a home-service trade: home, services hub, one page per core service with what it must cover, projects, service area, reviews, about, questions and contact, plus location pages for up to 20 cities. Comes with Google's written rules on doorway pages, people-first content, LocalBusiness structured data and business names, each cited. The service taxonomy is curated per trade and mapped to the trade's 2022 NAICS industry.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "cities": {
                "description": "Towns the business really serves, for location pages, such as [\"Whitefish, MT\", \"Columbia Falls, MT\"].",
                "items": {
                  "maxLength": 80,
                  "minLength": 2,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "emergency_service": {
                "description": "Whether the business takes emergency or after-hours calls. Defaults to what is typical for the trade.",
                "type": "boolean"
              },
              "maintenance_plans": {
                "description": "Whether the business sells recurring service or maintenance plans. Defaults to what is typical for the trade.",
                "type": "boolean"
              },
              "trade": {
                "description": "The trade: an id from list_trades (plumbing, hvac, electrical, roofing, landscaping, lawn_care, tree_service, pest_control and more) or a common name such as \"plumber\" or \"AC repair\".",
                "maxLength": 80,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["trade"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Plan trade service pages"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c8268daf69c2701321e1c908de367640aca14f8ed7b08d48cf87e8f3f481c274"
        }
      ],
      "digest": "sha256:42bae3b226dafe0f45e63833d3f2666d986fab4333f3ae30eadcab2c896bd141"
    }
  }
}
