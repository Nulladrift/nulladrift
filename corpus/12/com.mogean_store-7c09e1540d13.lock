                                "high": {
                                  "type": "integer"
                                },
                                "low": {
                                  "type": "integer"
                                }
                              },
                              "required": ["high", "low"],
                              "type": "object"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "Brands only: the band around the brand's store count (its own stores and outlets). In-store department locations are not in it; they are sub_locations."
                        },
                        "registry": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "publisher_agency": {
                                  "type": "string"
                                },
                                "record_count": {
