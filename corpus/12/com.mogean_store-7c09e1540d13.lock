        {
          "name": "search",
          "title": "Search the catalog",
          "description": "Search Mogean's catalog of US point-of-interest datasets: brands, categories, states, government sources and flagship datasets. Returns matching products with an id, title, URL and short text; pass an id to fetch for the full product card.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cursor": {
                "description": "next_cursor from a previous page of the same search.",
                "maxLength": 200,
                "type": "string"
              },
              "kinds": {
                "description": "Limit results to these product kinds.",
                "items": {
                  "enum": ["brand", "category", "state", "gov", "flagship"],
                  "type": "string"
                },
                "maxItems": 5,
                "type": "array"
              },
              "limit": {
                "description": "Results per page (default 10, at most 50).",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "What to look for, e.g. a brand, category, state or registry name.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise (default) returns a short summary; detailed adds the full structured result as text.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
            "properties": {
              "attribution": {
                "type": "object"
              },
              "data": {
                "additionalProperties": false,
                "properties": {
                  "next_cursor": {
                    "anyOf": [
                      {
                        "type": "string"
                      },
                      {
                        "type": "null"
                      }
                    ]
                  },
                  "release": {
                    "additionalProperties": false,
                    "properties": {
                      "as_of": {
                        "type": "string"
                      },
                      "drop_date": {
                        "type": "string"
                      },
                      "manifest_version": {
                        "type": "string"
                      },
                      "pricing_config_version": {
                        "type": "string"
                      }
                    },
                    "required": ["as_of", "drop_date", "manifest_version", "pricing_config_version"],
                    "type": "object"
                  },
                  "results": {
                    "items": {
                      "additionalProperties": false,
                      "properties": {
                        "also_from": {
                          "description": "Brands only, and only on a suggestion rather than a match: the parent company this brand shares with a brand the query matched (or the parent company the query named). Absent on every direct match.",
                          "type": "string"
                        },
                        "id": {
                          "type": "string"
                        },
                        "kind": {
                          "enum": ["brand", "category", "state", "gov", "flagship"],
                          "type": "string"
                        },
                        "locations": {
                          "anyOf": [
                            {
                              "minimum": 0,
                              "type": "integer"
                            },
                            {
                              "type": "null"
                            }
                          ],
                          "description": "The location count of a category, state, government source or flagship. Null for a brand, whose store count is the record_count band; a brand's in-store department locations are sub_locations."
                        },
                        "price_from": {
                          "anyOf": [
                            {
                              "additionalProperties": false,
                              "properties": {
                                "amount_usd": {
                                  "type": "number"
                                },
                                "licence": {
                                  "const": "internal",
                                  "type": "string"
                                },
                                "term": {
                                  "enum": ["one_time", "subscription"],
                                  "type": "string"
                                }
