      "instructions": "Mogean sells US point-of-interest datasets. Read the resource mogean://tool-guide for the tools on this connection, their limits and the result format.",
      "tools": [
        {
          "name": "fetch",
          "title": "Fetch a product",
          "description": "Fetch one catalog product by the id that search returned: what it contains, coverage, fill rates, freshness, provenance and published prices per licence tier.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "A product id from search, such as brand:<slug>, or a product sku.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "response_format": {
                "default": "concise",
                "description": "concise (default) returns a short summary; detailed adds the full structured result as text.",
                "enum": ["concise", "detailed"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "outputSchema": {
            "additionalProperties": false,
