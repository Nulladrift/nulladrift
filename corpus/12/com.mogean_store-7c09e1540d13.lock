                      },
                      "geometry": {
                        "anyOf": [
                          {
                            "type": "object"
                          },
                          {
                            "type": "null"
                          }
                        ]
                      },
                      "key": {
                        "type": "string"
                      },
                      "kind": {
                        "enum": ["brand", "category", "state", "gov", "flagship"],
