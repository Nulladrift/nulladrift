        {
          "name": "mogean_count",
          "title": "Count locations",
          "description": "Count sellable US locations, exactly, from the current data release. Use fact for one brand, category, leaf category or government source, optionally in a state; for a brand in a state, a city works when it is one of the top cities listed on that brand's page for that state. Use cut for any combination of brands, categories, leaf categories, states, government sources and tiers. Ids from search are accepted as they are. Returns a link to the page a person can check, the cut and full_cut_hash mogean_quote takes, and whether mogean_quote can price that cut at the internal licence (higher licences cost more and can still be refused).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "cut": {
                "additionalProperties": false,
                "description": "A custom cut: every non-empty list narrows the selection.",
                "properties": {
                  "brands": {
                    "description": "Brands: ids from search (brand:<slug>) or bare slugs (fetch metadata.key).",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "categories": {
                    "description": "Categories: ids from search (category:<slug>) or bare slugs (fetch metadata.key).",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "columns": {
                    "description": "Column names to deliver; empty means every column.",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "format": {
                    "description": "Delivery format.",
                    "enum": ["csv_parquet", "csv", "parquet", "geojson"],
                    "type": "string"
                  },
                  "gov_sources": {
                    "description": "Government sources: ids from search (gov:<slug>) or bare slugs (fetch metadata.key).",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "include_geometry": {
                    "description": "Add the building-geometry file.",
                    "type": "boolean"
                  },
                  "leaf_categories": {
                    "description": "Leaf categories: slugs from fetch (metadata.category.leaf_slug), or a leaf name fetch shows when it names one leaf.",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "states": {
                    "description": "States: two-letter US codes, or ids from search (state:TX).",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 200,
                    "type": "array"
                  },
                  "tiers": {
                    "description": "Provenance tier groups: pipeline, government, fsq, overture. PIPELINE_AUTHORITATIVE, GOVERNMENT_AUTHORITATIVE and OVERTURE_SUPPLEMENT (as by_tier names them) select their group; the three FSQ_ tiers are selected together as fsq.",
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 6,
                    "type": "array"
                  }
                },
                "type": "object"
              },
              "fact": {
                "additionalProperties": false,
                "description": "A fact question: one of brand, category, leaf or gov; optionally a state; for a brand inside a state, optionally a city.",
                "properties": {
                  "brand": {
                    "description": "A brand: the id search returned (brand:<slug>) or the bare slug from fetch's metadata.key.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "category": {
                    "description": "A category: the id search returned (category:<slug>) or the bare slug from fetch's metadata.key.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "city": {
                    "description": "City name; needs brand and state. Only the top cities listed on that brand's page for that state have a count; any other city returns needs_serving_layer.",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "county": {
                    "description": "County counts are not published yet: a county question returns needs_serving_layer with the state's page.",
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "gov": {
                    "description": "A government source: the id search returned (gov:<slug>) or the bare slug from fetch's metadata.key.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "leaf": {
                    "description": "A leaf category: fetch's metadata.category.leaf_slug, or the leaf name fetch shows (metadata.category.leaf) when it names one leaf.",
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "state": {
                    "description": "A two-letter US state code, or the id search returned for a state (state:TX).",
                    "maxLength": 8,
                    "minLength": 2,
                    "type": "string"
                  }
                },
                "type": "object"
              },
