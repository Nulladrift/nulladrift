      },
      "transport": {
        "type": "http",
        "url": "https://mana.bzh/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "mana",
        "title": "MANA — la vie locale française",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "MANA connaît 3 764 277 lieux, commerces, professionnels et associations en France, rangés par code NAF de l'INSEE. Pour une question de terrain — « trouve-moi X près de Y » — appeler `commune` pour obtenir le code INSEE, puis `chercher`. Pour les associations, `associations` : c'est la seule source interrogeable du Répertoire National des Associations. Aucune donnée personnelle n'est rendue : la granularité géographique s'arrête à la commune.",
      "tools": [
        {
          "name": "associations",
          "description": "Les associations déclarées d'une commune ou d'un département, avec leur objet social, issues du Répertoire National des Associations. Utile pour « quelle association fait X près de Y » — une question à laquelle aucune autre source ne répond. NE REND PAS DE CONTACT : le RNA n'en publie aucun, délibérément.",
          "inputSchema": {
            "properties": {
              "commune": {
                "description": "Code INSEE",
                "type": "string"
              },
              "departement": {
                "description": "Code de département",
                "type": "string"
              },
              "limite": {
                "type": "integer"
              },
              "q": {
                "description": "Un mot du nom de l'association",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:a34736719cb0c9d7169dd10c533097129d1038d83fcbd0122bb316bf3e9c4ce7"
        },
        {
          "name": "catalogue",
          "description": "Rend les 11 catégories et leurs sous-catégories, avec le nombre de fiches de chacune. À appeler AVANT `chercher` quand on ne sait pas quel terme employer : les sous-catégories sont un vocabulaire fermé, deviner un nom rend une liste vide.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2e47a6d0b47ad2aa6520eddc2d2959be8171170b79aa3b527fc9200c2ddaf169"
        },
        {
          "name": "chercher",
          "description": "Cherche un lieu, un commerce, un artisan, un professionnel de santé, une association ou un événement en France. À appeler pour toute question du type « trouve-moi X près de Y ». Interroge 3 764 277 fiches actives, rangées par CODE NAF de l'INSEE — pas par mots-clés. Accepte aussi un numéro SIRET (14 chiffres) ou SIREN (9). NE REND NI ADRESSE NI TÉLÉPHONE : la granularité s'arrête à la commune.",
          "inputSchema": {
            "properties": {
              "categorie": {
                "description": "Une des 11 catégories. Ne se combine pas avec « q » : le rangement l'emporte sur le texte.",
                "enum": ["repas", "soin", "beaute", "artisan", "habitat", "boutique", "transport", "sortie", "hotel", "demarche", "entraide"],
                "type": "string"
              },
              "commune": {
                "description": "Code INSEE (5 caractères). Appeler `commune` pour l'obtenir depuis un nom.",
                "type": "string"
              },
              "departement": {
                "description": "Code de département, ex. « 29 »",
                "type": "string"
              },
              "limite": {
                "description": "De 1 à 50 (défaut 20)",
                "type": "integer"
              },
              "q": {
                "description": "Texte libre, ou un numéro SIRET / SIREN",
                "type": "string"
              },
              "sous_categorie": {
                "description": "Ex. « boulange », « kiné », « plombier ». Appeler `catalogue` pour la liste.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:1330bf1b4fba5d2c233702beea5a8ee3f113428ab23c65ac0be245a726224b5c"
        },
        {
          "name": "commune",
          "description": "Trouve le code INSEE d'une commune à partir de son nom. À appeler EN PREMIER : `chercher`, `associations` et `missions` attendent un code INSEE, jamais un nom. Attention, un code INSEE n'est pas un code postal (Crozon : 29042 et 29160).",
          "inputSchema": {
            "properties": {
              "nom": {
                "description": "Nom de la commune",
                "type": "string"
              }
            },
            "required": ["nom"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fe06cfbf1305e3a0f2579b1d2fce72bf3259624327706c177369e40ef2f88d11"
        },
        {
          "name": "missions",
          "description": "Les missions de bénévolat ouvertes, relayées du réseau public API Engagement. Chaque mission porte l'URL de sa source : la candidature se fait chez l'organisateur, jamais ici.",
          "inputSchema": {
            "properties": {
              "commune": {
                "description": "Code INSEE",
                "type": "string"
              },
              "departement": {
                "type": "string"
              },
              "limite": {
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:48094afc0a2eb3a9427ce918b363ff5b8cf1e713832e14d5d685d287ebd2e24d"
        }
      ],
      "digest": "sha256:70ca44ce9b9af7619b0ac2d9938495a331f69a15187f538c41b94833e350f13a"
    }
  }
