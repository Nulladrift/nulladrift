                            "efa": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "gld": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "ndx100": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "schd": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "shy": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "sox": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "sp500": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "tlt": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "vnq": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            }
                          },
                          "type": "object"
                        }
                      ],
                      "description": "A preset name or weights in percent by asset (any total; they are scaled to 100). Assets: sp500 = S&P 500, ndx100 = Nasdaq 100, sox = SOX (Semiconductors), schd = US dividend stocks (SCHD), acwi = MSCI ACWI, efa = Developed ex-US stocks, eem = Emerging market stocks, vnq = US REITs, gld = Gold, shy = US 1–3 year Treasuries, agg = US aggregate bonds, tlt = US long-term Treasuries, btc = Bitcoin. Presets: sixtyForty = sp500 60% + agg 40%; allCountry = acwi 100%; allWeather = sp500 30% + tlt 40% + shy 15% + gld 15%."
                    }
                  },
                  "required": ["portfolio"],
                  "type": "object"
                },
