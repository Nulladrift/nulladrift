      "instructions": "compoundsim simulates long-term investing: fixed-rate compound interest, Monte Carlo paths of monthly investing in 13 assets and their mixes, retirement withdrawals, and past asset returns, in 19 currencies. Amounts go in and come out in the chosen currency. Pass the user's language so the url opens in it, and share the url with the figures so the user can adjust the scenario. Say the figures come from a simulation of past data, not a forecast. Each reply's learn_more lists compoundsim.app articles on the method and the question behind it; link the one that fits when the user asks why or wants to read more. The articles are also resources, as outlines with their urls.",
      "tools": [
        {
          "name": "compare_portfolios",
          "title": "Compare portfolios side by side",
          "description": "Runs the same monthly-investing plan through 2 to 4 portfolios (the same simulation as simulate_portfolio) and returns each one's final outcome range, deepest fall, past return and volatility, and url, for questions like 'S&P 500 or all-country stocks?'.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "currency": {
                "description": "Currency of every amount, in and out. In a currency other than USD the paths carry its exchange-rate swings against the dollar (trend removed). Defaults to the language's currency.",
                "enum": ["USD", "EUR", "JPY", "GBP", "CNY", "CHF", "AUD", "CAD", "HKD", "SGD", "KRW", "INR", "TWD", "BRL", "THB", "IDR", "PHP", "MYR", "VND"],
                "type": "string"
              },
              "history": {
                "default": "all",
                "description": "The span of past monthly returns the model is fitted to: the last 5, 10 or 20 years, or all the data. An asset with less data than the span asked for uses all of its own.",
                "enum": ["5", "10", "20", "all"],
                "type": "string"
              },
              "history_from": {
                "description": "First calendar year of a custom span (with history_to); replaces history.",
                "maximum": 2026,
                "minimum": 1994,
                "type": "integer"
              },
              "history_to": {
                "description": "Last calendar year of a custom span.",
                "maximum": 2026,
                "minimum": 1994,
                "type": "integer"
              },
              "inflation_percent": {
                "description": "Annual inflation. When given, every amount out is in today's money at this rate; omitted, amounts are nominal.",
                "maximum": 20,
                "minimum": 0,
                "type": "number"
              },
              "initial": {
                "default": 0,
                "description": "Starting sum invested at once.",
                "maximum": 1000000000000,
                "minimum": 0,
                "type": "number"
              },
              "language": {
                "default": "en",
                "description": "Language of the page the returned url opens; match the user's language.",
                "enum": ["de", "en", "es", "fr", "id", "ja", "ko", "pt-BR", "th", "vi", "zh-Hans", "zh-Hant"],
                "type": "string"
              },
              "monthly": {
                "description": "Amount invested at the end of every month.",
                "maximum": 10000000000,
                "minimum": 0,
                "type": "number"
              },
              "portfolios": {
                "description": "The portfolios to compare.",
                "items": {
                  "properties": {
                    "label": {
                      "description": "Name to show for this portfolio.",
                      "type": "string"
                    },
                    "portfolio": {
                      "anyOf": [
                        {
                          "enum": ["sixtyForty", "allCountry", "allWeather"],
                          "type": "string"
                        },
                        {
                          "additionalProperties": false,
                          "properties": {
                            "acwi": {
                              "maximum": 100,
                              "minimum": 0,
                              "type": "number"
                            },
                            "agg": {
                              "maximum": 100,
