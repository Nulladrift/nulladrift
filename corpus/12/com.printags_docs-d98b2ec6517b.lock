{
  "lockfileVersion": 2,
  "subjects": {
    "com.printags/docs": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.printags.com/mcp/docs"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Answers questions about Printags (printed PVC, NFC, MIFARE and wooden cards) from the pages of printags.com: what the shop sells and at what price, how to order, the chips, the API and the MCP servers. Read-only: it takes no action. To order cards use the Printags shop MCP server, to create orders from software use the Printags integrator MCP server.",
      "tools": [
        {
          "name": "get_printags_page",
          "title": "Read a Printags page",
          "description": "Returns a page of printags.com as Markdown, from its address (a path such as /en/api-integration/ or a printags.com URL, as returned by search_printags_docs).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "url": {
                "description": "A printags.com URL or a path starting with /.",
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Read a Printags page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:dd647b028fe3301a0e2c87100173314d28f8f8e2c401a60faea75263668078ff"
        },
        {
          "name": "search_printags_docs",
          "title": "Search the Printags docs",
          "description": "Finds the pages, FAQ answers, use cases, articles and shop products of printags.com that answer a question, with the shop's current unit prices excluding VAT. Use it for what Printags sells, how ordering works, which chips exist, prices, or how to use the API and the MCP servers.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Number of results (default 5).",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "locale": {
                "description": "Language of the answers. Defaults to the language of the question.",
                "enum": ["en", "fr_fr"],
                "type": "string"
              },
              "query": {
                "description": "The question or keywords, in English or French.",
                "maxLength": 500,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the Printags docs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d2000aa39a2ac6c7dc60dd2c1f1c165ff7ba31c2cd04da113faff25b7318d017"
        }
      ],
      "digest": "sha256:aa742cd89ad1edce56deb1eceb6dfc7fcbdd2ecca4c1bb5ddd1f959404eb0576"
    }
  }
}
