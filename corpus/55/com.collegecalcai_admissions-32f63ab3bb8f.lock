                "description": "ACT composite (if no SAT).",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "gpa": {
                "description": "Unweighted GPA (if no test score).",
                "maximum": 4,
                "minimum": 0,
                "type": "number"
              },
              "sat": {
                "description": "SAT total.",
                "maximum": 1600,
                "minimum": 400,
                "type": "integer"
              },
              "state": {
                "description": "Only colleges in this state.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
