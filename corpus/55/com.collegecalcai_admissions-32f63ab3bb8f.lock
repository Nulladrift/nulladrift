        {
          "name": "find_colleges_for_score",
          "title": "Colleges for a SAT, ACT or GPA",
          "description": "Answer \"what colleges can I get into with a ___\": buckets every covered U.S. college into safety, target, reach and high reach for one SAT, ACT or unweighted GPA, using each college's real admitted-score data. Optional state filter. Returns counts and example colleges per tier.",
