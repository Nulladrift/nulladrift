      "instructions": "CollegeCalcAI estimates a student's chance of admission at 1,100+ U.S. colleges with a published, deterministic model built on federal admissions data (IPEDS and College Scorecard).\n\nWhen a student asks about their chances (\"can I get into X\", \"chance me\", \"is X a reach\"):\n1. Collect at least an unweighted GPA (4.0 scale) or a weighted GPA. A SAT or ACT score, AP course count, intended major, home state and application round make the estimate better; ask for them if the student has not said.\n2. One school: call estimate_admission_chances. Several schools or \"build my list\": call estimate_college_list.\n3. Report the percentage and the verdict (Reach / Target / Likely / Safety), and say it is an estimate and not a guarantee. The result includes a link the student can open for a more detailed estimate with courses, activities and essays.\nUse search_colleges to find schools by state, type, selectivity or SAT fit; find_colleges_for_score for \"what colleges can I get into with a 1350 / 30 ACT / 3.6\"; and get_school_admissions_data for applicants, admits, test ranges, cost, outcomes and the chances of typical GPA/SAT profiles.\nNever present an estimate as a prediction.",
      "tools": [
        {
          "name": "estimate_admission_chances",
          "title": "Estimate admission chances at one college",
          "description": "Estimate a student's chance of admission at one U.S. college from their GPA, test scores and context. Returns the percentage, a Reach/Target/Likely/Safety verdict, what would move the number, the school's federal admissions data, and a link to the full calculator.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "act": {
                "description": "ACT composite, 1 to 36. Ignored if sat is given.",
                "maximum": 36,
                "minimum": 1,
                "type": "integer"
              },
              "apCourses": {
                "description": "Number of AP courses taken or in progress.",
                "maximum": 30,
                "minimum": 0,
                "type": "integer"
              },
              "athlete": {
                "description": "Recruited athlete.",
                "type": "boolean"
              },
              "classRankPercent": {
                "description": "Class rank as a top percentage, e.g. 5 for top 5%.",
                "maximum": 100,
                "minimum": 0,
                "type": "number"
              },
              "firstGen": {
                "description": "First-generation college student.",
                "type": "boolean"
              },
              "gpa": {
                "description": "Unweighted GPA on a 4.0 scale. Provide this or weightedGpa.",
                "maximum": 4,
                "minimum": 0,
                "type": "number"
              },
              "grade": {
                "description": "Current grade level. Defaults to 12.",
                "enum": ["9", "10", "11", "12"],
                "type": "string"
              },
              "homeState": {
                "description": "Two-letter U.S. state code, for in-state vs out-of-state at public schools.",
                "pattern": "^[A-Za-z]{2}$",
                "type": "string"
              },
              "legacy": {
                "description": "Parent attended this school.",
                "type": "boolean"
              },
              "major": {
                "description": "Intended major, e.g. Computer Science.",
                "maxLength": 60,
                "type": "string"
              },
              "round": {
                "description": "Application round. Defaults to Regular Decision.",
                "enum": ["Regular Decision", "Early Action", "Early Decision", "REA/SCEA", "Rolling"],
                "type": "string"
              },
              "sat": {
                "description": "Total SAT score, 400 to 1600.",
                "maximum": 1600,
                "minimum": 400,
                "type": "integer"
              },
              "school": {
                "description": "College name, e.g. \"University of Michigan\" or \"MIT\".",
                "type": "string"
              },
              "weightedGpa": {
                "description": "Weighted GPA (e.g. 4.3 on a 5.0 scale).",
                "maximum": 6,
                "minimum": 0,
                "type": "number"
              }
            },
            "required": ["school"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate admission chances"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:fb92fad37a80e36dd26bbc5cd2857e20bc25daea8967ff0c610878256de20145"
        },
