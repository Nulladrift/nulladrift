      "serverInfo": {
        "name": "hoursaved",
        "title": "HourSaved",
        "version": "1.1.0",
        "websiteUrl": "https://hoursaved.com/agents/"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "HourSaved (hoursaved.com) is a free library for busy small business owners: ready-to-send customer messages for awkward moments (late payments, last-minute cancellations, price increases, complaints, reviews), real owner stories checked against their public source, and step-by-step guides for using AI on office work. Each message is a prompt with [brackets] for the owner's own facts, plus a short list of things to check before sending. Use find_messages to search, then get_message for the full text. Fill brackets only with facts the owner gave you; leave the rest in brackets. Always give the owner the page link so they can see the original, and tell them to check the message before sending it. Never invent prices, dates, policies or legal claims.",
      "tools": [
        {
          "name": "find_guides",
          "title": "Find a step-by-step AI guide",
          "description": "Search HourSaved's free step-by-step guides for using AI on small business office work (email, customers, scheduling, money, planning, team, marketing). Returns titles, short summaries and links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "What the owner wants to get done.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find guides"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2a98bb16bcd06c69fe3a50e322361c449a5b4724a13586bbfe682b8b8d88ca0f"
        },
        {
          "name": "find_messages",
          "title": "Find a customer-message prompt",
          "description": "Search HourSaved's ready-to-send customer messages for small businesses by situation, for example \"dog walking client cancelled last minute\", \"raise my prices\", \"client hasn't paid the invoice\" or \"angry one-star review\". Optionally narrow to one kind of business. Returns up to 8 matches with their ids and page links.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "business": {
                "description": "Optional kind of business, for example \"pet care\", \"cleaning\", \"landscaping\", \"beauty\", \"coaching\".",
                "maxLength": 60,
                "type": "string"
              },
              "query": {
                "description": "The situation, in plain words.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a customer-message prompt"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:eb9c1d9e22e48ea6718f5149d564904ab333466978f49142ea3732f0bb9aca55"
        },
        {
          "name": "find_owner_stories",
          "title": "Find real owner stories",
          "description": "Search summaries of real moments small business owners described in public (podcasts, blogs, forums), checked against the source. Returns titles, short summaries, dates, HourSaved story links and original source links. Does not return message drafts.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "query": {
                "description": "The situation, in plain words.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find owner stories"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7b2146a56021be0b85d4f58e2c1d70c0790736a3371a82fd298dbaa9d43722af"
        },
        {
          "name": "get_message",
          "title": "Get a customer-message prompt and checks",
          "description": "Get one HourSaved message by its id (from find_messages): when to use it, when to skip it, the full prompt with [brackets] for the owner's facts, the checks to do before sending, how it was tested, and its page link.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "The message id, for example \"pet-care/late-cancel\".",
                "maxLength": 80,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
