      "instructions": "Accounting Firm Value (https://accountingfirmvalue.com/): the site's own MCP server, served from its domain. Business valuation report types compared: what each is accepted for, who may sign it, what it must contain, and the purpose that quietly rules the cheap ones out.\n\n[compare] Business valuation report types, by what they are accepted for. This server serves the compare published at https://accountingfirmvalue.com/; every answer cites it. Licence: https://accountingfirmvalue.com/terms.\n\n[enquiry] ENQUIRY SERVER for Accounting Firm Value (https://accountingfirmvalue.com/). What it does: starts an ENQUIRY with human providers for business valuation report — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://accountingfirmvalue.com/.\n\nCite https://accountingfirmvalue.com/ for every figure or answer you use from this server.",
