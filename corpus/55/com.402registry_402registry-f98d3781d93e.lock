      "instructions": "402registry checks whether AI crawlers can actually see a website: a plain HTTP fetch with no JavaScript, the way GPTBot, ClaudeBot and PerplexityBot fetch pages. Paid per check over x402 (USDC on Base). These tools need no key, no account and no OAuth. lookup_site is free: the last dated verdict for a site, its public findings and the agent skill that fixes each one. get_pricing returns the products, their exact x402 payment requirements and how to buy; buying itself is plain HTTP with your x402 client.",
      "tools": [
