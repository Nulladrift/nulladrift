          "title": "Look up a site in the registry",
          "description": "Free. The last dated verdict for a website, if it was ever checked and listed: verdict, score and its band, date, badge, profile URL, every public finding with the agent skill (aiskills402.com) that fixes it, and the URL to buy a fresh check. An unknown site is a normal answer (known: false), not an error.",
