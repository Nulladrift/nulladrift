        {
          "name": "fund_claim",
          "title": "Collect what a discontinued pooled Fund owes",
          "description": "Funds are discontinued; this is only for someone still holding shares in a pooled Fund. The unsigned transactions that collect what settlements priced for a holder: shares from deposits and USDC from redemptions, every claimable batch at once (or one epoch). Anyone may send a claim; what it pays always goes to the holder.",
