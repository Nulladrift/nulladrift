{
  "lockfileVersion": 2,
  "subjects": {
    "ai.discoveria/discoveria": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://mcp.discoveria.ai/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25", "2025-06-18", "2025-03-26"]
      },
      "serverInfo": {
        "name": "discoveria-mcp",
        "title": "DiscoverIA",
        "version": "0.1.0",
        "websiteUrl": "https://discoveria.ai/"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Read-only access to DiscoverIA (https://discoveria.ai), an independent registry of AI-assisted scientific claims and of where their evaluation stands. A status says where the evaluation of a claim stands, not whether the result is true; always give the date the status was observed. Start with search_announcements, then get_announcement for details. Pass lang='fr' or 'en'. Data are CC BY 4.0: credit DiscoverIA. Also a catalogue of papers (mathematics, astronomy, machine learning, from arXiv; other disciplines on demand from OpenAlex): catalogue_search, catalogue_get, catalogue_stats (bulk export), catalogue_fetch_other. Metadata CC0.",
      "tools": [
        {
          "name": "catalogue_fetch_other",
          "title": "Fetch papers from other disciplines",
          "description": "For disciplines outside the pilot domains: queries OpenAlex, returns up to 10 records and keeps them in the catalogue (then readable with catalogue_get by their 'openalex:W…' id). Abstracts are kept only under an open licence.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page_size": {
                "default": 5,
                "description": "Records to fetch, 1 to 10.",
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Search words sent to OpenAlex.",
                "maxLength": 200,
                "minLength": 2,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Fetch papers from other disciplines"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:722f4a719e52d8c650b597d188d47041323c2f7b8381dc0d36e7ade0c39f9139"
        },
        {
          "name": "catalogue_get",
          "title": "Get one catalogue record",
          "description": "Get one full catalogue record by id: title, authors, abstract (when its licence allows), dates, categories, identifiers, links, source and licences.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Catalogue id without version, e.g. 'arxiv:2411.01234', 'arxiv:math/0601001' or 'openalex:W2741809807'.",
                "maxLength": 40,
                "minLength": 1,
                "pattern": "^(arxiv:(?:[0-9]{4}\\.[0-9]{4,5}|[a-z-]+(?:\\.[A-Z]{2})?/[0-9]{7})|openalex:W[0-9]{1,12})$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one catalogue record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9f586383d162e086549d043b2933a603f3abc6d6caa171f8001015d8861faa42"
        },
        {
          "name": "catalogue_search",
          "title": "Search the paper catalogue",
          "description": "Search DiscoverIA's catalogue of papers in the pilot domains (mathematics, astronomy, machine learning; loaded from arXiv) by words of the title, author family names, arXiv categories (e.g. 'math.NT') or an arXiv id. All words must match; most recent first. Without query, lists the most recent records. 'truncated' true means older matches may be missing: narrow the query. Use catalogue_get for the full record.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "default": "all",
                "description": "Pilot domain: maths, astronomie, apprentissage-automatique, or 'all' (default).",
                "enum": ["all", "maths", "astronomie", "apprentissage-automatique"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, from 1.",
                "maximum": 100,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 10,
                "description": "Results per page, 1 to 20.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Words to match. Omit to list recent records.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the paper catalogue"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2f6d232ddbaa538ed5f7c31658b50ccb8584e7707e2dea31f45743772cc34b22"
        },
        {
          "name": "catalogue_stats",
          "title": "Catalogue volumes and bulk export",
          "description": "Volumes per pilot domain, licences, sources and build date of the catalogue, plus the list of bulk export files (JSONL gzip, one record per line, with sha256).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Catalogue volumes and bulk export"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:540e7c4ff5896573e533b596fb6d3e7b9ea70cfe112392a18a0199dabb3dcc60"
        },
        {
          "name": "get_announcement",
          "title": "Get one registry entry",
          "description": "Get one entry of the DiscoverIA registry by id: claim, claimant, current status with its rule, dated status history with sources, verifiers, links, statement fidelity, events, related frontiers and the plain-language summary. A status says where the evaluation stands, not whether the result is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Entry id (slug), e.g. 'gauss-sphere-packing-dim8', as returned by search_announcements.",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,118}[a-z0-9])?$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of titles, labels and texts: 'fr' (French) or 'en' (English). Default 'en'. Use the user's language.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one registry entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:be2e7e558392acc951ed6a0f0f4bd2ff5835481acbdabe568708a5e7bbe9ac12"
        },
        {
          "name": "get_citation",
          "title": "Cite a registry entry",
          "description": "Dated citation of a registry entry in APA and/or BibTeX, with its status and the date that status was observed. Data are CC BY 4.0, credit DiscoverIA.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Entry id (slug), e.g. 'gauss-sphere-packing-dim8', as returned by search_announcements.",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,118}[a-z0-9])?$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of titles, labels and texts: 'fr' (French) or 'en' (English). Default 'en'. Use the user's language.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "style": {
                "default": "both",
                "description": "'apa', 'bibtex' or 'both'. Default 'both'.",
                "enum": ["apa", "bibtex", "both"],
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Cite a registry entry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:407c3205dd920a6f8530bc17858a60fbd952833495c1db4f8942ca95f4ea03dc"
        },
        {
          "name": "get_frontier",
          "title": "Get a frontier and its current record",
          "description": "Frontiers track the best known bound of a quantity (e.g. a kissing number) and who moved it. With an id: the frontier, its current lower and upper records (exact values as strings, never rounded) and its series. Without an id: the list of frontiers with their current records.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Frontier id, e.g. 'kissing-d11'. Omit to list all frontiers.",
                "maxLength": 120,
                "minLength": 1,
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,118}[a-z0-9])?$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of titles, labels and texts: 'fr' (French) or 'en' (English). Default 'en'. Use the user's language.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a frontier and its current record"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:7fc7679a312d43e4a46ca34d4390b3e9c6cc6eca63aed9310cb4e1b8cf511a4a"
        },
        {
          "name": "list_statuses",
          "title": "List the statuses and their counts",
          "description": "List DiscoverIA's six evaluation statuses for scientific claims (and the provisional product statuses) with their definitions and the number of entries in each. A status says where the evaluation stands, not whether the result is true.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "lang": {
                "default": "en",
                "description": "Language of titles, labels and texts: 'fr' (French) or 'en' (English). Default 'en'. Use the user's language.",
                "enum": ["fr", "en"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List the statuses and their counts"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8ee2bf3b9b98bd00c6269cf72f9d358bf4dad890b0714001beb7f26546ee83fc"
        },
        {
          "name": "recent_changes",
          "title": "Recent status changes and news feed",
          "description": "Latest status changes in the registry (last 90 days, with source) and the latest items of DiscoverIA's feed (last 30 days: sciences, models and labs, apps, devices).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "kind": {
                "default": "all",
                "description": "'status' for status changes only, 'feed' for feed items only, 'all' for both. Default 'all'.",
                "enum": ["all", "status", "feed"],
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of titles, labels and texts: 'fr' (French) or 'en' (English). Default 'en'. Use the user's language.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "limit": {
                "default": 20,
                "description": "Maximum items per list, 1 to 50. Default 20.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Recent status changes and news feed"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:c518d4a75195d416d9917e6ec61dff8e4e456414f8540cc3b2017f33832c3a51"
        },
        {
          "name": "search_announcements",
          "title": "Search the DiscoverIA registry",
          "description": "Search DiscoverIA's registry of AI-assisted scientific claims by free text, status, lab, discipline and announcement date. Returns paginated entries with their current status, the date that status was observed and a link to the entry's page. A status says where the evaluation of a claim stands, not whether the result is true. Entries from the frozen Erdős-wiki archive have statuses dated at the freeze.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "announced_from": {
                "description": "YYYY, YYYY-MM or YYYY-MM-DD. Keeps entries whose announcement period ends on or after this date (a claim dated '2026-02' matches announced_from '2026-02-15').",
                "maxLength": 10,
                "pattern": "^[0-9]{4}(?:-(?:0[1-9]|1[0-2])(?:-(?:0[1-9]|[12][0-9]|3[01]))?)?$",
                "type": "string"
              },
              "announced_to": {
                "description": "YYYY, YYYY-MM or YYYY-MM-DD. Keeps entries whose announcement period starts on or before this date.",
                "maxLength": 10,
                "pattern": "^[0-9]{4}(?:-(?:0[1-9]|1[0-2])(?:-(?:0[1-9]|[12][0-9]|3[01]))?)?$",
                "type": "string"
              },
              "discipline": {
                "description": "Discipline slug, e.g. 'mathematiques', 'informatique-theorique', 'biologie-medecine', 'physique'.",
                "maxLength": 60,
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?$",
                "type": "string"
              },
              "include_archive": {
                "default": true,
                "description": "Include the frozen archive of T. Tao's AI-Erdős wiki (about 520 entries). Default true.",
                "type": "boolean"
              },
              "lab": {
                "description": "Lab slug from DiscoverIA's lab report, e.g. 'openai', 'google-deepmind', 'anthropic', 'harmonic', 'math-inc'. Matches claims announced by the lab and results obtained by others with its systems. The Erdős-wiki archive is not attributed to labs.",
                "maxLength": 60,
                "pattern": "^[a-z0-9](?:[a-z0-9-]{0,58}[a-z0-9])?$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "Language of titles, labels and texts: 'fr' (French) or 'en' (English). Default 'en'. Use the user's language.",
                "enum": ["fr", "en"],
                "type": "string"
              },
              "page": {
                "default": 1,
                "description": "Page number, from 1.",
                "maximum": 500,
                "minimum": 1,
                "type": "integer"
              },
              "page_size": {
                "default": 10,
                "description": "Results per page, 1 to 50. Default 10.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "Free text matched against title, claimant, id, discipline and nature. All words must match; accents and case are ignored. Omit to list everything.",
                "maxLength": 200,
                "type": "string"
              },
              "status": {
                "description": "Keep only entries with this status (see list_statuses).",
                "enum": ["verifie-formellement", "relu-par-pairs", "en-examen", "conteste", "retire", "non-evalue", "teste-par-un-tiers", "disponible", "demo-seulement", "annonce", "abandonne"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Search the DiscoverIA registry"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83ec877000a0b638aa4de4faff3d7e69e1e6db0b091622874b076aff1f750bf4"
        }
