{
  "lockfileVersion": 2,
  "subjects": {
    "com.agentcreditdata/agent-credit-bureau": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://agentcreditdata.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28", "2025-11-25"]
      },
      "serverInfo": {
        "name": "Agent Credit Bureau",
        "version": "0.2.0"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "Paid evidence tools; the caller makes the economic decision.",
      "tools": [
        {
          "name": "assess_agent_credit_exposure",
          "title": "Assess historical economic exposure",
          "description": "Compare attributable economic history of an AI/software agent with a proposed credit or deferred-payment exposure. Returns evidence comparability, coverage and unknowns; never a lending recommendation or credit score. This paid tool charges the published USDC price once per unique payment authorization.",
          "inputSchema": {
            "$defs": {
              "Asset": {
                "additionalProperties": false,
                "properties": {
                  "decimals": {
                    "minimum": 0,
                    "type": "integer"
                  },
                  "id": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "symbol": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": ["decimals", "id", "symbol"],
                "type": "object"
              },
              "ProposedExposure": {
                "additionalProperties": false,
                "properties": {
                  "asset": {
                    "$ref": "#/$defs/Asset"
                  },
                  "duration_seconds": {
                    "minimum": 1,
                    "type": "integer"
                  },
                  "obligation_type": {
                    "enum": ["loan", "trade_credit", "protocol_position"]
                  },
                  "principal": {
                    "maxLength": 100,
                    "pattern": "^(0|[1-9][0-9]*)(\\.[0-9]+)?$",
                    "type": "string"
                  },
                  "secured": {
                    "type": "boolean"
                  }
                },
                "required": ["asset", "duration_seconds", "obligation_type", "principal", "secured"],
                "type": "object"
              }
            },
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "proposed_exposure": {
                "$ref": "#/$defs/ProposedExposure"
              },
              "subject": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["proposed_exposure", "subject"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "org.agentcreditbureau/annotationJustification": "Fetches bounded public evidence and writes local snapshots/logs. A signed payment settles an irreversible USDC transfer. Same signed authorization/request is replay-safe; a new authorization may incur another charge.",
            "org.agentcreditbureau/pricing": {
              "amount": "100000",
              "asset": "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913",
              "network": "eip155:8453",
              "protocol": "x402",
              "version": "pilot-2026-09-v1"
            }
          },
          "digest": "sha256:9c9b8c4fba4a1d9d0dd1a8a84f311fc9a1cec9c1b437ff92e7ff4a7346713d21"
        },
        {
          "name": "get_agent_credit_report",
          "title": "Get economic evidence report",
          "description": "Retrieve observed economic obligations, principal-time exposure, settlement actors, counterparty relationships, coverage and unknowns for an economic agent on Base. This paid tool returns historical evidence, not a lending decision.",
          "inputSchema": {
            "$defs": {},
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "id": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": true,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "org.agentcreditbureau/annotationJustification": "Fetches bounded public evidence and writes local snapshots/logs. A signed payment settles an irreversible USDC transfer. Same signed authorization/request is replay-safe; a new authorization may incur another charge.",
            "org.agentcreditbureau/pricing": {
              "amount": "50000",
              "asset": "0x833589fcd6edb6e08f4c7c32d4f71b54bda02913",
              "network": "eip155:8453",
              "protocol": "x402",
              "version": "pilot-2026-09-v1"
            }
          },
          "digest": "sha256:54ee00e24190bac31f1b2529b5b9734d7f24379416e7e382502555fe00f8d14e"
        }
      ],
      "digest": "sha256:01a53ef9704934c86e8cb182d3a2e18bfd09a33c33661026798ee031d0a07f5b"
    }
  }
}
