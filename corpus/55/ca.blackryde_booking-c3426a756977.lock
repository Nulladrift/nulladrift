          "digest": "sha256:832d8d35a05ecbc8a9d18ff1052ce8d9104addd34bc7faa3376526f38e7870d6"
        },
        {
          "name": "request_booking",
          "title": "Send a booking request",
          "description": "Send a chauffeured transportation request to BlackRyde.ca for the traveller. Only call when the traveller explicitly asked to book. Returns a reference (BRC-XXXXXXX); the team confirms price, vehicle and chauffeur by email or phone. Not confirmed until then; nothing is charged.",
          "inputSchema": {
            "properties": {
              "agent": {
                "description": "Name of your assistant or app",
                "type": "string"
              },
              "bags": {
                "minimum": 0,
                "type": "integer"
              },
              "consent": {
                "description": "The traveller explicitly asked for this booking",
                "enum": ["yes"],
                "type": "string"
              },
              "date": {
                "description": "Local pickup date YYYY-MM-DD",
                "type": "string"
              },
              "dropoff": {
                "type": "string"
              },
              "email": {
                "description": "Email (email or phone required)",
                "type": "string"
              },
              "flight": {
                "type": "string"
              },
              "hours": {
                "description": "Hours needed for hourly / as-directed service",
                "type": "string"
              },
              "name": {
                "description": "Lead passenger full name",
                "type": "string"
              },
              "notes": {
                "description": "Occasion, child seats, accessibility, stops",
                "type": "string"
              },
              "passengers": {
                "minimum": 1,
                "type": "integer"
              },
              "phone": {
                "description": "Mobile with country code",
                "type": "string"
              },
              "pickup": {
                "description": "Address, hotel, airport + terminal or venue",
                "type": "string"
              },
              "return": {
                "type": "string"
              },
              "service": {
                "enum": ["Airport transfer", "Point to point", "Hourly chauffeur", "Corporate account", "Wedding / event", "Long distance / city to city"],
                "type": "string"
              },
              "time": {
                "description": "Local pickup time HH:MM",
                "type": "string"
              },
              "vehicle": {
                "enum": ["Executive sedan", "Luxury sedan (S-Class)", "SUV", "Sprinter van", "Stretch limousine", "Party bus / coach"],
                "type": "string"
              }
            },
            "required": ["consent", "date", "dropoff", "name", "pickup", "time"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
