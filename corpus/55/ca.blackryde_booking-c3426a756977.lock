      },
      "instructions": "BlackRyde.ca: Black car and limousine service in Toronto and across Ontario: flight-tracked Pearson airport transfers, hourly chauffeur hire and corporate accounts at one all-inclusive price, never surge. Use search_coverage to find a page, get_page to read it and get_booking_options for services, vehicles, policies and the online booker. Never state a price that is not in get_booking_options or the booker. Only call request_booking after the traveller explicitly asked to book and gave their name, a contact (email or phone), pickup, drop-off, date and local time; send consent=\"yes\". The result is a request reference: tell the traveller the team will confirm by email or phone. Agents never take payment.",
      "tools": [
        {
          "name": "get_booking_options",
          "title": "Booking options",
          "description": "Services, vehicles, coverage, pricing rules, contact channels, the online booker link and booking policies.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:63c98cb1dba0f779e8fa67989e5cf464965ac5e6362dca95025cbf763473144f"
        },
        {
          "name": "get_page",
          "title": "Read a page",
          "description": "Return the text of a page on blackryde.ca (Markdown when available). Accepts a full URL or a path.",
          "inputSchema": {
            "properties": {
              "url": {
                "type": "string"
              }
            },
            "required": ["url"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
