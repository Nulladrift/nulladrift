      },
      "transport": {
        "type": "http",
        "url": "https://www.imoving.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.imoving/moving-quotes",
        "title": "iMoving - moving quotes",
        "version": "1.0.0",
        "websiteUrl": "https://www.imoving.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "iMoving is a US marketplace of licensed and insured moving companies with fixed prices. Use these tools when someone in the United States wants to know what a home move costs, compare movers, or book a move. Typical flow: list_move_sizes to map the home (studio, 2 bedrooms, house...) to a move_size_id; then get_moving_quote with both ZIP codes and the date; optionally get_mover for a mover's reviews. Ask for what is missing (size, date, ZIP codes) rather than guessing; if the person only names cities, a central ZIP code of each city is fine. Present prices as starting prices for a typical home of that size and repeat the quote's price_note. To book, give the person the offer's booking_url: they choose the mover, confirm the details and pay on imoving.com - these tools never take payment or personal data.",
      "tools": [
        {
          "name": "get_mover",
          "title": "Get a mover's profile",
          "description": "Gets a moving company's profile from iMoving: where it is based, years in business, moves done, its rating (1-10) and its most recent verified customer reviews (1-5 stars each). Use it to check a mover's reputation before choosing one, with the mover_id of an offer from get_moving_quote.",
          "inputSchema": {
            "properties": {
              "mover_id": {
                "description": "mover_id of an offer from get_moving_quote.",
                "type": "integer"
              }
            },
            "required": ["mover_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a mover's profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a468e5fd391b59483ce4a8c91231915ed59ca7333889928dfbecc0fc64251531"
        },
        {
          "name": "get_moving_quote",
          "title": "Get moving prices",
          "description": "Gets moving costs - binding price quotes from licensed and insured moving companies - for a home move within the United States: local, long-distance, interstate or cross-country, an apartment or a house. Returns how many movers serve the route, the price range, and the best offers (the cheapest, plus the top-rated mover) with rating, reviews, price and a booking_url. Use it when someone asks how much a move costs, wants a moving estimate, or is looking for movers to hire. Nothing is booked or stored.",
          "inputSchema": {
            "properties": {
              "from_zip": {
                "description": "5-digit US ZIP code of the place being moved out of, e.g. \"33101\".",
                "type": "string"
              },
              "limit": {
                "default": null,
                "description": "How many of the cheapest offers to return, 1-10. Default 5.",
                "type": ["integer", "null"]
              },
              "move_date": {
                "description": "Moving day as YYYY-MM-DD, from tomorrow up to 18 months ahead.",
                "type": "string"
              },
              "move_size_id": {
                "description": "The id of the home size, from list_move_sizes.",
                "type": "integer"
              },
              "to_zip": {
                "description": "5-digit US ZIP code of the destination, e.g. \"10001\".",
                "type": "string"
              }
            },
            "required": ["from_zip", "move_date", "move_size_id", "to_zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get moving prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6504f885558b5b110393154ae2bccc124c439e50217201534a12ca11f325d6ae"
        },
        {
          "name": "list_move_sizes",
          "title": "List move sizes",
          "description": "Lists the home sizes iMoving prices moves for - a few items, a studio, an apartment or a house from 1 to 5+ bedrooms - each with its id, the truck it needs and the typical volume of belongings in cubic feet. Call it before get_moving_quote to pick move_size_id; the list rarely changes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List move sizes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:2db1e965224760e48e4aaf2d092ffeaac09497af33989191fad0f409c1b6a525"
        }
      ],
      "digest": "sha256:8f27ffdbef27b4d1ea40f4596750ecfa395e49dc55c872ea45ed20bac89ffd89"
    }
  }
