  "subjects": {
    "com.imoving/moving-quotes": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.imoving.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "com.imoving/moving-quotes",
        "title": "iMoving - moving quotes",
        "version": "1.0.0",
        "websiteUrl": "https://www.imoving.com"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "iMoving is a US marketplace of licensed and insured moving companies with fixed prices. Use these tools when someone in the United States wants to know what a home move costs, compare movers, or book a move. Typical flow: list_move_sizes to map the home (studio, 2 bedrooms, house...) to a move_size_id; then get_moving_quote with both ZIP codes and the date; optionally get_mover for a mover's reviews. Ask for what is missing (size, date, ZIP codes) rather than guessing; if the person only names cities, a central ZIP code of each city is fine. Present prices as starting prices for a typical home of that size and repeat the quote's price_note. To book, give the person the offer's booking_url: they choose the mover, confirm the details and pay on imoving.com - these tools never take payment or personal data.",
      "tools": [
        {
          "name": "get_mover",
          "title": "Get a mover's profile",
          "description": "Gets a moving company's profile from iMoving: where it is based, years in business, moves done, its rating (1-10) and its most recent customer reviews (1-5 stars each). Use the mover_id of an offer from get_moving_quote.",
          "inputSchema": {
            "properties": {
              "mover_id": {
                "description": "mover_id of an offer from get_moving_quote.",
                "type": "integer"
              }
            },
            "required": ["mover_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get a mover's profile"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:d215cc47a167db0ef8998291e23edecb35f7ee85c7675304f50ed24036e45c34"
        },
        {
          "name": "get_moving_quote",
          "title": "Get moving prices",
          "description": "Gets real prices from vetted movers for a home move within the United States: how many movers can do it, the price range, and the best offers (the cheapest, plus the top-rated mover) with rating, reviews, price and a booking_url. Nothing is booked or stored.",
          "inputSchema": {
            "properties": {
              "from_zip": {
                "description": "5-digit US ZIP code of the place being moved out of, e.g. \"33101\".",
                "type": "string"
              },
              "limit": {
                "default": null,
                "description": "How many of the cheapest offers to return, 1-10. Default 5.",
                "type": ["integer", "null"]
              },
              "move_date": {
                "description": "Moving day as YYYY-MM-DD, from tomorrow up to 18 months ahead.",
                "type": "string"
              },
              "move_size_id": {
                "description": "The id of the home size, from list_move_sizes.",
                "type": "integer"
              },
              "to_zip": {
                "description": "5-digit US ZIP code of the destination, e.g. \"10001\".",
                "type": "string"
              }
            },
            "required": ["from_zip", "move_date", "move_size_id", "to_zip"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get moving prices"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:83d9d3361e12a3860cc5f83294758d486f37548086c7da3d8e171de70da30cd5"
        },
        {
          "name": "list_move_sizes",
          "title": "List move sizes",
          "description": "Lists the home sizes iMoving prices moves for (from a few items or a studio up to a 5+ bedroom house), each with its id and the typical volume of belongings in cubic feet. Call it before get_moving_quote to pick move_size_id; the list rarely changes.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "List move sizes"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8f44802005d5078eb06f218ff08eba9cf85c81a2fd6b69e81a2ff7918dafe1fe"
        }
      ],
      "digest": "sha256:962da403830c74929f2139b332036069a7cd09205426ffffe171bfb06bcbb6bf"
    }
  }
