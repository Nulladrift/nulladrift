      "serverInfo": {
        "name": "agency-search-tool",
        "version": "0.1"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_agency",
          "title": "Get agency details",
          "description": "Retrieve a listed agency using an ID returned by search_agencies. Returns services, documented offices, contact details, editorial and customer ratings, and website findings such as pricing where available. Missing fields are unknown. Website findings may be incomplete or outdated.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "id": {
                "description": "Stable agency ID",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:e87c91b5f299b9ff125851bc9736c84e973f8485b0e1fd46898ab2b735be13f2"
        },
        {
          "name": "search_agencies",
          "title": "Search agencies",
          "description": "Find listed professional service providers by name, service or synonym and office location. Results are sorted by editorial rating, highest first. Use offset and limit to paginate; structuredContent gives total and next_offset. Coverage is incomplete. Search synonyms broaden discovery and do not certify platform-specific expertise.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "limit": {
                "description": "Page size, default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "market": {
                "description": "Explicitly documented customer market country code. Currently unavailable for the catalog. Omit this filter to search by office location.",
                "type": "string"
              },
              "offset": {
                "description": "First match to return, default 0",
                "minimum": 0,
                "type": "integer"
              },
              "place": {
                "description": "Office city, country code or country name in English or Swedish, e.g. Stockholm, SE or Sweden",
                "type": "string"
              },
              "q": {
                "description": "Agency type, service or name",
                "type": "string"
              }
            },
            "required": [],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:a64e36067166a5147afc17bbfceb1882f73fb67331be586ab538e686644cb2c5"
        }
