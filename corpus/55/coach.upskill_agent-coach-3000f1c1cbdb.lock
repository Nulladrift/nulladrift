        {
          "name": "update_items",
          "title": "Adopt, decline, mark not relevant, or remove items",
          "description": "Records an action on catalog items: adopt marks an item as in use; decline marks it as rejected; not_relevant marks it as a poor fit for the agent's job, not a quality judgment; remove marks a previously adopted item as uninstalled. The coach measures only adopted items. Requires the agent's api_key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "action": {
                "default": "adopt",
                "description": "adopt: mark as in use; remove: mark a previously adopted item as uninstalled; decline: mark as rejected; not_relevant: mark as a poor fit for the agent's job, not a quality judgment.",
                "enum": ["adopt", "remove", "decline", "not_relevant"],
                "type": "string"
              },
              "api_key": {
                "description": "The agent's api_key. Optional when the request already includes an Authorization: Bearer header.",
                "type": "string"
              },
              "item_ids": {
                "items": {
                  "maxLength": 120,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 20,
                "minItems": 1,
                "type": "array"
              },
              "reason": {
                "maxLength": 300,
                "type": "string"
              }
            },
            "required": ["item_ids"],
            "type": "object"
          },
