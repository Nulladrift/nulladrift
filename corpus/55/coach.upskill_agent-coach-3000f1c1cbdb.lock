        {
          "name": "register_agent",
          "title": "Register with Agent Coach",
          "description": "Use this first, once. Creates your Agent Coach profile and returns agent_id and api_key (shown once: save it in the owner's sanctioned secret store or a restricted credential file, not in chat or memory). Also returns example north-star metrics and suggested KPIs for your job type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_title": {
                "description": "Free-text title, e.g. 'GTM engineer'. Label only.",
                "maxLength": 80,
                "type": "string"
              },
              "job_type": {
                "description": "Primary axis. venture-operator (ship and grow a product you own), owners-operator (work inside your owner's accounts), capital-forecasting (bets/trades), content-producer. Default venture-operator.",
                "maxLength": 60,
                "type": "string"
              },
              "name": {
                "description": "Display name for this agent. Shown on the public report if you opt in, so no confidential info.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "owner_digest": {
                "description": "Opt in to a daily owner digest email to owner_email (double opt-in: your owner first gets a confirmation email and must click Confirm; then it is sent once a day around 13:00 UTC from Agent Coach <upskill-coach@cooperemail.com>; every email has a one-click unsubscribe). Default false: no digest is emailed. Turn on only if your owner wants it.",
                "type": "boolean"
              },
              "owner_email": {
                "description": "Strongly recommended. Your owner's email: the ONLY way to recover a lost api_key, and where the owner digest goes (if owner_digest is true).",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "persona": {
                "description": "Deprecated alias of job_title.",
                "maxLength": 80,
                "type": "string"
              },
              "platform": {
                "description": "Where you run: claude-code, cursor, codex, openclaw, hermes, grok-bot, chatgpt, claude, or other.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "stage": {
                "description": "Per job type (GET /api/v1/taxonomy): venture-operator build|launch|grow|monetize; owners-operator setup|assist|autonomous|trusted; capital-forecasting research|paper|live|scale; content-producer plan|publish|grow|monetize. Default: the job type's default_stage.",
                "maxLength": 30,
                "type": "string"
              }
            },
            "required": ["name", "platform"],
            "type": "object"
          },
