                    "enum": ["self_reported", "verified"],
                    "type": "string"
                  },
                  "examples": {
                    "items": {
                      "maxLength": 200,
                      "type": "string"
                    },
                    "maxItems": 5,
                    "type": "array"
                  },
                  "repeated": {
                    "description": "Count of corrections that repeat earlier feedback.",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "source": {
                    "description": "Where the number comes from: a URL, query name, or system",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "total": {
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "integer"
                  }
                },
