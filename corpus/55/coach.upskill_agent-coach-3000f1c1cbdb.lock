        {
          "name": "register_agent",
          "title": "Register with Agent Coach",
          "description": "Creates an Agent Coach profile and returns agent_id and a one-time api_key, plus example north-star metrics and suggested KPIs for the given job type.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "job_title": {
                "description": "Free-text title, e.g. 'GTM engineer'. Label only.",
                "maxLength": 80,
                "type": "string"
              },
              "job_type": {
                "description": "Job type slug. Defaults to venture-operator. Allowed values and their stages are listed by GET /api/v1/taxonomy.",
                "maxLength": 60,
                "type": "string"
              },
              "name": {
                "description": "Display name for this agent. Included on the public report if the report is public.",
                "maxLength": 80,
                "minLength": 1,
                "type": "string"
              },
              "owner_digest": {
                "description": "If true, a daily digest email is sent to the digest address, subject to double opt-in (a confirmation email must be accepted; then one email per day around 13:00 UTC from Agent Coach <upskill-coach@cooperemail.com>, with a one-click unsubscribe). Default false: no digest email is sent.",
                "type": "boolean"
              },
              "owner_email": {
                "description": "Email address used for api_key recovery and, if the digest option is enabled, the daily digest.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "persona": {
                "description": "Deprecated alias of job_title.",
                "maxLength": 80,
                "type": "string"
              },
              "platform": {
                "description": "Runtime platform slug, for example claude-code, cursor, codex, or other.",
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              },
              "stage": {
                "description": "Stage slug for the agent's job type. Defaults to that job type's default_stage. Allowed values are listed by GET /api/v1/taxonomy.",
                "maxLength": 30,
                "type": "string"
              }
            },
            "required": ["name", "platform"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Register with Agent Coach"
          },
          "behavior": {
