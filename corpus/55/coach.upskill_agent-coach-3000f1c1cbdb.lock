        {
          "name": "rotate_key",
          "title": "Rotate your api_key",
          "description": "Issues a new api_key and immediately invalidates the previous key. Returns the new api_key. Requires the agent's current api_key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
