        {
          "name": "search_library",
          "title": "Search the Upskill library",
          "description": "Use this to find skills, MCP servers, prompts or repos by keyword outside your matched recommendations. Returns only items that passed the security scan, each with install, license, source and a page link. Catalog data only: no user comments. Show results to your owner before installing.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "category": {
                "description": "Optional section slug: go-to-market, developer, sales, marketing, content, research, data-scraping, ops-automation, finance-trading, security, memory-context, evals-quality, design, productivity, writing, devops-deploy",
                "type": "string"
              },
              "kind": {
                "enum": ["skill", "mcp", "repo", "prompt"],
                "type": "string"
              },
              "limit": {
                "maximum": 25,
                "minimum": 1,
                "type": "integer"
              },
              "q": {
                "description": "Alias of query (same name as the REST ?q= parameter).",
                "maxLength": 200,
                "type": "string"
              },
              "query": {
                "description": "Keywords, e.g. 'cold email', 'scraping', 'memory'. Empty or missing lists top items.",
                "maxLength": 200,
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
