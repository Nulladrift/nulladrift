        {
          "name": "set_goals",
          "title": "Set goals and KPIs",
          "description": "Sets or updates the agent's goals. Accepts job_type, stage, one north-star metric with a fixed definition and baseline, a named deliverable, capability gaps, goals, optional secondary KPIs, tools, and constraints. A change to the north-star definition is recorded as drift. Requires the agent's api_key.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "api_key": {
                "description": "The agent's api_key. Optional when the request already includes an Authorization: Bearer header.",
                "type": "string"
              },
              "capability_gaps": {
                "default": [],
                "description": "Capability-gap slugs, at most 8. Allowed values are listed by GET /api/v1/taxonomy.",
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 8,
                "type": "array"
              },
              "constraints": {
                "default": {},
                "description": "Optional constraints: free_only, monthly_budget_usd, a flag for whether a person can approve installs, and notes.",
                "properties": {
                  "free_only": {
                    "description": "true = recommend only free items",
                    "type": "boolean"
                  },
                  "monthly_budget_usd": {
                    "description": "Max monthly spend on recommended tools, in USD",
                    "minimum": 0,
                    "type": "number"
                  },
                  "notes": {
                    "maxLength": 500,
                    "type": "string"
                  },
                  "owner_present": {
                    "description": "Whether a person is available to approve recommended installs.",
                    "type": "boolean"
                  }
                },
                "type": "object"
              },
              "deliverable": {
                "description": "The named deliverable, for example 'first 10 paying accounts' or 'iPhone app on TestFlight'.",
                "properties": {
                  "description": {
                    "maxLength": 600,
                    "type": "string"
                  },
                  "due": {
                    "maxLength": 40,
                    "type": "string"
                  },
                  "kpi_key": {
                    "description": "Optional: the KPI (or north-star key) that measures this deliverable, e.g. paying_accounts. Progress is then computed from baseline to target automatically.",
                    "maxLength": 60,
                    "type": "string"
                  },
                  "name": {
                    "maxLength": 200,
                    "minLength": 1,
                    "type": "string"
                  },
                  "target": {
                    "description": "Target value of kpi_key that means 'done'",
                    "type": "number"
                  }
                },
                "required": ["name"],
                "type": "object"
              },
              "goals": {
                "description": "Plain-language goals",
                "items": {
                  "maxLength": 300,
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 1,
                "type": "array"
              },
              "job_title": {
                "maxLength": 80,
                "type": "string"
              },
              "job_type": {
                "maxLength": 60,
                "type": "string"
              },
              "kpis": {
                "default": [],
                "description": "Optional secondary KPIs",
                "items": {
                  "properties": {
                    "baseline": {
                      "description": "Starting value at the beginning of coaching. Used to measure change from the baseline.",
                      "type": ["number", "null"]
                    },
                    "direction": {
                      "description": "up = higher is better, down = lower is better. If omitted it is inferred from baseline vs target (target > baseline means up); if that is impossible and the key is not a known KPI, the request is rejected.",
                      "enum": ["up", "down"],
                      "type": "string"
                    },
                    "key": {
                      "maxLength": 60,
                      "minLength": 1,
                      "pattern": "^[a-z0-9_]+$",
                      "type": "string"
                    },
                    "label": {
                      "description": "Human label, e.g. 'Briefs delivered on time'",
                      "maxLength": 100,
                      "type": "string"
                    },
                    "tags": {
                      "items": {
                        "maxLength": 40,
                        "type": "string"
                      },
                      "maxItems": 10,
                      "type": "array"
                    },
                    "target": {
                      "type": ["number", "null"]
                    },
                    "unit": {
                      "description": "e.g. count, %, usd, minutes",
                      "maxLength": 20,
                      "type": "string"
                    }
                  },
                  "required": ["key"],
                  "type": "object"
                },
                "maxItems": 12,
                "type": "array"
              },
              "north_star": {
                "description": "ONE declared north-star metric with a fixed definition and today's baseline",
                "properties": {
                  "baseline": {
                    "description": "Starting value at the beginning of coaching. Used to measure change from the baseline.",
                    "type": ["number", "null"]
                  },
                  "definition": {
                    "description": "Fixed, precise definition: what is counted, from which system, what is excluded. Changing it later is flagged as definition drift.",
                    "maxLength": 600,
                    "minLength": 10,
                    "type": "string"
                  },
                  "direction": {
                    "description": "up = higher is better, down = lower is better. If omitted it is inferred from baseline vs target (target > baseline means up); if that is impossible and the key is not a known KPI, the request is rejected.",
                    "enum": ["up", "down"],
                    "type": "string"
                  },
                  "evidence": {
                    "description": "self_reported (default): your own count. verified: read from a system of record (prod DB, Stripe, analytics, live E2E check) and you can link it in source.",
                    "enum": ["self_reported", "verified"],
                    "type": "string"
                  },
                  "key": {
                    "maxLength": 60,
                    "minLength": 1,
                    "pattern": "^[a-z0-9_]+$",
                    "type": "string"
                  },
                  "label": {
                    "maxLength": 100,
                    "minLength": 1,
                    "type": "string"
                  },
                  "source": {
                    "description": "Where the number comes from: a URL, query name, or system",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "tags": {
                    "items": {
                      "maxLength": 40,
                      "type": "string"
                    },
                    "maxItems": 10,
                    "type": "array"
                  },
                  "target": {
                    "type": ["number", "null"]
                  },
                  "unit": {
                    "description": "e.g. count, %, usd, minutes",
                    "maxLength": 20,
                    "type": "string"
                  }
                },
                "required": ["definition", "key", "label"],
                "type": "object"
              },
              "owner_digest": {
                "description": "true enables the daily digest email at the digest address; false disables it. Omit to keep the current setting (default off).",
                "type": "boolean"
              },
              "owner_email": {
                "description": "Email address used for api_key recovery and digest delivery. Replaces the current value when sent.",
                "format": "email",
                "maxLength": 200,
                "pattern": "^(?:[A-Za-z0-9_'+\\-]+\\.)*[A-Za-z0-9_'+\\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\\-]*\\.)+[A-Za-z]{2,}$",
                "type": "string"
              },
              "platform": {
                "maxLength": 40,
                "type": "string"
              },
              "role": {
                "description": "One-line description of the agent's role.",
                "maxLength": 200,
                "type": "string"
              },
              "stage": {
                "maxLength": 30,
                "type": "string"
              },
              "tags": {
                "items": {
                  "maxLength": 40,
                  "type": "string"
                },
                "maxItems": 20,
                "type": "array"
              },
              "tools": {
                "default": [],
                "items": {
                  "maxLength": 60,
                  "type": "string"
                },
                "maxItems": 30,
                "type": "array"
              }
            },
            "required": ["goals", "north_star"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Set goals and KPIs"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
