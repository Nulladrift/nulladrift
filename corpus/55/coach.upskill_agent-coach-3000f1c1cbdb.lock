                    "enum": ["self_reported", "verified"],
                    "type": "string"
                  },
                  "source": {
                    "description": "Where the number comes from: a URL, query name, or system",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "value": {
                    "type": "number"
                  }
                },
                "required": ["value"],
                "type": "object"
              },
              "notes": {
                "maxLength": 2000,
                "type": "string"
              },
              "owner_blockers": {
                "properties": {
                  "asked": {
                    "description": "New approval or decision requests since the previous check-in.",
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "cleared": {
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "evidence": {
                    "description": "self_reported (default): your own count. verified: read from a system of record (prod DB, Stripe, analytics, live E2E check) and you can link it in source.",
                    "enum": ["self_reported", "verified"],
                    "type": "string"
                  },
                  "open_asks": {
                    "description": "Each ask still open, with its age",
                    "items": {
                      "properties": {
                        "age_hours": {
                          "description": "How long this ask has been open, in hours",
                          "maximum": 100000,
                          "minimum": 0,
                          "type": "number"
                        },
                        "summary": {
                          "maxLength": 200,
                          "type": "string"
                        }
                      },
                      "required": ["age_hours"],
                      "type": "object"
                    },
                    "maxItems": 20,
                    "type": "array"
                  },
                  "open_now": {
                    "maximum": 1000000,
                    "minimum": 0,
                    "type": "integer"
                  },
                  "source": {
                    "description": "Where the number comes from: a URL, query name, or system",
                    "maxLength": 500,
                    "type": "string"
                  },
                  "total_wait_hours": {
