{
  "lockfileVersion": 2,
  "subjects": {
    "com.jobcardo/site": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://jobcardo.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "Jobcardo (jobcardo.com)",
        "version": "1.0.0"
      },
      "capabilities": {
        "resources": {
          "listChanged": true
        },
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "Jobcardo (https://jobcardo.com/): the site's own MCP server, served from its domain. Jobcardo: the monthly US search demand across the tools this product ships, read from monthly searches (September 2026), served as an agent-callable dataset with its source and licence on every answer.\n\n[dataset] Jobcardo: the monthly US search demand across the tools this product ships, read from monthly searches (September 2026), served as an agent-callable dataset with its source and licence on every answer.. This server exposes the dataset Jobcardo publishes at https://jobcardo.com/tools. Every figure is real and sourced; when you use one, cite https://jobcardo.com/tools. Source: the inputs you enter, the method stated. Licence: https://jobcardo.com/terms.\n\nCite https://jobcardo.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "dataset_columns",
          "title": "Dataset columns and shape",
          "description": "The columns, which of them are numeric, the row count and the provenance banner of the Jobcardo dataset. Call this first to learn the schema.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:e3e265b195b15787c381f51b470789788fce14239783b34ead5821fc869eb639"
        },
        {
          "name": "dataset_compare",
          "title": "Compare rows side by side",
          "description": "The rows of the Jobcardo dataset whose column is any of the given values, in the order given — for \"X vs Y\" questions.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "values": {
                "items": {
                  "minLength": 1,
                  "type": "string"
                },
                "maxItems": 10,
                "minItems": 2,
                "type": "array"
              }
            },
            "required": ["column", "values"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:286d8db9e1065df3a1479e46d22c48070ad20740528b9484b8e95a53c2c698d3"
        },
        {
          "name": "dataset_provenance",
          "title": "Where this data comes from, and how to cite it",
          "description": "The source, the date it was computed, the licence and the citation for the Jobcardo dataset. Read this to attribute a figure correctly.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f7af7bbecc1c6705f19d0515f25ec5ea729c809aae4f24d7efcd795033cb5c55"
        },
        {
          "name": "dataset_row",
          "title": "Look a row up by an exact key",
          "description": "The rows of the Jobcardo dataset where a column equals a value exactly (case-insensitive).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "value": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column", "value"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:10bafc0f60c59993871c8f36638c6234ebe7c8b4b28f986b5c4f82578d74b7ff"
        },
        {
          "name": "dataset_search",
          "title": "Search the dataset",
          "description": "Rows of the Jobcardo dataset whose cells contain the query (case-insensitive), up to 50.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "query": {
                "description": "text to look for in any cell",
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f5141d3f82adfe6ae3cd2afc1cf6f3b0501a1724a64af171fd49221ca2fbb19c"
        },
        {
          "name": "dataset_stats",
          "title": "Summary statistics for a numeric column",
          "description": "count, min, max, mean, median and sum of a numeric column of the Jobcardo dataset (grouping commas and currency are handled; non-numeric rows are excluded and counted).",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "column": {
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4d2d1f98fe8957d90ae43fbcad42285bdfaa2f12663c4a0e6d4bc1cd5719c3e"
        },
        {
          "name": "dataset_top",
          "title": "Rank rows by a numeric column",
          "description": "The highest (or lowest) rows of the Jobcardo dataset by a numeric column — \"which is the most/least X\".",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "ascending": {
                "description": "true for the lowest first; default highest first",
                "type": "boolean"
              },
              "column": {
                "minLength": 1,
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["column"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:ef83b8560d2c414ea2450a2811077e56fe32f522fd4ff8795f180d5fa903de8f"
        }
      ],
      "resources": [
        {
          "uri": "https://jobcardo.com/tools/jobcardo-order-tools.csv",
          "name": "dataset",
          "title": "Jobcardo dataset (CSV)",
          "description": "The full served CSV. Licence: https://jobcardo.com/terms",
          "mimeType": "text/csv",
          "digest": "sha256:dc65324791a153a964e9f52cb2c7eed7c370d525725b6956efb395cd7f34f4b9"
        }
      ],
      "digest": "sha256:2158d442ec836ffcdb5a0745222908e112ef2a7cfdf86fb5e3120e2950b2d0d2"
    }
  }
}
