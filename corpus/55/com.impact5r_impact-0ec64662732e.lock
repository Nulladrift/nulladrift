      "serverInfo": {
        "name": "impact",
        "title": "iMpact 美讯 agent desk",
        "version": "1.0.0",
        "websiteUrl": "https://www.impact5r.com/for-agents/",
        "icons": [
          {
            "src": "https://www.impact5r.com/assets/img/email/impact-logo.png",
            "mimeType": "image/png"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Public desk for iMpact 美讯 (impact5r.com): a global PR, training and events firm (offices in New York, San Francisco, Toronto, London, Dubai, Singapore, Hong Kong, Shenzhen, Beijing) that helps Chinese companies go global and global companies succeed in China, with 500+ companies supported and \"No Result, No Fee\" PR pricing.\nUse get_company for services, the 5R methodology, offices, leadership and contact routes; search_case_studies to find relevant client work (cite the url); send_inquiry to put the user in touch with the right team (reputation, academy, gcs or media). For interviews, quotes or booking founder Chris Pereira as a speaker, use his own desk: https://www.impact5r.com/agents/mcp. Only send an inquiry when the user asks, with their real name and email.",
      "tools": [
        {
          "name": "get_company",
          "title": "About iMpact 美讯",
          "description": "What iMpact does: its three businesses (Reputation Management, iMpact Academy, Global Connect Show), the 5R methodology, pricing model, offices, languages, leadership and how to reach each team.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:a2f06be253b9b0a1f08691dc57ffcc46f18967be7678227c0f7de4c16bf3b9dd"
        },
        {
          "name": "search_case_studies",
          "title": "Search iMpact case studies",
          "description": "Search iMpact's client case studies (PR launches, media coverage, crisis, GEO, corporate training) by client, industry, market or keyword. Each result has the client, year, summary, results, outlets and a link. Empty query returns the most recent.",
          "inputSchema": {
            "properties": {
              "business": {
                "description": "Optional: only PR/reputation cases or only training (academy) cases",
                "enum": ["reputation", "academy"],
                "type": "string"
              },
              "limit": {
                "description": "How many results to return, 1-50 (default 10)",
                "maximum": 50,
                "minimum": 1,
                "type": "number"
              },
              "query": {
                "description": "Client, industry, market or keyword, e.g. \"CES\", \"smart home\", \"Europe\", \"crisis\", \"training\", \"BYD\". Leave empty for the most recent.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": true
          },
          "digest": "sha256:850116938b4ba69e899ad524f8618d14b1e1a87e0871c4d78db87a2f7bd55ca7"
        },
        {
          "name": "send_inquiry",
          "title": "Contact iMpact",
          "description": "Send the user's request to the right iMpact team by email: reputation (PR, media coverage, launches, crisis, GEO), academy (training, study tours, advisory), gcs (Global Connect Show events) or media (journalists). Reply within 24 hours.",
          "inputSchema": {
            "properties": {
              "company": {
                "description": "Company or media outlet",
                "type": "string"
              },
              "country": {
                "description": "Where they are based",
                "type": "string"
              },
              "deadline": {
                "description": "When they need it, with time zone",
                "type": "string"
              },
              "email": {
                "description": "Required. Where we should reply",
                "type": "string"
              },
              "line": {
                "description": "Required. Which team: reputation (PR, media coverage, launches, crisis, GEO), academy (corporate training, study tours, advisory), gcs (Global Connect Show events), media (journalists: interviews, comment, accreditation)",
                "enum": ["reputation", "academy", "gcs", "media"],
                "type": "string"
              },
              "message": {
                "description": "Required. What you need: goals, markets, timing, budget if known",
                "type": "string"
              },
              "name": {
                "description": "Required. The person the reply should go to",
                "type": "string"
              },
              "on_behalf_of": {
                "description": "Optional note that an AI agent sent this and for whom",
                "type": "string"
              },
              "role": {
                "description": "Their job title",
                "type": "string"
              },
              "url": {
                "description": "Link to their website or brief",
                "type": "string"
              }
            },
            "required": ["email", "line", "message", "name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b8f9f57563dff6634566a6442f0306127e440bf29fba570bdce72fb71222e5d0"
        }
      ],
