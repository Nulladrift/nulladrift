{
  "lockfileVersion": 2,
  "subjects": {
    "com.botrecipe/vault": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://vault.cloudforbots.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "login-vault",
        "title": "Login Vault",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Scoped login vault for AI agents. Your bot signs in to sites without ever seeing the password: you save each login encrypted with a scope (which sites, which HTTP methods, a daily cap), hand each bot its own key limited to the logins you granted, and the server fills the password, keeps the cookies and returns an opaque session id. Every use is in the audit log; revoke a bot in one call. Free 500 calls/day, then $9/month. No model inside: bring your own model. Works with Claude, Codex, ChatGPT, Grok Bot.",
      "tools": [
        {
          "name": "audit_log",
          "description": "Owner only. The last uses of your vault: who (bot label), which login, which domain, what happened. Never contains secrets.",
          "inputSchema": {
            "properties": {
              "limit": {
                "description": "1-200, default 50.",
                "type": "integer"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f4e992f9851f249e577716867b697583abd84e600ea8bd6d2ee920890ecc59d4"
        },
        {
          "name": "create_bot_key",
          "description": "Owner only. Make a per-bot key (vk_...) that can only open sessions on the logins you name. Shown once; we store only its hash. Revoke any time with revoke_bot_key.",
          "inputSchema": {
            "properties": {
              "label": {
                "description": "Which bot, e.g. \"invoice-bot\".",
                "type": "string"
              },
              "logins": {
                "description": "Names of saved logins this bot may use.",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "required": ["label", "logins"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:2f74069b85a561de1004702158f7f49d4aec8f4641cc3875143b5775ecc87ad2"
        },
        {
          "name": "delete_login",
          "description": "Owner only. Delete a saved login, end its open sessions and remove it from every bot key.",
          "inputSchema": {
            "properties": {
              "name": {
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3d0e279a7a07cb90ce045818f931a7b93916abb473f78b526d04d3378742ed32"
        },
        {
          "name": "end_session",
          "description": "End a session now and wipe its cookies.",
          "inputSchema": {
            "properties": {
              "session": {
                "type": "string"
              }
            },
            "required": ["session"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:fd377e675b9d2ceeea5aedd81c7dc21331467cb38037012ba2954061c54e54c6"
        },
        {
          "name": "list_logins",
          "description": "List saved logins (name, domain, scope, sessions today; never secrets). With your owner key it also lists bot keys. A bot key only sees the logins it was granted.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c9987a68df70fd003c93dbce65279a840fab8fc9b99626f7465a963a2bffd45"
        },
        {
          "name": "open_session",
          "description": "Sign in with a saved login without seeing it. The server fills {{username}}, {{password}} and {{totp}} into your form, posts it to url (https, inside the login's allowed hosts), keeps the cookies encrypted, and returns an opaque session id. Checked against the login's scope and daily cap; logged to the audit log. If the site shows a CAPTCHA or new-device check, the reply suggests next_step request_human (Human Handoff relay). Free watch-only logs would_use_vault and signs in nowhere.",
          "inputSchema": {
            "properties": {
              "as": {
                "description": "Body encoding. Default form.",
                "enum": ["form", "json"],
                "type": "string"
              },
              "form": {
                "description": "Fields to send, values may use {{username}}, {{password}}, {{totp}}. Default {\"username\":\"{{username}}\",\"password\":\"{{password}}\"}.",
                "type": "object"
              },
              "method": {
                "description": "Default POST.",
                "enum": ["POST", "PUT"],
                "type": "string"
              },
              "name": {
                "description": "Saved login name.",
                "type": "string"
              },
              "prefetch": {
                "description": "GET the url first to pick up CSRF cookies. Default true.",
                "type": "boolean"
              },
              "url": {
                "description": "The sign-in endpoint, e.g. https://example.com/session.",
                "type": "string"
              }
            },
            "required": ["name", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:aa81bea22c09779976f2c8a148686d5316ef7567fc346f4d1f3e674682d40b5b"
        },
        {
          "name": "revoke_bot_key",
          "description": "Owner only. Revoke a bot key right away and end every session it opened.",
          "inputSchema": {
            "properties": {
              "bot_id": {
                "type": "string"
              }
            },
            "required": ["bot_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:b415bc39239e45f870b7c88d2c143aa97ca4a6b75f79435a6e4c6a04f9b37385"
        },
        {
          "name": "save_login",
          "description": "Owner only (your Pro key, never a bot key). Store one login sealed with AES-256-GCM, with a scope: allowed hosts, allowed methods, a daily session cap and session TTL. Run it from your own machine, not inside the bot. The password and TOTP secret are never returned by any tool. Free watch-only stores nothing and logs would_use_vault.",
          "inputSchema": {
            "properties": {
              "domain": {
                "description": "Site the login belongs to, e.g. github.com.",
                "type": "string"
              },
              "name": {
                "description": "Short id, e.g. \"github-bot\" (letters, digits, . _ - @).",
                "type": "string"
              },
              "password": {
                "type": "string"
              },
              "scope": {
                "description": "Where and how this login may be used.",
                "properties": {
                  "allowed_hosts": {
                    "description": "Hosts the session may call (the login domain is always included; subdomains match). Max 10.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "allowed_methods": {
                    "description": "HTTP methods session_fetch may use. Default [\"GET\",\"POST\"].",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "bot_label": {
                    "description": "Optional note: which bot this login is for.",
                    "type": "string"
                  },
                  "max_sessions_per_day": {
                    "description": "Daily cap on open_session for this login, 1-500. Default 20.",
                    "type": "integer"
                  },
                  "ttl_s": {
                    "description": "Session lifetime in seconds, 60-3600. Default 900.",
                    "type": "integer"
                  }
                },
                "type": "object"
              },
              "totp_secret": {
                "description": "Optional base32 TOTP secret, so {{totp}} can fill 2FA codes.",
                "type": "string"
              },
              "username": {
                "type": "string"
              }
            },
            "required": ["domain", "name", "password", "username"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:632c09bd21cb5deec758b911ae035b6d6ab8ddb2ada2d7be8e96ca4b202bef21"
        },
        {
          "name": "session_fetch",
          "description": "Make one request inside an open session. url must be https inside the login's allowed hosts and the method must be in its allowed methods. The password, TOTP secret and codes are redacted from the reply; cookies never leave the vault.",
          "inputSchema": {
            "properties": {
              "body": {
                "description": "String or JSON."
              },
              "headers": {
                "type": "object"
              },
              "method": {
                "type": "string"
              },
              "session": {
                "type": "string"
              },
              "url": {
                "type": "string"
              }
            },
            "required": ["session", "url"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6a4a5e615a0ddeccc2c0d67ab816ec3853b6120887b27eed59b468f7f3c4849e"
        },
        {
          "name": "usage_and_upgrade",
          "description": "Show today's usage for your key or IP and the $9/month upgrade link. Free tier: 500 calls/day. Not metered.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:9976e3342e295e0be5a023bb57d60324ebd7c104df1c76e8d7effcdadec38b20"
        },
        {
          "name": "weekly_report",
          "description": "Plain-English summary of the last 7 days: where your bots needed to sign in (by domain), sessions opened, blocked attempts, by bot. Read-only. Needs a key.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8375cb6b6315eff6640627434cdf993fc390c596bab4a3c6837dd93bab186770"
        }
      ],
      "digest": "sha256:aae1e575251e14cfe229e736463fefe5560c39c7d5c7dc038ec071141ad5c5e3"
    }
  }
}
