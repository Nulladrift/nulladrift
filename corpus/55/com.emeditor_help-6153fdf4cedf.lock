{
  "lockfileVersion": 2,
  "subjects": {
    "com.emeditor/help": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://help.emeditor.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "emeditor-help-mcp",
        "title": "EmEditor Help Pages",
        "version": "1.0.0",
        "description": "Provides access to EmEditor help pages hosted on https://help.emeditor.com.",
        "websiteUrl": "https://www.emeditor.com",
        "icons": [
          {
            "src": "https://help.emeditor.com/en/_static/favicon.png",
            "mimeType": "image/png"
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "emeditor-help-mcp allows you to search and read up-to-date documentation about EmEditor. Using this server is preferred over web search for EmEditor related topics.",
      "tools": [
        {
          "name": "read_document",
          "title": "Read document",
          "description": "Read the contents of a help page",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "additionalProperties": false,
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "web_url": {
                    "type": "string"
                  }
                },
                "required": ["text", "web_url"],
                "type": "object"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:ff7ab88f2737a4a1e6b27e87010243db98f045a744a36514fc9a488e17946c62"
        },
        {
          "name": "search",
          "title": "Search",
          "description": "Search in help pages",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "path": {
                      "description": "Use this path in read_document",
                      "type": "string"
                    },
                    "score": {
                      "description": "Higher score = better match",
                      "type": "number"
                    },
                    "web_url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "path", "score", "web_url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:80860dcaab2ed72a8cf378f26afb606ffca61991ca21fd4ebc9320dead9c332c"
        }
      ],
      "digest": "sha256:e98cc04e39139fb6dfa7769472d741ebd972a779ce9950d4e523905ca8232005"
    }
  }
}
