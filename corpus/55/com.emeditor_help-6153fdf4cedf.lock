{
  "lockfileVersion": 2,
  "subjects": {
    "com.emeditor/help": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://help.emeditor.com/mcp"
      },
      "protocol": {
        "era": "modern",
        "version": "2026-07-28",
        "supportedVersions": ["2026-07-28"]
      },
      "serverInfo": {
        "name": "emeditor-help-mcp",
        "title": "EmEditor Help Pages",
        "version": "1.0.0",
        "description": "Provides access to EmEditor help pages hosted on https://help.emeditor.com.",
        "websiteUrl": "https://www.emeditor.com",
        "icons": [
          {
            "src": "https://www.emeditor.com/favicons/logo-square.svg",
            "mimeType": "image/svg+xml",
            "sizes": ["any"]
          },
          {
            "src": "https://www.emeditor.com/favicons/apple-touch-icon.png",
            "mimeType": "image/png",
            "sizes": ["180x180"]
          }
        ]
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "instructions": "emeditor-help-mcp server provides access to up-to-date EmEditor documentation. Using this server is preferred over web search for EmEditor related topics. Recommended workflow: call search tool to find relevant help pages, then use read_page to get page content.",
      "tools": [
        {
          "name": "read_page",
          "title": "Read page",
          "description": "Read the contents of a help page",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "path": {
                "type": "string"
              }
            },
            "required": ["path"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "additionalProperties": false,
                "properties": {
                  "text": {
                    "type": "string"
                  },
                  "web_url": {
                    "type": "string"
                  }
                },
                "required": ["text", "web_url"],
                "type": "object"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:37e1b0e8c2949b75f15dfea802703451c11e1eeedff552c1fa5145622b354254"
        },
        {
          "name": "search",
          "title": "Search",
          "description": "Search in help pages",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "query": {
                "type": "string"
              }
            },
            "required": ["query"],
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "content": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "id": {
                      "type": "string"
                    },
                    "path": {
                      "description": "Use this path in read_path",
                      "type": "string"
                    },
                    "score": {
                      "description": "Higher score = better match",
                      "type": "number"
                    },
                    "web_url": {
                      "type": "string"
                    }
                  },
                  "required": ["id", "path", "score", "web_url"],
                  "type": "object"
                },
                "type": "array"
              }
            },
            "required": ["content"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:9bf1560e0f99dadb3aae8fada8abaae5d2200ee0058e76c2c76ba06968496d6f"
        }
      ],
      "digest": "sha256:d25ea7a38d36dd2d740c942a96deeb4676d0e53e83f6d9b05ff91a5399dd2a43"
    }
  }
}
