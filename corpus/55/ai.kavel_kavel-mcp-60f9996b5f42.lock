{
  "lockfileVersion": 2,
  "subjects": {
    "ai.kavel/kavel-mcp": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://www.kavel.ai/api/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "kavel",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "check_kavel_generation",
          "title": "Check a Kavel generation",
          "description": "Get the result of a Kavel generation that was still rendering.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "task_id": {
                "description": "task_id from generate_kavel_image.",
                "type": "string"
              }
            },
            "required": ["task_id"],
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check a Kavel generation"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "offline_access"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:d1a1c81d87fac2238a7bee68b69c1f470f623851467aba1c1e9a7783e2614c54"
        },
        {
          "name": "find_kavel_tool",
          "title": "Find a Kavel AI photo or video effect",
          "description": "Search Kavel's AI photo and video effects (hairstyle changer, figurine, pet portrait, yearbook photo, trend dance videos and more). Returns each tool's slug, what it needs (a photo or just text) and its page on kavel.ai. Image tools can be run here with generate_kavel_image; video tools open on kavel.ai.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "hub": {
                "description": "Only image or only video tools.",
                "enum": ["image", "video"],
                "type": "string"
              },
              "query": {
                "description": "What the user wants, e.g. 'make my dog look royal' or 'dancing video'.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a Kavel AI photo or video effect"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:ad9f8fbf51494a113ab2f988389bd65ae8380f48052b3ab22d298b2dbaf77dc4"
        },
        {
          "name": "generate_kavel_image",
          "title": "Generate or edit an image with Kavel",
          "description": "Create an image from a prompt, or edit the user's photo, on their Kavel account. Pass `tool` (a slug from find_kavel_tool) to apply that effect's tuned recipe, with `prompt` holding the user's own details. Photo tools need a photo: the user's attachment in `photos`, or a public link in `image_urls`. Spends credits from the linked Kavel account. Usually returns the image within a minute; otherwise returns a task_id for check_kavel_generation.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "aspect_ratio": {
                "description": "Output image shape. Defaults to 1:1.",
                "enum": ["1:1", "16:9", "9:16", "4:3", "3:4"],
                "type": "string"
              },
              "image_urls": {
                "description": "Photos to edit given as public http(s) links, when not attached.",
                "items": {
                  "format": "uri",
                  "type": "string"
                },
                "maxItems": 4,
                "type": "array"
              },
              "photos": {
                "description": "Photos the user attached in the chat. Required by photo tools.",
                "items": {
                  "properties": {
                    "download_url": {
                      "format": "uri",
                      "type": "string"
                    },
                    "file_id": {
                      "type": "string"
                    },
                    "file_name": {
                      "type": "string"
                    },
                    "mime_type": {
                      "type": "string"
                    }
                  },
                  "required": ["download_url", "file_id"],
                  "type": "object"
                },
                "maxItems": 4,
                "type": "array"
              },
              "prompt": {
                "description": "The user's description, or their extra details when a tool is given.",
                "maxLength": 2000,
                "type": "string"
              },
              "tool": {
                "description": "Optional image tool slug from find_kavel_tool.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Generate or edit an image with Kavel"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "openai/fileParams": ["photos"],
            "openai/toolInvocation/invoked": "Done",
            "openai/toolInvocation/invoking": "Generating with Kavel…",
            "securitySchemes": [
              {
                "scopes": ["openid", "offline_access"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:6edb32c03c275179d1bf8a192df49111de67eb92fa9356828d3fe6ef7deccbfe"
        },
        {
          "name": "get_kavel_balance",
          "title": "Kavel credit balance",
          "description": "How many credits are left on the linked Kavel account.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {},
            "type": "object"
          },
          "annotations": {
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Kavel credit balance"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["openid", "offline_access"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:8b4275b6b85b32c2f37c7fc6cd15b35fed1c83582664233fb9453a9ea65a0b80"
        }
      ],
      "digest": "sha256:72f93481f1d8a185166952bb8943ff91f091532097223706936aae0d9f84f1cf"
    }
  }
}
