      },
      "instructions": "Shoptegrity provides ownership, integrity and local-alternative information. Values are returned only when they have a cited source; a null field means withheld, not unknown, and 'Withheld: no cited source yet' is not a negative finding. Results show price alongside who owns the business, whether it is local, independent or member-owned, and the cited records behind each claim. Grades, tiers and ratings are Shoptegrity opinions under the published methodology (/methodology), not measurements. Holiday tools: holiday_shopping_guide gives dates and a plan, check_cart looks up each item on a list, responsible_alternatives searches independent sellers, check_deal compares a sale price with recorded history, and verified_deals lists recorded price drops. About Shoptegrity: it pledges 20% of its profit to five charities, listed at https://shopteg.com/giving.",
      "tools": [
        {
          "name": "browse_alternatives",
          "title": "Browse cited alternatives",
          "description": "Alternatives to mainstream shopping that have a cited basis: employee-owned, cooperative, credit union,\n    B Corp or family-owned sellers. structure filters by kind (for example 'employee-owned', 'cooperative',\n    'credit union', 'b corp'); query filters by words in the name or the category it substitutes for\n    (for example 'grocery' or 'hardware'). Each result carries the source that backs it. Not ranked by commission.",
          "inputSchema": {
            "properties": {
              "limit": {
                "default": 20,
                "title": "Limit",
                "type": "integer"
              },
              "query": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Query"
              },
              "structure": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Structure"
              }
            },
            "title": "browse_alternativesArguments",
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "result": {
                "additionalProperties": true,
                "title": "Result",
                "type": "object"
              }
            },
            "required": ["result"],
            "title": "browse_alternativesOutput",
            "type": "object"
          },
