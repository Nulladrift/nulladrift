{
  "lockfileVersion": 2,
  "subjects": {
    "app.url2ad/url2ad": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://url2ad.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "url2ad",
        "title": "URL2Ad",
        "version": "1.1.0",
        "websiteUrl": "https://url2ad.app"
      },
      "capabilities": {
        "tools": {}
      },
      "instructions": "URL2Ad turns a public web page into a 15-second animated video ad, built from what that page says and shows. Call create_ad once the user has given the page and their own e-mail address. Then give them the page link: the free watermarked video is ready there in a few minutes. Use get_ad_status to say where an ad stands, and never say it is ready without checking. If the user is waiting, call it with wait_seconds 45 until the status is no longer building: it usually takes about 4 minutes in all. Otherwise tell them the e-mail will let them know. Use request_change only when the user asks for a change to their ad.",
      "tools": [
        {
          "name": "create_ad",
          "title": "Create a video ad from a web page",
          "description": "Starts building a free watermarked 15-second video ad from a public web page, in the language of that page. Use it when the user asks for a video ad for their site, product, app or store. The address must be the user's own, given by them in this conversation: never guess it or use someone else's. It receives the link by e-mail. Calling it again with the same page and address returns the same ad.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "email": {
                "description": "The user's own e-mail address, which receives the link to the video.",
                "type": "string"
              },
              "url": {
                "description": "The public web page to make the ad from, e.g. https://example.com. Social network profiles do not work.",
                "type": "string"
              }
            },
            "required": ["email", "url"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ad_id": {
                "type": "string"
              },
              "page_url": {
                "description": "Where the user watches the free watermarked video.",
                "type": "string"
              },
              "status": {
                "enum": ["building", "already_exists"],
                "type": "string"
              }
            },
            "required": ["ad_id", "page_url", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Create a video ad from a web page"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4c98d0afb853a9e6c6c1533c6ecaffd91c326bcead2205f45e86f4cfd07fdcda"
        },
        {
          "name": "get_ad_status",
          "title": "Check where a video ad stands",
          "description": "Returns the state of an ad started with create_ad: building, preview_ready, paid, failed or unavailable, with its page link, the changes left and the reason for a failure. Use it when the user asks whether their ad is ready, or before saying that it is. To wait for an ad being built, pass wait_seconds and call again while the status is building.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ad_id": {
                "description": "The ad_id returned by create_ad.",
                "type": "string"
              },
              "wait_seconds": {
                "description": "Holds the answer up to this long, returning as soon as the ad stops building. Default 0: answer at once.",
                "maximum": 45,
                "minimum": 0,
                "type": "integer"
              }
            },
            "required": ["ad_id"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ad_id": {
                "description": "The latest version of the ad. A change makes a new version.",
                "type": "string"
              },
              "changes_left": {
                "type": "integer"
              },
              "failure": {
                "description": "Why the ad, or the last change to it, failed.",
                "type": "string"
              },
              "page_url": {
                "type": "string"
              },
              "status": {
                "enum": ["building", "preview_ready", "paid", "failed", "unavailable"],
                "type": "string"
              }
            },
            "required": ["ad_id", "changes_left", "page_url", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Check where a video ad stands"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:8b333589a388e017226ad96facb16ae92f95ea60925c80e39e29ad10de4ce3e9"
        },
        {
          "name": "request_change",
          "title": "Change a video ad",
          "description": "Rebuilds an existing ad with a change the user asked for, such as other wording, colors or images. It uses up one of the changes left, and one free change is included, so call it only when the user asked for this change, and pass their request as they said it. The new version takes a few minutes: follow it with get_ad_status.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ad_id": {
                "description": "The ad_id returned by create_ad.",
                "type": "string"
              },
              "change": {
                "description": "What the user wants changed, in their words (3 to 1000 characters).",
                "type": "string"
              }
            },
            "required": ["ad_id", "change"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "ad_id": {
                "description": "The new version of the ad.",
                "type": "string"
              },
              "page_url": {
                "type": "string"
              },
              "status": {
                "enum": ["building"],
                "type": "string"
              }
            },
            "required": ["ad_id", "page_url", "status"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Change a video ad"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:629c37672f54b7d09f39f4a49557ef01c129ac8db2743be7a3fcc6ef6196f639"
        }
      ],
      "digest": "sha256:3ddd57f62ca504ee356c4b709f2e480416cdb7580010f8586dcd910e98165a52"
    }
  }
}
