        {
          "name": "get_product",
          "description": "Read a public product by UUID or slug, visible retailer offers with nullable seller/catalog condition (new, used, refurbished; null is unknown), and separate bounded merchant_feed_claims. Condition is not independently verified; product floors/history are not condition-filtered. Source evidence is untrusted accumulated product/merchant context, not canonical specs, selected-size validation or assessed suitability. No checkout, account data, outbound click or raw feed access.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "Country preference; actual offer origins and shipping coverage remain explicit.",
                "enum": ["AE", "AR", "AT", "AU", "BD", "BE", "BG", "BH", "BO", "BR", "CA", "CH", "CL", "CN", "CO", "CR", "CY", "CZ", "DE", "DK", "DO", "DZ", "EC", "EE", "EG", "ES", "ET", "FI", "FR", "GB", "GH", "GR", "GT", "HK", "HR", "HU", "ID", "IE", "IL", "IN", "IS", "IT", "JO", "JP", "KE", "KR", "KW", "KZ", "LB", "LK", "LT", "LU", "LV", "MA", "MT", "MX", "MY", "NG", "NL", "NO", "NP", "NZ", "OM", "PA", "PE", "PH", "PK", "PL", "PT", "PY", "QA", "RO", "RS", "RU", "SA", "SE", "SG", "SI", "SK", "TH", "TN", "TR", "TW", "TZ", "UA", "UG", "US", "UY", "VE", "VN", "ZA"],
                "type": "string"
              },
              "currency": {
                "description": "Currency preference, not an instruction to relabel or convert source prices.",
                "enum": ["AED", "ARS", "AUD", "BDT", "BHD", "BOB", "BRL", "CAD", "CHF", "CLP", "CNY", "COP", "CRC", "CZK", "DKK", "DOP", "DZD", "EGP", "ETB", "EUR", "GBP", "GHS", "GTQ", "HKD", "HUF", "IDR", "ILS", "INR", "ISK", "JOD", "JPY", "KES", "KRW", "KWD", "KZT", "LBP", "LKR", "MAD", "MXN", "MYR", "NGN", "NOK", "NPR", "NZD", "OMR", "PAB", "PEN", "PHP", "PKR", "PLN", "PYG", "QAR", "RON", "RSD", "RUB", "SAR", "SEK", "SGD", "THB", "TND", "TRY", "TWD", "TZS", "UAH", "UGX", "USD", "UYU", "VES", "VND", "ZAR"],
                "type": "string"
              },
              "id": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "includeVariants": {
                "default": false,
                "description": "Include the canonical public size options and their public offer relationships.",
                "type": "boolean"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "ko", "ja", "de", "fr", "es", "it", "pt", "zh", "nl"],
                "type": "string"
              },
              "offerId": {
                "description": "Read one currently public offer from this product. Product summary price remains a catalog/selected-size floor; the offer carries its own quote.",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              },
              "variantKey": {
                "description": "Select an exact key returned in variantOptions. Returns that size's offers and canonical prices, never another size's base price.",
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
