        {
          "name": "get_price_history",
          "description": "Read bounded daily effective-lowest USD history for a public product or one of its public offers. Uses existing last-observation-carried-forward aggregation, not condition-filtered history; a day is not a new seller price check.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "days": {
                "default": 14,
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "id": {
                "maxLength": 200,
                "minLength": 1,
                "type": "string"
              },
              "locale": {
                "default": "en",
                "enum": ["en", "ko", "ja", "de", "fr", "es", "it", "pt", "zh", "nl"],
                "type": "string"
              },
              "offerId": {
                "description": "Optional public offer belonging to this product.",
                "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
