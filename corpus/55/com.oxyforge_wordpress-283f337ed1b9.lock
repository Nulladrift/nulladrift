      "instructions": "Oxyforge hosts WordPress. With these tools you can create a temporary WordPress site for the person you are helping, build it, and hand it over.\n\nHow to work:\n1. create_site. Save the returned token: every other tool needs the site name and that token. Tell the person the visitor login and the claim link.\n2. Wait with get_site until state is \"awake\" (about a minute).\n3. Build with run_wp_cli (any WP-CLI command, without the leading \"wp\") and write_file (your own theme or plugin under themes/, plugins/ or uploads/).\n4. Hand over: give the person the site address, the visitor login (user and password), and the claim link. Opening the claim link and signing up free moves the site into their own Oxyforge account.\n\nWorking on your own sites: when the person signed in with Oxyforge (the /mcp/account address) or connected with an account agent key, start with list_sites and leave the token out of every call; the key decides which sites you may touch and whether you may change them. Take a backup with backup_site before a risky change.\n\nRules for new sites: every site is password protected and cannot be made public while temporary. It is up for 24 hours; if the person has not claimed it by then it is deleted, so hand over the claim link early. A claimed site sleeps for 24 hours before it is deleted, and choosing a plan keeps it. Sites cannot send email. Until the site is claimed, Oxyforge shows a bar along the bottom of every page with the claim link and the time left; it is meant for the person, cannot be removed by you, and disappears by itself once they claim. A site has a quarter of a CPU core; one kept at its limit for 15 minutes is put to sleep early.",
      "tools": [
