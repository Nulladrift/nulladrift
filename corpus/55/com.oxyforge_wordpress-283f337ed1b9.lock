          "name": "backup_site",
          "title": "Back up a site now",
          "description": "Take a backup of one of the account's sites now, before a risky change (account agent key that may make changes; one every few minutes per site).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "site": {
                "description": "the site name, from create_site or list_sites",
                "type": "string"
              },
              "token": {
                "description": "the token create_site returned (oxa_...); leave out when Oxyforge is connected with an account agent key",
                "type": "string"
              }
            },
            "required": ["site"],
            "type": "object"
          },
