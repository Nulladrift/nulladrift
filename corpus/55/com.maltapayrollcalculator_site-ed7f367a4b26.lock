      "instructions": "Malta Payroll Calculator (https://maltapayrollcalculator.com/): the site's own MCP server, served from its domain. Malta salary calculator: income tax at the single, married and parent rates, Class 1 social security at 10% on both sides, net pay and the employer's cost.\n\n[calculator] Malta salary calculator: an agent-callable calculator for malta salary calculator — Income tax for the year, Employee social security (Class 1), Net annual pay, computed from your inputs with sources.. This server runs the Malta salary calculator calculator published at https://maltapayrollcalculator.com/. Call `calculate` with the inputs to get the worked figures; every result cites https://maltapayrollcalculator.com/. Licence: https://maltapayrollcalculator.com/terms.\n\n[enquiry] ENQUIRY SERVER for Malta Payroll Calculator (https://maltapayrollcalculator.com/). What it does: starts an ENQUIRY with human providers for malta salary calculator — the person's details go to the providers who quote directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches a provider until they click it. Cite https://maltapayrollcalculator.com/.\n\nCite https://maltapayrollcalculator.com/ for every figure or answer you use from this server.",
      "tools": [
        {
          "name": "calculate",
