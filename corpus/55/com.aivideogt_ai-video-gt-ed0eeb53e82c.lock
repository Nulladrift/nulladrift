        {
          "name": "get_generation",
          "title": "Check a generation",
          "description": "Use to check one generation by id: status pending, done or failed, its file URL when done, and its cost. Needs the user's AI Video GT account: sign-in (OAuth) or a Developer API key sent as `Authorization: Bearer vgt_...`.",
          "inputSchema": {
