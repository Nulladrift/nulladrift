        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "ai-video-gt",
        "title": "AI Video GT",
        "version": "1.1.0",
        "websiteUrl": "https://aivideogt.com/mcp-server"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "AI Video GT (aivideogt.com) makes AI videos with sound and AI images with in-house models, priced in credits. Use list_models and estimate_cost to pick a model and quote its price, generate_video and generate_image to make media with the user's credits (these need the user's AI Video GT account, connected by sign-in or a Developer API key), get_generation and list_generations to fetch results, get_account for the credit balance, and find_video_tool when the user wants to edit a video they already have with a free browser tool. If the user is not connected, ask them to sign in to AI Video GT when the app offers it (ChatGPT) or to add a Developer API key from https://aivideogt.com/account; credits come with a plan: https://aivideogt.com/pricing.",
      "tools": [
        {
          "name": "estimate_cost",
          "title": "Estimate a generation's cost",
          "description": "Use to tell the user how many credits a video or image will cost before making it. Returns the exact credits for a model at a given resolution and, for video, clip length. No key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "Video only: clip length in seconds, one of the model's durations. Defaults to its shortest.",
                "type": "number"
              },
              "model": {
                "description": "Model id from list_models.",
                "enum": ["genesis-flash", "vanta-ultra", "vanta-fast", "vanta-lite", "nimbus-pro", "spectra-5", "fusion-2", "graphite-2"],
                "type": "string"
              },
              "resolution": {
                "description": "One of the model's resolutions. Defaults to its lowest.",
                "type": "string"
              }
            },
            "required": ["model"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Estimate a generation's cost"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:9ed3d8c8420e8d1c891ab45e86c41f819140da7d8f599b515e25373228c811cf"
        },
        {
          "name": "find_video_tool",
          "title": "Find a free browser video tool",
          "description": "Use when the user wants to edit a video file they already have: trim, cut, crop, resize, compress, convert, merge, add music, extract audio, make a GIF, record the screen and more. Returns free AI Video GT tools that run in the browser (the file never leaves the user's device), with links. No key needed.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "group": {
                "description": "Only tools in this group.",
                "enum": ["Edit", "Convert", "Audio", "Record"],
                "type": "string"
              },
              "query": {
                "description": "What the user wants to do, e.g. \"compress\", \"mp4 to gif\", \"add music\". Leave out to list every tool.",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Find a free browser video tool"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "meta": {
            "securitySchemes": [
              {
                "type": "noauth"
              }
            ]
          },
          "digest": "sha256:df1042bcebd510a47850087eaa15acd006d326516a73f65005876b411088c6ff"
        },
        {
          "name": "generate_image",
          "title": "Generate an image",
          "description": "Use when the user asks for a new AI image from a text description. Spends credits from the user's AI Video GT account (quote the price with estimate_cost first), waits until the image is ready and returns its URL. Failed generations are refunded automatically. Needs the user's AI Video GT account: sign-in (OAuth) or a Developer API key sent as `Authorization: Bearer vgt_...`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "One of the model's aspect ratios, e.g. 1:1 or 16:9. Defaults to the first.",
                "type": "string"
              },
              "model": {
                "description": "Image model id from list_models.",
                "enum": ["nimbus-pro", "spectra-5", "fusion-2", "graphite-2"],
                "type": "string"
              },
              "prompt": {
                "description": "The image to make.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "resolution": {
                "description": "One of the model's resolutions, e.g. 1K, 2K or 4K. Defaults to 1K.",
                "type": "string"
              }
            },
            "required": ["model", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate an image"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
                "scopes": ["mcp"],
                "type": "oauth2"
              }
            ]
          },
          "digest": "sha256:c5b47f9b21ea4b868372edf695fdf7e1a0cc81c5dd27b961b9c653fe5e7acd0a"
        },
        {
          "name": "generate_video",
          "title": "Generate a video",
          "description": "Use when the user asks for a new AI video from a text description. Spends credits from the user's AI Video GT account (quote the price with estimate_cost first) and waits until the clip is ready, usually 10 seconds to 3 minutes, then returns its URL. If the call times out, find the result with list_generations. Failed generations are refunded automatically. Needs the user's AI Video GT account: sign-in (OAuth) or a Developer API key sent as `Authorization: Bearer vgt_...`.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "aspect_ratio": {
                "description": "One of the model's aspect ratios, e.g. 16:9 or 9:16. Defaults to the first.",
                "type": "string"
              },
              "duration": {
                "description": "Clip length in seconds, one of the model's durations. Defaults to the shortest.",
                "type": "number"
              },
              "model": {
                "description": "Video model id from list_models.",
                "enum": ["genesis-flash", "vanta-ultra", "vanta-fast", "vanta-lite"],
                "type": "string"
              },
              "prompt": {
                "description": "The shot to make: subject, action, setting, camera, light and any sound.",
                "maxLength": 4000,
                "minLength": 1,
                "type": "string"
              },
              "resolution": {
                "description": "One of the model's resolutions, e.g. 720p. Defaults to the lowest.",
                "type": "string"
              }
            },
            "required": ["model", "prompt"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false,
            "title": "Generate a video"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "meta": {
            "securitySchemes": [
              {
