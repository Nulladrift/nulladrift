        },
        {
          "name": "list_generations",
          "title": "List recent generations",
          "description": "Use to find the user's recent videos and images, newest first, for example after a generate call timed out. Needs the user's AI Video GT account: sign-in (OAuth) or a Developer API key sent as `Authorization: Bearer vgt_...`.",
          "inputSchema": {
