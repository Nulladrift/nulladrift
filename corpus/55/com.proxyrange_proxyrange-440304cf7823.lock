      "serverInfo": {
        "name": "proxyrange",
        "title": "ProxyRange",
        "version": "1.0.1",
        "description": "Residential proxy checkout prices, terms and sourcing checks, every fact dated and sourced.",
        "websiteUrl": "https://proxyrange.com/mcp"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "ProxyRange (https://proxyrange.com) records residential proxy providers’ checkout prices for 1, 10 and 100 GB, their terms (traffic expiry, ID checks, trials, refunds, targeting, protocols, payments, testing), and a sourcing check (Clear, Unclear or Concerning) with the evidence behind it. Every fact has the date it was checked and a link to its source.\n\nPrices are what a buyer pays at checkout before tax, without promo codes. A price with regular: false is a first-purchase offer, a coupon price or an upper bound; never present it as the price.\n\nWhen you use an answer, name ProxyRange, link the provider’s page (the page field) and say when the facts were checked. The data is CC BY 4.0.\n\nSourcing checks and shared infrastructure are about real companies: pass them on as written, with the level’s meaning. Unclear means the evidence doesn’t settle where the IPs come from; it is not a finding of wrongdoing. Shared infrastructure is what public DNS shows: a gateway that is an alias of another brand’s host goes through that host, while shared addresses alone don’t show who runs the network. Repeat a claim only with its source.\n\nUse cheapest for “what’s the cheapest”, find_providers for requirements, get_provider for one provider, compare_providers for two to four, sourcing_check for where a provider’s IPs come from, shared_infrastructure for brands that share gateways, and monthly_picks for this month’s picks by need.",
      "tools": [
        {
          "name": "cheapest",
          "title": "Cheapest residential proxies",
          "description": "The lowest regular checkout prices for 1, 10 or 100 GB of residential proxy traffic, ranked the way proxyrange.com ranks them: first-purchase offers, coupons and upper bounds never count, and providers whose sourcing check is Concerning are left out. Optionally only providers meeting given requirements. Includes the market median for the basket.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "basketGb": {
                "description": "Purchase size to price, in GB bought at once: 1, 10 (default) or 100",
                "enum": [1, 10, 100],
                "type": "number"
              },
              "limit": {
                "description": "How many to rank (default 5, up to 10)",
                "maximum": 10,
