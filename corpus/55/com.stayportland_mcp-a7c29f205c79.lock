        {
          "name": "get_reviews",
          "title": "Read guest reviews",
          "description": "Recent guest reviews — for one listing (by Guesty id or slug) or across the whole collection. Text, rating, and month+year only.",
          "inputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "properties": {
              "limit": {
                "maximum": 10,
                "minimum": 1,
                "type": "integer"
              },
              "listing": {
                "description": "24-hex Guesty id or property slug; omit for all homes",
                "maxLength": 200,
                "type": "string"
              },
              "offset": {
                "maximum": 100,
                "minimum": 0,
                "type": "integer"
              },
              "sort": {
                "enum": ["recent", "rating_high"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "outputSchema": {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "additionalProperties": false,
            "properties": {
              "averageRating": {
                "type": ["number", "null"]
              },
              "count": {
                "type": "number"
              },
              "nextOffset": {
                "type": ["number", "null"]
              },
              "reviews": {
                "items": {
                  "additionalProperties": false,
                  "properties": {
                    "date": {
                      "description": "YYYY-MM",
                      "type": ["string", "null"]
                    },
                    "rating": {
                      "type": ["number", "null"]
                    },
                    "text": {
                      "maxLength": 2000,
                      "type": "string"
                    }
                  },
                  "required": ["date", "rating", "text"],
                  "type": "object"
                },
                "type": "array"
              },
              "scope": {
                "enum": ["property", "collection"],
                "type": "string"
              }
            },
            "required": ["averageRating", "count", "nextOffset", "reviews", "scope"],
            "type": "object"
