        {
          "name": "complete_booking",
          "title": "Complete an already approved booking",
          "description": "Resume the site's existing reservation finalizer only after the guest approved and authorized payment in hosted checkout. This cannot create or authorize a payment. Completion is controlled by a server flag; check status to follow an in-progress checkout.",
