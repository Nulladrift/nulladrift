          },
          "digest": "sha256:fbee4aa11b1894f322aeafd3f51bf403fc4561594d9d5f91537dc0dcc42895e5"
        },
        {
          "name": "get_price_estimate",
          "title": "Estimate price",
          "description": "Guide price for pitch and persons (category, adults, nights). The adults included in the base price are given per category (included_adults); every additional person aged 15 or older pays a per-person rate plus the local tourist levy per night. Children up to 14 are free. Extras such as electricity are NOT included and are added in the booking form, where the binding amount appears. / Richtpreis ohne Extras; inklusive Erwachsene je Kategorie laut included_adults.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of persons aged 15 or older who stay. The adults already included in the base price are returned per category as included_adults; each additional adult pays a per-person rate.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "category_key": {
                "description": "Pitch category key exactly as returned by get_availability (e.g. BASIC, PREMIUM, PREMIUM_XL, PREMIUM_XXL, MINI or CHALET). Categories differ per event; do not invent keys.",
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Number of children aged up to and including 14. Children up to 14 are free. Optional, default 0.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "event_slug": {
                "description": "Event identifier (slug) exactly as returned in the event_slug field of list_events, e.g. formel-1-camping-spielberg. Do not guess or invent it.",
                "type": "string"
              },
              "nights": {
                "description": "Number of nights, counted within the event window (the campsite opens on the Wednesday before the event; last bookable day is the Monday after). At least the minimum nights returned by list_events (min_nights).",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["adults", "category_key", "event_slug", "nights"],
            "type": "object"
          },
