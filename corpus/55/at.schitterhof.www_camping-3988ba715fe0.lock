      "instructions": "Availability, guide prices and cancellation terms for the event campsite at the Red Bull Ring. Use create_reservation to reserve by voice: it e-mails the payment link; the booking becomes binding when the guest pays.",
      "tools": [
        {
          "name": "create_reservation",
          "title": "Reserve a pitch",
          "description": "Reserve a pitch for the guest and e-mail them the payment link — the whole booking can be done by voice. The spot is held (7 days; 2 days if the event is within 14 days, then instant payment methods only) and becomes binding only when the guest pays via the link (one tap, e.g. Apple Pay). ONLY call after: (1) get_availability showed the category is free, (2) you told the guest the total price and asked ONE short confirmation question, e.g. 'Our terms and cancellation conditions apply, as shown on schitterhof.at (the link comes by e-mail), and after paying you can cancel free of charge for 24 hours (not if arrival is within 3 days) — do you accept and shall I reserve?' — you do NOT have to read the cancellation tiers aloud (offer it if the guest asks), (3) the guest explicitly said yes and gave first name, last name and their own e-mail address. Set terms_accepted=true only then. Dates are ISO (YYYY-MM-DD) inside the event window (Wednesday before to Monday after the event). Never invent personal data. / Legt eine Vormerkung an und schickt den Zahlungslink per Mail — Buchen komplett per Sprache.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "persons aged 15 or older",
                "type": "integer"
              },
              "arrival_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "category_key": {
                "description": "e.g. PREMIUM, BASIC, PREMIUM_XL",
                "type": "string"
              },
              "children": {
                "description": "children up to 14",
                "type": "integer"
              },
              "departure_date": {
                "description": "YYYY-MM-DD",
                "type": "string"
              },
              "email": {
                "description": "the guest's own e-mail address (the payment link goes there)",
                "type": "string"
              },
              "event_slug": {
                "description": "from list_events",
                "type": "string"
              },
              "first_name": {
                "type": "string"
              },
              "language": {
                "description": "guest language, ISO-2: de en nl es it fr cs pl hr sl",
                "type": "string"
              },
              "last_name": {
                "type": "string"
              },
              "phone": {
                "description": "optional",
                "type": "string"
              },
              "pitches": {
                "description": "number of identical pitches, default 1",
                "type": "integer"
              },
              "terms_accepted": {
                "description": "true only after the guest explicitly said yes to: total price + our terms and cancellation conditions as shown on schitterhof.at",
                "type": "boolean"
              },
              "voucher_code": {
                "description": "optional personal loyalty code",
                "type": "string"
              }
            },
            "required": ["adults", "arrival_date", "category_key", "departure_date", "email", "event_slug", "first_name", "last_name", "terms_accepted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
