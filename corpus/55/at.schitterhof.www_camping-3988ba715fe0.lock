      },
      "instructions": "Availability, guide prices and cancellation terms for the event campsite at the Red Bull Ring. Use create_reservation to reserve by voice: it e-mails the payment link; the booking becomes binding when the guest pays.",
      "tools": [
        {
          "name": "create_reservation",
          "title": "Reserve a pitch",
          "description": "Reserve a pitch for the guest and e-mail them the payment link — the whole booking can be done by voice. The spot is held (7 days; 2 days if the event is within 14 days, then instant payment methods only) and becomes binding only when the guest pays via the link (one tap, e.g. Apple Pay). ONLY call after: (1) get_availability showed the category is free, (2) you told the guest the total price and asked ONE short confirmation question, e.g. 'Our terms and cancellation conditions apply, as shown on schitterhof.at (the link comes by e-mail), and after paying you can cancel free of charge for 24 hours (not if arrival is within 3 days) — do you accept and shall I reserve?' — you do NOT have to read the cancellation tiers aloud (offer it if the guest asks), (3) the guest explicitly said yes and gave first name, last name and their own e-mail address. Set terms_accepted=true only then. Dates are ISO (YYYY-MM-DD) inside the event window (Wednesday before to Monday after the event). Never invent personal data. / Legt eine Vormerkung an und schickt den Zahlungslink per Mail — Buchen komplett per Sprache.",
          "inputSchema": {
            "properties": {
              "adults": {
                "description": "Number of persons aged 15 or older.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "arrival_date": {
                "description": "Arrival date, ISO format YYYY-MM-DD, e.g. 2027-06-23. Must lie inside the event window: from the Wednesday before the event; the stay must meet the minimum nights returned by list_events.",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "category_key": {
                "description": "Pitch category key exactly as returned by get_availability (e.g. BASIC, PREMIUM, PREMIUM_XL, PREMIUM_XXL, MINI or CHALET). Categories differ per event; do not invent keys.",
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Number of children aged up to and including 14 (free). Optional, default 0.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "departure_date": {
                "description": "Departure date, ISO format YYYY-MM-DD, after arrival_date. Must lie inside the event window: no later than the Monday after the event.",
                "format": "date",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$",
                "type": "string"
              },
              "email": {
                "description": "The guest's own e-mail address. The payment link is sent there, so confirm it with the guest; never use an address that did not come from the guest.",
                "format": "email",
                "maxLength": 200,
                "type": "string"
              },
              "event_slug": {
                "description": "Event identifier (slug) exactly as returned in the event_slug field of list_events, e.g. formel-1-camping-spielberg. Do not guess or invent it.",
                "type": "string"
              },
              "first_name": {
                "description": "Guest's first name, exactly as the guest said it. Never invent.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "language": {
                "default": "de",
                "description": "Language of the guest (ISO 639-1) for the e-mail they receive. Optional, default de.",
                "enum": ["de", "en", "nl", "es", "it", "fr", "cs", "pl", "hr", "sl"],
                "type": "string"
              },
              "last_name": {
                "description": "Guest's last name, exactly as the guest said it. Never invent.",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              },
              "phone": {
                "description": "Optional phone number of the guest, with country code if known.",
                "maxLength": 40,
                "type": "string"
              },
              "pitches": {
                "default": 1,
                "description": "Number of identical pitches of the same category to reserve. Optional, default 1.",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "terms_accepted": {
                "description": "Set to true ONLY after the guest explicitly said yes to the total price and to the terms and cancellation conditions as shown on schitterhof.at. Never set it without that explicit yes.",
                "type": "boolean"
              },
              "voucher_code": {
                "description": "Optional personal loyalty or voucher code the guest mentioned. Never invent a code.",
                "maxLength": 60,
                "type": "string"
              }
            },
            "required": ["adults", "arrival_date", "category_key", "departure_date", "email", "event_slug", "first_name", "last_name", "terms_accepted"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": true,
            "readOnlyHint": false
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:41ca678e64d8040b07e9dca7e538494d9ec78fd5a291ed1693082fe0d9ae6841"
        },
        {
          "name": "get_availability",
          "title": "Check availability and from-prices",
          "description": "Availability and from-prices per pitch category for one event: free, low, sold out or not yet bookable, including maximum vehicle length and persons. The number of adults included in each from-price is returned per category (included_adults) and differs by event and category. / Verfügbarkeit und Ab-Preise je Stellplatz-Kategorie (inklusive Erwachsene je Kategorie im Feld included_adults).",
          "inputSchema": {
            "properties": {
              "category_key": {
                "description": "Optional pitch category key to narrow the result to one category, as returned by get_availability, e.g. BASIC, PREMIUM, PREMIUM_XL, PREMIUM_XXL, MINI or CHALET. Omit to get all categories of the event.",
                "type": "string"
              },
              "event_slug": {
                "description": "Event identifier (slug) exactly as returned in the event_slug field of list_events, e.g. formel-1-camping-spielberg. Do not guess or invent it.",
                "type": "string"
              }
            },
            "required": ["event_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:6f01bf6991f2bc34d4ae069b581ebc32ab62a35ff88877ca416178bd3ff4e380"
        },
        {
          "name": "get_booking_link",
          "title": "Get booking link",
          "description": "The URL where the guest books this category on the website (alternative to create_reservation). / Der Link, unter dem der Gast selbst auf der Website bucht.",
          "inputSchema": {
            "properties": {
              "adults": {
                "default": 2,
                "description": "Optional: number of persons aged 15 or older, used to pre-fill the booking form. Default 2.",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "category_key": {
                "description": "Pitch category key exactly as returned by get_availability (e.g. BASIC, PREMIUM, PREMIUM_XL, PREMIUM_XXL, MINI or CHALET). Categories differ per event; do not invent keys.",
                "type": "string"
              },
              "children": {
                "default": 0,
                "description": "Optional: number of children up to 14, used to pre-fill the booking form. Default 0.",
                "maximum": 50,
                "minimum": 0,
                "type": "integer"
              },
              "event_slug": {
                "description": "Event identifier (slug) exactly as returned in the event_slug field of list_events, e.g. formel-1-camping-spielberg. Do not guess or invent it.",
                "type": "string"
              },
              "nights": {
                "description": "Optional: number of nights, used to pre-fill the booking form.",
                "maximum": 14,
                "minimum": 1,
                "type": "integer"
              }
            },
            "required": ["category_key", "event_slug"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true
          },
          "behavior": {
