        },
        {
          "name": "get_cancellation_policy",
          "title": "Show cancellation policy",
          "description": "Cancellation tiers, counted from the start of the event. / Storno-Staffel ab Eventbeginn.",
          "inputSchema": {
            "properties": {
              "event_slug": {
                "description": "Event identifier (slug) exactly as returned in the event_slug field of list_events, e.g. formel-1-camping-spielberg. Do not guess or invent it.",
                "type": "string"
              }
            },
            "required": ["event_slug"],
            "type": "object"
          },
          "annotations": {
