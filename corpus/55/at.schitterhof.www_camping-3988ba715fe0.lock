          "title": "Check availability and from-prices",
          "description": "Availability and from-prices per pitch category for one event: free, low, sold out or not yet bookable, including maximum vehicle length and persons. The number of adults included in each from-price is returned per category (included_adults) and differs by event and category. / Verfügbarkeit und Ab-Preise je Stellplatz-Kategorie (inklusive Erwachsene je Kategorie im Feld included_adults).",
          "inputSchema": {
            "properties": {
              "category_key": {
