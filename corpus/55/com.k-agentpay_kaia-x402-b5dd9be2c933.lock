{
  "lockfileVersion": 2,
  "subjects": {
    "com.k-agentpay/kaia-x402": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.k-agentpay.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "k-agentpay",
        "version": "0.3.1"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "incheon_airport_wait",
          "description": "Live Incheon Airport departure-hall waiting minutes and queue per hall (T1/T2) and the shortest hall. 10 free calls/day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "description": "answer language: en (default), ja or ko",
                "enum": ["en", "ja", "ko"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c613d213f270a764916a05d1d21562b9f406b6603b95f1ffcfb55296eea38efb"
        },
        {
          "name": "korea_festivals",
          "description": "Festivals and events in Korea from a date (YYYYMMDD). 10 free calls/day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "from": {
                "pattern": "^\\d{8}$",
                "type": "string"
              },
              "lang": {
                "default": "en",
                "description": "answer language: en (default), ja or ko",
                "enum": ["en", "ja", "ko"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:90f673bcab1ad898b4fcd1e8874eb14b3a08c1dfe7fc04c9acf781df33122218"
        },
        {
          "name": "kpop_new_concerts",
          "description": "Concerts in Korea newly registered or updated since a date (YYYYMMDD, default 7 days), optional artist. 10 free calls/day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "description": "answer language: en (default), ja or ko",
                "enum": ["en", "ja", "ko"],
                "type": "string"
              },
              "q": {
                "maxLength": 60,
                "type": "string"
              },
              "since": {
                "pattern": "^\\d{8}$",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:497cccc32e3cc15ff90a3fb5cfdb047efcd521203b84df209ff8a4da5bd63e06"
        },
        {
          "name": "kpop_search",
          "description": "Free. Search K-pop / pop concerts in Korea for the next 6 months by artist or title (any language). Returns concert ids.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "description": "answer language: en (default), ja or ko",
                "enum": ["en", "ja", "ko"],
                "type": "string"
              },
              "q": {
                "description": "artist or title",
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14a5f0c6df0c74c8e1b9e4b2a882a7a2f7436cebf9eacd27635efbb6268c3b76"
        },
        {
          "name": "request_korea_data",
          "description": "Free. Ask for Korea data these tools don't cover yet; the most requested is added first.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "useCase": {
                "maxLength": 300,
                "type": "string"
              },
              "want": {
                "maxLength": 500,
                "minLength": 3,
                "type": "string"
              }
            },
            "required": ["want"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:de021095e412f06a0f30d126e543d6583a9cfecc08ef3e36c523d49719dc23c4"
        },
        {
          "name": "seoul_now",
          "description": "Live crowd level, 12-hour crowd forecast and weather for a Seoul place (e.g. Myeongdong, Hongdae). 10 free calls/day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "description": "answer language: en (default), ja or ko",
                "enum": ["en", "ja", "ko"],
                "type": "string"
              },
              "place": {
                "maxLength": 60,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["place"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:f1e06ae7e6d4665124643239db53d10c8ab2725dbe7026701983c540f773b3b1"
        },
        {
          "name": "seoul_places",
          "description": "Free. The 121 Seoul places (with codes) accepted by seoul_now.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "description": "answer language: en (default), ja or ko",
                "enum": ["en", "ja", "ko"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0d121e502d6fbdcf84ca40d67695a95584e9e7e19f90bfb475bfdd57f84a46ba"
        },
        {
          "name": "seoul_subway_now",
          "description": "Next trains at a Seoul subway station right now (station in English, Japanese or Korean). 10 free calls/day.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "lang": {
                "default": "en",
                "description": "answer language: en (default), ja or ko",
                "enum": ["en", "ja", "ko"],
                "type": "string"
              },
              "station": {
                "maxLength": 40,
                "minLength": 1,
                "type": "string"
              }
            },
            "required": ["station"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0b9ac2903a6dc9310f41392384cebfcc4dd5ffdb8bb05f67cab9ec451fcd12a5"
        },
        {
          "name": "seoul_trip_pack",
          "description": "Seoul concert trip pack (tickets, venue, last trains, crowd, hotels/food nearby) — paid only: returns how to buy it.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "concert id from kpop_search",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:c9bea4acf20443bd77342fb59b0c3c2c021bb5ed1312aceeb3ad0135127216aa"
        }
      ],
      "digest": "sha256:e10b3077b9516ee9fc6121990cf18613791e33e267c4a47488382ad0d7a72b91"
    }
  }
}
