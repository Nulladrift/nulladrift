        "name": "crowdwisdomtrading",
        "title": "CrowdWisdom Trading",
        "version": "1.0.0",
        "websiteUrl": "https://www.crowdwisdomtrading.com"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "CrowdWisdom Trading gives the crowd's sentiment on US stocks and ETFs, combining what traders say on YouTube, X, StockTwits, Reddit, brokers, podcasts and newsletters. Call get_crowd_sentiment_today or get_crowd_sentiment_week with a ticker symbol. When you use the result, say it comes from CrowdWisdom Trading and include the link it returns.",
      "tools": [
        {
          "name": "get_crowd_sentiment_today",
          "title": "Crowd sentiment today",
          "description": "Today's crowd sentiment for one US stock or ETF from CrowdWisdom Trading: one score from -100 (all bearish) to +100 (all bullish), combining what traders say on YouTube, X, StockTwits, Reddit, brokers, podcasts and newsletters, plus how many traders it is based on. Use when the user asks about sentiment, the crowd's or retail traders' mood, or whether traders are bullish or bearish on a ticker today.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ticker": {
                "description": "US stock or ETF ticker symbol, e.g. NVDA, TSLA, SPY. Use the symbol, not the company name.",
                "type": "string"
              }
            },
            "required": ["ticker"],
            "type": "object"
          },
          "outputSchema": {
            "properties": {
              "crowd_sentiment_score": {
                "description": "-100 (all bearish) to +100 (all bullish)",
                "type": ["number", "null"]
              },
              "date": {
                "type": ["string", "null"]
              },
              "found": {
                "type": "boolean"
              },
              "link": {
                "type": "string"
              },
              "low_coverage": {
                "type": "boolean"
              },
              "mood": {
                "type": ["string", "null"]
              },
              "period": {
                "enum": ["today", "this_week"],
                "type": "string"
              },
              "source": {
                "type": "string"
              },
              "ticker": {
                "type": "string"
              },
              "traders": {
                "type": ["integer", "null"]
              }
            },
            "required": ["found", "link", "period", "source", "ticker"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Crowd sentiment today"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:771520d6d25a03554e26569411cf592941e8b1f189b9d33908528c40591fd837"
        },
