  "subjects": {
    "com.chikocorp/cuadre": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://cuadre.chikocorp.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "cuadre",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {
          "listChanged": true
        }
      },
      "tools": [
        {
          "name": "create_invoice",
          "description": "Crea una factura de cobro con su propia dirección de depósito (watch-only). Devuelve id, URL pública y la dirección a la que el cliente debe pagar.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "amount_usd": {
                "description": "Monto de la factura en dólares",
                "exclusiveMinimum": 0,
                "type": "number"
              },
              "chain": {
                "description": "Red de cobro (por defecto base)",
                "enum": ["base", "ethereum", "base-sepolia"],
                "type": "string"
              },
              "client_name": {
                "description": "Nombre del cliente que paga",
                "type": "string"
              },
              "days": {
                "description": "Días de validez",
                "maximum": 90,
                "minimum": 1,
                "type": "integer"
              },
              "description": {
                "description": "Concepto de la factura",
                "type": "string"
              },
              "token": {
                "description": "Token de cobro (por defecto USDC)",
                "enum": ["USDC", "ETH"],
                "type": "string"
              }
            },
            "required": ["amount_usd"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:a32459fc5efee24102f9d5d036d1a04a769dc857836423193e032447057c8261"
        },
        {
          "name": "get_invoice",
          "description": "Consulta el estado de una factura: waiting, partial, paid, over o expired, con monto recibido y valor en dólares al arribo.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "ID de la factura",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:415df8e990f4d26c803f64167393b097b309b62243e343d5527a9290102b2130"
        },
        {
          "name": "receipt_url",
          "description": "Devuelve la URL del recibo en PDF (con hash, red y valor fiat del arribo) de una factura pagada.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "properties": {
              "id": {
                "description": "ID de la factura",
                "type": "string"
              }
            },
            "required": ["id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "execution": {
            "taskSupport": "forbidden"
          },
          "digest": "sha256:5a2fefebcc763885d842df7ed3584f113d076cac530700a07f2a435d03cdc3b8"
        }
      ],
      "digest": "sha256:ef61790e60445b8bba1ed7d8b17651e313107770e0319c926df729195055e41c"
    }
  }
