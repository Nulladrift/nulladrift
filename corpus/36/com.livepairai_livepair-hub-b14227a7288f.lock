      "instructions": "Private AI media generation for agents: a community prompt library plus paid image AND video generation (t2i, i2i, t2v, i2v) and utility tools (mode=tool: upscale, background removal — image input, no prompt), including a private model line flagged private=true in list_models (i2i/i2v/tool source images must be AI-generated or owned). For trending, most-used, popular, or top prompts call trending_prompts — never keyword-search for those. Use search_prompts only for keyword lookups (style, subject, model); get_pack returns a themed bundle. get_prompt needs a card id from a prior list call. Generation loop: recommend_model if unsure which model → enhance_prompt to structure the idea → quote_price for the exact USDC cost → generate_image. Two ways to pay: (A) send your API key on the MCP request itself — `x-api-key: lp_…` or Authorization Bearer (create at https://livepairai.com/settings after /auth/sign-up) — and generate_image/chat_text execute inline, billing your prepaid credits; (B) without a key, generate_image returns the x402 endpoint your wallet settles (USDC on Base, no account). Poll get_job until done — it's free. For style control — references: upload images/clips to the user's library (POST /v1/agent/references) and they become searchable conditioning media. Recommended flow: list_reference_packs → pick a moodboard that matches intent → search_references(query, pack) → show candidates (each has a preview url) → pin the user's picks via referenceIds on generate_image (max 4). Shortcut: useReferences=true on generate_image auto-fills empty media slots with the prompt's top matches. Explicit image/image2/video inputs always win over retrieved refs. For LLM text (OpenAI-compatible completions on Claude/DeepSeek/GLM/GPT/Gemini/Grok/Kimi/Llama/MiniMax/Mistral/Qwen) call chat_text — same two rails. Resellers welcome: pass your payer wallet in generate_image or chat_text for automatic volume discounts (5% at $100+, 10% at $500+, 15% at $2000+ lifetime paid — x402 rail only) and resell output at your own pricing — see private-media://docs.",
      "tools": [
        {
          "name": "chat_text",
          "title": "Private LLM text completion (paid)",
          "description": "OpenAI-compatible chat completions — frontier and open-weight models (list under textModels in GET /v1/agent/models). PAID. If this MCP request carries your API key (x-api-key / Bearer lp_…) the completion executes right here and returns {choices, usage}; without a key the upstream answers 402 and this tool returns the x402 payment requirements. Price = estimated input tokens × input rate + max_tokens × output rate — set max_tokens tight to bill tight. Metering keeps token counts only.",
