        {
          "name": "generate_image",
          "title": "Generate an image or video (paid)",
          "description": "Render or transform an image or video with a catalog model (t2i, i2i, t2v, i2v, tool — tools like upscale/remove-background take image with no prompt; face-swap takes image + image2; motion models take image + video) — including the private model line flagged private=true in list_models. PAID. If this MCP request carries your API key (x-api-key / Authorization: Bearer lp_… — create at https://livepairai.com/settings after /auth/sign-up) the run executes right here and returns {status:'done',url} or a jobId to poll with get_job. Without a key the upstream answers 402 and this tool returns the x402 payment requirements (USDC on Base) for your wallet to settle.",
          "inputSchema": {
            "$schema": "http://json-schema.org/draft-07/schema#",
            "additionalProperties": false,
            "properties": {
              "duration": {
                "description": "Video length in seconds (video models)",
                "type": "number"
              },
              "extra": {
                "additionalProperties": {
                  "type": ["string", "number", "boolean"]
                },
                "description": "Model-specific settings keyed by the names in the model's `extraSettings` (list_models) — e.g. {quality:'720p'} for pixverse-motion, {targetGender:'female'} for face swaps",
                "type": "object"
              },
              "image": {
                "description": "Source image — required for i2i/i2v/tool models. Public http(s) URL or data:image URI. Use AI-generated or owned images only — never real-person photos without consent",
                "type": "string"
              },
              "image2": {
                "description": "Second image input — the face to place on face-swap models (image-face-swap, video-face-swap). Same URL/data:image rules; use only faces you have consent to use",
                "type": "string"
              },
              "modelId": {
                "description": "Model id from list_models (default: fastest t2i)",
                "type": "string"
              },
              "payer": {
                "description": "Your 0x… wallet — applies your volume-tier discount; must equal the wallet signing the payment (x402 rail)",
                "type": "string"
              },
              "prompt": {
                "description": "The prompt to render — call enhance_prompt first for best results. Not needed for mode=tool models (upscale, remove-bg) — the image is the request",
                "type": "string"
              },
              "referenceIds": {
                "description": "Pin media references from search_references (yours or pack refs, ≤4) — fills the model's open image/video inputs as style/content references",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "resolution": {
                "description": "Video resolution tier, or upscale tier for tool models",
                "type": "string"
              },
              "useReferences": {
                "description": "Auto-pick refs from your library by prompt semantics (owner namespace only) — prefer search_references + referenceIds so the user can approve candidates",
                "type": "boolean"
              },
              "video": {
                "description": "Source clip — required for motion-control and video-face-swap models (motion reference or swap target). https URL or data:video URI, ≤40MB. Priced on the clip's measured length",
                "type": "string"
              }
            },
            "type": "object"
