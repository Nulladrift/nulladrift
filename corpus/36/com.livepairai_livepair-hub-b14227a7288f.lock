                "type": "string"
              },
              "payer": {
                "description": "Your 0x… wallet — volume-tier discount (x402 rail)",
                "type": "string"
              },
              "prompt": {
                "description": "The text request — your user message",
                "type": "string"
              }
            },
            "required": ["prompt"],
            "type": "object"
          },
