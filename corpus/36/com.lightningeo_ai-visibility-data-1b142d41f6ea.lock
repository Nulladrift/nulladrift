          "title": "Comprar un estudio (pago x402)",
          "description": "PAGO por llamada en USDC (x402). Entrega el estudio: diseño del universo, hallazgos con su respaldo numérico y evidencia, métricas e índice de análisis, más links de descarga (7 días) al paquete completo con todas las tablas de análisis y las respuestas crudas de los modelos. Precios: banca-2026 USD 0.99, cadenas-hoteleras-cono-sur-2026 USD 0.99, cosmetica-2026 USD 0.99, dermatitis-atopica-2026 USD 0.99, farma-2026 USD 0.99, journey-gemelos-running-2026 USD 0.99, reumatologia-2026 USD 0.99, seguros-automotores-2026 USD 0.99, turismo-sierras-cordoba-2026 USD 0.99. Sin pago devuelve los requisitos x402; un cliente MCP con wallet x402 paga y reintenta solo. / Paid tool (x402): buy a full study.",
