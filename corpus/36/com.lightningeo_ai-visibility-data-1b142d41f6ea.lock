      "instructions": "Lightning vende estudios de visibilidad IA: cómo ChatGPT, Gemini y Claude responden a personas y agentes (qué marcas recomiendan, en qué orden, con qué argumentos y fuentes). Catálogo actual: Argentina y el Cono Sur, en español; estudios a medida para cualquier región e industria (delivery@lightningeo.com). Empezá por listar_estudios o buscar_estudios; ver_ficha es gratis y muestra metodología, diseño e índice. comprar_estudio se paga por llamada en USDC con x402 (requiere un cliente MCP con wallet x402). / Lightning sells AI-visibility studies: how ChatGPT, Gemini and Claude answer people and agents. Current catalog: Argentina and the Southern Cone (Spanish); custom studies for any region and industry. Free: list, search, study sheet, metrics. Paid: comprar_estudio via x402.",
