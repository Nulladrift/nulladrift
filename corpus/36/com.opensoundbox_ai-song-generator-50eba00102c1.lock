{
  "lockfileVersion": 2,
  "subjects": {
    "com.opensoundbox/ai-song-generator": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://opensoundbox.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-06-18"
      },
      "serverInfo": {
        "name": "opensoundbox",
        "title": "OpenSoundBox — AI song generator",
        "version": "08176852d8"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "OpenSoundBox sings a song with real vocals to YOUR lyrics. You write the lyrics — the server doesn't.\nSteps: 1) ask the person who the song is for and what it's about, plus a couple of details (name, occasion, hobbies); 2) write the lyrics following the rules in the create_song description; 3) show the lyrics to the person and adjust them to their feedback; 4) call create_song — it returns a link to the song page right away; 5) give the link to the person: it has two versions to listen to, pick the best one and download. Usually ready in 15–60 seconds; check with song_status.\nThe server does NOT wait for the song: \"queued\" doesn't mean \"ready\". Don't say the song is ready until song_status returns status=ready.\nIf something in the server itself is broken or unclear, use feedback_add.",
      "tools": [
        {
          "name": "create_song",
          "title": "Sing a song from finished lyrics",
          "description": "Queues a song with real vocals to YOUR finished lyrics and immediately returns a link to its page with two versions to choose from. The song itself is usually ready in 15–60 seconds.\nLANGUAGE: write the lyrics in the language the person speaks to you (or asks for) and pass its ISO code in `language`. Russian songs live on opensoundbox.ru, all other languages on opensoundbox.com — the server picks the site itself; just give the person the link it returns. 50 languages are supported; checked and sounding good: English, Russian, Spanish, German, French, Italian, Portuguese, Polish, Ukrainian, Chinese, Japanese, Korean, Turkish, Hindi (others may sound less clear).\nHOW TO WRITE THE LYRICS (the server sings them as is, without edits):\n- tag sections in square brackets on their own line: [Verse], [Chorus], optionally [Bridge], [Outro];\n- clear rhythm and rhyme, 6–10 syllables per line, natural conversational language;\n- put the person's name, the occasion and details in the lyrics; keep the chorus short, catchy and repeated;\n- length to match the song: up to 45 s — one 4-line verse, a 4-line chorus, then the chorus again; up to 60 s — one 4-line verse, a 4-line chorus, then the chorus again; up to 120 s — two 4-line verses, a 4-line chorus after each verse, an optional short bridge; up to 240 s — three 4-line verses, a 4-line chorus after each verse, a 2–4 line bridge; up to 300 s — four 4-line verses, a 4-line chorus after each verse (write every chorus repeat in full), a 4-line bridge — about 40 lines in total;\n- one language and one alphabet per song; don't mix alphabets in one line;\n- ORIGINAL lines only: lyrics quoting well-known songs or poems are rejected, and so are lyrics with profanity.\nThe sound is set by style, voice and an optional description (instruments, tempo, mood).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "duration_seconds": {
                "description": "song length in seconds, in steps of 15; default 60",
                "maximum": 300,
                "minimum": 45,
                "multipleOf": 15,
                "type": "integer"
              },
              "language": {
                "description": "ISO code of the lyrics language (ru, en, es, de…): the language you wrote the lyrics in. The server checks it against the lyrics and trusts the lyrics if they disagree. ru — the song lives on opensoundbox.ru, any other — on opensoundbox.com",
                "enum": ["ar", "az", "bg", "bn", "ca", "cs", "da", "de", "el", "en", "es", "fa", "fi", "fr", "he", "hi", "hr", "ht", "hu", "id", "is", "it", "ja", "ko", "la", "lt", "ms", "ne", "nl", "no", "pa", "pl", "pt", "ro", "ru", "sa", "sk", "sr", "sv", "sw", "ta", "te", "th", "tl", "tr", "uk", "ur", "vi", "yue", "zh"],
                "type": "string"
              },
              "lyrics": {
                "description": "finished song lyrics with [Verse]/[Chorus] section tags on their own lines",
                "maxLength": 3000,
                "minLength": 20,
                "type": "string"
              },
              "sound_description": {
                "description": "optional (required with style=custom): the sound in your own words, e.g. \"doom metal with church organ, slow, heavy\"",
                "maxLength": 200,
                "type": "string"
              },
              "style": {
                "description": "music style preset (pop, rock, hiphop, rnb, country, edm, poppunk, indie, lofi, kids, ballad, chanson, lullaby, folk, jazz); custom — your own style from sound_description (no preset is mixed in). Default auto — the server picks a style from the lyrics",
                "enum": ["auto", "pop", "rock", "hiphop", "rnb", "country", "edm", "poppunk", "indie", "lofi", "kids", "ballad", "chanson", "lullaby", "folk", "jazz", "custom"],
                "type": "string"
              },
              "title": {
                "description": "optional: the song title for its page",
                "maxLength": 80,
                "type": "string"
              },
              "voice": {
                "description": "voice; default auto — picked from the lyrics",
                "enum": ["auto", "male", "female", "duet"],
                "type": "string"
              }
            },
            "required": ["language", "lyrics"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Sing a song from finished lyrics"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:38d03c6271334803a27e22254587453fcab8941ab64ad040126e43c84ac1d5e6"
        },
        {
          "name": "feedback_add",
          "title": "Report a problem or a needed improvement in this server",
          "description": "FEEDBACK ABOUT THIS SERVER ITSELF, not about a song. Call it when a tool behaved differently from its description, when a parameter or response field was missing, or when a refusal came without a clear reason. Be specific: the tool, what you called, what you expected, what you got — a human reads it.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "body": {
                "description": "what you called, with which arguments, what you expected, what came back",
                "maxLength": 2000,
                "type": "string"
              },
              "kind": {
                "description": "problem — works wrong; improvement — something is missing; question — something is unclear",
                "enum": ["problem", "improvement", "question"],
                "type": "string"
              },
              "title": {
                "description": "the gist in one sentence, at least 10 characters",
                "maxLength": 200,
                "minLength": 10,
                "type": "string"
              },
              "tool": {
                "description": "tool name; empty — about the whole server",
                "type": "string"
              }
            },
            "required": ["title"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": false,
            "openWorldHint": false,
            "readOnlyHint": false,
            "title": "Report a problem or a needed improvement in this server"
          },
          "behavior": {
            "destructive": false,
            "idempotent": false,
            "openWorld": false,
            "readOnly": false
          },
          "digest": "sha256:0d26368b3cb9dd3bcdd785a4e4d9919f411e7bc1277a20c063fa2e918c76be3e"
        },
        {
          "name": "song_status",
          "title": "Is the song ready",
          "description": "Song status by song_id from create_song: queued — waiting in line, singing — being sung, ready — the versions are done (audio links included), failed — it didn't work (reason in message; failed songs aren't counted). Call at most once every 10 seconds. The page link works before the song is ready too.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "song_id": {
                "description": "song_id from the create_song response",
                "pattern": "^[a-f0-9]{20}$",
                "type": "string"
              }
            },
            "required": ["song_id"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Is the song ready"
          },
          "behavior": {
            "destructive": false,
            "idempotent": true,
            "openWorld": false,
            "readOnly": true
          },
          "digest": "sha256:0294cea0a769615013b8efc3b113b4ab62f9cd80d0474fbaf94215278100164d"
        }
      ],
      "digest": "sha256:13cbd24c57174ab3eca44b6398525b8ed5fb7c6ff1cd1a398d279cfe9e0edaf9"
    }
  }
}
