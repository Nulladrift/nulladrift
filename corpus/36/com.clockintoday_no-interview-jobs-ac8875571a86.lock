        },
        {
          "name": "get_platform",
          "title": "Get one platform's requirements",
          "description": "Full requirements and pay terms for one platform (e.g. DoorDash, Instacart, BioLife Plasma), with the source pages each value came from.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "name": {
                "description": "Platform name or slug, e.g. 'DoorDash' or 'uber-eats'",
                "type": "string"
              }
            },
            "required": ["name"],
            "type": "object"
          },
          "annotations": {
            "destructiveHint": false,
            "idempotentHint": true,
            "openWorldHint": false,
            "readOnlyHint": true,
            "title": "Get one platform's requirements"
          },
