          },
          "digest": "sha256:386cf2533879acd0a589f6cd47b698fae2a47ef2d78ed10de9e1f4558e75f94f"
        },
        {
          "name": "search_platforms",
          "title": "Search no-interview jobs and gig apps",
          "description": "Find US jobs and gig apps a person can start without a job interview, filtered by category, background check, vehicle, payout speed, minimum age and more. Returns requirements, pay terms and a link to the full sourced listing on clockintoday.com.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "background_check": {
                "description": "Whether the platform runs a criminal background check",
                "enum": ["yes", "no", "varies"],
                "type": "string"
              },
              "category": {
                "description": "drive = driving & delivery, shift = shift work, task = tasks & labor, care = pets & care, online = online & remote, cash = surveys & rewards, studies = plasma & medical studies",
                "enum": ["drive", "shift", "task", "care", "online", "cash", "studies"],
                "type": "string"
              },
              "limit": {
                "description": "Maximum number of results (default 25)",
                "type": "integer"
              },
              "max_age": {
                "description": "The person's age: only platforms whose published minimum age is at or below it",
                "type": "integer"
              },
              "payout": {
                "description": "'fast' for instant, every-3-hours or next-day pay, or an exact label like 'Instant' or 'Weekly'",
                "type": "string"
              },
              "q": {
                "description": "Free-text search across platform name and summary",
                "type": "string"
              },
              "vehicle": {
                "description": "What the person has: none = only platforms needing no vehicle; bike = none or bike; car = anything but truck-only; truck = all",
                "enum": ["none", "bike", "car", "truck"],
                "type": "string"
              },
              "worker_type": {
                "description": "e.g. Contractor, W-2, Participant",
                "type": "string"
              }
            },
            "type": "object"
          },
          "annotations": {
