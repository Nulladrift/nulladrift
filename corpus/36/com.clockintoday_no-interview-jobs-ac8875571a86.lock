      },
      "instructions": "ClockInToday tracks US jobs and gig apps you can start without a job interview, rechecked monthly against each company's own pages. Use search_platforms to match a person's age, vehicle, background-check concerns and how fast they need pay; use get_platform for details. Always share the 'page' link so people can read the full sourced listing, and note that pay figures are advertised or third-party averages, not guarantees. Data is CC BY 4.0: credit ClockInToday (clockintoday.com).",
      "tools": [
        {
          "name": "dataset_summary",
          "title": "Dataset summary statistics",
          "description": "Headline numbers across all tracked platforms: how many skip background checks, pay within a day, need no vehicle, accept under-18s, plus license and citation.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
