{
  "lockfileVersion": 2,
  "subjects": {
    "app.askposeidon/poseidon": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://api.askposeidon.app/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2025-11-25"
      },
      "serverInfo": {
        "name": "poseidon-ads",
        "version": "1.20.5"
      },
      "capabilities": {
        "tools": {
          "listChanged": false
        }
      },
      "instructions": "Poseidon: winning e-commerce ads from Meta's Ad Library (EU and UK), measured facts only, read daily. Use it for winning ads, what's working in a niche or country, hooks and scripts, brands' A/B tests and format statistics. Typical flow: search_winners (with has_script=true for hooks), then get_ad on the best results for the full script by section. Use filters (free) for valid niche and country values. Every number carries the day it was read; a missing field means Poseidon doesn't have it: say so, never fill it in. Reach is Meta's EU total; countries are shares of Meta's breakdown. Meta publishes no spend for commercial ads.",
      "tools": [
        {
          "name": "account",
          "description": "Free. Credits left (they never expire), prices per call, the last calls and credit movements. Use it when the user asks about credits, balance, usage or cost.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:8087aa75b1c97962777da811054ded2b64ef323a3f907e5193ddfde76a532ae7"
        },
        {
          "name": "brand_changes",
          "description": "Watch a competitor: what changed for one brand since a date. Use it for 'what's new from <brand>', 'did they launch or stop ads', 'what is scaling for them this week'. Returns, each with its date and source: ads started (Meta's start date), ads stopped (Meta's stop date), ads whose version count rose, new ads relaunching a media the brand already used, and the ads whose EU reach grew most between two readings. Get the page_id with find_brand. Costs 5 credits (0 if nothing changed).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "page_id": {
                "description": "Meta page id (from find_brand)",
                "type": "string"
              },
              "since": {
                "description": "default: 7 days ago",
                "format": "date",
                "type": "string"
              }
            },
            "required": ["page_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:21fa024b802489e3761fc1f55551ef40ac95894f8d082c7437bc569ca144de17"
        },
        {
          "name": "filters",
          "description": "Free. The values Poseidon accepts, with live counts: niches, Meta formats, countries with reach data, age bands, sort orders, the winner rule and the coverage. Call it when unsure of a niche name or a country code, or when the user asks what Poseidon covers.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:57e2fc4a3f7466e3794949ce2f979a94b3bb9ec36573513dc0acecc32dc3da9c"
        },
        {
          "name": "find_brand",
          "description": "Find a competitor by name or shop domain, before get_brand or brand_changes. Use it whenever the user names a brand or store ('show me Epycure's ads', 'what is Leaf running', 'gymshark.com'). Fuzzy: returns up to 10 confirmed e-commerce brands, best first, each with what matched (page name or shop domain), its page_id, shop link, and how many ads, winners and active ads Poseidon holds. No search of people's names: a page named after a person is found by its shop domain only. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "q": {
                "description": "brand name or shop domain, e.g. 'epycure' or 'leaf-cosmetics.com'",
                "type": "string"
              }
            },
            "required": ["q"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:6e44a33135fc3dd42ac9382a2e98af58e0cb342e3e7fea40a77c1294be7c6ad5"
        },
        {
          "name": "get_ad",
          "description": "One ad in full, by its Meta Ad Library id. Use it to read an ad's whole script, see how it is built, or check one ad the user names ('show me the script of ad 862034243491035', 'break down this ad'). Returns the verbatim script sentence by sentence, each labelled Hook, Problem, Agitation, Mechanism, Proof, Product, Offer, CTA…, the ad text and title, format, dates, days live, versions, EU reach history (Meta's total per read day), country and age x gender shares of Meta's breakdown, links to the Ad Library and the shop, and the source of every field. Script sections (hook, problem, CTA…) are served only when every sentence has an English version or the script is in English; otherwise script.sections_status is 'translation_pending' and the transcript comes without section labels (being translated nightly); 'withheld' = this ad's sections can't be served (older breakdown without text). Costs 2 credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "ad_id": {
                "description": "the Ad Library id: the digits after ?id= in facebook.com/ads/library/?id=…",
                "type": "string"
              },
              "formula": {
                "description": "rank formula: v5 and v4 = rank-v4 (default), v3 until 20/11/2026",
                "enum": ["v5", "v4", "v3"],
                "type": "string"
              }
            },
            "required": ["ad_id"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:64e14a484d57404110d7084285aca19ae039b11f88eed68fd978dfa6e6612a39"
        },
        {
          "name": "get_brand",
          "description": "What one brand or shop is running on Meta. Use it when the user names a store or brand ('what is epycure.com running', 'how long do Leaf Co's ads last'). Give the shop domain (e.g. epycure.com) or the Meta page id. Returns the shop (link, platform), the brand's ads in Poseidon by format, how many are winners, the median days live (when 30+ ads), its 10 longest-running ads with reach, links and verbatim hooks, and its A/B tests with a measured outcome. Poseidon reads up to 30 ads per brand page. Costs 5 credits.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "domain": {
                "description": "the shop's website, e.g. epycure.com",
                "type": "string"
              },
              "page_id": {
                "description": "Meta page id, if known",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:3fb69da642557a7c51c43784a3e2d66e2ab7a7988557c02ba09fc2064e0abef7"
        },
        {
          "name": "get_facts",
          "description": "Weighted facts about what wins, each with its sample and its odds: e.g. 'in weight loss, EU, same brand and same launch day, video reached more people than image in 28 of 40 brands (70%, 95% interval 55-82%, p = 0.017)'. Use it when the user asks what is proven, what works better, video or image, or wants evidence rather than examples. Only facts that pass today are returned (30+ brands, p < 0.05, interval excluding 50%), with n, share, interval, p, method, read dates, caveats (always repeat them with the fact) and the commit of the code that computed them. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "niche": {
                "description": "e.g. weight loss",
                "type": "string"
              },
              "region": {
                "enum": ["EU", "US"],
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:954576d0f05b924e392274a2e2ba6e1826e733602540fd1aef0da3024a650083"
        },
        {
          "name": "get_weights",
          "description": "Medians and statistics across many ads (not single ads): the median days live, median EU reach or median versions of a format, niche, country or target, with the sample size. Use it FIRST for any question about a median, an average, a typical value or a comparison of formats: 'median days live of video ads in weight loss', 'do videos last longer than images', 'which format reaches more'. Each row: dimension (format, niche, country, target…), value (e.g. VIDEO), signal (days_live, eu_reach, versions, active, share_in_country, relaunches, test_survivor), sample size, median, top 10%, and when it was computed. Rows under 30 ads are never shown. A row may carry a 'caveat' (today on days_live, active and test_survivor: ads that died young are missing, so survival is overstated): always repeat it with the number. For formats, format_pair_weight adds weights from paired experiments (same brand, two formats launched the same week): reach ratio A vs B with a 95% interval over brands, shown from 30 brands, a winner only when the interval excludes x1; quote its note (a strong hint, not a controlled test). Costs 10 credits (0 if nothing is returned).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "type": "string"
              },
              "dimension": {
                "description": "format, niche, country, target",
                "type": "string"
              },
              "formula": {
                "description": "weight formula: v5 (default, full set on the niche-page cohort) or v4 / v3 (kept until 20/11/2026)",
                "enum": ["v5", "v4", "v3"],
                "type": "string"
              },
              "limit": {
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "type": "string"
              },
              "region": {
                "description": "EU or 'not measured'",
                "type": "string"
              },
              "signal": {
                "description": "days_live, eu_reach, versions, active, share_in_country, relaunches, test_survivor",
                "type": "string"
              },
              "value": {
                "description": "e.g. VIDEO (for format), FR (for country)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:92c3eb1e5be210166c1bc7df5822dcae2434d7814e2d569575237597a0b16ccb"
        },
        {
          "name": "search_experiments",
          "description": "Brands' own A/B tests and which version won. Use it when the user asks what brands tested, which video, text or hook won, or for 'A/B test' or 'split test' results ('did shapewear brands in France test different videos with the same text, and which won?'). A test = ads of one brand launched within 14 days that share one element and differ in another: same video with different texts, same text with different videos (most tests), or same script with a different hook (rare). Each version: its ads with links, launch day, running or stopped, days live, EU reach, and the text that differs, whether the test is clean (only the tested element differs; this compares ad fields, not the video content: right 35 of 40 times in a hand check, so say it), plus a verdict: the version that reached most (with the ratio) when the gap is 2x or more; when the only signal is that one version stopped first, it says so and that this is not a confirmed outcome yet (repeat that). Only tests with a measured outcome are served (a version still running while another stopped, or 2x+ the reach). A summary covers all matching tests per kind (decided by survival, by reach, median reach ratio), shown only from 30 tests of a kind. Costs 5 credits (0 if nothing matches).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "country": {
                "description": "2-letter code: tests with an ad reaching that country",
                "type": "string"
              },
              "format": {
                "description": "Meta's display format of the ads tested, e.g. VIDEO, IMAGE",
                "type": "string"
              },
              "kind": {
                "enum": ["same_video_other_text", "same_text_other_video", "same_body_other_hook"],
                "type": "string"
              },
              "limit": {
                "description": "default 10",
                "maximum": 20,
                "minimum": 1,
                "type": "integer"
              },
              "niche": {
                "description": "as in search_winners (see filters)",
                "type": "string"
              },
              "offset": {
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "with_outcome": {
                "description": "always true: only tests with a measured outcome are served",
                "type": "boolean"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:5dc6333eb0b58ed1b102a4b075e8076158e778c7dd035c1b053e20ba1d8d0c80"
        },
        {
          "name": "search_winners",
          "description": "Find winning e-commerce ads (Facebook / Instagram, Meta Ad Library) and show what's working. Use it FIRST when the user asks for winning ads, what's working or scaling in a niche or a country, the best hooks, the longest-running ads, or ads that reach a given age and gender. Examples: 'winning ads for weight loss in France', 'which hooks work for menopause in Germany' (has_script=true: each result carries its verbatim hook), 'longest-running video ads in Spain for bloating', 'ads launched last month with 1M+ EU reach' (started_after, min_eu_reach), 'ads that mostly reach women 45-54 in Germany' (age, gender, min_segment_share). Winner = live 21+ days (change with min_days_live). Each result: Ad Library link, shop link, format, days live, still running or stopped, versions, EU reach (Meta's total, with its read date), the country's or segment's share of Meta's breakdown, and the verbatim hook when the script is transcribed and fully in English or translated (sections_status 'served'; 'translation_pending' = no hook yet). Then call get_ad on the best ones for the full script. For medians or typical values across many ads, use get_weights instead. Values for niche, country and format: call filters (free). Coverage: e-commerce ads from Meta's Ad Library delivered in the EU and UK, read daily, with Meta's EU reach. Not covered: spend and impressions (Meta doesn't publish them for commercial ads), TikTok/Google ads. Creative types (UGC, VSL, demo…) and hook types are AI labels on part of the ads, served with their measured accuracy. Costs 5 credits (0 if nothing matches).",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "active": {
                "description": "true = still running at the last read, false = stopped",
                "type": "boolean"
              },
              "age": {
                "description": "an age band of Meta's breakdown (with gender for a segment)",
                "enum": ["13-17", "18-24", "25-34", "35-44", "45-54", "55-64", "65+"],
                "type": "string"
              },
              "country": {
                "description": "2-letter code where the ad reached people, e.g. FR, DE, IT, ES, BE",
                "type": "string"
              },
              "creative_type": {
                "description": "AI label of the creative: in validation, not served for now (Meta's format is in `format`)",
                "type": "string"
              },
              "format": {
                "description": "Meta's display format: VIDEO, IMAGE, DCO (dynamic creative), DPA, CAROUSEL. For UGC, VSL, demo… use creative_type (an AI label with its measured accuracy, on part of the ads), not format.",
                "type": "string"
              },
              "gender": {
                "enum": ["female", "male"],
                "type": "string"
              },
              "has_script": {
                "description": "true = only ads whose script is transcribed and cut into sections (use it for hooks and scripts)",
                "type": "boolean"
              },
              "hook_type": {
                "description": "AI label of the hook: in validation, not served for now (the verbatim hook text is in every result)",
                "type": "string"
              },
              "limit": {
                "description": "default 20",
                "maximum": 50,
                "minimum": 1,
                "type": "integer"
              },
              "max_days_live": {
                "minimum": 0,
                "type": "integer"
              },
              "min_country_share": {
                "description": "needs country: 0.5 = the country holds at least half of the ad's breakdown (its main country)",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "min_days_live": {
                "description": "default 21 (the winner rule); 0 = all ads",
                "minimum": 0,
                "type": "integer"
              },
              "min_eu_reach": {
                "description": "people reached in the EU (Meta's total)",
                "minimum": 0,
                "type": "integer"
              },
              "min_segment_share": {
                "description": "needs age or gender: minimum share of the ad's breakdown in that segment, e.g. 0.3",
                "maximum": 1,
                "minimum": 0,
                "type": "number"
              },
              "min_versions": {
                "description": "Meta's count of ads sharing the creative",
                "minimum": 0,
                "type": "integer"
              },
              "niche": {
                "description": "e.g. 'weight loss', 'menopause', 'bloating', 'cellulite', 'gut health' (exact list: filters). It is the niche of the search that found the brand.",
                "type": "string"
              },
              "offset": {
                "maximum": 1000,
                "minimum": 0,
                "type": "integer"
              },
              "region": {
                "description": "EU = ads with Meta's EU data; US data opens after its audit",
                "enum": ["EU"],
                "type": "string"
              },
              "sort": {
                "description": "default: eu_reach when a country, age or gender is given, else days_live",
                "enum": ["country_share", "days_live", "eu_reach", "newest", "segment_share", "versions"],
                "type": "string"
              },
              "started_after": {
                "description": "launched on or after, e.g. 2026-10-01",
                "format": "date",
                "type": "string"
              },
              "started_before": {
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:308daa702aa571dc2c68b43e2e0676077cfa409a8eb6fe98b70e8cc8ca7a00b8"
        },
        {
          "name": "watchlist",
          "description": "The brands saved on your key's watchlist (page_id, name, shop, date added). Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:7f83c9a856c918ca53ed8716da9753e5b811588d3d78542d6f9afd6fe325d678"
        },
        {
          "name": "watchlist_changes",
          "description": "What changed across ALL your watched competitors since a date, in one call. Use it for 'what's new from my competitors', 'weekly competitor report'. Same content, dates and sources as brand_changes, grouped by brand; brands with no change are listed apart. Also says how many watched ads have at least two reach readings since the date (reach growth can only be shown for those). Costs 5 credits per brand that changed; 0 if none did.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "since": {
                "description": "default: 7 days ago",
                "format": "date",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:4eb5920da1becd45440ae8c92ef2f0e3d453c17caec8c58e765eb0af7b9882e0"
        },
        {
          "name": "watchlist_edit",
          "description": "Save competitors to watch, on your key: add or remove brands by page_id (get it with find_brand), up to 25. Use it when the user says 'watch these brands', 'add X to my competitors', 'stop watching Y'. Only confirmed e-commerce brands can be added. Returns the watchlist. Free.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "add": {
                "description": "page ids to add",
                "items": {
                  "type": "string"
                },
                "type": "array"
              },
              "remove": {
                "description": "page ids to remove",
                "items": {
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:0f2699145d75e3bef5a5118267bd93fc68e039d60feb39af0874778aa791cca4"
        },
        {
          "name": "watchlist_webhook",
          "description": "Get pushes instead of polling: set an https URL on your key and Poseidon POSTs the new changes of your watched brands (new ads, stopped ads, more versions, reused media, reach growth) about every hour, signed with HMAC-SHA256 (header Poseidon-Signature: t=…,v1=…; the secret is returned once when the URL is set), retried with backoff for about 15 hours. Each push costs what watchlist_changes costs (5 credits per brand with something new). Without arguments: shows the webhook and its recent deliveries. Free to set.",
          "inputSchema": {
            "additionalProperties": false,
            "properties": {
              "remove": {
                "description": "true removes the webhook",
                "type": "boolean"
              },
              "test": {
                "description": "true sends a test push within a minute",
                "type": "boolean"
              },
              "url": {
                "description": "https URL that receives the pushes (public address)",
                "type": "string"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:821b8158c7571d03670c18a223d9c5153cd7b3ffbb858598ab47d4f1002432a3"
        }
      ],
      "digest": "sha256:744e57bcfa110e0b6b896ebdc947a7e97a3e34094a08f3467291845a6de661b4"
    }
  }
}
