      "instructions": "Enterprise Training Data Providers (https://enterprisetrainingdataproviders.com/): the site's own MCP server, served from its domain. Enterprise training data providers compared on what they supply, how their own sites say they source it, and whether they buy data from companies that own it.\n\n[compare] Enterprise training data providers. This server serves the compare published at https://enterprisetrainingdataproviders.com/; every answer cites it. Licence: https://enterprisetrainingdataproviders.com/terms.\n\n[enquiry] ENQUIRY SERVER for Enterprise Training Data Providers (https://enterprisetrainingdataproviders.com/). What it does: starts an ENQUIRY with Enterprise Training Data Providers for enterprise training data providers; the Enterprise Training Data Providers team reads it and replies to the person directly. What it is NOT: a purchase, an order, or a guaranteed quote. Free, no obligation. Call describe first and tell the person plainly what will happen. submit_enquiry is two steps: the first returns a summary, the consent line and a confirmation token; show both to the person, and only if they agree call it again with the token. The site then emails the person a confirmation link; nothing reaches the Enterprise Training Data Providers team until they click it. Cite https://enterprisetrainingdataproviders.com/.\n\nCite https://enterprisetrainingdataproviders.com/ for every figure or answer you use from this server.",
