        {
          "name": "submit_enquiry",
          "title": "Submit an ENQUIRY to Enterprise Training Data Providers (two steps; not a purchase)",
          "description": "Submits an enquiry to Enterprise Training Data Providers: NOT a purchase, NOT a guaranteed quote. Step 1: call with the answers (keyed by field key from enquiry_fields) and consent=true; it validates and returns a summary, the consent line and a confirmation token; show the person the summary and the consent line. Step 2: only if the person agrees, call again with the same answers, consent=true and the confirmation token; the enquiry is then submitted, and the person receives an email with a link they must click before the Enterprise Training Data Providers team sees it. Consent means the person has read and agreed to: \"I agree that the desk behind this provider board may email me about my data request.\"",
