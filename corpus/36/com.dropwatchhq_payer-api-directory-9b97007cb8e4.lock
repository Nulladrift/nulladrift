{
  "lockfileVersion": 2,
  "subjects": {
    "com.dropwatchhq/payer-api-directory": {
      "kind": "mcp-server",
      "source": {
        "client": "manual",
        "file": "registry.modelcontextprotocol.io"
      },
      "transport": {
        "type": "http",
        "url": "https://clearinghouse.dropwatchhq.com/mcp"
      },
      "protocol": {
        "era": "legacy",
        "version": "2024-11-05"
      },
      "serverInfo": {
        "name": "payer-api-directory",
        "version": "1.0.0"
      },
      "capabilities": {
        "tools": {}
      },
      "tools": [
        {
          "name": "get_clearinghouse",
          "description": "Full record for one vendor: what it does, dated+confidence-tagged pricing signals, access requirements, and small-practice fit. confidence is one of published/reported/none.",
          "inputSchema": {
            "properties": {
              "slug": {
                "description": "Vendor slug, e.g. 'availity', 'stedi', 'office-ally'.",
                "type": "string"
              }
            },
            "required": ["slug"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:44748098a189d1e375ce39abef2ccdf0ef921f675c8403e9b02c519db740c2a6"
        },
        {
          "name": "list_clearinghouses",
          "description": "List all medical clearinghouse / payer-API vendors in the directory with their access model, API style, supported X12 functions, and whether pricing is public.",
          "inputSchema": {
            "properties": {},
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:81959fcacf086ecdecef5174354cbb07585afadc873637b03cb0e57ec038dfe9"
        },
        {
          "name": "recommend_clearinghouse",
          "description": "Transparently rank vendors for a practice. Returns scored shortlist with the reasoning for each. Inputs: functions needed, dev-integration flag, budget-sensitive flag.",
          "inputSchema": {
            "properties": {
              "budgetSensitive": {
                "type": "boolean"
              },
              "devIntegration": {
                "type": "boolean"
              },
              "functions": {
                "items": {
                  "enum": ["eligibility", "claims", "era", "status", "priorauth"],
                  "type": "string"
                },
                "type": "array"
              }
            },
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:14b0d0fb3597cd5de1c814d221569fdbd4635ce6089be4241fe4a0f1d1afdad1"
        },
        {
          "name": "vendors_by_function",
          "description": "Which vendors support a given X12 function. function slug one of: eligibility, claims, era, claim-status, prior-auth.",
          "inputSchema": {
            "properties": {
              "function": {
                "type": "string"
              }
            },
            "required": ["function"],
            "type": "object"
          },
          "behavior": {
            "destructive": true,
            "idempotent": false,
            "openWorld": true,
            "readOnly": false
          },
          "digest": "sha256:515d4024f372a1f421197b821d8882dc7700386e259fcb071ba42ed69bcba934"
        }
      ],
      "digest": "sha256:5a2732e80dbf156218df4684acc006238aade325ecd4787e52adaaecf46c63eb"
    }
  }
}
